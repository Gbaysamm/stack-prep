# UTME 1993 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1993.yaml. Answers match that file.
format_version: 1
exam_year: 1993
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'Change 71, base ten, to base eight. To leave base ten, we divide by the new base again and again, on the division ladder.'
        write: 'Change $71_{10}$ to base 8.'
      - say: 'Set up the ladder, with the base, 8, on the left of the bar, and 71 on the right.'
        write: 'Solution'
        diagram: {id: L, kind: ladder, divisor: 8, number: 71, 'on': 'the ladder'}
      - say: '8 times 8 is 64, and 71 minus 64 is 7. So 71 divided by 8 is 8, remainder 7, which means eight bundles of eight, and 7 left over.'
        diagram_do:
          - {id: L, op: step, 'on': 'remainder 7'}
        doodle: {name: 'custom:1993_q01_a', id: sticks, caption: '71 = 8 eights and 7 left', 'on': 'eight bundles'}
      - say: 'Bring the quotient, 8, down and divide again. 8 divided by 8 is 1, remainder 0.'
        diagram_do:
          - {id: L, op: step, 'on': 'remainder 0'}
      - say: '1 divided by 8 is 0, remainder 1. The quotient is now 0, so we stop.'
        diagram_do:
          - {id: L, op: step, 'on': 'remainder 1'}
      - say: 'Read the remainders from the bottom up, so one, zero, seven. The last remainder is the biggest place value, so it is written first.'
        diagram_do:
          - {id: L, op: read, 'on': 'bottom up'}
        write: '$71_{10} = 107_{8}$'
        point:
          - {line: 5, kind: highlight, at: '1078', to: {diagram: L, part: result}}
      - section: 'Check'
        say: 'Check by expanding back. Write the index numbers over one-zero-seven, which are two, one, nought. We multiply each digit by eight to the power of its index.'
        write: '$\overset{2}{1}\,\overset{1}{0}\,\overset{0}{7}_{8} = 1 \times 8^{2} + 0 \times 8^{1} + 7 \times 8^{0}$'
      - say: 'Eight squared is 64, eight to the power one is 8, and eight to the power nought is 1.'
        write: '$= 1 \times 64 + 0 \times 8 + 7 \times 1$'
      - say: '64 plus 0 plus 7 is 71, the number we started with.'
        write: '$= 64 + 0 + 7 = 71\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore 71 base ten is one-zero-seven base eight, which is option A.'
        write: '$\therefore 71_{10} = 107_{8}$'
        answer: true
    traps:
      B: 'You went for one-zero-six base eight. That is 64 plus 6, which is 70, one short. The first remainder is 7, because 71 minus 64 is 7.'
      C: 'You went for seven-one base eight. That only changes the label. Seven-one base eight is 7 eights plus 1, which is 57, not 71. Divide by 8 on the ladder instead.'
      D: 'You went for one-seven base eight. You dropped the remainder 0 in the middle. Every remainder is a digit, and one-seven base eight is only 15.'
  2:
    moments:
      - section: 'The question'
        say: 'Dividing by 0.05 makes a number bigger, much bigger. Two options keep the right digits but the wrong size. Let''s get both the value and the rounding right.'
        write: 'Evaluate $\dfrac{3524}{0.05}$ correct to 3 s.f.'
      - say: 'We clear the decimal in the divisor, divide, and round only at the end.'
        write: 'Solution'
      - section: 'Clear the decimal'
        say: 'Multiply the numerator and the denominator by 100. The value does not change. 3,524 times 100 is 352,400, and 0.05 times 100 is 5.'
        write: '$\dfrac{3524}{0.05} = \dfrac{3524 \times 100}{0.05 \times 100} = \dfrac{352400}{5}$'
      - section: 'Divide'
        say: 'Short division by 5. 5 into 35 goes 7. 5 into 2 goes 0, remainder 2. 5 into 24 goes 4, remainder 4. 5 into 40 goes 8. Then 5 into 0 goes 0.'
        write: '$352400 \div 5 = 70480$'
      - section: 'Round to 3 s.f.'
        say: 'Significant figures start at the first digit that is not zero, so 7, 0, 4. Cut after the 4. The next digit is 8, so add 1, and the 4 becomes 5.'
        write: '$704|80 \to 705$'
      - say: 'The digits after the cut become zeros, so the number keeps its size. 70,480 becomes 70,500.'
        write: '$\therefore 70480 \approx 70500$ (3 s.f.)'
      - section: 'Check'
        say: 'Check another way. 0.05 is 1 over 20, so picture ₦1 as twenty 5-kobo coins. So dividing by 0.05 is multiplying by 20, and 3,524 times 20 is 70,480.'
        doodle: {name: 'custom:1993_q02_a', id: coins, caption: '₦1 is twenty 5-kobo coins'}
        doodle_do: [{id: coins, op: label, part: total, text: '70,480 coins'}]
        write: 'Check: $3524 \times 20 = 70480 \ \checkmark$'
        point:
          - {line: 6, kind: highlight, at: '70480', to: {doodle: coins, part: total}}
      - section: 'Answer'
        say: 'So the answer, correct to 3 significant figures, is 70,500, which is option D.'
        write: '$\therefore$ Answer $= 70500$ (3 s.f.)'
        answer: true
    traps:
      A: 'You went for 705. Those are the right three digits, but the zeros that keep the place were dropped. The answer is about seventy thousand, not 705.'
      B: 'You went for 70,000. That is 70,480 to 2 significant figures. For 3 we keep 7, 0 and 4, and the next digit 8 makes the 4 a 5, giving 70,500.'
      C: 'You went for 70,480. That is the exact value, which has 4 significant figures. The question asks us to round it to 3.'
  3:
    moments:
      - section: 'The question'
        say: 'A power of 9 equals a power of 3, and the unknown sits in both indices. Once the bases are the same, this turns into a quadratic equation.'
        write: 'If $9^{(x - \frac{1}{2})} = 3^{x^{2}}$, find $x$'
      - say: 'Solution. First, express both sides in the same base.'
        write: 'Solution'
      - section: 'The same base'
        say: 'Nine tiles make a square with 3 on each side, so 9 is 3 squared. So replace the 9 with 3 squared.'
        write: '$(3^{2})^{(x - \frac{1}{2})} = 3^{x^{2}}$'
        doodle: {name: 'custom:1993_q03_a', id: nine, caption: '9 tiles make a 3 by 3 square'}
      - say: 'The law of indices for a power of a power tells us to multiply the indices.'
        write: 'Law of indices: $(a^{m})^{n} = a^{mn}$'
      - say: 'So the index on the left is 2 times the bracket, $x$ minus 1 over 2.'
        write: '$3^{2(x - \frac{1}{2})} = 3^{x^{2}}$'
      - say: 'Open the bracket. 2 times $x$ is $2x$, and 2 times 1 over 2 is 1.'
        write: '$3^{2x - 1} = 3^{x^{2}}$'
      - section: 'Equate the indices'
        say: 'Since the bases are the same, equate the indices.'
        write: 'Equating the indices: $2x - 1 = x^{2}$'
      - say: 'Collect all the terms on one side, so the quadratic equals zero.'
        write: '$x^{2} - 2x + 1 = 0$'
      - say: 'Factorise. We need two numbers whose product is 1 and whose sum is negative 2, and they are negative 1 and negative 1.'
        write: 'Product $= 1$, Sum $= -2$: $\ -1, -1$'
      - say: 'Split the middle term with them, as minus $x$, minus $x$.'
        write: '$x^{2} - x - x + 1 = 0$'
      - say: 'Group in pairs. $x$ comes out of the first pair, and negative 1 out of the second.'
        write: '$x(x - 1) - 1(x - 1) = 0$'
      - say: 'Both groups have the bracket $x$ minus 1.'
        write: '$(x - 1)(x - 1) = 0$'
      - say: 'Either bracket gives $x$ minus 1 equals 0, so $x$ is 1, a repeated root.'
        write: '$x - 1 = 0 \quad \therefore x = 1$'
      - section: 'Check'
        say: 'Check on the left side. 1 minus 1 over 2 is 1 over 2, and 9 to the power 1 over 2 is the square root of 9, the side of the square, which is 3.'
        write: 'Check: $9^{(1 - \frac{1}{2})} = 9^{\frac{1}{2}} = \sqrt{9} = 3$'
        doodle_do:
          - {id: nine, op: circle, part: side}
      - say: 'On the right side, 1 squared is 1, and 3 to the power 1 is 3. Both sides are 3.'
        write: '$3^{1^{2}} = 3^{1} = 3\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore $x$ is 1, which is option B.'
        write: '$\therefore x = 1$'
        answer: true
    traps:
      A: 'You went for 1 over 2. Then the left side is 9 to the power 0, which is 1, but the right side is 3 to the power 1 over 4, which is not 1. Equating the indices gives $x$ minus 1, all squared, equals 0.'
      C: 'You went for 2. Then the left side is 9 to the power 3 over 2, which is 27, and the right side is 3 to the power 4, which is 81. They are not equal.'
      D: 'You went for 3. Then the left side is 9 to the power 5 over 2, which is 243, but the right side is 3 to the power 9. The quadratic gives only $x$ equal to 1.'
  4:
    moments:
      - section: 'The question'
        say: 'Three different bases, 10, 5 and 4, are multiplied to give 1. We cannot equate indices until the bases agree. Every one of them is built from 2s and 5s.'
        write: 'Solve for $y$: $10^{y} \times 5^{(2y - 2)} \times 4^{(y - 1)} = 1$'
      - say: 'Solution. We write every base using its prime factors, 2 and 5.'
        write: 'Solution'
      - section: 'Prime bases'
        say: 'The law of indices for a product says a product to a power is each factor to that power.'
        write: 'Law of indices: $(ab)^{n} = a^{n}b^{n}$'
      - say: '10 is 2 times 5. So 10 to the power $y$ is 2 to the power $y$, times 5 to the power $y$.'
        write: '$10^{y} = (2 \times 5)^{y} = 2^{y} \times 5^{y}$'
      - say: 'The law of indices for a power of a power says to multiply the indices.'
        write: 'Law of indices: $(a^{m})^{n} = a^{mn}$'
      - say: '4 is 2 squared. So 4 to the power $y$ minus 1 is 2 to the power 2 times $y$ minus 1, which is $2y$ minus 2. 5 to the power $2y$ minus 2 is already in base 5.'
        write: '$4^{(y - 1)} = (2^{2})^{(y - 1)} = 2^{2y - 2}$'
      - section: 'Collect the powers'
        say: 'Substitute both into the equation.'
        write: '$2^{y} \times 5^{y} \times 5^{2y - 2} \times 2^{2y - 2} = 1$'
      - say: 'The law of indices for multiplying says that when we multiply powers of the same base, we add the indices.'
        write: 'Law of indices: $a^{m} \times a^{n} = a^{m + n}$'
      - say: 'Add the indices of 2, which gives $y$ plus $2y$ minus 2. Add the indices of 5 the same way.'
        write: '$2^{y + 2y - 2} \times 5^{y + 2y - 2} = 1$'
      - say: '$y$ plus $2y$ is $3y$, so both indices are $3y$ minus 2.'
        write: '$2^{3y - 2} \times 5^{3y - 2} = 1$'
      - say: 'Both have the same index, so use the product law backwards, and 2 times 5 is 10.'
        write: '$(2 \times 5)^{3y - 2} = 10^{3y - 2} = 1$'
      - section: 'Equate the indices'
        say: 'Any non-zero number to the power 0 is 1. The piles show it, with 100, then 10, then 1, dividing by 10 each step. So write 1 as 10 to the power 0.'
        write: '$10^{3y - 2} = 10^{0}$ $\quad [a^{0} = 1]$'
        doodle: {name: 'custom:1993_q04_a', id: piles, caption: '÷10, ÷10: 10⁰ = 1'}
        doodle_do:
          - {id: piles, op: circle, part: one}
      - say: 'Since the bases are the same, equate the indices.'
        write: 'Equating the indices: $3y - 2 = 0$'
      - say: 'Add 2 to both sides.'
        write: '$3y = 2$'
      - say: 'Divide both sides by 3.'
        write: '$\therefore y = \dfrac{2}{3}$'
      - section: 'Check'
        say: 'To check, 3 times 2 over 3 is 2, and 2 minus 2 is 0. 10 to the power 0 is 1, the right side.'
        write: 'Check: $3\left(\tfrac{2}{3}\right) - 2 = 0$, $\ 10^{0} = 1\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore $y$ is 2 over 3, which is option B.'
        write: '$\therefore y = \dfrac{2}{3}$'
        answer: true
    traps:
      A: 'You went for 3 over 4. Then $3y$ minus 2 is 9 over 4 minus 2, which is 1 over 4, and 10 to the power 1 over 4 is not 1. The index must be 0, so $3y$ equals 2.'
      C: 'You went for 1. Then $3y$ minus 2 is 1, and 10 to the power 1 is 10, not 1. The index must be 0.'
      D: 'You went for 5 over 4. Write every base with 2s and 5s. Both indices come to $3y$ minus 2, and equating that to 0 gives 2 over 3.'
  5:
    moments:
      - section: 'The question'
        say: 'We have two fractions with conjugate denominators. The surds will vanish, but watch the sign, because root 3 is smaller than 2.'
        write: 'Simplify $\dfrac{1}{\sqrt{3} - 2} - \dfrac{1}{\sqrt{3} + 2}$'
      - say: 'Solution. Put the two fractions over one denominator, the product of the two denominators.'
        write: 'Solution'
      - section: 'One denominator'
        say: 'The L.C.M. of the denominators is their product. Each numerator is multiplied by the other denominator, giving root 3 plus 2, minus, bracket, root 3 minus 2.'
        write: '$= \dfrac{(\sqrt{3} + 2) - (\sqrt{3} - 2)}{(\sqrt{3} - 2)(\sqrt{3} + 2)}$'
      - section: 'The denominator'
        say: 'The denominator is a difference of two squares, so $a$ minus $b$, times $a$ plus $b$, is $a$ squared minus $b$ squared.'
        write: '$(a - b)(a + b) = a^{2} - b^{2}$'
      - say: 'Here $a$ is root 3 and $b$ is 2. Picture a square of side root 3, with area 3, and a 2 by 2 square of 4 tiles.'
        doodle: {name: 'custom:1993_q05_a', id: tiles, caption: '(√3)² is 3, 2² is 4'}
        write: 'Denominator $= (\sqrt{3})^{2} - 2^{2}$'
      - say: 'Root 3 squared is 3, and 2 squared is 4. 3 minus 4 is minus 1, so we are one tile short.'
        doodle_do:
          - {id: tiles, op: stage, stage: 'custom:1993_q05_a2'}
        write: '$= 3 - 4 = -1$'
      - section: 'The numerator'
        say: 'Now the numerator. The minus in front of the second bracket changes both signs, so we get minus root 3, and minus minus 2 is plus 2.'
        write: 'Numerator $= \sqrt{3} + 2 - \sqrt{3} + 2$'
      - say: 'Root 3 minus root 3 is 0, and 2 plus 2 is 4.'
        write: '$= 4$'
      - section: 'Put together'
        say: 'Put the numerator, 4, over the denominator, minus 1.'
        doodle_do:
          - {id: tiles, op: circle, part: short}
        write: '$\therefore$ Expression $= \dfrac{4}{-1}$'
        point:
          - {line: 8, kind: move, from: {line: 5, at: '= −1'}, at: '−1', text: 'denominator'}
      - say: '4 divided by minus 1 is minus 4.'
        write: '$= -4$'
      - section: 'Check'
        say: 'Check with decimals. Root 3 minus 2 is about minus 0.268, so the first fraction is about minus 3.732. The second is 1 over 3.732, about 0.268. Minus 3.732 minus 0.268 is minus 4.'
        write: 'Check: $-3.732 - 0.268 = -4\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the expression simplifies to minus 4, which is option D.'
        write: '$\therefore$ the answer is $-4$'
        answer: true
    traps:
      A: 'You went for 4. The numerator is 4, but the denominator is 3 minus 4, which is minus 1. Dividing by minus 1 changes the sign.'
      B: 'You went for 2 over 3. The surds cancel completely. The numerator is 4 and the denominator is minus 1, so there is no 3 left to divide by.'
      C: 'You went for 0. The two fractions are not equal, so they don''t cancel. When you open the second bracket, minus minus 2 becomes plus 2, giving 4 in the numerator.'
  6:
    moments:
      - section: 'The question'
        say: 'We have two logs to base 3, and we want $y$ by itself. Combine the logs into one, change to index form, and do not forget the second square root.'
        write: 'If $2\log_{3}y + \log_{3}x^{2} = 4$, find $y$'
      - say: 'Solution. First the laws of logarithms, then index form.'
        write: 'Solution'
      - section: 'A single logarithm'
        say: 'Recall the power law. $n$ times log $M$ is the log of $M$ to the power $n$.'
        write: 'Recall: $n\log_{a}M = \log_{a}M^{n}$'
      - say: 'By the power law, 2 log base 3 of $y$ is log base 3 of $y$ squared.'
        write: '$2\log_{3}y = \log_{3}y^{2}$'
      - say: 'Put that back into the equation.'
        write: '$\log_{3}y^{2} + \log_{3}x^{2} = 4$'
      - say: 'Recall the product law, which says adding two logs to the same base gives the log of the product.'
        write: 'Recall: $\log_{a}M + \log_{a}N = \log_{a}MN$'
      - say: 'By the product law, the left side is the log base 3 of $x$ squared times $y$ squared.'
        write: '$\log_{3}\left(x^{2}y^{2}\right) = 4$'
      - section: 'Index form'
        say: 'Change to index form. Log base 3 of $N$ equals 4 means $N$ is 3 to the power 4. Picture four 3s multiplied.'
        doodle: {name: 'custom:1993_q06_a', id: tower, caption: '3 to the power 4'}
        write: '$x^{2}y^{2} = 3^{4}$'
      - say: '3 to the power 4 is 3 times 3 times 3 times 3. 3 times 3 is 9, 9 times 3 is 27, and 27 times 3 is 81.'
        doodle_do:
          - {id: tower, op: label, part: result, text: '81'}
        write: '$x^{2}y^{2} = 81$'
      - say: 'By the law of indices, $x$ squared times $y$ squared is $xy$, all squared.'
        write: '$(xy)^{2} = 81$ $\quad [a^{n}b^{n} = (ab)^{n}]$'
      - say: 'Take the square root of both sides. Keep both signs, because 9 squared is 81, and minus 9 squared is also 81.'
        write: '$xy = \pm\sqrt{81} = \pm 9$'
      - say: 'Divide both sides by $x$, to get $y$ by itself.'
        write: '$\therefore y = \pm\dfrac{9}{x}$'
      - section: 'Check'
        say: 'Check with $x$ equal to 1. Then $y$ is 9. 2 log base 3 of 9 is 2 times 2, which is 4, and log base 3 of 1 is 0. 4 plus 0 is 4.'
        write: 'Check $x = 1$, $y = 9$: $2\log_{3}9 + \log_{3}1 = 4 + 0 = 4\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore $y$ is plus or minus 9 over $x$, which is option D.'
        write: '$\therefore y = \pm\dfrac{9}{x}$'
        answer: true
    traps:
      A: 'You went for 4 minus log $x$ squared, over 2. That is log base 3 of $y$, not $y$ itself. You still have to change from log form to index form.'
      B: 'You went for 4 over log $x$ squared. That treats a log like a number you can divide by. Combine the logs first, then change to index form.'
      C: 'You went for 2 over $x$. The 4 on the right is an index of 3, so $x$ squared $y$ squared is 3 to the power 4, which is 81. The square root then gives plus or minus 9.'
  7:
    moments:
      - section: 'The question'
        say: 'We have 62.5 and a half, and neither is a power of 5. But the quotient law turns them into one number that is.'
        write: 'Evaluate $\log_{5}(62.5) - \log_{5}\left(\tfrac{1}{2}\right)$'
      - say: 'Solution. First the quotient law, then index form.'
        write: 'Solution'
      - section: 'A single logarithm'
        say: 'Recall the quotient law of logarithms, which says subtracting two logs to the same base gives the log of the division.'
        write: 'Recall: $\log_{a}M - \log_{a}N = \log_{a}\dfrac{M}{N}$'
      - say: 'Both logs are base 5. By the quotient law, they become log base 5 of 62.5 divided by a half.'
        write: '$\log_{5}(62.5) - \log_{5}\left(\tfrac{1}{2}\right) = \log_{5}\left(62.5 \div \tfrac{1}{2}\right)$'
      - say: 'Dividing by a half is the same as multiplying by its reciprocal, 2.'
        write: '$= \log_{5}(62.5 \times 2)$'
      - say: '62.5 times 2 is 125.'
        write: '$= \log_{5}125$'
      - section: 'Index form'
        say: 'Let log base 5 of 125 be $x$. In index form, 5 to the power $x$ equals 125.'
        write: 'Let $\log_{5}125 = x \Rightarrow 5^{x} = 125$'
      - say: 'Write 125 as a power of 5. 5 times 5 is 25, and 25 times 5 is 125, so 125 is 5 cubed.'
        doodle: {name: 'custom:1993_q07_a', id: tower, caption: '5 × 5 × 5 = 125'}
        doodle_do:
          - {id: tower, op: stage, stage: 'custom:1993_q07_a2'}
          - {id: tower, op: stage, stage: 'custom:1993_q07_a3'}
        write: '$5^{x} = 5^{3}$'
      - say: 'The bases are the same, so equate the indices. $x$ is 3.'
        doodle_do:
          - {id: tower, op: circle, part: count}
        write: '$\therefore x = 3$'
      - section: 'Check'
        say: 'Check. If the answer is 3, then 62.5 should be 5 cubed times a half. 5 cubed is 125, and half of 125 is 62.5. It works.'
        write: 'Check: $5^{3} \times \tfrac{1}{2} = 125 \times \tfrac{1}{2} = 62.5\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the value is 3, which is option A.'
        write: '$\therefore \log_{5}(62.5) - \log_{5}\left(\tfrac{1}{2}\right) = 3$'
        answer: true
    traps:
      B: 'You went for 4. 5 to the power 4 is 625, not 125. Dividing 62.5 by a half gives 125, which is 5 cubed.'
      C: 'You went for 5. 5 to the power 5 is 3125, far too big. By the quotient law the expression is log base 5 of 125, and 125 is 5 cubed.'
      D: 'You went for 8. Log base 5 of 125 asks for the index, not for a sum of numbers. 5 to the power $x$ equals 5 cubed, so $x$ is 3.'
  8:
    moments:
      - section: 'The question'
        say: 'A sum of 225 naira earns 27 naira simple interest in $x$ years, at 4 percent per annum. We want $x$, the number of years.'
        write: '₦225 yields ₦27 in $x$ years at 4% per annum'
        doodle: {name: 'custom:1993_q08_a', id: sack, caption: '₦225 earns ₦27 at 4% a year'}
      - section: 'Solution'
        say: 'Solution. List what we are given. The principal $P$ is 225 naira, the interest $I$ is 27 naira, the rate $R$ is 4 percent, and the time $T$ is $x$.'
        write: '$P =$ ₦225, $\ I =$ ₦27, $\ R = 4\%$, $\ T = x$'
      - say: 'The simple interest formula says interest equals principal, times rate, times time, all over 100.'
        'on': 'simple interest formula'
        write: '$I = \dfrac{PRT}{100}$'
      - say: 'Substitute the given values.'
        write: '$27 = \dfrac{225 \times 4 \times x}{100}$'
        point:
          - {line: 2, kind: box, text: 'the formula'}
      - say: '225 times 4 is 900, so the top is $900x$.'
        write: '$27 = \dfrac{900x}{100}$'
      - say: '900 divided by 100 is 9.'
        write: '$27 = 9x$'
      - say: 'Divide both sides by 9. 27 divided by 9 is 3.'
        write: '$x = \dfrac{27}{9} = 3$'
      - section: 'Check'
        say: 'Check year by year. One year''s interest is 4 over 100, times 225, which is 9 naira, so one coin each year.'
        write: 'Check: one year $= \dfrac{4}{100} \times 225 = 9$'
        doodle_do:
          - {id: sack, op: stage, stage: 'custom:1993_q08_a2'}
      - say: 'In 3 years that is 3 times 9, which is 27 naira, exactly the interest given.'
        write: '$3 \times 9 = 27\ \checkmark$'
        doodle_do:
          - {id: sack, op: circle, part: interest}
      - say: 'Therefore $x$ is 3 years, which is answer choice A.'
        write: '$\therefore x = 3$ years'
        answer: true
        doodle_do:
          - {id: sack, op: label, part: years, text: '3 years'}
    traps:
      B: 'You went for 4. That is the rate, not the time. The interest is 9 naira a year, and 27 naira needs 3 years.'
      C: 'You went for 12. Check it. 12 years at 9 naira a year gives 108 naira interest, not 27.'
      D: 'You went for 27. That is the interest itself. Substitute it into $I = \dfrac{PRT}{100}$ and solve for the time. $27 = 9x$, so $x$ is 3.'
  9:
    moments:
      - section: 'The question'
        say: 'There are three circles, X, Y and Z, and one region is shaded. We must name the shaded region in set notation.'
        write: 'Shaded region $= ?$'
        point:
          - {figure: 0, kind: circle, target: {x: 100, y: 145}, text: 'shaded'}
      - section: 'Solution'
        say: 'Solution. Three circles make seven regions. To name one, take each circle in turn and ask whether the shading is inside it, or outside it.'
        write: 'For each circle: inside or outside?'
      - say: 'Take X, the top left circle. The shading is inside X.'
        write: 'Inside $X$: $\ X$'
        point:
          - {figure: 0, kind: circle, target: X, text: 'inside'}
      - say: 'Now Y, the top right circle. The shading stops at the edge of Y, so it is outside Y. Outside Y is Y complement, written Y dash. This paper writes it with a small c.'
        write: 'Outside $Y$: $\ Y^{\prime}$, also written $Y^{c}$'
        point:
          - {figure: 0, kind: strike, target: Y, text: 'outside'}
      - say: 'Now Z, the bottom circle. The shading is inside Z.'
        write: 'Inside $Z$: $\ Z$'
        point:
          - {figure: 0, kind: circle, target: Z, text: 'inside'}
      - say: 'The shaded region is in X, and in Y complement, and in Z, all at once. In set notation, "and" is intersection.'
        write: 'Shaded region $= X \cap Y^{\prime} \cap Z$'
      - section: 'Check'
        say: 'To check, shade X intersection Y complement intersection Z on a Venn diagram of our own, and compare it with the question''s picture.'
        write: 'Check: shade $X \cap Y^{\prime} \cap Z$'
        diagram: {id: v, kind: venn, universal: {name: U}, sets: [{key: X, name: X}, {key: 'Y', name: 'Y'}, {key: Z, name: Z}]}
        diagram_do:
          - {id: v, op: shade, part: "X∩Y'∩Z", colour: green, text: 'X ∩ Y′ ∩ Z', 'on': 'compare'}
      - say: 'X intersection Z alone would also take the middle piece, inside Y. That piece is not shaded, so the Y complement is needed.'
        write: '$X \cap Z$ takes in the middle piece too'
        diagram_do:
          - {id: v, op: highlight, part: 'X∩Y∩Z', colour: red, text: 'in Y: not shaded', 'on': 'middle piece'}
      - section: 'Answer'
        say: 'Therefore the shaded region is X intersection Y complement intersection Z, which is answer choice C.'
        write: '$\therefore$ shaded region $= X \cap Y^{c} \cap Z$'
        answer: true
        point:
          - {figure: 0, kind: label, target: {x: 100, y: 145}, text: 'X ∩ Yᶜ ∩ Z'}
    traps:
      A: 'You went for X intersection Z. That is the whole overlap of X and Z, including the middle piece inside Y, which is not shaded. Add Y complement.'
      B: 'You went for X complement intersection Y intersection Z. That region is outside X but inside Y and Z, on the right. The shading is inside X and outside Y.'
      D: 'You went for X intersection Y intersection Z complement. That is the patch inside X and Y but outside Z, at the top. The shading is inside Z and outside Y.'
  10:
    moments:
      - section: 'The question'
        say: 'A square root equals $x$ plus 1. Picture a right-angled triangle with legs $x$ and 3, and by Pythagoras its long side is the root of $x$ squared plus 9.'
        write: '$\sqrt{x^{2} + 9} = x + 1$'
        doodle: {name: 'custom:1993_q10_a', id: tri, caption: 'legs x and 3'}
      - section: 'Solution'
        say: 'To remove a square root, square both sides. The root is already alone on the left, which keeps this tidy.'
        write: 'Solution'
      - say: 'Square both sides. Squaring a square root gives back what was inside it.'
        write: '$x^{2} + 9 = (x + 1)^{2}$'
      - say: 'Open the bracket. $x$ plus 1, squared, is $x$ plus 1 times $x$ plus 1, which is $x$ squared plus $x$ plus $x$ plus 1, so $x$ squared plus $2x$ plus 1.'
        write: '$x^{2} + 9 = x^{2} + 2x + 1$'
      - say: 'Collect like terms, with the $x$ terms on the left and the numbers on the right. Moving a term across the equals sign changes its sign.'
        write: '$x^{2} - x^{2} - 2x = 1 - 9$'
      - say: '$x$ squared minus $x$ squared is zero. 1 minus 9 is negative 8.'
        write: '$-2x = -8$'
      - say: 'Divide both sides by negative 2. Negative 8 divided by negative 2 is 4.'
        write: '$\therefore x = 4$'
      - section: 'Check'
        say: 'Squaring can create false answers, so check in the question. On the left, 4 squared is 16, plus 9 is 25, and root 25 is 5. The triangle is the famous 3, 4, 5.'
        write: 'Left: $\sqrt{4^{2} + 9} = \sqrt{25} = 5$'
        doodle_do:
          - {id: tri, op: label, part: leg, text: '4'}
          - {id: tri, op: label, part: hyp, text: '5'}
        point:
          - {line: 7, kind: highlight, at: '25=[[5]]', to: {doodle: tri, part: hyp}}
      - say: 'On the right, 4 plus 1 is 5. Both sides are 5.'
        write: 'Right: $4 + 1 = 5\ \checkmark$'
      - say: 'So $x$ is 4, which is option B.'
        write: '$\therefore x = 4$ (B)'
        answer: true
    traps:
      A: 'You went for 5. That is the value of each side when $x$ is 4, not $x$ itself. Check 5. Root 34 is not 6.'
      C: 'You went for 3. Then the left is root 18 and the right is 4. They do not match. Open the bracket fully, because $x$ plus 1, squared, has a middle term $2x$.'
      D: 'You went for 1. Then the left is root 10 and the right is 2. Square both sides and open the bracket in full, and 9 equals $2x$ plus 1.'
  11:
    moments:
      - section: 'The question'
        say: 'Make $x$ the subject. The trouble is that $x$ sits on the top and on the bottom. The trick is to gather both $x$ terms, then factorise $x$ out.'
        write: '$\dfrac{1 + ax}{1 - ax} = \dfrac{p}{q}$'
      - section: 'Solution'
        say: 'Clear the fractions, collect the $x$ terms on one side, factorise out $x$, then divide.'
        write: 'Solution'
      - say: 'Cross multiply, so $q$ times 1 plus $ax$ equals $p$ times 1 minus $ax$.'
        write: '$q(1 + ax) = p(1 - ax)$'
      - say: 'Open the brackets. $q$ times 1 is $q$, $q$ times $ax$ is $aqx$. $p$ times 1 is $p$, $p$ times negative $ax$ is negative $apx$.'
        write: '$q + aqx = p - apx$'
      - say: 'Collect the terms in $x$ on the left and the others on the right. Negative $apx$ crosses as plus $apx$, and $q$ crosses as minus $q$.'
        write: '$aqx + apx = p - q$'
      - say: 'Both terms on the left contain $ax$. Factorise out $ax$, leaving $q$ plus $p$, which we write as $p$ plus $q$.'
        write: '$ax(p + q) = p - q$'
      - say: 'Divide both sides by $a$ times $p$ plus $q$, so that $x$ stands alone.'
        write: '$\therefore x = \dfrac{p - q}{a(p + q)}$'
      - section: 'Check'
        say: 'Check with numbers. Take $a$ equals 1 and $x$ equals one third. 1 plus a third is 4 thirds, and 1 minus a third is 2 thirds. So $p$ over $q$ is 2.'
        write: '$\dfrac{1 + \frac{1}{3}}{1 - \frac{1}{3}} = \dfrac{4}{3} \div \dfrac{2}{3} = 2$'
      - say: 'So we can take $p$ equals 2 and $q$ equals 1. Our formula gives 2 minus 1, over 1 times 2 plus 1, which is one third, the $x$ we started with.'
        write: '$x = \dfrac{2 - 1}{1(2 + 1)} = \dfrac{1}{3}\ \checkmark$'
      - say: 'So $x$ is $p$ minus $q$, over $a$ times $p$ plus $q$, and that is option B.'
        write: '$\therefore x = \dfrac{p - q}{a(p + q)}$ (B)'
        answer: true
    traps:
      A: 'You went for $p$ plus $q$ over $a$ times $p$ minus $q$. The two brackets are upside down. After collecting, the $x$ terms give $ax$ times $p$ plus $q$, and the others give $p$ minus $q$.'
      C: 'You went for $p$ minus $q$ over $apq$. The $p$ and $q$ come from adding $aqx$ and $apx$, so factorising out $ax$ leaves $p$ plus $q$, not $pq$.'
      D: 'You went for $pq$ over $a$ times $p$ minus $q$. Cross multiply and open the brackets carefully. The terms without $x$ give $p$ minus $q$, not $pq$.'
  12:
    moments:
      - section: 'The question'
        say: 'Which is a factor? The expression is written back to front, with a negative $x$ squared. Two of the options use the 3, and two use the 5. Only one sign is right.'
        write: '$15 + 7x - 2x^{2}$'
      - section: 'Solution'
        say: 'We factorise by product and sum, keeping the terms in the order given. The first number is 15, the last is negative 2.'
        write: 'Solution'
      - say: 'The product is 15 times negative 2, which is negative 30. The sum is the middle number, 7.'
        write: 'Product $= 15 \times (-2) = -30$, Sum $= 7$'
      - say: 'Two numbers that multiply to negative 30 and add to 7 are plus 10 and negative 3.'
        write: 'Factors: $+10$ and $-3$'
      - say: 'Replace $7x$ with $10x$ minus $3x$.'
        write: '$15 + 10x - 3x - 2x^{2}$'
      - say: 'Group in pairs. From the first take out 5, leaving 3 plus $2x$. From the second take out negative $x$, leaving 3 plus $2x$. Both brackets are the same.'
        write: '$= 5(3 + 2x) - x(3 + 2x)$'
      - say: 'Take out the common bracket, 3 plus $2x$. What is left is 5 minus $x$.'
        write: '$= (3 + 2x)(5 - x)$'
      - say: 'The options write $x$ first. 5 minus $x$ is the negative of $x$ minus 5, so $x$ minus 5 is a factor too.'
        write: '$5 - x = -(x - 5)$'
      - say: 'Therefore $x$ minus 5 is a factor.'
        write: '$\therefore x - 5$ is a factor'
      - section: 'Check'
        say: 'Check with the factor theorem. Let $x$ minus 5 equal zero, so $x$ is 5. Then the expression must be zero.'
        write: 'Let $x - 5 = 0$, $\therefore x = 5$'
      - say: 'Substitute 5 for $x$, in brackets.'
        write: '$15 + 7(5) - 2(5)^{2}$'
      - say: '7 times 5 is 35. 5 squared is 25, and 2 times 25 is 50. 15 plus 35 minus 50 is zero, so $x$ minus 5 is a factor.'
        write: '$= 15 + 35 - 50 = 0\ \checkmark$'
      - say: 'So $x$ minus 5 is a factor, option C.'
        write: '$\therefore x - 5$ (C)'
        answer: true
    traps:
      A: 'You went for $x$ minus 3. Put $x$ equals 3 in, and 15 plus 21 minus 18 is 18, not zero. So $x$ minus 3 is not a factor.'
      B: 'You went for $x$ plus 3. Put $x$ equals negative 3 in, and 15 minus 21 minus 18 is negative 24, not zero. The factor with 3 in it is 3 plus $2x$, not $x$ plus 3.'
      D: 'You went for $x$ plus 5. That puts $x$ equals negative 5, which gives negative 70, not zero. The bracket is 5 minus $x$, so the factor is $x$ minus 5.'
  13:
    moments:
      - section: 'The question'
        say: 'Expanding both squares would take ages. Notice the shape, which is one thing squared minus another thing squared, a big square with a smaller square cut away.'
        write: '$\left(x + \dfrac{1}{x} + 1\right)^{2} - \left(x - \dfrac{1}{x} - 1\right)^{2}$'
        doodle: {name: 'custom:1993_q13_a', id: sq, caption: 'A² − B²: a square with a corner cut'}
      - section: 'Solution'
        say: 'This is a difference of two squares, so we name the two brackets and use the rule.'
        write: 'Solution'
      - say: 'Call the first bracket $A$, the big square''s side.'
        write: 'Let $A = x + \dfrac{1}{x} + 1$'
        doodle_do:
          - {id: sq, op: label, part: big, text: 'A = x + 1/x + 1'}
      - say: 'Call the second bracket $B$, the cut corner''s side.'
        write: 'Let $B = x - \dfrac{1}{x} - 1$'
        doodle_do:
          - {id: sq, op: label, part: small, text: 'B = x − 1/x − 1'}
      - say: 'The rule says $A$ squared minus $B$ squared equals $A$ plus $B$, times $A$ minus $B$.'
        write: '$A^{2} - B^{2} = (A + B)(A - B)$'
      - section: 'A + B and A − B'
        say: 'First, $A$ plus $B$. Write the two brackets side by side.'
        write: '$A + B = x + \dfrac{1}{x} + 1 + x - \dfrac{1}{x} - 1$'
      - say: 'Collect like terms. $x$ plus $x$ is $2x$. 1 over $x$ minus 1 over $x$ is zero, and 1 minus 1 is zero.'
        write: '$= 2x$'
      - say: 'Now $A$ minus $B$. The minus sign in front of $B$ changes every sign inside it.'
        write: '$A - B = x + \dfrac{1}{x} + 1 - x + \dfrac{1}{x} + 1$'
      - say: 'Collect like terms. $x$ minus $x$ is zero. 1 over $x$ plus 1 over $x$ is 2 over $x$. 1 plus 1 is 2.'
        write: '$= \dfrac{2}{x} + 2$'
      - section: 'Multiply'
        say: 'Back to the rule, and the expression is $A$ plus $B$, times $A$ minus $B$.'
        write: '$(A + B)(A - B) = 2x\left(\dfrac{2}{x} + 2\right)$'
        point:
          - {line: 4, kind: box, text: 'the rule'}
      - say: 'Open the bracket. In $2x$ times 2 over $x$, the $x$ cancels, leaving 4. $2x$ times 2 is $4x$.'
        write: '$= 4 + 4x$'
      - say: 'Take out the common factor 4. Therefore the expression equals 4 times, 1 plus $x$.'
        write: '$\therefore 4(1 + x)$'
      - section: 'Check'
        say: 'Check with $x$ equals 1. The first bracket is 1 plus 1 plus 1, which is 3. The second is 1 minus 1 minus 1, which is negative 1.'
        write: '$x = 1$: $(3)^{2} - (-1)^{2} = 9 - 1 = 8$'
      - say: 'Our answer gives 4 times, 1 plus 1, which is 8. It matches.'
        write: '$4(1 + 1) = 8\ \checkmark$'
      - say: 'So the expression equals 4 times, 1 plus $x$, which is option D.'
        write: '$\therefore 4(1 + x)$ (D)'
        answer: true
    traps:
      A: 'You went for $4x$ squared. That is $A$ plus $B$, squared. The sum $A$ plus $B$ is $2x$, but the difference $A$ minus $B$ is 2 over $x$ plus 2, not $2x$. Multiply those two.'
      B: 'You went for 2 over $x$ plus 2, all squared. That is $A$ minus $B$, squared. The difference of two squares is $A$ plus $B$ times $A$ minus $B$, and $A$ plus $B$ is $2x$.'
      C: 'You went for 4. That is only part of it. $2x$ times 2 over $x$ gives 4, but $2x$ times 2 gives another $4x$.'
  14:
    moments:
      - section: 'The question'
        say: 'One equation has $x$ squared, and the other is a straight line. Find $x$. One option has the right numbers with the signs swapped, so watch the signs.'
        write: '$x^{2} + y - 5 = 0$ and $y - 7x + 3 = 0$'
      - section: 'Solution'
        say: 'One equation is quadratic and one is linear, so we use substitution. First, number the equations.'
        write: 'Solution'
      - say: 'Equation 1 is $x$ squared plus $y$ minus 5 equals zero.'
        write: '$x^{2} + y - 5 = 0 \quad \text{......(1)}$'
      - say: 'Equation 2 is $y$ minus $7x$ plus 3 equals zero.'
        write: '$y - 7x + 3 = 0 \quad \text{......(2)}$'
      - say: 'Make $y$ the subject of the linear one, equation 2, so add $7x$ to both sides and subtract 3. Call this equation 3.'
        write: 'From (2): $y = 7x - 3 \quad \text{......(3)}$'
      - say: 'Now substitute equation 3 into equation 1.'
        write: 'Substitute (3) in (1):'
      - say: 'Wherever $y$ appears in equation 1, write $7x$ minus 3 in a bracket.'
        write: '$x^{2} + (7x - 3) - 5 = 0$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: 'y=[[7x−3]]'}, at: '(7x−3)', text: 'equation (3)'}
      - say: 'Open the bracket and collect like terms. Negative 3 minus 5 is negative 8.'
        write: '$x^{2} + 7x - 8 = 0$'
      - section: 'Factorise'
        say: 'Here $a$ is 1, $b$ is 7 and $c$ is negative 8. The product is $ac$, which is negative 8. The sum is $b$, which is 7.'
        write: 'Product $= ac = -8$, Sum $= b = 7$'
      - say: 'Two numbers that multiply to negative 8 and add to 7 are plus 8 and negative 1.'
        write: 'Factors: $+8$ and $-1$'
      - say: 'Replace $7x$ with $8x$ minus $x$.'
        write: '$x^{2} + 8x - x - 8 = 0$'
      - say: 'Group in pairs. From the first take out $x$, and from the second take out negative 1. Both brackets are $x$ plus 8.'
        write: '$x(x + 8) - 1(x + 8) = 0$'
      - say: 'Take out the common bracket, $x$ plus 8. What is left is $x$ minus 1.'
        write: '$(x + 8)(x - 1) = 0$'
      - say: 'Either the first bracket is zero or the second one is.'
        write: 'Either $x + 8 = 0$ or $x - 1 = 0$'
      - say: 'Therefore $x$ equals negative 8 or $x$ equals 1.'
        write: '$\therefore x = -8$ or $x = 1$'
      - section: 'Check'
        say: 'Check $x$ equals 1. Equation 3 gives $y$ equals 7 minus 3, which is 4. In equation 1, 1 plus 4 minus 5 is zero.'
        write: '$x = 1,\ y = 4$: $1 + 4 - 5 = 0\ \checkmark$'
      - say: 'Check $x$ equals negative 8. $y$ is negative 56 minus 3, which is negative 59. In equation 1, 64 minus 59 minus 5 is zero.'
        write: '$x = -8,\ y = -59$: $64 - 59 - 5 = 0\ \checkmark$'
      - say: 'So $x$ is 1 or negative 8, which is option D.'
        write: '$\therefore x = 1, -8$ (D)'
        answer: true
    traps:
      A: 'You went for negative 2 and 4. Try $x$ equals 4. Then $y$ is 25, and 16 plus 25 minus 5 is not zero. The quadratic is $x$ squared plus $7x$ minus 8 equals zero.'
      B: 'You went for 2 and 4. Substitute equation 3 into equation 1 and you get $x$ squared plus $7x$ minus 8 equals zero, whose roots are 1 and negative 8.'
      C: 'You went for negative 1 and 8. The signs are swapped. The factors are $x$ plus 8 and $x$ minus 1, so either $x$ plus 8 is zero, giving negative 8, or $x$ minus 1 is zero, giving 1.'
  15:
    moments:
      - section: 'The question'
        say: 'The same bracket, $3x$ minus 2, sits on both sides, like the same block on both pans of a balance. It is tempting to divide it away. Don''t, because you would lose a root.'
        write: '$(3x - 2)(5x - 4) = (3x - 2)^{2}$'
        doodle: {name: 'custom:1993_q15_a', id: bal, caption: 'the same block on both pans'}
      - section: 'Solution'
        say: 'Dividing by $3x$ minus 2 throws away the answer that makes it zero. So bring everything to one side and factorise instead.'
        write: 'Solution'
      - say: 'Subtract $3x$ minus 2, squared, from both sides, so the right-hand side is zero.'
        write: '$(3x - 2)(5x - 4) - (3x - 2)^{2} = 0$'
      - say: '$3x$ minus 2, squared, is $3x$ minus 2 times $3x$ minus 2. So both terms share the bracket $3x$ minus 2, the block. Take it out.'
        write: '$(3x - 2)[(5x - 4) - (3x - 2)] = 0$'
        doodle_do:
          - {id: bal, op: circle, part: shared1}
          - {id: bal, op: circle, part: shared2}
      - say: 'Open the brackets inside. The minus sign changes both signs of $3x$ minus 2, giving minus $3x$, plus 2.'
        write: '$(3x - 2)(5x - 4 - 3x + 2) = 0$'
      - say: 'Collect like terms. $5x$ minus $3x$ is $2x$. Negative 4 plus 2 is negative 2.'
        write: '$(3x - 2)(2x - 2) = 0$'
      - say: 'Either the first bracket is zero or the second one is.'
        write: 'Either $3x - 2 = 0$ or $2x - 2 = 0$'
      - say: '$3x$ equals 2 gives $x$ equals 2 over 3. $2x$ equals 2 gives $x$ equals 1.'
        write: '$\therefore x = \dfrac{2}{3}$ or $x = 1$'
      - section: 'Check'
        say: 'Check $x$ equals 1. $3$ minus 2 is 1 and 5 minus 4 is 1. The left is 1 times 1, and the right is 1 squared. Both are 1.'
        write: '$x = 1$: $(1)(1) = (1)^{2}\ \checkmark$'
      - say: 'Check $x$ equals 2 over 3. Then $3x$ minus 2 is zero, so the shared block weighs nothing. The left is zero times something, and the right is zero squared. Both are zero.'
        write: '$x = \tfrac{2}{3}$: $(0)\left(\tfrac{10}{3} - 4\right) = (0)^{2}\ \checkmark$'
        doodle_do:
          - {id: bal, op: label, part: shared1, text: '0 when x = 2/3'}
      - say: 'So $x$ is 2 over 3 or 1, option C.'
        write: '$\therefore x = \dfrac{2}{3}, 1$ (C)'
        answer: true
    traps:
      A: 'You went for negative 3 over 2, and 1. The 1 is right, but the other root comes from $3x$ minus 2 equals zero, which gives positive 2 over 3.'
      B: 'You went for 1 only. That is what you get if you divide both sides by $3x$ minus 2. Dividing throws away the root 2 over 3, which makes that bracket zero.'
      D: 'You went for 2 over 3 and 4 over 5. 4 over 5 makes $5x$ minus 4 zero, but then the right-hand side, $3x$ minus 2 squared, is not zero. Subtract and factorise out $3x$ minus 2 instead.'
  16:
    moments:
      - section: 'The question'
        say: 'The figure shows two curves, $y = x(2 - x)$ and $y = (x - 1)(x - 3)$. We want the $x$-coordinates of the marked points $p$, $q$ and $r$.'
        write: 'Solution: $y = x(2 - x)$ and $y = (x - 1)(x - 3)$'
      - say: '$p$, $q$ and $r$ sit on the $x$-axis, where the curves cross it. On the $x$-axis, $y$ is zero.'
        write: 'On the $x$-axis, $y = 0$'
        point:
          - {figure: 0, kind: 'circle', target: 'p'}
          - {figure: 0, kind: 'circle', target: 'q'}
          - {figure: 0, kind: 'circle', target: 'r'}
      - section: 'First curve'
        say: 'Put $y = 0$ in the first curve. It is the hill, the curve that opens downwards, because multiplied out its $x^{2}$ term is negative.'
        write: '$x(2 - x) = 0$'
        point:
          - {figure: 0, kind: 'label', target: {x: 140, y: 110}, text: 'y = x(2 − x)'}
      - say: 'A product is zero only when one of its factors is zero. Either $x$ is 0, or $2 - x$ is 0.'
        write: 'Either $x = 0$ or $2 - x = 0$'
      - say: 'So the hill meets the $x$-axis at 0, the origin, and at 2.'
        write: '$\therefore x = 0$ or $x = 2$'
        point:
          - {figure: 0, kind: circle, target: '0', text: 'x = 0'}
          - {figure: 0, kind: 'circle', target: 'q', text: '2'}
      - section: 'Second curve'
        say: 'Now the second curve, the valley that opens upwards. Put $y = 0$.'
        write: '$(x - 1)(x - 3) = 0$'
        point:
          - {figure: 0, kind: 'label', target: {x: 200, y: 190}, text: 'y = (x − 1)(x − 3)'}
      - say: 'Either $x - 1$ is 0, or $x - 3$ is 0.'
        write: 'Either $x - 1 = 0$ or $x - 3 = 0$'
      - say: 'So the valley meets the $x$-axis at 1 and at 3.'
        write: '$\therefore x = 1$ or $x = 3$'
        point:
          - {figure: 0, kind: 'circle', target: 'p', text: '1'}
          - {figure: 0, kind: 'circle', target: 'r', text: '3'}
      - section: 'Read them in order'
        say: 'Together, the crossings are 0, 1, 2 and 3. The origin, 0, is already marked on the figure, so $p$, $q$ and $r$ are the next three, from left to right.'
        write: 'Crossings: $x = 0,\ 1,\ 2,\ 3$'
        point:
          - {line: 4, kind: arrow, text: 'first curve'}
          - {line: 7, kind: arrow, text: 'second curve'}
      - say: 'So $p$ is at 1, $q$ is at 2 and $r$ is at 3.'
        write: '$p: x = 1,\quad q: x = 2,\quad r: x = 3$'
        point:
          - {figure: 0, kind: label, target: p, text: '1'}
          - {figure: 0, kind: label, target: q, text: '2'}
          - {figure: 0, kind: label, target: r, text: '3'}
      - section: 'Check'
        say: 'Check $q$ in the hill. $x = 2$ gives 2 times 2 minus 2, which is 2 times 0, which is 0. It is on the $x$-axis.'
        write: 'Check: $x = 2$: $\ 2(2 - 2) = 2 \times 0 = 0\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the $x$-coordinates of $p$, $q$ and $r$ are 1, 2 and 3, which is option D.'
        write: '$\therefore 1,\ 2,\ 3$'
        answer: true
    traps:
      A: 'You went for 1, 3, 2. Those are the right numbers in the wrong order. Reading left to right, $p$ is at 1, $q$ at 2 and $r$ at 3.'
      B: 'You went for 0, 0, 0. Only the first curve passes through the origin. Put each factor equal to zero to find the other crossings, which are 1, 2 and 3.'
      C: 'You went for 0, 2, 3. The origin is already marked 0, and you missed the crossing at 1, from the factor $x - 1$ of the second curve.'
  17:
    moments:
      - section: 'The question'
        say: 'The function $f$ is defined by $f$ of, $x$ plus 2, equals $2x$ squared plus $7x$ minus 5. We want $f$ of negative 1.'
        write: '$f(x + 2) = 2x^{2} + 7x - 5$; $f(-1) = ?$'
      - section: 'Solution'
        say: 'Solution. The rule is written for an input of $x$ plus 2, not $x$. So find the $x$ that makes $x$ plus 2 equal to negative 1.'
        write: 'Solution: let $x + 2 = -1$'
        doodle: {name: 'custom:1993_q17_a', id: fm, caption: 'the input is x + 2'}
        doodle_do:
          - {id: fm, op: circle, part: input}
      - say: 'Subtract 2 from both sides. Negative 1 minus 2 is negative 3.'
        write: '$x = -1 - 2 = -3$'
        doodle_do:
          - {id: fm, op: label, part: input, text: 'x = −3'}
      - section: 'Substitute'
        say: 'So $f$ of negative 1 is the right-hand side when $x$ is negative 3. Substitute negative 3 for every $x$, in brackets.'
        write: '$f(-1) = 2(-3)^{2} + 7(-3) - 5$'
      - say: 'By BODMAS, the power comes first, so negative 3 squared is 9. And 7 times negative 3 is negative 21.'
        write: '$= 2(9) - 21 - 5$'
      - say: '2 times 9 is 18.'
        write: '$= 18 - 21 - 5$'
      - say: '18 minus 21 is negative 3, and negative 3 minus 5 is negative 8.'
        write: '$\therefore\ f(-1) = -8$'
        doodle_do:
          - {id: fm, op: label, part: output, text: '−8'}
      - section: 'Check'
        say: 'Check by a second route, which is to find $f$ of $t$. Let $t$ equal $x$ plus 2, so $x$ is $t$ minus 2. Substitute and expand.'
        write: 'Check: $f(t) = 2(t - 2)^{2} + 7(t - 2) - 5 = 2t^{2} - t - 11$'
      - say: 'Now put $t$ equals negative 1. 2 times 1 is 2, minus negative 1 is plus 1, then minus 11. 2 plus 1 minus 11 is negative 8.'
        write: '$f(-1) = 2 + 1 - 11 = -8\ \checkmark$'
      - say: 'Therefore $f$ of negative 1 is negative 8, which is answer choice B.'
        write: '$\therefore\ f(-1) = -8$'
        answer: true
    traps:
      A: 'You went for negative 10. That puts $x$ equals negative 1 straight in, giving 2 minus 7 minus 5. But that gives $f$ of 1, since the input is $x$ plus 2.'
      C: 'You went for 4. Check the signs. 18 minus 21 is negative 3, and minus 5 more is negative 8.'
      D: 'You went for 10. Solve $x$ plus 2 equals negative 1 first, so $x$ is negative 3, then substitute carefully. 18 minus 21 minus 5 is negative 8.'
  18:
    moments:
      - section: 'The question'
        say: 'This is a cubic divided by a quadratic. Picture a rectangle whose area is the cubic and one side is $x$ squared minus 1, and the division finds the other side.'
        write: '$(x^{3} + 7x^{2} - x - 7) \div (-1 + x^{2})$'
        doodle: {name: 'custom:1993_q18_a', id: rect, caption: 'divide the area by one side'}
      - section: 'Solution'
        say: 'We use long division. First write the divisor in descending powers of $x$, with $0x$ for the missing $x$ term.'
        write: 'Solution'
      - say: 'Negative 1 plus $x$ squared, rearranged, is $x$ squared plus $0x$ minus 1.'
        write: 'Divisor: $-1 + x^{2} = x^{2} + 0x - 1$'
      - section: 'Long division'
        say: 'Divide the first term by the first term. $x$ cubed divided by $x$ squared is $x$. That is the first term of the quotient.'
        write: '$x^{3} \div x^{2} = x$'
      - say: 'Multiply the whole divisor by $x$.'
        write: '$x(x^{2} + 0x - 1) = x^{3} + 0x^{2} - x$'
      - say: 'Subtract it from the first three terms, so change the signs and add. $x$ cubed cancels, $7x$ squared stays, and negative $x$ minus negative $x$ is zero. Bring down the negative 7.'
        write: 'Subtract: $7x^{2} + 0x - 7$'
      - say: 'Divide again, first term by first term. $7x$ squared divided by $x$ squared is 7. That is the next term of the quotient.'
        write: '$7x^{2} \div x^{2} = 7$'
      - say: 'Multiply the whole divisor by 7.'
        write: '$7(x^{2} + 0x - 1) = 7x^{2} + 0x - 7$'
      - say: 'Subtract. Everything cancels, so the remainder is zero.'
        write: 'Subtract: remainder $= 0$'
      - say: 'The quotient is $x$ plus 7, the other side of the rectangle.'
        write: '$\therefore$ Quotient $= x + 7$'
        doodle_do:
          - {id: rect, op: label, part: side2, text: 'x + 7'}
        point:
          - {line: 9, kind: highlight, at: 'x + 7', to: {doodle: rect, part: side2}}
      - section: 'Check'
        say: 'Check, because quotient times divisor must give back the cubic. $x$ times $x$ squared is $x$ cubed, $x$ times negative 1 is negative $x$, 7 times $x$ squared is $7x$ squared, and 7 times negative 1 is negative 7.'
        write: '$(x + 7)(x^{2} - 1) = x^{3} - x + 7x^{2} - 7$'
      - say: 'In descending powers, that is exactly the cubic we started with.'
        write: '$= x^{3} + 7x^{2} - x - 7\ \checkmark$'
      - section: 'Exam tip'
        say: 'Here is an exam tip. Grouping is a quicker way. $x$ squared times $x$ plus 7, minus 1 times $x$ plus 7, shows the cubic is $x$ plus 7 times $x$ squared minus 1.'
        write: '$x^{2}(x + 7) - 1(x + 7) = (x + 7)(x^{2} - 1)$'
      - say: 'So the answer is $x$ plus 7, which is option D.'
        write: '$\therefore x + 7$ (D)'
        answer: true
    traps:
      A: 'You went for negative $x$ cubed plus $7x$ squared minus $x$ minus 7. That is the cubic with one sign changed, not divided at all. A cubic divided by a quadratic leaves a first-degree answer, here $x$ plus 7.'
      B: 'You went for negative $x$ cubed minus $7x$ plus 7. A cubic divided by a quadratic gives a first-degree quotient. The long division gives $x$, then 7, so $x$ plus 7.'
      C: 'You went for $x$ minus 7. Check it. $x$ minus 7, times $x$ squared minus 1, gives negative $7x$ squared, not plus $7x$ squared. The quotient is $x$ plus 7.'
  19:
    moments:
      - section: 'The question'
        say: 'This is a fraction whose top and bottom are themselves fractions. It looks frightening, but simplify the top and the bottom one at a time and it collapses.'
        write: '$\dfrac{\dfrac{1}{p} - \dfrac{1}{q}}{\dfrac{p}{q} - \dfrac{q}{p}}$'
      - section: 'Solution'
        say: 'Simplify the numerator, then the denominator, then divide. For both, the L.C.M. of the denominators is $pq$.'
        write: 'Solution'
      - say: 'Numerator. Over the L.C.M. $pq$, 1 over $p$ is $q$ over $pq$, and 1 over $q$ is $p$ over $pq$. Subtract the tops.'
        write: 'Numerator: $\dfrac{1}{p} - \dfrac{1}{q} = \dfrac{q - p}{pq}$'
      - say: 'Denominator. Over $pq$, $p$ over $q$ is $p$ squared over $pq$, and $q$ over $p$ is $q$ squared over $pq$.'
        write: 'Denominator: $\dfrac{p}{q} - \dfrac{q}{p} = \dfrac{p^{2} - q^{2}}{pq}$'
      - say: 'So the expression is the numerator divided by the denominator.'
        write: '$= \dfrac{q - p}{pq} \div \dfrac{p^{2} - q^{2}}{pq}$'
      - say: 'To divide by a fraction, multiply by its reciprocal.'
        write: '$= \dfrac{q - p}{pq} \times \dfrac{pq}{p^{2} - q^{2}}$'
      - say: 'Cancel the common factor $pq$, top and bottom.'
        write: '$= \dfrac{q - p}{p^{2} - q^{2}}$'
        point:
          - {line: 5, kind: strike, at: '= [[pq]]', text: 'cancel'}
          - {line: 5, kind: strike, at: 'q2[[pq]]'}
      - say: '$p$ squared minus $q$ squared is a difference of two squares, which is $p$ minus $q$, times $p$ plus $q$.'
        write: '$= \dfrac{q - p}{(p - q)(p + q)}$'
      - say: '$q$ minus $p$ is the negative of $p$ minus $q$, because changing the order of a subtraction changes the sign.'
        write: '$= \dfrac{-(p - q)}{(p - q)(p + q)}$'
      - say: 'Now cancel the common factor $p$ minus $q$. The minus sign stays.'
        write: '$\therefore$ Expression $= -\dfrac{1}{p + q}$'
      - section: 'Check'
        say: 'Check with $p$ equals 2 and $q$ equals 1. In the numerator, a half minus 1 is negative a half. In the denominator, 2 minus a half is 3 over 2.'
        write: '$\left(\tfrac{1}{2} - 1\right) \div \left(2 - \tfrac{1}{2}\right) = -\tfrac{1}{2} \div \tfrac{3}{2}$'
      - say: 'Negative a half divided by 3 over 2 is negative a third. And negative 1 over 2 plus 1 is negative a third. It matches.'
        write: '$= -\tfrac{1}{3}$ and $-\dfrac{1}{2 + 1} = -\tfrac{1}{3}\ \checkmark$'
      - say: 'So the expression simplifies to negative 1 over $p$ plus $q$, and that is option B.'
        write: '$\therefore -\dfrac{1}{p + q}$ (B)'
        answer: true
    traps:
      A: 'You went for 1 over $p$ minus $q$. The denominator factorises as $p$ minus $q$, times $p$ plus $q$, and it is $p$ minus $q$ that cancels, leaving $p$ plus $q$ below, with a minus sign.'
      C: 'You went for 1 over $pq$. The $pq$ cancels when we divide, because it is under both the numerator and the denominator.'
      D: 'You went for 1 over $pq$ times $p$ minus $q$. The $pq$ cancels between top and bottom, and so does $p$ minus $q$, leaving negative 1 over $p$ plus $q$.'
  20:
    moments:
      - section: 'The question'
        say: 'This is a quadratic inequality. Its answer is usually two stretches of the number line, not one, and the sign table shows which.'
        write: '$y^{2} - 3y > 18$'
      - say: 'Solution. First bring everything to one side, so we compare with zero. Subtract 18 from both sides.'
        write: 'Solution: $\ y^{2} - 3y - 18 > 0$'
      - section: 'Factorise'
        say: 'Factorise by product and sum. The product is 1 times minus 18, which is minus 18. The sum is minus 3. Minus 6 and plus 3 work, because they multiply to minus 18 and add to minus 3.'
        write: 'Product $= -18$, $\ $Sum $= -3$: $\ -6,\ +3$'
      - say: 'Split the middle term, minus $3y$, into minus $6y$ plus $3y$.'
        write: '$y^{2} - 6y + 3y - 18 > 0$'
      - say: 'Group in pairs. Take $y$ out of the first pair, and 3 out of the second. The brackets match.'
        write: '$y(y - 6) + 3(y - 6) > 0$'
      - say: 'Take out the common bracket, $y$ minus 6.'
        write: '$(y + 3)(y - 6) > 0$'
      - say: 'The critical values are where each bracket is zero, which is $y$ equals minus 3 and $y$ equals 6. They split the number line into three regions.'
        write: 'Critical values: $\ y = -3,\ \ y = 6$'
      - section: 'Sign table'
        say: 'Now the sign table. It has one column for each region and one row for each bracket, then a row for the product.'
        diagram:
          id: t
          kind: table
          columns: ['Factor', 'y < −3', '−3 < y < 6', 'y > 6']
          rows: [['y + 3', '', '', ''], ['y − 6', '', '', ''], ['product', '', '', '']]
      - say: '$y$ plus 3 is negative below minus 3, and positive above it.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,2', text: '−'}
          - {id: t, op: fill, part: 'cell:1,3', text: '+'}
          - {id: t, op: fill, part: 'cell:1,4', text: '+'}
      - say: '$y$ minus 6 is negative below 6, and positive above it.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:2,2', text: '−'}
          - {id: t, op: fill, part: 'cell:2,3', text: '−'}
          - {id: t, op: fill, part: 'cell:2,4', text: '+'}
      - say: 'Multiply the signs down each column. Minus times minus is plus. Plus times minus is minus. Plus times plus is plus.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:3,2', text: '+', colour: green}
          - {id: t, op: fill, part: 'cell:3,3', text: '−', colour: red}
          - {id: t, op: fill, part: 'cell:3,4', text: '+', colour: green}
      - section: 'Answer'
        say: 'We want the product greater than zero, which means positive. Those are the first and last columns.'
        write: '$\therefore\ y < -3$ or $y > 6$'
        point:
          - {line: 1, kind: underline, at: '> 0', text: 'positive'}
      - say: 'On a number line, put open circles at minus 3 and 6, because they are not included, with arrows pointing outwards.'
        diagram: {id: n, kind: numberline, range: [-6, 9]}
        diagram_do:
          - {id: n, op: interval, to: -3, to_open: true, text: 'y < −3', answer: true, 'on': 'open circles'}
          - {id: n, op: interval, from: 6, from_open: true, text: 'y > 6', answer: true, 'on': 'arrows'}
      - section: 'Check'
        say: 'Check with $y$ equals 7, where 49 minus 21 is 28, more than 18. And $y$ equals 0, in the middle, gives 0, which is not more than 18.'
        write: 'Check: $\ y = 7$: $49 - 21 = 28 > 18\ \checkmark$; $\ y = 0$: $0 > 18\ \times$'
      - say: 'So $y$ is less than minus 3 or greater than 6, which is option B.'
        write: '$y < -3$ or $y > 6$'
        answer: true
    traps:
      A: 'You went for minus 2 less than $y$ less than 6. A region between the roots is where the product is negative, and minus 2 is not even a critical value. Test $y = 0$, and it fails.'
      C: 'You went for $y$ greater than minus 3 or greater than 6. That includes $y = 0$, which fails. The sign table gives $y$ less than minus 3 on the left.'
      D: 'You went for $y$ less than minus 3 or less than 6. That also includes $y = 0$, which fails. The sign table gives $y$ greater than 6 on the right.'
  21:
    moments:
      - section: 'The question'
        say: '$x$ is in a denominator, and $x$ is negative. Multiplying across could reverse the sign. So we bring everything to one side and let a sign table decide.'
        write: '$\dfrac{x + 1}{3} > \dfrac{1}{x + 3},\quad x < 0$'
      - say: 'Solution. Subtract 1 over $x$ plus 3 from both sides, so we compare with zero.'
        write: 'Solution: $\ \dfrac{x + 1}{3} - \dfrac{1}{x + 3} > 0$'
      - say: 'Make one fraction. The L.C.M. of the denominators is 3 times $x$ plus 3.'
        write: '$\dfrac{(x + 1)(x + 3) - 3}{3(x + 3)} > 0$'
      - say: 'Open the brackets on top. $x$ plus 1 times $x$ plus 3 is $x$ squared plus $4x$ plus 3. Minus 3 leaves $x$ squared plus $4x$.'
        write: '$\dfrac{x^{2} + 4x + 3 - 3}{3(x + 3)} = \dfrac{x^{2} + 4x}{3(x + 3)} > 0$'
      - say: 'Factorise the top by taking out $x$.'
        write: '$\dfrac{x(x + 4)}{3(x + 3)} > 0$'
      - say: 'The critical values are where $x$ is zero at 0, $x$ plus 4 at minus 4, and $x$ plus 3 at minus 3. The 3 outside is positive, so it never changes the sign.'
        write: 'Critical values: $\ x = -4,\ \ x = -3,\ \ x = 0$'
      - section: 'Sign table'
        say: 'Now the sign table, with four regions. Each factor is negative to the left of its critical value and positive to the right.'
        diagram:
          id: t
          kind: table
          columns: ['Factor', 'x < −4', '−4 < x < −3', '−3 < x < 0', 'x > 0']
          rows: [['x', '−', '−', '−', '+'], ['x + 4', '−', '+', '+', '+'], ['x + 3', '−', '−', '+', '+'], ['fraction', '', '', '', '']]
      - say: 'Now the fraction, column by column. Below minus 4, minus times minus over minus is minus. Between minus 4 and minus 3, minus times plus over minus is plus.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:4,2', text: '−'}
          - {id: t, op: fill, part: 'cell:4,3', text: '+', colour: green}
      - say: 'Between minus 3 and 0, minus times plus over plus is minus. Above 0, all are plus, so plus.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:4,4', text: '−'}
          - {id: t, op: fill, part: 'cell:4,5', text: '+'}
      - section: 'Answer'
        say: 'The fraction is positive in two columns.'
        write: '$-4 < x < -3$ or $x > 0$'
      - say: 'But the question says $x$ is negative, so $x$ greater than 0 is ruled out.'
        write: '$x < 0$: $\ \therefore\ -4 < x < -3$'
      - say: 'On a number line, put open circles at minus 4 and minus 3, and shade the stretch between.'
        diagram: {id: n, kind: numberline, range: [-6, 1]}
        diagram_do:
          - {id: n, op: interval, from: -4, to: -3, from_open: true, to_open: true, text: '−4 < x < −3', answer: true, 'on': 'open circles'}
      - section: 'Check'
        say: 'Check $x$ equals minus 3.5. Minus 2.5 over 3 is about minus 0.83. 1 over minus 0.5 is minus 2. Minus 0.83 is greater than minus 2.'
        write: 'Check $x = -3.5$: $\ \dfrac{-2.5}{3} \approx -0.83 > \dfrac{1}{-0.5} = -2\ \checkmark$'
      - say: 'So $x$ lies between minus 4 and minus 3, option B.'
        write: '$-4 < x < -3$'
        answer: true
    traps:
      A: 'You went for 3 less than $x$ less than 4. The question says $x$ is negative, so positive values are ruled out. The sign table gives minus 4 less than $x$ less than minus 3.'
      C: 'You went for minus 2 less than $x$ less than minus 1. That is in the column from minus 3 to 0, where the fraction is negative. Try $x = -1.5$. The left is about minus 0.17 and the right about 0.67, so it fails.'
      D: 'You went for minus 3 less than $x$ less than zero. In that column the fraction is negative. Try $x = -1$. Then 0 is not greater than a half.'
  22:
    moments:
      - section: 'The question'
        say: 'A man starts on ₦540 a month, and after each six months his monthly salary rises by ₦36. We want his salary in the eighth month of the third year.'
        doodle: {name: 'custom:1993_q22_a', id: stairs, caption: '₦36 more every 6 months', size: scene}
        write: 'Start ₦540 a month; $+$₦36 after each 6 months; month 8 of year 3 $= ?$'
      - section: 'Solution'
        say: 'Solution. The salary goes up by the same amount each time, so the salaries form an arithmetic progression. The first term, $a$, is 540, and the common difference, $d$, is 36.'
        write: 'Solution: A.P. with $a = 540,\ d = 36$'
      - section: 'Which term?'
        say: 'First find the month, counting from the very start. Two full years is 2 times 12, which is 24 months, and 8 more months makes 32.'
        write: 'Month number $= 2 \times 12 + 8 = 32$'
      - say: 'Each salary lasts 6 months. 32 divided by 6 is 5, remainder 2. So 5 full periods have passed, and month 32 is in the 6th period.'
        write: '$32 \div 6 = 5$ remainder $2$ $\ \therefore n = 6$'
        doodle_do:
          - {id: stairs, op: move, part: man, path: up1}
      - section: 'The nth term'
        say: 'The $n$th term of an A.P. is $a$ plus, bracket, $n$ minus 1, times $d$.'
        write: '$T_{n} = a + (n - 1)d$'
      - say: 'Substitute $a$ equals 540, $n$ equals 6 and $d$ equals 36.'
        write: '$T_{6} = 540 + (6 - 1) \times 36$'
        doodle_do:
          - {id: stairs, op: move, part: man, path: up2}
      - say: '6 minus 1 is 5, which is five rises. 5 times 36 is 180.'
        write: '$= 540 + 5 \times 36 = 540 + 180$'
        doodle_do:
          - {id: stairs, op: highlight, part: rises}
      - say: '540 plus 180 is 720.'
        write: '$= 720$'
        doodle_do:
          - {id: stairs, op: label, part: last, text: '₦720'}
      - section: 'Check'
        say: 'To check, the 6th period starts after 5 periods of 6 months, at month 31, and runs to month 36. Month 32 is inside it.'
        write: 'Check: 6th period $=$ months $31$ to $36$, which contains month $32\ \checkmark$'
      - say: 'Therefore his salary in the eighth month of the third year is ₦720.00, which is option C.'
        write: '$\therefore$ salary $=$ ₦720.00'
        answer: true
    traps:
      A: 'You went for ₦828. That is 8 rises, 540 plus 288. Month 32 is in the 6th period, so only 6 minus 1, which is 5 rises, have happened.'
      B: 'You went for ₦756. That uses $n$ in place of $n - 1$, giving six rises. The first period has no rise, so $T_{6} = 540 + 5 \times 36$.'
      D: 'You went for ₦684. That is $T_{5}$, the salary for months 25 to 30. Month 32 is in the 6th period, which pays ₦720.'
  23:
    moments:
      - section: 'The question'
        say: '$k$ plus 1, $2k$ minus 1 and $3k$ plus 1 are three terms in a row of a G.P. We want the possible common ratios, not $k$. Many students stop at $k$.'
        write: '$k + 1,\ 2k - 1,\ 3k + 1$ in G.P.; $\ r = ?$'
      - section: 'Solution'
        say: 'Solution. In a G.P., the second term over the first equals the third term over the second. Both give the common ratio.'
        write: 'Solution: $\dfrac{T_{2}}{T_{1}} = \dfrac{T_{3}}{T_{2}}$'
      - say: 'Substitute the three terms.'
        write: '$\dfrac{2k - 1}{k + 1} = \dfrac{3k + 1}{2k - 1}$'
      - say: 'Cross multiply, so $2k$ minus 1 times $2k$ minus 1, equals $k$ plus 1 times $3k$ plus 1.'
        write: '$(2k - 1)^{2} = (k + 1)(3k + 1)$'
      - say: 'Expand the left. $2k$ squared is $4k$ squared, twice $2k$ times negative 1 is negative $4k$, and negative 1 squared is 1.'
        write: '$4k^{2} - 4k + 1 = (k + 1)(3k + 1)$'
      - say: 'Expanding the right gives $3k$ squared, plus $k$, plus $3k$, plus 1. $k$ plus $3k$ is $4k$.'
        write: '$4k^{2} - 4k + 1 = 3k^{2} + 4k + 1$'
      - say: 'Collect like terms on the left. $4k$ squared minus $3k$ squared is $k$ squared. Negative $4k$ minus $4k$ is negative $8k$. 1 minus 1 is 0.'
        write: '$k^{2} - 8k = 0$'
      - say: 'Factorise, because $k$ is a common factor.'
        write: '$k(k - 8) = 0$'
      - say: 'Either $k$ equals 0, or $k$ minus 8 equals 0.'
        write: 'Either $k = 0$ or $k - 8 = 0$'
      - say: 'Therefore $k$ is 0 or 8.'
        write: '$\therefore\ k = 0$ or $k = 8$'
      - section: 'The common ratios'
        say: 'When $k$ is 0, the terms are 0 plus 1, 0 minus 1, 0 plus 1, which is 1, negative 1, 1. The ratio is negative 1 over 1.'
        write: '$k = 0$: $\ 1,\ -1,\ 1$; $\ r = \dfrac{-1}{1} = -1$'
      - say: 'When $k$ is 8, the terms are 9, 15 and 25. The ratio is 15 over 9, which is 5 over 3.'
        write: '$k = 8$: $\ 9,\ 15,\ 25$; $\ r = \dfrac{15}{9} = \dfrac{5}{3}$'
        doodle: {name: 'custom:1993_q23_a', id: piles, caption: '9, 15, 25'}
      - say: 'Therefore the common ratio is negative 1 or 5 over 3.'
        write: '$\therefore\ r = -1$ or $r = \dfrac{5}{3}$'
      - section: 'Check'
        say: 'Check the second G.P. with the next pair, and 25 over 15 is also 5 over 3. Each pile is 5 over 3 times the one before.'
        write: 'Check: $\dfrac{25}{15} = \dfrac{5}{3}\ \checkmark$'
        doodle_do:
          - {id: piles, op: label, part: ratio, text: '× 5/3 each time'}
      - say: 'Therefore the possible common ratios are negative 1 and 5 over 3, which is answer choice B.'
        write: '$\therefore\ r = -1,\ \dfrac{5}{3}$'
        answer: true
    traps:
      A: 'You went for 0 and 8. Those are the values of $k$, not the ratios. Put each $k$ back into the terms and divide the second term by the first.'
      C: 'You went for 2 and 3. Cross multiplying gives $k$ squared minus $8k$ equals 0, so $k$ is 0 or 8, and the ratios from those are negative 1 and 5 over 3.'
      D: 'You went for 1 and negative 1. Negative 1 is right, from $k$ equal to 0. But $k$ equal to 8 gives 9, 15 and 25, with ratio 5 over 3, not 1.'
  24:
    moments:
      - section: 'The question'
        say: 'Star means $x$ to the power $y$, and $x$ star 2 equals $x$. Many students divide by $x$ here and lose one of the two answers. Let us keep both.'
        write: '$x * y = x^{y}$. If $x * 2 = x$, find $x$.'
      - say: 'Solution. First, write the definition line, so we can substitute into it.'
        write: 'Solution: $x * y = x^{y}$'
        doodle: {name: 'custom:1993_q24_a', id: star, caption: 'x * y = x to the power y'}
      - section: 'Substitute'
        say: 'Put 2 in place of $y$. The number after the star becomes the power, so $x$ star 2 is $x$ squared. In the picture, $x$ and 2 give $x$ squared.'
        write: '$x * 2 = x^{2}$'
        doodle_do:
          - {id: star, op: pulse, part: output}
      - say: 'We are told $x$ star 2 equals $x$. So $x$ squared equals $x$.'
        write: '$\therefore x^{2} = x$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: 'x2'}, at: 'x2', text: 'from here'}
      - section: 'Solve'
        say: 'Be careful, and do not divide both sides by $x$, or you lose $x$ equals 0. Instead, subtract $x$ from both sides.'
        write: '$x^{2} - x = 0$'
      - say: 'Both terms have $x$, so factorise, and $x$ times, bracket, $x$ minus 1, equals 0.'
        write: '$x(x - 1) = 0$'
      - say: 'A product is zero when one of its factors is zero. Either $x$ equals 0, or $x$ minus 1 equals 0.'
        write: 'Either $x = 0$ or $x - 1 = 0$'
      - say: 'From the second one, add 1 to both sides, so $x$ equals 1. Therefore $x$ is 0 or 1.'
        write: '$\therefore x = 0$ or $x = 1$'
        doodle_do:
          - {id: star, op: label, part: output, text: 'x = 0 or 1'}
      - section: 'Check'
        say: 'Check $x$ equals 0. 0 star 2 is 0 squared, which is 0. That equals $x$.'
        write: 'Check: $0 * 2 = 0^{2} = 0\ \checkmark$'
      - say: 'Check $x$ equals 1, and 1 star 2 is 1 squared, which is 1. That equals $x$ too.'
        write: '$1 * 2 = 1^{2} = 1\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the possible values of $x$ are 0 and 1, which is option A.'
        write: '$\therefore x = 0, 1$'
        answer: true
    traps:
      B: 'You went for 1 and 2. Test 2. Then 2 star 2 is 2 squared, which is 4, not 2. From $x(x - 1) = 0$, the values are 0 and 1.'
      C: 'You went for 2 and 2. 2 star 2 is 2 squared, which is 4, not 2, so 2 is not a solution at all.'
      D: 'You went for 0 and 2. 0 is right, but 2 squared is 4, not 2. The other factor, $x - 1 = 0$, gives 1.'
  25:
    moments:
      - section: 'The question'
        say: 'A rectangle sits inside a regular pentagon, and it cuts off a small triangle in the corner at $T$. Two angles of that triangle give us the third.'
        write: '$PQRST$ regular, $PQVU$ a rectangle, $\angle TUP = ?$'
        point:
          - {figure: 0, kind: circle, target: U, text: 'on TS'}
          - {figure: 0, kind: circle, target: V, text: 'on SR'}
          - {figure: 0, kind: arc, target: TUP, text: '?'}
      - section: 'Solution'
        say: 'Solution. We work in triangle $TUP$. First we find each interior angle of the pentagon, through the exterior angle.'
        write: 'Solution'
        point:
          - {figure: 0, kind: highlight, target: TU}
          - {figure: 0, kind: highlight, target: UP}
          - {figure: 0, kind: highlight, target: TP}
      - say: 'The exterior angles of any polygon add up to 360 degrees. A regular pentagon has 5 equal ones, so each is 360 over 5, which is 72 degrees.'
        write: 'Ext. $\angle = \dfrac{360^{\circ}}{5} = 72^{\circ}$ (sum of ext. $\angle$s $= 360^{\circ}$)'
      - say: 'At each corner, the interior and exterior angles lie on a straight line. So the interior angle is 180 minus 72, which is 108.'
        write: 'Int. $\angle = 180^{\circ} - 72^{\circ} = 108^{\circ}$ ($\angle$s on a str. line)'
      - say: '$U$ lies on $TS$, so the triangle''s angle at $T$ is the pentagon''s angle there, 108 degrees.'
        write: '$\angle PTU = 108^{\circ}$ (int. $\angle$ of reg. pentagon)'
        point:
          - {figure: 0, kind: arc, target: PTU, text: '108°'}
      - say: 'At $P$, the pentagon''s angle $TPQ$ is also 108 degrees.'
        write: '$\angle TPQ = 108^{\circ}$ (int. $\angle$ of reg. pentagon)'
        point:
          - {figure: 0, kind: arc, target: TPQ, text: '108°'}
      - say: '$PQVU$ is a rectangle, so its corner at $P$ is a right angle. The reason is the angle of a rectangle.'
        write: '$\angle UPQ = 90^{\circ}$ ($\angle$ of rectangle)'
        point:
          - {figure: 0, kind: arc, target: UPQ, text: '90°'}
      - say: 'The rectangle takes 90 of the 108 degrees at $P$. What is left, between $PT$ and $PU$, is 108 minus 90, which is 18.'
        write: '$\angle TPU = 108^{\circ} - 90^{\circ} = 18^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: TPU, text: '18°'}
      - say: 'Now the three angles of triangle $TUP$ add up to 180 degrees. The reason is the angle sum of a triangle.'
        write: '$\angle TUP + 108^{\circ} + 18^{\circ} = 180^{\circ}$ ($\angle$ sum of $\triangle$)'
      - say: '108 plus 18 is 126. Take it to the other side, so 180 minus 126.'
        write: '$\angle TUP = 180^{\circ} - 126^{\circ}$'
      - say: '180 minus 126 is 54 degrees.'
        write: '$\angle TUP = 54^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: TUP, text: '54°'}
      - section: 'Check'
        say: 'Check with the five-sided figure $PTUVQ$. Its angles are 108 at $P$, 108 at $T$, 54 plus 90, which is 144, at $U$, and the right angles at $V$ and $Q$.'
        write: '$108^{\circ} + 108^{\circ} + 144^{\circ} + 90^{\circ} + 90^{\circ} = 540^{\circ}$'
      - say: 'The angles of any five-sided figure add up to 5 minus 2, times 180, which is 540. It works.'
        write: '$(5 - 2) \times 180^{\circ} = 540^{\circ}\ \checkmark$ (sum of int. $\angle$s)'
      - say: 'Therefore angle $TUP$ is 54 degrees, option B.'
        write: '$\therefore \angle TUP = 54^{\circ}$ (B)'
        answer: true
        point:
          - {figure: 0, kind: arc, target: TUP, text: '54°'}
    traps:
      A: 'You went for 18 degrees. That is angle $TPU$, the angle at $P$ in the triangle. The question wants the angle at $U$, and 180 minus 108 minus 18 is 54.'
      C: 'You went for 90 degrees. That is the rectangle''s corner at $U$, between $UP$ and $UV$. Angle $TUP$ is between $UT$ and $UP$, and it is 180 minus 126, which is 54.'
      D: 'You went for 108 degrees. That is the pentagon''s interior angle, which sits at $T$. Use it in the triangle''s angle sum to find the angle at $U$, 54.'
  26:
    moments:
      - section: 'The question'
        say: 'Every corner of this polygon is 150 degrees. How many corners? The quick road goes through the outside angle, not the inside one.'
        write: 'Int. $\angle = 150^{\circ}$, $n = ?$'
      - section: 'Solution'
        say: 'Solution. Let me draw one corner of the polygon, with one side extended to show the exterior angle.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '150°', text: 'interior'}
      - say: 'The interior and exterior angles at a corner lie on a straight line. So the exterior angle is 180 minus 150, which is 30 degrees.'
        write: 'Ext. $\angle = 180^{\circ} - 150^{\circ} = 30^{\circ}$ ($\angle$s on a str. line)'
        doodle: {name: 'custom:1993_q26_a', id: walk, caption: 'turn at every corner'}
        doodle_do:
          - {id: walk, op: label, part: turn, text: '30°'}
        point:
          - {figure: sketch, kind: circle, target: '30°', text: 'exterior'}
      - say: 'Walk once round any polygon, like the walker here, and you turn through one full circle. So the exterior angles add up to 360 degrees. In a regular polygon they are all equal.'
        write: '$n = \dfrac{360^{\circ}}{\text{ext. } \angle}$ (sum of ext. $\angle$s $= 360^{\circ}$)'
        doodle_do:
          - {id: walk, op: pulse, part: walker}
      - say: 'Put in the exterior angle, 30 degrees. 360 divided by 30 is 12.'
        write: '$n = \dfrac{360}{30} = 12$'
        doodle_do:
          - {id: walk, op: stage, stage: 'custom:1993_q26_a2'}
        point:
          - {figure: sketch, kind: circle, target: 'n = ?', text: '12'}
      - section: 'Check'
        say: 'Check with the interior angles. The sum is $n$ minus 2, times 180. 12 minus 2 is 10, and 10 times 180 is 1800.'
        write: 'Sum of int. $\angle$s $= (12 - 2) \times 180^{\circ} = 1800^{\circ}$'
      - say: 'Share 1800 among the 12 equal corners, and 1800 divided by 12 is 150, the angle we were given.'
        write: 'Each int. $\angle = \dfrac{1800^{\circ}}{12} = 150^{\circ}\ \checkmark$'
      - say: 'Therefore the polygon has 12 sides, option A.'
        write: '$\therefore n = 12$ (A)'
        answer: true
    traps:
      B: 'You went for 10. A regular 10-sided polygon has exterior angles of 36 degrees, so interior angles of 180 minus 36, which is 144, not 150.'
      C: 'You went for 9. Its exterior angles are 40 degrees, so its interior angles are 140. We need an exterior angle of 30, and 360 divided by 30 is 12.'
      D: 'You went for 8. Its interior angles are 135 degrees. Find the exterior angle first. 180 minus 150 is 30, then divide 360 by 30.'
  27:
    moments:
      - section: 'The question'
        say: 'An arc is part of the edge of a circle, like the crust of one slice of pizza. We want the length of the arc that makes 22 and a half degrees at the centre.'
        write: 'Find the length of the arc.'
        doodle: {name: 'custom:1993_q27_a', id: pizza, caption: 'the crust of one slice'}
      - say: 'Write Solution, then draw the circle with diameter 8 cm, centre O, and the arc AB with its angle at O.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: arc, target: AOB, text: '22½°', 'on': 'its angle at O'}
      - section: 'What we know'
        say: 'List the givens. The diameter d is 8 cm, and theta is 22 and a half degrees.'
        write: '$d = 8$ cm, $\theta = 22\tfrac{1}{2}^{\circ}$'
      - say: 'The formula needs the radius, not the diameter. The radius is half the diameter, so 8 over 2 is 4.'
        write: '$r = \dfrac{8}{2} = 4$ cm'
        point:
          - {figure: sketch, kind: circle, target: 'diameter 8 cm', text: 'r = 4 cm', 'on': '8 over 2'}
      - section: 'The formula'
        say: 'The formula for arc length is L equals theta over 360, times 2 pi r.'
        write: '$L = \dfrac{\theta}{360} \times 2\pi r$'
      - say: 'Substitute, so theta is 22 and a half, which is 22.5, and r is 4.'
        write: '$L = \dfrac{22.5}{360} \times 2 \times \pi \times 4$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '= 4'}, at: '× 4', text: 'r', 'on': 'r is 4'}
      - section: 'Simplify'
        say: 'Double top and bottom to clear the decimal, which gives 45 over 720. And 2 times 4 is 8.'
        write: '$= \dfrac{45}{720} \times 8\pi$'
      - say: '45 goes into 720 sixteen times, so the fraction is 1 over 16, which is one slice of a pizza cut into 16.'
        write: '$= \dfrac{1}{16} \times 8\pi$'
        doodle_do:
          - {id: pizza, op: highlight, part: slice, text: '1 of 16', 'on': 'one slice'}
      - say: '8 pi over 16 is pi over 2.'
        write: '$= \dfrac{8\pi}{16} = \dfrac{\pi}{2}$'
      - say: 'Therefore the arc is pi over 2 centimetres.'
        write: '$\therefore$ arc $AB = \dfrac{\pi}{2}$ cm'
        doodle_do:
          - {id: pizza, op: label, part: crust, text: 'π/2 cm', 'on': 'Therefore'}
        point:
          - {figure: sketch, kind: label, target: '?', text: 'π/2 cm', 'on': 'Therefore'}
      - section: 'Check'
        say: 'To check, 16 such arcs go round the whole circle. 16 times pi over 2 is 8 pi, and 2 pi r is 2 times pi times 4, also 8 pi.'
        write: 'Check: $16 \times \dfrac{\pi}{2} = 8\pi = 2\pi(4)$ ✓'
      - section: 'Answer'
        say: 'So the arc is pi over 2 centimetres, which is answer choice D.'
        write: '$\therefore L = \dfrac{\pi}{2}$ cm (D)'
        answer: true
    traps:
      A: 'You went for 2 pi. That is a quarter of the circumference, the arc for 90 degrees. Our angle is 22 and a half degrees, 1 over 16 of 360, so L is 1 over 16 of 8 pi, which is pi over 2.'
      B: 'You went for pi. That uses 8 as the radius. 8 is the diameter, so r is 4, 2 pi r is 8 pi, and 1 over 16 of it is pi over 2.'
      C: 'You went for 2 pi over 3. Recheck the fraction. 22.5 over 360 is exactly 1 over 16, and 1 over 16 of 8 pi is pi over 2.'
  28:
