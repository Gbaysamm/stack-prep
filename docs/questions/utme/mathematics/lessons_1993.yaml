      C: 'You went for 3 centimetres. Then $4\pi r^2$ is 4 times 22 over 7 times 9, which is about 113, not 154.'
      D: 'You went for 1.75 centimetres. That''s half the radius. Solving $4\pi r^2 = 154$ gives $r^2 = 12.25$, so $r = 3.5$.'
  37:
    moments:
