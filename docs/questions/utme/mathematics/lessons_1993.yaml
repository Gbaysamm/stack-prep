  39:
    moments:
      - say: 'We''re told sine theta equals cos theta, and we want theta between 0 and 360 degrees.'
        write: '$\sin\theta = \cos\theta$'
      - say: 'Let me sketch the graph, so we can see its shape.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'sin θ'}
          - {figure: sketch, kind: circle, target: 'cos θ'}
      - say: 'Two different ratios are hard to solve together, so let''s turn this into just one. Divide both sides by cos theta.'
        write: '$\dfrac{\sin\theta}{\cos\theta} = \dfrac{\cos\theta}{\cos\theta}$'
      - say: 'Sine over cos is tan. That is the rule we use.'
        write: '$\tan\theta = \dfrac{\sin\theta}{\cos\theta}$'
      - say: 'Sine over cos is tan, and cos over cos is 1.'
        write: '$\tan\theta = 1$'
      - say: 'The first angle whose tan is 1 is 45 degrees. Think of a right-angled triangle with two equal sides: opposite over adjacent is 1, and its angles are 45 degrees.'
        write: 'First solution: $\theta = 45^{\circ}$'
        doodle: {name: 'custom:1993_q39_a', id: tri, caption: 'equal legs: tan is 1'}
        doodle_do:
          - {id: tri, op: label, part: angle, text: '45°'}
        point:
          - {figure: sketch, kind: circle, target: '45°', text: 'first'}
      - say: 'Tan repeats every 180 degrees. So the next solution is 45 plus 180, which is 225.'
        write: 'Next: $\theta = 45^{\circ} + 180^{\circ} = 225^{\circ}$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '45∘'}, at: '45∘', text: 'first one'}
          - {figure: sketch, kind: circle, target: '225°', text: '45° + 180°'}
      - say: 'The one after that would be 225 plus 180, which is 405. That''s past 360, so we stop.'
        write: '$225^{\circ} + 180^{\circ} = 405^{\circ} > 360^{\circ}$'
      - say: 'Let''s check 45 degrees in the original equation. Sine 45 and cos 45 are both root 2 over 2, so they are equal.'
        write: 'Check: $\sin 45^{\circ} = \cos 45^{\circ} = \dfrac{\sqrt{2}}{2}$'
      - say: 'Now 225 degrees. It''s between 180 and 270, where sine and cos are both negative. Both are negative root 2 over 2, so they are equal too.'
        write: '$\sin 225^{\circ} = \cos 225^{\circ} = -\dfrac{\sqrt{2}}{2}$'
      - say: 'So theta is 45 degrees and 225 degrees, which is answer choice A.'
        write: 'Answer: $\theta = 45^{\circ},\ 225^{\circ}$'
        answer: true
    traps:
      B: 'You went for 135 and 315. At those angles, tan is negative 1: sine and cos are the same size but opposite signs, so they are not equal.'
      C: 'You went for 45 and 315. At 315, sine is negative but cos is positive. Tan repeats every 180 degrees, so the second angle is 225.'
      D: 'You went for 135 and 225. At 135, sine is positive but cos is negative. The first solution of tan theta equals 1 is 45.'
  40:
    moments:
      - say: 'In the figure, $TH$ is a tower. From $P$ the angle of elevation of $T$ is 30 degrees, and from $Q$ it''s 45 degrees. $PQ$ is 5 metres. We want $TH$.'
        write: '$PQ = 5, \quad \angle P = 30^{\circ}, \quad \angle Q = 45^{\circ}$'
        point:
          - {figure: 0, kind: highlight, target: PQ, text: '5 m'}
      - say: 'There are two right-angled triangles, $TQH$ and $TPH$, and they share the height $TH$. In each one we''ll use tan, which is the opposite side over the adjacent side.'
        write: '$\tan(\text{angle}) = \dfrac{\text{opposite}}{\text{adjacent}}$'
        point:
          - {figure: 0, kind: highlight, target: TH, text: 'shared height'}
      - say: 'Start at $Q$, where the angle is 45 degrees. The side opposite it is $TH$, and the side next to it is $QH$.'
        write: 'From $Q$: $\tan 45^{\circ} = \dfrac{TH}{QH}$'
        point:
          - {figure: 0, kind: arc, target: TQH, text: '45°'}
          - {figure: 0, kind: underline, target: QH, text: 'adjacent'}
      - say: 'Tan 45 is 1. So $TH$ over $QH$ is 1, which means $QH$ equals $TH$: the ground distance is the same as the height.'
        write: '$\dfrac{TH}{QH} = 1 \Rightarrow QH = TH$'
        point:
          - {figure: 0, kind: 'highlight', target: 'QH'}
          - {figure: 0, kind: 'highlight', target: 'TH', text: 'QH = TH'}
      - say: 'Now from $P$. Its ground distance is $PH$, which is $PQ$ plus $QH$. $PQ$ is 5, and we just found $QH$ is $TH$, so $PH$ is 5 plus $TH$.'
        write: '$PH = PQ + QH = 5 + TH$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: 'QH = [[TH]]'}, at: '5 + [[TH]]', text: 'QH is TH'}
          - {figure: 0, kind: underline, target: PH, text: '5 + TH'}
      - say: 'At $P$ the angle is 30 degrees, so tan 30 equals $TH$ over $PH$, which is $TH$ over 5 plus $TH$.'
        write: 'From $P$: $\tan 30^{\circ} = \dfrac{TH}{5 + TH}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '= [[5 + TH]]'}, at: '5 + TH', text: 'PH'}
          - {figure: 0, kind: arc, target: TPH, text: '30°'}
      - say: 'Tan 30 is 1 over root 3.'
        write: '$\dfrac{TH}{5 + TH} = \dfrac{1}{\sqrt{3}}$'
      - say: 'Cross-multiply. $TH$ times root 3 equals 1 times 5 plus $TH$.'
        write: '$\sqrt{3}\,TH = 5 + TH$'
      - say: 'Subtract $TH$ from both sides to get the $TH$ terms together.'
        write: '$\sqrt{3}\,TH - TH = 5$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '+ TH'}, at: '− TH', text: 'across the ='}
      - say: 'Both terms on the left contain $TH$, so factor it out.'
        write: '$TH(\sqrt{3} - 1) = 5$'
      - say: 'Divide both sides by root 3 minus 1.'
        write: '$TH = \dfrac{5}{\sqrt{3} - 1}$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '3 − 1'}, at: '3 − 1', text: 'divide'}
      - say: 'A size check: root 3 is about 1.73, so the bottom is about 0.73, and 5 over 0.73 is about 6.8 metres. A sensible height.'
        write: 'Check: $\dfrac{5}{1.73 - 1} = \dfrac{5}{0.73} \approx 6.8$'
        point:
          - {figure: 0, kind: 'label', target: 'TH', text: '≈ 6.8 m'}
      - say: 'So $TH$ is 5 over root 3 minus 1, which is answer choice B.'
        write: 'Answer: $TH = \dfrac{5}{\sqrt{3} - 1}$'
        answer: true
    traps:
      A: 'You went for 5 over root 3 plus 1. The sign slipped when collecting the $TH$ terms: root 3 $TH$ minus $TH$ is $TH(\sqrt{3} - 1)$. That option is only about 1.8 metres, far too short.'
      C: 'You went for 5 over root 3. That uses only the 30 degree triangle with a base of 5. But the base from $P$ is 5 plus $QH$, not just 5.'
      D: 'You went for root 3 over 5. That''s upside down. Set up tan 30 as $TH$ over $5 + TH$ and solve for $TH$.'
  41:
    moments:
      - say: 'Two angles of a triangle are 30 degrees each, and the longest side is 10 centimetres. We want the length of each of the other sides.'
        write: 'Angles $30^{\circ}$, $30^{\circ}$; longest side $= 10$ cm'
      - say: 'Let me draw the triangle.'
        show_sketch: true
        point:
          - {figure: sketch, kind: arc, target: CAB, text: '30°'}
          - {figure: sketch, kind: arc, target: CBA, text: '30°'}
      - say: 'First, the third angle. The angles of a triangle add up to 180, so it''s 180 minus 30 minus 30, which is 120 degrees.'
        write: 'Third angle $= 180^{\circ} - 30^{\circ} - 30^{\circ} = 120^{\circ}$'
        point:
          - {figure: sketch, kind: circle, target: '120°'}
      - say: 'The longest side always faces the largest angle. So the 10 centimetre side is the one opposite the 120 degree angle.'
        write: 'Side facing $120^{\circ}$: $10$ cm'
        point:
          - {figure: sketch, kind: highlight, target: AB, text: '10 cm'}
      - say: 'The other two sides face the two 30 degree angles, so they are equal to each other. Let''s call each one $x$.'
        write: 'Each side facing $30^{\circ}$: $x$'
        point:
          - {figure: sketch, kind: highlight, target: AC, text: 'x'}
          - {figure: sketch, kind: highlight, target: BC, text: 'x'}
      - say: 'The sine rule: each side divided by the sine of the angle opposite it gives the same number.'
        write: 'Sine rule: $\dfrac{a}{\sin A} = \dfrac{b}{\sin B} = \dfrac{c}{\sin C}$'
      - say: 'The sine rule says each side over the sine of the angle it faces gives the same number. So $x$ over sine 30 equals 10 over sine 120.'
        write: '$\dfrac{x}{\sin 30^{\circ}} = \dfrac{10}{\sin 120^{\circ}}$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: ': [[x]]'}, at: 'x', text: 'faces 30°'}
          - {line: 6, kind: move, from: {line: 3, at: '[[10]] cm'}, at: '∘[[10]]', text: 'faces 120°'}
          - {figure: 'sketch', kind: 'circle', target: '120°', text: 'faces 10 cm'}
      - say: 'Sine 30 is a half. Sine 120 is the same as sine 60, which is root 3 over 2.'
        write: '$\dfrac{x}{\tfrac{1}{2}} = \dfrac{10}{\tfrac{\sqrt{3}}{2}}$'
      - say: 'To get $x$ alone, multiply both sides by a half.'
        write: '$x = \dfrac{10 \times \tfrac{1}{2}}{\tfrac{\sqrt{3}}{2}}$'
      - say: '10 times a half is 5. And dividing by root 3 over 2 means multiplying by 2 over root 3. 5 times 2 is 10.'
        write: '$= 5 \times \dfrac{2}{\sqrt{3}} = \dfrac{10}{\sqrt{3}}$'
      - say: 'Now rationalise: multiply the top and bottom by root 3. Root 3 times root 3 is 3.'
        write: '$= \dfrac{10}{\sqrt{3}} \times \dfrac{\sqrt{3}}{\sqrt{3}} = \dfrac{10\sqrt{3}}{3}$'
      - say: 'That''s about 5.8 centimetres. It makes sense: two of these sides together, about 11.5, are a little longer than 10, so they can meet.'
        write: 'Check: $\dfrac{10\sqrt{3}}{3} \approx 5.77$, and $2 \times 5.77 \approx 11.5 > 10$'
      - say: 'So each of the other sides is 10 root 3 over 3 centimetres, which is answer choice D.'
        write: 'Answer: $\dfrac{10\sqrt{3}}{3}$ cm'
        answer: true
    traps:
      A: 'You went for 5 centimetres. Two sides of 5 add up to exactly 10, which would make a flat line, not a triangle. The sine rule gives 10 over root 3.'
      B: 'You went for 4 centimetres. Two sides of 4 add to only 8, less than 10, so they couldn''t even meet. Use the sine rule with the 120 degree angle.'
      C: 'You went for 3 root 3, about 5.2. Check the sine rule: $x$ equals 10 times sine 30 over sine 120, which is 10 over root 3, about 5.8.'
  42:
    moments:
      - say: 'Quantities in the proportions 1, 4, 6 and 7 go in a pie chart. We want the angle of the sector for the proportion 7.'
        write: 'Proportions $1 : 4 : 6 : 7$'
