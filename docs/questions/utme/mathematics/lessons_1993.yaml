      - say: 'Divide the top and bottom by 6. 198 divided by 6 is 33, and 42 divided by 6 is 7.'
        write: '$= \dfrac{33}{7}$'
      - say: '7 goes into 33 four times, which is 28, with 5 left over. And 5 over 7 is about 0.714. So it''s about 4.714.'
        write: '$= 4 + \dfrac{5}{7} \approx 4.714$'
      - say: 'To one decimal place, the digit after the 7 is 1, which is less than 5, so we round down: the slice is 4.7 square metres.'
        write: '$\approx 4.7\ \text{m}^{2}$'
        doodle_do:
