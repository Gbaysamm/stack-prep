        point:
          - {line: 2, kind: box, text: 'the rule'}
          - {line: 0, kind: highlight, text: 'given'}
      - say: '4 times 22 is 88, so the left side is 88 over 7, times $r$ squared.'
        write: '$\dfrac{4 \times 22}{7}r^{2} = \dfrac{88}{7}r^{2} = 154$'
      - say: 'Multiply both sides by 7 to clear the fraction. 154 times 7: 150 times 7 is 1050, and 4 times 7 is 28, so 1078.'
        write: '$88r^{2} = 154 \times 7 = 1078$'
      - say: 'Now divide both sides by 88 to get $r$ squared alone.'
        write: '$r^{2} = \dfrac{1078}{88}$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '[[88]]r2'}, at: '88', text: 'divide by 88'}
      - say: '88 times 12 is 1056, and 1078 minus 1056 is 22. 22 over 88 is a quarter. So it''s 12 and a quarter, which is 12.25.'
        write: '$= 12 + \dfrac{22}{88} = 12.25$'
      - say: 'Take the square root. 3.5 times 3.5 is 12.25, so $r$, the radius of the orange, is 3.5.'
        write: '$r = \sqrt{12.25} = 3.5$'
        doodle_do:
          - {id: peel, op: label, part: r, text: '3.5 cm'}
        point:
          - {figure: sketch, kind: circle, target: 'r = ?', text: '3.5 cm'}
          - {line: 8, kind: highlight, at: '3.5', to: {doodle: peel, part: r}}
      - say: 'Let''s check by working forwards. 88 over 7 times 12.25: 88 times 12.25 is 1078, and 1078 over 7 is 154, which is 4 circles of 38.5 each. That''s the area we were given.'
        write: 'Check: $\dfrac{88 \times 12.25}{7} = \dfrac{1078}{7} = 154$'
        doodle_do:
          - {id: peel, op: stage, stage: 'custom:1993_q36_a2'}
      - say: 'So the radius is 3.50 centimetres, which is answer choice B.'
        write: 'Answer: $r = 3.50$ cm'
        answer: true
    traps:
