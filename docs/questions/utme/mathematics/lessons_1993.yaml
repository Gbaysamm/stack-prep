        say: 'Solution. $x$ is angle $QRU$, an angle of triangle $QUR$. We find the other two angles of that triangle.'
        write: 'Solution'
        point:
          - {figure: 0, kind: highlight, target: PT, text: 'tangent at U'}
      - say: 'The angle between the tangent and the chord $UR$ equals the angle in the alternate segment, at $Q$. The reason is the alternate segment theorem.'
        write: '$\angle UQR = \angle TUR = 35^{\circ}$ (alt. segment theorem)'
        point:
          - {figure: 0, kind: highlight, target: UR, text: 'chord'}
          - {figure: 0, kind: arc, target: UQR, text: '35°'}
      - say: '$UR$ cuts the parallels $QU$ and $RS$. Angle $RUQ$ and angle $SRU$ make a Z, so they are equal, because they are alternate angles.'
        write: '$\angle RUQ = \angle SRU = 50^{\circ}$ (alt. $\angle$s, $QU \parallel RS$)'
        point:
          - {figure: 0, kind: highlight, target: QU}
          - {figure: 0, kind: arc, target: RUQ, text: '50°'}
      - say: 'The three angles of triangle $QUR$ add up to 180 degrees, by the angle sum of a triangle.'
        write: '$x + 35^{\circ} + 50^{\circ} = 180^{\circ}$ ($\angle$ sum of $\triangle$)'
      - say: '35 plus 50 is 85. Take it to the other side, and we get 180 minus 85.'
        write: '$x = 180^{\circ} - 85^{\circ}$'
      - say: '180 minus 85 is 95 degrees.'
        write: '$x = 95^{\circ}$'
        point:
          - {figure: 0, kind: label, target: x, text: '95°'}
      - section: 'Check'
        say: 'Check with the parallels again. Angle $QRS$ is $x$ plus 50, which is 145. Angles $UQR$ and $QRS$ are co-interior, because they are on the same side of $QR$, between the parallels.'
        write: '$\angle QRS = 95^{\circ} + 50^{\circ} = 145^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: QRS, text: '145°'}
      - say: 'Co-interior angles add up to 180. 35 plus 145 is 180. It works.'
        write: '$35^{\circ} + 145^{\circ} = 180^{\circ}$ (co-int. $\angle$s) $\checkmark$'
      - say: 'Therefore $x$ is 95 degrees, option A.'
        write: '$\therefore x = 95^{\circ}$ (A)'
        answer: true
    traps:
      B: 'You went for 85 degrees. That is 35 plus 50, the two angles we moved into the triangle. $x$ is what is left, and 180 minus 85 is 95.'
      C: 'You went for 50 degrees. That is the given angle $SRU$, which the parallel lines move to $U$. $x$ is the third angle of the triangle, 95.'
      D: 'You went for 35 degrees. That is the given angle $TUR$, which the alternate segment theorem moves to $Q$. $x$ is the third angle of the triangle, 95.'
  32:
    moments:
      - section: 'The question'
        say: 'There are two equal angles at $P$, so the line $PS$ cuts the angle at $P$ exactly in half. That one fact decides how $QR$ is shared.'
        write: '$\angle QPS = \angle SPR$, $PQ = 4$ cm, $PR = 9$ cm, $QS = 3$ cm, $SR = ?$'
        point:
