  36:
    moments:
      - say: 'A sphere has surface area 154 square centimetres. Using pi as 22 over 7, we want its radius. We''ll work backwards from the area.'
        write: 'Surface area $= 154\ \text{cm}^{2}$, $\ \pi = \dfrac{22}{7}$'
      - say: 'Let me draw the sphere.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'surface area = 154 cm²'}
      - say: 'The surface area of a sphere is 4 pi $r$ squared. That''s four times the area of a flat circle with the same radius: picture an orange whose peel, laid flat, exactly covers four circles.'
        write: '$A = 4\pi r^{2}$'
        doodle: {name: 'custom:1993_q36_a', id: peel, caption: 'the peel covers 4 circles'}
