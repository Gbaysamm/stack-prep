      - say: 'So the area of the sector is 4.7 square metres, which is answer choice C.'
        write: 'Answer: $4.7\ \text{m}^{2}$'
        point:
          - {figure: sketch, kind: label, target: 'area = ?', text: '4.7 m²'}
        answer: true
    traps:
      A: 'You went for 4.0. The area is 33 over 7, which is 4.714. Rounded to one decimal place, that''s 4.7, not 4.0.'
      B: 'You went for 4.1. Check the division: 7 goes into 33 four times with 5 left, and 5 over 7 is about 0.71. So it''s 4.7.'
      D: 'You went for 5.0. That''s rounding up to the nearest whole number. Keep one decimal place: 4.714 is 4.7.'
  38:
    moments:
      - say: 'We want the angle between latitude 30 degrees south and latitude 13 degrees north.'
        write: '$30^{\circ}\text{S}$ and $13^{\circ}\text{N}$'
      - say: 'Let me draw a cross-section of the earth, with the equator and the two latitudes.'
