        write: '$k + 1, \ 2k - 1, \ 3k + 1$'
      - say: 'In a geometric progression the ratio is the same each time. So the second over the first equals the third over the second.'
        write: '$\dfrac{2k - 1}{k + 1} = \dfrac{3k + 1}{2k - 1}$'
      - say: 'Cross-multiply. The middle term squared equals the product of the outer two.'
        write: '$(2k - 1)^{2} = (k + 1)(3k + 1)$'
      - say: 'Expand the left. $2k$ squared is $4k^{2}$, twice $2k$ times negative 1 is negative $4k$, and negative 1 squared is 1.'
