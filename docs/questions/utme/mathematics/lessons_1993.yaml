        write: 'Solution'
      - say: 'The part next to $PQ$ is $QS$, and the part next to $PR$ is $SR$. This is the angle bisector theorem.'
        write: '$\dfrac{QS}{SR} = \dfrac{PQ}{PR}$ (angle bisector theorem)'
        point:
          - {figure: 0, kind: underline, target: QS}
          - {figure: 0, kind: underline, target: PQ}
      - say: 'Now substitute. $QS$ is 3, $PQ$ is 4 and $PR$ is 9.'
        write: '$\dfrac{3}{SR} = \dfrac{4}{9}$'
      - say: 'Cross-multiply. 4 times $SR$ equals 3 times 9, which is 27.'
        write: '$4 \times SR = 3 \times 9 = 27$'
      - say: 'Divide both sides by 4.'
        write: '$SR = \dfrac{27}{4}$'
      - say: '4 goes into 27 six times, 6 times 4 is 24, with 3 left over. So it is 6 and three quarters centimetres.'
        write: '$SR = 6\tfrac{3}{4}$ cm'
        point:
          - {figure: 0, kind: label, target: SR, text: '6¾ cm'}
      - section: 'Check'
        say: 'Check the ratio. Take 3 to 6 and three quarters, multiply both by 4, and we get 12 to 27. Divide both by 3 and we get 4 to 9, the same as $PQ$ to $PR$.'
        write: '$3 : 6\tfrac{3}{4} = 12 : 27 = 4 : 9\ \checkmark$'
      - say: 'It makes sense too, because $PR$ is the longer side, so $SR$, the part next to it, is the longer part.'
        write: '$SR = 6\tfrac{3}{4} > QS = 3$'
      - say: 'Therefore $SR$ is 6 and three quarters centimetres, option A.'
        write: '$\therefore SR = 6\tfrac{3}{4}$ cm (A)'
        answer: true
    traps:
      B: 'You went for 3 and 3 over 8. That is half of the right answer, 27 over 8. Cross-multiply 3 over $SR$ equals 4 over 9, and 4 times $SR$ is 27, so $SR$ is 27 over 4.'
      C: 'You went for 4 and 3 over 8. Set up the ratio $QS$ over $SR$ equals $PQ$ over $PR$, which is 3 over $SR$ equals 4 over 9, and solve, so $SR$ is 27 divided by 4, which is 6 and three quarters.'
      D: 'You went for 2 and two thirds. That makes $SR$ shorter than $QS$, but $SR$ is next to the longer side $PR$, so it must be the longer part.'
  33:
    moments:
      - section: 'The question'
        say: 'An isosceles triangle has two equal sides, but the question does not say which two. So we try each pair, and keep only the one that makes a real triangle.'
        write: 'Sides: $x + 3$, $2x + 3$, $2x - 3$; $x = ?$'
      - section: 'Solution'
        say: 'Solution. Let me draw the triangle with its three sides.'
        write: 'Solution'
        show_sketch: true
      - say: 'Take the first pair, $2x + 3$ equals $2x - 3$. Take $2x$ from both sides and we get 3 equals negative 3. That is impossible.'
        write: 'If $2x + 3 = 2x - 3$: $3 = -3$, impossible'
        point:
          - {figure: sketch, kind: underline, target: '2x + 3'}
          - {figure: sketch, kind: underline, target: '2x − 3'}
      - say: 'The second pair gives $x + 3$ equals $2x + 3$. Take $x$ and 3 from both sides, and $x$ is 0.'
        write: 'If $x + 3 = 2x + 3$: $x = 0$'
      - say: 'With $x$ equal to 0, the sides are 3, 3 and negative 3. A side cannot be negative, so we reject it.'
        write: '$x = 0$ gives sides $3, 3, -3$ (rejected)'
        point:
          - {line: 4, kind: strike, at: 'x = 0', text: 'rejected'}
      - say: 'For the third pair, $x + 3$ equals $2x - 3$. Collect $x$ on one side and the numbers on the other.'
        write: 'If $x + 3 = 2x - 3$:'
        point:
          - {figure: sketch, kind: circle, target: 'x + 3', text: 'equal'}
          - {figure: sketch, kind: circle, target: '2x − 3', text: 'equal'}
      - say: 'Take $x$ to the right and the negative 3 to the left. 3 plus 3 equals $2x$ minus $x$.'
        write: '$3 + 3 = 2x - x$'
      - say: '3 plus 3 is 6, and $2x$ minus $x$ is $x$.'
        write: '$x = 6$'
      - section: 'Check'
        say: 'Check the sides with $x$ equal to 6. 6 plus 3 is 9, 12 plus 3 is 15, and 12 minus 3 is 9. Two are equal, and all are positive.'
        write: '$x + 3 = 9$, $2x + 3 = 15$, $2x - 3 = 9$'
      - say: 'And the two shorter sides must add up to more than the longest, or they cannot meet. 9 plus 9 is 18, more than 15.'
        write: '$9 + 9 = 18 > 15\ \checkmark$'
      - say: 'Therefore $x$ is 6, option D.'
        write: '$\therefore x = 6$ (D)'
        answer: true
        point:
          - {figure: sketch, kind: circle, target: 'x = ?', text: '6'}
    traps:
      A: 'You went for 0. That makes the sides 3, 3 and negative 3, and a side cannot have a negative length. The pair $x + 3$ and $2x - 3$ gives 6.'
      B: 'You went for 1. Then the sides are 4, 5 and negative 1. No two are equal, and one is negative.'
      C: 'You went for 3. Then the sides are 6, 9 and 3. No two are equal, so the triangle is not isosceles.'
  34:
    moments:
      - section: 'The question'
        say: 'There are two circles, and a tangent that crosses between them. The radii stand at right angles to the tangent, and one extra line turns it all into a right-angled triangle.'
        write: '$OS = 5$ cm, $QT = 2$ cm, $OQ = 14$ cm, $ST = ?$'
        point:
          - {figure: 0, kind: highlight, target: ST, text: '?'}
      - section: 'Solution'
        say: 'Solution. We re-draw the diagram, so we can add our own line to it.'
        write: 'Solution'
        show_sketch: true
      - say: 'A tangent is perpendicular to the radius at the point of contact. So $OS$ and $QT$ both meet $ST$ at right angles.'
        write: '$\angle OST = \angle QTS = 90^{\circ}$ (tangent $\perp$ radius)'
        point:
          - {figure: sketch, kind: arc, target: OST, text: '90°'}
          - {figure: sketch, kind: arc, target: QTS, text: '90°'}
      - say: 'Through $Q$, draw $QN$ parallel to $TS$, to meet $OS$ produced at $N$. Produced means extended beyond $S$.'
        write: 'Draw $QN \parallel TS$, meeting $OS$ produced at $N$ (construction)'
        point:
          - {figure: sketch, kind: highlight, target: NQ, text: 'new line'}
      - say: '$SNQT$ has four right angles, so it is a rectangle. Its opposite sides are equal, so $NQ$ equals $ST$, and $SN$ equals $QT$, which is 2.'
        write: '$NQ = ST$, $SN = QT = 2$ cm (opp. sides of rectangle)'
        point:
          - {figure: sketch, kind: label, target: SN, text: '2 cm'}
      - say: 'So $ON$ is the two radii end to end, 5 plus 2, which is 7.'
        write: '$ON = OS + SN = 5 + 2 = 7$ cm'
        point:
          - {figure: sketch, kind: highlight, target: 'ON', text: '7 cm'}
      - say: 'Triangle $ONQ$ has its right angle at $N$, and $OQ$ is the hypotenuse, so we use Pythagoras.'
        write: '$|OQ|^{2} = |ON|^{2} + |NQ|^{2}$ (Pythagoras)'
        point:
          - {figure: sketch, kind: arc, target: ONQ, text: '90°'}
      - say: 'Now substitute. $OQ$ is 14 and $ON$ is 7. 14 squared is 196, and 7 squared is 49.'
        write: '$196 = 49 + |NQ|^{2}$'
      - say: 'Take 49 to the other side. 196 minus 49 is 147.'
        write: '$|NQ|^{2} = 196 - 49 = 147$'
      - say: 'Take the square root. 147 is 49 times 3, and the square root of 49 is 7.'
        write: '$|NQ| = \sqrt{49 \times 3} = 7\sqrt{3}$'
      - say: '$ST$ equals $NQ$, the opposite side of the rectangle. So $ST$ is 7 root 3 centimetres.'
        write: '$ST = NQ = 7\sqrt{3}$ cm'
        point:
          - {figure: sketch, kind: highlight, target: ST, text: '7√3 cm'}
      - section: 'Check'
        say: 'Check by putting it back. 7 root 3 squared is 49 times 3, which is 147. 147 plus 49 is 196, and 14 squared is 196.'
        write: '$147 + 49 = 196 = 14^{2}\ \checkmark$'
      - say: 'Therefore $ST$ is 7 root 3 centimetres, option A.'
        write: '$\therefore ST = 7\sqrt{3}$ cm (A)'
        answer: true
    traps:
      B: 'You went for 12 centimetres. 12 squared is 144, but $ST$ squared is 196 minus 49, which is 147. So $ST$ is root 147, a little more than 12.'
      C: 'You went for root 87. The side $ON$ is 5 plus 2, which is 7, because the tangent crosses between the circles. Then $ST$ squared is 196 minus 49, which is 147.'
      D: 'You went for 7 centimetres. That is $ON$, the two radii end to end. $ST$ is the other side of the right angle, and it is the root of 196 minus 49, which is 7 root 3.'
  35:
    moments:
      - section: 'The question'
        say: 'The big square PQRS holds a small square TUYS in one corner and a larger square XQVU in the opposite corner. We want the length YR.'
        write: 'Find $|YR|$.'
        point:
          - {figure: 0, kind: highlight, target: YR, text: '?', 'on': 'the length YR'}
      - say: 'Write Solution, and read the givens off the figure.'
        write: 'Solution'
      - section: 'What we know'
        say: 'The area of PQRS is 100 square centimetres, and the areas of TUYS and XQVU are in the ratio 1 to 16.'
        write: 'Area $PQRS = 100\ \text{cm}^{2}$; area $TUYS$ : area $XQVU = 1 : 16$'
      - say: 'The side of a square is the square root of its area. So the side PQ is root 100, which is 10 cm.'
        write: '$|PQ| = \sqrt{100} = 10$ cm'
        point:
          - {figure: 0, kind: underline, target: PQ, text: '10 cm', 'on': 'the side PQ'}
      - section: 'The ratio of sides'
        say: 'For squares, the ratio of sides is the square root of the ratio of areas. That is root 1 to root 16, which is 1 to 4.'
        write: 'Ratio of sides $= \sqrt{1} : \sqrt{16} = 1 : 4$'
      - say: 'So we give the small side a letter, and the big side is 4 times it.'
        write: 'Let $|TS| = a$ cm, so $|XQ| = 4a$ cm'
        point:
          - {figure: 0, kind: highlight, target: TS, text: 'a', 'on': 'the small side'}
          - {figure: 0, kind: highlight, target: XQ, text: '4a', 'on': 'the big side'}
      - section: 'Along the top'
        say: 'PX equals TU, opposite sides of the rectangle PXUT, and TU equals TS, sides of a square. So PX is a too.'
        write: '$|PX| = |TU| = a$ (opp. sides; sides of sq.)'
        point:
          - {figure: 0, kind: underline, target: PX, text: 'a', 'on': 'So PX is a'}
      - say: 'Along the top edge, PX plus XQ makes PQ, so a plus 4a equals 10.'
        write: '$|PX| + |XQ| = |PQ| \Rightarrow a + 4a = 10$'
      - say: 'a plus 4a is 5a. So 5a equals 10, and a is 10 over 5, which is 2.'
        write: '$5a = 10 \Rightarrow a = 2$'
      - say: 'Then XQ is 4 times 2, which is 8 cm.'
        write: '$|XQ| = 4a = 4 \times 2 = 8$ cm'
        point:
          - {figure: 0, kind: label, target: XQ, text: '8 cm', 'on': 'which is 8'}
      - section: 'YR'
        say: 'YR equals UV, opposite sides of the rectangle UVRY. And UV is a side of the square XQVU, so it equals XQ, 8 cm.'
        write: '$|YR| = |UV| = |XQ| = 8$ cm (opp. sides; sides of sq.)'
        point:
          - {figure: 0, kind: highlight, target: UV, text: '8 cm', 'on': 'equals UV'}
      - say: 'Therefore YR is 8 centimetres.'
        write: '$\therefore |YR| = 8$ cm'
        point:
          - {figure: 0, kind: label, target: YR, text: '8 cm', 'on': 'Therefore'}
      - section: 'Check'
        say: 'Check the ratio. The small square has area 2 squared, which is 4, and the larger one 8 squared, which is 64. 4 to 64 is 1 to 16.'
        write: 'Check: $2^{2} : 8^{2} = 4 : 64 = 1 : 16$ ✓'
      - section: 'Answer'
        say: 'So YR is 8 centimetres, which is answer choice C.'
        write: '$\therefore |YR| = 8$ cm (C)'
        answer: true
    traps:
      A: 'You went for 6 cm. The sides are in the ratio 1 to 4, the square roots of 1 to 16, and they add to 10. So a is 2, 4a is 8, and YR, equal to XQ, is 8 cm.'
      B: 'You went for 7 cm. Solve a plus 4a equals 10. Then a is 2 and 4a is 8. YR equals XQ, so YR is 8 cm.'
      D: 'You went for 9 cm. That needs the small side to be 1. But a plus 4a equals 10 gives a as 2, so YR is 10 minus 2, which is 8 cm.'
  36:
    moments:
      - section: 'The question'
        say: 'Peel an orange and lay the peel flat, and it covers exactly four circles with the same radius as the orange. That is the surface area of a sphere. Here we know the area and want the radius.'
        write: 'Find the radius of the sphere.'
        doodle: {name: 'custom:1993_q36_a', id: peel, caption: 'the peel covers 4 circles'}
        doodle_do:
          - {id: peel, op: circle, part: circles, text: '4 circles', 'on': 'four circles'}
      - say: 'Write Solution, then sketch the sphere with its centre O and radius r.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'r = ?', text: 'radius', 'on': 'radius r'}
      - section: 'What we know'
        say: 'List the givens. The surface area A is 154 square centimetres, and pi is 22 over 7.'
        write: '$A = 154\ \text{cm}^{2}$, $\pi = \dfrac{22}{7}$'
        point:
          - {figure: sketch, kind: underline, target: 'surface area = 154 cm²', text: 'given', 'on': '154 square centimetres'}
      - section: 'The formula'
        say: 'The surface area of a sphere is 4 pi r squared.'
        write: '$A = 4\pi r^{2}$'
      - say: 'Now substitute, with A as 154 and pi as 22 over 7.'
        write: '$154 = 4 \times \dfrac{22}{7} \times r^{2}$'
      - section: 'Solve for r'
        say: '4 times 22 is 88, so the right side is 88 over 7, times r squared.'
        write: '$154 = \dfrac{88}{7}r^{2}$'
      - say: 'To make r squared the subject, multiply both sides by 7 over 88.'
        write: '$r^{2} = \dfrac{154 \times 7}{88}$'
      - say: 'Now cancel. 154 and 88 both divide by 22, giving 7 and 4. So r squared is 7 times 7 over 4, which is 49 over 4.'
        write: '$r^{2} = \dfrac{7 \times 7}{4} = \dfrac{49}{4}$'
      - say: 'Take the square root of top and bottom. Root 49 is 7, and root 4 is 2. 7 over 2 is 3.5.'
        write: '$r = \sqrt{\dfrac{49}{4}} = \dfrac{7}{2} = 3.5$'
      - say: 'Therefore the radius is 3.50 centimetres.'
        write: '$\therefore r = 3.50$ cm'
        doodle_do:
          - {id: peel, op: label, part: r, text: '3.5 cm', 'on': 'Therefore'}
        point:
          - {figure: sketch, kind: label, target: 'r = ?', text: '3.5 cm', 'on': 'Therefore'}
      - section: 'Check'
        say: 'To check, one circle of radius 3.5 has area 22 over 7 times 3.5 squared, which is 38.5. Four of them make 154, the area we were given.'
        write: 'Check: $4 \times \dfrac{22}{7} \times 3.5^{2} = 4 \times 38.5 = 154$ ✓'
        doodle_do:
          - {id: peel, op: stage, stage: 'custom:1993_q36_a2', 'on': 'Four of them'}
      - section: 'Answer'
        say: 'So the radius is 3.50 centimetres, which is answer choice B.'
        write: '$\therefore r = 3.50$ cm (B)'
        answer: true
    traps:
      A: 'You went for 7 cm. That solves pi r squared equals 154, the area of a flat circle. A sphere has 4 pi r squared, so r squared is 49 over 4 and r is 3.5 cm.'
      C: 'You went for 3 cm. Then 4 pi r squared is 4 times 22 over 7 times 9, about 113, not 154. Solving gives r squared as 49 over 4, so r is 3.5 cm.'
      D: 'You went for 1.75 cm. That is half the radius. r squared is 49 over 4, and its square root is 7 over 2, which is 3.5 cm.'
  37:
    moments:
      - section: 'The question'
        say: 'A sector is a slice of a circle, like one slice of a pizza. We want the area of a 60 degree slice of a circle of radius 3 metres.'
        write: 'Find the area of the sector.'
        doodle: {name: 'custom:1993_q37_a', id: pizza, caption: 'one slice of the pizza'}
      - say: 'Write Solution, then draw the sector with centre O, radius 3 m, and the angle of 60 degrees.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: arc, target: AOB, text: '60°', 'on': 'the angle of 60'}
      - section: 'What we know'
        say: 'List the givens. r is 3 m and theta is 60 degrees. No value of pi is given, so we take pi as 22 over 7.'
        write: '$r = 3$ m, $\theta = 60^{\circ}$, $\pi = \dfrac{22}{7}$'
      - section: 'The formula'
        say: 'The area of a sector is theta over 360, times pi r squared. Theta over 360 is the fraction of the whole circle.'
        write: '$A = \dfrac{\theta}{360} \times \pi r^{2}$'
      - say: 'Now substitute, so theta is 60, pi is 22 over 7, and r is 3.'
        write: '$A = \dfrac{60}{360} \times \dfrac{22}{7} \times 3^{2}$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: '60'}, at: '360[[60]]', text: 'θ', 'on': 'theta is 60'}
      - section: 'Simplify'
        say: '60 over 360 is 1 over 6, which is one slice of six. And 3 squared is 9.'
        write: '$= \dfrac{1}{6} \times \dfrac{22}{7} \times 9$'
        doodle_do:
          - {id: pizza, op: label, part: slice, text: '1 of 6', 'on': 'one slice of six'}
      - say: 'Multiply the tops, and 22 times 9 is 198. Multiply the bottoms, and 6 times 7 is 42. Then divide both by 6 to get 33 over 7.'
        write: '$= \dfrac{198}{42} = \dfrac{33}{7}$'
      - say: '33 divided by 7 is 4.714. To one decimal place, the next digit is 1, less than 5, so it rounds to 4.7.'
        write: '$= 4.714 \approx 4.7$'
      - say: 'Therefore the area of the sector is 4.7 square metres.'
        write: '$\therefore$ area of sector $= 4.7\ \text{m}^{2}$'
        doodle_do:
          - {id: pizza, op: label, part: pizza, text: '4.7 m²', 'on': 'Therefore'}
        point:
          - {figure: sketch, kind: label, target: 'area = ?', text: '4.7 m²', 'on': 'Therefore'}
      - section: 'Check'
        say: 'Check with pi as 3.142. 1 over 6 times 3.142 times 9 is 4.713, which also rounds to 4.7.'
        write: 'Check: $\dfrac{1}{6} \times 3.142 \times 9 = 4.713 \approx 4.7$ ✓'
      - section: 'Answer'
        say: 'So the area of the sector is 4.7 square metres, which is answer choice C.'
        write: '$\therefore A = 4.7\ \text{m}^{2}$ (C)'
        answer: true
    traps:
      A: 'You went for 4.0. The area is 33 over 7, which is 4.714. To one decimal place that is 4.7, not 4.0.'
      B: 'You went for 4.1. Recheck the division. 7 goes into 33 four times with 5 left, and 5 over 7 is about 0.71. So A is 4.7.'
      D: 'You went for 5.0. That rounds 4.714 up to a whole number. The options keep one decimal place, and 4.714 is 4.7 to one decimal place.'
  38:
    moments:
      - section: 'The question'
        say: 'Latitude tells you how far north or south of the equator a place is, measured as an angle at the centre of the earth. We want the angle between latitude 30 degrees south and 13 degrees north.'
        write: 'Find the angle between latitudes $30^{\circ}$S and $13^{\circ}$N.'
      - say: 'Write Solution, then draw a cross-section of the earth, with centre O, the equator, P on 13 degrees north and Q on 30 degrees south.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: equator, text: '0°', 'on': 'the equator'}
      - section: 'What we know'
        say: 'List the givens. One latitude is 30 degrees south, and the other is 13 degrees north.'
        write: 'Latitudes: $30^{\circ}$S and $13^{\circ}$N'
        point:
          - {figure: sketch, kind: circle, target: '30°S', text: 'south', 'on': '30 degrees south'}
          - {figure: sketch, kind: circle, target: '13°N', text: 'north', 'on': '13 degrees north'}
      - section: 'The rule'
        say: 'Here is the rule. If both places are on the same side of the equator, subtract. If they are on opposite sides, add. Here one is S and one is N, on opposite sides, so we add.'
        write: 'S and N: opposite sides of the equator, so add'
      - say: 'So the angle between them is 30 degrees plus 13 degrees.'
        write: 'Angle $= 30^{\circ} + 13^{\circ}$'
        point:
          - {figure: sketch, kind: circle, target: '30°', text: 'below', 'on': '30 degrees plus'}
          - {figure: sketch, kind: circle, target: '13°', text: 'above', 'on': 'plus 13 degrees'}
      - say: '30 plus 13 is 43.'
        write: '$= 43^{\circ}$'
      - say: 'Therefore the angle between the two latitudes is 43 degrees.'
        write: '$\therefore$ angle between the latitudes $= 43^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: POQ, text: '43°', 'on': 'Therefore'}
          - {figure: sketch, kind: label, target: '?', text: '43°', 'on': '43 degrees'}
      - section: 'Check'
        say: 'Check with a lift, where the equator is the ground floor. From 30 south up to the equator is 30 degrees, then up to 13 north is 13 more, so 43 in all.'
        write: 'Check: $30^{\circ}\text{S} \to 0^{\circ} \to 13^{\circ}\text{N}$: $30^{\circ} + 13^{\circ} = 43^{\circ}$ ✓'
        doodle: {name: 'custom:1993_q38_a', id: lift, caption: 'the equator is the ground floor'}
        doodle_do:
          - {id: lift, op: move, part: lift, path: up1, 'on': 'up to the equator'}
          - {id: lift, op: move, part: lift, path: up2, 'on': 'then up to 13 north'}
          - {id: lift, op: label, part: lift, text: '43° in all', 'on': '43 in all'}
      - section: 'Answer'
        say: 'So the angle between the latitudes is 43 degrees, which is answer choice C.'
        write: '$\therefore 43^{\circ}$ (C)'
        answer: true
    traps:
      A: 'You went for 17 degrees. That is 30 minus 13, which is right only when both are on the same side of the equator. Here one is S and one is N, so add to get 43 degrees.'
      B: 'You went for 33 degrees. The latitudes are 30 and 13 degrees from the equator on opposite sides, so the angle is 30 plus 13, which is 43 degrees.'
      D: 'You went for 53 degrees. Recheck the addition. 30 plus 13 is 43 degrees.'
  39:
    moments:
      - section: 'The question'
        say: 'We are told sine theta equals cos theta, and we want every theta between 0 and 360 degrees.'
        write: '$\sin\theta = \cos\theta$, $\ 0^{\circ} \le \theta \le 360^{\circ}$'
      - section: 'Solution'
        say: 'Solution. Two different ratios are hard to solve together, so we turn them into one. Divide both sides by cos theta.'
        write: 'Solution: $\dfrac{\sin\theta}{\cos\theta} = \dfrac{\cos\theta}{\cos\theta}$'
      - say: 'Sine over cos is tan, and cos over cos is 1.'
        write: '$\tan\theta = 1$ $\left(\tan\theta = \dfrac{\sin\theta}{\cos\theta}\right)$'
      - section: 'The basic angle'
        say: 'First the basic angle, the acute angle whose tan is 1. In a right-angled triangle with two equal legs, opposite over adjacent is 1, and the angles are 45 degrees.'
        write: 'Basic $\angle$: $\tan^{-1} 1 = 45^{\circ}$'
        doodle: {name: 'custom:1993_q39_a', id: tri, caption: 'equal legs: tan is 1'}
        doodle_do:
          - {id: tri, op: label, part: angle, text: '45°'}
      - section: 'The quadrants'
        say: 'Now the sign. Going anticlockwise from the first quadrant, we have All, Sine, Tangent, Cosine. Tan is positive where it says All and where it says Tangent, which is the 1st and 3rd quadrants.'
        write: '$\tan\theta = +1$: 1st and 3rd quad. (A, T in CAST)'
      - say: 'In the first quadrant, theta is the basic angle itself, which is 45 degrees.'
        write: '1st quad.: $\theta = 45^{\circ}$'
      - say: 'In the third quadrant, theta is 180 plus the basic angle, so 180 plus 45 is 225 degrees.'
        write: '3rd quad.: $\theta = 180^{\circ} + 45^{\circ} = 225^{\circ}$'
        point:
          - {line: 6, kind: move, from: {line: 3, at: '=45∘'}, at: '+45∘', text: 'basic ∠'}
      - say: 'Therefore theta is 45 degrees or 225 degrees.'
        write: '$\therefore \theta = 45^{\circ}$ or $225^{\circ}$'
      - section: 'Check'
        say: 'Check 45 degrees. Sine 45 and cos 45 are both root 2 over 2, so they are equal.'
        write: 'Check: $\sin 45^{\circ} = \cos 45^{\circ} = \dfrac{\sqrt{2}}{2}\ \checkmark$'
      - say: '225 is in the third quadrant, where sine and cos are both negative. Both are minus root 2 over 2, so they are equal too.'
        write: '$\sin 225^{\circ} = \cos 225^{\circ} = -\dfrac{\sqrt{2}}{2}\ \checkmark$'
      - say: 'The graphs agree, because the sine and cosine curves cross at 45 degrees and at 225 degrees.'
        write: 'Graphs of $\sin\theta$ and $\cos\theta$ cross at $45^{\circ}$, $225^{\circ}$'
        show_sketch: true
        'on': 'graphs agree'
        point:
          - {figure: sketch, kind: circle, target: '45°'}
          - {figure: sketch, kind: circle, target: '225°'}
      - section: 'Answer'
        say: 'So theta is 45 degrees and 225 degrees, which is answer choice A.'
        write: '$\therefore \theta = 45^{\circ},\ 225^{\circ}$'
        answer: true
    traps:
      B: 'You went for 135 and 315. Those are in the 2nd and 4th quadrants, where tan is negative, because there sine and cos have opposite signs. Tan theta equals plus 1 needs the 1st and 3rd quadrants.'
      C: 'You went for 45 and 315. At 315, in the 4th quadrant, sine is negative but cos is positive. Tan is positive in the 1st and 3rd quadrants, so the second angle is 180 plus 45, which is 225.'
      D: 'You went for 135 and 225. At 135, in the 2nd quadrant, sine is positive but cos is negative. The first-quadrant angle, the basic angle 45, is a solution.'
  40:
    moments:
      - section: 'The question'
        say: 'In the figure, $TH$ is a vertical height. From $P$ the angle of elevation of $T$ is 30 degrees, and from $Q$ it is 45 degrees. $PQ$ is 5 metres. We want $TH$.'
        write: 'Solution: $|PQ| = 5$ m, $\angle TPH = 30^{\circ}$, $\angle TQH = 45^{\circ}$'
        point:
          - {figure: 0, kind: highlight, target: PQ, text: '5 m'}
      - say: 'There are two unknown lengths, the height, and the ground distance from $Q$ to the foot $H$. Give each a letter.'
        write: 'Let $|TH| = h$ and $|QH| = x$'
        point:
          - {figure: 0, kind: highlight, target: TH, text: 'h'}
          - {figure: 0, kind: underline, target: QH, text: 'x'}
      - section: 'Triangle TQH'
        say: 'In triangle $TQH$, $h$ is opposite the 45 degrees and $x$ is adjacent. Opposite over adjacent is TOA, so we use tan.'
        write: 'In $\triangle TQH$: $\tan 45^{\circ} = \dfrac{h}{x}$ (TOA)'
        point:
          - {figure: 0, kind: arc, target: TQH, text: '45°'}
      - say: 'Tan 45 degrees is 1. So $h$ over $x$ is 1, which means $x$ equals $h$, and the ground distance is the same as the height.'
        write: '$1 = \dfrac{h}{x} \Rightarrow x = h$'
      - section: 'Triangle TPH'
        say: 'From $P$, the ground distance is $PQ$ plus $QH$, which is 5 plus $x$, and $x$ is $h$. So it is 5 plus $h$.'
        write: '$|PH| = 5 + x = 5 + h$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: 'x = [[h]]'}, at: '5 + [[h]]', text: 'x = h'}
          - {figure: 0, kind: underline, target: PH, text: '5 + h'}
      - say: 'In triangle $TPH$, $h$ is opposite the 30 degrees and $5 + h$ is adjacent. So we use tan again.'
        write: 'In $\triangle TPH$: $\tan 30^{\circ} = \dfrac{h}{5 + h}$ (TOA)'
        point:
          - {figure: 0, kind: arc, target: TPH, text: '30°'}
      - say: 'Tan 30 degrees is 1 over root 3.'
        write: '$\dfrac{1}{\sqrt{3}} = \dfrac{h}{5 + h}$'
      - section: 'Solve for h'
        say: 'Cross-multiply, and $h$ times root 3 equals 1 times, 5 plus $h$.'
        write: '$\sqrt{3}\,h = 5 + h$'
      - say: 'Subtract $h$ from both sides, to bring the $h$ terms together.'
        write: '$\sqrt{3}\,h - h = 5$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '+ h'}, at: '− h', text: 'across the ='}
      - say: 'Both terms on the left have $h$, so factorise by taking $h$ out.'
        write: '$h(\sqrt{3} - 1) = 5$'
      - say: 'Divide both sides by root 3 minus 1.'
        write: '$h = \dfrac{5}{\sqrt{3} - 1}$'
      - section: 'Check'
        say: 'To check, $h$ is 5 over 0.73, about 6.8 metres. Then $PH$ is about 11.8, and 6.8 over 11.8 is about 0.577, which is tan 30 degrees.'
        write: 'Check: $h \approx \dfrac{5}{0.73} \approx 6.8$; $\ \dfrac{6.8}{11.8} \approx 0.577 = \tan 30^{\circ}\ \checkmark$'
        point:
          - {figure: 0, kind: 'label', target: 'TH', text: '≈ 6.8 m'}
      - section: 'Answer'
        say: 'Therefore $TH$ is 5 over, root 3 minus 1, which is option B.'
        write: '$\therefore |TH| = \dfrac{5}{\sqrt{3} - 1}$ m'
        answer: true
    traps:
      A: 'You went for 5 over, root 3 plus 1. The sign slipped when collecting the $h$ terms. Root 3 $h$ minus $h$ is $h(\sqrt{3} - 1)$. That option is only about 1.8 metres, far too short.'
      C: 'You went for 5 over root 3. That uses the 30 degree triangle with a base of 5 only. The base from $P$ is 5 plus $x$, and $x = h$.'
      D: 'You went for root 3 over 5. That is upside down. Set up tan 30 degrees as $h$ over, 5 plus $h$, and solve for $h$.'
  41:
    moments:
      - section: 'The question'
        say: 'There are two equal angles of 30 degrees, and the longest side is 10 centimetres. The longest side faces the largest angle, so first we find that angle.'
        write: '$\angle A = \angle B = 30^{\circ}$, $|AB| = 10$ cm, $|AC| = |BC| = ?$'
      - section: 'Solution'
        say: 'Solution. Let me draw triangle $ABC$, with the 30 degree angles at $A$ and $B$.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: arc, target: CAB, text: '30°'}
          - {figure: sketch, kind: arc, target: CBA, text: '30°'}
      - say: 'The angles of the triangle add up to 180. 180 minus 30 minus 30 is 120 degrees at $C$.'
        write: '$\angle C = 180^{\circ} - 30^{\circ} - 30^{\circ} = 120^{\circ}$ ($\angle$ sum of $\triangle$)'
        point:
          - {figure: sketch, kind: circle, target: '120°'}
      - say: 'The longest side faces the largest angle, so $AB$, opposite the 120 degrees, is the 10 centimetre side. The equal angles at $A$ and $B$ face equal sides, $BC$ and $AC$.'
        write: '$|AC| = |BC|$ (isos. $\triangle$)'
        point:
          - {figure: sketch, kind: highlight, target: AB, text: '10 cm'}
          - {figure: sketch, kind: highlight, target: AC}
          - {figure: sketch, kind: highlight, target: BC}
      - say: 'The sine rule says that each side divided by the sine of the angle opposite it gives the same number.'
        write: '$\dfrac{a}{\sin A} = \dfrac{b}{\sin B} = \dfrac{c}{\sin C}$ (sine rule)'
      - say: '$BC$ faces the 30 degrees at $A$, and $AB$, 10 centimetres, faces the 120 degrees at $C$.'
        write: '$\dfrac{|BC|}{\sin 30^{\circ}} = \dfrac{10}{\sin 120^{\circ}}$'
      - say: 'Multiply both sides by sine 30, to get $BC$ alone.'
        write: '$|BC| = \dfrac{10 \sin 30^{\circ}}{\sin 120^{\circ}}$'
      - say: 'Sine 30 is a half. Sine 120 is the same as sine 60, which is root 3 over 2.'
        write: '$|BC| = 10 \times \dfrac{1}{2} \div \dfrac{\sqrt{3}}{2}$'
      - say: '10 times a half is 5. Dividing by root 3 over 2 is multiplying by 2 over root 3. 5 times 2 is 10.'
        write: '$|BC| = 5 \times \dfrac{2}{\sqrt{3}} = \dfrac{10}{\sqrt{3}}$'
      - say: 'Rationalise by multiplying the top and the bottom by root 3. Root 3 times root 3 is 3.'
        write: '$|BC| = \dfrac{10 \times \sqrt{3}}{\sqrt{3} \times \sqrt{3}} = \dfrac{10\sqrt{3}}{3}$'
      - section: 'Check'
        say: 'Check another way. The perpendicular from $C$ cuts $AB$ in half, 5 and 5. In the right-angled half, cos 30 is adjacent over hypotenuse. That is CAH.'
        write: '$\cos 30^{\circ} = \dfrac{5}{|AC|}$ (CAH)'
      - say: 'So $AC$ is 5 divided by root 3 over 2, which is 10 over root 3. It is the same answer.'
        write: '$|AC| = 5 \div \dfrac{\sqrt{3}}{2} = \dfrac{10}{\sqrt{3}}\ \checkmark$'
      - say: 'Therefore each of the other sides is 10 root 3 over 3 centimetres, about 5.8, which is option D.'
        write: '$\therefore |AC| = |BC| = \dfrac{10\sqrt{3}}{3}$ cm (D)'
        answer: true
    traps:
      A: 'You went for 5 centimetres. Two sides of 5 add up to exactly 10, which is a flat line, not a triangle. The sine rule gives 10 over root 3, about 5.8.'
      B: 'You went for 4 centimetres. Two sides of 4 add up to only 8, less than 10, so they cannot meet. The sine rule with the 120 degree angle gives about 5.8.'
      C: 'You went for 3 root 3, about 5.2. The sine rule gives 10 times sine 30 over sine 120, which is 10 over root 3, about 5.8.'
  42:
    moments:
      - section: 'The question'
        say: 'Quantities in the proportions 1, 4, 6 and 7 go on a pie chart. We want the angle of the sector for the proportion 7.'
        write: 'Proportions $1 : 4 : 6 : 7$. Angle for $7 = ?$'
      - section: 'Solution'
        say: 'Solution. Draw the table, with each proportion and its sectoral angle. The whole circle, 360 degrees, stands for the sum of the proportions.'
        write: 'Sectoral angle $= \dfrac{\text{proportion}}{\text{sum of proportions}} \times 360^{\circ}$'
        diagram: {id: t, kind: table, columns: [Item, Proportion, 'Sectoral angle'], rows: [[1st, 1, ''], [2nd, 4, ''], [3rd, 6, ''], [4th, 7, '']]}
      - say: 'First add the proportions. 1 plus 4 is 5, plus 6 is 11, plus 7 is 18.'
        write: 'Sum $= 1 + 4 + 6 + 7 = 18$'
        diagram_do:
          - {id: t, op: total, part: 'col:2', 'on': '18'}
      - section: 'The sector for 7'
        say: 'Now substitute for the proportion 7, which gives 7 over 18, times 360 degrees.'
        write: 'Angle for $7 = \dfrac{7}{18} \times 360^{\circ}$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '= 18'}, at: '18', text: 'sum'}
      - say: '360 divided by 18 is 20, so this is 7 times 20.'
        write: '$= 7 \times 20^{\circ}$'
      - say: '7 times 20 is 140 degrees.'
        write: '$= 140^{\circ}$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:4,3', text: '140°', 'on': '140 degrees'}
      - section: 'Check'
        say: 'Check that the sectors fill the circle. In the same way, 1, 4 and 6 over 18 of 360 give 20, 80 and 120 degrees.'
        write: 'Others: $20^{\circ},\ 80^{\circ},\ 120^{\circ}$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,3', text: '20°', 'on': '20'}
          - {id: t, op: fill, part: 'cell:2,3', text: '80°', 'on': '80'}
          - {id: t, op: fill, part: 'cell:3,3', text: '120°', 'on': '120 degrees'}
      - say: '20 plus 80 plus 120 plus 140 is 360 degrees. The pie is full.'
        write: '$20 + 80 + 120 + 140 = 360^{\circ}\ \checkmark$'
        diagram: {id: p, kind: pie, show: angle, sectors: [{label: '1', value: 1}, {label: '4', value: 4}, {label: '6', value: 6}, {label: '7', value: 7, colour: green}]}
      - section: 'Answer'
        say: 'Therefore the sector for the proportion 7 is 140 degrees, which is answer choice D.'
        write: '$\therefore$ angle for $7 = 140^{\circ}$'
        answer: true
    traps:
      A: 'You went for 20 degrees. That is the sector for the proportion 1. The proportion 7 is 7 over 18 of 360, which is 140 degrees.'
      B: 'You went for 80 degrees. That is the sector for the proportion 4. The question asks for the proportion 7, which is 7 over 18 of 360, which is 140 degrees.'
      C: 'You went for 120 degrees. That is the sector for the proportion 6. The proportion 7 is 7 over 18 of 360, which is 140 degrees.'
  43:
    moments:
      - section: 'The question'
        say: 'The bar chart shows the marks scored in a class test. We want the number of students who took the test.'
        write: 'Number of students who took the test $= ?$'
        point:
          - {figure: 0, kind: circle, target: 'Marks'}
      - section: 'Solution'
        say: 'Solution. The height of each bar is the frequency, f, which is the number of students who scored that mark. Every student is in exactly one bar, so we add the frequencies.'
        write: 'Number of students $= \Sigma f$'
        point:
          - {figure: 0, kind: circle, target: 'No. of students', text: 'f'}
      - say: 'Read the bars into a frequency table, against the scale. Mark 0 has 2 students and mark 1 has 5. Mark 2 has no bar, so 0.'
        write: 'Marks $0,\ 1,\ 2$: $f = 2,\ 5,\ 0$'
        diagram: {id: t, kind: table, columns: ['Mark (x)', 'Frequency (f)'], rows: [[0, 2], [1, 5], [2, 0], [3, 3], [4, 4], [5, 0], [6, 0], [7, 3], [8, 1], [9, 0], [10, 2]]}
        point:
          - {figure: 0, kind: label, target: {x: 83, y: 226}, text: '2'}
          - {figure: 0, kind: label, target: {x: 109, y: 226}, text: '5'}
      - say: 'Mark 3 has 3 students, and mark 4 has 4.'
        write: 'Marks $3,\ 4$: $f = 3,\ 4$'
        point:
          - {figure: 0, kind: label, target: {x: 161, y: 226}, text: '3'}
          - {figure: 0, kind: label, target: {x: 187, y: 226}, text: '4'}
      - say: 'Marks 5 and 6 have no bars. Mark 7 has 3, mark 8 has 1, mark 9 has none, and mark 10 has 2.'
        write: 'Marks $5$ to $10$: $f = 0,\ 0,\ 3,\ 1,\ 0,\ 2$'
        point:
          - {figure: 0, kind: label, target: '7', text: '3'}
          - {figure: 0, kind: label, target: '10', text: '2'}
      - section: 'The total'
        say: 'Now add the frequencies. The marks with no bar add nothing.'
        write: '$\Sigma f = 2 + 5 + 3 + 4 + 3 + 1 + 2$'
      - say: '2 plus 5 is 7, plus 3 is 10, plus 4 is 14, plus 3 is 17, plus 1 is 18, plus 2 is 20.'
        write: '$= 20$'
        diagram_do:
          - {id: t, op: total, part: 'col:2', 'on': 'is 20'}
      - section: 'Check'
        say: 'Check by adding in a different order. 2 plus 5 is 7, 3 plus 4 is 7, and 3 plus 1 plus 2 is 6. 7 plus 7 plus 6 is 20 students.'
        write: 'Check: $(2 + 5) + (3 + 4) + (3 + 1 + 2) = 7 + 7 + 6 = 20\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore 20 students took the test, which is answer choice B.'
        write: '$\therefore$ number of students $= 20$'
        answer: true
    traps:
      A: 'You went for 15. That leaves out the tallest bar, the 5 students on mark 1. Add every frequency, and 2, 5, 3, 4, 3, 1 and 2 make 20.'
      C: 'You went for 25. Read each bar carefully against the scale, and the frequencies add up to 20.'
      D: 'You went for 50. The bar heights are the frequencies, and they add up to 20. Do not add the marks along the bottom.'
  44:
    moments:
      - section: 'The question'
        say: 'Twenty students got these marks. We want how many scored at least 50. "At least 50" means 50 or more, so a mark of exactly 50 counts.'
        write: 'Solution: $n = 20$; at least 50 means mark $\ge 50$'
      - section: 'Arrange the marks'
        say: 'First arrange the marks in ascending order, smallest first. Then every mark of 50 or more sits together at the end. The smallest six are 20, 30, 37, 43, 44 and 48.'
        write: 'Ascending order: $20,\ 30,\ 37,\ 43,\ 44,\ 48,$'
      - say: 'Then come 50, 52, 53, 59, 60, 64 and 67.'
        write: 'Then $50,\ 52,\ 53,\ 59,\ 60,\ 64,\ 67,$'
      - say: 'Then the largest seven are 68, 70, 73, 78, 81, 84 and 90.'
        write: 'Then $68,\ 70,\ 73,\ 78,\ 81,\ 84,\ 90$'
      - say: 'Make sure no mark is missed. 6, plus 7, plus 7, is 20 marks, one for each student.'
        write: 'Number of marks: $6 + 7 + 7 = 20\ \checkmark$'
      - section: 'Count'
        say: 'The marks of at least 50 run from 50 to the end of the list, which is the whole of the second and third lines.'
        write: 'Marks $\ge 50$: $50$ to $90$'
        point:
          - {line: 5, kind: arrow, from: {line: 2, at: '50'}, at: '[[50]] to', text: 'from here'}
      - say: 'That is 7 on the second line and 7 on the third, so 14 marks.'
        write: 'Number $\ge 50$: $7 + 7 = 14$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '6 + [[7]]'}, at: '[[7]] + 7', text: '2nd line'}
          - {line: 6, kind: move, from: {line: 4, at: '7 + [[7]] ='}, at: '7 + [[7]] =', text: '3rd line'}
      - section: 'Check'
        say: 'Check by splitting the 20 scripts at 50. Below 50 are the first six marks, and 20 minus 6 is 14.'
        write: 'Check: below 50: $6$; $\ 20 - 6 = 14\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore 14 students scored at least 50 marks, which is option D.'
        write: '$\therefore 14$ students scored at least 50'
        answer: true
    traps:
      A: 'You went for 6. That is the number who scored below 50. The question asks for those who scored at least 50, which are the other 14.'
      B: 'You went for 10. That is half the class, but the marks are not split evenly. In ascending order, only the first six are below 50, so 14 are at least 50.'
      C: 'You went for 13. You left out the student who scored exactly 50. At least 50 means 50 or more, so 50 counts, and the total is 14.'
  45:
    moments:
      - section: 'The question'
        say: 'Coconuts are weighed in grams and sorted into classes. The mode of grouped data is not just the middle of the tallest class, because a formula leans it towards the bigger neighbour. Table first.'
        write: 'Mode $= ?$'
        diagram:
          id: t
          kind: table
          columns: ['Weight (g)', 'f']
          rows: [['0 – 10', 10], ['10 – 20', 27], ['20 – 30', 19], ['30 – 40', 6], ['40 – 50', 2]]
          'on': 'Table'
        doodle: {name: 'custom:1993_q45_a', id: nuts, caption: 'coconuts weighed in grams', size: scene}
      - section: 'Solution'
        say: 'Solution. The modal class is the class with the highest frequency. The highest $f$ is 27, so the modal class is 10 to 20 grams.'
        write: 'Solution. Modal class: $10 - 20$ (highest $f = 27$)'
        diagram_do:
          - {id: t, op: highlight, part: 'row:2', text: 'modal class', 'on': 'modal', on_nth: 2}
        doodle_do:
          - {id: nuts, op: circle, part: c2}
      - section: 'The formula'
        say: 'The mode formula is $L_1$, plus $D_1$ over $D_1$ plus $D_2$, times $c$.'
        write: 'Mode $= L_{1} + \left(\dfrac{D_{1}}{D_{1} + D_{2}}\right) \times c$'
      - say: '$L_1$ is the lower class boundary of the modal class. These classes already meet at their ends, so it is 10.'
        write: '$L_{1} = 10$'
        diagram_do:
          - {id: t, op: label, part: 'cell:2,1', text: 'L₁ = 10'}
      - say: '$D_1$ is the modal frequency minus the frequency of the class before, so 27 minus 10 is 17.'
        write: '$D_{1} = 27 - 10 = 17$'
        diagram_do:
          - {id: t, op: label, part: 'cell:1,2', text: 'class before'}
        doodle_do:
          - {id: nuts, op: highlight, part: c1}
      - say: '$D_2$ is the modal frequency minus the frequency of the class after, and 27 minus 19 is 8.'
        write: '$D_{2} = 27 - 19 = 8$'
        diagram_do:
          - {id: t, op: label, part: 'cell:3,2', text: 'class after'}
        doodle_do:
          - {id: nuts, op: highlight, part: c3}
      - say: '$c$ is the class width, so 20 minus 10 is 10.'
        write: '$c = 20 - 10 = 10$'
      - section: 'Substitute'
        say: 'Substitute the four values into the formula.'
        write: 'Mode $= 10 + \left(\dfrac{17}{17 + 8}\right) \times 10$'
        point:
          - {line: 7, kind: move, from: {line: 3, at: '10'}, at: '=[[10]]+', text: 'L₁'}
          - {line: 7, kind: move, from: {line: 4, at: '=[[17]]'}, at: '17+8[[17]]', text: 'D₁'}
          - {line: 7, kind: move, from: {line: 5, at: '=[[8]]'}, at: '17+[[8]]', text: 'D₂'}
      - say: '17 plus 8 is 25, so it is 17 over 25, times 10.'
        write: '$= 10 + \dfrac{17}{25} \times 10$'
      - say: '17 over 25 is 0.68, and 0.68 times 10 is 6.8.'
        write: '$= 10 + 6.8$'
      - say: '10 plus 6.8 is 16.8 grams.'
        write: '$\therefore$ Mode $= 16.8$ g'
        doodle_do:
          - {id: nuts, op: stage, stage: 'custom:1993_q45_a2'}
        point:
          - {line: 10, kind: highlight, at: '168', to: {doodle: nuts, part: mode}}
      - section: 'Check'
        say: 'To check, the mode lies inside the modal class, and above its middle, 15, because the class after, 19, is fuller than the class before, 10.'
        write: 'Check: $15 < 16.8 < 20$ ✓'
      - section: 'Answer'
        say: 'So the mode is about 16.8 grams, which is option C.'
        write: '$\therefore$ Mode $\approx 16.8$ g'
        answer: true
    traps:
      A: 'You went for 13.2 grams. That is 20 minus 6.8, working down from the top of the class. The formula adds to $L_1$, the lower boundary, giving 10 plus 6.8.'
      B: 'You went for 15.0 grams, the class mark of the modal class. The formula leans the mode towards the fuller neighbour, giving 10 plus 17 over 25 times 10, which is 16.8.'
      D: 'You went for 17.5 grams. Check $D_1$ and $D_2$. 27 minus 10 is 17 and 27 minus 19 is 8, so the fraction is 17 over 25, giving 6.8, not 7.5.'
  46:
    moments:
      - section: 'The question'
        say: 'Ten pupils have a mean age of 16. Their teacher joins them and the mean jumps to 19. One person lifted the mean by 3 years, so the teacher must be much older. How old?'
        write: 'Mean of 10 pupils $= 16$; with the teacher, mean of 11 $= 19$'
      - section: 'Solution'
        say: 'Solution. The mean is the sum divided by the number of people. So the sum is the mean times the number.'
        write: 'Solution. Sum $=$ mean $\times$ number'
      - say: 'The sum of the pupils'' ages is 16 times 10, which is 160.'
        write: 'Sum of 10 pupils'' ages $= 16 \times 10 = 160$'
      - say: 'With the teacher there are 11 people, and their mean is 19. 19 times 11 is 209.'
        write: 'Sum of 11 ages $= 19 \times 11 = 209$'
      - say: 'Let the teacher''s age be $x$ years.'
        write: 'Let the teacher''s age be $x$ years'
      - say: 'The pupils'' sum plus $x$ makes the new sum, so 160 plus $x$ equals 209.'
        write: '$160 + x = 209$'
        point:
          - {line: 5, kind: move, from: {line: 2, at: '=[[160]]'}, at: '[[160]]+x', text: 'pupils'}
          - {line: 5, kind: move, from: {line: 3, at: '=[[209]]'}, at: '=[[209]]', text: 'all 11'}
      - say: 'Subtract 160 from both sides.'
        write: '$x = 209 - 160$'
      - say: '209 minus 160 is 49.'
        write: '$\therefore x = 49$ years'
      - section: 'Check'
        say: 'Check. 160 plus 49 is 209, and 209 divided by 11 is 19, the new mean.'
        write: 'Check: $\dfrac{160 + 49}{11} = \dfrac{209}{11} = 19$ ✓'
      - section: 'Answer'
        say: 'So the teacher is 49 years old, which is option D.'
        write: '$\therefore$ the teacher''s age $= 49$ years'
        answer: true
    traps:
      A: 'You went for 27. Use sums. 19 times 11 is 209 and 16 times 10 is 160. The teacher is 209 minus 160, which is 49.'
      B: 'You went for 35, which is 16 plus 19. Adding two means does not give an age. Use sum $=$ mean $\times$ number, and 209 minus 160 is 49.'
      C: 'You went for 38, twice the new mean. Work with sums. 19 times 11 is 209, 16 times 10 is 160, and the difference is 49.'
  47:
    moments:
      - section: 'The question'
        say: 'There are twenty observations in eight classes. The cf column finds the class that holds the middle value, and the median formula finds the spot inside it. Table first.'
        write: 'Median $= ?$'
        diagram:
          id: t
          kind: table
          columns: ['Class', 'Class boundaries', 'f', 'cf']
          rows: [['1 – 5', '0.5 – 5.5', 2, ''], ['6 – 10', '5.5 – 10.5', 4, ''], ['11 – 15', '10.5 – 15.5', 5, ''], ['16 – 20', '15.5 – 20.5', 2, ''], ['21 – 25', '20.5 – 25.5', 3, ''], ['26 – 30', '25.5 – 30.5', 2, ''], ['31 – 35', '30.5 – 35.5', 1, ''], ['36 – 40', '35.5 – 40.5', 1, '']]
          'on': 'Table'
      - section: 'Solution'
        say: 'Solution. The classes have gaps between them, so each class boundary sits halfway across the gap. Between 10 and 11, the boundary is 10.5.'
        write: 'Solution'
        diagram_do:
          - {id: t, op: highlight, part: 'col:2', text: 'halfway across each gap', 'on': 'boundary'}
      - say: 'Now the cf column, which is a running total of $f$. It reads 2, 6, 11, 13, 16, 18, 19 and 20.'
        diagram_do:
          - {id: t, op: total, part: 'col:3', into: 'col:4', 'on': 'running'}
      - say: 'The last cf is $N$, the total frequency, which is 20.'
        write: '$N = \sum f = 20$'
      - say: 'Half of $N$ is 20 over 2, which is 10. The median is the 10th value.'
        write: '$\dfrac{N}{2} = \dfrac{20}{2} = 10$'
      - say: 'Go down the cf column to the first cf that reaches 10. 6 is too small, but 11 passes it. So the median class is 11 to 15.'
        write: 'Median class: $11 - 15$'
        diagram_do:
          - {id: t, op: highlight, part: 'row:3', text: 'median class', 'on': 'median class'}
      - section: 'The formula'
        say: 'The median formula is $L_1$, plus $N$ over 2 minus cf, all over $f$, times $c$.'
        write: 'Median $= L_{1} + \left(\dfrac{\frac{N}{2} - cf}{f}\right) \times c$'
      - say: '$L_1$ is the lower class boundary of the median class, which is 10.5.'
        write: '$L_{1} = 10.5$'
        diagram_do:
          - {id: t, op: label, part: 'cell:3,2', text: 'L₁ = 10.5'}
      - say: 'cf is the cumulative frequency of the class before the median class, and that is 6.'
        write: '$cf = 6$'
        diagram_do:
          - {id: t, op: label, part: 'cell:2,4', text: 'class before'}
      - say: '$f$ is the frequency of the median class itself, which is 5.'
        write: '$f = 5$'
      - say: '$c$ is the class width, so 15.5 minus 10.5 is 5.'
        write: '$c = 15.5 - 10.5 = 5$'
      - section: 'Substitute'
        say: 'Substitute the four values into the formula.'
        write: 'Median $= 10.5 + \left(\dfrac{10 - 6}{5}\right) \times 5$'
        point:
          - {line: 11, kind: move, from: {line: 7, at: '105'}, at: '=[[105]]+', text: 'L₁'}
          - {line: 11, kind: move, from: {line: 8, at: '6'}, at: '10−[[6]]', text: 'cf'}
          - {line: 11, kind: move, from: {line: 9, at: '5'}, at: '[[5]]10', text: 'f'}
      - say: '10 minus 6 is 4. 4 over 5, times 5, is 4.'
        write: '$= 10.5 + \dfrac{4}{5} \times 5 = 10.5 + 4$'
      - say: '10.5 plus 4 is 14.5.'
        write: '$\therefore$ Median $= 14.5$'
      - section: 'Check'
        say: 'To check, the median must lie inside the median class, between 10.5 and 15.5. 14.5 does. It is near the top, because the 10th value is the 4th of the 5 in that class.'
        write: 'Check: $10.5 < 14.5 < 15.5$ ✓'
      - section: 'Answer'
        say: 'So the median is 14.5, which is option D.'
        write: '$\therefore$ Median $= 14.5$'
        answer: true
    traps:
      A: 'You went for 11.5. That moves only 1 into the class. $N$ over 2 minus cf is 10 minus 6, which is 4, and 4 over 5 times 5 is 4, so 10.5 plus 4 is 14.5.'
      B: 'You went for 12.5, the class mark of the median class 11 to 15. The class is right, but the formula places the median inside it, at 10.5 plus 4, which is 14.5.'
      C: 'You went for 14.0. That starts from the class limit 10 instead of $L_1$, the class boundary 10.5. 10.5 plus 4 is 14.5.'
  48:
    moments:
      - section: 'The question'
        say: 'A number is chosen at random between 20 and 30, both included. What is the probability that it is a prime? Picture a bowl of number balls, one for each.'
        write: '$20$ to $30$: $P(\text{prime}) = ?$'
        doodle: {name: 'custom:1993_q48_a', id: bowl, caption: 'pick one from 20 to 30'}
      - say: 'Solution. Let $E$ be the event that the number is a prime.'
        write: 'Solution: let $E$ = the number is prime'
      - section: 'The sample space'
        say: '"Both inclusive" means 20 and 30 are in the list.'
        write: '$S = \{20,\ 21,\ 22,\ \ldots,\ 30\}$'
      - say: 'n of $S$ is 30 minus 20, plus 1 because both ends count. That is 11 balls.'
        write: '$n(S) = 30 - 20 + 1 = 11$'
        doodle_do:
          - {id: bowl, op: label, text: '11 balls'}
      - section: 'The favourable outcomes'
        say: 'A prime has exactly two factors, 1 and itself. The even balls all divide by 2, so none of them is prime.'
        write: 'Even, not prime: $20, 22, 24, 26, 28, 30$'
        doodle_do:
          - {id: bowl, op: cross, part: evens}
      - say: 'Now test the odd ones. 21 is 3 times 7, 25 is 5 times 5, and 27 is 3 times 9. None of them is prime.'
        write: '$21 = 3 \times 7,\ \ 25 = 5 \times 5,\ \ 27 = 3 \times 9$'
      - say: 'That leaves 23 and 29. Neither divides by 2, 3 or 5, so both are prime.'
        write: '$E = \{23,\ 29\}$'
        doodle_do:
          - {id: bowl, op: circle, part: p23}
          - {id: bowl, op: circle, part: p29}
        point:
          - {line: 6, kind: highlight, at: '23', to: {doodle: bowl, part: p23}}
      - say: 'So n of $E$ is 2.'
        write: '$n(E) = 2$'
      - section: 'The probability'
        say: 'The probability of $E$ is n of $E$ over n of $S$, that is, the number of favourable outcomes over the total number of possible outcomes.'
        write: '$P(E) = \dfrac{n(E)}{n(S)}$'
      - say: 'Substitute, and we get 2 over 11.'
        write: '$= \dfrac{2}{11}$'
        point:
          - {line: 9, kind: move, from: {line: 7, at: '= 2'}, at: '11[[2]]', text: 'n(E)'}
          - {line: 9, kind: move, from: {line: 3, at: '= 11'}, at: '[[11]]2', text: 'n(S)'}
      - section: 'Check'
        say: 'Check the count. There are 6 even, 3 odd but not prime, and 2 primes. 6 plus 3 plus 2 is 11, so every ball is counted once.'
        write: 'Check: $6 + 3 + 2 = 11\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the probability that the number is a prime is 2 over 11, which is option A.'
        write: '$\therefore P(\text{prime}) = \dfrac{2}{11}$'
        answer: true
    traps:
      B: 'You went for 5 over 11. That counts all the odd numbers, 21, 23, 25, 27 and 29. But 21, 25 and 27 are not prime, so n of E is 2.'
      C: 'You went for 6 over 11. That counts the even numbers, and an even number above 2 is never prime. n of E is 2, for 23 and 29.'
      D: 'You went for 8 over 11. Test each number for factors. Only 23 and 29 are prime, so P of E is 2 over 11.'
  49:
    moments:
      - section: 'The question'
        say: 'We have seven numbers in a row, 7 to 13. How far, on average, do they spread from their mean? That is the standard deviation, S.D.'
        write: 'Data: $7,\ 8,\ 9,\ 10,\ 11,\ 12,\ 13$; S.D. $= ?$'
        doodle: {name: 'custom:1993_q49_a', id: stacks, caption: 'how far is each stack from 10?', size: scene}
      - section: 'Solution'
        say: 'Solution. The S.D. is the square root of the sum of the squared deviations over $n$. The deviations need the mean first.'
        write: 'S.D. $= \sqrt{\dfrac{\sum(x - \bar{x})^{2}}{n}}$'
      - say: 'The mean, $x$ bar, is the sum over $n$. 7 plus 8 plus 9 plus 10 plus 11 plus 12 plus 13 is 70, and 70 over 7 is 10.'
        write: '$\bar{x} = \dfrac{\sum x}{n} = \dfrac{70}{7} = 10$'
        doodle_do:
          - {id: stacks, op: pulse, part: mean}
      - section: 'The deviation table'
        say: 'Now the deviation table, with each $x$, then $x$ minus $x$ bar, then its square.'
        diagram:
          id: d
          kind: table
          columns: ['x', 'x − x̄', '(x − x̄)²']
          rows: [[7, '', ''], [8, '', ''], [9, '', ''], [10, '', ''], [11, '', ''], [12, '', ''], [13, '', '']]
          'on': 'table'
      - say: '7 minus 10 is minus 3. 8 minus 10 is minus 2. 9 minus 10 is minus 1.'
        diagram_do:
          - {id: d, op: fill, part: 'cell:1,2', text: '−3'}
          - {id: d, op: fill, part: 'cell:2,2', text: '−2'}
          - {id: d, op: fill, part: 'cell:3,2', text: '−1'}
      - say: '10 minus 10 is 0. 11 minus 10 is 1. 12 minus 10 is 2.'
        diagram_do:
          - {id: d, op: fill, part: 'cell:4,2', text: '0'}
          - {id: d, op: fill, part: 'cell:5,2', text: '1'}
          - {id: d, op: fill, part: 'cell:6,2', text: '2'}
      - say: '13 minus 10 is 3. Now square each deviation. Minus 3 squared is 9, and minus 2 squared is 4.'
        diagram_do:
          - {id: d, op: fill, part: 'cell:7,2', text: '3'}
          - {id: d, op: fill, part: 'cell:1,3', text: '9'}
          - {id: d, op: fill, part: 'cell:2,3', text: '4'}
        doodle_do:
          - {id: stacks, op: stage, stage: 'custom:1993_q49_a2'}
      - say: 'Minus 1 squared is 1, 0 squared is 0, and 1 squared is 1.'
        diagram_do:
          - {id: d, op: fill, part: 'cell:3,3', text: '1'}
          - {id: d, op: fill, part: 'cell:4,3', text: '0'}
          - {id: d, op: fill, part: 'cell:5,3', text: '1'}
      - say: '2 squared is 4, and 3 squared is 9. Squaring makes every deviation count as positive, so they cannot cancel.'
        diagram_do:
          - {id: d, op: fill, part: 'cell:6,3', text: '4'}
          - {id: d, op: fill, part: 'cell:7,3', text: '9'}
      - say: 'Add the last column. 9 plus 4 plus 1 plus 0 plus 1 plus 4 plus 9 is 28.'
        write: '$\sum(x - \bar{x})^{2} = 28$'
        diagram_do:
          - {id: d, op: total, part: 'col:3', 'on': 'Add'}
      - section: 'The variance'
        say: 'The variance is that sum over $n$, so 28 over 7, which is 4.'
        write: 'Variance $= \dfrac{\sum(x - \bar{x})^{2}}{n} = \dfrac{28}{7} = 4$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '28'}, at: '7[[28]]', text: 'Σ(x − x̄)²'}
      - say: 'The S.D. is the square root of the variance. The square root of 4 is 2.'
        write: '$\therefore$ S.D. $= \sqrt{4} = 2$'
      - section: 'Check'
        say: 'Check that the deviations add to 0, as they must. They are minus 3, minus 2, minus 1, 0, 1, 2 and 3, and they cancel in pairs.'
        write: 'Check: $\sum(x - \bar{x}) = 0$ ✓'
      - section: 'Answer'
        say: 'So the standard deviation is 2, which is option A.'
        write: '$\therefore$ S.D. $= 2$'
        answer: true
    traps:
      B: 'You went for 4. That is the variance, 28 over 7. The S.D. is its square root, which is 2.'
      C: 'You went for 10. That is the mean, $x$ bar. The S.D. measures the spread around it, and it is the square root of 28 over 7, which is 2.'
      D: 'You went for 11. Follow the table. The squared deviations add to 28, so divide by $n$, 7, to get 4, and the square root is 2.'
  50:
    moments:
      - section: 'The question'
        say: 'Three independent events $X$, $Y$ and $Z$ have probabilities a half, two thirds and a quarter. Picture three spinners, shaded that much. We want the probability that $Y$ and $Z$ only occur.'
        write: 'Solution: $P(X) = \dfrac{1}{2},\ P(Y) = \dfrac{2}{3},\ P(Z) = \dfrac{1}{4}$'
        doodle: {name: 'custom:1993_q50_a', id: spin, caption: 'three spinners, X, Y and Z'}
      - say: 'The word "only" matters. $Y$ occurs, $Z$ occurs, and $X$ does NOT occur. "$X$ does not occur" is $X$ complement, written $X$ prime.'
        write: '$Y$ and $Z$ only $= X^{\prime} \cap Y \cap Z$'
        doodle_do:
          - {id: spin, op: stage, stage: 'custom:1993_q50_a2'}
      - section: 'X does not occur'
        say: 'The probability that $X$ does not occur is 1 minus the probability that it does.'
        write: '$P(X^{\prime}) = 1 - P(X)$'
      - say: 'Substitute a half, and 1 minus a half is a half, the unshaded part of its spinner.'
        write: '$= 1 - \dfrac{1}{2} = \dfrac{1}{2}$'
        doodle_do:
          - {id: spin, op: label, part: x, text: 'not X: ½'}
      - section: 'Multiply'
        say: 'The events are independent, so by the multiplication rule, the probability of all three together is the product of their probabilities.'
        write: '$P(X^{\prime} \cap Y \cap Z) = P(X^{\prime}) \times P(Y) \times P(Z)$'
      - say: 'Now substitute a half for $X$ prime, which we just found, 2 over 3 for $Y$, and a quarter for $Z$.'
        write: '$= \dfrac{1}{2} \times \dfrac{2}{3} \times \dfrac{1}{4}$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '= [[21]]'}, at: '21', text: 'P(X′)'}
          - {line: 5, kind: move, from: {line: 0, at: 'P(Y) = [[32]]'}, at: '32', text: 'P(Y)'}
          - {line: 5, kind: move, from: {line: 0, at: 'P(Z) = [[41]]'}, at: '41', text: 'P(Z)'}
      - say: 'Multiply the tops, and 1 times 2 times 1 is 2. Multiply the bottoms, and 2 times 3 times 4 is 24.'
        write: '$= \dfrac{1 \times 2 \times 1}{2 \times 3 \times 4} = \dfrac{2}{24}$'
      - say: 'Divide the top and the bottom by 2, so 2 over 24 is 1 over 12.'
        write: '$= \dfrac{1}{12}$'
        doodle_do:
          - {id: spin, op: pulse}
      - section: 'Check'
        say: 'To check, $Y$ and $Z$, with $X$ free, is 2 over 3 times a quarter, which is 1 over 6. "Only" adds the factor a half for $X$ prime, so we take half of 1 over 6.'
        write: 'Check: $P(Y \cap Z) = \dfrac{2}{3} \times \dfrac{1}{4} = \dfrac{1}{6}$; $\ \dfrac{1}{2} \times \dfrac{1}{6} = \dfrac{1}{12}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the probability that $Y$ and $Z$ only occur is 1 over 12, which is option C.'
        write: '$\therefore P(Y \text{ and } Z \text{ only}) = \dfrac{1}{12}$'
        answer: true
    traps:
      A: 'You went for 1 over 8. That is a half times a quarter, which leaves out $Y$. We need $X$ prime, and $Y$, and $Z$, so a half times 2 over 3 times a quarter.'
      B: 'You went for 1 over 24. That used 1 over 3 for $Y$, its complement. P of $Y$ is 2 over 3, and a half times 2 over 3 times a quarter is 1 over 12.'
      D: 'You went for a quarter. That is P of $Z$ alone. "$Y$ and $Z$ only" means $X$ prime, $Y$ and $Z$ together, so multiply all three probabilities.'
