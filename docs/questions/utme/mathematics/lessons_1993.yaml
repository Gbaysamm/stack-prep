  44:
    moments:
      - say: 'Twenty students got these marks: picture the twenty of them. We want how many scored at least 50.'
        write: '$53, 30, 70, 84, 59, 43, 90, 20, 78, 48, 44, 60, 81, 73, 50, 37, 67, 68, 64, 52$'
        doodle: {name: 'student-small', id: cls, repeat: 20, layout: grid, caption: 'twenty students'}
      - say: 'First, what does "at least 50" mean? It means 50 or more. So a score of exactly 50 counts.'
        write: 'At least 50 means: mark $\ge 50$'
      - say: 'Most of the marks are 50 or more, so it''s quicker to count the ones below 50, then take 20 minus that. Picture two trays for the scripts: below 50, and at least 50.'
        write: 'Count the marks below 50 first:'
