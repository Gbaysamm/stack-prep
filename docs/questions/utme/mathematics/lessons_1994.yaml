          - {figure: sketch, kind: circle, target: '3x°'}
          - {figure: sketch, kind: circle, target: '(2z − 2y − x)°'}
      - say: 'The angles of any quadrilateral add up to 360 degrees, because a diagonal splits it into two triangles, and 2 times 180 is 360. Picture its four corners torn off and laid round a point: they make one full turn. So we add the three angles and take 360 minus the total.'
        write: 'Angles of a quadrilateral: $\ 2 \times 180^{\circ} = 360^{\circ}$'
        doodle: {name: 'custom:1994_q28_a', id: turn, caption: 'the four corners make a full turn'}
      - say: 'Add the three expressions together.'
        write: 'Sum of the three $= (3y - x - z) + 3x + (2z - 2y - x)$'
      - say: 'Collect the $x$ terms: negative $x$, plus $3x$, minus $x$. Negative 1 plus 3 minus 1 is 1, so that is just $x$.'
        write: '$x$ terms: $\ -x + 3x - x = x$'
      - say: 'The $y$ terms: $3y$ minus $2y$ is $y$.'
        write: '$y$ terms: $\ 3y - 2y = y$'
      - say: 'The $z$ terms: negative $z$ plus $2z$ is $z$.'
        write: '$z$ terms: $\ -z + 2z = z$'
      - say: 'So the three angles add up to just $x + y + z$, three of the corners.'
        write: 'Sum of the three $= x + y + z$'
        doodle_do:
