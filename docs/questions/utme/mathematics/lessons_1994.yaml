          - {line: 7, kind: move, from: {line: 5, at: '= [[y]]'}, at: '+ [[y]] +'}
          - {line: 7, kind: move, from: {line: 6, at: '= [[z]]'}, at: '+ [[z]]'}
      - say: 'The fourth angle is what''s left of the 360: 360 minus that whole sum.'
        write: 'Fourth angle $= 360 - (x + y + z)$'
        point:
          - {line: 8, kind: move, from: {line: 2, at: '= [[360]]'}, at: '360', text: 'angle sum'}
          - {line: 8, kind: move, from: {line: 7, at: 'x + y + z'}, at: '(x + y + z)', text: 'the three'}
          - {figure: sketch, kind: circle, target: '?', text: '360 − (x + y + z)'}
      - say: 'The minus sign in front of the bracket changes every sign inside it: the last corner.'
        write: '$= 360 - x - y - z$'
        doodle_do:
