  8:
    moments:
      - say: 'We''re told $A$ is a subset of $B$, and we must simplify $A$ intersect the complement of, $A$ intersect $B$.'
        write: '$A \cap (A \cap B)''$'
      - say: '$A$ is a subset of $B$ means every element of $A$ is also in $B$. Picture a small circle $A$ sitting completely inside a bigger circle $B$.'
        write: 'Given: $A \subseteq B$'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: A, text: 'inside B'}
      - say: 'Start with the inside bracket. $A$ intersect $B$ is everything in both $A$ and $B$. Since all of $A$ is already inside $B$, the overlap is just $A$ itself.'
        write: 'Since $A \subseteq B$: $\ A \cap B = A$'
      - say: 'So the complement of that bracket is the complement of $A$.'
        write: '$(A \cap B)'' = A''$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '= [[A]]'}, at: '= [[A′]]', text: 'A ∩ B is A'}
      - say: 'Now go back to the whole expression and replace the bracket with what we just found.'
        write: '$A \cap (A \cap B)'' = A \cap A''$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '= [[A′]]'}, at: '∩ [[A′]]', text: 'swap in'}
      - say: '$A$ complement means everything in the universal set $E$ that is not in $A$.'
        write: '$A'' = \{x \in E : x \notin A\}$'
        point:
          - {figure: sketch, kind: circle, target: E, text: 'A′: outside A'}
      - say: 'So $A$ intersect $A$ complement asks for elements that are in $A$ and, at the same time, not in $A$. Picture a bag $A$: some marbles are inside it, some are outside. We want a marble that is inside the bag and outside it at once.'
        write: '$x \in A \cap A'' \Rightarrow x \in A \text{ and } x \notin A$'
        doodle: {name: 'custom:1994_q08_a', id: bag, caption: 'in the bag and out of it?'}
      - say: 'No element can be inside a set and outside it at the same time: no marble can be in the bag and out of it. So there are no such elements at all.'
        write: 'Impossible, so $A \cap A''$ has no elements'
        doodle_do:
          - {id: bag, op: stage, stage: 'custom:1994_q08_a2'}
        point:
          - {line: 7, kind: highlight, at: 'no elements', to: {doodle: bag, part: both}}
      - say: 'So the result is the empty set, not a single marble, which is answer choice B.'
        write: '$A \cap (A \cap B)'' = \varnothing$'
        doodle_do:
          - {id: bag, op: label, part: both, text: 'empty set'}
        answer: true
    traps:
      A: 'You went for $A$. That drops the complement. $A \cap A$ is $A$, but $A \cap A''$ is the empty set, because nothing is both in $A$ and outside it.'
      C: 'You went for $B$. The expression intersects everything with $A$, so it can never be bigger than $A$. In fact $A \cap A''$ is empty.'
      D: 'You went for $E$, the universal set. An intersection with $A$ can never be more than $A$. Here it is $A \cap A''$, which is empty.'
  9:
    moments:
      - say: 'We need to solve 25 to the power $x$, plus 3 times 5 to the power $x$, equals 4.'
        write: '$25^{x} + 3(5^{x}) = 4$'
      - say: 'The rule for a power of a power: multiply the indices.'
        write: 'Power of a power: $\left(a^{m}\right)^{n} = a^{mn}$'
      - say: 'Notice that 25 is 5 squared. So 25 to the $x$ is 5 squared, to the power $x$.'
        write: '$25^{x} = (5^{2})^{x}$'
      - say: 'And 5 squared, to the power $x$, is the same as 5 to the $x$, all squared, because 2 times $x$ is the same as $x$ times 2.'
        write: '$= (5^{x})^{2}$'
      - say: 'So both terms are built from 5 to the $x$. This is a quadratic in disguise. Let''s make it plain by letting $u$ stand for 5 to the $x$.'
        write: 'Let $u = 5^{x}$'
      - say: 'Then 25 to the $x$ becomes $u$ squared, and 3 times 5 to the $x$ becomes $3u$.'
        write: 'So $u^{2} + 3u = 4$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '(5x)2'}, at: 'u2', text: '25ˣ'}
          - {line: 5, kind: move, from: {line: 4, at: '[[u]] = 5x'}, at: '3[[u]]', text: '5ˣ'}
      - say: 'Subtract 4 from both sides, to get zero on the right.'
        write: '$u^{2} + 3u - 4 = 0$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '= [[4]]'}, at: '− 4', text: 'across the ='}
      - say: 'To factorise, we need two numbers that multiply to negative 4 and add to 3. 4 times negative 1 is negative 4, and 4 plus negative 1 is 3.'
        write: '$4 \times (-1) = -4,\quad 4 + (-1) = 3$'
      - say: 'So the quadratic factorises into $u$ plus 4, times $u$ minus 1.'
        write: '$(u + 4)(u - 1) = 0$'
      - say: 'For a product to be zero, one bracket must be zero. So $u$ is negative 4, or $u$ is 1.'
        write: '$u = -4 \quad\text{or}\quad u = 1$'
      - say: 'Now go back to $x$, using $u$ equals 5 to the $x$. Can 5 to the $x$ be negative 4? Picture the powers of 5 as piles: every one stands above the ground. 5 to any power is always positive, so we throw that one out.'
        write: '$5^{x} = -4$: no solution'
        doodle: {name: 'custom:1994_q09_a', id: piles, caption: 'powers of 5 never go below 0'}
        doodle_do:
          - {id: piles, op: cross, part: neg}
        point:
          - {line: 9, kind: circle, at: 'u = −4'}
      - say: 'The other one gives 5 to the $x$ equals 1.'
        write: '$5^{x} = 1$'
        point:
          - {line: 9, kind: circle, at: 'u = 1'}
      - say: 'Any non-zero number to the power 0 is 1, so 5 to the power 0 is 1: the pile of one block.'
        write: '$5^{0} = 1$'
        doodle_do:
          - {id: piles, op: circle, part: p0}
        point:
          - {line: 12, kind: highlight, at: '1', to: {doodle: piles, part: p0}}
      - say: 'So $x$ is 0, which is answer choice B.'
        write: '$x = 0$'
        answer: true
    traps:
      A: 'You went for 1 or negative 4. Those are the values of $u$, not $x$, and $u$ equals negative 4 is impossible because 5 to the $x$ is always positive. From 5 to the $x$ equals 1, $x$ is 0.'
      C: 'You went for 1. That is the value of $u$, which is 5 to the $x$. We still need $x$: 5 to the $x$ equals 1 means $x$ is 0.'
      D: 'You went for negative 4 or 0. The 0 is right, but negative 4 was a value of $u$, and 5 to the $x$ can never be negative. So only $x$ equals 0 works.'
  10:
    moments:
      - section: 'The question'
        say: 'One square minus another square, over $5m$ squared minus $5u$ squared. Expanding the top is long and risky. Factorise top and bottom, and nearly everything cancels.'
        write: '$\dfrac{(2m - u)^{2} - (m - 2u)^{2}}{5m^{2} - 5u^{2}}$'
      - section: 'Solution'
        say: 'Solution. The top is one square minus another: picture a big square with a small square cut from its corner. Recall the difference of two squares.'
        write: 'Recall: $P^{2} - Q^{2} = (P - Q)(P + Q)$'
        doodle: {name: 'custom:1994_q10_a', id: sq, caption: 'a square with a corner cut away', 'on': 'picture'}
      - say: 'Let $P$ be the first bracket, $2m$ minus $u$, the big square''s side. Let $Q$ be the second bracket, $m$ minus $2u$, the cut corner''s side.'
        write: 'Let $P = 2m - u,\ Q = m - 2u$'
        doodle_do:
          - {id: sq, op: label, part: big, text: 'P = 2m − u'}
          - {id: sq, op: label, part: small, text: 'Q = m − 2u'}
      - section: 'Factorise the top'
        say: 'So the top is $P$ minus $Q$, times $P$ plus $Q$. Keep each bracket whole, inside square brackets.'
        write: 'Top $= [(2m - u) - (m - 2u)][(2m - u) + (m - 2u)]$'
      - say: 'Open the inner brackets. In the first, the minus in front changes both signs: minus $m$, plus $2u$.'
        write: '$= [2m - u - m + 2u][2m - u + m - 2u]$'
      - say: 'Collect like terms. $2m$ minus $m$ is $m$, minus $u$ plus $2u$ is $u$. Then $2m$ plus $m$ is $3m$, minus $u$ minus $2u$ is minus $3u$.'
        write: '$= (m + u)(3m - 3u)$'
      - say: '3 is common to both terms of the second bracket, so take out the 3.'
        write: '$= 3(m + u)(m - u)$'
      - section: 'Factorise the bottom'
        say: 'Now the bottom. 5 is common to both terms, so take out the 5.'
        write: 'Bottom $= 5m^{2} - 5u^{2} = 5(m^{2} - u^{2})$'
      - say: '$m$ squared minus $u$ squared is another difference of two squares, another square with a corner cut: $m$ plus $u$, times $m$ minus $u$.'
        write: '$= 5(m + u)(m - u)$'
        doodle_do:
          - {id: sq, op: pulse}
      - section: 'Cancel common factors'
        say: 'Now put the factorised top over the factorised bottom.'
        write: 'Expression $= \dfrac{3(m + u)(m - u)}{5(m + u)(m - u)}$'
      - say: 'The bracket $m$ plus $u$ is a factor of the top and of the bottom, so it cancels. So does $m$ minus $u$. Only 3 over 5 is left.'
        write: '$= \dfrac{3}{5}$'
      - section: 'Check'
        say: 'Check with $m = 2$ and $u = 1$. The top is 3 squared minus 0 squared, which is 9. The bottom is 20 minus 5, which is 15. 9 over 15 is 3 over 5.'
        write: 'Check: $\dfrac{3^{2} - 0^{2}}{20 - 5} = \dfrac{9}{15} = \dfrac{3}{5}$'
      - say: 'Every letter has cancelled. Therefore the expression simplifies to 3 over 5, which is answer choice B.'
        write: '$\therefore$ the expression $= \dfrac{3}{5}$'
        answer: true
    traps:
      A: 'You went for 3 over 4. The 3 on top is right, but the bottom is 5 times $m^{2} - u^{2}$, so after cancelling a 5 is left, not a 4.'
      C: 'You went for $2m - u$ over $5m + u$. That cancels pieces that are added or subtracted, which is not allowed. Factorise top and bottom fully and every bracket cancels, leaving 3 over 5.'
      D: 'You went for $m - 2u$ over $m + 5u$. You can only cancel whole factors, not pieces of a bracket. The top is 3 times $(m + u)(m - u)$, and the bottom is 5 times the same two brackets.'
  11:
    moments:
      - section: 'The question'
        say: 'Four terms, and nothing common to all four. When that happens, we group them in pairs. The trick is choosing the right pairs.'
        write: '$a^{2}x - b^{2}y - b^{2}x + a^{2}y$'
      - section: 'Solution'
        say: 'Solution. Rearrange so the two $a$ squared terms sit together and the two $b$ squared terms sit together. Picture the four terms as four pieces of one rectangle.'
        write: '$= a^{2}x + a^{2}y - b^{2}x - b^{2}y$'
        doodle: {name: 'custom:1994_q11_a', id: rect, caption: 'four terms, one rectangle', 'on': 'Picture'}
      - section: 'Group in pairs'
        say: 'Group in pairs. The minus sign in front of the second bracket changes the minus $b$ squared $y$ inside it to plus.'
        write: '$= (a^{2}x + a^{2}y) - (b^{2}x + b^{2}y)$'
      - say: 'From the first pair take out $a$ squared, leaving $x$ plus $y$. From the second pair take out $b$ squared, leaving $x$ plus $y$ again.'
        write: '$= a^{2}(x + y) - b^{2}(x + y)$'
        doodle_do:
          - {id: rect, op: highlight, part: row-a, 'on': 'first'}
          - {id: rect, op: highlight, part: row-b, 'on': 'second'}
      - say: 'The two brackets are the same, so the grouping is right. Take out the common bracket, $x$ plus $y$, the rectangle''s width. What is left is $a$ squared minus $b$ squared.'
        write: '$= (x + y)(a^{2} - b^{2})$'
        doodle_do:
          - {id: rect, op: stage, stage: 'custom:1994_q11_a2'}
      - section: 'Difference of two squares'
        say: 'We are not finished. $a$ squared minus $b$ squared is a difference of two squares, so it factorises again: $a$ minus $b$, times $a$ plus $b$.'
        write: '$a^{2} - b^{2} = (a - b)(a + b)$'
      - say: 'Put those two brackets in place of $a$ squared minus $b$ squared. Now no bracket can be factorised further.'
        write: 'So the expression $= (x + y)(a - b)(a + b)$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '(a − b)(a + b)'}, at: '(a − b)(a + b)', text: 'in its place'}
      - section: 'Check'
        say: 'Check by expanding back. $x$ plus $y$, times $a$ squared minus $b$ squared, gives back the four terms we started with.'
        write: 'Check: $(x + y)(a^{2} - b^{2}) = a^{2}x + a^{2}y - b^{2}x - b^{2}y$'
      - say: 'Therefore the expression factorises fully as $x$ plus $y$, times $a$ minus $b$, times $a$ plus $b$, which is answer choice D.'
        write: '$\therefore$ the factors are $(x + y)(a - b)(a + b)$'
        answer: true
    traps:
      A: 'You went for $(a - b)(x + y)$. That leaves out the factor $a + b$. After grouping you get $(x + y)(a^{2} - b^{2})$, and $a^{2} - b^{2}$ splits into $(a - b)(a + b)$.'
      B: 'You went for $(y - x)(a - b)(a + b)$. The common bracket is $x + y$, not $y - x$: $a^{2}x$ and $a^{2}y$ both carry a plus sign.'
      C: 'You went for $(x - y)(a - b)(a + b)$. Look at the signs: $a^{2}x$ and $a^{2}y$ are both positive, so the common bracket is $x + y$, not $x - y$.'
  12:
    moments:
      - section: 'The question'
        say: 'Two factors given, and two unknowns to find. Each factor gives one equation in $p$ and $q$. Then it is simultaneous equations, which you already know.'
        write: 'Factors $(x - 1)$ and $(x - 3)$; find $p$ and $q$'
      - section: 'Solution'
        say: 'Solution. Let $f$ of $x$ be the cubic expression.'
        write: 'Let $f(x) = px^{3} + qx^{2} + 11x - 6$'
      - say: 'Recall the factor theorem: $x$ minus $a$ is a factor of $f$ of $x$ if $f$ of $a$ is zero. A factor leaves no remainder.'
        write: '$(x - a)$ is a factor $\Leftrightarrow f(a) = 0$'
      - section: 'First factor'
        say: 'Let $x$ minus 1 equal zero. Then $x$ is 1.'
        write: 'Let $x - 1 = 0$, $\therefore x = 1$'
      - say: 'Substitute 1 for every $x$, each value in brackets, and set it equal to zero.'
        write: '$f(1) = p(1)^{3} + q(1)^{2} + 11(1) - 6 = 0$'
      - say: '1 cubed and 1 squared are both 1. So we have $p$ plus $q$ plus 11 minus 6, and 11 minus 6 is 5.'
        write: '$p + q + 5 = 0$'
      - say: 'Subtract 5 from both sides. Label this equation 1.'
        write: '$p + q = -5 \quad \ldots\ldots (1)$'
      - section: 'Second factor'
        say: 'Let $x$ minus 3 equal zero. Then $x$ is 3.'
        write: 'Let $x - 3 = 0$, $\therefore x = 3$'
      - say: 'Substitute 3 for every $x$, each value in brackets, and set it equal to zero.'
        write: '$f(3) = p(3)^{3} + q(3)^{2} + 11(3) - 6 = 0$'
      - say: '3 cubed is 27, 3 squared is 9, and 11 times 3 is 33. Then 33 minus 6 is 27.'
        write: '$27p + 9q + 27 = 0$'
      - say: 'Subtract 27 from both sides.'
        write: '$27p + 9q = -27$'
      - say: 'Every term divides by 9, so divide through by 9 to keep the numbers small. Label this equation 2.'
        write: '$3p + q = -3 \quad \ldots\ldots (2)$'
      - section: 'Solve (1) and (2)'
        say: 'Both equations have one $q$. So subtract equation 1 from equation 2, and the $q$ cancels. Picture the two equations as two baskets.'
        write: '(2) − (1): $\ 3p - p = -3 - (-5)$'
        doodle: {name: 'custom:1994_q12_a', id: baskets, caption: '(1) p + q and (2) 3p + q', 'on': 'Picture'}
      - say: '$3p$ minus $p$ is $2p$, the two extra $p$ in the second basket. Minus 3 minus minus 5 is minus 3 plus 5, which is 2.'
        write: '$2p = 2$'
        doodle_do:
          - {id: baskets, op: stage, stage: 'custom:1994_q12_a2'}
        point:
          - {line: 13, kind: highlight, at: '2p', to: {doodle: baskets, part: extra}}
      - say: 'Divide both sides by 2. Each extra $p$ is worth 1.'
        write: '$p = 1$'
        doodle_do:
          - {id: baskets, op: label, part: extra, text: 'p = 1'}
      - say: 'Substitute $p = 1$ in equation 1, the first basket.'
        write: 'Sub. $p = 1$ in (1): $\ 1 + q = -5$'
        doodle_do:
          - {id: baskets, op: circle, part: b1}
        point:
          - {line: 15, kind: move, from: {line: 14, at: '1'}, at: '1 + q', text: 'sub in'}
      - say: 'Subtract 1 from both sides. Minus 5 minus 1 is minus 6.'
        write: '$q = -5 - 1 = -6$'
      - section: 'Check'
        say: 'Check with $x = 3$, $p = 1$ and $q = -6$. 27 minus 54 plus 33 minus 6 is zero, so $x$ minus 3 is a factor.'
        write: 'Check: $f(3) = 27 - 54 + 33 - 6 = 0$'
      - say: 'Therefore $p$ is 1 and $q$ is minus 6, which is answer choice B.'
        write: '$\therefore p = 1,\ q = -6$'
        answer: true
    traps:
      A: 'You went for minus 1 and minus 6. Then $p + q$ would be minus 7, not minus 5. Subtracting the equations gives $2p = 2$, so $p$ is plus 1.'
      C: 'You went for 1 and 6. Then $p + q$ would be 7, but putting $x = 1$ in gives $p + q = -5$. So $q$ is minus 6.'
      D: 'You went for 6 and minus 1. Then $p + q$ would be 5, not minus 5. Solving equations (1) and (2) gives $p = 1$ and $q = -6$.'
  13:
    moments:
      - say: 'We have to pick the equation of the curve in the graph. In the diagram, it passes through the point 3, 0 on the $x$-axis and cuts the $y$-axis at 0, negative 27. Any correct equation must fit both points.'
        write: 'Points on the curve: $(3,\ 0)$ and $(0,\ -27)$'
        point:
          - {figure: 0, kind: circle, target: '(3, 0)'}
          - {figure: 0, kind: circle, target: '(0, -27)'}
      - say: 'Test option A, $y = (x - 3)^{3}$. At $x = 3$: 3 minus 3 is 0, and 0 cubed is 0. That fits.'
        write: 'A at $x = 3$: $\ (3 - 3)^{3} = 0^{3} = 0$'
      - say: 'At $x = 0$: 0 minus 3 is negative 3, and negative 3 cubed is negative 27. That fits too.'
        write: 'A at $x = 0$: $\ (0 - 3)^{3} = (-3)^{3} = -27$'
      - say: 'Option B, $y = (x + 3)^{3}$. At $x = 0$: 0 plus 3 is 3, and 3 cubed is positive 27. The graph has negative 27, so B is out.'
        write: 'B at $x = 0$: $\ (0 + 3)^{3} = 27$'
        point:
          - {figure: 0, kind: 'circle', target: '(0, -27)', text: '−27, not 27'}
      - say: 'Option C, $y = x^{3} - 27$. At $x = 3$: 27 minus 27 is 0. At $x = 0$: 0 minus 27 is negative 27. Both points fit this one as well.'
        write: 'C: $\ 3^{3} - 27 = 0,\quad 0^{3} - 27 = -27$'
      - say: 'Option D, $y = -x^{3} + 27$. At $x = 0$ it gives 0 plus 27, which is positive 27, so D is out.'
        write: 'D at $x = 0$: $\ -0^{3} + 27 = 27$'
      - say: 'So A and C both pass through the two marked points. To choose between them, we look at the shape of the curve: where does it go flat?'
        point:
          - {figure: 0, kind: 'circle', target: '(3, 0)'}
          - {figure: 0, kind: 'circle', target: '(0, -27)'}
      - say: 'The gradient tells us how steep a curve is. For A, the gradient is 3 times $x - 3$ squared. At $x = 3$ that is 3 times 0 squared, which is 0. So A is flat as it crosses the $x$-axis.'
        write: 'A: $\ \dfrac{dy}{dx} = 3(x - 3)^{2} = 3(0)^{2} = 0$ at $x = 3$'
        point:
          - {figure: 0, kind: 'circle', target: '(3, 0)', text: 'gradient 0?'}
      - say: 'For C, the gradient is 3 $x$ squared. At $x = 3$ that is 3 times 9, which is 27, very steep. C goes flat at $x = 0$ instead.'
        write: 'C: $\ \dfrac{dy}{dx} = 3x^{2} = 3(9) = 27$ at $x = 3$'
      - say: 'Now look back at the diagram. The curve flattens out exactly where it meets the $x$-axis at 3, 0, and it is steep where it cuts the $y$-axis. That is the shape of A, not C.'
        write: 'Graph is flat at $(3,\ 0)$, so it is A'
        point:
          - {line: 7, kind: arrow, text: 'gradient 0'}
          - {line: 8, kind: strike, text: 'not flat'}
          - {figure: 0, kind: arrow, target: '(3, 0)', text: 'flat here'}
      - say: 'So the equation is $y = (x - 3)^{3}$, which is answer choice A.'
        write: '$y = (x - 3)^{3}$'
        answer: true
    traps:
      B: 'You went for $y = (x + 3)^{3}$. At $x = 0$ that gives positive 27, but the graph cuts the $y$-axis at negative 27. It would also cross the $x$-axis at negative 3, not 3.'
      C: 'You went for $y = x^{3} - 27$. It does pass through both marked points, but its gradient at $x = 3$ is 27, so it would be steep there. The drawn curve flattens at 3, 0, which fits $y = (x - 3)^{3}$.'
      D: 'You went for $y = -x^{3} + 27$. At $x = 0$ that gives positive 27, not negative 27, and it falls from left to right while the drawn curve rises.'
  14:
    moments:
      - section: 'The question'
        say: 'Letters and numbers together. Put the numbers in first, and it becomes one fraction equal to another. Then we cross multiply.'
        write: '$\dfrac{a}{a - x} = \dfrac{b}{x - b}$'
      - section: 'Solution'
        say: 'Solution. Write the givens: $a$ is 1 and $b$ is 3.'
        write: '$a = 1,\ b = 3$'
      - say: 'Substitute them into the equation: replace $a$ with 1 and $b$ with 3.'
        write: '$\dfrac{1}{1 - x} = \dfrac{3}{x - 3}$'
      - section: 'Cross multiply'
        say: 'One fraction equals another, so cross multiply: 1 times $x$ minus 3 equals 3 times 1 minus $x$.'
        write: '$1(x - 3) = 3(1 - x)$'
      - say: 'Open the brackets. The left is just $x$ minus 3. On the right, 3 times 1 is 3, and 3 times minus $x$ is minus $3x$.'
        write: '$x - 3 = 3 - 3x$'
      - say: 'Collect like terms: $x$ terms on the left, numbers on the right. Minus $3x$ crosses over as plus $3x$, and minus 3 crosses over as plus 3.'
        write: '$x + 3x = 3 + 3$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '− 3x'}, at: '+ 3x', text: 'across the ='}
      - say: '$x$ plus $3x$ is $4x$, and 3 plus 3 is 6.'
        write: '$4x = 6$'
      - say: 'Divide both sides by 4, the coefficient of $x$. 6 over 4 reduces to 3 over 2.'
        write: '$x = \dfrac{6}{4} = \dfrac{3}{2}$'
      - section: 'Check'
        say: 'Check with $x$ equals 1.5. The left side is 1 over 1 minus 1.5, which is 1 over minus 0.5, and that is minus 2.'
        write: 'Left: $\ \dfrac{1}{1 - 1.5} = \dfrac{1}{-0.5} = -2$'
      - say: 'The right side is 3 over 1.5 minus 3, which is 3 over minus 1.5, and that is also minus 2. The two sides agree.'
        write: 'Right: $\ \dfrac{3}{1.5 - 3} = \dfrac{3}{-1.5} = -2$'
      - say: 'Therefore $x$ is 3 over 2, which is answer choice C.'
        write: '$\therefore x = \dfrac{3}{2}$'
        answer: true
    traps:
      A: 'You went for 4 over 3. Put it back in: the left side is 1 over minus 1 over 3, which is minus 3, but the right side is 3 over minus 5 over 3, which is minus 9 over 5. From $4x = 6$, $x$ is 3 over 2.'
      B: 'You went for 2 over 3. That is the reciprocal of the right answer. From $4x = 6$, $x$ is 6 over 4, which is 3 over 2.'
      D: 'You went for 3 over 4. That comes from $4x = 3$, forgetting to carry the minus 3 across. Collecting properly gives $4x = 3 + 3 = 6$, so $x$ is 3 over 2.'
  15:
    moments:
      - section: 'The question'
        say: 'Three fractions with three different denominators. Many students start guessing here. Multiply through by the LCM, and every fraction disappears.'
        write: '$\dfrac{1}{r - 1} + \dfrac{2}{r + 1} = \dfrac{3}{r}$'
      - section: 'Solution'
        say: 'Solution. The denominators are $r$ minus 1, $r$ plus 1 and $r$. They share no factor, so the LCM is their product.'
        write: 'LCM $= r(r - 1)(r + 1)$'
      - say: 'Multiply every term on both sides by the LCM. Each fraction then loses its denominator.'
        write: 'Multiply through by $r(r - 1)(r + 1)$:'
      - say: 'In the first term, $r$ minus 1 cancels, leaving $r$ times $r$ plus 1. In the second, $r$ plus 1 cancels. On the right, $r$ cancels.'
        write: '$r(r + 1) + 2r(r - 1) = 3(r - 1)(r + 1)$'
      - section: 'Open the brackets'
        say: 'Open the brackets on the left: $r$ squared plus $r$, then $2r$ squared minus $2r$. On the right, $r$ minus 1 times $r$ plus 1 is $r$ squared minus 1.'
        write: '$r^{2} + r + 2r^{2} - 2r = 3(r^{2} - 1)$'
      - say: '3 times $r$ squared minus 1 is $3r$ squared minus 3.'
        write: '$r^{2} + r + 2r^{2} - 2r = 3r^{2} - 3$'
      - say: 'Collect like terms on the left. $r$ squared plus $2r$ squared is $3r$ squared, and $r$ minus $2r$ is minus $r$.'
        write: '$3r^{2} - r = 3r^{2} - 3$'
      - say: 'Subtract $3r$ squared from both sides. The squared terms cancel, so this is not a quadratic after all.'
        write: '$-r = -3$'
        point:
          - {line: 6, kind: strike, at: '3r2 − r', text: 'cancels'}
          - {line: 6, kind: strike, at: '= 3r2', text: 'cancels'}
      - say: 'Divide both sides by minus 1.'
        write: '$r = 3$'
      - section: 'Check'
        say: 'Check $r = 3$. 1 over 3 minus 1 is 1 over 2. 2 over 3 plus 1 is 2 over 4, also a half. A half plus a half is 1, and 3 over 3 is 1.'
        write: 'Check: $\dfrac{1}{2} + \dfrac{2}{4} = 1 = \dfrac{3}{3}$'
      - say: 'Therefore $r$ is 3, which is answer choice A.'
        write: '$\therefore r = 3$'
        answer: true
    traps:
      B: 'You went for 4. Try it: 1 over 3 plus 2 over 5 is 11 over 15, but the right side is 3 over 4. They don''t match. Clearing the fractions gives $-r = -3$, so $r$ is 3.'
      C: 'You went for 5. Try it: 1 over 4 plus 2 over 6 is 7 over 12, but the right side is 3 over 5. Multiply through by the LCM and the $r^{2}$ terms cancel, leaving $r = 3$.'
      D: 'You went for 6. Try it: 1 over 5 plus 2 over 7 is 17 over 35, but 3 over 6 is a half. Multiply every term by the LCM, and $r$ comes out as 3.'
  16:
    moments:
      - section: 'The question'
        say: 'Partial fractions: one fraction split into two simpler ones. We only need $P$, and one well-chosen value of $x$ finds it in a few lines.'
        write: '$\dfrac{x - 3}{(1 - x)(x + 2)} = \dfrac{P}{1 - x} + \dfrac{Q}{x + 2}$'
      - section: 'Solution'
        say: 'Solution. Write it as an identity, with the three-line sign. It means both sides are equal for every value of $x$.'
        write: 'Let $\dfrac{x - 3}{(1 - x)(x + 2)} \equiv \dfrac{P}{1 - x} + \dfrac{Q}{x + 2}$'
      - say: 'Multiply through by the denominator, $1 - x$ times $x + 2$. On the right, $P$ keeps $x + 2$, and $Q$ keeps $1 - x$.'
        write: '$x - 3 \equiv P(x + 2) + Q(1 - x)$'
      - section: 'Find P'
        say: 'We want $P$, so choose the value of $x$ that makes the $Q$ bracket zero. Let $1 - x$ equal zero: then $x$ is 1.'
        write: 'Let $1 - x = 0$, $\therefore x = 1$'
      - say: 'Substitute $x = 1$ on both sides, each value in brackets.'
        write: '$(1) - 3 = P(1 + 2) + Q(1 - 1)$'
      - say: '1 minus 3 is minus 2. 1 plus 2 is 3, and 1 minus 1 is zero, so the $Q$ term vanishes.'
        write: '$-2 = 3P + 0$'
      - say: 'Divide both sides by 3.'
        write: '$P = -\dfrac{2}{3}$'
      - section: 'Check'
        say: 'Check by finding $Q$ too. Let $x + 2$ equal zero, so $x$ is minus 2. The left is minus 5, and the right is $3Q$.'
        write: 'Let $x = -2$: $\ -5 = 3Q$, $\therefore Q = -\dfrac{5}{3}$'
      - say: 'Now test $x = 0$. The left is minus 3. The right is $2P$ plus $Q$: minus 4 over 3 minus 5 over 3, which is minus 9 over 3, minus 3.'
        write: '$x = 0$: $\ 2\left(-\dfrac{2}{3}\right) - \dfrac{5}{3} = -\dfrac{9}{3} = -3$'
      - say: 'Both sides agree. Therefore $P$ is minus 2 over 3, which is answer choice A.'
        write: '$\therefore P = -\dfrac{2}{3}$'
        answer: true
    traps:
      B: 'You went for minus 5 over 3. That is $Q$, not $P$; it comes from putting $x = -2$. $P$ sits over $1 - x$, so put $x = 1$ to find it.'
      C: 'You went for 5 over 3. That is $Q$ with its sign lost. To find $P$, put $x = 1$: minus 2 equals $3P$.'
      D: 'You went for 2 over 3. The size is right, but the sign is lost: 1 minus 3 is minus 2, so $3P$ is minus 2 and $P$ is minus 2 over 3.'
  17:
    moments:
      - section: 'The question'
        say: '1 over $x$ is greater than 2. It is tempting to multiply both sides by $x$. But if $x$ is negative, that reverses the sign, and we don''t know its sign. So we use a safer road.'
        write: '$\dfrac{1}{x} > 2$'
      - say: 'Solution. Bring everything to one side, so we compare with zero. Subtract 2 from both sides.'
        write: 'Solution: $\ \dfrac{1}{x} - 2 > 0$'
      - say: 'Make one fraction over $x$. 2 is $2x$ over $x$.'
        write: '$\dfrac{1 - 2x}{x} > 0$'
      - say: 'Critical values: the top, 1 minus $2x$, is zero at a half. The bottom, $x$, is zero at 0, where the fraction has no meaning.'
        write: 'Critical values: $\ x = 0,\ \ x = \dfrac{1}{2}$'
      - section: 'Sign table'
        say: 'Now the sign table: three regions, a row for the top, a row for the bottom, then the fraction.'
        diagram:
          id: t
          kind: table
          columns: ['Factor', 'x < 0', '0 < x < ½', 'x > ½']
          rows: [['1 − 2x', '', '', ''], ['x', '', '', ''], ['fraction', '', '', '']]
      - say: '1 minus $2x$ is positive below a half, and negative above it.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,2', text: '+'}
          - {id: t, op: fill, part: 'cell:1,3', text: '+'}
          - {id: t, op: fill, part: 'cell:1,4', text: '−'}
      - say: '$x$ is negative below 0, and positive above it.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:2,2', text: '−'}
          - {id: t, op: fill, part: 'cell:2,3', text: '+'}
          - {id: t, op: fill, part: 'cell:2,4', text: '+'}
      - say: 'Divide the signs down each column: plus over minus is minus, plus over plus is plus, minus over plus is minus.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:3,2', text: '−'}
          - {id: t, op: fill, part: 'cell:3,3', text: '+', colour: green}
          - {id: t, op: fill, part: 'cell:3,4', text: '−'}
      - section: 'Answer'
        say: 'We want the fraction greater than zero, which is the middle column.'
        write: '$\therefore\ 0 < x < \dfrac{1}{2}$'
      - say: 'On a number line: open circles at 0 and a half, and the stretch between.'
        diagram: {id: n, kind: numberline, range: [-1, 2], step: 0.5}
        diagram_do:
          - {id: n, op: interval, from: 0, to: 0.5, from_open: true, to_open: true, text: '0 < x < ½', answer: true, 'on': 'open circles'}
      - section: 'Check'
        say: 'Check $x$ equals a quarter, inside: 1 over a quarter is 4, greater than 2. And minus 1, outside: 1 over minus 1 is minus 1, not greater than 2.'
        write: 'Check: $\ \dfrac{1}{0.25} = 4 > 2\ \checkmark;\ \ \dfrac{1}{-1} = -1 < 2$'
      - say: 'So $x$ lies between 0 and a half: option C.'
        write: '$0 < x < \dfrac{1}{2}$'
        answer: true
    traps:
      A: 'You went for $x < \tfrac{1}{2}$. That comes from multiplying by $x$ without knowing its sign, and it lets in every negative number. At $x = -1$, 1 over $x$ is minus 1, not more than 2. The sign table gives $0 < x < \tfrac{1}{2}$.'
      B: 'You went for $x < 0$ or $x > \tfrac{1}{2}$. Those are the two columns where the fraction is negative. We want it positive, the middle column.'
      D: 'You went for $1 < x < 2$. Try $x = 1.5$: 1 over 1.5 is two thirds, not more than 2. The sign table gives $0 < x < \tfrac{1}{2}$.'
  18:
    moments:
      - section: 'The question'
        say: 'Four options, one boundary line, and only two decisions: which side of the line is shaded, and is the line itself included?'
        write: 'Boundary: $\ 2x - y - 2 = 0$'
        point:
          - {figure: 0, kind: circle, target: '2x - y - 2 = 0', text: 'boundary'}
      - say: 'Solution. First match the line to the diagram by its intercepts. Put $y$ equals 0: $2x$ minus 2 is 0, so $x$ is 1.'
        write: 'Solution: $\ y = 0$: $\ 2x - 2 = 0 \Rightarrow x = 1$'
        point:
          - {figure: 0, kind: circle, target: '1', text: '(1, 0)'}
      - say: 'Put $x$ equals 0: minus $y$ minus 2 is 0, so $y$ is minus 2. The line passes through 1, 0 and 0, minus 2, as drawn.'
        write: '$x = 0$: $\ -y - 2 = 0 \Rightarrow y = -2$'
        point:
          - {figure: 0, kind: circle, target: '-2', text: '(0, −2)'}
      - section: 'Test a point'
        say: 'On one side of the line $2x - y - 2$ is positive, on the other negative. The easiest test point is the origin, 0, 0.'
        write: 'Test $(0,\ 0)$: $\ 2(0) - 0 - 2 = -2 < 0$'
        point:
          - {figure: 0, kind: circle, target: '0', text: 'origin'}
      - say: 'In the diagram the origin is not in the shaded part. So the shaded side is the other side, where the expression is positive.'
        write: 'Origin not shaded, so shaded side: $\ 2x - y - 2 > 0$'
      - say: 'Confirm with a shaded point, 3, 0. 2 times 3 is 6, minus 0, minus 2, gives 4. Positive, as expected.'
        write: 'Check $(3,\ 0)$: $\ 2(3) - 0 - 2 = 4 > 0\ \checkmark$'
        point:
          - {figure: 0, kind: circle, target: '3', text: '(3, 0)'}
      - say: 'Exam tip. In a JAMB diagram like this, the shaded part is the region asked for. When you draw your own graph, many textbooks shade the part not wanted instead, so always state which.'
      - section: 'The boundary'
        say: 'Now, is the line included? It is drawn solid, not broken. A solid line means equal to is allowed, so the sign is "or equal to".'
        write: 'Solid line: include $= 0$'
        point:
          - {figure: 0, kind: circle, target: '2x - y - 2 = 0', text: 'solid line'}
      - say: 'Greater than zero, together with equal to zero, gives greater than or equal to zero.'
        write: '$\therefore\ 2x - y - 2 \ge 0$'
      - say: 'So the shaded portion is $2x - y - 2 \ge 0$: option B.'
        write: '$2x - y - 2 \ge 0$'
        answer: true
        point:
          - {figure: 0, kind: label, target: {x: 290, y: 190}, text: '≥ 0'}
    traps:
      A: 'You went for less than or equal to. That describes the origin''s side, which is not shaded. Testing 0, 0 gives minus 2, so the shaded side is greater than or equal to 0.'
      C: 'You went for strictly less than. That is the unshaded side, and it also leaves out the solid boundary. The shaded side gives positive values, and the solid line includes equality.'
      D: 'You went for strictly greater than. The side is right, but the boundary line is solid, so the points on it count. That needs greater than or equal to.'
  19:
    moments:
      - section: 'The question'
        say: 'A staircase starts at height 1, and its 6th step is at height 11. Every step rises by the same amount. How much? Count the rises carefully, because that is where most students slip.'
        write: 'Common difference $d = ?$'
        doodle: {name: 'custom:1994_q19_a', id: stairs, caption: 'equal rises from 1 up to 11', size: scene}
      - section: 'What we know'
        say: 'This is an arithmetic progression, an A P. In an A P, each term is the term before it plus the same number every time. That number is called the common difference, d.'
        write: 'AP: add the same $d$ each time'
        'on': 'common difference'
      - say: 'The first term is 1. We call the first term a.'
        write: 'First term: $a = 1$'
        point:
          - {line: 2, kind: travel, at: '1', from: {doodle: stairs, part: first}, text: 'first step', 'on': 'first term is 1'}
      - say: 'The 6th term is 11. We write it as T 6, the 6th term.'
        write: '6th term: $T_{6} = 11$'
        point:
          - {line: 3, kind: travel, at: '= 11', from: {doodle: stairs, part: last}, text: '6th step', 'on': '6th term is 11'}
      - section: 'Count the rises'
        say: 'From the first step to the 6th step, how many rises do we climb? Count them on the staircase: 1, 2, 3, 4, 5. Five rises, not six.'
        write: 'From the 1st step to the 6th: 5 rises'
        doodle_do:
          - {id: stairs, op: highlight, part: rises, text: '5 rises', 'on': 'Count them'}
      - say: 'Each rise is d. So the 6th term is the first term, plus 5 lots of d.'
        write: '$T_{6} = a + 5d$'
      - say: 'This is the general rule for an A P. In words: the nth term is the first term, plus n minus 1 lots of d. The minus 1 is there because the first step has no rise before it. For the 6th term, 6 minus 1 is 5.'
        write: 'Rule: $T_{n} = a + (n - 1)d$'
        'on': 'general rule'
      - section: 'Put in the numbers'
        say: 'Now put in what we know. a is 1, and T 6 is 11. So 1 plus 5d equals 11.'
        write: '$1 + 5d = 11$'
        point:
          - {line: 7, kind: travel, at: '[[1]] +', from: {line: 2, at: '= [[1]]'}, text: 'a', 'on': 'a is 1'}
          - {line: 7, kind: travel, at: '= 11', from: {line: 3, at: '= 11'}, text: 'T6', 'on': 'T 6 is 11'}
      - say: 'We want 5d alone on the left. So subtract 1 from both sides.'
        write: '$5d = 11 - 1$'
      - say: '11 minus 1 is 10.'
        write: '$5d = 10$'
      - say: 'Now divide both sides by 5, to leave d by itself.'
        write: '$d = \dfrac{10}{5}$'
      - say: '10 divided by 5 is 2. So each rise is 2.'
        write: '$d = 2$'
        doodle_do:
          - {id: stairs, op: label, part: rises, text: 'each rise d = 2', 'on': 'each rise is 2'}
        point:
          - {line: 11, kind: highlight, at: '2', to: {doodle: stairs, part: rises}, 'on': 'each rise is 2'}
      - section: 'Check'
        say: 'Let''s check by climbing. Start at 1 and add 2 each time: 1, 3, 5, 7, 9, 11. Watch the climber go up.'
        write: 'Terms: $1,\ 3,\ 5,\ 7,\ 9,\ 11$'
        doodle_do:
          - {id: stairs, op: stage, stage: 'custom:1994_q19_a2', 'on': 'add 2 each time'}
          - {id: stairs, op: move, part: man, path: climb, 'on': 'Watch the climber'}
      - say: 'The 6th term in that list is 11, the top step, just as the question says.'
        write: 'So $T_{6} = 11$'
        doodle_do:
          - {id: stairs, op: circle, part: last, 'on': 'top step'}
      - say: 'So the common difference is 2, which is answer choice D.'
        write: '$d = 2$'
        answer: true
    traps:
      A: 'You went for 12 over 5. That comes from 5d equals 12: adding 1 to 11 instead of taking it away. 1 plus 5d equals 11 gives 5d equals 10, so d is 2.'
      B: 'You went for 5 over 3. That comes from using 6 rises, a plus 6d, which gives 6d equals 10. From the 1st step to the 6th there are only 5 rises, so it is a plus 5d, and d is 2.'
      C: 'You went for negative 2. The terms go up, from 1 to 11, so each step must add a positive amount. 5d equals 10 gives d equals positive 2.'
  20:
    moments:
      - say: 'We need $r$ when the sum of these six logs is 63. Each log is of a power of $r$.'
        write: '$\log_{10}r + \log_{10}r^{2} + \log_{10}r^{4} + \log_{10}r^{8} + \log_{10}r^{16} + \log_{10}r^{32} = 63$'
      - say: 'Use the power law: the log of $r$ to the power $k$ is $k$ times the log of $r$. The index comes down in front.'
        write: '$\log_{10}r^{k} = k\log_{10}r$'
      - say: 'Use the power law on every term. The powers 1, 2, 4, 8, 16 and 32 all come down in front of log $r$: picture them as six piles, each double the one before.'
        write: 'So $\log_{10}r + 2\log_{10}r + 4\log_{10}r + 8\log_{10}r + 16\log_{10}r + 32\log_{10}r = 63$'
        doodle: {name: 'custom:1994_q20_a', id: piles, caption: '1, 2, 4, 8, 16, 32'}
        point:
          - {line: 1, kind: box, text: 'power law'}
      - say: 'Every term now has log $r$ in it, so take it out as a common factor. The numbers in front go into a bracket.'
        write: '$(1 + 2 + 4 + 8 + 16 + 32)\log_{10}r = 63$'
      - say: 'Now add up the bracket, the six piles: 1 plus 2 is 3, plus 4 is 7, plus 8 is 15, plus 16 is 31, plus 32 is 63.'
        write: 'Bracket: $1 + 2 + 4 + 8 + 16 + 32 = 63$'
        doodle_do:
          - {id: piles, op: label, part: piles, text: '63 in all'}
        point:
          - {line: 4, kind: highlight, at: '63', to: {doodle: piles, part: piles}}
      - say: 'So the bracket is 63, all the piles together, and 63 times log $r$ equals 63.'
        write: '$63\log_{10}r = 63$'
        doodle_do:
          - {id: piles, op: pulse}
        point:
          - {line: 5, kind: move, from: {line: 4, at: '= [[63]]'}, at: '[[63]]log', text: 'bracket'}
      - say: 'Divide both sides by 63. 63 over 63 is 1.'
        write: '$\log_{10}r = \dfrac{63}{63} = 1$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '[[63]]log'}, at: '[[63]]63', text: 'divide by 63'}
      - say: 'What does log base 10 of $r$ equals 1 mean? A log is a power: it means 10 to the power 1 gives $r$.'
        write: '$r = 10^{1}$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: 'log[[10]]'}, at: '[[10]]1', text: 'the base'}
          - {line: 7, kind: move, from: {line: 6, at: '= [[1]]'}, at: '10[[1]]', text: 'the power'}
      - say: 'So $r$ is 10, which is answer choice C.'
        write: '$r = 10$'
        answer: true
    traps:
      A: 'You went for 10 to the negative 8. The numbers 1, 2, 4, 8, 16 and 32 are all positive and add to 63, so log $r$ is 1, not a negative number. $r$ is 10.'
      B: 'You went for 10 to the zero, which is 1. That would need log $r$ to be 0. But 63 times log $r$ is 63, so log $r$ is 1 and $r$ is 10.'
      D: 'You went for 10 squared. That would make log $r$ equal to 2, and then the sum would be 126, not 63. Log $r$ is 1, so $r$ is 10.'
  21:
    moments:
      - say: 'We want the $n$th term of the sequence 3, 6, 10, 15, 21, and so on. Picture each number as a triangle of dots.'
        write: '$3,\ 6,\ 10,\ 15,\ 21,\ \ldots$'
        doodle: {name: 'custom:1994_q21_a', id: dots, caption: '3, 6, 10, 15 as triangles', size: scene}
      - say: 'Look at how it grows. 6 minus 3 is 3, 10 minus 6 is 4, 15 minus 10 is 5, and 21 minus 15 is 6: each triangle gains a new row, one dot longer.'
        write: 'Gaps: $6 - 3 = 3,\ 10 - 6 = 4,\ 15 - 10 = 5,\ 21 - 15 = 6$'
        doodle_do:
          - {id: dots, op: highlight, part: rows}
      - say: 'The gaps grow by one each time, so the formula will have an $n$ squared in it. The quickest way now is to test the options. When $n = 1$, the formula must give the first term, 3.'
        write: 'At $n = 1$: $\ T_{1} = 3$'
      - say: 'Option A: 1 times, 1 minus a half, is a half. Not 3, so A is out.'
        write: 'A: $\ 1\left(1 - \tfrac{1}{2}\right) = \tfrac{1}{2}$'
      - say: 'Option B: 1 times, 1 plus a half, is one and a half. Not 3, so B is out.'
        write: 'B: $\ 1\left(1 + \tfrac{1}{2}\right) = \tfrac{3}{2}$'
      - say: 'Option C: 1 plus 1 is 2, 1 plus 2 is 3, and 2 times 3, over 2, is 3. That works.'
        write: 'C: $\ \dfrac{(1 + 1)(1 + 2)}{2} = \dfrac{(2)(3)}{2} = 3$'
      - say: 'Option D: 1 times, 2 times 1 plus 1, is 1 times 3, which is 3. That works too.'
        write: 'D: $\ 1(2 \times 1 + 1) = 1 \times 3 = 3$'
      - say: 'Two options survive, so test $n = 2$. The formula must give the second term, 6.'
        write: 'At $n = 2$: $\ T_{2} = 6$'
      - say: 'Option D: 2 times, 2 times 2 plus 1, is 2 times 5, which is 10. Not 6, so D is out.'
        write: 'D: $\ 2(2 \times 2 + 1) = 2 \times 5 = 10$'
        point:
          - {line: 7, kind: underline, at: 'T2 = 6', text: 'must be 6'}
      - say: 'Option C: 2 plus 1 is 3, 2 plus 2 is 4, and 3 times 4 is 12. 12 over 2 is 6. That works.'
        write: 'C: $\ \dfrac{(2 + 1)(2 + 2)}{2} = \dfrac{12}{2} = 6$'
      - say: 'Let''s make sure with $n = 3$ and $n = 4$. 4 times 5, over 2, is 10: the triangle of 10 is half of a 4 by 5 rectangle of dots. And 5 times 6, over 2, is 15. Both match the sequence.'
        write: 'C: $\ \dfrac{(4)(5)}{2} = 10,\quad \dfrac{(5)(6)}{2} = 15$'
        doodle_do:
          - {id: dots, op: stage, stage: 'custom:1994_q21_a2'}
        point:
          - {line: 10, kind: highlight, at: '(4)(5)', to: {doodle: dots, part: rect}}
      - say: 'So the $n$th term is $n + 1$ times $n + 2$, over 2, which is answer choice C: half a rectangle of dots every time.'
        write: '$T_{n} = \dfrac{(n + 1)(n + 2)}{2}$'
        doodle_do:
          - {id: dots, op: label, part: rect, text: 'half of (n + 1)(n + 2)'}
        answer: true
    traps:
      A: 'You went for $n\left(n - \tfrac{1}{2}\right)$. At $n = 1$ it gives a half, not 3. Test each option at $n = 1$ and $n = 2$, and only C gives 3 and then 6.'
      B: 'You went for $n\left(n + \tfrac{1}{2}\right)$. At $n = 1$ it gives one and a half, not 3, so it can''t be the formula.'
      D: 'You went for $n(2n + 1)$. It matches the first term, 3, but at $n = 2$ it gives 10, not 6. Always test at least two terms.'
  22:
    moments:
      - say: 'The operation $a * b = ab$ is ordinary multiplication on the positive integers 1, 2, 3, and so on. We must find the property that does NOT hold, so we check each one, like a checklist.'
        write: '$a * b = ab,\ \ a, b \in \{1, 2, 3, \ldots\}$'
        doodle: {name: 'custom:1994_q22_a', id: list, caption: 'check each property'}
      - say: 'Closure: multiply two positive integers and you always get a positive integer. For example, 3 times 4 is 12. Closure holds: tick.'
        write: 'Closure: $\ 3 * 4 = 12$, a positive integer'
        doodle_do:
          - {id: list, op: stage, stage: 'custom:1994_q22_a2'}
      - say: 'Associativity: the grouping doesn''t matter. 2 times 3 is 6, and 6 times 4 is 24. Or 3 times 4 is 12, and 2 times 12 is 24. Same answer, so it holds: another tick.'
        write: 'Associativity: $\ (2 \times 3) \times 4 = 24 = 2 \times (3 \times 4)$'
        doodle_do:
          - {id: list, op: stage, stage: 'custom:1994_q22_a3'}
      - say: 'Identity: we need a number $e$ in the set with $a$ times $e$ equal to $a$ for every $a$. The number 1 does this, and 1 is a positive integer. It holds: a third tick.'
        write: 'Identity: $\ a \times 1 = a$, with $1$ in the set'
        doodle_do:
          - {id: list, op: stage, stage: 'custom:1994_q22_a4'}
      - say: 'Inverse: for each $a$, we need a positive integer $b$ with $a$ times $b$ equal to the identity, which we just found is 1.'
        write: 'Inverse: need $\ a \times b = 1$'
      - say: 'Divide both sides by $a$, and $b$ must be 1 over $a$.'
        write: '$b = \dfrac{1}{a}$'
      - say: 'Take $a = 2$. Its inverse would have to be 1 over 2, a half. But a half is not a positive integer, so it is not in the set: inverse gets a cross.'
        write: 'For $a = 2$: $\ b = \dfrac{1}{2}$, not a positive integer'
        doodle_do:
          - {id: list, op: cross, part: c4}
        point:
          - {line: 5, kind: arrow, text: 'b = 1/a'}
          - {line: 6, kind: highlight, at: 'not a positive integer', to: {doodle: list, part: c4}}
      - say: 'So most numbers have no inverse in this set. Only 1 does, since 1 times 1 is 1.'
        write: 'Only $1 \times 1 = 1$ works, so the inverse property fails'
      - say: 'So the property that does not hold is the inverse, which is answer choice D.'
        write: 'Answer: Inverse'
        answer: true
    traps:
      A: 'You went for closure. But multiplying two positive integers always gives a positive integer, so the set is closed. It''s the inverse that fails: 2 would need one half.'
      B: 'You went for associativity. Multiplication is associative: grouping doesn''t change a product. It''s the inverse that fails, because one half is not a whole number.'
      C: 'You went for identity. The identity is 1, since $a$ times 1 is $a$, and 1 is in the set. It''s the inverse that fails.'
  23:
    moments:
      - section: 'The question'
        say: 'Here is a multiplication table modulo 10 on the set two, four, six, eight. We want the inverse of 2, so first we need the identity.'
        write: '$S = \{2, 4, 6, 8\}$, $\otimes$ (mod 10)'
        diagram:
          id: T
          kind: table
          columns: ['⊗ (mod 10)', '2', '4', '6', '8']
          rows: [['2', '4', '8', '2', '6'], ['4', '8', '6', '4', '2'], ['6', '2', '4', '6', '8'], ['8', '6', '2', '8', '4']]
      - say: 'Modulo 10 means: multiply as usual, divide the result by 10, and keep only the remainder. Picture a clock with ten hours, nought to nine.'
        write: 'Solution'
        doodle: {name: 'custom:1994_q23_a', id: clock, caption: 'mod 10: a clock of ten hours', 'on': 'clock'}
      - section: 'Find the identity'
        say: 'Let the identity be e. Combining any element with e leaves it unchanged.'
        write: 'Let the identity be $e$: $\ a \otimes e = a$'
      - say: 'Look down the column under 6: two, four, six, eight. It repeats the row headings exactly, so combining with 6 changes nothing.'
        write: '$2 \otimes 6 = 2,\ \ 4 \otimes 6 = 4,\ \ 6 \otimes 6 = 6,\ \ 8 \otimes 6 = 8$'
        diagram_do:
          - {id: T, op: highlight, part: 'col:4', text: 'same as the row headings', 'on': 'column under 6'}
      - say: 'Check one by the remainder: 8 times 6 is 48. 48 divided by 10 is 4, remainder 8. So 8 times 6 gives 8.'
        write: '$8 \times 6 = 48 = 4 \times 10 + 8$'
      - say: 'Therefore the identity here is 6, not 1.'
        write: '$\therefore e = 6$'
      - section: 'Find the inverse of 2'
        say: 'The inverse of 2, written 2 to the power minus 1, is the element that combines with 2 to give the identity, 6.'
        write: '$2 \otimes 2^{-1} = e = 6$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: 'e=[[6]]'}, at: '=e=[[6]]'}
      - say: 'Read along the row for 2: four, eight, two, six. The 6 sits in the column headed 8.'
        write: 'Row of 2: $\ 4, 8, 2, 6$; the 6 is under 8'
        diagram_do:
          - {id: T, op: highlight, part: 'cell:1,5', text: '2 ⊗ 8 = 6', 'on': 'column headed 8'}
      - say: 'Check by the remainder: 2 times 8 is 16. 16 divided by 10 is 1, remainder 6: once round the clock, and on to 6.'
        write: '$2 \times 8 = 16 = 1 \times 10 + 6\ \checkmark$'
        doodle_do:
          - {id: clock, op: move, part: bug, path: lap, 'on': 'once round the clock'}
          - {id: clock, op: circle, part: six, 'on': 'on to 6'}
      - section: 'Answer'
        say: 'Therefore the inverse of 2 is 8, which is option D.'
        write: '$\therefore 2^{-1} = 8$'
        answer: true
    traps:
      A: 'You went for 2. But 2 times 2 is 4, and 4 is not the identity. The identity in this table is 6, and 2 times 8 is 16, which leaves remainder 6.'
      B: 'You went for 4. 2 times 4 is 8, which is not the identity. The identity is 6, and in the row of 2 it sits under 8.'
      C: 'You went for 6. That is the identity itself, not the inverse of 2: 2 times 6 just gives 2 back. We need 2 times something to give 6, and that is 8.'
  24:
    moments:
      - say: 'We need $x$ and $y$ from this matrix equation. When we multiply it out, each row gives one ordinary equation.'
        write: '$\begin{pmatrix} 1 & 1 \\ 3 & y \end{pmatrix}\begin{pmatrix} x \\ 1 \end{pmatrix} = \begin{pmatrix} 4 \\ 1 \end{pmatrix}$'
      - say: 'How do we multiply a row by a column? Picture the matrix as entries in rows and columns. Multiply the matching entries in pairs, then add. Each row of the matrix gives one ordinary equation.'
        doodle: {name: 'custom:1994_q24_a', id: seats, caption: 'each row meets the column'}
      - say: 'Top row times the column: 1 times $x$, plus 1 times 1, first entry with first, second with second. That equals the top entry on the right, 4.'
        write: 'Top row: $\ 1(x) + 1(1) = 4$'
        doodle_do:
          - {id: seats, op: stage, stage: 'custom:1994_q24_a2'}
          - {id: seats, op: highlight, part: row1}
        point:
          - {line: 2, kind: highlight, at: '1(x)+1(1)', to: {doodle: seats, part: row1}}
      - say: 'So $x$ plus 1 is 4.'
        write: '$x + 1 = 4$'
      - say: 'Subtract 1 from both sides. 4 minus 1 is 3.'
        write: '$x = 4 - 1 = 3$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '+ 1'}, at: '− 1', text: 'across the ='}
      - say: 'Bottom row times the column: 3 times $x$, plus $y$ times 1. That equals the bottom entry on the right, 1.'
        write: 'Bottom row: $\ 3(x) + y(1) = 1$'
        doodle_do:
          - {id: seats, op: highlight, part: row2}
      - say: 'Put in the $x = 3$ we just found. 3 times 3 is 9.'
        write: '$3(3) + y = 1 \Rightarrow 9 + y = 1$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '= [[3]]'}, at: '3([[3]])', text: 'x = 3'}
      - say: 'Subtract 9 from both sides. 1 minus 9 is negative 8.'
        write: '$y = 1 - 9 = -8$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '[[9]] + y'}, at: '− 9', text: 'across the ='}
      - say: 'Let''s check by multiplying back with $x = 3$ and $y = -8$. Top: 3 plus 1 is 4. Bottom: 9 plus negative 8 is 1. Both match.'
        write: 'Check: $\begin{pmatrix} 1 & 1 \\ 3 & -8 \end{pmatrix}\begin{pmatrix} 3 \\ 1 \end{pmatrix} = \begin{pmatrix} 3 + 1 \\ 9 - 8 \end{pmatrix} = \begin{pmatrix} 4 \\ 1 \end{pmatrix}$'
      - say: 'So $x$ is 3 and $y$ is negative 8, which is answer choice C.'
        write: '$x = 3,\ y = -8$'
        answer: true
    traps:
      A: 'You went for $x = -3$ and $y = 3$. Check the top row: negative 3 plus 1 is negative 2, not 4. The top row gives $x + 1 = 4$, so $x$ is 3.'
      B: 'You went for $x = 8$ and $y = 3$. The top row gives $x + 1 = 4$, so $x$ is 3, not 8. Then $9 + y = 1$ gives $y = -8$.'
      D: 'You went for $x = 8$ and $y = -3$. The numbers have got swapped. $x + 1 = 4$ gives $x = 3$, and then $y$ is negative 8.'
  25:
    moments:
      - say: 'We want the determinant of this 3 by 3 matrix. We''ll expand along the top row, with the signs plus, minus, plus.'
        write: '$\begin{vmatrix} 1 & 2 & 3 \\ 4 & 5 & 6 \\ 2 & 0 & -1 \end{vmatrix}$'
      - say: 'Each top-row number multiplies its minor: the 2 by 2 determinant left when we cover that number''s row and column in the grid. So it is 1 times its minor, minus 2 times its minor, plus 3 times its minor.'
        write: '$= 1\begin{vmatrix} 5 & 6 \\ 0 & -1 \end{vmatrix} - 2\begin{vmatrix} 4 & 6 \\ 2 & -1 \end{vmatrix} + 3\begin{vmatrix} 4 & 5 \\ 2 & 0 \end{vmatrix}$'
        doodle: {name: 'custom:1994_q25_a', id: grid, caption: 'cover a row and a column'}
        doodle_do:
          - {id: grid, op: highlight, part: top}
      - say: 'The rule for a 2 by 2 determinant: $a$ times $d$, minus $b$ times $c$.'
        write: 'Determinant: $\begin{vmatrix} a & b \\ c & d \end{vmatrix} = ad - bc$'
      - say: 'Cover the 1''s row and column: first minor, 5 times negative 1 is negative 5, minus 6 times 0, which is 0.'
        write: 'First minor: $\ (5)(-1) - (6)(0) = -5 - 0 = -5$'
        doodle_do:
          - {id: grid, op: stage, stage: 'custom:1994_q25_a2'}
          - {id: grid, op: circle, part: minor1}
        point:
          - {line: 3, kind: highlight, at: '(5)(-1)', to: {doodle: grid, part: minor1}}
      - say: 'Second minor: 4 times negative 1 is negative 4, minus 6 times 2, which is 12. Negative 4 minus 12 is negative 16.'
        write: 'Second minor: $\ (4)(-1) - (6)(2) = -4 - 12 = -16$'
      - say: 'Third minor: 4 times 0 is 0, minus 5 times 2, which is 10. 0 minus 10 is negative 10.'
        write: 'Third minor: $\ (4)(0) - (5)(2) = 0 - 10 = -10$'
      - say: 'Now put those three minors back into the expansion, with the 1, 2 and 3 from the top row and the signs plus, minus, plus above the grid.'
        write: '$\det = 1(-5) - 2(-16) + 3(-10)$'
        doodle_do:
          - {id: grid, op: circle, part: signs}
        point:
          - {line: 6, kind: move, from: {line: 3, at: '0 = [[−5]]'}, at: '(−5)', text: 'first'}
          - {line: 6, kind: move, from: {line: 4, at: '= [[−16]]'}, at: '(−16)', text: 'second'}
          - {line: 6, kind: move, from: {line: 5, at: '= [[−10]]'}, at: '(−10)', text: 'third'}
      - say: 'Term by term: 1 times negative 5 is negative 5. Minus 2 times negative 16 is plus 32, because two negatives make a positive. 3 times negative 10 is negative 30.'
        write: '$= -5 + 32 - 30$'
      - say: 'Negative 5 plus 32 is 27, and 27 minus 30 is negative 3.'
        write: '$= 27 - 30 = -3$'
      - say: 'So the determinant is negative 3, which is answer choice C.'
        write: '$\det = -3$'
        answer: true
    traps:
      A: 'You went for negative 67. That comes from losing a sign in the middle term: minus 2 times negative 16 is plus 32, not minus 32. Negative 5 plus 32 minus 30 is negative 3.'
      B: 'You went for negative 57. Check each minor and each sign again: the minors are negative 5, negative 16 and negative 10, and the middle term becomes plus 32. The total is negative 3.'
      D: 'You went for positive 3. The size is right, but not the sign: negative 5 plus 32 is 27, and 27 minus 30 is negative 3.'
  26:
    moments:
      - say: 'In the diagram, $PQV$ and $TSR$ are parallel, and $PS$ is parallel to $QR$. $SQ$ is extended beyond $Q$, making 50 degrees with $QV$, and angle $PST$ is 30 degrees. We want angle $PSQ$.'
