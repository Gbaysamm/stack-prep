          - {id: stacks, op: stage, stage: 'custom:1994_q45_a2'}
        point:
          - {line: 5, kind: highlight, at: '29', to: {doodle: stacks, part: new}}
      - say: 'Check: 36 plus 29 is 65, and 65 divided by 13 is 5, the new mean.'
        write: 'Check: $\dfrac{36 + 29}{13} = \dfrac{65}{13} = 5$'
      - say: 'Here''s another way to see it. To lift the mean from 3 to 5, each of the old twelve stacks needs 2 more, which is 12 times 2, or 24. And the new number must also carry its own 5. 24 plus 5 is 29.'
        write: '$12 \times 2 + 5 = 24 + 5 = 29$'
        doodle_do:
          - {id: stacks, op: stage, stage: 'custom:1994_q45_a3'}
      - say: 'So the thirteenth number is 29, which is answer choice A.'
        write: 'Thirteenth number $= 29$'
        answer: true
    traps:
      B: 'You went for 26. Check the totals: 13 times 5 is 65, and 12 times 3 is 36. 65 minus 36 is 29.'
      C: 'You went for 25. That doesn''t come from the totals. The thirteen numbers total 65 and the first twelve total 36, so the new one is 29.'
      D: 'You went for 24. That is the extra 2 for each of the twelve numbers, 12 times 2. But the new number must also be worth 5 itself, so it is 24 plus 5, which is 29.'
  46:
    moments:
      - say: 'We want the mean deviation of 4, 5 and 9. That is the average distance of the numbers from their mean.'
        write: '$4,\ 5,\ 9$'
      - say: 'So the first thing we need is the mean. Add the numbers: 4 plus 5 plus 9 is 18.'
        write: 'Sum: $\ 4 + 5 + 9 = 18$'
      - say: 'There are 3 numbers, and 18 divided by 3 is 6. Picture 4, 5 and 9 as weights on a plank: it balances at the mean, 6.'
        write: 'Mean: $\ \bar{x} = \dfrac{18}{3} = 6$'
        doodle: {name: 'custom:1994_q46_a', id: plank, caption: 'the plank balances at the mean'}
      - say: 'Now the distance of each number from that mean, 6, the pivot. Distances are always positive, so we take absolute values, written with straight bars. 4 minus 6 is negative 2, so 4 is 2 away from 6.'
        write: '$|4 - 6| = |-2| = 2$'
        doodle_do:
          - {id: plank, op: stage, stage: 'custom:1994_q46_a2'}
        point:
          - {line: 3, kind: move, from: {line: 2, at: '= [[6]]'}, at: '4 − [[6]]', text: 'the mean'}
      - say: '5 minus 6 is negative 1, so 5 is 1 away.'
        write: '$|5 - 6| = |-1| = 1$'
        doodle_do:
          - {id: plank, op: stage, stage: 'custom:1994_q46_a3'}
      - say: '9 minus 6 is 3, so 9 is 3 away on the other side of the pivot.'
        write: '$|9 - 6| = |3| = 3$'
        doodle_do:
          - {id: plank, op: stage, stage: 'custom:1994_q46_a4'}
        point:
          - {line: 5, kind: highlight, at: '9-6', to: {doodle: plank, part: d9}}
      - say: 'Add up the three distances: 2 plus 1 plus 3 is 6.'
        write: 'Total distance $= 2 + 1 + 3 = 6$'
        point:
          - {line: 6, kind: move, from: {line: 3, at: '∣ = [[2]]'}, at: '[[2]] + 1', text: '2 away'}
          - {line: 6, kind: move, from: {line: 4, at: '∣ = [[1]]'}, at: '+ [[1]] +', text: '1 away'}
          - {line: 6, kind: move, from: {line: 5, at: '∣ = [[3]]'}, at: '+ [[3]] =', text: '3 away'}
      - say: 'The mean deviation is the sum of the distances from the mean, divided by the number of values.'
        write: 'Mean deviation $= \dfrac{\sum |x - \bar{x}|}{n}$'
      - say: 'The mean deviation is the average distance, so divide that total by how many numbers there are, 3. 6 divided by 3 is 2.'
        write: 'Mean deviation $= \dfrac{6}{3} = 2$'
        point:
