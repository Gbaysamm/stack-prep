# UTME 1994 Mathematics — lessons for the board.
#
# (short header; see lessons_2002.yaml for the full format notes)
#
# Keyed on question number, like explanations_1994.yaml. Answers match that file.
# Forty-nine questions: the paper ends at Q49 in this compilation.
format_version: 1
exam_year: 1994
lessons:
  1:
    moments:
      - say: 'We''re asked to evaluate one third divided by a square bracket. Inside it, five sevenths multiplies a round bracket. We work from the inside out.'
        write: '$\dfrac{1}{3} \div \left[\dfrac{5}{7}\left(\dfrac{9}{10} - 1 + \dfrac{3}{4}\right)\right]$'
      - say: 'Start with the round bracket: nine tenths minus 1 plus three quarters. To add and subtract fractions we need a common denominator, and 10 and 4 both go into 20.'
        write: '$\dfrac{9}{10} - 1 + \dfrac{3}{4}$'
      - say: 'Nine tenths is eighteen twentieths, 1 is twenty twentieths, and three quarters is fifteen twentieths.'
        write: '$= \dfrac{18}{20} - \dfrac{20}{20} + \dfrac{15}{20}$'
      - say: 'Now the numerators. 18 minus 20 is negative 2, and negative 2 plus 15 is 13.'
        write: '$= \dfrac{18 - 20 + 15}{20} = \dfrac{13}{20}$'
      - say: 'Next, multiply by five sevenths. Top times top: 5 times 13 is 65. Bottom times bottom: 7 times 20 is 140.'
        write: '$\dfrac{5}{7} \times \dfrac{13}{20} = \dfrac{65}{140}$'
      - say: 'Both 65 and 140 divide by 5. 65 divided by 5 is 13, and 140 divided by 5 is 28.'
        write: '$\dfrac{65}{140} = \dfrac{13}{28}$'
      - say: 'So the whole square bracket is thirteen twenty-eighths, and the question becomes one third divided by thirteen twenty-eighths.'
        write: '$\dfrac{1}{3} \div \dfrac{13}{28}$'
      - say: 'To divide by a fraction, we multiply by its reciprocal. Keep the first fraction, change divide to times, and flip the second.'
        write: '$= \dfrac{1}{3} \times \dfrac{28}{13}$'
      - say: '1 times 28 is 28, and 3 times 13 is 39.'
        write: '$= \dfrac{28}{39}$'
      - say: 'So the answer is twenty-eight thirty-ninths, which is answer choice A.'
        write: '$\dfrac{28}{39}$'
        answer: true
    traps:
      B: 'You went for thirteen eighty-fourths. That is one third times thirteen twenty-eighths — you multiplied instead of dividing. Dividing by a fraction means flipping it first, so it is one third times twenty-eight thirteenths.'
      C: 'You went for thirty-nine twenty-eighths. That is the right answer turned upside down. In a division only the second fraction flips, so the answer is 28 over 39, not 39 over 28.'
      D: 'You went for eighty-four thirteenths. That is 3 times twenty-eight thirteenths — you flipped the first fraction as well as the second. Only the second one flips: one third times twenty-eight thirteenths is twenty-eight thirty-ninths.'
  2:
    moments:
      - say: 'We have to evaluate this fraction of decimals and give the answer to 2 significant figures. We''ll work out the top, then the bottom, then divide.'
        write: '$\dfrac{0.36 \times 5.4 \times 0.63}{4.2 \times 9.0 \times 2.4}$'
      - say: 'Top first. 0.36 times 5.4. 36 times 54 is 1944, and there are three decimal places altogether, so it is 1.944.'
        write: '$0.36 \times 5.4 = 1.944$'
      - say: 'Now multiply that by 0.63. 1944 times 63 is 122,472, and with five decimal places that is 1.22472.'
        write: '$1.944 \times 0.63 = 1.22472$'
      - say: 'Now the bottom. 4.2 times 9.0 is 37.8.'
        write: '$4.2 \times 9.0 = 37.8$'
      - say: 'Then 37.8 times 2.4. 378 times 24 is 9072, and with two decimal places that is 90.72.'
        write: '$37.8 \times 2.4 = 90.72$'
      - say: 'So the fraction is 1.22472 over 90.72.'
        write: '$\dfrac{1.22472}{90.72}$'
      - say: 'Before dividing, let''s estimate the size. The top is about 1.2 and the bottom about 90, so the answer is a little more than one hundredth.'
        write: '$\approx \dfrac{1.2}{90} \approx 0.013$'
      - say: 'Dividing properly gives exactly 0.0135. You can check it: 90.72 times 0.0135 is 1.22472.'
        write: '$\dfrac{1.22472}{90.72} = 0.0135$'
      - say: 'Now round to 2 significant figures. The zeros at the front don''t count, so the first two significant digits are 1 and 3.'
        write: '$0.0\underline{13}5$'
      - say: 'The next digit is 5, so we round the 3 up to 4.'
        write: '$0.0135 \approx 0.014$'
      - say: 'So the answer is 0.014, which is answer choice B.'
        write: '$0.014$'
        answer: true
    traps:
      A: 'You went for 0.013. You kept the 3, but the digit after it is 5, and a 5 rounds up. So 0.0135 becomes 0.014.'
      C: 'You went for 0.13. That is ten times too big — a decimal place slipped. The top is about 1.2 and the bottom about 90, so the answer is near 0.01, not 0.1.'
      D: 'You went for 0.14. The digits 1 and 4 are right, but it is ten times too big. 1.2 divided by 90 is about 0.013, so the answer is 0.014.'
  3:
    moments:
      - say: 'We need to evaluate log base 5 of 0.04, divided by log base 3 of 18 minus log base 3 of 2. We''ll work out the top and the bottom separately.'
        write: '$\dfrac{\log_{5}(0.04)}{\log_{3}18 - \log_{3}2}$'
      - say: 'Start with the top. Log base 5 of 0.04 asks: what power of 5 gives 0.04? First write 0.04 as a fraction: 4 hundredths, which is one twenty-fifth.'
        write: '$0.04 = \dfrac{4}{100} = \dfrac{1}{25}$'
      - say: '25 is 5 squared, and one over 5 squared is 5 to the power negative 2.'
        write: '$\dfrac{1}{25} = \dfrac{1}{5^{2}} = 5^{-2}$'
      - say: 'So log base 5 of 0.04 is negative 2.'
        write: '$\log_{5}(0.04) = -2$'
      - say: 'Now the bottom. When you subtract two logs with the same base, you can combine them into the log of a division.'
        write: '$\log_{3}18 - \log_{3}2 = \log_{3}\dfrac{18}{2}$'
      - say: '18 divided by 2 is 9.'
        write: '$= \log_{3}9$'
      - say: '9 is 3 squared, so log base 3 of 9 is 2.'
        write: '$\log_{3}9 = \log_{3}3^{2} = 2$'
      - say: 'Now divide the top by the bottom: negative 2 over 2.'
        write: '$\dfrac{-2}{2}$'
      - say: 'Negative 2 divided by 2 is negative 1, which is answer choice B.'
        write: '$= -1$'
        answer: true
    traps:
      A: 'You went for 1. You lost the minus sign. 0.04 is less than 1, so its logarithm is negative: log base 5 of 0.04 is negative 2, not 2.'
      C: 'You went for two thirds. That doesn''t come from the log laws. The top is negative 2, since 0.04 is 5 to the negative 2, and the bottom is log base 3 of 9, which is 2.'
      D: 'You went for negative two thirds. The sign is right, but the bottom is not 3. Log base 3 of 18 minus log base 3 of 2 is log base 3 of 9, which is 2, so the answer is negative 2 over 2.'
  4:
    moments:
      - say: 'We need to solve 8 times $x$ to the power negative 2 equals two twenty-fifths, without tables.'
        write: '$8x^{-2} = \dfrac{2}{25}$'
      - say: 'A negative index means "one over". So $x$ to the negative 2 is one over $x$ squared.'
        write: '$x^{-2} = \dfrac{1}{x^{2}}$'
      - say: 'That makes the left side 8 over $x$ squared.'
        write: '$\dfrac{8}{x^{2}} = \dfrac{2}{25}$'
      - say: 'Now cross-multiply: 8 times 25 on one side, 2 times $x$ squared on the other.'
        write: '$8 \times 25 = 2x^{2}$'
      - say: '8 times 25 is 200.'
        write: '$200 = 2x^{2}$'
      - say: 'Divide both sides by 2. 200 divided by 2 is 100.'
        write: '$x^{2} = 100$'
      - say: 'Take the square root of both sides. The square root of 100 is 10, and the options only offer positive numbers, so we take positive 10.'
        write: '$x = \sqrt{100} = 10$'
      - say: 'Let''s check. 10 squared is 100, so 8 times 10 to the negative 2 is 8 over 100, which is 0.08. And 2 over 25 is also 0.08.'
        write: '$\dfrac{8}{100} = 0.08 = \dfrac{2}{25}$'
      - say: 'So $x$ is 10, which is answer choice D.'
        write: '$x = 10$'
        answer: true
    traps:
      A: 'You went for 4. Put it back in: 8 over 16 is one half, not two twenty-fifths. Cross-multiplying gives $x$ squared equals 100, so $x$ is 10.'
      B: 'You went for 6. 8 over 36 is not two twenty-fifths. From 200 equals 2 $x$ squared, $x$ squared is 100 and $x$ is 10.'
      C: 'You went for 8. 8 over 64 is one eighth, not two twenty-fifths. Remember $x$ to the negative 2 means one over $x$ squared; then $x$ squared is 100 and $x$ is 10.'
  5:
    moments:
      - say: 'We need to simplify root 48 minus 9 over root 3 plus root 75. The plan is to write every term as a number times root 3.'
        write: '$\sqrt{48} - \dfrac{9}{\sqrt{3}} + \sqrt{75}$'
      - say: 'Root 48 first. Look for the biggest perfect square inside 48. That''s 16, because 16 times 3 is 48.'
        write: '$\sqrt{48} = \sqrt{16 \times 3}$'
      - say: 'The square root of 16 is 4, so root 48 is 4 root 3.'
        write: '$= 4\sqrt{3}$'
      - say: 'Now root 75. The biggest perfect square inside 75 is 25, because 25 times 3 is 75.'
        write: '$\sqrt{75} = \sqrt{25 \times 3}$'
      - say: 'The square root of 25 is 5, so root 75 is 5 root 3.'
        write: '$= 5\sqrt{3}$'
      - say: 'Now the middle term, 9 over root 3. It has a root on the bottom, so we rationalise: multiply top and bottom by root 3.'
        write: '$\dfrac{9}{\sqrt{3}} = \dfrac{9 \times \sqrt{3}}{\sqrt{3} \times \sqrt{3}}$'
      - say: 'Root 3 times root 3 is 3, so we get 9 root 3 over 3.'
        write: '$= \dfrac{9\sqrt{3}}{3}$'
      - say: '9 divided by 3 is 3, so the middle term is 3 root 3.'
        write: '$= 3\sqrt{3}$'
      - say: 'Now put the three terms back together.'
        write: '$4\sqrt{3} - 3\sqrt{3} + 5\sqrt{3}$'
      - say: 'They are all root 3s, so we just combine the numbers in front. 4 minus 3 is 1, and 1 plus 5 is 6.'
        write: '$= (4 - 3 + 5)\sqrt{3}$'
      - say: 'So the answer is 6 root 3, which is answer choice B.'
        write: '$= 6\sqrt{3}$'
        answer: true
    traps:
      A: 'You went for 5 root 3. Check the numbers in front again: root 48 is 4 root 3, 9 over root 3 is 3 root 3, and root 75 is 5 root 3. 4 minus 3 plus 5 is 6.'
      C: 'You went for 8 root 3. That is what you get if the middle term is taken as 1 root 3. But 9 over root 3 is 9 root 3 over 3, which is 3 root 3, so the total is 6 root 3.'
      D: 'You went for 18 root 3. That adds 4, 9 and 5 — the middle term was used as 9 without rationalising, and added instead of subtracted. 9 over root 3 is only 3 root 3, and 4 minus 3 plus 5 is 6.'
  6:
    moments:
      - say: 'We''re told root 2 is 1.414, and we must find 1 over root 2 without tables.'
        write: '$\sqrt{2} = 1.414$'
      - say: 'Dividing 1 by 1.414 is hard by hand. So let''s rationalise: multiply the top and bottom by root 2.'
        write: '$\dfrac{1}{\sqrt{2}} = \dfrac{1 \times \sqrt{2}}{\sqrt{2} \times \sqrt{2}}$'
      - say: 'Root 2 times root 2 is 2, so we get root 2 over 2.'
        write: '$= \dfrac{\sqrt{2}}{2}$'
      - say: 'Now the given value slots straight in: 1.414 over 2.'
        write: '$= \dfrac{1.414}{2}$'
      - say: 'Half of 1.414 is 0.707.'
        write: '$= 0.707$'
      - say: 'Does that make sense? Root 2 is a bit more than 1, so 1 over root 2 should be a bit less than 1. 0.707 fits.'
        write: '$0.707 < 1$'
      - say: 'We can also check: 0.707 times 1.414 should be about 1. It comes to 0.999698, very close to 1.'
        write: '$0.707 \times 1.414 \approx 1$'
      - say: 'So 1 over root 2 is 0.707, which is answer choice D.'
        write: '$\dfrac{1}{\sqrt{2}} = 0.707$'
        answer: true
    traps:
      A: 'You went for 0.141. That is 1.414 divided by 10, a decimal point slip. Rationalising gives 1.414 divided by 2, which is 0.707.'
      B: 'You went for 0.301. That is the log of 2 from the tables, not 1 over root 2. Rationalise to root 2 over 2, then halve 1.414.'
      C: 'You went for 0.667. That is two thirds, a guess near the answer. Rationalise to root 2 over 2 and halve 1.414 to get 0.707.'
  7:
    moments:
      - say: 'A class has 42 students, and each offers at least one of Mathematics and Physics. 22 offer Physics and 28 offer Mathematics. We want the number offering Physics only.'
        write: '$n(E) = 42,\ n(P) = 22,\ n(M) = 28$'
      - say: 'Every student offers at least one subject, so nobody is outside both. That means the union of the two sets is the whole class of 42.'
        write: '$n(M \cup P) = 42$'
      - say: 'The first thing we need is the overlap, the students who offer both. The rule is: the union equals Maths plus Physics minus both.'
        write: '$n(M \cup P) = n(M) + n(P) - n(M \cap P)$'
      - say: 'Substitute the numbers.'
        write: '$42 = 28 + 22 - n(M \cap P)$'
      - say: '28 plus 22 is 50.'
        write: '$42 = 50 - n(M \cap P)$'
      - say: 'So the overlap is 50 minus 42, which is 8. Eight students offer both.'
        write: '$n(M \cap P) = 50 - 42 = 8$'
      - say: 'But careful. The question asks for Physics only. Of the 22 Physics students, 8 also do Maths, so we take those 8 away.'
        write: '$\text{Physics only} = 22 - 8$'
      - say: '22 minus 8 is 14.'
        write: '$= 14$'
      - say: 'Let''s check. Maths only is 28 minus 8, which is 20. Then 14 plus 20 plus 8 is 42, the whole class.'
        write: '$14 + 20 + 8 = 42$'
      - say: 'So 14 students offer Physics only, which is answer choice D.'
        write: '$\text{Physics only} = 14$'
        answer: true
    traps:
      A: 'You went for 6. That is 28 minus 22, the gap between the two subjects, which doesn''t count anyone. Find the overlap first, 8, then Physics only is 22 minus 8, which is 14.'
      B: 'You went for 8. That is the number offering both subjects, a step on the way. The word "only" means we take those 8 away from the 22 Physics students, leaving 14.'
      C: 'You went for 12. Check the overlap again: 28 plus 22 is 50, and 50 minus 42 is 8. So Physics only is 22 minus 8, which is 14.'
  8:
    moments:
      - say: 'We''re told $A$ is a subset of $B$, and we must simplify $A$ intersect the complement of $A$ intersect $B$.'
        write: '$A \cap (A \cap B)''$'
      - say: '$A$ is a subset of $B$ means every element of $A$ is also in $B$. $A$ sits entirely inside $B$.'
        write: '$A \subseteq B$'
      - say: 'Start with the bracket. $A \cap B$ is everything in both $A$ and $B$. Since all of $A$ is already inside $B$, that is just $A$.'
        write: '$A \cap B = A$'
      - say: 'So the complement of the bracket is the complement of $A$.'
        write: '$(A \cap B)'' = A''$'
      - say: 'And the whole expression becomes $A$ intersect $A$ complement.'
        write: '$A \cap (A \cap B)'' = A \cap A''$'
      - say: '$A$ complement means everything in the universal set that is not in $A$.'
        write: '$A'' = \{x \in E : x \notin A\}$'
      - say: 'So $A \cap A''$ asks for elements that are in $A$ and not in $A$ at the same time. No element can do that.'
        write: '$x \in A \text{ and } x \notin A$'
      - say: 'So the result is the empty set, which is answer choice B.'
        write: '$A \cap A'' = \varnothing$'
        answer: true
    traps:
      A: 'You went for $A$. That drops the complement. $A \cap A$ is $A$, but $A \cap A''$ is the empty set, because nothing is both in $A$ and outside it.'
      C: 'You went for $B$. The expression intersects everything with $A$, so it can never be bigger than $A$. In fact $A \cap A''$ is empty.'
      D: 'You went for $E$, the universal set. An intersection with $A$ can never be more than $A$. Here it is $A \cap A''$, which is empty.'
  9:
    moments:
      - say: 'We need to solve 25 to the $x$ plus 3 times 5 to the $x$ equals 4.'
        write: '$25^{x} + 3(5^{x}) = 4$'
      - say: 'Notice 25 is 5 squared. So 25 to the $x$ is 5 squared, to the $x$, which is 5 to the $x$, all squared.'
        write: '$25^{x} = (5^{2})^{x} = (5^{x})^{2}$'
      - say: 'That means this is a quadratic in disguise. Let $u$ stand for 5 to the $x$.'
        write: '$\text{Let } u = 5^{x}$'
      - say: 'Then the equation becomes $u$ squared plus $3u$ equals 4.'
        write: '$u^{2} + 3u = 4$'
      - say: 'Subtract 4 from both sides to get zero on the right.'
        write: '$u^{2} + 3u - 4 = 0$'
      - say: 'Now factorise. We need two numbers that multiply to negative 4 and add to 3. That''s 4 and negative 1.'
        write: '$(u + 4)(u - 1) = 0$'
      - say: 'So $u$ is negative 4 or $u$ is 1.'
        write: '$u = -4 \text{ or } u = 1$'
      - say: 'Now go back to $x$. Can 5 to the $x$ be negative 4? No. 5 to any power is always positive, so we throw that one out.'
        write: '$5^{x} = -4 \text{ has no solution}$'
      - say: 'The other one: 5 to the $x$ equals 1.'
        write: '$5^{x} = 1$'
      - say: 'Any non-zero number to the power zero is 1, so 5 to the zero is 1.'
        write: '$5^{0} = 1$'
      - say: 'So $x$ is 0, which is answer choice B.'
        write: '$x = 0$'
        answer: true
    traps:
      A: 'You went for 1 or negative 4. Those are the values of $u$, not $x$, and $u$ equals negative 4 is impossible because 5 to the $x$ is always positive. From 5 to the $x$ equals 1, $x$ is 0.'
      C: 'You went for 1. That is the value of $u$, which is 5 to the $x$. We still need $x$: 5 to the $x$ equals 1 means $x$ is 0.'
      D: 'You went for negative 4 or 0. The 0 is right, but negative 4 was a value of $u$, and 5 to the $x$ can never be negative. So only $x$ equals 0 works.'
  10:
    moments:
      - say: 'We need to simplify this fraction. The top is a difference of two squares, so we''ll factorise rather than expand.'
        write: '$\dfrac{(2m - u)^{2} - (m - 2u)^{2}}{5m^{2} - 5u^{2}}$'
      - say: 'The rule: $P$ squared minus $Q$ squared is $P$ minus $Q$ times $P$ plus $Q$. Here $P$ is $2m - u$, and $Q$ is $m - 2u$.'
        write: '$P^{2} - Q^{2} = (P - Q)(P + Q)$'
      - say: 'First bracket, $P$ minus $Q$. Taking away $m - 2u$ flips both signs inside it.'
        write: '$(2m - u) - (m - 2u) = 2m - u - m + 2u$'
      - say: '$2m$ minus $m$ is $m$, and minus $u$ plus $2u$ is plus $u$. So we get $m$ plus $u$.'
        write: '$= m + u$'
      - say: 'Second bracket, $P$ plus $Q$. $2m$ plus $m$ is $3m$, and minus $u$ minus $2u$ is minus $3u$.'
        write: '$(2m - u) + (m - 2u) = 3m - 3u$'
      - say: 'Take out the common 3.'
        write: '$= 3(m - u)$'
      - say: 'So the top is 3, times $m + u$, times $m - u$.'
        write: '$\text{top} = 3(m + u)(m - u)$'
      - say: 'Now the bottom. Take out 5 first: 5 times $m$ squared minus $u$ squared.'
        write: '$5m^{2} - 5u^{2} = 5(m^{2} - u^{2})$'
      - say: '$m$ squared minus $u$ squared is another difference of two squares.'
        write: '$= 5(m + u)(m - u)$'
      - say: 'Now put the top over the bottom.'
        write: '$\dfrac{3(m + u)(m - u)}{5(m + u)(m - u)}$'
      - say: '$m + u$ cancels, and $m - u$ cancels, leaving three fifths.'
        write: '$= \dfrac{3}{5}$'
      - say: 'So the answer is three fifths, which is answer choice B.'
        write: '$\dfrac{3}{5}$'
        answer: true
    traps:
      A: 'You went for three quarters. The 3 on top is right, but the bottom is 5 times $m^{2} - u^{2}$, so after cancelling a 5 is left, not a 4.'
      C: 'You went for $2m - u$ over $5m + u$. That cancels pieces that are added or subtracted, which isn''t allowed. Factorise the top and bottom fully and everything cancels, leaving three fifths.'
      D: 'You went for $m - 2u$ over $m + 5u$. You can only cancel whole factors, not pieces of a bracket. The top is 3 times $(m + u)(m - u)$, and the bottom is 5 times the same two brackets.'
  11:
    moments:
      - say: 'We need to factorise $a^{2}x - b^{2}y - b^{2}x + a^{2}y$. There are four terms and nothing common to all of them, so we group them in pairs.'
        write: '$a^{2}x - b^{2}y - b^{2}x + a^{2}y$'
      - say: 'Rearrange to put the $a^{2}$ terms together and the $b^{2}$ terms together.'
        write: '$a^{2}x + a^{2}y - b^{2}x - b^{2}y$'
      - say: 'From the first pair, take out $a^{2}$. That leaves $x + y$ in the bracket.'
        write: '$a^{2}(x + y) - b^{2}x - b^{2}y$'
      - say: 'From the second pair, take out negative $b^{2}$. Negative $b^{2}$ times $x$ gives minus $b^{2}x$, and times $y$ gives minus $b^{2}y$. So the bracket is again $x + y$.'
        write: '$a^{2}(x + y) - b^{2}(x + y)$'
      - say: 'Both parts share the bracket $x + y$, so take it out.'
        write: '$(x + y)(a^{2} - b^{2})$'
      - say: 'But we''re not finished. $a^{2} - b^{2}$ is a difference of two squares, so it factorises again.'
        write: '$a^{2} - b^{2} = (a - b)(a + b)$'
      - say: 'Put it all together.'
        write: '$(x + y)(a - b)(a + b)$'
      - say: 'Let''s check by expanding. $(a - b)(a + b)$ is $a^{2} - b^{2}$, and times $x + y$ that gives back the four terms we started with.'
        write: '$(x + y)(a^{2} - b^{2}) = a^{2}x + a^{2}y - b^{2}x - b^{2}y$'
      - say: 'So the full factorisation is $(x + y)(a - b)(a + b)$, which is answer choice D.'
        write: '$(x + y)(a - b)(a + b)$'
        answer: true
    traps:
      A: 'You went for $(a - b)(x + y)$. That leaves out the factor $a + b$. After grouping you get $(x + y)(a^{2} - b^{2})$, and $a^{2} - b^{2}$ splits into $(a - b)(a + b)$.'
      B: 'You went for $(y - x)(a - b)(a + b)$. The bracket should be $x + y$, not $y - x$: both $x$ and $y$ are multiplied by $a^{2}$ with a plus sign.'
      C: 'You went for $(x - y)(a - b)(a + b)$. Look at the signs: $a^{2}x$ and $a^{2}y$ are both positive, so the common bracket is $x + y$, not $x - y$.'
  12:
    moments:
      - say: 'We need $p$ and $q$ so that $x - 1$ and $x - 3$ are both factors of this cubic.'
        write: '$f(x) = px^{3} + qx^{2} + 11x - 6$'
      - say: 'We use the factor theorem: if $x - a$ is a factor, then putting $x = a$ into the expression gives zero.'
        write: '$(x - a) \text{ is a factor} \Rightarrow f(a) = 0$'
      - say: 'First factor, $x - 1$. So put $x = 1$.'
        write: '$f(1) = p(1)^{3} + q(1)^{2} + 11(1) - 6 = 0$'
      - say: '1 cubed and 1 squared are both 1, so we have $p$ plus $q$ plus 11 minus 6. 11 minus 6 is 5.'
        write: '$p + q + 5 = 0$'
      - say: 'Subtract 5 from both sides.'
        write: '$p + q = -5$'
      - say: 'Second factor, $x - 3$. So put $x = 3$.'
        write: '$f(3) = p(3)^{3} + q(3)^{2} + 11(3) - 6 = 0$'
      - say: '3 cubed is 27, 3 squared is 9, and 11 times 3 is 33. Then 33 minus 6 is 27.'
        write: '$27p + 9q + 27 = 0$'
      - say: 'Subtract 27 from both sides.'
        write: '$27p + 9q = -27$'
      - say: 'Every number here divides by 9, so divide through by 9 to keep it small.'
        write: '$3p + q = -3$'
      - say: 'Now we have two equations. Subtract the first from the second, and the $q$s cancel.'
        write: '$(3p + q) - (p + q) = -3 - (-5)$'
      - say: '$3p$ minus $p$ is $2p$. Negative 3 minus negative 5 is negative 3 plus 5, which is 2.'
        write: '$2p = 2$'
      - say: 'Divide by 2, so $p$ is 1.'
        write: '$p = 1$'
