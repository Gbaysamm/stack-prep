        point:
          - {line: 9, kind: highlight, at: '360-x-y-z', to: {doodle: turn, part: fourth}}
      - say: 'So the fourth angle is 360 minus $x$ minus $y$ minus $z$ degrees, which is answer choice A.'
        write: 'Fourth angle $= (360 - x - y - z)^{\circ}$'
        answer: true
        point:
          - {figure: sketch, kind: circle, target: '?', text: '360 − x − y − z'}
    traps:
      B: 'You went for $(360 + x + y - z)^{\circ}$. The signs are off. The three angles add to $x + y + z$, and subtracting all of it from 360 makes every letter negative.'
      C: 'You went for $(180 - x + y + z)^{\circ}$. 180 is the angle sum of a triangle. A quadrilateral''s angles add to 360, and all three letters should be subtracted.'
      D: 'You went for $(180 + x + y + z)^{\circ}$. That uses 180, the triangle sum, and adds the letters. A quadrilateral''s angles total 360, so the fourth is $360 - x - y - z$.'
  29:
    moments:
      - say: 'An open box is made of wood 2 cm thick. Inside, it is 50 cm long, 36 cm wide and 20 cm deep. We want the volume of the wood itself.'
        write: 'Internal: $50 \times 36 \times 20$, wood $2$ cm thick'
      - say: 'Let me draw the open box.'
        show_sketch: true
      - say: 'The plan: think of the box as a solid block the size of the outside, with the inside space scooped out, like the block of air here. The wood is the outside volume minus the space inside.'
        write: '$V_{\text{wood}} = V_{\text{external}} - V_{\text{internal}}$'
        doodle: {name: 'custom:1994_q29_a', id: blocks, caption: 'solid block minus the air inside'}
        point:
          - {figure: sketch, kind: circle, target: 'volume of wood = ?'}
      - say: 'The volume of a cuboid is length times width times height.'
        write: 'Volume of a cuboid $= \text{length} \times \text{width} \times \text{height}$'
      - say: 'Inside first, the block of air. 50 times 36 is 1800, and 1800 times 20 is 36,000 cubic centimetres.'
        write: '$V_{\text{internal}} = 50 \times 36 \times 20 = 1800 \times 20 = 36{,}000\ \text{cm}^{3}$'
        doodle_do:
          - {id: blocks, op: label, part: inner, text: '36,000 cm³'}
        point:
          - {figure: sketch, kind: circle, target: '50 cm'}
          - {figure: sketch, kind: circle, target: '36 cm'}
          - {figure: sketch, kind: circle, target: '20 cm'}
      - say: 'Now the outside measurements. The length has wood at both ends, so add 2 twice: 50 plus 2 plus 2 is 54.'
        write: 'External length $= 50 + 2 + 2 = 54$'
        point:
          - {line: 5, kind: move, from: {line: 0, at: '50'}, at: '50', text: 'inside length'}
          - {figure: sketch, kind: circle, target: '2 cm', text: 'at both ends'}
      - say: 'The width also has wood on both sides: 36 plus 2 plus 2 is 40.'
        write: 'External width $= 36 + 2 + 2 = 40$'
        point:
          - {line: 6, kind: move, from: {line: 0, at: '36'}, at: '36', text: 'inside width'}
      - say: 'But the box is open. It has a bottom but no lid, so the depth gets only one 2: 20 plus 2 is 22.'
        write: 'External depth $= 20 + 2 = 22$'
        point:
          - {line: 7, kind: move, from: {line: 0, at: '× [[20]]'}, at: '20', text: 'inside depth'}
          - {figure: sketch, kind: underline, target: 'wood 2 cm thick, open top', text: 'bottom only'}
      - say: 'Now the outside volume, using the 54, 40 and 22 we just found. 54 times 40 is 2160.'
        write: '$V_{\text{external}} = 54 \times 40 \times 22 = 2160 \times 22$'
        point:
          - {line: 8, kind: move, from: {line: 5, at: '= [[54]]'}, at: '54'}
          - {line: 8, kind: move, from: {line: 6, at: '= [[40]]'}, at: '40'}
          - {line: 8, kind: move, from: {line: 7, at: '= [[22]]'}, at: '40 × [[22]]'}
      - say: 'Then 2160 times 22. 2160 times 20 is 43,200, and 2160 times 2 is 4320. Together that is 47,520: the solid outside block.'
        write: '$= 43{,}200 + 4320 = 47{,}520\ \text{cm}^{3}$'
        doodle_do:
          - {id: blocks, op: label, part: outer, text: '47,520 cm³'}
      - say: 'Now back to our plan: the outside volume, 47,520, minus the inside volume, 36,000. That is 11,520, the wood.'
        write: '$V_{\text{wood}} = 47{,}520 - 36{,}000 = 11{,}520$'
        doodle_do:
          - {id: blocks, op: label, part: wood, text: '11,520 cm³'}
        point:
          - {line: 10, kind: move, from: {line: 9, at: '= [[47,520]]'}, at: '47,520', text: 'outside'}
          - {line: 10, kind: move, from: {line: 4, at: '= [[36,000]]'}, at: '36,000', text: 'inside'}
          - {line: 10, kind: highlight, at: '11,520', to: {doodle: blocks, part: wood}}
      - say: 'So the volume of wood is 11,520 cubic centimetres, which is answer choice A.'
        write: '$V_{\text{wood}} = 11{,}520\ \text{cm}^{3}$'
        point:
          - {figure: sketch, kind: label, target: 'volume of wood = ?', text: '11,520 cm³'}
        answer: true
    traps:
      B: 'You went for 36,000. That is the space inside the box, not the wood. Work out the outside volume, 47,520, and subtract the inside.'
      C: 'You went for 38,200. Check the outside measurements: 54 by 40 by 22 gives 47,520, and taking away the inside 36,000 leaves 11,520.'
      D: 'You went for 47,520. That is the outside volume. The wood is what''s left after taking away the hollow inside: 47,520 minus 36,000 is 11,520.'
  30:
    moments:
      - say: 'We want the perimeter of a sector with radius 8 cm and angle 45 degrees.'
        write: '$r = 8\ \text{cm},\ \ \theta = 45^{\circ}$'
      - say: 'Let me draw the sector $OAB$.'
        show_sketch: true
      - say: 'A sector is like a slice of pizza. Its perimeter, the distance all the way round it, has three parts: the curved arc and the two straight radii. Picture an ant walking all the way round the slice.'
        write: 'Perimeter $= \text{arc} + r + r$'
        doodle: {name: 'custom:1994_q30_a', id: slice, caption: 'an ant walks round the slice'}
        point:
          - {figure: sketch, kind: arc, target: AB, text: 'arc'}
          - {figure: sketch, kind: highlight, target: OA, text: 'r'}
          - {figure: sketch, kind: highlight, target: OB, text: 'r'}
      - say: 'The arc is a fraction of the whole circumference. A 45 degree sector is 45 out of the 360 degrees of a full circle.'
        write: 'Arc $= \dfrac{45}{360} \times 2\pi r$'
        point:
          - {line: 3, kind: move, from: {line: 0, at: '45'}, at: '360[[45]]', text: 'θ'}
          - {figure: sketch, kind: arc, target: AOB, text: '45°'}
      - say: '45 goes into 360 exactly 8 times, so 45 over 360 is 1 over 8.'
        write: '$\dfrac{45}{360} = \dfrac{1}{8}$'
      - say: 'The whole circumference is 2 pi $r$. With $r = 8$, 2 times 8 is 16, so it is 16 pi.'
        write: '$2\pi r = 2 \times \pi \times 8 = 16\pi$'
        point:
          - {line: 5, kind: move, from: {line: 0, at: 'r = [[8]]'}, at: '× [[8]]', text: 'r = 8'}
      - say: 'Now put the 1 over 8 and the 16 pi into the arc formula. 16 divided by 8 is 2, so the arc is 2 pi centimetres: the ant walks out along one edge and round the crust.'
        write: 'Arc $= \dfrac{1}{8} \times 16\pi = 2\pi$'
        doodle_do:
          - {id: slice, op: move, part: ant, path: out}
          - {id: slice, op: move, part: ant, path: round}
        point:
          - {line: 6, kind: move, from: {line: 4, at: '= [[81]]'}, at: '81', text: 'fraction'}
          - {line: 6, kind: move, from: {line: 5, at: '= [[16π]]'}, at: '16π', text: 'circumference'}
          - {figure: sketch, kind: label, target: 'arc ?', text: '2π cm'}
      - say: 'The two straight edges are both radii, 8 and 8, which make 16. The ant walks home along the second edge.'
        write: '$r + r = 8 + 8 = 16$'
        doodle_do:
          - {id: slice, op: move, part: ant, path: back}
          - {id: slice, op: highlight, part: edges}
        point:
          - {figure: 'sketch', kind: 'highlight', target: 'OA', text: '8'}
          - {figure: 'sketch', kind: 'highlight', target: 'OB', text: '8'}
          - {line: 7, kind: highlight, at: '8+8', to: {doodle: slice, part: edges}}
      - say: 'Go back to the perimeter formula and add the three parts: the arc, 2 pi, plus the 16.'
        write: 'Perimeter $= 2\pi + 16 = 16 + 2\pi$'
        point:
          - {line: 8, kind: move, from: {line: 6, at: '= [[2π]]'}, at: '[[2π]] + 16', text: 'arc'}
          - {line: 8, kind: move, from: {line: 7, at: '= [[16]]'}, at: '+ [[16]] =', text: 'two radii'}
          - {figure: 'sketch', kind: 'arc', target: 'AB', text: '2π'}
      - say: 'Sanity check: 2 pi is about 6.28, so the perimeter is about 22.28 cm. That''s sensible for a shape whose two straight edges already make 16.'
        write: '$16 + 2\pi \approx 16 + 6.28 = 22.28$'
      - say: 'So the perimeter is 16 plus 2 pi centimetres, which is answer choice C.'
        write: 'Perimeter $= 16 + 2\pi$ cm'
        answer: true
    traps:
      A: 'You went for 2 pi. That is just the arc. A sector also has two straight edges, each a radius of 8 cm, so add 16.'
      B: 'You went for 8 plus 2 pi. That counts only one radius. A sector is closed off by two radii, so add 8 plus 8, which is 16.'
      D: 'You went for 16 plus 16 pi. That uses the whole circumference. The sector is only one eighth of the circle, so the arc is 2 pi.'
  31:
    moments:
      - say: 'In the diagram, $PTS$ is a tangent to the circle at $T$, and $TQR$ is a triangle inside the circle. Angle $QRT$ is 60 degrees and angle $QTR$ is 50 degrees. We want angle $RTS$.'
        write: '$\angle QRT = 60^{\circ},\ \ \angle QTR = 50^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: QRT, text: '60°'}
          - {figure: 0, kind: arc, target: QTR, text: '50°'}
      - say: 'The rule: the angles in any triangle add up to 180 degrees.'
        write: 'Angle sum of a triangle $= 180^{\circ}$'
      - say: 'First find the third angle of triangle $QTR$, the one at $Q$. The angles of a triangle add to 180.'
        write: '$\angle RQT = 180^{\circ} - 60^{\circ} - 50^{\circ}$'
        point:
          - {line: 2, kind: move, from: {line: 0, at: '60∘'}, at: '− 60∘'}
          - {line: 2, kind: move, from: {line: 0, at: '50∘'}, at: '− 50∘'}
          - {figure: 0, kind: 'arc', target: 'RQT', text: '?'}
      - say: '60 plus 50 is 110, and 180 minus 110 is 70.'
        write: '$= 180^{\circ} - 110^{\circ} = 70^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: RQT, text: '70°'}
      - say: 'Now the alternate segment theorem: the angle between a tangent and a chord equals the angle that chord makes at the circle, in the segment on the other side.'
        write: 'Alternate segment: tangent-chord angle $=$ angle in the other segment'
        point:
          - {figure: 0, kind: 'highlight', target: 'PS', text: 'tangent'}
      - say: 'Here the chord is $TR$ and the tangent ray is $TS$. The angle chord $TR$ makes at the circle on the other side is angle $RQT$, at $Q$.'
        write: 'Chord $TR$: $\ \angle RTS = \angle RQT$'
        point:
          - {figure: 0, kind: highlight, target: TR, text: 'chord'}
      - say: 'We found angle $RQT$ is 70 degrees, so angle $RTS$ is 70 degrees too.'
        write: '$\angle RTS = 70^{\circ}$'
        point:
          - {line: 5, kind: box, text: 'the rule'}
          - {line: 6, kind: move, from: {line: 3, at: '= [[70∘]]'}, at: '70∘', text: 'RQT'}
          - {figure: 0, kind: label, target: '?', text: '70°'}
      - say: 'Let''s check with the straight line $PTS$. The three angles at $T$ must add to 180. So angle $PTQ$ is 180 minus 50 minus 70, which is 60.'
        write: 'Check: $\angle PTQ = 180^{\circ} - 50^{\circ} - 70^{\circ} = 60^{\circ}$'
        point:
          - {figure: 0, kind: 'highlight', target: 'PS', text: 'straight line'}
          - {figure: 0, kind: 'arc', target: 'PTQ', text: '60°'}
      - say: 'By the same theorem with chord $TQ$, angle $PTQ$ should equal angle $QRT$, which is 60. It does, so everything agrees.'
        write: '$\angle PTQ = \angle QRT = 60^{\circ}$'
        point:
          - {figure: 0, kind: 'highlight', target: 'TQ', text: 'chord'}
          - {figure: 0, kind: 'arc', target: 'QRT', text: '60°'}
      - say: 'So angle $RTS$ is 70 degrees, which is answer choice B.'
        write: '$\angle RTS = 70^{\circ}$'
        answer: true
        point:
          - {figure: 0, kind: 'arc', target: 'RTS', text: '70°'}
    traps:
      A: 'You went for 120 degrees. That is 180 minus 60. By the alternate segment theorem, angle $RTS$ equals the angle at $Q$, which is 180 minus 60 minus 50, so 70.'
      C: 'You went for 60 degrees. That is the tangent-chord angle on the other side of $T$, for chord $TQ$. For chord $TR$ and the tangent $TS$, the matching angle is at $Q$, which is 70.'
      D: 'You went for 40 degrees. Check the triangle: 180 minus 60 minus 50 is 70, and by the alternate segment theorem angle $RTS$ equals that 70.'
  32:
    moments:
      - say: 'The triangle in the diagram has sides 6 cm, 5 cm and 7 cm, and $h$ is the height drawn to the 7 cm base. We want $h$.'
        write: 'Sides: $a = 6,\ b = 5,\ c = 7$ (the base)'
        point:
          - {figure: 0, kind: circle, target: '7 cm', text: 'base'}
          - {figure: 0, kind: circle, target: h, text: 'height'}
      - say: 'We know all three sides but no angle. So the plan is: find the area with Heron''s formula, then use half base times height to get $h$.'
        write: 'Heron: $\ \text{Area} = \sqrt{s(s - a)(s - b)(s - c)}$'
        point:
          - {figure: 0, kind: 'circle', target: '6 cm'}
          - {figure: 0, kind: 'circle', target: '5 cm'}
          - {figure: 0, kind: 'circle', target: '7 cm'}
      - say: 'First the semi-perimeter $s$, which is half the sum of the sides. 6 plus 5 plus 7 is 18, and half of 18 is 9.'
        write: '$s = \dfrac{6 + 5 + 7}{2} = \dfrac{18}{2} = 9$'
      - say: 'Now substitute $s = 9$ and the three sides into Heron''s formula.'
        write: '$\text{Area} = \sqrt{9(9 - 6)(9 - 5)(9 - 7)}$'
        point:
          - {line: 1, kind: box, text: 'Heron'}
          - {line: 3, kind: move, from: {line: 2, at: '= [[9]]'}, at: '[[9]](9 − 6)', text: 's'}
      - say: '9 minus 6 is 3, 9 minus 5 is 4, and 9 minus 7 is 2.'
        write: '$= \sqrt{9 \times 3 \times 4 \times 2}$'
      - say: '9 times 3 is 27, 27 times 4 is 108, and 108 times 2 is 216.'
        write: '$= \sqrt{216}$'
      - say: 'Simplify the root. 216 is 36 times 6, and the square root of 36 is 6.'
        write: '$= \sqrt{36 \times 6} = 6\sqrt{6}$'
      - say: 'So the area is 6 root 6 square centimetres. Now the other area formula: half times base times height. The base is 7, and $h$ is the height to it.'
        write: '$\text{Area} = \dfrac{1}{2} \times 7 \times h = \dfrac{7h}{2}$'
        point:
          - {figure: 0, kind: 'circle', target: '7 cm', text: 'base'}
          - {figure: 0, kind: 'circle', target: 'h', text: 'height'}
      - say: 'Both formulas give the same area, so set 7 $h$ over 2 equal to the 6 root 6 we found.'
        write: '$\dfrac{7h}{2} = 6\sqrt{6}$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '= [[27h]]'}, at: '27h', text: '½ × base × h'}
          - {line: 8, kind: move, from: {line: 6, at: '= [[66]]'}, at: '66', text: 'Heron'}
      - say: 'Multiply both sides by 2. 2 times 6 root 6 is 12 root 6.'
        write: '$7h = 12\sqrt{6}$'
      - say: 'Divide both sides by 7.'
        write: '$h = \dfrac{12\sqrt{6}}{7}$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '[[7]]h'}, at: '[[7]]126', text: 'divide by 7'}
      - say: 'Check the size: root 6 is about 2.449, so $h$ is about 12 times 2.449 over 7, which is about 4.2 cm. That is shorter than both slanting sides, 5 and 6, as a height must be.'
        write: '$h \approx \dfrac{12 \times 2.449}{7} \approx 4.2$ cm'
        point:
          - {figure: 0, kind: 'circle', target: 'h', text: '≈ 4.2'}
          - {figure: 0, kind: 'circle', target: '5 cm'}
          - {figure: 0, kind: 'circle', target: '6 cm'}
      - say: 'So $h$ is 12 over 7, times root 6, centimetres, which is answer choice B.'
        write: '$h = \dfrac{12}{7}\sqrt{6}$ cm'
        point:
          - {figure: 0, kind: label, target: h, text: '(12/7)√6 cm'}
        answer: true
    traps:
      A: 'You went for 12 over 7. That drops the root 6: the area is 6 root 6, not 6. Also, 12 over 7 is under 2 cm, far too short for a triangle with sides of 5 and 6.'
      C: 'You went for 7 over 12. That is the fraction upside down, and without the root 6. From $7h = 12\sqrt{6}$, divide by 7 to get $h = \tfrac{12}{7}\sqrt{6}$.'
      D: 'You went for half of root 51, about 3.6 cm. That doesn''t come from the triangle''s area. Heron''s formula gives an area of 6 root 6, and then $h$ is 12 over 7 times root 6, about 4.2 cm.'
  33:
    moments:
      - say: 'In the diagram, the frustum''s top diameter is twice its bottom diameter, and its height is $h$. We want the height of the whole cone it came from.'
        write: 'Top diameter $= 2 \times$ bottom diameter'
        point:
          - {figure: 0, kind: circle, target: h, text: 'frustum height'}
      - say: 'A frustum is a cone with its tip cut off. The small cut-off cone and the full cone are the same shape, just different sizes. They are similar, so their measurements are in proportion.'
        write: 'Small cut-off cone and full cone are similar'
      - say: 'Here the top is the wider end, so the full cone points downwards, with its tip below the small bottom circle.'
      - say: 'Let the bottom radius be $r$. The top diameter is twice the bottom diameter, so the top radius is twice as well: $2r$.'
        write: 'Bottom radius $= r,\quad$ top radius $= 2r$'
        point:
          - {figure: 0, kind: 'label', target: {x: 160, y: 200}, text: 'r'}
          - {figure: 0, kind: 'label', target: {x: 160, y: 70}, text: '2r'}
      - say: 'Let the tip be a distance $d$ below the bottom face. The small cone has height $d$ and radius $r$. The full cone has height $d$ plus $h$, and radius $2r$.'
        write: 'Small cone: height $d$, radius $r$; full cone: height $d + h$, radius $2r$'
        point:
          - {figure: 0, kind: 'label', target: {x: 160, y: 232}, text: 'tip: d below'}
      - say: 'For similar cones, radius over height is the same fraction for both. So $r$ over $d$ equals $2r$ over $d + h$.'
        write: '$\dfrac{r}{d} = \dfrac{2r}{d + h}$'
        point:
          - {line: 4, kind: arrow, text: 'the two cones'}
      - say: 'Cross-multiply: $r$ times $d + h$ equals $2r$ times $d$.'
        write: '$r(d + h) = 2rd$'
      - say: 'Divide both sides by $r$.'
        write: '$d + h = 2d$'
      - say: 'Subtract $d$ from both sides.'
        write: '$h = 2d - d = d$'
      - say: 'So the cut-off tip is also $h$ tall. Now go back to the full cone''s height, $d + h$, and replace $d$ with $h$.'
        write: 'Height of cone $= d + h = h + h = 2h$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '= [[d]]'}, at: '[[h]] + h', text: 'd = h'}
          - {figure: 0, kind: 'circle', target: 'h'}
      - say: 'It makes sense: the radius doubles from the bottom face to the top, so the height measured from the tip doubles too, from $h$ to $2h$.'
        write: '$\dfrac{2r}{r} = \dfrac{2h}{h} = 2$'
        point:
          - {figure: 0, kind: 'label', target: {x: 160, y: 200}, text: 'r'}
          - {figure: 0, kind: 'label', target: {x: 160, y: 70}, text: '2r'}
      - say: 'So the height of the cone is $2h$, which is answer choice A.'
        write: 'Height of cone $= 2h$'
        answer: true
        point:
          - {figure: 0, kind: 'circle', target: 'h', text: 'frustum h, cone 2h'}
    traps:
      B: 'You went for $2\pi h$. A height is a length, and $\pi$ belongs to circles, not to heights found from similar shapes. Similar cones give a height of $2h$.'
      C: 'You went for $\pi h$. There''s no reason for $\pi$ in a length like this. The cut-off tip is $h$ tall, so the whole cone is $2h$.'
      D: 'You went for $\tfrac{\pi h}{2}$. There''s no $\pi$ in a height found from similar shapes. The tip is $h$ tall and the frustum is $h$ tall, so the cone is $2h$.'
  34:
    moments:
      - say: 'A point $P$ moves on one side of a line $XY$, so that angle $XPY$ is always 90 degrees. Picture a set square pushed against two nails at $X$ and $Y$, with a pencil at its right-angled corner. We want the path it traces out, its locus.'
        write: 'Given: $\angle XPY = 90^{\circ}$'
        doodle: {name: 'custom:1994_q34_a', id: sq, caption: 'a set square against two nails'}
      - say: 'Let me draw the line $XY$, and a point $P$ where angle $XPY$ is 90 degrees.'
        show_sketch: true
        point:
          - {figure: sketch, kind: arc, target: XPY, text: '90°'}
      - say: 'A locus is the path a moving point traces out. To find it, recall a circle fact: the angle in a semicircle is a right angle. Any point on a circle sees a diameter at exactly 90 degrees.'
        write: 'Angle in a semicircle $= 90^{\circ}$'
        point:
          - {figure: 'sketch', kind: 'circle', target: 'P', text: 'sees XY at 90°'}
      - say: 'Here''s why. Join $P$ to the centre $O$. $OX$, $OP$ and $OY$ are all radii, so we get two isosceles triangles, and the angles at $P$ make up exactly half of the triangle''s 180 degrees.'
        write: '$\angle XPY = \dfrac{180^{\circ}}{2} = 90^{\circ}$'
        point:
          - {figure: 'sketch', kind: 'label', target: {x: 170, y: 180}, text: 'centre O'}
      - say: 'So draw the circle that has $XY$ as its diameter. Slide the set square along the nails, and its corner keeps to that circle: every point on it sees $XY$ at 90 degrees.'
        write: 'So $P$ lies on the circle with diameter $XY$'
        doodle_do:
          - {id: sq, op: move, part: pen, path: trace}
        point:
          - {line: 2, kind: box, text: 'the rule'}
          - {figure: sketch, kind: highlight, target: XY, text: 'diameter'}
      - say: 'And any point that sees $XY$ at a right angle must lie on that circle. So with no other condition, the locus would be the whole circle.'
        point:
          - {figure: 'sketch', kind: 'circle', target: 'locus of P', text: 'the circle'}
      - say: 'But the question says $P$ moves on one side of $XY$ only.'
        write: 'But $P$ stays on one side of $XY$'
        point:
          - {figure: 'sketch', kind: 'highlight', target: 'XY', text: 'one side only'}
      - say: '$XY$ is a diameter, so it cuts the circle exactly in half.'
        write: 'The diameter $XY$ cuts the circle in half'
        point:
          - {figure: 'sketch', kind: 'highlight', target: 'XY', text: 'diameter'}
      - say: 'Keeping only one side leaves half the circle: a semicircle, the path the pencil draws.'
        write: 'Locus $=$ semicircle on $XY$'
        doodle_do:
          - {id: sq, op: stage, stage: 'custom:1994_q34_a2'}
        point:
          - {line: 6, kind: arrow, text: 'one side'}
          - {figure: sketch, kind: circle, target: 'locus of P', text: 'semicircle'}
      - say: 'So the locus is a semicircle, which is answer choice D.'
        write: 'Answer: a semicircle'
        answer: true
    traps:
      A: 'You went for the perpendicular bisector of $XY$. That is the locus of points the same distance from $X$ and $Y$. Here angle $XPY$ is fixed at 90 degrees, which puts $P$ on the circle with $XY$ as diameter.'
      B: 'You went for a right-angled triangle. Each position of $P$ does make a right-angled triangle $XPY$, but a locus is the path $P$ traces, and that path is half of the circle on $XY$.'
      C: 'You went for a circle. That would be right if $P$ could go on both sides of $XY$. But $P$ stays on one side, so only half the circle counts: a semicircle.'
  35:
    moments:
      - say: '$M(4, q)$ is the midpoint of the line joining $L(p, -2)$ and $N(q, p)$. We want $p$ and $q$.'
        write: '$L(p,\ -2),\ \ N(q,\ p),\ \ M(4,\ q)$'
      - say: 'Let me draw $L$, $M$ and $N$ on the axes.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: M, text: 'midpoint'}
      - say: 'The midpoint is the average of the $x$-values and the average of the $y$-values. So we get one equation from the $x$s and one from the $y$s.'
        write: '$M = \left(\dfrac{x_1 + x_2}{2},\ \dfrac{y_1 + y_2}{2}\right)$'
      - say: 'The $x$-coordinates of $L$ and $N$ are $p$ and $q$, and their average must be the midpoint''s $x$-coordinate, 4.'
        write: '$x$-coordinates: $\ \dfrac{p + q}{2} = 4$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
      - say: 'Multiply both sides by 2. Let''s call this equation 1.'
        write: '$p + q = 8 \quad (1)$'
      - say: 'The $y$-coordinates of $L$ and $N$ are negative 2 and $p$, and their average must be the midpoint''s $y$-coordinate, which is $q$.'
        write: '$y$-coordinates: $\ \dfrac{-2 + p}{2} = q$'
      - say: 'Multiply both sides by 2.'
        write: '$p - 2 = 2q$'
      - say: 'Add 2 to both sides to get $p$ by itself. Call this equation 2.'
        write: '$p = 2q + 2 \quad (2)$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '− 2'}, at: '+ 2', text: 'across the ='}
      - say: 'Now substitute equation 2 into equation 1: wherever we see $p$, write $2q + 2$.'
        write: 'Put (2) into (1): $\ (2q + 2) + q = 8$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '= [[2q + 2]]'}, at: '(2q + 2)', text: '(2)'}
          - {line: 4, kind: arrow, text: '(1)'}
      - say: '$2q$ plus $q$ is $3q$.'
        write: '$3q + 2 = 8$'
      - say: 'Subtract 2 from both sides. 8 minus 2 is 6.'
        write: '$3q = 8 - 2 = 6$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '+ 2'}, at: '− 2', text: 'across the ='}
      - say: 'Divide by 3. 6 over 3 is 2.'
        write: '$q = \dfrac{6}{3} = 2$'
        point:
          - {line: 11, kind: move, from: {line: 10, at: '[[3]]q'}, at: '[[3]]6', text: 'divide by 3'}
      - say: 'Now go back to equation 2 to find $p$. $p$ is 2 times 2, plus 2. That is 4 plus 2, which is 6.'
        write: 'In (2): $\ p = 2(2) + 2 = 4 + 2 = 6$'
        point:
          - {line: 12, kind: move, from: {line: 11, at: '= [[2]]'}, at: '2([[2]])', text: 'q = 2'}
      - say: 'Check: $L$ is 6, negative 2, and $N$ is 2, 6. The average of 6 and 2 is 4, and the average of negative 2 and 6 is 2. So the midpoint is 4, 2, which is 4, $q$.'
        write: 'Check: $\left(\dfrac{6 + 2}{2},\ \dfrac{-2 + 6}{2}\right) = (4,\ 2)$'
      - say: 'So $p$ is 6 and $q$ is 2, which is answer choice D.'
        write: '$p = 6,\ q = 2$'
        point:
          - {figure: sketch, kind: label, target: '(p, −2)', text: '(6, −2)'}
          - {figure: sketch, kind: label, target: '(q, p)', text: '(2, 6)'}
          - {figure: sketch, kind: label, target: '(4, q)', text: '(4, 2)'}
        answer: true
    traps:
      A: 'You went for $p = 2$ and $q = 4$. The values are swapped. Then the $y$-values, negative 2 and 2, would average to 0, not to $q$. The equations give $q = 2$ and $p = 6$.'
      B: 'You went for $p = 3$ and $q = 1$. Then $p + q$ is 4, but the $x$-values must add to 8, since their average is 4. Solving gives $p = 6$ and $q = 2$.'
      C: 'You went for $p = 5$ and $q = 3$. They do add to 8, but the $y$-values, negative 2 and 5, average to one and a half, not 3. Only $p = 6$ and $q = 2$ fit both.'
  36:
    moments:
      - say: 'We need the equation of the straight line in the graph. In the diagram, it cuts the $y$-axis at 0, 4 and the $x$-axis at 3, 0.'
        write: 'Points on the line: $(0,\ 4)$ and $(3,\ 0)$'
        point:
          - {figure: 0, kind: circle, target: '(0, 4)'}
          - {figure: 0, kind: circle, target: '(3, 0)'}
      - say: 'First the gradient, which measures steepness, like a slide: the change in $y$ over the change in $x$.'
        write: '$m = \dfrac{y_2 - y_1}{x_2 - x_1}$'
        doodle: {name: 'custom:1994_q36_a', id: slide, caption: 'steepness: down 4, across 3'}
      - say: 'Going from 0, 4 to 3, 0: $y$ changes by 0 minus 4, which is negative 4, down the slide. $x$ changes by 3 minus 0, which is 3.'
        write: '$m = \dfrac{0 - 4}{3 - 0} = \dfrac{-4}{3} = -\dfrac{4}{3}$'
        doodle_do:
          - {id: slide, op: label, part: grad, text: '−4/3'}
      - say: 'The gradient is negative, which fits the picture: the line falls from left to right, like the child going down the slide.'
        write: '$m < 0$: the line falls'
        doodle_do:
          - {id: slide, op: move, part: kid, path: down}
        point:
          - {figure: 0, kind: 'label', target: {x: 190, y: 130}, text: 'falls left to right'}
      - say: 'A straight line is $y = mx + c$, where $c$ is where it crosses the $y$-axis. Here it crosses at 4, so $c$ is 4.'
        write: '$y = mx + c$ with $c = 4$'
        point:
          - {figure: 0, kind: label, target: '(0, 4)', text: 'c = 4'}
      - say: 'Substitute the gradient we found, negative 4 over 3, and $c = 4$.'
        write: '$y = -\dfrac{4}{3}x + 4$'
        point:
          - {line: 5, kind: move, from: {line: 2, at: '= [[−34]]'}, at: '−34', text: 'gradient'}
          - {line: 5, kind: move, from: {line: 4, at: 'c = [[4]]'}, at: '+ [[4]]', text: 'c'}
      - say: 'The options have no fractions, so multiply every term by 3.'
        write: '$3 \times y = 3 \times \left(-\dfrac{4}{3}x\right) + 3 \times 4$'
      - say: '3 times $y$ is $3y$. 3 times negative 4 over 3 $x$ is negative $4x$. And 3 times 4 is 12.'
        write: '$3y = -4x + 12$'
      - say: 'Check with 0, 4: $3y$ is 3 times 4, which is 12, and negative 4 times 0, plus 12, is 12. Good.'
        write: 'Check $(0,\ 4)$: $\ 3(4) = 12$ and $-4(0) + 12 = 12$'
      - say: 'Check with 3, 0: $3y$ is 0, and negative 4 times 3, plus 12, is negative 12 plus 12, which is 0. Good.'
        write: 'Check $(3,\ 0)$: $\ 3(0) = 0$ and $-4(3) + 12 = 0$'
      - say: 'So the equation is $3y = -4x + 12$, which is answer choice C.'
        write: '$3y = -4x + 12$'
        answer: true
    traps:
      A: 'You went for $3y = 4x + 12$. That line rises from left to right, but the graph falls. The gradient is negative 4 over 3, so it is $3y = -4x + 12$.'
      B: 'You went for $3y = 3x + 12$. That has gradient 1, rising to the right. The graph falls: from 0, 4 to 3, 0 the gradient is negative 4 over 3.'
      D: 'You went for $3y = -4x + 9$. The gradient is right, but at $x = 0$ it gives $y = 3$, not 4. The line crosses the $y$-axis at 4, so the constant is 3 times 4, which is 12.'
  37:
    moments:
      - say: 'From the top of a cliff 10 m high, the angle of depression of a boat is 30 degrees: picture the watcher on the cliff looking down at the boat. We want the distance from the boat to the foot of the cliff.'
        write: 'Cliff height $= 10$ m, angle of depression $= 30^{\circ}$'
        doodle: {name: 'custom:1994_q37_a', id: cliff, caption: 'a watcher looks down at a boat', size: scene}
      - say: 'Picture a right-angled triangle: the cliff is the vertical side, the sea is the horizontal side, and the line of sight runs from the top of the cliff down to the boat.'
        show_sketch: true
        point:
          - {figure: sketch, kind: highlight, target: AB, text: 'cliff'}
          - {figure: sketch, kind: highlight, target: AC, text: 'line of sight'}
      - say: 'The angle of depression is measured down from the horizontal at the top, along the watcher''s line of sight. That horizontal is parallel to the sea, so the angle at the boat, looking up, is also 30 degrees. They are alternate angles.'
        write: 'Angle at the boat $= 30^{\circ}$ (alternate angles)'
        doodle_do:
          - {id: cliff, op: highlight, part: sight}
        point:
          - {figure: sketch, kind: circle, target: horizontal}
          - {figure: sketch, kind: arc, target: ACB, text: '30°'}
      - say: 'From the boat, the cliff''s 10 m is the opposite side, and the distance $d$ we want is the adjacent side. Opposite over adjacent is tangent.'
        write: '$\tan 30^{\circ} = \dfrac{\text{opposite}}{\text{adjacent}} = \dfrac{10}{d}$'
        point:
          - {line: 3, kind: move, from: {line: 0, at: '[[10]] m'}, at: 'd[[10]]', text: 'opposite'}
          - {figure: sketch, kind: circle, target: '10 m', text: 'opposite'}
          - {figure: sketch, kind: circle, target: d, text: 'adjacent'}
      - say: 'To get $d$ by itself, multiply both sides by $d$, then divide both sides by tan 30.'
        write: '$d = \dfrac{10}{\tan 30^{\circ}}$'
      - say: 'Tan 30 degrees is 1 over root 3. It comes from half of an equilateral triangle.'
        write: '$\tan 30^{\circ} = \dfrac{1}{\sqrt{3}}$'
      - say: 'Put that into our formula for $d$: 10 divided by 1 over root 3. Dividing by 1 over root 3 is the same as multiplying by root 3.'
        write: '$d = 10 \div \dfrac{1}{\sqrt{3}} = 10 \times \sqrt{3}$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '[[10]]'}, at: '= [[10]] ÷', text: 'into here'}
          - {line: 6, kind: move, from: {line: 5, at: '= [[31]]'}, at: '÷ [[31]]', text: 'tan 30°'}
      - say: 'So $d$ is 10 root 3 metres.'
        write: '$d = 10\sqrt{3}$ m'
      - say: 'Check: root 3 is about 1.732, so 10 root 3 is about 17.32 m. A shallow angle means the boat is far out, further than the cliff is tall. That fits the picture.'
        write: '$10\sqrt{3} \approx 10 \times 1.732 = 17.32$ m'
        doodle_do:
          - {id: cliff, op: label, part: dist, text: 'about 17.32 m'}
        point:
          - {figure: 'sketch', kind: 'label', target: 'd', text: '≈ 17.32 m'}
          - {figure: 'sketch', kind: 'circle', target: '10 m'}
          - {line: 8, kind: highlight, at: '=[[17.32]]', to: {doodle: cliff, part: dist}}
      - say: 'So the boat is 10 root 3 metres from the foot of the cliff, which is answer choice C.'
        write: 'Distance $= 10\sqrt{3}$ m'
        point:
          - {figure: sketch, kind: label, target: d, text: '10√3 m'}
        answer: true
    traps:
      A: 'You went for 5 root 3 over 3, about 2.9 m. That''s much too close for a shallow 30 degree angle. The distance is 10 divided by tan 30, which is 10 root 3.'
      B: 'You went for 5 root 3. That is what you get by treating 10 m as the hypotenuse and using cosine. But 10 m is the opposite side, so we use tan, and $d = 10\sqrt{3}$.'
      D: 'You went for 10 root 3 over 3, which is 10 over root 3, about 5.8 m. That multiplies by tan 30 instead of dividing, and it puts the boat closer than the cliff is tall. Divide 10 by tan 30 to get 10 root 3.'
  38:
    moments:
      - say: 'We need the value of sine of negative 690 degrees.'
        write: '$\sin(-690^{\circ})$'
      - say: 'Let me draw the turn: 690 degrees clockwise from the positive $x$-axis.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '−690°'}
      - say: 'A full turn is 360 degrees, and after a full turn we are back where we started. So sine repeats every 360 degrees, and we can add 360 as many times as we like without changing the value: picture a frog on a number line, hopping 360 at a time.'
        write: '$\sin(\theta + 360^{\circ}) = \sin\theta$'
        doodle: {name: 'custom:1994_q38_a', id: frog, caption: 'hop 360 at a time', size: scene}
      - say: 'Add 360 once. Negative 690 plus 360 is negative 330: the first hop.'
        write: '$-690^{\circ} + 360^{\circ} = -330^{\circ}$'
        doodle_do:
          - {id: frog, op: move, part: frog, path: hop1}
        point:
          - {line: 2, kind: box, text: 'the rule'}
          - {line: 3, kind: move, from: {line: 0, at: '−690∘'}, at: '−690∘'}
      - say: 'Still negative, so add 360 again. Negative 330 plus 360 is 30: the frog lands on 30.'
        write: '$-330^{\circ} + 360^{\circ} = 30^{\circ}$'
        doodle_do:
          - {id: frog, op: move, part: frog, path: hop2}
          - {id: frog, op: circle, part: end}
        point:
          - {line: 4, kind: move, from: {line: 3, at: '= [[−330∘]]'}, at: '−330∘', text: 'again'}
          - {figure: sketch, kind: circle, target: '30°', text: 'ends at 30°'}
          - {line: 4, kind: highlight, at: '=30', to: {doodle: frog, part: end}}
      - say: 'So two full turns take negative 690 degrees to 30 degrees, and the sine doesn''t change along the way.'
        write: 'So $\sin(-690^{\circ}) = \sin(-330^{\circ}) = \sin 30^{\circ}$'
      - say: 'Another way to see it: two full turns clockwise is negative 720, and negative 690 is 30 degrees less than that. So we end up 30 degrees above the positive $x$-axis.'
        write: '$-690^{\circ} = -720^{\circ} + 30^{\circ}$'
        point:
          - {figure: sketch, kind: circle, target: '−690°', text: '−720° + 30°'}
      - say: '30 degrees is between 0 and 90, in the first quadrant, where sine is positive.'
        write: '$0^{\circ} < 30^{\circ} < 90^{\circ}$: sine is positive'
      - say: 'And sine of 30 degrees is a half. In half of an equilateral triangle of side 2, the side opposite the 30 degree angle is 1, and 1 over 2 is a half.'
        write: '$\sin 30^{\circ} = \dfrac{\text{opposite}}{\text{hypotenuse}} = \dfrac{1}{2}$'
        point:
          - {figure: sketch, kind: highlight, target: 'PN', text: 'opposite'}
          - {figure: sketch, kind: highlight, target: 'OP', text: 'hypotenuse 1'}
      - say: 'So the value is a half, which is answer choice D.'
        write: '$\sin(-690^{\circ}) = \dfrac{1}{2}$'
        answer: true
        point:
          - {figure: sketch, kind: circle, target: '?', text: '½'}
    traps:
      A: 'You went for root 3 over 2. That is sine of 60 degrees. The angle comes down to 30 degrees, and sine of 30 is a half.'
      B: 'You went for negative root 3 over 2. The angle reduces to 30 degrees, not 60, and it lands in the first quadrant, where sine is positive. Sine of 30 is a half.'
      C: 'You went for negative a half. A negative angle doesn''t have to give a negative sine. Adding two full turns brings it to 30 degrees, in the first quadrant, so the answer is positive a half.'
  39:
    moments:
      - say: 'We have $y = 3t^{3} + 2t^{2} - 7t + 3$, and we want $dy$ by $dt$ when $t$ is negative 1. First we differentiate, then we substitute.'
        write: '$y = 3t^{3} + 2t^{2} - 7t + 3$'
      - say: 'To differentiate a power, bring the power down to multiply, then reduce the power by one.'
        write: '$\dfrac{d}{dt}(t^{n}) = nt^{n - 1}$'
      - say: 'For $3t^{3}$: bring the 3 down, and 3 times 3 is 9. The power drops from 3 to 2. So we get $9t^{2}$.'
        write: '$3t^{3} \to 3 \times 3t^{2} = 9t^{2}$'
        point:
          - {line: 1, kind: box, text: 'the rule'}
      - say: 'For $2t^{2}$: 2 times 2 is 4, and the power drops from 2 to 1. So we get $4t$.'
        write: '$2t^{2} \to 2 \times 2t^{1} = 4t$'
      - say: 'Negative $7t$ becomes negative 7, and the constant 3 becomes 0, because a constant doesn''t change.'
        write: '$-7t \to -7,\quad 3 \to 0$'
      - say: 'Put those pieces together, and the derivative is $9t^{2} + 4t - 7$.'
        write: '$\dfrac{dy}{dt} = 9t^{2} + 4t - 7$'
        point:
          - {line: 5, kind: move, from: {line: 2, at: '= [[9t2]]'}, at: '9t2'}
          - {line: 5, kind: move, from: {line: 3, at: '= [[4t]]'}, at: '+ 4t'}
          - {line: 5, kind: move, from: {line: 4, at: '→ [[−7]]'}, at: '− 7'}
      - say: 'Now substitute $t = -1$ into that derivative, with brackets round the negative 1.'
        write: '$\dfrac{dy}{dt} = 9(-1)^{2} + 4(-1) - 7$'
        point:
          - {line: 5, kind: arrow, text: 'sub in'}
      - say: 'Negative 1 squared is positive 1, so the first term is 9 times 1, which is 9. And 4 times negative 1 is negative 4.'
        write: '$= 9(1) - 4 - 7 = 9 - 4 - 7$'
      - say: '9 minus 4 is 5, and 5 minus 7 is negative 2.'
        write: '$= 5 - 7 = -2$'
      - say: 'So $dy$ by $dt$ at $t = -1$ is negative 2, which is answer choice C.'
        write: '$\dfrac{dy}{dt} = -2$'
        answer: true
    traps:
      A: 'You went for negative 1. Check the arithmetic: 9 times negative 1 squared is 9, 4 times negative 1 is negative 4, and 9 minus 4 minus 7 is negative 2.'
      B: 'You went for 1. Differentiate first to get $9t^{2} + 4t - 7$. Then at $t = -1$: 9 minus 4 minus 7 is negative 2.'
      D: 'You went for 2. The size is right but the sign is lost. 9 minus 4 is 5, and 5 minus 7 is negative 2.'
  40:
    moments:
      - say: 'We want the point on the curve $y = 2x^{2} - 2x + 3$ where the gradient is 2.'
        write: '$y = 2x^{2} - 2x + 3$'
      - say: 'Let me sketch the graph, so we can see its shape.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'y = 2x² − 2x + 3'}
      - say: 'The gradient of a curve at a point is its derivative there: how steep the road is at that spot. Picture the curve as a valley road with a bike at the bottom. So first we differentiate: bring each power down and reduce it by one.'
        write: 'Gradient $= \dfrac{dy}{dx}$'
        doodle: {name: 'custom:1994_q40_a', id: valley, caption: 'where is the road 2 steep?'}
      - say: 'To differentiate a power, bring the power down in front and reduce the power by one.'
        write: 'Differentiation: $\dfrac{d}{dx}\left(x^{n}\right) = nx^{n - 1}$'
      - say: '$2x$ squared gives 2 times $2x$, which is $4x$. Negative $2x$ gives negative 2. And the constant 3 gives 0.'
        write: '$\dfrac{dy}{dx} = 2 \times 2x - 2 + 0 = 4x - 2$'
      - say: 'We want the gradient to be 2, so set that derivative equal to 2.'
        write: '$4x - 2 = 2$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '= [[4x − 2]]'}, at: '4x − 2', text: 'gradient'}
          - {figure: sketch, kind: circle, target: 'gradient 2'}
      - say: 'Add 2 to both sides. 2 plus 2 is 4.'
        write: '$4x = 2 + 2 = 4$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '− 2'}, at: '+ 2', text: 'across the ='}
      - say: 'Divide both sides by 4. 4 over 4 is 1: the bike rides up to $x = 1$, where the road is 2 steep.'
        write: '$x = \dfrac{4}{4} = 1$'
        doodle_do:
          - {id: valley, op: move, part: bike, path: ride}
        point:
          - {line: 7, kind: move, from: {line: 6, at: '[[4]]x'}, at: '[[4]]4', text: 'divide by 4'}
      - say: 'The question wants the point, so we still need $y$. Put $x = 1$ into the curve itself, not into the derivative.'
        write: 'On the curve: $\ y = 2(1)^{2} - 2(1) + 3$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '= [[1]]'}, at: '2[[(1)]]2', text: 'x = 1'}
          - {line: 8, kind: move, from: {line: 7, at: '= [[1]]'}, at: '− 2[[(1)]]', text: 'x = 1'}
          - {line: 0, kind: arrow, text: 'the curve'}
      - say: '1 squared is 1, so 2 times 1 is 2. Then 2 minus 2 is 0, and 0 plus 3 is 3: the bike is at 1, 3.'
        write: '$y = 2 - 2 + 3 = 3$'
        doodle_do:
          - {id: valley, op: label, part: spot, text: '(1, 3)'}
        point:
          - {line: 9, kind: highlight, at: '=3', to: {doodle: valley, part: spot}}
      - say: 'Check the gradient at $x = 1$: 4 times 1, minus 2, is 2. Good.'
        write: 'Check: $\ 4(1) - 2 = 2$'
      - say: 'So the point is 1, 3, which is answer choice A.'
        write: 'Point: $(1,\ 3)$'
        answer: true
        point:
          - {figure: sketch, kind: circle, target: 'P', text: '(1, 3)'}
    traps:
      B: 'You went for 2, 7. That point is on the curve, but the gradient there is 4 times 2 minus 2, which is 6, not 2. Setting $4x - 2 = 2$ gives $x = 1$.'
      C: 'You went for 0, 3. It is on the curve, but the gradient at $x = 0$ is negative 2, not 2. Solving $4x - 2 = 2$ gives $x = 1$, and then $y$ is 3.'
      D: 'You went for 3, 15. It is on the curve, but the gradient there is 4 times 3 minus 2, which is 10. The gradient is 2 only at $x = 1$.'
  41:
    moments:
      - say: 'We need to integrate 1 minus $x$, over $x$ cubed. The power rule works on one power of $x$ at a time, so first we split the fraction into separate powers of $x$.'
        write: '$\displaystyle\int \dfrac{1 - x}{x^{3}}\,dx$'
      - say: 'Split it into two fractions over the same bottom: 1 over $x$ cubed, minus $x$ over $x$ cubed.'
        write: '$\dfrac{1 - x}{x^{3}} = \dfrac{1}{x^{3}} - \dfrac{x}{x^{3}}$'
      - say: '1 over $x$ cubed is $x$ to the negative 3. And $x$ over $x$ cubed cancels to 1 over $x$ squared, which is $x$ to the negative 2.'
        write: '$= x^{-3} - x^{-2}$'
      - say: 'To integrate a power, add one to the power and divide by the new power.'
        write: '$\displaystyle\int x^{n}\,dx = \dfrac{x^{n + 1}}{n + 1}$'
      - say: 'For $x$ to the negative 3: negative 3 plus 1 is negative 2, so we get $x$ to the negative 2, over negative 2. That is negative 1 over $2x$ squared.'
        write: 'First term: $\displaystyle\int x^{-3}\,dx = \dfrac{x^{-2}}{-2} = -\dfrac{1}{2x^{2}}$'
        point:
          - {line: 3, kind: box, text: 'the rule'}
      - say: 'For $x$ to the negative 2: negative 2 plus 1 is negative 1, so we get $x$ to the negative 1, over negative 1. That is negative 1 over $x$.'
        write: 'Second term: $\displaystyle\int x^{-2}\,dx = \dfrac{x^{-1}}{-1} = -\dfrac{1}{x}$'
      - say: 'But the second term had a minus in front of it. Minus times negative 1 over $x$ is plus 1 over $x$.'
        write: '$-\displaystyle\int x^{-2}\,dx = -\left(-\dfrac{1}{x}\right) = +\dfrac{1}{x}$'
      - say: 'Put the two results together, and add the constant of integration, $k$.'
        write: 'Together: $\ -\dfrac{1}{2x^{2}} + \dfrac{1}{x} + k = \dfrac{1}{x} - \dfrac{1}{2x^{2}} + k$'
        point:
          - {line: 7, kind: move, from: {line: 4, at: '= [[−2x21]]'}, at: 'together[[−2x21]]', text: 'first'}
          - {line: 7, kind: move, from: {line: 6, at: '= [[+x1]]'}, at: '[[+x1]] + k =', text: 'second'}
      - say: 'Check by differentiating. $x$ to the negative 1 gives negative $x$ to the negative 2, and negative a half $x$ to the negative 2 gives $x$ to the negative 3. That is what we started with.'
        write: 'Check: $\dfrac{d}{dx}\left(x^{-1} - \tfrac{1}{2}x^{-2}\right) = -x^{-2} + x^{-3}$'
      - say: 'So the integral is 1 over $x$, minus 1 over $2x$ squared, plus $k$, which is answer choice C.'
        write: '$\displaystyle\int \dfrac{1 - x}{x^{3}}\,dx = \dfrac{1}{x} - \dfrac{1}{2x^{2}} + k$'
        answer: true
    traps:
      A: 'You went for $x - x^{2}$ over $x^{4}$. That is the same expression as the question with the top and bottom multiplied by $x$, so nothing has been integrated. Split into $x^{-3} - x^{-2}$ and integrate each power.'
      B: 'You went for 4 over $x^{4}$ minus 3 over $x^{3}$. Those powers have gone down, not up. Integrating raises each power by one: $x^{-3}$ becomes $x^{-2}$ over negative 2.'
      D: 'You went for 1 over $3x^{3}$ minus 1 over $2x$. The powers have gone the wrong way. Integrating $x^{-3}$ gives $x^{-2}$ over negative 2, and integrating $-x^{-2}$ gives plus $x^{-1}$.'
  42:
    moments:
      - say: 'We need the integral from negative 1 to 1 of $2x + 1$, all squared.'
        write: '$\displaystyle\int_{-1}^{1}(2x + 1)^{2}\,dx$'
      - say: 'Let me sketch the graph, so we can see its shape.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'area = ?', text: 'the integral'}
          - {figure: sketch, kind: circle, target: '−1', text: 'lower limit'}
          - {figure: sketch, kind: circle, target: '1', text: 'upper limit'}
      - say: 'We can integrate the bracket directly, without expanding. Raise the power by one, divide by the new power, and also divide by the number in front of $x$, because of the chain rule.'
        write: '$\displaystyle\int (ax + b)^{n}\,dx = \dfrac{(ax + b)^{n + 1}}{a(n + 1)}$'
      - say: 'Here the power goes from 2 to 3, and the number in front of $x$ is 2. So we divide by 3 times 2, which is 6.'
        write: '$\displaystyle\int (2x + 1)^{2}\,dx = \dfrac{(2x + 1)^{3}}{3 \times 2} = \dfrac{(2x + 1)^{3}}{6}$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
      - say: 'Now we put in the limits: the value at the top limit, 1, minus the value at the bottom limit, negative 1.'
        write: '$\displaystyle\int_{-1}^{1}(2x + 1)^{2}\,dx = \left[\dfrac{(2x + 1)^{3}}{6}\right]_{-1}^{1}$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '= [[6(2x + 1)3]]'}, at: '6(2x + 1)3', text: 'from here'}
      - say: 'Replace $x$ with 1 in the first part, and with negative 1 in the second part.'
        write: '$= \dfrac{(2(1) + 1)^{3}}{6} - \dfrac{(2(-1) + 1)^{3}}{6}$'
      - say: 'At the top, 2 times 1 plus 1 is 3. At the bottom, 2 times negative 1 plus 1 is negative 1.'
        write: '$= \dfrac{3^{3}}{6} - \dfrac{(-1)^{3}}{6}$'
      - say: '3 cubed is 27. And negative 1 cubed is negative 1.'
        write: '$= \dfrac{27}{6} - \left(-\dfrac{1}{6}\right)$'
      - say: 'Minus a negative is a plus, so it is 27 plus 1, over 6, which is 28 over 6.'
        write: '$= \dfrac{27 + 1}{6} = \dfrac{28}{6}$'
      - say: '28 over 6 simplifies, dividing top and bottom by 2, to 14 over 3.'
        write: '$= \dfrac{14}{3}$'
      - say: '3 goes into 14 four times, which is 12, with 2 left over. So 14 over 3 is 4 and two thirds.'
        write: '$= 4\tfrac{2}{3}$'
      - say: 'Check by expanding instead: $2x + 1$ squared is $4x^{2} + 4x + 1$, which integrates to 4 over 3 $x$ cubed, plus $2x$ squared, plus $x$.'
        write: 'Check: $\displaystyle\int (4x^{2} + 4x + 1)\,dx = \tfrac{4}{3}x^{3} + 2x^{2} + x$'
      - say: 'At 1 that is 4 over 3 plus 2 plus 1, which is 13 over 3. At negative 1 it is negative 4 over 3 plus 2 minus 1, which is negative 1 over 3. The difference is 14 over 3 again.'
        write: '$\left(\tfrac{4}{3} + 2 + 1\right) - \left(-\tfrac{4}{3} + 2 - 1\right) = \tfrac{13}{3} - \left(-\tfrac{1}{3}\right) = \tfrac{14}{3}$'
      - say: 'So the integral is 4 and two thirds, which is answer choice D.'
        write: '$\displaystyle\int_{-1}^{1}(2x + 1)^{2}\,dx = 4\tfrac{2}{3}$'
        answer: true
        point:
          - {figure: sketch, kind: circle, target: 'area = ?', text: '4⅔'}
    traps:
      A: 'You went for 3 and two thirds. Check the limits: at 1 we get 27 over 6, at negative 1 we get negative 1 over 6, and subtracting gives 28 over 6, which is 4 and two thirds.'
      B: 'You went for 4. That is 24 over 6. The value at 1 is 27 over 6, and subtracting negative 1 over 6 adds 1 over 6, giving 28 over 6, which is 4 and two thirds.'
      C: 'You went for 4 and a third, which is 26 over 6. That subtracts 1 over 6 instead of adding it. Minus negative 1 over 6 is plus 1 over 6, giving 28 over 6, which is 4 and two thirds.'
  43:
