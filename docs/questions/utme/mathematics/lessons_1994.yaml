  44:
    moments:
      - say: 'The table gives $x$ from 1 to 5, with frequencies in terms of $y$, and the mean is 43 over 14. We want $y$.'
        write: '$\text{mean} = \dfrac{43}{14}$'
      - say: 'The mean of a frequency table is the total of all the values, which is the sum of $f$ times $x$, over how many values there are, which is the sum of $f$. So we build both sums in terms of $y$.'
        write: '$\bar{x} = \dfrac{\sum fx}{\sum f}$'
      - say: 'First the total frequency. Add all five frequencies.'
        write: '$\sum f = (y + 2) + (y - 1) + (2y - 3) + (y + 4) + (3y - 4)$'
      - say: 'Collect the $y$ terms: 1 plus 1 plus 2 plus 1 plus 3 is 8, so $8y$.'
        write: '$y$ terms: $\ y + y + 2y + y + 3y = 8y$'
      - say: 'Now the plain numbers: 2 minus 1 is 1, minus 3 is negative 2, plus 4 is 2, minus 4 is negative 2.'
        write: 'Numbers: $\ 2 - 1 - 3 + 4 - 4 = -2$'
      - say: 'So the total frequency is $8y$ minus 2.'
        write: 'So $\sum f = 8y - 2$'
      - say: 'Now $\sum fx$: multiply each frequency by its $x$ value, 1, 2, 3, 4 and 5.'
        write: '$\sum fx = 1(y + 2) + 2(y - 1) + 3(2y - 3) + 4(y + 4) + 5(3y - 4)$'
      - say: 'Expand each bracket. For example, 3 times $2y - 3$ is $6y$ minus 9, and 5 times $3y - 4$ is $15y$ minus 20.'
        write: '$= y + 2 + 2y - 2 + 6y - 9 + 4y + 16 + 15y - 20$'
      - say: 'The $y$ terms: 1 plus 2 plus 6 plus 4 plus 15 is 28. The numbers: 2 minus 2 is 0, minus 9 is negative 9, plus 16 is 7, minus 20 is negative 13.'
        write: '$= 28y - 13$'
      - say: 'Now put the two sums we built into the mean formula, and set it equal to 43 over 14.'
        write: '$\dfrac{28y - 13}{8y - 2} = \dfrac{43}{14}$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '= [[28y − 13]]'}, at: '28y − 13', text: 'Σfx'}
          - {line: 9, kind: move, from: {line: 5, at: '= [[8y − 2]]'}, at: '[[8y − 2]]28y', text: 'Σf'}
      - say: 'Cross-multiply: 14 times the top equals 43 times the bottom.'
        write: '$14(28y - 13) = 43(8y - 2)$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '[[14]]43'}, at: '[[14]](28y', text: 'across'}
          - {line: 10, kind: move, from: {line: 9, at: '14[[43]]'}, at: '[[43]](8y', text: 'across'}
      - say: 'On the left, 14 times 28 is 392, and 14 times 13 is 182. On the right, 43 times 8 is 344, and 43 times 2 is 86.'
        write: '$392y - 182 = 344y - 86$'
      - say: 'Subtract $344y$ from both sides. 392 minus 344 is 48.'
        write: '$48y - 182 = -86$'
      - say: 'Add 182 to both sides. Negative 86 plus 182 is 96.'
        write: '$48y = -86 + 182 = 96$'
        point:
          - {line: 13, kind: move, from: {line: 12, at: '− 182'}, at: '+ 182', text: 'across the ='}
      - say: 'Divide by 48. 96 divided by 48 is 2.'
        write: '$y = \dfrac{96}{48} = 2$'
        point:
          - {line: 14, kind: move, from: {line: 13, at: '[[48]]y'}, at: '[[48]]96', text: 'divide by 48'}
      - say: 'Check: with $y = 2$ the frequencies are 4, 1, 1, 6 and 2, which add to 14. And $\sum fx$ is 4 plus 2 plus 3 plus 24 plus 10, which is 43. So the mean is 43 over 14.'
        write: 'Check: $\dfrac{4 + 2 + 3 + 24 + 10}{4 + 1 + 1 + 6 + 2} = \dfrac{43}{14}$'
      - say: 'So $y$ is 2, which is answer choice B.'
        write: '$y = 2$'
        answer: true
    traps:
      A: 'You went for 1. Then the frequency $y - 1$ would be 0 and $2y - 3$ would be negative 1, which is impossible. Solving the mean equation gives $48y = 96$, so $y$ is 2.'
      C: 'You went for 3. Then the frequencies are 5, 2, 3, 7 and 5, totalling 22, and $\sum fx$ is 71, so the mean is 71 over 22, not 43 over 14. $y$ is 2.'
      D: 'You went for 4. Then $\sum f$ is 30 and $\sum fx$ is 99, so the mean is 99 over 30, not 43 over 14. The equation gives $48y = 96$, so $y$ is 2.'
  45:
    moments:
      - say: 'Twelve positive numbers have a mean of 3: picture them as twelve short stacks. When one more number is added, the mean of the thirteen becomes 5. We want that thirteenth number.'
        write: '12 numbers: mean $3$; $\ 13$ numbers: mean $5$'
        doodle: {name: 'custom:1994_q45_a', id: stacks, caption: 'twelve stacks and one more', size: scene}
      - say: 'A mean is a total divided by a count. Turn that round, and the total is the mean times the count. Totals are easier to compare than means.'
        write: 'Total $= \text{mean} \times \text{count}$'
      - say: 'The first twelve numbers have a mean of 3, so their total is 12 times 3, which is 36: all the short stacks together.'
        write: 'First twelve: total $= 12 \times 3 = 36$'
        doodle_do:
          - {id: stacks, op: label, part: old, text: 'total 36'}
      - say: 'All thirteen have a mean of 5, so their total is 13 times 5, which is 65.'
        write: 'All thirteen: total $= 13 \times 5 = 65$'
      - say: 'The only thing that changed between those two totals is the new number. So the new number is the difference: 65 minus 36.'
        write: 'New number $= 65 - 36$'
        point:
