  28:
    moments:
      - say: 'Three angles of a quadrilateral are given in terms of $x$, $y$ and $z$. We want the fourth angle.'
        write: '$(3y - x - z)^{\circ},\ \ 3x^{\circ},\ \ (2z - 2y - x)^{\circ}$'
      - say: 'Let me draw the quadrilateral with its angles.'
        show_sketch: true
