# UTME 1994 Mathematics — lessons for the board.
#
# (short header; see lessons_2002.yaml for the full format notes)
#
# Keyed on question number, like explanations_1994.yaml. Answers match that file.
# Forty-nine questions: the paper ends at Q49 in this compilation.
format_version: 1
exam_year: 1994
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'One over three, divided by a square bracket, with a round bracket inside it. Where do we start? Most students rush the division and get it upside down.'
        write: '$\dfrac{1}{3} \div \left[\dfrac{5}{7}\left(\dfrac{9}{10} - 1 + \dfrac{3}{4}\right)\right]$'
      - section: 'Solution'
        say: 'We use BODMAS: Brackets, Of, Division, Multiplication, Addition, Subtraction. It is the order of working. Brackets come first, starting with the inner one, the round bracket.'
        write: 'By BODMAS: brackets first, the inner one first'
      - section: 'Step 1: the round bracket'
        say: 'Inside the round bracket: 9 over 10, minus 1, plus 3 over 4. To add and subtract fractions, we need a common denominator.'
        write: 'Round bracket: $\dfrac{9}{10} - 1 + \dfrac{3}{4}$'
      - say: 'The L.C.M., the lowest common multiple, of 10 and 4 is 20: the smallest number both go into. Picture one bar cut into 20 equal pieces.'
        write: 'L.C.M. of $10$ and $4 = 20$'
        doodle: {name: 'custom:1994_q01_a', id: bar, caption: 'one whole bar, 20 pieces'}
      - say: '20 divided by 10 is 2, and 2 times 9 is 18. The 1 is 20 over 20. 20 divided by 4 is 5, and 5 times 3 is 15.'
        write: '$= \dfrac{18 - 20 + 15}{20}$'
      - say: '18 minus 20 is negative 2, and negative 2 plus 15 is 13. So the round bracket is 13 over 20: 13 of the 20 pieces.'
        write: '$= \dfrac{13}{20}$'
        doodle_do:
          - {id: bar, op: stage, stage: 'custom:1994_q01_a2'}
        point:
          - {line: 5, kind: highlight, at: '13', to: {doodle: bar, part: thirteen}}
      - section: 'Step 2: the square bracket'
        say: 'Now the square bracket: 5 over 7 times the 13 over 20 we just found.'
        write: 'Square bracket: $\dfrac{5}{7} \times \dfrac{13}{20}$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '= [[2013]]'}, at: '[[2013]]', text: 'round bracket'}
        doodle_do:
          - {id: bar, op: circle, part: thirteen}
      - say: 'Cancel first. 5 goes into 5 once, and 5 goes into 20 four times.'
        write: '$= \dfrac{1 \times 13}{7 \times 4}$'
      - say: 'Top times top: 1 times 13 is 13. Bottom times bottom: 7 times 4 is 28.'
        write: '$= \dfrac{13}{28}$'
      - section: 'Step 3: the division'
        say: 'The brackets are done. The question has become 1 over 3 divided by 13 over 28.'
        write: 'The question becomes $\dfrac{1}{3} \div \dfrac{13}{28}$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '= [[2813]]'}, at: '[[2813]]', text: 'square bracket'}
      - say: 'To divide by a fraction, multiply by its reciprocal. Keep the first fraction, change divide to times, and turn only the second fraction upside down.'
        write: '$= \dfrac{1}{3} \times \dfrac{28}{13}$'
      - say: '1 times 28 is 28. 3 times 13 is 39.'
        write: '$= \dfrac{28}{39}$'
      - section: 'Check'
        say: 'Check by multiplying back. 28 over 39 times 13 over 28: the 28s cancel, leaving 13 over 39, which is 1 over 3. It agrees.'
        write: 'Check: $\dfrac{28}{39} \times \dfrac{13}{28} = \dfrac{13}{39} = \dfrac{1}{3}$ ✓'
      - say: 'Therefore the value is 28 over 39: option A.'
        write: '$\therefore$ the value $= \dfrac{28}{39}$ (A)'
        answer: true
    traps:
      B: 'You went for 13 over 84. That is 1 over 3 times 13 over 28: you multiplied without turning the second fraction upside down. Dividing by 13 over 28 means multiplying by 28 over 13.'
      C: 'You went for 39 over 28. That is the right answer upside down, from turning the first fraction over instead of the second. Only the second one turns: 1 over 3 times 28 over 13 is 28 over 39.'
      D: 'You went for 84 over 13. That comes from turning both fractions over. Only the second one turns, so it is 1 over 3 times 28 over 13, which is 28 over 39.'
  2:
    moments:
      - section: 'The question'
        say: 'Six decimals, three on top and three below, correct to 2 significant figures. Multiplying them all out is long and easy to slip on. A good student cancels first.'
        write: '$\dfrac{0.36 \times 5.4 \times 0.63}{4.2 \times 9.0 \times 2.4}$ (2 s.f.)'
      - section: 'Solution'
        say: 'Solution. Multiplying can be done in any order, so pair each number on top with a number below that divides it neatly.'
        write: '$= \dfrac{0.36}{2.4} \times \dfrac{5.4}{9.0} \times \dfrac{0.63}{4.2}$'
      - section: 'Cancel each pair'
        say: 'First pair: 0.36 over 2.4. Multiply top and bottom by 10 to clear the decimal below. That gives 3.6 over 24.'
        write: '$\dfrac{0.36}{2.4} = \dfrac{3.6}{24}$'
      - say: '24 times 0.15 is 3.6, so 3.6 over 24 is 0.15.'
        write: '$= 0.15$'
      - say: 'Second pair: 5.4 over 9. 9 times 6 is 54, so 9 times 0.6 is 5.4. The pair is 0.6.'
        write: '$\dfrac{5.4}{9.0} = 0.6$'
      - say: 'Third pair: 0.63 over 4.2. Multiply top and bottom by 10: 6.3 over 42. 42 times 0.15 is 6.3, so it is 0.15.'
        write: '$\dfrac{0.63}{4.2} = \dfrac{6.3}{42} = 0.15$'
      - section: 'Multiply the results'
        say: 'Therefore the whole fraction is 0.15 times 0.6 times 0.15.'
        write: '$\therefore$ value $= 0.15 \times 0.6 \times 0.15$'
        point:
          - {line: 6, kind: move, from: {line: 3, at: '= [[0.15]]'}, at: '= [[0.15]] ×', text: 'first pair'}
          - {line: 6, kind: move, from: {line: 4, at: '= [[0.6]]'}, at: '× [[0.6]] ×', text: 'second'}
      - say: '15 times 6 is 90. There are 3 decimal places, 2 in 0.15 and 1 in 0.6, so 0.15 times 0.6 is 0.090, which is 0.09.'
        write: '$0.15 \times 0.6 = 0.09$'
      - say: 'Then 9 times 15 is 135. 0.09 has 2 decimal places and 0.15 has 2, so 4 in all: 0.0135.'
        write: '$0.09 \times 0.15 = 0.0135$'
      - section: 'Correct to 2 s.f.'
        say: 'Now 2 significant figures. Start counting at the first non-zero digit; the zeros in front do not count. 1 is the first, 3 the second. Mark the cut after the 3.'
        write: 'Cut after 2 s.f.: $0.013\,|\,5$'
      - say: 'Look at the next digit after the cut. The rule: if it is 5 or more, add 1 to the last digit kept. If it is less than 5, leave it.'
        write: 'Next digit $= 5$: $5$ or more, add $1$'
        doodle: {name: 'custom:1994_q02_a', id: walk, caption: '0.0135 is halfway'}
      - say: 'So the 3 becomes 4. 0.0135 is 0.014, correct to 2 significant figures. The walker goes on to the 0.014 post.'
        write: '$0.0135 = 0.014$ (2 s.f.)'
        doodle_do:
          - {id: walk, op: move, part: walker, path: up}
        point:
          - {line: 11, kind: highlight, at: '0.014', to: {doodle: walk, part: right}}
      - section: 'Check'
        say: 'Check the size with rough numbers: 0.4 times 5 times 0.6 is 1.2 on top, and 4 times 9 times 2.4 is 86.4 below. 1.2 over 86.4 is about 0.014. It agrees.'
        write: 'Check: $\dfrac{0.4 \times 5 \times 0.6}{4 \times 9 \times 2.4} = \dfrac{1.2}{86.4} \approx 0.014$ ✓'
      - say: 'Therefore the value is 0.014, correct to 2 significant figures: option B.'
        write: '$\therefore$ value $= 0.014$ (2 s.f.) (B)'
        answer: true
        doodle_do:
          - {id: walk, op: circle, part: right}
    traps:
      A: 'You went for 0.013. You kept the 3, but the next digit is 5, and the rule is 5 or more, add 1. So 0.0135 becomes 0.014.'
      C: 'You went for 0.13. That is ten times too big: a decimal place slipped. 0.15 times 0.6 times 0.15 is 0.0135, which is 0.014 to 2 significant figures.'
      D: 'You went for 0.14. The digits are right, but a decimal place slipped, so it is ten times too big. The value is 0.0135, which is 0.014.'
  3:
    moments:
      - say: 'We need to evaluate log base 5 of 0.04, divided by log base 3 of 18 minus log base 3 of 2. We''ll work out the top and the bottom separately, then divide.'
        write: '$\dfrac{\log_{5}(0.04)}{\log_{3}18 - \log_{3}2}$'
      - say: 'Start with the top. Log base 5 of 0.04 asks: what power of 5 gives 0.04? To see it, first write 0.04 as a fraction: 4 over 100.'
        write: 'Top: $0.04 = \dfrac{4}{100}$'
      - say: 'Divide the top and bottom by 4. 4 over 100 is 1 over 25.'
        write: '$= \dfrac{1}{25}$'
      - say: 'The rule for a negative index: it means one over the positive power.'
        write: 'Negative index: $a^{-n} = \dfrac{1}{a^{n}}$'
      - say: '25 is 5 squared. And 1 over 5 squared is 5 to the power negative 2, because a negative power means one over: picture 1 over a tower of two 5s.'
        write: '$= \dfrac{1}{5^{2}} = 5^{-2}$'
        doodle: {name: 'custom:1994_q03_a', id: logs, caption: 'how many 5s? how many 3s?'}
      - say: 'So 0.04 is 5 to the power negative 2, which means the power of 5 that gives 0.04 is negative 2: two 5s, below the line.'
        write: '$\log_{5}(0.04) = \log_{5}5^{-2} = -2$'
        doodle_do:
          - {id: logs, op: label, part: top, text: '−2'}
      - say: 'The quotient law of logs: subtracting two logs with the same base gives the log of the division.'
        write: 'Quotient law: $\log_{a}M - \log_{a}N = \log_{a}\dfrac{M}{N}$'
      - say: 'Now the bottom. When we subtract two logs with the same base, they combine into the log of a division: 18 divided by 2.'
        write: 'Bottom: $\log_{3}18 - \log_{3}2 = \log_{3}\dfrac{18}{2}$'
      - say: '18 divided by 2 is 9.'
        write: '$= \log_{3}9$'
      - say: 'Log base 3 of 9 asks what power of 3 gives 9. 9 is 3 squared, a tower of two 3s, so the answer is 2.'
        write: '$= \log_{3}3^{2} = 2$'
        doodle_do:
          - {id: logs, op: label, part: bottom, text: '2'}
        point:
          - {line: 9, kind: highlight, at: '=2', to: {doodle: logs, part: bottom}}
      - say: 'Now put the top, negative 2, over the bottom, 2.'
        write: 'So the fraction $= \dfrac{-2}{2}$'
        point:
          - {line: 10, kind: move, from: {line: 5, at: '= −2'}, at: '2[[−2]]', text: 'top'}
          - {line: 10, kind: move, from: {line: 9, at: '= 2'}, at: '= [[2]]−2', text: 'bottom'}
      - say: 'Negative 2 divided by 2 is negative 1, which is answer choice B.'
        write: '$= -1$'
        answer: true
    traps:
      A: 'You went for 1. That loses the minus sign. 0.04 is smaller than 1, so its log is negative: log base 5 of 0.04 is negative 2, and negative 2 over 2 is negative 1.'
      C: 'You went for two thirds. No 3 appears when the log laws are used properly. The top is negative 2, since 0.04 is 5 to the power negative 2, and the bottom is log base 3 of 9, which is 2.'
      D: 'You went for negative two thirds. The sign is right, but the bottom is not 3. Log base 3 of 18 minus log base 3 of 2 is log base 3 of 18 over 2, which is log base 3 of 9, and that is 2.'
  4:
    moments:
      - section: 'The question'
        say: 'A negative power, and no tables allowed. Many students go for 8 here. One law of indices clears the negative power. Let''s set it out.'
        write: '$8x^{-2} = \dfrac{2}{25}$'
      - section: 'Solution'
        say: 'Solution. Recall the law: $a$ to the power minus $n$ is 1 over $a$ to the power $n$. A negative index means one over the positive power.'
        write: 'Recall: $a^{-n} = \dfrac{1}{a^{n}}$'
      - say: 'So $x$ to the power minus 2 is 1 over $x$ squared. The equation becomes 8 over $x$ squared equals 2 over 25.'
        write: '$\dfrac{8}{x^{2}} = \dfrac{2}{25}$'
      - section: 'Cross multiply'
        say: 'One fraction equals another, so we cross multiply: 2 times $x$ squared equals 8 times 25.'
        write: '$2x^{2} = 8 \times 25$'
      - say: '8 times 25 is 200.'
        write: '$2x^{2} = 200$'
      - say: 'Divide both sides by 2, the coefficient, the number in front of $x$ squared. 200 over 2 is 100. Picture $x$ squared as a square of 100 tiles.'
        write: '$x^{2} = \dfrac{200}{2} = 100$'
        doodle: {name: 'custom:1994_q04_a', id: sq, caption: 'x squared = 100 tiles', 'on': 'Picture'}
        point:
          - {line: 5, kind: highlight, at: '100', to: {doodle: sq, part: grid}}
      - say: 'Take the square root of both sides. The square root of 100 is plus or minus 10: 10 tiles along each side of the square.'
        write: '$x = \pm\sqrt{100} = \pm 10$'
        doodle_do:
          - {id: sq, op: label, part: side, text: '10 tiles along'}
      - section: 'Check'
        say: 'Check $x = 10$. 10 squared is 100, so the left side is 8 over 100. Divide top and bottom by 4: that is 2 over 25, the right side.'
        write: 'Check: $8(10)^{-2} = \dfrac{8}{100} = \dfrac{2}{25}$'
      - say: 'The options are all positive, so we take plus 10. Therefore $x$ is 10, which is answer choice D.'
        write: '$\therefore x = 10$'
        answer: true
    traps:
      A: 'You went for 4. Put it back in: 4 squared is 16, and 8 over 16 is a half, not 2 over 25. Cross multiplying gives $x$ squared equals 100, so $x$ is 10.'
      B: 'You went for 6. 6 squared is 36, and 8 over 36 is 2 over 9, not 2 over 25. From $2x^{2} = 200$, $x$ squared is 100, so $x$ is 10.'
      C: 'You went for 8, the number in front. 8 squared is 64, and 8 over 64 is 1 over 8, not 2 over 25. $x$ to the power minus 2 means 1 over $x$ squared; then $x$ squared is 100 and $x$ is 10.'
  5:
    moments:
      - say: 'We need to simplify root 48, minus 9 over root 3, plus root 75. The plan is to write every term as a number times root 3, so they can be combined.'
        write: '$\sqrt{48} - \dfrac{9}{\sqrt{3}} + \sqrt{75}$'
      - say: 'Root 48 first. Look for the biggest perfect square that goes into 48. That is 16, because 16 times 3 is 48.'
        write: 'First term: $\sqrt{48} = \sqrt{16 \times 3}$'
      - say: 'The rule for splitting a root: the square root of a product is the product of the square roots.'
        write: 'Surd rule: $\sqrt{ab} = \sqrt{a} \times \sqrt{b}$'
      - say: 'The square root of 16 is 4, so root 48 is 4 root 3.'
        write: '$= \sqrt{16} \times \sqrt{3} = 4\sqrt{3}$'
      - say: 'Now the last term, root 75. The biggest perfect square inside 75 is 25, since 25 times 3 is 75.'
        write: 'Last term: $\sqrt{75} = \sqrt{25 \times 3}$'
      - say: 'The square root of 25 is 5, so root 75 is 5 root 3.'
        write: '$= \sqrt{25} \times \sqrt{3} = 5\sqrt{3}$'
      - say: 'Now the middle term, 9 over root 3. It has a root on the bottom, so we rationalise: multiply the top and the bottom by root 3. That doesn''t change its value.'
        write: 'Middle term: $\dfrac{9}{\sqrt{3}} = \dfrac{9 \times \sqrt{3}}{\sqrt{3} \times \sqrt{3}}$'
      - say: 'Root 3 times root 3 is 3, so the bottom becomes 3, and the top is 9 root 3.'
        write: '$= \dfrac{9\sqrt{3}}{3}$'
      - say: '9 divided by 3 is 3, so the middle term is 3 root 3.'
        write: '$= 3\sqrt{3}$'
      - say: 'Now put the three results back into the question: 4 root 3 from the first term, minus 3 root 3, plus 5 root 3. Picture each root 3 as one block.'
        write: 'So the expression $= 4\sqrt{3} - 3\sqrt{3} + 5\sqrt{3}$'
        doodle: {name: 'custom:1994_q05_a', id: blocks, caption: 'each block is root 3'}
        point:
          - {line: 9, kind: move, from: {line: 3, at: '= [[43]]'}, at: '43', text: 'first'}
          - {line: 9, kind: move, from: {line: 8, at: '33'}, at: '− 33', text: 'middle'}
          - {line: 9, kind: move, from: {line: 5, at: '= [[53]]'}, at: '+ 53', text: 'last'}
      - say: 'They are all root 3s, like 4 blocks minus 3 blocks plus 5 blocks. So we just combine the numbers in front.'
        write: '$= (4 - 3 + 5)\sqrt{3}$'
        doodle_do:
          - {id: blocks, op: pulse}
      - say: '4 minus 3 is 1, and 1 plus 5 is 6: six blocks are left. So the answer is 6 root 3, which is answer choice B.'
        write: '$= 6\sqrt{3}$'
        doodle_do:
          - {id: blocks, op: stage, stage: 'custom:1994_q05_a2'}
        answer: true
        point:
          - {line: 11, kind: highlight, at: '6', to: {doodle: blocks, part: left}}
    traps:
      A: 'You went for 5 root 3. Check the numbers in front again: root 48 is 4 root 3, 9 over root 3 is 3 root 3, and root 75 is 5 root 3. 4 minus 3 plus 5 is 6.'
      C: 'You went for 8 root 3. That is what you get if the middle term is taken as just root 3. But 9 over root 3 is 9 root 3 over 3, which is 3 root 3, so the total is 6 root 3.'
      D: 'You went for 18 root 3. That adds 4, 9 and 5 — the middle term was used as 9 without rationalising, and added instead of subtracted. 9 over root 3 is only 3 root 3, and 4 minus 3 plus 5 is 6.'
  6:
    moments:
      - say: 'We''re told root 2 is 1.414, and we must find 1 over root 2 without using tables.'
        write: 'Given: $\sqrt{2} = 1.414$'
      - say: 'Dividing 1 by 1.414 by hand is hard work. So first we rationalise: multiply the top and the bottom by root 2. That doesn''t change the value, because root 2 over root 2 is just 1.'
        write: '$\dfrac{1}{\sqrt{2}} = \dfrac{1 \times \sqrt{2}}{\sqrt{2} \times \sqrt{2}}$'
      - say: 'On top, 1 times root 2 is root 2. On the bottom, root 2 times root 2 is 2.'
        write: '$= \dfrac{\sqrt{2}}{2}$'
      - say: 'Now the value we were given slots straight in: replace root 2 with 1.414. Picture a stick 1.414 long.'
        write: '$= \dfrac{1.414}{2}$'
        doodle: {name: 'custom:1994_q06_a', id: stick, caption: 'root 2 is a stick 1.414 long'}
        point:
          - {line: 3, kind: move, from: {line: 0, at: '1.414'}, at: '1.414', text: 'given'}
      - say: 'Now halve 1.414: cut the stick in two. Half of 1.4 is 0.7, and half of 0.014 is 0.007. Together that is 0.707.'
        write: '$= 0.7 + 0.007 = 0.707$'
        doodle_do:
          - {id: stick, op: stage, stage: 'custom:1994_q06_a2'}
        point:
          - {line: 4, kind: highlight, at: '0.707', to: {doodle: stick, part: half}}
      - say: 'Does that make sense? Root 2, the whole stick, is a bit more than 1, so 1 over root 2 must be a bit less than 1. And 0.707 is less than 1.'
        write: 'Size check: $0.707 < 1$'
        doodle_do:
          - {id: stick, op: pulse, part: whole}
      - say: 'We can also multiply back: 0.707 times 1.414 should come to about 1. It is 0.999698, very close to 1.'
        write: 'Check: $0.707 \times 1.414 = 0.999698 \approx 1$'
      - say: 'Notice what rationalising did for us. It turned a hard division by 1.414 into an easy division by 2. That is exactly why we rationalise.'
      - say: 'So 1 over root 2 is 0.707, which is answer choice D.'
        write: '$\dfrac{1}{\sqrt{2}} = 0.707$'
        answer: true
    traps:
      A: 'You went for 0.141. That is 1.414 divided by 10, a decimal point slip. Rationalising gives 1.414 divided by 2, which is 0.707.'
      B: 'You went for 0.301. That is the log of 2 from the tables, not 1 over root 2. Rationalise to root 2 over 2, then halve 1.414.'
      C: 'You went for 0.667. That is two thirds, a guess near the answer. Rationalise to root 2 over 2 and halve 1.414 to get 0.707.'
  7:
    moments:
      - section: 'The question'
        say: 'Here is a class of 42 students. Each one offers Maths, or Physics, or both. 28 offer Maths and 22 offer Physics. But 28 plus 22 is 50, and the class has only 42 students. Where did the extra 8 come from? Find that, and Physics only is easy.'
        write: 'Physics only $= ?$'
        doodle: {name: student-small, id: cls, repeat: 42, layout: grid, caption: 'the class of 42'}
      - section: 'What we know'
        say: 'Let''s write what we know. The whole class is 42 students. The whole class is the universal set, written epsilon. n of epsilon means the number in it.'
        write: 'Class: $n(\varepsilon) = 42$'
        point:
          - {line: 1, kind: travel, at: '42', from: {doodle: cls}, text: 'the class', 'on': 'whole class'}
      - say: '28 students offer Mathematics. We call that set M, so n of M is 28.'
        write: 'Maths: $n(M) = 28$'
      - say: '22 students offer Physics. We call that set P, so n of P is 22.'
        write: 'Physics: $n(P) = 22$'
      - say: 'Now let me draw the class. The box is the whole class of 42. One circle holds the Maths students, and the other circle holds the Physics students.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'class of 42', text: 'everyone', 'on': 'box'}
          - {figure: sketch, kind: underline, target: 'Maths 28', 'on': 'Maths students'}
          - {figure: sketch, kind: underline, target: 'Physics 22', 'on': 'Physics students'}
      - say: 'The two circles overlap. The overlap holds the students who offer both subjects. We write it n of M intersection P. Intersection simply means in both.'
        write: 'Both: $n(M \cap P) = ?$'
        point:
          - {figure: sketch, kind: highlight, target: 'both', text: 'in both circles', 'on': 'overlap', on_nth: 2}
      - section: 'Why 50 is too many'
        say: 'Now watch what happens if we just add the two circles. Bring down the 28 from the Maths circle, and the 22 from the Physics circle. 28 plus 22 is 50.'
        write: '$28 + 22 = 50$'
        point:
          - {line: 6, kind: travel, at: '28', from: {figure: sketch, target: 'Maths 28'}, text: 'Maths', 'on': 'Maths circle'}
          - {line: 6, kind: travel, at: '22', from: {figure: sketch, target: 'Physics 22'}, text: 'Physics', 'on': 'Physics circle'}
      - say: 'But the class has only 42 students. So why did we get 50? Look at the overlap. A student who offers both is inside the Maths circle, and inside the Physics circle too. So we counted that student twice.'
        write: 'Counted twice: the students in both'
        point:
          - {figure: sketch, kind: label, target: 'both', text: 'counted twice', 'on': 'counted that student twice'}
      - say: 'Each student in both was counted one extra time. So the extra, 50 minus 42, is exactly the number in both. 50 minus 42 is 8.'
        write: '$n(M \cap P) = 50 - 42 = 8$'
        point:
          - {line: 8, kind: travel, at: '50', from: {line: 6, at: '= [[50]]'}, 'on': '50 minus 42'}
          - {line: 8, kind: travel, at: '42', from: {line: 1, at: '42'}, text: 'the class', 'on': '50 minus 42'}
          - {figure: sketch, kind: label, target: 'both', text: '8', 'on': 'is 8'}
      - say: 'Let''s pause on that. 8 students offer both subjects. Let me gather those 8 together in the class.'
        doodle_do:
          - {id: cls, op: group, n: 8, text: '8 offer both', 'on': 'gather'}
      - section: 'The rule'
        say: 'What we just did has a name: the rule for two sets. In words: the number in either circle is Maths, plus Physics, minus both. M union P means in either circle.'
        write: 'Rule: $n(M \cup P) = n(M) + n(P) - n(M \cap P)$'
        'on': 'rule for two sets'
      - say: 'Here every student offers at least one subject, so the union is the whole class, 42. Put in our numbers: 28 plus 22 is 50, and 50 minus 8 is 42. The rule agrees with us.'
        write: '$42 = 28 + 22 - 8$'
        point:
          - {line: 11, kind: travel, at: '− 8', from: {line: 8, at: '= [[8]]'}, text: 'both', 'on': '50 minus 8'}
      - section: 'Physics only'
        say: 'Now the question itself. Physics only means students who offer Physics but not Maths. Start with all 22 in the Physics circle, then take away the 8 in the overlap, because they offer Maths as well.'
        write: 'Physics only $= n(P) - n(M \cap P)$'
        point:
          - {figure: sketch, kind: circle, target: 'Physics only', text: 'Physics, not Maths', 'on': 'Physics but not Maths'}
      - say: 'So Physics only is 22 minus 8.'
        write: '$= 22 - 8$'
        point:
