# UTME 1994 Mathematics — lessons for the board.
#
# (short header; see lessons_2002.yaml for the full format notes)
#
# Keyed on question number, like explanations_1994.yaml. Answers match that file.
# Forty-nine questions: the paper ends at Q49 in this compilation.
format_version: 1
exam_year: 1994
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'One over three, divided by a square bracket, with a round bracket inside it. Where do we start? Most students rush the division and get it upside down.'
        write: '$\dfrac{1}{3} \div \left[\dfrac{5}{7}\left(\dfrac{9}{10} - 1 + \dfrac{3}{4}\right)\right]$'
      - section: 'Solution'
        say: 'We use BODMAS, which is Brackets, Of, Division, Multiplication, Addition, Subtraction. It is the order of working. Brackets come first, starting with the inner one, the round bracket.'
        write: 'By BODMAS: brackets first, the inner one first'
      - section: 'Step 1: the round bracket'
        say: 'Inside the round bracket we have 9 over 10, minus 1, plus 3 over 4. To add and subtract fractions, we need a common denominator.'
        write: 'Round bracket: $\dfrac{9}{10} - 1 + \dfrac{3}{4}$'
      - say: 'The L.C.M., the lowest common multiple, of 10 and 4 is 20, the smallest number both go into. Picture one bar cut into 20 equal pieces.'
        write: 'L.C.M. of $10$ and $4 = 20$'
        doodle: {name: 'custom:1994_q01_a', id: bar, caption: 'one whole bar, 20 pieces'}
      - say: '20 divided by 10 is 2, and 2 times 9 is 18. The 1 is 20 over 20. 20 divided by 4 is 5, and 5 times 3 is 15.'
        write: '$= \dfrac{18 - 20 + 15}{20}$'
      - say: '18 minus 20 is negative 2, and negative 2 plus 15 is 13. So the round bracket is 13 over 20, which is 13 of the 20 pieces.'
        write: '$= \dfrac{13}{20}$'
        doodle_do:
          - {id: bar, op: stage, stage: 'custom:1994_q01_a2'}
        point:
          - {line: 5, kind: highlight, at: '13', to: {doodle: bar, part: thirteen}}
      - section: 'Step 2: the square bracket'
        say: 'Now the square bracket, which is 5 over 7 times the 13 over 20 we just found.'
        write: 'Square bracket: $\dfrac{5}{7} \times \dfrac{13}{20}$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '= [[2013]]'}, at: '[[2013]]', text: 'round bracket'}
        doodle_do:
          - {id: bar, op: circle, part: thirteen}
      - say: 'Cancel first. 5 goes into 5 once, and 5 goes into 20 four times.'
        write: '$= \dfrac{1 \times 13}{7 \times 4}$'
      - say: 'Top times top, 1 times 13 is 13. Bottom times bottom, 7 times 4 is 28.'
        write: '$= \dfrac{13}{28}$'
      - section: 'Step 3: the division'
        say: 'The brackets are done. The question has become 1 over 3 divided by 13 over 28.'
        write: 'The question becomes $\dfrac{1}{3} \div \dfrac{13}{28}$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '= [[2813]]'}, at: '[[2813]]', text: 'square bracket'}
      - say: 'To divide by a fraction, multiply by its reciprocal. Keep the first fraction, change divide to times, and turn only the second fraction upside down.'
        write: '$= \dfrac{1}{3} \times \dfrac{28}{13}$'
      - say: '1 times 28 is 28. 3 times 13 is 39.'
        write: '$= \dfrac{28}{39}$'
      - section: 'Check'
        say: 'Check by multiplying back. 28 over 39 times 13 over 28 makes the 28s cancel, leaving 13 over 39, which is 1 over 3. It agrees.'
        write: 'Check: $\dfrac{28}{39} \times \dfrac{13}{28} = \dfrac{13}{39} = \dfrac{1}{3}$ ✓'
      - say: 'Therefore the value is 28 over 39, which is option A.'
        write: '$\therefore$ the value $= \dfrac{28}{39}$ (A)'
        answer: true
    traps:
      B: 'You went for 13 over 84. That is 1 over 3 times 13 over 28. You multiplied without turning the second fraction upside down. Dividing by 13 over 28 means multiplying by 28 over 13.'
      C: 'You went for 39 over 28. That is the right answer upside down, from turning the first fraction over instead of the second. Only the second one turns, so 1 over 3 times 28 over 13 is 28 over 39.'
      D: 'You went for 84 over 13. That comes from turning both fractions over. Only the second one turns, so it is 1 over 3 times 28 over 13, which is 28 over 39.'
  2:
    moments:
      - section: 'The question'
        say: 'There are six decimals, three on top and three below, and we want 2 significant figures. Multiplying them all out is long and easy to slip on. A good student cancels first.'
        write: '$\dfrac{0.36 \times 5.4 \times 0.63}{4.2 \times 9.0 \times 2.4}$ (2 s.f.)'
      - section: 'Solution'
        say: 'Solution. Multiplying can be done in any order, so pair each number on top with a number below that divides it neatly.'
        write: '$= \dfrac{0.36}{2.4} \times \dfrac{5.4}{9.0} \times \dfrac{0.63}{4.2}$'
      - section: 'Cancel each pair'
        say: 'Start with the first pair, 0.36 over 2.4. Multiply top and bottom by 10 to clear the decimal below. That gives 3.6 over 24.'
        write: '$\dfrac{0.36}{2.4} = \dfrac{3.6}{24}$'
      - say: '24 times 0.15 is 3.6, so 3.6 over 24 is 0.15.'
        write: '$= 0.15$'
      - say: 'The second pair is 5.4 over 9. 9 times 6 is 54, so 9 times 0.6 is 5.4. The pair is 0.6.'
        write: '$\dfrac{5.4}{9.0} = 0.6$'
      - say: 'The third pair is 0.63 over 4.2. Multiply top and bottom by 10 to get 6.3 over 42. 42 times 0.15 is 6.3, so it is 0.15.'
        write: '$\dfrac{0.63}{4.2} = \dfrac{6.3}{42} = 0.15$'
      - section: 'Multiply the results'
        say: 'Therefore the whole fraction is 0.15 times 0.6 times 0.15.'
        write: '$\therefore$ value $= 0.15 \times 0.6 \times 0.15$'
        point:
          - {line: 6, kind: move, from: {line: 3, at: '= [[0.15]]'}, at: '= [[0.15]] ×', text: 'first pair'}
          - {line: 6, kind: move, from: {line: 4, at: '= [[0.6]]'}, at: '× [[0.6]] ×', text: 'second'}
      - say: '15 times 6 is 90. There are 3 decimal places, 2 in 0.15 and 1 in 0.6, so 0.15 times 0.6 is 0.090, which is 0.09.'
        write: '$0.15 \times 0.6 = 0.09$'
      - say: 'Then 9 times 15 is 135. 0.09 has 2 decimal places and 0.15 has 2, so 4 in all, giving 0.0135.'
        write: '$0.09 \times 0.15 = 0.0135$'
      - section: 'Correct to 2 s.f.'
        say: 'Now 2 significant figures. Start counting at the first non-zero digit, because the zeros in front do not count. 1 is the first, 3 the second. Mark the cut after the 3.'
        write: 'Cut after 2 s.f.: $0.013\,|\,5$'
      - say: 'Look at the next digit after the cut. The rule is this. If it is 5 or more, add 1 to the last digit kept. If it is less than 5, leave it.'
        write: 'Next digit $= 5$: $5$ or more, add $1$'
        doodle: {name: 'custom:1994_q02_a', id: walk, caption: '0.0135 is halfway'}
      - say: 'So the 3 becomes 4. 0.0135 is 0.014, correct to 2 significant figures. The walker goes on to the 0.014 post.'
        write: '$0.0135 = 0.014$ (2 s.f.)'
        doodle_do:
          - {id: walk, op: move, part: walker, path: up}
        point:
          - {line: 11, kind: highlight, at: '0.014', to: {doodle: walk, part: right}}
      - section: 'Check'
        say: 'Check the size with rough numbers. 0.4 times 5 times 0.6 is 1.2 on top, and 4 times 9 times 2.4 is 86.4 below. 1.2 over 86.4 is about 0.014. It agrees.'
        write: 'Check: $\dfrac{0.4 \times 5 \times 0.6}{4 \times 9 \times 2.4} = \dfrac{1.2}{86.4} \approx 0.014$ ✓'
      - say: 'Therefore the value is 0.014, correct to 2 significant figures, which is option B.'
        write: '$\therefore$ value $= 0.014$ (2 s.f.) (B)'
        answer: true
        doodle_do:
          - {id: walk, op: circle, part: right}
    traps:
      A: 'You went for 0.013. You kept the 3, but the next digit is 5, and the rule is 5 or more, add 1. So 0.0135 becomes 0.014.'
      C: 'You went for 0.13. That is ten times too big, because a decimal place slipped. 0.15 times 0.6 times 0.15 is 0.0135, which is 0.014 to 2 significant figures.'
      D: 'You went for 0.14. The digits are right, but a decimal place slipped, so it is ten times too big. The value is 0.0135, which is 0.014.'
  3:
    moments:
      - section: 'The question'
        say: 'There are two different bases, 5 on top and 3 below. Work out the numerator and the denominator separately, then divide. Watch the sign, because 0.04 is less than 1.'
        write: 'Evaluate $\dfrac{\log_{5}(0.04)}{\log_{3}18 - \log_{3}2}$'
      - say: 'Solution. The numerator first, then the denominator.'
        write: 'Solution'
      - section: 'The numerator'
        say: 'Let log base 5 of 0.04 be $x$. In index form, 5 to the power $x$ equals 0.04.'
        write: 'Let $\log_{5}0.04 = x \Rightarrow 5^{x} = 0.04$'
      - say: 'Write 0.04 as a fraction, which is 4 over 100.'
        write: '$5^{x} = \dfrac{4}{100}$'
      - say: 'Divide the top and bottom by 4. 4 over 100 is 1 over 25.'
        write: '$5^{x} = \dfrac{1}{25}$'
      - say: '25 is 5 squared. By the negative index law, 1 over 5 squared is 5 to the power minus 2. Picture 1 over two 5s.'
        doodle: {name: 'custom:1994_q03_a', id: logs, caption: 'how many 5s? how many 3s?'}
        write: '$5^{x} = \dfrac{1}{5^{2}} = 5^{-2}$ $\quad [a^{-n} = \tfrac{1}{a^{n}}]$'
      - say: 'The bases are the same, so equate the indices. $x$ is minus 2.'
        doodle_do:
          - {id: logs, op: label, part: top, text: '−2'}
        write: '$\therefore x = -2$'
      - section: 'The denominator'
        say: 'Recall the quotient law of logarithms, which says that subtracting two logs to the same base gives the log of the division.'
        write: 'Recall: $\log_{a}M - \log_{a}N = \log_{a}\dfrac{M}{N}$'
      - say: 'By the quotient law, log base 3 of 18 minus log base 3 of 2 is log base 3 of 18 over 2.'
        write: '$\log_{3}18 - \log_{3}2 = \log_{3}\dfrac{18}{2}$'
      - say: '18 divided by 2 is 9.'
        write: '$= \log_{3}9$'
      - say: 'Let log base 3 of 9 be $y$. In index form, 3 to the power $y$ equals 9.'
        write: 'Let $\log_{3}9 = y \Rightarrow 3^{y} = 9$'
      - say: '9 is 3 squared. Equate the indices, so $y$ is 2.'
        doodle_do:
          - {id: logs, op: label, part: bottom, text: '2'}
        write: '$3^{y} = 3^{2} \quad \therefore y = 2$'
      - section: 'Divide'
        say: 'Now put the numerator, minus 2, over the denominator, 2.'
        write: '$\dfrac{\log_{5}(0.04)}{\log_{3}18 - \log_{3}2} = \dfrac{-2}{2}$'
      - say: 'Minus 2 divided by 2 is minus 1.'
        write: '$= -1$'
      - section: 'Check'
        say: 'Check the numerator in index form. 5 to the power minus 2 is 1 over 25, and 1 over 25 is 0.04.'
        write: 'Check: $5^{-2} = \tfrac{1}{25} = 0.04\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the value is minus 1, which is option B.'
        write: '$\therefore$ the value $= -1$'
        answer: true
    traps:
      A: 'You went for 1. That loses the minus sign. 0.04 is less than 1, so its log is negative. Log base 5 of 0.04 is minus 2, and minus 2 over 2 is minus 1.'
      C: 'You went for 2 over 3. No 3 appears when the laws are used properly. The numerator is minus 2, since 0.04 is 5 to the power minus 2, and the denominator is log base 3 of 9, which is 2.'
      D: 'You went for minus 2 over 3. The sign is right, but the denominator is not 3. By the quotient law it is log base 3 of 9, and that is 2.'
  4:
    moments:
      - section: 'The question'
        say: 'There is a negative power, and no tables are allowed. Many students go for 8 here. One law of indices clears the negative power. Let''s set it out.'
        write: '$8x^{-2} = \dfrac{2}{25}$'
      - section: 'Solution'
        say: 'Solution. Recall the law that $a$ to the power minus $n$ is 1 over $a$ to the power $n$. A negative index means one over the positive power.'
        write: 'Recall: $a^{-n} = \dfrac{1}{a^{n}}$'
      - say: 'So $x$ to the power minus 2 is 1 over $x$ squared. The equation becomes 8 over $x$ squared equals 2 over 25.'
        write: '$\dfrac{8}{x^{2}} = \dfrac{2}{25}$'
      - section: 'Cross multiply'
        say: 'One fraction equals another, so we cross multiply, and 2 times $x$ squared equals 8 times 25.'
        write: '$2x^{2} = 8 \times 25$'
      - say: '8 times 25 is 200.'
        write: '$2x^{2} = 200$'
      - say: 'Divide both sides by 2, the coefficient, the number in front of $x$ squared. 200 over 2 is 100. Picture $x$ squared as a square of 100 tiles.'
        write: '$x^{2} = \dfrac{200}{2} = 100$'
        doodle: {name: 'custom:1994_q04_a', id: sq, caption: 'x squared = 100 tiles', 'on': 'Picture'}
        point:
          - {line: 5, kind: highlight, at: '100', to: {doodle: sq, part: grid}}
      - say: 'Take the square root of both sides. The square root of 100 is plus or minus 10, so 10 tiles along each side of the square.'
        write: '$x = \pm\sqrt{100} = \pm 10$'
        doodle_do:
          - {id: sq, op: label, part: side, text: '10 tiles along'}
      - section: 'Check'
        say: 'Check $x = 10$. 10 squared is 100, so the left side is 8 over 100. Divide top and bottom by 4, and that is 2 over 25, the right side.'
        write: 'Check: $8(10)^{-2} = \dfrac{8}{100} = \dfrac{2}{25}$'
      - say: 'The options are all positive, so we take plus 10. Therefore $x$ is 10, which is answer choice D.'
        write: '$\therefore x = 10$'
        answer: true
    traps:
      A: 'You went for 4. Put it back in. 4 squared is 16, and 8 over 16 is a half, not 2 over 25. Cross multiplying gives $x$ squared equals 100, so $x$ is 10.'
      B: 'You went for 6. 6 squared is 36, and 8 over 36 is 2 over 9, not 2 over 25. From $2x^{2} = 200$, $x$ squared is 100, so $x$ is 10.'
      C: 'You went for 8, the number in front. 8 squared is 64, and 8 over 64 is 1 over 8, not 2 over 25. $x$ to the power minus 2 means 1 over $x$ squared. Then $x$ squared is 100 and $x$ is 10.'
  5:
    moments:
      - section: 'The question'
        say: 'There are three different-looking terms, and one of them has a root in its denominator. Every one of them turns into a number times root 3.'
        write: 'Simplify $\sqrt{48} - \dfrac{9}{\sqrt{3}} + \sqrt{75}$'
      - say: 'Solution. Put root 48 and root 75 in basic form, rationalise the middle term, then collect like surds.'
        write: 'Solution'
      - section: 'Basic form'
        say: 'The law of surds says the square root of a product is the product of the square roots.'
        write: '$\sqrt{ab} = \sqrt{a} \times \sqrt{b}$'
      - say: 'The largest perfect square in 48 is 16, because 16 times 3 is 48. Root 16 is 4, so root 48 is 4 root 3.'
        write: '$\sqrt{48} = \sqrt{16 \times 3} = 4\sqrt{3}$'
      - say: 'The largest perfect square in 75 is 25, since 25 times 3 is 75. Root 25 is 5, so root 75 is 5 root 3.'
        write: '$\sqrt{75} = \sqrt{25 \times 3} = 5\sqrt{3}$'
      - section: 'Rationalise'
        say: 'The middle term has root 3 in its denominator. Multiply the numerator and denominator by root 3. Root 3 times root 3 is 3.'
        write: '$\dfrac{9}{\sqrt{3}} = \dfrac{9}{\sqrt{3}} \times \dfrac{\sqrt{3}}{\sqrt{3}} = \dfrac{9\sqrt{3}}{3}$'
      - say: '9 divided by 3 is 3, so the middle term is 3 root 3.'
        write: '$= 3\sqrt{3}$'
      - section: 'Collect like surds'
        say: 'Put the three results into the expression, and we get 4 root 3, minus 3 root 3, plus 5 root 3. Picture each root 3 as one block.'
        doodle: {name: 'custom:1994_q05_a', id: blocks, caption: 'each block is root 3'}
        write: '$\therefore$ Expression $= 4\sqrt{3} - 3\sqrt{3} + 5\sqrt{3}$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '= 33'}, at: '− 33', text: 'middle'}
      - say: 'They are like surds, so combine the numbers in front and keep the root 3.'
        doodle_do:
          - {id: blocks, op: pulse}
        write: '$= (4 - 3 + 5)\sqrt{3}$'
      - say: '4 minus 3 is 1, and 1 plus 5 is 6, so six blocks are left.'
        doodle_do:
          - {id: blocks, op: stage, stage: 'custom:1994_q05_a2'}
        write: '$= 6\sqrt{3}$'
        point:
          - {line: 9, kind: highlight, at: '6', to: {doodle: blocks, part: left}}
      - section: 'Check'
        say: 'Check with decimals. Root 48 is about 6.928, 9 over root 3 is about 5.196, and root 75 is about 8.660. 6.928 minus 5.196 plus 8.660 is 10.392, and 6 times 1.732 is 10.392.'
        write: 'Check: $6.928 - 5.196 + 8.660 = 10.392 = 6 \times 1.732\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the expression simplifies to 6 root 3, which is option B.'
        write: '$\therefore$ the answer is $6\sqrt{3}$'
        answer: true
    traps:
      A: 'You went for 5 root 3. Check the numbers in front again. Root 48 is 4 root 3, 9 over root 3 is 3 root 3, and root 75 is 5 root 3. 4 minus 3 plus 5 is 6.'
      C: 'You went for 8 root 3. That is what you get if the middle term is taken as just root 3. But 9 over root 3 is 9 root 3 over 3, which is 3 root 3, so the total is 6 root 3.'
      D: 'You went for 18 root 3. That adds 4, 9 and 5. The middle term was used as 9 without rationalising, and added instead of subtracted. 9 over root 3 is only 3 root 3, and 4 minus 3 plus 5 is 6.'
  6:
    moments:
      - section: 'The question'
        say: 'There are no tables, and dividing 1 by 1.414 by hand is slow. One step turns it into an easy division. That step is called rationalising.'
        write: 'Given $\sqrt{2} = 1.414$, find $\dfrac{1}{\sqrt{2}}$ without tables'
      - say: 'Solution. Rationalise first, then put in the value of root 2.'
        write: 'Solution'
      - section: 'Rationalise'
        say: 'Multiply the numerator and the denominator by root 2. Root 2 over root 2 is 1, so the value does not change.'
        write: '$\dfrac{1}{\sqrt{2}} = \dfrac{1}{\sqrt{2}} \times \dfrac{\sqrt{2}}{\sqrt{2}}$'
      - say: 'In the numerator, 1 times root 2 is root 2. In the denominator, root 2 times root 2 is 2.'
        write: '$= \dfrac{\sqrt{2}}{2}$ $\quad [\sqrt{a} \times \sqrt{a} = a]$'
      - say: 'Notice what rationalising did for us. It turned a hard division by 1.414 into an easy division by 2. That is exactly why we rationalise.'
        write: 'Why: $1 \div 1.414$ is hard; $1.414 \div 2$ is easy'
      - section: 'Substitute'
        say: 'Now put in the value we were given, and replace root 2 with 1.414. Picture a stick 1.414 long.'
        doodle: {name: 'custom:1994_q06_a', id: stick, caption: 'root 2 is a stick 1.414 long'}
        write: '$= \dfrac{1.414}{2}$'
        point:
          - {line: 5, kind: move, from: {line: 0, at: '1.414'}, at: '1.414', text: 'given'}
      - say: 'Halve 1.414 by cutting the stick in two. 1.414 divided by 2 is 0.707.'
        doodle_do:
          - {id: stick, op: stage, stage: 'custom:1994_q06_a2'}
        write: '$= 0.707$'
        point:
          - {line: 6, kind: highlight, at: '0.707', to: {doodle: stick, part: half}}
      - section: 'Check'
        say: 'Check by multiplying back, because 0.707 times 1.414 should be about 1. It is 0.999698, very close to 1. And 1 over a number a bit more than 1 must be a bit less than 1.'
        doodle_do:
          - {id: stick, op: pulse, part: whole}
        write: 'Check: $0.707 \times 1.414 = 0.999698 \approx 1\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore 1 over root 2 is 0.707, which is option D.'
        write: '$\therefore \dfrac{1}{\sqrt{2}} = 0.707$'
        answer: true
    traps:
      A: 'You went for 0.141. That is 1.414 divided by 10, a decimal point slip. Rationalising gives 1.414 divided by 2, which is 0.707.'
      B: 'You went for 0.301. That is the log of 2 from the tables, not 1 over root 2. Rationalise to root 2 over 2, then halve 1.414.'
      C: 'You went for 0.667. That is 2 over 3, a guess near the answer. Rationalise to root 2 over 2 and halve 1.414 to get 0.707.'
  7:
    moments:
      - section: 'The question'
        say: 'We have a class of 42 students, and each one offers Maths, or Physics, or both. 28 offer Maths and 22 offer Physics. But 28 plus 22 is 50, more than 42. Find those in both first, then Physics only is easy.'
        write: 'Class 42: Maths 28, Physics 22. Physics only $= ?$'
      - section: 'Solution'
        say: 'Solution. First, the givens. The class is the universal set, epsilon, so n of epsilon is 42. n of M, the Maths set, is 28, and n of P, the Physics set, is 22.'
        write: '$n(\varepsilon) = 42,\ n(M) = 28,\ n(P) = 22$'
      - say: 'Each student offers at least one subject, so nobody is outside both circles. n of, M union P, complement, is 0.'
        write: '$n(M \cup P)^{\prime} = 0$'
      - say: 'We do not know how many offer both. Let n of M intersection P be x. Intersection means in both sets.'
        write: 'Let $n(M \cap P) = x$'
      - section: 'The Venn diagram'
        say: 'Now the Venn diagram. The box is epsilon, the class of 42, with a circle for Maths and a circle for Physics. Put x where they overlap.'
        diagram: {id: v, kind: venn, universal: {name: 'Class', total: 42}, sets: [{key: M, name: Maths, total: 28}, {key: P, name: Physics, total: 22}]}
        diagram_do:
          - {id: v, op: fill, part: 'M∩P', text: 'x', colour: orange, 'on': overlap}
        point:
          - {line: 3, kind: highlight, at: 'x', to: {diagram: v, part: 'M∩P'}}
      - say: 'Maths only is 28 minus x. Physics only is 22 minus x. And outside the circles there is nobody, so that is 0.'
        write: 'Maths only $= 28 - x$, Physics only $= 22 - x$'
        diagram_do:
          - {id: v, op: fill, part: 'M only', text: '28 − x', 'on': 'Maths only'}
          - {id: v, op: fill, part: 'P only', text: '22 − x', 'on': 'Physics only'}
          - {id: v, op: fill, part: outside, text: '0', 'on': nobody}
      - section: 'The equation'
        say: 'Every student is in exactly one region. So the regions add up to the whole class, 42.'
        write: '$(28 - x) + x + (22 - x) = 42$'
      - say: 'Collect like terms. 28 plus 22 is 50. Minus x, plus x, minus x leaves minus x.'
        write: '$50 - x = 42$'
      - say: 'So x equals 50 minus 42, which is 8. Eight students offer both subjects.'
        write: '$x = 50 - 42 = 8$'
        diagram_do:
          - {id: v, op: fill, part: 'M∩P', text: '8', 'on': 'which is 8'}
      - section: 'Physics only'
        say: 'Now the question itself. Physics only is the region 22 minus x, which is the Physics students who do not offer Maths.'
        write: 'Physics only $= 22 - x$'
        diagram_do:
          - {id: v, op: highlight, part: 'P only', text: 'Physics, not Maths', 'on': 'region'}
      - say: 'Put x equals 8. 22 minus 8 is 14.'
        write: '$= 22 - 8 = 14$'
        diagram_do:
          - {id: v, op: fill, part: 'P only', text: '14', 'on': 'is 14'}
        point:
          - {line: 10, kind: move, from: {line: 8, at: '= [[8]]'}, at: '− 8', text: 'x'}
      - section: 'Check'
        say: 'Check. Maths only is 28 minus 8, which is 20. And 20 plus 8 plus 14 is 42, the whole class.'
        write: 'Maths only $= 28 - 8 = 20$; $\ 20 + 8 + 14 = 42\ \checkmark$'
        diagram_do:
          - {id: v, op: fill, part: 'M only', text: '20', 'on': 'is 20'}
      - section: 'Or by the formula'
        say: 'Or use the formula, n of M union P equals n of M, plus n of P, minus n of M intersection P.'
        write: '$n(M \cup P) = n(M) + n(P) - n(M \cap P)$'
      - say: 'Everyone offers at least one, so n of M union P is 42. 42 equals 28 plus 22 minus x, so x is 50 minus 42, which is 8 again.'
        write: '$42 = 28 + 22 - x \Rightarrow x = 8$'
      - say: 'Why minus x? A student in both is counted once in the 28 and again in the 22, so counted twice. Subtracting x counts them once.'
        write: 'The 8 in both are counted twice in $28 + 22$'
      - section: 'Answer'
        say: 'Therefore 14 students offer Physics only, which is answer choice D.'
        write: '$\therefore$ Physics only $= 14$'
        diagram_do:
          - {id: v, op: highlight, part: 'P only', text: 'Physics only: 14', answer: true}
        answer: true
    traps:
      A: 'You went for 6. That is 28 minus 22, which is no region of the Venn diagram. Find x first. 50 minus x equals 42, so x is 8. Then Physics only is 22 minus 8, which is 14.'
      B: 'You went for 8. That is x, the students who offer both. The word "only" asks for the region 22 minus x, which is 22 minus 8, and that is 14.'
      C: 'You went for 12. Check x. 28 plus 22 is 50, and 50 minus 42 is 8, not 10. So Physics only is 22 minus 8, which is 14.'
  8:
    moments:
      - section: 'The question'
        say: 'A is a subset of B, inside a universal set that this question calls E. We must simplify A intersection, bracket, A intersection B, complement.'
        write: 'Simplify $A \cap (A \cap B)^{\prime}$, given $A \subseteq B$'
      - section: 'Solution'
        say: 'Solution. A is a subset of B means every element of A is also in B. Let me draw circle A sitting completely inside circle B, in the box E.'
        write: 'Given: $A \subseteq B$'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: A, text: 'inside B'}
          - {figure: sketch, kind: circle, target: E, text: 'universal set'}
      - say: 'Work from the inside bracket out. A intersection B is everything in both A and B. All of A is already inside B, so the overlap is A itself.'
        write: '$A \subseteq B \Rightarrow A \cap B = A$'
      - say: 'So the complement of the bracket is the complement of A, read A complement, which is everything in E that is not in A.'
        write: '$(A \cap B)^{\prime} = A^{\prime}$'
        point:
          - {figure: sketch, kind: label, target: E, text: 'A′: outside A'}
      - say: 'Substitute that back into the whole expression.'
        write: '$A \cap (A \cap B)^{\prime} = A \cap A^{\prime}$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '= [[A′]]'}, at: '∩ [[A′]]', text: 'substitute'}
      - say: 'A intersection A complement asks for elements inside A and outside A at the same time. Picture a marble that is in the bag and out of the bag at once.'
        write: '$x \in A \cap A^{\prime} \Rightarrow x \in A$ and $x \notin A$'
        doodle: {name: 'custom:1994_q08_a', id: bag, caption: 'in the bag and out of it?'}
      - say: 'That is impossible, so no element can be in A intersection A complement. It is the empty set.'
        write: '$A \cap A^{\prime} = \varnothing$'
        doodle_do:
          - {id: bag, op: stage, stage: 'custom:1994_q08_a2'}
          - {id: bag, op: label, part: both, text: 'empty set'}
      - section: 'Check'
        say: 'Check with the sketch. A complement is the part of E outside circle A. Circle A and that outside part do not touch, so they share nothing.'
        write: 'Check: $A$ and $A^{\prime}$ have no common part'
        point:
          - {figure: sketch, kind: circle, target: A, text: 'shares nothing with A′'}
      - section: 'Answer'
        say: 'Therefore A intersection, A intersection B, complement, is the empty set, which is answer choice B.'
        write: '$\therefore A \cap (A \cap B)^{\prime} = \varnothing$'
        answer: true
    traps:
      A: 'You went for A. That drops the complement. A intersection A is A, but A intersection A complement is the empty set. Nothing is inside A and outside A at once.'
      C: 'You went for B. The expression intersects everything with A, so it can never be bigger than A. In fact A intersection A complement is empty.'
      D: 'You went for E, the universal set. That would be A union A complement. Here it is A intersection A complement, which is the empty set.'
  9:
    moments:
      - section: 'The question'
        say: 'A power of 25 and a power of 5 in one equation. This is a quadratic in disguise, and one of its roots has to be thrown away. Most students forget that.'
        write: 'Solve for $x$: $25^{x} + 3(5^{x}) = 4$'
      - say: 'Solution. First, write 25 to the power $x$ using 5 to the power $x$.'
        write: 'Solution'
      - section: 'The same base'
        say: 'The law of indices for a power of a power says we multiply the indices.'
        write: 'Law of indices: $(a^{m})^{n} = a^{mn}$'
      - say: '25 is 5 squared, so 25 to the power $x$ is 5 squared, to the power $x$, which is 5 to the power $2x$.'
        write: '$25^{x} = (5^{2})^{x} = 5^{2x}$'
      - say: '2 times $x$ is the same as $x$ times 2, so 5 to the power $2x$ is 5 to the power $x$, all squared.'
        write: '$= (5^{x})^{2}$'
      - say: 'Substitute that into the equation.'
        write: '$(5^{x})^{2} + 3(5^{x}) = 4$'
      - section: 'Let u = 5ˣ'
        say: 'Let $u$ be 5 to the power $x$. Then the equation becomes an ordinary quadratic.'
        write: 'Let $u = 5^{x}$'
      - say: '5 to the power $x$, all squared, becomes $u$ squared, and 3 times 5 to the power $x$ becomes $3u$.'
        write: '$u^{2} + 3u = 4$'
      - say: 'Subtract 4 from both sides, so the quadratic equals zero.'
        write: '$u^{2} + 3u - 4 = 0$'
      - say: 'Factorise. We need two numbers whose product is negative 4 and whose sum is 3, and they are 4 and negative 1.'
        write: 'Product $= -4$, Sum $= 3$: $\ 4, -1$'
      - say: 'Split the middle term with them, so plus $4u$, minus $u$.'
        write: '$u^{2} + 4u - u - 4 = 0$'
      - say: 'Group in pairs. $u$ comes out of the first pair, and negative 1 out of the second.'
        write: '$u(u + 4) - 1(u + 4) = 0$'
      - say: 'Both groups have the bracket $u$ plus 4.'
        write: '$(u + 4)(u - 1) = 0$'
      - say: 'Either $u$ plus 4 is 0, or $u$ minus 1 is 0.'
        write: 'Either $u + 4 = 0$ or $u - 1 = 0$'
      - say: 'So $u$ is negative 4, or $u$ is 1.'
        write: '$u = -4$ or $u = 1$'
      - section: 'Back to x'
        say: 'Now go back to $u$ equals 5 to the power $x$. Can 5 to the power $x$ be negative 4? The piles show every power of 5 above the ground. 5 to any power is positive, so we reject it.'
        write: '$5^{x} = -4$ (impossible, since $5^{x} > 0$)'
        doodle: {name: 'custom:1994_q09_a', id: piles, caption: 'powers of 5 never go below 0'}
        doodle_do:
          - {id: piles, op: cross, part: neg}
      - say: 'The other root gives 5 to the power $x$ equals 1. Any non-zero number to the power 0 is 1, so 1 is 5 to the power 0, the pile of one block.'
        write: '$5^{x} = 1 = 5^{0}$ $\quad [a^{0} = 1]$'
        doodle_do:
          - {id: piles, op: circle, part: p0}
      - say: 'Since the bases are the same, equate the indices, and $x$ is 0.'
        write: 'Equating the indices: $\therefore x = 0$'
      - section: 'Check'
        say: 'Check. 25 to the power 0 is 1, and 3 times 5 to the power 0 is 3. 1 plus 3 is 4, the right side.'
        write: 'Check: $25^{0} + 3(5^{0}) = 1 + 3 = 4\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore $x$ is 0, which is option B.'
        write: '$\therefore x = 0$'
        answer: true
    traps:
      A: 'You went for 1 or negative 4. Those are the values of $u$, not $x$. $u$ equals negative 4 is rejected, because 5 to the power $x$ is always positive, and 5 to the power $x$ equals 1 gives $x$ equals 0.'
      C: 'You went for 1. That is the value of $u$, which is 5 to the power $x$. We still need $x$, and 5 to the power $x$ equals 1 means $x$ is 0.'
      D: 'You went for negative 4 or 0. The 0 is right, but negative 4 was a value of $u$, and 5 to the power $x$ can never be negative. So only $x$ equals 0 works.'
  10:
    moments:
      - section: 'The question'
        say: 'We have one square minus another square, over $5m$ squared minus $5u$ squared. Expanding the top is long and risky. Factorise top and bottom, and nearly everything cancels.'
        write: '$\dfrac{(2m - u)^{2} - (m - 2u)^{2}}{5m^{2} - 5u^{2}}$'
      - section: 'Solution'
        say: 'Solution. The top is one square minus another, so picture a big square with a small square cut from its corner. Recall the difference of two squares.'
        write: 'Recall: $P^{2} - Q^{2} = (P - Q)(P + Q)$'
        doodle: {name: 'custom:1994_q10_a', id: sq, caption: 'a square with a corner cut away', 'on': 'picture'}
      - say: 'Let $P$ be the first bracket, $2m$ minus $u$, the big square''s side. Let $Q$ be the second bracket, $m$ minus $2u$, the cut corner''s side.'
        write: 'Let $P = 2m - u,\ Q = m - 2u$'
        doodle_do:
          - {id: sq, op: label, part: big, text: 'P = 2m − u'}
          - {id: sq, op: label, part: small, text: 'Q = m − 2u'}
      - section: 'Factorise the top'
        say: 'So the top is $P$ minus $Q$, times $P$ plus $Q$. Keep each bracket whole, inside square brackets.'
        write: 'Top $= [(2m - u) - (m - 2u)][(2m - u) + (m - 2u)]$'
      - say: 'Open the inner brackets. In the first, the minus in front changes both signs, giving minus $m$, plus $2u$.'
        write: '$= [2m - u - m + 2u][2m - u + m - 2u]$'
      - say: 'Collect like terms. $2m$ minus $m$ is $m$, and minus $u$ plus $2u$ is $u$. Then $2m$ plus $m$ is $3m$, and minus $u$ minus $2u$ is minus $3u$.'
        write: '$= (m + u)(3m - 3u)$'
      - say: '3 is common to both terms of the second bracket, so take out the 3.'
        write: '$= 3(m + u)(m - u)$'
      - section: 'Factorise the bottom'
        say: 'Now the bottom. 5 is common to both terms, so take out the 5.'
        write: 'Bottom $= 5m^{2} - 5u^{2} = 5(m^{2} - u^{2})$'
      - say: '$m$ squared minus $u$ squared is another difference of two squares, another square with a corner cut, so it is $m$ plus $u$, times $m$ minus $u$.'
        write: '$= 5(m + u)(m - u)$'
        doodle_do:
          - {id: sq, op: pulse}
      - section: 'Cancel common factors'
        say: 'Now put the factorised top over the factorised bottom.'
        write: 'Expression $= \dfrac{3(m + u)(m - u)}{5(m + u)(m - u)}$'
      - say: 'The bracket $m$ plus $u$ is a factor of the top and of the bottom, so it cancels. So does $m$ minus $u$. Only 3 over 5 is left.'
        write: '$= \dfrac{3}{5}$'
      - section: 'Check'
        say: 'Check with $m = 2$ and $u = 1$. The top is 3 squared minus 0 squared, which is 9. The bottom is 20 minus 5, which is 15. 9 over 15 is 3 over 5.'
        write: 'Check: $\dfrac{3^{2} - 0^{2}}{20 - 5} = \dfrac{9}{15} = \dfrac{3}{5}$'
      - say: 'Every letter has cancelled. Therefore the expression simplifies to 3 over 5, which is answer choice B.'
        write: '$\therefore$ the expression $= \dfrac{3}{5}$'
        answer: true
    traps:
      A: 'You went for 3 over 4. The 3 on top is right, but the bottom is 5 times $m^{2} - u^{2}$, so after cancelling a 5 is left, not a 4.'
      C: 'You went for $2m - u$ over $5m + u$. That cancels pieces that are added or subtracted, which is not allowed. Factorise top and bottom fully and every bracket cancels, leaving 3 over 5.'
      D: 'You went for $m - 2u$ over $m + 5u$. You can only cancel whole factors, not pieces of a bracket. The top is 3 times $(m + u)(m - u)$, and the bottom is 5 times the same two brackets.'
  11:
    moments:
      - section: 'The question'
        say: 'There are four terms, and nothing is common to all four. When that happens, we group them in pairs. The trick is choosing the right pairs.'
        write: '$a^{2}x - b^{2}y - b^{2}x + a^{2}y$'
      - section: 'Solution'
        say: 'Solution. Rearrange so the two $a$ squared terms sit together and the two $b$ squared terms sit together. Picture the four terms as four pieces of one rectangle.'
        write: '$= a^{2}x + a^{2}y - b^{2}x - b^{2}y$'
        doodle: {name: 'custom:1994_q11_a', id: rect, caption: 'four terms, one rectangle', 'on': 'Picture'}
      - section: 'Group in pairs'
        say: 'Group in pairs. The minus sign in front of the second bracket changes the minus $b$ squared $y$ inside it to plus.'
        write: '$= (a^{2}x + a^{2}y) - (b^{2}x + b^{2}y)$'
      - say: 'From the first pair take out $a$ squared, leaving $x$ plus $y$. From the second pair take out $b$ squared, leaving $x$ plus $y$ again.'
        write: '$= a^{2}(x + y) - b^{2}(x + y)$'
        doodle_do:
          - {id: rect, op: highlight, part: row-a, 'on': 'first'}
          - {id: rect, op: highlight, part: row-b, 'on': 'second'}
      - say: 'The two brackets are the same, so the grouping is right. Take out the common bracket, $x$ plus $y$, the rectangle''s width. What is left is $a$ squared minus $b$ squared.'
        write: '$= (x + y)(a^{2} - b^{2})$'
        doodle_do:
          - {id: rect, op: stage, stage: 'custom:1994_q11_a2'}
      - section: 'Difference of two squares'
        say: 'We are not finished. $a$ squared minus $b$ squared is a difference of two squares, so it factorises again into $a$ minus $b$, times $a$ plus $b$.'
        write: '$a^{2} - b^{2} = (a - b)(a + b)$'
      - say: 'Put those two brackets in place of $a$ squared minus $b$ squared. Now no bracket can be factorised further.'
        write: 'So the expression $= (x + y)(a - b)(a + b)$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '(a − b)(a + b)'}, at: '(a − b)(a + b)', text: 'in its place'}
      - section: 'Check'
        say: 'Check by expanding back. $x$ plus $y$, times $a$ squared minus $b$ squared, gives back the four terms we started with.'
        write: 'Check: $(x + y)(a^{2} - b^{2}) = a^{2}x + a^{2}y - b^{2}x - b^{2}y$'
      - say: 'Therefore the expression factorises fully as $x$ plus $y$, times $a$ minus $b$, times $a$ plus $b$, which is answer choice D.'
        write: '$\therefore$ the factors are $(x + y)(a - b)(a + b)$'
        answer: true
    traps:
      A: 'You went for $(a - b)(x + y)$. That leaves out the factor $a + b$. After grouping you get $(x + y)(a^{2} - b^{2})$, and $a^{2} - b^{2}$ splits into $(a - b)(a + b)$.'
      B: 'You went for $(y - x)(a - b)(a + b)$. The common bracket is $x + y$, not $y - x$, because $a^{2}x$ and $a^{2}y$ both carry a plus sign.'
      C: 'You went for $(x - y)(a - b)(a + b)$. Look at the signs. $a^{2}x$ and $a^{2}y$ are both positive, so the common bracket is $x + y$, not $x - y$.'
  12:
    moments:
      - section: 'The question'
        say: 'We are given two factors, and there are two unknowns to find. Each factor gives one equation in $p$ and $q$. Then it is simultaneous equations, which you already know.'
        write: 'Factors $(x - 1)$ and $(x - 3)$; find $p$ and $q$'
      - section: 'Solution'
        say: 'Solution. Let $f$ of $x$ be the cubic expression.'
        write: 'Let $f(x) = px^{3} + qx^{2} + 11x - 6$'
      - say: 'Recall the factor theorem, which says $x$ minus $a$ is a factor of $f$ of $x$ if $f$ of $a$ is zero. A factor leaves no remainder.'
        write: '$(x - a)$ is a factor $\Leftrightarrow f(a) = 0$'
      - section: 'First factor'
        say: 'Let $x$ minus 1 equal zero. Then $x$ is 1.'
        write: 'Let $x - 1 = 0$, $\therefore x = 1$'
      - say: 'Substitute 1 for every $x$, each value in brackets, and set it equal to zero.'
        write: '$f(1) = p(1)^{3} + q(1)^{2} + 11(1) - 6 = 0$'
      - say: '1 cubed and 1 squared are both 1. So we have $p$ plus $q$ plus 11 minus 6, and 11 minus 6 is 5.'
        write: '$p + q + 5 = 0$'
      - say: 'Subtract 5 from both sides. Label this equation 1.'
        write: '$p + q = -5 \quad \ldots\ldots (1)$'
      - section: 'Second factor'
        say: 'Let $x$ minus 3 equal zero. Then $x$ is 3.'
        write: 'Let $x - 3 = 0$, $\therefore x = 3$'
      - say: 'Substitute 3 for every $x$, each value in brackets, and set it equal to zero.'
        write: '$f(3) = p(3)^{3} + q(3)^{2} + 11(3) - 6 = 0$'
      - say: '3 cubed is 27, 3 squared is 9, and 11 times 3 is 33. Then 33 minus 6 is 27.'
        write: '$27p + 9q + 27 = 0$'
      - say: 'Subtract 27 from both sides.'
        write: '$27p + 9q = -27$'
      - say: 'Every term divides by 9, so divide through by 9 to keep the numbers small. Label this equation 2.'
        write: '$3p + q = -3 \quad \ldots\ldots (2)$'
      - section: 'Solve (1) and (2)'
        say: 'Both equations have one $q$. So subtract equation 1 from equation 2, and the $q$ cancels. Picture the two equations as two baskets.'
        write: '(2) − (1): $\ 3p - p = -3 - (-5)$'
        doodle: {name: 'custom:1994_q12_a', id: baskets, caption: '(1) p + q and (2) 3p + q', 'on': 'Picture'}
      - say: '$3p$ minus $p$ is $2p$, the two extra $p$ in the second basket. Minus 3 minus minus 5 is minus 3 plus 5, which is 2.'
        write: '$2p = 2$'
        doodle_do:
          - {id: baskets, op: stage, stage: 'custom:1994_q12_a2'}
        point:
          - {line: 13, kind: highlight, at: '2p', to: {doodle: baskets, part: extra}}
      - say: 'Divide both sides by 2. Each extra $p$ is worth 1.'
        write: '$p = 1$'
        doodle_do:
          - {id: baskets, op: label, part: extra, text: 'p = 1'}
      - say: 'Substitute $p = 1$ in equation 1, the first basket.'
        write: 'Sub. $p = 1$ in (1): $\ 1 + q = -5$'
        doodle_do:
          - {id: baskets, op: circle, part: b1}
        point:
          - {line: 15, kind: move, from: {line: 14, at: '1'}, at: '1 + q', text: 'sub in'}
      - say: 'Subtract 1 from both sides. Minus 5 minus 1 is minus 6.'
        write: '$q = -5 - 1 = -6$'
      - section: 'Check'
        say: 'Check with $x = 3$, $p = 1$ and $q = -6$. 27 minus 54 plus 33 minus 6 is zero, so $x$ minus 3 is a factor.'
        write: 'Check: $f(3) = 27 - 54 + 33 - 6 = 0$'
      - say: 'Therefore $p$ is 1 and $q$ is minus 6, which is answer choice B.'
        write: '$\therefore p = 1,\ q = -6$'
        answer: true
    traps:
      A: 'You went for minus 1 and minus 6. Then $p + q$ would be minus 7, not minus 5. Subtracting the equations gives $2p = 2$, so $p$ is plus 1.'
      C: 'You went for 1 and 6. Then $p + q$ would be 7, but putting $x = 1$ in gives $p + q = -5$. So $q$ is minus 6.'
      D: 'You went for 6 and minus 1. Then $p + q$ would be 5, not minus 5. Solving equations 1 and 2 gives $p = 1$ and $q = -6$.'
  13:
    moments:
      - section: 'The question'
        say: 'We pick the equation of the curve in the graph. Read off the two marked points. It crosses the $x$-axis at 3, 0 and cuts the $y$-axis at 0, negative 27.'
        write: 'Solution: the curve passes through $(3,\ 0)$ and $(0,\ -27)$'
        point:
          - {figure: 0, kind: circle, target: '(3, 0)'}
          - {figure: 0, kind: circle, target: '(0, -27)'}
      - section: 'Test the y-intercept'
        say: 'Every point on the curve satisfies its equation. Substitute $x = 0$ into each option, because we need $y = -27$. In option A, 0 minus 3 is negative 3, and negative 3 cubed is negative 27.'
        write: 'At $x = 0$: A: $(0 - 3)^{3} = (-3)^{3} = -27\ \checkmark$'
      - say: 'In option B, 0 plus 3 is 3, and 3 cubed is positive 27, not negative 27. B is out.'
        write: 'B: $(0 + 3)^{3} = 27 \ne -27$'
        point:
          - {figure: 0, kind: 'circle', target: '(0, -27)', text: '−27, not 27'}
      - say: 'For option C, 0 cubed minus 27 is negative 27. C fits.'
        write: 'C: $0^{3} - 27 = -27\ \checkmark$'
      - say: 'Option D gives negative 0 cubed plus 27, which is positive 27. D is out.'
        write: 'D: $-0^{3} + 27 = 27 \ne -27$'
      - section: 'Test the x-intercept'
        say: 'Now substitute $x = 3$ into A and C, and we need $y = 0$. Both give 0, because 3 minus 3, cubed, is 0, and 27 minus 27 is 0.'
        write: 'At $x = 3$: A: $(3 - 3)^{3} = 0\ \checkmark$;  C: $3^{3} - 27 = 0\ \checkmark$'
      - section: 'The shape'
        say: 'A and C both pass through the two points, so look at the shape. The graph of $y = x^{3}$ goes flat for a moment at the origin.'
        write: '$y = x^{3}$ is flat at $(0,\ 0)$'
      - say: 'Replacing $x$ by $x - 3$ moves a graph 3 units to the right. So A is flat at 3, 0, on the $x$-axis.'
        write: 'A: $y = (x - 3)^{3}$: flat at $(3,\ 0)$'
        point:
          - {figure: 0, kind: 'circle', target: '(3, 0)', text: 'flat here'}
      - say: 'Subtracting 27 moves a graph 27 units down. So C is flat at 0, negative 27, on the $y$-axis.'
        write: 'C: $y = x^{3} - 27$: flat at $(0,\ -27)$'
      - say: 'In the graph, the curve flattens exactly where it meets the $x$-axis at 3, 0, and is steep where it cuts the $y$-axis. That is A.'
        write: 'The graph is flat at $(3,\ 0)$ $\Rightarrow$ A'
        point:
          - {line: 9, kind: arrow, from: {line: 7, at: 'flat at (3,0)'}, at: '(3,0)', text: 'matches'}
          - {figure: 0, kind: arrow, target: '(3, 0)', text: 'flat here'}
      - section: 'Check'
        say: 'Check with calculus. For A, $dy/dx$ is 3 times, $x$ minus 3, squared. At $x = 3$ that is 0, so the curve really is flat there.'
        write: 'Check: $\dfrac{dy}{dx} = 3(x - 3)^{2} = 3(0)^{2} = 0$ at $x = 3\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the equation of the graph is $y = (x - 3)^{3}$, which is option A.'
        write: '$\therefore y = (x - 3)^{3}$'
        answer: true
    traps:
      B: 'You went for $y = (x + 3)^{3}$. At $x = 0$ that gives positive 27, but the graph cuts the $y$-axis at negative 27. It would also cross the $x$-axis at negative 3, not 3.'
      C: 'You went for $y = x^{3} - 27$. It does pass through both marked points, but it is $y = x^{3}$ moved 27 down, so it is flat at 0, negative 27. The drawn curve is flat at 3, 0, which is $y = (x - 3)^{3}$.'
      D: 'You went for $y = -x^{3} + 27$. At $x = 0$ that gives positive 27, not negative 27, and it falls from left to right while the drawn curve rises.'
  14:
    moments:
      - section: 'The question'
        say: 'The equation mixes letters and numbers. Put the numbers in first, and it becomes one fraction equal to another. Then we cross multiply.'
        write: '$\dfrac{a}{a - x} = \dfrac{b}{x - b}$'
      - section: 'Solution'
        say: 'Solution. Write the givens, $a$ is 1 and $b$ is 3.'
        write: '$a = 1,\ b = 3$'
      - say: 'Substitute them into the equation, so replace $a$ with 1 and $b$ with 3.'
        write: '$\dfrac{1}{1 - x} = \dfrac{3}{x - 3}$'
      - section: 'Cross multiply'
        say: 'One fraction equals another, so cross multiply. 1 times $x$ minus 3 equals 3 times 1 minus $x$.'
        write: '$1(x - 3) = 3(1 - x)$'
      - say: 'Open the brackets. The left is just $x$ minus 3. On the right, 3 times 1 is 3, and 3 times minus $x$ is minus $3x$.'
        write: '$x - 3 = 3 - 3x$'
      - say: 'Collect like terms, with $x$ terms on the left and numbers on the right. Minus $3x$ crosses over as plus $3x$, and minus 3 crosses over as plus 3.'
        write: '$x + 3x = 3 + 3$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '− 3x'}, at: '+ 3x', text: 'across the ='}
      - say: '$x$ plus $3x$ is $4x$, and 3 plus 3 is 6.'
        write: '$4x = 6$'
      - say: 'Divide both sides by 4, the coefficient of $x$. 6 over 4 reduces to 3 over 2.'
        write: '$x = \dfrac{6}{4} = \dfrac{3}{2}$'
      - section: 'Check'
        say: 'Check with $x$ equals 1.5. The left side is 1 over 1 minus 1.5, which is 1 over minus 0.5, and that is minus 2.'
        write: 'Left: $\ \dfrac{1}{1 - 1.5} = \dfrac{1}{-0.5} = -2$'
      - say: 'The right side is 3 over 1.5 minus 3, which is 3 over minus 1.5, and that is also minus 2. The two sides agree.'
        write: 'Right: $\ \dfrac{3}{1.5 - 3} = \dfrac{3}{-1.5} = -2$'
      - say: 'Therefore $x$ is 3 over 2, which is answer choice C.'
        write: '$\therefore x = \dfrac{3}{2}$'
        answer: true
    traps:
      A: 'You went for 4 over 3. Put it back in. The left side is 1 over minus 1 over 3, which is minus 3, but the right side is 3 over minus 5 over 3, which is minus 9 over 5. From $4x = 6$, $x$ is 3 over 2.'
      B: 'You went for 2 over 3. That is the reciprocal of the right answer. From $4x = 6$, $x$ is 6 over 4, which is 3 over 2.'
      D: 'You went for 3 over 4. That comes from $4x = 3$, forgetting to carry the minus 3 across. Collecting properly gives $4x = 3 + 3 = 6$, so $x$ is 3 over 2.'
  15:
    moments:
      - section: 'The question'
        say: 'There are three fractions with three different denominators. Many students start guessing here. Multiply through by the LCM, and every fraction disappears.'
        write: '$\dfrac{1}{r - 1} + \dfrac{2}{r + 1} = \dfrac{3}{r}$'
      - section: 'Solution'
        say: 'Solution. The denominators are $r$ minus 1, $r$ plus 1 and $r$. They share no factor, so the LCM is their product.'
        write: 'LCM $= r(r - 1)(r + 1)$'
      - say: 'Multiply every term on both sides by the LCM. Each fraction then loses its denominator.'
        write: 'Multiply through by $r(r - 1)(r + 1)$:'
      - say: 'In the first term, $r$ minus 1 cancels, leaving $r$ times $r$ plus 1. In the second, $r$ plus 1 cancels. On the right, $r$ cancels.'
        write: '$r(r + 1) + 2r(r - 1) = 3(r - 1)(r + 1)$'
      - section: 'Open the brackets'
        say: 'Open the brackets on the left, and we get $r$ squared plus $r$, then $2r$ squared minus $2r$. On the right, $r$ minus 1 times $r$ plus 1 is $r$ squared minus 1.'
        write: '$r^{2} + r + 2r^{2} - 2r = 3(r^{2} - 1)$'
      - say: '3 times $r$ squared minus 1 is $3r$ squared minus 3.'
        write: '$r^{2} + r + 2r^{2} - 2r = 3r^{2} - 3$'
      - say: 'Collect like terms on the left. $r$ squared plus $2r$ squared is $3r$ squared, and $r$ minus $2r$ is minus $r$.'
        write: '$3r^{2} - r = 3r^{2} - 3$'
      - say: 'Subtract $3r$ squared from both sides. The squared terms cancel, so this is not a quadratic after all.'
        write: '$-r = -3$'
        point:
          - {line: 6, kind: strike, at: '3r2 − r', text: 'cancels'}
          - {line: 6, kind: strike, at: '= 3r2', text: 'cancels'}
      - say: 'Divide both sides by minus 1.'
        write: '$r = 3$'
      - section: 'Check'
        say: 'Check $r = 3$. 1 over 3 minus 1 is 1 over 2. 2 over 3 plus 1 is 2 over 4, also a half. A half plus a half is 1, and 3 over 3 is 1.'
        write: 'Check: $\dfrac{1}{2} + \dfrac{2}{4} = 1 = \dfrac{3}{3}$'
      - say: 'Therefore $r$ is 3, which is answer choice A.'
        write: '$\therefore r = 3$'
        answer: true
    traps:
      B: 'You went for 4. Try it. 1 over 3 plus 2 over 5 is 11 over 15, but the right side is 3 over 4. They don''t match. Clearing the fractions gives $-r = -3$, so $r$ is 3.'
      C: 'You went for 5. Try it. 1 over 4 plus 2 over 6 is 7 over 12, but the right side is 3 over 5. Multiply through by the LCM and the $r^{2}$ terms cancel, leaving $r = 3$.'
      D: 'You went for 6. Try it. 1 over 5 plus 2 over 7 is 17 over 35, but 3 over 6 is a half. Multiply every term by the LCM, and $r$ comes out as 3.'
  16:
    moments:
      - section: 'The question'
        say: 'Partial fractions means one fraction split into two simpler ones. We only need $P$, and one well-chosen value of $x$ finds it in a few lines.'
        write: '$\dfrac{x - 3}{(1 - x)(x + 2)} = \dfrac{P}{1 - x} + \dfrac{Q}{x + 2}$'
      - section: 'Solution'
        say: 'Solution. Write it as an identity, with the three-line sign. It means both sides are equal for every value of $x$.'
        write: 'Let $\dfrac{x - 3}{(1 - x)(x + 2)} \equiv \dfrac{P}{1 - x} + \dfrac{Q}{x + 2}$'
      - say: 'Multiply through by the denominator, $1 - x$ times $x + 2$. On the right, $P$ keeps $x + 2$, and $Q$ keeps $1 - x$.'
        write: '$x - 3 \equiv P(x + 2) + Q(1 - x)$'
      - section: 'Find P'
        say: 'We want $P$, so choose the value of $x$ that makes the $Q$ bracket zero. Let $1 - x$ equal zero, and then $x$ is 1.'
        write: 'Let $1 - x = 0$, $\therefore x = 1$'
      - say: 'Substitute $x = 1$ on both sides, each value in brackets.'
        write: '$(1) - 3 = P(1 + 2) + Q(1 - 1)$'
      - say: '1 minus 3 is minus 2. 1 plus 2 is 3, and 1 minus 1 is zero, so the $Q$ term vanishes.'
        write: '$-2 = 3P + 0$'
      - say: 'Divide both sides by 3.'
        write: '$P = -\dfrac{2}{3}$'
      - section: 'Check'
        say: 'Check by finding $Q$ too. Let $x + 2$ equal zero, so $x$ is minus 2. The left is minus 5, and the right is $3Q$.'
        write: 'Let $x = -2$: $\ -5 = 3Q$, $\therefore Q = -\dfrac{5}{3}$'
      - say: 'Now test $x = 0$. The left is minus 3. The right is $2P$ plus $Q$, which is minus 4 over 3 minus 5 over 3, and that is minus 9 over 3, minus 3.'
        write: '$x = 0$: $\ 2\left(-\dfrac{2}{3}\right) - \dfrac{5}{3} = -\dfrac{9}{3} = -3$'
      - say: 'Both sides agree. Therefore $P$ is minus 2 over 3, which is answer choice A.'
        write: '$\therefore P = -\dfrac{2}{3}$'
        answer: true
    traps:
      B: 'You went for minus 5 over 3. That is $Q$, not $P$, and it comes from putting $x = -2$. $P$ sits over $1 - x$, so put $x = 1$ to find it.'
      C: 'You went for 5 over 3. That is $Q$ with its sign lost. To find $P$, put $x = 1$, and minus 2 equals $3P$.'
      D: 'You went for 2 over 3. The size is right, but the sign is lost. 1 minus 3 is minus 2, so $3P$ is minus 2 and $P$ is minus 2 over 3.'
  17:
    moments:
      - section: 'The question'
        say: '1 over $x$ is greater than 2. It is tempting to multiply both sides by $x$. But if $x$ is negative, that reverses the sign, and we don''t know its sign. So we use a safer road.'
        write: '$\dfrac{1}{x} > 2$'
      - say: 'Solution. Bring everything to one side, so we compare with zero. Subtract 2 from both sides.'
        write: 'Solution: $\ \dfrac{1}{x} - 2 > 0$'
      - say: 'Make one fraction over $x$. 2 is $2x$ over $x$.'
        write: '$\dfrac{1 - 2x}{x} > 0$'
      - say: 'Now the critical values. The top, 1 minus $2x$, is zero at a half. The bottom, $x$, is zero at 0, where the fraction has no meaning.'
        write: 'Critical values: $\ x = 0,\ \ x = \dfrac{1}{2}$'
      - section: 'Sign table'
        say: 'Now the sign table, with three regions, a row for the top, a row for the bottom, then the fraction.'
        diagram:
          id: t
          kind: table
          columns: ['Factor', 'x < 0', '0 < x < ½', 'x > ½']
          rows: [['1 − 2x', '', '', ''], ['x', '', '', ''], ['fraction', '', '', '']]
      - say: '1 minus $2x$ is positive below a half, and negative above it.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,2', text: '+'}
          - {id: t, op: fill, part: 'cell:1,3', text: '+'}
          - {id: t, op: fill, part: 'cell:1,4', text: '−'}
      - say: '$x$ is negative below 0, and positive above it.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:2,2', text: '−'}
          - {id: t, op: fill, part: 'cell:2,3', text: '+'}
          - {id: t, op: fill, part: 'cell:2,4', text: '+'}
      - say: 'Divide the signs down each column. Plus over minus is minus, plus over plus is plus, and minus over plus is minus.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:3,2', text: '−'}
          - {id: t, op: fill, part: 'cell:3,3', text: '+', colour: green}
          - {id: t, op: fill, part: 'cell:3,4', text: '−'}
      - section: 'Answer'
        say: 'We want the fraction greater than zero, which is the middle column.'
        write: '$\therefore\ 0 < x < \dfrac{1}{2}$'
      - say: 'On a number line, we put open circles at 0 and a half, and shade the stretch between.'
        diagram: {id: n, kind: numberline, range: [-1, 2], step: 0.5}
        diagram_do:
          - {id: n, op: interval, from: 0, to: 0.5, from_open: true, to_open: true, text: '0 < x < ½', answer: true, 'on': 'open circles'}
      - section: 'Check'
        say: 'Check $x$ equals a quarter, which is inside. 1 over a quarter is 4, greater than 2. And try minus 1, outside. 1 over minus 1 is minus 1, not greater than 2.'
        write: 'Check: $\ \dfrac{1}{0.25} = 4 > 2\ \checkmark;\ \ \dfrac{1}{-1} = -1 < 2$'
      - say: 'So $x$ lies between 0 and a half, which is option C.'
        write: '$0 < x < \dfrac{1}{2}$'
        answer: true
    traps:
      A: 'You went for $x < \tfrac{1}{2}$. That comes from multiplying by $x$ without knowing its sign, and it lets in every negative number. At $x = -1$, 1 over $x$ is minus 1, not more than 2. The sign table gives $0 < x < \tfrac{1}{2}$.'
      B: 'You went for $x < 0$ or $x > \tfrac{1}{2}$. Those are the two columns where the fraction is negative. We want it positive, the middle column.'
      D: 'You went for $1 < x < 2$. Try $x = 1.5$. 1 over 1.5 is two thirds, not more than 2. The sign table gives $0 < x < \tfrac{1}{2}$.'
  18:
    moments:
      - section: 'The question'
        say: 'There are four options, one boundary line and only two decisions. Which side of the line is shaded, and is the line itself included?'
        write: 'Boundary: $\ 2x - y - 2 = 0$'
        point:
          - {figure: 0, kind: circle, target: '2x - y - 2 = 0', text: 'boundary'}
      - say: 'Solution. First match the line to the diagram by its intercepts. Put $y$ equals 0, then $2x$ minus 2 is 0, so $x$ is 1.'
        write: 'Solution: $\ y = 0$: $\ 2x - 2 = 0 \Rightarrow x = 1$'
        point:
          - {figure: 0, kind: circle, target: '1', text: '(1, 0)'}
      - say: 'Put $x$ equals 0, and minus $y$ minus 2 is 0, so $y$ is minus 2. The line passes through 1, 0 and 0, minus 2, as drawn.'
        write: '$x = 0$: $\ -y - 2 = 0 \Rightarrow y = -2$'
        point:
          - {figure: 0, kind: circle, target: '-2', text: '(0, −2)'}
      - section: 'Test a point'
        say: 'On one side of the line $2x - y - 2$ is positive, and on the other it is negative. The easiest test point is the origin, 0, 0.'
        write: 'Test $(0,\ 0)$: $\ 2(0) - 0 - 2 = -2 < 0$'
        point:
          - {figure: 0, kind: circle, target: '0', text: 'origin'}
      - say: 'In the diagram the origin is not in the shaded part. So the shaded side is the other side, where the expression is positive.'
        write: 'Origin not shaded, so shaded side: $\ 2x - y - 2 > 0$'
      - say: 'Confirm with a shaded point, 3, 0. 2 times 3 is 6, minus 0, minus 2, gives 4, which is positive, as expected.'
        write: 'Check $(3,\ 0)$: $\ 2(3) - 0 - 2 = 4 > 0\ \checkmark$'
        point:
          - {figure: 0, kind: circle, target: '3', text: '(3, 0)'}
      - say: 'Exam tip. In a JAMB diagram like this, the shaded part is the region asked for. When you draw your own graph, many textbooks shade the part not wanted instead, so always state which.'
      - section: 'The boundary'
        say: 'Now, is the line included? It is drawn solid, not broken. A solid line means equal to is allowed, so the sign is "or equal to".'
        write: 'Solid line: include $= 0$'
        point:
          - {figure: 0, kind: circle, target: '2x - y - 2 = 0', text: 'solid line'}
      - say: 'Greater than zero, together with equal to zero, gives greater than or equal to zero.'
        write: '$\therefore\ 2x - y - 2 \ge 0$'
      - say: 'So the shaded portion is $2x - y - 2 \ge 0$, which is option B.'
        write: '$2x - y - 2 \ge 0$'
        answer: true
        point:
          - {figure: 0, kind: label, target: {x: 290, y: 190}, text: '≥ 0'}
    traps:
      A: 'You went for less than or equal to. That describes the origin''s side, which is not shaded. Testing 0, 0 gives minus 2, so the shaded side is greater than or equal to 0.'
      C: 'You went for strictly less than. That is the unshaded side, and it also leaves out the solid boundary. The shaded side gives positive values, and the solid line includes equality.'
      D: 'You went for strictly greater than. The side is right, but the boundary line is solid, so the points on it count. That needs greater than or equal to.'
  19:
    moments:
      - section: 'The question'
        say: 'The 6th term of an A.P. is 11 and the first term is 1. Find the common difference. Count carefully, because this is where most students slip.'
        write: '$T_{6} = 11,\ a = 1,\ d = ?$'
        doodle: {name: 'custom:1994_q19_a', id: stairs, caption: 'equal rises from 1 up to 11', size: scene}
      - section: 'Solution'
        say: 'Solution. An A.P. is an arithmetic progression, where each term is the one before plus the same number, the common difference, $d$. First, list what is given.'
        write: 'Solution'
        'on': 'Solution'
      - say: 'The first term, $a$, is 1. The term we know is the 6th, so $n$ is 6, and $T$ 6, the 6th term, is 11. $d$ is what we want.'
        write: '$a = 1,\quad n = 6,\quad T_{6} = 11,\quad d = ?$'
        point:
          - {line: 2, kind: travel, at: 'a = 1', from: {doodle: stairs, part: first}, text: 'first step', 'on': 'first term'}
          - {line: 2, kind: travel, at: 'T6 = 11', from: {doodle: stairs, part: last}, text: '6th step', 'on': 'the 6th term'}
      - section: 'The formula'
        say: 'The $n$th term of an A.P. is $a$ plus $n$ minus 1, times $d$.'
        write: '$T_{n} = a + (n - 1)d$'
      - say: 'Put $n$ equal to 6. 6 minus 1 is 5, so the 6th term is $a$ plus $5d$.'
        write: '$T_{6} = a + (6 - 1)d = a + 5d$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: 'n = 6'}, at: '(6 − 1)', text: 'n = 6'}
      - say: 'Why 5 and not 6? Count the rises on the staircase from the 1st step to the 6th, and we get 1, 2, 3, 4, 5. The first step has no rise before it.'
        write: '1st step to 6th step: 5 rises of $d$'
        doodle_do:
          - {id: stairs, op: highlight, part: rises, text: '5 rises', 'on': 'Count the rises'}
      - section: 'Substitute'
        say: 'Now substitute. $a$ is 1, and $T$ 6 is 11. So 1 plus $5d$ equals 11.'
        write: '$1 + 5d = 11$'
        point:
          - {line: 6, kind: move, from: {line: 2, at: 'a = 1'}, at: '[[1]] +', text: 'a'}
          - {line: 6, kind: move, from: {line: 2, at: 'T6 = 11'}, at: '= 11', text: 'T6'}
      - say: 'Subtract 1 from both sides, to leave $5d$ alone. 11 minus 1 is 10.'
        write: '$5d = 11 - 1 = 10$'
      - say: 'Divide both sides by 5, to leave $d$ by itself.'
        write: '$d = \dfrac{10}{5}$'
      - say: 'Therefore $d$ equals 2. Each rise of the staircase is 2.'
        write: '$\therefore\ d = 2$'
        doodle_do:
          - {id: stairs, op: label, part: rises, text: 'each rise d = 2', 'on': 'Each rise'}
        point:
          - {line: 9, kind: highlight, at: 'd = 2', to: {doodle: stairs, part: rises}}
      - section: 'Check'
        say: 'Check by writing the terms. Start at 1 and add 2 each time, so 1, 3, 5, 7, 9, 11. Watch the climber.'
        write: 'Check: $1,\ 3,\ 5,\ 7,\ 9,\ 11$'
        doodle_do:
          - {id: stairs, op: stage, stage: 'custom:1994_q19_a2', 'on': 'add 2 each time'}
          - {id: stairs, op: move, part: man, path: climb, 'on': 'Watch the climber'}
      - say: 'The 6th term is 11, the top step, just as the question says.'
        write: '$T_{6} = 1 + 5(2) = 11\ \checkmark$'
        doodle_do:
          - {id: stairs, op: circle, part: last, 'on': 'top step'}
      - say: 'Therefore the common difference is 2, which is answer choice D.'
        write: '$\therefore$ common difference $= 2$'
        answer: true
    traps:
      A: 'You went for 12 over 5. That comes from $5d$ equals 12, which adds 1 to 11 instead of subtracting it. 1 plus $5d$ equals 11 gives $5d$ equals 10, so $d$ is 2.'
      B: 'You went for 5 over 3. That uses $n$ instead of $n$ minus 1, so 1 plus $6d$ equals 11 gives $6d$ equals 10. The formula has $n$ minus 1, which is 5, so $d$ is 2.'
      C: 'You went for negative 2. The terms rise from 1 to 11, so $d$ must be positive. $5d$ equals 10 gives $d$ equals positive 2.'
  20:
    moments:
      - section: 'The question'
        say: 'We have six logs, each of a power of $r$, adding up to 63. The power law turns them into one log, times a sum of numbers.'
        write: '$\log_{10}r + \log_{10}r^{2} + \log_{10}r^{4} + \log_{10}r^{8} + \log_{10}r^{16} + \log_{10}r^{32} = 63$'
      - say: 'Solution. We want $r$. First the power law, then index form.'
        write: 'Solution'
      - section: 'The power law'
        say: 'Recall the power law of logarithms, which says the log of $M$ to the power $n$ is $n$ log $M$. The index comes down in front.'
        write: 'Recall: $\log_{a}M^{n} = n\log_{a}M$'
      - say: 'By the power law, the indices 2, 4, 8, 16 and 32 all come down in front of log $r$. Picture them as six piles, each double the one before.'
        doodle: {name: 'custom:1994_q20_a', id: piles, caption: '1, 2, 4, 8, 16, 32'}
        write: '$\log_{10}r + 2\log_{10}r + 4\log_{10}r + 8\log_{10}r + 16\log_{10}r + 32\log_{10}r = 63$'
      - section: 'Collect the terms'
        say: 'Every term has log $r$ in it, so factorise by taking log $r$ out, and put the numbers in a bracket.'
        write: '$(1 + 2 + 4 + 8 + 16 + 32)\log_{10}r = 63$'
      - say: 'Add the bracket, the six piles. 1 plus 2 is 3, plus 4 is 7, plus 8 is 15, plus 16 is 31, plus 32 is 63.'
        doodle_do:
          - {id: piles, op: label, part: piles, text: '63 in all'}
        write: '$63\log_{10}r = 63$'
      - say: 'Divide both sides by 63. 63 over 63 is 1.'
        write: '$\log_{10}r = 1$'
      - section: 'Index form'
        say: 'Change to index form. Log base 10 of $r$ equals 1 means $r$ is 10 to the power 1.'
        write: '$r = 10^{1}$'
      - say: '10 to the power 1 is 10.'
        write: '$\therefore r = 10$'
      - section: 'Check'
        say: 'To check, with $r$ equal to 10, log $r$ is 1, so the six logs are 1, 2, 4, 8, 16 and 32. They add to 63.'
        doodle_do:
          - {id: piles, op: pulse}
        write: 'Check: $1 + 2 + 4 + 8 + 16 + 32 = 63\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore $r$ is 10, which is option C.'
        write: '$\therefore r = 10$'
        answer: true
    traps:
      A: 'You went for 10 to the minus 8. The numbers 1, 2, 4, 8, 16 and 32 are all positive and add to 63, so log $r$ is 1, not negative. $r$ is 10.'
      B: 'You went for 10 to the power 0, which is 1. That would need log $r$ to be 0. But 63 log $r$ is 63, so log $r$ is 1 and $r$ is 10.'
      D: 'You went for 10 squared. That would make log $r$ equal to 2, and the sum would be 126, not 63. Log $r$ is 1, so $r$ is 10.'
  21:
    moments:
      - section: 'The question'
        say: 'The sequence is 3, 6, 10, 15 and 21. The gaps are 3, 4, 5 and 6, so this is neither an A.P. nor a G.P. Picture each number as a triangle of dots. We want the $n$th term.'
        write: '$n$th term of $3,\ 6,\ 10,\ 15,\ 21,\ \ldots$'
        doodle: {name: 'custom:1994_q21_a', id: dots, caption: '3, 6, 10, 15 as triangles', size: scene}
      - section: 'Solution'
        say: 'Solution. The $n$th term must give the first term when $n$ is 1, the second when $n$ is 2, and so on. So we test the options with $n$ equal to 1, then 2.'
        write: 'Solution: $T_{1} = 3,\quad T_{2} = 6,\quad T_{3} = 10$'
        doodle_do:
          - {id: dots, op: highlight, part: rows}
      - section: 'Test n = 1: we need 3'
        say: 'In option A, 1 times, 1 minus 1 over 2, is 1 over 2. That is not 3, so A is out.'
        write: 'A: $1\left(1 - \tfrac{1}{2}\right) = \tfrac{1}{2}\ \times$'
      - say: 'Option B gives 1 times, 1 plus 1 over 2, which is 3 over 2. That is not 3, so B is out.'
        write: 'B: $1\left(1 + \tfrac{1}{2}\right) = \tfrac{3}{2}\ \times$'
      - say: 'For option C, 1 plus 1 is 2, 1 plus 2 is 3, and 2 times 3, over 2, is 3. It works.'
        write: 'C: $\dfrac{(1 + 1)(1 + 2)}{2} = \dfrac{6}{2} = 3\ \checkmark$'
      - say: 'In option D, 1 times, 2 times 1 plus 1, is 1 times 3, which is 3. It works too.'
        write: 'D: $1(2 \times 1 + 1) = 3\ \checkmark$'
      - section: 'Test n = 2: we need 6'
        say: 'Back to option C. 2 plus 1 is 3, 2 plus 2 is 4, and 3 times 4, over 2, is 6. It still works.'
        write: 'C: $\dfrac{(2 + 1)(2 + 2)}{2} = \dfrac{12}{2} = 6\ \checkmark$'
      - say: 'Then option D. 2 times, 2 times 2 plus 1, is 2 times 5, which is 10. That is not 6, so D is out.'
        write: 'D: $2(2 \times 2 + 1) = 10\ \times$'
      - say: 'Therefore the $n$th term is $n$ plus 1, times $n$ plus 2, over 2.'
        write: '$\therefore\ T_{n} = \dfrac{(n + 1)(n + 2)}{2}$'
      - section: 'Check'
        say: 'Check the 3rd and 4th terms. 4 times 5, over 2, is 10, and 5 times 6, over 2, is 15. The triangle of 10 is half of a 4 by 5 rectangle of dots.'
        write: 'Check: $T_{3} = \dfrac{4 \times 5}{2} = 10,\quad T_{4} = \dfrac{5 \times 6}{2} = 15\ \checkmark$'
        doodle_do:
          - {id: dots, op: stage, stage: 'custom:1994_q21_a2'}
          - {id: dots, op: label, part: rect, text: 'half of (n + 1)(n + 2)'}
      - say: 'Therefore the $n$th term is $n$ plus 1, times $n$ plus 2, over 2, which is answer choice C.'
        write: '$\therefore\ T_{n} = \dfrac{(n + 1)(n + 2)}{2}$'
        answer: true
    traps:
      A: 'You went for $n$ times, $n$ minus 1 over 2. When $n$ is 1 it gives 1 over 2, not 3, so it fails at once.'
      B: 'You went for $n$ times, $n$ plus 1 over 2. When $n$ is 1 it gives 3 over 2, not 3, so it cannot be the formula.'
      D: 'You went for $n$ times, $2n$ plus 1. It gives the first term, 3, but when $n$ is 2 it gives 10, not 6. Always test at least two terms.'
  22:
    moments:
      - section: 'The question'
        say: 'Star is ordinary multiplication, but only on the positive integers 1, 2, 3 and so on. There are four properties, and one of them fails. We check each one in turn.'
        write: '$a * b = ab$ on $\{1, 2, 3, \ldots\}$. Which property does NOT hold?'
      - section: 'Closure'
        say: 'Solution. Closure means $a$ star $b$ is in the set for every $a$ and $b$ in the set. A positive integer times a positive integer is always a positive integer.'
        write: 'Closure: $a * b = ab \in \{1, 2, 3, \ldots\}$'
      - say: 'Therefore star is closed. That is one property ticked.'
        write: '$\therefore$ closure holds'
      - section: 'Associativity'
        say: 'Associative means bracket $a$ star $b$, star $c$, equals $a$ star, bracket $b$ star $c$. Work out the left side, and $ab$, then times $c$, is $abc$.'
        write: 'Associative: $(a * b) * c = (ab)c = abc$'
      - say: 'Now the right side. $b$ star $c$ is $bc$, and $a$ times $bc$ is also $abc$. The two sides are equal, so associativity holds.'
        write: '$a * (b * c) = a(bc) = abc$ $\therefore$ holds'
      - section: 'Identity'
        say: 'Let $e$ be the identity element. Then $a$ star $e$ equals $e$ star $a$ equals $a$, for every $a$ in the set.'
        write: 'Let $e$ be the identity: $a * e = e * a = a$'
      - say: 'Substitute into the rule, so $a$ times $e$ equals $a$. Since $a$ is a positive integer, it is not zero, so we may divide both sides by $a$.'
        write: '$ae = a \Rightarrow e = \dfrac{a}{a} = 1$'
      - say: 'Check from the other side. 1 star $a$ is 1 times $a$, which is $a$. And 1 is a positive integer, so the identity is in the set. It holds.'
        write: '$1 * a = a$, $1 \in \{1, 2, 3, \ldots\}$ $\therefore e = 1$'
      - section: 'Inverse'
        say: 'Now the inverse. Let $a$ inverse be the inverse of $a$. Then $a$ star $a$ inverse equals the identity, 1.'
        write: 'Let $a^{-1}$ be the inverse of $a$: $a * a^{-1} = e = 1$'
      - say: 'By the rule, $a$ times $a$ inverse equals 1. Divide both sides by $a$, and $a$ inverse is 1 over $a$.'
        write: '$a \times a^{-1} = 1 \Rightarrow a^{-1} = \dfrac{1}{a}$'
      - say: 'Take $a$ equals 2. Its inverse would be 1 over 2. But 1 over 2 is not a positive integer, so it is not in the set.'
        write: '$2^{-1} = \dfrac{1}{2} \notin \{1, 2, 3, \ldots\}$'
      - say: 'Therefore 2 has no inverse in the set. Only 1 does, since 1 times 1 is 1. So the inverse property does not hold.'
        write: '$\therefore$ the inverse property does not hold'
      - section: 'Answer'
        say: 'Therefore the property that does not hold is the inverse, which is option D.'
        write: '$\therefore$ Inverse'
        answer: true
    traps:
      A: 'You went for closure. A positive integer times a positive integer is always a positive integer, so the set is closed. It is the inverse that fails, because 2 would need 1 over 2.'
      B: 'You went for associativity. $(ab)c$ and $a(bc)$ are both $abc$, so it holds. It is the inverse that fails, because 1 over 2 is not a positive integer.'
      C: 'You went for identity. Solving $ae = a$ gives $e = 1$, and 1 is in the set. It is the inverse that fails.'
  23:
    moments:
      - section: 'The question'
        say: 'Here is a multiplication table modulo 10 on the set two, four, six, eight. We want the inverse of 2, so first we need the identity.'
        write: '$S = \{2, 4, 6, 8\}$, $\otimes$ (mod 10)'
        diagram:
          id: T
          kind: table
          columns: ['⊗ (mod 10)', '2', '4', '6', '8']
          rows: [['2', '4', '8', '2', '6'], ['4', '8', '6', '4', '2'], ['6', '2', '4', '6', '8'], ['8', '6', '2', '8', '4']]
      - say: 'Modulo 10 means we multiply as usual, divide the result by 10, and keep only the remainder. Picture a clock with ten hours, nought to nine.'
        write: 'Solution'
        doodle: {name: 'custom:1994_q23_a', id: clock, caption: 'mod 10: a clock of ten hours', 'on': 'clock'}
      - section: 'Find the identity'
        say: 'Let the identity be e. Combining any element with e leaves it unchanged.'
        write: 'Let the identity be $e$: $\ a \otimes e = a$'
      - say: 'Look down the column under 6, and we see two, four, six, eight. It repeats the row headings exactly, so combining with 6 changes nothing.'
        write: '$2 \otimes 6 = 2,\ \ 4 \otimes 6 = 4,\ \ 6 \otimes 6 = 6,\ \ 8 \otimes 6 = 8$'
        diagram_do:
          - {id: T, op: highlight, part: 'col:4', text: 'same as the row headings', 'on': 'column under 6'}
      - say: 'Check one by the remainder. 8 times 6 is 48. 48 divided by 10 is 4, remainder 8. So 8 times 6 gives 8.'
        write: '$8 \times 6 = 48 = 4 \times 10 + 8$'
      - say: 'Therefore the identity here is 6, not 1.'
        write: '$\therefore e = 6$'
      - section: 'Find the inverse of 2'
        say: 'The inverse of 2, written 2 to the power minus 1, is the element that combines with 2 to give the identity, 6.'
        write: '$2 \otimes 2^{-1} = e = 6$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: 'e=[[6]]'}, at: '=e=[[6]]'}
      - say: 'Read along the row for 2, and we get four, eight, two, six. The 6 sits in the column headed 8.'
        write: 'Row of 2: $\ 4, 8, 2, 6$; the 6 is under 8'
        diagram_do:
          - {id: T, op: highlight, part: 'cell:1,5', text: '2 ⊗ 8 = 6', 'on': 'column headed 8'}
      - say: 'Check by the remainder. 2 times 8 is 16. 16 divided by 10 is 1, remainder 6, so that is once round the clock, and on to 6.'
        write: '$2 \times 8 = 16 = 1 \times 10 + 6\ \checkmark$'
        doodle_do:
          - {id: clock, op: move, part: bug, path: lap, 'on': 'once round the clock'}
          - {id: clock, op: circle, part: six, 'on': 'on to 6'}
      - section: 'Answer'
        say: 'Therefore the inverse of 2 is 8, which is option D.'
        write: '$\therefore 2^{-1} = 8$'
        answer: true
    traps:
      A: 'You went for 2. But 2 times 2 is 4, and 4 is not the identity. The identity in this table is 6, and 2 times 8 is 16, which leaves remainder 6.'
      B: 'You went for 4. 2 times 4 is 8, which is not the identity. The identity is 6, and in the row of 2 it sits under 8.'
      C: 'You went for 6. That is the identity itself, not the inverse of 2. 2 times 6 just gives 2 back. We need 2 times something to give 6, and that is 8.'
  24:
    moments:
      - section: 'The question'
        say: 'A matrix times a column equals a column. Multiply it out row by column, and each row gives us one ordinary equation in $x$ and $y$.'
        write: '$\begin{pmatrix} 1 & 1 \\ 3 & y \end{pmatrix}\begin{pmatrix} x \\ 1 \end{pmatrix} = \begin{pmatrix} 4 \\ 1 \end{pmatrix}$'
        doodle: {name: 'custom:1994_q24_a', id: grid, caption: 'row × column: pair up, multiply, add'}
      - section: 'Solution'
        say: 'Solution. Multiply row by column. First row times the column gives 1 times $x$, plus 1 times 1. Second row times the column gives 3 times $x$, plus $y$ times 1.'
        write: 'Solution: $\begin{pmatrix} 1(x) + 1(1) \\ 3(x) + y(1) \end{pmatrix} = \begin{pmatrix} 4 \\ 1 \end{pmatrix}$'
        doodle_do:
          - {id: grid, op: stage, stage: 'custom:1994_q24_a2', 'on': 'First row'}
          - {id: grid, op: highlight, part: row1, 'on': 'First row'}
          - {id: grid, op: highlight, part: row2, 'on': 'Second row'}
      - say: 'Two matrices are equal when their matching entries are equal. The top entries give equation 1, which is $x$ plus 1 equals 4.'
        write: '$x + 1 = 4 \quad \ldots (1)$'
      - say: 'The bottom entries give equation 2, that is, $3x$ plus $y$ equals 1.'
        write: '$3x + y = 1 \quad \ldots (2)$'
      - section: 'Solve the equations'
        say: 'Equation 1 has only $x$. Subtract 1 from both sides, and 4 minus 1 is 3.'
        write: 'From (1): $x = 4 - 1 = 3$'
      - say: 'Substitute $x$ equals 3 in equation 2. 3 times 3 is 9.'
        write: 'Sub. $x = 3$ in (2): $3(3) + y = 1$'
      - say: 'So 9 plus $y$ equals 1.'
        write: '$9 + y = 1$'
      - say: 'Subtract 9 from both sides. 1 minus 9 is negative 8.'
        write: '$y = 1 - 9 = -8$'
      - say: 'Therefore $x$ is 3 and $y$ is negative 8.'
        write: '$\therefore\ x = 3,\ y = -8$'
      - section: 'Check'
        say: 'Check by multiplying back. On top, 1 times 3 plus 1 times 1 is 4. At the bottom, 3 times 3 plus negative 8 times 1 is 1. Both match.'
        write: 'Check: $\begin{pmatrix} 1 & 1 \\ 3 & -8 \end{pmatrix}\begin{pmatrix} 3 \\ 1 \end{pmatrix} = \begin{pmatrix} 3 + 1 \\ 9 - 8 \end{pmatrix} = \begin{pmatrix} 4 \\ 1 \end{pmatrix}\ \checkmark$'
      - say: 'Therefore $x$ is 3 and $y$ is negative 8, which is answer choice C.'
        write: '$\therefore\ x = 3,\ y = -8$'
        answer: true
    traps:
      A: 'You went for $x = -3$ and $y = 3$. Check the top row. Negative 3 plus 1 is negative 2, not 4. Equation 1, $x + 1 = 4$, gives $x = 3$.'
      B: 'You went for $x = 8$ and $y = 3$. Equation 1, $x + 1 = 4$, gives $x = 3$, not 8. Then $9 + y = 1$ gives $y = -8$.'
      D: 'You went for $x = 8$ and $y = -3$. The numbers have been swapped. Equation 1 gives $x = 3$, and then equation 2 gives $y = -8$.'
  25:
    moments:
      - section: 'The question'
        say: 'This is a 3 by 3 determinant. The textbook way is to expand along the first row. Most students who miss this lose one sign, so watch the middle term.'
        write: '$\begin{vmatrix} 1 & 2 & 3 \\ 4 & 5 & 6 \\ 2 & 0 & -1 \end{vmatrix}$'
        doodle: {name: 'custom:1994_q25_a', id: grid, caption: 'cover a row and a column'}
      - section: 'Solution'
        say: 'Solution. We expand along the first row, which is 1, 2 and 3. Each entry takes a sign from this pattern, and along the first row the signs are plus, minus, plus.'
        write: 'Solution: expand along the first row; signs $\begin{matrix} + & - & + \end{matrix}$'
        doodle_do:
          - {id: grid, op: circle, part: signs, 'on': 'plus, minus, plus'}
          - {id: grid, op: highlight, part: top, 'on': 'first row'}
      - say: 'Each entry multiplies its minor, which is the 2 by 2 determinant left when we cover that entry''s row and column.'
        write: '$= 1\begin{vmatrix} 5 & 6 \\ 0 & -1 \end{vmatrix} - 2\begin{vmatrix} 4 & 6 \\ 2 & -1 \end{vmatrix} + 3\begin{vmatrix} 4 & 5 \\ 2 & 0 \end{vmatrix}$'
        doodle_do:
          - {id: grid, op: stage, stage: 'custom:1994_q25_a2', 'on': 'cover'}
          - {id: grid, op: circle, part: minor1, 'on': 'cover'}
      - say: 'A 2 by 2 determinant is $ad$ minus $bc$, that is, the leading diagonal product minus the other diagonal product.'
        write: '$\begin{vmatrix} a & b \\ c & d \end{vmatrix} = ad - bc$'
      - say: 'Apply it to each minor, with every entry in brackets so no sign is lost.'
        write: '$= 1[(5)(-1) - (6)(0)] - 2[(4)(-1) - (6)(2)] + 3[(4)(0) - (5)(2)]$'
      - say: 'The first minor is negative 5 minus 0, which is negative 5. The second, negative 4 minus 12, is negative 16. The third, 0 minus 10, is negative 10.'
        write: '$= 1(-5) - 2(-16) + 3(-10)$'
      - say: '1 times negative 5 is negative 5. Minus 2 times negative 16 is plus 32. 3 times negative 10 is negative 30.'
        write: '$= -5 + 32 - 30$'
      - say: 'Negative 5 plus 32 is 27, and 27 minus 30 is negative 3.'
        write: '$\therefore\ \text{determinant} = -3$'
      - section: 'Check'
        say: 'Check by expanding along the third row instead, which is 2, 0, negative 1, with signs plus, minus, plus. The 0 term drops out.'
        write: 'Check: $2\begin{vmatrix} 2 & 3 \\ 5 & 6 \end{vmatrix} - 0 + (-1)\begin{vmatrix} 1 & 2 \\ 4 & 5 \end{vmatrix}$'
      - say: '12 minus 15 is negative 3, times 2 is negative 6. 5 minus 8 is negative 3, times negative 1 is plus 3. Negative 6 plus 3 is negative 3.'
        write: '$= 2(-3) - 1(-3) = -6 + 3 = -3\ \checkmark$'
      - say: 'Therefore the determinant is negative 3, which is answer choice C.'
        write: '$\therefore\ \text{determinant} = -3$'
        answer: true
    traps:
      A: 'You went for negative 67. That comes from losing the sign in the middle term. Minus 2 times negative 16 is plus 32, not minus 32. Negative 5 plus 32 minus 30 is negative 3.'
      B: 'You went for negative 57. A minor or a sign has slipped. The minors are negative 5, negative 16 and negative 10, and with the signs plus, minus, plus the terms are negative 5, plus 32 and negative 30, which make negative 3.'
      D: 'You went for positive 3. The size is right, but not the sign. Negative 5 plus 32 is 27, and 27 minus 30 is negative 3.'
  26:
    moments:
      - section: 'The question'
        say: 'There are two pairs of parallel lines and a 50 degree angle hiding at $Q$. Many students stop at 50 or 80. Let''s find angle $PSQ$ with a reason on every line.'
        write: '$PQV \parallel TSR,\ PS \parallel QR$; find $\angle PSQ$'
        point:
          - {figure: 0, kind: highlight, target: PQ}
          - {figure: 0, kind: highlight, target: SR}
      - section: 'Solution'
        say: 'Solution. First the givens on the diagram. There is 50 degrees at $Q$, between $SQ$ produced and $QV$, and angle $PST$, 30 degrees, at $S$.'
        write: 'Solution'
        point:
          - {figure: 0, kind: circle, target: '50°', text: 'given'}
          - {figure: 0, kind: circle, target: '30°', text: 'given'}
      - say: 'At $Q$, two straight lines cross, $PQV$ and $SQ$ produced. Angle $PQS$ faces the 50 degrees across the crossing, because vertically opposite angles are equal.'
        write: '$\angle PQS = 50^{\circ}$ (vert. opp. $\angle$s)'
        point:
          - {figure: 0, kind: arc, target: PQS, text: '50°'}
      - say: '$PQV$ is parallel to $TSR$, and $QS$ cuts both. Angle $QSR$ and angle $PQS$ make a Z shape, so they are equal, because alternate angles are equal.'
        write: '$\angle QSR = \angle PQS = 50^{\circ}$ (alt. $\angle$s, $PQ \parallel SR$)'
        point:
          - {figure: 0, kind: arc, target: QSR, text: '50°'}
      - say: 'At $S$, $T$, $S$ and $R$ are on a straight line, and angles on a straight line add up to 180 degrees. So angle $PSR$ is 180 minus 30.'
        write: '$\angle PSR = 180^{\circ} - 30^{\circ}$ ($\angle$s on a str. line)'
        point:
          - {figure: 0, kind: arc, target: PSR}
      - say: '180 minus 30 is 150.'
        write: '$= 150^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: PSR, text: '150°'}
      - say: 'The line $SQ$ splits angle $PSR$ into two parts, angle $PSQ$, which we want, and angle $QSR$. So angle $PSQ$ is angle $PSR$ minus angle $QSR$.'
        write: '$\angle PSQ = \angle PSR - \angle QSR$'
      - say: 'Substitute 150 degrees and 50 degrees. 150 minus 50 is 100.'
        write: '$= 150^{\circ} - 50^{\circ} = 100^{\circ}$'
        point:
          - {line: 7, kind: move, from: {line: 5, at: '150'}, at: '150', text: 'PSR'}
          - {line: 7, kind: move, from: {line: 3, at: '= [[50∘]]'}, at: '− 50∘', text: 'QSR'}
          - {figure: 0, kind: label, target: '?', text: '100°'}
      - section: 'Check'
        say: 'Check with triangle $PQS$. $PQ$ is parallel to $SR$, so angles $SPQ$ and $PSR$ are co-interior angles, and they add up to 180. Angle $SPQ$ is 180 minus 150, which is 30.'
        write: '$\angle SPQ = 180^{\circ} - 150^{\circ} = 30^{\circ}$ (co-int. $\angle$s)'
        point:
          - {figure: 0, kind: arc, target: SPQ, text: '30°'}
      - say: 'So the triangle has 30, 50 and 100 degrees. 30 plus 50 plus 100 is 180, the angle sum of a triangle. It agrees.'
        write: '$30^{\circ} + 50^{\circ} + 100^{\circ} = 180^{\circ}\ \checkmark$'
      - say: 'Therefore angle $PSQ$ is 100 degrees, which is option A.'
        write: '$\therefore \angle PSQ = 100^{\circ}$'
        answer: true
        point:
          - {figure: 0, kind: arc, target: PSQ, text: '100°'}
    traps:
      B: 'You went for 80 degrees. That is 180 minus 100, the angle on the other side of $SQ$. Angle $PSR$ is 150 degrees, and taking away angle $QSR$, 50 degrees, leaves 100.'
      C: 'You went for 50 degrees. That is angle $QSR$, by alternate angles, not angle $PSQ$. Take it away from angle $PSR$, 150 degrees, to get 100.'
      D: 'You went for 30 degrees. That is angle $PST$, which is given. Angle $PSQ$ is 180 minus 30 minus 50, which is 100 degrees.'
  27:
    moments:
      - section: 'The question'
        say: 'We have a diameter, a 38 degree angle and two circle theorems working together. Many students double or halve the 38. Let''s find angle $PSQ$ properly.'
        write: '$SOQ$ is a diameter, $\angle PRS = 38^{\circ}$; find $\angle PSQ$'
        point:
          - {figure: 0, kind: highlight, target: SQ, text: 'diameter'}
          - {figure: 0, kind: circle, target: '38°', text: 'given'}
      - section: 'Solution'
        say: 'Solution. On the diagram, $O$ is the centre, so $SQ$ passes through the centre, which makes it a diameter. Angle $PRS$ is 38 degrees, at $R$.'
        write: 'Solution'
        point:
          - {figure: 0, kind: circle, target: O, text: 'centre'}
      - say: '$SQ$ is a diameter, so the angle it makes at $P$, on the circle, is 90 degrees. The reason is that the angle in a semicircle is a right angle.'
        write: '$\angle SPQ = 90^{\circ}$ ($\angle$ in a semicircle)'
        point:
          - {figure: 0, kind: arc, target: SPQ, text: '90°'}
      - say: 'Angle $PRS$ at $R$ and angle $PQS$ at $Q$ both stand on the chord $PS$, on the same side. So they are equal, because angles in the same segment are equal.'
        write: '$\angle PQS = \angle PRS = 38^{\circ}$ ($\angle$s in the same segment)'
        point:
          - {figure: 0, kind: highlight, target: PS, text: 'chord PS'}
          - {figure: 0, kind: arc, target: PQS, text: '38°'}
      - say: 'Now triangle $PSQ$. Its angles add up to 180 degrees, so angle $PSQ$ is 180 minus the 90 and the 38.'
        write: '$\angle PSQ = 180^{\circ} - (90^{\circ} + 38^{\circ})$ ($\angle$ sum of $\triangle$)'
        point:
          - {line: 4, kind: move, from: {line: 2, at: '90∘'}, at: '(90∘', text: 'semicircle'}
          - {line: 4, kind: move, from: {line: 3, at: '= [[38∘]]'}, at: '+ 38∘', text: 'same segment'}
          - {figure: 0, kind: arc, target: PSQ, text: '?'}
      - say: '90 plus 38 is 128.'
        write: '$= 180^{\circ} - 128^{\circ}$'
      - say: '180 minus 128 is 52.'
        write: '$= 52^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: PSQ, text: '52°'}
      - section: 'Check'
        say: 'To check, in a right-angled triangle, the two other angles add up to 90. 52 plus 38 is 90. It agrees.'
        write: 'Check: $52^{\circ} + 38^{\circ} = 90^{\circ}\ \checkmark$'
      - say: 'Therefore angle $PSQ$ is 52 degrees, which is option D.'
        write: '$\therefore \angle PSQ = 52^{\circ}$'
        answer: true
    traps:
      A: 'You went for 148 degrees. That is too big for a triangle that already has a right angle. With 90 at $P$ and 38 at $Q$, angle $PSQ$ is 180 minus 128, which is 52.'
      B: 'You went for 104 degrees. That is double 52, as if it were an angle at the centre. Angle $PSQ$ is at the circumference, so 180 minus 90 minus 38 is 52.'
      C: 'You went for 80 degrees. Use the two theorems. The angle in a semicircle gives 90 at $P$, and angles in the same segment give 38 at $Q$. Then angle $PSQ$ is 52.'
  28:
    moments:
      - section: 'The question'
        say: 'We have three angles of a quadrilateral, all in letters. It looks like heavy algebra, but most of it cancels. Many students use 180 here. Let''s find the fourth angle.'
        write: '$(3y - x - z)^{\circ},\ \ 3x^{\circ},\ \ (2z - 2y - x)^{\circ}$; fourth $= ?$'
      - section: 'Solution'
        say: 'Solution. Let me sketch the quadrilateral with the three angles on it, and call the fourth angle theta.'
        show_sketch: true
        write: 'Solution: let the fourth angle be $\theta$'
        point:
          - {figure: sketch, kind: circle, target: '(3y − x − z)°'}
          - {figure: sketch, kind: circle, target: '3x°'}
          - {figure: sketch, kind: circle, target: '?', text: 'θ'}
      - say: 'The angles of a quadrilateral add up to 360 degrees, because a diagonal cuts it into two triangles, and 2 times 180 is 360. Picture the four corners torn off and put round a point.'
        write: 'Sum of $\angle$s of a quadrilateral $= 360^{\circ}$'
        doodle: {name: 'custom:1994_q28_a', id: turn, caption: 'the four corners make a full turn'}
      - say: 'So the three given angles plus theta make 360.'
        write: '$(3y - x - z) + 3x + (2z - 2y - x) + \theta = 360$'
      - say: 'Collect the $x$ terms, and negative $x$ plus $3x$ minus $x$ is just $x$.'
        write: '$x$: $\ -x + 3x - x = x$'
      - say: 'For the $y$ terms, $3y$ minus $2y$ is $y$. For the $z$ terms, negative $z$ plus $2z$ is $z$.'
        write: '$y$: $\ 3y - 2y = y$;$\ \ z$: $\ -z + 2z = z$'
      - say: 'So the three given angles add up to just $x$ plus $y$ plus $z$, which is three of the corners.'
        write: '$x + y + z + \theta = 360$'
        doodle_do:
          - {id: turn, op: label, part: three, text: 'x + y + z'}
      - say: 'Subtract $x$, $y$ and $z$ from both sides to leave theta alone, and that is the last corner.'
        write: '$\theta = 360 - x - y - z$'
        doodle_do:
          - {id: turn, op: label, part: fourth, text: '360 − x − y − z'}
        point:
          - {line: 7, kind: highlight, at: '360 − x − y − z', to: {doodle: turn, part: fourth}}
      - section: 'Check'
        say: 'Check by adding the fourth angle back to the three. $x$ plus $y$ plus $z$, plus 360 minus $x$ minus $y$ minus $z$, is 360.'
        write: 'Check: $(x + y + z) + (360 - x - y - z) = 360\ \checkmark$'
      - say: 'Therefore the fourth angle is 360 minus $x$ minus $y$ minus $z$, in degrees, which is option A.'
        write: '$\therefore$ fourth angle $= (360 - x - y - z)^{\circ}$'
        answer: true
        point:
          - {figure: sketch, kind: label, target: '?', text: '360 − x − y − z'}
    traps:
      B: 'You went for $(360 + x + y - z)^{\circ}$. The signs are off. The three angles add up to $x + y + z$, and taking all of it from 360 makes every letter negative.'
      C: 'You went for $(180 - x + y + z)^{\circ}$. 180 is the angle sum of a triangle. The angles of a quadrilateral add up to 360, and all three letters are subtracted.'
      D: 'You went for $(180 + x + y + z)^{\circ}$. That uses 180, the triangle sum, and adds the letters. The angles of a quadrilateral add up to 360, so the fourth is $360 - x - y - z$.'
  29:
    moments:
      - section: 'The question'
        say: 'Think of the box as a solid block of wood the size of its outside, with the inside space scooped out. The wood is what is left.'
        write: 'Find the volume of wood in the box.'
        doodle: {name: 'custom:1994_q29_a', id: blocks, caption: 'solid block minus the space inside'}
      - say: 'Write Solution, then sketch the open box with its inside measurements and the 2 cm walls.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: underline, target: 'wood 2 cm thick, open top', text: 'no lid', 'on': '2 cm walls'}
      - section: 'What we know'
        say: 'List the givens. Inside, the box is 50 cm long, 36 cm wide and 20 cm deep. The wood is 2 cm thick, and the top is open.'
        write: 'Internal: $50 \times 36 \times 20$; thickness $= 2$ cm; open top'
      - say: 'The wood is the external volume minus the internal volume.'
        write: 'Vol. of wood $=$ external vol. $-$ internal vol.'
        doodle_do:
          - {id: blocks, op: circle, part: outer, text: 'external', 'on': 'external volume'}
          - {id: blocks, op: cross, part: inner, text: 'take away', 'on': 'minus the internal'}
      - say: 'The volume of a cuboid is length times breadth times height.'
        write: 'Vol. of cuboid $= l \times b \times h$'
      - section: 'External measurements'
        say: 'The length has a wall at each end, so add 2 twice, and 50 plus 4 is 54 cm.'
        write: 'External $l = 50 + 2(2) = 54$ cm'
        point:
          - {figure: sketch, kind: circle, target: '50 cm', text: '+ 2 + 2', 'on': 'a wall at each end'}
      - say: 'The breadth also has a wall on each side, so 36 plus 4 is 40 cm.'
        write: 'External $b = 36 + 2(2) = 40$ cm'
        point:
          - {figure: sketch, kind: circle, target: '36 cm', text: '+ 2 + 2', 'on': 'a wall on each side'}
      - say: 'But the box is open, with a bottom and no lid. So the height gets only one 2, and 20 plus 2 is 22 cm.'
        write: 'External $h = 20 + 2 = 22$ cm (open top)'
        point:
          - {figure: sketch, kind: circle, target: '20 cm', text: '+ 2 only', 'on': 'only one 2'}
      - section: 'The two volumes'
        say: 'For the external volume, 54 times 40 is 2160, and 2160 times 22 is 47,520.'
        write: 'External vol. $= 54 \times 40 \times 22 = 2160 \times 22 = 47\,520\ \text{cm}^{3}$'
        doodle_do:
          - {id: blocks, op: label, part: outer, text: '47,520 cm³', 'on': 'is 47,520'}
      - say: 'For the internal volume, 50 times 36 is 1800, and 1800 times 20 is 36,000.'
        write: 'Internal vol. $= 50 \times 36 \times 20 = 36\,000\ \text{cm}^{3}$'
        doodle_do:
          - {id: blocks, op: label, part: inner, text: '36,000 cm³', 'on': 'is 36,000'}
      - section: 'The wood'
        say: 'Now the wood, and 47,520 minus 36,000 is 11,520.'
        write: 'Vol. of wood $= 47\,520 - 36\,000 = 11\,520$'
        point:
          - {line: 10, kind: move, from: {line: 8, at: '= 47520'}, at: '47520', text: 'external', 'on': '47,520 minus'}
          - {line: 10, kind: move, from: {line: 9, at: '= 36000'}, at: '− 36000', text: 'internal', 'on': 'minus 36,000'}
      - say: 'Therefore the volume of wood is 11,520 cubic centimetres.'
        write: '$\therefore$ vol. of wood $= 11\,520\ \text{cm}^{3}$'
        doodle_do:
          - {id: blocks, op: label, part: wood, text: '11,520 cm³', 'on': 'Therefore'}
        point:
          - {figure: sketch, kind: label, target: 'volume of wood = ?', text: '11,520 cm³', 'on': 'Therefore'}
      - section: 'Check'
        say: 'Check by adding the pieces of wood. The bottom is 54 by 40 by 2, which is 4320. The two long walls, 54 by 20 by 2 each, make 4320. The two short walls, 36 by 20 by 2 each, make 2880. The total is 11,520.'
        write: 'Check: $4320 + 2(2160) + 2(1440) = 11\,520$ ✓'
      - section: 'Answer'
        say: 'So the volume of wood is 11,520 cubic centimetres, which is answer choice A.'
        write: '$\therefore V = 11\,520\ \text{cm}^{3}$ (A)'
        answer: true
    traps:
      B: 'You went for 36,000. That is the internal volume, the space inside, not the wood. Subtract it from the external volume, and 47,520 minus 36,000 is 11,520.'
      C: 'You went for 38,200. Recheck the external measurements. 54 by 40 by 22 gives 47,520, and 47,520 minus 36,000 is 11,520.'
      D: 'You went for 47,520. That is the external volume, the solid block. Take away the internal space, 36,000, and the wood is 11,520.'
  30:
    moments:
      - section: 'The question'
        say: 'Picture an ant walking round a slice of pizza. It goes out along one straight edge, round the crust, and home along the other edge. That walk is the perimeter of the sector.'
        write: 'Find the perimeter of the sector.'
        doodle: {name: 'custom:1994_q30_a', id: slice, caption: 'an ant walks round the slice'}
      - say: 'Write Solution, then draw the sector OAB, with radius 8 cm and angle 45 degrees at O.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: arc, target: AOB, text: '45°', 'on': 'angle 45 degrees'}
      - section: 'What we know'
        say: 'List the givens. r is 8 cm and theta is 45 degrees.'
        write: '$r = 8$ cm, $\theta = 45^{\circ}$'
      - say: 'The boundary of a sector is two radii and the arc. So the perimeter is 2 r plus L, where L is the arc length.'
        write: 'Perimeter $= 2r + L$'
        point:
          - {figure: sketch, kind: highlight, target: OA, text: 'r', 'on': 'two radii'}
          - {figure: sketch, kind: highlight, target: OB, text: 'r', 'on': 'two radii'}
          - {figure: sketch, kind: circle, target: 'arc ?', text: 'L', 'on': 'and the arc'}
      - section: 'The arc'
        say: 'The length of arc is L equals theta over 360, times 2 pi r.'
        write: '$L = \dfrac{\theta}{360} \times 2\pi r$'
      - say: 'Now substitute, where theta is 45 and r is 8.'
        write: '$L = \dfrac{45}{360} \times 2 \times \pi \times 8$'
        point:
          - {line: 5, kind: move, from: {line: 2, at: '45'}, at: '360[[45]]', text: 'θ', 'on': 'theta is 45'}
      - say: '45 goes into 360 eight times, so 45 over 360 is 1 over 8. And 2 times 8 is 16.'
        write: '$= \dfrac{1}{8} \times 16\pi$'
      - say: '16 over 8 is 2, so the arc is 2 pi centimetres, and that is the crust the ant walks round.'
        write: '$= 2\pi$ cm'
        doodle_do:
          - {id: slice, op: move, part: ant, path: out, 'on': 'the crust'}
          - {id: slice, op: move, part: ant, path: round, 'on': 'the ant walks round'}
        point:
          - {figure: sketch, kind: label, target: 'arc ?', text: '2π cm', 'on': '2 pi centimetres'}
      - section: 'The perimeter'
        say: 'Back to the perimeter, which is 2 times 8, plus 2 pi.'
        write: 'Perimeter $= 2(8) + 2\pi$'
        doodle_do:
          - {id: slice, op: move, part: ant, path: back, 'on': 'Back to'}
        point:
          - {line: 8, kind: move, from: {line: 7, at: '2π'}, at: '+ 2π', text: 'arc', 'on': 'plus 2 pi'}
      - say: '2 times 8 is 16. Pi is left as it is, because the options keep pi.'
        write: '$= 16 + 2\pi$'
        doodle_do:
          - {id: slice, op: highlight, part: edges, text: '8 + 8 = 16', 'on': '2 times 8 is 16'}
      - say: 'Therefore the perimeter is 16 plus 2 pi centimetres.'
        write: '$\therefore$ perimeter $= 16 + 2\pi$ cm'
      - section: 'Check'
        say: 'Check the arc. 8 such slices make the whole circle. 8 times 2 pi is 16 pi, and 2 pi r is 2 times pi times 8, also 16 pi.'
        write: 'Check: $8 \times 2\pi = 16\pi = 2\pi(8)$ ✓'
      - section: 'Answer'
        say: 'So the perimeter is 16 plus 2 pi centimetres, which is answer choice C.'
        write: '$\therefore$ perimeter $= 16 + 2\pi$ cm (C)'
        answer: true
    traps:
      A: 'You went for 2 pi. That is the arc L on its own. The perimeter is 2 r plus L, so add the two radii to get 16 plus 2 pi.'
      B: 'You went for 8 plus 2 pi. That counts only one radius. A sector has two straight edges, so 2 r is 16, and the perimeter is 16 plus 2 pi.'
      D: 'You went for 16 plus 16 pi. That uses the whole circumference, 16 pi, as the arc. The sector is 45 over 360, or 1 over 8, of the circle, so L is 2 pi.'
  31:
    moments:
      - section: 'The question'
        say: 'We have a tangent touching a circle, and a triangle inside it. Many students take 180 minus 60 here. One theorem about tangents does the work. Let''s find angle $RTS$.'
        write: '$PTS$ is a tangent at $T$; find $\angle RTS$'
        point:
          - {figure: 0, kind: highlight, target: PS, text: 'tangent'}
      - section: 'Solution'
        say: 'Solution. The givens on the diagram are angle $QRT$, 60 degrees, and angle $QTR$, 50 degrees.'
        write: 'Solution: $\angle QRT = 60^{\circ},\ \angle QTR = 50^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: QRT, text: '60°'}
          - {figure: 0, kind: arc, target: QTR, text: '50°'}
      - say: 'First the third angle of triangle $QTR$, at $Q$. The angles of a triangle add up to 180 degrees.'
        write: '$\angle RQT = 180^{\circ} - (60^{\circ} + 50^{\circ})$ ($\angle$ sum of $\triangle$)'
        point:
          - {figure: 0, kind: arc, target: RQT, text: '?'}
      - say: '60 plus 50 is 110, and 180 minus 110 is 70.'
        write: '$= 180^{\circ} - 110^{\circ} = 70^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: RQT, text: '70°'}
      - say: 'Now the tangent $TS$ and the chord $TR$. The angle between them equals the angle in the alternate segment, the angle $TR$ makes at $Q$. This is the alternate segment theorem.'
        write: '$\angle RTS = \angle RQT$ (alt. segment theorem)'
        point:
          - {figure: 0, kind: highlight, target: TR, text: 'chord'}
          - {figure: 0, kind: arc, target: RTS}
      - say: 'Angle $RQT$ is the 70 degrees we found, so angle $RTS$ is 70 degrees.'
        write: '$\angle RTS = 70^{\circ}$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '= [[70∘]]'}, at: '70∘', text: 'angle RQT'}
          - {figure: 0, kind: label, target: '?', text: '70°'}
      - section: 'Check'
        say: 'Check with the chord $TQ$. By the same theorem, angle $PTQ$ equals angle $QRT$, which is 60 degrees.'
        write: 'Check: $\angle PTQ = \angle QRT = 60^{\circ}$ (alt. segment theorem)'
        point:
          - {figure: 0, kind: highlight, target: TQ, text: 'chord'}
          - {figure: 0, kind: arc, target: PTQ, text: '60°'}
      - say: 'The three angles at $T$ lie on the straight line $PTS$. 60 plus 50 plus 70 is 180. It agrees.'
        write: '$60^{\circ} + 50^{\circ} + 70^{\circ} = 180^{\circ}$ ($\angle$s on a str. line) $\checkmark$'
      - say: 'Therefore angle $RTS$ is 70 degrees, which is option B.'
        write: '$\therefore \angle RTS = 70^{\circ}$'
        answer: true
        point:
          - {figure: 0, kind: arc, target: RTS, text: '70°'}
    traps:
      A: 'You went for 120 degrees. That is 180 minus 60. By the alternate segment theorem, angle $RTS$ equals the angle at $Q$, which is 180 minus 60 minus 50, so 70.'
      C: 'You went for 60 degrees. That is the tangent-chord angle on the other side, angle $PTQ$, for chord $TQ$. For chord $TR$ and the tangent $TS$, the alternate segment gives the angle at $Q$, which is 70.'
      D: 'You went for 40 degrees. Check the triangle. 180 minus 60 minus 50 is 70, and by the alternate segment theorem angle $RTS$ equals that 70.'
  32:
    moments:
      - section: 'The question'
        say: 'We have three sides and no angle, and we want a height. Many students drop the root 6. Find the area by Heron''s formula first, then the height from half base times height.'
        write: 'Sides $6$ cm, $5$ cm, $7$ cm; height $h$ to the $7$ cm base'
        point:
          - {figure: 0, kind: circle, target: '7 cm', text: 'base'}
          - {figure: 0, kind: circle, target: h, text: 'height'}
      - section: 'Solution'
        say: 'Solution. Name the three sides, $a$ is 6, $b$ is 5 and $c$ is 7.'
        write: 'Solution. $a = 6,\ b = 5,\ c = 7$'
      - say: 'First the semi-perimeter, $s$, which is half the sum of the sides. 6 plus 5 plus 7 is 18, and half of 18 is 9.'
        write: '$s = \dfrac{a + b + c}{2} = \dfrac{6 + 5 + 7}{2} = 9$'
      - say: 'Heron''s formula gives the area of a triangle from its three sides.'
        write: 'Area $= \sqrt{s(s - a)(s - b)(s - c)}$ (Heron''s formula)'
      - say: 'Substitute $s$ equals 9 and the three sides.'
        write: '$= \sqrt{9(9 - 6)(9 - 5)(9 - 7)}$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: '= [[9]]'}, at: '[[9]](9 − 6)', text: 's'}
      - say: '9 minus 6 is 3, 9 minus 5 is 4, and 9 minus 7 is 2. 9 times 3 is 27, times 4 is 108, times 2 is 216.'
        write: '$= \sqrt{9 \times 3 \times 4 \times 2} = \sqrt{216}$'
      - say: 'Simplify the surd. 216 is 36 times 6, and the root of 36 is 6.'
        write: '$= \sqrt{36 \times 6} = 6\sqrt{6}\ \text{cm}^{2}$'
      - say: 'The same area is half the base times the height. The base is 7, and $h$ is the height to it.'
        write: 'Area $= \dfrac{1}{2} \times \text{base} \times \text{height} = \dfrac{1}{2} \times 7 \times h$'
        point:
          - {figure: 0, kind: circle, target: '7 cm', text: 'base'}
          - {figure: 0, kind: circle, target: h, text: 'height'}
      - say: 'Both give the same area. So 7 $h$ over 2 equals 6 root 6.'
        write: '$\dfrac{7h}{2} = 6\sqrt{6}$'
        point:
          - {line: 8, kind: move, from: {line: 6, at: '= [[66]]'}, at: '= [[66]]', text: 'Heron'}
      - say: 'Multiply both sides by 2. 2 times 6 root 6 is 12 root 6.'
        write: '$7h = 12\sqrt{6}$'
      - say: 'Divide both sides by 7.'
        write: '$h = \dfrac{12\sqrt{6}}{7}$ cm'
        point:
          - {figure: 0, kind: label, target: h, text: '(12/7)√6 cm'}
      - section: 'Check'
        say: 'Check the size. Root 6 is about 2.449, so $h$ is about 12 times 2.449 over 7, which is about 4.2 cm. That is shorter than both slanting sides, 5 and 6, as a height must be.'
        write: 'Check: $h \approx \dfrac{12 \times 2.449}{7} \approx 4.2$ cm $< 5$ cm $\checkmark$'
      - say: 'Therefore $h$ is 12 over 7, times root 6, centimetres, which is option B.'
        write: '$\therefore h = \dfrac{12}{7}\sqrt{6}$ cm'
        answer: true
    traps:
      A: 'You went for 12 over 7. That drops the root 6. The area is 6 root 6, not 6. And 12 over 7 is under 2 cm, far too short for a triangle with sides 5 and 6.'
      C: 'You went for 7 over 12. That is the fraction upside down, without the root 6. From $7h = 12\sqrt{6}$, divide by 7 to get $\tfrac{12}{7}\sqrt{6}$.'
      D: 'You went for half of root 51. That assumes the height cuts the 7 cm base in half, which happens only when the triangle is isosceles. Heron''s formula gives the area 6 root 6, and $h$ is 12 over 7 times root 6.'
  33:
    moments:
      - section: 'The question'
        say: 'A frustum is a cone with its tip cut off. Here the top is the wide end, so the cone it came from points downwards. We want the height of that whole cone.'
        write: 'Find the height of the cone.'
        point:
          - {figure: 0, kind: circle, target: h, text: 'frustum height', 'on': 'its tip cut off'}
      - say: 'Write Solution. Then complete the cone, so extend the sloping sides down until they meet at the vertex V. The small cone below the frustum is the tip that was cut off.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: V, text: 'vertex', 'on': 'the vertex V'}
      - section: 'What we know'
        say: 'Here are the givens. The top diameter is twice the bottom diameter, and the frustum is h cm high.'
        write: 'Top diameter $= 2 \times$ bottom diameter; height of frustum $= h$'
      - say: 'A radius is half a diameter, so the radii are in the same ratio. Let the bottom radius be r, and then the top radius is 2r.'
        write: 'Let bottom radius $= r$, so top radius $= 2r$'
        point:
          - {figure: sketch, kind: circle, target: r, text: 'bottom', 'on': 'bottom radius be r'}
          - {figure: sketch, kind: circle, target: 2r, text: 'top', 'on': 'top radius is 2r'}
      - say: 'Let the small cone, from the bottom face down to V, have height x. Then the whole cone is x plus h tall.'
        write: 'Let height of small cone $= x$, so height of cone $= x + h$'
        point:
          - {figure: sketch, kind: circle, target: x, text: 'small cone', 'on': 'have height x'}
      - section: 'Similar triangles'
        say: 'The small cone and the whole cone are similar, so their heights are in the same ratio as their radii, and x over x plus h equals r over 2r.'
        write: '$\dfrac{x}{x + h} = \dfrac{r}{2r}$ (similar $\triangle$s)'
      - say: 'The r cancels, so r over 2r is a half.'
        write: '$\dfrac{x}{x + h} = \dfrac{1}{2}$'
      - say: 'Cross-multiply, and 2 times x equals 1 times x plus h.'
        write: '$2x = x + h$'
      - say: 'Take x from both sides, so x equals h. The cut-off tip is as tall as the frustum.'
        write: '$x = h$'
        point:
          - {figure: sketch, kind: label, target: x, text: '= h', 'on': 'x equals h'}
      - section: 'The height'
        say: 'Now the whole cone is x plus h, and x is h. So it is h plus h, which is 2h.'
        write: 'Height of cone $= x + h = h + h = 2h$'
      - say: 'Therefore the height of the cone is 2h centimetres.'
        write: '$\therefore$ height of cone $= 2h$ cm'
      - section: 'Check'
        say: 'To check, from the small cone to the whole cone, the radius doubles from r to 2r. So the height must double too, from h to 2h.'
        write: 'Check: $\dfrac{2r}{r} = \dfrac{2h}{h} = 2$ ✓'
      - section: 'Answer'
        say: 'So the height of the cone is 2h, which is answer choice A.'
        write: '$\therefore$ height of cone $= 2h$ (A)'
        answer: true
    traps:
      B: 'You went for 2 pi h. A height found from similar triangles is a length, a ratio of lengths times h, and no pi comes into it. x equals h, so the cone is 2h.'
      C: 'You went for pi h. Pi belongs to circles, not to heights found by similar triangles. The cut-off tip is h tall, so the whole cone is 2h.'
      D: 'You went for pi h over 2. There is no pi in a height found from similar triangles. The tip is h and the frustum is h, so the cone is 2h.'
  34:
    moments:
      - section: 'The question'
        say: 'A point $P$ stays on one side of a line $XY$, and angle $XPY$ is always 90 degrees. Many students say "a circle". Read the words "one side" carefully. Let''s name its locus.'
        write: '$\angle XPY = 90^{\circ}$ always; $P$ on one side of $XY$'
      - section: 'Solution'
        say: 'Solution. A locus is the path traced by a moving point under a given condition. Let me sketch $XY$ and one position of $P$.'
        show_sketch: true
        write: 'Solution'
        point:
          - {figure: sketch, kind: arc, target: XPY, text: '90°'}
      - say: 'Picture a set square pushed against two nails at $X$ and $Y$, with a pencil at its right-angled corner. Where does the pencil go?'
        write: '$\angle XPY = 90^{\circ}$ at every position of $P$'
        doodle: {name: 'custom:1994_q34_a', id: sq, caption: 'a set square against two nails'}
      - say: 'Recall the circle theorem that the angle in a semicircle is a right angle. So every point that sees $XY$ at 90 degrees lies on the circle with $XY$ as diameter.'
        write: '$\therefore P$ is on the circle with diameter $XY$ ($\angle$ in a semicircle)'
        point:
          - {figure: sketch, kind: highlight, target: XY, text: 'diameter'}
      - say: 'Slide the set square along the nails. Its corner keeps to that circle, as the pencil shows.'
        write: 'Centre $=$ midpoint of $XY$, radius $= \tfrac{1}{2}XY$'
        doodle_do:
          - {id: sq, op: move, part: pen, path: trace}
      - say: 'But $P$ moves on one side of $XY$ only. $XY$ is a diameter, so it cuts the circle into two equal parts, and only one part is allowed.'
        write: 'One side of $XY$ only $\Rightarrow$ half the circle'
        point:
          - {figure: sketch, kind: circle, target: 'locus of P', text: 'one half'}
      - say: 'Half a circle is a semicircle, and that is the path the pencil draws.'
        write: 'Locus $=$ the semicircle on $XY$ as diameter'
        doodle_do:
          - {id: sq, op: stage, stage: 'custom:1994_q34_a2'}
      - section: 'Check'
        say: 'Check one point, the top of the semicircle. There the radius to $P$ is perpendicular to $XY$, making two isosceles right-angled triangles. Each gives 45 degrees at $P$, and 45 plus 45 is 90.'
        write: 'Check: top point: $\angle XPY = 45^{\circ} + 45^{\circ} = 90^{\circ}\ \checkmark$'
      - say: 'Therefore the locus of $P$ is a semicircle, which is option D.'
        write: '$\therefore$ locus of $P$: a semicircle'
        answer: true
        point:
          - {figure: sketch, kind: underline, target: 'locus of P', text: 'semicircle'}
    traps:
      A: 'You went for the perpendicular bisector of $XY$. That is the locus of points equidistant from $X$ and $Y$. A fixed right angle at $P$ puts $P$ on the circle with $XY$ as diameter.'
      B: 'You went for a right-angled triangle. Each position of $P$ does make a right-angled triangle $XPY$, but a locus is the path $P$ traces, which is half of the circle on $XY$.'
      C: 'You went for a circle. That is right only if $P$ could go on both sides of $XY$. $P$ stays on one side, so only half the circle counts, and that is a semicircle.'
  35:
    moments:
      - section: 'The question'
        say: 'M, at 4, $q$, is the mid-point of the line joining L, at $p$, negative 2, and N, at $q$, $p$. We want $p$ and $q$.'
        write: '$L(p,\ -2),\ N(q,\ p)$; mid-point $M(4,\ q)$'
      - section: 'Solution'
        say: 'Solution. Let me draw L, M and N, with M halfway along LN.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: M, text: 'mid-point'}
      - say: 'Label the end points first. Let $x$ 1, $y$ 1 be L, $p$, negative 2. Let $x$ 2, $y$ 2 be N, $q$, $p$.'
        write: 'Let $(x_{1},\ y_{1}) = (p,\ -2)$ and $(x_{2},\ y_{2}) = (q,\ p)$'
      - section: 'The formula'
        say: 'The mid-point formula says add the $x$ values and divide by 2, then add the $y$ values and divide by 2.'
        write: 'Mid-point $= \left(\dfrac{x_{1} + x_{2}}{2},\ \dfrac{y_{1} + y_{2}}{2}\right)$'
      - say: 'Substitute. This mid-point must be M, 4, $q$.'
        write: '$\left(\dfrac{p + q}{2},\ \dfrac{-2 + p}{2}\right) = (4,\ q)$'
      - section: 'Two equations'
        say: 'Equate the $x$-coordinates.'
        write: '$\dfrac{p + q}{2} = 4$'
      - say: 'Multiply both sides by 2. Call this equation 1.'
        write: '$p + q = 8 \quad \ldots (1)$'
      - say: 'Now equate the $y$-coordinates.'
        write: '$\dfrac{-2 + p}{2} = q$'
      - say: 'Multiply both sides by 2.'
        write: '$p - 2 = 2q$'
      - say: 'Add 2 to both sides, so that $p$ stands alone. Call this equation 2.'
        write: '$p = 2q + 2 \quad \ldots (2)$'
      - section: 'Solve'
        say: 'Substitute equation 2 into equation 1, so wherever we see $p$, write $2q$ plus 2.'
        write: 'Put (2) in (1): $(2q + 2) + q = 8$'
      - say: '$2q$ plus $q$ is $3q$.'
        write: '$3q + 2 = 8$'
      - say: 'Subtract 2 from both sides. 8 minus 2 is 6.'
        write: '$3q = 6$'
      - say: 'Divide both sides by 3.'
        write: '$\therefore\ q = 2$'
      - say: 'Put $q$ equals 2 into equation 2. 2 times 2 is 4, and 4 plus 2 is 6.'
        write: 'In (2): $p = 2(2) + 2 = 6$'
      - section: 'Check'
        say: 'Check. L is 6, negative 2, and N is 2, 6. 6 plus 2, over 2, is 4. Negative 2 plus 6, over 2, is 2. So M is 4, 2, which is 4, $q$.'
        write: 'Check: $\left(\dfrac{6 + 2}{2},\ \dfrac{-2 + 6}{2}\right) = (4,\ 2)\ \checkmark$'
        point:
          - {figure: sketch, kind: label, target: '(p, −2)', text: '(6, −2)'}
          - {figure: sketch, kind: label, target: '(q, p)', text: '(2, 6)'}
          - {figure: sketch, kind: label, target: '(4, q)', text: '(4, 2)'}
      - say: 'Therefore $p$ is 6 and $q$ is 2, which is answer choice D.'
        write: '$\therefore\ p = 6,\ q = 2$'
        answer: true
    traps:
      A: 'You went for $p$ equals 2 and $q$ equals 4. The values are swapped. Then the $y$ values, negative 2 and 2, give a mid-point $y$ of 0, not $q$. The equations give $q$ equals 2 and $p$ equals 6.'
      B: 'You went for $p$ equals 3 and $q$ equals 1. Then $p$ plus $q$ is 4, but equation 1 says $p$ plus $q$ is 8. Solving gives $p$ equals 6 and $q$ equals 2.'
      C: 'You went for $p$ equals 5 and $q$ equals 3. They satisfy equation 1, but not equation 2. 2 times 3, plus 2, is 8, not 5. Only $p$ equals 6 and $q$ equals 2 fit both.'
  36:
    moments:
      - section: 'The question'
        say: 'We want the equation of the straight line in the graph. Read two points from the graph. It cuts the $y$-axis at 0, 4 and the $x$-axis at 3, 0.'
        write: 'Line through $(0,\ 4)$ and $(3,\ 0)$'
        point:
          - {figure: 0, kind: circle, target: '(0, 4)'}
          - {figure: 0, kind: circle, target: '(3, 0)'}
      - section: 'Solution'
        say: 'Solution. Label the two points before using any formula. Let $x$ 1, $y$ 1 be 0, 4, and $x$ 2, $y$ 2 be 3, 0.'
        write: 'Solution: let $(x_{1},\ y_{1}) = (0,\ 4)$, $(x_{2},\ y_{2}) = (3,\ 0)$'
      - section: 'The gradient'
        say: 'The gradient, $m$, is the change in $y$ over the change in $x$.'
        write: '$m = \dfrac{y_{2} - y_{1}}{x_{2} - x_{1}}$'
      - say: 'Substitute, with 0 minus 4 on top and 3 minus 0 underneath.'
        write: '$= \dfrac{0 - 4}{3 - 0}$'
      - say: 'That gives negative 4 over 3. The gradient is negative, which fits the graph, because the line falls from left to right.'
        write: '$\therefore\ m = -\dfrac{4}{3}$'
        point:
          - {figure: 0, kind: label, target: {x: 190, y: 130}, text: 'falls left to right'}
      - section: 'The equation'
        say: 'A straight line is $y$ equals $mx$ plus $c$, where $c$ is the $y$-intercept, where the line cuts the $y$-axis.'
        write: '$y = mx + c$'
      - say: 'The line cuts the $y$-axis at 0, 4, so $c$ is 4.'
        write: '$c = 4$ ($y$-intercept)'
        point:
          - {figure: 0, kind: label, target: '(0, 4)', text: 'c = 4'}
      - say: 'Substitute $m$ equals negative 4 over 3, and $c$ equals 4.'
        write: '$y = -\dfrac{4}{3}x + 4$'
      - say: 'The options have no fractions, so multiply every term by 3. 3 times negative 4 over 3 $x$ is negative $4x$, and 3 times 4 is 12.'
        write: '$3y = -4x + 12$'
      - section: 'Check'
        say: 'Check with the other point, 3, 0. The left side, 3 times 0, is 0. The right side, negative 4 times 3, plus 12, is 0.'
        write: 'Check $(3,\ 0)$: $3(0) = 0$; $-4(3) + 12 = 0\ \checkmark$'
        point:
          - {figure: 0, kind: circle, target: '(3, 0)'}
      - say: 'Therefore the equation of the line is $3y$ equals negative $4x$ plus 12, which is answer choice C.'
        write: '$\therefore\ 3y = -4x + 12$'
        answer: true
    traps:
      A: 'You went for $3y$ equals $4x$ plus 12. That line rises from left to right, but the graph falls. The gradient is negative 4 over 3, so it is $3y$ equals negative $4x$ plus 12.'
      B: 'You went for $3y$ equals $3x$ plus 12. That has gradient 1, rising to the right. From 0, 4 to 3, 0 the gradient is negative 4 over 3.'
      D: 'You went for $3y$ equals negative $4x$ plus 9. The gradient is right, but at $x$ equals 0 it gives $y$ equals 3, not 4. With $c$ equal to 4, the constant is 3 times 4, which is 12.'
  37:
    moments:
      - section: 'The question'
        say: 'A watcher on a cliff 10 m high looks down at a boat. The angle of depression is 30 degrees. Many students put the 30 degrees at the wrong corner. Let''s place it properly.'
        write: 'Cliff $= 10$ m, angle of depression $= 30^{\circ}$, distance $= ?$'
        doodle: {name: 'custom:1994_q37_a', id: cliff, caption: 'a watcher looks down at a boat', size: scene}
      - section: 'Solution'
        say: 'Solution. Let me draw it, with the cliff $AB$, the boat $C$ on the sea, and a horizontal line from the top $A$, parallel to the sea.'
        write: 'Solution: horizontal at $A$ $\parallel$ sea $BC$'
        show_sketch: true
        'on': 'draw'
        point:
          - {figure: sketch, kind: highlight, target: AB, text: 'cliff, 10 m'}
          - {figure: sketch, kind: circle, target: horizontal}
      - say: 'An angle of depression is measured down from the horizontal at the eye, to the line of sight. Here it is from the horizontal at $A$ down to $AC$.'
        write: 'Angle of depression $= 30^{\circ}$ (down from the horizontal at $A$)'
        doodle_do:
          - {id: cliff, op: highlight, part: sight}
        point:
          - {figure: sketch, kind: highlight, target: AC, text: 'line of sight'}
      - say: 'The horizontal at $A$ and the sea are parallel, and $AC$ cuts both. So the angle at the boat is also 30 degrees, because they are alternate angles.'
        write: '$\angle ACB = 30^{\circ}$ (alt. $\angle$s)'
        point:
          - {figure: sketch, kind: arc, target: ACB, text: '30°'}
      - section: 'Label the sides'
        say: 'Let the distance $BC$ be $d$ metres. Now label the sides from the angle at $C$. The cliff, 10 m, is opposite. $d$ is adjacent. $AC$ is the hypotenuse.'
        write: 'Let $|BC| = d$: opp $= 10$, adj $= d$, hyp $= |AC|$'
        point:
          - {figure: sketch, kind: circle, target: '10 m', text: 'opp'}
          - {figure: sketch, kind: circle, target: d, text: 'adj'}
      - say: 'We have the opposite and we want the adjacent. In SOH CAH TOA, opposite and adjacent go together in TOA. Tan is opposite over adjacent.'
        write: 'TOA: $\tan\theta = \dfrac{\text{opp}}{\text{adj}}$'
      - say: 'Substitute, and tan 30 degrees equals 10 over $d$.'
        write: '$\tan 30^{\circ} = \dfrac{10}{d}$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: 'opp = [[10]]'}, at: 'd[[10]]', text: 'opp'}
      - say: 'Make $d$ the subject. Multiply both sides by $d$, then divide both sides by tan 30.'
        write: '$d = \dfrac{10}{\tan 30^{\circ}}$'
      - section: 'tan 30° without tables'
        say: 'Tan 30 needs no tables. Take an equilateral triangle of side 2 and cut it in half. The half has sides 1, root 3 and 2, with 30 degrees at the top.'
        write: 'Half of equilateral $\triangle$: sides $1,\ \sqrt{3},\ 2$'
        show_sketch: sketch_b
        'on': 'cut it in half'
        point:
          - {figure: sketch_b, kind: circle, target: '30°'}
      - say: 'From the 30 degree angle, the opposite side is 1 and the adjacent side is root 3. So tan 30 is 1 over root 3.'
        write: '$\tan 30^{\circ} = \dfrac{\text{opp}}{\text{adj}} = \dfrac{1}{\sqrt{3}}$'
        point:
          - {figure: sketch_b, kind: highlight, target: BD, text: 'opp = 1'}
          - {figure: sketch_b, kind: highlight, target: AD, text: 'adj = √3'}
      - section: 'Substitute'
        say: 'Put it in, so $d$ is 10 divided by 1 over root 3. Dividing by a fraction means multiplying by its reciprocal, root 3 over 1.'
        write: '$d = 10 \div \dfrac{1}{\sqrt{3}} = 10 \times \dfrac{\sqrt{3}}{1}$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '= [[31]]'}, at: '÷ [[31]]', text: 'tan 30°'}
      - say: 'Therefore $d$ is 10 root 3 metres.'
        write: '$\therefore d = 10\sqrt{3}$ m'
        doodle_do:
          - {id: cliff, op: label, part: dist, text: '10√3 m'}
        point:
          - {figure: sketch, kind: label, target: d, text: '10√3 m'}
      - section: 'Check'
        say: 'To check, root 3 is about 1.732, so $d$ is about 17.32 m. Then 10 over 17.32 is about 0.577, and tan 30 is 0.5774 from the tables. It agrees.'
        write: 'Check: $d \approx 17.32$, $\ \dfrac{10}{17.32} \approx 0.577 = \tan 30^{\circ}\ \checkmark$'
      - section: 'Answer'
        say: 'So the boat is 10 root 3 metres from the foot of the cliff, which is answer choice C.'
        write: '$\therefore$ Distance $= 10\sqrt{3}$ m'
        answer: true
        doodle_do:
          - {id: cliff, op: circle, part: dist}
    traps:
      A: 'You went for 5 root 3 over 3, about 2.9 m. That is 10 times tan 30, divided by 2. The working is $d = 10 \div \tan 30^{\circ} = 10\sqrt{3}$.'
      B: 'You went for 5 root 3. That treats the 10 m as the hypotenuse and uses cos 30. But 10 m is the cliff, opposite the angle at the boat, so we use TOA, and $d = 10\sqrt{3}$.'
      D: 'You went for 10 root 3 over 3, which is 10 times tan 30. That puts $d$ on top. Tan 30 is opposite over adjacent, 10 over $d$, so $d = 10 \div \tan 30^{\circ} = 10\sqrt{3}$.'
  38:
    moments:
      - section: 'The question'
        say: 'We need the value of sine of minus 690 degrees. A negative angle is measured clockwise from the positive $x$-axis.'
        write: 'Find $\sin(-690^{\circ})$'
      - section: 'Solution'
        say: 'Solution. A full turn is 360 degrees, and after a full turn we are back where we started. So adding 360 does not change the sine.'
        write: 'Solution: $\sin(\theta + 360^{\circ}) = \sin\theta$'
        doodle: {name: 'custom:1994_q38_a', id: frog, caption: 'hop 360 at a time', size: scene}
      - say: 'Add 360 once. Minus 690 plus 360 is minus 330. It is still negative.'
        write: '$-690^{\circ} + 360^{\circ} = -330^{\circ}$'
        doodle_do:
          - {id: frog, op: move, part: frog, path: hop1}
      - say: 'Add 360 again. Minus 330 plus 360 is 30 degrees.'
        write: '$-330^{\circ} + 360^{\circ} = 30^{\circ}$'
        doodle_do:
          - {id: frog, op: move, part: frog, path: hop2}
          - {id: frog, op: circle, part: end}
        point:
          - {line: 3, kind: move, from: {line: 2, at: '=[[−330∘]]'}, at: '[[−330∘]]+', text: 'again'}
          - {line: 3, kind: highlight, at: '=30', to: {doodle: frog, part: end}}
      - say: 'Two full turns take minus 690 degrees to 30 degrees, and the sine does not change.'
        write: '$\sin(-690^{\circ}) = \sin 30^{\circ}$'
        show_sketch: true
        'on': 'Two full turns'
        point:
          - {figure: sketch, kind: circle, target: '30°', text: 'ends at 30°'}
      - say: '30 degrees is between 0 and 90, which is the first quadrant, where All the ratios are positive. So the sine is positive.'
        write: '$0^{\circ} < 30^{\circ} < 90^{\circ}$: 1st quad., $\sin +$'
      - say: 'From the half equilateral triangle, with sides 1, root 3 and 2, sine 30 is opposite over hypotenuse, which is 1 over 2.'
        write: '$\sin 30^{\circ} = \dfrac{\text{opp}}{\text{hyp}} = \dfrac{1}{2}$'
      - say: 'Therefore sine of minus 690 degrees is a half.'
        write: '$\therefore \sin(-690^{\circ}) = \dfrac{1}{2}$'
        point:
          - {figure: sketch, kind: circle, target: '?', text: '½'}
      - section: 'Check'
        say: 'Check another way, with the rule sine of minus theta is minus sine theta. Then 690 minus 360 is 330.'
        write: 'Check: $\sin(-690^{\circ}) = -\sin 690^{\circ} = -\sin 330^{\circ}$'
      - say: '330 is in the 4th quadrant, where only cosine is positive, so sine is negative. The basic angle is 360 minus 330, which is 30 degrees.'
        write: '$\sin 330^{\circ} = -\sin 30^{\circ} = -\dfrac{1}{2}$'
      - say: 'So minus sine 330 is minus, minus a half, which is plus a half. It agrees.'
        write: '$-\left(-\dfrac{1}{2}\right) = \dfrac{1}{2}\ \checkmark$'
      - section: 'Answer'
        say: 'So the value is a half, which is answer choice D.'
        write: '$\therefore \dfrac{1}{2}$'
        answer: true
    traps:
      A: 'You went for root 3 over 2. That is sine 60 degrees. Adding two full turns brings minus 690 to 30 degrees, and sine 30 is a half.'
      B: 'You went for minus root 3 over 2. The angle reduces to 30 degrees, not 60, and it lands in the first quadrant, where sine is positive. Sine 30 is a half.'
      C: 'You went for minus a half. That stops at sine 330, which is minus a half, and forgets the minus from sine of minus theta. Two full turns give 30 degrees, in the first quadrant, so it is plus a half.'
  39:
    moments:
      - section: 'The question'
        say: 'There are two jobs here. Differentiate with respect to $t$, then put $t$ equals minus 1. Most slips come from the minus signs in the second job.'
        write: '$y = 3t^{3} + 2t^{2} - 7t + 3$'
      - section: 'Solution'
        say: 'Solution. The power rule says multiply by the power, then reduce the power by 1. Here the letter is $t$ instead of $x$.'
        'on': 'power rule'
        write: 'If $y = at^{n}$, $\ \dfrac{dy}{dt} = nat^{n-1}$'
      - say: 'Work term by term. 3 times 3 is 9, with power 2. 2 times 2 is 4, with power 1. Minus $7t$ gives minus 7. The constant 3 gives 0.'
        write: '$\dfrac{dy}{dt} = 3(3)t^{3-1} + 2(2)t^{2-1} - 7 + 0$'
        point:
          - {line: 1, kind: box, text: 'the rule'}
      - say: 'Tidy it up.'
        write: '$\dfrac{dy}{dt} = 9t^{2} + 4t - 7$'
      - section: 'At t = −1'
        say: 'Now substitute $t$ equals minus 1, with the minus 1 in brackets.'
        write: 'At $t = -1$, $\ \dfrac{dy}{dt} = 9(-1)^{2} + 4(-1) - 7$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '= [[9t2 + 4t − 7]]'}, at: '9(−1)2 + 4(−1) − 7', text: 'dy/dt'}
      - say: 'Minus 1 squared is plus 1, so 9 times 1 is 9. 4 times minus 1 is minus 4.'
        write: '$= 9(1) - 4 - 7$'
      - say: 'Minus 4 minus 7 is minus 11.'
        write: '$= 9 - 11$'
      - say: '9 minus 11 is minus 2.'
        write: '$= -2$'
      - say: 'Therefore $\dfrac{dy}{dt}$ at $t$ equals minus 1 is minus 2, which is answer choice C.'
        write: '$\therefore \dfrac{dy}{dt} = -2$ at $t = -1$'
        answer: true
    traps:
      A: 'You went for minus 1. Check the arithmetic. 9 times 1 is 9, 4 times minus 1 is minus 4, and 9 minus 4 minus 7 is minus 2.'
      B: 'You went for 1. Differentiate first to get $9t^{2} + 4t - 7$. At $t$ equals minus 1, that is 9 minus 4 minus 7, which is minus 2.'
      D: 'You went for 2. The size is right but the sign is lost. 9 minus 11 is minus 2.'
  40:
    moments:
      - section: 'The question'
        say: 'We want the point on the curve $y$ equals $2x$ squared minus $2x$ plus 3 where the gradient is 2.'
        write: '$y = 2x^{2} - 2x + 3$; gradient $= 2$; point $= ?$'
      - section: 'Solution'
        say: 'Solution. Let me draw the curve. It is a U-shaped curve, steep at the ends and flat at the bottom.'
        write: 'Solution'
        diagram:
          id: g
          kind: graph
          x: [-1, 3]
          y: [0, 15]
          x_step: 1
          y_step: 1
          plots:
            - {fn: '2x^2 - 2x + 3', label: 'y = 2x² − 2x + 3', colour: blue}
          'on': 'draw'
      - section: 'Differentiate'
        say: 'The gradient of a curve at any point is $dy$ by $dx$. So we differentiate $y$ with respect to $x$.'
        write: 'Gradient $= \dfrac{dy}{dx}$'
      - say: 'The rule is to multiply by the power, then reduce the power by 1. A constant gives 0.'
        write: '$\dfrac{d}{dx}\left(ax^{n}\right) = nax^{n - 1}$'
      - say: 'Work term by term. $2x$ squared gives 2 times $2x$. Negative $2x$ gives negative 2. The constant 3 gives 0.'
        write: '$\dfrac{dy}{dx} = 2(2x) - 2 + 0$'
      - say: '2 times $2x$ is $4x$.'
        write: '$= 4x - 2$'
      - section: 'Gradient equals 2'
        say: 'The gradient is 2, so put $dy$ by $dx$ equal to 2.'
        write: '$4x - 2 = 2$'
      - say: 'Add 2 to both sides. 2 plus 2 is 4.'
        write: '$4x = 4$'
      - say: 'Divide both sides by 4.'
        write: '$\therefore\ x = 1$'
      - section: 'The y-coordinate'
        say: 'The question wants the point, so we need $y$ too. Put $x$ equals 1 into the curve itself, not into $dy$ by $dx$.'
        write: 'When $x = 1$: $y = 2(1)^{2} - 2(1) + 3$'
      - say: '1 squared is 1, and 2 times 1 is 2. Then 2 minus 2 plus 3 is 3.'
        write: '$= 2 - 2 + 3 = 3$'
      - say: 'Therefore the point is 1, 3.'
        write: '$\therefore$ the point is $(1,\ 3)$'
        diagram_do:
          - {id: g, op: point, x: 1, part: 'plot:1', text: '(1, 3)', colour: green, 'on': 'point'}
      - section: 'Check'
        say: 'Check the gradient at $x$ equals 1. 4 times 1, minus 2, is 2. The line touching the curve there rises 2 for every 1 across.'
        write: 'Check: at $x = 1$, $\dfrac{dy}{dx} = 4(1) - 2 = 2\ \checkmark$'
        diagram_do:
          - {id: g, op: line, m: 2, c: 1, label: 'gradient 2 at (1, 3)', colour: purple, 'on': 'touching'}
      - say: 'Therefore the point where the gradient is 2 is 1, 3, which is answer choice A.'
        write: '$\therefore\ (x,\ y) = (1,\ 3)$'
        answer: true
    traps:
      B: 'You went for 2, 7. That point is on the curve, but the gradient there is 4 times 2, minus 2, which is 6, not 2. $4x$ minus 2 equals 2 gives $x$ equals 1.'
      C: 'You went for 0, 3. It is on the curve, but the gradient at $x$ equals 0 is negative 2, not 2. $4x$ minus 2 equals 2 gives $x$ equals 1, and then $y$ is 3.'
      D: 'You went for 3, 15. It is on the curve, but the gradient there is 4 times 3, minus 2, which is 10. The gradient is 2 only at $x$ equals 1.'
  41:
    moments:
      - section: 'The question'
        say: 'We have a fraction with a single power of $x$ underneath. The power rule works on one power of $x$ at a time, so we split the fraction first.'
        write: '$\displaystyle\int \dfrac{1 - x}{x^{3}}\,dx$'
      - section: 'Solution'
        say: 'Solution. Split it into two fractions over the same denominator, $x$ cubed.'
        write: '$\dfrac{1 - x}{x^{3}} = \dfrac{1}{x^{3}} - \dfrac{x}{x^{3}}$'
      - say: 'Write each as a power of $x$. 1 over $x$ cubed is $x$ to the minus 3. $x$ over $x$ cubed is $x$ to the 1 minus 3, which is $x$ to the minus 2.'
        write: '$= x^{-3} - x^{-2}$'
      - say: 'The rule is to add 1 to the power, and divide by the new power. Then add the constant of integration, which the options call $k$.'
        'on': 'add 1'
        write: '$\displaystyle\int x^{n}\,dx = \dfrac{x^{n+1}}{n+1} + k$'
      - say: 'Work term by term. For $x$ to the minus 3, the new power is minus 3 plus 1. For $x$ to the minus 2, it is minus 2 plus 1.'
        write: '$\displaystyle\int (x^{-3} - x^{-2})\,dx = \dfrac{x^{-3+1}}{-3+1} - \dfrac{x^{-2+1}}{-2+1} + k$'
        point:
          - {line: 3, kind: box, text: 'the rule'}
      - say: 'Minus 3 plus 1 is minus 2. Minus 2 plus 1 is minus 1.'
        write: '$= \dfrac{x^{-2}}{-2} - \dfrac{x^{-1}}{-1} + k$'
      - say: '$x$ to the minus 2 over minus 2 is minus 1 over $2x$ squared. Minus, $x$ to the minus 1 over minus 1, is plus 1 over $x$, because minus times minus is plus.'
        write: '$= -\dfrac{1}{2x^{2}} + \dfrac{1}{x} + k$'
      - say: 'Write the positive term first.'
        write: '$= \dfrac{1}{x} - \dfrac{1}{2x^{2}} + k$'
      - section: 'Check'
        say: 'Check by differentiating back. $x$ to the minus 1 gives minus $x$ to the minus 2. Minus a half $x$ to the minus 2 gives plus $x$ to the minus 3. That is $x$ to the minus 3 minus $x$ to the minus 2, where we started.'
        write: 'Check: $\dfrac{d}{dx}\left(x^{-1} - \tfrac{1}{2}x^{-2}\right) = -x^{-2} + x^{-3}\ \checkmark$'
      - say: 'Therefore the integral is 1 over $x$, minus 1 over $2x$ squared, plus $k$, which is answer choice C.'
        write: '$\therefore \displaystyle\int \dfrac{1 - x}{x^{3}}\,dx = \dfrac{1}{x} - \dfrac{1}{2x^{2}} + k$'
        answer: true
    traps:
      A: 'You went for $\dfrac{x - x^{2}}{x^{4}} + k$. That is the question with top and bottom multiplied by $x$, so nothing has been integrated. Split into $x^{-3} - x^{-2}$, then add 1 to each power.'
      B: 'You went for $\dfrac{4}{x^{4}} - \dfrac{3}{x^{3}} + k$. Those powers went down by 1, as in differentiation. Integrating adds 1 to the power, so $x^{-3}$ becomes $\dfrac{x^{-2}}{-2}$.'
      D: 'You went for $\dfrac{1}{3x^{3}} - \dfrac{1}{2x} + k$. The powers have not been raised by 1. $\displaystyle\int x^{-3}\,dx = \dfrac{x^{-2}}{-2}$ and $-\displaystyle\int x^{-2}\,dx = +x^{-1}$.'
  42:
    moments:
      - section: 'The question'
        say: 'This is a definite integral of a bracket squared, from minus 1 to 1. Let me draw the curve $y$ equals $2x$ plus 1, all squared.'
        write: '$\displaystyle\int_{-1}^{1}(2x + 1)^{2}\,dx$'
        diagram:
          id: g
          kind: graph
          x: [-2, 1.5]
          y: [-1, 10]
          plots:
            - {fn: '(2x + 1)^2', label: 'y = (2x + 1)²', colour: blue}
      - section: 'Solution'
        say: 'Solution. First expand the bracket. $2x$ plus 1, times $2x$ plus 1, gives $4x$ squared, plus $2x$, plus $2x$, plus 1.'
        write: 'Solution: $(2x + 1)^{2} = (2x + 1)(2x + 1) = 4x^{2} + 2x + 2x + 1 = 4x^{2} + 4x + 1$'
      - say: 'To integrate a power of $x$, add 1 to the power, and divide by the new power. Then add $c$, the constant of integration.'
        write: '$\displaystyle\int x^{n}\,dx = \dfrac{x^{n+1}}{n+1} + c$'
      - say: 'Integrate term by term. $4x$ squared becomes $4x$ cubed over 3. $4x$ becomes $4x$ squared over 2. And 1 becomes $x$. In a definite integral the $c$ cancels, so we leave it out.'
        write: '$\displaystyle\int_{-1}^{1}(4x^{2} + 4x + 1)\,dx = \left[\dfrac{4x^{3}}{3} + \dfrac{4x^{2}}{2} + x\right]_{-1}^{1}$'
        diagram_do:
          - {id: g, op: shade, part: 'plot:1', x: [-1, 1], text: 'Area = ?', colour: orange}
      - say: '4 over 2 is 2, so the middle term is $2x$ squared.'
        write: '$= \left[\dfrac{4x^{3}}{3} + 2x^{2} + x\right]_{-1}^{1}$'
      - section: 'Upper minus lower'
        say: 'Substitute the upper limit, 1, then subtract the value at the lower limit, minus 1. Put each in its own bracket.'
        write: '$= \left(\dfrac{4}{3} + 2 + 1\right) - \left(-\dfrac{4}{3} + 2 - 1\right)$'
      - say: 'In the first bracket, 4 over 3 plus 3 is 13 over 3. In the second, minus 4 over 3 plus 1 is minus 1 over 3.'
        write: '$= \dfrac{13}{3} - \left(-\dfrac{1}{3}\right)$'
      - say: 'Minus a negative is plus. 13 over 3 plus 1 over 3 is 14 over 3. 3 into 14 goes 4 times, remainder 2, so it is 4 and two thirds.'
        write: '$= \dfrac{13}{3} + \dfrac{1}{3} = \dfrac{14}{3} = 4\tfrac{2}{3}$'
        diagram_do:
          - {id: g, op: label, part: 'shade:1', text: 'Area = 4⅔', colour: green}
      - section: 'Check'
        say: 'Check by substitution. Let $u$ equal $2x$ plus 1, so $du$ equals 2 $dx$. When $x$ is minus 1, $u$ is minus 1. When $x$ is 1, $u$ is 3.'
        write: 'Check: let $u = 2x + 1$, $\ du = 2\,dx$; $\ x = -1 \Rightarrow u = -1,\ x = 1 \Rightarrow u = 3$'
      - say: 'Then the integral is a half times the integral of $u$ squared from minus 1 to 3, which is a half of 27 over 3 plus 1 over 3, and that is 14 over 3.'
        write: '$\dfrac{1}{2}\displaystyle\int_{-1}^{3}u^{2}\,du = \dfrac{1}{2}\left[\dfrac{u^{3}}{3}\right]_{-1}^{3} = \dfrac{1}{2}\left(\dfrac{27}{3} + \dfrac{1}{3}\right) = \dfrac{14}{3}\ \checkmark$'
      - say: 'Therefore the integral is 4 and two thirds, which is option D.'
        write: '$\therefore \displaystyle\int_{-1}^{1}(2x + 1)^{2}\,dx = 4\tfrac{2}{3}$'
        answer: true
    traps:
      A: 'You went for 3 and two thirds. That is 11 over 3, from a slip in the lower bracket. At minus 1 the value is minus 4 over 3 plus 2 minus 1, which is minus 1 over 3, and 13 over 3 minus minus 1 over 3 is 14 over 3.'
      B: 'You went for 4. That is 12 over 3. Upper minus lower is 13 over 3 minus minus 1 over 3, which is 14 over 3, or 4 and two thirds.'
      C: 'You went for 4 and a third. That is 13 over 3, the upper limit only. Subtract the lower value, minus 1 over 3, and 13 over 3 plus 1 over 3 is 14 over 3.'
  43:
    moments:
      - section: 'The question'
        say: 'The pie chart shows the grades students earned in a course. The $C_{4}$ sector is 43.2 degrees. We want the percentage of students who got $C_{4}$.'
        write: '$C_{4}$ sector $= 43.2^{\circ}$. Percentage $= ?$'
        point:
          - {figure: 0, kind: circle, target: '43.2°', text: 'C₄'}
      - section: 'Solution'
        say: 'Solution. The whole circle, 360 degrees, stands for all the students, 100 percent. So a sector''s percentage is its angle over 360, times 100.'
        write: 'Percentage $= \dfrac{\text{sectoral angle}}{360^{\circ}} \times 100\%$'
        doodle: {name: 'custom:1994_q43_a', id: hund, caption: 'the whole chart: 100 squares'}
        diagram: {id: t, kind: table, columns: [Grade, 'Sectoral angle', Percentage], rows: [[A₁, '144°', ''], [A₂, '72°', ''], [A₃, '64.8°', ''], [C₄, '43.2°', ''], [F, '36°', '']]}
      - say: 'Substitute the 43.2 degrees of the $C_{4}$ sector.'
        write: 'For $C_{4}$: $\dfrac{43.2}{360} \times 100\%$'
        point:
          - {line: 2, kind: move, from: {line: 0, at: '43.2'}, at: '43.2', text: 'given'}
      - say: 'Multiply the top and the bottom by 10 to clear the decimal, and we get 432 over 3600.'
        write: '$= \dfrac{432}{3600} \times 100\%$'
      - say: '100 over 3600 is 1 over 36, so this is 432 over 36. 36 times 12 is 432, so it is 12 percent, which is 12 of the 100 squares.'
        write: '$= \dfrac{432}{36}\% = 12\%$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:4,3', text: '12%', 'on': '12 percent'}
        doodle_do:
          - {id: hund, op: stage, stage: 'custom:1994_q43_a2'}
        point:
          - {line: 4, kind: highlight, at: '12%', to: {doodle: hund, part: c4}}
      - section: 'Check'
        say: 'Check with the other grades. In the same way, 144, 72 and 64.8 degrees give 40, 20 and 18 percent.'
        write: 'Others: $A_{1} = 40\%$, $\ A_{2} = 20\%$, $\ A_{3} = 18\%$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,3', text: '40%', 'on': '40'}
          - {id: t, op: fill, part: 'cell:2,3', text: '20%', 'on': '20'}
          - {id: t, op: fill, part: 'cell:3,3', text: '18%', 'on': '18 percent'}
      - say: 'And F, 36 degrees, is 36 over 360 of 100, which is 10 percent.'
        write: '$F = \dfrac{36}{360} \times 100\% = 10\%$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:5,3', text: '10%', 'on': '10 percent'}
      - say: '40 plus 20 plus 18 plus 12 plus 10 is 100 percent, so every student is counted.'
        write: '$40 + 20 + 18 + 12 + 10 = 100\%\ \checkmark$'
        doodle_do:
          - {id: hund, op: pulse, part: grid}
      - section: 'Answer'
        say: 'Therefore 12.0 percent of the students obtained a $C_{4}$ grade, which is answer choice D.'
        write: '$\therefore$ students with $C_{4} = 12.0\%$'
        answer: true
    traps:
      A: 'You went for 52.0. That is 40 plus 12, the $A_{1}$ and $C_{4}$ percentages together. The $C_{4}$ sector alone is 43.2 over 360, times 100, which is 12 percent.'
      B: 'You went for 43.2. That is the sectoral angle in degrees, not a percentage. Divide by 360 and multiply by 100 to get 12 percent.'
      C: 'You went for 40.0. That is the $A_{1}$ sector, since 144 over 360, times 100, is 40 percent. The $C_{4}$ sector, 43.2 degrees, is 12 percent.'
  44:
    moments:
      - section: 'The question'
        say: 'Every frequency here has $y$ in it, and the mean is 43 over 14. The method does not change. We make the table, then use the mean formula, which becomes an equation in $y$. Table first.'
        write: '$\bar{x} = \dfrac{43}{14}$; find $y$'
        diagram:
          id: t
          kind: table
          columns: ['x', 'f', 'fx']
          rows: [[1, 'y + 2', ''], [2, 'y − 1', ''], [3, '2y − 3', ''], [4, 'y + 4', ''], [5, '3y − 4', '']]
          'on': 'Table'
      - section: 'Solution'
        say: 'Solution. In the $fx$ column, 1 times $y$ plus 2 is $y$ plus 2. 2 times $y$ minus 1 is $2y$ minus 2. 3 times $2y$ minus 3 is $6y$ minus 9.'
        write: 'Solution'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,3', text: 'y + 2'}
          - {id: t, op: fill, part: 'cell:2,3', text: '2y − 2'}
          - {id: t, op: fill, part: 'cell:3,3', text: '6y − 9'}
      - say: '4 times $y$ plus 4 is $4y$ plus 16. 5 times $3y$ minus 4 is $15y$ minus 20.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:4,3', text: '4y + 16'}
          - {id: t, op: fill, part: 'cell:5,3', text: '15y − 20'}
      - say: 'Add down the $f$ column. For the $y$ terms, 1 plus 1 plus 2 plus 1 plus 3 is $8y$. For the numbers, 2, minus 1, minus 3, plus 4, minus 4 is minus 2.'
        write: '$\sum f = 8y - 2$'
      - say: 'Add down the $fx$ column. The $y$ terms give 1 plus 2 plus 6 plus 4 plus 15, which is $28y$. The numbers give 2, minus 2, minus 9, plus 16, minus 20, which is minus 13.'
        write: '$\sum fx = 28y - 13$'
      - section: 'The equation'
        say: 'The mean, $x$ bar, is the sum of $fx$ over the sum of $f$.'
        write: '$\bar{x} = \dfrac{\sum fx}{\sum f}$'
      - say: 'Substitute both sums, equal to 43 over 14.'
        write: '$\dfrac{28y - 13}{8y - 2} = \dfrac{43}{14}$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '28y−13'}, at: '8y−2[[28y−13]]', text: 'Σfx'}
          - {line: 6, kind: move, from: {line: 3, at: '8y−2'}, at: '[[8y−2]]28y', text: 'Σf'}
      - say: 'Cross-multiply, so 14 times the top on the left equals 43 times the bottom on the right.'
        write: '$14(28y - 13) = 43(8y - 2)$'
      - say: 'Expand both brackets. 14 times $28y$ is $392y$, and 14 times 13 is 182. 43 times $8y$ is $344y$, and 43 times 2 is 86.'
        write: '$392y - 182 = 344y - 86$'
      - say: 'Collect like terms, with the $y$ terms on the left and the numbers on the right.'
        write: '$392y - 344y = 182 - 86$'
      - say: '$392y$ minus $344y$ is $48y$, and 182 minus 86 is 96.'
        write: '$48y = 96$'
      - say: 'Divide both sides by 48. 96 over 48 is 2.'
        write: '$\therefore y = 2$'
      - section: 'Check'
        say: 'To check, with $y$ equal to 2, the frequencies are 4, 1, 1, 6 and 2, adding to 14. The $fx$ values are 4, 2, 3, 24 and 10, adding to 43. The mean is 43 over 14.'
        write: 'Check: $\sum f = 14,\ \sum fx = 43,\ \bar{x} = \dfrac{43}{14}$ ✓'
      - section: 'Answer'
        say: 'So $y$ is 2, which is option B.'
        write: '$\therefore y = 2$'
        answer: true
    traps:
      A: 'You went for 1. Then the frequency $2y$ minus 3 would be minus 1, which is impossible. The equation gives $48y = 96$, so $y$ is 2.'
      C: 'You went for 3. Then $\sum f$ is 22 and $\sum fx$ is 71, and 71 over 22 is not 43 over 14. The equation gives $y = 2$.'
      D: 'You went for 4. Then $\sum f$ is 30 and $\sum fx$ is 99, and 99 over 30 is not 43 over 14. The equation gives $48y = 96$, so $y$ is 2.'
  45:
    moments:
      - section: 'The question'
        say: 'Twelve positive numbers have a mean of 3. One more number is added and the mean jumps to 5. That one number has to carry a lot. How big is it?'
        write: 'Mean of 12 numbers $= 3$; mean of 13 numbers $= 5$'
        doodle: {name: 'custom:1994_q45_a', id: stacks, caption: 'twelve stacks and one more', size: scene}
      - section: 'Solution'
        say: 'Solution. The mean is the sum divided by the number of items. So the sum is the mean times the number.'
        write: 'Solution. Sum $=$ mean $\times$ number'
      - say: 'The sum of the twelve numbers is 3 times 12, which is 36.'
        write: 'Sum of 12 numbers $= 3 \times 12 = 36$'
        doodle_do:
          - {id: stacks, op: label, part: old, text: 'sum 36'}
      - say: 'The sum of the thirteen numbers is 5 times 13, which is 65.'
        write: 'Sum of 13 numbers $= 5 \times 13 = 65$'
      - say: 'Let the thirteenth number be $x$, the new stack in the empty slot.'
        write: 'Let the 13th number be $x$'
        doodle_do:
          - {id: stacks, op: stage, stage: 'custom:1994_q45_a2'}
      - say: 'The old sum plus $x$ makes the new sum, so 36 plus $x$ equals 65.'
        write: '$36 + x = 65$'
        point:
          - {line: 5, kind: move, from: {line: 2, at: '=[[36]]'}, at: '[[36]]+x', text: 'old sum'}
          - {line: 5, kind: move, from: {line: 3, at: '=[[65]]'}, at: '=[[65]]', text: 'new sum'}
      - say: 'Subtract 36 from both sides.'
        write: '$x = 65 - 36$'
      - say: '65 minus 36 is 29.'
        write: '$\therefore x = 29$'
        point:
          - {line: 7, kind: highlight, at: '29', to: {doodle: stacks, part: new}}
      - section: 'Check'
        say: 'Check. 36 plus 29 is 65, and 65 over 13 is 5, the new mean. Level the stacks, and the new one gives 2 to each of the twelve and keeps 5.'
        write: 'Check: $\dfrac{36 + 29}{13} = \dfrac{65}{13} = 5$ ✓'
        doodle_do:
          - {id: stacks, op: stage, stage: 'custom:1994_q45_a3'}
      - section: 'Answer'
        say: 'So the thirteenth number is 29, which is option A.'
        write: '$\therefore$ the 13th number $= 29$'
        answer: true
    traps:
      B: 'You went for 26. Check the sums. 5 times 13 is 65 and 3 times 12 is 36. 65 minus 36 is 29.'
      C: 'You went for 25. That does not come from the sums. The thirteen numbers add to 65 and the twelve to 36, so the new one is 29.'
      D: 'You went for 24, the extra 2 for each of the twelve numbers. The new number must also keep 5 for itself. 24 plus 5 is 29, the same as 65 minus 36.'
  46:
    moments:
      - section: 'The question'
        say: 'We have three numbers, 4, 5 and 9. The mean deviation is the average distance of the numbers from their mean. Picture them on a plank that balances at the mean.'
        write: 'Data: $4,\ 5,\ 9$; mean deviation $= ?$'
        doodle: {name: 'custom:1994_q46_a', id: plank, caption: 'the plank balances at the mean'}
      - section: 'Solution'
        say: 'Solution. The mean deviation, M.D., is the sum of the absolute deviations over $n$. Absolute means we ignore the minus sign.'
        write: 'M.D. $= \dfrac{\sum|x - \bar{x}|}{n}$'
      - say: 'The deviations need the mean. 4 plus 5 plus 9 is 18, and 18 over 3 is 6.'
        write: '$\bar{x} = \dfrac{4 + 5 + 9}{3} = \dfrac{18}{3} = 6$'
        doodle_do:
          - {id: plank, op: pulse, part: mean}
      - section: 'The deviation table'
        say: 'Now the table, with each $x$, its deviation $x$ minus $x$ bar, and the absolute deviation.'
        diagram:
          id: d
          kind: table
          columns: ['x', 'x − x̄', '|x − x̄|']
          rows: [[4, '', ''], [5, '', ''], [9, '', '']]
          'on': 'table'
      - say: '4 minus 6 is minus 2, so the distance is 2.'
        diagram_do:
          - {id: d, op: fill, part: 'cell:1,2', text: '−2'}
          - {id: d, op: fill, part: 'cell:1,3', text: '2'}
        doodle_do:
          - {id: plank, op: stage, stage: 'custom:1994_q46_a2'}
      - say: '5 minus 6 is minus 1, so the distance is 1.'
        diagram_do:
          - {id: d, op: fill, part: 'cell:2,2', text: '−1'}
          - {id: d, op: fill, part: 'cell:2,3', text: '1'}
        doodle_do:
          - {id: plank, op: stage, stage: 'custom:1994_q46_a3'}
      - say: '9 minus 6 is 3, so the distance is 3. Notice the plain deviations, minus 2, minus 1 and 3, add to 0. That is why we drop the signs.'
        diagram_do:
          - {id: d, op: fill, part: 'cell:3,2', text: '3'}
          - {id: d, op: fill, part: 'cell:3,3', text: '3'}
        doodle_do:
          - {id: plank, op: stage, stage: 'custom:1994_q46_a4'}
      - say: 'Add the last column, and 2 plus 1 plus 3 is 6.'
        write: '$\sum|x - \bar{x}| = 2 + 1 + 3 = 6$'
        diagram_do:
          - {id: d, op: total, part: 'col:3', 'on': 'Add'}
      - say: 'Substitute into the formula, which gives 6 over 3.'
        write: 'M.D. $= \dfrac{6}{3}$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '=[[6]]'}, at: '3[[6]]', text: 'Σ|x − x̄|'}
      - say: '6 over 3 is 2.'
        write: '$\therefore$ M.D. $= 2$'
      - section: 'Check'
        say: 'To check, the plain deviations add to 0, as they always must. Minus 2 plus minus 1 plus 3 is 0. So the mean, 6, was right.'
        write: 'Check: $-2 + (-1) + 3 = 0$ ✓'
      - section: 'Answer'
        say: 'So the mean deviation is 2, which is option B.'
        write: '$\therefore$ Mean deviation $= 2$'
        answer: true
    traps:
      A: 'You went for 0. That keeps the signs. Minus 2, minus 1 and 3 add to 0, as plain deviations always do. The mean deviation uses the absolute values, 2, 1 and 3, which give 6 over 3, so 2.'
      C: 'You went for 5, the middle number, the median. The mean deviation is the sum of the absolute deviations over $n$, and 6 over 3 is 2.'
      D: 'You went for 6. That is the mean, and also the sum of the absolute deviations. Divide that sum by $n$, 3, to get the mean deviation, 2.'
  47:
    moments:
      - section: 'The question'
        say: 'There are fifty values in five classes, and we want the middle one. The cumulative frequency finds the class that holds it, and a formula finds the spot inside the class. Table first.'
        write: 'Median $= ?$'
        diagram:
          id: t
          kind: table
          columns: ['Class', 'Class boundaries', 'f', 'cf']
          rows: [['1 – 5', '0.5 – 5.5', 6, ''], ['6 – 10', '5.5 – 10.5', 15, ''], ['11 – 15', '10.5 – 15.5', 20, ''], ['16 – 20', '15.5 – 20.5', 7, ''], ['21 – 25', '20.5 – 25.5', 2, '']]
          'on': 'Table'
      - section: 'Solution'
        say: 'Solution. The classes are whole numbers with gaps between them, so each class boundary sits halfway across the gap. Between 10 and 11, the boundary is 10.5.'
        write: 'Solution'
        diagram_do:
          - {id: t, op: highlight, part: 'col:2', text: 'halfway across each gap', 'on': 'boundary'}
      - say: 'Now the cf column, which is a running total of $f$ down the table. It goes 6, then 21, 41, 48 and 50.'
        diagram_do:
          - {id: t, op: total, part: 'col:3', into: 'col:4', 'on': 'running'}
      - say: 'The last cf is the total frequency. So $N$, the sum of $f$, is 50.'
        write: '$N = \sum f = 50$'
      - say: 'Half of $N$ is 50 over 2, which is 25. The median is the 25th value.'
        write: '$\dfrac{N}{2} = \dfrac{50}{2} = 25$'
      - say: 'Go down the cf column to the first class whose cf reaches 25. 21 is too small, but 41 passes it. So the median class is 11 to 15.'
        write: 'Median class: $11 - 15$'
        diagram_do:
          - {id: t, op: highlight, part: 'row:3', text: 'median class', 'on': 'median class'}
      - section: 'The formula'
        say: 'The median formula is $L_1$, plus $N$ over 2 minus cf, all over $f$, times $c$.'
        write: 'Median $= L_{1} + \left(\dfrac{\frac{N}{2} - cf}{f}\right) \times c$'
      - say: '$L_1$ is the lower class boundary of the median class, which is 10.5, not the class limit 11.'
        write: '$L_{1} = 10.5$'
        diagram_do:
          - {id: t, op: label, part: 'cell:3,2', text: 'L₁ = 10.5'}
      - say: 'cf is the cumulative frequency of the class before the median class, and that is 21.'
        write: '$cf = 21$'
        diagram_do:
          - {id: t, op: label, part: 'cell:2,4', text: 'class before'}
      - say: '$f$ is the frequency of the median class itself, which is 20.'
        write: '$f = 20$'
      - say: '$c$ is the class width, that is, upper boundary minus lower boundary. 15.5 minus 10.5 is 5.'
        write: '$c = 15.5 - 10.5 = 5$'
      - section: 'Substitute'
        say: 'Substitute the four values into the formula.'
        write: 'Median $= 10.5 + \left(\dfrac{25 - 21}{20}\right) \times 5$'
        point:
          - {line: 11, kind: move, from: {line: 7, at: '10.5'}, at: '[[10.5]]+', text: 'L₁'}
          - {line: 11, kind: move, from: {line: 8, at: '21'}, at: '25−[[21]]', text: 'cf'}
          - {line: 11, kind: move, from: {line: 9, at: '20'}, at: '[[20]]25', text: 'f'}
      - say: '25 minus 21 is 4. So it is 4 over 20, times 5.'
        write: '$= 10.5 + \dfrac{4}{20} \times 5$'
      - say: '4 over 20 times 5 is 20 over 20, which is 1.'
        write: '$= 10.5 + 1$'
      - say: '10.5 plus 1 is 11.5, which is 11 and a half.'
        write: '$\therefore$ Median $= 11.5 = 11\tfrac{1}{2}$'
      - section: 'Check'
        say: 'To check, the median must lie inside the median class, between 10.5 and 15.5. 11.5 does. It is near the start, because the 25th value is only the 4th of the 20 in that class.'
        write: 'Check: $10.5 < 11.5 < 15.5$ ✓'
      - section: 'Answer'
        say: 'So the median is 11 and a half, which is option B.'
        write: '$\therefore$ Median $= 11\tfrac{1}{2}$'
        answer: true
    traps:
      A: 'You went for 10 and a half. That is only $L_1$, the lower class boundary of the median class. We still add 4 over 20 times 5, which is 1, giving 11 and a half.'
      C: 'You went for 12 and a half. Check the substitution. $N$ over 2 minus cf is 25 minus 21, which is 4, and 4 over 20 times 5 is 1, not 2. So it is 10.5 plus 1.'
      D: 'You went for 13, the class mark of the median class 11 to 15. The class is right, but the formula places the median inside it, at 10.5 plus 4 over 20 times 5, which is 11.5.'
  48:
    moments:
      - section: 'The question'
        say: 'Two classes can have the same average and still be spread out very differently. Variance measures that spread. Here is the table, with $x$ from 1 to 5 and its frequencies.'
        write: 'Variance $= ?$'
        diagram:
          id: t
          kind: table
          columns: ['x', 'f', 'fx', 'x − x̄', '(x − x̄)²', 'f(x − x̄)²']
          rows: [[1, 2, '', '', '', ''], [2, 1, '', '', '', ''], [3, 2, '', '', '', ''], [4, 1, '', '', '', ''], [5, 2, '', '', '', '']]
          size: scene
          'on': 'table'
      - section: 'Solution'
        say: 'Solution. We build one table, column by column. First $f$ times $x$, then the deviation from the mean, its square, and $f$ times the square.'
        write: 'Solution'
      - section: 'The mean'
        say: 'First the $fx$ column, which is each $x$ times its frequency. 1 times 2 is 2. 2 times 1 is 2. 3 times 2 is 6.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,3', text: '2'}
          - {id: t, op: fill, part: 'cell:2,3', text: '2'}
          - {id: t, op: fill, part: 'cell:3,3', text: '6'}
      - say: '4 times 1 is 4, and 5 times 2 is 10.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:4,3', text: '4'}
          - {id: t, op: fill, part: 'cell:5,3', text: '10'}
      - say: 'Now add down the columns. The sum of $f$ is 2 plus 1 plus 2 plus 1 plus 2, which is 8. The sum of $fx$ is 2 plus 2 plus 6 plus 4 plus 10, which is 24.'
        write: '$\sum f = 8,\quad \sum fx = 24$'
        diagram_do:
          - {id: t, op: total, part: 'col:2', 'on': 'sum'}
          - {id: t, op: total, part: 'col:3', 'on': 'sum', on_nth: 2}
      - say: 'The mean, $x$ bar, is the sum of $fx$ over the sum of $f$.'
        write: '$\bar{x} = \dfrac{\sum fx}{\sum f}$'
      - say: 'Substitute, and we get 24 over 8.'
        write: '$= \dfrac{24}{8}$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '= [[24]]'}, at: '8[[24]]', text: 'Σfx'}
          - {line: 6, kind: move, from: {line: 4, at: '= [[8]],'}, at: '[[8]]24', text: 'Σf'}
      - say: '24 divided by 8 is 3. So the mean is 3.'
        write: '$\therefore \bar{x} = 3$'
      - section: 'The deviations'
        say: 'Now each row in turn. Take $x$ minus the mean, then square it, then times $f$. In row one, 1 minus 3 is minus 2. Squared, it is 4, and times 2, it is 8.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,4', text: '−2'}
          - {id: t, op: fill, part: 'cell:1,5', text: '4'}
          - {id: t, op: fill, part: 'cell:1,6', text: '8'}
      - say: 'In row two, 2 minus 3 is minus 1. Squared, it is 1, and times 1, it is 1.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:2,4', text: '−1'}
          - {id: t, op: fill, part: 'cell:2,5', text: '1'}
          - {id: t, op: fill, part: 'cell:2,6', text: '1'}
      - say: 'In row three, 3 minus 3 is 0. The square is 0, and 2 times 0 is 0. This value sits right on the mean.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:3,4', text: '0'}
          - {id: t, op: fill, part: 'cell:3,5', text: '0'}
          - {id: t, op: fill, part: 'cell:3,6', text: '0'}
      - say: 'Row four gives 4 minus 3, which is 1. Squared, it is 1, and times 1, it is 1.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:4,4', text: '1'}
          - {id: t, op: fill, part: 'cell:4,5', text: '1'}
          - {id: t, op: fill, part: 'cell:4,6', text: '1'}
      - say: 'Then row five, where 5 minus 3 is 2. Squared, it is 4, and times 2, it is 8. Squaring makes every deviation count as positive, so they cannot cancel out.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:5,4', text: '2'}
          - {id: t, op: fill, part: 'cell:5,5', text: '4'}
          - {id: t, op: fill, part: 'cell:5,6', text: '8'}
      - say: 'Add the last column, and 8 plus 1 plus 0 plus 1 plus 8 is 18.'
        write: '$\sum f(x - \bar{x})^{2} = 18$'
        diagram_do:
          - {id: t, op: total, part: 'col:6', 'on': 'last column'}
      - section: 'The variance'
        say: 'The variance is the sum of $f$ times the squared deviation, over the sum of $f$.'
        write: '$\sigma^{2} = \dfrac{\sum f(x - \bar{x})^{2}}{\sum f}$'
      - say: 'Substitute 18 on top and 8 below.'
        write: '$= \dfrac{18}{8}$'
        point:
          - {line: 15, kind: move, from: {line: 13, at: '18'}, at: '8[[18]]', text: 'Σf(x − x̄)²'}
          - {line: 15, kind: move, from: {line: 4, at: '= [[8]],'}, at: '[[8]]18', text: 'Σf'}
      - say: 'Divide the top and the bottom by 2. 18 over 8 is 9 over 4.'
        write: '$\therefore \sigma^{2} = \dfrac{9}{4}$'
      - section: 'Check'
        say: 'Check with the second formula, which is the sum of $f$ times $x$ squared, over the sum of $f$, minus the mean squared.'
        write: '$\sigma^{2} = \dfrac{\sum fx^{2}}{\sum f} - \bar{x}^{2}$'
      - say: 'Now $f$ times $x$ squared, row by row. 2 times 1 is 2, 1 times 4 is 4, 2 times 9 is 18, 1 times 16 is 16, and 2 times 25 is 50. They add up to 90.'
        write: '$\sum fx^{2} = 2 + 4 + 18 + 16 + 50 = 90$'
      - say: '90 over 8 is 11.25. Minus 3 squared, which is 9, leaves 2.25. And 9 over 4 is 2.25. It agrees.'
        write: '$\dfrac{90}{8} - 3^{2} = 11.25 - 9 = 2.25 = \dfrac{9}{4}\ \checkmark$'
      - section: 'Answer'
        say: 'So the variance is 9 over 4, which is option B.'
        write: '$\therefore$ Variance $= \dfrac{9}{4}$'
        answer: true
    traps:
      A: 'You went for 3 over 2. That is the square root of 9 over 4, which is the standard deviation. The question asks for the variance, and that is 18 over 8, which is 9 over 4, before any square root.'
      C: 'You went for 5 over 2, which is 2.5. The sum of $f(x - \bar{x})^{2}$ is 18 and the sum of $f$ is 8, so the variance is 18 over 8, which is 2.25, or 9 over 4.'
      D: 'You went for 3. That is the mean, 24 over 8. The variance goes on from the mean. The squared deviations give 18 over 8, which is 9 over 4.'
  49:
    moments:
      - section: 'The question'
        say: 'A class table gives the pupils by age, 10, 11 and 12 years. What is the probability that a pupil chosen at random is at least 11 years old?'
        write: '$P(\text{at least 11 years old}) = ?$'
      - say: 'Solution. Let $E$ be the event that the pupil is at least 11 years old. Copy the table first.'
        write: 'Solution: let $E$ = at least 11 years old'
        diagram:
          id: f
          kind: table
          'on': 'table'
          columns: ['Age (years)', 'No. of pupils']
          rows: [[10, 6], [11, 27], [12, 7]]
      - section: 'The sample space'
        say: 'Every pupil is equally likely to be chosen. n of $S$ is the total number of pupils, so 6 plus 27 plus 7, which is 40.'
        write: '$n(S) = 6 + 27 + 7 = 40$'
        diagram_do:
          - {id: f, op: total, part: 'col:2', text: '40', 'on': 'total number'}
      - section: 'The favourable outcomes'
        say: '"At least 11" means 11 or older. So the 11-year-olds and the 12-year-olds both count.'
        write: 'At least 11: age $11$ or $12$'
        diagram_do:
          - {id: f, op: highlight, part: 'row:2'}
          - {id: f, op: highlight, part: 'row:3'}
      - say: 'n of $E$ is 27 plus 7, which is 34.'
        write: '$n(E) = 27 + 7 = 34$'
      - section: 'The probability'
        say: 'The probability of $E$ is n of $E$ over n of $S$, that is, the number of favourable outcomes over the total number of possible outcomes.'
        write: '$P(E) = \dfrac{n(E)}{n(S)}$'
      - say: 'Substitute, and we get 34 over 40.'
        write: '$= \dfrac{34}{40}$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '= 34'}, at: '40[[34]]', text: 'n(E)'}
          - {line: 6, kind: move, from: {line: 2, at: '= 40'}, at: '[[40]]34', text: 'n(S)'}
      - say: 'Divide the top and the bottom by 2. 34 divided by 2 is 17, and 40 divided by 2 is 20.'
        write: '$= \dfrac{34 \div 2}{40 \div 2} = \dfrac{17}{20}$'
      - section: 'Check'
        say: 'Check with the complement. Only the 6 ten-year-olds are not at least 11, so P of $E$ complement is 6 over 40, which is 3 over 20.'
        write: 'Check: $P(E^{\prime}) = \dfrac{6}{40} = \dfrac{3}{20}$'
      - say: 'P of $E$ is 1 minus 3 over 20. That is 20 over 20 minus 3 over 20, which is 17 over 20. That is the same.'
        write: '$P(E) = 1 - \dfrac{3}{20} = \dfrac{17}{20}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the probability that the pupil is at least 11 years old is 17 over 20, which is option B.'
        write: '$\therefore P(E) = \dfrac{17}{20}$'
        answer: true
    traps:
      A: 'You went for 27 over 40. That counts only the 11-year-olds. "At least 11" takes in the 12-year-olds too, so n of E is 34, and 34 over 40 is 17 over 20.'
      C: 'You went for 33 over 40. That is 6 plus 27, the 10- and 11-year-olds. "At least 11" means 11 and 12, so it is 27 plus 7, which is 34.'
      D: 'You went for 3 over 20. That is P of E complement, the chance of a 10-year-old. Take it away from 1 to get 17 over 20.'
