      - say: 'Why the bars? Without them, negative 2, negative 1 and 3 would add to 0, which always happens with deviations from a mean: that is why the plank balances. The bars stop them cancelling.'
        write: 'Without bars: $\ -2 - 1 + 3 = 0$'
        doodle_do:
          - {id: plank, op: pulse, part: mean}
      - say: 'So the mean deviation is 2, which is answer choice B.'
        write: 'Mean deviation $= 2$'
        answer: true
    traps:
      A: 'You went for 0. That is what you get if you keep the signs: negative 2, negative 1 and positive 3 add to 0. That always happens, which is why we use distances, all positive. They add to 6, and 6 over 3 is 2.'
      C: 'You went for 5. That is the middle number, the median. The mean deviation is the average distance from the mean, 6: the distances 2, 1 and 3 average to 2.'
      D: 'You went for 6. That is the mean itself, and also the total of the distances. Divide that total, 6, by 3 to get the mean deviation, 2.'
  47:
    moments:
      - say: 'We want to estimate the median of this grouped frequency table.'
        write: '$\text{classes: } 1\text{–}5,\ 6\text{–}10,\ 11\text{–}15,\ 16\text{–}20,\ 21\text{–}25$'
      - say: 'First the total frequency: picture every value as a person in one long queue, in order. 6 plus 15 is 21, plus 20 is 41, plus 7 is 48, plus 2 is 50.'
        write: '$n = 6 + 15 + 20 + 7 + 2 = 50$'
        doodle: {name: 'person-small', id: queue, repeat: 50, layout: grid, caption: '50 in order'}
      - say: 'The median is the middle value. With 50 values, it sits at position 50 over 2, which is 25: the 25th person in the queue.'
        write: 'Median position $= \dfrac{n}{2} = \dfrac{50}{2} = 25$'
        doodle_do:
          - {id: queue, op: count, n: 25}
      - say: 'Now we find which class holds the 25th value, using running totals. Up to the class 1 to 5 there are 6 values. Adding the next class, 6 plus 15 is 21.'
        write: 'Up to $6\text{–}10$: $\ 6 + 15 = 21$'
        doodle_do:
          - {id: queue, op: group, n: 21, text: 'up to 6–10: 21'}
      - say: '21 is still short of 25, so add the next class: 21 plus 20 is 41, which passes 25.'
        write: 'Up to $11\text{–}15$: $\ 21 + 20 = 41$'
        doodle_do:
          - {id: queue, op: group, n: 41, text: 'up to 11–15: 41'}
      - say: 'So the 25th value lies in the class 11 to 15. That is the median class.'
        write: 'Median class: $11\text{–}15$'
      - say: 'To estimate where in that class it sits, we use the formula: $L$, plus $n$ over 2 minus $cf$, all over $f$, times $c$.'
        write: 'Median $= L + \left(\dfrac{\tfrac{n}{2} - cf}{f}\right)c$'
      - say: '$L$ is the lower class boundary. The classes are whole numbers, so the boundary between 10 and 11 is halfway, at 10.5. The class runs from 10.5 to 15.5, so its width $c$ is 5.'
        write: '$L = 10.5,\quad c = 15.5 - 10.5 = 5$'
      - say: '$cf$ is the running total before this class, the 21 we found. And $f$, the frequency of the class itself, is 20.'
        write: '$cf = 21,\quad f = 20$'
      - say: 'Now substitute: 10.5, plus 25 minus 21, over 20, times 5.'
        write: 'Median $= 10.5 + \left(\dfrac{25 - 21}{20}\right) \times 5$'
        point:
          - {line: 6, kind: box, text: 'the rule'}
          - {line: 9, kind: move, from: {line: 7, at: 'L = [[10.5]]'}, at: '10.5', text: 'L'}
          - {line: 9, kind: move, from: {line: 8, at: 'cf = [[21]]'}, at: '25 − [[21]]', text: 'cf'}
      - say: '25 minus 21 is 4.'
        write: '$= 10.5 + \dfrac{4}{20} \times 5$'
      - say: '4 over 20 times 5 is 20 over 20, which is 1.'
        write: '$= 10.5 + \dfrac{20}{20} = 10.5 + 1$'
      - say: '10.5 plus 1 is 11.5.'
        write: '$= 11.5$'
      - say: 'So the median is 11 and a half, which is answer choice B.'
        write: 'Median $= 11\tfrac{1}{2}$'
        answer: true
    traps:
      A: 'You went for 10 and a half. That is only the lower boundary of the median class. We still add the interpolation: 4 over 20 times 5, which is 1, giving 11 and a half.'
      C: 'You went for 12 and a half. Check the interpolation: we are 4 values into a class of 20, and 4 over 20 times 5 is 1, not 2. So it is 10.5 plus 1.'
      D: 'You went for 13, the middle of the class 11 to 15. The median sits only a little way into that class: 10.5 plus 4 over 20 of the width 5, which is 11.5.'
  48:
    moments:
      - section: 'The question'
        say: 'Two classes can have the same average and still be spread out very differently. Variance measures that spread. Here is the table: $x$ from 1 to 5, with its frequencies.'
        write: 'Variance $= ?$'
        diagram:
          id: t
          kind: table
          columns: ['x', 'f', 'fx', 'x − x̄', '(x − x̄)²', 'f(x − x̄)²']
          rows: [[1, 2, '', '', '', ''], [2, 1, '', '', '', ''], [3, 2, '', '', '', ''], [4, 1, '', '', '', ''], [5, 2, '', '', '', '']]
          size: scene
          'on': 'table'
      - section: 'Solution'
        say: 'Solution. We build one table, column by column: $f$ times $x$, then the deviation from the mean, its square, and $f$ times the square.'
        write: 'Solution'
      - section: 'The mean'
        say: 'First the $fx$ column: each $x$ times its frequency. 1 times 2 is 2. 2 times 1 is 2. 3 times 2 is 6.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,3', text: '2'}
          - {id: t, op: fill, part: 'cell:2,3', text: '2'}
          - {id: t, op: fill, part: 'cell:3,3', text: '6'}
      - say: '4 times 1 is 4, and 5 times 2 is 10.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:4,3', text: '4'}
          - {id: t, op: fill, part: 'cell:5,3', text: '10'}
      - say: 'Now add down the columns. The sum of $f$: 2 plus 1 plus 2 plus 1 plus 2 is 8. The sum of $fx$: 2 plus 2 plus 6 plus 4 plus 10 is 24.'
        write: '$\sum f = 8,\quad \sum fx = 24$'
        diagram_do:
          - {id: t, op: total, part: 'col:2', 'on': 'sum'}
          - {id: t, op: total, part: 'col:3', 'on': 'sum', on_nth: 2}
      - say: 'The mean, $x$ bar, is the sum of $fx$ over the sum of $f$.'
        write: '$\bar{x} = \dfrac{\sum fx}{\sum f}$'
      - say: 'Substitute: 24 over 8.'
        write: '$= \dfrac{24}{8}$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '= [[24]]'}, at: '8[[24]]', text: 'Σfx'}
          - {line: 6, kind: move, from: {line: 4, at: '= [[8]],'}, at: '[[8]]24', text: 'Σf'}
      - say: '24 divided by 8 is 3. So the mean is 3.'
        write: '$\therefore \bar{x} = 3$'
      - section: 'The deviations'
        say: 'Now each row in turn: $x$ minus the mean, then square it, then times $f$. Row one: 1 minus 3 is minus 2. Squared, 4. Times 2, 8.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,4', text: '−2'}
          - {id: t, op: fill, part: 'cell:1,5', text: '4'}
          - {id: t, op: fill, part: 'cell:1,6', text: '8'}
      - say: 'Row two: 2 minus 3 is minus 1. Squared, 1. Times 1, 1.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:2,4', text: '−1'}
          - {id: t, op: fill, part: 'cell:2,5', text: '1'}
          - {id: t, op: fill, part: 'cell:2,6', text: '1'}
      - say: 'Row three: 3 minus 3 is 0. The square is 0, and 2 times 0 is 0. This value sits right on the mean.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:3,4', text: '0'}
          - {id: t, op: fill, part: 'cell:3,5', text: '0'}
          - {id: t, op: fill, part: 'cell:3,6', text: '0'}
      - say: 'Row four: 4 minus 3 is 1. Squared, 1. Times 1, 1.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:4,4', text: '1'}
          - {id: t, op: fill, part: 'cell:4,5', text: '1'}
          - {id: t, op: fill, part: 'cell:4,6', text: '1'}
      - say: 'Row five: 5 minus 3 is 2. Squared, 4. Times 2, 8. Squaring makes every deviation count as positive, so they cannot cancel out.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:5,4', text: '2'}
          - {id: t, op: fill, part: 'cell:5,5', text: '4'}
          - {id: t, op: fill, part: 'cell:5,6', text: '8'}
      - say: 'Add the last column: 8 plus 1 plus 0 plus 1 plus 8 is 18.'
        write: '$\sum f(x - \bar{x})^{2} = 18$'
        diagram_do:
          - {id: t, op: total, part: 'col:6', 'on': 'last column'}
      - section: 'The variance'
        say: 'Variance is the sum of $f$ times the squared deviation, over the sum of $f$.'
        write: '$\sigma^{2} = \dfrac{\sum f(x - \bar{x})^{2}}{\sum f}$'
      - say: 'Substitute 18 on top and 8 below.'
        write: '$= \dfrac{18}{8}$'
        point:
          - {line: 15, kind: move, from: {line: 13, at: '18'}, at: '8[[18]]', text: 'Σf(x − x̄)²'}
          - {line: 15, kind: move, from: {line: 4, at: '= [[8]],'}, at: '[[8]]18', text: 'Σf'}
      - say: 'Divide the top and the bottom by 2. 18 over 8 is 9 over 4.'
        write: '$\therefore \sigma^{2} = \dfrac{9}{4}$'
      - section: 'Check'
        say: 'Check with the second formula: the sum of $f$ times $x$ squared, over the sum of $f$, minus the mean squared.'
        write: '$\sigma^{2} = \dfrac{\sum fx^{2}}{\sum f} - \bar{x}^{2}$'
      - say: '$f$ times $x$ squared, row by row: 2 times 1 is 2, 1 times 4 is 4, 2 times 9 is 18, 1 times 16 is 16, 2 times 25 is 50. They add up to 90.'
        write: '$\sum fx^{2} = 2 + 4 + 18 + 16 + 50 = 90$'
      - say: '90 over 8 is 11.25. Minus 3 squared, which is 9, leaves 2.25. And 9 over 4 is 2.25. It agrees.'
        write: '$\dfrac{90}{8} - 3^{2} = 11.25 - 9 = 2.25 = \dfrac{9}{4}\ \checkmark$'
      - section: 'Answer'
        say: 'So the variance is 9 over 4, which is option B.'
        write: '$\therefore$ Variance $= \dfrac{9}{4}$'
        answer: true
    traps:
      A: 'You went for 3 over 2. That is the square root of 9 over 4, which is the standard deviation. The question asks for the variance: 18 over 8, which is 9 over 4, before any square root.'
      C: 'You went for 5 over 2, which is 2.5. The sum of $f(x - \bar{x})^{2}$ is 18 and the sum of $f$ is 8, so the variance is 18 over 8, which is 2.25, that is 9 over 4.'
      D: 'You went for 3. That is the mean, 24 over 8. The variance goes on from the mean: the squared deviations give 18 over 8, which is 9 over 4.'
  49:
    moments:
      - say: 'The table shows the ages of pupils in a class: picture pupils wearing age badges, 10, 11 and 12. We want the probability that a pupil chosen at random is at least 11 years old.'
        write: 'Age $10$: $6$ pupils; age $11$: $27$; age $12$: $7$'
        doodle: {name: 'custom:1994_q49_a', id: badges, caption: 'ages 10, 11 and 12'}
      - say: 'Probability means the number of pupils who fit, over the total number of pupils, because each pupil is equally likely to be chosen. So we need both numbers.'
        write: 'Probability $= \dfrac{\text{number who fit}}{\text{total}}$'
      - say: 'First, how many pupils are there in all? 6 plus 27 is 33, plus 7 is 40: here is the whole class.'
        write: 'Total $= 6 + 27 + 7 = 40$'
        doodle: {name: 'student-small', id: cls, repeat: 40, layout: grid, caption: 'the class of 40'}
      - say: '"At least 11" means 11 or older. So the 11-year-olds and the 12-year-olds both count: the two badges in the bracket.'
        write: 'At least $11$ means age $11$ or $12$'
        doodle_do:
          - {id: badges, op: highlight, part: atleast}
      - say: 'That is 27 plus 7, which is 34 pupils: split the class, 6 on one side and 34 on the other.'
        write: 'Number who fit $= 27 + 7 = 34$'
        doodle_do:
          - {id: cls, op: split, n: 6, text: 'age 10: 6 | 11 or 12: 34'}
        point:
          - {line: 4, kind: highlight, at: '34', to: {doodle: badges, part: atleast}}
      - say: 'Now put the 34 over the total, 40.'
        write: 'Probability $= \dfrac{34}{40}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '= [[34]]'}, at: '40[[34]]', text: 'who fit'}
          - {line: 5, kind: move, from: {line: 2, at: '= [[40]]'}, at: '[[40]]34', text: 'total'}
      - say: 'Divide the top and bottom by 2. 34 divided by 2 is 17, and 40 divided by 2 is 20.'
        write: '$= \dfrac{34 \div 2}{40 \div 2} = \dfrac{17}{20}$'
      - say: 'Check with the opposite event. Only the 6 ten-year-olds, the first badge, do not fit, so the probability is 1 minus 6 over 40.'
        write: 'Check: $\ 1 - \dfrac{6}{40}$'
        doodle_do:
          - {id: badges, op: cross, part: p10}
      - say: '6 over 40 is 3 over 20, and 1 minus 3 over 20 is 20 over 20 minus 3 over 20, which is 17 over 20. The same answer.'
        write: '$= 1 - \dfrac{3}{20} = \dfrac{20}{20} - \dfrac{3}{20} = \dfrac{17}{20}$'
      - say: 'So the probability is 17 over 20, which is answer choice B.'
        write: 'Probability $= \dfrac{17}{20}$'
        answer: true
    traps:
      A: 'You went for 27 over 40. That counts only the 11-year-olds. "At least 11" includes the 12-year-olds too, so it is 34 over 40, which is 17 over 20.'
      C: 'You went for 33 over 40. That is 6 plus 27, the 10- and 11-year-olds. "At least 11" means 11 and 12, which is 27 plus 7, so 34.'
      D: 'You went for 3 over 20. That is the probability of the opposite event, a 10-year-old. Take it away from 1 to get 17 over 20.'
