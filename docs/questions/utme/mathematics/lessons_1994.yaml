          - {figure: 0, kind: 'arc', target: 'PSR', text: '150°'}
      - say: 'Subtract 50 from both sides. 150 minus 50 is 100.'
        write: '$\angle PSQ = 150^{\circ} - 50^{\circ} = 100^{\circ}$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '+ 50∘'}, at: '− 50∘', text: 'across the ='}
          - {figure: 0, kind: label, target: '?', text: '100°'}
      - say: 'Let''s check with triangle $PQS$. $PQ$ is parallel to $SR$, so angles $SPQ$ and $PSR$ are co-interior and add to 180. That makes angle $SPQ$ 180 minus 150, which is 30 degrees.'
        write: '$\angle SPQ = 180^{\circ} - 150^{\circ} = 30^{\circ}$'
        point:
          - {figure: 0, kind: 'arc', target: 'SPQ', text: '30°'}
      - say: 'Then the triangle''s angles are 30, 50 and 100, and 30 plus 50 plus 100 is 180. Good.'
        write: 'Triangle $PQS$: $\ 30^{\circ} + 50^{\circ} + 100^{\circ} = 180^{\circ}$'
        point:
          - {figure: 0, kind: 'arc', target: 'PSQ', text: '100°'}
      - say: 'So angle $PSQ$ is 100 degrees, which is answer choice A.'
        write: '$\angle PSQ = 100^{\circ}$'
        answer: true
        point:
          - {figure: 0, kind: 'label', target: '?', text: '100°'}
    traps:
      B: 'You went for 80 degrees. That is 180 minus 100, the angle on the other side. Angle $PSR$ is 150 degrees, and taking away the 50 degrees of angle $QSR$ leaves 100.'
