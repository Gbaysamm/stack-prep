        write: 'Test $x = -3$: is $-3 > 4$? No'
      - say: 'So neither number passes both tests. $S$ has no elements at all.'
        write: '$n(S) = 0$'
      - say: 'A set with no elements is called the empty set. We write it as a circle with a slash through it.'
        write: 'Empty set: $\varnothing$'
      - say: 'Be careful here. The number 0 is not a set at all, and the set containing 0 has one element in it. The empty set has nothing in it.'
        write: '$\varnothing \neq \{0\},\quad \varnothing \neq 0$'
      - say: 'So $S$ is the empty set, which is answer choice C.'
        write: '$S = \varnothing$'
        answer: true
    traps:
