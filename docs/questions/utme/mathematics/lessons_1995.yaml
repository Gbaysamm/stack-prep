  44:
    moments:
      - say: 'We have eight numbers: 0.20, 1.00, 0.90, 1.40, 0.80, 0.80, 1.20 and 1.10. Picture them as bars. $m$ is their mean and $r$ is their range. We want $m$ plus $r$.'
        write: '$0.20,\ 1.00,\ 0.90,\ 1.40,\ 0.80,\ 0.80,\ 1.20,\ 1.10$'
        doodle: {name: 'custom:1995_q44_a', id: bars, caption: 'eight numbers as bars'}
      - say: 'First the mean: the total divided by how many numbers there are. Let''s group them to make the adding easier. 0.20 plus 0.80 plus 0.80 is 1.80.'
        write: '$0.20 + 0.80 + 0.80 = 1.80$'
      - say: 'Next, 1.00 plus 1.20 is 2.20.'
        write: '$1.00 + 1.20 = 2.20$'
      - say: 'Then 0.90 plus 1.10 is 2.00. The only number left over is 1.40.'
        write: '$0.90 + 1.10 = 2.00$'
      - say: 'Now add the three groups and the 1.40. 1.80 plus 2.20 is 4.00, plus 2.00 is 6.00, plus 1.40 is 7.40.'
        write: 'Total $= 1.80 + 2.20 + 2.00 + 1.40 = 7.40$'
      - say: 'Count the numbers: there are 8 of them.'
        write: '$n = 8$'
      - say: 'The mean is the sum of the values divided by how many values there are.'
        write: 'Mean $= \dfrac{\text{sum of the values}}{\text{number of values}}$'
      - say: 'So the mean is the total, 7.40, divided by 8.'
        write: '$m = \dfrac{7.40}{8}$'
        point:
          - {line: 7, kind: move, from: {line: 4, at: '= 7.40'}, at: '7.40', text: 'total'}
          - {line: 7, kind: move, from: {line: 5, at: '= 8'}, at: '[[8]]7.40', text: 'how many'}
      - say: '8 times 0.9 is 7.2, which leaves 0.2. And 0.2 divided by 8 is 0.025. So the mean is 0.9 plus 0.025, which is 0.925: the level the bars would share if we evened them out.'
        write: '$= 0.9 + 0.025 = 0.925$'
        point:
          - {line: 8, kind: highlight, at: '0.925', to: {doodle: bars, part: mean}}
        doodle_do:
          - {id: bars, op: stage, stage: 'custom:1995_q44_a2'}
      - say: 'The range is the highest value minus the lowest value.'
        write: 'Range $= \text{highest value} - \text{lowest value}$'
      - say: 'Now the range: the tallest bar minus the shortest. The largest is 1.40 and the smallest is 0.20.'
        write: '$r = 1.40 - 0.20$'
        doodle_do:
          - {id: bars, op: circle, part: tallest}
          - {id: bars, op: circle, part: shortest}
      - say: '1.40 minus 0.20 is 1.20: the gap from the shortest bar up to the tallest.'
        write: '$= 1.20$'
        doodle_do:
          - {id: bars, op: arrow, part: shortest, to_part: tallest, text: 'range 1.20'}
      - say: 'Now add the mean and the range we found.'
        write: '$m + r = 0.925 + 1.20$'
