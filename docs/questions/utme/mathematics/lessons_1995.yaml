        write: 'Stretches: $x < 3,\ \ 3 < x < 4,\ \ x > 4$'
      - say: 'Middle stretch: try 3.5. 3.5 minus 3 is 0.5, and 3.5 minus 4 is minus 0.5.'
        write: '$x = 3.5:\ (3.5 - 3)(3.5 - 4) = (0.5)(-0.5)$'
