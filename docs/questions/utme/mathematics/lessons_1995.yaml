        write: 'Same longitude: great circle, $R = 7000$ km'
        point:
          - {figure: sketch, kind: underline, target: 'R = 7000 km'}
      - say: 'The angle between the towns at the centre of the earth is the difference in their latitudes. Both are north, so we subtract.'
        write: '$\theta = 45^{\circ} - 15^{\circ}$'
        point:
