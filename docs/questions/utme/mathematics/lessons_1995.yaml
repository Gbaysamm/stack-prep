  45:
    moments:
      - say: 'We want the standard deviation of this grouped data: classes 1 to 3, 4 to 6 and 7 to 9, with frequencies 5, 8 and 5.'
        write: 'Classes $1$–$3$, $4$–$6$, $7$–$9$; frequencies $5,\ 8,\ 5$'
      - say: 'For grouped data, each class is represented by its mid-point. The middle of 1 to 3 is 1 plus 3, over 2, which is 2.'
        write: 'Mid-point of $1$–$3$: $\dfrac{1 + 3}{2} = 2$'
      - say: 'In the same way, 4 to 6 gives 4 plus 6 over 2, which is 5, and 7 to 9 gives 7 plus 9 over 2, which is 8. Picture a see-saw with stacks of 5, 8 and 5 at those mid-points.'
        write: '$\dfrac{4 + 6}{2} = 5,\quad \dfrac{7 + 9}{2} = 8$'
        doodle: {name: 'custom:1995_q45_a', id: seesaw, caption: '5 at 2, 8 at 5, 5 at 8'}
      - say: 'The total frequency is 5 plus 8 plus 5, which is 18.'
        write: '$\sum f = 5 + 8 + 5 = 18$'
      - say: 'Now the mean. Multiply each mid-point by its frequency: 2 times 5 is 10, 5 times 8 is 40, and 8 times 5 is 40. They add to 90.'
        write: '$\sum fx = 2(5) + 5(8) + 8(5) = 10 + 40 + 40 = 90$'
      - say: 'For a frequency table, the mean is the sum of $f$ times $x$, divided by the sum of the frequencies.'
        write: 'Mean: $\bar{x} = \dfrac{\sum fx}{\sum f}$'
      - say: 'Divide by the total frequency, 18. 90 divided by 18 is 5. So the mean is 5: the see-saw balances at 5.'
        write: '$\bar{x} = \dfrac{90}{18} = 5$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '= 90'}, at: '90', text: 'Σfx'}
          - {line: 6, kind: move, from: {line: 3, at: '= 18'}, at: '18', text: 'Σf'}
        doodle_do:
          - {id: seesaw, op: circle, part: fulcrum, text: 'balances at 5'}
      - say: 'Next, how far each mid-point is from that mean of 5. 2 minus 5 is minus 3, 5 minus 5 is 0, and 8 minus 5 is 3: the two outer stacks are each 3 from the balance point.'
        write: 'Deviations: $2 - 5 = -3,\ \ 5 - 5 = 0,\ \ 8 - 5 = 3$'
        doodle_do:
          - {id: seesaw, op: label, part: left, text: '3 away'}
          - {id: seesaw, op: label, part: right, text: '3 away'}
      - say: 'Square those. Minus 3 squared is 9, 0 squared is 0, and 3 squared is 9.'
        write: 'Squared: $(-3)^{2} = 9,\ \ 0^{2} = 0,\ \ 3^{2} = 9$'
      - say: 'Multiply each square by its frequency and add: 9 times 5 is 45, 0 times 8 is 0, and 9 times 5 is 45. The total is 90.'
        write: '$\sum f(x - \bar{x})^{2} = 9(5) + 0(8) + 9(5) = 45 + 0 + 45 = 90$'
      - say: 'For a frequency table, the variance is the sum of each frequency times the squared deviation, divided by the total frequency.'
        write: 'Variance $= \dfrac{\sum f(x - \bar{x})^{2}}{\sum f}$'
      - say: 'The variance is that total divided by the total frequency: 90 over 18, which is 5.'
        write: 'Variance $= \dfrac{90}{18} = 5$'
        point:
          - {line: 11, kind: move, from: {line: 9, at: '= 90'}, at: '90', text: 'from here'}
          - {line: 11, kind: move, from: {line: 3, at: '= 18'}, at: '18', text: 'Σf'}
      - say: 'The standard deviation is the square root of the variance.'
        write: 'Standard deviation $= \sqrt{\text{variance}}$'
      - say: 'So it is root 5, which is answer choice D.'
        write: 'Standard deviation $= \sqrt{5}$'
        answer: true
    traps:
      A: 'You went for 0.5. That is far too small for data spread from 2 to 8. The variance is 90 over 18, which is 5, and the standard deviation is root 5.'
      B: 'You went for root 6. That comes from dividing 90 by 15. Divide by the total frequency, 5 plus 8 plus 5, which is 18.'
      C: 'You went for 5 over 3. Check the steps: the squared deviations weighted by frequency add to 90, divide by 18 to get 5, then take the square root.'

  46:
    moments:
      - say: 'We want the variance of the scores 1, 2, 3, 4 and 5. Here they are as dots on a line.'
        write: 'Scores: $1,\ 2,\ 3,\ 4,\ 5$'
        doodle: {name: 'custom:1995_q46_a', id: line, caption: 'five scores on a line'}
      - say: 'Variance measures spread: it is the average of the squared distances from the mean. So first we need the mean. 1 plus 2 plus 3 plus 4 plus 5 is 15.'
        write: '$\sum x = 1 + 2 + 3 + 4 + 5 = 15$'
      - say: 'The mean is the sum of the values divided by how many values there are.'
        write: 'Mean: $\bar{x} = \dfrac{\sum x}{n}$'
      - say: 'There are 5 scores, so the mean is 15 divided by 5, which is 3: the middle dot.'
        write: '$\bar{x} = \dfrac{15}{5} = 3$'
        doodle_do:
          - {id: line, op: circle, part: mean, text: 'mean 3'}
      - say: 'Now how far each score is from that mean of 3. 1 minus 3 is minus 2, 2 minus 3 is minus 1, 3 minus 3 is 0, 4 minus 3 is 1, and 5 minus 3 is 2.'
        write: 'Deviations from $3$: $-2,\ -1,\ 0,\ 1,\ 2$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '= 3'}, at: '3', text: 'the mean'}
      - say: 'Why not just add these? Minus 2, minus 1, 0, 1 and 2 add up to zero, which tells us nothing. Squaring makes every distance count.'
        write: 'Unsquared: $-2 - 1 + 0 + 1 + 2 = 0$'
      - say: 'So square each one. Watch each distance become a square: minus 2 squared is 4, minus 1 squared is 1, 0 squared is 0, 1 squared is 1, and 2 squared is 4.'
        write: 'Squared: $4,\ 1,\ 0,\ 1,\ 4$'
        doodle_do:
          - {id: line, op: stage, stage: 'custom:1995_q46_a2'}
      - say: 'Add up the squares. 4 plus 1 plus 0 plus 1 plus 4 is 10.'
        write: '$\sum (x - \bar{x})^{2} = 4 + 1 + 0 + 1 + 4 = 10$'
        doodle_do:
          - {id: line, op: label, part: squares, text: '4 + 1 + 0 + 1 + 4 = 10'}
      - say: 'The variance is the mean of the squared deviations: square each value''s distance from the mean, add them up, and divide by how many values there are.'
        write: 'Variance $= \dfrac{\sum (x - \bar{x})^{2}}{n}$'
      - say: 'Divide by the number of scores, 5.'
        write: 'Variance $= \dfrac{10}{5}$'
        point:
          - {line: 9, kind: move, from: {line: 7, at: '= 10'}, at: '10', text: 'from here'}
      - say: '10 divided by 5 is 2.'
        write: '$= 2$'
      - say: 'So the variance is 2.0, which is answer choice C.'
        write: 'Variance $= 2.0$'
        answer: true
    traps:
      A: 'You went for 1.2. That is 2 plus 1 plus 0 plus 1 plus 2, over 5, which is 6 over 5: the distances were added without squaring. Squared, they add to 10, and 10 over 5 is 2.'
      B: 'You went for 1.4. That is about root 2, which is the standard deviation. The variance is not square-rooted, so it is 2.'
      D: 'You went for 3.0. That is the mean, not the variance. The variance is the average of the squared distances from the mean: 10 over 5, which is 2.'

  47:
    moments:
      - say: 'We want the mode of the grouped distribution in the table. Picture each frequency as a pile.'
        write: 'Frequencies: $2,\ 1,\ 4,\ 15,\ 10,\ 5,\ 3$'
        doodle: {name: 'custom:1995_q47_a', id: piles, caption: 'the tallest pile is the mode'}
      - say: 'The mode is the most common value. For grouped data it lies in the class with the highest frequency, called the modal class.'
        write: 'Mode lies in the class with the highest $f$'
      - say: 'Scan the frequency column: 2, 1, 4, 15, 10, 5, 3. The biggest is 15: the tallest pile.'
        write: 'Highest frequency $= 15$'
        point:
          - {line: 2, kind: highlight, at: '15', to: {doodle: piles, part: tallest}}
        doodle_do:
          - {id: piles, op: circle, part: tallest}
      - say: 'That tallest pile belongs to the class 3.0 to 3.4. So that is the modal class.'
        write: 'Modal class: $3.0$–$3.4$'
        point:
          - {line: 2, kind: circle, at: '15', text: 'highest'}
        doodle_do:
          - {id: piles, op: label, part: tallest, text: '3.0–3.4'}
      - say: 'The table gives the mid-point of that class as 3.2. That is the value that represents the class.'
        write: 'Mid-point of modal class $= 3.2$'
      - say: 'We can check it with the mode formula. The lower class boundary is 2.95, and the class width is 3.45 minus 2.95, which is 0.5.'
        write: '$L = 2.95,\quad c = 3.45 - 2.95 = 0.5$'
      - say: 'The modal frequency minus the one before it is 15 minus 4, which is 11. The modal frequency minus the one after it is 15 minus 10, which is 5.'
        write: '$\Delta_{1} = 15 - 4 = 11,\quad \Delta_{2} = 15 - 10 = 5$'
      - say: 'The formula is $L$, plus $\Delta_1$ over $\Delta_1$ plus $\Delta_2$, times the class width.'
        write: 'Mode $= L + \dfrac{\Delta_{1}}{\Delta_{1} + \Delta_{2}} \times c$'
      - say: 'Put in the numbers we just found.'
        write: '$= 2.95 + \dfrac{11}{11 + 5} \times 0.5$'
        point:
          - {line: 8, kind: move, from: {line: 5, at: 'L = 2.95'}, at: '2.95', text: 'L'}
          - {line: 8, kind: move, from: {line: 6, at: '= 11'}, at: '5[[11]]', text: 'Δ1'}
          - {line: 8, kind: move, from: {line: 6, at: '10 = [[5]]'}, at: '+ [[5]]', text: 'Δ2'}
      - say: '11 plus 5 is 16, and 11 over 16 times 0.5 is 11 over 32, which is about 0.34.'
        write: '$= 2.95 + \dfrac{11}{32} \approx 2.95 + 0.34$'
      - say: '2.95 plus 0.34 is about 3.29.'
        write: '$\approx 3.29$'
      - say: 'That sits inside the modal class. Of the options, the nearest is 3.2, the class mid-point. 3.4 is only the upper limit of the class.'
        write: 'Nearest option: $3.2$, the mid-point'
      - say: 'So the mode is 3.2, which is answer choice A.'
        write: 'Mode $\approx 3.2$'
        answer: true
