  33:
    moments:
      - say: 'In the diagram, a closed cylinder has base diameter 14 cm and height 12 cm. We want the total surface area, with both a base and a top. Use pi as 22 over 7.'
        write: '$d = 14$ cm, $h = 12$ cm'
        point:
          - {figure: 0, kind: highlight, target: '14 cm', text: 'diameter'}
          - {figure: 0, kind: highlight, target: '12 cm', text: 'height'}
      - say: 'A closed cylinder has three surfaces: the curved side, the circular base, and the circular top. We add all three.'
        write: 'Total $=$ curved side $+$ base $+$ top'
        point:
          - {figure: 0, kind: label, target: {x: 160, y: 130}, text: 'curved side'}
          - {figure: 0, kind: label, target: {x: 160, y: 70}, text: 'top'}
          - {figure: 0, kind: label, target: {x: 160, y: 195}, text: 'base'}
      - say: 'The curved side is $2\pi r h$, and each circular end is $\pi r^2$.'
        write: 'Total $= 2\pi rh + 2\pi r^{2}$'
        point:
          - {figure: 0, kind: label, target: {x: 120, y: 150}, text: '2πrh'}
          - {figure: 0, kind: label, target: {x: 200, y: 70}, text: 'πr²'}
      - say: 'The formulas need the radius, which is half the diameter. Half of 14 is 7.'
        write: '$r = \dfrac{14}{2} = 7$ cm'
        point:
          - {figure: 0, kind: circle, target: '14 cm', text: 'r = 7'}
      - say: 'The curved side of a cylinder has area 2 pi r h.'
        write: 'Curved surface of a cylinder $= 2\pi rh$'
      - say: 'First, the curved surface. Put $r = 7$ and $h = 12$ into $2\pi r h$: 2 times 22 over 7, times 7, times 12.'
        write: 'Curved side $= 2 \times \dfrac{22}{7} \times 7 \times 12$'
        point:
          - {line: 2, kind: box, at: '2πrh', text: 'the rule'}
          - {line: 5, kind: move, from: {line: 3, at: '= 7'}, at: '×[[7]]×12', text: 'r'}
          - {line: 5, kind: move, from: {line: 0, at: '12'}, at: '12', text: 'h'}
      - say: 'The 7 on the bottom cancels with the 7 we multiply by. We are left with 2 times 22 times 12.'
        write: '$= 2 \times 22 \times 12$'
      - say: '2 times 22 is 44, and 44 times 12 is 528.'
        write: '$= 44 \times 12 = 528\ \text{cm}^{2}$'
      - say: 'Each end is a circle, and the area of a circle is pi r squared.'
        write: 'Area of a circle $= \pi r^{2}$'
      - say: 'Now one circular end, pi $r$ squared. 7 squared is 49.'
        write: 'One end $= \dfrac{22}{7} \times 7^{2} = \dfrac{22}{7} \times 49$'
      - say: '49 divided by 7 is 7, so this is 22 times 7, which is 154.'
        write: '$= 22 \times 7 = 154\ \text{cm}^{2}$'
      - say: 'There are two ends, a base and a top. 2 times 154 is 308.'
        write: 'Two ends $= 2 \times 154 = 308\ \text{cm}^{2}$'
      - say: 'Now add the curved surface we found, 528, and the two ends, 308.'
        write: 'Total $= 528 + 308$'
        point:
          - {line: 12, kind: move, from: {line: 7, at: '528'}, at: '528', text: 'curved side'}
          - {line: 12, kind: move, from: {line: 11, at: '308'}, at: '308', text: 'two ends'}
      - say: '528 plus 308 is 836.'
        write: '$= 836\ \text{cm}^{2}$'
      - say: 'So the total surface area is 836 square centimetres, which is answer choice A.'
        write: 'Total surface area $= 836\ \text{cm}^{2}$'
        answer: true
    traps:
      B: 'You went for 528. That is only the curved surface. The cylinder also has a base and a top, which add 308 more.'
      C: 'You went for 308. That is only the two circular ends. Add the curved surface, 528, to get 836.'
      D: 'You went for 154. That is only one circular end. You need the curved surface and both ends: 528 plus 308 is 836.'

  34:
    moments:
      - say: 'In the diagram, triangle $PQR$ has $PR$ = 10 cm and a 30 degree angle at $P$. Its area is 35 square centimetres. We want $PQ$.'
        write: '$PR = 10,\quad \angle P = 30^{\circ},\quad \text{area} = 35$'
        point:
          - {figure: 0, kind: highlight, target: PR, text: '10 cm'}
          - {figure: 0, kind: arc, target: QPR, text: '30°'}
          - {figure: 0, kind: underline, target: PQ, text: 'find'}
      - say: 'When we know two sides and the angle between them, the area is a half, times one side, times the other side, times the sine of that angle.'
        write: 'Area $= \dfrac{1}{2}ab\sin C$'
      - say: 'Here the angle we know is the 30 degrees at $P$. The two sides that make that angle are $PQ$, which we want, and $PR$, which is 10.'
        write: '$a = PQ,\quad b = PR = 10,\quad C = 30^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: 'QPR', text: 'C = 30°'}
          - {figure: 0, kind: highlight, target: 'PQ', text: 'a'}
          - {figure: 0, kind: highlight, target: 'PR', text: 'b = 10'}
      - say: 'Put those, and the area of 35, into the formula.'
        write: '$35 = \dfrac{1}{2} \times PQ \times 10 \times \sin 30^{\circ}$'
        point:
          - {line: 1, kind: box, text: 'the rule'}
          - {line: 3, kind: move, from: {line: 0, at: '35'}, at: '35', text: 'area'}
          - {line: 3, kind: move, from: {line: 0, at: '= 10'}, at: '10', text: 'PR'}
      - say: 'The sine of 30 degrees is a half.'
        write: '$\sin 30^{\circ} = \dfrac{1}{2}$'
      - say: 'Replace sine 30 with that half.'
        write: '$35 = \dfrac{1}{2} \times PQ \times 10 \times \dfrac{1}{2}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '= 21'}, at: '10 × [[21]]', text: 'sin 30°'}
      - say: 'Multiply the numbers: a half times 10 is 5, and 5 times a half is 2.5.'
        write: '$35 = 2.5 \times PQ$'
      - say: 'Divide both sides by 2.5 to get $PQ$ by itself.'
        write: '$PQ = \dfrac{35}{2.5}$'
      - say: '35 divided by 2.5 is the same as 350 divided by 25. 25 times 14 is 350, so it is 14.'
        write: '$= \dfrac{350}{25} = 14$'
      - say: 'Check: half of 14 is 7, 7 times 10 is 70, and half of 70 is 35. That is the area we were given.'
        write: 'Check: $\dfrac{1}{2} \times 14 \times 10 \times \dfrac{1}{2} = 35$'
      - say: 'So $PQ$ is 14 cm, which is answer choice C.'
        write: '$PQ = 14$ cm'
        answer: true
        point:
          - {figure: 0, kind: label, target: PQ, text: '14 cm'}
    traps:
      A: 'You went for 97 cm. That is far too long for a triangle of area 35. The area formula gives 2.5 times $PQ$ equals 35, so $PQ$ is 14.'
      B: 'You went for 10 cm. That is $PR$, the side we were given. We want the other side, $PQ$: 35 divided by 2.5 is 14.'
      D: 'You went for 17 cm. Check the arithmetic: a half times 10 times a half is 2.5, and 35 divided by 2.5 is 14.'

