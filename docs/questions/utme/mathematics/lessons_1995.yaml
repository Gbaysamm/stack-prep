        write: '$= -0.25 < 0$'
      - say: 'Right stretch: try 5. 5 minus 3 is 2, and 5 minus 4 is 1. 2 times 1 is 2, which is positive, so this stretch fails.'
        write: '$x = 5:\ (2)(1) = 2 > 0$'
      - say: 'Left stretch: try 0. 0 minus 3 is minus 3, and 0 minus 4 is minus 4. Minus 3 times minus 4 is 12, positive again, so this stretch fails too.'
        write: '$x = 0:\ (-3)(-4) = 12 > 0$'
