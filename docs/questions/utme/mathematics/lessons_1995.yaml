          - {figure: sketch, kind: highlight, target: QR, text: 'gradient?'}
      - say: 'Multiply both sides by 2. Minus 1 times 2 is minus 2.'
        write: '$m_{QR} = -2$'
      - say: 'Now we need the line with gradient minus 2 that passes through the point 1, minus 1. We use the point-gradient form.'
        write: '$y - y_{1} = m(x - x_{1})$'
      - say: 'Put in $x_1 = 1$, $y_1 = -1$, and the gradient $m = -2$ we just found.'
        write: '$y - (-1) = -2(x - 1)$'
