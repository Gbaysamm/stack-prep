        write: 'Condition 1: $x^{2} = 9$; condition 2: $x > 4$'
      - say: 'First condition: $x$ squared equals 9. Which numbers square to 9? 3 times 3 is 9, and minus 3 times minus 3 is also 9.'
        write: '$3^{2} = 9,\quad (-3)^{2} = 9$'
