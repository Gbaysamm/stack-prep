        write: '$x - 3 = 2y$'
      - say: 'Divide everything by 2. $x$ over 2 is 1 over 2 times $x$, and minus 3 over 2 stays minus 3 over 2.'
        write: '$y = \dfrac{1}{2}x - \dfrac{3}{2}$'
