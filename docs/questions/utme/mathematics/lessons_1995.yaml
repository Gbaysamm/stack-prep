        write: '$\sum fx = 2(5) + 5(8) + 8(5) = 10 + 40 + 40 = 90$'
      - say: 'For a frequency table, the mean is the sum of $f$ times $x$, divided by the sum of the frequencies.'
        write: 'Mean: $\bar{x} = \dfrac{\sum fx}{\sum f}$'
      - say: 'Divide by the total frequency, 18. 90 divided by 18 is 5. So the mean is 5.'
        write: '$\bar{x} = \dfrac{90}{18} = 5$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '= 90'}, at: '90', text: 'Σfx'}
          - {line: 6, kind: move, from: {line: 3, at: '= 18'}, at: '18', text: 'Σf'}
