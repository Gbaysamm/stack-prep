# UTME 1995 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1995.yaml. Answers match that file.
format_version: 1
exam_year: 1995
lessons:
  1:
    moments:
      - say: 'We are asked to subtract $1442_5$ from $3310_5$. Both numbers are written in base 5.'
        write: '$3310_{5} - 1442_{5}$'
      - say: 'Borrowing in fives is easy to get wrong. So the safe plan is this: change both numbers to base ten, subtract there, then change the answer back to base 5.'
      - say: 'In base 5, the place values from the right are 1, 5, 25 and 125. So $3310_5$ is 3 lots of 125, 3 lots of 25, 1 lot of 5 and 0 ones.'
        write: '$3310_{5} = 3(125) + 3(25) + 1(5) + 0$'
      - say: '3 times 125 is 375. 3 times 25 is 75. 1 times 5 is 5. So we add 375, 75 and 5.'
        write: '$= 375 + 75 + 5 + 0$'
      - say: '375 plus 75 is 450, and 450 plus 5 is 455.'
        write: '$= 455$'
      - say: 'Now the second number. $1442_5$ is 1 lot of 125, 4 lots of 25, 4 lots of 5 and 2 ones.'
        write: '$1442_{5} = 1(125) + 4(25) + 4(5) + 2$'
      - say: 'That is 125, plus 100, plus 20, plus 2, which comes to 247.'
        write: '$= 125 + 100 + 20 + 2 = 247$'
      - say: 'Now subtract in base ten. 455 minus 247 is 208.'
        write: '$455 - 247 = 208$'
      - say: 'To change 208 back to base 5, we keep dividing by 5 and keep the remainders. 208 divided by 5 is 41, remainder 3.'
        write: '$208 \div 5 = 41\ \text{r}\ 3$'
      - say: '41 divided by 5 is 8, remainder 1.'
        write: '$41 \div 5 = 8\ \text{r}\ 1$'
      - say: '8 divided by 5 is 1, remainder 3.'
        write: '$8 \div 5 = 1\ \text{r}\ 3$'
      - say: 'And 1 divided by 5 is 0, remainder 1. We stop when we reach zero.'
        write: '$1 \div 5 = 0\ \text{r}\ 1$'
      - say: 'Now read the remainders from the bottom up: 1, 3, 1, 3. That gives $1313_5$.'
        write: '$208 = 1313_{5}$'
      - say: 'Let''s check: 125 plus 75 plus 5 plus 3 is 208. It works. So the answer is $1313_5$, which is answer choice A.'
        write: '$3310_{5} - 1442_{5} = 1313_{5}$'
        answer: true
    traps:
      B: 'You went for $2113_5$. That is 283 in base ten, not 208. A borrowing slip in base 5 usually causes this; going through base ten and checking at the end avoids it.'
      C: 'You went for $4302_5$. That is 577 in base ten, far more than 208. Convert your answer back to base ten to check it.'
      D: 'You went for $1103_5$. That is 153 in base ten. Read the remainders carefully from the bottom up: 1, 3, 1, 3.'
  2:
    moments:
      - say: 'We are asked to write 3.1415926 correct to 5 decimal places.'
        write: '$3.1415926$'
      - say: 'Five decimal places means we keep exactly five digits after the point. Then we look at the next digit to decide whether to round up.'
      - say: 'Let''s count the digits after the point: 1, 4, 1, 5, 9. Those are the five we keep.'
        write: '$3.14159\,|\,26$'
      - say: 'The very next digit, the sixth one, is 2. That is the digit that decides.'
        write: '$\text{next digit} = 2$'
      - say: 'If the next digit is 5 or more, we round up. If it is less than 5, we leave the last digit alone. 2 is less than 5.'
        write: '$2 < 5$'
      - say: 'So the 9 stays a 9, and we drop everything after it.'
        write: '$3.14159$'
      - say: 'So 3.1415926 to 5 decimal places is 3.14159, which is answer choice B.'
        write: '$3.1415926 \approx 3.14159$'
        answer: true
    traps:
      A: 'You went for 3.14160. That would be right only if the sixth digit were 5 or more. It is 2, so the 9 does not round up.'
      C: 'You went for 0.31415. That has moved the decimal point, which changes the size of the number. Rounding never moves the point.'
      D: 'You went for 3.14200. That is rounded to 3 decimal places and padded with zeros. The question wants five real digits after the point.'
  3:
    moments:
      - say: 'A notebook is really 15 cm long, but it was measured as 16.8 cm. We want the percentage error.'
        write: '$\text{actual} = 15,\quad \text{measured} = 16.8$'
      - say: 'Percentage error compares the size of the mistake with the true value. So we divide by the actual length, not the measured one.'
        write: '$\text{percentage error} = \dfrac{\text{error}}{\text{actual}} \times 100$'
      - say: 'First, the error. It is the difference between the two: 16.8 minus 15 is 1.8 cm.'
        write: '$\text{error} = 16.8 - 15 = 1.8$'
      - say: 'Now put the error over the true length, 15, and multiply by 100.'
        write: '$\dfrac{1.8}{15} \times 100$'
      - say: '1.8 divided by 15 is 0.12. You can see it because 15 times 0.12 is 1.8.'
        write: '$\dfrac{1.8}{15} = 0.12$'
      - say: 'And 0.12 times 100 is 12.'
        write: '$0.12 \times 100 = 12$'
      - say: 'So the percentage error is 12%, which is answer choice A.'
        write: '$12\%$'
        answer: true
    traps:
      B: 'You went for 11%. That is close, but the exact working gives 1.8 divided by 15, which is exactly 0.12, so 12%.'
      C: 'You went for 10.71%. That comes from dividing 1.8 by the measured 16.8. Percentage error always divides by the true value, 15.'
      D: 'You went for 0.12%. That is the fraction 0.12, but you forgot to multiply by 100 to turn it into a percentage.'
  4:
    moments:
      - say: 'A worker earns ₦24,000 a year now. Each year he gets an increment of 10% of his basic salary. We want his salary at the beginning of the third year.'
        write: 'Basic salary: ₦24,000'
      - say: 'The key phrase is "of his basic salary". The increment is always worked out on the original ₦24,000, so the same amount is added every year.'
      - say: 'So let''s find the increment. 10% of 24,000 is 0.1 times 24,000.'
        write: '$0.10 \times 24{,}000$'
      - say: 'That is 2,400 naira each year.'
        write: '$\text{increment} = 2{,}400$'
      - say: 'At the beginning of the first year, his salary is the present one, ₦24,000.'
        write: '$\text{Year 1: } 24{,}000$'
      - say: 'At the beginning of the second year, one increment has been added. 24,000 plus 2,400 is 26,400.'
        write: '$\text{Year 2: } 24{,}000 + 2{,}400 = 26{,}400$'
      - say: 'At the beginning of the third year, a second increment has been added. 26,400 plus 2,400 is 28,800.'
        write: '$\text{Year 3: } 26{,}400 + 2{,}400 = 28{,}800$'
      - say: 'Notice that from the start of year 1 to the start of year 3 is two increments, not three.'
        write: '$24{,}000 + 2(2{,}400) = 28{,}800$'
      - say: 'So his salary at the beginning of the third year is ₦28,800, which is answer choice A.'
        write: 'Salary: ₦28,800'
        answer: true
    traps:
      B: 'You went for ₦29,040. That is compound growth, 24,000 times 1.1 squared. But the increment is 10% of the basic salary, so it stays ₦2,400 every year.'
      C: 'You went for ₦31,200. That adds three increments. From the beginning of year 1 to the beginning of year 3 is only two.'
      D: 'You went for ₦31,944. That is three years of compound growth. The increment is a fixed ₦2,400, and only two of them are added.'
  5:
    moments:
      - say: 'We want the product of 0.0014 and 0.011, written in standard form.'
        write: '$0.0014 \times 0.011$'
      - say: 'Small decimals are easier in standard form. So first we write each number as a number between 1 and 10, times a power of ten.'
      - say: 'For 0.0014, the point moves three places to the right to reach 1.4. So it is 1.4 times 10 to the minus 3.'
        write: '$0.0014 = 1.4 \times 10^{-3}$'
      - say: 'For 0.011, the point moves two places to the right to reach 1.1. So it is 1.1 times 10 to the minus 2.'
        write: '$0.011 = 1.1 \times 10^{-2}$'
      - say: 'Now multiply. We multiply the numbers together and the powers of ten together.'
        write: '$(1.4 \times 1.1) \times (10^{-3} \times 10^{-2})$'
      - say: '1.4 times 1.1: 1.4 times 1 is 1.4, and 1.4 times 0.1 is 0.14. 1.4 plus 0.14 is 1.54.'
        write: '$1.4 \times 1.1 = 1.54$'
      - say: 'When we multiply powers of ten, we add the indices. Minus 3 plus minus 2 is minus 5.'
        write: '$10^{-3} \times 10^{-2} = 10^{-5}$'
      - say: 'Put the two parts together.'
        write: '$1.54 \times 10^{-5}$'
      - say: 'Does that make sense? Two small numbers multiply to something even smaller, and 10 to the minus 5 is a hundred-thousandth. Good.'
      - say: 'So the product is 1.54 times 10 to the minus 5, which is answer choice D.'
        write: '$0.0014 \times 0.011 = 1.54 \times 10^{-5}$'
        answer: true
    traps:
      A: 'You went for $1.54 \times 10^{2}$. A positive power makes the number bigger than 1, but multiplying two small decimals gives a very small answer. The powers are negative: minus 3 plus minus 2 is minus 5.'
      B: 'You went for $1.54 \times 10^{-3}$. That uses only one of the powers. When you multiply, you add both indices: minus 3 plus minus 2 is minus 5.'
      C: 'You went for $1.54 \times 10^{4}$. The powers of ten here are negative, because both numbers are less than 1. Adding minus 3 and minus 2 gives minus 5.'
  6:
    moments:
      - say: 'We want to evaluate 81 to the power three quarters, minus 27 to the power one third, all over 3 times 2 cubed.'
        write: '$\dfrac{81^{3/4} - 27^{1/3}}{3 \times 2^{3}}$'
      - say: 'Remember what a fractional index means. The bottom number is the root, and the top number is the power.'
        write: '$a^{m/n} = \left(\sqrt[n]{a}\right)^{m}$'
      - say: 'So for 81 to the three quarters, we take the fourth root of 81 first. 3 times 3 times 3 times 3 is 81, so the fourth root is 3.'
        write: '$\sqrt[4]{81} = 3$'
      - say: 'Then we cube it. 3 cubed is 27.'
        write: '$81^{3/4} = 3^{3} = 27$'
      - say: 'Now 27 to the one third. That is the cube root of 27. 3 times 3 times 3 is 27, so the cube root is 3.'
        write: '$27^{1/3} = \sqrt[3]{27} = 3$'
      - say: 'So the top of the fraction is 27 minus 3, which is 24.'
        write: '$\text{numerator} = 27 - 3 = 24$'
      - say: 'Now the bottom. 2 cubed is 8, and 3 times 8 is 24.'
        write: '$\text{denominator} = 3 \times 8 = 24$'
      - say: 'So the whole thing is 24 over 24.'
        write: '$\dfrac{24}{24}$'
      - say: '24 divided by 24 is 1, which is answer choice B.'
        write: '$= 1$'
        answer: true
    traps:
      A: 'You went for 27. That is only the first term, 81 to the three quarters. You still need to subtract 3 and then divide by 24.'
      C: 'You went for one third. Check the top and bottom again: the top is 27 minus 3, which is 24, and the bottom is 3 times 8, which is also 24.'
      D: 'You went for one eighth. That comes from dividing by 3 times 8 without first working out the top properly. The top is 24, and 24 over 24 is 1.'
  7:
    moments:
      - say: 'We want the value of 16 to the three halves, plus log base 10 of 0.0001, plus log base 2 of 32.'
        write: '$(16)^{3/2} + \log_{10}0.0001 + \log_{2}32$'
      - say: 'There are three separate pieces. Let''s take them one at a time.'
      - say: 'First piece. The 2 at the bottom of the index means a square root. The square root of 16 is 4.'
        write: '$\sqrt{16} = 4$'
      - say: 'The 3 on top means we cube it. 4 times 4 is 16, and 16 times 4 is 64.'
        write: '$(16)^{3/2} = 4^{3} = 64$'
      - say: 'Second piece. Log base 10 of 0.0001 asks: what power of 10 gives 0.0001? 0.0001 is 1 over 10,000, which is 10 to the minus 4.'
        write: '$0.0001 = 10^{-4}$'
      - say: 'So the log is minus 4. It is negative because 0.0001 is less than 1.'
        write: '$\log_{10}0.0001 = -4$'
      - say: 'Third piece. Log base 2 of 32 asks: what power of 2 gives 32? 2, 4, 8, 16, 32. That is 2 to the power 5.'
        write: '$2^{5} = 32$'
      - say: 'So log base 2 of 32 is 5.'
        write: '$\log_{2}32 = 5$'
      - say: 'Now add all three pieces: 64, plus minus 4, plus 5.'
        write: '$64 + (-4) + 5$'
      - say: '64 minus 4 is 60, and 60 plus 5 is 65.'
        write: '$= 60 + 5 = 65$'
      - say: 'So the value is 65, written 65.00, which is answer choice D.'
        write: '$65.00$'
        answer: true
    traps:
      A: 'You went for 0.065. The digits 6 and 5 are right, but the decimal point is in the wrong place. The pieces are 64, minus 4 and 5, which add to 65.'
      B: 'You went for 0.650. The value is 65, not 0.65. 16 to the three halves alone is already 64.'
      C: 'You went for 6.500. The first piece alone is 64, so the total cannot be as small as 6.5. Adding 64, minus 4 and 5 gives 65.'
  8:
    moments:
      - say: 'We want to simplify root 12 minus root 3, over root 12 plus root 3.'
        write: '$\dfrac{\sqrt{12} - \sqrt{3}}{\sqrt{12} + \sqrt{3}}$'
      - say: 'Before doing anything fancy, let''s see if the surds simplify. 12 is 4 times 3, and 4 is a perfect square.'
        write: '$\sqrt{12} = \sqrt{4 \times 3}$'
      - say: 'The square root of 4 is 2, so root 12 is 2 root 3.'
        write: '$\sqrt{12} = 2\sqrt{3}$'
      - say: 'Now the top. 2 root 3 minus 1 root 3 leaves 1 root 3, just like 2 apples minus 1 apple.'
        write: '$2\sqrt{3} - \sqrt{3} = \sqrt{3}$'
      - say: 'And the bottom. 2 root 3 plus 1 root 3 is 3 root 3.'
        write: '$2\sqrt{3} + \sqrt{3} = 3\sqrt{3}$'
      - say: 'So the fraction becomes root 3 over 3 root 3.'
        write: '$\dfrac{\sqrt{3}}{3\sqrt{3}}$'
      - say: 'Root 3 is on the top and the bottom, so it cancels.'
        write: '$\dfrac{\cancel{\sqrt{3}}}{3\cancel{\sqrt{3}}}$'
      - say: 'That leaves 1 over 3, which is answer choice A.'
        write: '$= \dfrac{1}{3}$'
        answer: true
    traps:
      B: 'You went for 0. The top is not zero: root 12 is 2 root 3, and 2 root 3 minus root 3 leaves root 3.'
      C: 'You went for 9 over 15. That treats root 12 and root 3 as 12 and 3. Simplify root 12 to 2 root 3 first, and the fraction becomes one third.'
      D: 'You went for 1. That would need the top and bottom to be equal, but the top is root 3 and the bottom is 3 root 3.'
  9:
    moments:
      - say: 'Four boys are in both the school''s first eleven cricket team and its first fourteen rugby team. We want how many boys play for at least one team.'
      - say: 'The numbers are hiding in the names. A first eleven has 11 players, and a first fourteen has 14 players.'
        write: '$n(C) = 11,\quad n(R) = 14$'
      - say: 'And 4 boys are in both teams. That is the overlap.'
        write: '$n(C \cap R) = 4$'
      - say: 'If we just add 11 and 14, those 4 boys get counted twice. So we subtract the overlap once.'
        write: '$n(C \cup R) = n(C) + n(R) - n(C \cap R)$'
      - say: 'Put the numbers in: 11 plus 14 minus 4.'
        write: '$n(C \cup R) = 11 + 14 - 4$'
      - say: '11 plus 14 is 25.'
        write: '$= 25 - 4$'
      - say: 'And 25 minus 4 is 21.'
        write: '$= 21$'
      - say: 'So 21 boys play for at least one of the two teams, which is answer choice B.'
        write: '$21 \text{ boys}$'
        answer: true
    traps:
      A: 'You went for 25. That adds the two teams but counts the 4 shared boys twice. Subtract the overlap once: 25 minus 4 is 21.'
      C: 'You went for 16. Check the team sizes: a first eleven has 11 and a first fourteen has 14. 11 plus 14 minus 4 is 21.'
      D: 'You went for 3. That doesn''t come from the team sizes. Add 11 and 14, then take away the 4 boys in both, to get 21.'
  10:
    moments:
      - say: 'S is the set of all $x$ where $x$ squared is 9 and $x$ is greater than 4. We want to know what S is.'
        write: '$S = \{x : x^{2} = 9,\; x > 4\}$'
      - say: 'In set-builder notation, $x$ must satisfy both conditions at once.'
      - say: 'First condition: $x$ squared equals 9. What numbers square to 9? 3 does, and so does minus 3.'
        write: '$x^{2} = 9 \Rightarrow x = 3 \text{ or } x = -3$'
      - say: 'Second condition: $x$ must be greater than 4. Is 3 greater than 4? No.'
        write: '$3 > 4\ \text{✗}$'
      - say: 'Is minus 3 greater than 4? No.'
        write: '$-3 > 4\ \text{✗}$'
      - say: 'So no number passes both tests. S has no elements at all.'
        write: '$n(S) = 0$'
      - say: 'A set with no elements is called the empty set, and we write it with this symbol.'
        write: '$\varnothing$'
      - say: 'So S is the empty set, which is answer choice C.'
        write: '$S = \varnothing$'
        answer: true
    traps:
      A: 'You went for 0. That is a number, not a set. A set with nothing in it is the empty set.'
      B: 'You went for the set containing 0. That set has one element, the number zero. But zero does not satisfy $x$ squared equals 9, so S has no elements.'
      D: 'You went for the set containing the empty set. That set has one element in it. S has none, so it is just the empty set itself.'
  11:
    moments:
      - say: 'We are told that $x - 1$ and $x + 1$ are both factors of $x^3 + px^2 + qx + 6$. We want the values of $p$ and $q$.'
        write: '$f(x) = x^{3} + px^{2} + qx + 6$'
      - say: 'The factor theorem says: if $x - a$ is a factor, then putting $x = a$ into the expression gives zero.'
        write: '$x - a \text{ is a factor} \iff f(a) = 0$'
      - say: 'So since $x - 1$ is a factor, $f$ of 1 must be zero. Let''s replace every $x$ with 1.'
        write: '$f(1) = 1^{3} + p(1)^{2} + q(1) + 6 = 0$'
      - say: '1 cubed is 1 and 1 squared is 1, so this is 1 plus $p$ plus $q$ plus 6 equals zero.'
        write: '$1 + p + q + 6 = 0$'
      - say: '1 plus 6 is 7. Take 7 to the other side, and $p$ plus $q$ equals minus 7.'
        write: '$p + q = -7$'
      - say: 'Now $x + 1$ is a factor, so $f$ of minus 1 is zero. Let''s replace every $x$ with minus 1.'
        write: '$f(-1) = (-1)^{3} + p(-1)^{2} + q(-1) + 6 = 0$'
      - say: 'Careful with the signs. Minus 1 cubed is minus 1, but minus 1 squared is plus 1. So we get minus 1, plus $p$, minus $q$, plus 6.'
        write: '$-1 + p - q + 6 = 0$'
      - say: 'Minus 1 plus 6 is 5. Take 5 to the other side, and $p$ minus $q$ equals minus 5.'
        write: '$p - q = -5$'
      - say: 'Now we have two equations. If we add them, the $q$ terms cancel. $p$ plus $p$ is $2p$, and minus 7 plus minus 5 is minus 12.'
        write: '$2p = -12$'
      - say: 'Divide both sides by 2. Minus 12 divided by 2 is minus 6.'
        write: '$p = -6$'
      - say: 'Put that back into $p$ plus $q$ equals minus 7. Minus 6 plus $q$ equals minus 7.'
        write: '$-6 + q = -7$'
      - say: 'Add 6 to both sides. Minus 7 plus 6 is minus 1.'
        write: '$q = -1$'
      - say: 'Quick check with $x = 1$: 1 minus 6 minus 1 plus 6 is zero. Good.'
        write: '$f(1) = 1 - 6 - 1 + 6 = 0$'
      - say: 'So $p$ is minus 6 and $q$ is minus 1, which is answer choice A.'
        write: '$p = -6,\quad q = -1$'
        answer: true
    traps:
      B: 'You went for 6 and 1. Those are the right sizes with the wrong signs. From $p + q = -7$ and $p - q = -5$, both answers come out negative.'
      C: 'You went for minus 1 and 6. Try it: 1 minus 1 plus 6 plus 6 is 12, not zero. Adding the two equations gives $2p = -12$, so $p = -6$.'
      D: 'You went for 6 and minus 6. Those give $p + q = 0$, but the factor $x - 1$ needs $p + q = -7$. Solving the pair gives $p = -6$ and $q = -1$.'
  12:
    moments:
      - say: 'The expression $2x^2 - px + p$ leaves a remainder of 6 when divided by $x + 1$. We want a positive value of $p$.'
        write: '$f(x) = 2x^{2} - px + p$'
      - say: 'The remainder theorem says: when you divide by $x - a$, the remainder is $f$ of $a$. So we put in the value of $x$ that makes the divisor zero.'
      - say: 'What makes $x + 1$ zero? $x$ equals minus 1.'
        write: '$x + 1 = 0 \Rightarrow x = -1$'
      - say: 'So let''s replace every $x$ with minus 1.'
        write: '$f(-1) = 2(-1)^{2} - p(-1) + p$'
      - say: 'Minus 1 squared is 1, so the first term is 2 times 1, which is 2. Minus $p$ times minus 1 is plus $p$. And the last term is plus $p$.'
        write: '$f(-1) = 2 + p + p$'
      - say: '$p$ plus $p$ is $2p$.'
        write: '$f(-1) = 2 + 2p$'
      - say: 'The remainder is 6, so 2 plus $2p$ equals 6.'
        write: '$2 + 2p = 6$'
      - say: 'Subtract 2 from both sides. 6 minus 2 is 4.'
        write: '$2p = 4$'
      - say: 'Divide both sides by 2. 4 divided by 2 is 2.'
        write: '$p = 2$'
      - say: 'Check: with $p = 2$, putting in minus 1 gives 2 plus 2 plus 2, which is 6. Good.'
        write: '$2 + 2 + 2 = 6$'
      - say: 'So $p$ is 2, which is answer choice B.'
        write: '$p = 2$'
        answer: true
    traps:
      A: 'You went for 1. Then the remainder would be 2 plus 2 times 1, which is 4, not 6. Solving 2 plus $2p$ equals 6 gives $p = 2$.'
      C: 'You went for 3. Then the remainder would be 2 plus 6, which is 8, not 6. Check the signs: both $p$ terms come out positive, so it is 2 plus $2p$ equals 6.'
      D: 'You went for 4. That is the value of $2p$, not $p$. Divide by 2 at the last step: $p = 2$.'
  13:
    moments:
      - say: 'We have $s = 2r\sqrt{Q\pi T + K}$, and we want to make $T$ the subject.'
        write: '$s = 2r\sqrt{Q\pi T + K}$'
      - say: '$T$ is inside a square root, so we peel off the layers from the outside in. First, square both sides to get rid of the root.'
        write: '$s^{2} = \left(2r\right)^{2}\left(Q\pi T + K\right)$'
      - say: 'Squaring $2r$ squares both parts: 2 squared is 4, and $r$ squared is $r$ squared. So we get $4r^2$.'
        write: '$s^{2} = 4r^{2}(Q\pi T + K)$'
      - say: 'Next, divide both sides by $4r^2$ to free the bracket.'
        write: '$\dfrac{s^{2}}{4r^{2}} = Q\pi T + K$'
      - say: 'Now subtract $K$ from both sides.'
        write: '$\dfrac{s^{2}}{4r^{2}} - K = Q\pi T$'
      - say: 'Finally, divide both sides by $Q\pi$. And this is important: we must divide every term on the left, not just the first one.'
        write: '$T = \dfrac{s^{2}}{4r^{2}Q\pi} - \dfrac{K}{Q\pi}$'
      - say: 'Let''s tidy the order of letters. The first term is $s^2$ over $4\pi r^2 Q$.'
        write: '$\dfrac{s^{2}}{4r^{2}Q\pi} = \dfrac{s^{2}}{4\pi r^{2}Q}$'
      - say: 'And the second term is $K$ over $\pi Q$.'
        write: '$\dfrac{K}{Q\pi} = \dfrac{K}{\pi Q}$'
      - say: 'So $T$ equals $s^2$ over $4\pi r^2 Q$, minus $K$ over $\pi Q$, which is answer choice B.'
        write: '$T = \dfrac{s^{2}}{4\pi r^{2}Q} - \dfrac{K}{\pi Q}$'
        answer: true
    traps:
      A: 'You went for the option with a 2 and $K$ over $Q$. When you square $2r$ you get $4r^2$, not $2r^2$. And the last division is by $Q\pi$, so $K$ becomes $K$ over $\pi Q$.'
      C: 'You went for the option with a 2 and a plain $K$. Two slips: $2r$ squared is $4r^2$, and when you divide by $Q\pi$ you must divide the $K$ as well.'
      D: 'You went for the option ending in minus $K$. The first term is right, but dividing by $Q\pi$ divides every term, so the $K$ becomes $K$ over $\pi Q$.'
  14:
    moments:
      - say: 'We want the points where the graph of $f(x) = x^2 - 5x + 6$ crosses the $x$-axis.'
        write: '$f(x) = x^{2} - 5x + 6$'
      - say: 'On the $x$-axis, $y$ is zero. So we set the expression equal to zero and solve.'
