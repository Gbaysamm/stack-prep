  29:
    moments:
      - say: 'Town $P$ is at 45 degrees north, 30 degrees west, and town $Q$ is at 15 degrees north, 30 degrees west. The earth''s radius is 7,000 km. We want the distance between them.'
        write: '$P(45^{\circ}\text{N},\ 30^{\circ}\text{W}),\quad Q(15^{\circ}\text{N},\ 30^{\circ}\text{W})$'
      - say: 'Let me draw a cross-section of the earth through longitude 30 degrees west, with $P$ and $Q$ on it.'
