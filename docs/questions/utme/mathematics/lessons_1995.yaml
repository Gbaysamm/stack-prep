# UTME 1995 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1995.yaml. Answers match that file.
format_version: 1
exam_year: 1995
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'Three-three-one-zero base five minus one-four-four-two base five. Both are in base five, so we subtract in base five itself, column by column, as WAEC expects.'
        write: 'Calculate $3310_{5} - 1442_{5}$'
      - say: 'Set them out in columns, units under units. Remember one rule. In base five, a borrowed 1 is worth 5, not 10.'
        write: '$\begin{array}{rrrrr} & 3 & 3 & 1 & 0 \\ - & 1 & 4 & 4 & 2 \\ \hline & & & & \end{array}$'
      - section: 'Units'
        say: 'In the units, 0 minus 2 cannot be done. Borrow 1 from the fives column. It is worth 5, so the units become 0 plus 5, which is 5.'
        write: 'Units: $0 - 2$, borrow 1 five: $0 + 5 = 5$'
      - say: '5 minus 2 is 3. Write 3.'
        write: '$5 - 2 = 3$'
      - section: 'Fives'
        say: 'In the fives, the 1 lent 1 to the units, so it is now 0.'
        write: 'Fives: $1 - 1 = 0$ (it lent 1)'
      - say: '0 minus 4 cannot be done. Borrow 1 from the twenty-fives column, so 0 plus 5 is 5, and 5 minus 4 is 1.'
        write: '$0 - 4$, borrow 1: $0 + 5 = 5$, $\ 5 - 4 = 1$'
      - section: 'Twenty-fives'
        say: 'In the twenty-fives, the 3 lent 1, so it is now 2. 2 minus 4 cannot be done, so borrow again, and 2 plus 5 is 7.'
        write: 'Twenty-fives: $3 - 1 = 2$; borrow 1: $2 + 5 = 7$'
      - say: '7 minus 4 is 3. Write 3.'
        write: '$7 - 4 = 3$'
      - section: 'One-hundred-and-twenty-fives'
        say: 'In the last column, the 3 lent 1, so it is now 2. 2 minus 1 is 1.'
        write: 'Last: $3 - 1 = 2$, $\ 2 - 1 = 1$'
      - say: 'Here is the whole subtraction, with the new top digits written small above each column. The answer is one-three-one-three base five.'
        write: '$\begin{array}{rrrrr} & \scriptstyle 2 & \scriptstyle 7 & \scriptstyle 5 & \scriptstyle 5 \\ & 3 & 3 & 1 & 0 \\ - & 1 & 4 & 4 & 2 \\ \hline & 1 & 3 & 1 & 3 \end{array}$'
      - section: 'Check: add back in base 5'
        say: 'Check by adding the answer back to one-four-four-two, in base five. We should get three-three-one-zero.'
        write: '$\begin{array}{rrrrr} & 1 & 3 & 1 & 3 \\ + & 1 & 4 & 4 & 2 \\ \hline & & & & \end{array}$'
      - say: 'In the units, 3 plus 2 is 5, which is one five and nought over. Write 0, carry 1.'
        write: '$3 + 2 = 5 = 1 \times 5 + 0$: write 0, carry 1'
      - say: 'In the fives, 1 plus 4, plus 1, is 6. That is one five and 1 over, so write 1, carry 1.'
        write: '$1 + 4 + 1 = 6 = 1 \times 5 + 1$: write 1, carry 1'
      - say: 'In the twenty-fives, 3 plus 4, plus 1, is 8. That is one five and 3 over, so write 3, carry 1.'
        write: '$3 + 4 + 1 = 8 = 1 \times 5 + 3$: write 3, carry 1'
      - say: 'In the last column, 1 plus 1, plus 1, is 3. We get three-three-one-zero base five, the number we started from.'
        write: '$1 + 1 + 1 = 3$: so $1313_{5} + 1442_{5} = 3310_{5}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore three-three-one-zero base five minus one-four-four-two base five is one-three-one-three base five, which is option A.'
        write: '$\therefore 3310_{5} - 1442_{5} = 1313_{5}$'
        answer: true
    traps:
      B: 'You went for two-one-one-three base five. Add it back to one-four-four-two and you get four-one-one-zero, not three-three-one-zero. Remember that each column that lends 1 goes down by 1.'
      C: 'You went for four-three-zero-two base five. That is bigger than three-three-one-zero itself, and taking a number away can never make it bigger. Borrow 1 five whenever the top digit is too small.'
      D: 'You went for one-one-zero-three base five. Add it back to one-four-four-two and you get three-one-zero-zero, not three-three-one-zero. Borrow in fives, column by column.'

  2:
    moments:
      - section: 'The question'
        say: 'Write 3.1415926 correct to 5 decimal places. One of the options rounds up when it should not. Let''s see which.'
        write: '$3.1415926$ to 5 d.p.'
      - section: 'Solution'
        say: 'Solution. For decimal places, we count from the decimal point. 5 decimal places means 5 digits after the point. Picture the digits as the carriages of a train.'
        write: 'Count 5 digits after the decimal point'
        doodle: {name: 'custom:1995_q02_a', id: train, caption: '3.1415926 as carriages', size: scene}
      - say: 'Count after the point, 1, 4, 1, 5, 9. That is five. Mark the cut after the 9.'
        write: 'Cut after 5 d.p.: $3.14159\,|\,26$'
        doodle_do:
          - {id: train, op: circle, part: keep, text: 'keep these 5'}
      - say: 'Now look at the next digit after the cut. It is 2.'
        write: 'Next digit $= 2$'
        point:
          - {line: 3, kind: highlight, at: '= 2', to: {doodle: train, part: d2}}
        doodle_do:
          - {id: train, op: highlight, part: d2, text: 'decides'}
      - say: 'Here is the rule. If the next digit is 5 or more, add 1 to the last digit kept. If it is less than 5, leave the last digit as it is.'
        write: 'Rule: $5$ or more, add $1$; less than $5$, leave it'
      - say: '2 is less than 5, so we leave the 9 as it is.'
        write: '$2 < 5$: leave the $9$'
        point:
          - {line: 4, kind: box, text: 'the rule'}
      - say: 'Then drop every digit after the cut, so the 2 and the 6 go. 3.1415926 is 3.14159, correct to 5 decimal places.'
        write: '$3.1415926 = 3.14159$ (5 d.p.)'
        point:
          - {line: 2, kind: strike, at: '26', text: 'dropped'}
        doodle_do:
          - {id: train, op: cross, part: d2}
          - {id: train, op: cross, part: d6}
      - section: 'Check'
        say: 'To check, count the digits after the point in the answer, 1, 4, 1, 5, 9. Five, as asked.'
        write: 'Check: $1,\ 4,\ 1,\ 5,\ 9$: five decimal places ✓'
      - say: 'Therefore 3.1415926 is 3.14159 to 5 decimal places, which is option B.'
        write: '$\therefore 3.1415926 = 3.14159$ (5 d.p.) (B)'
        answer: true
    traps:
      A: 'You went for 3.14160. That adds 1 to the 9, which is right only if the next digit is 5 or more. The next digit is 2, so the 9 stays.'
      C: 'You went for 0.31415. That moves the decimal point, which changes the size of the number. Correcting to decimal places never moves the point.'
      D: 'You went for 3.14200. That is 3 decimal places with zeros added. The question wants 5 real digits after the point: 3.14159.'

  3:
    moments:
      - section: 'The question'
        say: 'A notebook is really 15 cm long, but it was measured as 16.8 cm. What is the percentage error? Watch which length goes at the bottom, because that is where most students slip.'
        write: 'Actual $= 15$ cm, measured $= 16.8$ cm'
        doodle: {name: 'custom:1995_q03_a', id: book, caption: 'really 15 cm, measured 16.8 cm'}
        point:
          - {line: 0, kind: highlight, at: 'Actual = 15', to: {doodle: book, part: 'true'}}
      - section: 'Solution'
        say: 'Solution. Percentage error is the error over the actual value, times 100 percent. We always divide by the actual value, the true 15 cm.'
        write: 'Percentage error $= \dfrac{\text{error}}{\text{actual value}} \times 100\%$'
        doodle_do:
          - {id: book, op: circle, part: 'true', text: 'actual value'}
      - say: 'The error is the gap between the measured value and the actual value, so it is measured minus actual.'
        write: 'Error $= 16.8 - 15$'
      - say: '16.8 minus 15 is 1.8. The measurement was 1.8 cm too long, which is the little gap past the end of the notebook.'
        write: '$= 1.8$ cm'
        point:
          - {line: 3, kind: highlight, at: '1.8', to: {doodle: book, part: gap}}
        doodle_do:
          - {id: book, op: label, part: gap, text: '1.8 cm too long'}
      - section: 'Substitute'
        say: 'Now substitute into the formula. The error, 1.8, over the actual value, 15, times 100 percent.'
        write: 'Percentage error $= \dfrac{1.8}{15} \times 100\%$'
        point:
          - {line: 1, kind: box, text: 'the formula'}
          - {line: 4, kind: move, from: {line: 3, at: '= [[1.8]]'}, at: '[[1.8]]', text: 'error'}
      - say: '1.8 times 100 is 180, so we have 180 over 15.'
        write: '$= \dfrac{180}{15}\%$'
      - say: '15 times 12 is 180, so 180 over 15 is 12.'
        write: '$= 12\%$'
      - say: 'To 2 significant figures, 12 stays 12, because its two significant figures are 1 and 2. The options print it as 12.00 percent.'
        write: '$= 12\%$ (2 s.f.)'
      - section: 'Check'
        say: 'To check, 12 percent of the actual 15 cm is 12 over 100 times 15, which is 1.8 cm, the error we found.'
        write: 'Check: $\dfrac{12}{100} \times 15 = 1.8$ ✓'
      - say: 'Therefore the percentage error is 12 percent, which is option A.'
        write: '$\therefore$ percentage error $= 12.00\%$ (A)'
        answer: true
    traps:
      B: 'You went for 11%. That is a slip in the division. The error over the actual value is 1.8 over 15, and 180 over 15 is exactly 12.'
      C: 'You went for 10.71%. That divides the error by the measured value, 16.8. Percentage error always divides by the actual value, 15.'
      D: 'You went for 0.12%. That is 1.8 over 15 without the times 100 percent. 0.12 times 100 is 12%.'
  4:
    moments:
      - section: 'The question'
        say: 'A worker earns ₦24,000 a year now, and his annual increment is 10% of his basic salary. What is his salary at the beginning of the third year? Count the increments carefully.'
        write: 'Basic salary = ₦24,000 per annum; increment $= 10\%$ of basic'
      - section: 'Solution'
        say: 'Solution. The key words are "of his basic salary". The increment is always worked on the ₦24,000, so the same amount is added every year. Picture his pay as a pile.'
        write: 'Increment $= 10\%$ of ₦24,000, the same each year'
        doodle: {name: 'custom:1995_q04_a', id: pay, caption: '10% of the basic, every year', size: scene}
      - say: '10 percent means 10 over 100. So the increment is 10 over 100, times 24,000.'
        write: 'Increment $= \dfrac{10}{100} \times 24{,}000$'
      - say: 'Cancel first, so 100 into 24,000 is 240. Then 10 times 240 is 2,400. He gets ₦2,400 more each year.'
        write: '$= 10 \times 240 = 2{,}400$, so ₦2,400'
        doodle_do:
          - {id: pay, op: label, part: year1, text: '10% = ₦2,400'}
      - section: 'Year by year'
        say: 'At the beginning of the first year, his salary is the present one, ₦24,000.'
        write: 'Start of year 1: ₦24,000'
      - say: 'At the beginning of the second year, one increment has been added, so 24,000 plus 2,400 is 26,400.'
        write: 'Start of year 2: $24{,}000 + 2{,}400 = 26{,}400$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '= [[2,400]], so'}, at: '+ [[2,400]]', text: 'increment'}
        doodle_do:
          - {id: pay, op: stage, stage: 'custom:1995_q04_a2'}
      - say: 'At the beginning of the third year, a second increment of the same ₦2,400 goes on, and 26,400 plus 2,400 is 28,800.'
        write: 'Start of year 3: $26{,}400 + 2{,}400 = 28{,}800$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '= [[26,400]]'}, at: '[[26,400]] +', text: 'from here'}
          - {line: 6, kind: highlight, at: '28,800', to: {doodle: pay, part: year3}}
        doodle_do:
          - {id: pay, op: stage, stage: 'custom:1995_q04_a3'}
          - {id: pay, op: label, part: year3, text: '₦28,800'}
      - section: 'Check'
        say: 'To check, from the start of year 1 to the start of year 3 there are two increments, not three. 2 times 2,400 is 4,800, and 24,000 plus 4,800 is 28,800.'
        write: 'Check: $24{,}000 + 2 \times 2{,}400 = 28{,}800$ ✓'
      - say: 'Therefore his salary at the beginning of the third year is ₦28,800, which is option A.'
        write: '$\therefore$ salary at start of year 3 = ₦28,800 (A)'
        answer: true
    traps:
      B: 'You went for ₦29,040. That is 24,000 times 1.1 times 1.1, as if each increment were 10% of the new salary. The increment is 10% of the basic salary, so it stays ₦2,400.'
      C: 'You went for ₦31,200. That adds three increments of ₦2,400. From the start of year 1 to the start of year 3 there are only two.'
      D: 'You went for ₦31,944. That is 24,000 times 1.1 three times: three increments, each on the new salary. The increment is a fixed ₦2,400, and only two are added.'

  5:
    moments:
      - section: 'The question'
        say: 'Two small decimals multiplied. Count the zeros wrongly and the index is off. Writing each number in standard form first keeps the count safe.'
        write: 'Express the product of 0.0014 and 0.011 in standard form.'
      - say: 'Solution. First, recall what standard form means.'
        write: 'Solution'
      - section: 'Standard form'
        say: 'Standard form is $A$ times 10 to the power $n$, where $A$ is at least 1 and less than 10. Count how many places the point moves. Moving it to the right gives a negative index.'
        write: 'Standard form: $A \times 10^{n}$, where $1 \le A < 10$'
      - say: 'For 0.0014, the point moves 3 places to the right to give 1.4. So it is 1.4 times 10 to the power negative 3.'
        write: '$0.0014 = 1.4 \times 10^{-3}$'
        doodle: {name: 'custom:1995_q05_a', id: hops, caption: 'the point moves to the right', size: scene}
      - say: 'For 0.011, the point moves 2 places to the right to give 1.1. So it is 1.1 times 10 to the power negative 2.'
        write: '$0.011 = 1.1 \times 10^{-2}$'
        doodle_do:
          - {id: hops, op: stage, stage: 'custom:1995_q05_a2'}
      - section: 'Multiply'
        say: 'Substitute both into the product.'
        write: '$0.0014 \times 0.011 = (1.4 \times 10^{-3}) \times (1.1 \times 10^{-2})$'
      - say: 'Multiplication can be done in any order, so group the numbers together and the powers of 10 together.'
        write: '$= (1.4 \times 1.1) \times (10^{-3} \times 10^{-2})$'
      - say: 'The numbers first. 14 times 11 is 154, and there are two decimal places, so 1.4 times 1.1 is 1.54.'
        write: '$1.4 \times 1.1 = 1.54$'
      - say: 'Now the powers of 10. The law of indices for multiplying says that when we multiply powers of the same base, we add the indices.'
        write: 'Law of indices: $a^{m} \times a^{n} = a^{m + n}$'
      - say: 'Negative 3 plus negative 2 is negative 5. On the picture, 3 places and then 2 more.'
        write: '$10^{-3} \times 10^{-2} = 10^{-3 + (-2)} = 10^{-5}$'
        doodle_do:
          - {id: hops, op: circle, part: sf1}
          - {id: hops, op: circle, part: sf2}
          - {id: hops, op: label, part: sf2, text: '−3 + (−2) = −5'}
      - say: 'Put the two results together. 1.54 is between 1 and 10, so this is already standard form.'
        write: '$\therefore 0.0014 \times 0.011 = 1.54 \times 10^{-5}$'
      - section: 'Check'
        say: 'Check with decimals. 14 times 11 is 154. The two numbers have 4 and 3 decimal places, 7 in all, so the product is 0.0000154. That is 1.54 with the point moved 5 places.'
        write: 'Check: $0.0014 \times 0.011 = 0.0000154 = 1.54 \times 10^{-5}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the product is 1.54 times 10 to the power negative 5, which is option D.'
        write: '$\therefore 0.0014 \times 0.011 = 1.54 \times 10^{-5}$'
        answer: true
    traps:
      A: 'You went for 1.54 times 10 to the power 2. A positive index makes the number bigger than 1, but two small decimals multiply to a very small number. The indices are negative 3 and negative 2, which add to negative 5.'
      B: 'You went for 1.54 times 10 to the power negative 3. That uses only one of the powers. When you multiply, you add both indices: negative 3 plus negative 2 is negative 5.'
      C: 'You went for 1.54 times 10 to the power 4. Both numbers are less than 1, so their indices are negative. Negative 3 plus negative 2 is negative 5.'

  6:
    moments:
      - section: 'The question'
        say: 'Fractional indices on top, a power of 2 underneath. The trick with a fractional index is the order. Take the root first, then the power, so the numbers stay small.'
        write: 'Evaluate $\dfrac{81^{\frac{3}{4}} - 27^{\frac{1}{3}}}{3 \times 2^{3}}$'
      - say: 'Solution. We work out the numerator and the denominator separately.'
        write: 'Solution'
      - section: 'The law'
        say: 'The law of indices for a fractional index says $a$ to the power $m$ over $n$ is the $n$th root of $a$, raised to the power $m$. The bottom number is the root, the top number is the power.'
        write: 'Law of indices: $a^{\frac{m}{n}} = \left(\sqrt[n]{a}\right)^{m}$'
      - section: 'Numerator'
        say: 'So 81 to the power 3 over 4 is the fourth root of 81, cubed.'
        write: '$81^{\frac{3}{4}} = \left(\sqrt[4]{81}\right)^{3}$'
      - say: 'The fourth root of 81 is 3, because 3 times 3 times 3 times 3 is 81, which is four blocks of 3 in the tower.'
        write: '$= (3)^{3}$'
        doodle: {name: 'custom:1995_q06_a', id: tower, caption: '81 = 3 × 3 × 3 × 3'}
        doodle_do:
          - {id: tower, op: circle, part: top, text: 'one block = 3'}
      - say: 'Then cube it, and 3 cubed is 27. Three blocks of 3.'
        write: '$= 27$'
        doodle_do:
          - {id: tower, op: stage, stage: 'custom:1995_q06_a2'}
      - say: 'Next, 27 to the power 1 over 3 is the cube root of 27. Three blocks of 3 make 27, so the cube root is 3.'
        write: '$27^{\frac{1}{3}} = \sqrt[3]{27} = 3$'
        doodle_do:
          - {id: tower, op: pulse, part: cube}
      - say: 'So the numerator is 27 minus 3, which is 24.'
        write: 'Numerator $= 27 - 3 = 24$'
      - section: 'Denominator'
        say: '2 cubed is 2 times 2 times 2, which is 8, and 3 times 8 is 24.'
        write: 'Denominator $= 3 \times 2^{3} = 3 \times 8 = 24$'
      - section: 'Divide'
        say: 'Now put the numerator over the denominator.'
        write: '$\therefore \dfrac{81^{\frac{3}{4}} - 27^{\frac{1}{3}}}{3 \times 2^{3}} = \dfrac{24}{24}$'
      - say: '24 divided by 24 is 1.'
        write: '$= 1$'
      - section: 'Check'
        say: 'Check the hardest term another way. 81 is 3 to the power 4, and a power of a power multiplies the indices, so 4 times 3 over 4 is 3. So it is 3 cubed, 27 again.'
        write: 'Check: $81^{\frac{3}{4}} = (3^{4})^{\frac{3}{4}} = 3^{3} = 27\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the value is 1, which is option B.'
        write: '$\therefore$ Value $= 1$'
        answer: true
    traps:
      A: 'You went for 27. That is only the first term, 81 to the power 3 over 4. You still subtract 3 and then divide by 24.'
      C: 'You went for 1 over 3. Work out the numerator and denominator again: the numerator is 27 minus 3, which is 24, and the denominator is 3 times 8, which is also 24.'
      D: 'You went for 1 over 8. That divides by 3 times 8 without first working out the numerator. The numerator is 24, and 24 over 24 is 1.'
  7:
    moments:
      - section: 'The question'
        say: 'One index and two logs, added together. Work out each term on its own, then add. The middle one is negative.'
        write: 'Find the value of $(16)^{3/2} + \log_{10}0.0001 + \log_{2}32$'
      - say: 'Solution. The three terms one at a time.'
        write: 'Solution'
      - section: 'The first term'
        say: 'Recall the law of indices for a fractional index. The bottom number is the root, the top number is the power. Root first, then power.'
        write: 'Recall: $a^{\frac{m}{n}} = \left(\sqrt[n]{a}\right)^{m}$'
      - say: 'So 16 to the power 3 over 2 is the square root of 16, cubed. Picture 16 as a square of tiles, and its side is the square root.'
        doodle: {name: 'custom:1995_q07_a', id: tiles, caption: '16 tiles, a 4 by 4 square'}
        write: '$16^{\frac{3}{2}} = \left(\sqrt{16}\right)^{3}$'
      - say: 'The square root of 16 is 4, the side of the square. So this is 4 cubed.'
        doodle_do:
          - {id: tiles, op: highlight, part: side, text: '4'}
        write: '$= 4^{3}$'
      - say: '4 times 4 is 16, and 16 times 4 is 64.'
        write: '$= 64$'
      - section: 'The second term'
        say: 'Let log base 10 of 0.0001 be $y$. In index form, 10 to the power $y$ equals 0.0001.'
        write: 'Let $\log_{10}0.0001 = y \Rightarrow 10^{y} = 0.0001$'
      - say: '0.0001 is 1 over 10,000, and 10,000 is 10 to the power 4.'
        write: '$10^{y} = \dfrac{1}{10^{4}}$'
      - say: 'By the negative index law, 1 over 10 to the 4 is 10 to the power minus 4.'
        write: '$10^{y} = 10^{-4}$ $\quad [a^{-n} = \tfrac{1}{a^{n}}]$'
      - say: 'Equate the indices. $y$ is minus 4. It is negative because 0.0001 is less than 1.'
        write: '$\therefore y = -4$'
      - section: 'The third term'
        say: 'Let log base 2 of 32 be $z$. In index form, 2 to the power $z$ equals 32.'
        write: 'Let $\log_{2}32 = z \Rightarrow 2^{z} = 32$'
      - say: 'Write 32 as a power of 2, so 2, 4, 8, 16, 32. Five 2s multiplied, so 32 is 2 to the power 5.'
        doodle: {name: 'custom:1995_q07_b', id: twos, caption: '2 × 2 × 2 × 2 × 2 = 32'}
        write: '$2^{z} = 2^{5}$'
      - say: 'Equate the indices. $z$ is 5.'
        doodle_do:
          - {id: twos, op: circle, part: count, text: 'five 2s'}
        write: '$\therefore z = 5$'
      - section: 'Add them'
        say: 'Now put the three values back into the expression, and we get 64, plus minus 4, plus 5.'
        write: '$(16)^{3/2} + \log_{10}0.0001 + \log_{2}32 = 64 + (-4) + 5$'
      - say: '64 minus 4 is 60, and 60 plus 5 is 65.'
        write: '$= 65$'
      - section: 'Check'
        say: 'Check the first term another way. 16 to the power 3 over 2 is 16 times 16 to the power a half, which is 16 times 4, and that is 64.'
        write: 'Check: $16^{\frac{3}{2}} = 16 \times 16^{\frac{1}{2}} = 16 \times 4 = 64\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the value is 65, written 65.00, which is option D.'
        write: '$\therefore$ the value $= 65.00$'
        answer: true
    traps:
      A: 'You went for 0.065. The digits 6 and 5 are right, but the decimal point is in the wrong place. The terms are 64, minus 4 and 5, which add to 65.'
      B: 'You went for 0.650. The value is 65, not 0.65. 16 to the power 3 over 2 alone is already 64.'
      C: 'You went for 6.500. The first term alone is 64, so the total cannot be as small as 6.5. 64 plus minus 4 plus 5 is 65.'

  8:
    moments:
      - section: 'The question'
        say: 'This looks like a job for the conjugate. But first see if the surds simplify, because root 12 is hiding a root 3, and then it is quick.'
        write: 'Simplify $\dfrac{\sqrt{12} - \sqrt{3}}{\sqrt{12} + \sqrt{3}}$'
      - say: 'Solution. Put root 12 in its basic form, then collect like surds in the numerator and the denominator.'
        write: 'Solution'
      - section: 'Basic form'
        say: '12 is 4 times 3, and 4 is a perfect square. Picture a square of area 12 made of four small squares of area 3.'
        doodle: {name: 'custom:1995_q08_a', id: tiles, caption: '12 = four squares of 3'}
        write: '$\sqrt{12} = \sqrt{4 \times 3}$'
      - say: 'By the law of surds, that is root 4 times root 3. Root 4 is 2, so root 12 is 2 root 3, and two small sides make the big side.'
        doodle_do:
          - {id: tiles, op: stage, stage: 'custom:1995_q08_a2'}
        write: '$= \sqrt{4} \times \sqrt{3} = 2\sqrt{3}$ $\quad [\sqrt{ab} = \sqrt{a} \times \sqrt{b}]$'
        point:
          - {line: 3, kind: highlight, at: '= 23', to: {doodle: tiles, part: total}}
      - section: 'Substitute'
        say: 'Replace root 12 with 2 root 3, in the numerator and in the denominator.'
        write: '$\therefore \dfrac{\sqrt{12} - \sqrt{3}}{\sqrt{12} + \sqrt{3}} = \dfrac{2\sqrt{3} - \sqrt{3}}{2\sqrt{3} + \sqrt{3}}$'
      - say: 'The numerator is 2 root 3 minus 1 root 3, which is root 3, like 2 small sides minus 1 side.'
        doodle_do:
          - {id: tiles, op: pulse, part: side}
        write: 'Numerator: $2\sqrt{3} - \sqrt{3} = \sqrt{3}$'
      - say: 'The denominator is 2 root 3 plus 1 root 3, which is 3 root 3.'
        write: 'Denominator: $2\sqrt{3} + \sqrt{3} = 3\sqrt{3}$'
      - section: 'Divide'
        say: 'So the fraction is root 3 over 3 root 3. Root 3 is a factor of the numerator and the denominator, so it cancels, leaving 1 over 3.'
        write: '$\therefore$ Fraction $= \dfrac{\sqrt{3}}{3\sqrt{3}} = \dfrac{1}{3}$'
      - section: 'Check'
        say: 'Check with decimals. Root 12 is about 3.46 and root 3 about 1.73. The numerator is 1.73, the denominator is 5.19, and 1.73 over 5.19 is about 0.33, which is 1 over 3.'
        write: 'Check: $\dfrac{3.46 - 1.73}{3.46 + 1.73} = \dfrac{1.73}{5.19} \approx 0.33\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the expression simplifies to 1 over 3, which is option A.'
        write: '$\therefore$ the answer is $\dfrac{1}{3}$'
        answer: true
    traps:
      B: 'You went for 0. The numerator is not zero: root 12 is 2 root 3, and 2 root 3 minus root 3 leaves root 3.'
      C: 'You went for 9 over 15. That treats root 12 and root 3 as plain 12 and 3. Put root 12 in basic form, 2 root 3, first, and the fraction becomes 1 over 3.'
      D: 'You went for 1. That would need the numerator and denominator to be equal, but the numerator is root 3 and the denominator is 3 root 3.'

  9:
    moments:
      - section: 'The question'
        say: 'Four boys play in both the school''s first eleven cricket team and its first fourteen rugby team. How many boys play for at least one of the two teams? The team sizes are hiding in the names.'
        write: 'Cricket: first eleven; rugby: first fourteen; both: 4'
        doodle: {name: 'custom:1995_q09_a', id: teams, caption: 'cricket 11, rugby 14, 4 in both'}
      - section: 'Solution'
        say: 'Solution. A first eleven has 11 players and a first fourteen has 14. So n of C, cricket, is 11, and n of R, rugby, is 14.'
        write: '$n(C) = 11,\ n(R) = 14$'
      - say: 'The 4 boys in both teams are C intersection R. Intersection means in both sets.'
        write: '$n(C \cap R) = 4$'
        doodle_do:
          - {id: teams, op: circle, part: both}
      - say: 'At least one team means cricket, or rugby, or both. That is C union R. We want n of C union R.'
        write: 'At least one team: $n(C \cup R) = ?$'
      - section: 'The Venn diagram'
        say: 'Now the Venn diagram, with a circle for cricket and a circle for rugby. The 4 in both go in the overlap first.'
        diagram: {id: v, kind: venn, sets: [{key: C, name: Cricket, total: 11}, {key: R, name: Rugby, total: 14}]}
        diagram_do:
          - {id: v, op: fill, part: 'C∩R', text: '4', colour: blue, 'on': overlap}
      - say: 'Cricket only is 11 minus 4, which is 7. Rugby only is 14 minus 4, which is 10.'
        write: 'Cricket only $= 11 - 4 = 7$, rugby only $= 14 - 4 = 10$'
        diagram_do:
          - {id: v, op: fill, part: 'C only', text: '7', 'on': 'is 7'}
          - {id: v, op: fill, part: 'R only', text: '10', 'on': 'is 10'}
        doodle_do:
          - {id: teams, op: label, part: cricket, text: '7 cricket only'}
          - {id: teams, op: label, part: rugby, text: '10 rugby only'}
      - say: 'C union R is all three regions inside the circles, so 7 plus 4 plus 10.'
        write: '$n(C \cup R) = 7 + 4 + 10 = 21$'
        diagram_do:
          - {id: v, op: shade, part: 'C∪R', colour: green, text: 'C ∪ R: 21', 'on': 'all three regions'}
      - section: 'Check by the formula'
        say: 'Check with the formula. n of C union R equals n of C plus n of R minus n of C intersection R.'
        write: '$n(C \cup R) = n(C) + n(R) - n(C \cap R)$'
      - say: 'That is 11 plus 14 minus 4. 11 plus 14 is 25, and 25 minus 4 is 21. The same.'
        write: '$= 11 + 14 - 4 = 25 - 4 = 21\ \checkmark$'
      - say: 'Why minus 4? The 4 boys in both teams are counted once in the 11 and again in the 14. Subtracting 4 counts them once.'
        write: 'The 4 in both are counted twice in $11 + 14$'
      - section: 'Answer'
        say: 'Therefore 21 boys play for at least one of the two teams, which is answer choice B.'
        write: '$\therefore$ 21 boys play for at least one team'
        answer: true
    traps:
      A: 'You went for 25. That is 11 plus 14, which counts the 4 boys in both teams twice. Subtract them once: 25 minus 4 is 21.'
      C: 'You went for 16. Check the team sizes: a first eleven has 11 players and a first fourteen has 14. The regions are 7, 4 and 10, which make 21.'
      D: 'You went for 3. That is far too small: the rugby team alone has 14 boys. The regions 7, 4 and 10 make 21.'

  10:
    moments:
      - section: 'The question'
        say: '$S$ is the set of $x$ such that $x$ squared equals 9, and $x$ is greater than 4. We want to know what $S$ is.'
        write: 'Solution: $S = \{x : x^{2} = 9,\; x > 4\}$'
      - say: 'An element of $S$ must satisfy both conditions after the colon, at the same time.'
        write: 'Condition 1: $x^{2} = 9$; condition 2: $x > 4$'
      - section: 'Condition 1'
        say: 'Solve the first condition. Take the square root of both sides, and remember the plus or minus, because a negative number squared is positive too.'
        write: '$x^{2} = 9 \Rightarrow x = \pm\sqrt{9}$'
      - say: 'The square root of 9 is 3. So $x$ is 3 or negative 3. Picture $S$ as a bag. These two wait outside, and each must pass the second test to get in.'
        write: '$\therefore x = 3$ or $x = -3$'
        doodle: {name: 'custom:1995_q10_a', id: bag, caption: 'who gets into the bag S?'}
      - section: 'Condition 2'
        say: 'Now test each against the second condition, $x$ greater than 4. Is 3 greater than 4? No, so 3 stays out.'
        write: '$x = 3$: $\ 3 > 4$ is false'
        point:
          - {line: 1, kind: underline, at: 'x > 4', text: 'condition 2'}
        doodle_do:
          - {id: bag, op: cross, part: c3}
      - say: 'Is negative 3 greater than 4? No, it is even smaller. Negative 3 stays out too.'
        write: '$x = -3$: $\ -3 > 4$ is false'
        doodle_do:
          - {id: bag, op: cross, part: cm3}
      - section: 'The set'
        say: 'No number satisfies both conditions, so $S$ has no elements, and n of $S$ is 0.'
        write: '$n(S) = 0$'
        doodle_do:
          - {id: bag, op: label, part: bag, text: 'nothing inside'}
      - say: 'A set with no elements is the empty set, written as a circle with a stroke through it, or as empty braces.'
        write: 'Empty set: $\varnothing$ or $\{\ \}$'
      - section: 'Check'
        say: 'To check, any $x$ greater than 4 has $x$ squared greater than 16, so it can never equal 9. Nothing can get in.'
        write: 'Check: $x > 4 \Rightarrow x^{2} > 16 \ne 9\ \checkmark$'
      - say: 'Be careful with the options. 0 is a number, not a set. And the set containing 0 has one element, so it is not empty.'
        write: 'Note: $\varnothing \ne \{0\},\quad \varnothing \ne 0$'
      - section: 'Answer'
        say: 'Therefore $S$ is the empty set, which is option C.'
        write: '$\therefore S = \varnothing$'
        answer: true
    traps:
      A: 'You went for 0. That is a number, not a set. A set with no elements is the empty set.'
      B: 'You went for the set containing 0. That set has one element, the number zero. But 0 squared is not 9, so 0 is not in $S$, and $S$ has no elements.'
      D: 'You went for the set containing the empty set. That set has one element in it. $S$ has none, so it is just the empty set itself.'
  11:
    moments:
      - section: 'The question'
        say: 'Two factors, two unknowns. Each factor gives one equation in $p$ and $q$. Watch the signs when minus 1 goes in, because that is where marks are lost.'
        write: 'Factors $(x - 1)$ and $(x + 1)$; find $p$ and $q$'
      - section: 'Solution'
        say: 'Solution. Let $f$ of $x$ be the expression.'
        write: 'Let $f(x) = x^{3} + px^{2} + qx + 6$'
      - say: 'Recall the factor theorem, which says $x$ minus $a$ is a factor if $f$ of $a$ is zero. Picture $f$ as a machine. Feed in $a$, and out comes zero.'
        write: '$(x - a)$ is a factor $\Leftrightarrow f(a) = 0$'
        doodle: {name: 'custom:1995_q11_a', id: mach, caption: 'a factor makes the machine give 0', 'on': 'Picture'}
      - section: 'First factor'
        say: 'Let $x$ minus 1 equal zero. Then $x$ is 1.'
        write: 'Let $x - 1 = 0$, $\therefore x = 1$'
        doodle_do:
          - {id: mach, op: highlight, part: in1}
      - say: 'Substitute 1 for every $x$, each value in brackets. The machine must give zero.'
        write: '$f(1) = (1)^{3} + p(1)^{2} + q(1) + 6 = 0$'
        doodle_do:
          - {id: mach, op: arrow, part: in1, to_part: out, 'on': 'machine'}
      - say: '1 cubed is 1, and 1 squared is 1.'
        write: '$1 + p + q + 6 = 0$'
      - say: '1 plus 6 is 7. Subtract 7 from both sides. Label this equation 1.'
        write: '$p + q = -7 \quad \ldots\ldots (1)$'
      - section: 'Second factor'
        say: 'Let $x$ plus 1 equal zero. Then $x$ is minus 1.'
        write: 'Let $x + 1 = 0$, $\therefore x = -1$'
        doodle_do:
          - {id: mach, op: highlight, part: in2}
      - say: 'Substitute minus 1 for every $x$, each value in brackets. Out must come zero again.'
        write: '$f(-1) = (-1)^{3} + p(-1)^{2} + q(-1) + 6 = 0$'
        doodle_do:
          - {id: mach, op: arrow, part: in2, to_part: out, 'on': 'zero'}
      - say: 'Careful with the signs. Minus 1 cubed is minus 1, but minus 1 squared is plus 1. And $q$ times minus 1 is minus $q$.'
        write: '$-1 + p - q + 6 = 0$'
      - say: 'Minus 1 plus 6 is 5. Subtract 5 from both sides. Label this equation 2.'
        write: '$p - q = -5 \quad \ldots\ldots (2)$'
      - section: 'Solve (1) and (2)'
        say: 'The $q$ terms have opposite signs, so add the equations. $q$ plus minus $q$ is zero. Minus 7 plus minus 5 is minus 12.'
        write: '(1) + (2): $\ 2p = -12$'
      - say: 'Divide both sides by 2. Minus 12 over 2 is minus 6.'
        write: '$p = -6$'
      - say: 'Substitute $p = -6$ in equation 1.'
        write: 'Sub. $p = -6$ in (1): $\ -6 + q = -7$'
      - say: 'Add 6 to both sides. Minus 7 plus 6 is minus 1.'
        write: '$q = -7 + 6 = -1$'
      - section: 'Check'
        say: 'Check $x = -1$ with $p = -6$ and $q = -1$. Minus 1, minus 6, plus 1, plus 6. That is zero, so the machine gives zero.'
        write: 'Check: $f(-1) = -1 - 6 + 1 + 6 = 0$'
        doodle_do:
          - {id: mach, op: circle, part: out, 'on': 'machine'}
      - say: 'Therefore $p$ is minus 6 and $q$ is minus 1, which is answer choice A.'
        write: '$\therefore p = -6,\ q = -1$'
        answer: true
    traps:
      B: 'You went for 6 and 1. Those are the right sizes with the wrong signs. From $p + q = -7$ and $p - q = -5$, both come out negative.'
      C: 'You went for minus 1 and 6. Try $x = 1$: 1 minus 1 plus 6 plus 6 is 12, not zero. Adding equations (1) and (2) gives $2p = -12$, so $p = -6$.'
      D: 'You went for 6 and minus 6. Those give $p + q = 0$, but the factor $x - 1$ needs $p + q = -7$. Solving the pair gives $p = -6$ and $q = -1$.'

  12:
    moments:
      - section: 'The question'
        say: 'A remainder of 6 when divided by $x + 1$. No long division is needed, because the remainder theorem gives the remainder in one substitution.'
        write: '$2x^{2} - px + p$ divided by $x + 1$ leaves 6'
      - section: 'Solution'
        say: 'Solution. Let $f$ of $x$ be the expression.'
        write: 'Let $f(x) = 2x^{2} - px + p$'
      - say: 'Recall the remainder theorem. When $f$ of $x$ is divided by $x$ minus $a$, the remainder is $f$ of $a$. Picture a machine, so feed in $a$, and out comes the remainder.'
        write: 'Remainder of $f(x) \div (x - a)$ is $f(a)$'
        doodle: {name: 'custom:1995_q12_a', id: mach, caption: 'feed in −1, out comes 6', 'on': 'Picture'}
      - say: 'Let the divisor, $x$ plus 1, equal zero. Then $x$ is minus 1.'
        write: 'Let $x + 1 = 0$, $\therefore x = -1$'
        doodle_do:
          - {id: mach, op: highlight, part: in1}
      - section: 'Find the remainder'
        say: 'So the remainder is $f$ of minus 1. Substitute minus 1 for every $x$, each value in brackets.'
        write: 'Remainder $= f(-1) = 2(-1)^{2} - p(-1) + p$'
      - say: 'Minus 1 squared is plus 1. And minus $p$ times minus 1 gives plus $p$, because a negative times a negative is positive.'
        write: '$= 2(1) + p + p$'
      - say: '2 times 1 is 2, and $p$ plus $p$ is $2p$.'
        write: '$= 2 + 2p$'
      - section: 'Solve for p'
        say: 'The question says the remainder is 6, and that is what comes out of the machine. So 2 plus $2p$ equals 6.'
        write: '$2 + 2p = 6$'
        doodle_do:
          - {id: mach, op: circle, part: out, text: 'remainder 6', 'on': 'machine'}
      - say: 'Subtract 2 from both sides. 6 minus 2 is 4.'
        write: '$2p = 6 - 2 = 4$'
      - say: 'Divide both sides by 2. 4 over 2 is 2, which is positive, as the question asks.'
        write: '$p = \dfrac{4}{2} = 2$'
      - section: 'Check'
        say: 'Check with $p = 2$. $f$ of minus 1 is 2 times 1, minus 2 times minus 1, plus 2. That is 2 plus 2 plus 2, which is 6.'
        write: 'Check: $f(-1) = 2(1) - 2(-1) + 2 = 6$'
      - say: 'Therefore $p$ is 2, which is answer choice B.'
        write: '$\therefore p = 2$'
        answer: true
    traps:
      A: 'You went for 1. Then the remainder would be 2 plus 2 times 1, which is 4, not 6. Solving 2 plus $2p$ equals 6 gives $p = 2$.'
      C: 'You went for 3. Then the remainder would be 2 plus 6, which is 8, not 6. Both $p$ terms come out positive, so it is 2 plus $2p$ equals 6, and $p = 2$.'
      D: 'You went for 4. That is the value of $2p$, not $p$. Divide both sides by 2 at the last step: $p = 2$.'

  13:
    moments:
      - section: 'The question'
        say: '$T$ is wrapped in layers, which are $2r$ outside, a square root, a plus $K$, and $Q\pi$. Undo them one per line, outside first, and name each step.'
        write: 'Make $T$ the subject: $\ s = 2r\sqrt{Q\pi T + K}$'
        doodle: {name: 'custom:1995_q13_a', id: layers, caption: 'T wrapped in layers'}
      - section: 'Solution'
        say: 'Solution. First, divide both sides by $2r$, the factor outside the root.'
        write: 'Divide both sides by $2r$: $\ \dfrac{s}{2r} = \sqrt{Q\pi T + K}$'
      - say: 'Square both sides to remove the root. $2r$ squared is $4r$ squared. Square the whole side, not one piece of it.'
        write: 'Square both sides: $\ \dfrac{s^{2}}{4r^{2}} = Q\pi T + K$'
        doodle_do:
          - {id: layers, op: cross, part: root}
      - say: 'Subtract $K$ from both sides, so that the $T$ term stands alone on the right.'
        write: 'Subtract $K$: $\ \dfrac{s^{2}}{4r^{2}} - K = Q\pi T$'
        doodle_do:
          - {id: layers, op: cross, part: k}
      - say: 'Divide both sides by $Q\pi$, the last layer. Divide every term on the left, the $K$ as well as the first term.'
        write: 'Divide by $Q\pi$: $\ T = \dfrac{s^{2}}{4r^{2}Q\pi} - \dfrac{K}{Q\pi}$'
        doodle_do:
          - {id: layers, op: cross, part: qpi}
          - {id: layers, op: circle, part: core, text: 'T on its own'}
      - say: 'Rearrange the letters in each denominator to match the options, so we get $4\pi r^{2}Q$, and $\pi Q$. The order of a product does not change it.'
        write: '$T = \dfrac{s^{2}}{4\pi r^{2}Q} - \dfrac{K}{\pi Q}$'
      - section: 'Check'
        say: 'Check by working back. $Q\pi$ times $T$ is $s$ squared over $4r$ squared, minus $K$. Add $K$, and the $K$ terms cancel.'
        write: 'Check: $Q\pi T + K = \dfrac{s^{2}}{4r^{2}} - K + K = \dfrac{s^{2}}{4r^{2}}$'
      - say: 'The square root of that is $s$ over $2r$, and $2r$ times $s$ over $2r$ is $s$. We are back to the start.'
        write: '$2r\sqrt{\dfrac{s^{2}}{4r^{2}}} = 2r \times \dfrac{s}{2r} = s$'
      - say: 'Therefore $T$ equals $s$ squared over $4\pi r^{2}Q$, minus $K$ over $\pi Q$, which is answer choice B.'
        write: '$\therefore T = \dfrac{s^{2}}{4\pi r^{2}Q} - \dfrac{K}{\pi Q}$'
        answer: true
    traps:
      A: 'You went for the option with a 2 and $K$ over $Q$. When you square $2r$ you get $4r^{2}$, not $2r^{2}$. And the last division is by $Q\pi$, so $K$ becomes $K$ over $\pi Q$.'
      C: 'You went for the option with a 2 and a plain $K$. Two slips: $2r$ squared is $4r^{2}$, and when you divide by $Q\pi$ you must divide the $K$ as well.'
      D: 'You went for the option ending in minus $K$. The first term is right, but dividing by $Q\pi$ divides every term, so the $K$ becomes $K$ over $\pi Q$.'
  14:
    moments:
      - section: 'The question'
        say: 'Where does this U-shaped curve cut the $x$-axis? Many students find the right two numbers here, then lose the signs. Let''s set it out the way you write it in the exam.'
        write: '$f(x) = x^{2} - 5x + 6$'
        show_sketch: true
        point:
          - {figure: sketch, kind: underline, target: 'y = x² − 5x + 6'}
      - section: 'Solution'
        say: 'Solution. Every point on the $x$-axis has height zero. So the curve crosses the axis where $f(x)$ equals zero.'
        write: 'On the $x$-axis, $y = 0$:'
        'on': 'height zero'
        point:
          - {figure: sketch, kind: circle, target: 'x', text: 'x-axis: y = 0', 'on': 'height zero'}
      - say: 'So we set the expression equal to zero. That gives a quadratic equation to solve.'
        write: '$x^{2} - 5x + 6 = 0$'
      - section: 'Factorise: product and sum'
        say: 'We factorise by product and sum. Here a is 1, b is minus 5 and c is 6. The product is a times c, 1 times 6, which is 6. The sum is b, minus 5.'
        write: 'Product $= ac = 6$, Sum $= b = -5$'
      - say: 'Now find two numbers that multiply to 6 and add up to minus 5. Minus 2 times minus 3 is 6, and minus 2 plus minus 3 is minus 5.'
        write: 'Factors: $-2,\ -3$'
      - say: 'Use the two numbers to split the middle term. Minus $5x$ becomes minus $2x$ minus $3x$.'
        write: '$x^{2} - 2x - 3x + 6 = 0$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '[[−2]], −3'}, at: '−2x', text: 'split'}
          - {line: 5, kind: move, from: {line: 4, at: '−2, [[−3]]'}, at: '−3x'}
      - say: 'Group in pairs. From the first pair take out $x$, leaving $x - 2$. From the second pair take out minus 3, leaving $x - 2$ again.'
        write: '$x(x - 2) - 3(x - 2) = 0$'
      - say: 'The two brackets are the same, so the grouping is right. Take out the common bracket, $x - 2$. What is left over is $x - 3$.'
        write: '$(x - 2)(x - 3) = 0$'
        point:
          - {line: 7, kind: underline, at: '(x − 2)', text: 'common bracket'}
      - say: 'Two brackets multiply to give zero. That can only happen if one of them is zero.'
        write: 'Either $x - 2 = 0$ or $x - 3 = 0$'
      - say: 'Add 2 to both sides of the first, and add 3 to both sides of the second. Watch the curve, because it cuts the axis at exactly these two places.'
        write: '$\therefore x = 2$ or $x = 3$'
        point:
          - {figure: sketch, kind: label, target: {x: 174, y: 190}, text: 'x = 2', 'on': 'Watch'}
          - {figure: sketch, kind: label, target: {x: 216, y: 190}, text: 'x = 3', 'on': 'Watch'}
      - section: 'Check'
        say: 'Check $x = 2$. 2 squared is 4, 5 times 2 is 10, and 4 minus 10 plus 6 is zero.'
        write: 'Check: $f(2) = 4 - 10 + 6 = 0$'
      - say: 'Check $x = 3$. 3 squared is 9, 5 times 3 is 15, and 9 minus 15 plus 6 is zero. Both roots work.'
        write: '$f(3) = 9 - 15 + 6 = 0$'
      - say: 'A point on the $x$-axis has $y$ equal to zero. Therefore the curve crosses at 2, 0 and at 3, 0, which is answer choice D.'
        write: '$\therefore$ the points are $(2,\ 0)$ and $(3,\ 0)$'
        answer: true
    traps:
      A: 'You went for minus 6 and minus 1. Those are the roots of $x^2 + 7x + 6$, where the product is 6 but the sum is plus 7. Our sum is minus 5, so the factors are minus 2 and minus 3, and the roots are 2 and 3.'
      B: 'You went for minus 3 and minus 2. You found the right factors, minus 2 and minus 3, but kept their signs. From $x - 2 = 0$, $x$ is plus 2, and from $x - 3 = 0$, $x$ is plus 3.'
      C: 'You went for minus 6 and 1. Those are the roots of $x^2 + 5x - 6$, where the product is minus 6. Our product is plus 6. Test $x = 1$: 1 minus 5 plus 6 is 2, not zero.'

  15:
    moments:
      - section: 'The question'
        say: 'Four terms, and no factor common to all four. That is the signal for grouping. The skill is choosing the right pairs and watching the signs.'
        write: 'Factorise $abx^{2} + 6y - 3ax - 2byx$ completely'
      - section: 'Solution'
        say: 'Solution. We factorise by grouping. First rearrange. $2byx$ is the same as $2bxy$, so put the two terms with $b$ first, each keeping its own sign.'
        write: 'Rearrange: $\ abx^{2} - 2bxy - 3ax + 6y$'
      - say: 'Bracket them in pairs. A minus outside a bracket changes both signs inside, so minus $3ax$ plus $6y$ becomes minus, bracket, $3ax - 6y$.'
        write: '$= (abx^{2} - 2bxy) - (3ax - 6y)$'
      - section: 'Common factors'
        say: 'From the first pair take out $bx$, leaving $ax - 2y$. From the second pair take out 3, so $3ax$ over 3 is $ax$, and $6y$ over 3 is $2y$. The minus stays in front.'
        write: '$= bx(ax - 2y) - 3(ax - 2y)$'
        doodle: {name: 'custom:1995_q15_a', id: parcels, caption: 'the same bracket twice'}
      - say: 'The two brackets are the same, so the grouping is right. Take out the common bracket, $ax - 2y$. What is left over is $bx$ minus 3.'
        write: '$= (ax - 2y)(bx - 3)$'
        point:
          - {line: 4, kind: underline, at: '(ax − 2y)', text: 'common bracket'}
        doodle_do:
          - {id: parcels, op: stage, stage: 'custom:1995_q15_a2'}
          - {id: parcels, op: circle, part: parcel2, text: 'same bracket'}
      - section: 'Check'
        say: 'Check by expanding. $ax$ times $bx$ is $abx^{2}$, and $ax$ times minus 3 is minus $3ax$.'
        write: 'Check: $ax(bx - 3) = abx^{2} - 3ax$'
      - say: 'Minus $2y$ times $bx$ is minus $2bxy$, and minus $2y$ times minus 3 is plus $6y$.'
        write: '$-2y(bx - 3) = -2bxy + 6y$'
      - say: 'Add the two results. All four terms of the question are back, so the factors are right.'
        write: 'Sum $= abx^{2} - 3ax - 2bxy + 6y \ \checkmark$'
      - say: 'Therefore the expression factorises as $ax - 2y$, times $bx - 3$, which is answer choice A.'
        write: '$\therefore$ expression $= (ax - 2y)(bx - 3)$'
        answer: true
    traps:
      B: 'You went for $(bx + 3)(2y - ax)$. Expand it and the $abx^{2}$ term comes out negative, but in the question it is positive. Taking out minus 3 from the second pair gives $(ax - 2y)(bx - 3)$.'
      C: 'You went for $(bx + 3)(ax - 2y)$. Expanding gives $+3ax - 6y$, but the question has $-3ax + 6y$. Take out minus 3, not plus 3, from the second pair.'
      D: 'You went for $(ax - 2y)(ax - b)$. Expanding gives an $a^{2}x^{2}$ term, which is not in the question. The second bracket comes from taking out $bx$ and minus 3: it is $bx - 3$.'

  16:
    moments:
      - section: 'The question'
        say: 'The quadratic is already factorised, which saves a step. The real question is the ends. Does "less than or equal to" let 3 and 4 in?'
        write: '$(x - 3)(x - 4) \le 0$'
      - say: 'Solution. Find the critical values, where each bracket is zero. $x$ minus 3 is zero at 3, and $x$ minus 4 is zero at 4.'
        write: 'Solution: critical values $\ x = 3,\ \ x = 4$'
      - section: 'Sign table'
        say: 'Now the sign table. The critical values split the number line into three regions, one column each. One row for each bracket, then the product.'
        diagram:
          id: t
          kind: table
          columns: ['Factor', 'x < 3', '3 < x < 4', 'x > 4']
          rows: [['x − 3', '', '', ''], ['x − 4', '', '', ''], ['product', '', '', '']]
      - say: '$x$ minus 3 is negative below 3, and positive above it.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,2', text: '−'}
          - {id: t, op: fill, part: 'cell:1,3', text: '+'}
          - {id: t, op: fill, part: 'cell:1,4', text: '+'}
      - say: '$x$ minus 4 is negative below 4, and positive above it.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:2,2', text: '−'}
          - {id: t, op: fill, part: 'cell:2,3', text: '−'}
          - {id: t, op: fill, part: 'cell:2,4', text: '+'}
      - say: 'Multiply down each column. Minus times minus is plus. Plus times minus is minus. Plus times plus is plus.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:3,2', text: '+'}
          - {id: t, op: fill, part: 'cell:3,3', text: '−', colour: green}
          - {id: t, op: fill, part: 'cell:3,4', text: '+'}
      - say: 'The product is negative only in the middle column, between 3 and 4.'
        write: 'Product $< 0$ for $3 < x < 4$'
      - section: 'The ends'
        say: 'But the sign is less than or equal to. So we also want where the product is exactly zero, which is at the critical values themselves.'
        write: 'Product $= 0$ at $x = 3$ and $x = 4$'
      - say: 'Together, the middle region with both ends included.'
        write: '$\therefore\ 3 \le x \le 4$'
      - section: 'The number line'
        say: 'On a number line, put closed circles at 3 and 4, because both are included, and shade the stretch between them.'
        diagram: {id: n, kind: numberline, range: [1, 6]}
        diagram_do:
          - {id: n, op: interval, from: 3, to: 4, from_open: false, to_open: false, text: '3 ≤ x ≤ 4', answer: true, 'on': 'closed circles'}
      - section: 'Check'
        say: 'Check 3.5, which is inside. 0.5 times minus 0.5 is minus 0.25, which is at most 0. And 5, outside, gives 2 times 1, which is 2, and that is not.'
        write: 'Check: $\ (0.5)(-0.5) = -0.25 \le 0\ \checkmark;\ \ (2)(1) = 2 > 0\ \times$'
      - say: 'So $x$ runs from 3 to 4, ends included, which is option A.'
        write: '$3 \le x \le 4$'
        answer: true
    traps:
      B: 'You went for $3 < x < 4$. That solves "less than zero". The sign is less than or equal to, so 3 and 4, where the product is exactly zero, are included too.'
      C: 'You went for $3 \le x < 4$. You included 3 but left out 4. At $x = 4$ the product is 1 times 0, which is 0, so 4 belongs too.'
      D: 'You went for $3 < x \le 4$. You included 4 but left out 3. At $x = 3$ the product is 0 times minus 1, which is 0, so 3 belongs too.'

  17:
    moments:
      - section: 'The question'
        say: 'In an A.P., the 4th term is 13 and the 10th term is 31. We want the 21st term. We know neither the first term nor the common difference, so we find both.'
        write: '$T_{4} = 13,\quad T_{10} = 31,\quad T_{21} = ?$'
        doodle: {name: 'custom:1995_q17_a', id: stairs, caption: 'equal steps: 13 at step 4, 31 at step 10', size: scene}
      - section: 'Solution'
        say: 'Solution. Let the first term be $a$ and the common difference be $d$. The $n$th term of an A.P. is $a$ plus $n$ minus 1, times $d$.'
        write: 'Solution: $T_{n} = a + (n - 1)d$'
      - say: 'For the 4th term, $n$ minus 1 is 3. Call this equation 1.'
        write: '$T_{4} = a + 3d = 13 \quad \ldots (1)$'
      - say: 'For the 10th term, $n$ minus 1 is 9. Call this equation 2.'
        write: '$T_{10} = a + 9d = 31 \quad \ldots (2)$'
      - say: 'Subtract equation 1 from equation 2, so that $a$ goes. $9d$ minus $3d$ is $6d$, and 31 minus 13 is 18. On the stairs, 6 steps climb 18.'
        write: '$(2) - (1):\quad 6d = 18$'
        doodle_do:
          - {id: stairs, op: highlight, part: rise, text: '6 steps: 18'}
      - say: 'Divide both sides by 6.'
        write: '$\therefore\ d = \dfrac{18}{6} = 3$'
        doodle_do:
          - {id: stairs, op: label, part: onestep, text: 'each step 3'}
      - say: 'Substitute $d$ equals 3 in equation 1. 3 times 3 is 9.'
        write: 'Sub. $d = 3$ in (1): $\ a + 9 = 13$'
      - say: 'Subtract 9 from both sides. 13 minus 9 is 4.'
        write: '$\therefore\ a = 4$'
      - section: 'The 21st term'
        say: 'For the 21st term, $n$ minus 1 is 20. Substitute $a$ equals 4 and $d$ equals 3.'
        write: '$T_{21} = a + 20d = 4 + 20(3)$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: 'a = 4'}, at: '= [[4]] +', text: 'a'}
          - {line: 8, kind: move, from: {line: 5, at: '= 3'}, at: '(3)', text: 'd'}
      - say: '20 times 3 is 60, and 4 plus 60 is 64.'
        write: '$= 4 + 60 = 64$'
      - say: 'Therefore the 21st term is 64, the height of step 21.'
        write: '$\therefore\ T_{21} = 64$'
        doodle_do:
          - {id: stairs, op: label, part: s21, text: '64'}
      - section: 'Check'
        say: 'Check equation 2 with these values. 4 plus 9 times 3 is 4 plus 27, which is 31. Correct.'
        write: 'Check: $T_{10} = 4 + 9(3) = 31\ \checkmark$'
      - say: 'Therefore the 21st term is 64, which is answer choice C.'
        write: '$\therefore\ T_{21} = 64$'
        answer: true
    traps:
      A: 'You went for 175. That is far too big for steps of 3. The 21st term is $a$ plus 20 $d$: 4 plus 60, which is 64.'
      B: 'You went for 85. That is 4 plus 27 times 3, as if there were 27 steps. For the 21st term, $n$ minus 1 is 20, so it is 4 plus 60, which is 64.'
      D: 'You went for 45. That is too small. Starting from 4 and adding 3 twenty times gives 4 plus 60, which is 64.'
  18:
    moments:
      - section: 'The question'
        say: 'A cubic on the bottom looks frightening. But it hides the very brackets on top. Factorise the top and the bottom, and almost everything cancels.'
        write: 'Simplify $\dfrac{x^{2} - 1}{x^{3} + 2x^{2} - x - 2}$'
      - section: 'Solution'
        say: 'Solution. Factorise the top first. $x$ squared minus 1 is $x$ squared minus 1 squared, a difference of two squares. So it is $x - 1$ times $x + 1$.'
        write: 'Numerator: $x^{2} - 1 = (x - 1)(x + 1)$'
      - section: 'Factorise the bottom'
        say: 'Now the bottom. It has four terms and no factor common to all four, so we factorise by grouping, two terms at a time.'
        write: 'Denominator: $x^{3} + 2x^{2} - x - 2$'
      - say: 'From the first pair take out $x$ squared, leaving $x + 2$. From the second pair take out minus 1, leaving $x + 2$ again.'
        write: '$= x^{2}(x + 2) - 1(x + 2)$'
      - say: 'The brackets match, so take out the common bracket, $x + 2$. What is left over is $x$ squared minus 1.'
        write: '$= (x + 2)(x^{2} - 1)$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '1[[(x + 2)]]'}, at: '(x + 2)', text: 'taken out'}
      - say: 'And $x$ squared minus 1 is the same difference of two squares we met on top.'
        write: '$= (x + 2)(x - 1)(x + 1)$'
        point:
          - {line: 5, kind: arrow, from: {line: 1, at: '(x − 1)(x + 1)'}, at: '(x − 1)(x + 1)', text: 'same as the top'}
      - section: 'Cancel'
        say: 'Now write the fraction with both parts factorised. Picture each bracket as a tile, with two on top and three underneath.'
        write: 'Fraction $= \dfrac{(x - 1)(x + 1)}{(x + 2)(x - 1)(x + 1)}$'
        doodle: {name: 'custom:1995_q18_a', id: tiles, caption: 'matching tiles top and bottom'}
      - say: '$x - 1$ is a factor of the top and of the bottom, so it cancels. So does $x + 1$.'
        write: '$= \dfrac{\cancel{(x - 1)}\cancel{(x + 1)}}{(x + 2)\cancel{(x - 1)}\cancel{(x + 1)}}$'
        doodle_do:
          - {id: tiles, op: cross, part: minus}
          - {id: tiles, op: cross, part: plus}
      - say: 'When every factor on top cancels, 1 is left on top. Over the one factor left underneath, that gives 1 over $x + 2$.'
        write: '$= \dfrac{1}{x + 2}$'
        doodle_do:
          - {id: tiles, op: circle, part: rest, text: '1 over x + 2'}
      - section: 'Check'
        say: 'Check with $x = 2$. The top is 4 minus 1, which is 3. The bottom is 8 plus 8 minus 2 minus 2, which is 12.'
        write: 'Check $x = 2$: $\ \dfrac{4 - 1}{8 + 8 - 2 - 2} = \dfrac{3}{12} = \dfrac{1}{4}$'
      - say: '3 over 12 is 1 over 4. And 1 over 2 plus 2 is also 1 over 4. They agree.'
        write: '$\dfrac{1}{2 + 2} = \dfrac{1}{4} \ \checkmark$'
      - say: 'Therefore the fraction simplifies to 1 over $x + 2$, which is answer choice A.'
        write: '$\therefore \dfrac{x^{2} - 1}{x^{3} + 2x^{2} - x - 2} = \dfrac{1}{x + 2}$'
        answer: true
    traps:
      B: 'You went for $x - 1$ over $x + 1$. The bottom has no $x + 1$ left over after cancelling. Factorise it fully: $(x + 2)(x - 1)(x + 1)$, and the whole top cancels.'
      C: 'You went for $x - 1$ over $x + 2$. You cancelled only one bracket. The bottom contains both $x - 1$ and $x + 1$, so both cancel and 1 is left on top.'
      D: 'You went for 1 over $x - 2$. Check the sign in the grouping: $x^{3} + 2x^{2}$ is $x^{2}$ times $x + 2$, so the bracket left is $x + 2$.'

  19:
    moments:
      - section: 'The question'
        say: 'One fraction with two brackets underneath can be split into two simpler fractions. The tops are hidden numbers, and one clever substitution finds each of them.'
        write: 'Express $\dfrac{5x - 12}{(x - 2)(x - 3)}$ in partial fractions'
      - section: 'Solution'
        say: 'Solution. The bottom has two different linear factors, so each gets its own fraction with a constant on top. Let the constants be $A$ and $B$.'
        write: 'Let $\dfrac{5x - 12}{(x - 2)(x - 3)} \equiv \dfrac{A}{x - 2} + \dfrac{B}{x - 3}$'
        doodle: {name: 'custom:1995_q19_a', id: snap, caption: 'one fraction snaps into two'}
      - say: 'Multiply through by $x - 2$ times $x - 3$, the LCM of the denominators. $A$ loses its $x - 2$, and $B$ loses its $x - 3$.'
        write: '$5x - 12 \equiv A(x - 3) + B(x - 2)$'
      - section: 'Find B'
        say: 'This identity is true for every $x$. Put $x = 3$, because it makes the bracket $x - 3$ zero, and the $A$ term disappears.'
        write: 'Put $x = 3$: $\ 5(3) - 12 = A(3 - 3) + B(3 - 2)$'
      - say: '5 times 3 is 15. 3 minus 3 is 0, and 3 minus 2 is 1.'
        write: '$15 - 12 = A(0) + B(1)$'
      - say: '15 minus 12 is 3, and $A$ times 0 is 0. So $B$ is 3.'
        write: '$\therefore B = 3$'
        doodle_do:
          - {id: snap, op: label, part: pb, text: 'B = 3'}
      - section: 'Find A'
        say: 'Now put $x = 2$, because it makes the bracket $x - 2$ zero, and the $B$ term disappears.'
        write: 'Put $x = 2$: $\ 5(2) - 12 = A(2 - 3) + B(2 - 2)$'
      - say: '5 times 2 is 10. 2 minus 3 is minus 1, and 2 minus 2 is 0.'
        write: '$10 - 12 = A(-1) + B(0)$'
      - say: '10 minus 12 is minus 2. $A$ times minus 1 is minus $A$, and $B$ times 0 is 0.'
        write: '$-2 = -A$'
      - say: 'Multiply both sides by minus 1. So $A$ is 2.'
        write: '$\therefore A = 2$'
        doodle_do:
          - {id: snap, op: label, part: pa, text: 'A = 2'}
      - section: 'Check'
        say: 'Check by adding them back over the LCM. The new top is 2 times $x - 3$, plus 3 times $x - 2$.'
        write: 'Check: $2(x - 3) + 3(x - 2)$'
      - say: '$2x$ minus 6 plus $3x$ minus 6 is $5x$ minus 12, the top we started with.'
        write: '$= 2x - 6 + 3x - 6 = 5x - 12 \ \checkmark$'
      - say: 'Therefore the partial fractions are 2 over $x - 2$, plus 3 over $x - 3$, which is answer choice B.'
        write: '$\therefore \dfrac{5x - 12}{(x - 2)(x - 3)} = \dfrac{2}{x - 2} + \dfrac{3}{x - 3}$'
        answer: true
    traps:
      A: 'You went for the option with a minus sign. At $x = 3$ the right side is $B$ times 1, and the left side is plus 3, so $B$ is plus 3 and the fractions are added.'
      C: 'You went for 2 over $x - 3$ minus 3 over $x - 2$. The constants are attached to the wrong brackets. Putting $x = 2$ picks out the constant over $x - 2$, and it is 2.'
      D: 'You went for 5 over $x - 3$ plus 4 over $x - 2$. Add them back and you get $9x - 22$ on top, not $5x - 12$. Substituting $x = 3$ and $x = 2$ gives 3 and 2.'

  20:
    moments:
      - section: 'The question'
        say: 'No algebra this time, because the graph does the work. $f(x)$ is the height of the curve, so $f(x) > 0$ asks where the curve is above the $x$-axis.'
        write: '$f(x) > 0$: where is the curve above the $x$-axis?'
        point:
          - {figure: 0, kind: circle, target: 'x', text: 'x-axis'}
      - say: 'Solution. First, the critical values, which are where the curve crosses the $x$-axis. It crosses at minus 1, at 1 and at 2.'
        write: 'Solution: $\ f(x) = 0$ at $x = -1,\ 1,\ 2$'
        point:
          - {figure: 0, kind: circle, target: '-1'}
          - {figure: 0, kind: circle, target: '1'}
          - {figure: 0, kind: circle, target: '2'}
      - section: 'Read each region'
        say: 'Left of minus 1, the curve is below the axis, so $f(x)$ is negative.'
        write: '$x < -1$: below, $f(x) < 0$'
        point:
          - {figure: 0, kind: label, target: {x: 112, y: 182}, text: 'below'}
      - say: 'Between minus 1 and 1, the curve rises over the axis, so $f(x)$ is positive.'
        write: '$-1 < x < 1$: above, $f(x) > 0$'
        point:
          - {figure: 0, kind: label, target: {x: 160, y: 82}, text: 'above'}
      - say: 'Between 1 and 2, it dips below again, so it is negative.'
        write: '$1 < x < 2$: below, $f(x) < 0$'
        point:
          - {figure: 0, kind: label, target: {x: 253, y: 170}, text: 'below'}
      - say: 'Beyond 2, it rises and stays above, so it is positive.'
        write: '$x > 2$: above, $f(x) > 0$'
        point:
          - {figure: 0, kind: label, target: {x: 295, y: 89}, text: 'above'}
      - section: 'Answer'
        say: 'So $f(x)$ is positive on two stretches. At minus 1, 1 and 2 themselves, $f(x)$ is exactly zero.'
        write: '$\therefore\ f(x) > 0$ for $-1 < x < 1$ and $x > 2$'
        point:
          - {line: 3, kind: underline, at: '−1 < x < 1', text: 'above'}
          - {line: 5, kind: underline, at: 'x > 2', text: 'above'}
      - say: 'On a number line, we draw a stretch from minus 1 to 1, and an arrow from 2 to the right.'
        diagram: {id: n, kind: numberline, range: [-3, 4]}
        diagram_do:
          - {id: n, op: interval, from: -1, to: 1, from_open: true, to_open: true, text: '−1 < x < 1', answer: true}
          - {id: n, op: interval, from: 2, from_open: true, text: 'x > 2', answer: true, 'on': 'arrow'}
      - say: 'Only option A is made of these two stretches, minus 1 to 1, and $x$ greater than 2. So the answer is option A.'
        write: '$\therefore$ Answer: A, the stretches $-1$ to $1$ and $x > 2$'
        answer: true
    traps:
      B: 'You went for the option starting with $x \le -1$. Left of minus 1 the curve is below the axis, so $f(x)$ is negative there, not positive.'
      C: 'You went for $x \le -1$ and $1 \le x \le 2$. Those are exactly the stretches where the curve is below the axis. The question wants where it is above.'
      D: 'You went for $x \le 2$ with $-1 \le x \le 1$. "$x \le 2$" takes in the stretch left of minus 1 and the dip between 1 and 2, where the curve is below the axis.'
  21:
    moments:
      - section: 'The question'
        say: 'Four rules, and only one of them is commutative. The test is the same for every option. Work out $a$ star $b$, then $b$ star $a$, and compare.'
        write: 'Which operation is commutative on the set of integers?'
      - say: 'Solution. Commutative means swapping the two elements never changes the result, so $a$ star $b$ equals $b$ star $a$, for all $a$ and $b$.'
        write: 'Solution. Commutative: $a * b = b * a$'
        doodle: {name: 'custom:1995_q21_a', id: swap, caption: 'swap the two elements'}
      - section: 'Option A'
        say: 'In option A, $a$ star $b$ is $a$ plus $2b$. For $b$ star $a$, the first element is now $b$, so it is $b$ plus $2a$.'
        write: 'A: $a * b = a + 2b,\ \ b * a = b + 2a$'
      - say: 'The 2 sits on a different letter each time, so $a + 2b$ is not $b + 2a$. Therefore A is not commutative.'
        write: '$a + 2b \neq b + 2a$ $\therefore$ not commutative'
      - section: 'Option B'
        say: 'In option B, $a$ star $b$ is $a$ plus $b$ minus $ab$. Swap them, and $b$ star $a$ is $b$ plus $a$ minus $ba$.'
        write: 'B: $a * b = a + b - ab,\ \ b * a = b + a - ba$'
      - say: 'Ordinary addition and multiplication are commutative, so $b$ plus $a$ is $a$ plus $b$, and $ba$ is $ab$. So $b$ star $a$ is $a$ plus $b$ minus $ab$.'
        write: '$b * a = a + b - ab$'
      - say: 'That is exactly $a$ star $b$. Therefore B is commutative.'
        write: '$\therefore a * b = b * a$, commutative'
        point:
          - {line: 6, kind: arrow, from: {line: 4, at: 'a ∗ b = a + b − ab'}, at: 'a ∗ b = b ∗ a', text: 'same'}
      - section: 'Option C'
        say: 'For option C, $a$ star $b$ is $a$ squared plus $b$. Swap them, and $b$ star $a$ is $b$ squared plus $a$. Only the first element is squared, so they differ.'
        write: 'C: $a * b = a^{2} + b \neq b^{2} + a = b * a$'
      - section: 'Option D'
        say: 'For option D, $a$ star $b$ is $a$ times, bracket, $b$ plus 1, over 2. Open the bracket to get $ab$ plus $a$, over 2.'
        write: 'D: $a * b = \dfrac{a(b + 1)}{2} = \dfrac{ab + a}{2}$'
      - say: 'Swap them, and $b$ star $a$ is $b$ times, bracket, $a$ plus 1, over 2, which is $ab$ plus $b$, over 2. That has $b$ where the other has $a$, so D is not commutative.'
        write: '$b * a = \dfrac{b(a + 1)}{2} = \dfrac{ab + b}{2} \neq a * b$'
      - section: 'Check'
        say: 'Check B with numbers, $a$ equals 1 and $b$ equals 2. 1 star 2 is 1 plus 2 minus 2, which is 1, and 2 star 1 is 2 plus 1 minus 2, also 1.'
        write: 'Check: $1 * 2 = 1 + 2 - 2 = 1,\ \ 2 * 1 = 2 + 1 - 2 = 1\ \checkmark$'
        doodle_do:
          - {id: swap, op: circle, part: row2, text: 'B: 1 = 1'}
      - section: 'Answer'
        say: 'Therefore the commutative operation is $a$ star $b$ equals $a$ plus $b$ minus $ab$, which is option B.'
        write: '$\therefore a * b = a + b - ab$'
        answer: true
    traps:
      A: 'You went for $a + 2b$. Swapping gives $b + 2a$, which is different: with 1 and 2 you get 5 one way and 4 the other. The 2 multiplies only the second element.'
      C: 'You went for $a^{2} + b$. Only the first element is squared, so swapping changes it: with 1 and 2 you get 3 one way and 5 the other.'
      D: 'You went for $a$ times $b + 1$, over 2. The plus 1 goes with the second element only, so swapping changes it: with 1 and 2 you get 3 over 2 one way and 2 the other.'

  22:
    moments:
      - section: 'The question'
        say: 'Two stars and a bracket. The trap is to work from left to right. Like BODMAS, the bracket comes first, and the answer of the bracket goes back into the rule.'
        write: '$a * b = +\sqrt{ab}$. Evaluate $2 * (12 * 27)$.'
      - say: 'Solution. Write the definition line, which says $a$ star $b$ is the positive square root of $a$ times $b$.'
        write: 'Solution: $a * b = +\sqrt{ab}$'
        doodle: {name: 'custom:1995_q22_a', id: mach, caption: 'multiply, then square root', size: scene}
      - section: 'The bracket first'
        say: 'Start inside the bracket, with 12 star 27. Here $a$ is 12 and $b$ is 27.'
        write: '$12 * 27 = \sqrt{12 \times 27}$'
      - say: 'Do not multiply out to a big number. Write 12 as 4 times 3, so we can find perfect squares.'
        write: '$= \sqrt{4 \times 3 \times 27}$'
      - say: '3 times 27 is 81, and 81 is a perfect square, 9 squared.'
        write: '$= \sqrt{4 \times 81}$'
      - say: 'The square root of 4 is 2, and the square root of 81 is 9. 2 times 9 is 18. In the picture, 12 and 27 give 18.'
        write: '$= 2 \times 9 = 18$'
        doodle_do:
          - {id: mach, op: label, part: out1, text: '18'}
      - section: 'Then the outside'
        say: 'Replace the bracket with 18. The question becomes 2 star 18.'
        write: '$2 * (12 * 27) = 2 * 18$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '= 18'}, at: '∗ 18', text: 'from the bracket'}
        doodle_do:
          - {id: mach, op: stage, stage: 'custom:1995_q22_a2'}
      - say: 'Use the rule again, with $a$ as 2 and $b$ as 18, so we get the square root of 2 times 18.'
        write: '$= \sqrt{2 \times 18}$'
      - say: '2 times 18 is 36.'
        write: '$= \sqrt{36}$'
      - say: 'The positive square root of 36 is 6.'
        write: '$= 6$'
        doodle_do:
          - {id: mach, op: label, part: out2, text: '6'}
      - section: 'Check'
        say: 'Check. 18 squared is 324, and 12 times 27 is also 324. And 6 squared is 36, which is 2 times 18.'
        write: 'Check: $18^{2} = 324 = 12 \times 27,\ \ 6^{2} = 36 = 2 \times 18\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore 2 star, bracket, 12 star 27, is 6, which is option C.'
        write: '$\therefore 2 * (12 * 27) = 6$'
        answer: true
    traps:
      A: 'You went for 12. That is a number from the question, not a result. Work the bracket first: 12 star 27 is 18, then 2 star 18 is the square root of 36, which is 6.'
      B: 'You went for 9. That is the square root of 81, half-way through the bracket. Finish it: 2 times 9 is 18, then 2 star 18 is the square root of 36, which is 6.'
      D: 'You went for 2. That is just the first number. You still have to star it with 18: the square root of 2 times 18 is 6.'

  23:
    moments:
      - section: 'The question'
        say: 'One, 9 over 10, 9 over 10 squared, and so on for ever. Picture pouring each term into a glass. Does it overflow, or does it settle at a level?'
        write: '$S_{\infty}$ of $1,\ \tfrac{9}{10},\ \left(\tfrac{9}{10}\right)^{2},\ \left(\tfrac{9}{10}\right)^{3},\ \ldots$'
        doodle: {name: 'custom:1995_q23_a', id: glass, caption: 'pour 1, then 9/10 of the last pour'}
        doodle_do:
          - {id: glass, op: fill, to: 0.1}
      - section: 'Solution'
        say: 'Solution. Find the common ratio, which is the second term divided by the first. 9 over 10, divided by 1, is 9 over 10. Each term is the last times 9 over 10, so it is a G.P.'
        write: 'Solution: $r = \dfrac{T_{2}}{T_{1}} = \dfrac{9}{10} \div 1 = \dfrac{9}{10}$'
        doodle_do:
          - {id: glass, op: fill, to: 0.19}
      - say: 'List what is given. The first term $a$ is 1, and $r$ is 9 over 10.'
        write: '$a = 1,\quad r = \dfrac{9}{10}$'
      - say: 'A sum to infinity exists only when $r$ is between negative 1 and 1. 9 over 10 is 0.9, so the pours keep shrinking and the glass settles at a level.'
        write: '$-1 < \dfrac{9}{10} < 1$'
        doodle_do:
          - {id: glass, op: fill, to: 0.7}
      - say: 'The sum to infinity of a G.P. is $a$ over 1 minus $r$.'
        write: '$S_{\infty} = \dfrac{a}{1 - r}$'
      - say: 'Substitute $a$ equals 1 and $r$ equals 9 over 10.'
        write: '$S_{\infty} = \dfrac{1}{1 - \frac{9}{10}}$'
      - say: 'Work out the bottom. 1 is 10 over 10, and 10 over 10 minus 9 over 10 is 1 over 10.'
        write: '$= \dfrac{1}{\frac{1}{10}}$'
      - say: 'Dividing by 1 over 10 is the same as multiplying by 10. 1 times 10 is 10.'
        write: '$= 1 \times 10 = 10$'
      - say: 'Therefore the sum to infinity is 10, and that is how full the glass gets.'
        write: '$\therefore\ S_{\infty} = 10$'
        doodle_do:
          - {id: glass, op: fill, to: 1.0}
          - {id: glass, op: label, part: top, text: '10'}
        point:
          - {line: 8, kind: highlight, at: '10', to: {doodle: glass, part: top}}
      - section: 'Check'
        say: 'To check, 1 minus $r$ is 1 over 10, and 10 times 1 over 10 is 1, the first term. So $S$ times, 1 minus $r$, gives back $a$.'
        write: 'Check: $10 \times \left(1 - \dfrac{9}{10}\right) = 10 \times \dfrac{1}{10} = 1 = a\ \checkmark$'
      - say: 'Therefore the sum to infinity is 10, which is answer choice D.'
        write: '$\therefore\ S_{\infty} = 10$'
        answer: true
    traps:
      A: 'You went for 1 over 10. That is the bottom of the formula, 1 minus $r$. You still divide $a$, which is 1, by it, and that gives 10.'
      B: 'You went for 9 over 10. That is the common ratio, not the sum. The sum is $a$ over 1 minus $r$, which is 10.'
      C: 'You went for 10 over 9. That is 1 divided by $r$. The formula divides by 1 minus $r$, which is 1 over 10, giving 10.'
  24:
    moments:
      - section: 'The question'
        say: 'An unknown inside a determinant. Expand the determinant in terms of $k$, set it equal to 23, and solve.'
        write: '$\begin{vmatrix} -2 & 1 & 1 \\ 2 & 1 & k \\ 1 & 3 & -1 \end{vmatrix} = 23$'
      - section: 'Solution'
        say: 'Solution. Expand along the first row, which is negative 2, 1 and 1, with the signs plus, minus, plus. Each entry multiplies its minor, the 2 by 2 left when we cover its row and column.'
        write: 'Solution: $(-2)\begin{vmatrix} 1 & k \\ 3 & -1 \end{vmatrix} - 1\begin{vmatrix} 2 & k \\ 1 & -1 \end{vmatrix} + 1\begin{vmatrix} 2 & 1 \\ 1 & 3 \end{vmatrix} = 23$'
      - say: 'A 2 by 2 determinant is $ad$ minus $bc$.'
        write: '$\begin{vmatrix} a & b \\ c & d \end{vmatrix} = ad - bc$'
      - say: 'Apply it to each minor, with every entry in brackets.'
        write: '$-2[(1)(-1) - (k)(3)] - 1[(2)(-1) - (k)(1)] + 1[(2)(3) - (1)(1)] = 23$'
      - say: 'Simplify inside each bracket. We get negative 1 minus $3k$, then negative 2 minus $k$, and 6 minus 1, which is 5.'
        write: '$-2(-1 - 3k) - 1(-2 - k) + 1(5) = 23$'
      - say: 'Open the brackets. Negative 2 times negative 1 is plus 2, and negative 2 times negative $3k$ is plus $6k$. Minus 1 times negative 2 is plus 2, and minus 1 times negative $k$ is plus $k$.'
        write: '$2 + 6k + 2 + k + 5 = 23$'
      - say: 'Collect like terms. $6k$ plus $k$ is $7k$, and 2 plus 2 plus 5 is 9.'
        write: '$7k + 9 = 23$'
      - say: 'Subtract 9 from both sides. 23 minus 9 is 14.'
        write: '$7k = 14$'
      - say: 'Divide both sides by 7.'
        write: '$k = \dfrac{14}{7}$'
      - say: 'Therefore $k$ is 2.'
        write: '$\therefore\ k = 2$'
      - section: 'Check'
        say: 'Check by putting $k$ equals 2 back in. 7 times 2 is 14, and 14 plus 9 is 23, as given.'
        write: 'Check: $7(2) + 9 = 14 + 9 = 23\ \checkmark$'
      - say: 'Therefore $k$ is 2, which is answer choice B.'
        write: '$\therefore\ k = 2$'
        answer: true
    traps:
      A: 'You went for 1. That makes the determinant 7 plus 9, which is 16, not 23. Watch the signs: both products with minus signs come out positive, giving $7k + 9$.'
      C: 'You went for 3. That makes the determinant 21 plus 9, which is 30. Solving $7k + 9 = 23$ gives $k = 2$.'
      D: 'You went for 4. That makes the determinant 28 plus 9, which is 37. Solving $7k + 9 = 23$ gives $k = 2$.'

  25:
    moments:
      - section: 'The question'
        say: 'Two 2 by 2 matrices, $X$ and $Y$, and we want the product $XY$. Matrices multiply row by column.'
        write: '$X = \begin{pmatrix} 1 & 2 \\ 0 & 3 \end{pmatrix},\quad Y = \begin{pmatrix} 2 & 1 \\ 4 & 3 \end{pmatrix}$'
        doodle: {name: 'custom:1995_q25_a', id: grid, caption: 'row of X meets column of Y', size: scene}
      - section: 'Solution'
        say: 'Solution. A 2 by 2 times a 2 by 2 has matching inside numbers, so the product is a 2 by 2 matrix.'
        write: 'Solution: $(2 \times 2)(2 \times 2) \rightarrow 2 \times 2$'
      - say: 'Each entry is a row of $X$ times a column of $Y$, so multiply the matching entries and add. The first row of $X$ is 1, 2, and the first column of $Y$ is 2, 4.'
        write: 'Row 1 of $X$ × column 1 of $Y$: $(1)(2) + (2)(4)$'
        doodle_do:
          - {id: grid, op: highlight, part: xr1, 'on': 'first row'}
          - {id: grid, op: highlight, part: yc1, 'on': 'first column'}
      - say: 'Write all four products inside the answer before simplifying. In the top row, take row 1 of $X$ with column 1, then column 2. Bottom row takes row 2 of $X$ with each column.'
        write: '$XY = \begin{pmatrix} (1)(2) + (2)(4) & (1)(1) + (2)(3) \\ (0)(2) + (3)(4) & (0)(1) + (3)(3) \end{pmatrix}$'
        doodle_do:
          - {id: grid, op: highlight, part: xr2, 'on': 'Bottom row'}
          - {id: grid, op: highlight, part: yc2, 'on': 'column 2'}
      - say: 'Multiply each pair. The top row gives 2 and 8, then 1 and 6. The bottom row gives 0 and 12, then 0 and 9.'
        write: '$= \begin{pmatrix} 2 + 8 & 1 + 6 \\ 0 + 12 & 0 + 9 \end{pmatrix}$'
      - say: 'Add each pair. 2 plus 8 is 10, 1 plus 6 is 7, 0 plus 12 is 12, 0 plus 9 is 9.'
        write: '$\therefore\ XY = \begin{pmatrix} 10 & 7 \\ 12 & 9 \end{pmatrix}$'
        doodle_do:
          - {id: grid, op: label, part: ans, text: '10, 7 / 12, 9'}
      - section: 'Check'
        say: 'Check with determinants, because the determinant of a product is the product of the determinants. $|X|$ is 3 minus 0, which is 3. $|Y|$ is 6 minus 4, which is 2.'
        write: 'Check: $|X| = 3 - 0 = 3,\quad |Y| = 6 - 4 = 2$'
      - say: '3 times 2 is 6. And the determinant of our answer is 90 minus 84, which is also 6.'
        write: '$|XY| = (10)(9) - (7)(12) = 90 - 84 = 6 = 3 \times 2\ \checkmark$'
      - say: 'Therefore $XY$ is the matrix 10, 7 on top and 12, 9 below, which is answer choice A.'
        write: '$\therefore\ XY = \begin{pmatrix} 10 & 7 \\ 12 & 9 \end{pmatrix}$'
        answer: true
    traps:
      B: 'You went for 2, 7, 1, 17. That is close to $YX$, the product in the other order, which is 2, 7, 4, 17. Matrix multiplication depends on the order: $XY$ takes the rows of $X$ against the columns of $Y$.'
      C: 'You went for 10, 4, 4, 6. Only the first entry is right. Each entry is a row of $X$ times a column of $Y$, two products added: the top-right is 1 times 1 plus 2 times 3, which is 7.'
      D: 'You went for 4, 3, 10, 9. Work each entry as row by column. The top-left is 1 times 2 plus 2 times 4, which is 10.'

  26:
    moments:
      - section: 'The question'
        say: 'Four points on a circle, two angles given, and $x$ hiding at the fourth point. Many students copy 81 or 53 across. Two theorems give $x$ in a few lines.'
        write: 'Given $81^{\circ}$ and $53^{\circ}$; find $x$'
        point:
          - {figure: 0, kind: circle, target: '81°', text: 'given'}
          - {figure: 0, kind: circle, target: '53°', text: 'given'}
          - {figure: 0, kind: circle, target: x, text: 'find'}
      - section: 'Solution'
        say: 'Solution. Three of the points make a triangle, with 81 degrees at the top and 53 degrees at the lower right. Let the third angle, at the lower left, be $y$.'
        write: 'Solution: let the third angle of the triangle be $y$'
        point:
          - {figure: 0, kind: label, target: {x: 64, y: 178}, text: 'y'}
      - say: 'The angles of a triangle add up to 180 degrees. So $y$ is 180 minus the 81 and the 53.'
        write: '$y = 180^{\circ} - (81^{\circ} + 53^{\circ})$ ($\angle$ sum of $\triangle$)'
      - say: '81 plus 53 is 134, and 180 minus 134 is 46.'
        write: '$y = 180^{\circ} - 134^{\circ} = 46^{\circ}$'
        point:
          - {figure: 0, kind: label, target: {x: 64, y: 178}, text: 'y = 46°'}
      - say: 'Now all four points lie on the circle, so they make a cyclic quadrilateral. The corner opposite $x$ is the lower-left one, the angle $y$.'
        write: '$x$ and $y$ are opposite angles of a cyclic quad.'
        point:
          - {figure: 0, kind: circle, target: x}
          - {figure: 0, kind: arrow, target: {x: 64, y: 178}, text: 'opposite x'}
      - say: 'Opposite angles of a cyclic quadrilateral add up to 180 degrees. That is our reason.'
        write: '$x + y = 180^{\circ}$ (opp. $\angle$s of a cyclic quad.)'
      - say: 'Substitute $y$ as 46 degrees.'
        write: '$x + 46^{\circ} = 180^{\circ}$'
        point:
          - {line: 6, kind: move, from: {line: 3, at: '= [[46∘]]'}, at: '46∘', text: 'y'}
      - say: 'Subtract 46 from both sides. 180 minus 46 is 134.'
        write: '$x = 180^{\circ} - 46^{\circ} = 134^{\circ}$'
        point:
          - {figure: 0, kind: label, target: x, text: '134°'}
      - section: 'Check'
        say: 'To check, $x$ should be obtuse, because it faces the acute angle $y$ across the circle. And 134 plus 46 is 180.'
        write: 'Check: $134^{\circ} + 46^{\circ} = 180^{\circ}\ \checkmark$'
      - say: 'Therefore $x$ is 134 degrees, which is option A.'
        write: '$\therefore x = 134^{\circ}$'
        answer: true
    traps:
      B: 'You went for 81 degrees. That is a given angle, not $x$. $x$ is opposite the third angle of the triangle, 46 degrees, so it is 180 minus 46.'
      C: 'You went for 53 degrees. That is a given angle, not $x$. Find the third angle of the triangle, 46 degrees, then use opposite angles of a cyclic quadrilateral.'
      D: 'You went for 46 degrees. That is $y$, the angle opposite $x$, found on the way. Opposite angles of a cyclic quadrilateral add up to 180, so $x$ is 134.'
  27:
    moments:
      - section: 'The question'
        say: 'A tangent, two equal chords and one 50 degree angle. Many students copy the 50 straight across. Three circle theorems give angle $TZY$, one line at a time.'
        write: '$PT$ tangent, $YT = YX$, $\angle PTX = 50^{\circ}$; find $\angle TZY$'
        point:
          - {figure: 0, kind: arc, target: PTX, text: '50°'}
          - {figure: 0, kind: circle, target: '?', text: 'find'}
      - section: 'Solution'
        say: 'Solution. On the diagram, $PT$ touches the circle at $T$, and $YT$ equals $YX$. Mark the two equal chords.'
        write: 'Solution'
        point:
          - {figure: 0, kind: highlight, target: YT, text: 'equal'}
          - {figure: 0, kind: highlight, target: YX, text: 'equal'}
      - say: 'Angle $PTX$ is between the tangent $TP$ and the chord $TX$. It equals the angle $TX$ makes at $Y$, in the other segment, by the alternate segment theorem.'
        write: '$\angle TYX = \angle PTX = 50^{\circ}$ (alt. segment theorem)'
        point:
          - {figure: 0, kind: highlight, target: TX, text: 'chord'}
          - {figure: 0, kind: arc, target: TYX, text: '50°'}
      - say: 'Triangle $TYX$ has $YT$ equal to $YX$, so its base angles at $T$ and $X$ are equal. These are the base angles of an isosceles triangle.'
        write: '$\angle YTX = \angle YXT$ (base $\angle$s of isos. $\triangle$)'
        point:
          - {figure: 0, kind: arc, target: YTX}
          - {figure: 0, kind: arc, target: YXT}
      - say: 'The two base angles share what is left of 180 after the 50 at $Y$.'
        write: '$\angle YXT = \dfrac{180^{\circ} - 50^{\circ}}{2}$ ($\angle$ sum of $\triangle$)'
        point:
          - {line: 4, kind: move, from: {line: 2, at: '= [[50∘]]'}, at: '− 50∘', text: 'angle Y'}
      - say: '180 minus 50 is 130, and half of 130 is 65.'
        write: '$= \dfrac{130^{\circ}}{2} = 65^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: YXT, text: '65°'}
      - say: 'Angle $TZY$ at $Z$ and angle $TXY$ at $X$ both stand on the chord $TY$, on the same side. The reason is that angles in the same segment are equal.'
        write: '$\angle TZY = \angle TXY$ ($\angle$s in the same segment)'
        point:
          - {figure: 0, kind: highlight, target: TY, text: 'chord TY'}
          - {figure: 0, kind: arc, target: TZY}
      - say: 'Angle $TXY$ is the 65 degrees we found, so angle $TZY$ is 65 degrees.'
        write: '$\angle TZY = 65^{\circ}$'
        point:
          - {line: 7, kind: move, from: {line: 5, at: '= [[65∘]]'}, at: '65∘', text: 'angle TXY'}
          - {figure: 0, kind: label, target: '?', text: '65°'}
      - section: 'Check'
        say: 'Check triangle $TYX$. 50 plus 65 plus 65 is 180, the angle sum of a triangle.'
        write: 'Check: $50^{\circ} + 65^{\circ} + 65^{\circ} = 180^{\circ}\ \checkmark$'
      - say: 'Therefore angle $TZY$ is 65 degrees, which is option B.'
        write: '$\therefore \angle TZY = 65^{\circ}$'
        answer: true
    traps:
      A: 'You went for 50 degrees. That is the tangent angle copied across. By the alternate segment theorem it equals angle $TYX$, at $Y$. Angle $TZY$ stands on a different chord, $TY$, and equals angle $TXY$, 65 degrees.'
      C: 'You went for 85 degrees. Check the isosceles triangle $TYX$: the base angles share 180 minus 50, which is 130, so each is 65.'
      D: 'You went for 130 degrees. That is the two base angles together, 180 minus 50. Each base angle is half of it, 65, and angle $TZY$ equals one of them.'

  28:
    moments:
      - section: 'The question'
        say: 'Two angle bisectors crossing inside a triangle. Many students just halve one of the angles. Let''s find the acute angle between the bisectors properly.'
        write: '$\angle YXZ = 44^{\circ},\ \angle XYZ = 112^{\circ}$'
      - section: 'Solution'
        say: 'Solution. Let me sketch triangle $XYZ$, with the bisectors of angles $Y$ and $Z$ meeting at $I$.'
        show_sketch: true
        write: 'Solution: bisectors of $\angle Y$ and $\angle Z$ meet at $I$'
        point:
          - {figure: sketch, kind: arc, target: YXZ, text: '44°'}
          - {figure: sketch, kind: arc, target: XYZ, text: '112°'}
          - {figure: sketch, kind: circle, target: I}
      - say: 'First angle $Z$. The angles of a triangle add up to 180 degrees.'
        write: '$\angle XZY = 180^{\circ} - (44^{\circ} + 112^{\circ})$ ($\angle$ sum of $\triangle$)'
      - say: '44 plus 112 is 156, and 180 minus 156 is 24.'
        write: '$= 180^{\circ} - 156^{\circ} = 24^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: XZY, text: '24°'}
      - say: 'A bisector cuts an angle into two equal parts. $YI$ bisects angle $Y$, so angle $IYZ$ is half of 112, which is 56.'
        write: '$\angle IYZ = \tfrac{1}{2} \times 112^{\circ} = 56^{\circ}$ ($YI$ bisects $\angle Y$)'
        point:
          - {figure: sketch, kind: arc, target: IYZ, text: '56°'}
      - say: '$ZI$ bisects angle $Z$, so angle $IZY$ is half of 24, which is 12.'
        write: '$\angle IZY = \tfrac{1}{2} \times 24^{\circ} = 12^{\circ}$ ($ZI$ bisects $\angle Z$)'
        point:
          - {figure: sketch, kind: arc, target: IZY, text: '12°'}
      - say: 'Now triangle $YIZ$. Its angles add up to 180, so angle $YIZ$ is 180 minus 56 minus 12.'
        write: '$\angle YIZ = 180^{\circ} - (56^{\circ} + 12^{\circ})$ ($\angle$ sum of $\triangle$)'
        point:
          - {figure: sketch, kind: arc, target: YIZ}
      - say: '56 plus 12 is 68, and 180 minus 68 is 112. That angle is obtuse.'
        write: '$= 180^{\circ} - 68^{\circ} = 112^{\circ}$'
      - say: 'Where the two bisectors cross, the angle next to 112 on the straight line is the acute one. Angles on a straight line add up to 180.'
        write: 'Acute angle $= 180^{\circ} - 112^{\circ} = 68^{\circ}$ ($\angle$s on a str. line)'
        point:
          - {figure: sketch, kind: label, target: '?', text: '68°'}
      - section: 'Check'
        say: 'Check with a known result. Two bisectors from $Y$ and $Z$ meet at 90 degrees plus half of angle $X$. Half of 44 is 22, and 90 plus 22 is 112. It agrees.'
        write: 'Check: $90^{\circ} + \tfrac{1}{2}(44^{\circ}) = 112^{\circ}\ \checkmark$'
      - say: 'Therefore the acute angle between the bisectors is 68 degrees, which is option C.'
        write: '$\therefore$ acute angle $= 68^{\circ}$'
        answer: true
    traps:
      A: 'You went for 42 degrees. Check the steps: angle $Z$ is 24, half of each angle gives 56 and 12, the angle at $I$ is 112, and the acute angle is 180 minus 112, which is 68.'
      B: 'You went for 56 degrees. That is half of angle $Y$, not the angle between the bisectors. In triangle $YIZ$, 180 minus 56 minus 12 is 112, and the acute angle is 68.'
      D: 'You went for 78 degrees. The two half-angles in triangle $YIZ$ are 56 and 12, which add up to 68. So the angle at $I$ is 112, and the acute angle is 68.'

  29:
    moments:
      - section: 'The question'
        say: 'Town P is at 45 degrees north, 30 degrees west. Town Q is at 15 degrees north, 30 degrees west. The radius of the earth is 7,000 km. We want the distance between them.'
        write: '$P(45^{\circ}\text{N},\ 30^{\circ}\text{W}),\ Q(15^{\circ}\text{N},\ 30^{\circ}\text{W})$'
      - section: 'Solution'
        say: 'Solution. Let me draw the earth, cut through longitude 30 degrees west, with its centre O, the equator, and P and Q.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: P, text: '45°N'}
          - {figure: sketch, kind: circle, target: Q, text: '15°N'}
      - say: 'List what is given. The radius, $R$, is 7,000 km, and pi is 22 over 7.'
        write: '$R = 7000$ km, $\pi = \dfrac{22}{7}$'
        point:
          - {figure: sketch, kind: underline, target: 'R = 7000 km'}
      - say: 'Both towns are on the same longitude, 30 degrees west. A line of longitude is a great circle, so its radius is the earth''s radius, $R$.'
        write: 'Same longitude: great circle, radius $R$'
      - section: 'The angle at the centre'
        say: 'The angle between the towns at O is the difference in their latitudes. Both are north, on the same side of the equator, so we subtract.'
        write: '$\theta = 45^{\circ} - 15^{\circ}$ (both N, subtract)'
        point:
          - {figure: sketch, kind: circle, target: '45°'}
          - {figure: sketch, kind: circle, target: '15°'}
      - say: '45 minus 15 is 30 degrees.'
        write: '$= 30^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: POQ, text: '30°'}
      - section: 'The distance'
        say: 'The distance along a great circle is theta over 360, times $2\pi R$, which is that fraction of the whole circumference.'
        write: '$PQ = \dfrac{\theta}{360^{\circ}} \times 2\pi R$'
        point:
          - {figure: sketch, kind: arc, target: 'PQ', text: '30/360 of the circle'}
      - say: 'Substitute theta equals 30, pi equals 22 over 7, and $R$ equals 7,000.'
        write: '$= \dfrac{30}{360} \times 2 \times \dfrac{22}{7} \times 7000$'
      - say: '30 over 360 is 1 over 12. 7,000 divided by 7 is 1,000.'
        write: '$= \dfrac{1}{12} \times 2 \times 22 \times 1000$'
      - say: '2 times 22 times 1,000 is 44,000, the whole circumference.'
        write: '$= \dfrac{44000}{12}$'
      - say: 'Divide the top and the bottom by 4. 44,000 over 4 is 11,000, and 12 over 4 is 3.'
        write: '$\therefore\ PQ = \dfrac{11000}{3}$ km'
        point:
          - {figure: sketch, kind: label, target: '?', text: '11000/3 km'}
      - section: 'Check'
        say: 'To check, 30 degrees is one twelfth of the circle, so 12 of these distances must make the whole circumference. 12 times 11,000 over 3 is 44,000.'
        write: 'Check: $12 \times \dfrac{11000}{3} = 44000 = 2 \times \dfrac{22}{7} \times 7000\ \checkmark$'
      - say: 'Therefore the distance between the towns is 11,000 over 3 kilometres, which is answer choice C.'
        write: '$\therefore$ distance $= \dfrac{11000}{3}$ km'
        answer: true
    traps:
      A: 'You went for 1,100 over 3. That is ten times too small. The circumference is 44,000 km, and 1 over 12 of it is 11,000 over 3.'
      B: 'You went for 2,200 over 3. That is too small. 2 times 22 over 7 times 7,000 is 44,000, and 44,000 over 12 is 11,000 over 3.'
      D: 'You went for 22,000 over 3. That is the distance for towns 60 degrees apart, as if the latitudes were added. Both towns are north, so we subtract: 45 minus 15 is 30 degrees.'
  30:
    moments:
      - section: 'The question'
        say: 'Two perpendicular lines meeting at a point. Many students keep the same gradient, or slip on the minus in $(1, -1)$. Find the gradient first, then the line.'
        write: '$PQ: x - 2y - 3 = 0$; $\ PQ \perp QR$ at $(1, -1)$; $\ QR = ?$'
        diagram:
          id: g
          kind: graph
          x: [-2, 5]
          y: [-4, 4]
          step: 1
          plots:
            - {fn: '(x - 3)/2', label: 'PQ: x − 2y − 3 = 0', colour: blue}
          points:
            - {x: 1, y: -1, text: 'Q (1, −1)'}
      - section: 'Solution'
        say: 'Solution. Make $y$ the subject of $PQ$ to read off its gradient. Add $2y$ to both sides.'
        write: 'Solution: $2y = x - 3$'
      - say: 'Divide through by 2. The number in front of $x$ is the gradient, which is a half.'
        write: '$y = \dfrac{1}{2}x - \dfrac{3}{2}$, $\ \therefore m_{1} = \dfrac{1}{2}$'
      - say: 'For perpendicular lines, the gradients multiply to minus 1.'
        write: '$m_{1} \times m_{2} = -1$ (perpendicular lines)'
      - say: 'Substitute a half for $m_1$. Multiply both sides by 2, and $m_2$ is minus 2.'
        write: '$\dfrac{1}{2} \times m_{2} = -1 \Rightarrow m_{2} = -2$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: 'm1 = 21'}, at: '[[21]] × m2', text: 'm₁'}
      - say: 'The equation of a line through the point $x_1$, $y_1$ with gradient $m$ is $y$ minus $y_1$ equals $m$ times $x$ minus $x_1$.'
        write: '$y - y_{1} = m(x - x_{1})$'
      - say: 'Substitute $x_1$ equals 1, $y_1$ equals minus 1 in brackets, and $m$ equals minus 2.'
        write: '$y - (-1) = -2(x - 1)$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '⇒ m2 = [[−2]]'}, at: '= [[−2]](x', text: 'm₂'}
      - say: '$y$ minus minus 1 is $y$ plus 1. Minus 2 times $x$ is minus $2x$, and minus 2 times minus 1 is plus 2.'
        write: '$y + 1 = -2x + 2$'
      - say: 'Collect every term on the left, so add $2x$ and subtract 2 on both sides. 1 minus 2 is minus 1.'
        write: '$2x + y - 1 = 0$'
        diagram_do:
          - {id: g, op: line, m: -2, c: 1, label: 'QR: 2x + y − 1 = 0', colour: green}
      - section: 'Check'
        say: 'Check. $Q$, 1, minus 1, is on it, because 2 times 1, plus minus 1, minus 1 is zero. And a half times minus 2 is minus 1.'
        write: 'Check: $2(1) + (-1) - 1 = 0$; $\ \tfrac{1}{2} \times (-2) = -1\ \checkmark$'
      - say: 'Therefore the equation of $QR$ is $2x$ plus $y$ minus 1 equals zero, which is option D.'
        write: '$\therefore QR: 2x + y - 1 = 0$'
        answer: true
    traps:
      A: 'You went for $x - 2y + 1 = 0$. That has gradient a half, the same as $PQ$, so it is parallel, not perpendicular. The perpendicular gradient is minus 2.'
      B: 'You went for $2x + y - 3 = 0$. The gradient is right, but that line passes through 1, 1, not 1, minus 1. Put in $y = -1$: 2 minus 1 minus 3 is minus 2, not zero.'
      C: 'You went for $x - 2y - 3 = 0$. That is $PQ$ itself, the line you were given. $QR$ is the other line through 1, minus 1, with gradient minus 2.'

  31:
    moments:
      - section: 'The question'
        say: 'A locus, a parallel line and a 40 degree angle. Name the locus first, and the rest is triangle work. Many students stop at 50. Let''s find angle $XPY$.'
        write: '$P$ equidistant from $X$ and $Y$; $\angle PYU = 40^{\circ}$'
      - section: 'Solution'
        say: 'Solution. Let me sketch $X$ and $Y$, the locus through $P$, and the line $UV$ through $Y$.'
        show_sketch: true
        write: 'Solution'
        point:
          - {figure: sketch, kind: arc, target: PYU, text: '40°'}
      - say: 'Name the standard locus. Points equidistant from two fixed points lie on the perpendicular bisector of the line joining them.'
        write: 'Locus $=$ perpendicular bisector of $XY$'
        point:
          - {figure: sketch, kind: underline, target: locus, text: '⊥ bisector of XY'}
      - say: '$P$ is on it, so $P$ is the same distance from $X$ and $Y$. Triangle $XPY$ is isosceles.'
        write: '$PX = PY$ ($P$ on the locus)'
        point:
          - {figure: sketch, kind: highlight, target: PX}
          - {figure: sketch, kind: highlight, target: PY}
      - say: 'The locus is at right angles to $XY$, and $UV$ is parallel to the locus. So $UV$ is at right angles to $XY$ too.'
        write: '$\angle XYU = 90^{\circ}$ ($UV \parallel$ locus, locus $\perp XY$)'
        point:
          - {figure: sketch, kind: arc, target: XYU, text: '90°'}
      - say: '$YP$ splits that right angle into angle $PYU$, 40 degrees, and angle $PYX$. So angle $PYX$ is 90 minus 40.'
        write: '$\angle PYX = 90^{\circ} - 40^{\circ} = 50^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: PYX, text: '50°'}
      - say: '$PX$ equals $PY$, so the base angles at $X$ and $Y$ are equal, because they are base angles of an isosceles triangle.'
        write: '$\angle PXY = \angle PYX = 50^{\circ}$ (base $\angle$s of isos. $\triangle$)'
        point:
          - {figure: sketch, kind: arc, target: PXY, text: '50°'}
      - say: 'The angles of triangle $XPY$ add up to 180. So angle $XPY$ is 180 minus 50 minus 50.'
        write: '$\angle XPY = 180^{\circ} - (50^{\circ} + 50^{\circ})$ ($\angle$ sum of $\triangle$)'
        point:
          - {figure: sketch, kind: arc, target: XPY}
      - say: '50 plus 50 is 100, and 180 minus 100 is 80.'
        write: '$= 180^{\circ} - 100^{\circ} = 80^{\circ}$'
        point:
          - {figure: sketch, kind: label, target: '?', text: '80°'}
      - section: 'Check'
        say: 'To check, the locus cuts angle $XPY$ in half, so each half is 40 degrees. The half next to $Y$ and angle $PYU$ are alternate angles, since $UV$ is parallel to the locus. Both are 40.'
        write: 'Check: $\tfrac{1}{2} \times 80^{\circ} = 40^{\circ} = \angle PYU$ (alt. $\angle$s) $\checkmark$'
      - say: 'Therefore angle $XPY$ is 80 degrees, which is option B.'
        write: '$\therefore \angle XPY = 80^{\circ}$'
        answer: true
    traps:
      A: 'You went for 100 degrees. That is the two base angles added, 50 plus 50. The angle at $P$ is what is left: 180 minus 100, which is 80.'
      C: 'You went for 50 degrees. That is a base angle, angle $PYX$. The question wants the angle at $P$: 180 minus 50 minus 50, which is 80.'
      D: 'You went for 40 degrees. That is the given angle copied over. Take it from the right angle to get 50, then use the isosceles triangle to get 80.'

  32:
    moments:
      - section: 'The question'
        say: 'Three parallel lines and one transversal. Many students copy the 117 straight down. Two angle facts give $x$.'
        write: '$k \parallel m \parallel n$; find $x$'
        point:
          - {figure: 0, kind: circle, target: '117°', text: 'given'}
          - {figure: 0, kind: circle, target: x, text: 'find'}
      - section: 'Solution'
        say: 'Solution. On the diagram, the 117 degrees is above $k$, on the right of the transversal. $x$ is below $n$, on the right.'
        write: 'Solution'
        point:
          - {figure: 0, kind: circle, target: k}
          - {figure: 0, kind: circle, target: n}
      - say: 'At $n$, the angle above the line on the right is in the same position as the 117 at $k$. They are equal, because corresponding angles are equal, since $k$ is parallel to $n$.'
        write: 'Angle above $n$, on the right $= 117^{\circ}$ (corr. $\angle$s, $k \parallel n$)'
        point:
          - {figure: 0, kind: label, target: {x: 222, y: 180}, text: '117°'}
      - say: '$x$ and that 117 degree angle sit side by side on the straight line $n$. Angles on a straight line add up to 180 degrees.'
        write: '$x + 117^{\circ} = 180^{\circ}$ ($\angle$s on a str. line)'
        point:
          - {figure: 0, kind: underline, target: n, text: 'straight line'}
      - say: 'Subtract 117 from both sides.'
        write: '$x = 180^{\circ} - 117^{\circ}$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '+ 117∘'}, at: '− 117∘', text: 'across the ='}
      - say: 'Now 180 minus 117. 180 minus 100 is 80, and 80 minus 17 is 63.'
        write: '$= 63^{\circ}$'
        point:
          - {figure: 0, kind: label, target: x, text: '63°'}
      - say: 'Notice that the middle line $m$ is not needed. It only makes the diagram look harder.'
        write: 'Line $m$ is not needed'
        point:
          - {figure: 0, kind: strike, target: m, text: 'not needed'}
      - section: 'Check'
        say: 'Check. 63 plus 117 is 180, so $x$ and the angle above $n$ really do make a straight line.'
        write: 'Check: $63^{\circ} + 117^{\circ} = 180^{\circ}\ \checkmark$'
      - say: 'Therefore $x$ is 63 degrees, which is option B.'
        write: '$\therefore x = 63^{\circ}$'
        answer: true
    traps:
      A: 'You went for 37 degrees. Check the subtraction: 180 minus 117 is 63, not 37.'
      C: 'You went for 117 degrees. That would be the angle above $n$, by corresponding angles. $x$ is below $n$, on the straight line with it, so $x$ is 180 minus 117.'
      D: 'You went for 153 degrees. $x$ and the 117 degree angle lie on a straight line, so they add up to 180. 180 minus 117 is 63.'
  33:
    moments:
      - section: 'The question'
        say: 'A closed cylinder, like a tin with its lid on, has three surfaces, which are the curved side, the base and the top. The total surface area adds all three.'
        write: 'Find the total surface area of the closed cylinder.'
        point:
          - {figure: 0, kind: label, target: {x: 160, y: 130}, text: 'curved side', 'on': 'the curved side'}
          - {figure: 0, kind: label, target: {x: 160, y: 70}, text: 'top', 'on': 'the base and the top'}
      - say: 'Write Solution, and read the givens off the figure. The base diameter is 14 cm and the height is 12 cm.'
        write: 'Solution'
        point:
          - {figure: 0, kind: highlight, target: '14 cm', text: 'diameter', 'on': 'diameter is 14'}
          - {figure: 0, kind: highlight, target: '12 cm', text: 'height', 'on': 'height is 12'}
      - section: 'What we know'
        say: 'List them. d is 14 cm, h is 12 cm, and pi is 22 over 7.'
        write: '$d = 14$ cm, $h = 12$ cm, $\pi = \dfrac{22}{7}$'
      - say: 'The formula needs the radius, not the diameter. Half of 14 is 7.'
        write: '$r = \dfrac{14}{2} = 7$ cm'
      - section: 'The formula'
        say: 'The total surface area is the two circular ends, 2 pi r squared, plus the curved side, 2 pi r h. Factorise to get 2 pi r, times r plus h.'
        write: 'TSA $= 2\pi r^{2} + 2\pi rh = 2\pi r(r + h)$'
      - section: 'Substitute'
        say: 'Now substitute, so pi is 22 over 7, r is 7, and h is 12.'
        write: '$= 2 \times \dfrac{22}{7} \times 7 \times (7 + 12)$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '= 7'}, at: '(7', text: 'r', 'on': 'r is 7'}
          - {line: 5, kind: move, from: {line: 2, at: '12'}, at: '+ 12', text: 'h', 'on': 'h is 12'}
      - section: 'Simplify'
        say: 'Cancel the 7 in 22 over 7 against the 7 for r. And for the bracket, by BODMAS, 7 plus 12 is 19.'
        write: '$= 2 \times 22 \times 19$'
      - say: '2 times 22 is 44, and 44 times 19 is 836.'
        write: '$= 44 \times 19 = 836$'
      - say: 'Therefore the total surface area is 836 square centimetres.'
        write: '$\therefore$ TSA $= 836\ \text{cm}^{2}$'
      - section: 'Check'
        say: 'Check part by part. The curved side, 2 pi r h, is 2 times 22 times 12, which is 528. Each end, pi r squared, is 154, so two ends make 308. 528 plus 308 is 836.'
        write: 'Check: $528 + 2(154) = 528 + 308 = 836$ ✓'
      - section: 'Answer'
        say: 'So the total surface area is 836 square centimetres, which is answer choice A.'
        write: '$\therefore$ TSA $= 836\ \text{cm}^{2}$ (A)'
        answer: true
    traps:
      B: 'You went for 528. That is the curved side, 2 pi r h, only. A closed cylinder also has a base and a top, 2 pi r squared, which is 308: 836 in all.'
      C: 'You went for 308. That is the two circular ends only. Add the curved side, 528, to get 836.'
      D: 'You went for 154. That is one circular end, pi r squared. TSA is 2 pi r, times r plus h: 2 times 22 times 19, which is 836.'

  34:
    moments:
      - section: 'The question'
        say: 'An area, two sides and the angle between them. Many students forget the sine. Area equals a half $ab$ sine $C$, then solve for $PQ$.'
        write: 'Area of $\triangle PQR = 35\ \text{cm}^{2}$, $PR = 10$ cm, $\angle P = 30^{\circ}$; $\ PQ = ?$'
      - section: 'Solution'
        say: 'Solution. Mark the givens. $PR$ is 10 cm and the angle at $P$ is 30 degrees. The 30 degrees sits between $PQ$, which we want, and $PR$.'
        write: 'Solution'
        point:
          - {figure: 0, kind: highlight, target: PR, text: '10 cm'}
          - {figure: 0, kind: arc, target: QPR, text: '30°'}
          - {figure: 0, kind: underline, target: PQ, text: 'find'}
      - say: 'When two sides and the angle between them are known, the area is a half, times one side, times the other, times the sine of that angle.'
        write: 'Area $= \dfrac{1}{2}ab\sin C$'
      - say: 'Here the two sides are $PQ$ and $PR$, and the angle between them is at $P$.'
        write: 'Area of $\triangle PQR = \dfrac{1}{2} \times PQ \times PR \times \sin P$'
      - say: 'Substitute the area 35, $PR$ equals 10 and $P$ equals 30 degrees.'
        write: '$35 = \dfrac{1}{2} \times PQ \times 10 \times \sin 30^{\circ}$'
      - say: 'The sine of 30 degrees is a half.'
        write: '$\sin 30^{\circ} = \dfrac{1}{2}$'
      - say: 'Replace sine 30 with a half.'
        write: '$35 = \dfrac{1}{2} \times PQ \times 10 \times \dfrac{1}{2}$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '= 21'}, at: '10 × [[21]]', text: 'sin 30°'}
      - say: 'Multiply the numbers, 1 times 10 times 1 on top, and 2 times 2 below. That is 10 $PQ$ over 4.'
        write: '$35 = \dfrac{10\,PQ}{4}$'
      - say: 'Cross-multiply. 35 times 4 is 140.'
        write: '$10\,PQ = 140$'
      - say: 'Divide both sides by 10.'
        write: '$PQ = 14$ cm'
        point:
          - {figure: 0, kind: label, target: PQ, text: '14 cm'}
      - section: 'Check'
        say: 'Check. Half of 14 is 7, 7 times 10 is 70, and half of 70 is 35, the area we were given.'
        write: 'Check: $\dfrac{1}{2} \times 14 \times 10 \times \dfrac{1}{2} = 35\ \checkmark$'
      - say: 'Therefore $PQ$ is 14 cm, which is option C.'
        write: '$\therefore PQ = 14$ cm'
        answer: true
    traps:
      A: 'You went for 97 cm. That is far too long for a triangle of area 35. The area formula gives 10 $PQ$ over 4 equals 35, so $PQ$ is 14.'
      B: 'You went for 10 cm. That is $PR$, the side we were given. We want the other side, $PQ$: 140 divided by 10 is 14.'
      D: 'You went for 17 cm. Check the arithmetic: a half times 10 times a half is 10 over 4, and 35 times 4 over 10 is 14.'

  35:
    moments:
      - section: 'The question'
        say: 'A boy lies on the ground 30 m from the foot of a water tank tower. The angle of elevation of the top of the tank is 60 degrees. We want the height.'
        write: 'Distance $= 30$ m, elevation $= 60^{\circ}$'
        doodle: {name: 'custom:1995_q35_a', id: tower, caption: 'lying 30 m away, looking up at 60°', size: scene}
        point:
          - {line: 0, kind: highlight, at: 'Distance = 30', to: {doodle: tower, part: dist}}
      - section: 'Solution'
        say: 'Solution. Let me draw it, with the boy at $A$, the foot of the tower at $B$, and the top of the tank at $C$. The tower stands upright, so the right angle is at $B$.'
        write: 'Solution: $AB = 30$ m, $\angle BAC = 60^{\circ}$, $\angle ABC = 90^{\circ}$'
        show_sketch: true
        'on': 'draw'
        point:
          - {figure: sketch, kind: arc, target: BAC, text: '60°'}
          - {figure: sketch, kind: circle, target: B, text: 'right angle'}
      - say: 'Let $h$ be the height of the tank, $BC$.'
        write: 'Let $BC = h$ m'
        point:
          - {figure: sketch, kind: highlight, target: BC, text: 'h'}
      - say: 'From 60 degrees, $h$ is opposite and the 30 m is adjacent. Opposite and adjacent go together in TOA, so we use tangent.'
        write: '$\tan 60^{\circ} = \dfrac{\text{opp}}{\text{adj}} = \dfrac{h}{30}$ (TOA)'
        point:
          - {figure: sketch, kind: highlight, target: BC, text: 'opp'}
          - {figure: sketch, kind: underline, target: AB, text: 'adj'}
        doodle_do:
          - {id: tower, op: highlight, part: height, text: opposite}
          - {id: tower, op: highlight, part: dist, text: adjacent}
      - say: 'Cross-multiply, and $h$ is 30 tan 60.'
        write: '$h = 30\tan 60^{\circ}$'
      - say: 'From the special angles, tan 60 degrees is root 3. So $h$ is 30 root 3.'
        write: '$h = 30 \times \sqrt{3} = 30\sqrt{3}$'
      - say: 'Therefore the height of the water tank is 30 root 3 metres.'
        write: '$\therefore h = 30\sqrt{3}$ m'
        point:
          - {figure: sketch, kind: label, target: h, text: '30√3 m'}
      - section: 'Check'
        say: 'Check by putting it back. 30 root 3 over 30 is root 3, which is tan 60 degrees.'
        write: 'Check: $\dfrac{30\sqrt{3}}{30} = \sqrt{3} = \tan 60^{\circ}\ \checkmark$'
      - say: 'And the size. Root 3 is about 1.73, so the height is about 52 m. An angle above 45 degrees means the tower is taller than the 30 m distance. 52 is more than 30.'
        write: '$30\sqrt{3} \approx 30 \times 1.73 \approx 52 > 30\ \checkmark$'
        doodle_do:
          - {id: tower, op: label, part: height, text: '30√3 ≈ 52 m'}
      - section: 'Answer'
        say: 'So the height is 30 root 3 metres, which is answer choice B.'
        write: '$\therefore 30\sqrt{3}$ m'
        answer: true
    traps:
      A: 'You went for 60 m. That is 30 divided by cos 60, the length of the boy''s line of sight to the top, the hypotenuse, not the height. The height is opposite: TOA, 30 tan 60.'
      C: 'You went for 20 root 3 m. That does not come from the tangent. Height over 30 is tan 60, which is root 3, so the height is 30 root 3.'
      D: 'You went for 10 root 3 m. That is 30 divided by root 3: the tangent turned upside down. Tangent is opposite over adjacent, height over 30, so the height is 30 root 3.'
  36:
    moments:
      - section: 'The question'
        say: 'Two angles and a side. Many students pair a side with the wrong angle. The sine rule pairs each side with the angle opposite it.'
        write: '$QS = 12$ m, $\angle RQS = 30^{\circ}$, $\angle QRS = 45^{\circ}$; $\ RS = ?$'
      - section: 'Solution'
        say: 'Solution. Let me sketch triangle $QRS$ with 30 degrees at $Q$, 45 degrees at $R$, and $QS$ equal to 12 m.'
        show_sketch: true
        write: 'Solution'
        point:
          - {figure: sketch, kind: highlight, target: QS, text: '12 m'}
          - {figure: sketch, kind: arc, target: RQS, text: '30°'}
          - {figure: sketch, kind: arc, target: QRS, text: '45°'}
      - say: 'Match each side to the angle opposite it. $RS$ is opposite the angle at $Q$, 30 degrees. $QS$ is opposite the angle at $R$, 45 degrees.'
        write: '$RS$ opp. $\angle Q = 30^{\circ}$; $\ QS = 12$ opp. $\angle R = 45^{\circ}$'
        point:
          - {figure: sketch, kind: underline, target: RS, text: 'faces 30°'}
          - {figure: sketch, kind: underline, target: QS, text: 'faces 45°'}
      - say: 'An angle and its opposite side are known, so we use the sine rule.'
        write: '$\dfrac{a}{\sin A} = \dfrac{b}{\sin B}$ (sine rule)'
      - say: 'Substitute, and $RS$ over sine 30 equals 12 over sine 45.'
        write: '$\dfrac{RS}{\sin 30^{\circ}} = \dfrac{12}{\sin 45^{\circ}}$'
      - say: 'Multiply both sides by sine 30 to get $RS$ on its own.'
        write: '$RS = \dfrac{12\sin 30^{\circ}}{\sin 45^{\circ}}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: 'sin30∘RS'}, at: '12sin30∘', text: 'times both sides'}
      - say: 'From the special angles, sine 30 is a half, and sine 45 is 1 over root 2.'
        write: '$\sin 30^{\circ} = \dfrac{1}{2},\ \ \sin 45^{\circ} = \dfrac{1}{\sqrt{2}}$'
      - say: 'Substitute. 12 times a half is 6, divided by 1 over root 2.'
        write: '$RS = 12 \times \dfrac{1}{2} \div \dfrac{1}{\sqrt{2}} = 6 \div \dfrac{1}{\sqrt{2}}$'
      - say: 'Dividing by 1 over root 2 is the same as multiplying by root 2.'
        write: '$= 6 \times \sqrt{2} = 6\sqrt{2}$ m'
        point:
          - {figure: sketch, kind: label, target: RS, text: '6√2 m'}
      - section: 'Check'
        say: 'To check, the smaller side faces the smaller angle. $RS$ faces 30 degrees and $QS$ faces 45, so $RS$ must be shorter than 12. 6 root 2 is about 8.5.'
        write: 'Check: $6\sqrt{2} \approx 8.5 < 12\ \checkmark$'
      - say: 'Therefore $RS$ is 6 root 2 metres, which is option C.'
        write: '$\therefore RS = 6\sqrt{2}$ m'
        answer: true
    traps:
      A: 'You went for 18 root 2 m, about 25 m. $RS$ faces the smaller angle, so it must be shorter than 12. The sine rule gives 6 root 2.'
      B: 'You went for 12 root 2 m. That pairs the sides with the wrong angles: 12 sine 45 over sine 30. $RS$ is opposite the 30 degree angle, so $RS$ is 12 sine 30 over sine 45: 6 root 2.'
      D: 'You went for 3 root 2 m. Check the division: 12 times a half is 6, and 6 divided by 1 over root 2 is 6 times root 2, not 6 over root 2.'

  37:
    moments:
      - section: 'The question'
        say: 'We are shown four graphs, A to D, each drawn from minus pi to pi, and we want the one that is $y = 3\sin x$.'
        write: 'Sketch of $y = 3\sin x$, from $-\pi$ to $\pi$'
      - section: 'Solution'
        say: 'Solution. We make a table of values. Pi radians is 180 degrees, so the graphs run from minus 180 to 180 degrees. We take steps of 90 degrees.'
        write: 'Solution: $\pi = 180^{\circ}$; $\ x$ from $-180^{\circ}$ to $180^{\circ}$'
        diagram:
          id: t
          kind: table
          columns: ['x', 'sin x', 'y = 3 sin x']
          rows: [['−180°', 0, ''], ['−90°', −1, ''], ['0°', 0, ''], ['90°', 1, ''], ['180°', 0, '']]
          'on': 'table of values'
      - say: 'Start at $x$ equals 0. Sine 0 is 0, so $y$ is 3 times 0, which is 0. The curve must pass through the origin.'
        write: '$x = 0^{\circ}$: $y = 3\sin 0^{\circ} = 3 \times 0 = 0$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:3,3', text: '0'}
      - say: 'At 90 degrees, sine is 1, so $y$ is 3 times 1, which is 3. Going right from the origin, the curve rises to 3.'
        write: '$x = 90^{\circ}$: $y = 3\sin 90^{\circ} = 3 \times 1 = 3$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:4,3', text: '3'}
      - say: 'At minus 90 degrees, sine is minus 1, so $y$ is 3 times minus 1, which is minus 3. Going left, the curve falls to minus 3.'
        write: '$x = -90^{\circ}$: $y = 3\sin(-90^{\circ}) = 3 \times (-1) = -3$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:2,3', text: '−3'}
      - say: 'At 180 and minus 180 degrees, sine is 0, so $y$ is 0 at both ends.'
        write: '$x = \pm 180^{\circ}$: $y = 3 \times 0 = 0$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,3', text: '0'}
          - {id: t, op: fill, part: 'cell:5,3', text: '0'}
      - say: 'Now plot the points and join them with a smooth curve, never with a ruler. Up to 3, down to minus 3, crossing at the origin.'
        write: 'Plot: $(-90^{\circ}, -3)$, $(0, 0)$, $(90^{\circ}, 3)$: smooth curve'
        diagram:
          id: g
          kind: graph
          x: [-180, 180]
          y: [-3.5, 3.5]
          x_step: 90
          y_step: 1
          plots:
            - {fn: '3sin(x)', label: 'y = 3 sin x', colour: blue, later: true}
          'on': 'plot'
        diagram_do:
          - {id: g, op: plot, 'on': 'smooth curve'}
      - section: 'Compare the graphs'
        say: 'Graph B is at plus 3 when $x$ is 0, and graph D is at minus 3. Neither passes through the origin, so B and D are out.'
        write: 'B, D: $y \neq 0$ at $x = 0$ (out)'
        point:
          - {figure: 0, kind: strike, target: B}
          - {figure: 0, kind: strike, target: D}
      - say: 'Graphs A and C both pass through the origin. But graph A falls to minus 3 as it goes right, so that is $y = -3\sin x$. So A is out.'
        write: 'A: $-3$ at $90^{\circ}$, so $y = -3\sin x$ (out)'
        point:
          - {figure: 0, kind: strike, target: A}
      - say: 'Graph C is 0 at the origin, rises to 3 on the right and falls to minus 3 on the left. It matches every row of the table.'
        write: 'C: $0$ at $0^{\circ}$, $3$ at $90^{\circ}$, $-3$ at $-90^{\circ}$ $\checkmark$'
        point:
          - {figure: 0, kind: label, target: {x: 122, y: 170}, text: '3 at π/2'}
          - {figure: 0, kind: label, target: {x: 58, y: 250}, text: '−3 at −π/2'}
      - say: 'Therefore the sketch of $y = 3\sin x$ is graph C.'
        write: '$\therefore y = 3\sin x$ is graph C'
      - section: 'Check'
        say: 'Check the amplitude. Sine lies between minus 1 and 1, so 3 sine $x$ lies between minus 3 and 3. Graph C reaches exactly 3 and minus 3.'
        write: 'Check: $-1 \le \sin x \le 1 \Rightarrow -3 \le y \le 3\ \checkmark$'
      - section: 'Answer'
        say: 'So the sketch of $y = 3\sin x$ is graph C, which is answer choice C.'
        write: '$\therefore$ Graph C'
        answer: true
        point:
          - {figure: 0, kind: circle, target: C, text: 'y = 3 sin x'}
    traps:
      A: 'You went for graph A. It passes through the origin, but it falls to minus 3 at 90 degrees. The table gives $y = 3$ at 90 degrees, so A is $y = -3\sin x$.'
      B: 'You went for graph B. It is at 3 when $x$ is 0, but sine 0 is 0, so $y = 3\sin x$ starts at the origin. Graph B is $y = 3\cos x$.'
      D: 'You went for graph D. It is at minus 3 when $x$ is 0, but $y = 3\sin x$ is 0 there. Graph D is $y = -3\cos x$.'

  38:
    moments:
      - section: 'The question'
        say: 'Cosec $x$ is not in the basic table, but it is 1 over sine $x$, and sine is. So we write it as a power and use the chain rule.'
        write: '$y = \operatorname{cosec} x$'
      - section: 'Solution'
        say: 'Solution. Cosec $x$ is 1 over sine $x$, which is sine $x$ to the power minus 1.'
        write: '$y = \dfrac{1}{\sin x} = (\sin x)^{-1}$'
      - say: 'This is a function of a function. Let $u$ be the inside, sine $x$. Then $y$ is $u$ to the power minus 1.'
        'on': 'function of a function'
        write: 'Let $u = \sin x$, $\ \therefore y = u^{-1}$'
      - say: 'Differentiate each. $\dfrac{du}{dx}$ is cos $x$. For $\dfrac{dy}{du}$, multiply by the power, minus 1, and reduce the power to minus 2.'
        write: '$\dfrac{du}{dx} = \cos x$, $\ \dfrac{dy}{du} = -u^{-2}$'
      - say: 'The chain rule says $\dfrac{dy}{dx}$ equals $\dfrac{dy}{du}$ times $\dfrac{du}{dx}$.'
        'on': 'chain rule'
        write: '$\dfrac{dy}{dx} = \dfrac{dy}{du} \times \dfrac{du}{dx} = -u^{-2} \times \cos x$'
      - say: 'Put back $u$ equals sine $x$. $u$ to the minus 2 is 1 over sine squared $x$.'
        write: '$= -\dfrac{\cos x}{\sin^{2}x}$'
      - say: 'Split the fraction into cos $x$ over sine $x$, times 1 over sine $x$.'
        write: '$= -\dfrac{\cos x}{\sin x} \times \dfrac{1}{\sin x}$'
      - say: 'Cos $x$ over sine $x$ is cot $x$, and 1 over sine $x$ is cosec $x$.'
        write: '$= -\cot x \operatorname{cosec} x$'
      - section: 'Check'
        say: 'Check with the quotient rule, with top 1 and bottom sine $x$. Bottom times 0, minus top times cos $x$, over sine squared $x$. It agrees.'
        write: 'Check: $\dfrac{\sin x(0) - 1(\cos x)}{\sin^{2}x} = -\dfrac{\cos x}{\sin^{2}x}\ \checkmark$'
      - say: 'Therefore the derivative of cosec $x$ is minus cot $x$ cosec $x$, which is answer choice B.'
        write: '$\therefore \dfrac{d}{dx}(\operatorname{cosec} x) = -\cot x \operatorname{cosec} x$'
        answer: true
    traps:
      A: 'You went for tan $x$ cosec $x$. Two slips: the minus from the power minus 1 is lost, and cos $x$ over sine $x$ is cot $x$, not tan $x$.'
      C: 'You went for tan $x$ sec $x$. That is the derivative of sec $x$. For cosec $x$, write it as sine $x$ to the power minus 1.'
      D: 'You went for minus cot $x$ sec $x$. The minus and the cot are right, but 1 over sine $x$ is cosec $x$, not sec $x$.'
  39:
    moments:
      - section: 'The question'
        say: 'A tangent parallel to the $x$-axis is flat, so its gradient is zero. Many students give a root of the curve instead. Differentiate and set the gradient to zero.'
        write: '$y = x^{2} - 4x + 3$; tangent $\parallel$ $x$-axis; $\ x = ?$'
        diagram:
          id: g
          kind: graph
          x: [-1, 5]
          y: [-2, 6]
          step: 1
          plots:
            - {fn: 'x^2 - 4x + 3', label: 'y = x² − 4x + 3', colour: blue}
      - section: 'Solution'
        say: 'Solution. A line parallel to the $x$-axis has gradient zero, and the gradient of the curve at any point is $dy/dx$.'
        write: 'Solution: tangent $\parallel$ $x$-axis $\Rightarrow \dfrac{dy}{dx} = 0$'
      - say: 'Differentiate term by term, so multiply by the power, then reduce the power by 1.'
        write: 'If $y = ax^{n}$, $\ \dfrac{dy}{dx} = nax^{n-1}$'
      - say: '$x$ squared gives $2x$. Minus $4x$ gives minus 4. The constant 3 gives zero.'
        write: '$\dfrac{dy}{dx} = 2x - 4 + 0 = 2x - 4$'
        point:
          - {line: 3, kind: box, text: 'term by term'}
      - say: 'Set the gradient equal to zero.'
        write: '$2x - 4 = 0$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '= [[2x − 4]] +'}, at: '2x − 4', text: 'dy/dx'}
      - say: 'Add 4 to both sides.'
        write: '$2x = 4$'
      - say: 'Divide both sides by 2. The tangent is flat at $x$ equals 2, the lowest point of the curve.'
        write: '$x = 2$'
        diagram_do:
          - {id: g, op: vertex, part: 'plot:1', text: 'gradient 0'}
      - section: 'Check'
        say: 'At $x$ equals 2, $y$ is 4 minus 8 plus 3, which is minus 1. So the flat tangent is the line $y$ equals minus 1, parallel to the $x$-axis.'
        write: 'At $x = 2$: $\ y = 4 - 8 + 3 = -1$; tangent $y = -1$'
        diagram_do:
          - {id: g, op: line, m: 0, c: -1, label: 'tangent y = −1', colour: green}
      - say: 'Here is an exam tip, as a check. A quadratic turns at $x$ equals minus $b$ over $2a$. Here $a$ is 1 and $b$ is minus 4, so it is 4 over 2, which is 2.'
        write: 'Exam tip: $x = -\dfrac{b}{2a} = -\dfrac{-4}{2(1)} = 2\ \checkmark$'
      - say: 'Therefore the tangent is parallel to the $x$-axis at $x$ equals 2, which is option B.'
        write: '$\therefore x = 2$'
        answer: true
    traps:
      A: 'You went for 3. That is where the curve crosses the $x$-axis, a root. The question wants where the tangent is flat, where $2x - 4 = 0$.'
      C: 'You went for 1. That is the other root, where the curve crosses the axis. The flat tangent is at the turning point, $x = 2$.'
      D: 'You went for 0. At $x = 0$ the gradient is 2 times 0 minus 4, which is minus 4, not zero. Solving $2x - 4 = 0$ gives 2.'

  40:
    moments:
      - section: 'The question'
        say: 'We are given $dy/dx$ equals $4x - 3$, and $y = 5$ when $x = 2$. We want $y$ in terms of $x$.'
        write: 'Solution: $\dfrac{dy}{dx} = 4x - 3$; $\ y = 5$ when $x = 2$'
      - section: 'Integrate'
        say: 'Integration is the reverse of differentiation. We know $dy/dx$, so we integrate it with respect to $x$ to get $y$.'
        write: '$y = \displaystyle\int (4x - 3)\,dx$'
      - say: 'The rule is to add one to the power and divide by the new power, and always add $c$, the constant of integration.'
        write: '$\displaystyle\int x^{n}\,dx = \dfrac{x^{n + 1}}{n + 1} + c$'
      - say: 'Apply it term by term. $4x$ is $4x$ to the power 1, so add one to get power 2, and divide by 2. Negative 3 is negative $3x$ to the power 0, so it becomes negative $3x$.'
        write: '$y = \dfrac{4x^{2}}{2} - 3x + c$'
        point:
          - {line: 3, kind: underline, at: '24x2', text: 'new power 2'}
      - say: '4 over 2 is 2. Picture a whole family of curves, the same shape shifted up or down, one for every value of $c$.'
        write: '$y = 2x^{2} - 3x + c$'
        doodle: {name: 'custom:1995_q40_a', id: family, caption: 'which c goes through (2, 5)?'}
      - section: 'Find c'
        say: '$y = 5$ when $x = 2$, and that pins down one curve of the family. Substitute both into the equation.'
        write: 'When $x = 2,\ y = 5$: $\ 5 = 2(2)^{2} - 3(2) + c$'
        point:
          - {line: 5, kind: arrow, from: {line: 4, at: '2x2 − 3x + c'}, at: '2(2)2 − 3(2) + c', text: 'substitute'}
        doodle_do:
          - {id: family, op: circle, part: pin}
      - say: '2 squared is 4, and 2 times 4 is 8. 3 times 2 is 6.'
        write: '$5 = 8 - 6 + c$'
      - say: '8 minus 6 is 2.'
        write: '$5 = 2 + c$'
      - say: 'Subtract 2 from both sides. 5 minus 2 is 3. The pinned curve is the one with $c = 3$.'
        write: '$c = 5 - 2 = 3$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '2 +'}, at: '− 2', text: 'across the ='}
        doodle_do:
          - {id: family, op: highlight, part: chosen, text: 'c = 3'}
      - section: 'Check'
        say: 'Check both facts. Differentiate $2x^{2} - 3x + 3$ and we get $4x - 3$, as given. And at $x = 2$, 8 minus 6 plus 3 is 5.'
        write: 'Check: $\dfrac{dy}{dx} = 4x - 3\ \checkmark$; $\ 8 - 6 + 3 = 5\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore $y = 2x^{2} - 3x + 3$, which is option B.'
        write: '$\therefore y = 2x^{2} - 3x + 3$'
        point:
          - {line: 10, kind: move, from: {line: 8, at: '= [[3]]'}, at: '+ 3', text: 'c'}
        answer: true
    traps:
      A: 'You went for $2x^{2} - 3x + 5$. That uses the given $y$ value 5 as the constant. Put $x = 2$ in: 8 minus 6 plus 5 is 7, not 5. Solving for $c$ gives 3.'
      C: 'You went for $2x^{2} - 3x$. That forgets the constant of integration. At $x = 2$ it gives 8 minus 6, which is 2, not 5. So we need $c = 3$.'
      D: 'You went for 4. That is not a function of $x$ at all. Integrate $4x - 3$ to get $2x^{2} - 3x + c$, then find $c$.'

  41:
    moments:
      - section: 'The question'
        say: 'The area bounded by a curve, two ordinates and the $x$-axis. Ordinates are the upright lines $x$ equals 1 and $x$ equals 3. Let me draw the curve.'
        write: '$y = 3x^{2} - 2x + 1$; $\ x = 1$ to $x = 3$'
        diagram:
          id: g
          kind: graph
          x: [-0.5, 3.5]
          y: [-2, 24]
          y_step: 4
          plots:
            - {fn: '3x^2 - 2x + 1', label: 'y = 3x² − 2x + 1', colour: blue}
      - section: 'Solution'
        say: 'Solution. The area under a curve, from $x$ equals $a$ to $x$ equals $b$, is the integral of $y$ with respect to $x$. Here $a$ is 1 and $b$ is 3.'
        'on': 'area under'
        write: 'Area $= \displaystyle\int_{a}^{b} y\,dx = \int_{1}^{3} (3x^{2} - 2x + 1)\,dx$'
        diagram_do:
          - {id: g, op: shade, part: 'plot:1', x: [1, 3], text: 'Area = ?', colour: orange, on: here}
      - say: 'To integrate a power of $x$, add 1 to the power, and divide by the new power. Then add $c$, the constant of integration.'
        write: '$\displaystyle\int x^{n}\,dx = \dfrac{x^{n+1}}{n+1} + c$'
      - say: 'Go term by term. $3x$ squared becomes $3x$ cubed over 3. Minus $2x$ becomes minus $2x$ squared over 2. And 1 becomes $x$. For a definite integral, the $c$ cancels, so we leave it out.'
        write: '$= \left[\dfrac{3x^{3}}{3} - \dfrac{2x^{2}}{2} + x\right]_{1}^{3}$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
      - say: '3 over 3 is 1, and 2 over 2 is 1. Keep the limits, 1 and 3, on the square bracket.'
        write: '$= \left[x^{3} - x^{2} + x\right]_{1}^{3}$'
      - section: 'Upper minus lower'
        say: 'Substitute the upper limit, 3, then subtract the value at the lower limit, 1. Each in its own bracket.'
        write: '$= (3^{3} - 3^{2} + 3) - (1^{3} - 1^{2} + 1)$'
        point:
          - {line: 5, kind: underline, at: '(33 − 32 + 3)', text: 'upper'}
      - say: '3 cubed is 27, and 3 squared is 9. 1 cubed and 1 squared are both 1.'
        write: '$= (27 - 9 + 3) - (1 - 1 + 1)$'
      - say: '27 minus 9 plus 3 is 21. 1 minus 1 plus 1 is 1.'
        write: '$= 21 - 1$'
      - say: '21 minus 1 is 20.'
        write: '$= 20$'
        diagram_do:
          - {id: g, op: label, part: 'shade:1', text: 'Area = 20', colour: green}
      - section: 'Check'
        say: 'Check that the curve stays above the $x$-axis, so no part of the area is negative. The discriminant, $b$ squared minus $4ac$, is 4 minus 12, minus 8.'
        write: 'Check: $b^{2} - 4ac = (-2)^{2} - 4(3)(1) = -8 < 0$'
      - say: 'Negative, so the curve never meets the axis. Therefore the area is 20 square units, which is answer choice D.'
        write: '$\therefore$ Area $= 20$ square units'
        answer: true
    traps:
      A: 'You went for 24. Divide by the NEW power: $3x^{2}$ integrates to $\dfrac{3x^{3}}{3}$, which is $x^{3}$, and $-2x$ to $-x^{2}$. Then 21 minus 1 is 20.'
      B: 'You went for 22. That is $y$ at $x = 3$, not the area. Integrate first: $[x^{3} - x^{2} + x]$ from 1 to 3 is 21 minus 1, which is 20.'
      C: 'You went for 21. That is the upper limit only. Upper minus lower: 21 minus 1, which is 20.'
  42:
    moments:
      - section: 'The question'
        say: 'The table shows the ages of students in a school, from 13 to 17 years. On a pie chart of this data, we want the angle for the 15-year-olds.'
        write: 'Angle for the $15$-year-olds $= ?$'
      - section: 'Solution'
        say: 'Solution. Draw the table, with each age, its number of students f, and its sectoral angle, which is f over sigma f, times 360 degrees.'
        write: 'Sectoral angle $= \dfrac{f}{\Sigma f} \times 360^{\circ}$'
        diagram: {id: t, kind: table, columns: ['Age (years)', 'Frequency (f)', 'Sectoral angle'], rows: [[13, 3, ''], [14, 10, ''], [15, 30, ''], [16, 42, ''], [17, 15, '']]}
      - say: 'First sigma f, the total number of students.'
        write: '$\Sigma f = 3 + 10 + 30 + 42 + 15$'
      - say: '3 plus 10 is 13, plus 30 is 43, plus 42 is 85, plus 15 is 100 students.'
        write: '$= 100$'
        diagram_do:
          - {id: t, op: total, part: 'col:2', 'on': '100 students'}
      - section: 'The 15-year-olds'
        say: 'Read the table carefully, because under the age 15, the frequency is 30, not 15. Substitute 30 over 100, times 360 degrees.'
        write: '$15$ years: $\dfrac{30}{100} \times 360^{\circ}$'
        diagram_do:
          - {id: t, op: highlight, part: 'row:3', text: 'f = 30', 'on': 'frequency is 30'}
        point:
          - {line: 4, kind: move, from: {line: 3, at: '= 100'}, at: '100', text: 'Σf'}
      - say: '360 over 100 is 3.6, so this is 30 times 3.6.'
        write: '$= 30 \times 3.6^{\circ}$'
      - say: '30 times 3.6 is 108 degrees.'
        write: '$= 108^{\circ}$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:3,3', text: '108°', 'on': '108 degrees'}
      - section: 'Check'
        say: 'Check by going back. 108 over 360, times 100 students, is 0.3 times 100, which is 30, the number of 15-year-olds.'
        write: 'Check: $\dfrac{108}{360} \times 100 = 0.3 \times 100 = 30\ \checkmark$'
        diagram: {id: p, kind: pie, show: angle, sectors: [{label: '13', value: 3}, {label: '14', value: 10}, {label: '15', value: 30, colour: green}, {label: '16', value: 42}, {label: '17', value: 15}]}
      - section: 'Answer'
        say: 'Therefore the angle for the 15-year-olds is 108 degrees, which is answer choice D.'
        write: '$\therefore$ angle $= 108^{\circ}$'
        answer: true
    traps:
      A: 'You went for 27 degrees. The 15-year-olds are 30 out of 100 students, and 30 over 100, times 360, is 108 degrees.'
      B: 'You went for 30 degrees. That is the frequency, the number of students, not an angle. 30 over 100, times 360, is 108 degrees.'
      C: 'You went for 54 degrees. That is 15 over 100 of 360: it uses 15, the age, or the 15 students aged 17. The frequency for age 15 is 30, which gives 108 degrees.'

  43:
    moments:
      - section: 'The question'
        say: 'The pie chart shows the students in a class by subject. 30 students offered French. We want the number who offered C.R.K.'
        write: 'French $= 30$ students. C.R.K. $= ?$'
        point:
          - {figure: 0, kind: highlight, target: French, text: '30 students'}
      - section: 'Solution'
        say: 'Solution. From the chart, Economics is 150 degrees, and History has the right-angle mark, so it is 90 degrees.'
        write: 'Economics $= 150^{\circ}$, History $= 90^{\circ}$'
        point:
          - {figure: 0, kind: circle, target: '150°'}
          - {figure: 0, kind: circle, target: '90°'}
      - say: 'French lies between the same horizontal line and the vertical line, below it. Angles on a straight line add up to 180 degrees, so French is 180 minus 90.'
        write: 'French $= 180^{\circ} - 90^{\circ} = 90^{\circ}$ (∠s on a str. line)'
        point:
          - {figure: 0, kind: label, target: French, text: '90°'}
      - say: 'The angles at the centre make 360 degrees, so C.R.K. is 360 minus the other three.'
        write: 'C.R.K. $= 360^{\circ} - (150^{\circ} + 90^{\circ} + 90^{\circ})$'
      - say: '150 plus 90 plus 90 is 330, and 360 minus 330 is 30 degrees.'
        write: '$= 360^{\circ} - 330^{\circ} = 30^{\circ}$'
        point:
          - {figure: 0, kind: label, target: C.R.K., text: '30°'}
      - section: 'The number of students'
        say: 'Now the formula. The number in a sector is its sectoral angle over 360, times the total number of students.'
        write: 'Number $= \dfrac{\text{sectoral angle}}{360^{\circ}} \times \text{total}$'
      - say: 'We do not know the total yet, so let N be the total number of students. French, 90 degrees, stands for 30 of them.'
        write: 'Let $N$ = total. French: $\dfrac{90}{360} \times N = 30$'
        point:
          - {line: 6, kind: move, from: {line: 0, at: '= 30'}, at: '= 30', text: 'French'}
      - say: '90 over 360 is a quarter, so a quarter of N is 30. Multiply both sides by 4, and N is 120 students.'
        write: '$\dfrac{1}{4}N = 30 \Rightarrow N = 120$'
      - say: 'Now substitute for C.R.K., which gives 30 degrees over 360, times 120.'
        write: 'C.R.K. $= \dfrac{30}{360} \times 120$'
        point:
          - {line: 8, kind: move, from: {line: 4, at: '= 30∘'}, at: '30', text: 'C.R.K. angle'}
          - {line: 8, kind: move, from: {line: 7, at: 'N = 120'}, at: '120', text: 'total'}
      - say: '30 over 360 is 1 over 12, and 120 divided by 12 is 10 students.'
        write: '$= \dfrac{120}{12} = 10$'
      - section: 'Check'
        say: 'Check another way. The C.R.K. sector, 30 degrees, is a third of French''s 90 degrees. So it holds a third of the 30 French students, which is 10.'
        write: 'Check: $\dfrac{30^{\circ}}{90^{\circ}} \times 30 = \dfrac{1}{3} \times 30 = 10\ \checkmark$'
        doodle: {name: student-small, id: french, caption: '30 French students = 90°', repeat: 30, layout: grid}
        doodle_do:
          - {id: french, op: split, n: 10, text: 'a third: 10 | two thirds: 20'}
      - section: 'Answer'
        say: 'Therefore 10 students offered C.R.K., which is answer choice C.'
        write: '$\therefore$ C.R.K. $= 10$ students'
        answer: true
        point:
          - {figure: 0, kind: circle, target: C.R.K., text: '10 students'}
    traps:
      A: 'You went for 25. That would make C.R.K. almost as big as French, but its sector is much smaller. C.R.K. is 30 over 360 of the 120 students, which is 10.'
      B: 'You went for 15. That would be half of French, a 45 degree sector. C.R.K. is 30 degrees, a third of French, so it is 10 students.'
      D: 'You went for 8. The total is 120 students, since French''s 90 degrees, a quarter, is 30. C.R.K. is 30 over 360 of 120, which is 10.'

  44:
    moments:
      - section: 'The question'
        say: 'Eight numbers, and two things to find, the mean, $m$, and the range, $r$. Then add them. Picture the numbers as eight bars.'
        write: 'Data: $0.20,\ 1.00,\ 0.90,\ 1.40,\ 0.80,\ 0.80,\ 1.20,\ 1.10$'
        doodle: {name: 'custom:1995_q44_a', id: bars, caption: 'eight numbers as bars'}
      - section: 'Solution'
        say: 'Solution. The mean, $x$ bar, is the sum of the numbers over $n$, how many there are. Here $n$ is 8.'
        write: 'Solution. $m = \bar{x} = \dfrac{\sum x}{n}$, $n = 8$'
      - section: 'The mean'
        say: 'Add the numbers in pairs. 0.20 plus 1.00 is 1.20. 0.90 plus 1.40 is 2.30.'
        write: '$0.20 + 1.00 = 1.20,\quad 0.90 + 1.40 = 2.30$'
      - say: '0.80 plus 0.80 is 1.60. 1.20 plus 1.10 is 2.30.'
        write: '$0.80 + 0.80 = 1.60,\quad 1.20 + 1.10 = 2.30$'
      - say: 'Now add the four pair totals. 1.20 plus 2.30 plus 1.60 plus 2.30 is 7.40.'
        write: '$\sum x = 1.20 + 2.30 + 1.60 + 2.30 = 7.40$'
      - say: 'Substitute, and 7.40 over 8 is 0.925.'
        write: '$m = \dfrac{7.40}{8} = 0.925$'
        doodle_do:
          - {id: bars, op: stage, stage: 'custom:1995_q44_a2'}
        point:
          - {line: 5, kind: move, from: {line: 4, at: '=[[740]]'}, at: '8[[740]]', text: 'Σx'}
          - {line: 5, kind: highlight, at: '0925', to: {doodle: bars, part: mean}}
      - section: 'The range'
        say: 'The range is the highest value minus the lowest value. The tallest bar is 1.40 and the shortest is 0.20.'
        write: 'Range $=$ highest $-$ lowest'
        doodle_do:
          - {id: bars, op: circle, part: tallest}
          - {id: bars, op: circle, part: shortest}
      - say: 'Substitute again, and 1.40 minus 0.20 is 1.20.'
        write: '$r = 1.40 - 0.20 = 1.20$'
        doodle_do:
          - {id: bars, op: arrow, part: shortest, to_part: tallest, text: 'range 1.20'}
      - section: 'Add them'
        say: 'Now $m$ plus $r$, so 0.925 plus 1.20 is 2.125.'
        write: '$m + r = 0.925 + 1.20 = 2.125$'
        point:
          - {line: 8, kind: move, from: {line: 5, at: '=[[0925]]'}, at: '=[[0925]]', text: 'm'}
          - {line: 8, kind: move, from: {line: 7, at: '=[[120]]'}, at: '0925+[[120]]', text: 'r'}
      - section: 'Check'
        say: 'Check the mean. 8 times 0.925 is 7.40, the sum. And the mean, 0.925, lies between the lowest, 0.20, and the highest, 1.40.'
        write: 'Check: $8 \times 0.925 = 7.40$ ✓'
      - section: 'Answer'
        say: 'So $m$ plus $r$ is 2.125, which is option D.'
        write: '$\therefore m + r = 2.125$'
        answer: true
    traps:
      A: 'You went for 1.11. That is too small: the range alone is 1.20. The mean is 7.40 over 8, which is 0.925, and 0.925 plus 1.20 is 2.125.'
      B: 'You went for 1.65. Check both parts: $\sum x$ is 7.40, so the mean is 0.925, and the range is 1.40 minus 0.20, which is 1.20. Together they make 2.125.'
      C: 'You went for 1.85. Check both parts: the mean is 7.40 over 8, which is 0.925, and the range is highest minus lowest, 1.20. Together they make 2.125.'
  45:
    moments:
      - section: 'The question'
        say: 'Three classes and their frequencies. How spread out are the values? The standard deviation, S.D., measures that spread. Table first.'
        write: 'S.D. $= ?$'
        diagram:
          id: t
          kind: table
          columns: ['Class', 'Class mark (x)', 'f', 'fx']
          rows: [['1 – 3', '', 5, ''], ['4 – 6', '', 8, ''], ['7 – 9', '', 5, '']]
          'on': 'Table'
      - section: 'Solution'
        say: 'Solution. The S.D. is the square root of the sum of $f$ times the squared deviation, over the sum of $f$. The deviations need the mean, so the mean comes first.'
        write: 'S.D. $= \sqrt{\dfrac{\sum f(x - \bar{x})^{2}}{\sum f}}$'
      - section: 'The mean'
        say: 'For grouped data, $x$ is the class mark, the middle of the class. 1 plus 3, over 2, is 2. Then 5, and 8.'
        write: 'Class mark $= \dfrac{1 + 3}{2} = 2$, and so on'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,2', text: '2'}
          - {id: t, op: fill, part: 'cell:2,2', text: '5'}
          - {id: t, op: fill, part: 'cell:3,2', text: '8'}
      - say: 'In the $fx$ column, 2 times 5 is 10, 5 times 8 is 40, and 8 times 5 is 40.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,4', text: '10'}
          - {id: t, op: fill, part: 'cell:2,4', text: '40'}
          - {id: t, op: fill, part: 'cell:3,4', text: '40'}
      - say: 'Add down the $f$ column, and 5 plus 8 plus 5 is 18.'
        write: '$\sum f = 18$'
        diagram_do:
          - {id: t, op: total, part: 'col:3', 'on': 'Add'}
      - say: 'Add down the $fx$ column, and 10 plus 40 plus 40 is 90.'
        write: '$\sum fx = 90$'
        diagram_do:
          - {id: t, op: total, part: 'col:4', 'on': 'Add'}
      - say: 'The mean, $x$ bar, is the sum of $fx$ over the sum of $f$.'
        write: '$\bar{x} = \dfrac{\sum fx}{\sum f}$'
      - say: 'Substitute, and 90 over 18 is 5. Picture the three stacks on a see-saw, and it balances at 5.'
        write: '$= \dfrac{90}{18} = 5$'
        doodle: {name: 'custom:1995_q45_a', id: seesaw, caption: '5 at 2, 8 at 5, 5 at 8', 'on': 'stacks'}
        doodle_do:
          - {id: seesaw, op: circle, part: fulcrum, text: 'x̄ = 5', 'on': 'balances'}
        point:
          - {line: 7, kind: move, from: {line: 5, at: '90'}, at: '18[[90]]', text: 'Σfx'}
          - {line: 7, kind: move, from: {line: 4, at: '18'}, at: '[[18]]90', text: 'Σf'}
      - section: 'The deviations'
        say: 'Now the deviation table, with each class mark minus the mean, then its square, then $f$ times the square.'
        diagram:
          id: d
          kind: table
          columns: ['x', 'f', 'x − x̄', '(x − x̄)²', 'f(x − x̄)²']
          rows: [[2, 5, '', '', ''], [5, 8, '', '', ''], [8, 5, '', '', '']]
          'on': 'deviation'
      - say: 'In row one, 2 minus 5 is minus 3. Squared, 9. Times 5, 45. On the see-saw, that stack sits 3 from the balance point.'
        diagram_do:
          - {id: d, op: fill, part: 'cell:1,3', text: '−3'}
          - {id: d, op: fill, part: 'cell:1,4', text: '9'}
          - {id: d, op: fill, part: 'cell:1,5', text: '45'}
        doodle_do:
          - {id: seesaw, op: label, part: left, text: '3 away'}
      - say: 'In row two, 5 minus 5 is 0. Squared, 0. Times 8, still 0.'
        diagram_do:
          - {id: d, op: fill, part: 'cell:2,3', text: '0'}
          - {id: d, op: fill, part: 'cell:2,4', text: '0'}
          - {id: d, op: fill, part: 'cell:2,5', text: '0'}
      - say: 'Row three gives 8 minus 5, which is 3. Squared, 9. Times 5, 45. Squaring makes both outer stacks count as positive spread.'
        diagram_do:
          - {id: d, op: fill, part: 'cell:3,3', text: '3'}
          - {id: d, op: fill, part: 'cell:3,4', text: '9'}
          - {id: d, op: fill, part: 'cell:3,5', text: '45'}
        doodle_do:
          - {id: seesaw, op: label, part: right, text: '3 away'}
      - say: 'Add the last column, and 45 plus 0 plus 45 is 90.'
        write: '$\sum f(x - \bar{x})^{2} = 90$'
        diagram_do:
          - {id: d, op: total, part: 'col:5', 'on': 'last column'}
      - section: 'The variance'
        say: 'The variance is the sum of $f$ times the squared deviation, over the sum of $f$. We divide by 18, the total frequency.'
        write: 'Variance $= \dfrac{\sum f(x - \bar{x})^{2}}{\sum f}$'
      - say: 'Substitute, so 90 over 18, which is 5.'
        write: '$= \dfrac{90}{18} = 5$'
        point:
          - {line: 14, kind: move, from: {line: 12, at: '90'}, at: '18[[90]]', text: 'Σf(x − x̄)²'}
          - {line: 14, kind: move, from: {line: 4, at: '18'}, at: '[[18]]90', text: 'Σf'}
      - say: 'The S.D. is the square root of the variance, which is root 5.'
        write: '$\therefore$ S.D. $= \sqrt{5}$'
      - section: 'Check'
        say: 'Check the mean, because the deviations times $f$ must add to 0. 5 times minus 3, plus 8 times 0, plus 5 times 3, is 0. It agrees.'
        write: 'Check: $5(-3) + 8(0) + 5(3) = 0$ ✓'
      - section: 'Answer'
        say: 'So the standard deviation is root 5, which is option D.'
        write: '$\therefore$ S.D. $= \sqrt{5}$'
        answer: true
    traps:
      A: 'You went for 0.5. That is far too small for class marks spread from 2 to 8. The variance is 90 over 18, which is 5, and the S.D. is root 5.'
      B: 'You went for root 6. That divides 90 by 15 instead of 18. Divide by $\sum f$, the total frequency: 5 plus 8 plus 5, which is 18.'
      C: 'You went for 5 over 3. Follow the table: $\sum f(x - \bar{x})^{2}$ is 90, divide by $\sum f$, 18, to get the variance 5, then take the square root: root 5.'

  46:
    moments:
      - section: 'The question'
        say: 'Five scores, 1 to 5. The variance measures how spread out they are, and it is the average of the squared deviations from the mean. Picture the scores on a line.'
        write: 'Scores: $1,\ 2,\ 3,\ 4,\ 5$; variance $= ?$'
        doodle: {name: 'custom:1995_q46_a', id: line, caption: 'five scores on a line'}
      - section: 'Solution'
        say: 'Solution. The variance is the sum of the squared deviations over $n$. We divide by $n$, the number of scores.'
        write: 'Variance $= \dfrac{\sum(x - \bar{x})^{2}}{n}$'
      - say: 'The deviations need the mean. 1 plus 2 plus 3 plus 4 plus 5 is 15, and 15 over 5 is 3.'
        write: '$\bar{x} = \dfrac{\sum x}{n} = \dfrac{15}{5} = 3$'
        doodle_do:
          - {id: line, op: circle, part: mean, text: 'x̄ = 3'}
      - section: 'The deviation table'
        say: 'Now the table, with each score, $x$ minus $x$ bar, and its square.'
        diagram:
          id: d
          kind: table
          columns: ['x', 'x − x̄', '(x − x̄)²']
          rows: [[1, '', ''], [2, '', ''], [3, '', ''], [4, '', ''], [5, '', '']]
          'on': 'table'
      - say: '1 minus 3 is minus 2. 2 minus 3 is minus 1. 3 minus 3 is 0.'
        diagram_do:
          - {id: d, op: fill, part: 'cell:1,2', text: '−2'}
          - {id: d, op: fill, part: 'cell:2,2', text: '−1'}
          - {id: d, op: fill, part: 'cell:3,2', text: '0'}
      - say: '4 minus 3 is 1, and 5 minus 3 is 2. These add to 0, so we square them.'
        diagram_do:
          - {id: d, op: fill, part: 'cell:4,2', text: '1'}
          - {id: d, op: fill, part: 'cell:5,2', text: '2'}
        doodle_do:
          - {id: line, op: stage, stage: 'custom:1995_q46_a2'}
      - say: 'Now the squares. Minus 2 squared is 4, minus 1 squared is 1, 0 squared is 0.'
        diagram_do:
          - {id: d, op: fill, part: 'cell:1,3', text: '4'}
          - {id: d, op: fill, part: 'cell:2,3', text: '1'}
          - {id: d, op: fill, part: 'cell:3,3', text: '0'}
      - say: '1 squared is 1, and 2 squared is 4.'
        diagram_do:
          - {id: d, op: fill, part: 'cell:4,3', text: '1'}
          - {id: d, op: fill, part: 'cell:5,3', text: '4'}
      - say: 'Add the last column, and 4 plus 1 plus 0 plus 1 plus 4 is 10.'
        write: '$\sum(x - \bar{x})^{2} = 10$'
        diagram_do:
          - {id: d, op: total, part: 'col:3', 'on': 'Add'}
        doodle_do:
          - {id: line, op: label, part: squares, text: '4 + 1 + 0 + 1 + 4 = 10'}
      - say: 'Substitute, and 10 over 5 is 2.'
        write: '$\therefore$ Variance $= \dfrac{10}{5} = 2$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '=[[10]]'}, at: '5[[10]]', text: 'Σ(x − x̄)²'}
      - section: 'Check'
        say: 'Check with the other formula, sigma $x$ squared over $n$, minus $x$ bar squared. 1 plus 4 plus 9 plus 16 plus 25 is 55. 55 over 5 is 11, and 11 minus 9 is 2.'
        write: 'Check: $\dfrac{\sum x^{2}}{n} - \bar{x}^{2} = \dfrac{55}{5} - 3^{2} = 11 - 9 = 2$ ✓'
      - section: 'Answer'
        say: 'So the variance is 2.0, which is option C.'
        write: '$\therefore$ Variance $= 2.0$'
        answer: true
    traps:
      A: 'You went for 1.2. That is 2 plus 1 plus 0 plus 1 plus 2, over 5: the deviations without squaring. Squared, they add to 10, and 10 over 5 is 2.'
      B: 'You went for 1.4. That is about root 2, the standard deviation. The variance has no square root: 10 over 5, which is 2.'
      D: 'You went for 3.0. That is the mean, $x$ bar. The variance is the sum of the squared deviations over $n$: 10 over 5, which is 2.'

  47:
    moments:
      - section: 'The question'
        say: 'Forty values in seven classes. The mode of grouped data lies in the class with the highest frequency, and a formula places it inside that class. Table first.'
        write: 'Mode $= ?$ (to 1 decimal place)'
        diagram:
          id: t
          kind: table
          columns: ['Class', 'Class boundaries', 'f']
          rows: [['1.5 – 1.9', '1.45 − 1.95', 2], ['2.0 – 2.4', '1.95 − 2.45', 1], ['2.5 – 2.9', '2.45 − 2.95', 4], ['3.0 – 3.4', '2.95 − 3.45', 15], ['3.5 – 3.9', '3.45 − 3.95', 10], ['4.0 – 4.4', '3.95 − 4.45', 5], ['4.5 – 4.9', '4.45 − 4.95', 3]]
          'on': 'Table'
        doodle: {name: 'custom:1995_q47_a', id: piles, caption: 'the tallest pile holds the mode'}
      - section: 'Solution'
        say: 'Solution. The modal class is the class with the highest frequency. The highest $f$ is 15, so the modal class is 3.0 to 3.4.'
        write: 'Solution. Modal class: $3.0 - 3.4$ (highest $f = 15$)'
        diagram_do:
          - {id: t, op: highlight, part: 'row:4', text: 'modal class', 'on': 'modal', on_nth: 2}
        doodle_do:
          - {id: piles, op: circle, part: tallest}
      - section: 'The formula'
        say: 'The mode formula is $L_1$, plus $D_1$ over $D_1$ plus $D_2$, times $c$.'
        write: 'Mode $= L_{1} + \left(\dfrac{D_{1}}{D_{1} + D_{2}}\right) \times c$'
      - say: '$L_1$ is the lower class boundary of the modal class, which is 2.95, not the class limit 3.0.'
        write: '$L_{1} = 2.95$'
        diagram_do:
          - {id: t, op: label, part: 'cell:4,2', text: 'L₁ = 2.95'}
      - say: '$D_1$ is the modal frequency minus the frequency of the class before, so 15 minus 4 is 11.'
        write: '$D_{1} = 15 - 4 = 11$'
        diagram_do:
          - {id: t, op: label, part: 'cell:3,3', text: 'class before'}
      - say: '$D_2$ is the modal frequency minus the frequency of the class after, and 15 minus 10 is 5.'
        write: '$D_{2} = 15 - 10 = 5$'
        diagram_do:
          - {id: t, op: label, part: 'cell:5,3', text: 'class after'}
      - say: '$c$ is the class width, so 3.45 minus 2.95 is 0.5.'
        write: '$c = 3.45 - 2.95 = 0.5$'
      - section: 'Substitute'
        say: 'Substitute the four values into the formula.'
        write: 'Mode $= 2.95 + \left(\dfrac{11}{11 + 5}\right) \times 0.5$'
        point:
          - {line: 7, kind: move, from: {line: 3, at: '295'}, at: '=[[295]]+', text: 'L₁'}
          - {line: 7, kind: move, from: {line: 4, at: '=[[11]]'}, at: '11+5[[11]]', text: 'D₁'}
          - {line: 7, kind: move, from: {line: 5, at: '=[[5]]'}, at: '11+[[5]]', text: 'D₂'}
      - say: '11 plus 5 is 16, so it is 11 over 16, times 0.5.'
        write: '$= 2.95 + \dfrac{11}{16} \times 0.5$'
      - say: '11 over 16 times 0.5 is 5.5 over 16, which is about 0.344.'
        write: '$= 2.95 + 0.344$'
      - say: '2.95 plus 0.344 is 3.294.'
        write: '$= 3.294$'
      - say: 'To 1 decimal place, look at the second decimal digit. It is 9, so 3.2 rounds up to 3.3.'
        write: '$\therefore$ Mode $= 3.3$ (1 d.p.)'
        doodle_do:
          - {id: piles, op: label, part: tallest, text: 'mode ≈ 3.3'}
      - section: 'Check'
        say: 'To check, the mode lies inside the modal class, between 2.95 and 3.45, and above its middle, 3.2, because the class after, 10, is fuller than the class before, 4.'
        write: 'Check: $3.2 < 3.294 < 3.45$ ✓'
      - section: 'Answer'
        say: 'So the mode, correct to 1 decimal place, is 3.3, which is option A.'
        write: '$\therefore$ Mode $= 3.3$'
        answer: true
    traps:
      B: 'You went for 3.4, the upper class limit of the modal class. The formula places the mode inside the class: 2.95 plus 11 over 16 times 0.5, which is 3.294, so 3.3.'
      C: 'You went for 3.7, the class mark of 3.5 to 3.9, whose frequency is 10. The highest frequency is 15, so the modal class is 3.0 to 3.4, and the formula gives 3.3.'
      D: 'You went for 4.2, the class mark of 4.0 to 4.4, whose frequency is only 5. The modal class has the highest frequency, 15, and the formula gives 3.3.'
  48:
    moments:
      - section: 'The question'
        say: 'Forty values in seven classes, and we want the middle one. Counting finds the class, and a formula finds the spot inside it. Here is the table, with the class boundaries.'
        write: 'Median $= ?$ (to 1 decimal place)'
        diagram:
          id: t
          kind: table
          columns: ['Class', 'Class boundaries', 'f', 'cf']
          rows: [['1.5 – 1.9', '1.45 − 1.95', 2, ''], ['2.0 – 2.4', '1.95 − 2.45', 1, ''], ['2.5 – 2.9', '2.45 − 2.95', 4, ''], ['3.0 – 3.4', '2.95 − 3.45', 15, ''], ['3.5 – 3.9', '3.45 − 3.95', 10, ''], ['4.0 – 4.4', '3.95 − 4.45', 5, ''], ['4.5 – 4.9', '4.45 − 4.95', 3, '']]
          'on': 'table'
      - section: 'Solution'
        say: 'Solution. First the cumulative frequency, cf, which is a running total of $f$ down the table. 2, then 3, 7, 22, 32, 37 and 40.'
        write: 'Solution'
        diagram_do:
          - {id: t, op: total, part: 'col:3', into: 'col:4', 'on': 'cumulative'}
      - say: 'The last cf is the total frequency. So $N$, the sum of $f$, is 40.'
        write: '$N = \sum f = 40$'
      - say: 'Half of $N$ is 40 over 2, which is 20. The median is the 20th value.'
        write: '$\dfrac{N}{2} = \dfrac{40}{2} = 20$'
      - say: 'Go down the cf column to the first class whose cf reaches 20. 7 is too small, but 22 passes 20. So the median class is 2.95 to 3.45.'
        write: 'Median class: $2.95 - 3.45$'
        diagram_do:
          - {id: t, op: highlight, part: 'row:4', text: 'median class', 'on': 'median class'}
      - section: 'The formula'
        say: 'Now the median formula. Median equals $L_1$, plus $N$ over 2 minus cf, all over $f$, times $c$.'
        write: 'Median $= L_{1} + \left(\dfrac{\frac{N}{2} - cf}{f}\right) \times c$'
      - say: '$L_1$ is the lower class boundary of the median class, which is 2.95.'
        write: '$L_{1} = 2.95$'
        diagram_do:
          - {id: t, op: label, part: 'cell:4,2', text: 'L₁ = 2.95'}
      - say: 'cf is the cumulative frequency of the class before the median class, and that is 7.'
        write: '$cf = 7$'
        diagram_do:
          - {id: t, op: label, part: 'cell:3,4', text: 'class before'}
      - say: '$f$ is the frequency of the median class itself, which is 15.'
        write: '$f = 15$'
      - say: '$c$ is the class width, that is, the upper boundary minus the lower one. 3.45 minus 2.95 is 0.5.'
        write: '$c = 3.45 - 2.95 = 0.5$'
      - section: 'Substitute'
        say: 'Substitute the four values into the formula.'
        write: 'Median $= 2.95 + \left(\dfrac{20 - 7}{15}\right) \times 0.5$'
        point:
          - {line: 10, kind: move, from: {line: 6, at: '2.95'}, at: '[[2.95]] +', text: 'L₁'}
          - {line: 10, kind: move, from: {line: 7, at: '7'}, at: '20 − [[7]]', text: 'cf'}
          - {line: 10, kind: move, from: {line: 8, at: '15'}, at: '15', text: 'f'}
      - say: '20 minus 7 is 13. So we have 13 over 15, times 0.5.'
        write: '$= 2.95 + \dfrac{13}{15} \times 0.5$'
      - say: '13 over 15 times 0.5 is 6.5 over 15, which is about 0.433.'
        write: '$= 2.95 + 0.433$'
      - say: '2.95 plus 0.433 is 3.383.'
        write: '$= 3.383$'
      - say: 'To 1 decimal place, look at the second decimal digit. It is 8, which is 5 or more, so 3.3 rounds up to 3.4.'
        write: '$\therefore$ Median $= 3.4$ (1 d.p.)'
      - section: 'Check'
        say: 'To check, the median must lie inside the median class, between 2.95 and 3.45. 3.383 does. It is far along the class, because the 20th value is the 13th of its 15.'
        write: 'Check: $\ 2.95 < 3.383 < 3.45\ \checkmark$'
      - section: 'Answer'
        say: 'So the median, correct to 1 decimal place, is 3.4, which is option B.'
        write: '$\therefore$ Median $= 3.4$'
        answer: true
    traps:
      A: 'You went for 4.0. That lies in the class 3.95 to 4.45, two classes too far down. The cf reaches 20 in the class 2.95 to 3.45, and the formula gives 3.383, which is 3.4.'
      C: 'You went for 3.2. That is the class mark, the mid-point, of the median class. The class is right, but the formula places the median inside it: 2.95 plus 13 over 15 times 0.5 is 3.383, which is 3.4.'
      D: 'You went for 3.0. That is the lower class limit of the median class. The formula starts from the boundary 2.95 and adds 13 over 15 times 0.5: 3.383, which is 3.4.'

  49:
    moments:
      - section: 'The question'
        say: '$S$ has four outcomes, $a_1$ to $a_4$. P of $a_2$ and P of $a_3$ are each 1 over 6, and P of $a_4$ is 1 over 5. We want P of $a_1$.'
        write: '$P(a_{2}) = P(a_{3}) = \dfrac{1}{6},\quad P(a_{4}) = \dfrac{1}{5}$'
      - say: 'Solution. The probabilities of all the outcomes in a sample space add up to 1.'
        write: 'Solution: $P(a_{1}) + P(a_{2}) + P(a_{3}) + P(a_{4}) = 1$'
      - say: 'So P of $a_1$ is 1 minus the other three. Notice 1 over 6 is taken away twice, once for $a_2$ and once for $a_3$.'
        write: '$P(a_{1}) = 1 - \left(\dfrac{1}{6} + \dfrac{1}{6} + \dfrac{1}{5}\right)$'
      - section: 'Add the bracket'
        say: 'The L.C.M. of 6 and 5 is 30. Picture the whole probability, 1, as a bar of 30 pieces.'
        write: 'L.C.M. of $6$ and $5 = 30$'
        doodle: {name: 'custom:1995_q49_a', id: bar, caption: '1 whole = 30 pieces'}
      - say: '1 over 6 is 5 over 30, because 6 times 5 is 30. And 1 over 5 is 6 over 30, because 5 times 6 is 30. Colour 5, 5 and 6 pieces.'
        write: '$\dfrac{1}{6} + \dfrac{1}{6} + \dfrac{1}{5} = \dfrac{5 + 5 + 6}{30}$'
        doodle_do:
          - {id: bar, op: stage, stage: 'custom:1995_q49_a2'}
      - say: '5 plus 5 plus 6 is 16. So the bracket is 16 over 30.'
        write: '$= \dfrac{16}{30}$'
      - section: 'Subtract from 1'
        say: 'Now 1 minus 16 over 30. 1 is 30 over 30, and 30 minus 16 is 14.'
        write: '$P(a_{1}) = \dfrac{30}{30} - \dfrac{16}{30} = \dfrac{14}{30}$'
        doodle_do:
          - {id: bar, op: label, part: rest, text: '14 left'}
        point:
          - {line: 6, kind: move, from: {line: 5, at: '= 3016'}, at: '− [[3016]]', text: 'the bracket'}
      - say: 'Divide the top and the bottom by 2. 14 divided by 2 is 7, and 30 divided by 2 is 15.'
        write: '$= \dfrac{7}{15}$'
      - section: 'Check'
        say: 'Check. 7 over 15 is 14 over 30. And 14 plus 5 plus 5 plus 6 is 30, so all four add to 30 over 30, which is 1.'
        write: 'Check: $\dfrac{14 + 5 + 5 + 6}{30} = \dfrac{30}{30} = 1\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore P of $a_1$ is 7 over 15, which is option A.'
        write: '$\therefore P(a_{1}) = \dfrac{7}{15}$'
        answer: true
    traps:
      B: 'You went for 2 over 3. That is 1 minus the two 1 over 6 terms only; the 1 over 5 for $a_4$ was left out. Take away all three: 30 minus 16, over 30, is 7 over 15.'
      C: 'You went for 1 over 3. That is the two 1 over 6 terms added together, P of $a_2$ or $a_3$. We want what is left for $a_1$ after all three are taken from 1.'
      D: 'You went for 3 over 10. Check the L.C.M. working: 1 over 6 is 5 over 30 and 1 over 5 is 6 over 30. 30 minus 16 is 14, so it is 14 over 30, which is 7 over 15.'

  50:
    moments:
      - section: 'The question'
        say: 'A die has four white faces and two black faces, and it is thrown twice. What is the probability that the top face is white both times?'
        write: 'White faces $= 4$, black faces $= 2$; thrown twice'
        doodle: {name: 'custom:1995_q50_a', id: die, caption: '4 white faces, 2 black; thrown twice'}
      - say: 'Solution. Let $W_1$ be the event "white on the first throw", and $W_2$ "white on the second throw".'
        write: 'Solution: let $W_1$ = 1st white, $W_2$ = 2nd white'
      - section: 'One throw'
        say: 'In one throw, there are 6 faces, and 4 of them are white. So P of white is 4 over 6.'
        write: '$P(W) = \dfrac{n(\text{white faces})}{n(\text{faces})} = \dfrac{4}{6}$'
        doodle_do:
          - {id: die, op: highlight, part: white, text: '4 of 6'}
      - say: 'Divide the top and the bottom by 2, so 4 over 6 is 2 over 3.'
        write: '$= \dfrac{2}{3}$'
      - say: 'Black is the complement of white, so it is 1 minus 2 over 3, which is 1 over 3.'
        write: '$P(B) = 1 - \dfrac{2}{3} = \dfrac{1}{3}$'
      - section: 'The tree diagram'
        say: 'The two throws are independent, because the first does not change the second. Draw the tree diagram. The second branches are the same as the first.'
        write: 'The two throws are independent'
        diagram:
          id: t
          kind: tree
          'on': 'tree diagram'
          levels: ['1st throw', '2nd throw']
          branches:
            - {label: White, p: '2/3', then: [{label: White, p: '2/3'}, {label: Black, p: '1/3'}]}
            - {label: Black, p: '1/3', then: [{label: White, p: '2/3'}, {label: Black, p: '1/3'}]}
      - say: 'The multiplication rule for independent events says multiply along the path. P of $W_1 W_2$ is P of $W_1$ times P of $W_2$.'
        write: '$P(W_1W_2) = P(W_1) \times P(W_2)$'
      - say: 'Substitute 2 over 3 for each throw.'
        write: '$= \dfrac{2}{3} \times \dfrac{2}{3}$'
        diagram_do:
          - {id: t, op: path, part: 'White/White'}
        doodle_do:
          - {id: die, op: pulse, part: twice}
      - say: 'Multiply the tops, and 2 times 2 is 4. Multiply the bottoms, and 3 times 3 is 9.'
        write: '$= \dfrac{2 \times 2}{3 \times 3} = \dfrac{4}{9}$'
      - section: 'Check'
        say: 'Check by counting faces. Two throws give 6 times 6, which is 36, pairs of faces. White both times is 4 times 4, which is 16 of them. 16 over 36 is 4 over 9.'
        write: 'Check: $\dfrac{4 \times 4}{6 \times 6} = \dfrac{16}{36} = \dfrac{4}{9}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the probability of white both times is 4 over 9, which is option C.'
        write: '$\therefore P(W_1W_2) = \dfrac{4}{9}$'
        answer: true
    traps:
      A: 'You went for 2 over 3. That is P of white on one throw. For both throws, multiply along the path: 2 over 3 times 2 over 3 is 4 over 9.'
      B: 'You went for 1 over 9. That is the Black, Black path: 1 over 3 times 1 over 3. We want white both times, 2 over 3 each.'
      D: 'You went for 1 over 36. That is one particular face twice, 1 over 6 times 1 over 6. Four faces are white, so each throw gives white with probability 2 over 3.'
