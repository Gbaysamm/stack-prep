  36:
    moments:
      - say: 'In triangle $QRS$, $QS$ is 12 m, angle $RQS$ is 30 degrees, and angle $QRS$ is 45 degrees. We want $RS$.'
        write: '$QS = 12,\quad \angle Q = 30^{\circ},\quad \angle R = 45^{\circ}$'
      - say: 'Let me draw triangle $QRS$.'
        show_sketch: true
        point:
          - {figure: sketch, kind: highlight, target: QS, text: '12 m'}
          - {figure: sketch, kind: arc, target: RQS, text: '30°'}
          - {figure: sketch, kind: arc, target: QRS, text: '45°'}
      - say: 'We know two angles and a side, and we want another side. That is a job for the sine rule, which pairs each side with the angle opposite it.'
        write: 'Sine rule: $\dfrac{a}{\sin A} = \dfrac{b}{\sin B}$'
      - say: '$RS$ is opposite the angle at $Q$, which is 30 degrees. $QS$ is opposite the angle at $R$, which is 45 degrees.'
        write: '$RS$ opposite $30^{\circ}$, $QS$ opposite $45^{\circ}$'
        point:
          - {figure: sketch, kind: underline, target: RS, text: 'faces 30°'}
          - {figure: sketch, kind: underline, target: QS, text: 'faces 45°'}
      - say: 'So the sine rule gives $RS$ over sine 30 equals 12 over sine 45.'
        write: '$\dfrac{RS}{\sin 30^{\circ}} = \dfrac{12}{\sin 45^{\circ}}$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
          - {line: 3, kind: arrow, text: 'pairs'}
      - say: 'Multiply both sides by sine 30 to get $RS$ by itself.'
        write: '$RS = \dfrac{12\sin 30^{\circ}}{\sin 45^{\circ}}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: 'sin30∘'}, at: 'sin30∘', text: 'times both sides'}
      - say: 'Sine 30 is a half, and sine 45 is root 2 over 2.'
        write: '$\sin 30^{\circ} = \dfrac{1}{2},\quad \sin 45^{\circ} = \dfrac{\sqrt{2}}{2}$'
      - say: 'Put those values in.'
        write: '$RS = \dfrac{12 \times \frac{1}{2}}{\frac{\sqrt{2}}{2}}$'
        point:
          - {line: 6, kind: arrow, text: 'sub in'}
      - say: 'On top, 12 times a half is 6.'
        write: '$= \dfrac{6}{\frac{\sqrt{2}}{2}}$'
      - say: 'Dividing by root 2 over 2 is the same as multiplying by 2 over root 2. 6 times 2 is 12.'
        write: '$= 6 \times \dfrac{2}{\sqrt{2}} = \dfrac{12}{\sqrt{2}}$'
      - say: 'Now rationalise: multiply the top and the bottom by root 2. Root 2 times root 2 is 2.'
        write: '$= \dfrac{12}{\sqrt{2}} \times \dfrac{\sqrt{2}}{\sqrt{2}} = \dfrac{12\sqrt{2}}{2}$'
      - say: '12 divided by 2 is 6, so we get 6 root 2.'
        write: '$= 6\sqrt{2}$'
      - say: 'Check: the bigger side faces the bigger angle. $RS$ faces 30 degrees and $QS$ faces 45, so $RS$ should be shorter than 12. 6 root 2 is about 8.5. Good.'
        write: 'Check: $6\sqrt{2} \approx 8.5 < 12$'
        point:
          - {figure: sketch, kind: label, target: 'RS', text: '≈ 8.5, shorter'}
      - say: 'So $RS$ is 6 root 2 metres, which is answer choice C.'
        write: '$RS = 6\sqrt{2}$ m'
        answer: true
        point:
          - {figure: sketch, kind: label, target: '?', text: '6√2 m'}
    traps:
      A: 'You went for 18 root 2 m. That is about 25 m, longer than 12, but $RS$ faces the smaller angle, so it must be shorter than 12. The sine rule gives 6 root 2.'
      B: 'You went for 12 root 2 m. That comes from pairing the sides with the wrong angles. $RS$ is opposite the 30 degree angle, so $RS$ equals 12 sine 30 over sine 45, which is 6 root 2.'
      D: 'You went for 3 root 2 m. Check the division: 12 times a half is 6, and 6 divided by root 2 over 2 is 12 over root 2, which is 6 root 2.'

  37:
    moments:
