# UTME 1995 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1995.yaml. Answers match that file.
format_version: 1
exam_year: 1995
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'Three-three-one-zero base five minus one-four-four-two base five. Both are in base five, so we subtract in base five itself, column by column, as WAEC expects.'
        write: 'Calculate $3310_{5} - 1442_{5}$'
      - say: 'Set them out in columns, units under units. One rule: in base five, a borrowed 1 is worth 5, not 10.'
        write: '$\begin{array}{rrrrr} & 3 & 3 & 1 & 0 \\ - & 1 & 4 & 4 & 2 \\ \hline & & & & \end{array}$'
      - section: 'Units'
        say: 'Units: 0 minus 2 cannot be done. Borrow 1 from the fives column. It is worth 5, so the units become 0 plus 5, which is 5.'
        write: 'Units: $0 - 2$, borrow 1 five: $0 + 5 = 5$'
      - say: '5 minus 2 is 3. Write 3.'
        write: '$5 - 2 = 3$'
      - section: 'Fives'
        say: 'Fives: the 1 lent 1 to the units, so it is now 0.'
        write: 'Fives: $1 - 1 = 0$ (it lent 1)'
      - say: '0 minus 4 cannot be done. Borrow 1 from the twenty-fives column: 0 plus 5 is 5, and 5 minus 4 is 1.'
        write: '$0 - 4$, borrow 1: $0 + 5 = 5$, $\ 5 - 4 = 1$'
      - section: 'Twenty-fives'
        say: 'Twenty-fives: the 3 lent 1, so it is now 2. 2 minus 4 cannot be done, so borrow again: 2 plus 5 is 7.'
        write: 'Twenty-fives: $3 - 1 = 2$; borrow 1: $2 + 5 = 7$'
      - say: '7 minus 4 is 3. Write 3.'
        write: '$7 - 4 = 3$'
      - section: 'One-hundred-and-twenty-fives'
        say: 'Last column: the 3 lent 1, so it is now 2. 2 minus 1 is 1.'
        write: 'Last: $3 - 1 = 2$, $\ 2 - 1 = 1$'
      - say: 'Here is the whole subtraction, with the new top digits written small above each column. The answer is one-three-one-three base five.'
        write: '$\begin{array}{rrrrr} & \scriptstyle 2 & \scriptstyle 7 & \scriptstyle 5 & \scriptstyle 5 \\ & 3 & 3 & 1 & 0 \\ - & 1 & 4 & 4 & 2 \\ \hline & 1 & 3 & 1 & 3 \end{array}$'
      - section: 'Check: add back in base 5'
        say: 'Check by adding the answer back to one-four-four-two, in base five. We should get three-three-one-zero.'
        write: '$\begin{array}{rrrrr} & 1 & 3 & 1 & 3 \\ + & 1 & 4 & 4 & 2 \\ \hline & & & & \end{array}$'
      - say: 'Units: 3 plus 2 is 5, which is one five and nought over. Write 0, carry 1.'
        write: '$3 + 2 = 5 = 1 \times 5 + 0$: write 0, carry 1'
      - say: 'Fives: 1 plus 4, plus 1, is 6. That is one five and 1 over: write 1, carry 1.'
        write: '$1 + 4 + 1 = 6 = 1 \times 5 + 1$: write 1, carry 1'
      - say: 'Twenty-fives: 3 plus 4, plus 1, is 8. That is one five and 3 over: write 3, carry 1.'
        write: '$3 + 4 + 1 = 8 = 1 \times 5 + 3$: write 3, carry 1'
      - say: 'Last: 1 plus 1, plus 1, is 3. We get three-three-one-zero base five, the number we started from.'
        write: '$1 + 1 + 1 = 3$: so $1313_{5} + 1442_{5} = 3310_{5}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore three-three-one-zero base five minus one-four-four-two base five is one-three-one-three base five, which is option A.'
        write: '$\therefore 3310_{5} - 1442_{5} = 1313_{5}$'
        answer: true
    traps:
      B: 'You went for two-one-one-three base five. Add it back to one-four-four-two and you get four-one-one-zero, not three-three-one-zero. Remember that each column that lends 1 goes down by 1.'
      C: 'You went for four-three-zero-two base five. That is bigger than three-three-one-zero itself, and taking a number away can never make it bigger. Borrow 1 five whenever the top digit is too small.'
      D: 'You went for one-one-zero-three base five. Add it back to one-four-four-two and you get three-one-zero-zero, not three-three-one-zero. Borrow in fives, column by column.'

  2:
    moments:
      - section: 'The question'
        say: 'Write 3.1415926 correct to 5 decimal places. One of the options rounds up when it should not. Let''s see which.'
        write: '$3.1415926$ to 5 d.p.'
      - section: 'Solution'
        say: 'Solution. For decimal places, we count from the decimal point. 5 decimal places means 5 digits after the point. Picture the digits as the carriages of a train.'
        write: 'Count 5 digits after the decimal point'
        doodle: {name: 'custom:1995_q02_a', id: train, caption: '3.1415926 as carriages', size: scene}
      - say: 'Count after the point: 1, 4, 1, 5, 9. That is five. Mark the cut after the 9.'
        write: 'Cut after 5 d.p.: $3.14159\,|\,26$'
        doodle_do:
          - {id: train, op: circle, part: keep, text: 'keep these 5'}
      - say: 'Now look at the next digit after the cut. It is 2.'
        write: 'Next digit $= 2$'
        point:
          - {line: 3, kind: highlight, at: '= 2', to: {doodle: train, part: d2}}
        doodle_do:
          - {id: train, op: highlight, part: d2, text: 'decides'}
      - say: 'The rule: if the next digit is 5 or more, add 1 to the last digit kept. If it is less than 5, leave the last digit as it is.'
        write: 'Rule: $5$ or more, add $1$; less than $5$, leave it'
      - say: '2 is less than 5, so we leave the 9 as it is.'
        write: '$2 < 5$: leave the $9$'
        point:
          - {line: 4, kind: box, text: 'the rule'}
      - say: 'Then drop every digit after the cut: the 2 and the 6 go. 3.1415926 is 3.14159, correct to 5 decimal places.'
        write: '$3.1415926 = 3.14159$ (5 d.p.)'
        point:
          - {line: 2, kind: strike, at: '26', text: 'dropped'}
        doodle_do:
          - {id: train, op: cross, part: d2}
          - {id: train, op: cross, part: d6}
      - section: 'Check'
        say: 'Check: count the digits after the point in the answer: 1, 4, 1, 5, 9. Five, as asked.'
        write: 'Check: $1,\ 4,\ 1,\ 5,\ 9$: five decimal places ✓'
      - say: 'Therefore 3.1415926 is 3.14159 to 5 decimal places: option B.'
        write: '$\therefore 3.1415926 = 3.14159$ (5 d.p.) (B)'
        answer: true
    traps:
      A: 'You went for 3.14160. That adds 1 to the 9, which is right only if the next digit is 5 or more. The next digit is 2, so the 9 stays.'
      C: 'You went for 0.31415. That moves the decimal point, which changes the size of the number. Correcting to decimal places never moves the point.'
      D: 'You went for 3.14200. That is 3 decimal places with zeros added. The question wants 5 real digits after the point: 3.14159.'

  3:
    moments:
      - section: 'The question'
        say: 'A notebook is really 15 cm long, but it was measured as 16.8 cm. What is the percentage error? Watch which length goes at the bottom: that is where most students slip.'
        write: 'Actual $= 15$ cm, measured $= 16.8$ cm'
        doodle: {name: 'custom:1995_q03_a', id: book, caption: 'really 15 cm, measured 16.8 cm'}
        point:
          - {line: 0, kind: highlight, at: 'Actual = 15', to: {doodle: book, part: 'true'}}
      - section: 'Solution'
        say: 'Solution. Percentage error is the error over the actual value, times 100 percent. We always divide by the actual value, the true 15 cm.'
        write: 'Percentage error $= \dfrac{\text{error}}{\text{actual value}} \times 100\%$'
        doodle_do:
          - {id: book, op: circle, part: 'true', text: 'actual value'}
      - say: 'The error is the gap between the measured value and the actual value: measured minus actual.'
        write: 'Error $= 16.8 - 15$'
      - say: '16.8 minus 15 is 1.8. The measurement was 1.8 cm too long: the little gap past the end of the notebook.'
        write: '$= 1.8$ cm'
        point:
          - {line: 3, kind: highlight, at: '1.8', to: {doodle: book, part: gap}}
        doodle_do:
          - {id: book, op: label, part: gap, text: '1.8 cm too long'}
      - section: 'Substitute'
        say: 'Now substitute into the formula: the error, 1.8, over the actual value, 15, times 100 percent.'
        write: 'Percentage error $= \dfrac{1.8}{15} \times 100\%$'
        point:
          - {line: 1, kind: box, text: 'the formula'}
          - {line: 4, kind: move, from: {line: 3, at: '= [[1.8]]'}, at: '[[1.8]]', text: 'error'}
      - say: '1.8 times 100 is 180, so we have 180 over 15.'
        write: '$= \dfrac{180}{15}\%$'
      - say: '15 times 12 is 180, so 180 over 15 is 12.'
        write: '$= 12\%$'
      - say: 'To 2 significant figures, 12 stays 12: its two significant figures are 1 and 2. The options print it as 12.00 percent.'
        write: '$= 12\%$ (2 s.f.)'
      - section: 'Check'
        say: 'Check: 12 percent of the actual 15 cm is 12 over 100 times 15, which is 1.8 cm, the error we found.'
        write: 'Check: $\dfrac{12}{100} \times 15 = 1.8$ ✓'
      - say: 'Therefore the percentage error is 12 percent: option A.'
        write: '$\therefore$ percentage error $= 12.00\%$ (A)'
        answer: true
    traps:
      B: 'You went for 11%. That is a slip in the division. The error over the actual value is 1.8 over 15, and 180 over 15 is exactly 12.'
      C: 'You went for 10.71%. That divides the error by the measured value, 16.8. Percentage error always divides by the actual value, 15.'
      D: 'You went for 0.12%. That is 1.8 over 15 without the times 100 percent. 0.12 times 100 is 12%.'
  4:
    moments:
      - section: 'The question'
        say: 'A worker earns ₦24,000 a year now, and his annual increment is 10% of his basic salary. What is his salary at the beginning of the third year? Count the increments carefully.'
        write: 'Basic salary = ₦24,000 per annum; increment $= 10\%$ of basic'
      - section: 'Solution'
        say: 'Solution. The key words are "of his basic salary". The increment is always worked on the ₦24,000, so the same amount is added every year. Picture his pay as a pile.'
        write: 'Increment $= 10\%$ of ₦24,000, the same each year'
        doodle: {name: 'custom:1995_q04_a', id: pay, caption: '10% of the basic, every year', size: scene}
      - say: '10 percent means 10 over 100. So the increment is 10 over 100, times 24,000.'
        write: 'Increment $= \dfrac{10}{100} \times 24{,}000$'
      - say: 'Cancel first: 100 into 24,000 is 240. Then 10 times 240 is 2,400. He gets ₦2,400 more each year.'
        write: '$= 10 \times 240 = 2{,}400$, so ₦2,400'
        doodle_do:
          - {id: pay, op: label, part: year1, text: '10% = ₦2,400'}
      - section: 'Year by year'
        say: 'At the beginning of the first year, his salary is the present one, ₦24,000.'
        write: 'Start of year 1: ₦24,000'
      - say: 'At the beginning of the second year, one increment has been added: 24,000 plus 2,400 is 26,400.'
        write: 'Start of year 2: $24{,}000 + 2{,}400 = 26{,}400$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '= [[2,400]], so'}, at: '+ [[2,400]]', text: 'increment'}
        doodle_do:
          - {id: pay, op: stage, stage: 'custom:1995_q04_a2'}
      - say: 'At the beginning of the third year, a second increment of the same ₦2,400 goes on: 26,400 plus 2,400 is 28,800.'
        write: 'Start of year 3: $26{,}400 + 2{,}400 = 28{,}800$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '= [[26,400]]'}, at: '[[26,400]] +', text: 'from here'}
          - {line: 6, kind: highlight, at: '28,800', to: {doodle: pay, part: year3}}
        doodle_do:
          - {id: pay, op: stage, stage: 'custom:1995_q04_a3'}
          - {id: pay, op: label, part: year3, text: '₦28,800'}
      - section: 'Check'
        say: 'Check: from the start of year 1 to the start of year 3 there are two increments, not three. 2 times 2,400 is 4,800, and 24,000 plus 4,800 is 28,800.'
        write: 'Check: $24{,}000 + 2 \times 2{,}400 = 28{,}800$ ✓'
      - say: 'Therefore his salary at the beginning of the third year is ₦28,800: option A.'
        write: '$\therefore$ salary at start of year 3 = ₦28,800 (A)'
        answer: true
    traps:
      B: 'You went for ₦29,040. That is 24,000 times 1.1 times 1.1, as if each increment were 10% of the new salary. The increment is 10% of the basic salary, so it stays ₦2,400.'
      C: 'You went for ₦31,200. That adds three increments of ₦2,400. From the start of year 1 to the start of year 3 there are only two.'
      D: 'You went for ₦31,944. That is 24,000 times 1.1 three times: three increments, each on the new salary. The increment is a fixed ₦2,400, and only two are added.'

  5:
    moments:
      - say: 'We want the product of 0.0014 and 0.011, written in standard form.'
        write: '$0.0014 \times 0.011$'
      - say: 'Standard form means a number from 1 up to 10, times a power of ten. Small decimals are easier to multiply in that form, so let''s convert each one first.'
        write: 'Standard form: $A \times 10^{n},\ 1 \le A < 10$'
      - say: 'For 0.0014, watch the decimal point hop three places to the right to reach 1.4. Moving right for a small number gives a negative power, so it is 1.4 times 10 to the minus 3.'
        write: '$0.0014 = 1.4 \times 10^{-3}$'
        doodle: {name: 'custom:1995_q05_a', id: hops, caption: 'the point hops to the right', size: scene}
      - say: 'For 0.011, the point hops two places to the right to reach 1.1. So it is 1.1 times 10 to the minus 2.'
        write: '$0.011 = 1.1 \times 10^{-2}$'
        doodle_do:
          - {id: hops, op: stage, stage: 'custom:1995_q05_a2'}
      - say: 'Now put those two forms into the product.'
        write: '$0.0014 \times 0.011 = (1.4 \times 10^{-3}) \times (1.1 \times 10^{-2})$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: '1.4 × 10−3'}, at: '(1.4 × 10−3)'}
          - {line: 4, kind: move, from: {line: 3, at: '1.1 × 10−2'}, at: '(1.1 × 10−2)'}
      - say: 'We can multiply the numbers together and the powers of ten together.'
        write: '$= (1.4 \times 1.1) \times (10^{-3} \times 10^{-2})$'
      - say: 'First the numbers. 1.4 times 1 is 1.4, and 1.4 times 0.1 is 0.14. 1.4 plus 0.14 is 1.54.'
        write: '$1.4 \times 1.1 = 1.4 + 0.14 = 1.54$'
      - say: 'The law of indices for multiplying: when we multiply powers of the same base, we add the indices.'
        write: '$a^{m} \times a^{n} = a^{m + n}$'
      - say: 'Now the powers. Look back at the hops: 3, and then 2 more. When we multiply powers of ten, we add the indices. Minus 3 plus minus 2 is minus 5.'
        write: '$10^{-3} \times 10^{-2} = 10^{-3 + (-2)} = 10^{-5}$'
        doodle_do:
          - {id: hops, op: circle, part: sf1}
          - {id: hops, op: circle, part: sf2}
          - {id: hops, op: label, part: sf2, text: '−3 + (−2) = −5'}
      - say: 'Now put the 1.54 and the 10 to the minus 5 back together.'
        write: '$0.0014 \times 0.011 = 1.54 \times 10^{-5}$'
        point:
          - {line: 9, kind: move, from: {line: 6, at: '1.54'}, at: '1.54', text: 'numbers'}
          - {line: 9, kind: move, from: {line: 8, at: '= 10−5'}, at: '10−5', text: 'powers'}
      - say: 'Does that size make sense? Both numbers are less than 1, so the product must be smaller than either. As a decimal it is 0.0000154, which fits.'
        write: 'Check: $1.54 \times 10^{-5} = 0.0000154$'
      - say: 'So the product is 1.54 times 10 to the minus 5, which is answer choice D.'
        write: '$= 1.54 \times 10^{-5}$'
        answer: true
    traps:
      A: 'You went for $1.54 \times 10^{2}$. A positive power makes the number bigger than 1, but multiplying two small decimals gives a very small answer. The powers are negative: minus 3 plus minus 2 is minus 5.'
      B: 'You went for $1.54 \times 10^{-3}$. That uses only one of the powers. When you multiply, you add both indices: minus 3 plus minus 2 is minus 5.'
      C: 'You went for $1.54 \times 10^{4}$. The powers of ten here are negative, because both numbers are less than 1. Adding minus 3 and minus 2 gives minus 5.'

  6:
    moments:
      - say: 'We want to evaluate 81 to the power 3 over 4, minus 27 to the power 1 over 3, all over 3 times 2 cubed.'
        write: '$\dfrac{81^{3/4} - 27^{1/3}}{3 \times 2^{3}}$'
      - say: 'Remember what a fractional index means. The bottom number is the root, and the top number is the power.'
        write: '$a^{m/n} = \left(\sqrt[n]{a}\right)^{m}$'
      - say: 'Let''s start with 81 to the 3 over 4. The 4 on the bottom means the fourth root, and the 3 on top means cube it.'
        write: '$81^{3/4} = \left(\sqrt[4]{81}\right)^{3}$'
      - say: 'What is the fourth root of 81? Picture 81 as a tower of blocks multiplied together: 3 times 3 is 9, times 3 is 27, times 3 is 81. Four blocks of 3, so the fourth root of 81 is 3.'
        write: '$\sqrt[4]{81} = 3$ since $3 \times 3 \times 3 \times 3 = 81$'
        doodle: {name: 'custom:1995_q06_a', id: tower, caption: '81 = 3 × 3 × 3 × 3'}
        doodle_do:
          - {id: tower, op: circle, part: top, text: 'one block = 3'}
      - say: 'Now cube that 3: take three of those blocks. 3 cubed is 27.'
        write: '$81^{3/4} = 3^{3} = 27$'
        doodle_do:
          - {id: tower, op: stage, stage: 'custom:1995_q06_a2'}
      - say: 'Next, 27 to the power 1 over 3. Look at the new tower: three blocks of 3 make 27, so the cube root is 3.'
        write: '$27^{1/3} = \sqrt[3]{27} = 3$'
        doodle_do:
          - {id: tower, op: pulse, part: cube}
      - say: 'So the top of the fraction is the 27 we found, minus the 3 we found. That is 24.'
        write: 'Top: $27 - 3 = 24$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '27'}, at: '27', text: 'found here'}
      - say: 'Now the bottom. 2 cubed is 2 times 2 times 2, which is 8.'
        write: '$2^{3} = 2 \times 2 \times 2 = 8$'
      - say: 'And 3 times that 8 is 24.'
        write: 'Bottom: $3 \times 8 = 24$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '= 8'}, at: '8', text: 'from here'}
      - say: 'Now put the top and the bottom back into the fraction.'
        write: '$\dfrac{81^{3/4} - 27^{1/3}}{3 \times 2^{3}} = \dfrac{24}{24}$'
        point:
          - {line: 9, kind: move, from: {line: 6, at: '= 24'}, at: '24[[24]]', text: 'top'}
          - {line: 9, kind: move, from: {line: 8, at: '= 24'}, at: '[[24]]24', text: 'bottom'}
      - say: '24 divided by 24 is 1. So the value is 1, which is answer choice B.'
        write: '$= 1$'
        answer: true
    traps:
      A: 'You went for 27. That is only the first term, 81 to the power 3 over 4. You still need to subtract 3 and then divide by 24.'
      C: 'You went for one third. Check the top and bottom again: the top is 27 minus 3, which is 24, and the bottom is 3 times 8, which is also 24.'
      D: 'You went for 1 over 8. That comes from dividing by 3 times 8 without first working out the top properly. The top is 24, and 24 over 24 is 1.'
  7:
    moments:
      - say: 'We want the value of 16 to the power 3 over 2, plus log base 10 of 0.0001, plus log base 2 of 32.'
        write: '$(16)^{3/2} + \log_{10}0.0001 + \log_{2}32$'
      - say: 'There are three separate pieces here. Let''s work each one out on its own, then add them.'
        write: 'Three pieces: one index, two logs'
      - say: 'The rule for a fractional index: the bottom number is the root, and the top number is the power.'
        write: '$a^{m/n} = \left(\sqrt[n]{a}\right)^{m}$'
      - say: 'First piece. In the power 3 over 2, the 2 on the bottom means a square root, and the 3 on top means cube it. Picture 16 as a square of tiles: its square root is the side.'
        write: '$16^{3/2} = \left(\sqrt{16}\right)^{3}$'
        doodle: {name: 'custom:1995_q07_a', id: tiles, caption: '16 tiles, a 4 by 4 square'}
      - say: 'The square of 16 tiles is 4 tiles along each side, so the square root of 16 is 4, and this becomes 4 cubed.'
        write: '$= 4^{3}$'
        doodle_do:
          - {id: tiles, op: highlight, part: side, text: '4'}
      - say: '4 times 4 is 16, and 16 times 4 is 64.'
        write: '$= 64$'
      - say: 'Second piece. Log base 10 of 0.0001 asks: what power of 10 gives 0.0001? 0.0001 is 1 over 10,000, and 10,000 is 10 to the 4, so this is 10 to the minus 4.'
        write: '$0.0001 = \dfrac{1}{10{,}000} = 10^{-4}$'
      - say: 'A log asks what power the base must be raised to. So log base $a$ of $a$ to the power $n$ is just $n$.'
        write: '$\log_{a}a^{n} = n$'
      - say: 'So the log is minus 4. It is negative because 0.0001 is less than 1.'
        write: '$\log_{10}0.0001 = \log_{10}10^{-4} = -4$'
      - say: 'Third piece. Log base 2 of 32 asks: how many 2s must we multiply to make 32? Line them up and count: 2, 4, 8, 16, 32. That is five 2s multiplied together.'
        write: '$2^{5} = 2 \times 2 \times 2 \times 2 \times 2 = 32$'
        doodle: {name: 'custom:1995_q07_b', id: twos, caption: '2 × 2 × 2 × 2 × 2 = 32'}
      - say: 'Count the 2s in the row: five. So log base 2 of 32 is 5.'
        write: '$\log_{2}32 = 5$'
        point:
          - {line: 10, kind: highlight, at: '= 5', to: {doodle: twos, part: count}}
        doodle_do:
          - {id: twos, op: circle, part: count, text: 'five 2s'}
      - say: 'Now put the three results back into the sum: 64, plus minus 4, plus 5.'
        write: '$(16)^{3/2} + \log_{10}0.0001 + \log_{2}32 = 64 + (-4) + 5$'
        point:
          - {line: 11, kind: move, from: {line: 5, at: '64'}, at: '64', text: 'first piece'}
          - {line: 11, kind: move, from: {line: 8, at: '= −4'}, at: '(−4)', text: 'second piece'}
          - {line: 11, kind: move, from: {line: 10, at: '= 5'}, at: ') + 5', text: 'third piece'}
      - say: '64 minus 4 is 60.'
        write: '$= 60 + 5$'
      - say: 'And 60 plus 5 is 65.'
        write: '$= 65$'
      - say: 'So the value is 65, written 65.00, which is answer choice D.'
        write: '$= 65.00$'
        answer: true
    traps:
      A: 'You went for 0.065. The digits 6 and 5 are right, but the decimal point is in the wrong place. The pieces are 64, minus 4 and 5, which add to 65.'
      B: 'You went for 0.650. The value is 65, not 0.65. 16 to the power 3 over 2 alone is already 64.'
      C: 'You went for 6.500. The first piece alone is 64, so the total cannot be as small as 6.5. Adding 64, minus 4 and 5 gives 65.'

  8:
    moments:
      - say: 'We want to simplify root 12 minus root 3, over root 12 plus root 3.'
        write: '$\dfrac{\sqrt{12} - \sqrt{3}}{\sqrt{12} + \sqrt{3}}$'
      - say: 'The rule for surds: the square root of a product is the square root of each part, multiplied.'
        write: '$\sqrt{ab} = \sqrt{a} \times \sqrt{b}$'
      - say: 'Before doing anything fancy, let''s see if the surds simplify. 12 is 4 times 3, and 4 is a perfect square. Picture a square of area 12 made of four small squares of area 3.'
        write: '$\sqrt{12} = \sqrt{4 \times 3} = \sqrt{4} \times \sqrt{3}$'
        doodle: {name: 'custom:1995_q08_a', id: tiles, caption: '12 = four squares of 3'}
      - say: 'Each small square has side root 3, and two of them make the big side. The square root of 4 is 2, so root 12 is 2 root 3.'
        write: '$= 2\sqrt{3}$'
        point:
          - {line: 3, kind: highlight, at: '23', to: {doodle: tiles, part: total}}
        doodle_do:
          - {id: tiles, op: stage, stage: 'custom:1995_q08_a2'}
      - say: 'Now replace root 12 with 2 root 3, on the top and on the bottom.'
        write: 'Using $\sqrt{12} = 2\sqrt{3}$: $\dfrac{2\sqrt{3} - \sqrt{3}}{2\sqrt{3} + \sqrt{3}}$'
        point:
          - {line: 3, kind: arrow, text: 'sub in'}
      - say: 'The top first. 2 root 3 minus 1 root 3 leaves 1 root 3, just like 2 of those small sides minus 1 side leaves 1 side.'
        write: 'Top: $2\sqrt{3} - \sqrt{3} = \sqrt{3}$'
        doodle_do:
          - {id: tiles, op: pulse, part: side}
      - say: 'And the bottom. 2 root 3 plus 1 root 3 is 3 root 3.'
        write: 'Bottom: $2\sqrt{3} + \sqrt{3} = 3\sqrt{3}$'
      - say: 'So the whole fraction becomes root 3 over 3 root 3.'
        write: '$\dfrac{\sqrt{12} - \sqrt{3}}{\sqrt{12} + \sqrt{3}} = \dfrac{\sqrt{3}}{3\sqrt{3}}$'
      - say: 'Root 3 is a factor on the top and on the bottom, so it cancels.'
        write: '$= \dfrac{\cancel{\sqrt{3}}}{3\cancel{\sqrt{3}}}$'
      - say: 'Let''s check with decimals. Root 12 is about 3.46 and root 3 is about 1.73. The top is 3.46 minus 1.73, which is 1.73. The bottom is 3.46 plus 1.73, which is 5.19. 1.73 over 5.19 is about 0.33.'
        write: 'Check: $\dfrac{3.46 - 1.73}{3.46 + 1.73} = \dfrac{1.73}{5.19} \approx 0.33$'
      - say: 'So once root 3 cancels, we are left with 1 over 3, which is answer choice A.'
        write: '$\dfrac{\sqrt{12} - \sqrt{3}}{\sqrt{12} + \sqrt{3}} = \dfrac{1}{3}$'
        answer: true
    traps:
      B: 'You went for 0. The top is not zero: root 12 is 2 root 3, and 2 root 3 minus root 3 leaves root 3.'
      C: 'You went for 9 over 15. That treats root 12 and root 3 as plain 12 and 3. Simplify root 12 to 2 root 3 first, and the fraction becomes 1 over 3.'
      D: 'You went for 1. That would need the top and bottom to be equal, but the top is root 3 and the bottom is 3 root 3.'

  9:
    moments:
      - say: 'Four boys are in both the school''s first eleven cricket team and its first fourteen rugby team. We want how many boys play for at least one of the two teams.'
        write: 'In both teams: $4$ boys'
      - say: 'Let me draw a Venn diagram, so we can see where everything belongs.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '4', text: 'in both'}
      - say: 'The team sizes are hiding in the names. Picture the bat and the rugby ball: a first eleven has 11 players, and a first fourteen has 14 players.'
        write: '$n(C) = 11,\quad n(R) = 14$'
        point:
          - {figure: sketch, kind: circle, target: '11'}
          - {figure: sketch, kind: circle, target: '14'}
        doodle: {name: 'custom:1995_q09_a', id: teams, caption: 'cricket 11, rugby 14, 4 in both'}
      - say: 'And the 4 boys in both teams, who play with the bat and the rugby ball, are the overlap, where the two sets meet.'
        write: '$n(C \cap R) = 4$'
        doodle_do:
          - {id: teams, op: circle, part: both}
      - say: '"At least one of the two teams" means cricket, or rugby, or both. That is the union of the two sets.'
        write: 'At least one team: $n(C \cup R)$'
        point:
          - {figure: sketch, kind: underline, target: 'C ∪ R = ?', text: 'the union'}
      - say: 'If we just add 11 and 14, the 4 boys in both teams get counted twice, once in each team. So we subtract the overlap once.'
        write: '$n(C \cup R) = n(C) + n(R) - n(C \cap R)$'
      - say: 'Put in the numbers from the names, and the overlap: 11 plus 14 minus 4.'
        write: '$= 11 + 14 - 4$'
        point:
          - {line: 6, kind: move, from: {line: 2, at: '11'}, at: '11'}
          - {line: 6, kind: move, from: {line: 2, at: '14'}, at: '14'}
          - {line: 6, kind: move, from: {line: 3, at: '= 4'}, at: '− 4', text: 'the overlap'}
      - say: '11 plus 14 is 25.'
        write: '$= 25 - 4$'
      - say: 'And 25 minus 4 is 21.'
        write: '$= 21$'
      - say: 'Let''s check it another way, team by team. Cricket only is 11 minus 4, which is 7. Rugby only is 14 minus 4, which is 10. 7 plus 10, plus the 4 in both, is 21.'
        write: 'Check: $(11 - 4) + (14 - 4) + 4 = 7 + 10 + 4 = 21$'
        doodle_do:
          - {id: teams, op: label, part: cricket, text: '7 cricket only'}
          - {id: teams, op: label, part: rugby, text: '10 rugby only'}
      - say: 'So 21 boys play for at least one of the two teams, which is answer choice B.'
        write: 'At least one team: $21$ boys'
        answer: true
    traps:
      A: 'You went for 25. That adds the two teams but counts the 4 shared boys twice. Subtract the overlap once: 25 minus 4 is 21.'
      C: 'You went for 16. Check the team sizes: a first eleven has 11 and a first fourteen has 14. 11 plus 14 minus 4 is 21.'
      D: 'You went for 3. That is far too small: the rugby team alone has 14 boys. Add 11 and 14, then take away the 4 boys in both, to get 21.'

  10:
    moments:
      - say: '$S$ is the set of all $x$ where $x$ squared is 9 and $x$ is greater than 4. We want to know what $S$ is.'
        write: '$S = \{x : x^{2} = 9,\; x > 4\}$'
      - say: 'In set-builder notation, $S$ holds every $x$ that passes both conditions after the colon, at the same time.'
        write: 'Condition 1: $x^{2} = 9$; condition 2: $x > 4$'
      - say: 'First condition: $x$ squared equals 9. Which numbers square to 9? 3 times 3 is 9, and minus 3 times minus 3 is also 9.'
        write: '$3^{2} = 9,\quad (-3)^{2} = 9$'
      - say: 'So the first condition allows only 3 or minus 3. Picture $S$ as a bag: these two are waiting outside, and each must pass the second test to get in.'
        write: '$x^{2} = 9 \Rightarrow x = 3 \text{ or } x = -3$'
        doodle: {name: 'custom:1995_q10_a', id: bag, caption: 'who gets into the bag S?'}
      - say: 'Now test each one against the second condition, $x$ greater than 4. Is 3 greater than 4? No, so 3 stays out of the bag.'
        write: 'Test $x = 3$: is $3 > 4$? No'
        point:
          - {line: 1, kind: underline, at: 'x > 4', text: 'condition 2'}
        doodle_do:
          - {id: bag, op: cross, part: c3}
      - say: 'Is minus 3 greater than 4? No, it is even smaller. Minus 3 stays out too.'
        write: 'Test $x = -3$: is $-3 > 4$? No'
        doodle_do:
          - {id: bag, op: cross, part: cm3}
      - say: 'So neither number passes both tests. The bag $S$ has no elements at all.'
        write: '$n(S) = 0$'
        doodle_do:
          - {id: bag, op: label, part: bag, text: 'nothing inside'}
      - say: 'A set with no elements is called the empty set. We write it as a circle with a slash through it.'
        write: 'Empty set: $\varnothing$'
      - say: 'Be careful here. The number 0 is not a set at all, and the set containing 0 has one element in it. The empty set has nothing in it.'
        write: '$\varnothing \neq \{0\},\quad \varnothing \neq 0$'
      - say: 'So $S$ is the empty set, which is answer choice C.'
        write: '$S = \varnothing$'
        answer: true
    traps:
      A: 'You went for 0. That is a number, not a set. A set with nothing in it is the empty set.'
      B: 'You went for the set containing 0. That set has one element, the number zero. But zero does not satisfy $x$ squared equals 9, so $S$ has no elements.'
      D: 'You went for the set containing the empty set. That set has one element in it. $S$ has none, so it is just the empty set itself.'
  11:
    moments:
      - section: 'The question'
        say: 'Two factors, two unknowns. Each factor gives one equation in $p$ and $q$. Watch the signs when minus 1 goes in: that is where marks are lost.'
        write: 'Factors $(x - 1)$ and $(x + 1)$; find $p$ and $q$'
      - section: 'Solution'
        say: 'Solution. Let $f$ of $x$ be the expression.'
        write: 'Let $f(x) = x^{3} + px^{2} + qx + 6$'
      - say: 'Recall the factor theorem: $x$ minus $a$ is a factor if $f$ of $a$ is zero. Picture $f$ as a machine: feed in $a$, and out comes zero.'
        write: '$(x - a)$ is a factor $\Leftrightarrow f(a) = 0$'
        doodle: {name: 'custom:1995_q11_a', id: mach, caption: 'a factor makes the machine give 0', 'on': 'Picture'}
      - section: 'First factor'
        say: 'Let $x$ minus 1 equal zero. Then $x$ is 1.'
        write: 'Let $x - 1 = 0$, $\therefore x = 1$'
        doodle_do:
          - {id: mach, op: highlight, part: in1}
      - say: 'Substitute 1 for every $x$, each value in brackets. The machine must give zero.'
        write: '$f(1) = (1)^{3} + p(1)^{2} + q(1) + 6 = 0$'
        doodle_do:
          - {id: mach, op: arrow, part: in1, to_part: out, 'on': 'machine'}
      - say: '1 cubed is 1, and 1 squared is 1.'
        write: '$1 + p + q + 6 = 0$'
      - say: '1 plus 6 is 7. Subtract 7 from both sides. Label this equation 1.'
        write: '$p + q = -7 \quad \ldots\ldots (1)$'
      - section: 'Second factor'
        say: 'Let $x$ plus 1 equal zero. Then $x$ is minus 1.'
        write: 'Let $x + 1 = 0$, $\therefore x = -1$'
        doodle_do:
          - {id: mach, op: highlight, part: in2}
      - say: 'Substitute minus 1 for every $x$, each value in brackets. Out must come zero again.'
        write: '$f(-1) = (-1)^{3} + p(-1)^{2} + q(-1) + 6 = 0$'
        doodle_do:
          - {id: mach, op: arrow, part: in2, to_part: out, 'on': 'zero'}
      - say: 'Careful with the signs. Minus 1 cubed is minus 1, but minus 1 squared is plus 1. And $q$ times minus 1 is minus $q$.'
        write: '$-1 + p - q + 6 = 0$'
      - say: 'Minus 1 plus 6 is 5. Subtract 5 from both sides. Label this equation 2.'
        write: '$p - q = -5 \quad \ldots\ldots (2)$'
      - section: 'Solve (1) and (2)'
        say: 'The $q$ terms have opposite signs, so add the equations. $q$ plus minus $q$ is zero. Minus 7 plus minus 5 is minus 12.'
        write: '(1) + (2): $\ 2p = -12$'
      - say: 'Divide both sides by 2. Minus 12 over 2 is minus 6.'
        write: '$p = -6$'
      - say: 'Substitute $p = -6$ in equation 1.'
        write: 'Sub. $p = -6$ in (1): $\ -6 + q = -7$'
      - say: 'Add 6 to both sides. Minus 7 plus 6 is minus 1.'
        write: '$q = -7 + 6 = -1$'
      - section: 'Check'
        say: 'Check $x = -1$ with $p = -6$ and $q = -1$: minus 1, minus 6, plus 1, plus 6. That is zero, so the machine gives zero.'
        write: 'Check: $f(-1) = -1 - 6 + 1 + 6 = 0$'
        doodle_do:
          - {id: mach, op: circle, part: out, 'on': 'machine'}
      - say: 'Therefore $p$ is minus 6 and $q$ is minus 1, which is answer choice A.'
        write: '$\therefore p = -6,\ q = -1$'
        answer: true
    traps:
      B: 'You went for 6 and 1. Those are the right sizes with the wrong signs. From $p + q = -7$ and $p - q = -5$, both come out negative.'
      C: 'You went for minus 1 and 6. Try $x = 1$: 1 minus 1 plus 6 plus 6 is 12, not zero. Adding equations (1) and (2) gives $2p = -12$, so $p = -6$.'
      D: 'You went for 6 and minus 6. Those give $p + q = 0$, but the factor $x - 1$ needs $p + q = -7$. Solving the pair gives $p = -6$ and $q = -1$.'

  12:
    moments:
      - section: 'The question'
        say: 'A remainder of 6 when divided by $x + 1$. No long division is needed: the remainder theorem gives the remainder in one substitution.'
        write: '$2x^{2} - px + p$ divided by $x + 1$ leaves 6'
      - section: 'Solution'
        say: 'Solution. Let $f$ of $x$ be the expression.'
        write: 'Let $f(x) = 2x^{2} - px + p$'
      - say: 'Recall the remainder theorem: when $f$ of $x$ is divided by $x$ minus $a$, the remainder is $f$ of $a$. Picture a machine: feed in $a$, out comes the remainder.'
        write: 'Remainder of $f(x) \div (x - a)$ is $f(a)$'
        doodle: {name: 'custom:1995_q12_a', id: mach, caption: 'feed in −1, out comes 6', 'on': 'Picture'}
      - say: 'Let the divisor, $x$ plus 1, equal zero. Then $x$ is minus 1.'
        write: 'Let $x + 1 = 0$, $\therefore x = -1$'
        doodle_do:
          - {id: mach, op: highlight, part: in1}
      - section: 'Find the remainder'
        say: 'So the remainder is $f$ of minus 1. Substitute minus 1 for every $x$, each value in brackets.'
        write: 'Remainder $= f(-1) = 2(-1)^{2} - p(-1) + p$'
      - say: 'Minus 1 squared is plus 1. And minus $p$ times minus 1: a negative times a negative is positive, so plus $p$.'
        write: '$= 2(1) + p + p$'
      - say: '2 times 1 is 2, and $p$ plus $p$ is $2p$.'
        write: '$= 2 + 2p$'
      - section: 'Solve for p'
        say: 'The question says the remainder is 6: that is what comes out of the machine. So 2 plus $2p$ equals 6.'
        write: '$2 + 2p = 6$'
        doodle_do:
          - {id: mach, op: circle, part: out, text: 'remainder 6', 'on': 'machine'}
      - say: 'Subtract 2 from both sides. 6 minus 2 is 4.'
        write: '$2p = 6 - 2 = 4$'
      - say: 'Divide both sides by 2. 4 over 2 is 2, which is positive, as the question asks.'
        write: '$p = \dfrac{4}{2} = 2$'
      - section: 'Check'
        say: 'Check with $p = 2$. $f$ of minus 1 is 2 times 1, minus 2 times minus 1, plus 2. That is 2 plus 2 plus 2, which is 6.'
        write: 'Check: $f(-1) = 2(1) - 2(-1) + 2 = 6$'
      - say: 'Therefore $p$ is 2, which is answer choice B.'
        write: '$\therefore p = 2$'
        answer: true
    traps:
      A: 'You went for 1. Then the remainder would be 2 plus 2 times 1, which is 4, not 6. Solving 2 plus $2p$ equals 6 gives $p = 2$.'
      C: 'You went for 3. Then the remainder would be 2 plus 6, which is 8, not 6. Both $p$ terms come out positive, so it is 2 plus $2p$ equals 6, and $p = 2$.'
      D: 'You went for 4. That is the value of $2p$, not $p$. Divide both sides by 2 at the last step: $p = 2$.'

  13:
    moments:
      - section: 'The question'
        say: '$T$ is wrapped in layers: $2r$ outside, a square root, a plus $K$, and $Q\pi$. Undo them one per line, outside first, and name each step.'
        write: 'Make $T$ the subject: $\ s = 2r\sqrt{Q\pi T + K}$'
        doodle: {name: 'custom:1995_q13_a', id: layers, caption: 'T wrapped in layers'}
      - section: 'Solution'
        say: 'Solution. First, divide both sides by $2r$, the factor outside the root.'
        write: 'Divide both sides by $2r$: $\ \dfrac{s}{2r} = \sqrt{Q\pi T + K}$'
      - say: 'Square both sides to remove the root. $2r$ squared is $4r$ squared. Square the whole side, not one piece of it.'
        write: 'Square both sides: $\ \dfrac{s^{2}}{4r^{2}} = Q\pi T + K$'
        doodle_do:
          - {id: layers, op: cross, part: root}
      - say: 'Subtract $K$ from both sides, so that the $T$ term stands alone on the right.'
        write: 'Subtract $K$: $\ \dfrac{s^{2}}{4r^{2}} - K = Q\pi T$'
        doodle_do:
          - {id: layers, op: cross, part: k}
      - say: 'Divide both sides by $Q\pi$, the last layer. Divide every term on the left: the $K$ as well as the first term.'
        write: 'Divide by $Q\pi$: $\ T = \dfrac{s^{2}}{4r^{2}Q\pi} - \dfrac{K}{Q\pi}$'
        doodle_do:
          - {id: layers, op: cross, part: qpi}
          - {id: layers, op: circle, part: core, text: 'T on its own'}
      - say: 'Rearrange the letters in each denominator to match the options: $4\pi r^{2}Q$, and $\pi Q$. The order of a product does not change it.'
        write: '$T = \dfrac{s^{2}}{4\pi r^{2}Q} - \dfrac{K}{\pi Q}$'
      - section: 'Check'
        say: 'Check by working back. $Q\pi$ times $T$ is $s$ squared over $4r$ squared, minus $K$. Add $K$, and the $K$ terms cancel.'
        write: 'Check: $Q\pi T + K = \dfrac{s^{2}}{4r^{2}} - K + K = \dfrac{s^{2}}{4r^{2}}$'
      - say: 'The square root of that is $s$ over $2r$, and $2r$ times $s$ over $2r$ is $s$. We are back to the start.'
        write: '$2r\sqrt{\dfrac{s^{2}}{4r^{2}}} = 2r \times \dfrac{s}{2r} = s$'
      - say: 'Therefore $T$ equals $s$ squared over $4\pi r^{2}Q$, minus $K$ over $\pi Q$, which is answer choice B.'
        write: '$\therefore T = \dfrac{s^{2}}{4\pi r^{2}Q} - \dfrac{K}{\pi Q}$'
        answer: true
    traps:
      A: 'You went for the option with a 2 and $K$ over $Q$. When you square $2r$ you get $4r^{2}$, not $2r^{2}$. And the last division is by $Q\pi$, so $K$ becomes $K$ over $\pi Q$.'
      C: 'You went for the option with a 2 and a plain $K$. Two slips: $2r$ squared is $4r^{2}$, and when you divide by $Q\pi$ you must divide the $K$ as well.'
      D: 'You went for the option ending in minus $K$. The first term is right, but dividing by $Q\pi$ divides every term, so the $K$ becomes $K$ over $\pi Q$.'
  14:
    moments:
      - section: 'The question'
        say: 'Where does this U-shaped curve cut the $x$-axis? Many students find the right two numbers here, then lose the signs. Let''s set it out the way you write it in the exam.'
        write: '$f(x) = x^{2} - 5x + 6$'
        show_sketch: true
        point:
          - {figure: sketch, kind: underline, target: 'y = x² − 5x + 6'}
      - section: 'Solution'
        say: 'Solution. Every point on the $x$-axis has height zero. So the curve crosses the axis where $f(x)$ equals zero.'
        write: 'On the $x$-axis, $y = 0$:'
        'on': 'height zero'
        point:
          - {figure: sketch, kind: circle, target: 'x', text: 'x-axis: y = 0', 'on': 'height zero'}
      - say: 'So we set the expression equal to zero. That gives a quadratic equation to solve.'
        write: '$x^{2} - 5x + 6 = 0$'
      - section: 'Factorise: product and sum'
        say: 'We factorise by product and sum. Here a is 1, b is minus 5 and c is 6. The product is a times c, 1 times 6, which is 6. The sum is b, minus 5.'
        write: 'Product $= ac = 6$, Sum $= b = -5$'
      - say: 'Now find two numbers that multiply to 6 and add up to minus 5. Minus 2 times minus 3 is 6, and minus 2 plus minus 3 is minus 5.'
        write: 'Factors: $-2,\ -3$'
      - say: 'Use the two numbers to split the middle term. Minus $5x$ becomes minus $2x$ minus $3x$.'
        write: '$x^{2} - 2x - 3x + 6 = 0$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '[[−2]], −3'}, at: '−2x', text: 'split'}
          - {line: 5, kind: move, from: {line: 4, at: '−2, [[−3]]'}, at: '−3x'}
      - say: 'Group in pairs. From the first pair take out $x$, leaving $x - 2$. From the second pair take out minus 3, leaving $x - 2$ again.'
        write: '$x(x - 2) - 3(x - 2) = 0$'
      - say: 'The two brackets are the same, so the grouping is right. Take out the common bracket, $x - 2$. What is left over is $x - 3$.'
        write: '$(x - 2)(x - 3) = 0$'
        point:
          - {line: 7, kind: underline, at: '(x − 2)', text: 'common bracket'}
      - say: 'Two brackets multiply to give zero. That can only happen if one of them is zero.'
        write: 'Either $x - 2 = 0$ or $x - 3 = 0$'
      - say: 'Add 2 to both sides of the first, and add 3 to both sides of the second. Watch the curve: it cuts the axis at exactly these two places.'
        write: '$\therefore x = 2$ or $x = 3$'
        point:
          - {figure: sketch, kind: label, target: {x: 174, y: 190}, text: 'x = 2', 'on': 'Watch'}
          - {figure: sketch, kind: label, target: {x: 216, y: 190}, text: 'x = 3', 'on': 'Watch'}
      - section: 'Check'
        say: 'Check $x = 2$. 2 squared is 4, 5 times 2 is 10, and 4 minus 10 plus 6 is zero.'
        write: 'Check: $f(2) = 4 - 10 + 6 = 0$'
      - say: 'Check $x = 3$. 3 squared is 9, 5 times 3 is 15, and 9 minus 15 plus 6 is zero. Both roots work.'
        write: '$f(3) = 9 - 15 + 6 = 0$'
      - say: 'A point on the $x$-axis has $y$ equal to zero. Therefore the curve crosses at 2, 0 and at 3, 0, which is answer choice D.'
        write: '$\therefore$ the points are $(2,\ 0)$ and $(3,\ 0)$'
        answer: true
    traps:
      A: 'You went for minus 6 and minus 1. Those are the roots of $x^2 + 7x + 6$, where the product is 6 but the sum is plus 7. Our sum is minus 5, so the factors are minus 2 and minus 3, and the roots are 2 and 3.'
      B: 'You went for minus 3 and minus 2. You found the right factors, minus 2 and minus 3, but kept their signs. From $x - 2 = 0$, $x$ is plus 2, and from $x - 3 = 0$, $x$ is plus 3.'
      C: 'You went for minus 6 and 1. Those are the roots of $x^2 + 5x - 6$, where the product is minus 6. Our product is plus 6. Test $x = 1$: 1 minus 5 plus 6 is 2, not zero.'

  15:
    moments:
      - section: 'The question'
        say: 'Four terms, and no factor common to all four. That is the signal for grouping. The skill is choosing the right pairs and watching the signs.'
        write: 'Factorise $abx^{2} + 6y - 3ax - 2byx$ completely'
      - section: 'Solution'
        say: 'Solution. We factorise by grouping. First rearrange: $2byx$ is the same as $2bxy$, so put the two terms with $b$ first, each keeping its own sign.'
        write: 'Rearrange: $\ abx^{2} - 2bxy - 3ax + 6y$'
      - say: 'Bracket them in pairs. A minus outside a bracket changes both signs inside, so minus $3ax$ plus $6y$ becomes minus, bracket, $3ax - 6y$.'
        write: '$= (abx^{2} - 2bxy) - (3ax - 6y)$'
      - section: 'Common factors'
        say: 'From the first pair take out $bx$, leaving $ax - 2y$. From the second pair take out 3: $3ax$ over 3 is $ax$, and $6y$ over 3 is $2y$. The minus stays in front.'
        write: '$= bx(ax - 2y) - 3(ax - 2y)$'
        doodle: {name: 'custom:1995_q15_a', id: parcels, caption: 'the same bracket twice'}
      - say: 'The two brackets are the same, so the grouping is right. Take out the common bracket, $ax - 2y$. What is left over is $bx$ minus 3.'
        write: '$= (ax - 2y)(bx - 3)$'
        point:
          - {line: 4, kind: underline, at: '(ax − 2y)', text: 'common bracket'}
        doodle_do:
          - {id: parcels, op: stage, stage: 'custom:1995_q15_a2'}
          - {id: parcels, op: circle, part: parcel2, text: 'same bracket'}
      - section: 'Check'
        say: 'Check by expanding. $ax$ times $bx$ is $abx^{2}$, and $ax$ times minus 3 is minus $3ax$.'
        write: 'Check: $ax(bx - 3) = abx^{2} - 3ax$'
      - say: 'Minus $2y$ times $bx$ is minus $2bxy$, and minus $2y$ times minus 3 is plus $6y$.'
        write: '$-2y(bx - 3) = -2bxy + 6y$'
      - say: 'Add the two results. All four terms of the question are back, so the factors are right.'
        write: 'Sum $= abx^{2} - 3ax - 2bxy + 6y \ \checkmark$'
      - say: 'Therefore the expression factorises as $ax - 2y$, times $bx - 3$, which is answer choice A.'
        write: '$\therefore$ expression $= (ax - 2y)(bx - 3)$'
        answer: true
    traps:
      B: 'You went for $(bx + 3)(2y - ax)$. Expand it and the $abx^{2}$ term comes out negative, but in the question it is positive. Taking out minus 3 from the second pair gives $(ax - 2y)(bx - 3)$.'
      C: 'You went for $(bx + 3)(ax - 2y)$. Expanding gives $+3ax - 6y$, but the question has $-3ax + 6y$. Take out minus 3, not plus 3, from the second pair.'
      D: 'You went for $(ax - 2y)(ax - b)$. Expanding gives an $a^{2}x^{2}$ term, which is not in the question. The second bracket comes from taking out $bx$ and minus 3: it is $bx - 3$.'

  16:
    moments:
      - section: 'The question'
        say: 'The quadratic is already factorised, which saves a step. The real question is the ends: does "less than or equal to" let 3 and 4 in?'
        write: '$(x - 3)(x - 4) \le 0$'
      - say: 'Solution. Find the critical values, where each bracket is zero. $x$ minus 3 is zero at 3, and $x$ minus 4 is zero at 4.'
        write: 'Solution: critical values $\ x = 3,\ \ x = 4$'
      - section: 'Sign table'
        say: 'Now the sign table. The critical values split the number line into three regions: one column each. One row for each bracket, then the product.'
        diagram:
          id: t
          kind: table
          columns: ['Factor', 'x < 3', '3 < x < 4', 'x > 4']
          rows: [['x − 3', '', '', ''], ['x − 4', '', '', ''], ['product', '', '', '']]
      - say: '$x$ minus 3 is negative below 3, and positive above it.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,2', text: '−'}
          - {id: t, op: fill, part: 'cell:1,3', text: '+'}
          - {id: t, op: fill, part: 'cell:1,4', text: '+'}
      - say: '$x$ minus 4 is negative below 4, and positive above it.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:2,2', text: '−'}
          - {id: t, op: fill, part: 'cell:2,3', text: '−'}
          - {id: t, op: fill, part: 'cell:2,4', text: '+'}
      - say: 'Multiply down each column. Minus times minus is plus. Plus times minus is minus. Plus times plus is plus.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:3,2', text: '+'}
          - {id: t, op: fill, part: 'cell:3,3', text: '−', colour: green}
          - {id: t, op: fill, part: 'cell:3,4', text: '+'}
      - say: 'The product is negative only in the middle column, between 3 and 4.'
        write: 'Product $< 0$ for $3 < x < 4$'
      - section: 'The ends'
        say: 'But the sign is less than or equal to. So we also want where the product is exactly zero: at the critical values themselves.'
        write: 'Product $= 0$ at $x = 3$ and $x = 4$'
      - say: 'Together, the middle region with both ends included.'
        write: '$\therefore\ 3 \le x \le 4$'
      - section: 'The number line'
        say: 'On a number line: closed circles at 3 and 4, because both are included, and the stretch between them.'
        diagram: {id: n, kind: numberline, range: [1, 6]}
        diagram_do:
          - {id: n, op: interval, from: 3, to: 4, from_open: false, to_open: false, text: '3 ≤ x ≤ 4', answer: true, 'on': 'closed circles'}
      - section: 'Check'
        say: 'Check 3.5, inside: 0.5 times minus 0.5 is minus 0.25, which is at most 0. And 5, outside: 2 times 1 is 2, which is not.'
        write: 'Check: $\ (0.5)(-0.5) = -0.25 \le 0\ \checkmark;\ \ (2)(1) = 2 > 0\ \times$'
      - say: 'So $x$ runs from 3 to 4, ends included: option A.'
        write: '$3 \le x \le 4$'
        answer: true
    traps:
      B: 'You went for $3 < x < 4$. That solves "less than zero". The sign is less than or equal to, so 3 and 4, where the product is exactly zero, are included too.'
      C: 'You went for $3 \le x < 4$. You included 3 but left out 4. At $x = 4$ the product is 1 times 0, which is 0, so 4 belongs too.'
      D: 'You went for $3 < x \le 4$. You included 4 but left out 3. At $x = 3$ the product is 0 times minus 1, which is 0, so 3 belongs too.'

  17:
    moments:
      - say: 'In an arithmetic progression, the 4th term is 13 and the 10th term is 31. Picture a staircase where every step rises by the same amount. We want the height of step 21.'
        write: '$T_{4} = 13,\quad T_{10} = 31$'
        point:
          - {line: 0, kind: highlight, at: '13', to: {doodle: stairs, part: s4}}
        doodle: {name: 'custom:1995_q17_a', id: stairs, caption: 'equal steps: 13 at step 4, 31 at step 10', size: scene}
      - say: 'The $n$th term of an A.P. is $a$ plus $n$ minus 1 times $d$, where $a$ is the first term and $d$ is the common difference, the amount added each time.'
        write: '$T_{n} = a + (n - 1)d$'
      - say: 'For the 4th term, $n$ minus 1 is 3. So $a$ plus $3d$ equals 13. Call this equation 1.'
        write: '$T_{4} = a + 3d = 13 \quad (1)$'
      - say: 'For the 10th term, $n$ minus 1 is 9. So $a$ plus $9d$ equals 31. That is equation 2.'
        write: '$T_{10} = a + 9d = 31 \quad (2)$'
      - say: 'Take equation 2 minus equation 1. The $a$s cancel. $9d$ minus $3d$ is $6d$, and 31 minus 13 is 18. On the staircase, that is 6 steps climbing 18.'
        write: '$(2) - (1):\ 6d = 18$'
        doodle_do:
          - {id: stairs, op: highlight, part: rise, text: '6 steps: 18'}
      - say: 'Divide both sides by 6. 18 divided by 6 is 3. So each step rises by 3: the common difference is 3.'
        write: '$d = \dfrac{18}{6} = 3$'
        doodle_do:
          - {id: stairs, op: label, part: onestep, text: 'each step 3'}
      - say: 'Put $d = 3$ back into equation 1. 3 times 3 is 9, so $a$ plus 9 equals 13.'
        write: '$a + 3(3) = 13 \Rightarrow a + 9 = 13$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '= 3'}, at: '(3)', text: 'sub in'}
      - say: 'Subtract 9 from both sides. 13 minus 9 is 4. So the first term is 4.'
        write: '$a = 13 - 9 = 4$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '+ 9'}, at: '− 9', text: 'across the ='}
      - say: 'Now the 21st term. Here $n$ is 21, so $n$ minus 1 is 20.'
        write: '$T_{21} = a + 20d$'
      - say: 'Put in the $a$ and the $d$ we just found: 4 plus 20 times 3.'
        write: '$= 4 + 20(3)$'
        point:
          - {line: 9, kind: move, from: {line: 7, at: '= 4'}, at: '4', text: 'a'}
          - {line: 9, kind: move, from: {line: 5, at: '= 3'}, at: '(3)', text: 'd'}
      - say: '20 times 3 is 60.'
        write: '$= 4 + 60$'
      - say: 'And 4 plus 60 is 64. That is the height of step 21.'
        write: '$= 64$'
        point:
          - {line: 11, kind: highlight, at: '= 64', to: {doodle: stairs, part: s21}}
        doodle_do:
          - {id: stairs, op: label, part: s21, text: '64'}
      - say: 'Let''s check the 10th term with these values: 4 plus 9 times 3 is 4 plus 27, which is 31. Good.'
        write: 'Check: $T_{10} = 4 + 9(3) = 4 + 27 = 31$'
      - say: 'So the 21st term is 64, which is answer choice C.'
        write: '$T_{21} = 64$'
        answer: true
    traps:
      A: 'You went for 175. That is far too big for a common difference of 3. The 21st term is 4 plus 20 times 3, which is 64.'
      B: 'You went for 85. Check the working: $d = 3$ and $a = 4$, and the 21st term is $a + 20d$, which is 4 plus 60, or 64.'
      D: 'You went for 45. That is too small. Starting from 4 and adding 3 twenty times gives 4 plus 60, which is 64.'
  18:
    moments:
      - section: 'The question'
        say: 'A cubic on the bottom looks frightening. But it hides the very brackets on top. Factorise the top and the bottom, and almost everything cancels.'
        write: 'Simplify $\dfrac{x^{2} - 1}{x^{3} + 2x^{2} - x - 2}$'
      - section: 'Solution'
        say: 'Solution. Factorise the top first. $x$ squared minus 1 is $x$ squared minus 1 squared, a difference of two squares. So it is $x - 1$ times $x + 1$.'
        write: 'Numerator: $x^{2} - 1 = (x - 1)(x + 1)$'
      - section: 'Factorise the bottom'
        say: 'Now the bottom. It has four terms and no factor common to all four, so we factorise by grouping, two terms at a time.'
        write: 'Denominator: $x^{3} + 2x^{2} - x - 2$'
      - say: 'From the first pair take out $x$ squared, leaving $x + 2$. From the second pair take out minus 1, leaving $x + 2$ again.'
        write: '$= x^{2}(x + 2) - 1(x + 2)$'
      - say: 'The brackets match, so take out the common bracket, $x + 2$. What is left over is $x$ squared minus 1.'
        write: '$= (x + 2)(x^{2} - 1)$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '1[[(x + 2)]]'}, at: '(x + 2)', text: 'taken out'}
      - say: 'And $x$ squared minus 1 is the same difference of two squares we met on top.'
        write: '$= (x + 2)(x - 1)(x + 1)$'
        point:
          - {line: 5, kind: arrow, from: {line: 1, at: '(x − 1)(x + 1)'}, at: '(x − 1)(x + 1)', text: 'same as the top'}
      - section: 'Cancel'
        say: 'Now write the fraction with both parts factorised. Picture each bracket as a tile: two on top, three underneath.'
        write: 'Fraction $= \dfrac{(x - 1)(x + 1)}{(x + 2)(x - 1)(x + 1)}$'
        doodle: {name: 'custom:1995_q18_a', id: tiles, caption: 'matching tiles top and bottom'}
      - say: '$x - 1$ is a factor of the top and of the bottom, so it cancels. So does $x + 1$.'
        write: '$= \dfrac{\cancel{(x - 1)}\cancel{(x + 1)}}{(x + 2)\cancel{(x - 1)}\cancel{(x + 1)}}$'
        doodle_do:
          - {id: tiles, op: cross, part: minus}
          - {id: tiles, op: cross, part: plus}
      - say: 'When every factor on top cancels, 1 is left on top. Over the one factor left underneath, that gives 1 over $x + 2$.'
        write: '$= \dfrac{1}{x + 2}$'
        doodle_do:
          - {id: tiles, op: circle, part: rest, text: '1 over x + 2'}
      - section: 'Check'
        say: 'Check with $x = 2$. The top is 4 minus 1, which is 3. The bottom is 8 plus 8 minus 2 minus 2, which is 12.'
        write: 'Check $x = 2$: $\ \dfrac{4 - 1}{8 + 8 - 2 - 2} = \dfrac{3}{12} = \dfrac{1}{4}$'
      - say: '3 over 12 is 1 over 4. And 1 over 2 plus 2 is also 1 over 4. They agree.'
        write: '$\dfrac{1}{2 + 2} = \dfrac{1}{4} \ \checkmark$'
      - say: 'Therefore the fraction simplifies to 1 over $x + 2$, which is answer choice A.'
        write: '$\therefore \dfrac{x^{2} - 1}{x^{3} + 2x^{2} - x - 2} = \dfrac{1}{x + 2}$'
        answer: true
    traps:
      B: 'You went for $x - 1$ over $x + 1$. The bottom has no $x + 1$ left over after cancelling. Factorise it fully: $(x + 2)(x - 1)(x + 1)$, and the whole top cancels.'
      C: 'You went for $x - 1$ over $x + 2$. You cancelled only one bracket. The bottom contains both $x - 1$ and $x + 1$, so both cancel and 1 is left on top.'
      D: 'You went for 1 over $x - 2$. Check the sign in the grouping: $x^{3} + 2x^{2}$ is $x^{2}$ times $x + 2$, so the bracket left is $x + 2$.'

  19:
    moments:
      - section: 'The question'
        say: 'One fraction with two brackets underneath can be split into two simpler fractions. The tops are hidden numbers, and one clever substitution finds each of them.'
        write: 'Express $\dfrac{5x - 12}{(x - 2)(x - 3)}$ in partial fractions'
      - section: 'Solution'
        say: 'Solution. The bottom has two different linear factors, so each gets its own fraction with a constant on top. Let the constants be $A$ and $B$.'
        write: 'Let $\dfrac{5x - 12}{(x - 2)(x - 3)} \equiv \dfrac{A}{x - 2} + \dfrac{B}{x - 3}$'
        doodle: {name: 'custom:1995_q19_a', id: snap, caption: 'one fraction snaps into two'}
      - say: 'Multiply through by $x - 2$ times $x - 3$, the LCM of the denominators. $A$ loses its $x - 2$, and $B$ loses its $x - 3$.'
        write: '$5x - 12 \equiv A(x - 3) + B(x - 2)$'
      - section: 'Find B'
        say: 'This identity is true for every $x$. Put $x = 3$, because it makes the bracket $x - 3$ zero, and the $A$ term disappears.'
        write: 'Put $x = 3$: $\ 5(3) - 12 = A(3 - 3) + B(3 - 2)$'
      - say: '5 times 3 is 15. 3 minus 3 is 0, and 3 minus 2 is 1.'
        write: '$15 - 12 = A(0) + B(1)$'
      - say: '15 minus 12 is 3, and $A$ times 0 is 0. So $B$ is 3.'
        write: '$\therefore B = 3$'
        doodle_do:
          - {id: snap, op: label, part: pb, text: 'B = 3'}
      - section: 'Find A'
        say: 'Now put $x = 2$, because it makes the bracket $x - 2$ zero, and the $B$ term disappears.'
        write: 'Put $x = 2$: $\ 5(2) - 12 = A(2 - 3) + B(2 - 2)$'
      - say: '5 times 2 is 10. 2 minus 3 is minus 1, and 2 minus 2 is 0.'
        write: '$10 - 12 = A(-1) + B(0)$'
      - say: '10 minus 12 is minus 2. $A$ times minus 1 is minus $A$, and $B$ times 0 is 0.'
        write: '$-2 = -A$'
      - say: 'Multiply both sides by minus 1. So $A$ is 2.'
        write: '$\therefore A = 2$'
        doodle_do:
          - {id: snap, op: label, part: pa, text: 'A = 2'}
      - section: 'Check'
        say: 'Check by adding them back over the LCM. The new top is 2 times $x - 3$, plus 3 times $x - 2$.'
        write: 'Check: $2(x - 3) + 3(x - 2)$'
      - say: '$2x$ minus 6 plus $3x$ minus 6 is $5x$ minus 12, the top we started with.'
        write: '$= 2x - 6 + 3x - 6 = 5x - 12 \ \checkmark$'
      - say: 'Therefore the partial fractions are 2 over $x - 2$, plus 3 over $x - 3$, which is answer choice B.'
        write: '$\therefore \dfrac{5x - 12}{(x - 2)(x - 3)} = \dfrac{2}{x - 2} + \dfrac{3}{x - 3}$'
        answer: true
    traps:
      A: 'You went for the option with a minus sign. At $x = 3$ the right side is $B$ times 1, and the left side is plus 3, so $B$ is plus 3 and the fractions are added.'
      C: 'You went for 2 over $x - 3$ minus 3 over $x - 2$. The constants are attached to the wrong brackets. Putting $x = 2$ picks out the constant over $x - 2$, and it is 2.'
      D: 'You went for 5 over $x - 3$ plus 4 over $x - 2$. Add them back and you get $9x - 22$ on top, not $5x - 12$. Substituting $x = 3$ and $x = 2$ gives 3 and 2.'

  20:
    moments:
      - section: 'The question'
        say: 'No algebra this time: the graph does the work. $f(x)$ is the height of the curve, so $f(x) > 0$ asks where the curve is above the $x$-axis.'
        write: '$f(x) > 0$: where is the curve above the $x$-axis?'
        point:
          - {figure: 0, kind: circle, target: 'x', text: 'x-axis'}
      - say: 'Solution. First, the critical values: where the curve crosses the $x$-axis. It crosses at minus 1, at 1 and at 2.'
        write: 'Solution: $\ f(x) = 0$ at $x = -1,\ 1,\ 2$'
        point:
          - {figure: 0, kind: circle, target: '-1'}
          - {figure: 0, kind: circle, target: '1'}
          - {figure: 0, kind: circle, target: '2'}
      - section: 'Read each region'
        say: 'Left of minus 1, the curve is below the axis, so $f(x)$ is negative.'
        write: '$x < -1$: below, $f(x) < 0$'
        point:
          - {figure: 0, kind: label, target: {x: 112, y: 182}, text: 'below'}
      - say: 'Between minus 1 and 1, the curve rises over the axis, so $f(x)$ is positive.'
        write: '$-1 < x < 1$: above, $f(x) > 0$'
        point:
          - {figure: 0, kind: label, target: {x: 160, y: 82}, text: 'above'}
      - say: 'Between 1 and 2, it dips below again: negative.'
        write: '$1 < x < 2$: below, $f(x) < 0$'
        point:
          - {figure: 0, kind: label, target: {x: 253, y: 170}, text: 'below'}
      - say: 'Beyond 2, it rises and stays above: positive.'
        write: '$x > 2$: above, $f(x) > 0$'
        point:
          - {figure: 0, kind: label, target: {x: 295, y: 89}, text: 'above'}
      - section: 'Answer'
        say: 'So $f(x)$ is positive on two stretches. At minus 1, 1 and 2 themselves, $f(x)$ is exactly zero.'
        write: '$\therefore\ f(x) > 0$ for $-1 < x < 1$ and $x > 2$'
        point:
          - {line: 3, kind: underline, at: '−1 < x < 1', text: 'above'}
          - {line: 5, kind: underline, at: 'x > 2', text: 'above'}
      - say: 'On a number line: a stretch from minus 1 to 1, and an arrow from 2 to the right.'
        diagram: {id: n, kind: numberline, range: [-3, 4]}
        diagram_do:
          - {id: n, op: interval, from: -1, to: 1, from_open: true, to_open: true, text: '−1 < x < 1', answer: true}
          - {id: n, op: interval, from: 2, from_open: true, text: 'x > 2', answer: true, 'on': 'arrow'}
      - say: 'Only option A is made of these two stretches: minus 1 to 1, and $x$ greater than 2. So the answer is option A.'
        write: '$\therefore$ Answer: A, the stretches $-1$ to $1$ and $x > 2$'
        answer: true
    traps:
      B: 'You went for the option starting with $x \le -1$. Left of minus 1 the curve is below the axis, so $f(x)$ is negative there, not positive.'
      C: 'You went for $x \le -1$ and $1 \le x \le 2$. Those are exactly the stretches where the curve is below the axis. The question wants where it is above.'
      D: 'You went for $x \le 2$ with $-1 \le x \le 1$. "$x \le 2$" takes in the stretch left of minus 1 and the dip between 1 and 2, where the curve is below the axis.'
  21:
    moments:
      - say: 'We want to know which of these binary operations is commutative on the set of integers.'
        write: '$a * b = b * a\ ?$'
      - say: 'An operation is commutative if swapping the two inputs never changes the answer. Picture the 1 and the 2 changing places. So for each option, we compare $a * b$ with $b * a$, using 1 and 2.'
        write: 'Commutative: $a * b = b * a$ for all $a,\ b$'
        doodle: {name: 'custom:1995_q21_a', id: swap, caption: 'swap the inputs'}
      - say: 'Option A: $a * b$ is $a + 2b$. With $a = 1$ and $b = 2$, that is 1 plus 2 times 2, which is 1 plus 4, or 5.'
        write: 'A: $1 * 2 = 1 + 2(2) = 5$'
      - say: 'Swap them: $2 * 1$ is 2 plus 2 times 1, which is 4. 5 and 4 are different, so the swap changed the answer, and A is not commutative.'
        write: '$2 * 1 = 2 + 2(1) = 4 \neq 5$'
        point:
          - {line: 2, kind: circle, at: '= 5', text: 'compare'}
        doodle_do:
          - {id: swap, op: cross, part: swap, text: 'A: 5 ≠ 4'}
      - say: 'Option C: $a * b$ is $a^2 + b$. So $1 * 2$ is 1 squared plus 2, which is 3.'
        write: 'C: $1 * 2 = 1^{2} + 2 = 3$'
      - say: 'Swapped, $2 * 1$ is 2 squared plus 1, which is 5. Different again, so C is out.'
        write: '$2 * 1 = 2^{2} + 1 = 5 \neq 3$'
      - say: 'Option D: $a * b$ is $a$ times $b + 1$, over 2. So $1 * 2$ is 1 times 3, over 2, which is 3 over 2.'
        write: 'D: $1 * 2 = \dfrac{1(2 + 1)}{2} = \dfrac{3}{2}$'
      - say: 'Swapped, $2 * 1$ is 2 times 2, over 2, which is 2. Different, so D is out.'
        write: '$2 * 1 = \dfrac{2(1 + 1)}{2} = 2 \neq \dfrac{3}{2}$'
      - say: 'Now option B: $a * b$ is $a + b - ab$. Swap the letters, and $b * a$ is $b + a - ba$.'
        write: 'B: $a * b = a + b - ab,\quad b * a = b + a - ba$'
      - say: '$a + b$ is the same as $b + a$, because ordinary addition is commutative. And $ab$ is the same as $ba$, because ordinary multiplication is too.'
        write: '$a + b = b + a,\quad ab = ba$'
      - say: 'So the two sides are always equal. Test the swap anyway: 1 plus 2 minus 2 is 1, and 2 plus 1 minus 2 is also 1.'
        write: 'Check: $1 * 2 = 1 + 2 - 2 = 1,\quad 2 * 1 = 2 + 1 - 2 = 1$'
        doodle_do:
          - {id: swap, op: circle, part: row2, text: 'B: 1 = 1'}
      - say: 'So the commutative operation is $a * b = a + b - ab$, which is answer choice B.'
        write: '$a * b = a + b - ab = b * a$'
        answer: true
    traps:
      A: 'You went for $a + 2b$. Swapping gives $b + 2a$, which is different: with 1 and 2 you get 5 one way and 4 the other. The 2 picks out only one letter.'
      C: 'You went for $a^2 + b$. Only $a$ is squared, so swapping changes the answer: with 1 and 2 you get 3 one way and 5 the other.'
      D: 'You went for $a$ times $b + 1$ over 2. The plus 1 is attached to $b$ only, so swapping changes it: with 1 and 2 you get 3 over 2 one way and 2 the other.'

  22:
    moments:
      - say: 'The operation $a * b$ means the positive square root of $a$ times $b$. We want $2 * (12 * 27)$.'
        write: '$a * b = +\sqrt{ab}$'
      - say: 'The brackets tell us to work from the inside out. Picture the operation as a machine: two numbers go in, it multiplies them and takes the square root. First we feed in 12 and 27.'
        write: 'Inside first: $12 * 27 = \sqrt{12 \times 27}$'
        doodle: {name: 'custom:1995_q22_a', id: mach, caption: 'multiply, then square root', size: scene}
      - say: '12 times 27: 10 times 27 is 270, and 2 times 27 is 54.'
        write: '$12 \times 27 = 270 + 54$'
      - say: '270 plus 54 is 324.'
        write: '$= 324$'
      - say: 'What is the square root of 324? 18 times 18 is 324, so it is 18.'
        write: '$\sqrt{324} = 18$ since $18 \times 18 = 324$'
      - say: 'So $12 * 27$ is 18: that is what comes out of the first machine.'
        write: '$12 * 27 = 18$'
        point:
          - {line: 5, kind: highlight, at: '18', to: {doodle: mach, part: out1}}
        doodle_do:
          - {id: mach, op: label, part: out1, text: '18'}
      - say: 'Now go back to the whole expression, and feed that 18, with the 2, into the machine again.'
        write: '$2 * (12 * 27) = 2 * 18$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '= 18'}, at: '∗ 18', text: 'from inside'}
        doodle_do:
          - {id: mach, op: stage, stage: 'custom:1995_q22_a2'}
      - say: '$2 * 18$ is the square root of 2 times 18.'
        write: '$= \sqrt{2 \times 18}$'
      - say: '2 times 18 is 36.'
        write: '$= \sqrt{36}$'
      - say: 'The square root of 36 is 6. So out of the second machine comes 6: $2 * (12 * 27)$ is 6, which is answer choice C.'
        write: '$= 6$'
        answer: true
        doodle_do:
          - {id: mach, op: label, part: out2, text: '6'}
    traps:
      A: 'You went for 12. That is one of the numbers from the question, not a result. Work the bracket first: root 324 is 18, then the root of 2 times 18 is 6.'
      B: 'You went for 9. Check the last step: 2 times 18 is 36, and the square root of 36 is 6.'
      D: 'You went for 2. That is just the first number. You still need to star it with 18: the square root of 36 is 6.'

  23:
    moments:
      - say: 'We want the sum to infinity of 1, 9 over 10, 9 over 10 squared, 9 over 10 cubed, and so on.'
        write: '$1,\ \tfrac{9}{10},\ \left(\tfrac{9}{10}\right)^{2},\ \left(\tfrac{9}{10}\right)^{3},\ \ldots$'
      - say: 'Each term is the one before it, times 9 over 10. A sequence that multiplies by the same number each time is a geometric progression.'
        write: 'Each term $= \text{previous term} \times \dfrac{9}{10}$'
      - say: 'The first term is 1. Picture pouring into a glass: the first pour is 1.'
        write: '$a = 1$'
        doodle: {name: 'custom:1995_q23_a', id: glass, caption: 'pour 1, then 9/10 of the last pour'}
        doodle_do:
          - {id: glass, op: fill, to: 0.1}
      - say: 'The common ratio is the second term divided by the first: 9 over 10, divided by 1, is 9 over 10. So each pour is 9 tenths of the one before.'
        write: '$r = \dfrac{9/10}{1} = \dfrac{9}{10}$'
        doodle_do:
          - {id: glass, op: fill, to: 0.19}
      - say: 'A sum to infinity only exists when $r$ is between minus 1 and 1. 9 over 10 is 0.9, so the pours keep shrinking, and the glass fills towards a limit instead of overflowing.'
        write: '$-1 < \dfrac{9}{10} < 1$'
        doodle_do:
          - {id: glass, op: fill, to: 0.7}
      - say: 'The formula for the sum to infinity is $a$ over 1 minus $r$.'
        write: '$S_{\infty} = \dfrac{a}{1 - r}$'
      - say: 'Put in $a = 1$ and $r$ = 9 over 10.'
        write: '$S_{\infty} = \dfrac{1}{1 - \frac{9}{10}}$'
        point:
          - {line: 5, kind: box, text: 'the rule'}
          - {line: 6, kind: move, from: {line: 2, at: '= 1'}, at: '109[[1]]', text: 'a'}
          - {line: 6, kind: move, from: {line: 3, at: '= 109'}, at: '109', text: 'r'}
      - say: 'Work out the bottom first. 1 is 10 over 10, and 10 over 10 minus 9 over 10 is 1 over 10.'
        write: 'Bottom: $1 - \dfrac{9}{10} = \dfrac{10}{10} - \dfrac{9}{10} = \dfrac{1}{10}$'
      - say: 'So we have 1, divided by 1 over 10.'
        write: '$S_{\infty} = \dfrac{1}{1/10}$'
      - say: 'Dividing by 1 over 10 is the same as multiplying by 10. So this is 1 times 10, which is 10: that is how full the glass gets.'
        write: '$= 1 \times 10 = 10$'
        point:
          - {line: 9, kind: highlight, at: '= 10', to: {doodle: glass, part: top}}
        doodle_do:
          - {id: glass, op: fill, to: 1.0}
          - {id: glass, op: label, part: top, text: '10'}
      - say: 'So the sum to infinity is 10, which is answer choice D.'
        write: '$S_{\infty} = 10$'
        answer: true
    traps:
      A: 'You went for 1 over 10. That is the bottom of the formula, 1 minus $r$. You still need to divide 1 by it, which gives 10.'
      B: 'You went for 9 over 10. That is the common ratio, not the sum. The sum is $a$ over 1 minus $r$, which is 10.'
      C: 'You went for 10 over 9. That is 1 divided by $r$. The formula divides by 1 minus $r$, which is 1 over 10, giving 10.'
  24:
    moments:
      - say: 'We want the value of $k$ that makes this three by three determinant equal to 23.'
        write: '$\begin{vmatrix} -2 & 1 & 1 \\ 2 & 1 & k \\ 1 & 3 & -1 \end{vmatrix} = 23$'
      - say: 'We expand along the top row. The top entries are minus 2, 1 and 1, and the signs in front go plus, minus, plus. Each entry multiplies its minor.'
        write: 'Expand: $(-2)M_{1} - (1)M_{2} + (1)M_{3}$'
      - say: 'The first minor: cover the top row and the first column. What is left is 1, $k$, 3, minus 1.'
        write: '$M_{1} = \begin{vmatrix} 1 & k \\ 3 & -1 \end{vmatrix}$'
      - say: 'A two by two determinant is the leading diagonal product minus the other diagonal product: 1 times minus 1, minus $k$ times 3.'
        write: '$= (1)(-1) - (k)(3) = -1 - 3k$'
      - say: 'The second minor: cover the top row and the second column. That leaves 2, $k$, 1, minus 1. It is 2 times minus 1, minus $k$ times 1.'
        write: '$M_{2} = \begin{vmatrix} 2 & k \\ 1 & -1 \end{vmatrix} = (2)(-1) - (k)(1) = -2 - k$'
      - say: 'The third minor: cover the top row and the third column. That leaves 2, 1, 1, 3. 2 times 3 is 6, minus 1 times 1, which is 6 minus 1, or 5.'
        write: '$M_{3} = \begin{vmatrix} 2 & 1 \\ 1 & 3 \end{vmatrix} = (2)(3) - (1)(1) = 5$'
      - say: 'Now put the three minors back into our expansion, with the top-row entries and the signs.'
        write: 'Determinant $= (-2)(-1 - 3k) - (1)(-2 - k) + (1)(5)$'
        point:
          - {line: 6, kind: move, from: {line: 3, at: '= −1 − 3k'}, at: '(−1 − 3k)', text: 'M1'}
          - {line: 6, kind: move, from: {line: 4, at: '= −2 − k'}, at: '(−2 − k)', text: 'M2'}
          - {line: 6, kind: move, from: {line: 5, at: '= 5'}, at: '(5)', text: 'M3'}
      - say: 'The first part: minus 2 times minus 1 is plus 2, and minus 2 times minus $3k$ is plus $6k$.'
        write: '$(-2)(-1 - 3k) = 2 + 6k$'
      - say: 'The second part: minus 1 times minus 2 is plus 2, and minus 1 times minus $k$ is plus $k$.'
        write: '$-(1)(-2 - k) = 2 + k$'
      - say: 'So the determinant is 2 plus $6k$, plus 2 plus $k$, plus 5.'
        write: 'Determinant $= 2 + 6k + 2 + k + 5$'
      - say: '2 plus 2 plus 5 is 9, and $6k$ plus $k$ is $7k$.'
        write: '$= 9 + 7k$'
      - say: 'The question says the determinant is 23.'
        write: '$9 + 7k = 23$'
        point:
          - {line: 0, kind: underline, at: '= 23', text: 'given'}
      - say: 'Subtract 9 from both sides. 23 minus 9 is 14.'
        write: '$7k = 14$'
      - say: 'Divide both sides by 7. 14 divided by 7 is 2.'
        write: '$k = 2$'
      - say: 'Check: with $k = 2$, 9 plus 7 times 2 is 9 plus 14, which is 23. So $k$ is 2, which is answer choice B.'
        write: 'Check: $9 + 7(2) = 23$, so $k = 2$'
        answer: true
    traps:
      A: 'You went for 1. That makes the determinant 9 plus 7, which is 16, not 23. Watch the signs: both products with minus signs come out positive.'
      C: 'You went for 3. That makes the determinant 9 plus 21, which is 30. Solving 9 plus $7k$ equals 23 gives $k = 2$.'
      D: 'You went for 4. That makes the determinant 9 plus 28, which is 37. Solving 9 plus $7k$ equals 23 gives $k = 2$.'

