          - {line: 2, kind: circle, at: '= 5', text: 'compare'}
      - say: 'Option C: $a * b$ is $a^2 + b$. So $1 * 2$ is 1 squared plus 2, which is 3.'
        write: 'C: $1 * 2 = 1^{2} + 2 = 3$'
