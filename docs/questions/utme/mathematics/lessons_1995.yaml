          - {figure: sketch, kind: label, target: h, text: '30√3 m'}
    traps:
      A: 'You went for 60 m. That is 30 divided by cos 60, the length of the boy''s line of sight to the top, not the height. The height uses the tangent: 30 times root 3.'
      C: 'You went for 20 root 3 m. That is about 35 m, which does not come from the tangent. Height over 30 is tan 60, which is root 3, so the height is 30 root 3.'
