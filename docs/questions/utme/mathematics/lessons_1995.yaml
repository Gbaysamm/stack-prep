        write: '$\le 0$ means $< 0$ or $= 0$'
      - say: 'At $x = 3$ the product is 0 times minus 1, which is 0. At $x = 4$ it is 1 times 0, which is 0. So both endpoints count.'
        write: '$x = 3:\ (0)(-1) = 0,\quad x = 4:\ (1)(0) = 0$'
      - say: 'So the solution runs from 3 to 4 with both ends included: $3 \le x \le 4$, which is answer choice A.'
