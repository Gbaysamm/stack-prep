        write: '$2 * 1 = 2^{2} + 1 = 5 \neq 3$'
      - say: 'Option D: $a * b$ is $a$ times $b + 1$, over 2. So $1 * 2$ is 1 times 3, over 2, which is 3 over 2.'
        write: 'D: $1 * 2 = \dfrac{1(2 + 1)}{2} = \dfrac{3}{2}$'
      - say: 'Swapped, $2 * 1$ is 2 times 2, over 2, which is 2. Different, so D is out.'
        write: '$2 * 1 = \dfrac{2(1 + 1)}{2} = 2 \neq \dfrac{3}{2}$'
      - say: 'Now option B: $a * b$ is $a + b - ab$. Swap the letters, and $b * a$ is $b + a - ba$.'
        write: 'B: $a * b = a + b - ab,\quad b * a = b + a - ba$'
      - say: '$a + b$ is the same as $b + a$, because ordinary addition is commutative. And $ab$ is the same as $ba$, because ordinary multiplication is too.'
        write: '$a + b = b + a,\quad ab = ba$'
      - say: 'So the two sides are always equal. Test with 1 and 2 anyway: 1 plus 2 minus 2 is 1, and 2 plus 1 minus 2 is also 1.'
        write: 'Check: $1 * 2 = 1 + 2 - 2 = 1,\quad 2 * 1 = 2 + 1 - 2 = 1$'
      - say: 'So the commutative operation is $a * b = a + b - ab$, which is answer choice B.'
