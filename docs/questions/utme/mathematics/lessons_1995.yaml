      B: 'You went for the set containing 0. That set has one element, the number zero. But zero does not satisfy $x$ squared equals 9, so $S$ has no elements.'
      D: 'You went for the set containing the empty set. That set has one element in it. $S$ has none, so it is just the empty set itself.'
  11:
    moments:
      - say: 'We are told that $x - 1$ and $x + 1$ are both factors of $x^3 + px^2 + qx + 6$. We want the values of $p$ and $q$.'
        write: '$f(x) = x^{3} + px^{2} + qx + 6$'
      - say: 'The factor theorem says: if $x - a$ is a factor, then putting $x = a$ into the expression gives zero.'
        write: 'Factor theorem: $(x - a)$ is a factor $\Rightarrow f(a) = 0$'
      - say: 'Since $x - 1$ is a factor, $f$ of 1 must be zero. Let''s replace every $x$ with 1.'
        write: '$f(1) = 1^{3} + p(1)^{2} + q(1) + 6 = 0$'
        point:
          - {line: 1, kind: box, text: 'the rule'}
      - say: '1 cubed is 1 and 1 squared is 1, so this is 1 plus $p$ plus $q$ plus 6, equals zero.'
        write: '$1 + p + q + 6 = 0$'
      - say: '1 plus 6 is 7, so $p$ plus $q$ plus 7 equals zero.'
        write: '$p + q + 7 = 0$'
      - say: 'Take 7 from both sides, and $p$ plus $q$ equals minus 7. Let''s call this equation 1.'
        write: '$p + q = -7 \quad (1)$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '+ 7'}, at: '−7', text: 'across the ='}
      - say: 'Now the second factor. $x + 1$ is zero when $x$ is minus 1, so $f$ of minus 1 must be zero. Replace every $x$ with minus 1.'
        write: '$f(-1) = (-1)^{3} + p(-1)^{2} + q(-1) + 6 = 0$'
      - say: 'Careful with the signs. Minus 1 cubed is minus 1, but minus 1 squared is plus 1.'
        write: '$(-1)^{3} = -1,\quad (-1)^{2} = 1$'
      - say: 'So we get minus 1, plus $p$, minus $q$, plus 6, equals zero.'
        write: '$-1 + p - q + 6 = 0$'
      - say: 'Minus 1 plus 6 is 5. Take 5 from both sides, and $p$ minus $q$ equals minus 5. That is equation 2.'
        write: '$p - q = -5 \quad (2)$'
      - say: 'Now add equation 1 and equation 2. The $q$ and the minus $q$ cancel. $p$ plus $p$ is $2p$, and minus 7 plus minus 5 is minus 12.'
        write: '$(1) + (2):\ 2p = -12$'
        point:
          - {line: 5, kind: arrow, at: 'p + q = −7', text: '(1)'}
          - {line: 9, kind: arrow, at: 'p − q = −5', text: '(2)'}
      - say: 'Divide both sides by 2. Minus 12 divided by 2 is minus 6.'
        write: '$p = -6$'
      - say: 'Put $p = -6$ back into equation 1. Minus 6 plus $q$ equals minus 7.'
        write: '$-6 + q = -7$'
        point:
          - {line: 5, kind: arrow, text: 'into (1)'}
          - {line: 12, kind: move, from: {line: 11, at: '−6'}, at: '−6', text: 'p'}
      - say: 'Add 6 to both sides. Minus 7 plus 6 is minus 1.'
        write: '$q = -7 + 6 = -1$'
        point:
          - {line: 13, kind: move, from: {line: 12, at: '−6'}, at: '+ 6', text: 'across the ='}
      - say: 'Let''s check with $x = -1$. Minus 1, plus minus 6 times 1, plus minus 1 times minus 1, plus 6: that is minus 1 minus 6 plus 1 plus 6, which is zero. Good.'
        write: 'Check: $f(-1) = -1 - 6 + 1 + 6 = 0$'
      - say: 'So $p$ is minus 6 and $q$ is minus 1, which is answer choice A.'
        write: '$p = -6,\quad q = -1$'
        answer: true
    traps:
      B: 'You went for 6 and 1. Those are the right sizes with the wrong signs. From $p + q = -7$ and $p - q = -5$, both answers come out negative.'
      C: 'You went for minus 1 and 6. Try it: 1 minus 1 plus 6 plus 6 is 12, not zero. Adding the two equations gives $2p = -12$, so $p = -6$.'
      D: 'You went for 6 and minus 6. Those give $p + q = 0$, but the factor $x - 1$ needs $p + q = -7$. Solving the pair gives $p = -6$ and $q = -1$.'

  12:
    moments:
      - say: 'The expression $2x^2 - px + p$ leaves a remainder of 6 when divided by $x + 1$. We want a positive value of $p$.'
        write: '$f(x) = 2x^{2} - px + p$'
      - say: 'The remainder theorem says: when you divide $f(x)$ by $x - a$, the remainder is $f$ of $a$. So we put in the value of $x$ that makes the divisor zero.'
        write: 'Remainder theorem: dividing by $(x - a)$ leaves $f(a)$'
      - say: 'Our divisor is $x + 1$. What makes it zero? $x$ equals minus 1.'
        write: '$x + 1 = 0 \Rightarrow x = -1$'
        point:
          - {line: 1, kind: box, text: 'the rule'}
      - say: 'So the remainder is $f$ of minus 1. Let''s replace every $x$ with minus 1.'
        write: '$f(-1) = 2(-1)^{2} - p(-1) + p$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '−1'}, at: '2[[(−1)]]', text: 'every x'}
      - say: 'Minus 1 squared is 1, so the first term is 2 times 1, which is 2.'
        write: '$2(-1)^{2} = 2(1) = 2$'
      - say: 'Next, minus $p$ times minus 1. A negative times a negative is positive, so that is plus $p$.'
        write: '$-p(-1) = +p$'
      - say: 'Put those back in, with the last plus $p$ just as it was.'
        write: '$f(-1) = 2 + p + p$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '(1) = [[2]]'}, at: '= [[2]]'}
          - {line: 6, kind: move, from: {line: 5, at: '+p'}, at: '2[[+p]]', text: 'from here'}
      - say: '$p$ plus $p$ is $2p$.'
        write: '$= 2 + 2p$'
      - say: 'The question says the remainder is 6. So 2 plus $2p$ equals 6.'
        write: '$2 + 2p = 6$'
      - say: 'Subtract 2 from both sides. 6 minus 2 is 4.'
        write: '$2p = 4$'
      - say: 'Divide both sides by 2. 4 divided by 2 is 2. That is positive, as the question wants.'
        write: '$p = 2$'
      - say: 'Check: with $p = 2$, $f$ of minus 1 is 2 times 1, minus 2 times minus 1, plus 2. That is 2 plus 2 plus 2, which is 6. Good.'
        write: 'Check: $2(1) - 2(-1) + 2 = 2 + 2 + 2 = 6$'
      - say: 'So $p$ is 2, which is answer choice B.'
        write: '$p = 2$'
        answer: true
    traps:
      A: 'You went for 1. Then the remainder would be 2 plus 2 times 1, which is 4, not 6. Solving 2 plus $2p$ equals 6 gives $p = 2$.'
      C: 'You went for 3. Then the remainder would be 2 plus 6, which is 8, not 6. Check the signs: both $p$ terms come out positive, so it is 2 plus $2p$ equals 6.'
      D: 'You went for 4. That is the value of $2p$, not $p$. Divide by 2 at the last step: $p = 2$.'

  13:
    moments:
      - say: 'We have $s = 2r\sqrt{Q\pi T + K}$, and we want to make $T$ the subject.'
        write: '$s = 2r\sqrt{Q\pi T + K}$'
      - say: '$T$ is buried inside a square root. We peel the layers off from the outside in: first the root, then the $4r^2$, then the $K$, and last the $Q\pi$.'
        write: 'Goal: $T = \ldots$'
      - say: 'First, square both sides to get rid of the root.'
        write: '$s^{2} = \left(2r\right)^{2}\left(\sqrt{Q\pi T + K}\right)^{2}$'
      - say: 'Squaring $2r$ squares both parts: 2 squared is 4, and $r$ squared is $r^2$. And squaring a square root just leaves what is inside.'
        write: '$s^{2} = 4r^{2}(Q\pi T + K)$'
        point:
          - {line: 3, kind: circle, at: '4r2', text: '(2r) squared'}
      - say: 'Next, divide both sides by $4r^2$ to free the bracket.'
        write: '$\dfrac{s^{2}}{4r^{2}} = Q\pi T + K$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '4r2'}, at: '4r2', text: 'divide it over'}
      - say: 'Now subtract $K$ from both sides.'
        write: '$\dfrac{s^{2}}{4r^{2}} - K = Q\pi T$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '+ K'}, at: '− K', text: 'across the ='}
      - say: 'Finally, divide both sides by $Q\pi$. This is the important part: we must divide every term on the left, not only the first one.'
        write: '$T = \dfrac{1}{Q\pi}\left(\dfrac{s^{2}}{4r^{2}} - K\right)$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: 'Qπ'}, at: 'Qπ', text: 'divides it all'}
      - say: 'The first term: $s^2$ over $4r^2$, divided by $Q\pi$, puts the $Q\pi$ into the bottom. Tidied up, that is $s^2$ over $4\pi r^2 Q$.'
        write: '$\dfrac{s^{2}}{4r^{2}} \div Q\pi = \dfrac{s^{2}}{4\pi r^{2}Q}$'
      - say: 'The second term: $K$ divided by $Q\pi$ is $K$ over $\pi Q$.'
        write: '$K \div Q\pi = \dfrac{K}{\pi Q}$'
      - say: 'Putting both terms together, $T$ equals $s^2$ over $4\pi r^2 Q$, minus $K$ over $\pi Q$, which is answer choice B.'
        write: '$T = \dfrac{s^{2}}{4\pi r^{2}Q} - \dfrac{K}{\pi Q}$'
        point:
          - {line: 7, kind: arrow, text: 'first term'}
          - {line: 8, kind: arrow, text: 'second term'}
        answer: true
    traps:
      A: 'You went for the option with a 2 and $K$ over $Q$. When you square $2r$ you get $4r^2$, not $2r^2$. And the last division is by $Q\pi$, so $K$ becomes $K$ over $\pi Q$.'
      C: 'You went for the option with a 2 and a plain $K$. Two slips: $2r$ squared is $4r^2$, and when you divide by $Q\pi$ you must divide the $K$ as well.'
      D: 'You went for the option ending in minus $K$. The first term is right, but dividing by $Q\pi$ divides every term, so the $K$ becomes $K$ over $\pi Q$.'
