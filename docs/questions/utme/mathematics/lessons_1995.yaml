      C: 'You went for 3.7. That is the mid-point of the class 3.5 to 3.9, with frequency 10. The highest frequency is 15, in the class 3.0 to 3.4.'
      D: 'You went for 4.2. That is the mid-point of the class 4.0 to 4.4, which has frequency 5. The modal class has the highest frequency, 15.'
  48:
    moments:
      - section: 'The question'
        say: 'Forty values in seven classes, and we want the middle one. Counting finds the class; a formula finds the spot inside it. Here is the table, with the class boundaries.'
        write: 'Median $= ?$ (to 1 decimal place)'
        diagram:
          id: t
          kind: table
          columns: ['Class boundaries', 'f', 'cf']
          rows: [['1.45 − 1.95', 2, ''], ['1.95 − 2.45', 1, ''], ['2.45 − 2.95', 4, ''], ['2.95 − 3.45', 15, ''], ['3.45 − 3.95', 10, ''], ['3.95 − 4.45', 5, ''], ['4.45 − 4.95', 3, '']]
          'on': 'table'
      - section: 'Solution'
        say: 'Solution. First the cumulative frequency, cf: a running total of $f$ down the table. 2, then 3, 7, 22, 32, 37 and 40.'
        write: 'Solution'
        diagram_do:
          - {id: t, op: total, part: 'col:2', into: 'col:3', 'on': 'cumulative'}
      - say: 'The last cf is the total frequency. So $N$, the sum of $f$, is 40.'
        write: '$N = \sum f = 40$'
      - say: 'Half of $N$ is 40 over 2, which is 20. The median is the 20th value.'
        write: '$\dfrac{N}{2} = \dfrac{40}{2} = 20$'
      - say: 'Go down the cf column to the first class whose cf reaches 20. 7 is too small, but 22 passes 20. So the median class is 2.95 to 3.45.'
        write: 'Median class: $2.95 - 3.45$'
        diagram_do:
          - {id: t, op: highlight, part: 'row:4', text: 'median class', 'on': 'median class'}
      - section: 'The formula'
        say: 'Now the median formula. Median equals $L_1$, plus $N$ over 2 minus cf, all over $f$, times $c$.'
        write: 'Median $= L_{1} + \left(\dfrac{\frac{N}{2} - cf}{f}\right) \times c$'
      - say: '$L_1$ is the lower class boundary of the median class: 2.95.'
        write: '$L_{1} = 2.95$'
        diagram_do:
          - {id: t, op: label, part: 'cell:4,1', text: 'L₁ = 2.95'}
      - say: 'cf is the cumulative frequency of the class before the median class: 7.'
        write: '$cf = 7$'
        diagram_do:
          - {id: t, op: label, part: 'cell:3,3', text: 'class before'}
      - say: '$f$ is the frequency of the median class itself: 15.'
        write: '$f = 15$'
      - say: '$c$ is the class width: the upper boundary minus the lower one. 3.45 minus 2.95 is 0.5.'
        write: '$c = 3.45 - 2.95 = 0.5$'
      - section: 'Substitute'
        say: 'Substitute the four values into the formula.'
        write: 'Median $= 2.95 + \left(\dfrac{20 - 7}{15}\right) \times 0.5$'
        point:
          - {line: 10, kind: move, from: {line: 6, at: '2.95'}, at: '[[2.95]] +', text: 'L₁'}
          - {line: 10, kind: move, from: {line: 7, at: '7'}, at: '20 − [[7]]', text: 'cf'}
          - {line: 10, kind: move, from: {line: 8, at: '15'}, at: '15', text: 'f'}
      - say: '20 minus 7 is 13. So we have 13 over 15, times 0.5.'
        write: '$= 2.95 + \dfrac{13}{15} \times 0.5$'
      - say: '13 over 15 times 0.5 is 6.5 over 15, which is about 0.433.'
        write: '$= 2.95 + 0.433$'
      - say: '2.95 plus 0.433 is 3.383.'
        write: '$= 3.383$'
      - say: 'To 1 decimal place, look at the second decimal digit. It is 8, which is 5 or more, so 3.3 rounds up to 3.4.'
        write: '$\therefore$ Median $= 3.4$ (1 d.p.)'
      - section: 'Check'
        say: 'Check: the median must lie inside the median class, between 2.95 and 3.45. 3.383 does. It is far along the class, because the 20th value is the 13th of its 15.'
        write: 'Check: $\ 2.95 < 3.383 < 3.45\ \checkmark$'
      - section: 'Answer'
        say: 'So the median, correct to 1 decimal place, is 3.4, which is option B.'
        write: '$\therefore$ Median $= 3.4$'
        answer: true
    traps:
      A: 'You went for 4.0. That lies in the class 3.95 to 4.45, two classes too far down. The cf reaches 20 in the class 2.95 to 3.45, and the formula gives 3.383, which is 3.4.'
      C: 'You went for 3.2. That is the class mark, the mid-point, of the median class. The class is right, but the formula places the median inside it: 2.95 plus 13 over 15 times 0.5 is 3.383, which is 3.4.'
      D: 'You went for 3.0. That is the lower class limit of the median class. The formula starts from the boundary 2.95 and adds 13 over 15 times 0.5: 3.383, which is 3.4.'

  49:
    moments:
      - say: '$P$ is a probability function on a set with four elements, $a_1$ to $a_4$. $P$ of $a_2$ and $P$ of $a_3$ are each 1 over 6, and $P$ of $a_4$ is 1 over 5. We want $P$ of $a_1$.'
        write: '$P(a_{2}) = P(a_{3}) = \dfrac{1}{6},\quad P(a_{4}) = \dfrac{1}{5}$'
      - say: 'The probabilities of all the possible outcomes always add up to 1.'
        write: 'Sum of all the probabilities $= 1$'
      - say: 'The probabilities of all the elements in a set must add up to exactly 1.'
        write: '$P(a_{1}) + P(a_{2}) + P(a_{3}) + P(a_{4}) = 1$'
      - say: 'So $P$ of $a_1$ is 1 minus the other three. Notice 1 over 6 is taken away twice, once for $a_2$ and once for $a_3$.'
        write: '$P(a_{1}) = 1 - \dfrac{1}{6} - \dfrac{1}{6} - \dfrac{1}{5}$'
        point:
          - {line: 2, kind: box, text: 'adds to 1'}
      - say: 'To subtract these, we need a common denominator. 6 and 5 both go into 30. Picture the whole probability, 1, as a bar of 30 pieces.'
        write: 'Common denominator: $30$'
        doodle: {name: 'custom:1995_q49_a', id: bar, caption: '1 whole = 30 pieces'}
      - say: '1 is 30 over 30. 1 over 6 is 5 over 30, because 6 times 5 is 30. And 1 over 5 is 6 over 30, because 5 times 6 is 30.'
        write: '$1 = \dfrac{30}{30},\quad \dfrac{1}{6} = \dfrac{5}{30},\quad \dfrac{1}{5} = \dfrac{6}{30}$'
      - say: 'Put those into the subtraction: colour 5 pieces for $a_2$, 5 for $a_3$ and 6 for $a_4$.'
        write: '$P(a_{1}) = \dfrac{30}{30} - \dfrac{5}{30} - \dfrac{5}{30} - \dfrac{6}{30}$'
        point:
          - {line: 5, kind: arrow, text: 'over 30'}
        doodle_do:
          - {id: bar, op: stage, stage: 'custom:1995_q49_a2'}
      - say: '30 minus 5 is 25, minus 5 is 20, minus 6 is 14. So 14 pieces are left for $a_1$: 14 over 30.'
        write: '$= \dfrac{30 - 5 - 5 - 6}{30} = \dfrac{14}{30}$'
        doodle_do:
          - {id: bar, op: label, part: rest, text: '14 left'}
      - say: 'Divide the top and the bottom by 2. 14 divided by 2 is 7, and 30 divided by 2 is 15.'
        write: '$= \dfrac{7}{15}$'
      - say: 'Check: 7 over 15 is 14 over 30. And 14 plus 5 plus 5 plus 6 is 30, so all four probabilities add to 30 over 30, which is 1.'
        write: 'Check: $\dfrac{14 + 5 + 5 + 6}{30} = \dfrac{30}{30} = 1$'
      - say: 'So $P$ of $a_1$ is 7 over 15, which is answer choice A.'
        write: '$P(a_{1}) = \dfrac{7}{15}$'
        answer: true
    traps:
      B: 'You went for 2 over 3. That is 1 minus the two 1 over 6 terms only; the 1 over 5 for $a_4$ was left out. Take away all three: 30 minus 5 minus 5 minus 6, over 30, is 7 over 15.'
      C: 'You went for 1 over 3. That is the two 1 over 6 terms added together, which is the probability of $a_2$ or $a_3$. We want what is left for $a_1$ after all three are taken from 1.'
      D: 'You went for 3 over 10. Check the common denominator: 1 over 6 is 5 over 30 and 1 over 5 is 6 over 30. 30 minus 16 is 14, so the answer is 14 over 30, or 7 over 15.'

  50:
    moments:
      - say: 'A die has four white faces and two black faces. Here it is, about to be thrown twice. We want the probability that the top face is white both times.'
        write: 'White faces $= 4$, black faces $= 2$'
        doodle: {name: 'custom:1995_q50_a', id: die, caption: '4 white faces, 2 black; thrown twice'}
      - say: 'Let me draw a tree diagram, so we can see every outcome.'
        show_sketch: true
        point:
          - {figure: sketch, kind: underline, target: '1st throw'}
          - {figure: sketch, kind: underline, target: '2nd throw'}
      - say: 'The probability of an event is the number of favourable outcomes over the total number of outcomes.'
        write: '$P(\text{event}) = \dfrac{\text{number of favourable outcomes}}{\text{total number of outcomes}}$'
      - say: 'First, one throw. Look at the die: there are 6 faces, and 4 of them are white. So the probability of white is 4 out of 6.'
        write: '$P(\text{white}) = \dfrac{4}{6}$'
        point:
          - {figure: sketch, kind: circle, target: {x: 77, y: 88}, text: 'white: 2/3'}
        doodle_do:
          - {id: die, op: highlight, part: white, text: '4 of 6'}
      - say: 'Simplify by dividing the top and bottom by 2. 4 over 6 is 2 over 3.'
        write: '$= \dfrac{2}{3}$'
      - say: 'The two throws don''t affect each other. They are independent events.'
        write: 'Two throws: independent'
      - say: 'For independent events, the probability of both happening is the product of their probabilities.'
        write: 'Independent: $P(A \text{ and } B) = P(A) \times P(B)$'
      - say: 'The die is thrown twice, and the probability that both throws are white is the product of their probabilities. So white, then white again, is 2 over 3 times 2 over 3.'
        write: '$P(\text{white, white}) = \dfrac{2}{3} \times \dfrac{2}{3}$'
        point:
          - {line: 5, kind: underline, at: 'independent', text: 'so multiply'}
          - {line: 7, kind: move, from: {line: 4, at: '32'}, at: '[[32]]×', text: 'one throw'}
          - {line: 7, kind: move, from: {line: 4, at: '32'}, at: '×[[32]]', text: 'and again'}
        doodle_do:
          - {id: die, op: pulse, part: twice}
      - say: 'Multiply the tops: 2 times 2 is 4. Multiply the bottoms: 3 times 3 is 9.'
        write: '$= \dfrac{2 \times 2}{3 \times 3} = \dfrac{4}{9}$'
        point:
          - {figure: sketch, kind: circle, target: {x: 250, y: 40}, text: 'white, white'}
      - say: 'Does that make sense? Getting white twice should be less likely than getting it once. 4 over 9 is about 0.44, and 2 over 3 is about 0.67.'
        write: 'Check: $\dfrac{4}{9} \approx 0.44 < \dfrac{2}{3} \approx 0.67$'
      - say: 'Another way to see it, with the die thrown twice: there are 6 times 6, which is 36, equally likely pairs of faces, and 4 times 4, which is 16, of them are white both times. 16 over 36 is 4 over 9.'
        write: 'Check: $\dfrac{4 \times 4}{6 \times 6} = \dfrac{16}{36} = \dfrac{4}{9}$'
        doodle_do:
          - {id: die, op: label, part: die, text: '16 of 36 pairs'}
      - say: 'So the probability is 4 over 9, which is answer choice C.'
        write: '$P(\text{white both times}) = \dfrac{4}{9}$'
        answer: true
        point:
          - {figure: sketch, kind: circle, target: 'both white: ?', text: '4/9'}
    traps:
      A: 'You went for 2 over 3. That is the probability of white on one throw. For both throws, multiply 2 over 3 by 2 over 3 to get 4 over 9.'
      B: 'You went for 1 over 9. That is 1 over 3 times 1 over 3, the probability of black twice. We want white, which is 2 over 3 each time.'
      D: 'You went for 1 over 36. That is the probability of one particular face twice, 1 over 6 times 1 over 6. There are four white faces, so each throw has a probability of 2 over 3.'
