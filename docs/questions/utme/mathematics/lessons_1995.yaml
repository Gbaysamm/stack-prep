      - say: 'Multiply both sides by 30 to get $h$ by itself.'
        write: '$h = 30\tan 60^{\circ}$'
      - say: 'The tangent of 60 degrees is root 3.'
        write: '$\tan 60^{\circ} = \sqrt{3}$'
        point:
