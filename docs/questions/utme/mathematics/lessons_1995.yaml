          - {figure: 0, kind: strike, target: B}
          - {figure: 0, kind: strike, target: D}
      - say: 'A and C both pass through the origin. Which way does our curve go next? Put $x$ = pi over 2. Sine of pi over 2 is 1, so $y$ is 3 times 1, which is 3.'
        write: '$x = \tfrac{\pi}{2}:\ y = 3\sin\tfrac{\pi}{2} = 3 \times 1 = 3$'
        point:
          - {figure: 0, kind: circle, target: {x: 90, y: 65}, text: 'origin'}
          - {figure: 0, kind: circle, target: {x: 90, y: 210}, text: 'origin'}
      - say: 'So going right from the origin, the curve must rise up to 3.'
        write: 'Rises to $3$ at $x = \tfrac{\pi}{2}$'
      - say: 'Now the left side. At minus pi over 2, sine is minus 1, so $y$ is 3 times minus 1, which is minus 3.'
        write: '$x = -\tfrac{\pi}{2}:\ y = 3\sin\left(-\tfrac{\pi}{2}\right) = -3$'
      - say: 'Graph A falls after the origin, down to minus 3. That is the curve $y = -3\sin x$, so A is out.'
        write: 'A: falls to $-3$, so $y = -3\sin x$'
        point:
          - {line: 8, kind: strike, at: 'y = −3sinx', text: 'not this'}
          - {figure: 0, kind: strike, target: A}
      - say: 'Graph C rises to plus 3 on the right and falls to minus 3 on the left. That matches everything we found.'
        write: 'C: $0$ at the origin, $3$ at $\tfrac{\pi}{2}$, $-3$ at $-\tfrac{\pi}{2}$'
        point:
          - {figure: 0, kind: label, target: {x: 122, y: 170}, text: '3 at π/2'}
          - {figure: 0, kind: label, target: {x: 58, y: 250}, text: '−3 at −π/2'}
      - say: 'So the sketch of $y = 3\sin x$ is graph C, which is answer choice C.'
        write: 'Graph C: $y = 3\sin x$'
        answer: true
        point:
          - {figure: 0, kind: circle, target: C, text: 'y = 3 sin x'}
    traps:
      A: 'You went for graph A. It passes through the origin, but it falls first. $y = 3\sin x$ rises to 3 at pi over 2, so A is $y = -3\sin x$.'
      B: 'You went for graph B. It is at 3 when $x$ is 0, but sine of 0 is 0. Graph B is $y = 3\cos x$.'
      D: 'You went for graph D. It is at minus 3 when $x$ is 0, but $y = 3\sin x$ is 0 there. Graph D is $y = -3\cos x$.'

  38:
    moments:
      - say: 'We want the derivative of cosec $x$.'
        write: '$\dfrac{d}{dx}\left(\operatorname{cosec} x\right)$'
      - say: 'Cosec $x$ is 1 over sine $x$. We can write that as sine $x$ to the power minus 1.'
        write: '$\operatorname{cosec} x = \dfrac{1}{\sin x} = (\sin x)^{-1}$'
      - say: 'This is a function inside a power, so we use the chain rule: bring the power down, reduce the power by one, then multiply by the derivative of the inside.'
        write: 'Chain rule: $\dfrac{d}{dx}u^{n} = nu^{n-1}\dfrac{du}{dx}$'
      - say: 'Here the inside is sine $x$, and its derivative is cos $x$.'
        write: '$u = \sin x,\quad \dfrac{du}{dx} = \cos x$'
      - say: 'The power is minus 1. Bring it down, and the new power is minus 1 minus 1, which is minus 2.'
        write: '$\dfrac{d}{dx}(\sin x)^{-1} = -1(\sin x)^{-2} \times \cos x$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
          - {line: 4, kind: move, from: {line: 4, at: '(sinx)[[−1]] ='}, at: '= [[−1]](sinx)', text: 'power down'}
          - {line: 4, kind: move, from: {line: 3, at: 'cosx'}, at: 'cosx', text: 'du/dx'}
      - say: 'Sine $x$ to the minus 2 means 1 over sine squared $x$. So this is minus cos $x$ over sine squared $x$.'
        write: '$= -\dfrac{\cos x}{\sin^{2}x}$'
      - say: 'Now split the fraction: cos $x$ over sine $x$, times 1 over sine $x$.'
        write: '$= -\dfrac{\cos x}{\sin x} \times \dfrac{1}{\sin x}$'
      - say: 'Cos $x$ over sine $x$ is cot $x$, and 1 over sine $x$ is cosec $x$.'
        write: '$\dfrac{\cos x}{\sin x} = \cot x,\quad \dfrac{1}{\sin x} = \operatorname{cosec} x$'
      - say: 'So the derivative is minus cot $x$ times cosec $x$.'
        write: '$= -\cot x \operatorname{cosec} x$'
      - say: 'A handy pattern to remember: every "co" function, that is cos, cot and cosec, has a minus sign in its derivative.'
      - say: 'So the derivative of cosec $x$ is minus cot $x$ cosec $x$, which is answer choice B.'
        write: '$\dfrac{d}{dx}\left(\operatorname{cosec} x\right) = -\cot x \operatorname{cosec} x$'
        answer: true
    traps:
      A: 'You went for tan $x$ cosec $x$. There must be a minus sign, which comes from bringing down the power minus 1. And the cos over sine gives cot, not tan.'
      C: 'You went for tan $x$ sec $x$. That is the derivative of sec $x$. For cosec $x$, write it as sine $x$ to the minus 1 and you get minus cot $x$ cosec $x$.'
      D: 'You went for minus cot $x$ sec $x$. The minus and the cot are right, but 1 over sine $x$ is cosec $x$, not sec $x$.'
  39:
    moments:
      - say: 'We want the value of $x$ where the tangent to $y = x^2 - 4x + 3$ is parallel to the $x$-axis.'
        write: '$y = x^{2} - 4x + 3$'
      - say: 'Let me sketch the graph, so we can see its shape.'
        show_sketch: true
      - say: 'A line parallel to the $x$-axis is flat, and a flat line has gradient zero.'
        write: 'Parallel to the $x$-axis: gradient $= 0$'
        point:
          - {figure: sketch, kind: underline, target: 'gradient 0', text: 'flat'}
      - say: 'The gradient of a curve at any point is its derivative. So we differentiate, and set the derivative equal to zero.'
        write: '$\dfrac{dy}{dx} = 0$'
      - say: 'The power rule for differentiating: bring the power down in front, then take one off the power.'
        write: '$\dfrac{d}{dx}\left(x^{n}\right) = nx^{n - 1}$'
      - say: 'Differentiate term by term. $x$ squared gives $2x$: bring the 2 down and reduce the power by one.'
        write: '$\dfrac{d}{dx}(x^{2}) = 2x$'
        point:
          - {line: 5, kind: move, from: {line: 5, at: '(x[[2]])'}, at: '= [[2]]x', text: 'power down'}
      - say: 'Minus $4x$ gives minus 4, and the constant 3 gives zero.'
        write: '$\dfrac{d}{dx}(-4x) = -4,\quad \dfrac{d}{dx}(3) = 0$'
      - say: 'So the derivative is $2x$ minus 4.'
        write: '$\dfrac{dy}{dx} = 2x - 4$'
      - say: 'Set that equal to zero.'
        write: '$2x - 4 = 0$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '2x − 4'}, at: '2x − 4', text: 'derivative'}
          - {line: 2, kind: underline, at: 'gradient = 0', text: 'flat'}
      - say: 'Add 4 to both sides.'
        write: '$2x = 4$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '− 4'}, at: '4', text: 'across the ='}
      - say: 'Divide both sides by 2. 4 divided by 2 is 2.'
        write: '$x = 2$'
        point:
          - {figure: sketch, kind: label, target: 'x = ?', text: 'x = 2'}
      - say: 'This is the vertex of the parabola, its lowest point, where the tangent lies flat. The vertex formula agrees: minus $b$ over $2a$ is 4 over 2, which is 2.'
        write: 'Check: $x = -\dfrac{b}{2a} = \dfrac{4}{2} = 2$'
        point:
          - {figure: sketch, kind: circle, target: {x: 180, y: 205}, text: 'lowest point'}
      - say: 'So the tangent is parallel to the $x$-axis when $x$ is 2, which is answer choice B.'
        write: 'Flat tangent at $x = 2$'
        answer: true
    traps:
      A: 'You went for 3. That is where the curve crosses the $x$-axis, a root. The question wants where the tangent is flat, where $2x - 4 = 0$.'
      C: 'You went for 1. That is a root of the curve, where it crosses the axis. The flat tangent is at the vertex, $x = 2$.'
      D: 'You went for 0. At $x = 0$ the gradient is 2 times 0 minus 4, which is minus 4, not zero. Solving $2x - 4 = 0$ gives 2.'

  40:
    moments:
      - say: 'We are given $dy$ by $dx$ equals $4x - 3$, and $y = 5$ when $x = 2$. We want $y$ in terms of $x$.'
        write: '$\dfrac{dy}{dx} = 4x - 3$'
      - say: 'We know the gradient and we want the function itself. Going backwards from a derivative means integrating.'
        write: '$y = \displaystyle\int (4x - 3)\,dx$'
      - say: 'The rule for integrating a power of $x$: add one to the power, then divide by the new power.'
        write: '$\displaystyle\int x^{n}\,dx = \dfrac{x^{n + 1}}{n + 1} + c$'
      - say: 'For $4x$: raise the power of $x$ from 1 to 2, and divide by the new power. 4 over 2 is 2, so we get $2x^2$.'
        write: '$\displaystyle\int 4x\,dx = \dfrac{4x^{2}}{2} = 2x^{2}$'
      - say: 'The constant minus 3 integrates to minus $3x$.'
        write: '$\displaystyle\int (-3)\,dx = -3x$'
      - say: 'And we must add a constant of integration, $c$, because any constant disappears when you differentiate. Picture a whole family of curves, the same shape shifted up or down: one for every $c$.'
        write: '$y = 2x^{2} - 3x + c$'
        doodle: {name: 'custom:1995_q40_a', id: family, caption: 'which c goes through (2, 5)?'}
      - say: 'To find $c$, use the fact that $y = 5$ when $x = 2$: that point pins down one curve of the family. Put those into the equation we just found.'
        write: '$5 = 2(2)^{2} - 3(2) + c$'
        point:
          - {line: 5, kind: arrow, text: 'sub in'}
        doodle_do:
          - {id: family, op: circle, part: pin}
      - say: '2 squared is 4, and 2 times 4 is 8. 3 times 2 is 6.'
        write: '$5 = 8 - 6 + c$'
      - say: '8 minus 6 is 2.'
        write: '$5 = 2 + c$'
      - say: 'Subtract 2 from both sides. 5 minus 2 is 3. So the pinned curve is the one with $c$ equal to 3.'
        write: '$c = 5 - 2 = 3$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '2 +'}, at: '− 2', text: 'across the ='}
        doodle_do:
          - {id: family, op: highlight, part: chosen, text: 'c = 3'}
      - say: 'Check with $c = 3$: at $x = 2$, 8 minus 6 plus 3 is 5. Good.'
        write: 'Check: $2(4) - 3(2) + 3 = 8 - 6 + 3 = 5$'
      - say: 'So $y$ equals $2x^2 - 3x + 3$, which is answer choice B.'
        write: '$y = 2x^{2} - 3x + 3$'
        point:
          - {line: 11, kind: move, from: {line: 9, at: '= 3'}, at: '+ 3', text: 'c'}
        answer: true
    traps:
      A: 'You went for $2x^2 - 3x + 5$. That uses the given $y$ value 5 as the constant. Put $x = 2$ in: 8 minus 6 plus 5 is 7, not 5. Solving for $c$ gives 3.'
      C: 'You went for $2x^2 - 3x$. That forgets the constant. At $x = 2$ it gives 8 minus 6, which is 2, not 5. So we need $c = 3$.'
      D: 'You went for 4. That is not a function of $x$ at all. Integrate $4x - 3$ to get $2x^2 - 3x + c$, then find $c$.'

  41:
    moments:
      - say: 'We want the area bounded by the curve $y = 3x^2 - 2x + 1$, the lines $x = 1$ and $x = 3$, and the $x$-axis.'
        write: '$y = 3x^{2} - 2x + 1,\quad x = 1 \text{ to } x = 3$'
      - say: 'Let me sketch the graph, so we can see its shape.'
        show_sketch: true
        point:
          - {figure: sketch, kind: underline, target: 'y = 3x² − 2x + 1'}
          - {figure: sketch, kind: circle, target: '1'}
          - {figure: sketch, kind: circle, target: '3'}
      - say: 'The area between a curve and the $x$-axis is a definite integral, from the lower line $x = 1$ to the upper line $x = 3$.'
        write: 'Area $= \displaystyle\int_{1}^{3} (3x^{2} - 2x + 1)\,dx$'
        point:
          - {figure: sketch, kind: highlight, target: 'Area = ?'}
      - say: 'Quick check that the curve stays above the axis, so no part of the area cancels. The discriminant $b^2 - 4ac$ is minus 2 squared, minus 4 times 3 times 1: that is 4 minus 12, which is minus 8.'
        write: '$b^{2} - 4ac = (-2)^{2} - 4(3)(1) = 4 - 12 = -8$'
        point:
          - {figure: sketch, kind: circle, target: 'x', text: 'the axis'}
      - say: 'It is negative, so the curve never meets the axis, and it stays above it.'
        write: '$-8 < 0$: curve always above the axis'
        point:
          - {figure: sketch, kind: label, target: 'y = 3x² − 2x + 1', text: 'never meets the axis'}
      - say: 'The rule for integrating a power of $x$: add one to the power, then divide by the new power.'
        write: '$\displaystyle\int x^{n}\,dx = \dfrac{x^{n + 1}}{n + 1} + c$'
      - say: 'Now integrate term by term. $3x^2$ becomes $3x^3$ over 3, which is $x^3$.'
        write: '$\displaystyle\int 3x^{2}\,dx = \dfrac{3x^{3}}{3} = x^{3}$'
      - say: 'Minus $2x$ becomes minus $2x^2$ over 2, which is minus $x^2$. And 1 becomes $x$.'
        write: '$\displaystyle\int (-2x)\,dx = -\dfrac{2x^{2}}{2} = -x^{2},\quad \displaystyle\int 1\,dx = x$'
      - say: 'So the area is $x^3 - x^2 + x$, evaluated from 1 to 3.'
        write: 'Area $= \Big[x^{3} - x^{2} + x\Big]_{1}^{3}$'
      - say: 'Put in the limits: the value at the top limit, 3, minus the value at the bottom limit, 1.'
        write: '$= (3^{3} - 3^{2} + 3) - (1^{3} - 1^{2} + 1)$'
        point:
          - {line: 8, kind: arrow, text: 'limits in'}
      - say: '3 cubed is 27 and 3 squared is 9. 1 cubed and 1 squared are both 1.'
        write: '$= (27 - 9 + 3) - (1 - 1 + 1)$'
      - say: 'The first bracket is 27 minus 9 plus 3, which is 21. The second is 1 minus 1 plus 1, which is 1.'
        write: '$= 21 - 1$'
      - say: '21 minus 1 is 20.'
        write: '$= 20$'
      - say: 'So the area is 20 square units, which is answer choice D.'
        write: 'Area $= 20$ square units'
        answer: true
        point:
          - {figure: sketch, kind: label, target: 'Area = ?', text: '20'}
    traps:
      A: 'You went for 24. Check the integration: $3x^2$ integrates to $x^3$, and $-2x$ to $-x^2$. That gives 21 at the top and 1 at the bottom, so 20.'
      B: 'You went for 22. Check the signs: at $x = 3$ it is 27 minus 9 plus 3, which is 21, and at $x = 1$ it is 1. 21 minus 1 is 20.'
      C: 'You went for 21. That is the value at the upper limit only. You must also subtract the value at the lower limit, which is 1, giving 20.'
