  38:
    moments:
      - say: 'We want the derivative of cosec $x$.'
        write: '$\dfrac{d}{dx}\left(\operatorname{cosec} x\right)$'
      - say: 'Cosec $x$ is 1 over sine $x$. We can write that as sine $x$ to the power minus 1.'
        write: '$\operatorname{cosec} x = \dfrac{1}{\sin x} = (\sin x)^{-1}$'
      - say: 'This is a function inside a power, so we use the chain rule: bring the power down, reduce the power by one, then multiply by the derivative of the inside.'
        write: 'Chain rule: $\dfrac{d}{dx}u^{n} = nu^{n-1}\dfrac{du}{dx}$'
      - say: 'Here the inside is sine $x$, and its derivative is cos $x$.'
        write: '$u = \sin x,\quad \dfrac{du}{dx} = \cos x$'
      - say: 'The power is minus 1. Bring it down, and the new power is minus 1 minus 1, which is minus 2.'
        write: '$\dfrac{d}{dx}(\sin x)^{-1} = -1(\sin x)^{-2} \times \cos x$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
          - {line: 4, kind: move, from: {line: 4, at: '(sinx)[[−1]] ='}, at: '= [[−1]](sinx)', text: 'power down'}
          - {line: 4, kind: move, from: {line: 3, at: 'cosx'}, at: 'cosx', text: 'du/dx'}
      - say: 'Sine $x$ to the minus 2 means 1 over sine squared $x$. So this is minus cos $x$ over sine squared $x$.'
        write: '$= -\dfrac{\cos x}{\sin^{2}x}$'
      - say: 'Now split the fraction: cos $x$ over sine $x$, times 1 over sine $x$.'
        write: '$= -\dfrac{\cos x}{\sin x} \times \dfrac{1}{\sin x}$'
      - say: 'Cos $x$ over sine $x$ is cot $x$, and 1 over sine $x$ is cosec $x$.'
        write: '$\dfrac{\cos x}{\sin x} = \cot x,\quad \dfrac{1}{\sin x} = \operatorname{cosec} x$'
      - say: 'So the derivative is minus cot $x$ times cosec $x$.'
        write: '$= -\cot x \operatorname{cosec} x$'
      - say: 'A handy pattern to remember: every "co" function, that is cos, cot and cosec, has a minus sign in its derivative.'
      - say: 'So the derivative of cosec $x$ is minus cot $x$ cosec $x$, which is answer choice B.'
        write: '$\dfrac{d}{dx}\left(\operatorname{cosec} x\right) = -\cot x \operatorname{cosec} x$'
        answer: true
    traps:
      A: 'You went for tan $x$ cosec $x$. There must be a minus sign, which comes from bringing down the power minus 1. And the cos over sine gives cot, not tan.'
      C: 'You went for tan $x$ sec $x$. That is the derivative of sec $x$. For cosec $x$, write it as sine $x$ to the minus 1 and you get minus cot $x$ cosec $x$.'
      D: 'You went for minus cot $x$ sec $x$. The minus and the cot are right, but 1 over sine $x$ is cosec $x$, not sec $x$.'
