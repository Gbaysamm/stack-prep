        write: '$= 30^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: POQ, text: '30°'}
      - say: 'The distance is that angle''s share of the whole circumference: theta over 360, times $2\pi R$.'
        write: 'Distance $= \dfrac{\theta}{360^{\circ}} \times 2\pi R$'
        point:
          - {figure: sketch, kind: arc, target: 'PQ', text: '30/360 of the circle'}
      - say: 'Put in theta = 30, pi = 22 over 7, and $R$ = 7,000.'
        write: '$= \dfrac{30}{360} \times 2 \times \dfrac{22}{7} \times 7000$'
