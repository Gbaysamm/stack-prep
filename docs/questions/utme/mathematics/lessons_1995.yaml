        write: 'Commutative: $a * b = b * a$ for all $a,\ b$'
      - say: 'Option A: $a * b$ is $a + 2b$. With $a = 1$ and $b = 2$, that is 1 plus 2 times 2, which is 1 plus 4, or 5.'
        write: 'A: $1 * 2 = 1 + 2(2) = 5$'
      - say: 'Swap them: $2 * 1$ is 2 plus 2 times 1, which is 4. 5 and 4 are different, so A is not commutative.'
        write: '$2 * 1 = 2 + 2(1) = 4 \neq 5$'
