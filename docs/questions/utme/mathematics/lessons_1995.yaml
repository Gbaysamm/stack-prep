  49:
    moments:
      - say: '$P$ is a probability function on a set with four elements, $a_1$ to $a_4$. $P$ of $a_2$ and $P$ of $a_3$ are each 1 over 6, and $P$ of $a_4$ is 1 over 5. We want $P$ of $a_1$.'
        write: '$P(a_{2}) = P(a_{3}) = \dfrac{1}{6},\quad P(a_{4}) = \dfrac{1}{5}$'
      - say: 'The probabilities of all the possible outcomes always add up to 1.'
        write: 'Sum of all the probabilities $= 1$'
      - say: 'The probabilities of all the elements in a set must add up to exactly 1.'
        write: '$P(a_{1}) + P(a_{2}) + P(a_{3}) + P(a_{4}) = 1$'
      - say: 'So $P$ of $a_1$ is 1 minus the other three. Notice 1 over 6 is taken away twice, once for $a_2$ and once for $a_3$.'
        write: '$P(a_{1}) = 1 - \dfrac{1}{6} - \dfrac{1}{6} - \dfrac{1}{5}$'
        point:
          - {line: 2, kind: box, text: 'adds to 1'}
      - say: 'To subtract these, we need a common denominator. 6 and 5 both go into 30.'
        write: 'Common denominator: $30$'
      - say: '1 is 30 over 30. 1 over 6 is 5 over 30, because 6 times 5 is 30. And 1 over 5 is 6 over 30, because 5 times 6 is 30.'
        write: '$1 = \dfrac{30}{30},\quad \dfrac{1}{6} = \dfrac{5}{30},\quad \dfrac{1}{5} = \dfrac{6}{30}$'
      - say: 'Put those into the subtraction.'
        write: '$P(a_{1}) = \dfrac{30}{30} - \dfrac{5}{30} - \dfrac{5}{30} - \dfrac{6}{30}$'
        point:
          - {line: 5, kind: arrow, text: 'over 30'}
      - say: '30 minus 5 is 25, minus 5 is 20, minus 6 is 14. So we have 14 over 30.'
        write: '$= \dfrac{30 - 5 - 5 - 6}{30} = \dfrac{14}{30}$'
      - say: 'Divide the top and the bottom by 2. 14 divided by 2 is 7, and 30 divided by 2 is 15.'
        write: '$= \dfrac{7}{15}$'
      - say: 'Check: 7 over 15 is 14 over 30. And 14 plus 5 plus 5 plus 6 is 30, so all four probabilities add to 30 over 30, which is 1.'
        write: 'Check: $\dfrac{14 + 5 + 5 + 6}{30} = \dfrac{30}{30} = 1$'
      - say: 'So $P$ of $a_1$ is 7 over 15, which is answer choice A.'
        write: '$P(a_{1}) = \dfrac{7}{15}$'
        answer: true
    traps:
      B: 'You went for 2 over 3. That is 1 minus the two 1 over 6 terms only; the 1 over 5 for $a_4$ was left out. Take away all three: 30 minus 5 minus 5 minus 6, over 30, is 7 over 15.'
      C: 'You went for 1 over 3. That is the two 1 over 6 terms added together, which is the chance of $a_2$ or $a_3$. We want what is left for $a_1$ after all three are taken from 1.'
      D: 'You went for 3 over 10. Check the common denominator: 1 over 6 is 5 over 30 and 1 over 5 is 6 over 30. 30 minus 16 is 14, so the answer is 14 over 30, or 7 over 15.'

  50:
    moments:
      - say: 'A die has four white faces and two black faces. It is thrown twice. We want the probability that the top face is white both times.'
        write: 'White faces $= 4$, black faces $= 2$'
        doodle: {name: 'custom:1995_q50_a', caption: '4 white faces, 2 black; thrown twice'}
      - say: 'Let me draw a tree diagram, so we can see every outcome.'
        show_sketch: true
        point:
          - {figure: sketch, kind: underline, target: '1st throw'}
          - {figure: sketch, kind: underline, target: '2nd throw'}
      - say: 'The probability of an event is the number of favourable outcomes over the total number of outcomes.'
        write: '$P(\text{event}) = \dfrac{\text{number of favourable outcomes}}{\text{total number of outcomes}}$'
      - say: 'First, one throw. There are 6 faces, and 4 of them are white. So the chance of white is 4 out of 6.'
        write: '$P(\text{white}) = \dfrac{4}{6}$'
        point:
          - {figure: sketch, kind: circle, target: {x: 77, y: 88}, text: 'white: 2/3'}
      - say: 'Simplify by dividing the top and bottom by 2. 4 over 6 is 2 over 3.'
        write: '$= \dfrac{2}{3}$'
      - say: 'The two throws don''t affect each other. They are independent events.'
        write: 'Two throws: independent'
      - say: 'For independent events, the probability of both happening is the product of their probabilities.'
        write: 'Independent: $P(A \text{ and } B) = P(A) \times P(B)$'
      - say: 'For independent events, the chance that both happen is the product of their chances. So white, then white again, is 2 over 3 times 2 over 3.'
        write: '$P(\text{white, white}) = \dfrac{2}{3} \times \dfrac{2}{3}$'
        point:
          - {line: 5, kind: underline, at: 'independent', text: 'so multiply'}
          - {line: 7, kind: move, from: {line: 4, at: '32'}, at: '[[32]]×', text: 'one throw'}
          - {line: 7, kind: move, from: {line: 4, at: '32'}, at: '×[[32]]', text: 'and again'}
      - say: 'Multiply the tops: 2 times 2 is 4. Multiply the bottoms: 3 times 3 is 9.'
        write: '$= \dfrac{2 \times 2}{3 \times 3} = \dfrac{4}{9}$'
        point:
          - {figure: sketch, kind: circle, target: {x: 250, y: 40}, text: 'white, white'}
      - say: 'Does that make sense? Getting white twice should be less likely than getting it once. 4 over 9 is about 0.44, and 2 over 3 is about 0.67.'
        write: 'Check: $\dfrac{4}{9} \approx 0.44 < \dfrac{2}{3} \approx 0.67$'
      - say: 'Another way to see it: there are 6 times 6, which is 36, equally likely pairs of faces, and 4 times 4, which is 16, of them are white both times. 16 over 36 is 4 over 9.'
        write: 'Check: $\dfrac{4 \times 4}{6 \times 6} = \dfrac{16}{36} = \dfrac{4}{9}$'
      - say: 'So the probability is 4 over 9, which is answer choice C.'
        write: '$P(\text{white both times}) = \dfrac{4}{9}$'
        answer: true
        point:
          - {figure: sketch, kind: circle, target: 'both white: ?', text: '4/9'}
    traps:
      A: 'You went for 2 over 3. That is the chance of white on one throw. For both throws, multiply 2 over 3 by 2 over 3 to get 4 over 9.'
      B: 'You went for 1 over 9. That is 1 over 3 times 1 over 3, the chance of black twice. We want white, which is 2 over 3 each time.'
      D: 'You went for 1 over 36. That is the chance of one particular face twice, 1 over 6 times 1 over 6. There are four white faces, so each throw has a 2 over 3 chance.'
