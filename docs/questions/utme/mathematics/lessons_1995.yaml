# UTME 1995 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1995.yaml. Answers match that file.
format_version: 1
exam_year: 1995
lessons:
  1:
    moments:
      - say: 'We are asked to work out $3310_5$ minus $1442_5$. Both numbers are written in base 5.'
        write: '$3310_{5} - 1442_{5}$'
      - say: 'Borrowing in fives is easy to get wrong. So here is the plan: change both numbers to base ten, subtract there, then change the answer back to base 5.'
        write: 'Plan: base 5 $\to$ base 10 $\to$ base 5'
      - say: 'In base 5 the place values, from the right, are 1, then 5, then 5 squared which is 25, then 5 cubed which is 125.'
        write: 'Place values: $125,\ 25,\ 5,\ 1$'
      - say: 'So $3310_5$ is 3 lots of 125, 3 lots of 25, 1 lot of 5 and 0 ones.'
        write: '$3310_{5} = 3(125) + 3(25) + 1(5) + 0(1)$'
      - say: '3 times 125 is 375. 3 times 25 is 75. 1 times 5 is 5.'
        write: '$= 375 + 75 + 5 + 0$'
      - say: '375 plus 75 is 450, and 450 plus 5 is 455.'
        write: '$= 455$'
      - say: 'Now the second number, in the same way. $1442_5$ is 1 lot of 125, 4 lots of 25, 4 lots of 5 and 2 ones.'
        write: '$1442_{5} = 1(125) + 4(25) + 4(5) + 2(1)$'
      - say: '1 times 125 is 125. 4 times 25 is 100. 4 times 5 is 20. And then the 2.'
        write: '$= 125 + 100 + 20 + 2$'
      - say: '125 plus 100 is 225, plus 20 is 245, plus 2 is 247.'
        write: '$= 247$'
      - say: 'Now subtract in base ten, using the 455 and the 247 we just found. 455 minus 247 is 208.'
        write: '$455 - 247 = 208$'
        point:
          - {line: 9, kind: move, from: {line: 5, at: '455'}, at: '455', text: 'found here'}
          - {line: 9, kind: move, from: {line: 8, at: '247'}, at: '247', text: 'and here'}
      - say: 'To turn 208 back into base 5, we keep dividing by 5 and write down each remainder. 208 divided by 5 is 41, remainder 3.'
        write: '$208 \div 5 = 41\ \text{r}\ 3$'
      - say: 'Now divide that 41 by 5. That is 8, remainder 1.'
        write: '$41 \div 5 = 8\ \text{r}\ 1$'
      - say: 'Then 8 divided by 5 is 1, remainder 3.'
        write: '$8 \div 5 = 1\ \text{r}\ 3$'
      - say: 'And 1 divided by 5 is 0, remainder 1. We stop once we reach zero.'
        write: '$1 \div 5 = 0\ \text{r}\ 1$'
      - say: 'Read the remainders from the bottom up: 1, 3, 1, 3. So 208 is $1313_5$.'
        write: '$208 = 1313_{5}$'
      - say: 'Let''s check by going back to base ten. 1 times 125, plus 3 times 25, plus 1 times 5, plus 3, is 125 plus 75 plus 5 plus 3, which is 208.'
        write: 'Check: $1313_{5} = 125 + 75 + 5 + 3 = 208$'
      - say: 'So $3310_5$ minus $1442_5$ is $1313_5$, which is answer choice A.'
        write: '$3310_{5} - 1442_{5} = 1313_{5}$'
        answer: true
    traps:
      B: 'You went for $2113_5$. That is 283 in base ten, not 208. A borrowing slip in base 5 usually causes this; going through base ten and checking at the end avoids it.'
      C: 'You went for $4302_5$. That is 577 in base ten, far more than 208. Always convert your answer back to base ten to check it.'
      D: 'You went for $1103_5$. That is 153 in base ten, not 208. Read the remainders carefully from the bottom up: 1, 3, 1, 3.'

  2:
    moments:
      - say: 'We are asked to write 3.1415926 correct to 5 decimal places.'
        write: '$3.1415926$'
      - say: 'Five decimal places means we keep exactly five digits after the point. Then the next digit decides whether the last one rounds up.'
        write: 'Keep 5 digits after the point'
      - say: 'Let''s count the digits after the point: 1, 4, 1, 5, 9. Those are the five we keep.'
        write: 'Five digits: $3.14159\,|\,26$'
      - say: 'The digit straight after them, the sixth one, is 2. That is the digit that decides.'
        write: 'Next digit $= 2$'
      - say: 'Here is the rule. If the next digit is 5 or more, the last kept digit goes up by one. If it is less than 5, the last kept digit stays as it is.'
        write: 'Round up only if next digit $\ge 5$'
      - say: 'Our next digit is 2, and 2 is less than 5.'
        write: '$2 < 5$'
        point:
          - {line: 3, kind: circle, at: '= 2', text: 'next digit'}
          - {line: 4, kind: box, text: 'the rule'}
      - say: 'So we do not round up. The fifth digit, 9, stays a 9.'
        write: 'Fifth digit stays $9$'
      - say: 'Now drop everything after the fifth digit: the 2 and the 6 go.'
        write: 'Drop the $26$: $3.14159$'
        point:
          - {line: 2, kind: strike, at: '26', text: 'dropped'}
      - say: 'Notice the answer still has exactly five digits after the point: 1, 4, 1, 5, 9. That is what 5 decimal places means.'
        write: 'Count: $1,\ 4,\ 1,\ 5,\ 9$ = five places'
      - say: 'So 3.1415926 to 5 decimal places is 3.14159, which is answer choice B.'
        write: '$3.1415926 \approx 3.14159$'
        answer: true
    traps:
      A: 'You went for 3.14160. That would be right only if the sixth digit were 5 or more. It is 2, so the 9 does not round up.'
      C: 'You went for 0.31415. That has moved the decimal point, which changes the size of the number. Rounding never moves the point.'
      D: 'You went for 3.14200. That is rounded to 3 decimal places and padded with zeros. The question wants five real digits after the point.'

  3:
    moments:
      - say: 'A notebook is really 15 cm long, but it was measured as 16.8 cm. We want the percentage error, to 2 significant figures.'
        write: 'Actual $= 15$ cm, measured $= 16.8$ cm'
        doodle: {name: 'custom:1995_q03_a', caption: 'really 15 cm, measured 16.8 cm'}
      - say: 'Percentage error compares the size of the mistake with the true value. So we always divide by the actual length, not the measured one.'
        write: 'Percentage error $= \dfrac{\text{error}}{\text{actual}} \times 100$'
      - say: 'First, the error. It is the gap between the measured length and the actual length.'
        write: 'Error $= \text{measured} - \text{actual}$'
      - say: 'That is 16.8 minus 15.'
        write: '$= 16.8 - 15$'
      - say: '16.8 minus 15 is 1.8. So the measurement was 1.8 cm too long.'
        write: '$= 1.8$ cm'
      - say: 'Now go back to the formula. Put that error of 1.8 over the true length, 15, and multiply by 100.'
        write: 'Percentage error $= \dfrac{1.8}{15} \times 100$'
        point:
          - {line: 1, kind: box, text: 'the rule'}
          - {line: 5, kind: move, from: {line: 4, at: '1.8'}, at: '1.8', text: 'the error'}
          - {line: 5, kind: move, from: {line: 0, at: '= 15'}, at: '15', text: 'true length'}
      - say: 'How much is 1.8 over 15? 15 times 0.12 is 1.8, so 1.8 over 15 is 0.12.'
        write: '$= 0.12 \times 100$'
      - say: '0.12 times 100 is 12.'
        write: '$= 12\%$'
      - say: 'To 2 significant figures that is 12, which the options write as 12.00 percent.'
        write: '$12\% = 12.00\%$'
      - say: 'So the percentage error is 12 percent, which is answer choice A.'
        write: 'Percentage error $= 12.00\%$'
        answer: true
    traps:
      B: 'You went for 11%. That is close, but the exact working gives 1.8 divided by 15, which is exactly 0.12, so 12%.'
      C: 'You went for 10.71%. That comes from dividing 1.8 by the measured 16.8. Percentage error always divides by the true value, 15.'
      D: 'You went for 0.12%. That is the fraction 0.12, but you forgot to multiply by 100 to turn it into a percentage.'
  4:
    moments:
      - say: 'A worker earns ₦24,000 a year now. Each year he gets an increment of 10% of his basic salary. We want his salary at the beginning of the third year.'
        write: 'Basic salary: ₦24,000'
      - say: 'The key phrase is "of his basic salary". The increment is always worked out on the original ₦24,000, so the same amount is added every year.'
        write: 'Increment $= 10\%$ of ₦24,000, every year'
        doodle: {name: 'custom:1995_q04_a', caption: '10% of the basic, every year'}
      - say: 'This is different from compound growth, where each year''s 10% would be taken on the new, bigger salary. Here the basic salary never changes.'
      - say: '10% means 10 over 100. So the increment is 10 over 100, times 24,000.'
        write: 'Increment $= \dfrac{10}{100} \times 24{,}000$'
      - say: '24,000 divided by 100 is 240, and 10 times 240 is 2,400. So he gets ₦2,400 more each year.'
        write: '$= 10 \times 240 = 2{,}400$'
      - say: 'Now let''s walk through the years. At the beginning of the first year, his salary is the present one.'
        write: 'Start of year 1: ₦24,000'
      - say: 'At the beginning of the second year, one increment has been added. 24,000 plus 2,400 is 26,400.'
        write: 'Start of year 2: $24{,}000 + 2{,}400 = 26{,}400$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '2,400'}, at: '+ 2,400', text: 'increment'}
      - say: 'At the beginning of the third year, a second increment of the same 2,400 is added to that 26,400. That makes 28,800.'
        write: 'Start of year 3: $26{,}400 + 2{,}400 = 28{,}800$'
        point:
          - {line: 7, kind: move, from: {line: 4, at: '2,400'}, at: '+ 2,400', text: 'same increment'}
          - {line: 7, kind: move, from: {line: 6, at: '26,400'}, at: '26,400', text: 'from here'}
      - say: 'We can check it in one line. From the start of year 1 to the start of year 3 there are two increments, not three. Two lots of 2,400 is 4,800, and 24,000 plus 4,800 is 28,800.'
        write: 'Check: $24{,}000 + 2 \times 2{,}400 = 24{,}000 + 4{,}800 = 28{,}800$'
      - say: 'So his salary at the beginning of the third year is ₦28,800, which is answer choice A.'
        write: 'Salary at start of year 3 $=$ ₦28,800'
        answer: true
    traps:
      B: 'You went for ₦29,040. That is compound growth, 24,000 times 1.1 squared. But the increment is 10% of the basic salary, so it stays ₦2,400 every year.'
      C: 'You went for ₦31,200. That adds three increments of ₦2,400. From the beginning of year 1 to the beginning of year 3 there are only two.'
      D: 'You went for ₦31,944. That is three years of compound growth, 24,000 times 1.1 cubed. The increment is a fixed ₦2,400, and only two of them are added.'

  5:
    moments:
      - say: 'We want the product of 0.0014 and 0.011, written in standard form.'
        write: '$0.0014 \times 0.011$'
      - say: 'Standard form means a number from 1 up to 10, times a power of ten. Small decimals are easier to multiply in that form, so let''s convert each one first.'
        write: 'Standard form: $A \times 10^{n},\ 1 \le A < 10$'
      - say: 'For 0.0014, the point moves three places to the right to reach 1.4. Moving right for a small number gives a negative power, so it is 1.4 times 10 to the minus 3.'
        write: '$0.0014 = 1.4 \times 10^{-3}$'
      - say: 'For 0.011, the point moves two places to the right to reach 1.1. So it is 1.1 times 10 to the minus 2.'
        write: '$0.011 = 1.1 \times 10^{-2}$'
      - say: 'Now put those two forms into the product.'
        write: '$0.0014 \times 0.011 = (1.4 \times 10^{-3}) \times (1.1 \times 10^{-2})$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: '1.4 × 10−3'}, at: '(1.4 × 10−3)'}
          - {line: 4, kind: move, from: {line: 3, at: '1.1 × 10−2'}, at: '(1.1 × 10−2)'}
      - say: 'We can multiply the numbers together and the powers of ten together.'
        write: '$= (1.4 \times 1.1) \times (10^{-3} \times 10^{-2})$'
      - say: 'First the numbers. 1.4 times 1 is 1.4, and 1.4 times 0.1 is 0.14. 1.4 plus 0.14 is 1.54.'
        write: '$1.4 \times 1.1 = 1.4 + 0.14 = 1.54$'
      - say: 'The law of indices for multiplying: when we multiply powers of the same base, we add the indices.'
        write: '$a^{m} \times a^{n} = a^{m + n}$'
      - say: 'Now the powers. When we multiply powers of ten, we add the indices. Minus 3 plus minus 2 is minus 5.'
        write: '$10^{-3} \times 10^{-2} = 10^{-3 + (-2)} = 10^{-5}$'
      - say: 'Now put the 1.54 and the 10 to the minus 5 back together.'
        write: '$0.0014 \times 0.011 = 1.54 \times 10^{-5}$'
        point:
          - {line: 9, kind: move, from: {line: 6, at: '1.54'}, at: '1.54', text: 'numbers'}
          - {line: 9, kind: move, from: {line: 8, at: '= 10−5'}, at: '10−5', text: 'powers'}
      - say: 'Does that size make sense? Both numbers are less than 1, so the product must be smaller than either. As a decimal it is 0.0000154, which fits.'
        write: 'Check: $1.54 \times 10^{-5} = 0.0000154$'
      - say: 'So the product is 1.54 times 10 to the minus 5, which is answer choice D.'
        write: '$= 1.54 \times 10^{-5}$'
        answer: true
    traps:
      A: 'You went for $1.54 \times 10^{2}$. A positive power makes the number bigger than 1, but multiplying two small decimals gives a very small answer. The powers are negative: minus 3 plus minus 2 is minus 5.'
      B: 'You went for $1.54 \times 10^{-3}$. That uses only one of the powers. When you multiply, you add both indices: minus 3 plus minus 2 is minus 5.'
      C: 'You went for $1.54 \times 10^{4}$. The powers of ten here are negative, because both numbers are less than 1. Adding minus 3 and minus 2 gives minus 5.'

  6:
    moments:
      - say: 'We want to evaluate 81 to the power 3 over 4, minus 27 to the power 1 over 3, all over 3 times 2 cubed.'
        write: '$\dfrac{81^{3/4} - 27^{1/3}}{3 \times 2^{3}}$'
      - say: 'Remember what a fractional index means. The bottom number is the root, and the top number is the power.'
        write: '$a^{m/n} = \left(\sqrt[n]{a}\right)^{m}$'
      - say: 'Let''s start with 81 to the 3 over 4. The 4 on the bottom means the fourth root, and the 3 on top means cube it.'
        write: '$81^{3/4} = \left(\sqrt[4]{81}\right)^{3}$'
      - say: 'What is the fourth root of 81? 3 times 3 is 9, times 3 is 27, times 3 is 81. So the fourth root of 81 is 3.'
        write: '$\sqrt[4]{81} = 3$ since $3 \times 3 \times 3 \times 3 = 81$'
      - say: 'Now cube that 3. 3 cubed is 27.'
        write: '$81^{3/4} = 3^{3} = 27$'
      - say: 'Next, 27 to the power 1 over 3. The 3 on the bottom means the cube root. 3 times 3 times 3 is 27, so the cube root is 3.'
        write: '$27^{1/3} = \sqrt[3]{27} = 3$'
      - say: 'So the top of the fraction is the 27 we found, minus the 3 we found. That is 24.'
        write: 'Top: $27 - 3 = 24$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '27'}, at: '27', text: 'found here'}
      - say: 'Now the bottom. 2 cubed is 2 times 2 times 2, which is 8.'
        write: '$2^{3} = 2 \times 2 \times 2 = 8$'
      - say: 'And 3 times that 8 is 24.'
        write: 'Bottom: $3 \times 8 = 24$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '= 8'}, at: '8', text: 'from here'}
      - say: 'Now put the top and the bottom back into the fraction.'
        write: '$\dfrac{81^{3/4} - 27^{1/3}}{3 \times 2^{3}} = \dfrac{24}{24}$'
        point:
          - {line: 9, kind: move, from: {line: 6, at: '= 24'}, at: '24[[24]]', text: 'top'}
          - {line: 9, kind: move, from: {line: 8, at: '= 24'}, at: '[[24]]24', text: 'bottom'}
      - say: '24 divided by 24 is 1. So the value is 1, which is answer choice B.'
        write: '$= 1$'
        answer: true
    traps:
      A: 'You went for 27. That is only the first term, 81 to the power 3 over 4. You still need to subtract 3 and then divide by 24.'
      C: 'You went for one third. Check the top and bottom again: the top is 27 minus 3, which is 24, and the bottom is 3 times 8, which is also 24.'
      D: 'You went for 1 over 8. That comes from dividing by 3 times 8 without first working out the top properly. The top is 24, and 24 over 24 is 1.'
  7:
    moments:
      - say: 'We want the value of 16 to the power 3 over 2, plus log base 10 of 0.0001, plus log base 2 of 32.'
        write: '$(16)^{3/2} + \log_{10}0.0001 + \log_{2}32$'
      - say: 'There are three separate pieces here. Let''s work each one out on its own, then add them.'
        write: 'Three pieces: one index, two logs'
      - say: 'The rule for a fractional index: the bottom number is the root, and the top number is the power.'
        write: '$a^{m/n} = \left(\sqrt[n]{a}\right)^{m}$'
      - say: 'First piece. In the power 3 over 2, the 2 on the bottom means a square root, and the 3 on top means cube it.'
        write: '$16^{3/2} = \left(\sqrt{16}\right)^{3}$'
      - say: 'The square root of 16 is 4, so this becomes 4 cubed.'
        write: '$= 4^{3}$'
      - say: '4 times 4 is 16, and 16 times 4 is 64.'
        write: '$= 64$'
      - say: 'Second piece. Log base 10 of 0.0001 asks: what power of 10 gives 0.0001? 0.0001 is 1 over 10,000, and 10,000 is 10 to the 4, so this is 10 to the minus 4.'
        write: '$0.0001 = \dfrac{1}{10{,}000} = 10^{-4}$'
      - say: 'A log asks what power the base must be raised to. So log base $a$ of $a$ to the power $n$ is just $n$.'
        write: '$\log_{a}a^{n} = n$'
      - say: 'So the log is minus 4. It is negative because 0.0001 is less than 1.'
        write: '$\log_{10}0.0001 = \log_{10}10^{-4} = -4$'
      - say: 'Third piece. Log base 2 of 32 asks: what power of 2 gives 32? Count up: 2, 4, 8, 16, 32. That is five 2s multiplied together.'
        write: '$2^{5} = 2 \times 2 \times 2 \times 2 \times 2 = 32$'
      - say: 'So log base 2 of 32 is 5.'
        write: '$\log_{2}32 = 5$'
      - say: 'Now put the three results back into the sum: 64, plus minus 4, plus 5.'
        write: '$(16)^{3/2} + \log_{10}0.0001 + \log_{2}32 = 64 + (-4) + 5$'
        point:
          - {line: 11, kind: move, from: {line: 5, at: '64'}, at: '64', text: 'first piece'}
          - {line: 11, kind: move, from: {line: 8, at: '= −4'}, at: '(−4)', text: 'second piece'}
          - {line: 11, kind: move, from: {line: 10, at: '= 5'}, at: ') + 5', text: 'third piece'}
      - say: '64 minus 4 is 60.'
        write: '$= 60 + 5$'
      - say: 'And 60 plus 5 is 65.'
        write: '$= 65$'
      - say: 'So the value is 65, written 65.00, which is answer choice D.'
        write: '$= 65.00$'
        answer: true
    traps:
      A: 'You went for 0.065. The digits 6 and 5 are right, but the decimal point is in the wrong place. The pieces are 64, minus 4 and 5, which add to 65.'
      B: 'You went for 0.650. The value is 65, not 0.65. 16 to the power 3 over 2 alone is already 64.'
      C: 'You went for 6.500. The first piece alone is 64, so the total cannot be as small as 6.5. Adding 64, minus 4 and 5 gives 65.'

  8:
    moments:
      - say: 'We want to simplify root 12 minus root 3, over root 12 plus root 3.'
        write: '$\dfrac{\sqrt{12} - \sqrt{3}}{\sqrt{12} + \sqrt{3}}$'
      - say: 'The rule for surds: the square root of a product is the square root of each part, multiplied.'
        write: '$\sqrt{ab} = \sqrt{a} \times \sqrt{b}$'
      - say: 'Before doing anything fancy, let''s see if the surds simplify. 12 is 4 times 3, and 4 is a perfect square.'
        write: '$\sqrt{12} = \sqrt{4 \times 3} = \sqrt{4} \times \sqrt{3}$'
      - say: 'The square root of 4 is 2, so root 12 is 2 root 3.'
        write: '$= 2\sqrt{3}$'
      - say: 'Now replace root 12 with 2 root 3, on the top and on the bottom.'
        write: 'Using $\sqrt{12} = 2\sqrt{3}$: $\dfrac{2\sqrt{3} - \sqrt{3}}{2\sqrt{3} + \sqrt{3}}$'
        point:
          - {line: 3, kind: arrow, text: 'sub in'}
      - say: 'The top first. 2 root 3 minus 1 root 3 leaves 1 root 3, just like 2 apples minus 1 apple leaves 1 apple.'
        write: 'Top: $2\sqrt{3} - \sqrt{3} = \sqrt{3}$'
      - say: 'And the bottom. 2 root 3 plus 1 root 3 is 3 root 3.'
        write: 'Bottom: $2\sqrt{3} + \sqrt{3} = 3\sqrt{3}$'
      - say: 'So the whole fraction becomes root 3 over 3 root 3.'
        write: '$\dfrac{\sqrt{12} - \sqrt{3}}{\sqrt{12} + \sqrt{3}} = \dfrac{\sqrt{3}}{3\sqrt{3}}$'
      - say: 'Root 3 is a factor on the top and on the bottom, so it cancels.'
        write: '$= \dfrac{\cancel{\sqrt{3}}}{3\cancel{\sqrt{3}}}$'
      - say: 'Let''s check with decimals. Root 12 is about 3.46 and root 3 is about 1.73. The top is 3.46 minus 1.73, which is 1.73. The bottom is 3.46 plus 1.73, which is 5.19. 1.73 over 5.19 is about 0.33.'
        write: 'Check: $\dfrac{3.46 - 1.73}{3.46 + 1.73} = \dfrac{1.73}{5.19} \approx 0.33$'
      - say: 'So once root 3 cancels, we are left with 1 over 3, which is answer choice A.'
        write: '$\dfrac{\sqrt{12} - \sqrt{3}}{\sqrt{12} + \sqrt{3}} = \dfrac{1}{3}$'
        answer: true
    traps:
      B: 'You went for 0. The top is not zero: root 12 is 2 root 3, and 2 root 3 minus root 3 leaves root 3.'
      C: 'You went for 9 over 15. That treats root 12 and root 3 as plain 12 and 3. Simplify root 12 to 2 root 3 first, and the fraction becomes 1 over 3.'
      D: 'You went for 1. That would need the top and bottom to be equal, but the top is root 3 and the bottom is 3 root 3.'

  9:
    moments:
      - say: 'Four boys are in both the school''s first eleven cricket team and its first fourteen rugby team. We want how many boys play for at least one of the two teams.'
        write: 'In both teams: $4$ boys'
      - say: 'Let me draw a Venn diagram, so we can see where everything belongs.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '4', text: 'in both'}
      - say: 'The team sizes are hiding in the names. A first eleven has 11 players, and a first fourteen has 14 players.'
        write: '$n(C) = 11,\quad n(R) = 14$'
        doodle: {name: 'custom:1995_q09_a', caption: 'cricket 11, rugby 14, 4 in both'}
        point:
          - {figure: sketch, kind: circle, target: '11'}
          - {figure: sketch, kind: circle, target: '14'}
      - say: 'And the 4 boys in both teams are the overlap, where the two sets meet.'
        write: '$n(C \cap R) = 4$'
      - say: '"At least one of the two teams" means cricket, or rugby, or both. That is the union of the two sets.'
        write: 'At least one team: $n(C \cup R)$'
        point:
          - {figure: sketch, kind: underline, target: 'C ∪ R = ?', text: 'the union'}
      - say: 'If we just add 11 and 14, the 4 boys in both teams get counted twice, once in each team. So we subtract the overlap once.'
        write: '$n(C \cup R) = n(C) + n(R) - n(C \cap R)$'
      - say: 'Put in the numbers from the names, and the overlap: 11 plus 14 minus 4.'
        write: '$= 11 + 14 - 4$'
        point:
          - {line: 6, kind: move, from: {line: 2, at: '11'}, at: '11'}
          - {line: 6, kind: move, from: {line: 2, at: '14'}, at: '14'}
          - {line: 6, kind: move, from: {line: 3, at: '= 4'}, at: '− 4', text: 'the overlap'}
      - say: '11 plus 14 is 25.'
        write: '$= 25 - 4$'
      - say: 'And 25 minus 4 is 21.'
        write: '$= 21$'
      - say: 'Let''s check it another way. Cricket only is 11 minus 4, which is 7. Rugby only is 14 minus 4, which is 10. 7 plus 10, plus the 4 in both, is 21.'
        write: 'Check: $(11 - 4) + (14 - 4) + 4 = 7 + 10 + 4 = 21$'
      - say: 'So 21 boys play for at least one of the two teams, which is answer choice B.'
        write: 'At least one team: $21$ boys'
        answer: true
    traps:
      A: 'You went for 25. That adds the two teams but counts the 4 shared boys twice. Subtract the overlap once: 25 minus 4 is 21.'
      C: 'You went for 16. Check the team sizes: a first eleven has 11 and a first fourteen has 14. 11 plus 14 minus 4 is 21.'
