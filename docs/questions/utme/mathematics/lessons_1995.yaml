  15:
    moments:
      - say: 'We want to factorise $abx^2 + 6y - 3ax - 2byx$ completely.'
        write: '$abx^{2} + 6y - 3ax - 2byx$'
      - say: 'There are four terms and no factor common to all four. So we group them into two pairs that each share something.'
        write: 'Four terms: factorise by grouping'
      - say: 'Let''s reorder: the two terms with $b$ first, then the other two. Notice $2byx$ is the same as $2bxy$.'
        write: '$abx^{2} + 6y - 3ax - 2byx = abx^{2} - 2bxy - 3ax + 6y$'
      - say: 'From the first pair, take out $bx$. $abx^2$ divided by $bx$ is $ax$, and minus $2bxy$ divided by $bx$ is minus $2y$.'
        write: 'First pair: $abx^{2} - 2bxy = bx(ax - 2y)$'
      - say: 'From the second pair, take out minus 3. Minus $3ax$ divided by minus 3 is $ax$, and $6y$ divided by minus 3 is minus $2y$.'
        write: 'Second pair: $-3ax + 6y = -3(ax - 2y)$'
      - say: 'Now write the two pairs side by side.'
        write: '$= bx(ax - 2y) - 3(ax - 2y)$'
      - say: 'Both parts carry the same bracket, $ax - 2y$. That tells us the grouping worked. Take that bracket out, and what is left is $bx$ minus 3.'
        write: '$= (ax - 2y)(bx - 3)$'
        point:
          - {line: 5, kind: circle, at: 'bx[[(ax−2y)]]', text: 'same bracket'}
          - {line: 5, kind: circle, at: '3[[(ax−2y)]]'}
          - {line: 6, kind: move, from: {line: 5, at: '3[[(ax−2y)]]'}, at: '(ax−2y)', text: 'taken out'}
      - say: 'Let''s check by expanding. $ax$ times $bx$ is $abx^2$, and $ax$ times minus 3 is minus $3ax$.'
        write: 'Check: $ax(bx - 3) = abx^{2} - 3ax$'
      - say: 'Minus $2y$ times $bx$ is minus $2bxy$, and minus $2y$ times minus 3 is plus $6y$.'
        write: '$-2y(bx - 3) = -2bxy + 6y$'
      - say: 'Together that is $abx^2$ minus $3ax$ minus $2bxy$ plus $6y$: exactly the four terms in the question.'
        write: '$abx^{2} - 3ax - 2bxy + 6y$ matches the question'
      - say: 'So the answer is $ax - 2y$ times $bx - 3$, which is answer choice A.'
        write: '$abx^{2} + 6y - 3ax - 2byx = (ax - 2y)(bx - 3)$'
        answer: true
    traps:
      B: 'You went for $(bx + 3)(2y - ax)$. Expand it and the $abx^2$ term comes out negative, but in the question it is positive. Taking out minus 3 from the second pair gives $(ax - 2y)(bx - 3)$.'
      C: 'You went for $(bx + 3)(ax - 2y)$. Expanding gives $+3ax - 6y$, but the question has $-3ax + 6y$. Take out minus 3, not plus 3, from the second pair.'
      D: 'You went for $(ax - 2y)(ax - b)$. Expanding gives an $a^2x^2$ term, which is not in the question. The second bracket comes from taking out $bx$ and minus 3: it is $bx - 3$.'

  16:
