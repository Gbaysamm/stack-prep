          - {figure: 0, kind: highlight, target: YT}
          - {figure: 0, kind: highlight, target: YX}
      - say: 'The trick is to turn every fact into arcs. First fact: the angle between a tangent and a chord is half the arc that the chord cuts off on that side.'
        write: 'Tangent–chord angle $= \dfrac{1}{2} \times$ arc'
        point:
          - {figure: 0, kind: circle, target: 'P', text: 'tangent'}
          - {figure: 0, kind: highlight, target: 'TX', text: 'chord'}
      - say: 'So angle $PTX$, 50 degrees, is half of arc $TX$ on the side of $P$. That makes arc $TX$ twice 50, which is 100 degrees.'
        write: 'Arc $TX = 2 \times 50^{\circ} = 100^{\circ}$'
        point:
          - {line: 2, kind: move, from: {line: 0, at: '50'}, at: '× 50', text: 'twice'}
          - {figure: 0, kind: arc, target: TX, text: '100°'}
      - say: 'The whole circle is 360 degrees. Take away arc $TX$, and the rest of the circle, from $T$ round through $Y$ and $Z$ to $X$, is 360 minus 100, which is 260 degrees.'
        write: 'Rest of circle $= 360^{\circ} - 100^{\circ} = 260^{\circ}$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '= 100'}, at: '− 100', text: 'take away'}
          - {figure: 0, kind: arc, target: 'TY'}
          - {figure: 0, kind: arc, target: 'YX', text: 'rest: 260°'}
      - say: 'That 260 is made of arc $TY$ plus arc $YX$, where arc $YX$ is the one that passes through $Z$.'
        write: 'Arc $TY$ + arc $YX = 260^{\circ}$'
        point:
          - {figure: 0, kind: circle, target: 'Z', text: 'arc YX runs through Z'}
      - say: 'Second fact: equal chords cut off equal arcs. $YT$ equals $YX$, so arc $TY$ equals arc $YX$.'
        write: '$YT = YX \Rightarrow$ arc $TY =$ arc $YX$'
        point:
          - {figure: 0, kind: label, target: 'YT', text: 'equal chords'}
          - {figure: 0, kind: label, target: 'YX', text: 'equal chords'}
      - say: 'So the 260 is split into two equal arcs. Half of 260 is 130.'
        write: 'Arc $TY = \dfrac{260^{\circ}}{2} = 130^{\circ}$'
        point:
