  27:
    moments:
      - say: 'In the diagram, $PT$ is a tangent to the circle at $T$, $YT$ equals $YX$, and angle $PTX$ is 50 degrees. We want angle $TZY$.'
        write: '$\angle PTX = 50^{\circ},\quad YT = YX$'
        point:
