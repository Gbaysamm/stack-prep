      D: 'You went for 22,000 over 3. That is the distance for towns 60 degrees apart, as if the latitudes were added. Both towns are north, so we subtract: 45 minus 15 is 30 degrees.'
  30:
    moments:
      - say: 'Two perpendicular lines, $PQ$ and $QR$, meet at the point 1, minus 1. $PQ$ is $x - 2y - 3 = 0$. We want the equation of $QR$.'
        write: '$PQ:\ x - 2y - 3 = 0$'
      - say: 'Let me draw the two lines meeting at right angles at $Q$.'
        show_sketch: true
        point:
          - {figure: sketch, kind: highlight, target: PQ, text: 'x − 2y − 3 = 0'}
          - {figure: sketch, kind: circle, target: '(1, −1)', text: 'Q'}
      - say: 'Perpendicular lines have gradients that multiply to minus 1. So first we need the gradient of $PQ$.'
        write: 'Perpendicular: $m_{1} \times m_{2} = -1$'
      - say: 'Let''s rearrange $PQ$ into the form $y = mx + c$. Add $2y$ to both sides of $x - 2y - 3 = 0$.'
        write: '$x - 3 = 2y$'
      - say: 'Divide everything by 2. $x$ over 2 is 1 over 2 times $x$, and minus 3 over 2 stays minus 3 over 2.'
        write: '$y = \dfrac{1}{2}x - \dfrac{3}{2}$'
      - say: 'The number in front of $x$ is the gradient. So the gradient of $PQ$ is 1 over 2.'
        write: '$m_{PQ} = \dfrac{1}{2}$'
      - say: 'For $QR$ to be perpendicular, 1 over 2 times its gradient must be minus 1.'
        write: '$\dfrac{1}{2} \times m_{QR} = -1$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
          - {line: 6, kind: move, from: {line: 5, at: '= 21'}, at: '21 ×', text: 'gradient of PQ'}
          - {figure: sketch, kind: highlight, target: QR, text: 'gradient?'}
      - say: 'Multiply both sides by 2. Minus 1 times 2 is minus 2.'
        write: '$m_{QR} = -2$'
      - say: 'Now we need the line with gradient minus 2 that passes through the point 1, minus 1. We use the point-gradient form.'
        write: '$y - y_{1} = m(x - x_{1})$'
      - say: 'Put in $x_1 = 1$, $y_1 = -1$, and the gradient $m = -2$ we just found.'
        write: '$y - (-1) = -2(x - 1)$'
        point:
          - {line: 9, kind: move, from: {line: 7, at: '−2'}, at: '= −2', text: 'sub in'}
          - {figure: sketch, kind: circle, target: '(1, −1)', text: 'x₁ = 1, y₁ = −1'}
      - say: '$y$ minus minus 1 is $y + 1$. On the right, minus 2 times $x$ is minus $2x$, and minus 2 times minus 1 is plus 2.'
        write: '$y + 1 = -2x + 2$'
      - say: 'Bring everything to the left side: add $2x$ to both sides and subtract 2 from both sides.'
        write: '$2x + y + 1 - 2 = 0$'
        point:
          - {line: 11, kind: move, from: {line: 10, at: '−2x'}, at: '2x + y', text: 'across the ='}
          - {line: 11, kind: move, from: {line: 10, at: '2x[[+ 2]]'}, at: '− 2 = 0', text: 'across the ='}
      - say: '1 minus 2 is minus 1.'
        write: '$2x + y - 1 = 0$'
      - say: 'Check the point lies on it: 2 times 1, plus minus 1, minus 1 is 2 minus 1 minus 1, which is zero. Good.'
        write: 'Check $(1,\ -1)$: $2(1) + (-1) - 1 = 0$'
      - say: 'So the equation of $QR$ is $2x + y - 1 = 0$, which is answer choice D.'
        write: '$QR:\ 2x + y - 1 = 0$'
        answer: true
        point:
          - {figure: sketch, kind: highlight, target: QR, text: '2x + y − 1 = 0'}
    traps:
      A: 'You went for $x - 2y + 1 = 0$. That has gradient 1 over 2, the same as $PQ$, so it is parallel, not perpendicular. The perpendicular gradient is minus 2.'
      B: 'You went for $2x + y - 3 = 0$. The gradient is right, but that line passes through 1, 1, not 1, minus 1. Put in $y = -1$: 2 minus 1 minus 3 is minus 2, not zero.'
      C: 'You went for $x - 2y - 3 = 0$. That is $PQ$ itself, the line you were given. $QR$ is the other line through 1, minus 1, the one with the perpendicular gradient, minus 2.'

