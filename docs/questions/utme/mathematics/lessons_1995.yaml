      - say: 'The power rule for differentiating: bring the power down in front, then take one off the power.'
        write: '$\dfrac{d}{dx}\left(x^{n}\right) = nx^{n - 1}$'
      - say: 'Differentiate term by term. $x$ squared gives $2x$: bring the 2 down and reduce the power by one.'
