          - {line: 6, kind: move, from: {line: 2, at: '7000'}, at: '7000', text: 'R'}
      - say: '7,000 divided by 7 is 1,000, so 22 over 7 times 7,000 is 22 times 1,000, which is 22,000.'
        write: '$= \dfrac{30}{360} \times 2 \times 22{,}000$'
      - say: '2 times 22,000 is 44,000. That is the full circumference.'
        write: '$= \dfrac{30}{360} \times 44{,}000$'
      - say: '30 over 360 simplifies: divide the top and bottom by 30, and it is 1 over 12.'
        write: '$= \dfrac{1}{12} \times 44{,}000 = \dfrac{44{,}000}{12}$'
      - say: 'Divide the top and bottom by 4. 44,000 divided by 4 is 11,000, and 12 divided by 4 is 3.'
        write: '$= \dfrac{11{,}000}{3}$'
