  17:
    moments:
      - say: 'In an arithmetic progression, the 4th term is 13 and the 10th term is 31. We want the 21st term.'
        write: '$T_{4} = 13,\quad T_{10} = 31$'
      - say: 'The $n$th term of an A.P. is $a$ plus $n$ minus 1 times $d$, where $a$ is the first term and $d$ is the common difference, the amount added each time.'
        write: '$T_{n} = a + (n - 1)d$'
      - say: 'For the 4th term, $n$ minus 1 is 3. So $a$ plus $3d$ equals 13. Call this equation 1.'
        write: '$T_{4} = a + 3d = 13 \quad (1)$'
      - say: 'For the 10th term, $n$ minus 1 is 9. So $a$ plus $9d$ equals 31. That is equation 2.'
        write: '$T_{10} = a + 9d = 31 \quad (2)$'
      - say: 'Take equation 2 minus equation 1. The $a$s cancel. $9d$ minus $3d$ is $6d$, and 31 minus 13 is 18.'
        write: '$(2) - (1):\ 6d = 18$'
      - say: 'Divide both sides by 6. 18 divided by 6 is 3. So the common difference is 3.'
        write: '$d = \dfrac{18}{6} = 3$'
      - say: 'Put $d = 3$ back into equation 1. 3 times 3 is 9, so $a$ plus 9 equals 13.'
        write: '$a + 3(3) = 13 \Rightarrow a + 9 = 13$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '= 3'}, at: '(3)', text: 'sub in'}
      - say: 'Subtract 9 from both sides. 13 minus 9 is 4. So the first term is 4.'
        write: '$a = 13 - 9 = 4$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '+ 9'}, at: '− 9', text: 'across the ='}
      - say: 'Now the 21st term. Here $n$ is 21, so $n$ minus 1 is 20.'
        write: '$T_{21} = a + 20d$'
      - say: 'Put in the $a$ and the $d$ we just found: 4 plus 20 times 3.'
        write: '$= 4 + 20(3)$'
        point:
          - {line: 9, kind: move, from: {line: 7, at: '= 4'}, at: '4', text: 'a'}
          - {line: 9, kind: move, from: {line: 5, at: '= 3'}, at: '(3)', text: 'd'}
      - say: '20 times 3 is 60.'
        write: '$= 4 + 60$'
      - say: 'And 4 plus 60 is 64.'
        write: '$= 64$'
