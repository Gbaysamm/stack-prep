          - {line: 6, kind: move, from: {line: 5, at: '= 10'}, at: '[[10]]60', text: 'n'}
      - say: '60 divided by 10 is 6.'
        write: '$= 6$'
      - say: 'The question wants the difference between the range and the variance: the range, 8, minus the variance, 6.'
        write: 'Range $-$ variance $= 8 - 6$'
        point:
