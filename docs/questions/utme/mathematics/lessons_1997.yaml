          kind: table
          columns: ['Score (x)', 'Tally', 'f']
          rows: [[5, '|', ''], [8, '|', ''], [13, '|', ''], [15, '|', ''], [16, '|||', ''], [17, '||', ''], [19, '|', '']]
          'on': 'table'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,3', text: '1'}
          - {id: t, op: fill, part: 'cell:2,3', text: '1'}
