        write: '$N = \sum f = 15$'
      - say: '15 is odd, so the median is the $N$ plus 1 over 2th value.'
        write: 'Median $=$ the $\left(\dfrac{N + 1}{2}\right)$th value'
      - say: 'Substitute, and 15 plus 1 is 16, and 16 over 2 is 8. So the median is the 8th student''s age.'
        write: '$= \left(\dfrac{15 + 1}{2}\right)$th $=$ 8th value'
      - say: 'Go down the cf column to the first cf that reaches 8. The first is 3, which is too small. The next is 8, at age 25. So the 4th to the 8th students are all aged 25.'
        write: '8th value: age $25$ (cf $= 8$)'
