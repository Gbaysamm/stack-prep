        write: 'Solution: $n = 10$ scores'
      - say: 'The mode is the score with the highest frequency, that is, the score that occurs most often.'
        write: 'Mode $=$ the score with the highest frequency'
      - section: 'Arrange the scores'
        say: 'First arrange the scores in ascending order, smallest first, so equal scores sit together.'
        write: 'Ascending order: $5,\ 8,\ 13,\ 15,\ 16,\ 16,\ 16,\ 17,\ 17,\ 19$'
