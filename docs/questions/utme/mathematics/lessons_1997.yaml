        doodle: {name: 'custom:1997_q49_a', id: basket, caption: '6 grapes, 11 bananas, 13 oranges'}
      - say: 'Probability is the number of favourable outcomes over the total number of outcomes.'
        write: 'Probability $= \dfrac{\text{favourable}}{\text{total}}$'
      - say: 'First the total. Every fruit in the basket could be the one picked.'
        write: 'Total $= 6 + 11 + 13$'
        doodle_do:
          - {id: basket, op: label, part: basket, text: '6 + 11 + 13 = 30'}
      - say: '6 plus 11 is 17, and 17 plus 13 is 30.'
        write: '$= 30$'
      - say: 'Now the favourable outcomes: a grape or a banana. No fruit is both, so we just add the two counts in the basket.'
        write: 'Favourable $= 6 + 11$'
        doodle_do:
          - {id: basket, op: circle, part: grapes}
          - {id: basket, op: circle, part: bananas}
      - say: '6 plus 11 is 17.'
        write: '$= 17$'
        point:
          - {line: 5, kind: highlight, at: '17', to: {doodle: basket, part: bananas}}
      - say: 'Put the 17 favourable and the 30 in total into the probability.'
        write: 'P(grape or banana) $= \dfrac{17}{30}$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '= 17'}, at: '17', text: 'favourable'}
          - {line: 6, kind: move, from: {line: 3, at: '= 30'}, at: '30', text: 'total'}
      - say: '17 is a prime number and it does not divide 30, so this fraction won''t simplify.'
        write: '$\dfrac{17}{30}$ is already in lowest terms'
      - say: 'Let''s check another way. The only other fruit is an orange, with probability 13 over 30. And 1 minus 13 over 30 is 17 over 30.'
        write: 'Check: $1 - \dfrac{13}{30} = \dfrac{30 - 13}{30} = \dfrac{17}{30}$'
        doodle_do:
          - {id: basket, op: cross, part: oranges, text: '13 of 30'}
      - say: 'So the probability is 17 over 30, which is answer choice A.'
        write: 'P(grape or banana) $= \dfrac{17}{30}$'
        answer: true
    traps:
      B: 'You went for 11 over 30. That''s the bananas alone. The question says a grape or a banana, so add the 6 grapes too: 17 over 30.'
      C: 'You went for 6 over 30. That''s the grapes alone. Add the 11 bananas as well to get 17 over 30.'
      D: 'You went for 5 over 30. That''s 11 minus 6, but "or" means we add the two groups: 6 plus 11 is 17, so 17 over 30.'
  50:
