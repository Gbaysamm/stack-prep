  28:
    moments:
      - section: 'The question'
        say: 'Cut a round cake into 6 equal slices. How long is the curved crust of one slice? This question is the same idea: a 60 degree slice of a circle. Find what fraction of the circle it is, and the rest is easy.'
        write: 'Minor arc $= ?$'
        doodle: {name: 'custom:1997_q28_a', id: cake, caption: 'one slice of a round cake'}
      - section: 'What we know'
        say: 'Let me draw the circle. Its diameter is 42 cm. The diameter is the line straight across the circle, through the centre O.'
        write: 'Diameter $= 42$ cm'
