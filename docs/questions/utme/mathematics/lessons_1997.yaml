# UTME 1997 Mathematics — lessons for the board (version 2).
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1997.yaml. Answers match that file.
format_version: 1
exam_year: 1997
lessons:
  1:
    moments:
      - say: 'We''re told that the base 4 numeral $1P03$ is worth 115 in base ten, and we want the missing digit $P$.'
        write: '$(1P03)_{4} = 115_{10}$'
      - say: 'In base 4, each column is worth a power of 4. Picture the sticks: one stick is 1, four sticks tied together make a bundle of 4, four bundles make 16, and four of those fill a crate of 64. So from the right the columns are worth 1, 4, 16 and 64.'
        write: 'Column values: $4^{3} = 64,\ 4^{2} = 16,\ 4^{1} = 4,\ 4^{0} = 1$'
        doodle: {name: 'custom:1997_q01_a', id: sticks, caption: '1, 4, 16, 64: bundles of four', size: scene}
      - say: 'Now line the digits of $1P03$ up under those bundles. The 1 sits in the 64 column, $P$ in the 16 column, the 0 in the 4 column, and the 3 in the units.'
        write: 'Digits: $1 \to 64,\ P \to 16,\ 0 \to 4,\ 3 \to 1$'
        doodle_do:
          - {id: sticks, op: stage, stage: 'custom:1997_q01_a2'}
      - say: 'To find what the numeral is worth, multiply each digit by its column value and add them up.'
        write: '$(1P03)_{4} = (1 \times 64) + (P \times 16) + (0 \times 4) + (3 \times 1)$'
      - say: '1 times 64 is 64. $P$ times 16 is $16P$. 0 times 4 is 0. And 3 times 1 is 3.'
        write: '$= 64 + 16P + 0 + 3$'
      - say: '64 plus 3 is 67, so the numeral is worth 67 plus $16P$.'
        write: '$= 67 + 16P$'
      - say: 'Now go back to the question: this value is 115. So 67 plus $16P$ equals 115.'
        write: '$67 + 16P = 115$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '67 + 16P'}, at: '67 + 16P', text: 'worth'}
          - {line: 6, kind: move, from: {line: 0, at: '115'}, at: '115', text: 'given'}
      - say: 'Subtract 67 from both sides. 115 minus 67 is 48. Look at the 16 column: that is 48 sticks waiting there.'
        write: '$16P = 115 - 67 = 48$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '67 +'}, at: '− 67', text: 'across the ='}
        doodle_do:
          - {id: sticks, op: circle, part: col16, text: '16P = 48 sticks'}
      - say: 'To get $P$ by itself, divide both sides by 16. 48 divided by 16 is 3, so 48 sticks make 3 bundles of 16. The $P$ under the bundles is a 3.'
        write: '$P = \dfrac{48}{16} = 3$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '[[16]]P'}, at: '16', text: 'divide it over'}
          - {line: 8, kind: highlight, at: '= 3', to: {doodle: sticks, part: answer}}
        doodle_do:
          - {id: sticks, op: stage, stage: 'custom:1997_q01_a3'}
      - say: 'Is 3 allowed? In base 4 the only digits are 0, 1, 2 and 3, so yes, 3 is a legal digit.'
        write: 'Base 4 digits: $0, 1, 2, 3$, so $P = 3$ is allowed'
      - say: 'Let''s check by putting $P = 3$ back into our sum. 3 times 16 is 48, and 64 plus 48 plus 0 plus 3 is 115. It works.'
        write: 'Check: $64 + 3 \times 16 + 0 + 3 = 64 + 48 + 3 = 115$'
      - say: 'So $P$ is 3, which is answer choice D.'
        write: '$P = 3$'
        answer: true
    traps:
      A: 'You went for 0. With $P = 0$ the numeral is only 64 plus 3, which is 67, not 115. Build the equation $67 + 16P = 115$ and solve it.'
      B: 'You went for 1. That gives 64 plus 16 plus 3, which is 83, not 115. Remember the $P$ column is worth 16, so $16P$ has to make up 48.'
      C: 'You went for 2. That gives 64 plus 32 plus 3, which is 99, still short of 115. Solving $16P = 48$ gives $P = 3$.'
  2:
    moments:
      - say: 'We want 64.764 squared minus 35.236 squared, correct to 3 significant figures.'
        write: '$64.764^{2} - 35.236^{2}$'
      - say: 'Squaring these decimals by hand would take ages. But this is one square minus another square. Picture a big square of side 64.764, with a small square of side 35.236 cut from its corner: what is left is the difference of two squares.'
        write: 'Difference of two squares: $a^{2} - b^{2} = (a + b)(a - b)$'
        doodle: {name: 'custom:1997_q02_a', id: tiles, caption: 'a big square minus a small one', size: scene}
      - say: 'Here $a$ is 64.764 and $b$ is 35.236.'
        write: '$a = 64.764,\quad b = 35.236$'
      - say: 'Now slide the bottom piece of that L-shape round to the side. It makes a rectangle: the sum of the two numbers long, and their difference wide.'
        write: '$64.764^{2} - 35.236^{2} = (64.764 + 35.236)(64.764 - 35.236)$'
        point:
          - {line: 1, kind: box, text: 'the rule'}
        doodle_do:
          - {id: tiles, op: stage, stage: 'custom:1997_q02_a2'}
      - say: 'First the sum. Look at the decimal parts: 0.764 plus 0.236 is exactly 1.'
        write: 'Decimals: $0.764 + 0.236 = 1$'
      - say: 'The whole numbers, 64 plus 35, make 99, and 99 plus that 1 is 100. So the rectangle is a neat 100 long.'
        write: 'Sum: $64.764 + 35.236 = 64 + 35 + 1 = 100$'
        doodle_do:
          - {id: tiles, op: highlight, part: long, text: 'a + b = 100'}
      - say: 'Now the difference. 64.764 minus 35 is 29.764, and taking off 0.236 more leaves 29.528.'
        write: 'Difference: $64.764 - 35.236 = 29.528$'
      - say: 'Put the sum and the difference back into the bracket line: the rectangle is 100 by 29.528.'
        write: '$(64.764 + 35.236)(64.764 - 35.236) = 100 \times 29.528$'
        point:
          - {line: 7, kind: move, from: {line: 5, at: '= 100'}, at: '100', text: 'sum'}
          - {line: 7, kind: move, from: {line: 6, at: '29.528'}, at: '29.528', text: 'difference'}
          - {line: 7, kind: highlight, at: '100 × 29.528', to: {doodle: tiles, part: numbers}}
        doodle_do:
          - {id: tiles, op: stage, stage: 'custom:1997_q02_a3'}
      - say: 'Multiplying by 100 moves the decimal point two places to the right, so we get 2952.8.'
        write: '$= 2952.8$'
        doodle_do:
          - {id: tiles, op: label, part: numbers, text: '= 2952.8'}
      - say: 'Now round to 3 significant figures. The first three significant digits are 2, 9 and 5.'
        write: 'First three significant figures: $2,\ 9,\ 5$'
      - say: 'The next digit is 2, which is less than 5, so the 5 stays as it is, and the digits after it become zeros.'
        write: 'Next digit $2 < 5$, so round down: $2952.8 \approx 2950$'
      - say: 'So the answer is 2950, which is answer choice B.'
        write: '$64.764^{2} - 35.236^{2} \approx 2950$'
        answer: true
    traps:
      A: 'You went for 2960. That rounds 2952.8 up, but the digit after the third significant figure is 2, which is less than 5, so we round down to 2950.'
      C: 'You went for 2860. That would need a difference of about 28.6, but 64.764 minus 35.236 is 29.528. With the sum exactly 100, the answer is 2952.8, which rounds to 2950.'
      D: 'You went for 2850. That comes from a difference of 28.528, as if 64 minus 35 were 28. It is 29, so the difference is 29.528, and 100 times that is 2952.8, which rounds to 2950.'
  3:
    moments:
      - say: 'We want 0.006 cubed plus 0.004 cubed, written in standard form.'
        write: '$(0.006)^{3} + (0.004)^{3}$'
      - say: 'Cubing tiny decimals is where zeros get lost, so let''s write each number in standard form first. 0.006 is 6 times 10 to the negative 3.'
        write: '$0.006 = 6 \times 10^{-3}$'
      - say: 'Two laws of indices: a product to a power is each factor to that power, and a power of a power multiplies the indices.'
        write: '$(ab)^{n} = a^{n}b^{n},\quad (a^{m})^{n} = a^{mn}$'
      - say: 'When we cube it, we cube the 6 and we cube the power of ten, separately.'
        write: '$(0.006)^{3} = 6^{3} \times \left(10^{-3}\right)^{3}$'
      - say: '6 cubed is 6 times 6 times 6, which is 216. Picture a cube 0.006 on a side, built from tiny blocks 0.001 long: 6 blocks along each edge, 216 blocks in all. For the power of ten, a power of a power multiplies the indices: negative 3 times 3 is negative 9, the size of one tiny block.'
        write: '$= 216 \times 10^{-9}$'
        doodle: {name: 'custom:1997_q03_a', id: cubes, caption: '216 blocks of 10⁻⁹', size: scene}
      - say: 'Now the second number. 0.004 is 4 times 10 to the negative 3.'
        write: '$0.004 = 4 \times 10^{-3}$'
      - say: 'Cube it the same way: 4 cubed, times 10 to the negative 3, cubed.'
        write: '$(0.004)^{3} = 4^{3} \times \left(10^{-3}\right)^{3}$'
      - say: '4 cubed is 64, and again the power of ten becomes 10 to the negative 9. Here is the second cube: 4 blocks along each edge, 64 blocks.'
        write: '$= 64 \times 10^{-9}$'
        doodle_do:
          - {id: cubes, op: stage, stage: 'custom:1997_q03_a2'}
      - say: 'Now add the two results we found. Both are counted in the same tiny blocks of 10 to the negative 9, so we just add the front numbers.'
        write: 'Sum $= 216 \times 10^{-9} + 64 \times 10^{-9}$'
        point:
          - {line: 8, kind: move, from: {line: 4, at: '216'}, at: '216', text: 'first cube'}
          - {line: 8, kind: move, from: {line: 7, at: '64'}, at: '+ 64', text: 'second cube'}
        doodle_do:
          - {id: cubes, op: circle, part: unit, text: 'same size blocks'}
      - say: '216 plus 64 is 280. Put the two cubes together and we have 280 of the same tiny blocks.'
        write: '$= 280 \times 10^{-9}$'
        point:
          - {line: 9, kind: highlight, at: '280', to: {doodle: cubes, part: total}}
        doodle_do:
          - {id: cubes, op: stage, stage: 'custom:1997_q03_a3'}
      - say: 'But this is not standard form yet: standard form needs one non-zero digit before the point. 280 is 2.8 times 10 squared.'
        write: '$280 = 2.8 \times 10^{2}$'
      - say: 'So replace the 280 in the sum. That gives 2.8 times 10 squared, times 10 to the negative 9.'
        write: 'Sum $= 2.8 \times 10^{2} \times 10^{-9}$'
        point:
          - {line: 11, kind: move, from: {line: 10, at: '2.8 × 102'}, at: '2.8 × 102', text: 'in place of 280'}
      - say: 'The law of indices for multiplying: when we multiply powers of the same base, we add the indices.'
        write: '$a^{m} \times a^{n} = a^{m + n}$'
      - say: 'When we multiply powers of ten, we add the indices. 2 plus negative 9 is negative 7.'
        write: '$= 2.8 \times 10^{2 + (-9)} = 2.8 \times 10^{-7}$'
      - say: 'So the answer is 2.8 times 10 to the negative 7, which is answer choice C.'
        write: '$(0.006)^{3} + (0.004)^{3} = 2.8 \times 10^{-7}$'
        answer: true
    traps:
      A: 'You went for 2.8 times 10 to the negative 9. That keeps the power from $280 \times 10^{-9}$, but turning 280 into 2.8 moves the point two places, so the index goes up by 2 to negative 7.'
      B: 'You went for 2.8 times 10 to the negative 8. That only accounts for one place of the point moving. 280 to 2.8 is two places, so the index rises from negative 9 to negative 7.'
      D: 'You went for 2.8 times 10 to the negative 6. That moves the index up by three. 280 is 2.8 times 10 squared, so negative 9 plus 2 gives negative 7.'
  4:
    moments:
      - say: 'We''re given $\log_{a}2 = 0.693$ and $\log_{a}3 = 1.097$, and we want $\log_{a}13.5$.'
        write: '$\log_{a}2 = 0.693,\quad \log_{a}3 = 1.097$'
      - say: 'We only know the logs of 2 and 3. So the plan is to build 13.5 out of 2s and 3s only.'
        write: 'Plan: write $13.5$ using only $2$s and $3$s'
      - say: '13.5 has a half in it, so double it: 13.5 times 2 is 27. That means 13.5 is 27 over 2.'
        write: '$13.5 = \dfrac{27}{2}$'
      - say: 'And 27 is 3 times 3 times 3, which is 3 cubed. Picture a cube of blocks, 3 along each edge.'
        write: '$27 = 3 \times 3 \times 3 = 3^{3}$'
        doodle: {name: 'custom:1997_q04_a', id: cube, caption: '27 = 3 × 3 × 3'}
      - say: 'So 13.5 is 3 cubed over 2: cut that cube in half. Only 3s and a 2, just as we wanted.'
        write: '$13.5 = \dfrac{3^{3}}{2}$'
        doodle_do:
          - {id: cube, op: stage, stage: 'custom:1997_q04_a2'}
      - say: 'Now take the log of both sides.'
        write: '$\log_{a}13.5 = \log_{a}\dfrac{3^{3}}{2}$'
      - say: 'Two laws of logs: the log of a quotient is the difference of the logs, and the log of a power is the power times the log.'
        write: '$\log\dfrac{M}{N} = \log M - \log N,\quad \log M^{n} = n\log M$'
      - say: 'The log of a quotient is the log of the top minus the log of the bottom.'
        write: '$= \log_{a}3^{3} - \log_{a}2$'
      - say: 'And the power law brings the power 3 down in front, as a multiplier. That 3 is the three edges of the cube.'
        write: '$= 3\log_{a}3 - \log_{a}2$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: 'loga3[[3]]'}, at: '= [[3]]log', text: 'power down in front'}
        doodle_do:
          - {id: cube, op: circle, part: edges, text: '3 log 3'}
      - say: 'Now put in the values from the first line: the log of 3 is 1.097, and the log of 2 is 0.693.'
        write: '$= 3(1.097) - 0.693$'
        point:
          - {line: 9, kind: move, from: {line: 0, at: '1.097'}, at: '(1.097)', text: 'log 3'}
          - {line: 9, kind: move, from: {line: 0, at: '0.693'}, at: '0.693', text: 'log 2'}
      - say: '3 times 1.097 is 3.291.'
        write: '$= 3.291 - 0.693$'
      - say: '3.291 minus 0.693 is 2.598.'
        write: '$= 2.598$'
      - say: 'So $\log_{a}13.5$ is 2.598, which is answer choice C.'
        write: '$\log_{a}13.5 = 2.598$'
        answer: true
    traps:
      A: 'You went for 1.404. That doesn''t come from $3\log_{a}3 - \log_{a}2$. The 3 comes from $27 = 3^{3}$, so multiply 1.097 by 3 to get 3.291, then subtract 0.693.'
      B: 'You went for 1.790. That is 1.097 plus 0.693, which is the log of 6, not 13.5. We need $3\log_{a}3 - \log_{a}2$.'
      D: 'You went for 2.790. Check the last step: 3.291 minus 0.693 is 2.598. Do the subtraction carefully, borrowing where needed.'
  5:
    moments:
      - say: 'We want to simplify $\log_{2}96$ minus $2\log_{2}6$.'
        write: '$\log_{2}96 - 2\log_{2}6$'
      - say: 'Two laws of logs: a number in front of a log can go inside as a power, and a difference of logs is the log of a quotient.'
        write: '$n\log M = \log M^{n},\quad \log M - \log N = \log\dfrac{M}{N}$'
      - say: 'Two logs can only be combined into one when there is no number in front. So the first thing we do is move the 2 in front of the second log inside it, as a power. That''s the power law.'
        write: 'Power law: $2\log_{2}6 = \log_{2}6^{2}$'
        point:
          - {line: 2, kind: move, from: {line: 2, at: '[[2]]log'}, at: '6[[2]]', text: 'up as the power'}
      - say: '6 squared is 36.'
        write: '$= \log_{2}36$'
      - say: 'Put that back into the expression. It becomes $\log_{2}96$ minus $\log_{2}36$.'
        write: '$\log_{2}96 - 2\log_{2}6 = \log_{2}96 - \log_{2}36$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '36'}, at: '36', text: 'power law'}
      - say: 'A difference of logs with the same base is the log of a quotient: the first number over the second.'
        write: '$= \log_{2}\dfrac{96}{36}$'
      - say: 'Now simplify 96 over 36. Both divide by 12: 96 divided by 12 is 8, and 36 divided by 12 is 3.'
        write: '$\dfrac{96}{36} = \dfrac{96 \div 12}{36 \div 12} = \dfrac{8}{3}$'
      - say: 'So the expression is the log base 2 of 8 over 3.'
        write: '$\log_{2}96 - 2\log_{2}6 = \log_{2}\dfrac{8}{3}$'
      - say: 'The options have $\log_{2}3$ on its own, so let''s split the quotient back up: the log of 8 minus the log of 3.'
        write: '$= \log_{2}8 - \log_{2}3$'
      - say: 'What is $\log_{2}8$? It asks: how many 2s must we multiply to make 8? Count the blocks: 2 times 2 times 2 is 8.'
        write: '$2^{3} = 8$, so $\log_{2}8 = 3$'
        doodle: {name: 'custom:1997_q05_a', id: twos, caption: 'how many 2s make 8?'}
      - say: 'That''s three 2s, so $\log_{2}8$ is 3. Replace $\log_{2}8$ in our line with 3.'
        write: '$= 3 - \log_{2}3$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '= 3'}, at: '= 3', text: 'log2 8'}
          - {line: 10, kind: highlight, at: '3 - ', to: {doodle: twos, part: answer}}
        doodle_do:
          - {id: twos, op: stage, stage: 'custom:1997_q05_a2'}
      - say: 'So the expression simplifies to 3 minus $\log_{2}3$, which is answer choice B.'
        write: '$\log_{2}96 - 2\log_{2}6 = 3 - \log_{2}3$'
        answer: true
    traps:
      A: 'You went for 2 minus $\log_{2}3$. That comes from reducing 96 over 36 to 4 over 3. Both divide by 12, giving 8 over 3, and $\log_{2}8$ is 3.'
      C: 'You went for $\log_{2}3$ minus 3. That is the right pieces with the order reversed, as if you''d done 36 over 96. The first log is $\log_{2}96$, so the 8 goes on top.'
      D: 'You went for $\log_{2}3$ minus 2. The signs are reversed and the 8 has become a 4. 96 over 36 is 8 over 3, giving 3 minus $\log_{2}3$.'
  6:
    moments:
      - say: 'We need $x$ when 8 to the power $x$ over 2 equals 2 to the power 3 over 8, times 4 to the power 3 over 4.'
        write: '$8^{x/2} = 2^{3/8} \times 4^{3/4}$'
      - say: 'Every number here, 8, 2 and 4, is a power of 2. Picture them as towers of 2s: 2 is one block, 4 is two blocks, 8 is three. So the plan is to write each side as a single power of 2, and then compare the powers.'
        write: 'Plan: write everything in base $2$'
        doodle: {name: 'custom:1997_q06_a', id: towers, caption: '2, 4 and 8 as towers of 2s'}
      - say: 'Two laws of indices: a power of a power multiplies the indices, and multiplying powers of the same base adds the indices.'
        write: '$(a^{m})^{n} = a^{mn},\quad a^{m} \times a^{n} = a^{m + n}$'
      - say: 'Start with the left side. 8 is the tower of three 2s: 2 cubed.'
        write: 'Left: $8^{x/2} = \left(2^{3}\right)^{x/2}$'
        doodle_do:
          - {id: towers, op: circle, part: eight, text: '8 = 2³'}
      - say: 'A power of a power multiplies the indices. 3 times $x$ over 2 is $3x$ over 2.'
        write: '$= 2^{3 \times \frac{x}{2}} = 2^{3x/2}$'
      - say: 'Now the right side. 2 to the 3 over 8 is already a power of 2. And 4 is the tower of two 2s: 2 squared.'
        write: 'Right: $4^{3/4} = \left(2^{2}\right)^{3/4}$'
        doodle_do:
          - {id: towers, op: circle, part: four, text: '4 = 2²'}
      - say: 'Multiply the indices again. 2 times 3 over 4 is 6 over 4, which simplifies to 3 over 2.'
        write: '$= 2^{2 \times \frac{3}{4}} = 2^{6/4} = 2^{3/2}$'
      - say: 'So the right side is 2 to the 3 over 8, times 2 to the 3 over 2. When we multiply powers of the same base, we add the indices.'
        write: '$2^{3/8} \times 2^{3/2} = 2^{\frac{3}{8} + \frac{3}{2}}$'
      - say: 'To add, put both over 8. 3 over 2 is 12 over 8, and 3 plus 12 is 15, so the sum is 15 over 8.'
        write: '$\dfrac{3}{8} + \dfrac{3}{2} = \dfrac{3}{8} + \dfrac{12}{8} = \dfrac{15}{8}$'
      - say: 'Now put the two sides together: 2 to the $3x$ over 2 equals 2 to the 15 over 8.'
        write: '$2^{3x/2} = 2^{15/8}$'
        point:
          - {line: 9, kind: move, from: {line: 4, at: '23x/2'}, at: '23x/2', text: 'left side'}
          - {line: 9, kind: move, from: {line: 8, at: '= 815'}, at: '15/8', text: 'right side'}
      - say: 'The bases are the same, so the powers must be equal.'
        write: '$\dfrac{3x}{2} = \dfrac{15}{8}$'
      - say: 'To get $x$ by itself, multiply both sides by 2 over 3.'
        write: '$x = \dfrac{15}{8} \times \dfrac{2}{3}$'
      - say: '15 times 2 is 30, and 8 times 3 is 24.'
        write: '$= \dfrac{30}{24}$'
      - say: 'Both divide by 6. 30 divided by 6 is 5, and 24 divided by 6 is 4.'
        write: '$= \dfrac{5}{4}$'
      - say: 'So $x$ is 5 over 4, which is answer choice D.'
        write: '$x = \dfrac{5}{4}$'
        answer: true
    traps:
      A: 'You went for 3 over 8. That''s just the first index on the right. We need to combine both powers into $2^{15/8}$ and then solve $\tfrac{3x}{2} = \tfrac{15}{8}$.'
      B: 'You went for 3 over 4. That''s the index on the 4, not $x$. Change everything to base 2, add the indices on the right, then solve for $x$.'
      C: 'You went for 4 over 5. That is the answer upside down. From $\tfrac{3x}{2} = \tfrac{15}{8}$, multiply by $\tfrac{2}{3}$ to get $\tfrac{30}{24}$, which is $\tfrac{5}{4}$.'
  7:
    moments:
      - say: 'We want to simplify $2\sqrt{3} + 3\sqrt{5}$ over $3\sqrt{5} - 2\sqrt{3}$.'
        write: '$\dfrac{2\sqrt{3} + 3\sqrt{5}}{3\sqrt{5} - 2\sqrt{3}}$'
      - say: 'Surds in the denominator are cleared with the conjugate: the same two terms with the middle sign flipped. The bottom is $3\sqrt{5} - 2\sqrt{3}$, so its conjugate is $3\sqrt{5} + 2\sqrt{3}$.'
        write: 'Conjugate of $3\sqrt{5} - 2\sqrt{3}$ is $3\sqrt{5} + 2\sqrt{3}$'
      - say: 'Multiply the top and the bottom by the conjugate. Multiplying top and bottom by the same thing doesn''t change the value.'
        write: '$= \dfrac{(2\sqrt{3} + 3\sqrt{5})(3\sqrt{5} + 2\sqrt{3})}{(3\sqrt{5} - 2\sqrt{3})(3\sqrt{5} + 2\sqrt{3})}$'
      - say: 'The difference of two squares: $a$ minus $b$, times $a$ plus $b$, is $a$ squared minus $b$ squared.'
        write: '$(a - b)(a + b) = a^{2} - b^{2}$'
      - say: 'Let''s do the bottom first. It''s $a$ minus $b$ times $a$ plus $b$, which is a difference of two squares: $3\sqrt{5}$ squared minus $2\sqrt{3}$ squared.'
        write: 'Bottom $= (3\sqrt{5})^{2} - (2\sqrt{3})^{2}$'
      - say: 'When we square $3\sqrt{5}$, we square the 3 and the root 5. Picture a square with side $3\sqrt{5}$: it is 3 tiles by 3 tiles, and each tile of side root 5 has area 5. So 9 tiles of 5, which is 45.'
        write: '$(3\sqrt{5})^{2} = 9 \times 5 = 45$'
        doodle: {name: 'custom:1997_q07_a', id: tiles, caption: 'a square of side 3√5', size: scene}
      - say: 'In the same way, $2\sqrt{3}$ squared is a square 2 tiles by 2, each tile of area 3: 4 times 3, which is 12.'
        write: '$(2\sqrt{3})^{2} = 4 \times 3 = 12$'
        doodle_do:
          - {id: tiles, op: stage, stage: 'custom:1997_q07_a2'}
      - say: 'So the bottom is the big square take away the small one: 45 minus 12, which is 33.'
        write: 'Bottom $= 45 - 12 = 33$'
        point:
          - {line: 7, kind: highlight, at: '45 - 12 = 33', to: {doodle: tiles, part: result}}
        doodle_do:
          - {id: tiles, op: stage, stage: 'custom:1997_q07_a3'}
      - say: 'Now the top. There are four products. First, $2\sqrt{3}$ times $3\sqrt{5}$: 2 times 3 is 6, and root 3 times root 5 is root 15.'
        write: '$2\sqrt{3} \times 3\sqrt{5} = 6\sqrt{15}$'
      - say: 'Next, $2\sqrt{3}$ times $2\sqrt{3}$ is 4 times 3, which is 12.'
        write: '$2\sqrt{3} \times 2\sqrt{3} = 4 \times 3 = 12$'
      - say: 'Then $3\sqrt{5}$ times $3\sqrt{5}$ is the big square of tiles again: 9 times 5, which is 45.'
        write: '$3\sqrt{5} \times 3\sqrt{5} = 9 \times 5 = 45$'
        doodle_do:
          - {id: tiles, op: pulse, part: big}
      - say: 'And $3\sqrt{5}$ times $2\sqrt{3}$ is another $6\sqrt{15}$.'
        write: '$3\sqrt{5} \times 2\sqrt{3} = 6\sqrt{15}$'
      - say: 'Add the four products. 12 plus 45 is 57, and $6\sqrt{15}$ plus $6\sqrt{15}$ is $12\sqrt{15}$.'
        write: 'Top $= 6\sqrt{15} + 12 + 45 + 6\sqrt{15} = 57 + 12\sqrt{15}$'
      - say: 'Now put the top and the bottom together: 57 plus $12\sqrt{15}$, all over 33.'
        write: '$\dfrac{2\sqrt{3} + 3\sqrt{5}}{3\sqrt{5} - 2\sqrt{3}} = \dfrac{57 + 12\sqrt{15}}{33}$'
        point:
          - {line: 13, kind: move, from: {line: 12, at: '57 + 12'}, at: '57 + 12', text: 'top'}
          - {line: 13, kind: move, from: {line: 7, at: '= 33'}, at: '33', text: 'bottom'}
      - say: 'Every number divides by 3. 57 divided by 3 is 19, 12 divided by 3 is 4, and 33 divided by 3 is 11.'
        write: '$= \dfrac{19 + 4\sqrt{15}}{11}$'
      - say: 'So the answer is 19 plus $4\sqrt{15}$, all over 11, which is answer choice A.'
        write: '$= \dfrac{19 + 4\sqrt{15}}{11}$'
        answer: true
    traps:
      B: 'You went for the right numerator over 19. The denominator comes from $45 - 12 = 33$, and dividing by 3 gives 11, not 19. Square the 3 and the 2 as well as the surds.'
      C: 'You went for $2\sqrt{15}$ on top. That happens if you count only one of the two cross terms. There are two lots of $6\sqrt{15}$, making $12\sqrt{15}$, and dividing by 3 gives $4\sqrt{15}$.'
      D: 'You went for $2\sqrt{15}$ over 19. Both the surd term and the denominator have slipped. The cross terms give $12\sqrt{15}$, and the denominator is $45 - 12 = 33$; dividing everything by 3 gives $\tfrac{19 + 4\sqrt{15}}{11}$.'
  8:
    moments:
      - say: '₦1,000 grows to ₦1,240 in 3 years at simple interest. Picture a jar holding the ₦1,000, with room at the top for what it earns. We want the rate per cent per annum.'
        write: 'Principal $P = 1000$, amount $A = 1240$, time $T = 3$'
        doodle: {name: 'custom:1997_q08_a', id: jar, caption: '₦1,000 grows to ₦1,240 in 3 years'}
      - say: 'Simple interest is earned only on the original sum, the same amount every year. The formula is $I$ equals $PRT$ over 100.'
        write: '$I = \dfrac{PRT}{100}$'
      - say: 'Careful: ₦1,240 is the final amount, not the interest. The interest is how much the money grew by.'
        write: 'Interest $=$ amount $-$ principal'
      - say: 'That''s 1,240 minus 1,000, which is 240. That is the empty space at the top of the jar.'
        write: '$I = 1240 - 1000 = 240$'
        point:
          - {line: 3, kind: highlight, at: '= 240', to: {doodle: jar, part: top}}
        doodle_do:
          - {id: jar, op: label, part: top, text: 'interest ₦240'}
      - say: 'Now substitute into the formula: $I$ is the 240 we just found, $P$ is 1,000 and $T$ is 3.'
        write: '$240 = \dfrac{1000 \times R \times 3}{100}$'
        point:
          - {line: 1, kind: box, text: 'the rule'}
          - {line: 4, kind: move, from: {line: 3, at: '= 240'}, at: '240', text: 'interest'}
          - {line: 4, kind: move, from: {line: 0, at: '= 1000'}, at: '1000', text: 'P'}
      - say: '1,000 times 3 is 3,000, so the top is $3000R$.'
        write: '$240 = \dfrac{3000R}{100}$'
      - say: '3,000 divided by 100 is 30, so the right side is $30R$.'
        write: '$240 = 30R$'
      - say: 'To get $R$ by itself, divide both sides by 30. 240 divided by 30 is 8.'
        write: '$R = \dfrac{240}{30} = 8$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '30R'}, at: '30', text: 'divide it over'}
      - say: 'Let''s check. 8% of ₦1,000 is 8 over 100 of 1,000, which is ₦80 a year. Watch one ₦80 coin arrive for each year.'
        write: 'Check: $8\%$ of $1000 = \dfrac{8}{100} \times 1000 = 80$ per year'
        doodle_do:
          - {id: jar, op: stage, stage: 'custom:1997_q08_a2'}
      - say: 'Over 3 years that''s 3 times 80, which is 240, and the jar fills to 1,000 plus 240, which is 1,240. It works.'
        write: '$3 \times 80 = 240$, and $1000 + 240 = 1240$'
        doodle_do:
          - {id: jar, op: fill, to: 1, fill: interest}
      - say: 'So the rate is 8% per annum, which is answer choice B.'
        write: 'Rate $= 8\%$ per annum'
        answer: true
    traps:
      A: 'You went for 6%. At 6% the interest would be ₦60 a year, only ₦180 over 3 years. The interest here is ₦240, so $30R = 240$ gives 8%.'
      C: 'You went for 10%. At 10% the interest would be ₦100 a year, ₦300 over 3 years. We need ₦240, which is 8% a year.'
      D: 'You went for 12%. At 12% the interest would be ₦360 over 3 years. The interest is 1,240 minus 1,000, which is ₦240, giving 8%.'
  9:
    moments:
      - say: 'We have $X$ equals S, P, E, N, D, then $Y$ equals P, N, O, U, R, and $Z$ equals L, O, U, D. We want $X$ intersect, bracket, $Y$ union $Z$.'
        write: '$X \cap (Y \cup Z)$'
      - say: 'Let me draw a Venn diagram, so we can see where everything belongs.'
        show_sketch: true
      - say: 'We work from the inside out, so the bracket comes first: $Y$ union $Z$.'
        write: '$Y = \{P, N, O, U, R\},\quad Z = \{L, O, U, D\}$'
        point:
          - {figure: sketch, kind: circle, target: 'Y'}
          - {figure: sketch, kind: circle, target: 'Z'}
      - say: 'A union collects every letter that is in either set. Start by taking all of $Y$.'
        write: 'From $Y$: $P, N, O, U, R$'
      - say: 'Now add the letters of $Z$ that aren''t there yet. O and U are already listed, so we only add L and D.'
        write: 'New from $Z$: $L, D$'
        point:
          - {figure: sketch, kind: circle, target: 'L', text: 'new'}
          - {figure: sketch, kind: circle, target: 'D', text: 'new'}
      - say: 'So the union is P, N, O, U, R, L, D.'
        write: '$Y \cup Z = \{P, N, O, U, R, L, D\}$'
      - say: 'Now the intersection with $X$. An intersection keeps only the letters that are in both sets.'
        write: '$X = \{S, P, E, N, D\}$'
      - say: 'Go through $X$ one letter at a time, and look for it in the union we just wrote. Is S there? No. Is P? Yes.'
        write: '$S$: no, $P$: yes'
        point:
          - {line: 5, kind: arrow, text: 'look here'}
      - say: 'Is E there? No. Is N? Yes. Is D? Yes.'
        write: '$E$: no, $N$: yes, $D$: yes'
      - say: 'So the letters we keep are P, N and D.'
        write: '$X \cap (Y \cup Z) = \{P, N, D\}$'
        point:
          - {figure: sketch, kind: circle, target: 'P, N', text: 'kept'}
          - {figure: sketch, kind: circle, target: 'D', text: 'kept'}
      - say: 'Here''s a quick check. Anything intersected with $X$ must sit inside $X$. The other options contain O, U or R, which are not in $X$ at all, so they can''t be right.'
        write: 'Check: the answer must be a subset of $X$'
      - say: 'So the answer is the set P, N, D, which is answer choice C.'
        write: '$X \cap (Y \cup Z) = \{P, N, D\}$'
        answer: true
    traps:
      A: 'You went for P, O, U, R. O, U and R are not in $X$ at all, so they can''t be in an intersection with $X$. That set is closer to $Y$ itself.'
      B: 'You went for S, P, D, R. R is not in $X$, and S is not in $Y \cup Z$. Keep only the letters of $X$ that also appear in the union.'
      D: 'You went for N, D, U. U is not in $X$, so it can''t be in the intersection, and P has been missed. The answer is P, N, D.'
  10:
    moments:
      - say: 'Of 100 students, 80 speak Hausa, 20 speak Igbo and 9 speak both. Picture the four kinds of student: Hausa, Igbo, both, and the quiet one who speaks neither. We want how many speak neither.'
        write: 'Total $100$: $n(H) = 80,\ n(I) = 20,\ n(H \cap I) = 9$'
        doodle: {name: 'custom:1997_q10_a', id: talk, caption: 'who speaks neither?'}
      - say: 'Let me draw a Venn diagram, so we can see where everything belongs.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '80'}
          - {figure: sketch, kind: circle, target: '20'}
          - {figure: sketch, kind: circle, target: '9', text: 'both'}
      - say: 'The plan: first find how many speak at least one of the languages, then take 100 minus that.'
        write: 'Plan: neither $= 100 - n(H \cup I)$'
        point:
          - {figure: sketch, kind: underline, target: neither}
      - say: 'To count those who speak at least one language, we use the addition rule.'
        write: '$n(H \cup I) = n(H) + n(I) - n(H \cap I)$'
      - say: 'Why subtract the ones who speak both? Look at the student who speaks both: they are counted once among the Hausa speakers and again among the Igbo speakers. Taking them off once means everyone is counted exactly once.'
        write: 'The $9$ are inside both the $80$ and the $20$, so subtract them once'
        doodle_do:
          - {id: talk, op: circle, part: both, text: 'counted twice'}
      - say: 'Now substitute the numbers.'
        write: '$n(H \cup I) = 80 + 20 - 9$'
        point:
          - {line: 5, kind: move, from: {line: 0, at: '80'}, at: '80'}
          - {line: 5, kind: move, from: {line: 0, at: '20'}, at: '20'}
          - {line: 5, kind: move, from: {line: 0, at: '= 9'}, at: '− 9', text: 'both, once'}
      - say: '80 plus 20 is 100.'
        write: '$= 100 - 9$'
      - say: '100 minus 9 is 91. So 91 students speak at least one of the two languages: the Hausa speakers, the Igbo speakers and those who speak both.'
        write: '$= 91$'
        doodle_do:
          - {id: talk, op: label, part: hausa, text: '91 speak at least one'}
      - say: 'Now go back to our plan. Everyone else speaks neither, so it is the total of 100 minus that 91.'
        write: 'Neither $= 100 - 91$'
        point:
          - {line: 2, kind: box, text: 'the plan'}
          - {line: 8, kind: move, from: {line: 0, at: '100'}, at: '100', text: 'total'}
          - {line: 8, kind: move, from: {line: 7, at: '91'}, at: '91', text: 'at least one'}
      - say: '100 minus 91 is 9. That is how many quiet students speak neither.'
        write: '$= 9$'
        point:
          - {line: 9, kind: highlight, at: '= 9', to: {doodle: talk, part: neither}}
        doodle_do:
          - {id: talk, op: label, part: neither, text: '9 students'}
      - say: 'So 9 students speak neither language, which is answer choice B.'
        write: 'Neither Hausa nor Igbo: $9$ students'
        answer: true
        point:
          - {figure: sketch, kind: label, target: '?', text: '9'}
    traps:
      A: 'You went for 0. Adding 80 and 20 gives 100, which makes it look like everyone is covered. But 9 students are counted twice, so only 91 speak at least one language, leaving 9.'
      C: 'You went for 11. That is 20 minus 9, the number who speak Igbo only. The question wants those who speak neither, which is 100 minus 91.'
      D: 'You went for 20. That is the number who speak Igbo. The students who speak neither are 100 minus 91, which is 9.'
  11:
    moments:
      - say: 'The function $x^{3} + 2x^{2} + qx - 6$ is divisible by $x + 1$, and we want $q$.'
        write: '$f(x) = x^{3} + 2x^{2} + qx - 6$'
      - say: 'Divisible by $x + 1$ means $x + 1$ is a factor, so dividing by it leaves no remainder.'
        write: 'Divisible by $x + 1$: remainder $= 0$'
      - say: 'The factor theorem turns that into a substitution: if $x - a$ is a factor, then $f(a)$ is zero.'
        write: 'Factor theorem: $(x - a)$ is a factor $\Rightarrow f(a) = 0$'
      - say: 'Which value do we use? Set the factor to zero: $x + 1 = 0$ gives $x = -1$. Picture $f$ as a machine: we feed it negative 1, and because $x + 1$ is a factor, it must give out 0.'
        write: '$x + 1 = 0 \Rightarrow x = -1$'
        doodle: {name: 'custom:1997_q11_a', id: machine, caption: 'f(−1) must give out 0'}
      - say: 'So let''s drop negative 1 into the machine: replace every $x$ in $f(x)$ with negative 1.'
        write: '$f(-1) = (-1)^{3} + 2(-1)^{2} + q(-1) - 6$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
          - {line: 4, kind: move, from: {line: 3, at: '−1'}, at: '= [[(−1)]]3', text: 'every x'}
        doodle_do:
          - {id: machine, op: move, part: card, path: in}
      - say: 'Take it term by term. Negative 1 cubed is negative 1, because an odd power of negative 1 stays negative.'
        write: '$(-1)^{3} = -1$'
      - say: 'Negative 1 squared is positive 1, because an even power turns it positive. So 2 times that is 2.'
        write: '$2(-1)^{2} = 2(1) = 2$'
      - say: 'And $q$ times negative 1 is negative $q$.'
        write: '$q(-1) = -q$'
      - say: 'Put those three pieces back into $f$ of negative 1.'
        write: '$f(-1) = -1 + 2 - q - 6$'
        point:
          - {line: 8, kind: move, from: {line: 5, at: '= −1'}, at: '= [[−1]]'}
          - {line: 8, kind: move, from: {line: 6, at: '(1) = [[2]]'}, at: '+ 2'}
          - {line: 8, kind: move, from: {line: 7, at: '= −q'}, at: '− q'}
      - say: 'Negative 1 plus 2 is 1, and 1 minus 6 is negative 5. So we have negative 5 minus $q$.'
        write: '$= -5 - q$'
      - say: 'Because $x + 1$ is a factor, this must equal zero, the 0 the machine gives out.'
        write: '$-5 - q = 0$'
        point:
          - {line: 10, kind: highlight, at: '= 0', to: {doodle: machine, part: out}}
        doodle_do:
          - {id: machine, op: circle, part: out, text: 'must be 0'}
      - say: 'Add $q$ to both sides: negative 5 equals $q$. That is the $q$ that makes the machine give 0.'
        write: '$q = -5$'
        point:
          - {line: 11, kind: move, from: {line: 10, at: '− q'}, at: 'q', text: 'across the ='}
        doodle_do:
          - {id: machine, op: label, part: machine, text: 'q = −5'}
      - say: 'Let''s check. With $q = -5$, $f$ of negative 1 is negative 1, plus 2, plus 5, minus 6, which is zero. It works.'
        write: 'Check: $f(-1) = -1 + 2 + 5 - 6 = 0$'
      - say: 'So $q$ is negative 5, which is answer choice A.'
        write: '$q = -5$'
        answer: true
    traps:
      B: 'You went for negative 2. Put $x = -1$ in carefully: $-1 + 2 - q - 6$ is $-5 - q$, and setting that to zero gives $q = -5$.'
      C: 'You went for 2. Remember to use $x = -1$, the value that makes $x + 1$ zero. That gives $-5 - q = 0$, so $q = -5$.'
      D: 'You went for 5. That''s the right size with the wrong sign, which happens if $q$ times negative 1 is written as plus $q$. It''s minus $q$, so $-5 - q = 0$ gives $q = -5$.'
  12:
    moments:
      - say: 'We need to solve 2 over $x$ minus 3 over $y$ equals 2, and 4 over $x$ plus 3 over $y$ equals 10.'
        write: '$\dfrac{2}{x} - \dfrac{3}{y} = 2,\qquad \dfrac{4}{x} + \dfrac{3}{y} = 10$'
      - say: 'Picture each 1 over $x$ as a blue tile and each 1 over $y$ as a pink tile. The first equation takes away 3 pink tiles; the second adds 3 pink tiles. So if we add the equations, the pinks cancel.'
        write: 'The $\dfrac{3}{y}$ terms have opposite signs, so add the equations'
        doodle: {name: 'custom:1997_q12_a', id: tiles, caption: 'blue tile 1/x, pink tile 1/y', size: scene}
      - say: 'Let''s add them, left side to left side and right side to right side. Look at the pink tiles in the picture.'
        write: '$\dfrac{2}{x} + \dfrac{4}{x} - \dfrac{3}{y} + \dfrac{3}{y} = 2 + 10$'
        doodle_do:
          - {id: tiles, op: circle, part: pinks, text: '−3/y and +3/y'}
      - say: 'The $y$ terms cancel: watch the pink tiles cross out. 2 over $x$ plus 4 over $x$ is 6 blue tiles, 6 over $x$, and 2 plus 10 is 12.'
        write: '$\dfrac{6}{x} = 12$'
        point:
          - {line: 2, kind: strike, at: '−y3', text: 'cancel'}
          - {line: 2, kind: strike, at: '+y3'}
          - {line: 3, kind: highlight, at: '12', to: {doodle: tiles, part: row3}}
        doodle_do:
          - {id: tiles, op: stage, stage: 'custom:1997_q12_a2'}
      - say: 'Multiply both sides by $x$ to bring it up from the bottom.'
        write: '$6 = 12x$'
      - say: 'Divide both sides by 12. 6 over 12 simplifies to 1 over 2. So 6 blue tiles make 12: each blue tile, 1 over $x$, is worth 2.'
        write: '$x = \dfrac{6}{12} = \dfrac{1}{2}$'
        doodle_do:
          - {id: tiles, op: label, part: row3, text: 'one tile 1/x = 2, so x = ½'}
      - say: 'Now find $y$. Go back to the first equation and put in $x$ equals a half.'
        write: '$\dfrac{2}{1/2} - \dfrac{3}{y} = 2$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '= 21'}, at: '1/2', text: 'sub in x'}
      - say: 'Dividing by a half is the same as multiplying by 2, so 2 over a half is 2 times 2, which is 4.'
        write: '$\dfrac{2}{1/2} = 2 \times 2 = 4$'
      - say: 'So the first equation becomes 4 minus 3 over $y$ equals 2.'
        write: '$4 - \dfrac{3}{y} = 2$'
      - say: 'Add 3 over $y$ to both sides, and subtract 2 from both sides. 4 minus 2 is 2.'
        write: '$\dfrac{3}{y} = 4 - 2 = 2$'
      - say: 'Multiply both sides by $y$: 3 equals $2y$.'
        write: '$3 = 2y$'
      - say: 'Divide by 2, and $y$ is 3 over 2.'
        write: '$y = \dfrac{3}{2}$'
      - say: 'Check in the second equation. 4 divided by a half is 8, and 3 divided by 3 over 2 is 2. 8 plus 2 is 10. It works.'
        write: 'Check: $\dfrac{4}{1/2} + \dfrac{3}{3/2} = 8 + 2 = 10$'
      - say: 'So $x$ is 1 over 2 and $y$ is 3 over 2, which is answer choice B.'
        write: '$x = \dfrac{1}{2},\quad y = \dfrac{3}{2}$'
        answer: true
    traps:
      A: 'You went for $x = \tfrac{3}{2}$ and $y = \tfrac{1}{2}$. Those are the right numbers swapped. Adding the equations gives $\tfrac{6}{x} = 12$, so it''s $x$ that is 1 over 2.'
      C: 'You went for both negative. Check in the first equation: 2 divided by negative a half is negative 4, and 3 divided by negative 3 over 2 is negative 2. That gives negative 4 minus negative 2, which is negative 2, not 2.'
      D: 'You went for $y = -\tfrac{3}{2}$. From $4 - \tfrac{3}{y} = 2$ we get $\tfrac{3}{y} = 2$, which is positive, so $y$ is positive 3 over 2.'
  13:
    moments:
      - say: 'We want the minimum value of $x^{2} - 3x + 2$.'
        write: '$y = x^{2} - 3x + 2$'
      - say: 'Let me sketch the graph, so we can see its shape.'
        show_sketch: true
        point:
          - {figure: sketch, kind: underline, target: 'y = x² − 3x + 2'}
      - say: 'The number in front of $x^{2}$ is positive, so the graph is a U shape that opens upwards. Its lowest point is the turning point, and that''s the minimum we want.'
        write: 'Coefficient of $x^{2}$ is positive, so the curve has a lowest point'
        point:
          - {figure: sketch, kind: circle, target: {x: 175, y: 184.5}, text: 'lowest point'}
      - say: 'The turning point is at $x$ equals negative $b$ over $2a$.'
        write: 'Turning point: $x = -\dfrac{b}{2a}$'
      - say: 'Compare with our expression. $a$ is the number in front of $x^{2}$, which is 1, and $b$ is the number in front of $x$, which is negative 3.'
        write: '$a = 1,\quad b = -3$'
      - say: 'Substitute them in: negative, bracket negative 3, over 2 times 1.'
        write: '$x = -\dfrac{(-3)}{2(1)}$'
        point:
          - {line: 3, kind: box, text: 'the rule'}
          - {line: 5, kind: move, from: {line: 4, at: '−3'}, at: '(−3)', text: 'b'}
          - {line: 5, kind: move, from: {line: 4, at: 'a = [[1]]'}, at: '(1)', text: 'a'}
      - say: 'Two negatives make a positive, and 2 times 1 is 2. So $x$ is 3 over 2.'
        write: '$= \dfrac{3}{2}$'
        point:
          - {figure: sketch, kind: label, target: {x: 175, y: 184.5}, text: 'x = 3/2'}
      - say: 'To get the minimum value, put $x$ equals 3 over 2 back into the expression.'
        write: 'Minimum $= \left(\dfrac{3}{2}\right)^{2} - 3\left(\dfrac{3}{2}\right) + 2$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '23'}, at: '[[(23)]]2 −', text: 'x here'}
          - {line: 7, kind: move, from: {line: 6, at: '23'}, at: '3[[(23)]]'}
      - say: '3 over 2, squared, is 9 over 4. And 3 times 3 over 2 is 9 over 2.'
        write: '$= \dfrac{9}{4} - \dfrac{9}{2} + 2$'
      - say: 'Put everything over 4. 9 over 2 is 18 over 4, and 2 is 8 over 4.'
        write: '$= \dfrac{9}{4} - \dfrac{18}{4} + \dfrac{8}{4}$'
      - say: 'Combine the tops. 9 minus 18 is negative 9, and negative 9 plus 8 is negative 1.'
        write: '$= \dfrac{9 - 18 + 8}{4} = -\dfrac{1}{4}$'
      - say: 'Does a negative answer make sense? The expression factorises as $x - 1$ times $x - 2$, so the curve crosses the axis at 1 and 2 and dips below it in between. Yes, it does.'
        write: '$x^{2} - 3x + 2 = (x - 1)(x - 2)$'
        point:
          - {figure: sketch, kind: circle, target: '1'}
          - {figure: sketch, kind: circle, target: {x: 210, y: 175}}
      - say: 'So the minimum value is negative a quarter, which is answer choice A.'
        write: 'Minimum value $= -\dfrac{1}{4}$'
        answer: true
        point:
          - {figure: sketch, kind: label, target: 'lowest value = ?', text: '−1/4'}
    traps:
      B: 'You went for negative a half. Put everything over 4 carefully: $\tfrac{9}{4} - \tfrac{18}{4} + \tfrac{8}{4}$ is negative 1 over 4.'
      C: 'You went for positive a quarter. The curve dips below the axis between its roots 1 and 2, so its minimum must be negative. Check the signs: 9 minus 18 plus 8 is negative 1.'
      D: 'You went for a half. Substituting $x = \tfrac{3}{2}$ gives $\tfrac{9}{4} - \tfrac{9}{2} + 2$, which is negative 1 over 4, not a half.'
  14:
    moments:
      - say: 'We want to make $f$ the subject of $t$ equals the square root of $v$ over, bracket, 1 over $f$ plus 1 over $g$. Picture $f$ locked inside four boxes, one inside the other.'
        write: '$t = \sqrt{\dfrac{v}{\dfrac{1}{f} + \dfrac{1}{g}}}$'
        doodle: {name: 'custom:1997_q14_a', id: boxes, caption: 'f locked inside four boxes', size: scene}
      - say: 'We unlock them from the outside in, one at a time. The outside box is the square root: square both sides to remove it.'
        write: '$t^{2} = \dfrac{v}{\dfrac{1}{f} + \dfrac{1}{g}}$'
        doodle_do:
          - {id: boxes, op: cross, part: root}
      - say: 'Now the bracket, 1 over $f$ plus 1 over $g$, is the denominator. Multiply both sides by it.'
        write: '$t^{2}\left(\dfrac{1}{f} + \dfrac{1}{g}\right) = v$'
        point:
          - {line: 2, kind: move, from: {line: 1, at: 'f1 + g1'}, at: '(f1 + g1)', text: 'times both sides'}
      - say: 'Divide both sides by $t^{2}$. That opens the second box: $f$ is no longer under $v$.'
        write: '$\dfrac{1}{f} + \dfrac{1}{g} = \dfrac{v}{t^{2}}$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: 't2'}, at: 't2', text: 'divide it over'}
        doodle_do:
          - {id: boxes, op: cross, part: frac}
      - say: 'Subtract 1 over $g$ from both sides, so the $f$ term is alone. The third box is open.'
        write: '$\dfrac{1}{f} = \dfrac{v}{t^{2}} - \dfrac{1}{g}$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '+ g1'}, at: '− g1', text: 'across the ='}
        doodle_do:
          - {id: boxes, op: cross, part: plus}
      - say: 'To subtract these two fractions we need a common denominator. The bottoms are $t^{2}$ and $g$, so we use $g$ times $t^{2}$.'
        write: 'Common denominator: $gt^{2}$'
      - say: 'For $v$ over $t^{2}$, multiply the top and the bottom by $g$. That gives $gv$ over $gt^{2}$.'
        write: '$\dfrac{v}{t^{2}} = \dfrac{gv}{gt^{2}}$'
      - say: 'For 1 over $g$, multiply the top and the bottom by $t^{2}$. That gives $t^{2}$ over $gt^{2}$.'
        write: '$\dfrac{1}{g} = \dfrac{t^{2}}{gt^{2}}$'
      - say: 'Put those two back into our line for 1 over $f$.'
        write: '$\dfrac{1}{f} = \dfrac{gv}{gt^{2}} - \dfrac{t^{2}}{gt^{2}}$'
        point:
          - {line: 6, kind: arrow, text: 'first'}
          - {line: 7, kind: arrow, text: 'second'}
      - say: 'The bottoms are the same now, so subtract the tops.'
        write: '$= \dfrac{gv - t^{2}}{gt^{2}}$'
      - say: 'But this is 1 over $f$, not $f$. The last box is the upside-down one: if two fractions are equal, their upside-downs are equal too, so flip both sides.'
        write: '$f = \dfrac{gt^{2}}{gv - t^{2}}$'
        point:
          - {line: 10, kind: highlight, at: 'f =', to: {doodle: boxes, part: core}}
        doodle_do:
          - {id: boxes, op: cross, part: flip}
          - {id: boxes, op: circle, part: core, text: 'f is free'}
      - say: 'So $f$ is $gt^{2}$ over $gv$ minus $t^{2}$, which is answer choice B.'
        write: '$f = \dfrac{gt^{2}}{gv - t^{2}}$'
        answer: true
    traps:
      A: 'You went for the fraction the other way up. That is 1 over $f$. The last step is to flip it to get $f$ itself.'
      C: 'You went for $v$ over $t$ to the half, minus 1 over $g$. Squaring both sides gives $t^{2}$, not $t$ to the half, and that expression would still only be 1 over $f$, not $f$.'
      D: 'You went for $\tfrac{gv}{t^{2}} - g$. That doesn''t follow from $\tfrac{1}{f} = \tfrac{gv - t^{2}}{gt^{2}}$. Combine the right side into one fraction, then flip the whole fraction to get $\tfrac{gt^{2}}{gv - t^{2}}$.'
  15:
    moments:
      - say: 'We want the value of $g$ that makes $4x^{2} - 18xy + g$ a perfect square.'
        write: '$4x^{2} - 18xy + g$'
      - say: 'A perfect square is a bracket squared. Picture it as tiles: a big square $2x$ by $2x$, which is $4x^{2}$, two strips down the sides, and a small square in the corner. The middle term is negative, so the square must look like $2x$ minus some number $k$ times $y$, all squared.'
        write: 'Try $(2x - ky)^{2}$, since $(2x)^{2} = 4x^{2}$'
        doodle: {name: 'custom:1997_q15_a', id: tiles, caption: 'the square with a missing corner'}
      - say: 'The square of a difference: $a$ minus $b$, all squared, is $a$ squared minus $2ab$ plus $b$ squared.'
        write: '$(a - b)^{2} = a^{2} - 2ab + b^{2}$'
      - say: 'Let''s expand it. A bracket like this, squared, is the first squared, minus twice the first times the second, plus the second squared.'
        write: '$(2x - ky)^{2} = (2x)^{2} - 2(2x)(ky) + (ky)^{2}$'
      - say: '$2x$ squared is $4x^{2}$. 2 times $2x$ times $ky$ is $4kxy$. And $ky$ squared is $k^{2}y^{2}$.'
        write: '$= 4x^{2} - 4kxy + k^{2}y^{2}$'
      - say: 'Now compare the middle term with ours. The two strips together make $18xy$, so each is $9xy$: negative $4k$ must equal negative 18.'
        write: '$-4k = -18$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '[[−4k]]xy'}, at: '−4k', text: 'middle term'}
          - {line: 5, kind: move, from: {line: 0, at: '[[−18]]xy'}, at: '= −18', text: 'ours'}
        doodle_do:
          - {id: tiles, op: circle, part: strips, text: '2 strips = 18xy'}
      - say: 'Divide both sides by negative 4. 18 over 4 simplifies to 9 over 2. That is the side of the small corner square.'
        write: '$k = \dfrac{18}{4} = \dfrac{9}{2}$'
        doodle_do:
          - {id: tiles, op: label, part: side-k, text: 'k = 9/2'}
      - say: 'Now compare the last terms. $g$ must be the corner tile, $k^{2}y^{2}$.'
        write: '$g = k^{2}y^{2}$'
        doodle_do:
          - {id: tiles, op: highlight, part: corner, text: 'g = (9y/2)²'}
      - say: 'Put in $k$ equals 9 over 2. 9 over 2, squared, is 81 over 4, because 9 squared is 81 and 2 squared is 4.'
        write: '$= \left(\dfrac{9}{2}\right)^{2}y^{2} = \dfrac{81y^{2}}{4}$'
        point:
          - {line: 8, kind: move, from: {line: 6, at: '= 29'}, at: '(29)', text: 'k'}
          - {line: 8, kind: highlight, at: '81y', to: {doodle: tiles, part: corner}}
      - say: 'Let''s check by expanding $2x$ minus 9 over 2 $y$, all squared. The middle term is 2 times $2x$ times 9 over 2 $y$, which is $18xy$. It matches.'
        write: 'Check: $\left(2x - \dfrac{9}{2}y\right)^{2} = 4x^{2} - 18xy + \dfrac{81y^{2}}{4}$'
      - say: 'So $g$ is $81y^{2}$ over 4, which is answer choice D.'
        write: '$g = \dfrac{81y^{2}}{4}$'
        answer: true
    traps:
      A: 'You went for 9. The last term has to carry $y^{2}$ to match the $xy$ in the middle, and its number is 9 over 2, squared, which is 81 over 4.'
      B: 'You went for $\tfrac{9y^{2}}{4}$. That squares 3 over 2 instead of 9 over 2. From $-4k = -18$, $k$ is 9 over 2, so $g$ is $\tfrac{81y^{2}}{4}$.'
      C: 'You went for $81y^{2}$. That comes from halving 18 to get 9, as if the first term were $x$. The first term is $2x$, so $k$ is 18 over 4, which is 9 over 2, and $g$ is $\tfrac{81y^{2}}{4}$.'
  16:
    moments:
      - say: 'We''re told that $5 + 2r$ over $r + 1$ times $r - 2$ splits into $K$ over $r - 2$ plus $L$ over $r + 1$. Picture the fraction as a pizza cut back into its two slices. We want $K$.'
        write: '$\dfrac{5 + 2r}{(r + 1)(r - 2)} = \dfrac{K}{r - 2} + \dfrac{L}{r + 1}$'
        doodle: {name: 'custom:1997_q16_a', id: pizza, caption: 'one fraction, two slices'}
      - say: 'The first thing we do is clear the fractions, by multiplying every term by $r + 1$ times $r - 2$. On the left, the whole denominator cancels, leaving $5 + 2r$.'
        write: 'Multiply through by $(r + 1)(r - 2)$'
      - say: 'On the right, $K$ over $r - 2$ loses its $r - 2$, leaving $K$ times $r + 1$.'
        write: '$\dfrac{K}{r - 2} \times (r + 1)(r - 2) = K(r + 1)$'
      - say: 'And $L$ over $r + 1$ loses its $r + 1$, leaving $L$ times $r - 2$.'
        write: '$\dfrac{L}{r + 1} \times (r + 1)(r - 2) = L(r - 2)$'
      - say: 'So the whole identity becomes $5 + 2r$ equals $K$ times $r + 1$, plus $L$ times $r - 2$.'
        write: '$5 + 2r = K(r + 1) + L(r - 2)$'
      - say: 'This is true for every value of $r$, so we may pick a clever one. To find $K$, we want the $L$ slice to vanish. That happens when $r - 2$ is zero, which is when $r$ is 2.'
        write: '$r - 2 = 0 \Rightarrow r = 2$'
        doodle_do:
          - {id: pizza, op: cross, part: l-slice, text: 'gone when r = 2'}
      - say: 'Substitute $r$ equals 2 into both sides of the identity.'
        write: '$5 + 2(2) = K(2 + 1) + L(2 - 2)$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: 'r = 2'}, at: '5 + 2[[(2)]]', text: 'sub in'}
          - {line: 4, kind: box, text: 'identity'}
      - say: 'On the left, 2 times 2 is 4, and 5 plus 4 is 9. On the right, 2 plus 1 is 3, and 2 minus 2 is 0.'
        write: '$9 = 3K + L(0)$'
      - say: '$L$ times 0 is 0, so the $L$ term disappears.'
        write: '$9 = 3K$'
      - say: 'Divide both sides by 3. 9 over 3 is 3. That is the $K$ slice.'
        write: '$K = \dfrac{9}{3} = 3$'
        point:
          - {line: 9, kind: highlight, at: 'K =', to: {doodle: pizza, part: k-val}}
        doodle_do:
          - {id: pizza, op: stage, stage: 'custom:1997_q16_a2'}
      - say: 'We don''t need $L$, but as a check, putting $r$ equals negative 1 makes the $K$ slice vanish. The left is 5 minus 2, which is 3, and the right is $L$ times negative 3. So $L$ is negative 1.'
        write: 'At $r = -1$: $3 = -3L$, so $L = -1$'
        doodle_do:
          - {id: pizza, op: stage, stage: 'custom:1997_q16_a3'}
      - say: 'So $K$ is 3, which is answer choice A.'
        write: '$K = 3$'
        answer: true
    traps:
      B: 'You went for 2. That''s the value of $r$ we substitute, not $K$. With $r = 2$, the equation becomes $9 = 3K$, so $K = 3$.'
      C: 'You went for 1. Put $r = 2$ into $5 + 2r = K(r + 1) + L(r - 2)$: the left is 9 and the right is $3K$, so $K = 3$.'
      D: 'You went for negative 1. That''s $L$, the other constant, which you get by putting $r = -1$. $K$ sits over $r - 2$, so we use $r = 2$ and get $K = 3$.'
  17:
    moments:
      - say: 'We have $f(x) = 2x + 4$ and $g(x) = 6x + 7$, with $g(x)$ positive. We want to solve $f(x)$ over $g(x)$ is less than 1.'
        write: '$\dfrac{f(x)}{g(x)} < 1$'
      - say: 'Let me draw this on a number line, so we can see the values.'
        show_sketch: true
      - say: 'Put in the two functions: $2x + 4$ on top and $6x + 7$ underneath.'
        write: '$\dfrac{2x + 4}{6x + 7} < 1$'
      - say: 'The unknown is in the denominator. Multiplying an inequality by a negative number flips the sign, so we must know the sign of $6x + 7$ before we multiply.'
        write: 'Sign of $6x + 7$ decides whether the sign flips'
      - say: 'The question tells us $g(x)$ is positive. So multiplying by $6x + 7$ keeps the inequality the same way round.'
        write: '$g(x) = 6x + 7 > 0$'
      - say: 'Multiply both sides by $6x + 7$. On the left the denominator cancels, and on the right, 1 times $6x + 7$ is just $6x + 7$.'
        write: '$2x + 4 < 6x + 7$'
        point:
          - {line: 4, kind: underline, at: '> 0', text: 'no flip'}
          - {line: 5, kind: move, from: {line: 2, at: '6x + 7'}, at: '6x + 7', text: 'times both sides'}
      - say: 'Now collect the $x$ terms on the right. Subtract $2x$ from both sides: $6x$ minus $2x$ is $4x$.'
        write: '$4 < 4x + 7$'
      - say: 'Subtract 7 from both sides. 4 minus 7 is negative 3.'
        write: '$4 - 7 < 4x$, so $-3 < 4x$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '+ 7'}, at: '− 7', text: 'across'}
      - say: 'Divide both sides by 4. That''s a positive number, so again the sign doesn''t flip.'
        write: '$-\dfrac{3}{4} < x$'
        point:
          - {figure: sketch, kind: circle, target: '−¾'}
      - say: 'Written the usual way round, $x$ is greater than negative 3 over 4.'
        write: '$x > -\dfrac{3}{4}$'
      - say: 'So the answer is $x$ greater than negative 3 over 4, which is answer choice C.'
        write: '$x > -\dfrac{3}{4}$'
        answer: true
        point:
          - {figure: sketch, kind: underline, target: 'x > −¾', text: 'the answer'}
    traps:
      A: 'You went for $x < -\tfrac{3}{4}$. That has the sign flipped. Since $g(x)$ is positive, multiplying by it keeps the inequality the same way, and dividing by 4 does too.'
      B: 'You went for $x > -\tfrac{4}{3}$. That''s the fraction upside down. From $-3 < 4x$, dividing by 4 gives negative 3 over 4.'
      D: 'You went for $x > -12$. That multiplies instead of divides. From $-3 < 4x$ we divide both sides by 4, giving $x > -\tfrac{3}{4}$.'
  18:
    moments:
      - say: 'We want the range of $x$ for which $12x^{2}$ is less than $x + 1$.'
        write: '$12x^{2} < x + 1$'
      - say: 'Let me sketch the graph, so we can see its shape.'
        show_sketch: true
      - say: 'The first thing we do is bring everything to one side, so we can factorise. Subtract $x$ and subtract 1 from both sides.'
        write: '$12x^{2} - x - 1 < 0$'
        point:
          - {line: 2, kind: move, from: {line: 0, at: '< [[x]] + 1'}, at: '[[−x]] − 1', text: 'across'}
          - {line: 2, kind: move, from: {line: 0, at: '+ 1'}, at: 'x[[−1]]', text: 'across'}
          - {figure: sketch, kind: underline, target: 'y = 12x² − x − 1'}
      - say: 'To factorise, we need two numbers that multiply to 12 times negative 1, which is negative 12, and add to negative 1, the number in front of $x$.'
        write: 'Multiply to $12 \times (-1) = -12$, add to $-1$'
      - say: 'Negative 4 and 3 work: negative 4 times 3 is negative 12, and negative 4 plus 3 is negative 1.'
        write: '$-4 \times 3 = -12,\quad -4 + 3 = -1$'
      - say: 'So split the middle term, negative $x$, into negative $4x$ plus $3x$.'
        write: '$12x^{2} - 4x + 3x - 1 < 0$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '[[−4]] × 3'}, at: '−4x'}
          - {line: 5, kind: move, from: {line: 4, at: '−4 × [[3]]'}, at: '+ 3x', text: 'split'}
      - say: 'Group in pairs. From the first pair take out $4x$, and from the second pair take out 1.'
        write: '$4x(3x - 1) + 1(3x - 1) < 0$'
      - say: 'Both parts share $3x - 1$, so we take it out as a common factor.'
        write: '$(4x + 1)(3x - 1) < 0$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '4x[[(3x − 1)]]'}, at: '(3x − 1)', text: 'taken out'}
      - say: 'Now the roots, where each bracket is zero. $4x + 1$ is zero when $4x$ is negative 1, so $x$ is negative a quarter.'
        write: '$4x + 1 = 0 \Rightarrow x = -\dfrac{1}{4}$'
        point:
          - {figure: sketch, kind: circle, target: '−1/4'}
      - say: '$3x - 1$ is zero when $3x$ is 1, so $x$ is a third.'
        write: '$3x - 1 = 0 \Rightarrow x = \dfrac{1}{3}$'
        point:
          - {figure: sketch, kind: circle, target: '1/3'}
      - say: 'A product is negative when the two brackets have opposite signs. For a U-shaped curve like $12x^{2} - x - 1$, that happens between the roots.'
        write: 'Product $< 0$ between the roots'
        point:
          - {figure: sketch, kind: highlight, target: 'below the axis: 12x² − x − 1 < 0'}
      - say: 'So $x$ lies between negative a quarter and a third.'
        write: '$-\dfrac{1}{4} < x < \dfrac{1}{3}$'
        point:
          - {line: 11, kind: move, from: {line: 8, at: '= −41'}, at: '−41', text: 'root'}
          - {line: 11, kind: move, from: {line: 9, at: '= 31'}, at: '31', text: 'root'}
      - say: 'Let''s test $x$ equals 0, which is inside. 12 times 0 squared is 0, and 0 is less than 0 plus 1. True.'
        write: 'Check $x = 0$: $12(0)^{2} = 0 < 0 + 1$'
      - say: 'So the answer is negative a quarter less than $x$ less than a third, which is answer choice A.'
        write: '$-\dfrac{1}{4} < x < \dfrac{1}{3}$'
        answer: true
    traps:
      B: 'You went for $\tfrac{1}{4} < x < \tfrac{1}{3}$. The root from $4x + 1 = 0$ is negative a quarter, not positive. Also, $x = 0$ works in the original, and this range leaves it out.'
      C: 'You went for $-\tfrac{1}{3} < x < \tfrac{1}{4}$. Those are the right sizes with the roots swapped. Solve each bracket on its own: $4x + 1 = 0$ gives negative a quarter, and $3x - 1 = 0$ gives a third.'
      D: 'You went for $-\tfrac{1}{4} < x < -\tfrac{1}{3}$. Negative a quarter is bigger than negative a third, so no number fits that. The second root is positive a third.'
  19:
    moments:
      - say: 'The sum of the first $n$ terms of a series is $n^{2} - 1$. We want the $n$th term.'
        write: '$S_{n} = n^{2} - 1$'
      - say: 'Here''s the idea. Picture the terms stacked as a tower. The sum of the first $n$ terms is the tower with $n$ blocks, and the sum of the first $n - 1$ terms is the same tower without its top block. Take the full tower minus the shorter one, and only the $n$th term is left.'
        write: '$U_{n} = S_{n} - S_{n-1}$'
        doodle: {name: 'custom:1997_q19_a', id: towers, caption: 'the nth term is the top block'}
      - say: 'To get $S_{n-1}$, replace every $n$ in the formula with $n - 1$.'
        write: '$S_{n-1} = (n - 1)^{2} - 1$'
      - say: 'Expand the bracket. $n - 1$ squared is $n^{2}$, minus $2n$, plus 1.'
        write: '$(n - 1)^{2} = n^{2} - 2n + 1$'
      - say: 'Put that back into $S_{n-1}$.'
        write: '$S_{n-1} = n^{2} - 2n + 1 - 1$'
      - say: 'Plus 1 minus 1 is zero.'
        write: '$= n^{2} - 2n$'
      - say: 'Now go back to $U_{n}$ equals $S_{n}$ minus $S_{n-1}$: the tall tower minus the short one. Substitute both, and keep $S_{n-1}$ in brackets, so the minus sign reaches both of its terms.'
        write: '$U_{n} = (n^{2} - 1) - (n^{2} - 2n)$'
        point:
          - {line: 1, kind: box, text: 'the idea'}
          - {line: 6, kind: move, from: {line: 0, at: 'n2 − 1'}, at: '(n2 − 1)', text: 'Sn'}
          - {line: 6, kind: move, from: {line: 5, at: 'n2 − 2n'}, at: '(n2 − 2n)', text: 'S n−1'}
        doodle_do:
          - {id: towers, op: arrow, part: short, to_part: tall, text: 'take away'}
      - say: 'Open the brackets. Minus $n^{2}$, and minus negative $2n$ is plus $2n$.'
        write: '$= n^{2} - 1 - n^{2} + 2n$'
      - say: 'The $n^{2}$ terms cancel, leaving $2n - 1$. That is the top block.'
        write: '$= 2n - 1$'
        point:
          - {line: 7, kind: strike, at: '=n2', text: 'cancel'}
          - {line: 7, kind: strike, at: '−n2'}
          - {line: 8, kind: highlight, at: '2n - 1', to: {doodle: towers, part: top}}
        doodle_do:
          - {id: towers, op: stage, stage: 'custom:1997_q19_a2'}
      - say: 'Let''s check with $n = 2$. $S_{2}$ is 4 minus 1, which is 3, and $S_{1}$ is 1 minus 1, which is 0. So the 2nd term is 3.'
        write: 'Check: $U_{2} = S_{2} - S_{1} = 3 - 0 = 3$'
      - say: 'And our formula gives 2 times 2, minus 1, which is 3. It works.'
        write: '$2(2) - 1 = 3$'
      - say: 'So the $n$th term is $2n - 1$, which is answer choice D.'
        write: '$U_{n} = 2n - 1$'
        answer: true
    traps:
      A: 'You went for $4n + 1$. The $n$ coefficient comes from $(n - 1)^{2} = n^{2} - 2n + 1$, so it is 2, not 4. Subtracting gives $2n - 1$.'
      B: 'You went for $4n - 1$. The middle term of $(n - 1)^{2}$ is $-2n$, not $-4n$. So the $n$th term is $2n - 1$.'
      C: 'You went for $2n + 1$. That happens if the minus sign doesn''t reach both terms of the bracket. $(n^{2} - 1) - (n^{2} - 2n)$ is $2n - 1$.'
  20:
    moments:
      - say: 'The $n$th term of a sequence is 3 to the power $1 - n$. We want the sum of the first three terms.'
        write: '$U_{n} = 3^{1-n}$'
      - say: 'Two laws of indices: any number to the power 0 is 1, and a negative power means one over the positive power.'
        write: '$a^{0} = 1,\quad a^{-n} = \dfrac{1}{a^{n}}$'
      - say: 'The formula gives each term directly, so we substitute $n$ equals 1, 2 and 3 in turn. First, $n$ equals 1: the power is 1 minus 1, which is 0.'
        write: '$U_{1} = 3^{1-1} = 3^{0}$'
      - say: 'Any non-zero number to the power zero is 1. Picture the first term as a strip of length 1.'
        write: '$= 1$'
        doodle: {name: 'custom:1997_q20_a', id: strip, caption: 'each term is a third of the last'}
      - say: 'Now $n$ equals 2. 1 minus 2 is negative 1.'
        write: '$U_{2} = 3^{1-2} = 3^{-1}$'
      - say: 'A negative power means 1 over. So 3 to the negative 1 is 1 over 3: cut the strip into three and keep one piece.'
        write: '$= \dfrac{1}{3}$'
        doodle_do:
          - {id: strip, op: stage, stage: 'custom:1997_q20_a2'}
      - say: 'Now $n$ equals 3. 1 minus 3 is negative 2.'
        write: '$U_{3} = 3^{1-3} = 3^{-2}$'
      - say: 'That''s 1 over 3 squared, and 3 squared is 9. Cut that piece into three again: a ninth.'
        write: '$= \dfrac{1}{3^{2}} = \dfrac{1}{9}$'
        doodle_do:
          - {id: strip, op: stage, stage: 'custom:1997_q20_a3'}
      - say: 'Now add the three terms we just found: 1, 1 over 3, and 1 over 9.'
        write: 'Sum $= 1 + \dfrac{1}{3} + \dfrac{1}{9}$'
        point:
          - {line: 8, kind: move, from: {line: 3, at: '= 1'}, at: '= [[1]] +', text: 'U1'}
          - {line: 8, kind: move, from: {line: 5, at: '= 31'}, at: '+ 31', text: 'U2'}
          - {line: 8, kind: move, from: {line: 7, at: '= 91'}, at: '+ 91', text: 'U3'}
      - say: 'Put them all over 9. 1 is 9 over 9, and 1 over 3 is 3 over 9.'
        write: '$= \dfrac{9}{9} + \dfrac{3}{9} + \dfrac{1}{9}$'
      - say: '9 plus 3 plus 1 is 13, so the sum is 13 over 9. Lay the three strips end to end: a little longer than the first strip on its own.'
        write: '$= \dfrac{13}{9}$'
        point:
          - {line: 10, kind: highlight, at: '13', to: {doodle: strip, part: total}}
        doodle_do:
          - {id: strip, op: stage, stage: 'custom:1997_q20_a4'}
