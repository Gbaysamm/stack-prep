          - {line: 1, kind: travel, at: '42', from: {figure: sketch, target: 'diameter 42 cm'}, 'on': 'diameter is 42 cm'}
      - say: 'A chord is a straight line joining two points on the circle. Here the chord joins A and B.'
        write: 'Chord $AB$'
        point:
          - {figure: sketch, kind: highlight, target: 'AB', text: 'the chord', 'on': 'joins A and B'}
      - say: 'Now join the centre O to A, and to B. The angle between those two lines is 60 degrees. The question says the chord subtends 60 degrees at the centre, and that is all it means.'
        write: 'Angle at the centre $= 60^{\circ}$'
        show_sketch: sketch_b
        point:
          - {figure: sketch_b, kind: arc, target: AOB, text: '60°', 'on': '60 degrees'}
      - say: 'The minor arc is the shorter piece of the circle''s edge between A and B. Minor means smaller. It is the crust of our slice, and it is what we want.'
        write: 'Minor arc $AB = ?$'
        doodle_do:
          - {id: cake, op: highlight, part: crust, 'on': 'crust of our slice'}
        point:
          - {figure: sketch_b, kind: circle, target: 'arc = ?', text: 'the minor arc', 'on': 'shorter piece'}
      - say: 'The question tells us to use pi as 22 over 7.'
        write: '$\pi = \dfrac{22}{7}$'
      - section: 'What fraction of the circle?'
        say: 'One full turn round the centre is 360 degrees. Our angle is 60 degrees. So our slice is 60 out of 360 of the whole circle.'
        write: 'Fraction $= \dfrac{60}{360}$'
        point:
          - {line: 6, kind: travel, at: '36060', from: {line: 3, at: '60'}, text: '60°', 'on': '60 out of 360'}
      - say: '60 goes into 360 six times. So 60 over 360 is 1 over 6: one slice of a cake cut into 6 equal slices.'
        write: '$\dfrac{60}{360} = \dfrac{1}{6}$'
        doodle_do:
          - {id: cake, op: label, part: slice, text: '1 of 6 slices', 'on': 'one slice'}
      - section: 'The whole circumference'
        say: 'The circumference is the whole distance round the circle. The rule, in words: circumference equals 2, times pi, times the radius.'
        write: 'Circumference $= 2 \times \pi \times r$'
        'on': 'The rule'
      - say: 'The rule needs the radius, not the diameter. The radius goes from the centre to the edge, so it is half the diameter. Half of 42 is 21.'
        write: '$r = \dfrac{42}{2} = 21$ cm'
        point:
          - {line: 9, kind: travel, at: '242', from: {line: 1, at: '42'}, text: 'diameter', 'on': 'Half of 42'}
          - {figure: sketch_b, kind: label, target: {x: 200, y: 102}, text: 'r = 21 cm', 'on': 'is 21'}
      - say: 'Now put the radius and pi into the rule: 2, times 22 over 7, times 21.'
        write: 'Circumference $= 2 \times \dfrac{22}{7} \times 21$'
        point:
          - {line: 10, kind: travel, at: '× 21', from: {line: 9, at: '= [[21]]'}, text: 'radius', 'on': 'times 21'}
          - {line: 10, kind: travel, at: '722', from: {line: 5, at: '722'}, text: 'pi', 'on': '22 over 7'}
      - say: '21 divided by 7 is 3. So the 7 on the bottom and the 21 cancel, and leave a 3.'
        write: '$= 2 \times 22 \times 3$'
      - say: '2 times 22 is 44, and 44 times 3 is 132. So the whole way round the circle is 132 cm.'
        write: '$= 132$ cm'
        doodle_do:
          - {id: cake, op: label, part: cake, text: 'all the way round: 132 cm', 'on': 'whole way round'}
      - section: 'The arc'
        say: 'Our arc is 1 over 6 of that whole circumference. So the arc is 1 over 6 times 132.'
        write: 'Arc $= \dfrac{1}{6} \times 132$'
        point:
          - {line: 13, kind: travel, at: '61', from: {line: 7, at: '= [[61]]'}, text: 'fraction', 'on': '1 over 6 of'}
          - {line: 13, kind: travel, at: '132', from: {line: 12, at: '132'}, text: 'circumference', 'on': 'times 132'}
      - say: '1 over 6 of 132 means 132 divided by 6, which is 22. The arc is 22 cm.'
        write: '$= 132 \div 6 = 22$ cm'
        doodle_do:
          - {id: cake, op: label, part: crust, text: '22 cm', 'on': 'arc is 22 cm'}
        point:
          - {figure: sketch_b, kind: label, target: 'arc = ?', text: '22 cm', 'on': 'arc is 22 cm'}
      - section: 'Check'
        say: 'Check with the cake: 6 slices, each with 22 cm of crust. 6 times 22 is 132, the whole circumference.'
        write: 'Check: $6 \times 22 = 132$ cm'
        doodle_do:
          - {id: cake, op: pulse, part: cake, 'on': '6 slices'}
      - say: 'So the minor arc is 22 cm, which is answer choice A.'
        write: 'Minor arc $= 22$ cm'
        answer: true
    traps:
      B: 'You went for 44 cm. That uses 42 as the radius, which doubles the answer. 42 is the diameter, straight across, so the radius is half of it, 21.'
      C: 'You went for 110 cm. That is the major arc, the longer piece: the other 5 slices, 132 minus 22. Minor means the shorter piece, which is 1 slice: 22 cm.'
      D: 'You went for 220 cm. That is longer than the whole circumference of 132 cm, so it can''t be part of it. The arc is 1 over 6 of 132, which is 22.'
  29:
    moments:
      - say: 'An arc subtends 70 degrees at the centre of a circle of radius 6 cm. We want the area of the sector, using $\pi$ as 22 over 7.'
        write: 'Angle $70^{\circ}$, radius $r = 6$ cm, $\pi = \dfrac{22}{7}$'
      - say: 'Let me draw a diagram of the circle first, so we can see what we are working with.'
        show_sketch: true
        point:
          - {figure: sketch, kind: arc, target: AOB, text: '70°'}
          - {figure: sketch, kind: highlight, target: OA, text: '6 cm'}
      - say: 'A sector is a fraction of the whole circle''s area, and the fraction is the angle at the centre over 360.'
        write: 'Sector area $= \dfrac{\theta}{360^{\circ}} \times \pi r^{2}$'
        point:
          - {figure: sketch, kind: circle, target: '70°', text: 'θ'}
      - say: 'Substitute: 70 over 360, times 22 over 7, times 6 squared.'
        write: '$= \dfrac{70}{360} \times \dfrac{22}{7} \times 6^{2}$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
          - {line: 3, kind: move, from: {line: 0, at: '70'}, at: '70', text: 'θ'}
          - {line: 3, kind: move, from: {line: 0, at: '= 6'}, at: '× [[6]]2', text: 'r'}
      - say: '6 squared is 36.'
        write: '$= \dfrac{70}{360} \times \dfrac{22}{7} \times 36$'
      - say: 'Simplify the fraction before multiplying. 70 over 360: both divide by 10, giving 7 over 36.'
        write: '$= \dfrac{7}{36} \times \dfrac{22}{7} \times 36$'
      - say: 'The 7 on top cancels with the 7 underneath, leaving 22 on top.'
        write: '$= \dfrac{1}{36} \times 22 \times 36$'
      - say: 'And the 36 underneath cancels with the 36 on top. That leaves just 22.'
        write: '$= 22$'
      - say: 'A quick check: 70 degrees is a bit less than a fifth of the circle. The whole circle is 22 over 7 times 36, about 113, and 113 divided by 5 is about 23. So 22 fits.'
        write: 'Check: whole circle $= \dfrac{22}{7} \times 36 \approx 113$, and $113 \div 5 \approx 23$'
      - say: 'So the sector''s area is 22 square centimetres, which is answer choice A.'
        write: 'Sector area $= 22\ \text{cm}^{2}$'
        answer: true
        point:
          - {figure: sketch, kind: label, target: 'Area = ?', text: '22 cm²'}
    traps:
      B: 'You went for 44. That''s double the answer. The fraction is 70 over 360, which is 7 over 36, and it cancels with the $\tfrac{22}{7}$ and the 36 to leave 22.'
      C: 'You went for 66. Simplify 70 over 360 to 7 over 36 before multiplying. Then everything cancels to leave 22.'
      D: 'You went for 88. That''s four times the answer. Check the fraction: $\tfrac{70}{360}$ is $\tfrac{7}{36}$, and $\tfrac{7}{36} \times \tfrac{22}{7} \times 36 = 22$.'
  30:
    moments:
      - say: 'We want the volume of the prism in the diagram. Its end face is marked 8 cm, 10 cm and 5 cm, and the prism is 11 cm long.'
        write: 'End face: $8$ cm, $10$ cm, $5$ cm; length $11$ cm'
      - say: 'The volume of any prism is the area of its cross-section, the end face, times its length.'
        write: '$V = \text{cross-section area} \times \text{length}$'
        point:
          - {figure: 0, kind: label, target: {x: 125, y: 150}, text: 'cross-section'}
          - {figure: 0, kind: circle, target: '11 cm', text: 'length'}
      - say: 'Look at the end face. The top is 8 cm and the bottom is 10 cm, and they are parallel but not equal, so the face is a trapezium, not a rectangle.'
        write: 'Parallel sides: $a = 8,\ b = 10$'
        point:
          - {figure: 0, kind: circle, target: '8 cm', text: 'a'}
          - {figure: 0, kind: circle, target: '10 cm', text: 'b'}
      - say: 'The 5 cm side is at right angles to both parallel sides, so it is the height of the trapezium.'
        write: 'Height: $h = 5$'
        point:
          - {figure: 0, kind: circle, target: '5 cm', text: 'height'}
      - say: 'The area of a trapezium is half the sum of the parallel sides, times the height.'
        write: '$A = \dfrac{1}{2}(a + b)h$'
      - say: 'Substitute: a half, times 8 plus 10, times 5.'
        write: '$= \dfrac{1}{2}(8 + 10)(5)$'
        point:
          - {line: 5, kind: move, from: {line: 2, at: 'a = 8'}, at: '(8', text: 'a'}
          - {line: 5, kind: move, from: {line: 2, at: 'b = 10'}, at: '10)', text: 'b'}
          - {line: 5, kind: move, from: {line: 3, at: 'h = 5'}, at: '(5)', text: 'h'}
      - say: '8 plus 10 is 18.'
        write: '$= \dfrac{1}{2}(18)(5)$'
      - say: 'Half of 18 is 9, and 9 times 5 is 45 square centimetres.'
        write: '$= 9 \times 5 = 45\ \text{cm}^{2}$'
      - say: 'Now go back to the volume formula, with the area 45 we just found and the length 11.'
        write: '$V = 45 \times 11$'
        point:
          - {line: 1, kind: box, text: 'the rule'}
          - {line: 8, kind: move, from: {line: 7, at: '= 45'}, at: '45', text: 'area'}
          - {line: 8, kind: move, from: {line: 0, at: '11'}, at: '11', text: 'length'}
      - say: '45 times 11 is 45 times 10, plus 45. That''s 450 plus 45, which is 495.'
        write: '$= 450 + 45 = 495$'
      - say: 'So the volume is 495 cubic centimetres, which is answer choice D.'
        write: '$V = 495\ \text{cm}^{3}$'
        answer: true
    traps:
      A: 'You went for 990. That''s exactly double, from forgetting the half in the trapezium formula. The area is $\tfrac{1}{2}(8 + 10)(5) = 45$, not 90.'
      B: 'You went for 880. That''s 8 times 10 times 11, which multiplies the two parallel sides together. The end face is a trapezium with area $\tfrac{1}{2}(8 + 10)(5) = 45$.'
      C: 'You went for 550. That''s 10 times 5 times 11, treating the end face as a rectangle. The top is only 8 cm, so it''s a trapezium with area 45.'
  31:
    moments:
      - say: 'A sector with angle 45 degrees is cut from a circle of radius $r$ and rolled into a cone. We want the base radius of the cone.'
        write: 'Sector angle $45^{\circ}$, sector radius $r$'
      - say: 'Let me draw the sector first, cut from its circle, so we can see what we are working with.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '45°'}
      - say: 'Now let me roll the sector up and draw the cone it makes.'
        show_sketch: sketch_b
        point:
          - {figure: sketch_b, kind: circle, target: 'R = ?', text: 'base radius'}
      - say: 'Here''s the key idea. When the sector is rolled up, its curved edge, the arc, becomes the circle around the base of the cone. Nothing is stretched or lost.'
        write: 'Arc length of sector $=$ circumference of base'
        point:
          - {figure: sketch_b, kind: circle, target: {x: 95, y: 56}, text: 'arc'}
          - {figure: sketch_b, kind: circle, target: {x: 290, y: 212}, text: 'base circle'}
      - say: 'Arc length is the angle over 360 degrees, times the circumference, $2\pi r$.'
        write: 'Arc length $= \dfrac{\theta}{360^{\circ}} \times 2\pi r$'
      - say: 'First the arc. It''s 45 over 360 of the full circumference of the circle, $2\pi r$.'
        write: 'Arc $= \dfrac{45}{360} \times 2\pi r$'
        point:
          - {figure: sketch_b, kind: label, target: {x: 95, y: 56}, text: '45/360 × 2πr'}
      - say: '45 goes into 360 eight times, so 45 over 360 simplifies to 1 over 8.'
        write: '$= \dfrac{1}{8} \times 2\pi r$'
      - say: '$2\pi r$ over 8 simplifies to $\pi r$ over 4, since 2 over 8 is 1 over 4.'
        write: '$= \dfrac{2\pi r}{8} = \dfrac{\pi r}{4}$'
      - say: 'Now the cone. Call its base radius $R$. The base is a circle, so its circumference is $2\pi R$.'
        write: 'Base circumference $= 2\pi R$'
        point:
          - {figure: sketch_b, kind: circle, target: 'R = ?'}
      - say: 'The arc becomes the base, so set the two equal: $2\pi R$ equals $\pi r$ over 4.'
        write: '$2\pi R = \dfrac{\pi r}{4}$'
        point:
          - {line: 9, kind: move, from: {line: 7, at: '= 4πr'}, at: '4πr', text: 'arc'}
          - {line: 9, kind: move, from: {line: 8, at: '2πR'}, at: '2πR', text: 'base'}
          - {figure: sketch_b, kind: arrow, target: {x: 290, y: 213}, text: 'arc = base'}
      - say: 'Divide both sides by $\pi$.'
        write: '$2R = \dfrac{r}{4}$'
      - say: 'Divide both sides by 2. $r$ over 4, divided by 2, is $r$ over 8.'
        write: '$R = \dfrac{r}{4 \times 2} = \dfrac{r}{8}$'
      - say: 'Notice the two radii play different roles. The sector''s radius $r$ becomes the slant height of the cone; the base radius is the new, smaller $R$.'
        write: 'Slant height $= r$, base radius $= R$'
        point:
          - {figure: sketch_b, kind: circle, target: {x: 270, y: 128}, text: 'slant height'}
          - {figure: sketch_b, kind: circle, target: 'R = ?', text: 'base radius'}
      - say: 'So the base radius is $r$ over 8 cm, which is answer choice B.'
        write: '$R = \dfrac{r}{8}\ \text{cm}$'
        answer: true
        point:
          - {figure: sketch_b, kind: label, target: 'R = ?', text: 'r/8'}
    traps:
      A: 'You went for $r$ over 16. That divides by 2 once too often. From $2R = \tfrac{r}{4}$, dividing by 2 gives $\tfrac{r}{8}$.'
      C: 'You went for $r$ over 4. That forgets the 2 in the base circumference $2\pi R$. Setting $2\pi R = \tfrac{\pi r}{4}$ gives $R = \tfrac{r}{8}$.'
      D: 'You went for $r$ over 2. The sector''s radius becomes the slant height, not the base radius. Match the arc to the base circumference: $2\pi R = \tfrac{\pi r}{4}$, so $R = \tfrac{r}{8}$.'
  32:
    moments:
      - say: 'A point $P$ is always the same distance from $L$ and $M$, and $LM$ is 16 cm. We want the distance of $P$ from the line $LM$ when $P$ is 10 cm from $L$.'
        write: '$PL = PM$, $LM = 16$ cm, $PL = 10$ cm'
      - say: 'Let me draw a diagram of the circle first, so we can see what we are working with.'
        show_sketch: true
        point:
          - {figure: sketch, kind: underline, target: 'PL = PM'}
          - {figure: sketch, kind: highlight, target: LM, text: '16 cm'}
          - {figure: sketch, kind: highlight, target: PL, text: '10 cm'}
      - say: 'A point that is the same distance from $L$ and $M$ lies on the perpendicular bisector of $LM$: the line through its midpoint, at right angles to it.'
        write: '$P$ lies on the perpendicular bisector of $LM$'
        point:
          - {figure: sketch, kind: highlight, target: 'PN', text: 'perpendicular bisector'}
      - say: 'Call the midpoint $N$. Half of 16 is 8, so $LN$ is 8 cm.'
        write: '$LN = \dfrac{16}{2} = 8$ cm'
        point:
          - {figure: sketch, kind: circle, target: N, text: 'midpoint'}
          - {figure: sketch, kind: underline, target: LN, text: '8 cm'}
      - say: 'Triangle $LNP$ has a right angle at $N$, because the bisector is perpendicular to $LM$.'
        write: '$\angle LNP = 90^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: LNP, text: '90°'}
      - say: 'Its hypotenuse is $LP$, 10 cm, and one leg is $LN$, 8 cm. The distance of $P$ from the line $LM$ is the other leg, $PN$, because distance from a line is always measured at right angles.'
        write: 'Distance of $P$ from $LM = PN$'
        point:
          - {figure: sketch, kind: label, target: 'PL', text: 'hypotenuse'}
          - {figure: sketch, kind: label, target: 'LN', text: 'leg'}
          - {figure: sketch, kind: circle, target: '?', text: 'PN'}
      - say: 'Pythagoras: the hypotenuse squared equals the opposite squared plus the adjacent squared.'
        write: 'Pythagoras: $\text{hypotenuse}^{2} = \text{opposite}^{2} + \text{adjacent}^{2}$'
      - say: 'Here the hypotenuse is $LP$, and the other two sides are $LN$ and $PN$.'
        write: 'Here: hypotenuse $= LP$, other sides $LN$ and $PN$'
      - say: 'By Pythagoras, $PN$ squared is the hypotenuse squared, minus the other leg squared.'
        write: '$PN^{2} = LP^{2} - LN^{2}$'
      - say: 'Put in 10 for $LP$ and 8 for $LN$.'
        write: '$= 10^{2} - 8^{2}$'
        point:
          - {line: 8, kind: box, text: 'Pythagoras'}
          - {line: 9, kind: move, from: {line: 0, at: 'PL = [[10]]'}, at: '[[10]]2', text: 'LP'}
          - {line: 9, kind: move, from: {line: 3, at: '= 8'}, at: '− [[8]]2', text: 'LN'}
      - say: '10 squared is 100, and 8 squared is 64.'
        write: '$= 100 - 64$'
      - say: '100 minus 64 is 36.'
        write: '$= 36$'
      - say: 'So $PN$ is the square root of 36, which is 6.'
        write: '$PN = \sqrt{36} = 6$'
      - say: 'So $P$ is 6 cm from $LM$, which is answer choice D.'
        write: '$PN = 6\ \text{cm}$'
        answer: true
        point:
          - {figure: sketch, kind: label, target: '?', text: '6 cm'}
    traps:
      A: 'You went for 12 cm. That''s longer than $LP$, which is the hypotenuse, so it can''t be a leg. Pythagoras gives $\sqrt{100 - 64} = 6$.'
      B: 'You went for 10 cm. That''s $PL$, the distance from $P$ to the point $L$. The distance from the line $LM$ is the perpendicular one, 6 cm.'
      C: 'You went for 8 cm. That''s $LN$, half of $LM$, which runs along the line. The distance from the line is at right angles to it: $\sqrt{10^{2} - 8^{2}} = 6$.'
  33:
    moments:
      - say: 'A line makes an angle of 135 degrees with the positive $x$-axis and passes through the point 2, 3. We want its equation.'
        write: 'Angle $135^{\circ}$, through the point $(2,\ 3)$'
      - say: 'Let me draw a diagram of this, to make it simpler to see.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '135°'}
          - {figure: sketch, kind: circle, target: '(2, 3)'}
      - say: 'The gradient of a line is the tangent of the angle it makes with the positive $x$-axis.'
        write: '$m = \tan\theta$'
        point:
          - {figure: sketch, kind: circle, target: 'x', text: 'positive x-axis'}
      - say: 'So the gradient is tan 135 degrees.'
        write: '$m = \tan 135^{\circ}$'
      - say: '135 degrees is in the second quadrant, where tangent is negative. 180 minus 135 is 45, so tan 135 is negative tan 45.'
        write: '$\tan 135^{\circ} = -\tan(180^{\circ} - 135^{\circ}) = -\tan 45^{\circ}$'
        point:
          - {figure: sketch, kind: label, target: '135°', text: '180° − 135° = 45°'}
      - say: 'Tan 45 is 1, so the gradient is negative 1. The line slopes downhill, as any angle over 90 degrees means.'
        write: '$m = -1$'
        point:
          - {figure: sketch, kind: label, target: 'line = ?', text: 'downhill: m = −1'}
      - say: 'Now we use the point-gradient form of a line.'
        write: 'Point-gradient form: $y - y_{1} = m(x - x_{1})$'
      - say: 'Put in $m$ equals negative 1, and the point 2, 3, so $x_{1}$ is 2 and $y_{1}$ is 3.'
        write: '$y - 3 = -1(x - 2)$'
        point:
          - {line: 6, kind: box, text: 'the rule'}
          - {line: 7, kind: move, from: {line: 5, at: '−1'}, at: '−1', text: 'gradient'}
          - {figure: sketch, kind: circle, target: '(2, 3)', text: 'x₁ = 2, y₁ = 3'}
      - say: 'Multiply out the bracket. Negative 1 times $x$ is negative $x$, and negative 1 times negative 2 is plus 2.'
        write: '$y - 3 = -x + 2$'
      - say: 'Add 3 to both sides. 2 plus 3 is 5.'
        write: '$y = -x + 5$'
      - say: 'Add $x$ to both sides to match the options.'
        write: '$x + y = 5$'
      - say: 'Check the point 2, 3: 2 plus 3 is 5. It works.'
        write: 'Check $(2,\ 3)$: $2 + 3 = 5$'
        point:
          - {figure: sketch, kind: circle, target: '(2, 3)', text: '2 + 3 = 5'}
      - say: 'So the equation is $x + y = 5$, which is answer choice C.'
        write: '$x + y = 5$'
        answer: true
        point:
          - {figure: sketch, kind: label, target: 'line = ?', text: 'x + y = 5'}
    traps:
      A: 'You went for $x - y = 1$. That line has gradient positive 1, sloping uphill, but an angle of 135 degrees means a negative gradient. It also misses the point: 2 minus 3 is negative 1, not 1.'
      B: 'You went for $x + y = 1$. The gradient is right, but the line must pass through 2, 3, and 2 plus 3 is 5, not 1.'
      D: 'You went for $x - y = 5$. That line slopes uphill with gradient 1, and 2 minus 3 is not 5. Tan 135 degrees is negative 1, which gives $x + y = 5$.'
  34:
    moments:
      - say: 'We want the distance from $Q$ at 4, 3 to the point where the lines $2x - y = 4$ and $x + y = 2$ meet.'
        write: '$2x - y = 4,\qquad x + y = 2$'
      - say: 'Let me draw a diagram of this, to make it simpler to see.'
        show_sketch: true
        point:
          - {figure: sketch, kind: underline, target: '2x − y = 4'}
          - {figure: sketch, kind: underline, target: 'x + y = 2'}
          - {figure: sketch, kind: circle, target: Q}
      - say: 'The point common to both lines is where they cross, so we solve the equations together. The $y$ terms have opposite signs, so adding the equations will eliminate $y$.'
        write: 'Add: $(2x - y) + (x + y) = 4 + 2$'
        point:
          - {figure: sketch, kind: circle, target: {x: 162, y: 150}, text: 'where they cross'}
      - say: '$2x$ plus $x$ is $3x$, the $y$s cancel, and 4 plus 2 is 6.'
        write: '$3x = 6$'
      - say: 'Divide by 3. 6 divided by 3 is 2.'
        write: '$x = \dfrac{6}{3} = 2$'
      - say: 'Put $x$ equals 2 into the second equation, $x + y = 2$.'
        write: '$2 + y = 2$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '= 2'}, at: '[[2]] + y', text: 'x'}
      - say: 'Subtract 2 from both sides, and $y$ is 0.'
        write: '$y = 2 - 2 = 0$'
      - say: 'So the lines meet at the point 2, 0. It fits the first equation too: 2 times 2, minus 0, is 4.'
        write: 'Lines meet at $(2,\ 0)$; check: $2(2) - 0 = 4$'
        point:
          - {figure: sketch, kind: label, target: {x: 162, y: 150}, text: '(2, 0)'}
      - say: 'Now the distance from $Q$, at 4, 3, to the point 2, 0. We use the distance formula.'
        write: 'Distance $= \sqrt{(x_{2} - x_{1})^{2} + (y_{2} - y_{1})^{2}}$'
        point:
          - {figure: sketch, kind: circle, target: 'Q'}
          - {figure: sketch, kind: circle, target: '?', text: 'this distance'}
      - say: 'Substitute the two points.'
        write: '$= \sqrt{(4 - 2)^{2} + (3 - 0)^{2}}$'
        point:
          - {line: 8, kind: box, text: 'the rule'}
          - {line: 9, kind: move, from: {line: 7, at: '([[2]], 0)'}, at: '−2', text: 'crossing'}
          - {line: 9, kind: move, from: {line: 7, at: '(2, [[0]])'}, at: '−0'}
      - say: '4 minus 2 is 2, and 3 minus 0 is 3.'
        write: '$= \sqrt{2^{2} + 3^{2}}$'
      - say: '2 squared is 4, and 3 squared is 9.'
        write: '$= \sqrt{4 + 9}$'
      - say: '4 plus 9 is 13.'
        write: '$= \sqrt{13}$'
      - say: 'So the distance is root 13, which is answer choice D.'
        write: 'Distance $= \sqrt{13}$'
        answer: true
        point:
          - {figure: sketch, kind: label, target: '?', text: '√13'}
    traps:
      A: 'You went for $3\sqrt{10}$, which is root 90. That''s far too long. The lines meet at 2, 0, and from 4, 3 the differences are just 2 and 3, giving $\sqrt{13}$.'
      B: 'You went for $3\sqrt{5}$, which is root 45. Check the crossing point: adding the equations gives $3x = 6$, so $x = 2$ and $y = 0$. The distance is then $\sqrt{4 + 9}$.'
      C: 'You went for $\sqrt{26}$. That''s double the right number under the root. From 4, 3 to 2, 0, the differences are 2 and 3, and $4 + 9 = 13$.'
  35:
    moments:
      - say: 'From an instrument on the ground, the angle of elevation of the top of a building is 30 degrees. Picture the instrument on its tripod, looking up at the top of the 40 m building. We want how far the instrument is from the foot of the building.'
        write: 'Angle of elevation $= 30^{\circ}$, height $= 40$ m'
        doodle: {name: 'custom:1997_q35_a', id: site, caption: 'how far is the instrument?'}
      - say: 'Picture a right-angled triangle. The building stands straight up, the ground is flat, and the line of sight goes from the instrument up to the top of the building.'
        write: 'Right angle at the foot of the building'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: B, text: 'right angle'}
      - say: 'The 30 degree angle is at the instrument. The building''s 40 m is opposite that angle, and the ground distance, call it $d$, is next to it: the adjacent side.'
        write: 'Opposite $= 40$, adjacent $= d$'
        point:
          - {figure: sketch, kind: arc, target: BAC, text: '30°'}
          - {figure: sketch, kind: highlight, target: BC, text: 'opposite'}
          - {figure: sketch, kind: underline, target: AB, text: 'adjacent'}
        doodle_do:
          - {id: site, op: highlight, part: building, text: 'opposite: 40 m'}
          - {id: site, op: label, part: ground, text: 'adjacent: d'}
      - say: 'TOA: the tangent of an angle is the opposite side over the adjacent side.'
        write: 'TOA: $\tan\theta = \dfrac{\text{opposite}}{\text{adjacent}}$'
      - say: 'Opposite over adjacent is tangent.'
        write: '$\tan 30^{\circ} = \dfrac{40}{d}$'
      - say: 'Multiply both sides by $d$.'
        write: '$d \tan 30^{\circ} = 40$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '[[d]]40'}, at: '[[d]]tan', text: 'times both sides'}
      - say: 'Now divide both sides by tan 30 to get $d$ by itself.'
        write: '$d = \dfrac{40}{\tan 30^{\circ}}$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: 'tan30∘'}, at: 'tan30∘', text: 'divide it over'}
      - say: 'Tan 30 degrees is 1 over root 3.'
        write: '$\tan 30^{\circ} = \dfrac{1}{\sqrt{3}}$'
      - say: 'Put that into our line for $d$: 40 divided by 1 over root 3.'
        write: '$d = \dfrac{40}{1/\sqrt{3}}$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '= 31'}, at: '1/3', text: 'tan 30°'}
          - {figure: sketch, kind: circle, target: '30°', text: 'tan 30° = 1/√3'}
      - say: 'Dividing by 1 over root 3 is the same as multiplying by root 3.'
        write: '$= 40 \times \sqrt{3} = 40\sqrt{3}$'
      - say: 'Does that make sense? Root 3 is about 1.73, and 40 times 1.73 is about 69 m. Look at the picture: a shallow angle means we''re standing far away, so the distance should be more than the 40 m height. It is.'
        write: 'Check: $40\sqrt{3} \approx 40 \times 1.73 \approx 69$ m, more than $40$ m'
        point:
          - {figure: sketch, kind: circle, target: 'd = ?', text: '≈ 69 m'}
          - {figure: sketch, kind: circle, target: '40 m'}
          - {line: 10, kind: highlight, at: '69', to: {doodle: site, part: ground}}
        doodle_do:
          - {id: site, op: label, part: ground, text: 'd ≈ 69 m'}
      - say: 'So the instrument is $40\sqrt{3}$ m from the building, which is answer choice B.'
        write: '$d = 40\sqrt{3}\ \text{m}$'
        answer: true
        point:
          - {figure: sketch, kind: label, target: 'd = ?', text: '40√3 m'}
    traps:
      A: 'You went for $20\sqrt{3}$ m. That''s half the answer. From $\tan 30^{\circ} = \tfrac{40}{d}$, $d = 40 \div \tfrac{1}{\sqrt{3}} = 40\sqrt{3}$.'
      C: 'You went for $\tfrac{40}{\sqrt{3}}$ m. That multiplies 40 by tan 30 instead of dividing. It''s about 23 m, closer than the building is tall, which a shallow 30 degree angle rules out.'
      D: 'You went for $\tfrac{20}{\sqrt{3}}$ m. That multiplies by tan 30 instead of dividing, and uses 20 instead of the 40 m height. The distance is $\tfrac{40}{\tan 30^{\circ}} = 40\sqrt{3}$.'
  36:
    moments:
      - say: 'In triangle $XYZ$, angle $XYZ$ is 60 degrees, $XY$ is 3 cm and $YZ$ is 4 cm. We want the side $XZ$.'
        write: '$XY = 3,\ YZ = 4,\ \angle XYZ = 60^{\circ}$'
      - say: 'Let me draw a diagram of this, to make it simpler to see.'
        show_sketch: true
        point:
          - {figure: sketch, kind: highlight, target: XY, text: '3 cm'}
          - {figure: sketch, kind: highlight, target: YZ, text: '4 cm'}
          - {figure: sketch, kind: arc, target: XYZ, text: '60°'}
      - say: 'We have two sides and the angle between them, and we want the third side. That''s a job for the cosine rule.'
        write: 'Cosine rule: $b^{2} = a^{2} + c^{2} - 2ac\cos B$'
      - say: 'Here the angle is the 60 degrees at $Y$, sitting between $XY$ and $YZ$. The side opposite it is $XZ$, the one we want.'
        write: '$XZ^{2} = XY^{2} + YZ^{2} - 2(XY)(YZ)\cos Y$'
        point:
          - {figure: sketch, kind: underline, target: XZ, text: 'opposite 60°'}
      - say: 'Put in $XY$ equals 3, $YZ$ equals 4, and the angle 60 degrees.'
        write: '$= 3^{2} + 4^{2} - 2(3)(4)\cos 60^{\circ}$'
        point:
          - {line: 4, kind: move, from: {line: 0, at: 'XY = [[3]]'}, at: '= [[3]]2', text: 'XY'}
          - {line: 4, kind: move, from: {line: 0, at: 'YZ = [[4]]'}, at: '+ [[4]]2', text: 'YZ'}
          - {line: 4, kind: move, from: {line: 0, at: '60∘'}, at: '60∘', text: 'angle'}
      - say: '3 squared is 9, and 4 squared is 16.'
        write: '$= 9 + 16 - 2(3)(4)\cos 60^{\circ}$'
      - say: '9 plus 16 is 25, and 2 times 3 times 4 is 24.'
        write: '$= 25 - 24\cos 60^{\circ}$'
      - say: 'Cos 60 degrees is a half.'
        write: '$= 25 - 24 \times \dfrac{1}{2}$'
      - say: 'Half of 24 is 12.'
        write: '$= 25 - 12$'
      - say: '25 minus 12 is 13.'
        write: '$= 13$'
      - say: 'So $XZ$ squared is 13. Take the square root of both sides.'
        write: '$XZ = \sqrt{13}$'
      - say: 'So $XZ$ is root 13 cm, which is answer choice B.'
        write: '$XZ = \sqrt{13}\ \text{cm}$'
        answer: true
        point:
          - {figure: sketch, kind: label, target: '?', text: '√13 cm'}
    traps:
      A: 'You went for $\sqrt{23}$ cm. Check the subtraction: $2(3)(4)\cos 60^{\circ}$ is 24 times a half, which is 12. So $XZ^{2} = 25 - 12 = 13$.'
      C: 'You went for $2\sqrt{5}$, which is root 20. The term to subtract is 12, not 5. $25 - 12 = 13$, so $XZ = \sqrt{13}$.'
      D: 'You went for $2\sqrt{3}$, which is root 12. That''s the size of the term you subtract, not the answer. $XZ^{2} = 25 - 12 = 13$.'
  37:
    moments:
      - say: 'In the diagram, $XY$ is 5 cm and $XZ$ is 2 cm. $XZ$ is extended to $E$, making angle $YZE$ 150 degrees. We want sine of $\theta$, the angle at $Y$.'
        write: '$XY = 5,\ XZ = 2,\ \angle YZE = 150^{\circ}$'
        point:
          - {figure: 0, kind: highlight, target: XY, text: '5 cm'}
          - {figure: 0, kind: highlight, target: XZ, text: '2 cm'}
          - {figure: 0, kind: arc, target: YZE, text: '150°'}
      - say: 'First, bring the 150 degrees inside the triangle. $X$, $Z$ and $E$ lie on a straight line, so angle $XZY$ and angle $YZE$ are angles on a straight line, and they add up to 180.'
        write: '$\angle XZY + \angle YZE = 180^{\circ}$'
        point:
          - {figure: 0, kind: highlight, target: 'XE', text: 'straight line'}
          - {figure: 0, kind: arc, target: 'XZY'}
      - say: 'So angle $XZY$ is 180 minus 150, which is 30 degrees.'
        write: '$\angle XZY = 180^{\circ} - 150^{\circ} = 30^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: XZY, text: '30°'}
      - say: 'Now we know two sides and an angle that isn''t between them, so we use the sine rule. It pairs each side with the angle opposite it.'
        write: 'Sine rule: $\dfrac{a}{\sin A} = \dfrac{b}{\sin B}$'
      - say: '$XZ$, 2 cm, is opposite the angle at $Y$, which is $\theta$. $XY$, 5 cm, is opposite the angle at $Z$, the 30 degrees we just found.'
        write: '$\dfrac{XZ}{\sin\theta} = \dfrac{XY}{\sin\angle XZY}$'
        point:
          - {line: 3, kind: box, text: 'the rule'}
          - {figure: 0, kind: underline, target: 'XZ', text: 'faces θ'}
          - {figure: 0, kind: underline, target: 'XY', text: 'faces 30°'}
      - say: 'Put in the numbers.'
        write: '$\dfrac{2}{\sin\theta} = \dfrac{5}{\sin 30^{\circ}}$'
        point:
          - {line: 5, kind: move, from: {line: 0, at: 'XZ = [[2]]'}, at: '2', text: 'XZ'}
          - {line: 5, kind: move, from: {line: 0, at: 'XY = [[5]]'}, at: '5', text: 'XY'}
          - {line: 5, kind: move, from: {line: 2, at: '= 30'}, at: '30', text: 'angle Z'}
      - say: 'Sine 30 degrees is a half, which is 0.5.'
        write: '$\dfrac{2}{\sin\theta} = \dfrac{5}{0.5}$'
      - say: '5 divided by 0.5 is 10, because 0.5 goes into 5 ten times.'
        write: '$\dfrac{2}{\sin\theta} = 10$'
      - say: 'Multiply both sides by sine $\theta$: 2 equals 10 sine $\theta$.'
        write: '$2 = 10\sin\theta$'
      - say: 'Divide both sides by 10. 2 over 10 simplifies to 1 over 5.'
        write: '$\sin\theta = \dfrac{2}{10} = \dfrac{1}{5}$'
      - say: 'A quick sense check: a sine must lie between 0 and 1, and 1 over 5 does. Pairing each side with the wrong angle would give 5 over 4, which is impossible for a sine.'
        write: 'Check: $0 < \dfrac{1}{5} < 1$'
      - say: 'So sine $\theta$ is 1 over 5, which is answer choice D.'
        write: '$\sin\theta = \dfrac{1}{5}$'
        answer: true
        point:
          - {figure: 0, kind: label, target: θ, text: 'sin θ = 1/5'}
    traps:
      A: 'You went for 3 over 5. The sine rule pairs each side with the angle opposite it: $\tfrac{2}{\sin\theta} = \tfrac{5}{\sin 30^{\circ}} = 10$, so $\sin\theta = \tfrac{1}{5}$.'
      B: 'You went for a half. That''s sine 30 degrees, the angle at $Z$. The question wants the angle at $Y$, and the sine rule gives 1 over 5.'
      C: 'You went for 2 over 5. That''s the two sides divided, without the sine of 30 degrees. Including $\sin 30^{\circ} = \tfrac{1}{2}$ gives $\tfrac{2 \times 0.5}{5} = \tfrac{1}{5}$.'
  38:
    moments:
      - say: 'We want to differentiate $6x^{3} - 5x^{2} + 1$, all over $3x^{2}$.'
        write: '$\dfrac{6x^{3} - 5x^{2} + 1}{3x^{2}}$'
      - say: 'The bottom is a single term, so instead of the quotient rule, we can divide each term on top by $3x^{2}$ first. That turns everything into simple powers of $x$.'
        write: '$= \dfrac{6x^{3}}{3x^{2}} - \dfrac{5x^{2}}{3x^{2}} + \dfrac{1}{3x^{2}}$'
      - say: '6 over 3 is 2, and $x^{3}$ over $x^{2}$ is $x$. So the first piece is $2x$.'
        write: '$\dfrac{6x^{3}}{3x^{2}} = 2x$'
      - say: 'In the second, the $x^{2}$s cancel, leaving 5 over 3, a constant.'
        write: '$\dfrac{5x^{2}}{3x^{2}} = \dfrac{5}{3}$'
      - say: 'For the third, 1 over $x^{2}$ is $x$ to the negative 2, so this is 1 over 3 times $x$ to the negative 2.'
        write: '$\dfrac{1}{3x^{2}} = \dfrac{1}{3}x^{-2}$'
      - say: 'Put the three pieces together.'
        write: '$y = 2x - \dfrac{5}{3} + \dfrac{1}{3}x^{-2}$'
      - say: 'The power rule for differentiating: bring the power down in front, then take one off the power.'
        write: '$\dfrac{d}{dx}\left(ax^{n}\right) = nax^{n - 1}$'
      - say: 'Now differentiate term by term. $2x$ gives 2.'
        write: '$\dfrac{d}{dx}(2x) = 2$'
      - say: 'A constant differentiates to zero, so the 5 over 3 disappears.'
        write: '$\dfrac{d}{dx}\left(-\dfrac{5}{3}\right) = 0$'
      - say: 'For 1 over 3 times $x$ to the negative 2, bring the power down and take 1 off it. 1 over 3 times negative 2 is negative 2 over 3, and negative 2 minus 1 is negative 3.'
        write: '$\dfrac{d}{dx}\left(\dfrac{1}{3}x^{-2}\right) = \dfrac{1}{3} \times (-2)x^{-3} = -\dfrac{2}{3}x^{-3}$'
        point:
          - {line: 9, kind: move, from: {line: 9, at: '(31x[[−2]])'}, at: '× [[(−2)]]', text: 'power down'}
      - say: 'Add up the three results: 2, plus 0, minus 2 over 3 times $x$ to the negative 3.'
        write: '$\dfrac{dy}{dx} = 2 + 0 - \dfrac{2}{3}x^{-3}$'
        point:
          - {line: 10, kind: move, from: {line: 7, at: '= 2'}, at: '= 2'}
          - {line: 10, kind: move, from: {line: 8, at: '= 0'}, at: '+ 0', text: 'constant'}
          - {line: 10, kind: move, from: {line: 9, at: '= −32x−3'}, at: '−32x−3', text: 'third term'}
      - say: '$x$ to the negative 3 is 1 over $x^{3}$, so the last term is 2 over $3x^{3}$.'
        write: '$= 2 - \dfrac{2}{3x^{3}}$'
      - say: 'So the derivative is 2 minus 2 over $3x^{3}$, which is answer choice C.'
        write: '$\dfrac{dy}{dx} = 2 - \dfrac{2}{3x^{3}}$'
        answer: true
    traps:
      A: 'You went for 2 plus 2 over $3x^{3}$. That misses one sign. The power negative 2 comes down as a negative, so the last term subtracts.'
      B: 'You went for 2 plus 1 over $6x$. The last term is $\tfrac{1}{3}x^{-2}$; bring down the negative 2 and lower the power to negative 3, giving $-\tfrac{2}{3x^{3}}$.'
      D: 'You went for 2 minus 1 over $6x$. Differentiating $\tfrac{1}{3}x^{-2}$ multiplies by negative 2 and lowers the power by 1, giving $-\tfrac{2}{3}x^{-3}$.'
  39:
    moments:
      - say: 'We want the derivative of cos of $3x^{2} - 2x$.'
        write: '$\dfrac{d}{dx}\cos(3x^{2} - 2x)$'
      - say: 'This is a function inside a function: cos of a bracket. Picture two machines in a row: $x$ goes into the inside machine and comes out as $u$, which is $3x^{2} - 2x$; then $u$ goes into the cos machine. So we use the chain rule.'
        write: 'Let $u = 3x^{2} - 2x$, so $y = \cos u$'
        doodle: {name: 'custom:1997_q39_a', id: chain, caption: 'an inside machine, then cos', size: scene}
      - say: 'The chain rule says: differentiate the outside, keep the inside the same, then multiply by the derivative of the inside.'
        write: '$\dfrac{dy}{dx} = \dfrac{dy}{du} \times \dfrac{du}{dx}$'
      - say: 'The outside machine first. The derivative of cos $u$ is negative sine $u$. That minus sign is part of the rule.'
        write: '$\dfrac{dy}{du} = -\sin u$'
        doodle_do:
          - {id: chain, op: stage, stage: 'custom:1997_q39_a2'}
      - say: 'Keep the inside the same: put $3x^{2} - 2x$ back in place of $u$.'
        write: '$= -\sin(3x^{2} - 2x)$'
        point:
          - {line: 4, kind: move, from: {line: 1, at: 'u = [[3x2 − 2x]]'}, at: '(3x2 − 2x)', text: 'in place of u'}
      - say: 'Now the inside machine. $3x^{2}$ gives 2 times $3x$, which is $6x$, and $2x$ gives 2. So $du$ by $dx$ is $6x - 2$.'
        write: '$\dfrac{du}{dx} = 6x - 2$'
        point:
          - {line: 5, kind: highlight, at: '6x - 2', to: {doodle: chain, part: rate1}}
        doodle_do:
          - {id: chain, op: stage, stage: 'custom:1997_q39_a3'}
      - say: 'Now multiply the two machines'' rates, as the chain rule says.'
        write: '$\dfrac{dy}{dx} = -\sin(3x^{2} - 2x) \times (6x - 2)$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '−sin(3x2 − 2x)'}, at: '−sin(3x2 − 2x)', text: 'outside'}
          - {line: 6, kind: move, from: {line: 5, at: '6x − 2'}, at: '(6x − 2)', text: 'inside'}
        doodle_do:
          - {id: chain, op: stage, stage: 'custom:1997_q39_a4'}
      - say: 'Written neatly, with the $6x - 2$ in front.'
        write: '$= -(6x - 2)\sin(3x^{2} - 2x)$'
      - say: 'Notice what survives: the minus sign from differentiating cos, and the bracket inside the sine, which never changes.'
        write: 'Minus sign kept; bracket inside the sine unchanged'
      - say: 'So the answer is negative $6x - 2$, times sine of $3x^{2} - 2x$, which is answer choice D.'
        write: '$\dfrac{d}{dx}\cos(3x^{2} - 2x) = -(6x - 2)\sin(3x^{2} - 2x)$'
        answer: true
    traps:
      A: 'You went for negative sine of $6x - 2$. That puts the derivative of the inside inside the sine. The chain rule keeps the inside as it is and multiplies by $6x - 2$.'
      B: 'You went for negative sine of $3x^{2} - 2x$. That differentiates the outside but forgets to multiply by the derivative of the inside, $6x - 2$.'
      C: 'You went for $(6x - 2)\sin(3x^{2} - 2x)$ with no minus. The derivative of cos is negative sine, so the minus must stay.'
  40:
    moments:
      - say: 'We want the gradient of the curve $y = 2\sqrt{x} - \dfrac{1}{x}$ at $x = 1$. Picture the curve as a hill, with a walker standing on it at $x = 1$: how steep is it under his feet?'
        write: '$y = 2\sqrt{x} - \dfrac{1}{x}$'
        doodle: {name: 'custom:1997_q40_a', id: hill, caption: 'how steep is it at x = 1?'}
      - say: 'The gradient is the derivative. First, rewrite both terms as powers of $x$: root $x$ is $x$ to the power a half, and 1 over $x$ is $x$ to the negative 1.'
        write: '$y = 2x^{1/2} - x^{-1}$'
      - say: 'The power rule for differentiating: bring the power down in front, then take one off the power.'
        write: '$\dfrac{d}{dx}\left(ax^{n}\right) = nax^{n - 1}$'
      - say: 'Differentiate the first term: bring the half down in front, and take 1 off the power.'
        write: '$\dfrac{d}{dx}\left(2x^{1/2}\right) = 2 \times \dfrac{1}{2}x^{\frac{1}{2} - 1}$'
        point:
          - {line: 3, kind: move, from: {line: 3, at: '(2x[[1/2]])'}, at: '2 × [[21]]', text: 'power down'}
      - say: '2 times a half is 1, and a half minus 1 is negative a half.'
        write: '$= x^{-1/2}$'
      - say: 'Now the second term, negative $x$ to the negative 1. Bring down the negative 1, and take 1 off the power.'
        write: '$\dfrac{d}{dx}\left(-x^{-1}\right) = -(-1)x^{-1-1}$'
        point:
          - {line: 5, kind: move, from: {line: 5, at: '(−x[[−1]])'}, at: '−[[(−1)]]x', text: 'power down'}
      - say: 'Negative times negative is positive, and negative 1 minus 1 is negative 2.'
        write: '$= +x^{-2}$'
      - say: 'Add the two results to get the derivative.'
        write: '$\dfrac{dy}{dx} = x^{-1/2} + x^{-2}$'
        point:
          - {line: 7, kind: move, from: {line: 4, at: 'x−1/2'}, at: 'x−1/2', text: 'first'}
          - {line: 7, kind: move, from: {line: 6, at: '+x−2'}, at: '+ x−2', text: 'second'}
      - say: 'As fractions, that''s 1 over root $x$, plus 1 over $x^{2}$.'
        write: '$= \dfrac{1}{\sqrt{x}} + \dfrac{1}{x^{2}}$'
      - say: 'Now put $x$ equals 1 into the derivative: that is where our walker stands.'
        write: 'At $x = 1$: $\dfrac{dy}{dx} = \dfrac{1}{\sqrt{1}} + \dfrac{1}{1^{2}}$'
        point:
          - {line: 8, kind: arrow, text: 'derivative'}
        doodle_do:
          - {id: hill, op: pulse, part: walker}
      - say: 'Root 1 is 1, and 1 squared is 1, so each fraction is 1 over 1, which is 1. 1 plus 1 is 2. So for every step across, the hill climbs 2.'
        write: '$= 1 + 1 = 2$'
        point:
          - {line: 10, kind: highlight, at: '= 2', to: {doodle: hill, part: slope}}
        doodle_do:
          - {id: hill, op: stage, stage: 'custom:1997_q40_a2'}
      - say: 'So the gradient at $x = 1$ is 2, which is answer choice C.'
        write: 'Gradient at $x = 1$ is $2$'
        answer: true
    traps:
      A: 'You went for 0. That comes from getting $-\tfrac{1}{x^{2}}$ for the second term. Differentiating $-x^{-1}$ gives $+x^{-2}$, because two minus signs make a plus, so it''s $1 + 1 = 2$.'
      B: 'You went for 1. That counts only one of the two terms. At $x = 1$, both $\tfrac{1}{\sqrt{x}}$ and $\tfrac{1}{x^{2}}$ are 1, so the gradient is 2.'
      D: 'You went for 3. That happens if the first term is differentiated to 2 instead of 1. 2 times a half is 1, so the gradient is $1 + 1 = 2$.'
  41:
    moments:
      - say: 'We want to integrate 1 over $x$ plus cos $x$ with respect to $x$.'
        write: '$\displaystyle\int \left(\dfrac{1}{x} + \cos x\right)dx$'
      - say: 'Integration splits across a sum, so we can do each term separately.'
        write: '$= \displaystyle\int \dfrac{1}{x}\,dx + \int \cos x\,dx$'
      - say: 'First, 1 over $x$ is $x$ to the negative 1. The usual power rule adds 1 to the power and divides by the new power, which here would be 0. We can''t divide by zero, so this term is a special case.'
        write: 'Power rule fails: $\dfrac{x^{-1+1}}{-1+1} = \dfrac{x^{0}}{0}$'
      - say: 'The special result is: the integral of 1 over $x$ is the natural log of $x$.'
        write: '$\displaystyle\int \dfrac{1}{x}\,dx = \ln x$'
      - say: 'Why? Because $\ln x$ differentiates to 1 over $x$. Picture the two cards: differentiating goes forward from $\ln x$ to 1 over $x$, and integration undoes it, walking back.'
        write: '$\dfrac{d}{dx}(\ln x) = \dfrac{1}{x}$'
        doodle: {name: 'custom:1997_q41_a', id: cards, caption: 'integrating walks back the arrow'}
      - say: 'Now cos $x$. Sine $x$ differentiates to cos $x$, so walking back, the integral of cos $x$ is sine $x$.'
        write: '$\dfrac{d}{dx}(\sin x) = \cos x$, so $\displaystyle\int \cos x\,dx = \sin x$'
        doodle_do:
          - {id: cards, op: stage, stage: 'custom:1997_q41_a2'}
      - say: 'Put the two results together.'
        write: '$\displaystyle\int \left(\dfrac{1}{x} + \cos x\right)dx = \ln x + \sin x$'
        point:
          - {line: 6, kind: move, from: {line: 3, at: 'lnx'}, at: 'lnx', text: 'first'}
          - {line: 6, kind: move, from: {line: 5, at: '= sinx'}, at: '+ sinx', text: 'second'}
      - say: 'An indefinite integral always needs a constant, because any constant differentiates to zero: going forward it is lost, so coming back we add it. We''ll call it $k$.'
        write: '$= \ln x + \sin x + k$'
        doodle_do:
          - {id: cards, op: label, part: back1, text: '+ k: a constant is lost going forward'}
      - say: 'So the answer is $\ln x$ plus sine $x$ plus $k$, which is answer choice B.'
        write: '$\displaystyle\int \left(\dfrac{1}{x} + \cos x\right)dx = \ln x + \sin x + k$'
        answer: true
    traps:
      A: 'You went for negative 1 over $x^{2}$ plus sine $x$. Negative 1 over $x^{2}$ is what you get by differentiating 1 over $x$. Integrating it gives $\ln x$.'
      C: 'You went for $\ln x$ minus sine $x$. The first term is right, but the integral of cos $x$ is positive sine $x$, because sine $x$ differentiates to cos $x$.'
      D: 'You went for negative 1 over $x^{2}$ minus sine $x$. Both terms have been differentiated instead of integrated. Integrating gives $\ln x + \sin x + k$.'
  42:
    moments:
      - say: 'We have $y$ equals $x$ times, bracket, $x^{4}$ plus $x^{2}$ plus 1, and we want the integral of $y$ from negative 1 to 1.'
        write: '$\displaystyle\int_{-1}^{1} x(x^{4} + x^{2} + 1)\,dx$'
      - say: 'First, multiply out the bracket. $x$ times $x^{4}$ is $x^{5}$, $x$ times $x^{2}$ is $x^{3}$, and $x$ times 1 is $x$.'
        write: '$y = x^{5} + x^{3} + x$'
      - say: 'The rule for integrating a power of $x$: add one to the power, then divide by the new power.'
        write: '$\displaystyle\int x^{n}\,dx = \dfrac{x^{n + 1}}{n + 1} + c$'
      - say: 'Now integrate each term: add 1 to the power and divide by the new power.'
        write: '$\displaystyle\int_{-1}^{1} y\,dx = \left[\dfrac{x^{6}}{6} + \dfrac{x^{4}}{4} + \dfrac{x^{2}}{2}\right]_{-1}^{1}$'
      - say: 'Now put in the limits: the value at the top limit, 1, minus the value at the bottom limit, negative 1.'
        write: '$= \left(\dfrac{1^{6}}{6} + \dfrac{1^{4}}{4} + \dfrac{1^{2}}{2}\right) - \left(\dfrac{(-1)^{6}}{6} + \dfrac{(-1)^{4}}{4} + \dfrac{(-1)^{2}}{2}\right)$'
      - say: 'Every power of 1 is 1. And every power of negative 1 here is even, so each of those is positive 1 as well.'
        write: '$= \left(\dfrac{1}{6} + \dfrac{1}{4} + \dfrac{1}{2}\right) - \left(\dfrac{1}{6} + \dfrac{1}{4} + \dfrac{1}{2}\right)$'
      - say: 'Let''s add up one bracket, over 12. 1 over 6 is 2 over 12, 1 over 4 is 3 over 12, and 1 over 2 is 6 over 12. 2 plus 3 plus 6 is 11.'
        write: 'Each bracket: $\dfrac{2}{12} + \dfrac{3}{12} + \dfrac{6}{12} = \dfrac{11}{12}$'
      - say: 'So both brackets are 11 over 12.'
        write: '$\displaystyle\int_{-1}^{1} y\,dx = \dfrac{11}{12} - \dfrac{11}{12}$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '= 1211'}, at: '[[1211]] −', text: 'top limit'}
          - {line: 7, kind: move, from: {line: 6, at: '= 1211'}, at: '− [[1211]]', text: 'bottom limit'}
      - say: 'And 11 over 12 minus 11 over 12 is zero.'
        write: '$= 0$'
      - say: 'Let me sketch the graph, so we can see its shape.'
        show_sketch: true
      - say: 'There''s a shortcut worth knowing. $y$ has only odd powers, so replacing $x$ with negative $x$ just flips its sign. That makes it an odd function.'
        write: '$y(-x) = -x^{5} - x^{3} - x = -y$'
        point:
          - {figure: sketch, kind: underline, target: 'y = x⁵ + x³ + x', text: 'odd'}
      - say: 'An odd function''s area on the left of zero exactly cancels its area on the right. So over limits balanced around zero, its integral is always zero.'
        write: 'Odd function on $[-1,\ 1]$, so the integral $= 0$'
        point:
          - {figure: sketch, kind: circle, target: '+'}
          - {figure: sketch, kind: circle, target: '−', text: 'cancel'}
      - say: 'So the integral is 0, which is answer choice D.'
        write: '$\displaystyle\int_{-1}^{1} y\,dx = 0$'
        answer: true
    traps:
      A: 'You went for 11 over 12. That''s the value at the top limit only. You must subtract the value at the bottom limit, which is also 11 over 12, giving 0.'
      B: 'You went for 11 over 16. The value at each limit is $\tfrac{1}{6} + \tfrac{1}{4} + \tfrac{1}{2} = \tfrac{11}{12}$, and subtracting the two gives 0.'
      C: 'You went for 5 over 6. Remember to subtract the lower limit''s value. Both limits give $\tfrac{11}{12}$, so the answer is 0.'
  43:
