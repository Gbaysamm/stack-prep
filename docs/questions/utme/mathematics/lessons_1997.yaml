# UTME 1997 Mathematics — lessons for the board (version 2).
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1997.yaml. Answers match that file.
format_version: 1
exam_year: 1997
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'One-P-nought-three base four is worth 115 in base ten. P is a missing digit. Expand the base four numeral in base ten, and solve for P.'
        write: 'If $(1P03)_{4} = 115_{10}$, find $P$'
      - say: 'Start with the left side, the base four numeral.'
        write: 'Solution'
      - section: 'Expand the base 4 numeral'
        say: 'Write the index numbers over the digits, from nought on the right, so nought, one, two, three. Each digit is multiplied by four to the power of its index.'
        write: '$\overset{3}{1}\,\overset{2}{P}\,\overset{1}{0}\,\overset{0}{3}_{4} = 1 \times 4^{3} + P \times 4^{2} + 0 \times 4^{1} + 3 \times 4^{0}$'
      - say: 'Four cubed is 64, four squared is 16, and four to the power nought is 1. So we have 64, plus 16 P, plus 0, plus 3.'
        write: '$= 64 + 16P + 0 + 3$'
      - say: '64 plus 3 is 67. So the numeral is worth 67 plus 16P.'
        write: '$= 67 + 16P$'
      - section: 'Solve for P'
        say: 'This value is 115, so 67 plus 16P equals 115.'
        write: '$67 + 16P = 115$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '67+16P'}, at: '67+16P'}
      - say: 'Subtract 67 from both sides.'
        write: '$16P = 115 - 67$'
      - say: '115 minus 67 is 48.'
        write: '$16P = 48$'
      - say: 'Divide both sides by 16. 48 divided by 16 is 3.'
        write: '$P = \dfrac{48}{16} = 3$'
      - say: 'Base four uses only the digits 0, 1, 2 and 3, so 3 is an allowed digit.'
        write: 'Base 4 digits: 0, 1, 2, 3, so $P = 3$ is allowed'
      - section: 'Check'
        say: 'To check, put 3 in for P and expand one-three-nought-three base four. 64, plus 3 times 16, plus 0, plus 3, is 115. It agrees.'
        write: '$1303_{4} = 64 + 48 + 0 + 3 = 115\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore P is 3, which is option D.'
        write: '$\therefore P = 3$'
        answer: true
    traps:
      A: 'You went for 0. Then the numeral is only 64 plus 3, which is 67, not 115. Solve 67 plus 16P equals 115.'
      B: 'You went for 1. That gives 64 plus 16 plus 3, which is 83, not 115. P sits under the index 2, so it is multiplied by 16, and 16P must make 48.'
      C: 'You went for 2. That gives 64 plus 32 plus 3, which is 99, still short of 115. 16P equals 48 gives P equals 3.'
  2:
    moments:
      - section: 'The question'
        say: 'We want 64.764 squared minus 35.236 squared, correct to 3 significant figures. Squaring both by hand would take ages. There is a much shorter road.'
        write: '$64.764^{2} - 35.236^{2}$ (3 s.f.)'
      - section: 'Solution'
        say: 'Solution. This is one square minus another, which is a difference of two squares. The rule is a squared minus b squared equals a plus b, times a minus b.'
        write: '$a^{2} - b^{2} = (a + b)(a - b)$'
        doodle: {name: 'custom:1997_q02_a', id: tiles, caption: 'a big square minus a small one', size: scene}
      - say: 'Here a is 64.764 and b is 35.236. In the picture, the small square is cut from the corner of the big one.'
        write: '$a = 64.764,\quad b = 35.236$'
      - say: 'Substitute. The L-shape that is left can be moved into a rectangle, a plus b long and a minus b wide.'
        write: '$64.764^{2} - 35.236^{2} = (64.764 + 35.236)(64.764 - 35.236)$'
        point:
          - {line: 1, kind: box, text: 'the rule'}
        doodle_do:
          - {id: tiles, op: stage, stage: 'custom:1997_q02_a2'}
      - section: 'The two brackets'
        say: 'In the first bracket we add, with the points in a line. 4 plus 6 is 10, write 0 carry 1, and so on down the columns. The sum is exactly 100.'
        write: 'First bracket: $\begin{array}{r} 64.764 \\ +\,35.236 \\ \hline 100.000 \end{array}$'
        doodle_do:
          - {id: tiles, op: highlight, part: long, text: 'a + b = 100'}
      - say: 'In the second bracket we subtract, column by column from the right. 4 minus 6 needs a borrow, so 14 minus 6 is 8. Working on, the difference is 29.528.'
        write: 'Second bracket: $\begin{array}{r} 64.764 \\ -\,35.236 \\ \hline 29.528 \end{array}$'
      - say: 'Put both results into the brackets, and we get 100 times 29.528.'
        write: '$= 100 \times 29.528$'
        doodle_do:
          - {id: tiles, op: stage, stage: 'custom:1997_q02_a3'}
        point:
          - {line: 6, kind: highlight, at: '100 × 29.528', to: {doodle: tiles, part: numbers}}
      - say: 'Multiplying by 100 moves the decimal point two places to the right, giving 2952.8.'
        write: '$= 2952.8$'
        doodle_do:
          - {id: tiles, op: label, part: numbers, text: '= 2952.8'}
      - section: 'Correct to 3 s.f.'
        say: 'Now 3 significant figures. Count from the first non-zero digit, 2, 9, 5. Mark the cut after the 5.'
        write: 'Cut after 3 s.f.: $295\,|\,2.8$'
      - say: 'The next digit is 2, which is less than 5, so leave the 5. Then fill with zeros up to the decimal point, so the number keeps its size.'
        write: 'Next digit $2 < 5$: $2952.8 = 2950$ (3 s.f.)'
      - section: 'Check'
        say: 'Check roughly. 65 squared is 4225 and 35 squared is 1225. 4225 minus 1225 is 3000, close to 2950. It agrees.'
        write: 'Check: $65^{2} - 35^{2} = 4225 - 1225 = 3000 \approx 2950$ ✓'
      - say: 'Therefore the value is 2950, correct to 3 significant figures, which is option B.'
        write: '$\therefore 64.764^{2} - 35.236^{2} = 2950$ (3 s.f.) (B)'
        answer: true
    traps:
      A: 'You went for 2960. That adds 1 to the 5, but the next digit is 2, less than 5, so the 5 stays, giving 2950.'
      C: 'You went for 2860. That needs a difference of about 28.6, but 64.764 minus 35.236 is 29.528. 100 times 29.528 is 2952.8, which is 2950.'
      D: 'You went for 2850. That comes from a difference of 28.528, a slip in the borrowing. Subtract column by column. The difference is 29.528, and 2952.8 is 2950 to 3 significant figures.'
  3:
    moments:
      - section: 'The question'
        say: 'Cubing tiny decimals is where zeros get lost. Writing each number in standard form first, and using the laws of indices, keeps the count exact.'
        write: 'Find $(0.006)^{3} + (0.004)^{3}$ in standard form.'
      - say: 'Solution. First, recall what standard form means.'
        write: 'Solution'
      - section: 'Standard form'
        say: 'Standard form is $A$ times 10 to the power $n$, where $A$ is at least 1 and less than 10. Moving the point to the right gives a negative index.'
        write: 'Standard form: $A \times 10^{n}$, where $1 \le A < 10$'
      - section: 'The first cube'
        say: 'For 0.006, the point moves 3 places to the right to give 6. So it is 6 times 10 to the power negative 3.'
        write: '$0.006 = 6 \times 10^{-3}$'
      - say: 'The law of indices for a product says a product to a power is each factor to that power. So we cube the 6 and cube the power of 10.'
        write: '$(0.006)^{3} = 6^{3} \times (10^{-3})^{3}$ $\quad [(ab)^{n} = a^{n}b^{n}]$'
      - say: '6 cubed is 216. For the power of a power, multiply the indices, so negative 3 times 3 is negative 9. Picture 216 tiny blocks, each 10 to the power negative 9.'
        write: '$= 216 \times 10^{-9}$ $\quad [(a^{m})^{n} = a^{mn}]$'
        doodle: {name: 'custom:1997_q03_a', id: cubes, caption: '216 blocks of 10⁻⁹', size: scene}
      - section: 'The second cube'
        say: 'For 0.004, the point also moves 3 places. So it is 4 times 10 to the power negative 3.'
        write: '$0.004 = 4 \times 10^{-3}$'
      - say: 'Cube it the same way, so 4 cubed, times 10 to the power negative 3, cubed.'
        write: '$(0.004)^{3} = 4^{3} \times (10^{-3})^{3}$'
      - say: '4 cubed is 64, and again the power of 10 becomes 10 to the power negative 9, which is 64 of the same tiny blocks.'
        write: '$= 64 \times 10^{-9}$'
        doodle_do:
          - {id: cubes, op: stage, stage: 'custom:1997_q03_a2'}
      - section: 'Add'
        say: 'Now add the two results.'
        write: 'Sum $= 216 \times 10^{-9} + 64 \times 10^{-9}$'
      - say: 'Both terms have 10 to the power negative 9, so take it out as a common factor.'
        write: '$= (216 + 64) \times 10^{-9}$'
        doodle_do:
          - {id: cubes, op: circle, part: unit, text: 'same size blocks'}
      - say: '216 plus 64 is 280.'
        write: '$= 280 \times 10^{-9}$'
        doodle_do:
          - {id: cubes, op: stage, stage: 'custom:1997_q03_a3'}
      - section: 'Standard form'
        say: '280 is not between 1 and 10, so this is not yet standard form. The point moves 2 places to the left to give 2.8, and moving left gives a positive index.'
        write: '$280 = 2.8 \times 10^{2}$'
      - say: 'Replace the 280 in the sum.'
        write: '$\therefore$ Sum $= 2.8 \times 10^{2} \times 10^{-9}$'
      - say: 'The law of indices for multiplying says add the indices. 2 plus negative 9 is negative 7.'
        write: '$= 2.8 \times 10^{2 + (-9)}$ $\quad [a^{m} \times a^{n} = a^{m + n}]$'
      - say: 'So the sum is 2.8 times 10 to the power negative 7.'
        write: '$= 2.8 \times 10^{-7}$'
      - section: 'Check'
        say: 'Check with decimals. 0.006 cubed is 0.000000216, and 0.004 cubed is 0.000000064. Their sum is 0.00000028, which is 2.8 with the point moved 7 places.'
        write: 'Check: $0.000000216 + 0.000000064 = 0.00000028\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the sum is 2.8 times 10 to the power negative 7, which is option C.'
        write: '$\therefore (0.006)^{3} + (0.004)^{3} = 2.8 \times 10^{-7}$'
        answer: true
    traps:
      A: 'You went for 2.8 times 10 to the power negative 9. That keeps the index from 280 times 10 to the power negative 9. But 280 is 2.8 times 10 squared, so the index rises by 2, to negative 7.'
      B: 'You went for 2.8 times 10 to the power negative 8. That moves the point only one place. 280 to 2.8 is two places, so the index rises from negative 9 to negative 7.'
      D: 'You went for 2.8 times 10 to the power negative 6. That raises the index by three. 280 is 2.8 times 10 squared, and 2 plus negative 9 is negative 7.'
  4:
    moments:
      - section: 'The question'
        say: 'We know only the logs of 2 and 3, to base $a$. So 13.5 must be written using only 3s and a 2. Then the laws of logarithms do the rest.'
        write: 'Find $\log_{a}13.5$, given $\log_{a}2$ and $\log_{a}3$'
      - say: 'Solution. First write down what we are given.'
        write: 'Solution'
      - say: 'We are given that log base $a$ of 2 is 0.693, and log base $a$ of 3 is 1.097.'
        write: 'Given: $\log_{a}2 = 0.693,\quad \log_{a}3 = 1.097$'
      - section: 'Write 13.5 with 3s and a 2'
        say: '13.5 has a half in it, so double it, and 13.5 times 2 is 27. So 13.5 is 27 over 2.'
        write: '$13.5 = \dfrac{27}{2}$'
      - say: '27 is 3 times 3 times 3, which is 3 cubed. Picture a cube of blocks, 3 along each edge, cut in half.'
        doodle: {name: 'custom:1997_q04_a', id: cube, caption: '27 = 3 × 3 × 3'}
        doodle_do:
          - {id: cube, op: stage, stage: 'custom:1997_q04_a2'}
        write: '$13.5 = \dfrac{3^{3}}{2}$'
      - section: 'Laws of logarithms'
        say: 'Recall the quotient law, which says the log of a division is the log of the top minus the log of the bottom.'
        write: 'Recall: $\log_{a}\dfrac{M}{N} = \log_{a}M - \log_{a}N$'
      - say: 'By the quotient law, log base $a$ of 3 cubed over 2 is log of 3 cubed, minus log of 2.'
        write: '$\log_{a}13.5 = \log_{a}3^{3} - \log_{a}2$'
      - say: 'Recall the power law, which says the log of $M$ to the power $n$ is $n$ log $M$.'
        write: 'Recall: $\log_{a}M^{n} = n\log_{a}M$'
      - say: 'By the power law, the index 3 comes down in front, giving 3 log base $a$ of 3. That 3 is the three edges of the cube.'
        doodle_do:
          - {id: cube, op: circle, part: edges, text: '3 log 3'}
        write: '$= 3\log_{a}3 - \log_{a}2$'
      - section: 'Substitute'
        say: 'Now substitute the given values. Log of 3 is 1.097, and log of 2 is 0.693.'
        write: '$= 3(1.097) - 0.693$'
      - say: '3 times 1.097 is 3.291.'
        write: '$= 3.291 - 0.693$'
      - say: '3.291 minus 0.693 is 2.598.'
        write: '$= 2.598$'
      - section: 'Check'
        say: 'Check with the product law. 13.5 times 2 is 27, so log 13.5 plus log 2 should be 3 log 3. 2.598 plus 0.693 is 3.291, and 3 times 1.097 is 3.291.'
        write: 'Check: $2.598 + 0.693 = 3.291 = 3(1.097)\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore log base $a$ of 13.5 is 2.598, which is option C.'
        write: '$\therefore \log_{a}13.5 = 2.598$'
        answer: true
    traps:
      A: 'You went for 1.404. That does not come from 3 log 3 minus log 2. 13.5 is 3 cubed over 2, so multiply 1.097 by 3 to get 3.291, then subtract 0.693.'
      B: 'You went for 1.790. That is 1.097 plus 0.693, which is the log of 6, not 13.5. We need 3 log 3 minus log 2.'
      D: 'You went for 2.790. Check the last step. 3.291 minus 0.693 is 2.598. Do the subtraction carefully, borrowing where needed.'
  5:
    moments:
      - section: 'The question'
        say: 'There are two logs to base 2, and every option has log base 2 of 3 in it. Express the expression as a single logarithm, then split it so that log 3 stands alone.'
        write: 'Simplify $\log_{2}96 - 2\log_{2}6$'
      - say: 'Solution. First the laws of logarithms, then index form.'
        write: 'Solution'
      - section: 'Laws of logarithms'
        say: 'Recall the power law, which says $n$ times log $M$ is the log of $M$ to the power $n$. A number in front must go inside before two logs can combine.'
        write: 'Recall: $n\log_{a}M = \log_{a}M^{n}$'
      - say: 'By the power law, 2 log base 2 of 6 is log base 2 of 6 squared.'
        write: '$2\log_{2}6 = \log_{2}6^{2}$'
      - say: '6 squared is 36.'
        write: '$= \log_{2}36$'
      - say: 'Put that back into the expression.'
        write: '$\log_{2}96 - 2\log_{2}6 = \log_{2}96 - \log_{2}36$'
      - say: 'Recall the quotient law, that subtracting two logs to the same base gives the log of the division.'
        write: 'Recall: $\log_{a}M - \log_{a}N = \log_{a}\dfrac{M}{N}$'
      - say: 'By the quotient law, log 96 minus log 36 is the log of 96 over 36.'
        write: '$= \log_{2}\dfrac{96}{36}$'
      - say: 'Simplify 96 over 36. Both divide by 12, so 96 divided by 12 is 8, and 36 divided by 12 is 3.'
        write: '$= \log_{2}\dfrac{8}{3}$'
      - section: 'Match the options'
        say: 'The options have log base 2 of 3 on its own, so use the quotient law the other way, which gives log of 8, minus log of 3.'
        write: '$= \log_{2}8 - \log_{2}3$'
      - say: 'Let log base 2 of 8 be $x$. In index form, 2 to the power $x$ equals 8. Picture 2s multiplied to make 8.'
        doodle: {name: 'custom:1997_q05_a', id: twos, caption: 'how many 2s make 8?'}
        write: 'Let $\log_{2}8 = x \Rightarrow 2^{x} = 8$'
      - say: '2 times 2 times 2 is 8, so 8 is 2 cubed. Equate the indices, and $x$ is 3.'
        doodle_do:
          - {id: twos, op: stage, stage: 'custom:1997_q05_a2'}
        write: '$2^{x} = 2^{3} \quad \therefore x = 3$'
      - say: 'Put 3 in place of log base 2 of 8.'
        write: '$\log_{2}96 - 2\log_{2}6 = 3 - \log_{2}3$'
      - section: 'Check'
        say: 'Check by going back. 3 is log base 2 of 8, so 3 minus log 3 is log of 8 over 3. And 8 over 3 times 36 is 96. It agrees.'
        write: 'Check: $\tfrac{8}{3} \times 36 = 96\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the expression simplifies to 3 minus log base 2 of 3, which is option B.'
        write: '$\therefore \log_{2}96 - 2\log_{2}6 = 3 - \log_{2}3$'
        answer: true
    traps:
      A: 'You went for 2 minus log base 2 of 3. That comes from reducing 96 over 36 to 4 over 3. Both divide by 12, giving 8 over 3, and log base 2 of 8 is 3.'
      C: 'You went for log base 2 of 3 minus 3. That is the right pieces in the wrong order, as if you had worked out 36 over 96. The first log is log base 2 of 96, so 8 goes on top.'
      D: 'You went for log base 2 of 3 minus 2. The signs are reversed and the 8 has become a 4. 96 over 36 is 8 over 3, giving 3 minus log base 2 of 3.'
  6:
    moments:
      - section: 'The question'
        say: 'There are three different bases, 8, 2 and 4. We cannot equate the indices until they agree. All three are towers of 2s, so base 2 will do it.'
        write: 'If $8^{\frac{x}{2}} = \left[2^{\frac{3}{8}}\right]\left[4^{\frac{3}{4}}\right]$, find $x$'
      - say: 'Solution. First, express every base as a power of 2.'
        write: 'Solution'
      - section: 'The same base'
        say: 'Look at the towers. 8 is three 2s multiplied, so 8 is 2 cubed. 4 is two 2s, so 4 is 2 squared.'
        write: '$8 = 2^{3},\quad 4 = 2^{2}$'
        doodle: {name: 'custom:1997_q06_a', id: towers, caption: '2, 4 and 8 as towers of 2s'}
        doodle_do:
          - {id: towers, op: circle, part: eight, text: '8 = 2³'}
          - {id: towers, op: circle, part: four, text: '4 = 2²'}
      - say: 'Substitute them into the equation.'
        write: '$(2^{3})^{\frac{x}{2}} = 2^{\frac{3}{8}} \times (2^{2})^{\frac{3}{4}}$'
      - say: 'The law of indices for a power of a power says multiply the indices.'
        write: 'Law of indices: $(a^{m})^{n} = a^{mn}$'
      - say: '3 times $x$ over 2 is $3x$ over 2. And 2 times 3 over 4 is 6 over 4, which is 3 over 2.'
        write: '$2^{\frac{3x}{2}} = 2^{\frac{3}{8}} \times 2^{\frac{3}{2}}$'
      - say: 'The law of indices for multiplying says that when we multiply powers of the same base, we add the indices.'
        write: 'Law of indices: $a^{m} \times a^{n} = a^{m + n}$'
      - say: 'So the index on the right is 3 over 8 plus 3 over 2.'
        write: '$2^{\frac{3x}{2}} = 2^{\frac{3}{8} + \frac{3}{2}}$'
      - say: 'The L.C.M. of 8 and 2 is 8. 3 over 2 is 12 over 8, and 3 plus 12 is 15.'
        write: '$\dfrac{3}{8} + \dfrac{3}{2} = \dfrac{3 + 12}{8} = \dfrac{15}{8}$'
      - say: 'So both sides are now single powers of 2.'
        write: '$2^{\frac{3x}{2}} = 2^{\frac{15}{8}}$'
      - section: 'Equate the indices'
        say: 'Since the bases are the same, equate the indices.'
        write: 'Equating the indices: $\dfrac{3x}{2} = \dfrac{15}{8}$'
      - say: 'Cross multiply, so $3x$ times 8 is $24x$, and 15 times 2 is 30.'
        write: '$24x = 30$'
      - say: 'Divide both sides by 24, then reduce. 30 over 24, dividing top and bottom by 6, is 5 over 4.'
        write: '$\therefore x = \dfrac{30}{24} = \dfrac{5}{4}$'
      - section: 'Check'
        say: 'Check the left side with $x$ equal to 5 over 4. $x$ over 2 is 5 over 8, and 8 to the power 5 over 8 is 2 to the power 3 times 5 over 8, which is 15 over 8. That matches the right side.'
        write: 'Check: $8^{\frac{5}{8}} = (2^{3})^{\frac{5}{8}} = 2^{\frac{15}{8}}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore $x$ is 5 over 4, which is option D.'
        write: '$\therefore x = \dfrac{5}{4}$'
        answer: true
    traps:
      A: 'You went for 3 over 8. That is just the first index on the right. Write every base as a power of 2, add the indices on the right to get 15 over 8, then solve $3x$ over 2 equals 15 over 8.'
      B: 'You went for 3 over 4. That is the index on the 4, not $x$. Change everything to base 2, add the indices on the right, then equate the indices.'
      C: 'You went for 4 over 5. That is the answer upside down. From $24x$ equals 30, $x$ is 30 over 24, which is 5 over 4.'
  7:
    moments:
      - section: 'The question'
        say: 'The numerator and the denominator use the same two surds, 2 root 3 and 3 root 5. So multiplying by the conjugate turns the numerator into a perfect square.'
        write: 'Simplify $\dfrac{2\sqrt{3} + 3\sqrt{5}}{3\sqrt{5} - 2\sqrt{3}}$'
      - say: 'Solution. Multiply the numerator and the denominator by the conjugate of the denominator.'
        write: 'Solution'
      - section: 'The conjugate'
        say: 'The denominator is 3 root 5 minus 2 root 3, so its conjugate is 3 root 5 plus 2 root 3, which is the same terms with the sign changed.'
        write: 'Conjugate of $3\sqrt{5} - 2\sqrt{3}$ is $3\sqrt{5} + 2\sqrt{3}$'
      - say: 'Multiply the numerator and the denominator by it. Something over itself is 1, so the value does not change.'
        write: '$= \dfrac{(2\sqrt{3} + 3\sqrt{5})(3\sqrt{5} + 2\sqrt{3})}{(3\sqrt{5} - 2\sqrt{3})(3\sqrt{5} + 2\sqrt{3})}$'
      - section: 'The denominator'
        say: 'The denominator is a difference of two squares, because $a$ minus $b$, times $a$ plus $b$, is $a$ squared minus $b$ squared.'
        write: '$(a - b)(a + b) = a^{2} - b^{2}$'
      - say: 'Here $a$ is 3 root 5 and $b$ is 2 root 3. Picture a square of side 3 root 5, which is 3 tiles by 3 tiles, each tile of side root 5 and area 5.'
        doodle: {name: 'custom:1997_q07_a', id: tiles, caption: 'a square of side 3√5', size: scene}
        write: 'Denominator $= (3\sqrt{5})^{2} - (2\sqrt{3})^{2}$'
      - say: 'Square the number and the surd. 3 root 5 squared is 9 tiles of 5, 9 times 5. 2 root 3 squared is 4 tiles of 3, 4 times 3.'
        doodle_do:
          - {id: tiles, op: stage, stage: 'custom:1997_q07_a2'}
        write: '$= 9 \times 5 - 4 \times 3$'
      - say: '9 times 5 is 45, and 4 times 3 is 12. The big square take away the small one gives 45 minus 12, which is 33.'
        doodle_do:
          - {id: tiles, op: stage, stage: 'custom:1997_q07_a3'}
        write: '$= 45 - 12 = 33$'
        point:
          - {line: 7, kind: highlight, at: '45 − 12 = 33', to: {doodle: tiles, part: result}}
      - section: 'The numerator'
        say: '2 root 3 plus 3 root 5, and 3 root 5 plus 2 root 3, are the same two terms in a different order. So the numerator is that bracket squared.'
        write: 'Numerator $= (2\sqrt{3} + 3\sqrt{5})^{2}$'
      - say: 'When squaring a sum, $a$ plus $b$, all squared, is $a$ squared plus $2ab$ plus $b$ squared.'
        write: '$(a + b)^{2} = a^{2} + 2ab + b^{2}$'
      - say: 'Here $a$ is 2 root 3 and $b$ is 3 root 5. We take the first squared, plus twice the product, plus the second squared.'
        write: '$= (2\sqrt{3})^{2} + 2(2\sqrt{3})(3\sqrt{5}) + (3\sqrt{5})^{2}$'
      - say: '2 root 3 squared is 4 times 3, which is 12. In the middle, 2 times 2 times 3 is 12, and root 3 times root 5 is root 15. 3 root 5 squared is the big square again, 45.'
        doodle_do:
          - {id: tiles, op: pulse, part: big}
        write: '$= 12 + 12\sqrt{15} + 45$'
      - say: '12 plus 45 is 57.'
        write: '$= 57 + 12\sqrt{15}$'
      - section: 'Divide'
        say: 'Put the numerator over the denominator, 33.'
        write: '$\therefore$ Fraction $= \dfrac{57 + 12\sqrt{15}}{33}$'
      - say: 'Every number divides by 3. 57 divided by 3 is 19, 12 divided by 3 is 4, and 33 divided by 3 is 11.'
        write: '$= \dfrac{19 + 4\sqrt{15}}{11}$'
      - section: 'Check'
        say: 'Check with decimals. The question is about 10.172 over 3.244, which is 3.136. And 19 plus 4 root 15 is about 34.49, and 34.49 over 11 is 3.136.'
        write: 'Check: $\dfrac{10.172}{3.244} \approx 3.136 \approx \dfrac{34.49}{11}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the fraction simplifies to 19 plus 4 root 15, all over 11, which is option A.'
        write: '$\therefore$ the answer is $\dfrac{19 + 4\sqrt{15}}{11}$'
        answer: true
    traps:
      B: 'You went for the right numerator over 19. The denominator comes from 45 minus 12, which is 33, and dividing by 3 gives 11, not 19. Square the 3 and the 2 as well as the surds.'
      C: 'You went for 2 root 15 in the numerator. That happens if you count only one of the two cross terms. The middle term is twice the product, 12 root 15, and dividing by 3 gives 4 root 15.'
      D: 'You went for 2 root 15 over 19. Both the surd term and the denominator have slipped. The middle term is 12 root 15, and the denominator is 45 minus 12, which is 33. Dividing everything by 3 gives 19 plus 4 root 15, over 11.'
  8:
    moments:
      - section: 'The question'
        say: '₦1,000 grows to ₦1,240 in 3 years at simple interest. What is the rate per cent per annum? The trap is to treat ₦1,240 as the interest. Picture a jar holding the ₦1,000.'
        write: 'Find $R$: ₦1,000 amounts to ₦1,240 in 3 years'
        doodle: {name: 'custom:1997_q08_a', id: jar, caption: '₦1,000 grows to ₦1,240 in 3 years'}
      - section: 'Solution'
        say: 'Solution. List the givens. P, the principal, is 1,000. A, the amount at the end, is 1,240. T, the time, is 3 years. R is what we want.'
        write: '$P = 1000,\ A = 1240,\ T = 3$ years, $R = ?$'
      - say: 'The amount is the principal plus the interest, so the interest is the amount minus the principal.'
        write: '$I = A - P$'
      - say: '1,240 minus 1,000 is 240. That is the space at the top of the jar.'
        write: '$I = 1240 - 1000 = 240$'
        point:
          - {line: 3, kind: highlight, at: '= 240', to: {doodle: jar, part: top}}
        doodle_do:
          - {id: jar, op: label, part: top, text: 'interest ₦240'}
      - section: 'The formula'
        say: 'The simple interest formula is I equals P R T over 100.'
        write: '$I = \dfrac{PRT}{100}$'
      - say: 'Substitute, so I is 240, P is 1,000, T is 3, and R stays as R.'
        write: '$240 = \dfrac{1000 \times R \times 3}{100}$'
        point:
          - {line: 4, kind: box, text: 'the formula'}
          - {line: 5, kind: move, from: {line: 3, at: '= [[240]]'}, at: '[[240]] =', text: 'I'}
      - say: 'Cancel first, so 100 into 1,000 is 10. Then 10 times 3 is 30, so the right side is 30 R.'
        write: '$240 = 30R$'
      - say: 'Divide both sides by 30 to leave R by itself.'
        write: '$R = \dfrac{240}{30}$'
      - say: '240 divided by 30 is 8.'
        write: '$R = 8$'
      - section: 'Check'
        say: 'Check with the formula. 1,000 times 8 times 3, over 100, is 240. Watch one ₦80 coin arrive for each year.'
        write: 'Check: $I = \dfrac{1000 \times 8 \times 3}{100} = 240$'
        doodle_do:
          - {id: jar, op: stage, stage: 'custom:1997_q08_a2'}
      - say: 'And 1,000 plus 240 is 1,240, the amount we were given. The jar is full.'
        write: '$A = 1000 + 240 = 1240$ ✓'
        doodle_do:
          - {id: jar, op: fill, to: 1, fill: interest}
      - say: 'Therefore the rate is 8 percent per annum, which is option B.'
        write: '$\therefore R = 8\%$ per annum (B)'
        answer: true
    traps:
      A: 'You went for 6%. At 6% the interest is 1,000 times 6 times 3 over 100, only ₦180. The interest here is ₦240, so 30R equals 240 gives 8%.'
      C: 'You went for 10%. At 10% the interest is ₦300 over 3 years. We need ₦240, which is 8%.'
      D: 'You went for 12%. At 12% the interest is ₦360 over 3 years. The interest is 1,240 minus 1,000, which is ₦240, giving 8%.'
  9:
    moments:
      - section: 'The question'
        say: 'We have three sets of letters inside a universal set U. We want X intersection, bracket, Y union Z. The bracket comes first.'
        write: 'Find $X \cap (Y \cup Z)$'
      - section: 'Solution'
        say: 'Solution. Write out the sets. X is S, P, E, N, D. Y is P, N, O, U, R. Z is L, O, U, D.'
        write: '$X = \{S, P, E, N, D\},\ Y = \{P, N, O, U, R\},\ Z = \{L, O, U, D\}$'
      - say: 'Let me place every letter in a Venn diagram of X, Y and Z. P and N are in X and Y. D is in X and Z. O and U are in Y and Z.'
        diagram: {id: v, kind: venn, universal: {name: U}, sets: [{key: X, name: X}, {key: Y, name: 'Y'}, {key: Z, name: Z}], size: scene}
        diagram_do:
          - {id: v, op: fill, part: 'X∩Y only', text: 'P, N', 'on': 'X and Y'}
          - {id: v, op: fill, part: 'X∩Z only', text: 'D', 'on': 'X and Z'}
          - {id: v, op: fill, part: 'Y∩Z only', text: 'O, U', 'on': 'Y and Z'}
      - say: 'The rest belong to one set only, so S and E are in X, R in Y, and L in Z. No letter is in all three.'
        diagram_do:
          - {id: v, op: fill, part: 'X only', text: 'S, E', 'on': 'S and E'}
          - {id: v, op: fill, part: 'Y only', text: 'R', 'on': 'R in Y'}
          - {id: v, op: fill, part: 'Z only', text: 'L', 'on': 'L in Z'}
      - section: 'Step 1: the bracket'
        say: 'Y union Z collects every letter in Y or in Z. Take all of Y, then add the letters of Z not yet listed. O and U are there already, so add L and D.'
        write: '$Y \cup Z = \{P, N, O, U, R\} \cup \{L, O, U, D\}$'
      - say: 'So Y union Z is P, N, O, U, R, L, D.'
        write: '$= \{P, N, O, U, R, L, D\}$'
        diagram_do:
          - {id: v, op: shade, part: 'Y∪Z', colour: blue, text: 'Y ∪ Z', 'on': 'Y union Z'}
      - section: 'Step 2: intersect with X'
        say: 'Now X intersection that set, so keep only the letters of X that are also in Y union Z.'
        write: '$X \cap (Y \cup Z) = \{S, P, E, N, D\} \cap \{P, N, O, U, R, L, D\}$'
      - say: 'Go through X. S, no. P, yes. E, no. N, yes. D, yes. So we keep P, N and D.'
        write: '$= \{P, N, D\}$'
        diagram_do:
          - {id: v, op: shade, part: 'X∩(Y∪Z)', colour: green, text: 'X ∩ (Y ∪ Z)', 'on': 'we keep'}
      - section: 'Check'
        say: 'To check, anything intersected with X must lie inside X. P, N and D are all in X. Options with O, U or R cannot be right, since those letters are not in X.'
        write: 'Check: $\{P, N, D\} \subseteq X\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore X intersection, Y union Z, is the set P, N, D, which is answer choice C.'
        write: '$\therefore X \cap (Y \cup Z) = \{P, N, D\}$'
        answer: true
    traps:
      A: 'You went for P, O, U, R. O, U and R are not in X at all, so they cannot be in an intersection with X. Keep only the letters of X that are in Y union Z, which are P, N and D.'
      B: 'You went for S, P, D, R. R is not in X, and S is not in Y union Z. The letters in both are P, N and D.'
      D: 'You went for N, D, U. U is not in X, so it cannot be in the intersection, and P is missing. The answer is P, N, D.'
  10:
    moments:
      - section: 'The question'
        say: 'Of 100 students, 80 speak Hausa, 20 speak Igbo and 9 speak both. There are four kinds of student, Hausa, Igbo, both, and those who speak neither. How many speak neither?'
        write: '100 students: Hausa 80, Igbo 20, both 9. Neither $= ?$'
      - section: 'Solution'
        say: 'Solution. The 100 students are the universal set, epsilon. n of H, Hausa, is 80. n of I, Igbo, is 20. And n of H intersection I, those who speak both, is 9.'
        write: '$n(\varepsilon) = 100,\ n(H) = 80,\ n(I) = 20,\ n(H \cap I) = 9$'
      - say: 'Neither is what we want. Let the number who speak neither be x. That is n of, H union I, complement.'
        write: 'Let $n(H \cup I)^{\prime} = x$'
      - section: 'The Venn diagram'
        say: 'Now the Venn diagram. The box is the 100 students, with a circle for Hausa and a circle for Igbo. Put the 9 who speak both in the overlap first.'
        diagram: {id: v, kind: venn, universal: {name: 'Students', total: 100}, sets: [{key: H, name: Hausa, total: 80}, {key: I, name: Igbo, total: 20}]}
        diagram_do:
          - {id: v, op: fill, part: 'H∩I', text: '9', colour: blue, 'on': overlap}
          - {id: v, op: fill, part: outside, text: 'x', colour: orange}
      - say: 'Hausa only is 80 minus 9, which is 71. Igbo only is 20 minus 9, which is 11.'
        write: 'Hausa only $= 80 - 9 = 71$, Igbo only $= 20 - 9 = 11$'
        diagram_do:
          - {id: v, op: fill, part: 'H only', text: '71', 'on': 'is 71'}
          - {id: v, op: fill, part: 'I only', text: '11', 'on': 'is 11'}
      - section: 'The equation'
        say: 'Every student is in exactly one region, so the four regions add up to 100.'
        write: '$71 + 9 + 11 + x = 100$'
      - say: '71 plus 9 is 80, and 80 plus 11 is 91.'
        write: '$91 + x = 100$'
      - say: 'So x equals 100 minus 91, which is 9.'
        write: '$x = 100 - 91 = 9$'
        diagram_do:
          - {id: v, op: fill, part: outside, text: '9', 'on': 'which is 9'}
      - section: 'Check by the formula'
        say: 'Check with the formula. n of H union I equals n of H plus n of I minus n of H intersection I, so 80 plus 20 minus 9, which is 91.'
        write: '$n(H \cup I) = 80 + 20 - 9 = 91$'
      - say: 'Why minus 9? A student who speaks both is counted once in the 80 and again in the 20. And 100 minus 91 leaves 9 who speak neither.'
        write: 'Neither $= 100 - 91 = 9\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore 9 students speak neither Hausa nor Igbo, which is answer choice B.'
        write: '$\therefore$ 9 students speak neither'
        diagram_do:
          - {id: v, op: highlight, part: outside, text: 'neither: 9', answer: true}
        answer: true
    traps:
      A: 'You went for 0. 80 plus 20 is 100, so it looks as if everyone speaks a language. But the 9 who speak both are counted twice. The regions 71, 9 and 11 make 91, leaving 9 outside.'
      C: 'You went for 11. That is Igbo only, 20 minus 9. Neither is the region outside both circles, which is 100 minus 91, or 9.'
      D: 'You went for 20. That is n of I, the whole Igbo circle. Neither is the region outside the circles, which holds 9.'
  11:
    moments:
      - section: 'The question'
        say: '"Divisible by $x + 1$" is a clue in disguise. It tells us a remainder, and that remainder hands us $q$. The danger is the sign.'
        write: '$x^{3} + 2x^{2} + qx - 6$ is divisible by $x + 1$. Find $q$.'
      - section: 'Solution'
        say: 'Solution. Let $f$ of $x$ be the expression. Naming it lets us write $f$ of any number we put in.'
        write: 'Let $f(x) = x^{3} + 2x^{2} + qx - 6$'
      - say: 'Divisible by $x + 1$ means $x + 1$ is a factor. Set the factor equal to zero to find the value to put in, and $x$ is minus 1.'
        write: 'Let $x + 1 = 0$, $\ \therefore x = -1$'
        doodle: {name: 'custom:1997_q11_a', id: machine, caption: 'f(−1) must give out 0'}
      - say: 'The factor theorem says that if $x + 1$ is a factor, then $f$ of minus 1 is zero. Picture the machine. Feed in minus 1, and out comes 0.'
        write: '$f(-1) = 0$ (factor theorem)'
        doodle_do:
          - {id: machine, op: move, part: card, path: in}
      - section: 'Substitute'
        say: 'Replace every $x$ with minus 1, keeping each one in brackets so the signs stay safe.'
        write: '$f(-1) = (-1)^{3} + 2(-1)^{2} + q(-1) - 6$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: 'x = −1'}, at: '(−1)3', text: 'every x'}
      - say: 'Minus 1 cubed is minus 1, because an odd power keeps the minus. Minus 1 squared is plus 1, so 2 times 1 is 2. And $q$ times minus 1 is minus $q$.'
        write: '$= -1 + 2 - q - 6$'
      - say: 'Collect the numbers. Minus 1 plus 2 is 1, and 1 minus 6 is minus 5.'
        write: '$= -5 - q$'
      - section: 'Solve for q'
        say: 'By the factor theorem, this must equal zero, which is the 0 the machine gives out.'
        write: '$-5 - q = 0$'
        doodle_do:
          - {id: machine, op: circle, part: out, text: 'must be 0'}
      - say: 'Add $q$ to both sides. Minus 5 equals $q$.'
        write: '$q = -5$'
        doodle_do:
          - {id: machine, op: label, part: machine, text: 'q = −5'}
      - section: 'Check'
        say: 'Check. With $q$ equal to minus 5, $f$ of minus 1 is minus 1 plus 2 plus 5 minus 6, which is zero. Correct.'
        write: 'Check: $f(-1) = -1 + 2 + 5 - 6 = 0 \ \checkmark$'
      - say: 'Therefore $q$ is minus 5, which is answer choice A.'
        write: '$\therefore q = -5$'
        answer: true
    traps:
      B: 'You went for minus 2. Put $x = -1$ in carefully. $-1 + 2 - q - 6$ is $-5 - q$, and setting that to zero gives $q = -5$.'
      C: 'You went for 2. Use $x = -1$, the value that makes $x + 1$ zero, not $x = 1$. That gives $-5 - q = 0$, so $q = -5$.'
      D: 'You went for 5. That is the right size with the wrong sign, which happens if $q$ times minus 1 is written as plus $q$. It is minus $q$, so $-5 - q = 0$ gives $q = -5$.'
  12:
    moments:
      - section: 'The question'
        say: 'We have two equations with $x$ and $y$ at the bottom of fractions. They look hard, but one "Let" turns them into the simultaneous equations you already know how to solve.'
        write: 'Solve $\dfrac{2}{x} - \dfrac{3}{y} = 2$ and $\dfrac{4}{x} + \dfrac{3}{y} = 10$'
      - section: 'Solution'
        say: 'Solution. First, number the equations. The first one is equation 1.'
        write: '$\dfrac{2}{x} - \dfrac{3}{y} = 2 \quad \ldots\ldots (1)$'
      - say: 'And the second one is equation 2. Numbering them lets us say exactly which equation we are using.'
        write: '$\dfrac{4}{x} + \dfrac{3}{y} = 10 \quad \ldots\ldots (2)$'
      - section: 'Change the variables'
        say: '2 over $x$ is 2 times 1 over $x$. So let 1 over $x$ be $a$, and 1 over $y$ be $b$. Picture a blue tile for $a$ and a pink tile for $b$.'
        write: 'Let $\dfrac{1}{x} = a$ and $\dfrac{1}{y} = b$'
        doodle: {name: 'custom:1997_q12_a', id: tiles, caption: 'blue tile a = 1/x, pink tile b = 1/y', size: scene, 'on': 'Picture'}
      - say: 'Now equation 1 reads 2 $a$ minus 3 $b$ equals 2, which is two blue tiles take away three pink tiles. Call it equation 3.'
        write: '$2a - 3b = 2 \quad \ldots\ldots (3)$'
        doodle_do:
          - {id: tiles, op: highlight, part: row1-x, 'on': 'two blue tiles'}
      - say: 'And equation 2 reads 4 $a$ plus 3 $b$ equals 10. Call it equation 4.'
        write: '$4a + 3b = 10 \quad \ldots\ldots (4)$'
        doodle_do:
          - {id: tiles, op: highlight, part: row2-x}
      - section: 'Eliminate b'
        say: 'Look at $b$. We have minus 3 $b$ in equation 3 and plus 3 $b$ in equation 4. The coefficients are equal with opposite signs, so we add the equations, and the pink tiles cancel.'
        write: '(3) + (4): $\ 6a = 12$'
        doodle_do:
          - {id: tiles, op: circle, part: pinks, text: '−3b and +3b cancel', 'on': 'pink tiles cancel'}
          - {id: tiles, op: stage, stage: 'custom:1997_q12_a2', 'on': 'pink tiles cancel'}
        point:
          - {line: 4, kind: strike, at: '−3b', text: 'cancel'}
          - {line: 5, kind: strike, at: '+3b'}
      - say: 'Divide both sides by 6. 12 divided by 6 is 2, so each blue tile, $a$, is worth 2.'
        write: '$a = \dfrac{12}{6} = 2$'
        doodle_do:
          - {id: tiles, op: label, part: row3, text: 'one blue tile a = 2'}
      - say: 'Substitute $a = 2$ into equation 3 to find $b$.'
        write: 'Sub. $a = 2$ in (3): $\ 2(2) - 3b = 2$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '= [[2]]'}, at: '2([[2]])', text: 'sub in'}
      - say: '2 times 2 is 4.'
        write: '$4 - 3b = 2$'
      - say: 'Subtract 4 from both sides. 2 minus 4 is minus 2.'
        write: '$-3b = 2 - 4 = -2$'
      - say: 'Divide both sides by minus 3. Minus 2 over minus 3 is plus 2 over 3.'
        write: '$b = \dfrac{-2}{-3} = \dfrac{2}{3}$'
      - section: 'Back to x and y'
        say: 'Remember, $a$ was 1 over $x$. So 1 over $x$ is 2. Take the reciprocal of both sides, and $x$ is 1 over 2.'
        write: '$\dfrac{1}{x} = a = 2 \;\Rightarrow\; x = \dfrac{1}{2}$'
      - say: 'And $b$ was 1 over $y$. So 1 over $y$ is 2 over 3. Take the reciprocal, so $y$ is 3 over 2.'
        write: '$\dfrac{1}{y} = b = \dfrac{2}{3} \;\Rightarrow\; y = \dfrac{3}{2}$'
      - section: 'Check'
        say: 'Check in equation 2. 4 divided by a half is 8, and 3 divided by 3 over 2 is 2. 8 plus 2 is 10, as it should be.'
        write: 'Check (2): $\ \dfrac{4}{1/2} + \dfrac{3}{3/2} = 8 + 2 = 10$'
      - say: 'Therefore $x$ is 1 over 2 and $y$ is 3 over 2, which is answer choice B.'
        write: '$\therefore x = \dfrac{1}{2},\ y = \dfrac{3}{2}$'
        answer: true
    traps:
      A: 'You went for $x = \tfrac{3}{2}$ and $y = \tfrac{1}{2}$. Those are the right numbers swapped. Adding equations 3 and 4 gives $6a = 12$, so $a = 2$, and $x$ is the reciprocal of $a$, which is 1 over 2.'
      C: 'You went for both negative. Check in equation 1. 2 divided by minus a half is minus 4, and 3 divided by minus 3 over 2 is minus 2. Minus 4 minus minus 2 is minus 2, not 2.'
      D: 'You went for $y = -\tfrac{3}{2}$. From $4 - 3b = 2$, $-3b = -2$, so $b$ is plus 2 over 3, and $y$, its reciprocal, is plus 3 over 2.'
  13:
    moments:
      - section: 'The question'
        say: 'Find the minimum value. The question wants the value of the expression at the lowest point, not the $x$ there.'
        write: '$y = x^{2} - 3x + 2$'
        diagram:
          id: g
          kind: graph
          x: [-1, 4]
          y: [-1, 5]
          plots:
            - {fn: 'x^2 - 3x + 2', label: 'y = x² − 3x + 2', colour: blue}
      - section: 'Solution'
        say: 'Solution. Differentiate term by term. $x$ squared gives $2x$, minus $3x$ gives minus 3, and the constant 2 gives 0.'
        write: '$\dfrac{dy}{dx} = 2x - 3$'
      - section: 'Turning point'
        say: 'At the turning point, the gradient is zero. So we write that at turning point, $\dfrac{dy}{dx}$ equals 0.'
        'on': 'turning point'
        write: 'At turning point, $\dfrac{dy}{dx} = 0$'
      - say: 'So $2x$ minus 3 equals 0.'
        write: '$2x - 3 = 0$'
        point:
          - {line: 3, kind: move, from: {line: 1, at: '= [[2x − 3]]'}, at: '2x − 3', text: 'dy/dx'}
      - say: 'Add 3 to both sides, then divide by 2. $x$ equals 3 over 2.'
        write: '$2x = 3 \Rightarrow x = \dfrac{3}{2}$'
      - section: 'Second derivative'
        say: 'Is it a minimum? Differentiate again. $2x$ gives 2, and minus 3 gives 0.'
        write: '$\dfrac{d^{2}y}{dx^{2}} = 2$'
      - say: 'The second derivative is positive, greater than zero. A positive second derivative means a minimum, so the curve is a valley, as on the graph.'
        'on': 'positive second'
        write: '$\dfrac{d^{2}y}{dx^{2}} = 2 > 0$, $\ \therefore$ minimum'
        diagram_do:
          - {id: g, op: vertex, part: 'plot:1', text: 'minimum', on: valley}
      - section: 'Minimum value'
        say: 'Now the value. Substitute $x$ equals 3 over 2 into the original expression, with 3 over 2 in brackets.'
        write: '$y_{\min} = \left(\tfrac{3}{2}\right)^{2} - 3\left(\tfrac{3}{2}\right) + 2$'
      - say: '3 over 2, squared, is 9 over 4. And 3 times 3 over 2 is 9 over 2.'
        write: '$= \dfrac{9}{4} - \dfrac{9}{2} + 2$'
      - say: 'The L.C.M. of 4 and 2 is 4. 9 over 2 is 18 over 4, and 2 is 8 over 4.'
        write: '$= \dfrac{9 - 18 + 8}{4}$'
      - say: '9 minus 18 is minus 9, and minus 9 plus 8 is minus 1.'
        write: '$= -\dfrac{1}{4}$'
        diagram_do:
          - {id: g, op: label, part: 'point:1', text: 'y min = −¼', colour: green}
      - section: 'Check'
        say: 'To check, the expression factorises as $x$ minus 1, times $x$ minus 2. So the curve crosses the axis at 1 and 2, and dips below it in between. A negative minimum makes sense.'
        write: 'Check: $x^{2} - 3x + 2 = (x - 1)(x - 2)$'
        diagram_do:
          - {id: g, op: intercepts, part: 'plot:1', axis: x}
      - say: 'Therefore the minimum value is minus 1 over 4, which is answer choice A.'
        write: '$\therefore$ minimum value $= -\dfrac{1}{4}$'
        answer: true
    traps:
      B: 'You went for minus a half. Put everything over the L.C.M. 4 carefully. 9 minus 18 plus 8 is minus 1, so it is minus 1 over 4.'
      C: 'You went for a quarter. The curve dips below the axis between 1 and 2, so its minimum must be negative. Check the signs. 9 minus 18 plus 8 is minus 1.'
      D: 'You went for a half. At turning point, $\dfrac{dy}{dx} = 0$ gives $x = \tfrac{3}{2}$. Substituting gives $\tfrac{9}{4} - \tfrac{9}{2} + 2$, which is minus 1 over 4.'
  14:
    moments:
      - section: 'The question'
        say: '$f$ is buried deep, inside a fraction, inside a fraction, under a square root. Picture it locked in boxes. We open them from the outside in, one operation per line.'
        write: 'Make $f$ the subject: $\ t = \sqrt{\dfrac{v}{\dfrac{1}{f} + \dfrac{1}{g}}}$'
        doodle: {name: 'custom:1997_q14_a', id: boxes, caption: 'f locked inside four boxes', size: scene}
      - section: 'Solution'
        say: 'Solution. The outside box is the square root. The opposite of a square root is squaring, so square both sides.'
        write: 'Square both sides: $\ t^{2} = \dfrac{v}{\dfrac{1}{f} + \dfrac{1}{g}}$'
        doodle_do:
          - {id: boxes, op: cross, part: root}
      - say: 'The bracket, 1 over $f$ plus 1 over $g$, is the denominator. Cross multiply, so it moves up beside $t$ squared.'
        write: 'Cross multiply: $\ t^{2}\left(\dfrac{1}{f} + \dfrac{1}{g}\right) = v$'
      - say: 'Divide both sides by $t$ squared, so the bracket with $f$ stands alone on the left.'
        write: 'Divide by $t^{2}$: $\ \dfrac{1}{f} + \dfrac{1}{g} = \dfrac{v}{t^{2}}$'
        doodle_do:
          - {id: boxes, op: cross, part: frac}
      - say: 'Subtract 1 over $g$ from both sides, so the term with $f$ is alone.'
        write: 'Subtract $\dfrac{1}{g}$: $\ \dfrac{1}{f} = \dfrac{v}{t^{2}} - \dfrac{1}{g}$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '+ g1'}, at: '− g1', text: 'across the ='}
        doodle_do:
          - {id: boxes, op: cross, part: plus}
      - section: 'Combine the right side'
        say: 'To subtract the two fractions on the right, find the LCM of the bottoms, $t$ squared and $g$. It is $g$ times $t$ squared.'
        write: 'LCM $= gt^{2}$'
      - say: 'Put it over the LCM. $gt^{2}$ divided by $t^{2}$ is $g$, times the top $v$. $gt^{2}$ divided by $g$ is $t^{2}$, times the top 1.'
        write: '$\dfrac{1}{f} = \dfrac{g \times v - t^{2} \times 1}{gt^{2}}$'
      - say: '$g$ times $v$ is $gv$, and $t$ squared times 1 is $t$ squared.'
        write: '$\dfrac{1}{f} = \dfrac{gv - t^{2}}{gt^{2}}$'
      - section: 'Take the reciprocal'
        say: 'This is 1 over $f$, not $f$. When two fractions are equal, their reciprocals are equal too, so take the reciprocal of both sides.'
        write: '$f = \dfrac{gt^{2}}{gv - t^{2}}$'
        doodle_do:
          - {id: boxes, op: cross, part: flip}
          - {id: boxes, op: circle, part: core, text: 'f is free'}
      - section: 'Check'
        say: 'Check with easy numbers. Take $g = 1$, $v = 2$ and $t = 1$. Our formula gives $f$ equals 1 over, 2 minus 1, which is 1.'
        write: 'Check: $g = 1,\ v = 2,\ t = 1$: $\ f = \dfrac{1}{2 - 1} = 1$'
      - say: 'Put $f = 1$ in the question. 1 over 1 plus 1 over 1 is 2. 2 over 2 is 1, and the square root of 1 is 1. That is $t$.'
        write: '$t = \sqrt{\dfrac{2}{1 + 1}} = 1 \ \checkmark$'
      - say: 'Therefore $f$ is $gt$ squared over, $gv$ minus $t$ squared, which is answer choice B.'
        write: '$\therefore f = \dfrac{gt^{2}}{gv - t^{2}}$'
        answer: true
    traps:
      A: 'You went for the fraction the other way up. That is 1 over $f$. The last step is to take the reciprocal to get $f$ itself.'
      C: 'You went for $v$ over $t$ to the power a half, minus 1 over $g$. Squaring both sides gives $t^{2}$, not $t$ to the power a half, and that expression would still only be 1 over $f$, not $f$.'
      D: 'You went for $\tfrac{gv}{t^{2}} - g$. That does not follow from $\tfrac{1}{f} = \tfrac{gv - t^{2}}{gt^{2}}$. Combine the right side into one fraction over the LCM, then take the reciprocal of the whole fraction, which gives $\tfrac{gt^{2}}{gv - t^{2}}$.'
  15:
    moments:
      - section: 'The question'
        say: 'A perfect square is a bracket multiplied by itself. Picture it as tiles, with a big square, two strips and a corner. $g$ is the missing corner. How big is it?'
        write: '$4x^{2} - 18xy + g$ is a perfect square. Find $g$.'
        doodle: {name: 'custom:1997_q15_a', id: tiles, caption: 'the square with a missing corner'}
      - section: 'Solution'
        say: 'Solution. To complete a square, the coefficient of $x^{2}$, the number in front of it, must be 1. So take out 4. 18 over 4 is 9 over 2.'
        write: '$4x^{2} - 18xy + g = 4\left(x^{2} - \dfrac{9}{2}xy + \dfrac{g}{4}\right)$'
      - say: '4 is 2 squared, a perfect square. So the whole expression is a perfect square only when the bracket is one.'
        write: 'So $x^{2} - \dfrac{9}{2}xy + \dfrac{g}{4}$ must be a perfect square'
      - section: 'Half the coefficient of x'
        say: 'The rule for completing the square is that the last term is half the coefficient of $x$, squared.'
        write: 'Last term $= \left(\dfrac{1}{2} \times \text{coefficient of } x\right)^{2}$'
      - say: 'Here the coefficient of $x$ is everything multiplying $x$, which is minus 9 over 2, times $y$.'
        write: 'Coefficient of $x = -\dfrac{9}{2}y$'
      - say: 'Half of minus 9 over 2 $y$ is minus 9 over 4 $y$, because 2 times 2 is 4.'
        write: '$\dfrac{1}{2} \times \left(-\dfrac{9}{2}y\right) = -\dfrac{9}{4}y$'
      - say: 'So $g$ over 4 is minus 9 over 4 $y$, squared. Minus times minus is plus, 9 squared is 81, and 4 squared is 16.'
        write: '$\dfrac{g}{4} = \left(-\dfrac{9}{4}y\right)^{2} = \dfrac{81y^{2}}{16}$'
      - say: 'Multiply both sides by 4. 4 over 16 is 1 over 4, so $g$ is $81y^{2}$ over 4. That is the corner tile.'
        write: '$g = 4 \times \dfrac{81y^{2}}{16} = \dfrac{81y^{2}}{4}$'
        doodle_do:
          - {id: tiles, op: highlight, part: corner, text: 'g = 81y²/4'}
      - section: 'Check'
        say: 'Check by expanding $2x$ minus 9 over 2 $y$, all squared. $2x$ squared is $4x^{2}$, and 9 over 2 $y$, squared, is $81y^{2}$ over 4.'
        write: 'Check: $\left(2x - \dfrac{9}{2}y\right)^{2} = 4x^{2} - 18xy + \dfrac{81y^{2}}{4}$'
        doodle_do:
          - {id: tiles, op: label, part: side-k, text: 'side 9y/2'}
      - say: 'The middle term is minus 2 times $2x$ times 9 over 2 $y$, which is minus $18xy$, the two strips. It matches.'
        write: 'Middle term: $-2(2x)\left(\dfrac{9}{2}y\right) = -18xy \ \checkmark$'
        doodle_do:
          - {id: tiles, op: circle, part: strips, text: '2 strips = 18xy'}
      - say: 'Therefore $g$ is $81y^{2}$ over 4, which is answer choice D.'
        write: '$\therefore g = \dfrac{81y^{2}}{4}$'
        answer: true
    traps:
      A: 'You went for 9. The last term has to carry $y^{2}$ to match the $xy$ in the middle. Half the coefficient of $x$ in the bracket is minus 9 over 4 $y$, so $g$ is 4 times $\tfrac{81y^{2}}{16}$, which is $\tfrac{81y^{2}}{4}$.'
      B: 'You went for $\tfrac{9y^{2}}{4}$. That is 3 over 2 $y$, squared. The corner is 9 over 2 $y$, squared, because the middle term $-18xy$ is minus 2 times $2x$ times $\tfrac{9}{2}y$. So $g$ is $\tfrac{81y^{2}}{4}$.'
      C: 'You went for $81y^{2}$. That comes from halving 18 to get 9, as if the first term were $x^{2}$. The first term is $4x^{2}$, so take out 4 first, and then $g$ is $\tfrac{81y^{2}}{4}$.'
  16:
    moments:
      - section: 'The question'
        say: 'We need only one of the two hidden constants. The right substitution makes the other vanish completely.'
        write: 'Find $K$ if $\dfrac{5 + 2r}{(r + 1)(r - 2)} \equiv \dfrac{K}{r - 2} + \dfrac{L}{r + 1}$'
      - section: 'Solution'
        say: 'Solution. Multiply through by $r + 1$ times $r - 2$, the LCM of the denominators. $K$ loses its $r - 2$, and $L$ loses its $r + 1$.'
        write: '$5 + 2r \equiv K(r + 1) + L(r - 2)$'
      - section: 'Find K'
        say: 'This identity is true for every $r$. Put $r = 2$, because it makes the bracket $r - 2$ zero, and the $L$ term disappears.'
        write: 'Put $r = 2$: $\ 5 + 2(2) = K(2 + 1) + L(2 - 2)$'
      - say: '2 times 2 is 4. 2 plus 1 is 3, and 2 minus 2 is 0.'
        write: '$5 + 4 = K(3) + L(0)$'
      - say: '5 plus 4 is 9, and $L$ times 0 is 0.'
        write: '$9 = 3K$'
      - say: 'Divide both sides by 3. 9 over 3 is 3.'
        write: '$K = \dfrac{9}{3} = 3$'
      - section: 'Check'
        say: 'Check by finding $L$ too. Put $r = -1$, which makes $r + 1$ zero. 5 plus 2 times minus 1 is 3, and minus 1 minus 2 is minus 3.'
        write: 'Put $r = -1$: $\ 3 = L(-3)$, $\ L = -1$'
      - say: 'Add the two fractions back over the LCM. The top is 3 times $r + 1$, minus 1 times $r - 2$.'
        write: 'Check: $3(r + 1) - 1(r - 2)$'
      - say: '$3r$ plus 3 minus $r$ plus 2 is $2r$ plus 5, the top we started with.'
        write: '$= 3r + 3 - r + 2 = 2r + 5 \ \checkmark$'
      - say: 'Therefore $K$ is 3, which is answer choice A.'
        write: '$\therefore K = 3$'
        answer: true
    traps:
      B: 'You went for 2. That is the value of $r$ we substitute, not $K$. With $r = 2$, the identity becomes $9 = 3K$, so $K = 3$.'
      C: 'You went for 1. Put $r = 2$ into $5 + 2r = K(r + 1) + L(r - 2)$. The left is 9 and the right is $3K$, so $K = 3$.'
      D: 'You went for minus 1. That is $L$, the other constant, which you get by putting $r = -1$. $K$ sits over $r - 2$, so we use $r = 2$ and get $K = 3$.'
  17:
    moments:
      - section: 'The question'
        say: 'The unknown is in the denominator. Multiplying by it could reverse the sign, unless we know it is positive. The question tells us exactly that.'
        write: '$f(x) = 2x + 4,\ \ g(x) = 6x + 7,\ \ g(x) > 0$'
      - say: 'Solution. Put the two functions into the inequality, with $2x$ plus 4 on top and $6x$ plus 7 underneath.'
        write: 'Solution: $\ \dfrac{2x + 4}{6x + 7} < 1$'
      - say: '$g(x)$, which is $6x$ plus 7, is positive. So multiplying both sides by it keeps the sign the same way round.'
        write: '$6x + 7 > 0$, so the sign stays'
      - say: 'Multiply both sides by $6x$ plus 7. The left loses its denominator, and the right becomes $6x$ plus 7.'
        write: '$2x + 4 < 6x + 7$'
      - say: 'Collect like terms, with $x$ terms on the right and numbers on the left. Subtract $2x$ and subtract 7 from both sides.'
        write: '$4 - 7 < 6x - 2x$'
      - say: '4 minus 7 is minus 3, and $6x$ minus $2x$ is $4x$.'
        write: '$-3 < 4x$'
      - say: 'Divide both sides by 4. It is positive, so the sign stays.'
        write: '$-\dfrac{3}{4} < x$'
      - say: 'Written the usual way round, $x$ is greater than minus 3 over 4.'
        write: '$\therefore\ x > -\dfrac{3}{4}$'
      - section: 'The number line'
        say: 'On a number line, draw an open circle at minus three quarters, and an arrow to the right. Every such $x$ also keeps $6x$ plus 7 positive.'
        diagram: {id: n, kind: numberline, range: [-2, 1], step: 0.25}
        diagram_do:
          - {id: n, op: interval, from: -0.75, from_open: true, text: 'x > −3/4', answer: true, 'on': 'open circle'}
      - section: 'Check'
        say: 'Check with $x$ equals 0. 4 over 7 is less than 1. It works.'
        write: 'Check $x = 0$: $\ \dfrac{4}{7} < 1\ \checkmark$'
      - say: 'So $x$ is greater than minus 3 over 4, which is option C.'
        write: '$x > -\dfrac{3}{4}$'
        answer: true
    traps:
      A: 'You went for $x < -\tfrac{3}{4}$. That has the sign reversed. Since $g(x)$ is positive, multiplying by it keeps the inequality the same way, and dividing by 4 does too.'
      B: 'You went for $x > -\tfrac{4}{3}$. That''s the fraction upside down. From $-3 < 4x$, dividing by 4 gives minus 3 over 4.'
      D: 'You went for $x > -12$. That multiplies instead of divides. From $-3 < 4x$, divide both sides by 4, giving $x > -\tfrac{3}{4}$.'
  18:
    moments:
      - section: 'The question'
        say: 'This is a quadratic inequality with fractions for critical values. Two options swap the signs of those fractions, so we must find them carefully.'
        write: '$12x^{2} < x + 1$'
      - say: 'Solution. Bring everything to one side, so we compare with zero. Subtract $x$ and subtract 1 from both sides.'
        write: 'Solution: $\ 12x^{2} - x - 1 < 0$'
      - section: 'Factorise'
        say: 'Factorise by product and sum. The product is 12 times minus 1, which is minus 12. The sum is minus 1. Minus 4 and plus 3 work.'
        write: 'Product $= -12$, $\ $Sum $= -1$: $\ -4,\ +3$'
      - say: 'Split the middle term, minus $x$, into minus $4x$ plus $3x$.'
        write: '$12x^{2} - 4x + 3x - 1 < 0$'
      - say: 'Group in pairs. Take $4x$ out of the first pair, and 1 out of the second. The brackets match.'
        write: '$4x(3x - 1) + 1(3x - 1) < 0$'
      - say: 'Take out the common bracket, $3x$ minus 1.'
        write: '$(4x + 1)(3x - 1) < 0$'
      - say: 'Now the critical values. $4x$ plus 1 is zero when $x$ is minus a quarter. $3x$ minus 1 is zero when $x$ is a third.'
        write: 'Critical values: $\ x = -\dfrac{1}{4},\ \ x = \dfrac{1}{3}$'
      - section: 'Sign table'
        say: 'Now the sign table, with three regions, one row for each bracket, then the product.'
        diagram:
          id: t
          kind: table
          columns: ['Factor', 'x < −¼', '−¼ < x < ⅓', 'x > ⅓']
          rows: [['4x + 1', '', '', ''], ['3x − 1', '', '', ''], ['product', '', '', '']]
      - say: '$4x$ plus 1 is negative below minus a quarter, and positive above it.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,2', text: '−'}
          - {id: t, op: fill, part: 'cell:1,3', text: '+'}
          - {id: t, op: fill, part: 'cell:1,4', text: '+'}
      - say: '$3x$ minus 1 is negative below a third, and positive above it.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:2,2', text: '−'}
          - {id: t, op: fill, part: 'cell:2,3', text: '−'}
          - {id: t, op: fill, part: 'cell:2,4', text: '+'}
      - say: 'Multiply down each column, and we get plus, minus, plus. The product is negative only in the middle.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:3,2', text: '+'}
          - {id: t, op: fill, part: 'cell:3,3', text: '−', colour: green}
          - {id: t, op: fill, part: 'cell:3,4', text: '+'}
      - section: 'Answer'
        say: 'We want the product less than zero, so we take the middle column.'
        write: '$\therefore\ -\dfrac{1}{4} < x < \dfrac{1}{3}$'
      - say: 'On a number line, put open circles at minus a quarter and a third, and shade the stretch between.'
        diagram: {id: n, kind: numberline, range: [-1, 1], step: 0.25}
        diagram_do:
          - {id: n, op: interval, from: -0.25, to: 0.333, from_open: true, to_open: true, text: '−¼ < x < ⅓', answer: true, 'on': 'open circles'}
      - section: 'Check'
        say: 'Check $x$ equals 0, which is inside. 12 times 0 is 0, and 0 is less than 0 plus 1. True.'
        write: 'Check $x = 0$: $\ 12(0)^{2} = 0 < 0 + 1\ \checkmark$'
      - say: 'So $x$ lies between minus a quarter and a third, which is option A.'
        write: '$-\dfrac{1}{4} < x < \dfrac{1}{3}$'
        answer: true
    traps:
      B: 'You went for $\tfrac{1}{4} < x < \tfrac{1}{3}$. The critical value from $4x + 1 = 0$ is minus a quarter, not plus. Also, $x = 0$ works in the question, and this range leaves it out.'
      C: 'You went for $-\tfrac{1}{3} < x < \tfrac{1}{4}$. Those are the right sizes with the signs swapped. Solve each bracket on its own. $4x + 1 = 0$ gives minus a quarter, and $3x - 1 = 0$ gives a third.'
      D: 'You went for $-\tfrac{1}{4} < x < -\tfrac{1}{3}$. Minus a quarter is bigger than minus a third, so no number fits that. The second critical value is plus a third.'
  19:
    moments:
      - section: 'The question'
        say: 'We are given the sum of the first $n$ terms, $n$ squared minus 1, not the terms themselves. How do we get one term out of a sum?'
        write: '$S_{n} = n^{2} - 1$; $\ T_{n} = ?$'
        doodle: {name: 'custom:1997_q19_a', id: towers, caption: 'the nth term is the top block'}
      - section: 'Solution'
        say: 'Solution. The sum of $n$ terms, minus the sum of the first $n$ minus 1 terms, leaves only the $n$th term. It is like a tower of blocks minus the same tower without its top block.'
        write: 'Solution: $T_{n} = S_{n} - S_{n-1}$'
        doodle_do:
          - {id: towers, op: arrow, part: short, to_part: tall, text: 'take away'}
      - say: 'To get $S$ of $n$ minus 1, replace every $n$ in the formula by $n$ minus 1.'
        write: '$S_{n-1} = (n - 1)^{2} - 1$'
      - say: 'Expand the bracket, so $n$ minus 1, squared, is $n$ squared minus $2n$ plus 1.'
        write: '$= n^{2} - 2n + 1 - 1$'
      - say: 'Plus 1 minus 1 is 0.'
        write: '$= n^{2} - 2n$'
      - say: 'Now substitute both sums into $T$ $n$. Keep $S$ $n$ minus 1 in a bracket, so the minus sign reaches both of its terms.'
        write: '$T_{n} = (n^{2} - 1) - (n^{2} - 2n)$'
        point:
          - {line: 5, kind: move, from: {line: 0, at: 'n2 − 1'}, at: '(n2 − 1)', text: 'Sn'}
          - {line: 5, kind: move, from: {line: 4, at: 'n2 − 2n'}, at: '(n2 − 2n)', text: 'S(n−1)'}
      - say: 'Open the brackets. We get minus $n$ squared, and minus negative $2n$ is plus $2n$.'
        write: '$= n^{2} - 1 - n^{2} + 2n$'
      - say: '$n$ squared minus $n$ squared is 0. That leaves $2n$ minus 1, the top block.'
        write: '$\therefore\ T_{n} = 2n - 1$'
        doodle_do:
          - {id: towers, op: stage, stage: 'custom:1997_q19_a2'}
        point:
          - {line: 7, kind: highlight, at: '2n − 1', to: {doodle: towers, part: answer}}
      - section: 'Check'
        say: 'Check with $n$ equal to 3. $S$ 3 is 9 minus 1, which is 8, and $S$ 2 is 4 minus 1, which is 3. So the 3rd term is 8 minus 3, which is 5.'
        write: 'Check: $T_{3} = S_{3} - S_{2} = 8 - 3 = 5$'
      - say: 'The formula gives 2 times 3, minus 1, which is 5. It agrees.'
        write: '$2(3) - 1 = 5\ \checkmark$'
      - say: 'Therefore the $n$th term is $2n$ minus 1, which is answer choice D.'
        write: '$\therefore\ T_{n} = 2n - 1$'
        answer: true
    traps:
      A: 'You went for $4n$ plus 1. The $n$ term comes from $n$ minus 1 squared, which is $n$ squared minus $2n$ plus 1, so the coefficient is 2, not 4. The result is $2n$ minus 1.'
      B: 'You went for $4n$ minus 1. The middle term of $n$ minus 1 squared is negative $2n$, not negative $4n$. So the $n$th term is $2n$ minus 1.'
      C: 'You went for $2n$ plus 1. That happens when the minus sign does not reach both terms of the bracket. $n$ squared minus 1, minus $n$ squared minus $2n$, is $2n$ minus 1.'
  20:
    moments:
      - section: 'The question'
        say: 'The $n$th term is 3 to the power 1 minus $n$. The powers will be 0 and negative numbers. We want the sum of the first three terms.'
        write: '$T_{n} = 3^{1 - n}$; $\ S_{3} = ?$'
        doodle: {name: 'custom:1997_q20_a', id: strip, caption: 'each term is a third of the last'}
      - section: 'Solution'
        say: 'Solution. Substitute $n$ equal to 1. 1 minus 1 is 0, and any number to the power 0 is 1.'
        write: 'Solution: $T_{1} = 3^{1 - 1} = 3^{0} = 1$'
      - say: 'Substitute $n$ equal to 2. 1 minus 2 is negative 1, and a negative power means 1 over, so 3 to the negative 1 is 1 over 3.'
        write: '$T_{2} = 3^{1 - 2} = 3^{-1} = \dfrac{1}{3}$'
        doodle_do:
          - {id: strip, op: stage, stage: 'custom:1997_q20_a2'}
      - say: 'Each term is the one before times 1 over 3, so this is a G.P. The first term $a$ is 1, and $r$ is 1 over 3. We want 3 terms.'
        write: '$a = 1,\quad r = \dfrac{1}{3},\quad n = 3$'
      - say: '$r$ is less than 1, so we use this form of the sum of $n$ terms, which is $a$, times 1 minus $r$ to the $n$, over 1 minus $r$.'
        write: '$S_{n} = \dfrac{a(1 - r^{n})}{1 - r}$'
      - say: 'Substitute $a$ equals 1, $r$ equals 1 over 3, and $n$ equals 3.'
        write: '$S_{3} = \dfrac{1\left(1 - \left(\frac{1}{3}\right)^{3}\right)}{1 - \frac{1}{3}}$'
      - say: '1 over 3, cubed, is 1 over 27, and 1 minus 1 over 27 is 26 over 27. On the bottom, 1 minus 1 over 3 is 2 over 3.'
        write: '$= \dfrac{26}{27} \div \dfrac{2}{3}$'
      - say: 'To divide by 2 over 3, multiply by its reciprocal, 3 over 2.'
        write: '$= \dfrac{26}{27} \times \dfrac{3}{2}$'
      - say: '26 over 2 is 13, and 3 over 27 is 1 over 9.'
        write: '$\therefore\ S_{3} = \dfrac{13}{9}$'
      - section: 'Check'
        say: 'Check by adding the terms. The third term is 3 to the power negative 2, which is 1 over 9. It is a third of a third.'
        write: 'Check: $T_{3} = 3^{-2} = \dfrac{1}{9}$'
        doodle_do:
          - {id: strip, op: stage, stage: 'custom:1997_q20_a3'}
      - say: 'Put it all over 9. 1 is 9 over 9, and 1 over 3 is 3 over 9. 9 plus 3 plus 1 is 13. Laid end to end, the strips make 13 over 9.'
        write: '$1 + \dfrac{1}{3} + \dfrac{1}{9} = \dfrac{9 + 3 + 1}{9} = \dfrac{13}{9}\ \checkmark$'
        doodle_do:
          - {id: strip, op: stage, stage: 'custom:1997_q20_a4'}
        point:
          - {line: 10, kind: highlight, at: '913', to: {doodle: strip, part: total}}
      - say: 'Therefore the sum of the first three terms is 13 over 9, which is answer choice A.'
        write: '$\therefore\ S_{3} = \dfrac{13}{9}$'
        answer: true
    traps:
      B: 'You went for 1. That is the first term only. The question wants the sum of the first three terms, and 1 plus 1 over 3 plus 1 over 9 is 13 over 9.'
      C: 'You went for 1 over 3. That is the second term, or the common ratio. Add all three terms, 1, 1 over 3 and 1 over 9.'
      D: 'You went for 1 over 9. That is the third term on its own. The sum is 9 over 9 plus 3 over 9 plus 1 over 9, which is 13 over 9.'
  21:
    moments:
      - section: 'The question'
        say: 'There are two different operations, star and circle-plus, in one expression. The secret is order. Do the bracket first, with the star rule, then the circle-plus rule on the result.'
        write: '$m * n = mn - n - 1,\ \ m \oplus n = mn + n - 2$. Find $3 \oplus (4 * 5)$.'
      - say: 'Solution. Start inside the bracket, with 4 star 5. Write the star definition line first.'
        write: 'Solution: $m * n = mn - n - 1$'
        doodle: {name: 'custom:1997_q21_a', id: machines, caption: 'star first, then circle-plus', size: scene}
      - section: 'The bracket first'
        say: 'In 4 star 5, $m$ is 4 and $n$ is 5. Write that down before substituting.'
        write: '$m = 4,\ n = 5$'
      - say: 'Substitute, and we get 4 times 5, minus 5, minus 1.'
        write: '$4 * 5 = (4)(5) - 5 - 1$'
      - say: '4 times 5 is 20.'
        write: '$= 20 - 5 - 1$'
      - say: '20 minus 5 is 15, and 15 minus 1 is 14. In the picture, 4 and 5 give 14.'
        write: '$= 14$'
        doodle_do:
          - {id: machines, op: stage, stage: 'custom:1997_q21_a2'}
      - section: 'Then circle-plus'
        say: 'Replace the bracket with 14. The question becomes 3 circle-plus 14.'
        write: '$3 \oplus (4 * 5) = 3 \oplus 14$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '14'}, at: '⊕ 14', text: 'from the bracket'}
        doodle_do:
          - {id: machines, op: move, part: out1, path: feed}
      - say: 'Now the circle-plus rule, which says $m$ circle-plus $n$ is $mn$ plus $n$ minus 2. Here $m$ is 3 and $n$ is 14.'
        write: '$m \oplus n = mn + n - 2;\ \ m = 3,\ n = 14$'
      - say: 'Substitute again, and we get 3 times 14, plus 14, minus 2.'
        write: '$3 \oplus 14 = (3)(14) + 14 - 2$'
      - say: '3 times 14 is 42.'
        write: '$= 42 + 14 - 2$'
      - say: '42 plus 14 is 56, and 56 minus 2 is 54.'
        write: '$= 54$'
        doodle_do:
          - {id: machines, op: label, part: out2, text: '54'}
      - section: 'Answer'
        say: 'Therefore 3 circle-plus, bracket, 4 star 5, is 54, which is option C.'
        write: '$\therefore 3 \oplus (4 * 5) = 54$'
        answer: true
    traps:
      A: 'You went for 60. Use each rule as it is written. The star rule gives $20 - 5 - 1 = 14$, and the circle-plus rule gives $42 + 14 - 2 = 54$.'
      B: 'You went for 57. Keep the two rules apart. Star takes away $n$ and 1, and circle-plus adds $n$ and takes away 2. That gives 14, then 54.'
      D: 'You went for 42. That is only the $mn$ part, 3 times 14. The circle-plus rule also adds $n$ and takes away 2, so $42 + 14 - 2 = 54$.'
  22:
    moments:
      - section: 'The question'
        say: 'The same star is used twice, with $x$ unknown both times. Work out each star in terms of $x$, and the question turns into a simple linear equation.'
        write: '$x * y = x + y - xy$. Find $x$ when $(x * 2) + (x * 3) = 68$.'
      - say: 'Solution. Write the definition line. $x$ stays in the first place, and the second number takes the place of $y$.'
        write: 'Solution: $x * y = x + y - xy$'
        doodle: {name: 'custom:1997_q22_a', id: machines, caption: 'the same star, used twice', size: scene}
      - section: 'Each star'
        say: 'First, $x$ star 2. Put 2 in place of $y$, and we get $x$ plus 2, minus $x$ times 2.'
        write: '$x * 2 = x + 2 - 2x$'
      - say: 'Collect like terms, so $x$ minus $2x$ is minus $x$. So $x$ star 2 is 2 minus $x$.'
        write: '$= 2 - x$'
        doodle_do:
          - {id: machines, op: stage, stage: 'custom:1997_q22_a2'}
      - say: 'Next, $x$ star 3. Put 3 in place of $y$, which gives $x$ plus 3, minus $3x$.'
        write: '$x * 3 = x + 3 - 3x$'
      - say: '$x$ minus $3x$ is minus $2x$. So $x$ star 3 is 3 minus $2x$.'
        write: '$= 3 - 2x$'
        doodle_do:
          - {id: machines, op: stage, stage: 'custom:1997_q22_a3'}
      - section: 'The equation'
        say: 'Substitute both into the equation from the question.'
        write: '$(2 - x) + (3 - 2x) = 68$'
        point:
          - {line: 6, kind: move, from: {line: 3, at: '2 − x'}, at: '(2 − x)', text: 'x * 2'}
          - {line: 6, kind: move, from: {line: 5, at: '3 − 2x'}, at: '(3 − 2x)', text: 'x * 3'}
        doodle_do:
          - {id: machines, op: circle, part: eq}
      - say: 'Open the brackets and collect like terms. 2 plus 3 is 5, and minus $x$ minus $2x$ is minus $3x$.'
        write: '$5 - 3x = 68$'
      - say: 'Subtract 5 from both sides. 68 minus 5 is 63.'
        write: '$-3x = 63$'
      - say: 'Divide both sides by minus 3. 63 divided by minus 3 is minus 21.'
        write: '$x = \dfrac{63}{-3} = -21$'
        doodle_do:
          - {id: machines, op: label, part: eq, text: 'x = −21'}
      - section: 'Check'
        say: 'Check. Minus 21 star 2 is minus 21, plus 2, minus 2 times minus 21. That is minus 21 plus 2 plus 42, which is 23.'
        write: 'Check: $(-21) * 2 = -21 + 2 + 42 = 23$'
      - say: 'Minus 21 star 3 is minus 21 plus 3 plus 63, which is 45. And 23 plus 45 is 68.'
        write: '$(-21) * 3 = -21 + 3 + 63 = 45;\ \ 23 + 45 = 68\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore $x$ is minus 21, which is option D.'
        write: '$\therefore x = -21$'
        answer: true
    traps:
      A: 'You went for 24. Test it. 24 star 2 is $24 + 2 - 48$, which is minus 22. Both stars have minus $x$ terms, so to reach 68, $x$ must be negative.'
      B: 'You went for 22. With a positive $x$, both $2 - x$ and $3 - 2x$ are negative, so they cannot add to 68. Solving $5 - 3x = 68$ gives $x = -21$.'
      C: 'You went for minus 12. The sign is right, but check the size. $-3x = 63$ gives $x = -21$, since 63 divided by 3 is 21, not 12.'
  23:
    moments:
      - section: 'The question'
        say: 'This is a matrix equation, a 2 by 2 matrix times the column $x$, $y$. The textbook way is the matrix method, so we multiply both sides by the inverse of the matrix.'
        write: '$\begin{pmatrix} 2 & -3 \\ -1 & 4 \end{pmatrix}\begin{pmatrix} x \\ y \end{pmatrix} = \begin{pmatrix} -1 \\ 8 \end{pmatrix}$'
      - section: 'Solution'
        say: 'Solution. Let $A$ be the matrix, $X$ the unknown column and $B$ the column on the right. Then $AX$ equals $B$, so $X$ equals $A$ inverse times $B$.'
        write: 'Solution: Let $A = \begin{pmatrix} 2 & -3 \\ -1 & 4 \end{pmatrix}$; $\ AX = B \Rightarrow X = A^{-1}B$'
      - say: 'First the determinant, which is $ad$ minus $bc$. We take 2 times 4, minus negative 3 times negative 1.'
        write: '$|A| = (2)(4) - (-3)(-1) = 8 - 3 = 5$'
      - say: 'For the adjoint, swap the entries on the leading diagonal, 2 and 4, and change the signs of the other two. Negative 3 becomes 3, and negative 1 becomes 1.'
        write: '$\text{adj } A = \begin{pmatrix} 4 & 3 \\ 1 & 2 \end{pmatrix}$'
      - say: 'The inverse is 1 over the determinant, times the adjoint.'
        write: '$A^{-1} = \dfrac{1}{|A|}\,\text{adj } A = \dfrac{1}{5}\begin{pmatrix} 4 & 3 \\ 1 & 2 \end{pmatrix}$'
      - section: 'Multiply by B'
        say: 'Now $A$ inverse times $B$, row by column. On top we have 4 times negative 1, plus 3 times 8. At the bottom we have 1 times negative 1, plus 2 times 8.'
        write: '$\begin{pmatrix} x \\ y \end{pmatrix} = \dfrac{1}{5}\begin{pmatrix} (4)(-1) + (3)(8) \\ (1)(-1) + (2)(8) \end{pmatrix}$'
      - say: 'Negative 4 plus 24 is 20. Negative 1 plus 16 is 15.'
        write: '$= \dfrac{1}{5}\begin{pmatrix} 20 \\ 15 \end{pmatrix}$'
      - say: 'Divide each entry by 5. 20 over 5 is 4, and 15 over 5 is 3.'
        write: '$= \begin{pmatrix} 4 \\ 3 \end{pmatrix}$'
      - say: 'So $x$ is 4 and $y$ is 3.'
        write: '$\therefore\ x = 4,\ y = 3$'
      - say: 'The question wants $x$ plus $y$, not each one. 4 plus 3 is 7.'
        write: '$x + y = 4 + 3 = 7$'
      - section: 'Check'
        say: 'Check by multiplying back. In the top row, 2 times 4, minus 3 times 3, is 8 minus 9, which is negative 1. In the bottom row, negative 4 plus 12 is 8. Both match.'
        write: 'Check: $2(4) - 3(3) = -1\ \checkmark,\quad -4 + 4(3) = 8\ \checkmark$'
      - say: 'Therefore $x$ plus $y$ is 7, which is answer choice C.'
        write: '$\therefore\ x + y = 7$'
        answer: true
    traps:
      A: 'You went for 3. That is $y$ on its own. The question asks for $x + y$, which is $4 + 3 = 7$.'
      B: 'You went for 4. That is $x$ on its own. Add $y = 3$ to it to get 7.'
      D: 'You went for 12. That is $x$ times $y$, 4 times 3. The question wants the sum, 4 plus 3, which is 7.'
  24:
    moments:
      - section: 'The question'
        say: 'There is an unknown inside a 3 by 3 determinant that equals zero. Expand it in terms of $x$, set it to zero, and solve.'
        write: '$\begin{vmatrix} x & 1 & 0 \\ 1 & x & 1 \\ 0 & 1 & x \end{vmatrix} = 0$'
        doodle: {name: 'custom:1997_q24_a', id: grid, caption: 'expand along the first row', size: scene}
      - section: 'Solution'
        say: 'Solution. Expand along the first row, which is $x$, 1 and 0, with the signs plus, minus, plus. Each entry multiplies its minor, the 2 by 2 left when we cover its row and column.'
        write: 'Solution: $x\begin{vmatrix} x & 1 \\ 1 & x \end{vmatrix} - 1\begin{vmatrix} 1 & 1 \\ 0 & x \end{vmatrix} + 0\begin{vmatrix} 1 & x \\ 0 & 1 \end{vmatrix} = 0$'
        doodle_do:
          - {id: grid, op: circle, part: signs, 'on': 'plus, minus, plus'}
          - {id: grid, op: stage, stage: 'custom:1997_q24_a2', 'on': 'cover'}
      - say: 'A 2 by 2 determinant is $ad$ minus $bc$. Apply it to each minor. The last term is 0 times its minor, which is 0.'
        write: '$x[(x)(x) - (1)(1)] - 1[(1)(x) - (1)(0)] + 0 = 0$'
        doodle_do:
          - {id: grid, op: stage, stage: 'custom:1997_q24_a3', 'on': 'each minor'}
      - say: '$x$ times $x$ minus 1 is $x^{2} - 1$. 1 times $x$ minus 0 is $x$.'
        write: '$x(x^{2} - 1) - 1(x) = 0$'
      - say: 'Open the brackets. $x$ times $x^{2}$ is $x^{3}$, $x$ times negative 1 is negative $x$, and then minus another $x$.'
        write: '$x^{3} - x - x = 0$'
      - say: 'Collect like terms. Negative $x$ minus $x$ is negative $2x$.'
        write: '$x^{3} - 2x = 0$'
      - say: 'Factorise, because $x$ is common to both terms. We factorise instead of dividing by $x$, so we don''t lose a root.'
        write: '$x(x^{2} - 2) = 0$'
      - say: 'A product is zero only when one of its factors is zero.'
        write: 'Either $x = 0$ or $x^{2} - 2 = 0$'
      - say: 'From the second, $x^{2}$ equals 2, so $x$ is plus or minus root 2.'
        write: '$x^{2} = 2 \Rightarrow x = \pm\sqrt{2}$'
      - say: 'The question wants the non-zero positive value, so we rule out 0 and negative root 2.'
        write: '$\therefore\ x = \sqrt{2}$'
        point:
          - {line: 7, kind: strike, at: 'x = 0', text: 'not zero'}
      - section: 'Check'
        say: 'To check, put $x$ equals root 2 into $x^{3} - 2x$. Root 2 cubed is 2 root 2, and 2 times root 2 is 2 root 2. They cancel to zero.'
        write: 'Check: $(\sqrt{2})^{3} - 2\sqrt{2} = 2\sqrt{2} - 2\sqrt{2} = 0\ \checkmark$'
      - say: 'Therefore $x$ is root 2, which is answer choice C.'
        write: '$\therefore\ x = \sqrt{2}$'
        answer: true
    traps:
      A: 'You went for 2. That is the value of $x^{2}$, not $x$. From $x^{2} = 2$, take the square root to get $\sqrt{2}$.'
      B: 'You went for $\sqrt{3}$. Check the expansion. $x(x^{2} - 1) - x$ is $x^{3} - 2x$, not $x^{3} - 3x$. So $x^{2} = 2$ and $x = \sqrt{2}$.'
      D: 'You went for 1. That makes the first minor zero, but it forgets the middle term, minus 1 times $x$. The whole determinant is $x^{3} - 2x$, and at $x = 1$ that is negative 1, not zero.'
  25:
    moments:
      - section: 'The question'
        say: 'We have an isosceles triangle with its corners on a circle. Many students double the 58 here. The base angles lead to the apex, and the apex leads to the centre.'
        write: 'Base $\angle$s $= 58^{\circ}$; find the $\angle$ the base makes at the centre'
      - section: 'Solution'
        say: 'Solution. Let me sketch the triangle $ABC$ in the circle, with base $BC$, base angles of 58 degrees, and the centre $O$.'
        show_sketch: true
        write: 'Solution: $\angle ABC = \angle ACB = 58^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: ABC, text: '58°'}
          - {figure: sketch, kind: arc, target: ACB, text: '58°'}
      - say: 'First the apex angle at $A$. The angles of a triangle add up to 180 degrees.'
        write: '$\angle BAC = 180^{\circ} - (58^{\circ} + 58^{\circ})$ ($\angle$ sum of $\triangle$)'
        point:
          - {figure: sketch, kind: circle, target: A, text: 'apex'}
      - say: '58 plus 58 is 116, and 180 minus 116 is 64.'
        write: '$= 180^{\circ} - 116^{\circ} = 64^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: BAC, text: '64°'}
      - say: 'Now join $O$ to $B$ and to $C$. The angle $BOC$, at the centre, is the angle the base subtends there.'
        show_sketch: sketch_b
        write: 'Join $OB$ and $OC$'
        point:
          - {figure: sketch_b, kind: circle, target: '?', text: 'angle BOC'}
      - say: 'Angle $BOC$ at the centre and angle $BAC$ at the circumference stand on the same arc $BC$. The rule is that the angle at the centre is twice the angle at the circumference.'
        write: '$\angle BOC = 2 \times \angle BAC$ ($\angle$ at centre $= 2 \times \angle$ at circumference)'
        point:
          - {figure: sketch_b, kind: circle, target: O, text: 'centre'}
          - {figure: sketch_b, kind: circle, target: A, text: 'circumference'}
      - say: 'Substitute 64 degrees for angle $BAC$.'
        write: '$= 2 \times 64^{\circ}$'
        point:
          - {line: 6, kind: move, from: {line: 3, at: '= [[64∘]]'}, at: '64∘', text: 'apex'}
      - say: '2 times 64 is 128.'
        write: '$= 128^{\circ}$'
        point:
          - {figure: sketch_b, kind: arc, target: BOC, text: '128°'}
      - section: 'Check'
        say: 'To check, $OB$ and $OC$ are radii, so triangle $BOC$ is isosceles. Its base angles are 180 minus 128, halved, which is 26 each. 128 plus 26 plus 26 is 180.'
        write: 'Check: $\angle OBC = \dfrac{180^{\circ} - 128^{\circ}}{2} = 26^{\circ}$, $\ 128 + 26 + 26 = 180\ \checkmark$'
      - say: 'Therefore the base subtends 128 degrees at the centre, which is option A.'
        write: '$\therefore \angle BOC = 128^{\circ}$'
        answer: true
    traps:
      B: 'You went for 116 degrees. That is twice a base angle, the angle an equal side subtends at the centre. The base $BC$ faces the apex, 64 degrees, so it subtends twice 64, which is 128.'
      C: 'You went for 64 degrees. That is the apex angle, at the circumference. The angle at the centre is twice the angle at the circumference, so it is 128 degrees.'
      D: 'You went for 58 degrees. That is a base angle from the question. Find the apex, 64 degrees, then double it to get 128 degrees.'
  26:
    moments:
      - section: 'The question'
        say: 'We have parallel lines, an isosceles triangle and two given angles. Many students use the 34 or the 47 in the wrong triangle. Let''s find $x$ with a reason on every line.'
        write: '$FK \parallel GR,\ FH = GH$; find $x$'
        point:
          - {figure: 0, kind: circle, target: x, text: 'find'}
      - section: 'Solution'
        say: 'Solution. The givens on the diagram are angle $RFK$, 34 degrees, and angle $FGH$, 47 degrees.'
        write: 'Solution: $\angle RFK = 34^{\circ},\ \angle FGH = 47^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: RFK, text: '34°'}
          - {figure: 0, kind: arc, target: FGH, text: '47°'}
      - say: '$FR$ crosses the parallel lines $FK$ and $GR$. Angle $FRG$ and angle $RFK$ make a Z shape, so they are equal, because alternate angles are equal.'
        write: '$\angle FRG = \angle RFK = 34^{\circ}$ (alt. $\angle$s, $FK \parallel GR$)'
        point:
          - {figure: 0, kind: highlight, target: FR}
          - {figure: 0, kind: arc, target: FRG, text: '34°'}
      - say: '$FH$ equals $GH$, so triangle $FGH$ is isosceles, and the angles at $F$ and $G$ are equal. These are the base angles of an isosceles triangle.'
        write: '$\angle GFH = \angle FGH = 47^{\circ}$ (base $\angle$s of isos. $\triangle$)'
        point:
          - {figure: 0, kind: highlight, target: FH}
          - {figure: 0, kind: highlight, target: GH}
          - {figure: 0, kind: arc, target: GFH, text: '47°'}
      - say: 'Now the big triangle $FGR$. Its angles add up to 180, so the whole angle at $F$ is 180 minus 47 minus 34.'
        write: '$\angle GFR = 180^{\circ} - (47^{\circ} + 34^{\circ})$ ($\angle$ sum of $\triangle$)'
      - say: '47 plus 34 is 81, and 180 minus 81 is 99.'
        write: '$= 180^{\circ} - 81^{\circ} = 99^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: GFR, text: '99°'}
      - say: 'The whole angle at $F$ is made of angle $GFH$ and $x$. So $x$ is 99 minus 47.'
        write: '$x = \angle GFR - \angle GFH = 99^{\circ} - 47^{\circ}$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '= [[99∘]]'}, at: '[[99∘]] −', text: 'whole angle'}
          - {line: 6, kind: move, from: {line: 3, at: '= [[47∘]]'}, at: '− 47∘', text: 'isosceles part'}
      - say: '99 minus 47 is 52.'
        write: '$= 52^{\circ}$'
        point:
          - {figure: 0, kind: label, target: x, text: '52°'}
      - section: 'Check'
        say: 'Check with triangle $FHR$. Its angle at $H$ is the exterior angle of triangle $FGH$, so 47 plus 47, which is 94. Then 94 plus 34 plus 52 is 180.'
        write: 'Check: $\angle FHR = 47^{\circ} + 47^{\circ} = 94^{\circ}$ (ext. $\angle$ of $\triangle$); $\ 94 + 34 + 52 = 180\ \checkmark$'
      - say: 'Therefore $x$ is 52 degrees, which is option B.'
        write: '$\therefore x = 52^{\circ}$'
        answer: true
    traps:
      A: 'You went for 42 degrees. Check the angle sum. 180 minus 47 minus 34 is 99, and 99 minus 47 is 52, not 42.'
      C: 'You went for 64 degrees. Go through the steps. The angle at $R$ is 34 by alternate angles, the whole angle at $F$ is 99, and the isosceles part is 47. That leaves 52.'
      D: 'You went for 72 degrees. The base angles of triangle $FGH$ are at $F$ and $G$, since they face the equal sides. So 47 degrees is taken from the 99, leaving 52.'
  27:
    moments:
      - section: 'The question'
        say: 'We have two circles and a common tangent 25 cm long. Many students add the radii here. One construction line turns it into a right-angled triangle.'
        write: 'Radii $3$ cm and $2$ cm, direct common tangent $25$ cm; find $XY^{2}$'
        point:
          - {figure: 0, kind: circle, target: '3 cm'}
          - {figure: 0, kind: circle, target: '2 cm'}
          - {figure: 0, kind: highlight, target: '25 cm', text: 'tangent'}
      - section: 'Solution'
        say: 'Solution. Let the tangent touch the circles at $A$ and $B$. Then $XA$ is 3 cm and $YB$ is 2 cm, because they are radii.'
        write: 'Solution: let the tangent touch at $A$ and $B$; $XA = 3$, $YB = 2$ (radii)'
        point:
          - {figure: 0, kind: label, target: {x: 83, y: 108}, text: 'A'}
          - {figure: 0, kind: label, target: {x: 302, y: 122}, text: 'B'}
      - say: 'A tangent is perpendicular to the radius at the point of contact. So both radii stand at right angles to $AB$.'
        write: '$\angle XAB = \angle YBA = 90^{\circ}$ (tangent $\perp$ radius)'
        point:
          - {figure: 0, kind: circle, target: {x: 90, y: 114}, text: '90°'}
          - {figure: 0, kind: circle, target: {x: 308, y: 128}, text: '90°'}
      - say: 'For the construction, draw $YC$ parallel to $BA$, to meet $XA$ at $C$. Then $ABYC$ is a rectangle.'
        write: 'Draw $YC \parallel BA$ to meet $XA$ at $C$'
        point:
          - {figure: 0, kind: label, target: {x: 81, y: 136}, text: 'C'}
      - say: 'Opposite sides of a rectangle are equal. So $YC$ equals $BA$, 25 cm, and $CA$ equals $YB$, 2 cm.'
        write: '$YC = BA = 25$ cm, $\ CA = YB = 2$ cm (opp. sides of rectangle)'
      - say: 'So $XC$ is the 3 cm radius minus the 2 cm piece $CA$, which is 1 cm.'
        write: '$XC = XA - CA = 3 - 2 = 1$ cm'
      - say: 'The angle at $C$ is a right angle, the same as the angle at $A$, because they are corresponding angles, since $YC$ is parallel to $BA$.'
        write: '$\angle XCY = 90^{\circ}$ (corr. $\angle$s, $YC \parallel BA$)'
      - say: 'Now triangle $XCY$ is right-angled at $C$, with hypotenuse $XY$. The reason for the next line is Pythagoras.'
        write: '$XY^{2} = XC^{2} + YC^{2}$ (Pythagoras)'
        point:
          - {figure: 0, kind: highlight, target: XY, text: 'hypotenuse'}
      - say: 'Substitute 1 for $XC$ and 25 for $YC$. 1 squared is 1, and 25 squared is 625.'
        write: '$= 1^{2} + 25^{2} = 1 + 625$'
        point:
          - {line: 8, kind: move, from: {line: 5, at: '= [[1]] cm'}, at: '= [[1]]2', text: 'XC'}
          - {line: 8, kind: move, from: {line: 4, at: '= [[25]] cm'}, at: '+ [[25]]2', text: 'YC'}
      - say: '1 plus 625 is 626.'
        write: '$= 626$'
      - section: 'Check'
        say: 'To check, $XY$ is root 626, about 25.02 cm, a little longer than the tangent. That fits, because the radii differ by only 1 cm.'
        write: 'Check: $XY = \sqrt{626} \approx 25.02 > 25\ \checkmark$'
      - say: 'Therefore $XY$ squared is 626 square centimetres, which is option B.'
        write: '$\therefore XY^{2} = 626\ \text{cm}^{2}$'
        answer: true
        point:
          - {figure: 0, kind: label, target: 'XY = ?', text: 'XY² = 626'}
    traps:
      A: 'You went for 630. That uses 5, the sum of the radii, in place of 1. For a direct tangent $XC$ is the difference of the radii, 3 minus 2, which is 1. So $XY^{2} = 625 + 1 = 626$.'
      C: 'You went for 615. The two sides are 25 and 1, and Pythagoras adds their squares, so $625 + 1 = 626$.'
      D: 'You went for 600. That is 625 minus 25. $XY$ is the hypotenuse, so we add the squares of the other two sides, and $25^{2} + 1^{2} = 626$.'
  28:
    moments:
      - section: 'The question'
        say: 'Cut a round cake into 6 equal slices. How long is the curved crust of one slice? This question is the same idea, a 60 degree slice of a circle.'
        write: 'Find the minor arc $AB$.'
        doodle: {name: 'custom:1997_q28_a', id: cake, caption: 'one slice of a round cake'}
      - say: 'We start the way you start in the exam. Write Solution, then draw the circle. Its diameter is 42 cm, the line straight across through the centre O.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: underline, target: 'diameter 42 cm', 'on': 'diameter is 42 cm'}
      - say: 'Join the centre O to A and to B, the ends of the chord. The angle between them is 60 degrees. That is what subtends 60 degrees at the centre means.'
        write: '$\angle AOB = 60^{\circ}$'
        show_sketch: sketch_b
        point:
          - {figure: sketch_b, kind: arc, target: AOB, text: '60°', 'on': '60 degrees'}
          - {figure: sketch_b, kind: circle, target: 'arc = ?', text: 'minor arc', 'on': 'subtends'}
      - section: 'What we know'
        say: 'Now list the givens. The diameter d is 42 cm, the angle theta at the centre is 60 degrees, and pi is 22 over 7.'
        write: '$d = 42$ cm, $\theta = 60^{\circ}$, $\pi = \dfrac{22}{7}$'
        point:
          - {line: 3, kind: travel, at: '42', from: {figure: sketch_b, target: 'diameter 42 cm'}, 'on': '42 cm'}
      - say: 'The formula needs the radius, not the diameter. The radius is half the diameter, so 42 over 2 is 21.'
        write: '$r = \dfrac{42}{2} = 21$ cm'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '42'}, at: '242', text: 'diameter', 'on': '42 over 2'}
      - section: 'The formula'
        say: 'Length of arc is L equals theta over 360, times 2 pi r. Theta over 360 is the fraction of the circle, and 2 pi r is the whole way round.'
        write: '$L = \dfrac{\theta}{360} \times 2\pi r$'
        'on': 'Length of arc'
      - say: 'Now substitute, where theta is 60, pi is 22 over 7, and r is 21. So L equals 60 over 360, times 2, times 22 over 7, times 21.'
        write: '$L = \dfrac{60}{360} \times 2 \times \dfrac{22}{7} \times 21$'
        point:
          - {line: 6, kind: move, from: {line: 3, at: '60∘'}, at: '360[[60]]', text: 'θ', 'on': 'theta is 60'}
          - {line: 6, kind: move, from: {line: 4, at: '= [[21]]'}, at: '× 21', text: 'r', 'on': 'r is 21'}
      - section: 'Simplify'
        say: '60 over 360 is 1 over 6. And cancel the 7, because 7 goes into 21 three times.'
        write: '$= \dfrac{1}{6} \times 2 \times 22 \times 3$'
        doodle_do:
          - {id: cake, op: label, part: slice, text: '1 of 6 slices', 'on': '1 over 6'}
      - say: '2 times 22 times 3 is 132, the whole circumference. 1 over 6 of 132 is 132 divided by 6, which is 22.'
        write: '$= \dfrac{132}{6} = 22$'
        doodle_do:
          - {id: cake, op: label, part: crust, text: '22 cm', 'on': 'which is 22'}
      - say: 'Therefore the minor arc is 22 centimetres. Always write the unit.'
        write: '$\therefore$ minor arc $= 22$ cm'
        point:
          - {figure: sketch_b, kind: label, target: 'arc = ?', text: '22 cm', 'on': 'Therefore'}
      - section: 'Check'
        say: 'Check with the cake, which has 6 equal slices, each with 22 cm of crust. 6 times 22 is 132, and 2 pi r is also 132.'
        write: 'Check: $6 \times 22 = 132 = 2 \times \dfrac{22}{7} \times 21$ ✓'
        doodle_do:
          - {id: cake, op: pulse, part: cake, 'on': '6 equal slices'}
      - section: 'Answer'
        say: 'So the minor arc is 22 cm, which is answer choice A.'
        write: '$\therefore$ minor arc $= 22$ cm (A)'
        answer: true
    traps:
      B: 'You went for 44 cm. That uses 42 as the radius, which doubles the answer. 42 is the diameter, so r is 42 over 2, which is 21. Then L is 60 over 360 times 2 pi times 21, which is 22 cm.'
      C: 'You went for 110 cm. That is the major arc, the longer piece, 300 over 360 of 132. Minor means the shorter piece, where theta is 60 degrees, so L is 22 cm.'
      D: 'You went for 220 cm. That is longer than the whole circumference, 2 pi r, which is 132 cm, so it cannot be part of it. L is 1 over 6 of 132, which is 22 cm.'
  29:
    moments:
      - section: 'The question'
        say: 'A sector is the slice of a circle between two radii. Its area is a fraction of the whole circle, and the angle at the centre tells us which fraction.'
        write: 'Find the area of the sector.'
      - say: 'Write Solution, then draw the sector with centre O, radius 6 cm, and the arc AB making 70 degrees at O.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: arc, target: AOB, text: '70°', 'on': '70 degrees at O'}
      - section: 'What we know'
        say: 'List the givens. Theta is 70 degrees, r is 6 cm, and pi is 22 over 7.'
        write: '$\theta = 70^{\circ}$, $r = 6$ cm, $\pi = \dfrac{22}{7}$'
      - section: 'The formula'
        say: 'The area of a sector is theta over 360, times pi r squared.'
        write: '$A = \dfrac{\theta}{360} \times \pi r^{2}$'
      - say: 'Now substitute, where theta is 70, pi is 22 over 7, and r is 6.'
        write: '$A = \dfrac{70}{360} \times \dfrac{22}{7} \times 6^{2}$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: '70'}, at: '360[[70]]', text: 'θ', 'on': 'theta is 70'}
          - {line: 4, kind: move, from: {line: 2, at: '= 6'}, at: '× [[6]]2', text: 'r', 'on': 'r is 6'}
      - section: 'Simplify'
        say: '6 squared is 36. And for 70 over 360, divide top and bottom by 10 to get 7 over 36.'
        write: '$= \dfrac{7}{36} \times \dfrac{22}{7} \times 36$'
      - say: 'Now cancel the 7 on top with the 7 below, and the 36 below with the 36 on top. Only 22 is left.'
        write: '$= 22$'
      - say: 'Therefore the area of the sector is 22 square centimetres.'
        write: '$\therefore$ area of sector $= 22\ \text{cm}^{2}$'
        point:
          - {figure: sketch, kind: label, target: 'Area = ?', text: '22 cm²', 'on': 'Therefore'}
      - section: 'Check'
        say: 'To check, the whole circle is 22 over 7 times 36, about 113. 70 degrees is a little under a fifth of 360, and a fifth of 113 is about 23. So 22 is sensible.'
        write: 'Check: $\pi r^{2} \approx 113$; $\dfrac{1}{5} \times 113 \approx 23$, just above $22$ ✓'
      - section: 'Answer'
        say: 'So the area of the sector is 22 square centimetres, which is answer choice A.'
        write: '$\therefore A = 22\ \text{cm}^{2}$ (A)'
        answer: true
    traps:
      B: 'You went for 44 cm². That is double the area, as if theta were 140 degrees or the arc formula 2 pi r had been used. A is 7 over 36, times 22 over 7, times 36, which is 22.'
      C: 'You went for 66 cm². Simplify 70 over 360 to 7 over 36 first. Then the 7s cancel and the 36s cancel, leaving 22.'
      D: 'You went for 88 cm². That is four times the answer. A is 70 over 360 of pi r squared, and that cancels to 22 cm².'
  30:
    moments:
      - section: 'The question'
        say: 'A prism has the same cross-section all along its length, like a loaf of bread cut into equal slices. Its volume is the area of that end face times the length.'
        write: 'Find the volume of the prism.'
        point:
          - {figure: 0, kind: label, target: {x: 125, y: 150}, text: 'cross-section', 'on': 'that end face'}
      - say: 'Write Solution, and read the end face. The top, 8 cm, and the bottom, 10 cm, are parallel but not equal, so the face is a trapezium. The 5 cm side meets both at right angles, so it is the height.'
        write: 'Solution'
        point:
          - {figure: 0, kind: circle, target: '8 cm', text: 'a', 'on': 'The top, 8 cm'}
          - {figure: 0, kind: circle, target: '10 cm', text: 'b', 'on': 'the bottom, 10 cm'}
          - {figure: 0, kind: circle, target: '5 cm', text: 'h', 'on': 'it is the height'}
      - section: 'What we know'
        say: 'List the givens. The parallel sides a and b are 8 and 10 cm, the height h is 5 cm, and the length l is 11 cm.'
        write: '$a = 8$ cm, $b = 10$ cm, $h = 5$ cm, $l = 11$ cm'
        point:
          - {figure: 0, kind: circle, target: '11 cm', text: 'l', 'on': 'the length l'}
      - section: 'The formula'
        say: 'The volume of a prism is the area of the cross-section, times the length.'
        write: '$V = $ area of cross-section $\times$ length'
      - say: 'The area of a trapezium is half the sum of the parallel sides, times the height.'
        write: 'Area of trapezium $= \dfrac{1}{2}(a + b)h$'
      - section: 'The cross-section'
        say: 'Substitute, and we get a half, times 8 plus 10, times 5.'
        write: '$= \dfrac{1}{2}(8 + 10) \times 5$'
      - say: 'We work out the bracket first, by BODMAS, so 8 plus 10 is 18. Half of 18 is 9, and 9 times 5 is 45.'
        write: '$= \dfrac{1}{2} \times 18 \times 5 = 45\ \text{cm}^{2}$'
      - section: 'The volume'
        say: 'Now the volume is the area 45, times the length 11.'
        write: '$V = 45 \times 11$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '= 45'}, at: '45', text: 'area', 'on': 'the area 45'}
          - {line: 7, kind: move, from: {line: 2, at: '11'}, at: '11', text: 'length', 'on': 'the length 11'}
      - say: 'For 45 times 11, 45 times 10 is 450, plus one more 45, which is 495.'
        write: '$= 495$'
      - say: 'Therefore the volume of the prism is 495 cubic centimetres.'
        write: '$\therefore V = 495\ \text{cm}^{3}$'
      - section: 'Check'
        say: 'To check, if the face were a rectangle 8 by 5, V would be 440, and if 10 by 5, it would be 550. The trapezium lies between them, and 495 is exactly halfway.'
        write: 'Check: $440 < 495 < 550$, and $\dfrac{440 + 550}{2} = 495$ ✓'
      - section: 'Answer'
        say: 'So the volume is 495 cubic centimetres, which is answer choice D.'
        write: '$\therefore V = 495\ \text{cm}^{3}$ (D)'
        answer: true
    traps:
      A: 'You went for 990. That is double, from leaving out the half in the trapezium formula. The area is a half, times 18, times 5, which is 45, and 45 times 11 is 495.'
      B: 'You went for 880. That is 8 times 10 times 11, multiplying the two parallel sides. The face is a trapezium of area a half, times 8 plus 10, times 5, which is 45.'
      C: 'You went for 550. That is 10 times 5 times 11, treating the face as a rectangle. The top is only 8 cm, so it is a trapezium of area 45, and V is 495.'
  31:
    moments:
      - section: 'The question'
        say: 'Cut a 45 degree sector out of a paper circle of radius r, roll it up so the two straight edges meet, and you have a cone. We want the radius of its base.'
        write: 'Find the base radius of the cone.'
      - say: 'Write Solution, then draw the sector cut from its circle, with radius r and angle 45 degrees.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '45°', text: 'θ', 'on': 'angle 45 degrees'}
      - say: 'Now roll it into the cone. Two things happen. The radius r of the sector becomes the slant height of the cone, and the arc becomes the circle round the base.'
        write: 'Radius of sector $=$ slant height $= r$'
        show_sketch: sketch_b
        point:
          - {figure: sketch_b, kind: circle, target: {x: 270, y: 128}, text: 'slant height', 'on': 'the slant height'}
          - {figure: sketch_b, kind: circle, target: {x: 95, y: 56}, text: 'arc', 'on': 'the arc becomes'}
      - section: 'What we know'
        say: 'List the givens. The sector angle theta is 45 degrees, and its radius is r cm.'
        write: '$\theta = 45^{\circ}$, radius of sector $= r$ cm'
      - say: 'We want the base radius of the cone, so we give it a letter, capital R.'
        write: 'Let the base radius of the cone be $R$ cm.'
        point:
          - {figure: sketch_b, kind: circle, target: 'R = ?', text: 'base radius', 'on': 'capital R'}
      - section: 'The equation'
        say: 'Nothing is stretched when we roll, so the arc length of the sector equals the circumference of the base.'
        write: 'Arc length of sector $=$ circumference of base'
      - say: 'The arc length is theta over 360, times 2 pi r. The circumference of the base is 2 pi capital R.'
        write: '$\dfrac{\theta}{360} \times 2\pi r = 2\pi R$'
      - say: 'Substitute theta equals 45.'
        write: '$\dfrac{45}{360} \times 2\pi r = 2\pi R$'
      - say: '45 goes into 360 eight times, so 45 over 360 is 1 over 8.'
        write: '$\dfrac{1}{8} \times 2\pi r = 2\pi R$'
      - section: 'Solve for R'
        say: 'Divide both sides by 2 pi. On the left, 1 over 8 times r is left, and on the right, capital R.'
        write: '$\dfrac{r}{8} = R$'
      - say: 'Therefore the base radius of the cone is r over 8 cm.'
        write: '$\therefore R = \dfrac{r}{8}$ cm'
        point:
          - {figure: sketch_b, kind: label, target: 'R = ?', text: 'r/8', 'on': 'Therefore'}
      - section: 'Check'
        say: 'To check, the base circumference is 2 pi times r over 8, which is pi r over 4. The arc is 1 over 8 of 2 pi r, also pi r over 4. They match.'
        write: 'Check: $2\pi\left(\dfrac{r}{8}\right) = \dfrac{\pi r}{4} = \dfrac{1}{8} \times 2\pi r$ ✓'
      - section: 'Answer'
        say: 'So the base radius is r over 8 cm, which is answer choice B.'
        write: '$\therefore R = \dfrac{r}{8}$ cm (B)'
        answer: true
    traps:
      A: 'You went for r over 16. That divides by 2 once too often. From 1 over 8 times 2 pi r equals 2 pi R, dividing both sides by 2 pi gives R as r over 8.'
      C: 'You went for r over 4. That leaves out the 2 in the base circumference, 2 pi R. Arc equals 2 pi R gives R as r over 8.'
      D: 'You went for r over 2. The sector radius r becomes the slant height, not the base. The arc length equals the base circumference, so 1 over 8 of 2 pi r equals 2 pi R, and R is r over 8.'
  32:
    moments:
      - section: 'The question'
        say: 'We have a point $P$ equidistant from $L$ and $M$. Name the locus first. Many students give 8 or 10 here. Let''s find how far $P$ is from the line $LM$.'
        write: '$PL = PM$, $\ LM = 16$ cm, $\ PL = 10$ cm'
      - section: 'Solution'
        say: 'Solution. Let me sketch $L$, $M$ and the point $P$.'
        show_sketch: true
        write: 'Solution'
        point:
          - {figure: sketch, kind: highlight, target: LM, text: '16 cm'}
          - {figure: sketch, kind: highlight, target: PL, text: '10 cm'}
      - say: 'Name the standard locus. Points equidistant from two fixed points lie on the perpendicular bisector of the line joining them.'
        write: '$P$ lies on the perpendicular bisector of $LM$'
        point:
          - {figure: sketch, kind: underline, target: 'PL = PM'}
          - {figure: sketch, kind: highlight, target: PN, text: '⊥ bisector'}
      - say: 'The bisector meets $LM$ at its midpoint $N$, so $LN$ is half of 16, which is 8.'
        write: '$LN = \tfrac{1}{2} \times 16 = 8$ cm ($N$ is the midpoint)'
        point:
          - {figure: sketch, kind: circle, target: N, text: 'midpoint'}
      - say: 'And it meets $LM$ at right angles. The distance of $P$ from the line is measured along that perpendicular, so it is $PN$.'
        write: '$\angle LNP = 90^{\circ}$; distance of $P$ from $LM = PN$'
        point:
          - {figure: sketch, kind: arc, target: LNP, text: '90°'}
          - {figure: sketch, kind: circle, target: '?', text: 'PN'}
      - say: 'In the right-angled triangle $LNP$, the hypotenuse is $LP$. By Pythagoras, $PN$ squared is $LP$ squared minus $LN$ squared.'
        write: '$PN^{2} = LP^{2} - LN^{2}$ (Pythagoras)'
      - say: 'Substitute 10 for $LP$ and 8 for $LN$.'
        write: '$= 10^{2} - 8^{2}$'
        point:
          - {line: 6, kind: move, from: {line: 0, at: 'PL = [[10]]'}, at: '[[10]]2', text: 'LP'}
          - {line: 6, kind: move, from: {line: 3, at: '= [[8]] cm'}, at: '− [[8]]2', text: 'LN'}
      - say: '10 squared is 100, 8 squared is 64, and 100 minus 64 is 36.'
        write: '$= 100 - 64 = 36$'
      - say: 'The square root of 36 is 6.'
        write: '$PN = \sqrt{36} = 6$ cm'
        point:
          - {figure: sketch, kind: label, target: '?', text: '6 cm'}
      - section: 'Check'
        say: 'Check. 6, 8, 10 is twice the 3, 4, 5 triangle. 6 squared plus 8 squared is 36 plus 64, which is 100, or 10 squared.'
        write: 'Check: $6^{2} + 8^{2} = 36 + 64 = 100 = 10^{2}\ \checkmark$'
      - say: 'Therefore $P$ is 6 cm from $LM$, which is option D.'
        write: '$\therefore$ distance of $P$ from $LM = 6$ cm'
        answer: true
    traps:
      A: 'You went for 12 cm. That is longer than $LP$, the hypotenuse, so it cannot be a shorter side. Pythagoras gives $\sqrt{100 - 64} = 6$.'
      B: 'You went for 10 cm. That is $PL$, the distance from $P$ to the point $L$. The distance from the line $LM$ is the perpendicular one, 6 cm.'
      C: 'You went for 8 cm. That is $LN$, half of $LM$, along the line. The distance from the line is at right angles to it, so it is $\sqrt{10^{2} - 8^{2}} = 6$.'
  33:
    moments:
      - section: 'The question'
        say: 'A line makes an angle of 135 degrees with the positive $x$-axis, and passes through the point 2, 3. We want its equation.'
        write: 'Angle with positive $x$-axis $= 135^{\circ}$; through $(2,\ 3)$'
      - section: 'Solution'
        say: 'Solution. Let me draw the line through 2, 3, making 135 degrees with the positive $x$-axis.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '135°'}
          - {figure: sketch, kind: circle, target: '(2, 3)'}
      - section: 'The gradient'
        say: 'The gradient of a line is the tangent of the angle it makes with the positive $x$-axis.'
        write: '$m = \tan\theta$'
      - say: 'Here theta is 135 degrees.'
        write: '$= \tan 135^{\circ}$'
      - say: '135 degrees is in the second quadrant. By CAST, only sine is positive there, so tan is negative. 180 minus 135 is 45.'
        write: '$= -\tan(180^{\circ} - 135^{\circ}) = -\tan 45^{\circ}$'
        point:
          - {figure: sketch, kind: label, target: '135°', text: '180° − 135° = 45°'}
      - say: 'Tan 45 degrees is 1.'
        write: '$\therefore\ m = -1$'
      - section: 'The equation'
        say: 'Label the point. Let $x$ 1, $y$ 1 be 2, 3.'
        write: 'Let $(x_{1},\ y_{1}) = (2,\ 3)$'
      - say: 'The equation of a line through a point, with gradient $m$, is $y$ minus $y$ 1 equals $m$ times, $x$ minus $x$ 1.'
        write: '$y - y_{1} = m(x - x_{1})$'
      - say: 'Substitute $m$ equals negative 1, $x$ 1 equals 2 and $y$ 1 equals 3.'
        write: '$y - 3 = -1(x - 2)$'
      - say: 'Expand the bracket. Negative 1 times $x$ is negative $x$, and negative 1 times negative 2 is plus 2.'
        write: '$y - 3 = -x + 2$'
      - say: 'Add $x$ to both sides, and add 3 to both sides. 2 plus 3 is 5.'
        write: '$x + y = 5$'
      - section: 'Check'
        say: 'Check that 2, 3 is on the line, and 2 plus 3 is 5.'
        write: 'Check: $2 + 3 = 5\ \checkmark$'
        point:
          - {figure: sketch, kind: circle, target: '(2, 3)', text: '2 + 3 = 5'}
      - say: 'Therefore the equation of the line is $x$ plus $y$ equals 5, which is answer choice C.'
        write: '$\therefore\ x + y = 5$'
        answer: true
        point:
          - {figure: sketch, kind: label, target: 'line = ?', text: 'x + y = 5'}
    traps:
      A: 'You went for $x$ minus $y$ equals 1. That line has gradient positive 1, but tan 135 degrees is negative 1. It also misses the point, because 2 minus 3 is negative 1, not 1.'
      B: 'You went for $x$ plus $y$ equals 1. The gradient is right, but the line must pass through 2, 3, and 2 plus 3 is 5, not 1.'
      D: 'You went for $x$ minus $y$ equals 5. That line has gradient positive 1, and 2 minus 3 is not 5. Tan 135 degrees is negative 1, which gives $x$ plus $y$ equals 5.'
  34:
    moments:
      - section: 'The question'
        say: 'We want the distance from the point Q, 4, 3, to the point where the lines $2x$ minus $y$ equals 4 and $x$ plus $y$ equals 2 meet.'
        write: 'Distance from $Q(4,\ 3)$ to the point common to $2x - y = 4$ and $x + y = 2$'
      - section: 'Solution'
        say: 'Solution. Let me draw the two lines and plot Q. The point common to both lines is where they cross.'
        write: 'Solution'
        diagram:
          id: g
          kind: graph
          x: [-1, 5]
          y: [-4, 5]
          step: 1
          plots:
            - {fn: '2x - 4', label: '2x − y = 4', colour: blue}
            - {fn: '2 - x', label: 'x + y = 2', colour: purple}
          points:
            - {x: 4, y: 3, text: 'Q (4, 3)'}
          'on': 'draw'
      - section: 'The common point'
        say: 'Number the two equations, 1 and 2.'
        write: '$2x - y = 4 \quad \ldots (1)$'
      - say: 'And $x$ plus $y$ equals 2 is equation 2.'
        write: '$x + y = 2 \quad \ldots (2)$'
      - say: 'The $y$ terms have opposite signs, so add the equations to eliminate $y$. $2x$ plus $x$ is $3x$, and 4 plus 2 is 6.'
        write: '(1) + (2): $3x = 6$'
      - say: 'Divide both sides by 3.'
        write: '$\therefore\ x = 2$'
      - say: 'Put $x$ equals 2 into equation 2.'
        write: 'In (2): $2 + y = 2$'
      - say: 'Subtract 2 from both sides.'
        write: '$\therefore\ y = 0$'
      - say: 'So the lines meet at the point 2, 0. Let us call it P.'
        write: 'Common point: $P(2,\ 0)$'
        diagram_do:
          - {id: g, op: point, x: 2, y: 0, text: 'P (2, 0)', colour: orange, 'on': 'meet'}
      - section: 'The distance'
        say: 'Label the points. Let $x$ 1, $y$ 1 be P, 2, 0, and $x$ 2, $y$ 2 be Q, 4, 3.'
        write: 'Let $(x_{1},\ y_{1}) = (2,\ 0)$ and $(x_{2},\ y_{2}) = (4,\ 3)$'
      - say: 'The distance formula is the square root of, $x$ 2 minus $x$ 1 squared, plus $y$ 2 minus $y$ 1 squared.'
        write: '$|PQ| = \sqrt{(x_{2} - x_{1})^{2} + (y_{2} - y_{1})^{2}}$'
      - say: 'Substitute the two points.'
        write: '$= \sqrt{(4 - 2)^{2} + (3 - 0)^{2}}$'
      - say: '4 minus 2 is 2, and 3 minus 0 is 3.'
        write: '$= \sqrt{2^{2} + 3^{2}}$'
      - say: '2 squared is 4, and 3 squared is 9.'
        write: '$= \sqrt{4 + 9}$'
      - say: '4 plus 9 is 13.'
        write: '$\therefore\ |PQ| = \sqrt{13}$'
      - section: 'Check'
        say: 'To check, we used equation 2 to find $y$, so test P in equation 1. 2 times 2, minus 0, is 4.'
        write: 'Check $P$ in (1): $2(2) - 0 = 4\ \checkmark$'
        diagram_do:
          - {id: g, op: highlight, part: 'point:2', text: 'on both lines'}
      - say: 'Therefore the distance is root 13, which is answer choice D.'
        write: '$\therefore$ distance $= \sqrt{13}$'
        answer: true
    traps:
      A: 'You went for 3 root 10, which is root 90. That is far too long. The lines meet at 2, 0, and from 4, 3 the differences are just 2 and 3, giving root 13.'
      B: 'You went for 3 root 5, which is root 45. Check the common point. Adding the equations gives $3x$ equals 6, so $x$ is 2 and $y$ is 0. The distance is then root of 4 plus 9.'
      C: 'You went for root 26. That is double the right number under the root. From 4, 3 to 2, 0 the differences are 2 and 3, and 4 plus 9 is 13.'
  35:
    moments:
      - section: 'The question'
        say: 'From an instrument on the ground, the angle of elevation of the top of a building is 30 degrees. The building is 40 m high. How far is the instrument from the foot of the building?'
        write: 'Elevation $= 30^{\circ}$, height $= 40$ m, distance $= ?$'
        doodle: {name: 'custom:1997_q35_a', id: site, caption: 'how far is the instrument?'}
      - section: 'Solution'
        say: 'Solution. Let me draw the triangle. The instrument is at $A$, the foot of the building at $B$, and the top at $C$. The building stands upright, so the right angle is at $B$.'
        write: 'Solution: $\triangle ABC$, $\ \angle ABC = 90^{\circ}$'
        show_sketch: true
        'on': 'draw'
        point:
          - {figure: sketch, kind: circle, target: B, text: 'right angle'}
      - say: 'The angle of elevation is measured up from the horizontal ground, at $A$. Write the givens on the sketch, 30 degrees at $A$, and $BC$ is 40 m.'
        write: '$\angle BAC = 30^{\circ}$, $\ |BC| = 40$ m'
        point:
          - {figure: sketch, kind: arc, target: BAC, text: '30°'}
          - {figure: sketch, kind: highlight, target: BC, text: '40 m'}
      - say: 'Let $d$ be the distance we want, from the instrument to the foot of the building.'
        write: 'Let $|AB| = d$ m'
        point:
          - {figure: sketch, kind: underline, target: AB, text: 'd'}
      - say: 'Label the sides from the 30 degree angle. The building, 40, is opposite it. The ground, $d$, is next to it, so it is the adjacent.'
        write: 'From $30^{\circ}$: opp $= 40$, adj $= d$'
        doodle_do:
          - {id: site, op: highlight, part: building, text: 'opp: 40 m'}
          - {id: site, op: label, part: ground, text: 'adj: d'}
      - say: 'Opposite and adjacent are involved, so by SOH CAH TOA we use TOA, where tangent is opposite over adjacent.'
        write: 'TOA: $\tan\theta = \dfrac{\text{opp}}{\text{adj}}$'
      - say: 'Substitute, and tan 30 degrees equals 40 over $d$.'
        write: '$\tan 30^{\circ} = \dfrac{40}{d}$'
      - say: 'Cross-multiply, so $d$ times tan 30 is 40. Then divide both sides by tan 30.'
        write: '$d = \dfrac{40}{\tan 30^{\circ}}$'
      - say: 'Tan 30 is a special angle. From half an equilateral triangle, with sides 1, root 3 and 2, tan 30 is 1 over root 3.'
        write: '$\tan 30^{\circ} = \dfrac{1}{\sqrt{3}}$ (special angle)'
      - say: 'So $d$ is 40 divided by 1 over root 3. Dividing by a fraction means multiplying by it turned upside down, which gives 40 times root 3.'
        write: '$d = 40 \div \dfrac{1}{\sqrt{3}} = 40 \times \sqrt{3}$'
      - say: 'That is $40\sqrt{3}$ metres.'
        write: '$= 40\sqrt{3}$ m'
        point:
          - {figure: sketch, kind: label, target: 'd = ?', text: '40√3 m'}
      - section: 'Check'
        say: 'To check, root 3 is about 1.73, so the distance is about 69 m. A shallow 30 degree angle means we stand far off, so the distance should be more than the 40 m height. It is.'
        write: 'Check: $40\sqrt{3} \approx 40 \times 1.73 \approx 69$ m $> 40$ m $\checkmark$'
        doodle_do:
          - {id: site, op: label, part: ground, text: 'd ≈ 69 m'}
      - section: 'Answer'
        say: 'Therefore the instrument is $40\sqrt{3}$ m from the foot of the building, which is answer choice B.'
        write: '$\therefore d = 40\sqrt{3}$ m'
        answer: true
        point:
          - {figure: sketch, kind: circle, target: 'd = ?', text: '40√3 m'}
    traps:
      A: 'You went for $20\sqrt{3}$ m. That is half the answer, as if the building were 20 m. From TOA, $\tan 30^{\circ} = \tfrac{40}{d}$, so $d = 40 \div \tfrac{1}{\sqrt{3}} = 40\sqrt{3}$.'
      C: 'You went for $\tfrac{40}{\sqrt{3}}$ m. That is 40 times tan 30, multiplying where you should divide. It is about 23 m, closer than the building is tall, which a shallow 30 degree angle rules out.'
      D: 'You went for $\tfrac{20}{\sqrt{3}}$ m. That multiplies by tan 30 instead of dividing, and uses 20 in place of the 40 m height. From $\tan 30^{\circ} = \tfrac{40}{d}$, $d = 40\sqrt{3}$.'
  36:
    moments:
      - section: 'The question'
        say: 'We have two sides and the angle between them. Many students forget the cos term and get 5. Use the cosine rule, with cos 60 equal to a half.'
        write: '$XY = 3$ cm, $YZ = 4$ cm, $\angle XYZ = 60^{\circ}$; $\ XZ = ?$'
      - section: 'Solution'
        say: 'Solution. Let me sketch triangle $XYZ$ with the 60 degree angle at $Y$, between the sides 3 cm and 4 cm.'
        show_sketch: true
        write: 'Solution'
        point:
          - {figure: sketch, kind: highlight, target: XY, text: '3 cm'}
          - {figure: sketch, kind: highlight, target: YZ, text: '4 cm'}
          - {figure: sketch, kind: arc, target: XYZ, text: '60°'}
      - say: 'Name each side by the angle opposite it. Let $XZ$ be $y$, opposite $Y$. Then $x$ is $YZ$, 4, and $z$ is $XY$, 3.'
        write: 'Let $XZ = y$; $\ x = YZ = 4,\ z = XY = 3,\ Y = 60^{\circ}$'
        point:
          - {figure: sketch, kind: underline, target: XZ, text: 'opposite 60°'}
      - say: 'We have two sides and the included angle, so the cosine rule gives the third side.'
        write: '$y^{2} = x^{2} + z^{2} - 2xz\cos Y$ (cosine rule)'
      - say: 'Substitute, with $x$ as 4, $z$ as 3, and $Y$ as 60 degrees.'
        write: '$y^{2} = 4^{2} + 3^{2} - 2(4)(3)\cos 60^{\circ}$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: 'YZ = [[4]]'}, at: '= [[4]]2 +', text: 'x'}
          - {line: 4, kind: move, from: {line: 2, at: 'XY = [[3]]'}, at: '+ [[3]]2', text: 'z'}
      - say: '4 squared is 16, 3 squared is 9, and 2 times 4 times 3 is 24. Cos 60 is a half.'
        write: '$= 16 + 9 - 24 \times \dfrac{1}{2}$'
      - say: '16 plus 9 is 25, and half of 24 is 12. 25 minus 12 is 13.'
        write: '$= 25 - 12 = 13$'
      - say: 'Take the square root of both sides.'
        write: '$y = \sqrt{13}$ cm'
        point:
          - {figure: sketch, kind: label, target: '?', text: '√13 cm'}
      - section: 'Check'
        say: 'To check, with a right angle at $Y$, Pythagoras would give root 25, which is 5. A 60 degree angle is smaller, so the side must be shorter than 5. Root 13 is about 3.6.'
        write: 'Check: $\sqrt{13} \approx 3.6 < 5\ \checkmark$'
      - say: 'Therefore $XZ$ is root 13 cm, which is option B.'
        write: '$\therefore XZ = \sqrt{13}$ cm'
        answer: true
    traps:
      A: 'You went for root 23. Check the term you subtract. 2 times 4 times 3 times cos 60 is 24 times a half, which is 12. So 25 minus 12 is 13.'
      C: 'You went for 2 root 5, which is root 20. The term to subtract is 12, not 5. 25 minus 12 is 13, so $XZ$ is root 13.'
      D: 'You went for 2 root 3, which is root 12. That is the size of the term you subtract, not the answer. 25 minus 12 is 13.'
  37:
    moments:
      - section: 'The question'
        say: 'In the figure, $XY$ is 5 cm and $XZ$ is 2 cm. $XZ$ is produced to $E$, and angle $YZE$ is 150 degrees. We want sine theta, where theta is the angle at $Y$.'
        write: '$|XY| = 5$ cm, $|XZ| = 2$ cm, $\angle YZE = 150^{\circ}$, $\angle XYZ = \theta$'
        point:
          - {figure: 0, kind: highlight, target: XY, text: '5 cm'}
          - {figure: 0, kind: highlight, target: XZ, text: '2 cm'}
          - {figure: 0, kind: arc, target: YZE, text: '150°'}
      - section: 'Solution'
        say: 'Solution. First bring the 150 degrees inside the triangle. $X$, $Z$ and $E$ are on a straight line, so angle $XZY$ is 180 minus 150, by angles on a straight line.'
        write: 'Solution: $\angle XZY = 180^{\circ} - 150^{\circ} = 30^{\circ}$ ($\angle$s on a str. line)'
        point:
          - {figure: 0, kind: arc, target: XZY, text: '30°'}
      - say: 'Now we know two sides, and an angle opposite one of them. That calls for the sine rule, where each side is over the sine of the angle opposite it.'
        write: 'Sine rule: $\dfrac{a}{\sin A} = \dfrac{b}{\sin B}$'
      - say: 'Pair each side with the angle facing it. $XZ$ faces theta, at $Y$. $XY$ faces the 30 degrees at $Z$.'
        write: '$\dfrac{|XZ|}{\sin\theta} = \dfrac{|XY|}{\sin\angle XZY}$'
        point:
          - {figure: 0, kind: underline, target: 'XZ', text: 'faces θ'}
          - {figure: 0, kind: underline, target: 'XY', text: 'faces 30°'}
      - say: 'Substitute, and 2 over sine theta equals 5 over sine 30.'
        write: '$\dfrac{2}{\sin\theta} = \dfrac{5}{\sin 30^{\circ}}$'
      - say: 'Cross-multiply, so 5 sine theta equals 2 sine 30.'
        write: '$5\sin\theta = 2\sin 30^{\circ}$'
      - say: 'Divide both sides by 5. Sine 30 is a half, a special angle.'
        write: '$\sin\theta = \dfrac{2 \times \frac{1}{2}}{5}$'
      - say: '2 times a half is 1. So sine theta is 1 over 5.'
        write: '$= \dfrac{1}{5}$'
      - section: 'Check'
        say: 'To check, the shorter side faces the smaller angle. $XZ$, 2 cm, is shorter than $XY$, 5 cm, so theta must be smaller than 30 degrees, and its sine less than a half. 1 over 5 is.'
        write: 'Check: $2 < 5 \Rightarrow \theta < 30^{\circ}$; $\ \dfrac{1}{5} < \dfrac{1}{2}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore sine theta is 1 over 5, which is answer choice D.'
        write: '$\therefore \sin\theta = \dfrac{1}{5}$'
        answer: true
        point:
          - {figure: 0, kind: label, target: θ, text: 'sin θ = 1/5'}
    traps:
      A: 'You went for 3 over 5. That treats $XYZ$ as a 3, 4, 5 right-angled triangle, but there is no right angle here. The sine rule gives $\tfrac{2}{\sin\theta} = \tfrac{5}{\sin 30^{\circ}}$, so $\sin\theta = \tfrac{1}{5}$.'
      B: 'You went for a half. That is sine 30 degrees, the angle at $Z$. The question wants the angle at $Y$, and the sine rule gives 1 over 5.'
      C: 'You went for 2 over 5. That is the two sides divided, without sine 30. Cross-multiplying gives $5\sin\theta = 2 \times \tfrac{1}{2}$, so $\sin\theta = \tfrac{1}{5}$.'
  38:
    moments:
      - section: 'The question'
        say: 'This is a fraction with a single term at the bottom. Before differentiating, divide every term on top by $3x$ squared, and then it is only powers of $x$.'
        write: '$y = \dfrac{6x^{3} - 5x^{2} + 1}{3x^{2}}$'
      - section: 'Solution'
        say: 'Solution. Divide each term on top by $3x$ squared.'
        write: '$y = \dfrac{6x^{3}}{3x^{2}} - \dfrac{5x^{2}}{3x^{2}} + \dfrac{1}{3x^{2}}$'
      - say: '6 over 3 is 2, and $x$ cubed over $x$ squared is $x$. The $x$ squared cancels in the middle term. And 1 over $x$ squared is $x$ to the power minus 2.'
        write: '$y = 2x - \dfrac{5}{3} + \dfrac{1}{3}x^{-2}$'
      - say: 'The power rule says multiply by the power, then reduce the power by 1.'
        'on': 'power rule'
        write: 'If $y = ax^{n}$, $\ \dfrac{dy}{dx} = nax^{n-1}$'
      - say: 'Go term by term. $2x$ gives 2. The constant 5 over 3 gives 0. For 1 over 3 $x$ to the minus 2, multiply by minus 2, and minus 2 minus 1 is minus 3.'
        write: '$\dfrac{dy}{dx} = 2 - 0 + \dfrac{1}{3}(-2)x^{-2-1}$'
        point:
          - {line: 3, kind: box, text: 'the rule'}
      - say: '1 over 3 times minus 2 is minus 2 over 3.'
        write: '$= 2 - \dfrac{2}{3}x^{-3}$'
      - say: '$x$ to the minus 3 is 1 over $x$ cubed.'
        write: '$= 2 - \dfrac{2}{3x^{3}}$'
      - section: 'Check'
        say: 'Check at $x$ equals 1 with the quotient rule. The top is 2 there and its derivative, $18x$ squared minus $10x$, is 8. The bottom is 3, and its derivative is 6.'
        write: 'Check at $x = 1$: $\dfrac{v\frac{du}{dx} - u\frac{dv}{dx}}{v^{2}} = \dfrac{3(8) - 2(6)}{3^{2}} = \dfrac{12}{9} = \dfrac{4}{3}$'
      - say: 'Our answer at $x$ equals 1 is 2 minus 2 over 3, which is 4 over 3. They agree.'
        write: '$2 - \dfrac{2}{3(1)^{3}} = \dfrac{4}{3}\ \checkmark$'
      - say: 'Therefore $\dfrac{dy}{dx}$ is 2 minus 2 over $3x$ cubed, which is answer choice C.'
        write: '$\therefore \dfrac{dy}{dx} = 2 - \dfrac{2}{3x^{3}}$'
        answer: true
    traps:
      A: 'You went for 2 plus 2 over $3x^{3}$. The power minus 2 comes down as a minus. $\tfrac{1}{3} \times (-2)$ is minus 2 over 3, so the last term subtracts.'
      B: 'You went for 2 plus 1 over $6x$. Write $\tfrac{1}{3x^{2}}$ as $\tfrac{1}{3}x^{-2}$, then multiply by the power, minus 2, and reduce the power to minus 3.'
      D: 'You went for 2 minus 1 over $6x$. Differentiating $\tfrac{1}{3}x^{-2}$ multiplies by minus 2 and reduces the power by 1, giving $-\tfrac{2}{3}x^{-3}$.'
  39:
    moments:
      - section: 'The question'
        say: 'Cos of a bracket is a function inside a function. Picture two machines in a row. $x$ goes into the inside machine, and what comes out goes into the cos machine.'
        write: '$y = \cos(3x^{2} - 2x)$'
        doodle: {name: 'custom:1997_q39_a', id: chain, caption: 'an inside machine, then cos', size: scene}
      - section: 'Solution'
        say: 'Solution. This is a function of a function. Let $u$ be the inside, $3x$ squared minus $2x$. Then $y$ is cos $u$.'
        'on': 'function of a function'
        write: 'Let $u = 3x^{2} - 2x$, $\ \therefore y = \cos u$'
        doodle_do:
          - {id: chain, op: circle, part: inner, text: 'u'}
      - say: 'In the outside machine, cos $u$ differentiates to minus sine $u$. That minus is part of the rule.'
        write: '$\dfrac{dy}{du} = -\sin u$'
        doodle_do:
          - {id: chain, op: stage, stage: 'custom:1997_q39_a2'}
      - say: 'In the inside machine, $3x$ squared gives $6x$, and minus $2x$ gives minus 2.'
        write: '$\dfrac{du}{dx} = 6x - 2$'
        doodle_do:
          - {id: chain, op: stage, stage: 'custom:1997_q39_a3'}
      - say: 'The chain rule says $\dfrac{dy}{dx}$ equals $\dfrac{dy}{du}$ times $\dfrac{du}{dx}$.'
        'on': 'chain rule'
        write: '$\dfrac{dy}{dx} = \dfrac{dy}{du} \times \dfrac{du}{dx}$'
      - say: 'Substitute the two results, and we get minus sine $u$, times $6x$ minus 2. The picture multiplies the two machines'' rates.'
        write: '$= -\sin u \times (6x - 2)$'
        doodle_do:
          - {id: chain, op: stage, stage: 'custom:1997_q39_a4'}
        point:
          - {line: 5, kind: move, from: {line: 3, at: '= [[6x − 2]]'}, at: '(6x − 2)', text: 'du/dx'}
      - say: 'Put back $u$ equals $3x$ squared minus $2x$, and write the bracket $6x$ minus 2 in front.'
        write: '$= -(6x - 2)\sin(3x^{2} - 2x)$'
      - section: 'Check'
        say: 'Check the two things that survive, which are the minus from differentiating cos, and the inside bracket, unchanged, inside the sine.'
        write: 'Check: minus from $\cos$; $\ (3x^{2} - 2x)$ unchanged inside $\sin$'
      - say: 'Therefore the derivative is minus bracket $6x$ minus 2, times sine of $3x$ squared minus $2x$. That is answer choice D.'
        write: '$\therefore \dfrac{d}{dx}\cos(3x^{2} - 2x) = -(6x - 2)\sin(3x^{2} - 2x)$'
        answer: true
    traps:
      A: 'You went for minus sine of $6x - 2$. That puts $\dfrac{du}{dx}$ inside the sine. The chain rule keeps $u$ inside and MULTIPLIES by $\dfrac{du}{dx}$, which is $6x - 2$.'
      B: 'You went for minus sine of $3x^{2} - 2x$. That is only $\dfrac{dy}{du}$. You must multiply by $\dfrac{du}{dx}$, which is $6x - 2$.'
      C: 'You went for $(6x - 2)\sin(3x^{2} - 2x)$ with no minus. Cos differentiates to minus sine, so the minus must stay.'
  40:
    moments:
      - section: 'The question'
        say: 'The gradient of a curve at a point is how steep it is there. Picture a walker on a hill at $x$ equals 1. How steep is it under his feet?'
        write: '$y = 2\sqrt{x} - \dfrac{1}{x}$'
        doodle: {name: 'custom:1997_q40_a', id: hill, caption: 'how steep is it at x = 1?'}
      - section: 'Solution'
        say: 'Solution. The gradient is $\dfrac{dy}{dx}$. First rewrite both terms as indices. Root $x$ is $x$ to the power a half, and 1 over $x$ is $x$ to the power minus 1.'
        write: '$y = 2x^{\frac{1}{2}} - x^{-1}$'
      - say: 'The power rule tells us to multiply by the power, then reduce the power by 1.'
        'on': 'power rule'
        write: 'If $y = ax^{n}$, $\ \dfrac{dy}{dx} = nax^{n-1}$'
      - say: 'The first term gives 2 times a half, power a half minus 1. The second term gives minus 1 times minus 1, power minus 1 minus 1.'
        write: '$\dfrac{dy}{dx} = 2 \times \tfrac{1}{2}x^{\frac{1}{2} - 1} - (-1)x^{-1-1}$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
      - say: '2 times a half is 1, and a half minus 1 is minus a half. Minus times minus is plus, and the power is minus 2.'
        write: '$= x^{-\frac{1}{2}} + x^{-2}$'
      - say: 'Write the indices back as fractions, and we get 1 over root $x$, plus 1 over $x$ squared.'
        write: '$= \dfrac{1}{\sqrt{x}} + \dfrac{1}{x^{2}}$'
      - section: 'At x = 1'
        say: 'Now substitute $x$ equals 1, where the walker stands.'
        write: 'At $x = 1$, $\ \dfrac{dy}{dx} = \dfrac{1}{\sqrt{1}} + \dfrac{1}{1^{2}}$'
        doodle_do:
          - {id: hill, op: pulse, part: walker}
      - say: 'Root 1 is 1, and 1 squared is 1. 1 plus 1 is 2, so for every 1 step across, the hill climbs 2.'
        write: '$= 1 + 1 = 2$'
        doodle_do:
          - {id: hill, op: stage, stage: 'custom:1997_q40_a2'}
        point:
          - {line: 7, kind: highlight, at: '= 2', to: {doodle: hill, part: slope}}
      - say: 'Therefore the gradient of the curve at $x$ equals 1 is 2, which is answer choice C.'
        write: '$\therefore$ gradient at $x = 1$ is $2$'
        answer: true
    traps:
      A: 'You went for 0. That comes from minus $x^{-2}$ for the second term. Differentiating minus $x^{-1}$ multiplies by minus 1. Minus times minus is plus, so it is $1 + 1 = 2$.'
      B: 'You went for 1. That counts only one term. At $x = 1$, both $\tfrac{1}{\sqrt{x}}$ and $\tfrac{1}{x^{2}}$ are 1, so the gradient is 2.'
      D: 'You went for 3. That happens if $2x^{\frac{1}{2}}$ gives 2 instead of 1. 2 times a half is 1, so the gradient is $1 + 1 = 2$.'
  41:
    moments:
      - section: 'The question'
        say: 'Integration is the reverse of differentiation. We need two standard integrals here, one for 1 over $x$, and one for cos $x$.'
        write: '$\displaystyle\int \left(\dfrac{1}{x} + \cos x\right)dx$'
      - section: 'Solution'
        say: 'Solution. Integrate term by term.'
        write: '$= \displaystyle\int \dfrac{1}{x}\,dx + \int \cos x\,dx$'
      - say: 'The power rule says add 1 to the power, and divide by the new power. It works for every power except minus 1.'
        write: '$\displaystyle\int x^{n}\,dx = \dfrac{x^{n+1}}{n+1} + c$, $\ n \neq -1$'
      - say: '1 over $x$ is $x$ to the minus 1. The new power would be minus 1 plus 1, which is 0, and we cannot divide by 0.'
        write: '$\dfrac{1}{x} = x^{-1}$: $\ \dfrac{x^{-1+1}}{-1+1} = \dfrac{x^{0}}{0}$, not allowed'
      - say: 'So 1 over $x$ has its own standard integral, which is the natural logarithm of $x$, $\ln x$, because $\ln x$ differentiates to 1 over $x$.'
        'on': 'standard integral'
        write: '$\displaystyle\int \dfrac{1}{x}\,dx = \ln x + c$, since $\dfrac{d}{dx}(\ln x) = \dfrac{1}{x}$'
        doodle: {name: 'custom:1997_q41_a', id: cards, caption: 'integrating walks back the arrow'}
      - say: 'And sine $x$ differentiates to cos $x$, so cos $x$ integrates to sine $x$.'
        write: '$\displaystyle\int \cos x\,dx = \sin x + c$, since $\dfrac{d}{dx}(\sin x) = \cos x$'
        doodle_do:
          - {id: cards, op: stage, stage: 'custom:1997_q41_a2'}
      - say: 'Put the two together, with one constant of integration. The options call it $k$.'
        write: '$= \ln x + \sin x + k$'
        doodle_do:
          - {id: cards, op: label, part: back1, text: '+ k: a constant is lost going forward'}
      - section: 'Check'
        say: 'Check by differentiating back. $\ln x$ gives 1 over $x$, sine $x$ gives cos $x$, and $k$ gives 0.'
        write: 'Check: $\dfrac{d}{dx}(\ln x + \sin x + k) = \dfrac{1}{x} + \cos x\ \checkmark$'
      - say: 'Therefore the integral is $\ln x$ plus sine $x$ plus $k$, which is answer choice B.'
        write: '$\therefore \displaystyle\int \left(\dfrac{1}{x} + \cos x\right)dx = \ln x + \sin x + k$'
        answer: true
    traps:
      A: 'You went for $-\dfrac{1}{x^{2}} + \sin x + k$. Minus 1 over $x^{2}$ is what you get by DIFFERENTIATING 1 over $x$. Integrating 1 over $x$ gives $\ln x$.'
      C: 'You went for $\ln x - \sin x + k$. The first term is right, but cos $x$ integrates to plus sine $x$, because sine $x$ differentiates to cos $x$.'
      D: 'You went for $-\dfrac{1}{x^{2}} - \sin x + k$. Both terms have been differentiated instead of integrated. Integrating gives $\ln x + \sin x + k$.'
  42:
    moments:
      - section: 'The question'
        say: 'We have $y$ equals $x$ times, bracket, $x$ to the 4 plus $x$ squared plus 1, and we want the integral of $y$ from minus 1 to 1. Let me draw the curve.'
        write: '$y = x(x^{4} + x^{2} + 1)$; $\ \displaystyle\int_{-1}^{1} y\,dx = ?$'
        diagram:
          id: g
          kind: graph
          x: [-1.5, 1.5]
          y: [-4, 4]
          step: 0.5
          y_step: 1
          plots:
            - {fn: 'x^5 + x^3 + x', label: 'y = x⁵ + x³ + x', colour: blue}
      - section: 'Solution'
        say: 'Solution. First open the bracket. $x$ times $x$ to the 4 is $x$ to the 5, $x$ times $x$ squared is $x$ cubed, and $x$ times 1 is $x$.'
        write: 'Solution: $y = x^{5} + x^{3} + x$'
      - say: 'To integrate a power of $x$, add 1 to the power, and divide by the new power. Then add $c$, the constant of integration.'
        write: '$\displaystyle\int x^{n}\,dx = \dfrac{x^{n+1}}{n+1} + c$'
      - say: 'Integrate term by term. $x$ to the 5 becomes $x$ to the 6 over 6, $x$ cubed becomes $x$ to the 4 over 4, and $x$ becomes $x$ squared over 2.'
        write: '$\displaystyle\int_{-1}^{1} y\,dx = \left[\dfrac{x^{6}}{6} + \dfrac{x^{4}}{4} + \dfrac{x^{2}}{2}\right]_{-1}^{1}$'
      - section: 'Upper minus lower'
        say: 'Substitute the upper limit, 1, then subtract the value at the lower limit, minus 1. Put each in its own bracket.'
        write: '$= \left(\dfrac{1^{6}}{6} + \dfrac{1^{4}}{4} + \dfrac{1^{2}}{2}\right) - \left(\dfrac{(-1)^{6}}{6} + \dfrac{(-1)^{4}}{4} + \dfrac{(-1)^{2}}{2}\right)$'
      - say: 'Every power of 1 is 1. The powers of minus 1 here are all even, so each is plus 1 too.'
        write: '$= \left(\dfrac{1}{6} + \dfrac{1}{4} + \dfrac{1}{2}\right) - \left(\dfrac{1}{6} + \dfrac{1}{4} + \dfrac{1}{2}\right)$'
      - say: 'Add each bracket. The L.C.M. of 6, 4 and 2 is 12. 2 over 12, plus 3 over 12, plus 6 over 12, is 11 over 12.'
        write: '$= \dfrac{2 + 3 + 6}{12} - \dfrac{2 + 3 + 6}{12}$ (L.C.M. $= 12$)'
      - say: '11 over 12 minus 11 over 12 is 0.'
        write: '$= \dfrac{11}{12} - \dfrac{11}{12} = 0$'
      - section: 'Check'
        say: 'Here is an exam tip, as a check. $y$ has only odd powers, so putting minus $x$ in place of $x$ gives minus $y$. That makes $y$ an odd function.'
        write: 'Check: $y(-x) = -x^{5} - x^{3} - x = -y$'
      - say: 'On the graph, the part below the axis from minus 1 to 0 is the same size as the part above it from 0 to 1. So they cancel, and the integral is 0.'
        write: 'Odd function on $[-1,\ 1]$: $\ \displaystyle\int_{-1}^{1} y\,dx = 0\ \checkmark$'
        diagram_do:
          - {id: g, op: shade, part: 'plot:1', x: [-1, 0], colour: red, text: 'below the axis'}
          - {id: g, op: shade, part: 'plot:1', x: [0, 1], colour: green, text: 'above: same size'}
      - say: 'Therefore the integral is 0, which is option D.'
        write: '$\therefore \displaystyle\int_{-1}^{1} y\,dx = 0$'
        answer: true
    traps:
      A: 'You went for 11 over 12. That is the value at the upper limit only. Subtract the value at the lower limit, which is also 11 over 12, giving 0.'
      B: 'You went for 11 over 16. Use the L.C.M. 12. 1 over 6 plus 1 over 4 plus 1 over 2 is 11 over 12 at each limit, and upper minus lower is 0.'
      C: 'You went for 5 over 6. Every bracket is 11 over 12, and the lower one must be subtracted from the upper one, which gives 0.'
  43:
    moments:
      - section: 'The question'
        say: 'The pie chart shows how a civil servant''s monthly income of ₦6,000 is shared out. We want his monthly basic salary.'
        write: 'Income $=$ ₦6,000. Basic salary $= ?$'
      - section: 'Solution'
        say: 'Solution. Basic has no angle marked, so we find it first. From the chart, Housing is 69, Transport 60, Meal 61 and Others 50 degrees.'
        write: 'Housing $69^{\circ}$, Transport $60^{\circ}$, Meal $61^{\circ}$, Others $50^{\circ}$'
        point:
          - {figure: 0, kind: circle, target: '69°'}
          - {figure: 0, kind: circle, target: '60°'}
          - {figure: 0, kind: circle, target: '61°'}
      - say: 'The angles at the centre make 360 degrees. So Basic is 360 minus the sum of the other four.'
        write: 'Basic $= 360^{\circ} - (69^{\circ} + 60^{\circ} + 61^{\circ} + 50^{\circ})$'
        point:
          - {figure: 0, kind: circle, target: '50°'}
      - say: '69 plus 60 is 129, plus 61 is 190, plus 50 is 240. So it is 360 minus 240.'
        write: '$= 360^{\circ} - 240^{\circ}$'
      - say: '360 minus 240 is 120 degrees.'
        write: '$= 120^{\circ}$'
        point:
          - {figure: 0, kind: label, target: Basic, text: '120°'}
      - section: 'The basic salary'
        say: 'Now the formula. An item''s amount is its sectoral angle over 360, times the total amount.'
        write: 'Amount $= \dfrac{\text{sectoral angle}}{360^{\circ}} \times \text{total}$'
      - say: 'Substitute, where Basic is 120 degrees, and the total income is ₦6,000.'
        write: 'Basic salary $= \dfrac{120}{360} \times 6000$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '= 120'}, at: '120', text: 'Basic angle'}
          - {line: 6, kind: move, from: {line: 0, at: '6,000'}, at: '6000', text: 'income'}
      - say: '120 goes into 360 three times, so 120 over 360 is a third.'
        write: '$= \dfrac{1}{3} \times 6000$'
      - say: 'A third of 6000 is 2000.'
        write: '$= 2000$'
        point:
          - {line: 8, kind: highlight, at: '2000'}
      - section: 'Check'
        say: 'Check by going back. 2000 over 6000, times 360, is a third of 360, which is 120 degrees, the angle for Basic.'
        write: 'Check: $\dfrac{2000}{6000} \times 360^{\circ} = 120^{\circ}\ \checkmark$'
