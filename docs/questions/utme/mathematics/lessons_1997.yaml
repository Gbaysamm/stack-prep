        point:
          - {line: 6, kind: highlight, at: '25', to: {diagram: t, part: 'row:2'}}
      - section: 'Check'
        say: 'To check, 7 students come before the 8th, and 7 come after it, since 15 minus 8 is 7. The 8th really is the middle.'
        write: 'Check: $7$ before, $15 - 8 = 7$ after ✓'
      - section: 'Answer'
        say: 'So the median age is 25, which is option B.'
        write: '$\therefore$ Median $= 25$'
        answer: true
    traps:
      A: 'You went for 20. Age 20 covers only the first 3 students, cf 3. The median is the 8th student, and the cf column reaches 8 at age 25.'
      C: 'You went for 30, the middle of the ages in the top row. The median is the middle student, not the middle column, and the 8th of 15 students is aged 25.'
