# UTME 1997 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1997.yaml. Answers match that file.
format_version: 1
exam_year: 1997
lessons:
  1:
    moments:
      - say: 'We''re told that the base 4 numeral $1P03$ is equal to 115 in base ten, and we want the missing digit $P$.'
        write: '$(1P03)_{4} = 115_{10}$'
      - say: 'In base 4, each column is worth a power of 4. Starting from the right, the columns are worth 1, 4, 16 and 64.'
        write: '$4^{3} = 64,\ 4^{2} = 16,\ 4^{1} = 4,\ 4^{0} = 1$'
      - say: 'So let''s multiply each digit by the value of its column and add them up.'
        write: '$(1 \times 64) + (P \times 16) + (0 \times 4) + (3 \times 1)$'
      - say: '1 times 64 is 64. $P$ times 16 is $16P$. 0 times 4 is 0. And 3 times 1 is 3.'
        write: '$= 64 + 16P + 0 + 3$'
      - say: '64 plus 3 is 67, so the numeral is worth 67 plus $16P$.'
        write: '$= 67 + 16P$'
      - say: 'Now we use what we''re given. That value is 115, so we set up an equation.'
        write: '$67 + 16P = 115$'
      - say: 'Subtract 67 from both sides. 115 minus 67 is 48.'
        write: '$16P = 48$'
      - say: 'To get $P$ by itself, divide both sides by 16. 48 divided by 16 is 3.'
        write: '$P = 3$'
      - say: 'Is 3 allowed? In base 4 the digits can only be 0, 1, 2 or 3, so yes, 3 is a legal digit.'
      - say: 'Let''s check. 1303 in base 4 is 64 plus 48 plus 0 plus 3, which is 115. It works.'
        write: '$64 + 48 + 0 + 3 = 115\ \checkmark$'
      - say: 'So $P$ is 3, which is answer choice D.'
        write: '$P = 3$'
        answer: true
    traps:
      A: 'You went for 0. With $P = 0$ the numeral is only 64 plus 3, which is 67, not 115. Build the equation $67 + 16P = 115$ and solve it.'
      B: 'You went for 1. That gives 64 plus 16 plus 3, which is 83, not 115. Remember the $P$ column is worth 16, so $16P$ has to make up 48.'
      C: 'You went for 2. That gives 64 plus 32 plus 3, which is 99, still short of 115. Solving $16P = 48$ gives $P = 3$.'
  2:
    moments:
      - say: 'We want 64.764 squared minus 35.236 squared, correct to 3 significant figures.'
        write: '$64.764^{2} - 35.236^{2}$'
      - say: 'Squaring these by hand would take ages. But this is a square minus a square, so we can use the difference of two squares.'
        write: '$a^{2} - b^{2} = (a + b)(a - b)$'
      - say: 'Here $a$ is 64.764 and $b$ is 35.236.'
        write: '$a = 64.764,\ b = 35.236$'
      - say: 'So we can rewrite the expression as the sum of the two numbers times their difference.'
        write: '$(64.764 + 35.236)(64.764 - 35.236)$'
      - say: 'First the sum. 64.764 plus 35.236: the decimals 0.764 and 0.236 make exactly 1, and 64 plus 35 plus 1 is 100.'
        write: '$64.764 + 35.236 = 100$'
      - say: 'Now the difference. 64.764 minus 35.236 is 29.528.'
        write: '$64.764 - 35.236 = 29.528$'
      - say: 'So the expression is 100 times 29.528.'
        write: '$100 \times 29.528$'
      - say: 'Multiplying by 100 moves the decimal point two places to the right, giving 2952.8.'
        write: '$= 2952.8$'
      - say: 'Now round to 3 significant figures. The first three significant digits are 2, 9 and 5. The next digit is 2, which is less than 5, so the 5 stays as it is.'
        write: '$2952.8 \approx 2950$'
      - say: 'So the answer is 2950, which is answer choice B.'
        write: '$2950$'
        answer: true
    traps:
      A: 'You went for 2960. That rounds 2952.8 up, but the digit after the third significant figure is 2, which is less than 5, so we round down to 2950.'
      C: 'You went for 2860. The sum is exactly 100, so the answer is 100 times the difference, 29.528. Check the subtraction: 64.764 minus 35.236 is 29.528, not 28.6 or so.'
      D: 'You went for 2850. That would need a difference of about 28.5, but 64.764 minus 35.236 is 29.528. Redo that subtraction carefully and you get 2952.8, which is 2950.'
  3:
    moments:
      - say: 'We want 0.006 cubed plus 0.004 cubed, written in standard form.'
        write: '$(0.006)^{3} + (0.004)^{3}$'
      - say: 'Cubing tiny decimals is where zeros get lost, so let''s write each number in standard form first. 0.006 is 6 times 10 to the negative 3.'
        write: '$0.006 = 6 \times 10^{-3}$'
      - say: 'When we cube it, we cube the 6 and we cube the power of ten. 6 cubed is 216, and 10 to the negative 3, cubed, is 10 to the negative 9.'
        write: '$(0.006)^{3} = 216 \times 10^{-9}$'
      - say: 'Now the second number. 0.004 is 4 times 10 to the negative 3.'
        write: '$0.004 = 4 \times 10^{-3}$'
      - say: '4 cubed is 64, and again the power of ten becomes 10 to the negative 9.'
        write: '$(0.004)^{3} = 64 \times 10^{-9}$'
      - say: 'Both have the same power of ten, so we can simply add the front numbers. 216 plus 64 is 280.'
        write: '$216 \times 10^{-9} + 64 \times 10^{-9} = 280 \times 10^{-9}$'
      - say: 'But this is not standard form yet. Standard form needs just one non-zero digit before the decimal point.'
      - say: '280 is 2.8 times 10 squared.'
        write: '$280 = 2.8 \times 10^{2}$'
      - say: 'So we have 2.8 times 10 squared times 10 to the negative 9. When we multiply powers, we add the indices: 2 plus negative 9 is negative 7.'
        write: '$2.8 \times 10^{2} \times 10^{-9} = 2.8 \times 10^{-7}$'
      - say: 'So the answer is 2.8 times 10 to the negative 7, which is answer choice C.'
        write: '$2.8 \times 10^{-7}$'
        answer: true
    traps:
      A: 'You went for 2.8 times 10 to the negative 9. That keeps the power from $280 \times 10^{-9}$, but turning 280 into 2.8 moves the point two places, so the index goes up by 2 to negative 7.'
      B: 'You went for 2.8 times 10 to the negative 8. That only accounts for one place of the point moving. 280 to 2.8 is two places, so the index rises from negative 9 to negative 7.'
      D: 'You went for 2.8 times 10 to the negative 6. That moves the index up by three. 280 is 2.8 times 10 squared, so negative 9 plus 2 gives negative 7.'
  4:
    moments:
      - say: 'We''re given $\log_{a}2 = 0.693$ and $\log_{a}3 = 1.097$, and we want $\log_{a}13.5$.'
        write: '$\log_{a}2 = 0.693,\quad \log_{a}3 = 1.097$'
      - say: 'Since we only know the logs of 2 and 3, the plan is to write 13.5 using only 2s and 3s.'
      - say: '13.5 is 27 over 2, because 27 divided by 2 is 13.5.'
        write: '$13.5 = \dfrac{27}{2}$'
      - say: 'And 27 is 3 times 3 times 3, which is 3 cubed.'
        write: '$13.5 = \dfrac{3^{3}}{2}$'
      - say: 'Now take logs. The log of a quotient is the log of the top minus the log of the bottom.'
        write: '$\log_{a}13.5 = \log_{a}3^{3} - \log_{a}2$'
      - say: 'And the power law lets us bring the 3 down in front as a multiplier.'
        write: '$\log_{a}13.5 = 3\log_{a}3 - \log_{a}2$'
      - say: 'Now put in the values we were given.'
        write: '$= 3(1.097) - 0.693$'
      - say: '3 times 1.097 is 3.291.'
        write: '$= 3.291 - 0.693$'
      - say: '3.291 minus 0.693 is 2.598.'
        write: '$= 2.598$'
      - say: 'So $\log_{a}13.5$ is 2.598, which is answer choice C.'
        write: '$\log_{a}13.5 = 2.598$'
        answer: true
    traps:
      A: 'You went for 1.404. That doesn''t come from $3\log_{a}3 - \log_{a}2$. The 3 comes from $27 = 3^{3}$, so multiply 1.097 by 3 to get 3.291, then subtract 0.693.'
      B: 'You went for 1.790. That is 1.097 plus 0.693, which is the log of 6, not 13.5. We need $3\log_{a}3 - \log_{a}2$.'
      D: 'You went for 2.790. Check the last step: 3.291 minus 0.693 is 2.598. Do the subtraction carefully, borrowing where needed.'
  5:
    moments:
      - say: 'We want to simplify $\log_{2}96$ minus $2\log_{2}6$.'
        write: '$\log_{2}96 - 2\log_{2}6$'
      - say: 'The first thing we need to do is move the 2 in front of the second log inside it, as a power. That''s the power law.'
        write: '$2\log_{2}6 = \log_{2}6^{2}$'
      - say: '6 squared is 36.'
        write: '$2\log_{2}6 = \log_{2}36$'
      - say: 'So the expression becomes $\log_{2}96$ minus $\log_{2}36$.'
        write: '$\log_{2}96 - \log_{2}36$'
      - say: 'A difference of logs with the same base is the log of a quotient.'
        write: '$= \log_{2}\dfrac{96}{36}$'
      - say: 'Now simplify the fraction. 96 and 36 both divide by 12. 96 divided by 12 is 8, and 36 divided by 12 is 3.'
        write: '$= \log_{2}\dfrac{8}{3}$'
      - say: 'The options have $\log_{2}3$ on its own, so let''s split the quotient back up: the log of 8 minus the log of 3.'
        write: '$= \log_{2}8 - \log_{2}3$'
      - say: 'What is $\log_{2}8$? It asks: 2 to what power gives 8? 2 cubed is 8, so it''s 3.'
        write: '$\log_{2}8 = 3$'
      - say: 'So the expression simplifies to 3 minus $\log_{2}3$, which is answer choice B.'
        write: '$= 3 - \log_{2}3$'
        answer: true
    traps:
      A: 'You went for 2 minus $\log_{2}3$. That comes from reducing 96 over 36 to 4 over 3. It''s actually 8 over 3, and $\log_{2}8$ is 3.'
      C: 'You went for $\log_{2}3$ minus 3. That is the right pieces with the order reversed, as if you''d done 36 over 96. The first log is $\log_{2}96$, so the 8 goes on top.'
      D: 'You went for $\log_{2}3$ minus 2. The signs are reversed and the 8 has become a 4. 96 over 36 is 8 over 3, giving 3 minus $\log_{2}3$.'
  6:
    moments:
      - say: 'We need $x$ when 8 to the power $x$ over 2 equals 2 to the three-eighths times 4 to the three-quarters.'
        write: '$8^{x/2} = 2^{3/8} \times 4^{3/4}$'
      - say: 'Every number here, 8, 2 and 4, is a power of 2. So let''s write everything in base 2.'
      - say: 'On the left, 8 is 2 cubed.'
        write: '$8^{x/2} = \left(2^{3}\right)^{x/2}$'
      - say: 'A power of a power multiplies the indices. 3 times $x$ over 2 is $3x$ over 2.'
        write: '$8^{x/2} = 2^{3x/2}$'
      - say: 'On the right, 2 to the three-eighths is already in base 2. And 4 is 2 squared.'
        write: '$4^{3/4} = \left(2^{2}\right)^{3/4}$'
      - say: 'Multiply the indices again. 2 times three-quarters is six-quarters, which is three-halves.'
        write: '$4^{3/4} = 2^{3/2}$'
      - say: 'Now the right side is 2 to the three-eighths times 2 to the three-halves. When we multiply powers of the same base, we add the indices.'
        write: '$2^{3/8} \times 2^{3/2} = 2^{3/8 + 3/2}$'
      - say: 'To add, write three-halves as twelve-eighths. 3 eighths plus 12 eighths is 15 eighths.'
        write: '$\dfrac{3}{8} + \dfrac{12}{8} = \dfrac{15}{8}$'
      - say: 'So the equation is 2 to the $3x$ over 2 equals 2 to the 15 over 8.'
        write: '$2^{3x/2} = 2^{15/8}$'
      - say: 'The bases are the same, so the indices must be equal.'
        write: '$\dfrac{3x}{2} = \dfrac{15}{8}$'
      - say: 'To get $x$ by itself, multiply both sides by 2 over 3.'
        write: '$x = \dfrac{15}{8} \times \dfrac{2}{3}$'
      - say: '15 times 2 is 30, and 8 times 3 is 24. So $x$ is 30 over 24.'
        write: '$x = \dfrac{30}{24}$'
      - say: 'Both divide by 6. 30 divided by 6 is 5, and 24 divided by 6 is 4. So $x$ is five-quarters, which is answer choice D.'
        write: '$x = \dfrac{5}{4}$'
        answer: true
    traps:
      A: 'You went for three-eighths. That''s just the first index on the right. We need to combine both powers into $2^{15/8}$ and then solve $\tfrac{3x}{2} = \tfrac{15}{8}$.'
      B: 'You went for three-quarters. That''s the index on the 4, not $x$. Change everything to base 2, add the indices on the right, then solve for $x$.'
      C: 'You went for four-fifths. That is the answer upside down. From $\tfrac{3x}{2} = \tfrac{15}{8}$, multiply by $\tfrac{2}{3}$ to get $\tfrac{30}{24}$, which is $\tfrac{5}{4}$.'
  7:
    moments:
      - say: 'We want to simplify $2\sqrt{3} + 3\sqrt{5}$ over $3\sqrt{5} - 2\sqrt{3}$.'
        write: '$\dfrac{2\sqrt{3} + 3\sqrt{5}}{3\sqrt{5} - 2\sqrt{3}}$'
      - say: 'To clear surds from the denominator, we multiply top and bottom by the conjugate: the same two terms with the middle sign flipped. That''s $3\sqrt{5} + 2\sqrt{3}$.'
        write: '$\times\ \dfrac{3\sqrt{5} + 2\sqrt{3}}{3\sqrt{5} + 2\sqrt{3}}$'
      - say: 'Let''s do the denominator first. It''s a difference of two squares: $3\sqrt{5}$ squared minus $2\sqrt{3}$ squared.'
        write: '$(3\sqrt{5})^{2} - (2\sqrt{3})^{2}$'
      - say: 'When we square $3\sqrt{5}$, we square the 3 and the root 5. 3 squared is 9, and root 5 squared is 5, so that''s 9 times 5, which is 45.'
        write: '$(3\sqrt{5})^{2} = 9 \times 5 = 45$'
      - say: 'Similarly, $2\sqrt{3}$ squared is 4 times 3, which is 12.'
        write: '$(2\sqrt{3})^{2} = 4 \times 3 = 12$'
      - say: 'So the denominator is 45 minus 12, which is 33.'
        write: '$45 - 12 = 33$'
      - say: 'Now the numerator: $2\sqrt{3} + 3\sqrt{5}$ times $3\sqrt{5} + 2\sqrt{3}$. There are four products.'
        write: '$(2\sqrt{3} + 3\sqrt{5})(3\sqrt{5} + 2\sqrt{3})$'
      - say: '$2\sqrt{3}$ times $3\sqrt{5}$ is $6\sqrt{15}$. $2\sqrt{3}$ times $2\sqrt{3}$ is 4 times 3, which is 12.'
        write: '$6\sqrt{15} + 12$'
      - say: '$3\sqrt{5}$ times $3\sqrt{5}$ is 9 times 5, which is 45. And $3\sqrt{5}$ times $2\sqrt{3}$ is another $6\sqrt{15}$.'
        write: '$6\sqrt{15} + 12 + 45 + 6\sqrt{15}$'
      - say: 'Collect them. 12 plus 45 is 57, and $6\sqrt{15}$ plus $6\sqrt{15}$ is $12\sqrt{15}$.'
        write: '$57 + 12\sqrt{15}$'
      - say: 'So the whole fraction is 57 plus $12\sqrt{15}$, all over 33.'
        write: '$\dfrac{57 + 12\sqrt{15}}{33}$'
      - say: 'Every number divides by 3. 57 divided by 3 is 19, 12 divided by 3 is 4, and 33 divided by 3 is 11.'
        write: '$\dfrac{19 + 4\sqrt{15}}{11}$'
      - say: 'So the answer is 19 plus $4\sqrt{15}$ over 11, which is answer choice A.'
        write: '$= \dfrac{19 + 4\sqrt{15}}{11}$'
        answer: true
    traps:
      B: 'You went for the right numerator over 19. The denominator comes from $45 - 12 = 33$, and dividing by 3 gives 11, not 19. Square the 3 and the 2 as well as the surds.'
      C: 'You went for $2\sqrt{15}$ on top. That happens if you count only one of the two cross terms. There are two lots of $6\sqrt{15}$, making $12\sqrt{15}$, and dividing by 3 gives $4\sqrt{15}$.'
      D: 'You went for $2\sqrt{15}$ over 19. Both the surd term and the denominator have slipped. The cross terms give $12\sqrt{15}$, and the denominator is $45 - 12 = 33$; dividing everything by 3 gives $\tfrac{19 + 4\sqrt{15}}{11}$.'
  8:
    moments:
      - say: '₦1,000 grows to ₦1,240 in 3 years at simple interest. We want the rate per cent per annum.'
        write: '$P = 1000,\ A = 1240,\ T = 3$'
      - say: 'Simple interest is earned only on the original sum, and the formula is $I$ equals $PRT$ over 100.'
        write: '$I = \dfrac{PRT}{100}$'
      - say: 'But ₦1,240 is the final amount, not the interest. The interest is how much the money grew by: 1,240 minus 1,000, which is 240.'
        write: '$I = 1240 - 1000 = 240$'
      - say: 'Now substitute: $I$ is 240, $P$ is 1,000 and $T$ is 3.'
        write: '$240 = \dfrac{1000 \times R \times 3}{100}$'
      - say: '1,000 times 3 is 3,000. So the top is $3000R$.'
        write: '$240 = \dfrac{3000R}{100}$'
      - say: '3,000 divided by 100 is 30, so the right side is $30R$.'
        write: '$240 = 30R$'
      - say: 'To get $R$ by itself, divide both sides by 30. 240 divided by 30 is 8.'
        write: '$R = 8$'
      - say: 'Let''s check. 8% of ₦1,000 is ₦80 a year, and 3 years of that is ₦240. Added to ₦1,000 that''s ₦1,240. It works.'
        write: '$3 \times 80 = 240\ \checkmark$'
      - say: 'So the rate is 8% per annum, which is answer choice B.'
        write: '$R = 8\%$'
        answer: true
    traps:
      A: 'You went for 6%. At 6% the interest would be ₦60 a year, only ₦180 over 3 years. The interest here is ₦240, so $30R = 240$ gives 8%.'
      C: 'You went for 10%. At 10% the interest would be ₦100 a year, ₦300 over 3 years. We need ₦240, which is 8% a year.'
      D: 'You went for 12%. At 12% the interest would be ₦360 over 3 years. The interest is 1,240 minus 1,000, which is ₦240, giving 8%.'
  9:
    moments:
      - say: 'We have three sets $X$, $Y$ and $Z$, and we want $X$ intersect, bracket, $Y$ union $Z$.'
        write: '$X \cap (Y \cup Z)$'
      - say: 'We work from the inside out, so the bracket comes first: $Y$ union $Z$.'
        write: '$Y = \{P, N, O, U, R\},\quad Z = \{L, O, U, D\}$'
      - say: 'A union collects everything that is in either set. O and U are in both, but we list them only once.'
        write: '$Y \cup Z = \{P, N, O, U, R, L, D\}$'
      - say: 'Now the intersection with $X$. An intersection keeps only the letters that are in both sets.'
        write: '$X = \{S, P, E, N, D\}$'
      - say: 'Go through $X$ one letter at a time. Is S in the union? No. Is P? Yes.'
        write: '$S\ \times,\quad P\ \checkmark$'
      - say: 'Is E in the union? No. Is N? Yes. Is D? Yes.'
        write: '$E\ \times,\quad N\ \checkmark,\quad D\ \checkmark$'
      - say: 'So the letters we keep are P, N and D.'
        write: '$X \cap (Y \cup Z) = \{P, N, D\}$'
      - say: 'Here''s a quick check. Anything intersected with $X$ must be inside $X$. Only one option is a subset of $X$, and it''s the one we got.'
      - say: 'So the answer is the set P, N, D, which is answer choice C.'
        write: '$\{P, N, D\}$'
        answer: true
    traps:
      A: 'You went for P, O, U, R. O, U and R are not in $X$ at all, so they can''t be in an intersection with $X$. That set is closer to $Y$ itself.'
      B: 'You went for S, P, D, R. R is not in $X$, and S is not in $Y \cup Z$. Keep only the letters of $X$ that also appear in the union.'
      D: 'You went for N, D, U. U is not in $X$, so it can''t be in the intersection, and P has been missed. The answer is P, N, D.'
  10:
    moments:
      - say: 'Of 100 students, 80 speak Hausa, 20 speak Igbo and 9 speak both. We want how many speak neither.'
        write: '$n(H) = 80,\ n(I) = 20,\ n(H \cap I) = 9$'
      - say: 'The first thing we need is how many speak at least one of the languages. For that we use the addition rule.'
        write: '$n(H \cup I) = n(H) + n(I) - n(H \cap I)$'
      - say: 'Why subtract the 9? Those 9 students are counted once in the 80 and again in the 20, so we take them off once to avoid counting them twice.'
      - say: 'Substitute the numbers.'
        write: '$n(H \cup I) = 80 + 20 - 9$'
      - say: '80 plus 20 is 100.'
        write: '$= 100 - 9$'
      - say: '100 minus 9 is 91. So 91 students speak at least one of the two languages.'
        write: '$n(H \cup I) = 91$'
      - say: 'Everyone else speaks neither. There are 100 students in total, so we subtract.'
        write: '$\text{neither} = 100 - 91$'
      - say: '100 minus 91 is 9.'
        write: '$= 9$'
      - say: 'So 9 students speak neither language, which is answer choice B.'
        write: '$9 \text{ students}$'
        answer: true
    traps:
      A: 'You went for 0. Adding 80 and 20 gives 100, which makes it look like everyone is covered. But 9 students are counted twice, so only 91 speak at least one language, leaving 9.'
      C: 'You went for 11. That is 20 minus 9, the number who speak Igbo only. The question wants those who speak neither, which is 100 minus 91.'
      D: 'You went for 20. That is the number who speak Igbo. The students who speak neither are 100 minus 91, which is 9.'
  11:
    moments:
      - say: 'The function $x^{3} + 2x^{2} + qx - 6$ is divisible by $x + 1$, and we want $q$.'
        write: '$f(x) = x^{3} + 2x^{2} + qx - 6$'
      - say: 'Divisible by $x + 1$ means $x + 1$ is a factor, so dividing leaves no remainder.'
      - say: 'The factor theorem says: if $x - a$ is a factor, then $f(a)$ is zero. And $x + 1$ is $x$ minus negative 1, so we use $x = -1$, not positive 1.'
        write: '$x + 1 = 0 \Rightarrow x = -1$'
      - say: 'So let''s replace every $x$ with negative 1.'
        write: '$f(-1) = (-1)^{3} + 2(-1)^{2} + q(-1) - 6$'
      - say: 'Negative 1 cubed is negative 1, because an odd power of negative 1 stays negative.'
        write: '$(-1)^{3} = -1$'
      - say: 'Negative 1 squared is positive 1, so 2 times that is 2.'
        write: '$2(-1)^{2} = 2(1) = 2$'
      - say: 'And $q$ times negative 1 is negative $q$.'
        write: '$q(-1) = -q$'
      - say: 'Put the pieces together.'
        write: '$f(-1) = -1 + 2 - q - 6$'
      - say: 'Negative 1 plus 2 is 1, and 1 minus 6 is negative 5. So we have negative 5 minus $q$.'
        write: '$f(-1) = -5 - q$'
      - say: 'Because $x + 1$ is a factor, this must equal zero.'
        write: '$-5 - q = 0$'
      - say: 'Add $q$ to both sides, and $q$ equals negative 5.'
        write: '$q = -5$'
      - say: 'Let''s check: negative 1, plus 2, plus 5, minus 6 is zero. It works.'
        write: '$-1 + 2 + 5 - 6 = 0\ \checkmark$'
      - say: 'So $q$ is negative 5, which is answer choice A.'
        write: '$q = -5$'
        answer: true
    traps:
      B: 'You went for negative 2. Put $x = -1$ in carefully: $-1 + 2 - q - 6$ is $-5 - q$, and setting that to zero gives $q = -5$.'
      C: 'You went for 2. Remember to use $x = -1$, the value that makes $x + 1$ zero. That gives $-5 - q = 0$, so $q = -5$.'
      D: 'You went for 5. That''s the right size with the wrong sign, which happens if $q$ times negative 1 is written as plus $q$. It''s minus $q$, so $-5 - q = 0$ gives $q = -5$.'
  12:
    moments:
      - say: 'We need to solve 2 over $x$ minus 3 over $y$ equals 2, and 4 over $x$ plus 3 over $y$ equals 10.'
        write: '$\dfrac{2}{x} - \dfrac{3}{y} = 2,\qquad \dfrac{4}{x} + \dfrac{3}{y} = 10$'
      - say: 'Notice that 3 over $y$ appears in both equations, once with a minus and once with a plus. So if we add the equations, it cancels.'
      - say: 'Let''s add them, left side to left side and right side to right side.'
        write: '$\dfrac{2}{x} + \dfrac{4}{x} - \dfrac{3}{y} + \dfrac{3}{y} = 2 + 10$'
      - say: 'The $y$ terms cancel. 2 over $x$ plus 4 over $x$ is 6 over $x$, and 2 plus 10 is 12.'
        write: '$\dfrac{6}{x} = 12$'
      - say: 'Multiply both sides by $x$ to get 6 equals $12x$.'
        write: '$6 = 12x$'
      - say: 'Divide both sides by 12. 6 over 12 is one half.'
        write: '$x = \dfrac{1}{2}$'
      - say: 'Now find $y$. Put $x$ equals one half into the first equation.'
