  21:
    moments:
      - say: 'Two operations are defined: $m * n$ is $mn - n - 1$, and $m \oplus n$ is $mn + n - 2$. We want 3 circle-plus, bracket, 4 star 5.'
        write: '$3 \oplus (4 * 5)$'
      - say: 'Picture each operation as a machine with two slots. The brackets tell us to start inside, with 4 star 5: 4 and 5 go into the star machine.'
        write: 'Star rule: $m * n = mn - n - 1$'
        doodle: {name: 'custom:1997_q21_a', id: machines, caption: 'two machines with two slots each', size: scene}
      - say: 'In the star rule, $m$ is 4 and $n$ is 5.'
        write: '$4 * 5 = (4)(5) - 5 - 1$'
      - say: '4 times 5 is 20.'
        write: '$= 20 - 5 - 1$'
      - say: '20 minus 5 is 15, and 15 minus 1 is 14. Out comes 14.'
        write: '$= 14$'
        point:
          - {line: 4, kind: highlight, at: '14', to: {doodle: machines, part: out1}}
        doodle_do:
          - {id: machines, op: stage, stage: 'custom:1997_q21_a2'}
      - say: 'Now carry that 14 across into the empty slot of the other machine, the circle-plus. We need 3 circle-plus 14.'
        write: '$3 \oplus (4 * 5) = 3 \oplus 14$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '14'}, at: '⊕ 14', text: 'from inside'}
        doodle_do:
          - {id: machines, op: move, part: out1, path: feed}
      - say: 'The circle-plus rule is $mn$ plus $n$ minus 2.'
        write: 'Circle-plus rule: $m \oplus n = mn + n - 2$'
      - say: 'Here $m$ is 3 and $n$ is 14.'
        write: '$3 \oplus 14 = (3)(14) + 14 - 2$'
        point:
          - {line: 6, kind: box, text: 'the rule'}
      - say: '3 times 14 is 42.'
        write: '$= 42 + 14 - 2$'
      - say: '42 plus 14 is 56, and 56 minus 2 is 54. That is what the second machine gives out.'
        write: '$= 54$'
        point:
          - {line: 9, kind: highlight, at: '54', to: {doodle: machines, part: out2}}
        doodle_do:
          - {id: machines, op: label, part: out2, text: '54'}
      - say: 'So the answer is 54, which is answer choice C.'
        write: '$3 \oplus (4 * 5) = 54$'
        answer: true
    traps:
      A: 'You went for 60. Check each rule carefully. The star rule gives $4 * 5 = 20 - 5 - 1 = 14$, and then the circle-plus rule gives $42 + 14 - 2 = 54$.'
      B: 'You went for 57. Keep the two rules apart: star subtracts $n$ and 1, circle-plus adds $n$ and subtracts 2. That gives 14, then 54.'
      D: 'You went for 42. That''s only the $mn$ part, 3 times 14. The circle-plus rule also adds $n$ and takes away 2: $42 + 14 - 2 = 54$.'
  22:
    moments:
      - say: 'The operation $x * y$ is defined as $x + y - xy$. We want $x$ when $x * 2$ plus $x * 3$ equals 68.'
        write: '$x * y = x + y - xy$'
      - say: 'Here is the equation we must solve. Picture the star machine used twice: once with $x$ and 2, once with $x$ and 3, and the two outputs add up to 68. So first we work out each star separately.'
        write: 'Solve: $(x * 2) + (x * 3) = 68$'
        doodle: {name: 'custom:1997_q22_a', id: machines, caption: 'the star machine, used twice', size: scene}
      - say: 'First, $x * 2$. Keep $x$ in the first place and put 2 in place of $y$. The $xy$ becomes $x$ times 2, which is $2x$.'
        write: '$x * 2 = x + 2 - 2x$'
      - say: '$x$ minus $2x$ is negative $x$, so the first machine gives out 2 minus $x$.'
        write: '$= 2 - x$'
        doodle_do:
          - {id: machines, op: stage, stage: 'custom:1997_q22_a2'}
      - say: 'Now $x * 3$. Put 3 in place of $y$, so the $xy$ becomes $3x$.'
        write: '$x * 3 = x + 3 - 3x$'
      - say: '$x$ minus $3x$ is negative $2x$, so the second machine gives out 3 minus $2x$.'
        write: '$= 3 - 2x$'
        doodle_do:
          - {id: machines, op: stage, stage: 'custom:1997_q22_a3'}
      - say: 'Now put these two outputs into the equation from the question.'
        write: '$(2 - x) + (3 - 2x) = 68$'
        point:
          - {line: 6, kind: move, from: {line: 3, at: '2 − x'}, at: '(2 − x)', text: 'x * 2'}
          - {line: 6, kind: move, from: {line: 5, at: '3 − 2x'}, at: '(3 − 2x)', text: 'x * 3'}
          - {line: 6, kind: highlight, at: '68', to: {doodle: machines, part: eq}}
        doodle_do:
          - {id: machines, op: circle, part: eq}
      - say: '2 plus 3 is 5, and negative $x$ minus $2x$ is negative $3x$.'
        write: '$5 - 3x = 68$'
      - say: 'Subtract 5 from both sides. 68 minus 5 is 63.'
        write: '$-3x = 68 - 5 = 63$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '[[5]] − 3x'}, at: '− 5', text: 'across the ='}
      - say: 'Divide both sides by negative 3. 63 divided by negative 3 is negative 21. That is the $x$ we fed into both machines.'
        write: '$x = \dfrac{63}{-3} = -21$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '[[−3]]x'}, at: '[[−3]]63', text: 'divide it over'}
        doodle_do:
          - {id: machines, op: label, part: eq, text: 'x = −21'}
      - say: 'Let''s check. Negative 21 star 2 is negative 21, plus 2, minus 2 times negative 21. That''s negative 21 plus 2 plus 42, which is 23.'
        write: 'Check: $(-21) * 2 = -21 + 2 + 42 = 23$'
      - say: 'Negative 21 star 3 is negative 21 plus 3 plus 63, which is 45. And 23 plus 45 is 68. It works.'
        write: '$(-21) * 3 = -21 + 3 + 63 = 45$, and $23 + 45 = 68$'
      - say: 'So $x$ is negative 21, which is answer choice D.'
        write: '$x = -21$'
        answer: true
    traps:
      A: 'You went for 24. Try it: $24 * 2$ is $24 + 2 - 48 = -22$, which is negative. Both expressions have negative $x$ terms, so to reach 68, $x$ must be negative.'
      B: 'You went for 22. With a positive $x$, both $2 - x$ and $3 - 2x$ are negative, so they can''t add to 68. Solving $5 - 3x = 68$ gives $x = -21$.'
      C: 'You went for negative 12. The sign is right but check the size: $5 - 3x = 68$ gives $-3x = 63$, and 63 divided by 3 is 21, not 12.'
  23:
    moments:
      - say: 'We have a matrix equation, and we want $x$ plus $y$. Picture the matrix as seats in two rows.'
        write: '$\begin{pmatrix} 2 & -3 \\ -1 & 4 \end{pmatrix}\begin{pmatrix} x \\ y \end{pmatrix} = \begin{pmatrix} -1 \\ 8 \end{pmatrix}$'
        doodle: {name: 'custom:1997_q23_a', id: seats, caption: 'rows of seats times the column x, y', size: scene}
      - say: 'A matrix equation like this is really two simultaneous equations. Walk along row 1 and multiply by the column: 2 times $x$, plus negative 3 times $y$. That equals the top entry, negative 1.'
        write: 'Row 1: $2x - 3y = -1$'
        point:
          - {line: 1, kind: highlight, at: '2x - 3y', to: {doodle: seats, part: row1}}
        doodle_do:
          - {id: seats, op: highlight, part: row1, text: '2x − 3y = −1'}
      - say: 'Now walk along row 2: negative 1 times $x$, plus 4 times $y$, equals the bottom entry, 8.'
        write: 'Row 2: $-x + 4y = 8$'
        point:
          - {line: 2, kind: highlight, at: '-x + 4y', to: {doodle: seats, part: row2}}
        doodle_do:
          - {id: seats, op: highlight, part: row2, text: '−x + 4y = 8'}
      - say: 'The second equation has a single $x$, so let''s make $x$ the subject. Add $x$ to both sides, then subtract 8 from both sides.'
        write: '$4y - 8 = x$, so $x = 4y - 8$'
      - say: 'Now substitute that into the first equation, in place of $x$.'
        write: '$2(4y - 8) - 3y = -1$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: 'x = [[4y − 8]]'}, at: '(4y − 8)', text: 'in place of x'}
      - say: 'Expand the bracket. 2 times $4y$ is $8y$, and 2 times negative 8 is negative 16.'
        write: '$8y - 16 - 3y = -1$'
      - say: '$8y$ minus $3y$ is $5y$.'
        write: '$5y - 16 = -1$'
      - say: 'Add 16 to both sides. Negative 1 plus 16 is 15.'
        write: '$5y = 15$'
      - say: 'Divide by 5, and $y$ is 3.'
        write: '$y = 3$'
      - say: 'Go back to $x$ equals $4y - 8$ and put in $y$ equals 3. 4 times 3 is 12, and 12 minus 8 is 4.'
        write: '$x = 4(3) - 8 = 12 - 8 = 4$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '= 3'}, at: '(3)', text: 'y'}
      - say: 'Check in the first equation: 2 times 4 is 8, 3 times 3 is 9, and 8 minus 9 is negative 1. Good.'
        write: 'Check: $2(4) - 3(3) = 8 - 9 = -1$'
      - say: 'The question wants $x$ plus $y$, not each one. 4 plus 3 is 7.'
        write: '$x + y = 4 + 3 = 7$'
        point:
          - {line: 11, kind: move, from: {line: 9, at: '8 = [[4]]'}, at: '= [[4]] + 3', text: 'x'}
          - {line: 11, kind: move, from: {line: 8, at: '= 3'}, at: '4 + [[3]]', text: 'y'}
        doodle_do:
          - {id: seats, op: label, part: col, text: '4 + 3 = 7'}
      - say: 'So $x$ plus $y$ is 7, which is answer choice C.'
        write: '$x + y = 7$'
        answer: true
    traps:
      A: 'You went for 3. That''s $y$ on its own. The question asks for $x + y$, which is $4 + 3 = 7$.'
      B: 'You went for 4. That''s $x$ on its own. Add $y = 3$ to it to get 7.'
      D: 'You went for 12. That''s $x$ times $y$, 4 times 3. The question wants the sum, 4 plus 3, which is 7.'
  24:
    moments:
      - say: 'We want the non-zero positive value of $x$ that makes this three by three determinant equal to zero.'
        write: '$\begin{vmatrix} x & 1 & 0 \\ 1 & x & 1 \\ 0 & 1 & x \end{vmatrix} = 0$'
      - say: 'Picture the determinant as a seat plan. We expand along the first row, using the signs plus, minus, plus. Each entry of the row multiplies the small determinant left when we cover up its row and its column.'
        write: 'Row 1: $x,\ 1,\ 0$ with signs $+,\ -,\ +$'
        doodle: {name: 'custom:1997_q24_a', id: plan, caption: 'the determinant as a seat plan', size: scene}
      - say: 'So the determinant is $x$ times its small determinant, minus 1 times its small determinant, plus 0 times the last one. The 0 makes the last term vanish.'
        write: 'Determinant $= x\begin{vmatrix} x & 1 \\ 1 & x \end{vmatrix} - 1\begin{vmatrix} 1 & 1 \\ 0 & x \end{vmatrix} + 0$'
      - say: 'The first small determinant: cover row 1 and column 1, and the four seats left are $x$, 1, 1, $x$. That is $x$ times $x$, minus 1 times 1, which is $x^{2} - 1$.'
        write: '$\begin{vmatrix} x & 1 \\ 1 & x \end{vmatrix} = x \cdot x - 1 \cdot 1 = x^{2} - 1$'
        doodle_do:
          - {id: plan, op: stage, stage: 'custom:1997_q24_a2'}
      - say: 'The second: cover row 1 and column 2 instead, and the seats left are 1, 1, 0, $x$. That is 1 times $x$, minus 1 times 0, which is just $x$.'
        write: '$\begin{vmatrix} 1 & 1 \\ 0 & x \end{vmatrix} = 1 \cdot x - 1 \cdot 0 = x$'
        doodle_do:
          - {id: plan, op: stage, stage: 'custom:1997_q24_a3'}
      - say: 'Put those two results back into the expansion, with the signs plus and minus from the top of the plan.'
        write: 'Determinant $= x(x^{2} - 1) - 1(x)$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '= x2 − 1'}, at: '(x2 − 1)', text: 'first'}
          - {line: 5, kind: move, from: {line: 4, at: '= x'}, at: '(x)', text: 'second'}
        doodle_do:
          - {id: plan, op: pulse, part: signs}
      - say: 'Multiply out. $x$ times $x^{2}$ is $x^{3}$, and $x$ times negative 1 is negative $x$. Then minus another $x$.'
        write: '$= x^{3} - x - x$'
      - say: 'Negative $x$ minus $x$ is negative $2x$.'
        write: '$= x^{3} - 2x$'
      - say: 'The question says the determinant equals zero.'
        write: '$x^{3} - 2x = 0$'
      - say: 'Factorise by taking out $x$. We factorise instead of dividing by $x$, so we don''t lose a root.'
        write: '$x(x^{2} - 2) = 0$'
      - say: 'So either $x$ is 0, or $x^{2}$ is 2.'
        write: '$x = 0 \quad \text{or} \quad x^{2} = 2$'
      - say: 'If $x^{2}$ is 2, then $x$ is plus or minus root 2.'
        write: '$x = \pm\sqrt{2}$'
      - say: 'We want the non-zero positive value, so we rule out 0 and negative root 2. That leaves root 2, which is answer choice C.'
        write: '$x = \sqrt{2}$'
        point:
          - {line: 10, kind: strike, at: 'x = 0', text: 'not zero'}
        answer: true
    traps:
      A: 'You went for 2. That''s the value of $x^{2}$, not $x$. From $x^{2} = 2$, take the square root to get $\sqrt{2}$.'
      B: 'You went for $\sqrt{3}$. Check the expansion: $x(x^{2} - 1) - x$ is $x^{3} - 2x$, not $x^{3} - 3x$. So $x^{2} = 2$ and $x = \sqrt{2}$.'
      D: 'You went for 1. That makes the first small determinant zero, but it forgets the second term. The whole determinant is $x^{3} - 2x$, and at $x = 1$ that''s negative 1, not zero.'
  25:
    moments:
      - say: 'An isosceles triangle has base angles of 58 degrees, and all its corners lie on a circle. We want the angle the base makes at the centre of the circle.'
        write: 'Isosceles triangle, base angles $58^{\circ}$, all vertices on a circle'
      - say: 'Let me draw a diagram of the circle first, so we can see what we are working with.'
        show_sketch: true
        point:
          - {figure: sketch, kind: arc, target: ABC, text: '58°'}
          - {figure: sketch, kind: arc, target: ACB, text: '58°'}
      - say: 'The base of the triangle is a chord of the circle. It makes one angle at the top corner of the triangle, the apex, and another at the centre. So first we need the apex angle.'
        write: 'Step 1: the apex angle'
        point:
          - {figure: sketch, kind: highlight, target: 'BC', text: 'chord'}
          - {figure: sketch, kind: circle, target: 'A', text: 'apex'}
          - {figure: sketch, kind: circle, target: 'O', text: 'centre'}
      - say: 'Angles in a triangle always add up to 180 degrees.'
        write: 'Angle sum of a triangle $= 180^{\circ}$'
      - say: 'The angles in a triangle add up to 180 degrees, and the two base angles are 58 degrees each.'
        write: 'Apex $= 180^{\circ} - 58^{\circ} - 58^{\circ}$'
      - say: '58 plus 58 is 116, and 180 minus 116 is 64 degrees.'
        write: '$= 180^{\circ} - 116^{\circ} = 64^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: BAC, text: '64°'}
      - say: 'The apex lies on the circle. So 64 degrees is the angle the base subtends at the circumference.'
        write: 'Angle at circumference $= 64^{\circ}$'
        point:
          - {figure: sketch, kind: circle, target: 'A', text: 'on the circle'}
      - say: 'Now let me join the centre $O$ to $B$ and $C$. The angle between those two lines, at the centre, is the one we want.'
        show_sketch: sketch_b
        point:
          - {figure: sketch_b, kind: circle, target: '?', text: 'angle at centre'}
      - say: 'Here''s the circle theorem: the angle at the centre is twice the angle at the circumference, when both stand on the same arc.'
        write: 'Angle at centre $= 2 \times$ angle at circumference'
        point:
          - {figure: sketch_b, kind: circle, target: 'O', text: 'centre'}
          - {figure: sketch_b, kind: circle, target: 'A', text: 'circumference'}
      - say: 'Put in the 64 degrees we just found.'
        write: '$= 2 \times 64^{\circ}$'
        point:
          - {line: 8, kind: box, text: 'the rule'}
          - {line: 9, kind: move, from: {line: 6, at: '64'}, at: '64', text: 'found here'}
      - say: '2 times 64 is 128 degrees.'
        write: '$= 128^{\circ}$'
        point:
          - {figure: sketch_b, kind: arc, target: BOC, text: '128°'}
      - say: 'A quick check: the apex angle is less than 90 degrees, so the angle at the centre must be less than 180. And 128 is.'
        write: 'Check: $64^{\circ} < 90^{\circ}$, so centre angle $< 180^{\circ}$'
      - say: 'So the base subtends 128 degrees at the centre, which is answer choice A.'
        write: 'Angle at centre $= 128^{\circ}$'
        answer: true
    traps:
      B: 'You went for 116 degrees. That''s twice a base angle, which is the angle one of the equal sides makes at the centre. The base is opposite the 64 degree apex, so it makes 128 degrees.'
      C: 'You went for 64 degrees. That''s the apex angle, the angle at the circumference. The angle at the centre is double that, 128 degrees.'
      D: 'You went for 58 degrees. That''s a base angle from the question. Find the apex, 64 degrees, then double it to get 128 degrees.'
  26:
    moments:
      - say: 'In the diagram, $FK$ is parallel to $GR$, $FH$ equals $GH$, angle $RFK$ is 34 degrees and angle $FGH$ is 47 degrees. We want the angle $x$ at $F$, between $FH$ and $FR$.'
        write: '$FK \parallel GR,\ FH = GH,\ \angle RFK = 34^{\circ},\ \angle FGH = 47^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: RFK, text: '34°'}
          - {figure: 0, kind: arc, target: FGH, text: '47°'}
          - {figure: 0, kind: circle, target: x, text: 'find'}
      - say: 'Three facts are in play: parallel lines, the angle sum of a triangle, and an isosceles triangle. Start with the parallel lines. $FR$ cuts across $FK$ and $GR$, so angle $RFK$ and angle $FRG$ are alternate angles, and alternate angles are equal.'
        write: 'Alternate angles: $\angle FRG = \angle RFK$'
        point:
          - {figure: 0, kind: highlight, target: 'FR', text: 'cuts across'}
          - {figure: 0, kind: highlight, target: 'FK'}
          - {figure: 0, kind: highlight, target: 'GR'}
      - say: 'Angle $RFK$ is given as 34 degrees, so the angle at $R$ is 34 degrees too.'
        write: '$\angle FRG = 34^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: FRG, text: '34°'}
      - say: 'Angles in a triangle always add up to 180 degrees.'
        write: 'Angle sum of a triangle $= 180^{\circ}$'
      - say: 'Now the big triangle $FGR$. It has 47 degrees at $G$, and the 34 degrees we just found at $R$. Its angles add up to 180.'
        write: 'In $\triangle FGR$: $\angle GFR = 180^{\circ} - 47^{\circ} - 34^{\circ}$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: '34'}, at: '− 34', text: 'at R'}
          - {figure: 0, kind: circle, target: '47°'}
          - {figure: 0, kind: circle, target: '34°'}
      - say: '47 plus 34 is 81, and 180 minus 81 is 99 degrees. That''s the whole angle at $F$.'
        write: '$= 180^{\circ} - 81^{\circ} = 99^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: GFR, text: '99°'}
      - say: 'Next, triangle $FGH$ is isosceles, because $FH$ equals $GH$. The equal angles face the equal sides: $FH$ faces the angle at $G$, and $GH$ faces the angle at $F$.'
        write: '$FH = GH \Rightarrow \angle GFH = \angle FGH$'
        point:
          - {figure: 0, kind: highlight, target: FH}
          - {figure: 0, kind: highlight, target: GH}
      - say: 'Angle $FGH$ is 47 degrees, so angle $GFH$ is also 47 degrees.'
        write: '$\angle GFH = 47^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: GFH, text: '47°'}
      - say: 'The whole angle at $F$ is made of two parts: angle $GFH$, and our angle $x$ between $FH$ and $FR$.'
        write: '$\angle GFR = \angle GFH + x$'
        point:
          - {figure: 0, kind: circle, target: 'x', text: 'the other part'}
      - say: 'So $x$ is the whole angle, 99 degrees, minus the isosceles part, 47 degrees.'
        write: '$x = 99^{\circ} - 47^{\circ}$'
        point:
          - {line: 9, kind: move, from: {line: 5, at: '99'}, at: '99', text: 'whole angle'}
          - {line: 9, kind: move, from: {line: 7, at: '47'}, at: '− 47', text: 'isosceles part'}
      - say: '99 minus 47 is 52.'
        write: '$= 52^{\circ}$'
      - say: 'So $x$ is 52 degrees, which is answer choice B.'
        write: '$x = 52^{\circ}$'
        answer: true
        point:
          - {figure: 0, kind: label, target: x, text: '52°'}
    traps:
      A: 'You went for 42 degrees. Check the angle sum: 180 minus 47 minus 34 is 99, and 99 minus 47 is 52, not 42.'
      C: 'You went for 64 degrees. The key steps are: the angle at $R$ is 34 by alternate angles, the whole angle at $F$ is 99, and the isosceles part is 47. That leaves 52.'
      D: 'You went for 72 degrees. The equal angles in triangle $FGH$ are at $F$ and $G$, since they face the equal sides. So 47 degrees is taken from the 99, leaving 52.'
  27:
    moments:
      - say: 'In the diagram, two circles have radii 3 cm and 2 cm, with centres $X$ and $Y$. Their direct common tangent is 25 cm long. We want $XY$ squared.'
        write: 'Radii $3$ cm and $2$ cm, direct common tangent $25$ cm'
        point:
          - {figure: 0, kind: circle, target: '3 cm'}
          - {figure: 0, kind: circle, target: '2 cm'}
          - {figure: 0, kind: highlight, target: '25 cm', text: 'tangent'}
      - say: 'A tangent meets a radius at a right angle. So the two radii, drawn to where the tangent touches, both stand at right angles to it.'
        write: 'Radius $\perp$ tangent at each point of contact'
        point:
          - {figure: 0, kind: circle, target: {x: 90, y: 114}, text: '90°'}
          - {figure: 0, kind: circle, target: {x: 308, y: 128}, text: '90°'}
      - say: 'For a direct tangent, both radii are on the same side. Now draw a line from $Y$ parallel to the tangent, across to the radius from $X$. That makes a right-angled triangle with $XY$ as its hypotenuse.'
        write: 'Right-angled triangle with hypotenuse $XY$'
        point:
          - {figure: 0, kind: highlight, target: 'XY', text: 'hypotenuse'}
      - say: 'The line we drew is parallel to the tangent and just as long, so one leg of the triangle is 25 cm.'
        write: 'Leg 1 $= 25$ cm, the same as the tangent'
        point:
          - {figure: 0, kind: circle, target: '25 cm', text: 'leg 1'}
      - say: 'The other leg runs along the 3 cm radius, from $X$ to our new line. The line sits 2 cm from the tangent, the length of the smaller radius, so this leg is 3 minus 2, which is 1 cm.'
        write: 'Leg 2 $= 3 - 2 = 1$ cm'
        point:
          - {figure: 0, kind: circle, target: '3 cm'}
          - {figure: 0, kind: circle, target: '2 cm', text: '3 − 2 = 1'}
      - say: 'Pythagoras: the hypotenuse squared equals the opposite squared plus the adjacent squared.'
        write: 'Pythagoras: $\text{hypotenuse}^{2} = \text{opposite}^{2} + \text{adjacent}^{2}$'
      - say: 'Here the hypotenuse is $XY$, and the other two sides are 25 and 1.'
        write: 'Here: hypotenuse $= XY$, other sides $25$ and $1$'
      - say: 'Now use Pythagoras: the hypotenuse squared equals the sum of the squares of the two legs.'
        write: '$XY^{2} = 25^{2} + 1^{2}$'
        point:
          - {line: 7, kind: move, from: {line: 3, at: '25'}, at: '[[25]]2', text: 'leg 1'}
          - {line: 7, kind: move, from: {line: 4, at: '= 1'}, at: '+ [[1]]2', text: 'leg 2'}
      - say: '25 squared is 625, and 1 squared is 1.'
        write: '$= 625 + 1$'
      - say: '625 plus 1 is 626.'
