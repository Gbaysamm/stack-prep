# UTME 1998 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1998.yaml. Answers match that file.
format_version: 1
exam_year: 1998
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'One-zero-one-one base two, plus X base seven, equals 25 base ten. Three bases at once, so we work in base ten, then write X in base seven.'
        write: 'If $1011_{2} + X_{7} = 25_{10}$, solve for $X$'
      - say: 'First, change one-zero-one-one base two to base ten.'
        write: 'Solution'
      - section: 'Step 1: base 2 to base 10'
        say: 'Write the index numbers over the digits, from nought on the right: nought, one, two, three.'
        write: '$\overset{3}{1}\,\overset{2}{0}\,\overset{1}{1}\,\overset{0}{1}_{2}$'
      - say: 'Each digit times two to the power of its index: 1 times 2 cubed, plus 0 times 2 squared, plus 1 times 2 to the 1, plus 1 times 2 to the nought.'
        write: '$= 1 \times 2^{3} + 0 \times 2^{2} + 1 \times 2^{1} + 1 \times 2^{0}$'
      - say: '2 cubed is 8, 2 squared is 4, 2 to the power 1 is 2, and 2 to the power nought is 1.'
        write: '$= 1 \times 8 + 0 \times 4 + 1 \times 2 + 1 \times 1$'
      - say: '1 times 8 is 8, 0 times 4 is 0, 1 times 2 is 2, and 1 times 1 is 1.'
        write: '$= 8 + 0 + 2 + 1$'
      - say: '8 plus 0 plus 2 plus 1 is 11, base ten.'
        write: '$= 11_{10}$'
      - section: 'Step 2: find X in base ten'
        say: 'Put 11 into the equation. 25 is already in base ten.'
        write: '$11 + X = 25$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '=[[11]]10'}, at: '11'}
      - say: 'Subtract 11 from both sides. 25 minus 11 is 14.'
        write: '$X = 25 - 11 = 14_{10}$'
      - section: 'Step 3: base 10 to base 7'
        say: 'But X carries the base seven label. So divide 14 by 7 on the ladder, and keep the remainders.'
        diagram: {id: L, kind: ladder, divisor: 7, number: 14, 'on': 'ladder'}
      - say: '14 divided by 7 is 2, remainder 0.'
        diagram_do:
          - {id: L, op: step}
      - say: '2 divided by 7 is 0, remainder 2. We stop at 0.'
        diagram_do:
          - {id: L, op: step}
      - say: 'Read the remainders from the bottom up: two, zero. So 14 is two-zero base seven.'
        diagram_do:
          - {id: L, op: read, 'on': 'bottom up'}
        write: '$14_{10} = 20_{7}$'
        point:
          - {line: 12, kind: highlight, at: '207', to: {diagram: L, part: result}}
      - section: 'Check'
        say: 'Check by expanding two-zero base seven: 2 times 7, plus 0 times 1, is 14.'
        write: '$\overset{1}{2}\,\overset{0}{0}_{7} = 2 \times 7^{1} + 0 \times 7^{0} = 14$'
      - say: 'And 11 plus 14 is 25, just as the question says.'
        write: '$11 + 14 = 25\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore X is two-zero base seven, which is option B.'
        write: '$\therefore X = 20_{7}$'
        answer: true
    traps:
      A: 'You went for 14. That is the right value, but in base ten. X carries the base seven label, so 14 goes on the ladder: two-zero base seven.'
      C: 'You went for two-four. In base seven that is 2 times 7 plus 4, which is 18, and 11 plus 18 is 29, not 25. 14 divided by 7 is 2, remainder 0.'
      D: 'You went for 25. That is the total on the right, not X. Take away the 11 that one-zero-one-one base two is worth, then change 14 to base seven.'

  2:
    moments:
      - section: 'The question'
        say: 'A square bracket with a power of negative 1 outside, correct to 2 decimal places. Two flips happen in this question. Miss one and you land on a trap.'
        write: '$\left[\dfrac{1}{0.03} \div \dfrac{1}{0.024}\right]^{-1}$ (2 d.p.)'
      - section: 'Solution'
        say: 'Solution. By BODMAS, brackets first: we simplify inside the bracket, then use the power outside it.'
        write: 'By BODMAS: the bracket first'
      - section: 'Step 1: the bracket'
        say: 'To divide by a fraction, multiply by its reciprocal: keep the first, change divide to times, turn the second upside down.'
        write: 'Bracket: $\dfrac{1}{0.03} \div \dfrac{1}{0.024} = \dfrac{1}{0.03} \times \dfrac{0.024}{1}$'
      - say: 'Top times top is 0.024. Bottom times bottom is 0.03.'
        write: '$= \dfrac{0.024}{0.03}$'
      - say: 'Clear the decimals: multiply the top and the bottom by 1000. 0.024 becomes 24, and 0.03 becomes 30.'
        write: '$= \dfrac{24}{30}$'
      - say: 'Divide the top and the bottom by 6: 24 divided by 6 is 4, and 30 divided by 6 is 5. Picture a bar of 5 pieces with 4 shaded.'
        write: '$= \dfrac{4}{5} = 0.8$'
        doodle: {name: 'custom:1998_q02_a', id: bar, caption: '4 pieces out of 5'}
        point:
          - {line: 5, kind: highlight, at: '0.8', to: {doodle: bar, part: row1}}
      - section: 'Step 2: the power'
        say: 'Now the power outside. A power of negative 1 means the reciprocal: x to the power negative 1 is 1 over x.'
        write: '$x^{-1} = \dfrac{1}{x}$'
      - say: 'So the bracket, 4 over 5, to the power negative 1 is that fraction turned upside down: 5 over 4.'
        write: '$\left(\dfrac{4}{5}\right)^{-1} = \dfrac{5}{4}$'
        doodle_do:
          - {id: bar, op: stage, stage: 'custom:1998_q02_a2'}
      - say: '5 divided by 4 is 1.25: one whole and a quarter more, as the bar shows.'
        write: '$= 1.25$'
        doodle_do:
          - {id: bar, op: label, part: row2, text: '1.25'}
      - say: 'To 2 decimal places, 1.25 already has exactly two digits after the point, so it stays 1.25.'
        write: '$= 1.25$ (2 d.p.)'
      - section: 'Check'
        say: 'Check: 1.25 times the bracket, 0.8, should give 1. 1.25 times 0.8 is 1.00. It agrees.'
        write: 'Check: $1.25 \times 0.8 = 1$ ✓'
      - say: 'Therefore the value is 1.25: option B.'
        write: '$\therefore$ value $= 1.25$ (B)'
        answer: true
    traps:
      A: 'You went for 3.76. That does not come from this working. The bracket simplifies to 0.024 over 0.03, which is 0.8, and its reciprocal is 1.25.'
      C: 'You went for 0.94. Check the bracket: dividing by 1 over 0.024 means multiplying by 0.024, which gives 0.8. The power of negative 1 then turns it to 1.25.'
      D: 'You went for 0.75. The bracket is 0.024 over 0.03, which is 0.8, not 0.75. And the power of negative 1 still has to turn it over: 1 over 0.8 is 1.25.'

  3:
    moments:
      - say: 'We''re given $b^{3} = a^{-3}$ and $c^{1/3} = a^{1/2}b$, and we want $c$ in terms of $a$.'
        write: '$b^{3} = a^{-3}, \quad c^{1/3} = a^{1/2}b$'
      - say: 'The letter $b$ links the two conditions. So the first thing we need to do is write $b$ in terms of $a$, using the first condition.'
        write: 'From $b^{3} = a^{-3}$:'
      - say: 'The rule for roots and indices: the $n$th root of $a$ to the $m$ is $a$ to the $m$ over $n$.'
        write: '$\sqrt[n]{a^{m}} = a^{m/n}$'
      - say: 'Picture $b^{3}$ as three equal blocks of $b$ multiplied together, and $a^{-3}$ as three blocks of 1 over $a$. Take the cube root of both sides. A cube root undoes a cube, and it divides the index by 3.'
        write: '$b = a^{-3 \div 3}$'
        doodle: {name: 'custom:1998_q03_a', id: blocks, caption: 'b × b × b = 1/a × 1/a × 1/a'}
      - say: 'Negative 3 divided by 3 is negative 1. In the picture, the cube root keeps one block from each row: one $b$ matches one 1 over $a$. So $b$ is $a$ to the power negative 1.'
        write: '$b = a^{-1}$'
        point:
          - {line: 4, kind: highlight, at: 'b = a-1', to: {doodle: blocks, part: root}}
        doodle_do:
          - {id: blocks, op: stage, stage: 'custom:1998_q03_a2'}
      - say: 'Now go to the second condition, and replace $b$ with the $a^{-1}$ from the circled blocks.'
        write: '$c^{1/3} = a^{1/2} \times a^{-1}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: 'a−1'}, at: '× a−1', text: 'in place of b'}
        doodle_do:
          - {id: blocks, op: pulse, part: root}
      - say: 'The law of indices for multiplying: when we multiply powers of the same base, we add the indices.'
        write: '$a^{m} \times a^{n} = a^{m + n}$'
      - say: 'So the new index is a half plus negative 1.'
        write: '$c^{1/3} = a^{\frac{1}{2} + (-1)}$'
      - say: 'A half plus negative 1 is a half minus 1, which is negative a half.'
        write: '$c^{1/3} = a^{-1/2}$'
      - say: 'But the question asks for $c$, not $c$ to the power one third. How do we undo a power of one third? We cube both sides.'
        write: '$\left(c^{1/3}\right)^{3} = \left(a^{-1/2}\right)^{3}$'
      - say: 'A power of a power means multiply the indices. On the left, one third times 3 is 1, leaving just $c$. On the right, negative a half times 3 is negative 3 over 2.'
        write: '$c = a^{-\frac{1}{2} \times 3} = a^{-3/2}$'
      - say: 'Let''s check with a number. Say $a$ is 4. Then $b$ is 1 over 4, and $c^{1/3}$ is root 4 times 1 over 4, which is 2 over 4, or a half. Cubing that, $c$ is 1 over 8.'
        write: 'Check, $a = 4$: $b = \tfrac{1}{4}$, $c^{1/3} = 2 \times \tfrac{1}{4} = \tfrac{1}{2}$, so $c = \tfrac{1}{8}$'
      - say: 'Our formula gives 4 to the power negative 3 over 2. That is 1 over root 4 cubed, which is 1 over 2 cubed, 1 over 8. They agree.'
        write: '$4^{-3/2} = \dfrac{1}{(\sqrt{4})^{3}} = \dfrac{1}{2^{3}} = \dfrac{1}{8}$'
      - say: 'So $c$ is $a$ to the power negative 3 over 2, which is answer choice C.'
        write: '$c = a^{-3/2}$'
        answer: true
    traps:
      A: 'You went for $a^{-1/2}$. That is $c^{1/3}$, the line before the last step. The question wants $c$ itself, so cube both sides: negative a half times 3 is negative 3 over 2.'
      B: 'You went for $a^{1/2}$. The sign has gone wrong: a half plus negative 1 is negative a half, not positive a half. And $c^{1/3}$ still needs cubing after that.'
      D: 'You went for $a^{-2/3}$. To go from $c^{1/3}$ to $c$ we cube, which multiplies the index by 3. Negative a half times 3 is negative 3 over 2, not negative 2 over 3.'

  4:
    moments:
      - section: 'The question'
        say: 'Two equations full of logs. They look frightening, but each one becomes a plain equation once you know two facts about logs. Learn the two facts, and the rest is ordinary algebra.'
        write: 'Find $x$ and $y$, in that order'
        doodle: {name: 'custom:1998_q04_a', id: count, caption: 'a log counts the factors'}
      - section: 'What we know'
        say: 'The first equation has logs in base 4.'
        write: '$\log_{4}(y + 1) + \log_{4}\left(\tfrac{1}{2}x\right) = 1$'
      - say: 'The second equation has logs in base 2.'
        write: '$\log_{2}(y - 1) + \log_{2}x = 2$'
      - say: 'The plan: turn each equation into one with no logs at all. Then solve the two equations together.'
        write: 'Plan: remove the logs, then solve'
        'on': 'plan'
      - section: 'Two facts about logs'
        say: 'Fact one, what a log means. Log base 4 of a number asks: how many 4s do we multiply together to make that number? Look at the picture: one 4 makes 4. So log base 4 of 4 is 1.'
        write: 'Meaning: $\log_{a}N = k$ means $N = a^{k}$'
        doodle_do:
          - {id: count, op: circle, part: fours, text: 'one 4 makes 4', 'on': 'one 4 makes 4'}
      - say: 'Fact two, adding logs. When we add two logs with the same base, we multiply the numbers inside them, and keep one log.'
        write: 'Adding: $\log_{a}M + \log_{a}N = \log_{a}(M \times N)$'
        'on': 'adding logs'
      - section: 'The first equation'
        say: 'Use fact two on the first equation. Both logs are base 4, so multiply what is inside: y plus 1, times a half x.'
        write: '$\log_{4}\left[(y + 1) \times \tfrac{1}{2}x\right] = 1$'
        point:
          - {line: 6, kind: arrow, from: {line: 5, at: '(M×N)'}, at: '×', text: 'fact two', 'on': 'multiply what is inside'}
      - say: 'Now fact one. Log base 4 of that product is 1, so the product is 4 to the power 1, one 4, which is 4.'
        write: '$(y + 1) \times \tfrac{1}{2}x = 4^{1} = 4$'
        point:
          - {line: 7, kind: highlight, at: '41 = 4', to: {doodle: count, part: fours}, 'on': 'one 4'}
      - say: 'Multiply both sides by 2 to clear the half. 4 times 2 is 8. We call this equation 1.'
        write: '$(y + 1)x = 8 \quad (1)$'
      - section: 'The second equation'
        say: 'Now the second equation. Both logs are base 2, so by fact two, multiply what is inside: y minus 1, times x.'
        write: '$\log_{2}\left[(y - 1)x\right] = 2$'
      - say: 'By fact one, log base 2 of that product is 2, so the product is 2 to the power 2: two 2s multiplied, which is 4. Watch the two 2s join the picture. We call this equation 2.'
        write: '$(y - 1)x = 2^{2} = 4 \quad (2)$'
        doodle_do:
          - {id: count, op: stage, stage: 'custom:1998_q04_a2', 'on': 'two 2s join the picture'}
        point:
          - {line: 10, kind: highlight, at: '22 = 4', to: {doodle: count, part: twos}, 'on': 'two 2s join the picture'}
      - section: 'Solve the pair'
        say: 'Open the bracket in equation 1. y times x is xy, and 1 times x is x. So xy plus x equals 8.'
        write: '(1): $xy + x = 8$'
      - say: 'Open the bracket in equation 2 the same way: xy minus x equals 4.'
        write: '(2): $xy - x = 4$'
      - say: 'Now take equation 2 away from equation 1. Watch the xy: xy minus xy is 0, so it disappears. That is why we subtract.'
        write: '(1) $-$ (2): $(xy + x) - (xy - x) = 8 - 4$'
        point:
          - {line: 13, kind: travel, at: '(xy + x)', from: {line: 11, at: 'xy + x'}, text: '(1)', 'on': 'equation 1'}
          - {line: 13, kind: travel, at: '(xy − x)', from: {line: 12, at: 'xy − x'}, text: '(2)', 'on': 'equation 2'}
      - say: 'What is left: x minus negative x is x plus x, which is 2x. On the right, 8 minus 4 is 4.'
        write: '$2x = 4$'
      - say: 'Divide both sides by 2. 4 divided by 2 is 2.'
        write: '$x = \dfrac{4}{2} = 2$'
      - say: 'Now put x equals 2 into equation 2.'
        write: 'Into (2): $(y - 1)(2) = 4$'
        point:
          - {line: 16, kind: travel, at: '[[(2)]] = 4', from: {line: 15, at: '= [[2]]'}, text: 'x', 'on': 'x equals 2'}
      - say: 'Divide both sides by 2. 4 divided by 2 is 2. So y minus 1 equals 2.'
        write: '$y - 1 = \dfrac{4}{2} = 2$'
      - say: 'Add 1 to both sides. 2 plus 1 is 3.'
        write: '$y = 2 + 1 = 3$'
      - section: 'Check'
        say: 'Let''s check in equation 1. y plus 1 is 3 plus 1, which is 4, and 4 times 2 is 8. It works. Every number inside a log is positive too, as it must be.'
        write: 'Check (1): $(3 + 1)(2) = 4 \times 2 = 8$'
      - say: 'The question says x and y respectively. Respectively means in the order asked: x first, then y. So x is 2 and y is 3, which is answer choice A.'
        write: '$\therefore x = 2,\ y = 3$'
        answer: true
    traps:
      B: 'You went for 3, 2. Those are the right numbers in the wrong order. The question asks for x and y respectively, so x, which is 2, comes first.'
      C: 'You went for negative 2, negative 3. That is what you get if y plus 1 and y minus 1 are swapped between the two equations. Also, a log only takes a positive number, so negative values can''t fit. Here x is 2 and y is 3.'
      D: 'You went for negative 3, negative 2. A log only takes a positive number, so x and y minus 1 can''t be negative here. Solving gives x equals 2 and y equals 3, with x first.'

  5:
    moments:
      - say: 'We want the value of $K$ that makes this fraction equal to $\sqrt{6} - 2$.'
        write: '$\dfrac{K}{\sqrt{3} + \sqrt{2}} = \sqrt{6} - 2$'
      - say: '$K$ is being divided by $\sqrt{3} + \sqrt{2}$. To get $K$ by itself, multiply both sides by $\sqrt{3} + \sqrt{2}$.'
        write: '$K = (\sqrt{6} - 2)(\sqrt{3} + \sqrt{2})$'
        point:
          - {line: 1, kind: move, from: {line: 0, at: '3 + 2'}, at: '(3 + 2)', text: 'times both sides'}
      - say: 'We could expand straight away, but here''s a neater way. Look at the first bracket. $\sqrt{6}$ is $\sqrt{2}$ times $\sqrt{3}$, and 2 is $\sqrt{2}$ times $\sqrt{2}$.'
        write: 'First bracket: $\sqrt{6} - 2 = \sqrt{2}\sqrt{3} - \sqrt{2}\sqrt{2}$'
      - say: 'Both terms have a $\sqrt{2}$, so take it out as a common factor.'
        write: '$= \sqrt{2}(\sqrt{3} - \sqrt{2})$'
      - say: 'Now put that back into the line for $K$, in place of $\sqrt{6} - 2$.'
        write: '$K = \sqrt{2}(\sqrt{3} - \sqrt{2})(\sqrt{3} + \sqrt{2})$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '2(3 − 2)'}, at: '2(3 − 2)', text: 'in place of √6 − 2'}
      - say: 'The difference of two squares: $a$ minus $b$, times $a$ plus $b$, is $a$ squared minus $b$ squared. Picture a square with side $\sqrt{3}$: its area is 3.'
        write: '$(a - b)(a + b) = a^{2} - b^{2}$'
        doodle: {name: 'custom:1998_q05_a', id: tiles, caption: '√3 by √3 is a square of area 3'}
      - say: 'Look at the last two brackets: the same two surds, once with a minus and once with a plus. That is a difference of two squares. Now a square of side $\sqrt{2}$, area 2, goes inside the big one.'
        write: '$(\sqrt{3} - \sqrt{2})(\sqrt{3} + \sqrt{2}) = (\sqrt{3})^{2} - (\sqrt{2})^{2}$'
        doodle_do:
          - {id: tiles, op: stage, stage: 'custom:1998_q05_a2'}
      - say: '$\sqrt{3}$ squared is 3, $\sqrt{2}$ squared is 2, and 3 minus 2 is 1: the yellow strip left over.'
        write: '$= 3 - 2 = 1$'
        point:
          - {line: 7, kind: highlight, at: '3 - 2 = 1', to: {doodle: tiles, part: rest}}
        doodle_do:
          - {id: tiles, op: stage, stage: 'custom:1998_q05_a3'}
      - say: 'So in the line for $K$, those two brackets together are worth just 1, the leftover strip. That leaves $\sqrt{2}$ times 1.'
        write: '$K = \sqrt{2} \times 1 = \sqrt{2}$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '= 1'}, at: '× 1', text: 'worth 1'}
        doodle_do:
          - {id: tiles, op: pulse, part: rest}
      - say: 'Let''s check by expanding the original product directly: each term in the first bracket times each term in the second.'
        write: 'Check: $(\sqrt{6} - 2)(\sqrt{3} + \sqrt{2}) = \sqrt{18} + \sqrt{12} - 2\sqrt{3} - 2\sqrt{2}$'
      - say: '$\sqrt{18}$ is $\sqrt{9}$ times $\sqrt{2}$, which is $3\sqrt{2}$. And $\sqrt{12}$ is $\sqrt{4}$ times $\sqrt{3}$, which is $2\sqrt{3}$.'
        write: '$= 3\sqrt{2} + 2\sqrt{3} - 2\sqrt{3} - 2\sqrt{2}$'
      - say: 'The $2\sqrt{3}$ terms cancel, and $3\sqrt{2}$ minus $2\sqrt{2}$ is $\sqrt{2}$. The same answer.'
        write: '$= \sqrt{2}$'
      - say: 'So $K$ is $\sqrt{2}$, which is answer choice D.'
        write: '$K = \sqrt{2}$'
        answer: true
    traps:
      A: 'You went for 3. That is $\sqrt{3}$ squared from the difference of two squares, but that step gives 3 minus 2, which is 1, and $K$ is $\sqrt{2}$ times that 1.'
      B: 'You went for 2. That is $\sqrt{2}$ squared, but nothing here is squared on its own. $K$ is $\sqrt{2}$ times 1, which is just $\sqrt{2}$.'
      C: 'You went for $\sqrt{3}$. Check the common factor: $\sqrt{6} - 2$ factorises as $\sqrt{2}$ times $(\sqrt{3} - \sqrt{2})$, so the factor left over is $\sqrt{2}$, not $\sqrt{3}$.'

  6:
    moments:
      - say: 'A market woman buys a full jug of oil for ₦50 and sells the oil in small tins at ₦15 each. We want how much she makes.'
        write: 'Jug costs ₦50.00; each tin sells for ₦15.00'
      - say: 'Let me draw the jug and the tin.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'jug: ₦50'}
          - {figure: sketch, kind: circle, target: 'tin: ₦15 each'}
      - say: 'Picture her pouring the jug into small tins. The first thing we need is how many tins the jug fills. Both are cylinders, so we compare their volumes. A cylinder''s volume is $\pi r^{2}h$.'
        write: '$V = \pi r^{2}h$'
        point:
          - {figure: sketch, kind: underline, target: 'how many tins?'}
        doodle: {name: 'custom:1998_q06_a', id: stall, caption: 'pour the jug into tins, then sell them', size: scene}
      - say: 'Careful: the sizes are given as diameters, and the formula needs radii. The jug is 10 cm across, so its radius is half of 10, which is 5 cm. It is 18 cm deep.'
        write: 'Jug: $r = \tfrac{10}{2} = 5,\ h = 18$'
        point:
          - {figure: sketch, kind: circle, target: '18 cm', text: 'h'}
      - say: 'Put those into the formula for the jug.'
        write: '$V_{\text{jug}} = \pi \times 5^{2} \times 18$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
          - {line: 4, kind: move, from: {line: 3, at: '= 5'}, at: '[[5]]2', text: 'radius'}
          - {line: 4, kind: move, from: {line: 3, at: 'h = 18'}, at: '18', text: 'height'}
      - say: '5 squared is 25, and 25 times 18 is 450. So the jug holds $450\pi$ cubic centimetres.'
        write: '$= \pi \times 25 \times 18 = 450\pi\ \text{cm}^{3}$'
      - say: 'Each tin is 6 cm across, so its radius is half of 6, which is 3 cm. It is 10 cm deep.'
        write: 'Tin: $r = \tfrac{6}{2} = 3,\ h = 10$'
        point:
          - {figure: sketch, kind: circle, target: '6 cm', text: 'r = 3'}
      - say: 'Put those into the same formula.'
        write: '$V_{\text{tin}} = \pi \times 3^{2} \times 10$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '= 3'}, at: '[[3]]2', text: 'radius'}
          - {line: 7, kind: move, from: {line: 6, at: 'h = 10'}, at: '10', text: 'height'}
      - say: '3 squared is 9, and 9 times 10 is 90. So a tin holds $90\pi$ cubic centimetres.'
        write: '$= \pi \times 9 \times 10 = 90\pi\ \text{cm}^{3}$'
      - say: 'The number of tins is the jug''s volume divided by a tin''s volume. The $\pi$ cancels, and 450 divided by 90 is 5. Watch the five tins fill.'
        write: 'Number of tins $= \dfrac{450\pi}{90\pi} = 5$'
        point:
          - {line: 9, kind: move, from: {line: 5, at: '450π'}, at: '450π', text: 'jug'}
          - {line: 9, kind: move, from: {line: 8, at: '90π'}, at: '90π', text: 'tin'}
          - {figure: sketch, kind: label, target: 'how many tins?', text: '5 tins'}
        doodle_do:
          - {id: stall, op: stage, stage: 'custom:1998_q06_a2'}
      - say: 'She sells those 5 tins at ₦15 each: 5 coins of ₦15. 5 times 15 is 75, so she takes in ₦75.'
        write: 'Money in $= 5 \times 15 =$ ₦75'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '= 5'}, at: '5 ×', text: 'tins'}
          - {line: 10, kind: highlight, at: '5 × 15', to: {doodle: stall, part: money}}
        doodle_do:
          - {id: stall, op: stage, stage: 'custom:1998_q06_a3'}
      - say: 'She paid ₦50 for the jug, the price on the tag. Her profit is what she took in minus what she paid: 75 minus 50 is 25.'
        write: 'Profit $= 75 - 50 =$ ₦25'
        point:
          - {line: 11, kind: move, from: {line: 10, at: '₦75'}, at: '75', text: 'in'}
          - {line: 11, kind: move, from: {line: 0, at: '₦[[50]]'}, at: '− 50', text: 'paid'}
        doodle_do:
          - {id: stall, op: circle, part: price}
          - {id: stall, op: label, part: money, text: '₦75 − ₦50 = ₦25 profit'}
      - say: 'So she made ₦25, which is answer choice D.'
        write: 'Profit: ₦25.00'
        answer: true
    traps:
      A: 'You went for ₦62.50. That doesn''t match the volumes: the jug holds exactly 5 tins, so she takes in ₦75 and, after the ₦50 she paid, makes ₦25.'
      B: 'You went for ₦35.00. Check the number of tins: with radii 5 and 3, the jug is $450\pi$ and a tin is $90\pi$, so it fills 5 tins. That brings in ₦75, and ₦75 minus ₦50 is ₦25.'
      C: 'You went for ₦31.00. Halve the diameters first, then compare the volumes: the jug fills exactly 5 tins, which sell for ₦75, leaving ₦25 after the ₦50 cost.'

  7:
    moments:
      - section: 'The question'
        say: 'A man earns r naira an hour for normal work, and double the rate for overtime. He works a 35-hour week, and q of those hours are overtime. What does he earn in the week?'
        write: 'Rate $= r$ naira/hour; overtime rate $= 2r$; 35 hours, $q$ of them overtime'
      - section: 'Solution'
        say: 'Solution. The key words are "which includes". The 35 hours already include the q overtime hours. Look at the week bar under the clocks.'
        write: 'Normal hours $= 35 - q$'
        doodle: {name: 'custom:1998_q07_a', id: clocks, caption: 'a 35-hour week: normal + overtime'}
      - say: 'Pay is rate times hours. Weekly earning is normal pay plus overtime pay.'
        write: 'Earning $=$ normal pay $+$ overtime pay'
      - section: 'Each part'
        say: 'Normal pay: 35 minus q hours at r naira each, the left-hand clock. That is r times bracket 35 minus q.'
        write: 'Normal pay $= r(35 - q)$'
        point:
          - {line: 3, kind: highlight, at: 'r(35 - q)', to: {doodle: clocks, part: week-normal}}
        doodle_do:
          - {id: clocks, op: highlight, part: week-normal, text: '35 − q at ₦r'}
      - say: 'Overtime pay: q hours at 2r naira each, the right-hand clock. 2r times q is 2rq.'
        write: 'Overtime pay $= 2r \times q = 2rq$'
        point:
          - {line: 4, kind: highlight, at: '2r × q', to: {doodle: clocks, part: week-over}}
        doodle_do:
          - {id: clocks, op: circle, part: overtime}
      - section: 'Add and simplify'
        say: 'Substitute both into the earning line.'
        write: 'Earning $= r(35 - q) + 2rq$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '= [[2rq]]'}, at: '+ [[2rq]]', text: 'overtime'}
      - say: 'Open the bracket: r times 35 is 35r, and r times negative q is negative rq.'
        write: '$= 35r - rq + 2rq$'
      - say: 'Collect like terms: negative rq plus 2rq is positive rq.'
        write: '$= 35r + rq$'
      - say: 'r is a common factor of both terms. Take it out: 35r divided by r is 35, and rq divided by r is q.'
        write: '$= r(35 + q)$'
      - section: 'Check'
        say: 'Check with numbers. Let r be 100 and q be 5. 30 normal hours at 100 is 3000, and 5 overtime hours at 200 is 1000. That is 4000.'
        write: 'Check, $r = 100,\ q = 5$: $30 \times 100 + 5 \times 200 = 4000$'
      - say: 'The formula gives 100 times 35 plus 5, which is 100 times 40, also 4000. It agrees.'
        write: '$r(35 + q) = 100 \times 40 = 4000$ ✓'
      - say: 'Therefore his weekly earning is r times bracket 35 plus q, naira: option A.'
        write: '$\therefore$ weekly earning $= r(35 + q)$ naira (A)'
        answer: true
    traps:
      B: 'You went for q(35r − q). Here q is taken out as a factor, but q is not in every term. The earning is 35r plus rq, and the common factor is r.'
      C: 'You went for q(35r + r). That multiplies everything by q, the overtime hours. Only the overtime pay has q in it: the earning is 35r plus rq, which is r(35 + q).'
      D: 'You went for r(35r − q). Taking r out of 35r leaves 35, not 35r, and the overtime adds rq rather than taking it away. The earning is r(35 + q).'

  8:
    moments:
      - say: 'We''re given three sets inside the universal set 1 to 6, and we want $P$ union, $Q$ union $R$.'
        write: '$P = \{1, 2, 3, 4\}, \ Q = \{3, 4, 5\}, \ R = \{2, 4, 6\}$'
      - say: 'Let me draw a Venn diagram, so we can see where everything belongs.'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'U', text: '1 to 6'}
      - say: 'A union collects every element that is in either set, writing each one only once. The bracket comes first, so we start with $Q \cup R$.'
        write: 'Step 1: $Q \cup R$'
      - say: 'Picture each set as a bag of numbered balls. $Q$ has 3, 4 and 5. $R$ has 2, 4 and 6.'
        write: '$Q \cup R = \{3, 4, 5\} \cup \{2, 4, 6\}$'
        doodle: {name: 'custom:1998_q08_a', id: bags, caption: 'sets as bags of numbered balls', size: scene}
      - say: 'Tip both bags into one. In order: 2, 3, 4, 5, 6. The 4 is in both bags, but the new bag holds it only once.'
        write: '$= \{2, 3, 4, 5, 6\}$'
        point:
          - {figure: sketch, kind: circle, target: 'Q'}
          - {figure: sketch, kind: circle, target: 'R'}
          - {line: 4, kind: highlight, at: '{2, 3, 4, 5, 6}', to: {doodle: bags, part: merged}}
        doodle_do:
          - {id: bags, op: stage, stage: 'custom:1998_q08_a2'}
          - {id: bags, op: circle, part: four, text: once}
      - say: 'Step 2. Now take the union of $P$ with the set we just found.'
        write: 'Step 2: $P \cup (Q \cup R) = \{1, 2, 3, 4\} \cup \{2, 3, 4, 5, 6\}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '{2, 3, 4, 5, 6}'}, at: '{2, 3, 4, 5, 6}', text: 'Q ∪ R'}
      - say: '$P$ brings in the 1, which wasn''t in the bag yet. Its 2, 3 and 4 are already in, so they are not added again.'
        write: '$= \{1, 2, 3, 4, 5, 6\}$'
        point:
          - {figure: sketch, kind: circle, target: '1', text: 'new from P'}
        doodle_do:
          - {id: bags, op: stage, stage: 'custom:1998_q08_a3'}
      - say: 'Compare the bag with the universal set, 1 to 6. Every element is there, so the answer is the whole universal set.'
        write: '$\{1, 2, 3, 4, 5, 6\} = U$'
        point:
          - {figure: sketch, kind: circle, target: 'U', text: 'everything'}
        doodle_do:
          - {id: bags, op: pulse, part: one}
      - say: 'Let''s double check by going through $U$. 1, 2 and 3 are in $P$. 4 is in all three sets. 5 is in $Q$, and 6 is in $R$. So each one belongs.'
        write: 'Check: $1, 2, 3, 4 \in P;\ 5 \in Q;\ 6 \in R$'
      - say: 'So $P \cup (Q \cup R)$ is the set 1, 2, 3, 4, 5, 6, which is answer choice D.'
        write: '$P \cup (Q \cup R) = \{1, 2, 3, 4, 5, 6\}$'
        answer: true
    traps:
      A: 'You went for the set with only 4 in it. That is what intersections would give, the one element in all three sets. A union keeps every element that is in any of the sets.'
      B: 'You went for 1, 2, 3, 4. That is just $P$ on its own. The union with $Q \cup R$ also brings in 5 and 6.'
      C: 'You went for 1, 2, 3, 5, 6. The 4 has been dropped, perhaps because it appears in more than one set. In a union, a shared element is still kept, written once.'

  9:
    moments:
      - say: 'In the Venn diagram there are three circles, $P$, $Q$ and $R$, and one region is shaded. We want the set expression for that region.'
        point:
          - {figure: 0, kind: highlight, target: {x: 110, y: 150}, text: 'shaded'}
      - say: 'Three overlapping circles cut the picture into seven separate pieces. The method: for each circle in turn, ask whether the shaded piece is inside it or outside it.'
      - say: 'First, $P$. The shaded piece sits inside the left-hand circle, $P$.'
        write: 'Inside $P$? Yes'
        point:
          - {figure: 0, kind: circle, target: P, text: 'inside'}
      - say: 'Next, $R$. It is also inside the bottom circle, $R$.'
        write: 'Inside $R$? Yes'
        point:
          - {figure: 0, kind: circle, target: R, text: 'inside'}
      - say: 'Now $Q$. The shading stops at the edge of the right-hand circle, so it is outside $Q$.'
        write: 'Inside $Q$? No'
        point:
          - {figure: 0, kind: strike, target: Q, text: 'outside'}
      - say: 'Being outside $Q$ means being in the complement of $Q$, which we write as $Q''$.'
        write: 'Outside $Q$ means in $Q''$'
      - say: 'So the piece is inside $P$ and outside $Q$ at the same time. The word "and" means intersection.'
        write: 'In $P$ and not in $Q$: $P \cap Q''$'
        point:
          - {line: 2, kind: arrow, text: 'in P'}
          - {line: 5, kind: arrow, text: 'not in Q'}
      - say: 'And the piece must also be inside $R$, so we intersect what we just wrote with $R$ as well.'
        write: 'Also in $R$: $(P \cap Q'') \cap R$'
        point:
          - {line: 3, kind: arrow, text: 'in R'}
      - say: 'Let''s test it on the middle piece, where all three circles overlap. That piece is inside $Q$, so $Q''$ leaves it out. That is right, because it is not shaded.'
        write: 'Middle piece: in $Q$, so not in $(P \cap Q'') \cap R$'
        point:
          - {figure: 0, kind: circle, target: {x: 150, y: 110}, text: 'middle: not shaded'}
      - say: 'So the shaded region is $P$ intersection $Q$ complement, intersection $R$, which is answer choice C.'
        write: 'Shaded region $= (P \cap Q'') \cap R$'
        answer: true
        point:
          - {figure: 0, kind: label, target: {x: 110, y: 150}, text: 'P ∩ Q'' ∩ R'}
    traps:
      A: 'You went for $(P \cap Q) \cup R$. That union takes in all of circle $R$, plus where $P$ and $Q$ overlap, which is far more than the shaded piece. The shaded piece is inside $P$ and $R$ but outside $Q$.'
      B: 'You went for $(P \cap Q) \cap R$. That is the small middle part inside all three circles. The shaded piece is outside $Q$, so it needs $Q''$, not $Q$.'
      D: 'You went for $(P \cup Q'') \cap R$. That union takes everything in $R$ that is in $P$ or outside $Q$, which is almost all of $R$. The shaded piece is in $P$ and outside $Q$ at once, so it needs an intersection.'

  10:
    moments:
      - section: 'The question'
        say: 'Two divisions, two remainders, two unknowns. The remainder theorem turns each division into an equation, and then it is simultaneous equations you already know.'
        write: 'Remainder 2 on dividing by $(m - 1)$; remainder 4 by $(m + 1)$'
      - section: 'Solution'
        say: 'Solution. Let $f$ of $m$ be the expression. The remainder theorem: when $f(m)$ is divided by $m - a$, the remainder is $f$ of $a$.'
        write: 'Let $f(m) = pm^{2} + qm + 1$'
      - section: 'First remainder'
        say: 'Set the first divisor equal to zero: $m - 1 = 0$, so $m$ is 1. Picture a machine: feed in 1, and out comes the remainder.'
        write: 'Let $m - 1 = 0$, $\ \therefore m = 1$'
        doodle: {name: 'custom:1998_q10_a', id: machine, caption: 'feed in the zero of the divisor'}
      - say: 'The remainder is $f$ of 1. Replace every $m$ with 1, in brackets.'
        write: 'Remainder $= f(1) = p(1)^{2} + q(1) + 1$'
      - say: '1 squared is 1, so $f$ of 1 is $p$ plus $q$ plus 1. The remainder is 2, so this equals 2.'
        write: '$p + q + 1 = 2$'
        doodle_do:
          - {id: machine, op: circle, part: run1}
      - say: 'Subtract 1 from both sides. 2 minus 1 is 1. Label this equation 1.'
        write: '$p + q = 1 \quad \ldots\ldots (1)$'
      - section: 'Second remainder'
        say: 'Now the second divisor. $m + 1 = 0$, so $m$ is minus 1. Feed minus 1 into the machine.'
        write: 'Let $m + 1 = 0$, $\ \therefore m = -1$'
        doodle_do:
          - {id: machine, op: stage, stage: 'custom:1998_q10_a2'}
      - say: 'The remainder is $f$ of minus 1. Replace every $m$ with minus 1, in brackets.'
        write: 'Remainder $= f(-1) = p(-1)^{2} + q(-1) + 1$'
      - say: 'Minus 1 squared is plus 1, and $q$ times minus 1 is minus $q$. The remainder is 4, so this equals 4.'
        write: '$p - q + 1 = 4$'
        doodle_do:
          - {id: machine, op: circle, part: run2}
      - say: 'Subtract 1 from both sides. 4 minus 1 is 3. Label this equation 2.'
        write: '$p - q = 3 \quad \ldots\ldots (2)$'
      - section: 'Solve (1) and (2)'
        say: 'The coefficients of $q$ are plus 1 and minus 1, so add the two equations and $q$ cancels. $p$ plus $p$ is $2p$, and 1 plus 3 is 4.'
        write: '(1) + (2): $\ 2p = 4$'
      - say: 'Divide both sides by 2. 4 over 2 is 2.'
        write: '$p = \dfrac{4}{2} = 2$'
      - say: 'Substitute $p = 2$ in equation 1.'
        write: 'Sub. $p = 2$ in (1): $\ 2 + q = 1$'
      - say: 'Subtract 2 from both sides. 1 minus 2 is minus 1.'
        write: '$q = 1 - 2 = -1$'
      - section: 'Check'
        say: 'Check. $f$ of 1 is 2 minus 1 plus 1, which is 2. $f$ of minus 1 is 2 plus 1 plus 1, which is 4. Both remainders work.'
        write: 'Check: $f(1) = 2 - 1 + 1 = 2$, $\ f(-1) = 2 + 1 + 1 = 4$'
      - say: 'Therefore $p$ is 2 and $q$ is minus 1, in that order, which is answer choice A.'
        write: '$\therefore p = 2,\ q = -1$'
        answer: true
    traps:
      B: 'You went for minus 1, 2. Those are the right numbers in the wrong order. The question asks for $p$ and $q$ respectively, and $p$ is 2.'
      C: 'You went for 3, minus 2. Those fit $p + q = 1$, but not the second remainder: $f(-1)$ would be 3 plus 2 plus 1, which is 6, not 4. For $m + 1$ we substitute minus 1 and get $p - q = 3$.'
      D: 'You went for minus 2, 3. That fits the first remainder, but $f(-1)$ would be minus 2 minus 3 plus 1, which is minus 4, not 4. Solve both equations together: $p = 2$, $q = -1$.'

  11:
    moments:
      - section: 'The question'
        say: 'Letters where you expect numbers. But this is just a quadratic in $r$, and the product and sum method works exactly as it does with numbers.'
        write: 'Factorise $r^{2} - r(2p + q) + 2pq$'
      - section: 'Solution'
        say: 'Solution. Read it as a quadratic in $r$. The coefficient of $r^{2}$ is 1, the coefficient of $r$ is minus, bracket, $2p + q$, and the constant is $2pq$.'
        write: '$a = 1,\ b = -(2p + q),\ c = 2pq$'
      - section: 'Product and sum'
        say: 'The product is $a$ times $c$: 1 times $2pq$ is $2pq$. The sum is $b$: open the bracket to get minus $2p$ minus $q$.'
        write: 'Product $= ac = 2pq$, Sum $= b = -2p - q$'
      - say: 'Find two terms that multiply to $2pq$ and add up to minus $2p$ minus $q$. Minus $2p$ times minus $q$ is plus $2pq$, and they add up correctly.'
        write: 'Factors: $-2p,\ -q$'
      - say: 'Use the two terms to split the middle term. Minus $r$ times $2p + q$ becomes minus $2pr$ minus $qr$.'
        write: 'Expression $= r^{2} - 2pr - qr + 2pq$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '[[−2p]], −q'}, at: '−2pr', text: 'split'}
          - {line: 4, kind: move, from: {line: 3, at: '−2p, [[−q]]'}, at: '−qr'}
      - section: 'Group in pairs'
        say: 'From the first pair take out $r$, leaving $r - 2p$. From the second pair take out minus $q$, leaving $r - 2p$ again.'
        write: '$= r(r - 2p) - q(r - 2p)$'
      - say: 'The two brackets are the same, so the grouping is right. Take out the common bracket, $r - 2p$. What is left over is $r - q$.'
        write: '$= (r - 2p)(r - q)$'
        point:
          - {line: 6, kind: underline, at: '(r − 2p)', text: 'common bracket'}
      - section: 'Check'
        say: 'Check by expanding: $r$ times $r$, then minus $2pr$, minus $qr$, and minus $q$ times minus $2p$, which is plus $2pq$. The same four terms.'
        write: 'Check: $(r - q)(r - 2p) = r^{2} - 2pr - qr + 2pq \ \checkmark$'
      - say: 'Therefore the factors are $r - q$ and $r - 2p$, in either order, which is answer choice C.'
        write: '$\therefore r^{2} - r(2p + q) + 2pq = (r - q)(r - 2p)$'
        answer: true
    traps:
      A: 'You went for $(r - 2q)(2r - p)$. Expanding it gives $2r^{2}$ at the front, but our expression starts with just $r^{2}$. The two factors from product and sum are minus $2p$ and minus $q$.'
      B: 'You went for $(r - q)(r + p)$. Expanding gives a last term of minus $pq$, but we need plus $2pq$. The product is $2pq$, so the second bracket must be $r - 2p$.'
      D: 'You went for $(2r - q)(r + p)$. That expands to start with $2r^{2}$, and our expression starts with $r^{2}$. The correct factors are $(r - q)(r - 2p)$.'

  12:
    moments:
      - section: 'The question'
        say: 'Two square roots in one equation. Square it as it stands and you get a mess. Put one root on each side first, and squaring clears them one at a time.'
        write: 'Solve $\sqrt{x} - \sqrt{x - 2} - 1 = 0$'
      - section: 'Solution'
        say: 'Solution. Add root $x - 2$ and 1 to both sides, so one root stands alone on the left. Picture two squares: the big side is 1 longer than the small side.'
        write: '$\sqrt{x} = 1 + \sqrt{x - 2}$'
        point:
          - {line: 1, kind: move, from: {line: 0, at: '[[−1]] = 0'}, at: '= [[1]] +', text: 'across'}
        doodle: {name: 'custom:1998_q12_a', id: squares, caption: 'side √x is 1 longer than √(x − 2)'}
      - section: 'Square both sides'
        say: 'Square both sides. The left becomes $x$. The right is a two-term bracket, so we square the whole bracket, not each term.'
        write: '$x = \left(1 + \sqrt{x - 2}\right)^{2}$'
      - say: 'Expand like $a$ plus $b$, all squared: 1 squared, plus 2 times 1 times root $x - 2$, plus root $x - 2$, squared, which is just $x - 2$.'
        write: '$x = 1 + 2\sqrt{x - 2} + (x - 2)$'
      - say: 'Collect the numbers on the right. 1 minus 2 is minus 1.'
        write: '$x = x - 1 + 2\sqrt{x - 2}$'
      - say: 'Subtract $x$ from both sides and add 1 to both sides. The $x$ terms cancel, and that is what makes this solvable.'
        write: '$1 = 2\sqrt{x - 2}$'
      - say: 'Divide both sides by 2. So the small square has side a half.'
        write: '$\sqrt{x - 2} = \dfrac{1}{2}$'
        doodle_do:
          - {id: squares, op: label, part: small, text: 'side ½'}
      - section: 'Square again'
        say: 'Square both sides again to remove the last root. A half, squared, is 1 over 4.'
        write: '$x - 2 = \left(\dfrac{1}{2}\right)^{2} = \dfrac{1}{4}$'
      - say: 'Add 2 to both sides. 2 is 8 over 4, and 8 over 4 plus 1 over 4 is 9 over 4.'
        write: '$x = 2 + \dfrac{1}{4} = \dfrac{9}{4}$'
        doodle_do:
          - {id: squares, op: stage, stage: 'custom:1998_q12_a2'}
      - section: 'Check'
        say: 'Squaring can bring in false roots, so check in the question. The square root of 9 over 4 is 3 over 2, and the square root of 1 over 4 is a half.'
        write: 'Check: $\sqrt{\dfrac{9}{4}} = \dfrac{3}{2}$, $\ \sqrt{\dfrac{9}{4} - 2} = \sqrt{\dfrac{1}{4}} = \dfrac{1}{2}$'
      - say: '3 over 2 minus 1 over 2 is 1, and 1 minus 1 is 0. It works.'
        write: '$\dfrac{3}{2} - \dfrac{1}{2} - 1 = 0 \ \checkmark$'
      - say: 'Therefore $x$ is 9 over 4, which is answer choice D.'
        write: '$\therefore x = \dfrac{9}{4}$'
        answer: true
    traps:
      A: 'You went for 3 over 2. That is $\sqrt{x}$, not $x$. Since $\sqrt{x}$ is 3 over 2, $x$ is 3 over 2, squared, which is 9 over 4.'
      B: 'You went for 2 over 3. That is less than 2, so $x - 2$ would be negative and $\sqrt{x - 2}$ would not exist. The answer must be bigger than 2: it is 9 over 4.'
      C: 'You went for 4 over 9. That is the reciprocal of the answer, and it is less than 2, so $\sqrt{x - 2}$ would not exist. From $x - 2 = \tfrac{1}{4}$, $x$ is 9 over 4.'

  13:
    moments:
      - section: 'The question'
        say: 'For which values of $m$ does this quadratic have real roots? The answer is a range, and one rule gets us there: the discriminant.'
        write: '$3x^{2} - 3mx + (m^{2} - m - 3) = 0$'
      - section: 'Solution'
        say: 'Solution. The discriminant is $b^{2} - 4ac$, the part under the square root in the formula. The roots are real when it is greater than or equal to zero.'
        write: 'For real roots: $b^{2} - 4ac \ge 0$'
      - say: 'List $a$, $b$ and $c$. $a$, the coefficient of $x^{2}$, is 3. $b$, the coefficient of $x$, is minus $3m$. $c$ is the whole bracket.'
        write: '$a = 3,\ b = -3m,\ c = m^{2} - m - 3$'
      - say: 'Substitute them, each in brackets. Minus $3m$ in brackets, squared, minus 4 times 3 times the bracket for $c$.'
        write: '$(-3m)^{2} - 4(3)(m^{2} - m - 3) \ge 0$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: 'b = −3m'}, at: '(−3m)', text: 'b'}
          - {line: 3, kind: move, from: {line: 2, at: 'a = 3'}, at: '4[[(3)]]', text: 'a'}
          - {line: 3, kind: move, from: {line: 2, at: 'c = m2 − m − 3'}, at: '(m2 − m − 3)', text: 'c'}
      - say: 'Minus $3m$, squared, is $9m^{2}$: a minus times a minus is a plus. And 4 times 3 is 12.'
        write: '$9m^{2} - 12(m^{2} - m - 3) \ge 0$'
      - say: 'Open the bracket. Minus 12 times $m^{2}$ is minus $12m^{2}$, minus 12 times minus $m$ is plus $12m$, and minus 12 times minus 3 is plus 36.'
        write: '$9m^{2} - 12m^{2} + 12m + 36 \ge 0$'
      - say: 'Collect like terms. $9m^{2}$ minus $12m^{2}$ is minus $3m^{2}$.'
        write: '$-3m^{2} + 12m + 36 \ge 0$'
      - say: 'Divide every term by minus 3 to make the numbers small. Dividing by a negative number reverses the inequality sign, so greater than or equal becomes less than or equal.'
        write: 'Divide by $-3$: $\ m^{2} - 4m - 12 \le 0$'
        point:
          - {line: 7, kind: circle, at: '≤', text: 'sign reversed'}
      - section: 'Factorise: product and sum'
        say: 'Now factorise. The product is $a$ times $c$, 1 times minus 12, which is minus 12. The sum is $b$, minus 4.'
        write: 'Product $= ac = -12$, Sum $= b = -4$'
      - say: 'Two numbers that multiply to minus 12 and add up to minus 4: minus 6 and 2. Minus 6 times 2 is minus 12, and minus 6 plus 2 is minus 4.'
        write: 'Factors: $-6,\ 2$'
      - say: 'Split the middle term. Minus $4m$ becomes minus $6m$ plus $2m$.'
        write: '$m^{2} - 6m + 2m - 12 \le 0$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '[[−6]], 2'}, at: '−6m', text: 'split'}
          - {line: 10, kind: move, from: {line: 9, at: '−6, [[2]]'}, at: '+2m'}
      - say: 'Group in pairs. From the first pair take out $m$, leaving $m - 6$. From the second pair take out 2, leaving $m - 6$ again.'
        write: '$m(m - 6) + 2(m - 6) \le 0$'
      - say: 'The brackets match, so take out the common bracket, $m - 6$. What is left is $m + 2$.'
        write: '$(m - 6)(m + 2) \le 0$'
        point:
          - {line: 12, kind: underline, at: '(m − 6)', text: 'common bracket'}
      - section: 'Sign table'
        say: 'The critical values are where the product is zero. Either $m - 6$ is zero or $m + 2$ is zero. Look at them on the number line.'
        write: 'Critical values: $m = 6$ or $m = -2$'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '−2', 'on': 'number line'}
          - {figure: sketch, kind: circle, target: '6', 'on': 'number line'}
      - say: 'The two values cut the line into three regions. In a sign table, write the sign of each bracket in each region.'
        write: 'Sign table:'
        diagram:
          id: signs
          kind: table
          columns: ['Factor', 'm < −2', '−2 < m < 6', 'm > 6']
          rows: [['m + 2', '−', '+', '+'], ['m − 6', '−', '−', '+'], ['(m + 2)(m − 6)', '', '', '']]
          'on': 'sign table'
      - say: 'Multiply the signs down each column. Minus times minus is plus, plus times minus is minus, and plus times plus is plus.'
        write: 'Product: $+,\ -,\ +$'
        diagram_do:
          - {id: signs, op: fill, part: 'cell:3,2', text: '+'}
          - {id: signs, op: fill, part: 'cell:3,3', text: '−', colour: green}
          - {id: signs, op: fill, part: 'cell:3,4', text: '+'}
      - say: 'We want the product less than or equal to zero. It is negative only between the critical values, and zero at the two ends.'
        write: '$\therefore -2 \le m \le 6$'
        point:
          - {figure: sketch, kind: highlight, target: ['−2', '6'], text: 'real roots'}
        diagram_do:
          - {id: signs, op: highlight, part: 'col:3', text: 'negative here'}
      - section: 'Check'
        say: 'Check a value inside, $m = 0$. Then $b$ is zero, $a$ is 3 and $c$ is minus 3. 0 minus 4 times 3 times minus 3 is 36, which is positive. Real roots.'
        write: 'Check $m = 0$: $\ 0 - 4(3)(-3) = 36 \ge 0$'
      - say: 'Check a value outside, $m = 7$. Minus 3 times 49, plus 12 times 7, plus 36 is minus 27. Negative, so no real roots there.'
        write: '$m = 7$: $\ -3(49) + 12(7) + 36 = -27 < 0$'
      - say: 'At $m = -2$ and $m = 6$ the discriminant is zero, so the two roots are equal, and equal roots are real. Both ends are included. That is answer choice B.'
        write: 'Option B: $\ -2 \le m \le 6$'
        answer: true
        point:
          - {figure: sketch, kind: underline, target: 'real roots: m from −2 to 6'}
    traps:
      A: 'You went for minus 1 to 7. Those ends come from $m^{2} - 6m - 7$, where the sum is minus 6. Our quadratic is $m^{2} - 4m - 12$: product minus 12, sum minus 4, so the factors are minus 6 and 2.'
      C: 'You went for minus 3 to 9. Those ends multiply to minus 27, not minus 12. From $m^{2} - 4m - 12$, the factors are minus 6 and 2, so the critical values are 6 and minus 2.'
      D: 'You went for minus 4 to 8. Their sum is right, but minus 4 times 8 is minus 32, not minus 12. The product is minus 12, so the critical values are minus 2 and 6.'

  14:
    moments:
      - section: 'The question'
        say: 'The new subject here is not one letter but a fraction, $a$ over $x$. The plan: collect $a$ on one side, $x$ on the other, then divide.'
        write: 'Make $\dfrac{a}{x}$ the subject of $\dfrac{x + a}{x - a} = m$'
      - section: 'Solution'
        say: 'Solution. Write the formula down first.'
        write: '$\dfrac{x + a}{x - a} = m$'
      - say: 'Cross multiply to clear the fraction: $x + a$ equals $m$ times $x - a$.'
        write: '$x + a = m(x - a)$'
        point:
          - {line: 2, kind: move, from: {line: 1, at: 'x − a'}, at: '(x − a)', text: 'cross multiply'}
      - say: 'Open the bracket. $m$ times $x$ is $mx$, and $m$ times minus $a$ is minus $ma$.'
        write: '$x + a = mx - ma$'
      - section: 'Collect the terms'
        say: 'Collect the terms in $a$ on the left. Add $ma$ to both sides.'
        write: '$x + a + ma = mx$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '− ma'}, at: '+ ma', text: 'add ma'}
      - say: 'Now the terms in $x$ go on the right. Subtract $x$ from both sides.'
        write: '$a + ma = mx - x$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '[[x]] + a'}, at: '− x', text: 'subtract x'}
      - say: 'Factorise each side. On the left, take out $a$, leaving 1 plus $m$. On the right, take out $x$, leaving $m$ minus 1.'
        write: '$a(1 + m) = x(m - 1)$'
      - section: 'Divide'
        say: 'Divide both sides by $x$. Now the left side has $a$ over $x$, the fraction we want.'
        write: '$\dfrac{a}{x}(1 + m) = m - 1$'
      - say: 'Divide both sides by 1 plus $m$. That leaves $a$ over $x$ alone.'
        write: '$\dfrac{a}{x} = \dfrac{m - 1}{1 + m}$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '(1 + m)'}, at: '1 + m', text: 'divide'}
      - section: 'Check'
        say: 'Check with numbers. Take $a = 1$ and $x = 3$. Then $m$ is 3 plus 1 over 3 minus 1, which is 4 over 2, which is 2.'
        write: 'Check $a = 1,\ x = 3$: $\ m = \dfrac{4}{2} = 2$'
      - say: 'Put $m = 2$ into our answer. 2 minus 1 over 1 plus 2 is 1 over 3. And $a$ over $x$ is 1 over 3. It works.'
        write: '$\dfrac{2 - 1}{1 + 2} = \dfrac{1}{3} = \dfrac{a}{x}$'
      - say: '1 plus $m$ is the same as $m$ plus 1. Therefore $a$ over $x$ is $m$ minus 1 over $m$ plus 1, which is answer choice A.'
        write: '$\therefore \dfrac{a}{x} = \dfrac{m - 1}{m + 1}$'
        answer: true
    traps:
      B: 'You went for 1 plus $m$ over 1 minus $m$. Test it with $a = 1$ and $x = 3$, so $m = 2$: it gives 3 over minus 1, which is minus 3, not 1 over 3.'
      C: 'You went for 1 minus $m$ over 1 plus $m$. The top has the wrong sign. Subtracting $x$ from both sides gives $mx - x$, which is $x(m - 1)$, not $x(1 - m)$.'
      D: 'You went for $m$ plus 1 over $m$ minus 1. That is $x$ over $a$, the reciprocal. The question wants $a$ over $x$, so $m$ minus 1 is on top.'

  15:
    moments:
      - section: 'The question'
        say: 'Dividing a polynomial is long division, set out like long division of numbers. Picture a rectangle: height $2x + 1$, area the whole expression. We are finding its length.'
        write: '$(2x^{3} + 11x^{2} + 17x + 6) \div (2x + 1)$'
        doodle: {name: 'custom:1998_q15_a', id: rect, caption: 'height 2x + 1, length to be found', size: scene, 'on': 'rectangle'}
      - section: 'Long division'
        say: 'Solution. The divisor, $2x + 1$, goes outside the bracket. The dividend, the expression being divided, goes inside, in descending powers of $x$.'
        write: 'Set out: $\ 2x + 1\ \big)\ \overline{2x^{3} + 11x^{2} + 17x + 6}$'
      - say: 'Divide the first term inside by the first term outside. $2x^{3}$ divided by $2x$ is $x^{2}$. Write $x^{2}$ on top: the first term of the quotient.'
        write: '$2x^{3} \div 2x = x^{2}$'
      - say: 'Multiply back. $x^{2}$ times $2x + 1$ is $2x^{3}$ plus $x^{2}$. Write it under the first two terms. That is the first strip of the rectangle.'
        write: '$x^{2}(2x + 1) = 2x^{3} + x^{2}$'
        point:
          - {line: 3, kind: highlight, at: '= 2x3 + x2', to: {doodle: rect, part: round1}}
        doodle_do:
          - {id: rect, op: stage, stage: 'custom:1998_q15_a2', 'on': 'strip'}
      - say: 'Subtract. $2x^{3}$ minus $2x^{3}$ is zero, and $11x^{2}$ minus $x^{2}$ is $10x^{2}$. Then bring down the next term, plus $17x$.'
        write: 'Subtract, bring down: $\ 10x^{2} + 17x$'
        point:
          - {line: 4, kind: move, from: {line: 1, at: '17x'}, at: '17x', text: 'bring down'}
      - say: 'Divide again. $10x^{2}$ divided by $2x$ is $5x$. Write plus $5x$ on top.'
        write: '$10x^{2} \div 2x = 5x$'
      - say: 'Multiply back. $5x$ times $2x + 1$ is $10x^{2}$ plus $5x$. Write it under. That is the second strip.'
        write: '$5x(2x + 1) = 10x^{2} + 5x$'
        doodle_do:
          - {id: rect, op: stage, stage: 'custom:1998_q15_a3', 'on': 'strip'}
      - say: 'Subtract. $10x^{2}$ minus $10x^{2}$ is zero, and $17x$ minus $5x$ is $12x$. Bring down the last term, plus 6.'
        write: 'Subtract, bring down: $\ 12x + 6$'
        point:
          - {line: 7, kind: move, from: {line: 1, at: '+ 6'}, at: '+ 6', text: 'bring down'}
      - say: 'Divide again. $12x$ divided by $2x$ is 6. Write plus 6 on top.'
        write: '$12x \div 2x = 6$'
      - say: 'Multiply back. 6 times $2x + 1$ is $12x$ plus 6. Write it under. That is the third strip.'
        write: '$6(2x + 1) = 12x + 6$'
        point:
          - {line: 9, kind: highlight, at: '= 12x + 6', to: {doodle: rect, part: round3}}
        doodle_do:
          - {id: rect, op: stage, stage: 'custom:1998_q15_a4', 'on': 'strip'}
      - say: 'Subtract. $12x + 6$ minus $12x + 6$ is zero. The remainder is zero, so $2x + 1$ divides exactly.'
        write: 'Remainder $= 0$'
      - say: 'The quotient is what we wrote on top: $x^{2}$, then plus $5x$, then plus 6. It is the length of the rectangle.'
        write: 'Quotient $= x^{2} + 5x + 6$'
        point:
          - {line: 11, kind: move, from: {line: 2, at: '= x2'}, at: 'x2', text: 'first'}
          - {line: 11, kind: move, from: {line: 5, at: '= 5x'}, at: '+ 5x', text: 'second'}
          - {line: 11, kind: move, from: {line: 8, at: '= 6'}, at: '+ 6', text: 'third'}
        doodle_do:
          - {id: rect, op: underline, part: round1}
          - {id: rect, op: underline, part: round2}
          - {id: rect, op: underline, part: round3}
      - section: 'Check'
        say: 'Check by multiplying back: the divisor times the quotient should give the dividend.'
        write: 'Check: $(2x + 1)(x^{2} + 5x + 6)$'
      - say: '$2x$ times each term gives $2x^{3}$, $10x^{2}$ and $12x$. Then 1 times each term gives $x^{2}$, $5x$ and 6.'
        write: '$= 2x^{3} + 10x^{2} + 12x + x^{2} + 5x + 6$'
      - say: 'Collect like terms. $10x^{2}$ plus $x^{2}$ is $11x^{2}$, and $12x$ plus $5x$ is $17x$. That is the dividend we started with.'
        write: '$= 2x^{3} + 11x^{2} + 17x + 6$'
      - say: 'Therefore the quotient is $x^{2} + 5x + 6$, which is answer choice A.'
        write: '$\therefore$ the quotient is $x^{2} + 5x + 6$'
        answer: true
    traps:
      B: 'You went for $2x^{2} + 5x + 6$. The first term is $2x^{3}$ divided by $2x$, which is $x^{2}$, not $2x^{2}$. The 2s cancel.'
      C: 'You went for $2x^{2} - 5x + 6$. The first term is $x^{2}$, since $2x^{3}$ divided by $2x$ is $x^{2}$. And $10x^{2}$ divided by $2x$ is plus $5x$.'
      D: 'You went for $x^{2} - 5x + 6$. The first term is right, but after the first subtraction we have plus $10x^{2}$, and $10x^{2}$ divided by $2x$ is plus $5x$.'

  16:
    moments:
      - section: 'The question'
        say: 'This one fraction was made by adding two simpler fractions, like two slices making one pizza. Partial fractions means finding the two slices again.'
        write: 'Express $\dfrac{11x + 2}{6x^{2} - x - 1}$ in partial fractions'
        doodle: {name: 'custom:1998_q16_a', id: pizza, caption: 'one fraction, made of two slices', size: scene, 'on': 'pizza'}
      - section: 'Factorise the denominator'
        say: 'Solution. First factorise the denominator. The product is $a$ times $c$, 6 times minus 1, which is minus 6. The sum is $b$, minus 1.'
        write: 'Product $= ac = -6$, Sum $= b = -1$'
      - say: 'Two numbers that multiply to minus 6 and add up to minus 1: minus 3 and 2.'
        write: 'Factors: $-3,\ 2$'
      - say: 'Split the middle term. Minus $x$ becomes minus $3x$ plus $2x$.'
        write: '$6x^{2} - x - 1 = 6x^{2} - 3x + 2x - 1$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '[[−3]], 2'}, at: '−3x', text: 'split'}
          - {line: 3, kind: move, from: {line: 2, at: '−3, [[2]]'}, at: '+2x'}
      - say: 'Group in pairs. From the first pair take out $3x$, leaving $2x - 1$. From the second pair take out 1, leaving $2x - 1$ again.'
        write: '$= 3x(2x - 1) + 1(2x - 1)$'
      - say: 'The brackets match. Take out the common bracket, $2x - 1$. What is left is $3x + 1$.'
        write: '$= (3x + 1)(2x - 1)$'
      - section: 'Set up the fractions'
        say: 'Each factor gets its own fraction, with a constant on top: $A$ and $B$. The sign with three lines means identically equal, true for every $x$.'
        write: 'Let $\dfrac{11x + 2}{(3x + 1)(2x - 1)} \equiv \dfrac{A}{3x + 1} + \dfrac{B}{2x - 1}$'
        doodle_do:
          - {id: pizza, op: stage, stage: 'custom:1998_q16_a2', 'on': 'own'}
      - say: 'Multiply through by $(3x + 1)(2x - 1)$. Each fraction keeps the bracket it did not have.'
        write: '$11x + 2 \equiv A(2x - 1) + B(3x + 1)$'
      - section: 'Find B'
        say: 'Put $x$ equal to a half, because it makes $2x - 1$ zero. That wipes out the $A$ term.'
        write: 'Put $x = \tfrac{1}{2}$: $\ 11\left(\tfrac{1}{2}\right) + 2 = A(0) + B\left(\tfrac{3}{2} + 1\right)$'
      - say: 'On the left, 11 over 2 plus 2 is 15 over 2. On the right, 3 over 2 plus 1 is 5 over 2.'
        write: '$\tfrac{15}{2} = \tfrac{5}{2}B$'
      - say: 'Divide both sides by 5 over 2. Both are over 2, so it is 15 divided by 5, which is 3. That is the top of the $B$ slice.'
        write: '$B = \tfrac{15}{2} \div \tfrac{5}{2} = 3$'
        doodle_do:
          - {id: pizza, op: label, part: slice-b, text: 'B = 3'}
      - section: 'Find A'
        say: 'Now put $x$ equal to minus 1 over 3, because it makes $3x + 1$ zero. That wipes out the $B$ term.'
        write: 'Put $x = -\tfrac{1}{3}$: $\ 11\left(-\tfrac{1}{3}\right) + 2 = A\left(-\tfrac{2}{3} - 1\right) + B(0)$'
      - say: 'On the left, minus 11 over 3 plus 2 is minus 5 over 3. On the right, minus 2 over 3 minus 1 is also minus 5 over 3.'
        write: '$-\tfrac{5}{3} = -\tfrac{5}{3}A$'
      - say: 'Divide both sides by minus 5 over 3. So $A$ is 1, the top of the $A$ slice.'
        write: '$A = 1$'
        doodle_do:
          - {id: pizza, op: label, part: slice-a, text: 'A = 1'}
      - say: 'Put $A = 1$ and $B = 3$ back into the two fractions we set up.'
        write: '$\dfrac{11x + 2}{6x^{2} - x - 1} = \dfrac{1}{3x + 1} + \dfrac{3}{2x - 1}$'
        point:
          - {line: 14, kind: move, from: {line: 13, at: '= 1'}, at: '3x+1[[1]]', text: 'A'}
          - {line: 14, kind: move, from: {line: 10, at: '= 3'}, at: '2x−1[[3]]', text: 'B'}
      - section: 'Check'
        say: 'Check with $x = 0$. The left side is 2 over minus 1, which is minus 2. The right side is 1 over 1 plus 3 over minus 1: 1 minus 3, also minus 2.'
        write: 'Check $x = 0$: $\ \dfrac{2}{-1} = -2$; $\ \dfrac{1}{1} + \dfrac{3}{-1} = -2$'
      - say: 'Therefore the partial fractions are 1 over $3x + 1$, plus 3 over $2x - 1$, which is answer choice D.'
        write: '$\therefore \dfrac{1}{3x + 1} + \dfrac{3}{2x - 1}$'
        answer: true
        doodle_do:
          - {id: pizza, op: pulse, part: whole}
    traps:
      A: 'You went for 1 over $3x - 1$ plus 3 over $2x + 1$. The tops are right, but the signs in the brackets are swapped: $(3x - 1)(2x + 1)$ is $6x^{2} + x - 1$, not $6x^{2} - x - 1$.'
      B: 'You went for 3 over $3x + 1$ minus 1 over $2x - 1$. The brackets are right, but the tops are not. Putting $x = \tfrac{1}{2}$ gives $B = 3$, so the 3 goes over $2x - 1$.'
      C: 'You went for 3 over $3x - 1$ minus 1 over $2x + 1$. Product minus 6 and sum minus 1 give the factors minus 3 and 2, so the denominator is $(3x + 1)(2x - 1)$.'

  17:
    moments:
      - section: 'The question'
        say: '$x$ is a positive real number. The algebra will give one answer, but that word "positive" changes the final range. Keep it in mind.'
        write: '$\dfrac{1}{3x} + \dfrac{1}{2} > \dfrac{1}{4x},\quad x > 0$'
      - say: 'Solution. The L.C.M. of $3x$, 2 and $4x$ is $12x$. Since $x$ is positive, $12x$ is positive, so multiplying by it keeps the sign.'
        write: 'Solution: L.C.M. $= 12x > 0$, so the sign stays'
      - say: 'Multiply every term by $12x$.'
        write: '$12x \times \dfrac{1}{3x} + 12x \times \dfrac{1}{2} > 12x \times \dfrac{1}{4x}$'
      - say: '$12x$ over $3x$ is 4. $12x$ times a half is $6x$. And $12x$ over $4x$ is 3.'
        write: '$4 + 6x > 3$'
      - say: 'Subtract 4 from both sides. 3 minus 4 is minus 1.'
        write: '$6x > 3 - 4 = -1$'
      - say: 'Divide both sides by 6. It is positive, so the sign stays.'
        write: '$x > -\dfrac{1}{6}$'
      - section: 'Use the condition'
        say: 'But the question says $x$ is positive. So $x$ must satisfy both: greater than minus a sixth, and greater than 0.'
        write: '$x > -\dfrac{1}{6}$ and $x > 0$'
      - say: 'On a number line, the first is an open circle at minus a sixth, arrow to the right. The second starts at 0. Both hold from 0 onwards.'
        diagram: {id: n, kind: numberline, range: [-1, 2], step: 0.5}
        diagram_do:
          - {id: n, op: interval, from: -0.167, from_open: true, text: 'x > −1/6', colour: blue}
          - {id: n, op: interval, from: 0, from_open: true, text: 'x > 0', answer: true, 'on': 'starts at 0'}
      - say: 'Every positive number is already bigger than minus a sixth. So both hold exactly when $x$ is greater than 0.'
        write: '$\therefore\ x > 0$'
      - section: 'Check'
        say: 'Check with $x$ equals 1. A third plus a half is about 0.83, and a quarter is 0.25. 0.83 is greater than 0.25.'
        write: 'Check $x = 1$: $\ \tfrac{1}{3} + \tfrac{1}{2} \approx 0.83 > \tfrac{1}{4}\ \checkmark$'
      - say: 'So the inequality holds for every positive $x$: option B.'
        write: '$x > 0$'
        answer: true
    traps:
      A: 'You went for $x > -\tfrac{1}{6}$. The algebra gives that, but the question says $x$ is positive, so negative values are not allowed. Together, the answer is $x > 0$.'
      C: 'You went for 0 to 4. Nothing in the working puts an upper limit on $x$. Multiplying by $12x$ gives $4 + 6x > 3$, which every positive $x$ satisfies.'
      D: 'You went for 0 to 1 over 6. The 1 over 6 comes from $6x > -1$, but that says $x$ is greater than minus 1 over 6, not less than 1 over 6. Every positive $x$ works.'

  18:
    moments:
      - section: 'The question'
        say: 'The shaded region has three edges: the two axes and a slanting line. Each edge gives one inequality. Two options even share the right line, so the sign decides it.'
        write: 'Shaded region: three boundaries'
        point:
          - {figure: 0, kind: highlight, target: {x: 250, y: 110}, text: 'shaded'}
      - say: 'Solution. The shading lies to the right of the $y$-axis, where $x$ is 0 or more.'
        write: 'Solution: $\ y$-axis: $\ x \ge 0$'
        point:
          - {figure: 0, kind: circle, target: 'y', text: 'x ≥ 0'}
      - say: 'It lies above the $x$-axis, where $y$ is 0 or more.'
        write: '$x$-axis: $\ y \ge 0$'
        point:
          - {figure: 0, kind: circle, target: 'x', text: 'y ≥ 0'}
      - section: 'The slanting line'
        say: 'The slanting line cuts the axes at 0, 3 and 2, 0. Its gradient is the change in $y$ over the change in $x$.'
        write: '$m = \dfrac{y_{2} - y_{1}}{x_{2} - x_{1}} = \dfrac{0 - 3}{2 - 0} = -\dfrac{3}{2}$'
        point:
          - {figure: 0, kind: circle, target: '(0, 3)'}
          - {figure: 0, kind: circle, target: '(2, 0)'}
      - say: 'The equation of a line is $y$ equals $mx$ plus $c$, where $c$ is the $y$-intercept, 3.'
        write: '$y = mx + c = -\dfrac{3}{2}x + 3$'
        point:
          - {figure: 0, kind: label, target: '(0, 3)', text: 'c = 3'}
      - say: 'Multiply every term by 2 to clear the fraction, then add $3x$ to both sides.'
        write: '$2y = -3x + 6 \Rightarrow 3x + 2y = 6$'
      - section: 'Which side?'
        say: 'Test the origin, 0, 0. $3x$ plus $2y$ is 0, which is less than 6.'
        write: 'Test $(0,\ 0)$: $\ 3(0) + 2(0) = 0 < 6$'
        point:
          - {figure: 0, kind: circle, target: {x: 70, y: 190}, text: 'origin'}
      - say: 'The origin is not in the shaded part. So the shaded side is the other side, where $3x$ plus $2y$ is 6 or more. The line is solid, so equal to is allowed.'
        write: 'Origin not shaded: $\ 3x + 2y \ge 6$'
        point:
          - {figure: 0, kind: label, target: {x: 250, y: 110}, text: '3x + 2y ≥ 6'}
      - say: 'Exam tip. In a JAMB diagram like this, the shaded part is the region asked for. In your own graph work, many textbooks shade the unwanted part instead, so always state which.'
      - section: 'Answer'
        say: 'Put the three together.'
        write: '$\therefore\ x \ge 0,\ \ y \ge 0,\ \ 3x + 2y \ge 6$'
        point:
          - {line: 9, kind: move, from: {line: 7, at: '3x + 2y ≥ 6'}, at: '3x + 2y ≥ 6', text: 'line'}
      - say: 'So the shaded area is $x \ge 0$, $y \ge 0$ and $3x + 2y \ge 6$: option D.'
        write: '$x \ge 0,\ y \ge 0,\ 3x + 2y \ge 6$'
        answer: true
    traps:
      A: 'You went for $x \ge 0$ with $3y + 2x \ge 6$. The coefficients are swapped: $3y + 2x = 6$ cuts the axes at 3, 0 and 0, 2, but our line cuts them at 2, 0 and 0, 3. It also leaves out $y \ge 0$.'
      B: 'You went for the choice with $y \ge 3$. That would cut off everything below height 3, but the shading comes right down to the $x$-axis. The condition is $y \ge 0$.'
      C: 'You went for $x \ge 2$ with $3x + 2y \le 6$. The less-than sign describes the origin''s side, which is not shaded. Testing 0, 0 gives 0, less than 6, so the shaded side is $3x + 2y \ge 6$.'

  19:
    moments:
      - say: 'Three expressions are consecutive terms of an arithmetic progression. We want the possible values of $p$.'
        write: '$p + 1, \quad 2p - 10, \quad 1 - 4p^{2}$'
      - say: 'In an arithmetic progression, the step between terms is constant: picture a staircase with equal steps. That means twice the middle term equals the first term plus the third term.'
        write: '$2 \times \text{middle} = \text{first} + \text{third}$'
        doodle: {name: 'custom:1998_q19_a', id: stairs, caption: 'an AP: every step the same size', size: scene}
      - say: 'Substitute the three expressions.'
        write: '$2(2p - 10) = (p + 1) + (1 - 4p^{2})$'
        point:
          - {line: 2, kind: move, from: {line: 0, at: '2p − 10'}, at: '(2p − 10)', text: 'middle'}
          - {line: 2, kind: move, from: {line: 0, at: 'p + 1'}, at: '(p + 1)', text: 'first'}
          - {line: 2, kind: move, from: {line: 0, at: '1 − 4p2'}, at: '(1 − 4p2)', text: 'third'}
      - say: 'On the left, 2 times $2p$ is $4p$, and 2 times negative 10 is negative 20.'
        write: '$4p - 20 = p + 1 + 1 - 4p^{2}$'
      - say: 'On the right, 1 plus 1 is 2.'
        write: '$4p - 20 = -4p^{2} + p + 2$'
      - say: 'Bring everything to the left. Add $4p^{2}$, subtract $p$, and subtract 2.'
        write: '$4p^{2} + 4p - p - 20 - 2 = 0$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '−4p2'}, at: '[[4p2]] + 4p', text: 'across'}
          - {line: 5, kind: move, from: {line: 4, at: '+ p'}, at: '4p[[−p]]'}
          - {line: 5, kind: move, from: {line: 4, at: 'p[[+ 2]]'}, at: '[[−2]] = 0'}
      - say: '$4p$ minus $p$ is $3p$, and negative 20 minus 2 is negative 22.'
        write: '$4p^{2} + 3p - 22 = 0$'
      - say: 'Factorise. We need two numbers that multiply to 4 times negative 22, which is negative 88, and add to 3. Those are 11 and negative 8.'
        write: '$4p^{2} + 11p - 8p - 22 = 0$'
      - say: 'Group in pairs. Take $p$ out of the first pair and negative 2 out of the second.'
        write: '$p(4p + 11) - 2(4p + 11) = 0$'
      - say: 'The common bracket is $4p + 11$.'
        write: '$(p - 2)(4p + 11) = 0$'
      - say: 'A product is zero only when one of its brackets is zero. If $p - 2$ is zero, $p$ is 2.'
        write: '$p - 2 = 0$, so $p = 2$'
      - say: 'If $4p + 11$ is zero, then $4p$ is negative 11, and $p$ is negative 11 over 4.'
        write: '$4p + 11 = 0$, so $4p = -11$ and $p = -\dfrac{11}{4}$'
      - say: 'Let''s check $p = 2$ on the staircase. 2 plus 1 is 3. 2 times 2, minus 10, is negative 6. 1 minus 4 times 4 is negative 15.'
        write: 'Check $p = 2$: $2 + 1 = 3$, $2(2) - 10 = -6$, $1 - 4(2)^{2} = -15$'
        doodle_do:
          - {id: stairs, op: stage, stage: 'custom:1998_q19_a2'}
      - say: 'From 3 to negative 6 is a step of negative 9, and from negative 6 to negative 15 is also negative 9. Equal steps, so it is an arithmetic progression.'
        write: '$-6 - 3 = -9$ and $-15 - (-6) = -9$'
        point:
          - {line: 13, kind: highlight, at: '-6 - 3 = -9', to: {doodle: stairs, part: values}}
        doodle_do:
          - {id: stairs, op: circle, part: steps, text: equal}
      - say: 'The question asks for the possible values, so both count: negative 11 over 4 and 2, which is answer choice C.'
        write: '$p = -\tfrac{11}{4}$ or $p = 2$'
        point:
          - {line: 14, kind: move, from: {line: 11, at: '= −411'}, at: '−411', text: 'root'}
          - {line: 14, kind: move, from: {line: 10, at: 'p = 2'}, at: 'or [[p = 2]]', text: 'root'}
        answer: true
    traps:
      A: 'You went for negative 4 and 2. The 2 is right, but check negative 4: the terms would be negative 3, negative 18 and negative 63, and the gaps are not equal. The other root of $4p^{2} + 3p - 22$ is negative 11 over 4.'
      B: 'You went for negative 2 and 4 over 11. Those look like the true roots turned upside down with the signs swapped. From $(p - 2)(4p + 11) = 0$, $p$ is 2 or negative 11 over 4.'
      D: 'You went for 5 and negative 3. Check 5: the terms would be 6, 0 and negative 99, and the gaps are not equal. Setting twice the middle term equal to the sum of the outer two gives $p = 2$ or negative 11 over 4.'

  20:
    moments:
      - say: 'The sum of the first three terms of a geometric progression is half its sum to infinity. Picture all the terms laid end to end as a bar: the first three fill exactly half of it. We want the positive common ratio, $r$.'
        write: '$S_{3} = \tfrac{1}{2}S_{\infty}$'
        doodle: {name: 'custom:1998_q20_a', id: bar, caption: 'three terms fill half the bar'}
      - say: 'The sum of the first $n$ terms is $a$ times $1 - r^{n}$, over $1 - r$. For three terms, $n$ is 3.'
        write: '$S_{3} = \dfrac{a(1 - r^{3})}{1 - r}$'
      - say: 'The sum to infinity is $a$ over $1 - r$.'
        write: '$S_{\infty} = \dfrac{a}{1 - r}$'
      - say: 'Now put both of those formulas into the condition: the three terms equal a half of the whole bar.'
        write: '$\dfrac{a(1 - r^{3})}{1 - r} = \dfrac{1}{2} \times \dfrac{a}{1 - r}$'
        point:
          - {line: 3, kind: move, from: {line: 1, at: '1 − ra(1 − r3)'}, at: '1 − ra(1 − r3)', text: 'S3'}
          - {line: 3, kind: move, from: {line: 2, at: '1 − ra'}, at: '× 1 − ra', text: 'S∞'}
        doodle_do:
          - {id: bar, op: highlight, part: first3, text: '½ of S∞'}
      - say: 'Both sides have $a$ over $1 - r$, so divide both sides by it. That''s why we never need to know the first term.'
        write: 'Divide by $\dfrac{a}{1 - r}$: $1 - r^{3} = \dfrac{1}{2}$'
      - say: 'Add $r^{3}$ to both sides and take away a half. 1 minus a half is a half. Look at the bar again: what is left after three terms is $r^{3}$ of the whole, and that is the other half.'
        write: '$r^{3} = 1 - \dfrac{1}{2} = \dfrac{1}{2}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '[[−r3]] = 21'}, at: '[[r3]] = 1', text: 'across'}
          - {line: 5, kind: move, from: {line: 4, at: 'r3 = [[21]]'}, at: '1 − [[21]]', text: 'across'}
          - {line: 5, kind: highlight, at: 'r3 =', to: {doodle: bar, part: cube}}
        doodle_do:
          - {id: bar, op: stage, stage: 'custom:1998_q20_a2'}
      - say: 'We want $r$, not $r$ cubed, so take the cube root of both sides.'
        write: '$r = \sqrt[3]{\dfrac{1}{2}}$'
      - say: 'The cube root of a fraction is the cube root of the top over the cube root of the bottom. The cube root of 1 is 1, so this is 1 over the cube root of 2.'
        write: '$= \dfrac{\sqrt[3]{1}}{\sqrt[3]{2}} = \dfrac{1}{\sqrt[3]{2}}$'
      - say: 'Check: cubing 1 over the cube root of 2 gives 1 over 2. Then 1 minus a half is a half, just as the condition needs.'
        write: 'Check: $r^{3} = \tfrac{1}{2}$, so $1 - r^{3} = 1 - \tfrac{1}{2} = \tfrac{1}{2}\ \checkmark$'
      - say: 'So the common ratio is 1 over the cube root of 2, which is answer choice D.'
        write: '$r = \dfrac{1}{\sqrt[3]{2}}$'
        answer: true
    traps:
      A: 'You went for a quarter. If $r$ were a quarter, $r^{3}$ would be 1 over 64, and $1 - r^{3}$ would be nowhere near a half. We need $r^{3} = \tfrac{1}{2}$.'
      B: 'You went for a half. That is the value of $r^{3}$, not $r$. Take the cube root as the last step: $r$ is 1 over the cube root of 2.'
      C: 'You went for 1 over the cube root of 3. That would make $r^{3}$ one third, so $1 - r^{3}$ would be two thirds, not a half. We need $r^{3} = \tfrac{1}{2}$.'

  21:
    moments:
      - say: 'The table shows an operation on $p$, $q$, $r$ and $s$. We want the identity element.'
      - say: 'The identity is the element that leaves everything unchanged. Picture a door: every element that walks through the identity''s door comes out exactly as it went in.'
        write: '$x \otimes e = e \otimes x = x$'
        doodle: {name: 'custom:1998_q21_a', id: doors, caption: 'the identity''s door changes nothing', size: scene}
      - say: 'So we look for a column whose entries copy the row headings. The row headings, down the side, are $p$, $q$, $r$, $s$.'
        write: 'Row headings: $p,\ q,\ r,\ s$'
      - say: 'Column $p$ reads $r$, $p$, $r$, $q$. The very first entry is $r$ where the heading is $p$. So $p \otimes p$ is $r$, and $p$ is not the identity.'
        write: 'Column $p$: $r,\ p,\ r,\ q$, no match'
      - say: 'Column $q$ reads $p$, $q$, $r$, $s$. That matches the row headings exactly: through the $q$ door, everyone comes out unchanged.'
        write: 'Column $q$: $p,\ q,\ r,\ s$, matches'
        point:
          - {line: 4, kind: highlight, at: matches, to: {doodle: doors, part: door-q}}
        doodle_do:
          - {id: doors, op: highlight, part: door-q, text: unchanged}
      - say: 'So combining any element with $q$ gives back that element. $p$ with $q$ is $p$, $q$ with $q$ is $q$, and so on.'
        write: '$p \otimes q = p,\ q \otimes q = q,\ r \otimes q = r,\ s \otimes q = s$'
      - say: 'An identity must work from both sides, so let''s check row $q$ against the column headings. It reads $p$, $q$, $r$, $s$ as well.'
        write: 'Row $q$: $p,\ q,\ r,\ s$, matches'
      - say: 'Notice column $r$: it reads $r$, $r$, $r$, $r$. Through the $r$ door, everyone comes out as $r$. That is the opposite of an identity; it swallows everything, like zero does in multiplication.'
        write: 'Column $r$: $r,\ r,\ r,\ r$, swallows everything'
        doodle_do:
          - {id: doors, op: stage, stage: 'custom:1998_q21_a2'}
          - {id: doors, op: cross, part: door-r}
      - say: 'And column $s$ reads $p$, $s$, $r$, $q$, which doesn''t match the headings either.'
        write: 'Column $s$: $p,\ s,\ r,\ q$, no match'
      - say: 'So the identity element is $q$, the door that changes nothing, which is answer choice B.'
        write: 'Identity element $= q$'
        answer: true
        doodle_do:
          - {id: doors, op: circle, part: door-q}
    traps:
      A: 'You went for $p$. Column $p$ reads $r$, $p$, $r$, $q$, which does not copy the headings: $p \otimes p$ is $r$, not $p$. The identity is $q$.'
      C: 'You went for $r$. Column $r$ is all $r$s, so combining anything with $r$ gives $r$. That changes everything, so it cannot be the identity. The identity''s column copies the headings, and that is $q$.'
      D: 'You went for $s$. Column $s$ reads $p$, $s$, $r$, $q$, and $s \otimes s$ is $q$, not $s$. The identity is $q$.'

  22:
    moments:
      - say: 'The operation is defined by $x * y = xy - y - x$. We want $x$ if $x * 3$ equals $2 * x$.'
        write: '$x * y = xy - y - x$'
      - say: 'Picture the star as a machine with two slots. Whatever goes in the first slot plays the part of $x$, and whatever goes in the second plays the part of $y$.'
        doodle: {name: 'custom:1998_q22_a', id: machine, caption: 'a machine with two slots', size: scene}
      - say: 'First, $x * 3$. The second number is 3, so replace $y$ with 3.'
        write: '$x * 3 = x(3) - 3 - x$'
      - say: '$3x$ minus $x$ is $2x$. So the machine gives out $2x - 3$.'
        write: '$x * 3 = 2x - 3$'
        point:
          - {line: 3, kind: highlight, at: '2x - 3', to: {doodle: machine, part: run1-out}}
        doodle_do:
          - {id: machine, op: circle, part: run1-out}
      - say: 'Next, $2 * x$. Now 2 goes in the first slot and $x$ in the second.'
        write: '$2 * x = 2(x) - x - 2$'
        doodle_do:
          - {id: machine, op: stage, stage: 'custom:1998_q22_a2'}
      - say: '$2x$ minus $x$ is $x$.'
        write: '$2 * x = x - 2$'
      - say: 'The question says the two outputs are equal. So set the $2x - 3$ we found first equal to the $x - 2$ we found second.'
        write: 'Set equal: $2x - 3 = x - 2$'
        point:
          - {line: 6, kind: move, from: {line: 3, at: '= 2x − 3'}, at: '2x − 3', text: 'x * 3'}
          - {line: 6, kind: move, from: {line: 5, at: '= x − 2'}, at: '= x − 2', text: '2 * x'}
        doodle_do:
          - {id: machine, op: arrow, part: run1-out, to_part: run2-out, text: equal}
      - say: 'Subtract $x$ from both sides. $2x$ minus $x$ is $x$.'
        write: '$x - 3 = -2$'
      - say: 'Add 3 to both sides. Negative 2 plus 3 is 1.'
        write: '$x = 1$'
      - say: 'Let''s check. $1 * 3$ is 1 times 3, minus 3, minus 1, which is negative 1. $2 * 1$ is 2 times 1, minus 1, minus 2, which is also negative 1.'
        write: 'Check: $1 * 3 = 3 - 3 - 1 = -1$, $2 * 1 = 2 - 1 - 2 = -1$'
      - say: 'So $x$ is 1, which is answer choice C.'
        write: '$x = 1$'
        answer: true
    traps:
      A: 'You went for negative 1. That is the value of $1 * 3$, and of $2 * 1$, not the value of $x$. Solving $2x - 3 = x - 2$ gives $x = 1$.'
      B: 'You went for 0. Check it: $0 * 3$ is 0 minus 3 minus 0, which is negative 3, but $2 * 0$ is 0 minus 0 minus 2, which is negative 2. They are not equal, but $x = 1$ makes them equal.'
      D: 'You went for 5. Check it: $5 * 3$ is 15 minus 3 minus 5, which is 7, but $2 * 5$ is 10 minus 5 minus 2, which is 3. Solving $2x - 3 = x - 2$ gives $x = 1$.'

  23:
    moments:
      - say: 'We want the determinant of this 3 by 3 matrix, in terms of $x$.'
        write: '$\begin{vmatrix} x & 1 & 0 \\ 1 - x & 2 & 3 \\ 1 & 1 + x & 4 \end{vmatrix}$'
      - say: 'We expand along the top row, because it has a zero in it. Picture the matrix as a grid: each entry in the top row is multiplied by the small 2 by 2 determinant left when we cover that entry''s row and column.'
        write: 'Expand along row 1: $x,\ 1,\ 0$'
        doodle: {name: 'custom:1998_q23_a', id: seats, caption: 'cover a row and a column'}
      - say: 'The signs along the top row go plus, minus, plus. And the last entry is 0, so its term vanishes and only two terms survive.'
        write: '$= x\begin{vmatrix} 2 & 3 \\ 1 + x & 4 \end{vmatrix} - 1\begin{vmatrix} 1 - x & 3 \\ 1 & 4 \end{vmatrix} + 0$'
      - say: 'First small determinant, for the $x$. Cover its row and column in the grid: it leaves 2, 3, $1 + x$ and 4. Cross-multiply: 2 times 4, minus 3 times $1 + x$.'
        write: 'For $x$: $\begin{vmatrix} 2 & 3 \\ 1 + x & 4 \end{vmatrix} = 2 \times 4 - 3(1 + x)$'
        doodle_do:
          - {id: seats, op: stage, stage: 'custom:1998_q23_a2'}
      - say: '2 times 4 is 8. 3 times $1 + x$ is $3 + 3x$. And 8 minus 3 is 5.'
        write: '$= 8 - 3 - 3x = 5 - 3x$'
      - say: 'Second small determinant, for the 1. Cover its row and column, and that leaves $1 - x$, 3, 1 and 4. Cross-multiply: $1 - x$ times 4, minus 3 times 1.'
        write: 'For the 1: $\begin{vmatrix} 1 - x & 3 \\ 1 & 4 \end{vmatrix} = 4(1 - x) - 3 \times 1$'
        doodle_do:
          - {id: seats, op: stage, stage: 'custom:1998_q23_a3'}
      - say: '4 times $1 - x$ is $4 - 4x$, and 4 minus 3 is 1.'
        write: '$= 4 - 4x - 3 = 1 - 4x$'
      - say: 'Now put the two results back into the expansion, keeping the minus sign in front of the second one.'
        write: 'So the determinant $= x(5 - 3x) - 1(1 - 4x)$'
        point:
          - {line: 7, kind: move, from: {line: 4, at: '= 5 − 3x'}, at: '(5 − 3x)', text: 'for x'}
          - {line: 7, kind: move, from: {line: 6, at: '= 1 − 4x'}, at: '(1 − 4x)', text: 'for the 1'}
      - say: 'Expand. $x$ times 5 is $5x$, and $x$ times negative $3x$ is negative $3x^{2}$. Minus 1 times $1 - 4x$ is negative 1 plus $4x$.'
        write: '$= 5x - 3x^{2} - 1 + 4x$'
      - say: 'Collect like terms. $5x$ plus $4x$ is $9x$.'
        write: '$= -3x^{2} + 9x - 1$'
      - say: 'So the determinant is $-3x^{2} + 9x - 1$, which is answer choice B.'
        write: 'Determinant $= -3x^{2} + 9x - 1$'
        answer: true
    traps:
      A: 'You went for $-3x^{2} - 17$. The $x$ terms have vanished and the constant is wrong. The two small determinants are $5 - 3x$ and $1 - 4x$, and combining them gives $-3x^{2} + 9x - 1$.'
      C: 'You went for $3x^{2} + 17$. The $x^{2}$ term should be negative: $x$ times negative $3x$ is negative $3x^{2}$. Work each small determinant carefully and keep the minus in front of the second.'
      D: 'You went for $3x^{2} - 9x + 5$. The signs of the $x^{2}$ and $x$ terms are the wrong way round, and the constant is off. Expanding along the top row gives $x(5 - 3x) - (1 - 4x)$, which is $-3x^{2} + 9x - 1$.'

  24:
    moments:
      - say: 'We have matrices $P$ and $Q$, and $PQ$ equals the identity matrix $I$. We want $u$ and $v$.'
        write: '$\begin{pmatrix} 2 & 3 \\ 4 & 5 \end{pmatrix}\begin{pmatrix} u & 4 + u \\ -2v & v \end{pmatrix} = \begin{pmatrix} 1 & 0 \\ 0 & 1 \end{pmatrix}$'
      - say: 'To multiply matrices, we take a row of the first times a column of the second. We have two unknowns, so the first column of $Q$ gives us enough equations.'
      - say: 'Top-left entry: row 1 of $P$ walks along column 1 of $Q$, entry by entry. That is 2 times $u$, plus 3 times negative $2v$, and it must equal the 1 in the top-left entry of $I$.'
        write: '$2u + 3(-2v) = 1$'
        point:
          - {line: 2, kind: highlight, at: '2u + 3(-2v) = 1', to: {doodle: seats, part: row1}}
        doodle: {name: 'custom:1998_q24_a', id: seats, caption: 'row 1 of P meets column 1 of Q', size: scene}
      - say: '3 times negative $2v$ is negative $6v$.'
        write: '$2u - 6v = 1$'
      - say: 'Bottom-left entry: now row 2 walks along column 1. That is 4 times $u$, plus 5 times negative $2v$, and it must equal the 0 in that position of $I$.'
        write: '$4u + 5(-2v) = 0$'
        doodle_do:
          - {id: seats, op: stage, stage: 'custom:1998_q24_a2'}
      - say: '5 times negative $2v$ is negative $10v$.'
        write: '$4u - 10v = 0$'
      - say: 'This second equation, from the 0 entry, is easier, because it equals zero. Add $10v$ to both sides.'
        write: '$4u = 10v$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '−10v'}, at: '10v', text: 'across the ='}
        doodle_do:
          - {id: seats, op: circle, part: i21, text: '0'}
      - say: 'Divide both sides by 4. 10 over 4 simplifies to 5 over 2.'
        write: '$u = \dfrac{10v}{4} = \dfrac{5v}{2}$'
      - say: 'Now go back to the first equation, $2u - 6v = 1$, and replace $u$ with the $5v$ over 2 we just found.'
        write: 'Into $2u - 6v = 1$: $2\left(\dfrac{5v}{2}\right) - 6v = 1$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '= 25v'}, at: '(25v)', text: 'u'}
      - say: '2 times $5v$ over 2 is $5v$, because the 2s cancel. Then $5v$ minus $6v$ is negative $v$.'
        write: '$5v - 6v = 1$, so $-v = 1$'
      - say: 'Multiply both sides by negative 1.'
        write: '$v = -1$'
      - say: 'Then $u$ is $5v$ over 2 with $v$ equal to negative 1. 5 times negative 1 is negative 5, so $u$ is negative 5 over 2.'
        write: '$u = \dfrac{5(-1)}{2} = -\dfrac{5}{2}$'
        point:
          - {line: 11, kind: move, from: {line: 10, at: '= −1'}, at: '(−1)', text: 'v'}
      - say: 'Let''s check with the second column of $Q$. Its top entry, $4 + u$, is 4 minus 5 over 2, which is 8 over 2 minus 5 over 2, so 3 over 2.'
        write: 'Check: $4 + u = \dfrac{8}{2} - \dfrac{5}{2} = \dfrac{3}{2}$'
      - say: 'Row 1 of $P$ times column 2 must give 0. 2 times 3 over 2 is 3, and 3 times negative 1 is negative 3. 3 minus 3 is 0. Good.'
        write: '$2\left(\tfrac{3}{2}\right) + 3(-1) = 3 - 3 = 0\ \checkmark$'
      - say: 'Row 2 times column 2 must give 1. 4 times 3 over 2 is 6, and 5 times negative 1 is negative 5. 6 minus 5 is 1. Good.'
        write: '$4\left(\tfrac{3}{2}\right) + 5(-1) = 6 - 5 = 1\ \checkmark$'
      - say: 'So $u$ is negative 5 over 2 and $v$ is negative 1, which is answer choice A.'
        write: '$(u, v) = \left(-\tfrac{5}{2}, -1\right)$'
        answer: true
    traps:
      B: 'You went for negative 5 over 2, 3 over 2. The $u$ is right, but 3 over 2 is $4 + u$, the top-right entry of $Q$, not $v$. From $-v = 1$, $v$ is negative 1.'
      C: 'You went for negative 5 over 6, and 1. Check the bottom-left entry: 4 times negative 5 over 6, minus 10, is not 0. The equation $4u - 10v = 0$ gives $u = \tfrac{5v}{2}$, and then $v = -1$ and $u = -\tfrac{5}{2}$.'
      D: 'You went for 5 over 2, 2 over 3. They fit the top-left entry, since 5 minus 4 is 1, but not the bottom-left: 10 minus 20 over 3 is not 0. Solving both gives $u = -\tfrac{5}{2}$ and $v = -1$.'

  25:
    moments:
      - say: 'In the diagram, $PR$ is a diameter of the circle, and $PST$ and $QRT$ are straight lines. The angle at $P$ is 35 degrees and the angle at $T$ is 30 degrees. We want angle $QSR$.'
        write: '$\angle TPR = 35^{\circ}, \quad \angle PTR = 30^{\circ}$'
        point:
