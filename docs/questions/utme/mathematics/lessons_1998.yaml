# UTME 1998 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1998.yaml. Answers match that file.
format_version: 1
exam_year: 1998
lessons:
  1:
    moments:
      - say: 'We''re told that $1011_{2} + X_{7} = 25_{10}$, and we want $X$. Notice there are three different bases here: base 2, base 7 and base 10.'
        write: '$1011_{2} + X_{7} = 25_{10}$'
      - say: 'The safest plan is to change everything into base ten, solve there, and then change back to base 7 at the end.'
      - say: 'Let''s start with $1011_{2}$. In base 2, the place values from the right are 1, 2, 4 and 8, which are powers of 2.'
        write: '$1011_{2} = 1 \times 2^{3} + 0 \times 2^{2} + 1 \times 2^{1} + 1 \times 2^{0}$'
      - say: '2 cubed is 8, 2 squared is 4, 2 to the power 1 is 2, and 2 to the power zero is 1.'
        write: '$= 1 \times 8 + 0 \times 4 + 1 \times 2 + 1 \times 1$'
      - say: '1 times 8 is 8, zero times 4 is zero, 1 times 2 is 2, and 1 times 1 is 1.'
        write: '$= 8 + 0 + 2 + 1$'
      - say: '8 plus 2 plus 1 is 11.'
        write: '$= 11_{10}$'
      - say: 'So in base ten, the equation says 11 plus $X$ equals 25.'
        write: '$11 + X = 25$'
      - say: 'Subtract 11 from both sides. 25 minus 11 is 14.'
        write: '$X = 14_{10}$'
      - say: 'But careful: $X$ is written in base 7, so we must change 14 into base 7. We divide by 7 and keep the remainder. 14 divided by 7 is 2, remainder zero.'
        write: '$14 \div 7 = 2 \text{ remainder } 0$'
      - say: 'Then 2 divided by 7 is zero, remainder 2.'
        write: '$2 \div 7 = 0 \text{ remainder } 2$'
      - say: 'Reading the remainders from the bottom up gives 2, then 0. So 14 in base ten is 20 in base 7.'
        write: '$14_{10} = 20_{7}$'
      - say: 'Let''s check. 20 in base 7 means 2 sevens and no units, which is 14. And 11 plus 14 is 25. It works.'
        write: '$2 \times 7 + 0 = 14, \quad 11 + 14 = 25$'
      - say: 'So $X$ is 20, which is answer choice B.'
        write: '$X = 20$'
        answer: true
    traps:
      A: 'You went for 14. That is the right value in base ten, but $X$ carries the subscript 7, so 14 must be changed to base 7: two sevens and no units, which is 20.'
      C: 'You went for 24. In base 7 that means 2 sevens plus 4, which is 18, and 11 plus 18 is 29, not 25. Convert 14 carefully: 14 divided by 7 is exactly 2, remainder zero.'
      D: 'You went for 25. That is the total on the right-hand side, not $X$. Take away the 11 that $1011_{2}$ is worth first, then convert what is left to base 7.'

  2:
    moments:
      - say: 'We want the value of this bracket raised to the power negative 1, correct to 2 decimal places.'
        write: '$\left[\dfrac{1}{0.03} \div \dfrac{1}{0.024}\right]^{-1}$'
      - say: 'Let''s work from the inside out: first the division inside the bracket, then the power of negative 1 outside it.'
      - say: 'Dividing by a fraction is the same as multiplying by its reciprocal. So we flip $\dfrac{1}{0.024}$ and multiply.'
        write: '$\dfrac{1}{0.03} \times \dfrac{0.024}{1}$'
      - say: '1 times 0.024 is 0.024, and 0.03 times 1 is 0.03.'
        write: '$= \dfrac{0.024}{0.03}$'
      - say: 'To clear the decimals, multiply the top and the bottom by 1000. 0.024 becomes 24, and 0.03 becomes 30.'
        write: '$= \dfrac{24}{30}$'
      - say: 'Divide the top and bottom by 6. 24 divided by 6 is 4, and 30 divided by 6 is 5. Four fifths is 0.8.'
        write: '$= \dfrac{4}{5} = 0.8$'
      - say: 'So the bracket is 0.8. Now the power of negative 1. A power of negative 1 means take the reciprocal: 1 over the number.'
        write: '$[0.8]^{-1} = \dfrac{1}{0.8}$'
      - say: '0.8 is four fifths, and 1 over four fifths is five quarters.'
        write: '$= \dfrac{5}{4}$'
      - say: '5 divided by 4 is 1.25.'
        write: '$= 1.25$'
      - say: 'Correct to 2 decimal places, that is 1.25, which is answer choice B.'
        write: '$1.25$'
        answer: true
    traps:
      A: 'You went for 3.76. That doesn''t come from this working. The bracket simplifies to 0.024 over 0.03, which is 0.8, and flipping 0.8 gives 1.25.'
      C: 'You went for 0.94. Check the division inside the bracket: dividing by $\dfrac{1}{0.024}$ means multiplying by 0.024, which gives 0.8. Then the power of negative 1 flips that to 1.25.'
      D: 'You went for 0.75. The bracket is 0.8, not 0.75, and the power of negative 1 then turns it into 1 over 0.8. Don''t forget that final flip: the answer is 1.25.'

  3:
    moments:
      - say: 'We''re given $b^{3} = a^{-3}$ and $c^{1/3} = a^{1/2}b$, and we want $c$ in terms of $a$.'
        write: '$b^{3} = a^{-3}, \quad c^{1/3} = a^{1/2}b$'
      - say: 'The letter $b$ links the two conditions, so the first thing we need to do is write $b$ in terms of $a$.'
      - say: 'Take the cube root of both sides of $b^{3} = a^{-3}$. Taking a cube root divides the index by 3.'
        write: '$b = a^{-3 \div 3}$'
      - say: 'Negative 3 divided by 3 is negative 1, so $b$ is $a$ to the power negative 1.'
        write: '$b = a^{-1}$'
      - say: 'Now substitute that into the second condition in place of $b$.'
        write: '$c^{1/3} = a^{1/2} \times a^{-1}$'
      - say: 'When we multiply powers of the same base, we add the indices. A half plus negative 1 is negative a half.'
        write: '$c^{1/3} = a^{\frac{1}{2} + (-1)} = a^{-1/2}$'
      - say: 'But the question asks for $c$, not $c$ to the one third. How do we undo a power of one third? We cube both sides.'
        write: '$\left(c^{1/3}\right)^{3} = \left(a^{-1/2}\right)^{3}$'
      - say: 'A power of a power means multiply the indices. One third times 3 is 1, and negative a half times 3 is negative three halves.'
        write: '$c = a^{-\frac{1}{2} \times 3} = a^{-3/2}$'
      - say: 'Let''s check with a number. If $a$ is 4, then $b$ is a quarter, and $c^{1/3}$ is 2 times a quarter, which is a half. Cubing, $c$ is one eighth. And 4 to the negative three halves is 1 over 8 too.'
        write: '$4^{-3/2} = \dfrac{1}{(\sqrt{4})^{3}} = \dfrac{1}{8}$'
      - say: 'So $c$ is $a$ to the power negative three halves, which is answer choice C.'
        write: '$c = a^{-3/2}$'
        answer: true
    traps:
      A: 'You went for $a^{-1/2}$. That is $c^{1/3}$, the line before the last step. The question wants $c$ itself, so cube both sides: negative a half times 3 is negative three halves.'
      B: 'You went for $a^{1/2}$. The sign has gone wrong: a half plus negative 1 is negative a half, not positive a half. And $c^{1/3}$ still needs cubing after that.'
      D: 'You went for $a^{-2/3}$. To go from $c^{1/3}$ to $c$ we cube, which multiplies the index by 3. Negative a half times 3 is negative three halves, not negative two thirds.'

  4:
    moments:
      - say: 'We have two equations with logarithms, one in base 4 and one in base 2, and we want $x$ and $y$, in that order. Here is the first.'
        write: '$\log_{4}(y - 1) + \log_{4}\left(\tfrac{1}{2}x\right) = 1$'
      - say: 'And here is the second.'
        write: '$\log_{2}(y + 1) + \log_{2}x = 2$'
      - say: 'The plan: in each equation, combine the two logs into one log, then change it into index form.'
      - say: 'Adding logs with the same base means multiplying what''s inside. So the first equation becomes one log of $(y - 1)$ times a half $x$.'
        write: '$\log_{4}\left[(y - 1) \times \tfrac{1}{2}x\right] = 1$'
      - say: 'If log base 4 of something is 1, then that something is 4 to the power 1, which is 4.'
        write: '$(y - 1) \times \tfrac{1}{2}x = 4$'
      - say: 'Multiply both sides by 2 to clear the half. 4 times 2 is 8.'
        write: '$(y - 1)x = 8$'
      - say: 'Now the second equation. Combine the two logs the same way.'
        write: '$\log_{2}\left[(y + 1)x\right] = 2$'
      - say: 'If log base 2 of something is 2, that something is 2 squared, which is 4.'
        write: '$(y + 1)x = 4$'
      - say: 'Now subtract the second equation from the first. On the left, $x$ is a common factor, so we can take it outside.'
        write: '$x\left[(y - 1) - (y + 1)\right] = 8 - 4$'
      - say: 'Inside the bracket, $y$ minus $y$ is zero, and negative 1 minus 1 is negative 2. On the right, 8 minus 4 is 4.'
        write: '$-2x = 4$'
      - say: 'Divide both sides by negative 2. 4 divided by negative 2 is negative 2.'
        write: '$x = -2$'
      - say: 'Now put $x$ equals negative 2 into $(y + 1)x = 4$.'
        write: '$(y + 1)(-2) = 4$'
      - say: 'Divide both sides by negative 2, and $y + 1$ equals negative 2.'
        write: '$y + 1 = -2$'
      - say: 'Subtract 1 from both sides. Negative 2 minus 1 is negative 3.'
        write: '$y = -3$'
      - say: 'So $x$ is negative 2 and $y$ is negative 3, in that order, which is answer choice C.'
        write: '$x = -2, \ y = -3$'
        answer: true
    traps:
      A: 'You went for 2, 3. The signs have been lost. Subtracting the equations gives negative $2x$ equals 4, so $x$ is negative 2, and then $y$ is negative 3.'
      B: 'You went for 3, 2. That loses both signs and also swaps the order. Solving gives $x = -2$ and $y = -3$, and "respectively" means $x$ comes first.'
      D: 'You went for negative 3, negative 2. Those are the right numbers in the wrong order. The question asks for $x$ and $y$ respectively, so $x$, which is negative 2, comes first.'

  5:
    moments:
      - say: 'We want the value of $K$ that makes this fraction equal to $\sqrt{6} - 2$.'
        write: '$\dfrac{K}{\sqrt{3} + \sqrt{2}} = \sqrt{6} - 2$'
      - say: '$K$ is being divided by $\sqrt{3} + \sqrt{2}$. To get $K$ by itself, multiply both sides by $\sqrt{3} + \sqrt{2}$.'
        write: '$K = (\sqrt{6} - 2)(\sqrt{3} + \sqrt{2})$'
      - say: 'We could expand straight away, but here''s a neat trick. $\sqrt{6}$ is $\sqrt{2}$ times $\sqrt{3}$, and 2 is $\sqrt{2}$ times $\sqrt{2}$.'
        write: '$\sqrt{6} - 2 = \sqrt{2}\sqrt{3} - \sqrt{2}\sqrt{2}$'
      - say: 'Both terms have a $\sqrt{2}$, so take it out as a common factor.'
        write: '$= \sqrt{2}(\sqrt{3} - \sqrt{2})$'
      - say: 'Put that back into $K$.'
        write: '$K = \sqrt{2}(\sqrt{3} - \sqrt{2})(\sqrt{3} + \sqrt{2})$'
      - say: 'The last two brackets are a difference of two squares: the first squared minus the second squared.'
        write: '$(\sqrt{3} - \sqrt{2})(\sqrt{3} + \sqrt{2}) = (\sqrt{3})^{2} - (\sqrt{2})^{2}$'
      - say: '$\sqrt{3}$ squared is 3, $\sqrt{2}$ squared is 2, and 3 minus 2 is 1.'
        write: '$= 3 - 2 = 1$'
      - say: 'So $K$ is $\sqrt{2}$ times 1, which is just $\sqrt{2}$.'
        write: '$K = \sqrt{2} \times 1 = \sqrt{2}$'
      - say: 'Let''s check by expanding directly instead. Multiplying out the two brackets gives four terms.'
        write: '$\sqrt{18} + \sqrt{12} - 2\sqrt{3} - 2\sqrt{2}$'
      - say: '$\sqrt{18}$ is $\sqrt{9}$ times $\sqrt{2}$, which is $3\sqrt{2}$. And $\sqrt{12}$ is $\sqrt{4}$ times $\sqrt{3}$, which is $2\sqrt{3}$.'
        write: '$= 3\sqrt{2} + 2\sqrt{3} - 2\sqrt{3} - 2\sqrt{2}$'
      - say: 'The $\sqrt{3}$ terms cancel, and $3\sqrt{2}$ minus $2\sqrt{2}$ is $\sqrt{2}$. Same answer.'
        write: '$= \sqrt{2}$'
      - say: 'So $K$ is $\sqrt{2}$, which is answer choice D.'
        write: '$K = \sqrt{2}$'
        answer: true
    traps:
      A: 'You went for 3. That is $\sqrt{3}$ squared from the difference of two squares, but that step gives 3 minus 2, which is 1, and $K$ is $\sqrt{2}$ times that 1.'
      B: 'You went for 2. That is $\sqrt{2}$ squared, but nothing here is squared on its own. $K$ is $\sqrt{2}$ times 1, which is just $\sqrt{2}$.'
      C: 'You went for $\sqrt{3}$. Check the common factor: $\sqrt{6} - 2$ factorises as $\sqrt{2}$ times $(\sqrt{3} - \sqrt{2})$, so the factor left over is $\sqrt{2}$, not $\sqrt{3}$.'

  6:
    moments:
      - say: 'A market woman buys a full jug of oil for ₦50 and sells the oil in small tins at ₦15 each. We want how much she makes.'
        write: 'Jug: ₦50.00, tins: ₦15.00 each'
      - say: 'The first thing we need is how many tins the jug fills. Both are cylinders, and a cylinder''s volume is $\pi r^{2}h$.'
        write: '$V = \pi r^{2}h$'
      - say: 'Careful: the sizes are given as diameters, and the formula needs radii. The jug is 10 cm across, so its radius is 5 cm, and it is 18 cm deep.'
        write: '$\text{Jug: } r = 5, \ h = 18$'
      - say: '5 squared is 25, and 25 times 18 is 450. So the jug holds $450\pi$ cubic centimetres.'
        write: '$V_{\text{jug}} = \pi(5^{2})(18) = 450\pi$'
      - say: 'Each tin is 6 cm across, so its radius is 3 cm, and it is 10 cm deep.'
        write: '$\text{Tin: } r = 3, \ h = 10$'
      - say: '3 squared is 9, and 9 times 10 is 90. So a tin holds $90\pi$ cubic centimetres.'
        write: '$V_{\text{tin}} = \pi(3^{2})(10) = 90\pi$'
      - say: 'The number of tins is the jug''s volume divided by a tin''s volume. The $\pi$ cancels, and 450 divided by 90 is 5.'
        write: '$\dfrac{450\pi}{90\pi} = 5 \text{ tins}$'
      - say: 'She sells 5 tins at ₦15 each. 5 times 15 is 75, so she takes in ₦75.'
        write: '$5 \times 15 = 75$'
      - say: 'She paid ₦50 for the jug, so her profit is 75 minus 50, which is 25.'
        write: '$75 - 50 = 25$'
      - say: 'So she made ₦25, which is answer choice D.'
        write: 'Profit: ₦25.00'
        answer: true
    traps:
      A: 'You went for ₦62.50. That doesn''t match the volumes: the jug holds exactly 5 tins, so she takes in ₦75 and, after the ₦50 she paid, makes ₦25.'
      B: 'You went for ₦35.00. Check the number of tins: with radii 5 and 3, the jug is $450\pi$ and a tin is $90\pi$, so it fills 5 tins. That brings in ₦75, and ₦75 minus ₦50 is ₦25.'
      C: 'You went for ₦31.00. Halve the diameters first, then compare the volumes: the jug fills exactly 5 tins, which sell for ₦75, leaving ₦25 after the ₦50 cost.'

  7:
    moments:
      - say: 'A man earns $r$ naira an hour for normal work and double that for overtime. He works 35 hours in a week, and $q$ of those hours are overtime. We want his weekly pay.'
      - say: 'The key point: the 35 hours include the overtime. So the normal hours are 35 minus $q$.'
        write: '$\text{normal hours} = 35 - q$'
      - say: 'Normal hours are paid at $r$ naira each.'
        write: '$\text{normal pay} = r(35 - q)$'
      - say: 'Multiply out the bracket. $r$ times 35 is $35r$, and $r$ times $q$ is $rq$.'
        write: '$= 35r - rq$'
      - say: 'Overtime pays double the rate, so $2r$ naira an hour, for $q$ hours.'
        write: '$\text{overtime pay} = 2r \times q = 2rq$'
      - say: 'His weekly pay is the two parts added together.'
        write: '$\text{total} = 35r - rq + 2rq$'
      - say: 'Negative $rq$ plus $2rq$ is positive $rq$.'
        write: '$= 35r + rq$'
      - say: 'Both terms have an $r$, so take $r$ out as a common factor.'
        write: '$= r(35 + q)$'
      - say: 'Let''s check with numbers. Say $r$ is 100 and $q$ is 5. Then 30 normal hours earn 3000, and 5 overtime hours at 200 earn 1000, so 4000 in all. And 100 times 40 is 4000 too.'
        write: '$30 \times 100 + 5 \times 200 = 4000 = 100(35 + 5)$'
      - say: 'So his weekly earning is $r(35 + q)$ naira, which is answer choice A.'
        write: '$r(35 + q)$'
        answer: true
    traps:
      B: 'You went for $q(35r - q)$. Here $q$ has been taken out as a factor, but $q$ is not in every term. The pay is $35r + rq$, and the common factor is $r$.'
      C: 'You went for $q(35r + r)$. That multiplies everything by $q$, the overtime hours. Only the overtime part involves $q$: the total is $35r + rq$, which factorises as $r(35 + q)$.'
      D: 'You went for $r(35r - q)$. Taking $r$ out of $35r$ leaves 35, not $35r$, and the overtime adds $rq$ rather than taking it away. The total is $r(35 + q)$.'

  8:
    moments:
      - say: 'We''re given three sets inside the universal set 1 to 6, and we want $P$ union, $Q$ union $R$.'
        write: '$P = \{1, 2, 3, 4\}, \ Q = \{3, 4, 5\}, \ R = \{2, 4, 6\}$'
      - say: 'A union collects every element that is in either set, writing each one only once. We start with the bracket, $Q \cup R$.'
      - say: '$Q$ has 3, 4 and 5. $R$ has 2, 4 and 6.'
        write: '$Q \cup R = \{3, 4, 5\} \cup \{2, 4, 6\}$'
      - say: 'Put them together in order: 2, 3, 4, 5, 6. The 4 is in both, but we write it only once.'
        write: '$Q \cup R = \{2, 3, 4, 5, 6\}$'
      - say: 'Now take the union of that with $P$.'
        write: '$P \cup (Q \cup R) = \{1, 2, 3, 4\} \cup \{2, 3, 4, 5, 6\}$'
      - say: '$P$ brings in the 1, which wasn''t there yet. Its 2, 3 and 4 are already in.'
        write: '$= \{1, 2, 3, 4, 5, 6\}$'
      - say: 'That is every element of the universal set. So the answer is the set 1, 2, 3, 4, 5, 6, which is answer choice D.'
        write: '$P \cup (Q \cup R) = \{1, 2, 3, 4, 5, 6\} = U$'
        answer: true
    traps:
      A: 'You went for the set with only 4 in it. That is what intersections would give, the one element in all three sets. A union keeps every element that is in any of the sets.'
      B: 'You went for 1, 2, 3, 4. That is just $P$ on its own. The union with $Q \cup R$ also brings in 5 and 6.'
      C: 'You went for 1, 2, 3, 5, 6. The 4 has been dropped, perhaps because it appears in more than one set. In a union, a shared element is still kept, written once.'

  9:
    moments:
      - say: 'In the Venn diagram there are three circles, $P$, $Q$ and $R$, and one region is shaded. We want the set expression for that region.'
      - say: 'The method: for each circle in turn, ask whether the shaded region is inside it or outside it.'
      - say: 'First, $P$. The shaded part sits inside the left-hand circle, $P$.'
        write: '$\text{inside } P$'
      - say: 'Next, $R$. It is also inside the bottom circle, $R$.'
        write: '$\text{inside } R$'
      - say: 'Now $Q$. The shading stops at the edge of the right-hand circle, so it is outside $Q$. Outside $Q$ means in the complement of $Q$, written $Q''$.'
        write: '$\text{outside } Q \ \Rightarrow \ Q''$'
      - say: 'Inside $P$ and outside $Q$ at the same time: "and" means intersection.'
        write: '$P \cap Q''$'
      - say: 'And the region must also be inside $R$, so we intersect with $R$ as well.'
        write: '$(P \cap Q'') \cap R$'
      - say: 'So the shaded region is $P$ intersection $Q$ complement, intersection $R$, which is answer choice C.'
        write: '$(P \cap Q'') \cap R$'
        answer: true
    traps:
      A: 'You went for $(P \cap Q) \cup R$. That union takes in all of circle $R$, plus where $P$ and $Q$ overlap, which is far more than the shaded piece. The shaded piece is inside $P$ and $R$ but outside $Q$.'
      B: 'You went for $(P \cap Q) \cap R$. That is the small middle part inside all three circles. The shaded piece is outside $Q$, so it needs $Q''$, not $Q$.'
      D: 'You went for $(P \cup Q'') \cap R$. That union takes everything in $R$ that is in $P$ or outside $Q$, which is almost all of $R$. The shaded piece is in $P$ and outside $Q$ at once, so it needs an intersection.'

  10:
    moments:
      - say: 'When $pm^{2} + qm + 1$ is divided by $m - 1$ the remainder is 2, and when it is divided by $m + 1$ the remainder is 4. We want $p$ and $q$.'
        write: '$f(m) = pm^{2} + qm + 1$'
      - say: 'We use the remainder theorem: when $f(m)$ is divided by $m - a$, the remainder is $f(a)$. So we substitute the value that makes the divisor zero.'
      - say: '$m - 1$ is zero when $m$ is 1. So substitute $m = 1$.'
        write: '$f(1) = p(1)^{2} + q(1) + 1$'
      - say: '1 squared is 1, so this is $p + q + 1$.'
        write: '$f(1) = p + q + 1$'
      - say: 'That remainder is 2.'
        write: '$p + q + 1 = 2$'
      - say: 'Subtract 1 from both sides. 2 minus 1 is 1.'
        write: '$p + q = 1$'
      - say: 'Now, $m + 1$ is zero when $m$ is negative 1. So substitute $m = -1$.'
        write: '$f(-1) = p(-1)^{2} + q(-1) + 1$'
      - say: 'Negative 1 squared is positive 1, and $q$ times negative 1 is negative $q$.'
        write: '$f(-1) = p - q + 1$'
      - say: 'That remainder is 4, so $p - q + 1 = 4$. Subtract 1 from both sides, and 4 minus 1 is 3.'
        write: '$p - q = 3$'
      - say: 'Now add the two equations. The $q$ and the negative $q$ cancel, and 1 plus 3 is 4.'
        write: '$2p = 4$'
      - say: 'Divide both sides by 2. 4 divided by 2 is 2.'
        write: '$p = 2$'
      - say: 'Put $p = 2$ into $p + q = 1$. 2 plus $q$ is 1, so $q$ is 1 minus 2, which is negative 1.'
        write: '$q = 1 - 2 = -1$'
      - say: 'Let''s check. $f(1)$ is 2 minus 1 plus 1, which is 2. $f(-1)$ is 2 plus 1 plus 1, which is 4. Both remainders work.'
        write: '$f(1) = 2, \quad f(-1) = 4$'
      - say: 'So $p$ is 2 and $q$ is negative 1, which is answer choice A.'
        write: '$p = 2, \ q = -1$'
        answer: true
    traps:
      B: 'You went for negative 1, 2. Those are the right numbers in the wrong order. The question asks for $p$ and $q$ respectively, and $p$ is 2.'
      C: 'You went for 3, negative 2. Those fit $p + q = 1$, but not the second remainder: $f(-1)$ would be 3 plus 2 plus 1, which is 6, not 4. For $m + 1$ we substitute negative 1 and get $p - q = 3$.'
      D: 'You went for negative 2, 3. That fits the first remainder, but $f(-1)$ would be negative 2 minus 3 plus 1, which is negative 4, not 4. Solve both equations together: $p = 2$, $q = -1$.'

  11:
    moments:
      - say: 'We want to factorise $r^{2} - r(2p + q) + 2pq$.'
        write: '$r^{2} - r(2p + q) + 2pq$'
      - say: 'The first thing we need to do is expand the bracket, so that we have four separate terms to work with.'
      - say: '$r$ times $2p$ is $2pr$, and $r$ times $q$ is $qr$. The minus sign in front goes onto both.'
        write: '$= r^{2} - 2pr - qr + 2pq$'
      - say: 'Now group the four terms into two pairs that share a factor. Take the first with the third, and the second with the fourth.'
        write: '$= (r^{2} - qr) + (-2pr + 2pq)$'
      - say: 'From the first pair, take out $r$. $r^{2}$ divided by $r$ is $r$, and $qr$ divided by $r$ is $q$.'
        write: '$r^{2} - qr = r(r - q)$'
      - say: 'From the second pair, take out negative $2p$. Negative $2pr$ divided by negative $2p$ is $r$, and $2pq$ divided by negative $2p$ is negative $q$.'
        write: '$-2pr + 2pq = -2p(r - q)$'
      - say: 'Put the pairs back together. Both have the same bracket, $r - q$, which tells us the grouping worked.'
        write: '$= r(r - q) - 2p(r - q)$'
      - say: 'Take out the common bracket $r - q$. What''s left is $r$ minus $2p$.'
        write: '$= (r - q)(r - 2p)$'
