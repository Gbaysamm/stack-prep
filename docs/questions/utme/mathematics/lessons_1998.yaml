  14:
    moments:
      - say: 'We want to make $\dfrac{a}{x}$ the subject of this formula.'
        write: '$\dfrac{x + a}{x - a} = m$'
      - say: 'The plan: get all the $a$ terms on one side and all the $x$ terms on the other, then divide.'
      - say: 'First, clear the fraction by multiplying both sides by $x - a$.'
        write: '$x + a = m(x - a)$'
        point:
          - {line: 2, kind: move, from: {line: 0, at: 'x − a'}, at: '(x − a)', text: 'times both sides'}
      - say: 'Expand the bracket. $m$ times $x$ is $mx$, and $m$ times negative $a$ is negative $ma$.'
        write: '$x + a = mx - ma$'
      - say: 'Now gather the $a$ terms on the left. Add $ma$ to both sides.'
        write: '$x + a + ma = mx$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '− ma'}, at: '+ ma', text: 'across the ='}
      - say: 'And move the $x$ terms to the right: subtract $x$ from both sides.'
        write: '$a + ma = mx - x$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '[[x]] + a'}, at: '− x', text: 'across the ='}
      - say: 'Factorise each side. The left has $a$ as a common factor, and the right has $x$.'
        write: '$a(1 + m) = x(m - 1)$'
      - say: 'Divide both sides by $x$, so that we have $a$ over $x$ on the left.'
        write: '$\dfrac{a}{x}(1 + m) = m - 1$'
      - say: 'Then divide both sides by $1 + m$, which is the same as $m + 1$.'
        write: '$\dfrac{a}{x} = \dfrac{m - 1}{m + 1}$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '(1 + m)'}, at: 'm + 1', text: 'divide it over'}
      - say: 'Let''s check with numbers. Say $a$ is 1 and $x$ is 3. Then $m$ is 3 plus 1 over 3 minus 1, which is 4 over 2, or 2.'
        write: 'Check, $a = 1,\ x = 3$: $m = \dfrac{3 + 1}{3 - 1} = \dfrac{4}{2} = 2$'
      - say: 'Now put $m = 2$ into our answer. 2 minus 1 over 2 plus 1 is 1 over 3, and that is exactly $a$ over $x$.'
        write: '$\dfrac{m - 1}{m + 1} = \dfrac{2 - 1}{2 + 1} = \dfrac{1}{3} = \dfrac{a}{x}\ \checkmark$'
      - say: 'So $\dfrac{a}{x}$ equals $m - 1$ over $m + 1$, which is answer choice A.'
        write: '$\dfrac{a}{x} = \dfrac{m - 1}{m + 1}$'
        answer: true
    traps:
      B: 'You went for $\dfrac{1 + m}{1 - m}$. Test it with $a = 1$ and $x = 3$: then $m$ is 2, and this gives 3 over negative 1, which is negative 3, not one third.'
      C: 'You went for $\dfrac{1 - m}{1 + m}$. The top has the wrong sign. When $x$ moves to the right it becomes $mx - x$, which is $x(m - 1)$, not $x(1 - m)$.'
      D: 'You went for $\dfrac{m + 1}{m - 1}$. That is $\dfrac{x}{a}$, the reciprocal. The question asks for $a$ over $x$, so $m + 1$ goes on the bottom.'

  15:
    moments:
      - say: 'We want to divide $2x^{3} + 11x^{2} + 17x + 6$ by $2x + 1$.'
        write: '$(2x^{3} + 11x^{2} + 17x + 6) \div (2x + 1)$'
      - say: 'We''ll use long division. In each round, we divide the leading term by $2x$, multiply back, and subtract.'
        write: 'Each round: divide, multiply back, subtract'
      - say: 'Round 1. Divide the leading terms: $2x^{3}$ divided by $2x$ is $x^{2}$. That is the first term of the answer.'
        write: 'Round 1: $2x^{3} \div 2x = x^{2}$'
      - say: 'Multiply back: $x^{2}$ times $2x + 1$ is $2x^{3} + x^{2}$.'
        write: '$x^{2}(2x + 1) = 2x^{3} + x^{2}$'
      - say: 'Subtract that from the first two terms. The $2x^{3}$ cancels, and $11x^{2}$ minus $x^{2}$ is $10x^{2}$.'
        write: 'Subtract: $(2x^{3} + 11x^{2}) - (2x^{3} + x^{2}) = 10x^{2}$'
      - say: 'Bring down the rest, $17x$ plus 6.'
        write: 'Left: $10x^{2} + 17x + 6$'
      - say: 'Round 2. $10x^{2}$ divided by $2x$ is $5x$. That is the second term of the answer.'
        write: 'Round 2: $10x^{2} \div 2x = 5x$'
      - say: 'Multiply back: $5x$ times $2x + 1$ is $10x^{2} + 5x$.'
        write: '$5x(2x + 1) = 10x^{2} + 5x$'
      - say: 'Subtract. The $10x^{2}$ cancels, and $17x$ minus $5x$ is $12x$. Bring down the 6.'
        write: 'Subtract: $(10x^{2} + 17x) - (10x^{2} + 5x) = 12x$; left: $12x + 6$'
      - say: 'Round 3. $12x$ divided by $2x$ is 6. That is the last term of the answer.'
        write: 'Round 3: $12x \div 2x = 6$'
      - say: 'Multiply back: 6 times $2x + 1$ is $12x + 6$.'
        write: '$6(2x + 1) = 12x + 6$'
      - say: 'Subtract, and nothing is left. The remainder is 0, so $2x + 1$ divides exactly.'
        write: 'Remainder: $(12x + 6) - (12x + 6) = 0$'
      - say: 'The answer is made of the three terms we found in the three rounds: $x^{2}$, then $5x$, then 6.'
        write: 'Quotient $= x^{2} + 5x + 6$'
        point:
          - {line: 12, kind: move, from: {line: 2, at: '= x2'}, at: 'x2', text: 'round 1'}
          - {line: 12, kind: move, from: {line: 6, at: '= 5x'}, at: '+ 5x', text: 'round 2'}
          - {line: 12, kind: move, from: {line: 9, at: '= 6'}, at: '+ 6', text: 'round 3'}
      - say: 'Let''s check by multiplying back. $2x$ times each term gives $2x^{3}$, $10x^{2}$ and $12x$. Then 1 times each term gives $x^{2}$, $5x$ and 6.'
        write: 'Check: $(2x + 1)(x^{2} + 5x + 6) = 2x^{3} + 10x^{2} + 12x + x^{2} + 5x + 6$'
      - say: '$10x^{2}$ plus $x^{2}$ is $11x^{2}$, and $12x$ plus $5x$ is $17x$. That is exactly what we started with.'
