# UTME 1998 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1998.yaml. Answers match that file.
format_version: 1
exam_year: 1998
lessons:
  1:
    moments:
      - say: 'We''re told that $1011_{2} + X_{7} = 25_{10}$, and we want $X$. Notice there are three different bases here: base 2, base 7 and base 10.'
        write: '$1011_{2} + X_{7} = 25_{10}$'
      - say: 'The safest plan is to change everything into base ten, solve there, and then change the answer back into base 7, because $X$ carries the little 7.'
        write: 'Plan: work in base ten, then write $X$ in base 7'
      - say: 'Start with $1011_{2}$. In base 2 the place values, from the right, are the powers of 2: 1, 2, 4 and 8. So each digit is multiplied by its place value.'
        write: '$1011_{2} = 1 \times 2^{3} + 0 \times 2^{2} + 1 \times 2^{1} + 1 \times 2^{0}$'
      - say: '2 cubed is 8, 2 squared is 4, 2 to the power 1 is 2, and 2 to the power 0 is 1.'
        write: '$= 1 \times 8 + 0 \times 4 + 1 \times 2 + 1 \times 1$'
      - say: 'Now multiply. 1 times 8 is 8, 0 times 4 is 0, 1 times 2 is 2, and 1 times 1 is 1.'
        write: '$= 8 + 0 + 2 + 1$'
      - say: '8 plus 0 plus 2 plus 1 is 11. So $1011_{2}$ is worth 11 in base ten.'
        write: '$= 11_{10}$'
      - say: 'Now go back to the equation. Put in the 11 we just found, and the 25 is already in base ten.'
        write: 'In base ten: $11 + X = 25$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '[[11]]10'}, at: '11', text: '1011 in base ten'}
          - {line: 6, kind: move, from: {line: 0, at: '= 25'}, at: '25', text: 'given'}
      - say: 'Subtract 11 from both sides. 25 minus 11 is 14.'
        write: '$X = 25 - 11 = 14_{10}$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '11 +'}, at: '− 11', text: 'across the ='}
      - say: 'But $X$ is written in base 7, so 14 must be changed into base 7. We divide by 7 and keep the remainder. 14 divided by 7 is 2, remainder 0.'
        write: 'Into base 7: $14 \div 7 = 2 \text{ remainder } 0$'
      - say: 'Now divide the 2 by 7. That is 0, remainder 2.'
        write: '$2 \div 7 = 0 \text{ remainder } 2$'
      - say: 'Read the remainders from the bottom up: 2, then 0. So 14 in base ten is 20 in base 7.'
        write: '$14_{10} = 20_{7}$'
      - say: 'Let''s check. 20 in base 7 means 2 sevens and 0 units, which is 14. And 11 plus 14 is 25, just as the question says.'
        write: 'Check: $20_{7} = 2 \times 7 + 0 = 14$, and $11 + 14 = 25$'
      - say: 'So $X$ is 20, which is answer choice B.'
        write: '$X = 20$'
        answer: true
    traps:
      A: 'You went for 14. That is the right value in base ten, but $X$ carries the subscript 7, so 14 must be changed to base 7: two sevens and no units, which is 20.'
      C: 'You went for 24. In base 7 that means 2 sevens plus 4, which is 18, and 11 plus 18 is 29, not 25. Convert 14 carefully: 14 divided by 7 is exactly 2, remainder 0.'
      D: 'You went for 25. That is the total on the right-hand side, not $X$. Take away the 11 that $1011_{2}$ is worth first, then convert what is left to base 7.'

  2:
    moments:
      - say: 'We want the value of this bracket raised to the power negative 1, correct to 2 decimal places.'
        write: '$\left[\dfrac{1}{0.03} \div \dfrac{1}{0.024}\right]^{-1}$'
      - say: 'Let''s work from the inside out: first the division inside the bracket, then the power of negative 1 outside it.'
        write: 'Step 1: the bracket'
      - say: 'Dividing by a fraction is the same as multiplying by its reciprocal, the fraction turned upside down. So we flip 1 over 0.024 and multiply.'
        write: '$\dfrac{1}{0.03} \div \dfrac{1}{0.024} = \dfrac{1}{0.03} \times \dfrac{0.024}{1}$'
      - say: 'On top, 1 times 0.024 is 0.024. On the bottom, 0.03 times 1 is 0.03.'
        write: '$= \dfrac{0.024}{0.03}$'
      - say: 'To clear the decimals, multiply the top and the bottom by 1000. 0.024 becomes 24, and 0.03 becomes 30.'
        write: '$= \dfrac{0.024 \times 1000}{0.03 \times 1000} = \dfrac{24}{30}$'
      - say: 'Divide the top and bottom by 6. 24 divided by 6 is 4, and 30 divided by 6 is 5.'
        write: '$= \dfrac{24 \div 6}{30 \div 6} = \dfrac{4}{5}$'
      - say: 'And 4 over 5 as a decimal is 0.8. So the whole bracket is worth 0.8.'
        write: '$= 0.8$'
      - say: 'Step 2, the power of negative 1. A power of negative 1 means take the reciprocal, 1 over the number. So we put the 0.8 we just found under a 1.'
        write: 'Step 2: $[0.8]^{-1} = \dfrac{1}{0.8}$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '0.8'}, at: '= [[0.8]]1', text: 'under a 1'}
      - say: '0.8 is 4 over 5, and 1 over 4 over 5 is that fraction turned upside down, 5 over 4.'
        write: '$= \dfrac{1}{\tfrac{4}{5}} = \dfrac{5}{4}$'
      - say: '5 divided by 4 is 1.25.'
        write: '$= 1.25$'
      - say: 'Correct to 2 decimal places, that is 1.25, which is answer choice B.'
        write: 'Answer: $1.25$'
        answer: true
    traps:
      A: 'You went for 3.76. That doesn''t come from this working. The bracket simplifies to 0.024 over 0.03, which is 0.8, and flipping 0.8 gives 1.25.'
      C: 'You went for 0.94. Check the division inside the bracket: dividing by 1 over 0.024 means multiplying by 0.024, which gives 0.8. Then the power of negative 1 flips that to 1.25.'
      D: 'You went for 0.75. The bracket is 0.024 over 0.03, which is 0.8, not 0.75. Then the power of negative 1 turns it into 1 over 0.8, which is 1.25; don''t forget that final flip.'

  3:
    moments:
      - say: 'We''re given $b^{3} = a^{-3}$ and $c^{1/3} = a^{1/2}b$, and we want $c$ in terms of $a$.'
        write: '$b^{3} = a^{-3}, \quad c^{1/3} = a^{1/2}b$'
      - say: 'The letter $b$ links the two conditions. So the first thing we need to do is write $b$ in terms of $a$, using the first condition.'
        write: 'From $b^{3} = a^{-3}$:'
      - say: 'Take the cube root of both sides. A cube root undoes a cube, and it divides the index by 3.'
        write: '$b = a^{-3 \div 3}$'
      - say: 'Negative 3 divided by 3 is negative 1. So $b$ is $a$ to the power negative 1.'
        write: '$b = a^{-1}$'
      - say: 'Now go to the second condition, and replace $b$ with the $a^{-1}$ we just found.'
        write: '$c^{1/3} = a^{1/2} \times a^{-1}$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: 'a−1'}, at: '× a−1', text: 'in place of b'}
      - say: 'When we multiply powers of the same base, we add the indices. So the new index is a half plus negative 1.'
        write: '$c^{1/3} = a^{\frac{1}{2} + (-1)}$'
      - say: 'A half plus negative 1 is a half minus 1, which is negative a half.'
        write: '$c^{1/3} = a^{-1/2}$'
      - say: 'But the question asks for $c$, not $c$ to the power one third. How do we undo a power of one third? We cube both sides.'
        write: '$\left(c^{1/3}\right)^{3} = \left(a^{-1/2}\right)^{3}$'
      - say: 'A power of a power means multiply the indices. On the left, one third times 3 is 1, leaving just $c$. On the right, negative a half times 3 is negative 3 over 2.'
        write: '$c = a^{-\frac{1}{2} \times 3} = a^{-3/2}$'
      - say: 'Let''s check with a number. Say $a$ is 4. Then $b$ is 1 over 4, and $c^{1/3}$ is root 4 times 1 over 4, which is 2 over 4, or a half. Cubing that, $c$ is 1 over 8.'
        write: 'Check, $a = 4$: $b = \tfrac{1}{4}$, $c^{1/3} = 2 \times \tfrac{1}{4} = \tfrac{1}{2}$, so $c = \tfrac{1}{8}$'
      - say: 'Our formula gives 4 to the power negative 3 over 2. That is 1 over root 4 cubed, which is 1 over 2 cubed, 1 over 8. They agree.'
        write: '$4^{-3/2} = \dfrac{1}{(\sqrt{4})^{3}} = \dfrac{1}{2^{3}} = \dfrac{1}{8}$'
      - say: 'So $c$ is $a$ to the power negative 3 over 2, which is answer choice C.'
        write: '$c = a^{-3/2}$'
        answer: true
    traps:
      A: 'You went for $a^{-1/2}$. That is $c^{1/3}$, the line before the last step. The question wants $c$ itself, so cube both sides: negative a half times 3 is negative 3 over 2.'
      B: 'You went for $a^{1/2}$. The sign has gone wrong: a half plus negative 1 is negative a half, not positive a half. And $c^{1/3}$ still needs cubing after that.'
      D: 'You went for $a^{-2/3}$. To go from $c^{1/3}$ to $c$ we cube, which multiplies the index by 3. Negative a half times 3 is negative 3 over 2, not negative 2 over 3.'

  4:
    moments:
      - say: 'We have two equations with logarithms, one in base 4 and one in base 2, and we want $x$ and $y$, in that order. Here is the first.'
        write: '$\log_{4}(y - 1) + \log_{4}\left(\tfrac{1}{2}x\right) = 1$'
      - say: 'And here is the second.'
        write: '$\log_{2}(y + 1) + \log_{2}x = 2$'
      - say: 'The plan: in each equation, combine the two logs into one log, then change it into index form, so that no logs are left.'
      - say: 'Start with the first equation. Adding logs with the same base means multiplying what''s inside. So it becomes one log of $y - 1$ times a half $x$.'
        write: '$\log_{4}\left[(y - 1) \times \tfrac{1}{2}x\right] = 1$'
      - say: 'What does log base 4 of something equals 1 mean? It means that something is 4 to the power 1, which is 4.'
        write: '$(y - 1) \times \tfrac{1}{2}x = 4^{1} = 4$'
      - say: 'Multiply both sides by 2 to clear the half. 4 times 2 is 8. Let''s call this equation 1.'
        write: '$(y - 1)x = 8 \quad (1)$'
      - say: 'Now the second equation. Combine the two logs the same way: one log of $y + 1$ times $x$.'
        write: '$\log_{2}\left[(y + 1)x\right] = 2$'
      - say: 'If log base 2 of something is 2, that something is 2 squared, which is 4. This is equation 2.'
        write: '$(y + 1)x = 2^{2} = 4 \quad (2)$'
      - say: 'Now subtract equation 2 from equation 1. On the left, both have a factor $x$, so we can take it outside a bracket.'
        write: '(1) minus (2): $x\left[(y - 1) - (y + 1)\right] = 8 - 4$'
        point:
          - {line: 5, kind: arrow, text: '(1)'}
          - {line: 7, kind: arrow, text: '(2)'}
      - say: 'Inside the bracket, $y$ minus $y$ is 0, and negative 1 minus 1 is negative 2. On the right, 8 minus 4 is 4.'
        write: '$-2x = 4$'
      - say: 'Divide both sides by negative 2. 4 divided by negative 2 is negative 2.'
        write: '$x = \dfrac{4}{-2} = -2$'
      - say: 'Now go back to equation 2, and put in the $x$ equals negative 2 we just found.'
        write: 'Into (2): $(y + 1)(-2) = 4$'
        point:
          - {line: 11, kind: move, from: {line: 10, at: '4 = [[−2]]'}, at: '(−2)', text: 'x'}
      - say: 'Divide both sides by negative 2. 4 divided by negative 2 is negative 2, so $y + 1$ equals negative 2.'
        write: '$y + 1 = \dfrac{4}{-2} = -2$'
      - say: 'Subtract 1 from both sides. Negative 2 minus 1 is negative 3.'
        write: '$y = -2 - 1 = -3$'
        point:
          - {line: 13, kind: move, from: {line: 12, at: '+ 1'}, at: '− 1', text: 'across the ='}
      - say: 'Let''s check these in equation 1. $y - 1$ is negative 3 minus 1, which is negative 4, and negative 4 times negative 2 is 8. It works.'
        write: 'Check (1): $(-3 - 1)(-2) = (-4)(-2) = 8$'
      - say: 'So $x$ is negative 2 and $y$ is negative 3, in that order, which is answer choice C.'
        write: '$x = -2, \ y = -3$'
        answer: true
    traps:
      A: 'You went for 2, 3. The signs have been lost. Subtracting the equations gives negative $2x$ equals 4, so $x$ is negative 2, and then $y$ is negative 3.'
      B: 'You went for 3, 2. That loses both signs and also swaps the order. Solving gives $x = -2$ and $y = -3$, and "respectively" means $x$ comes first.'
      D: 'You went for negative 3, negative 2. Those are the right numbers in the wrong order. The question asks for $x$ and $y$ respectively, so $x$, which is negative 2, comes first.'

  5:
    moments:
      - say: 'We want the value of $K$ that makes this fraction equal to $\sqrt{6} - 2$.'
        write: '$\dfrac{K}{\sqrt{3} + \sqrt{2}} = \sqrt{6} - 2$'
      - say: '$K$ is being divided by $\sqrt{3} + \sqrt{2}$. To get $K$ by itself, multiply both sides by $\sqrt{3} + \sqrt{2}$.'
        write: '$K = (\sqrt{6} - 2)(\sqrt{3} + \sqrt{2})$'
        point:
          - {line: 1, kind: move, from: {line: 0, at: '3 + 2'}, at: '(3 + 2)', text: 'times both sides'}
      - say: 'We could expand straight away, but here''s a neater way. Look at the first bracket. $\sqrt{6}$ is $\sqrt{2}$ times $\sqrt{3}$, and 2 is $\sqrt{2}$ times $\sqrt{2}$.'
        write: 'First bracket: $\sqrt{6} - 2 = \sqrt{2}\sqrt{3} - \sqrt{2}\sqrt{2}$'
      - say: 'Both terms have a $\sqrt{2}$, so take it out as a common factor.'
        write: '$= \sqrt{2}(\sqrt{3} - \sqrt{2})$'
      - say: 'Now put that back into the line for $K$, in place of $\sqrt{6} - 2$.'
        write: '$K = \sqrt{2}(\sqrt{3} - \sqrt{2})(\sqrt{3} + \sqrt{2})$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '2(3 − 2)'}, at: '2(3 − 2)', text: 'in place of √6 − 2'}
      - say: 'Look at the last two brackets: the same two surds, once with a minus and once with a plus. That is a difference of two squares, the first squared minus the second squared.'
        write: '$(\sqrt{3} - \sqrt{2})(\sqrt{3} + \sqrt{2}) = (\sqrt{3})^{2} - (\sqrt{2})^{2}$'
      - say: '$\sqrt{3}$ squared is 3, $\sqrt{2}$ squared is 2, and 3 minus 2 is 1.'
        write: '$= 3 - 2 = 1$'
      - say: 'So in the line for $K$, those two brackets together are worth just 1. That leaves $\sqrt{2}$ times 1.'
        write: '$K = \sqrt{2} \times 1 = \sqrt{2}$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '= 1'}, at: '× 1', text: 'worth 1'}
      - say: 'Let''s check by expanding the original product directly: each term in the first bracket times each term in the second.'
        write: 'Check: $(\sqrt{6} - 2)(\sqrt{3} + \sqrt{2}) = \sqrt{18} + \sqrt{12} - 2\sqrt{3} - 2\sqrt{2}$'
      - say: '$\sqrt{18}$ is $\sqrt{9}$ times $\sqrt{2}$, which is $3\sqrt{2}$. And $\sqrt{12}$ is $\sqrt{4}$ times $\sqrt{3}$, which is $2\sqrt{3}$.'
        write: '$= 3\sqrt{2} + 2\sqrt{3} - 2\sqrt{3} - 2\sqrt{2}$'
      - say: 'The $2\sqrt{3}$ terms cancel, and $3\sqrt{2}$ minus $2\sqrt{2}$ is $\sqrt{2}$. The same answer.'
        write: '$= \sqrt{2}$'
      - say: 'So $K$ is $\sqrt{2}$, which is answer choice D.'
        write: '$K = \sqrt{2}$'
        answer: true
    traps:
      A: 'You went for 3. That is $\sqrt{3}$ squared from the difference of two squares, but that step gives 3 minus 2, which is 1, and $K$ is $\sqrt{2}$ times that 1.'
      B: 'You went for 2. That is $\sqrt{2}$ squared, but nothing here is squared on its own. $K$ is $\sqrt{2}$ times 1, which is just $\sqrt{2}$.'
      C: 'You went for $\sqrt{3}$. Check the common factor: $\sqrt{6} - 2$ factorises as $\sqrt{2}$ times $(\sqrt{3} - \sqrt{2})$, so the factor left over is $\sqrt{2}$, not $\sqrt{3}$.'

  6:
    moments:
      - say: 'A market woman buys a full jug of oil for ₦50 and sells the oil in small tins at ₦15 each. We want how much she makes.'
        write: 'Jug costs ₦50.00; each tin sells for ₦15.00'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'jug: ₦50'}
          - {figure: sketch, kind: circle, target: 'tin: ₦15 each'}
      - say: 'The first thing we need is how many tins the jug fills. Both are cylinders, so we compare their volumes. A cylinder''s volume is $\pi r^{2}h$.'
        write: '$V = \pi r^{2}h$'
        point:
          - {figure: sketch, kind: underline, target: 'how many tins?'}
      - say: 'Careful: the sizes are given as diameters, and the formula needs radii. The jug is 10 cm across, so its radius is half of 10, which is 5 cm. It is 18 cm deep.'
        write: 'Jug: $r = \tfrac{10}{2} = 5,\ h = 18$'
        point:
          - {figure: sketch, kind: circle, target: '18 cm', text: 'h'}
      - say: 'Put those into the formula for the jug.'
        write: '$V_{\text{jug}} = \pi \times 5^{2} \times 18$'
        point:
          - {line: 1, kind: box, text: 'the rule'}
          - {line: 3, kind: move, from: {line: 2, at: '= 5'}, at: '[[5]]2', text: 'radius'}
          - {line: 3, kind: move, from: {line: 2, at: 'h = 18'}, at: '18', text: 'height'}
      - say: '5 squared is 25, and 25 times 18 is 450. So the jug holds $450\pi$ cubic centimetres.'
        write: '$= \pi \times 25 \times 18 = 450\pi\ \text{cm}^{3}$'
      - say: 'Each tin is 6 cm across, so its radius is half of 6, which is 3 cm. It is 10 cm deep.'
        write: 'Tin: $r = \tfrac{6}{2} = 3,\ h = 10$'
        point:
          - {figure: sketch, kind: circle, target: '6 cm', text: 'r = 3'}
      - say: 'Put those into the same formula.'
        write: '$V_{\text{tin}} = \pi \times 3^{2} \times 10$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '= 3'}, at: '[[3]]2', text: 'radius'}
          - {line: 6, kind: move, from: {line: 5, at: 'h = 10'}, at: '10', text: 'height'}
      - say: '3 squared is 9, and 9 times 10 is 90. So a tin holds $90\pi$ cubic centimetres.'
        write: '$= \pi \times 9 \times 10 = 90\pi\ \text{cm}^{3}$'
      - say: 'The number of tins is the jug''s volume divided by a tin''s volume. The $\pi$ cancels, and 450 divided by 90 is 5.'
        write: 'Number of tins $= \dfrac{450\pi}{90\pi} = 5$'
        point:
          - {line: 8, kind: move, from: {line: 4, at: '450π'}, at: '450π', text: 'jug'}
          - {line: 8, kind: move, from: {line: 7, at: '90π'}, at: '90π', text: 'tin'}
          - {figure: sketch, kind: label, target: 'how many tins?', text: '5 tins'}
      - say: 'She sells those 5 tins at ₦15 each. 5 times 15 is 75, so she takes in ₦75.'
        write: 'Money in $= 5 \times 15 =$ ₦75'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '= 5'}, at: '5 ×', text: 'tins'}
      - say: 'She paid ₦50 for the jug. Her profit is what she took in minus what she paid: 75 minus 50 is 25.'
        write: 'Profit $= 75 - 50 =$ ₦25'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '₦75'}, at: '75', text: 'in'}
          - {line: 10, kind: move, from: {line: 0, at: '₦[[50]]'}, at: '− 50', text: 'paid'}
      - say: 'So she made ₦25, which is answer choice D.'
        write: 'Profit: ₦25.00'
        answer: true
    traps:
      A: 'You went for ₦62.50. That doesn''t match the volumes: the jug holds exactly 5 tins, so she takes in ₦75 and, after the ₦50 she paid, makes ₦25.'
      B: 'You went for ₦35.00. Check the number of tins: with radii 5 and 3, the jug is $450\pi$ and a tin is $90\pi$, so it fills 5 tins. That brings in ₦75, and ₦75 minus ₦50 is ₦25.'
      C: 'You went for ₦31.00. Halve the diameters first, then compare the volumes: the jug fills exactly 5 tins, which sell for ₦75, leaving ₦25 after the ₦50 cost.'

  7:
    moments:
      - say: 'A man earns $r$ naira an hour for normal work and double that for overtime. He works 35 hours in a week, and $q$ of those hours are overtime. We want his weekly pay.'
      - say: 'The key point: the 35 hours already include the overtime. So the normal hours are 35 minus $q$.'
        write: 'Normal hours $= 35 - q$'
      - say: 'Normal hours are paid at $r$ naira each, so we multiply those hours by $r$.'
        write: 'Normal pay $= r(35 - q)$'
      - say: 'Multiply out the bracket. $r$ times 35 is $35r$, and $r$ times $q$ is $rq$.'
        write: '$= 35r - rq$'
      - say: 'Overtime pays double the rate. Double $r$ is $2r$ naira an hour.'
        write: 'Overtime rate $= 2 \times r = 2r$'
      - say: 'He does $q$ hours of overtime at that rate.'
        write: 'Overtime pay $= 2r \times q = 2rq$'
      - say: 'His weekly pay is the normal pay plus the overtime pay we just found.'
        write: 'Total $= (35r - rq) + 2rq$'
        point:
          - {line: 6, kind: move, from: {line: 3, at: '35r − rq'}, at: '(35r − rq)', text: 'normal'}
          - {line: 6, kind: move, from: {line: 5, at: '= 2rq'}, at: '+ 2rq', text: 'overtime'}
      - say: 'Negative $rq$ plus $2rq$ is positive $rq$.'
        write: '$= 35r + rq$'
      - say: 'Both terms have an $r$, so take $r$ out as a common factor. $35r$ divided by $r$ is 35, and $rq$ divided by $r$ is $q$.'
        write: '$= r(35 + q)$'
      - say: 'Let''s check with numbers. Say $r$ is 100 and $q$ is 5. Then 30 normal hours at 100 earn 3000, and 5 overtime hours at 200 earn 1000. That is 4000 in all.'
        write: 'Check, $r = 100,\ q = 5$: $30 \times 100 + 5 \times 200 = 3000 + 1000 = 4000$'
      - say: 'And our formula gives 100 times 35 plus 5, which is 100 times 40, also 4000. It agrees.'
        write: '$r(35 + q) = 100 \times 40 = 4000$'
      - say: 'So his weekly earning is $r(35 + q)$ naira, which is answer choice A.'
        write: 'Weekly earning $= r(35 + q)$'
        answer: true
    traps:
      B: 'You went for $q(35r - q)$. Here $q$ has been taken out as a factor, but $q$ is not in every term. The pay is $35r + rq$, and the common factor is $r$.'
      C: 'You went for $q(35r + r)$. That multiplies everything by $q$, the overtime hours. Only the overtime part involves $q$: the total is $35r + rq$, which factorises as $r(35 + q)$.'
      D: 'You went for $r(35r - q)$. Taking $r$ out of $35r$ leaves 35, not $35r$, and the overtime adds $rq$ rather than taking it away. The total is $r(35 + q)$.'

  8:
    moments:
      - say: 'We''re given three sets inside the universal set 1 to 6, and we want $P$ union, $Q$ union $R$.'
        write: '$P = \{1, 2, 3, 4\}, \ Q = \{3, 4, 5\}, \ R = \{2, 4, 6\}$'
      - say: 'A union collects every element that is in either set, writing each one only once. The bracket comes first, so we start with $Q \cup R$.'
        write: 'Step 1: $Q \cup R$'
      - say: '$Q$ has 3, 4 and 5. $R$ has 2, 4 and 6.'
        write: '$Q \cup R = \{3, 4, 5\} \cup \{2, 4, 6\}$'
      - say: 'Put them together in order: 2, 3, 4, 5, 6. The 4 is in both, but we write it only once.'
        write: '$= \{2, 3, 4, 5, 6\}$'
      - say: 'Step 2. Now take the union of $P$ with the set we just found.'
        write: 'Step 2: $P \cup (Q \cup R) = \{1, 2, 3, 4\} \cup \{2, 3, 4, 5, 6\}$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '{2, 3, 4, 5, 6}'}, at: '{2, 3, 4, 5, 6}', text: 'Q ∪ R'}
      - say: '$P$ brings in the 1, which wasn''t there yet. Its 2, 3 and 4 are already in, so they are not written again.'
