        write: 'Check: $2(57.5) - 25 = 115 - 25 = 90$, and $6\sin 90^{\circ} = 6$'
      - say: 'Could there be another one? The next time sine is 1 is at 90 plus 360, which is 450 degrees. Then $2x$ is 475, and $x$ is 237.5, which is outside the range.'
