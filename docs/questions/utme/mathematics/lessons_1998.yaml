          - {line: 5, kind: move, from: {line: 4, at: '= 1'}, at: '+ 1', text: 'y-difference'}
          - {line: 5, kind: move, from: {line: 0, at: 'd = 5'}, at: '5 =', text: 'distance'}
      - say: 'Square both sides. 5 squared is 25, $2x$ squared is $4x^{2}$, and 1 squared is 1.'
        write: '$25 = 4x^{2} + 1$'
      - say: 'Subtract 1 from both sides. 25 minus 1 is 24.'
        write: '$4x^{2} = 24$'
      - say: 'Divide both sides by 4. 24 divided by 4 is 6.'
        write: '$x^{2} = 6$'
      - say: 'Take the square root. Strictly, $x$ is plus or minus $\sqrt{6}$, and only the positive one is offered.'
        write: '$x = \pm\sqrt{6}$'
      - say: 'Check: $2\sqrt{6}$ squared is 4 times 6, which is 24. Add 1 to get 25, and the square root of 25 is 5.'
        write: '$(2\sqrt{6})^{2} + 1 = 24 + 1 = 25 \ \checkmark$'
      - say: 'So $x$ is $\sqrt{6}$, which is answer choice C.'
        write: '$x = \sqrt{6}$'
        answer: true
        point:
          - {figure: sketch, kind: label, target: 'x = ?', text: '√6'}
    traps:
      A: 'You went for 6. That is $x^{2}$, not $x$. The last step is the square root: $x$ is $\sqrt{6}$.'
      B: 'You went for 2.5. That treats $2x$ as the whole distance 5. The distance also has a vertical part of 1, so $4x^{2} + 1 = 25$, which gives $x = \sqrt{6}$.'
      D: 'You went for $\sqrt{3}$. Check the division: $4x^{2} = 24$ gives $x^{2} = 6$, not 3, so $x$ is $\sqrt{6}$.'

  33:
    moments:
      - say: 'We want the midpoint of the part of the line $y = 4x + 3$ that lies between the two axes. That part runs from one intercept to the other.'
        write: '$y = 4x + 3$'
      - say: 'Let me draw the line $y = 4x + 3$, cutting the two axes.'
        show_sketch: true
        point:
          - {figure: sketch, kind: underline, target: 'y = 4x + 3'}
      - say: 'First, the $y$-intercept. On the $y$-axis, $x$ is zero, so replace $x$ with 0.'
        write: '$y = 4(0) + 3 = 3$'
        point:
          - {figure: sketch, kind: circle, target: 'y', text: 'x = 0 here'}
      - say: 'So the line meets the $y$-axis at the point 0, 3.'
        write: 'So the $y$-intercept is $(0,\ 3)$'
        point:
          - {figure: sketch, kind: circle, target: '(0, 3)'}
      - say: 'Now the $x$-intercept. On the $x$-axis, $y$ is 0, so replace $y$ with 0.'
        write: '$0 = 4x + 3$'
        point:
          - {figure: sketch, kind: circle, target: 'x', text: 'y = 0 here'}
      - say: 'Subtract 3 from both sides.'
        write: '$4x = -3$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '+ 3'}, at: '−3', text: 'across the ='}
      - say: 'Divide both sides by 4. That gives negative 3 over 4.'
        write: '$x = -\dfrac{3}{4}$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '[[4]]x'}, at: '−[[4]]3', text: 'divide it over'}
      - say: 'So the line meets the $x$-axis at the point negative 3 over 4, 0.'
        write: 'So the $x$-intercept is $\left(-\tfrac{3}{4},\ 0\right)$'
        point:
          - {figure: sketch, kind: circle, target: '(−3/4, 0)'}
      - say: 'The segment runs between these two points. To find its midpoint, we average the $x$-values and average the $y$-values.'
        write: 'Midpoint $= \left(\dfrac{x_1 + x_2}{2},\ \dfrac{y_1 + y_2}{2}\right)$'
      - say: 'The $x$-values are 0 and negative 3 over 4. Their sum is negative 3 over 4.'
        write: '$x$: $\dfrac{0 + \left(-\tfrac{3}{4}\right)}{2} = \dfrac{-\tfrac{3}{4}}{2}$'
        point:
          - {line: 8, kind: box, text: 'the rule'}
          - {line: 9, kind: move, from: {line: 7, at: '−43'}, at: '(−43)', text: 'x-intercept'}
      - say: 'Dividing by 2 doubles the bottom: negative 3 over 4, divided by 2, is negative 3 over 8.'
        write: '$= -\dfrac{3}{4 \times 2} = -\dfrac{3}{8}$'
      - say: 'The $y$-values are 3 and 0. Their sum is 3, and 3 divided by 2 is 3 over 2.'
        write: '$y$: $\dfrac{3 + 0}{2} = \dfrac{3}{2}$'
        point:
          - {line: 11, kind: move, from: {line: 3, at: '(0, [[3]])'}, at: '[[3]] + 0', text: 'y-intercept'}
      - say: 'Sense check: the line slopes upwards and crosses the $y$-axis above the origin, so it must hit the $x$-axis to the left. A negative $x$ is right.'
        write: 'Gradient $4 > 0$, $y$-intercept $3 > 0$, so $x$-intercept $< 0$'
        point:
          - {figure: sketch, kind: label, target: 'y = 4x + 3', text: 'slopes up'}
          - {figure: sketch, kind: circle, target: '(0, 3)', text: 'above origin'}
          - {figure: sketch, kind: circle, target: '(−3/4, 0)', text: 'to the left'}
      - say: 'So the midpoint is negative 3 over 8, 3 over 2, which is answer choice D.'
        write: 'Midpoint $= \left(-\tfrac{3}{8},\ \tfrac{3}{2}\right)$'
        answer: true
        point:
          - {figure: sketch, kind: label, target: '?', text: '(−3/8, 3/2)'}
    traps:
      A: 'You went for negative 3 over 2, 3 over 2. The $y$-value is right, but the $x$-intercept is negative 3 over 4, and half of that is negative 3 over 8, not negative 3 over 2.'
      B: 'You went for negative 2 over 3, 3 over 2. The $x$-value should come from $4x = -3$, which gives negative 3 over 4; halving that gives negative 3 over 8.'
      C: 'You went for positive 3 over 8, 3 over 2. The size is right but the sign is wrong. $4x + 3 = 0$ gives $x$ equal to negative 3 over 4, so the midpoint''s $x$-value is negative 3 over 8.'

  34:
    moments:
      - say: 'We want to solve this equation for $x$ from 0 up to, but not including, $2\pi$.'
        write: '$\cos x + \sin x = \dfrac{1}{\cos x - \sin x}$'
      - say: 'There''s a fraction on the right, so multiply both sides by $\cos x - \sin x$.'
        write: '$(\cos x + \sin x)(\cos x - \sin x) = 1$'
        point:
          - {line: 1, kind: move, from: {line: 0, at: 'cosx − sinx'}, at: '(cosx − sinx)', text: 'times both sides'}
      - say: 'The difference of two squares: $a$ plus $b$, times $a$ minus $b$, is $a$ squared minus $b$ squared.'
        write: '$(a + b)(a - b) = a^{2} - b^{2}$'
      - say: 'The left side is a difference of two squares: $\cos x$ squared minus $\sin x$ squared.'
        write: '$\cos^{2}x - \sin^{2}x = 1$'
      - say: 'The double angle formula: cos squared minus sin squared is cos of twice the angle.'
        write: '$\cos 2A = \cos^{2}A - \sin^{2}A$'
      - say: 'And $\cos^{2}x - \sin^{2}x$ is exactly the double-angle formula for $\cos 2x$.'
        write: '$\cos 2x = 1$'
        point:
          - {line: 3, kind: box, at: 'cos2x − sin2x', text: 'double angle'}
      - say: 'Picture a dial: cosine equals 1 only when the hand points straight to the start, at angle 0. It gets back there after a full turn, $2\pi$, then after $4\pi$, and so on.'
        write: '$2x = 0, \ 2\pi, \ 4\pi, \ \ldots$'
        doodle: {name: 'custom:1998_q34_a', id: dial, caption: 'cos is 1 at the start of a turn'}
      - say: 'Divide each by 2. If $2x$ makes one full turn, $x$ makes only half a turn: watch the hand for $x$ stop at $\pi$.'
        write: '$x = 0, \ \pi, \ 2\pi, \ \ldots$'
        doodle_do:
          - {id: dial, op: stage, stage: 'custom:1998_q34_a2'}
      - say: 'The range is $0 \le x < 2\pi$. The sign at $2\pi$ is strictly less than, so $2\pi$ itself is not allowed. That leaves 0 and $\pi$, the two hands on the dial.'
        write: '$0 \le x < 2\pi \ \Rightarrow \ x = 0, \ \pi$'
        point:
          - {line: 7, kind: strike, at: '2π', text: 'not allowed'}
        doodle_do:
          - {id: dial, op: pulse, part: hand}
          - {id: dial, op: circle, part: turn}
      - say: 'Check $x = 0$. $\cos 0$ is 1 and $\sin 0$ is 0. The left side is 1, and the right side is 1 over 1, which is 1.'
        write: '$x = 0\text{: } \ 1 + 0 = \dfrac{1}{1 - 0} = 1 \ \checkmark$'
      - say: 'Check $x = \pi$. $\cos\pi$ is negative 1 and $\sin\pi$ is 0. The left side is negative 1, and the right side is 1 over negative 1, which is negative 1.'
        write: '$x = \pi\text{: } \ -1 + 0 = \dfrac{1}{-1 - 0} = -1 \ \checkmark$'
      - say: 'So $x$ is 0 or $\pi$, which is answer choice D.'
        write: '$x = 0, \ \pi$'
        answer: true
    traps:
      A: 'You went for $\tfrac{\pi}{2}$ and $\tfrac{3\pi}{2}$. There $\cos 2x$ is $\cos\pi$ or $\cos 3\pi$, which is negative 1, not 1. The equation reduces to $\cos 2x = 1$, which gives 0 and $\pi$.'
      B: 'You went for $\tfrac{\pi}{3}$ and $\tfrac{2\pi}{3}$. At $\tfrac{\pi}{3}$, $\cos 2x$ is $\cos\tfrac{2\pi}{3}$, which is negative a half, not 1. We need $\cos 2x = 1$, so $x$ is 0 or $\pi$.'
      C: 'You went for 0 and $\tfrac{\pi}{3}$. The 0 is right, but at $\tfrac{\pi}{3}$, $\cos 2x$ is negative a half, not 1. Because the angle is doubled, search two full turns of $2x$: that brings in $x = \pi$.'

  35:
    moments:
      - say: 'In the diagram, $QTR$ is a straight line. $PQ$ is 15, $PT$ is 8, and angle $PQT$ is 30 degrees. We want the sine of angle $PTR$.'
        write: '$PQ = 15, \ PT = 8, \ \angle PQT = 30^{\circ}$'
        point:
          - {figure: 0, kind: highlight, target: PQ, text: '15'}
          - {figure: 0, kind: highlight, target: PT, text: '8'}
          - {figure: 0, kind: arc, target: PQT, text: '30°'}
      - say: 'Look at triangle $PQT$. We know two sides and an angle that is not between them, so the sine rule is the tool.'
        point:
          - {figure: 0, kind: highlight, target: 'QT', text: 'triangle PQT'}
      - say: 'The sine rule: each side over the sine of the angle opposite it gives the same value.'
        write: 'Sine rule: $\dfrac{a}{\sin A} = \dfrac{b}{\sin B}$'
      - say: 'The sine rule pairs each side with the angle opposite it. $PT$ is opposite the 30 degrees at $Q$, and $PQ$ is opposite angle $PTQ$.'
        write: '$\dfrac{PT}{\sin \angle PQT} = \dfrac{PQ}{\sin \angle PTQ}$'
        point:
          - {figure: 0, kind: underline, target: 'PT', text: 'faces 30°'}
          - {figure: 0, kind: arc, target: 'PTQ', text: 'faces PQ'}
      - say: 'Put in the numbers: $PT$ is 8, the angle at $Q$ is 30 degrees, and $PQ$ is 15.'
        write: '$\dfrac{8}{\sin 30^{\circ}} = \dfrac{15}{\sin \angle PTQ}$'
        point:
          - {line: 4, kind: move, from: {line: 0, at: 'PT = [[8]]'}, at: '8', text: 'PT'}
          - {line: 4, kind: move, from: {line: 0, at: '30'}, at: '30', text: 'angle Q'}
          - {line: 4, kind: move, from: {line: 0, at: 'PQ = [[15]]'}, at: '15', text: 'PQ'}
      - say: 'Cross-multiply: 8 times $\sin \angle PTQ$ equals 15 times $\sin 30^{\circ}$.'
        write: '$8 \sin \angle PTQ = 15 \sin 30^{\circ}$'
      - say: 'Divide both sides by 8 to get $\sin \angle PTQ$ by itself.'
        write: '$\sin \angle PTQ = \dfrac{15 \sin 30^{\circ}}{8}$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '[[8]]sin∠PTQ'}, at: '= [[8]]15', text: 'divide it over'}
      - say: '$\sin 30^{\circ}$ is a half, 0.5, and 15 times 0.5 is 7.5.'
        write: '$= \dfrac{15 \times 0.5}{8} = \dfrac{7.5}{8}$'
      - say: 'Multiply the top and bottom by 2 to clear the decimal. 7.5 times 2 is 15, and 8 times 2 is 16.'
        write: '$= \dfrac{7.5 \times 2}{8 \times 2} = \dfrac{15}{16}$'
      - say: 'But the question asks about angle $PTR$, not $PTQ$. $QTR$ is a straight line, so the two angles at $T$ add to 180 degrees.'
        write: '$\angle PTR = 180^{\circ} - \angle PTQ$'
        point:
          - {figure: 0, kind: arc, target: PTR}
      - say: 'Here''s the helpful fact: an angle and its supplement have the same sine. For example, sine 30 and sine 150 are both a half.'
        write: '$\sin(180^{\circ} - \theta) = \sin\theta$'
      - say: 'So the sine of angle $PTR$ is the same 15 over 16 we found for angle $PTQ$. Notice we never needed the 10 on $PR$.'
        write: '$\sin \angle PTR = \sin \angle PTQ = \dfrac{15}{16}$'
        point:
