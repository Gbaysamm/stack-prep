          - {line: 11, kind: move, from: {line: 8, at: '= 1615'}, at: '1615', text: 'found here'}
          - {figure: 0, kind: strike, target: '10', text: 'not needed'}
      - say: 'So the answer is 15 over 16, which is answer choice D.'
        write: 'Answer: $\sin \angle PTR = \dfrac{15}{16}$'
        answer: true
        point:
          - {figure: 0, kind: label, target: '?', text: 'sin = 15/16'}
    traps:
      A: 'You went for 8 over 15. That is $PT$ over $PQ$, but the sine rule also brings in $\sin 30^{\circ}$. It gives 15 times a half over 8, which is 15 over 16.'
      B: 'You went for 2 over 3. That doesn''t come from triangle $PQT$. The sine rule gives $\sin \angle PTQ$ as 15 times a half over 8, which is 15 over 16, and angle $PTR$ has the same sine.'
      C: 'You went for 3 over 4. The 10 on $PR$ isn''t needed here. The sine rule in triangle $PQT$ gives 15 over 16, and supplementary angles share the same sine.'

  36:
    moments:
      - say: 'We want the value of $x$, between 0 and 180 degrees, where $6\sin(2x - 25)^{\circ}$ is at its maximum.'
        write: '$6\sin(2x - 25)^{\circ}$'
      - say: 'Let me sketch the graph, so we can see its shape.'
        show_sketch: true
        point:
          - {figure: sketch, kind: underline, target: 'y = 6 sin(2x − 25)°'}
      - say: 'The 6 only stretches the graph up and down; it doesn''t move the peak. The maximum happens where the sine itself is biggest.'
        point:
          - {figure: sketch, kind: circle, target: '6', text: 'height 6'}
          - {figure: sketch, kind: circle, target: 'max', text: 'the peak'}
      - say: 'The largest value of sine is 1, and sine is 1 when its angle is 90 degrees.'
        write: '$\sin 90^{\circ} = 1$'
