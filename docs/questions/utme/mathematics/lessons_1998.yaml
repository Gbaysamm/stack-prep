        point:
          - {figure: sketch, kind: label, target: 'west hut', text: '150 m'}
      - say: 'One hut is east of the mast and the other is west, so they are on opposite sides. The distance between them is the sum of the two distances we just found.'
        write: 'Distance between huts $= 150 + 50\sqrt{3}$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '= 150'}, at: '150 +', text: 'west'}
          - {line: 7, kind: move, from: {line: 5, at: '= 503'}, at: '+ 503', text: 'east'}
      - say: '150 is 50 times 3, so take out 50 as a common factor.'
        write: '$= 50 \times 3 + 50\sqrt{3} = 50(3 + \sqrt{3})$'
      - say: 'Sense check: the steeper 60 degrees should give the closer hut. $50\sqrt{3}$ is about 86.6 m, which is less than 150 m. Good.'
        write: 'Check: $50\sqrt{3} \approx 86.6 < 150$'
      - say: 'So the huts are $50(3 + \sqrt{3})$ metres apart, which is answer choice B.'
