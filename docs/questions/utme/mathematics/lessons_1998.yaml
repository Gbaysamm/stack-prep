  10:
    moments:
      - say: 'When $pm^{2} + qm + 1$ is divided by $m - 1$ the remainder is 2, and when it is divided by $m + 1$ the remainder is 4. We want $p$ and $q$.'
        write: '$f(m) = pm^{2} + qm + 1$'
      - say: 'We use the remainder theorem: when $f(m)$ is divided by $m - a$, the remainder is $f(a)$. So we substitute the value that makes the divisor zero.'
      - say: '$m - 1$ is zero when $m$ is 1. So for the first remainder, we substitute $m = 1$ into $f(m)$.'
        write: 'Divisor $m - 1$: $f(1) = p(1)^{2} + q(1) + 1$'
      - say: '1 squared is 1, so this is $p$ plus $q$ plus 1.'
        write: '$= p + q + 1$'
      - say: 'That remainder is 2, so we set it equal to 2.'
        write: '$p + q + 1 = 2$'
      - say: 'Subtract 1 from both sides. 2 minus 1 is 1. Let''s call this equation 1.'
        write: '$p + q = 1 \quad (1)$'
      - say: 'Now the second divisor. $m + 1$ is zero when $m$ is negative 1. So we substitute $m = -1$.'
        write: 'Divisor $m + 1$: $f(-1) = p(-1)^{2} + q(-1) + 1$'
      - say: 'Negative 1 squared is positive 1, and $q$ times negative 1 is negative $q$.'
        write: '$= p - q + 1$'
      - say: 'That remainder is 4, so we set it equal to 4.'
        write: '$p - q + 1 = 4$'
      - say: 'Subtract 1 from both sides. 4 minus 1 is 3. This is equation 2.'
        write: '$p - q = 3 \quad (2)$'
      - say: 'Now add equations 1 and 2. The $q$ and the negative $q$ cancel, and 1 plus 3 is 4.'
        write: '(1) + (2): $2p = 1 + 3 = 4$'
        point:
          - {line: 5, kind: arrow, at: 'p + q = 1', text: '(1)'}
          - {line: 9, kind: arrow, at: 'p − q = 3', text: '(2)'}
      - say: 'Divide both sides by 2. 4 divided by 2 is 2.'
        write: '$p = \dfrac{4}{2} = 2$'
      - say: 'Put $p = 2$ back into equation 1. 2 plus $q$ is 1, so $q$ is 1 minus 2, which is negative 1.'
        write: 'Into (1): $2 + q = 1$, so $q = 1 - 2 = -1$'
        point:
          - {line: 12, kind: move, from: {line: 11, at: '4 = [[2]]'}, at: '[[2]] + q', text: 'p'}
          - {line: 5, kind: arrow, text: 'into (1)'}
      - say: 'Let''s check. $f(1)$ is 2 plus negative 1 plus 1, which is 2. $f(-1)$ is 2 minus negative 1 plus 1, which is 4. Both remainders work.'
        write: 'Check: $f(1) = 2 - 1 + 1 = 2$, $f(-1) = 2 + 1 + 1 = 4$'
      - say: 'So $p$ is 2 and $q$ is negative 1, which is answer choice A.'
        write: '$p = 2, \ q = -1$'
        answer: true
    traps:
      B: 'You went for negative 1, 2. Those are the right numbers in the wrong order. The question asks for $p$ and $q$ respectively, and $p$ is 2.'
      C: 'You went for 3, negative 2. Those fit $p + q = 1$, but not the second remainder: $f(-1)$ would be 3 plus 2 plus 1, which is 6, not 4. For $m + 1$ we substitute negative 1 and get $p - q = 3$.'
      D: 'You went for negative 2, 3. That fits the first remainder, but $f(-1)$ would be negative 2 minus 3 plus 1, which is negative 4, not 4. Solve both equations together: $p = 2$, $q = -1$.'

  11:
    moments:
      - say: 'We want to factorise $r^{2} - r(2p + q) + 2pq$.'
        write: '$r^{2} - r(2p + q) + 2pq$'
      - say: 'The first thing we need to do is expand the bracket, so that we have four separate terms to work with.'
      - say: '$r$ times $2p$ is $2pr$, and $r$ times $q$ is $qr$. The minus sign in front goes onto both.'
        write: '$= r^{2} - 2pr - qr + 2pq$'
      - say: 'Now group the four terms into two pairs that share a factor. Take the first with the third, and the second with the fourth.'
        write: '$= (r^{2} - qr) + (-2pr + 2pq)$'
      - say: 'From the first pair, take out $r$. $r^{2}$ divided by $r$ is $r$, and $qr$ divided by $r$ is $q$.'
        write: '$r^{2} - qr = r(r - q)$'
      - say: 'From the second pair, take out negative $2p$. Negative $2pr$ divided by negative $2p$ is $r$, and $2pq$ divided by negative $2p$ is negative $q$.'
        write: '$-2pr + 2pq = -2p(r - q)$'
      - say: 'Now put the two pairs we just factorised back together. Both have the same bracket, $r - q$, which tells us the grouping worked.'
        write: 'So the expression $= r(r - q) - 2p(r - q)$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '= r(r − q)'}, at: '= r(r − q)', text: 'first pair'}
          - {line: 6, kind: move, from: {line: 5, at: '−2p(r − q)'}, at: '−2p(r − q)', text: 'second pair'}
      - say: 'Take out the common bracket $r - q$. What''s left from the two pairs is $r$ minus $2p$.'
        write: '$= (r - q)(r - 2p)$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '2p[[(r−q)]]'}, at: '(r−q)', text: 'common bracket'}
      - say: 'Let''s check by expanding. $r$ times $r$ is $r^{2}$, $r$ times negative $2p$ is negative $2pr$, negative $q$ times $r$ is negative $qr$, and negative $q$ times negative $2p$ is $2pq$.'
        write: 'Check: $(r - q)(r - 2p) = r^{2} - 2pr - qr + 2pq \ \checkmark$'
      - say: 'That is exactly the expanded expression we started from. So the factors are $r - q$ and $r - 2p$, which is answer choice C.'
        write: '$r^{2} - r(2p + q) + 2pq = (r - q)(r - 2p)$'
        answer: true
    traps:
      A: 'You went for $(r - 2q)(2r - p)$. Expanding it gives $2r^{2}$ at the front, but our expression starts with just $r^{2}$. Expanding a choice back is a quick way to test it.'
      B: 'You went for $(r - q)(r + p)$. Expanding gives a last term of negative $pq$, but we need positive $2pq$. The second bracket must be $r - 2p$.'
      D: 'You went for $(2r - q)(r + p)$. That expands to start with $2r^{2}$, and our expression starts with $r^{2}$. The correct factors are $(r - q)(r - 2p)$.'

  12:
    moments:
      - say: 'We want to solve $\sqrt{x} - \sqrt{x - 2} - 1 = 0$.'
        write: '$\sqrt{x} - \sqrt{x - 2} - 1 = 0$'
      - say: 'Two square roots can''t be squared away in one go. The plan is to get one root alone on one side first, and then square.'
        write: 'Plan: one root on each side, then square'
      - say: 'Add $\sqrt{x - 2}$ and 1 to both sides.'
        write: '$\sqrt{x} = 1 + \sqrt{x - 2}$'
        point:
          - {line: 2, kind: move, from: {line: 0, at: 'x[[−x−2]]'}, at: '+ x−2', text: 'across'}
          - {line: 2, kind: move, from: {line: 0, at: '[[−1]] = 0'}, at: '= [[1]] +', text: 'across'}
      - say: 'Now square both sides. The left becomes $x$. The right is a two-term bracket, so we must square the whole bracket.'
        write: '$x = \left(1 + \sqrt{x - 2}\right)^{2}$'
      - say: 'A bracket squared is the first squared, plus twice the first times the second, plus the second squared.'
        write: '$\left(1 + \sqrt{x - 2}\right)^{2} = 1^{2} + 2 \times 1 \times \sqrt{x - 2} + \left(\sqrt{x - 2}\right)^{2}$'
      - say: '1 squared is 1. Twice 1 times $\sqrt{x - 2}$ is $2\sqrt{x - 2}$. And $\sqrt{x - 2}$ squared is just $x - 2$. Put that back into our equation.'
        write: 'So $x = 1 + 2\sqrt{x - 2} + x - 2$'
      - say: 'On the right, 1 minus 2 is negative 1.'
        write: '$x = x - 1 + 2\sqrt{x - 2}$'
      - say: 'Subtract $x$ from both sides. The $x$ cancels, and that is what makes this solvable.'
        write: '$0 = -1 + 2\sqrt{x - 2}$'
        point:
          - {line: 6, kind: strike, at: 'x = x', text: 'x cancels'}
      - say: 'Add 1 to both sides.'
        write: '$2\sqrt{x - 2} = 1$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '−1'}, at: '= 1', text: 'across the ='}
      - say: 'Divide both sides by 2.'
        write: '$\sqrt{x - 2} = \dfrac{1}{2}$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '[[2]]x'}, at: '= [[2]]1', text: 'divide it over'}
      - say: 'Square both sides again. A half squared is a quarter, 1 over 4.'
        write: '$x - 2 = \left(\dfrac{1}{2}\right)^{2} = \dfrac{1}{4}$'
      - say: 'Add 2 to both sides. 2 is 8 over 4, and 8 over 4 plus 1 over 4 is 9 over 4.'
        write: '$x = 2 + \dfrac{1}{4} = \dfrac{8}{4} + \dfrac{1}{4} = \dfrac{9}{4}$'
        point:
          - {line: 11, kind: move, from: {line: 10, at: 'x[[−2]] ='}, at: '= [[2]] +', text: 'across the ='}
      - say: 'Squaring can bring in false answers, so let''s check in the original equation. The square root of 9 over 4 is 3 over 2, which is 1.5.'
        write: 'Check: $\sqrt{\tfrac{9}{4}} = \tfrac{3}{2} = 1.5$'
      - say: 'And 9 over 4 minus 2 is 1 over 4, whose square root is a half, 0.5.'
        write: '$\sqrt{\tfrac{9}{4} - 2} = \sqrt{\tfrac{1}{4}} = 0.5$'
      - say: 'So the left side is 1.5 minus 0.5 minus 1, which is 0. It works.'
        write: '$1.5 - 0.5 - 1 = 0 \ \checkmark$'
      - say: 'So $x$ is 9 over 4, which is answer choice D.'
        write: '$x = \dfrac{9}{4}$'
        answer: true
    traps:
      A: 'You went for 3 over 2. That is $\sqrt{x}$, not $x$. Since $\sqrt{x}$ is 1.5, $x$ is 1.5 squared, which is 2.25, or 9 over 4.'
      B: 'You went for 2 over 3. That is less than 2, so $x - 2$ would be negative and $\sqrt{x - 2}$ would not exist. The answer must be bigger than 2: it is 9 over 4.'
      C: 'You went for 4 over 9. That is the answer upside down, and it is less than 2, so $\sqrt{x - 2}$ would not exist. From $x - 2 = \tfrac{1}{4}$, $x$ is 9 over 4.'

  13:
    moments:
