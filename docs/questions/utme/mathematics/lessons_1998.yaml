  34:
    moments:
      - say: 'We want to solve this equation for $x$ from 0 up to, but not including, $2\pi$.'
        write: '$\cos x + \sin x = \dfrac{1}{\cos x - \sin x}$'
      - say: 'There''s a fraction on the right, so multiply both sides by $\cos x - \sin x$.'
        write: '$(\cos x + \sin x)(\cos x - \sin x) = 1$'
        point:
          - {line: 1, kind: move, from: {line: 0, at: 'cosx − sinx'}, at: '(cosx − sinx)', text: 'times both sides'}
      - say: 'The left side is a difference of two squares: $\cos x$ squared minus $\sin x$ squared.'
        write: '$\cos^{2}x - \sin^{2}x = 1$'
      - say: 'And $\cos^{2}x - \sin^{2}x$ is exactly the double-angle formula for $\cos 2x$.'
        write: '$\cos 2x = 1$'
        point:
          - {line: 2, kind: box, at: 'cos2x − sin2x', text: 'double angle'}
      - say: 'Cosine equals 1 when its angle is 0, $2\pi$, $4\pi$, and so on.'
        write: '$2x = 0, \ 2\pi, \ 4\pi, \ \ldots$'
      - say: 'Divide each by 2.'
        write: '$x = 0, \ \pi, \ 2\pi, \ \ldots$'
      - say: 'The range is $0 \le x < 2\pi$. The sign at $2\pi$ is strictly less than, so $2\pi$ itself is not allowed. That leaves 0 and $\pi$.'
        write: '$0 \le x < 2\pi \ \Rightarrow \ x = 0, \ \pi$'
        point:
          - {line: 5, kind: strike, at: '2π', text: 'not allowed'}
      - say: 'Check $x = 0$. $\cos 0$ is 1 and $\sin 0$ is 0. The left side is 1, and the right side is 1 over 1, which is 1.'
        write: '$x = 0\text{: } \ 1 + 0 = \dfrac{1}{1 - 0} = 1 \ \checkmark$'
      - say: 'Check $x = \pi$. $\cos\pi$ is negative 1 and $\sin\pi$ is 0. The left side is negative 1, and the right side is 1 over negative 1, which is negative 1.'
        write: '$x = \pi\text{: } \ -1 + 0 = \dfrac{1}{-1 - 0} = -1 \ \checkmark$'
      - say: 'So $x$ is 0 or $\pi$, which is answer choice D.'
        write: '$x = 0, \ \pi$'
        answer: true
    traps:
      A: 'You went for $\tfrac{\pi}{2}$ and $\tfrac{3\pi}{2}$. There $\cos 2x$ is $\cos\pi$ or $\cos 3\pi$, which is negative 1, not 1. The equation reduces to $\cos 2x = 1$, which gives 0 and $\pi$.'
      B: 'You went for $\tfrac{\pi}{3}$ and $\tfrac{2\pi}{3}$. At $\tfrac{\pi}{3}$, $\cos 2x$ is $\cos\tfrac{2\pi}{3}$, which is negative a half, not 1. We need $\cos 2x = 1$, so $x$ is 0 or $\pi$.'
      C: 'You went for 0 and $\tfrac{\pi}{3}$. The 0 is right, but at $\tfrac{\pi}{3}$, $\cos 2x$ is negative a half, not 1. Because the angle is doubled, search two full turns of $2x$: that brings in $x = \pi$.'

