  29:
    moments:
      - say: 'A chord of a circle of radius $\sqrt{3}$ cm makes an angle of 60 degrees at the circumference. We want the length of the chord.'
        write: '$r = \sqrt{3}, \quad \text{angle at circumference} = 60^{\circ}$'
        show_sketch: true
        point:
          - {figure: sketch, kind: underline, target: 'radius √3 cm'}
          - {figure: sketch, kind: arc, target: ACB, text: '60°'}
      - say: 'The chord''s length depends on the angle at the centre. The angle at the centre is twice the angle at the circumference on the same chord.'
        write: '$\text{angle at centre} = 2 \times 60^{\circ} = 120^{\circ}$'
        point:
          - {line: 1, kind: move, from: {line: 0, at: '60'}, at: '× 60', text: 'double it'}
          - {figure: sketch, kind: arc, target: AOB, text: '120°'}
      - say: 'Join the centre to both ends of the chord. That makes a triangle with two sides of $\sqrt{3}$, the radii, and the 120 degrees we just found between them.'
        write: 'Triangle: two radii of $\sqrt{3}$, angle $120^{\circ}$ between them'
        point:
          - {figure: sketch, kind: highlight, target: OA}
          - {figure: sketch, kind: highlight, target: OB}
      - say: 'Two sides and the angle between them: that is the cosine rule. The side opposite the 120 degrees is the chord. Call it $c$.'
        write: 'Cosine rule: $c^{2} = a^{2} + b^{2} - 2ab\cos C$'
      - say: 'Put in $\sqrt{3}$ for both $a$ and $b$, and 120 degrees for the angle.'
        write: '$c^{2} = (\sqrt{3})^{2} + (\sqrt{3})^{2} - 2(\sqrt{3})(\sqrt{3})\cos 120^{\circ}$'
        point:
          - {line: 3, kind: box, text: 'the rule'}
          - {line: 4, kind: move, from: {line: 1, at: '120'}, at: '120', text: 'angle at centre'}
      - say: '$\sqrt{3}$ squared is 3. And 2 times $\sqrt{3}$ times $\sqrt{3}$ is 2 times 3, which is 6.'
        write: '$c^{2} = 3 + 3 - 6\cos 120^{\circ}$'
      - say: '3 plus 3 is 6, and cos 120 degrees is negative a half.'
        write: '$c^{2} = 6 - 6\left(-\tfrac{1}{2}\right)$'
      - say: '6 times negative a half is negative 3, and minus negative 3 is plus 3.'
        write: '$c^{2} = 6 + 3 = 9$'
      - say: 'Take the square root. The square root of 9 is 3.'
        write: '$c = 3$'
      - say: 'A quick check: a chord equals $2r$ times the sine of the angle at the circumference. 2 times $\sqrt{3}$ times $\sqrt{3}$ over 2 is 3.'
        write: '$2\sqrt{3} \times \sin 60^{\circ} = 2\sqrt{3} \times \dfrac{\sqrt{3}}{2} = 3 \ \checkmark$'
      - say: 'So the chord is 3 cm long, which is answer choice D.'
        write: 'Chord $= 3$ cm'
        answer: true
        point:
          - {figure: sketch, kind: label, target: '?', text: '3 cm'}
    traps:
      A: 'You went for $\tfrac{\sqrt{3}}{2}$ cm. That is $\sin 60^{\circ}$, not a length. The chord is $2r\sin 60^{\circ}$, which is $2\sqrt{3}$ times $\tfrac{\sqrt{3}}{2}$, or 3 cm.'
      B: 'You went for 3 over 2 cm. That is half the answer, as if the 2 in $2r\sin 60^{\circ}$ were left out. With the cosine rule, the chord squared is 9, so the chord is 3 cm.'
      C: 'You went for $\sqrt{3}$ cm, the radius itself. That would be right if the angle at the centre were 60 degrees, making an equilateral triangle. But the 60 is at the circumference, so the centre angle is 120 and the chord is 3 cm.'

  30:
    moments:
