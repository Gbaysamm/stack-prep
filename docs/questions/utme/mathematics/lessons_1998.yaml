      - say: 'At $Q$, the 120 degrees is measured from $QP$, which points left. Angles on a straight line add to 180, so $QR$ makes 180 minus 120, which is 60 degrees, with the rightward direction.'
        write: 'At $Q$: $180^{\circ} - 120^{\circ} = 60^{\circ}$'
      - say: 'By alternate angles across the parallel lines, $RQ$ makes the same 60 degrees with the new line at $R$, on the left side.'
        write: 'At $R$, left part $= 60^{\circ}$ (alternate angles)'
      - say: 'At $S$, the 130 degrees is measured from $ST$, which points right. So $SR$ makes 180 minus 130, which is 50 degrees, with the leftward direction.'
        write: 'At $S$: $180^{\circ} - 130^{\circ} = 50^{\circ}$'
      - say: 'Again by alternate angles, $RS$ makes 50 degrees with the new line at $R$, on the right side.'
        write: 'At $R$, right part $= 50^{\circ}$ (alternate angles)'
