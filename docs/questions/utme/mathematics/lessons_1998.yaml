      B: 'You went for $32\tfrac{1}{2}$. That comes from $2x = 65$, as if 25 were taken away from 90 instead of added. From $2x - 25 = 90$, $2x$ is 115 and $x$ is $57\tfrac{1}{2}$.'
      D: 'You went for $147\tfrac{1}{2}$. There the angle $2x - 25$ is 270 degrees, where sine is negative 1: that is the minimum, not the maximum.'

  37:
    moments:
      - say: 'From the top of a 150 m mast, one hut is seen due east at an angle of depression of 60 degrees, and another due west at 45 degrees. We want the distance between the huts.'
        write: '$\text{height} = 150 \text{ m}, \quad \text{east: } 60^{\circ}, \quad \text{west: } 45^{\circ}$'
      - say: 'Let me draw the mast and the angle of depression.'
        show_sketch: true
        point:
          - {figure: sketch, kind: highlight, target: TF, text: '150 m'}
          - {figure: sketch, kind: circle, target: '45°'}
      - say: 'Now let me draw the east hut as well, on the other side of the mast, seen at 60 degrees.'
        show_sketch: sketch_b
        point:
          - {figure: sketch_b, kind: circle, target: '60°', text: 'east hut'}
          - {figure: sketch_b, kind: circle, target: '?', text: 'WE'}
      - say: 'Each hut makes a right-angled triangle with the mast. The angle of depression from the top equals the angle of elevation from the hut, because the horizontal at the top is parallel to the ground.'
        point:
          - {figure: sketch_b, kind: circle, target: 'F', text: 'right angle'}
          - {figure: sketch_b, kind: arc, target: 'TWF', text: '45°'}
          - {figure: sketch_b, kind: arc, target: 'TEF', text: '60°'}
      - say: 'TOA: the tangent of an angle is the opposite side over the adjacent side.'
        write: 'TOA: $\tan\theta = \dfrac{\text{opposite}}{\text{adjacent}}$'
      - say: 'In each triangle, the 150 m mast is opposite the angle at the hut, and the ground distance is adjacent. Tan is opposite over adjacent.'
        write: '$\tan\theta = \dfrac{150}{\text{distance}}$'
        point:
          - {figure: sketch_b, kind: underline, target: 'WF', text: 'adjacent'}
          - {figure: sketch_b, kind: underline, target: 'FE', text: 'adjacent'}
      - say: 'Rearrange: multiply both sides by the distance, then divide by $\tan\theta$.'
        write: '$\text{distance} = \dfrac{150}{\tan\theta}$'
      - say: 'East hut, 60 degrees. $\tan 60^{\circ}$ is $\sqrt{3}$.'
        write: '$\text{east} = \dfrac{150}{\tan 60^{\circ}} = \dfrac{150}{\sqrt{3}}$'
      - say: 'Rationalise: multiply the top and bottom by $\sqrt{3}$. That gives $150\sqrt{3}$ over 3, and 150 over 3 is 50.'
        write: '$= \dfrac{150\sqrt{3}}{3} = 50\sqrt{3}$'
        point:
          - {figure: sketch_b, kind: label, target: 'east hut', text: '50√3 m'}
      - say: 'West hut, 45 degrees. $\tan 45^{\circ}$ is 1, so the distance is 150 over 1, which is 150.'
        write: '$\text{west} = \dfrac{150}{\tan 45^{\circ}} = \dfrac{150}{1} = 150$'
        point:
          - {figure: sketch_b, kind: label, target: 'west hut', text: '150 m'}
      - say: 'One hut is east of the mast and the other is west, so they are on opposite sides. The distance between them is the sum of the two distances we just found.'
        write: 'Distance between huts $= 150 + 50\sqrt{3}$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '= 150'}, at: '150 +', text: 'west'}
          - {line: 10, kind: move, from: {line: 8, at: '= 503'}, at: '+ 503', text: 'east'}
      - say: '150 is 50 times 3, so take out 50 as a common factor.'
        write: '$= 50 \times 3 + 50\sqrt{3} = 50(3 + \sqrt{3})$'
      - say: 'Sense check: the steeper 60 degrees should give the closer hut. $50\sqrt{3}$ is about 86.6 m, which is less than 150 m. Good.'
        write: 'Check: $50\sqrt{3} \approx 86.6 < 150$'
      - say: 'So the huts are $50(3 + \sqrt{3})$ metres apart, which is answer choice B.'
        write: 'Distance $= 50(3 + \sqrt{3})$ m'
        answer: true
        point:
          - {figure: sketch_b, kind: label, target: '?', text: '50(3 + √3) m'}
    traps:
      A: 'You went for $150(1 + \sqrt{3})$. That uses 150 times $\tan 60^{\circ}$ for the east hut instead of 150 divided by $\tan 60^{\circ}$. A steeper angle means a closer hut, so that distance must be less than 150: it is $50\sqrt{3}$.'
      C: 'You went for $150\sqrt{3}$. That is only one hut''s distance, and worked out by multiplying by tan rather than dividing. Add both distances: 150 plus $50\sqrt{3}$, which is $50(3 + \sqrt{3})$.'
      D: 'You went for $\tfrac{50}{\sqrt{3}}$. That is far too small: the west hut alone is 150 m from the mast. Add the two distances, 150 and $50\sqrt{3}$, to get $50(3 + \sqrt{3})$.'

  38:
    moments:
      - say: 'We want $\dfrac{dy}{dx}$ when $x = 1$, for $y = 243(4x + 5)^{-2}$.'
        write: '$y = 243(4x + 5)^{-2}$'
      - say: 'A bracket raised to a power needs the chain rule: bring the power down, reduce the power by 1, and multiply by the derivative of the inside.'
        write: 'Chain rule: power down, power minus 1, times derivative of inside'
      - say: 'The power is negative 2. Reducing it by 1 gives negative 3. The inside, $4x + 5$, differentiates to 4.'
        write: '$\dfrac{dy}{dx} = 243 \times (-2)(4x + 5)^{-3} \times 4$'
        point:
          - {line: 1, kind: box, text: 'the rule'}
          - {line: 2, kind: move, from: {line: 0, at: '(4x+5)[[−2]]'}, at: '243 × [[(−2)]]', text: 'power down'}
      - say: 'Multiply the numbers. 243 times negative 2 is negative 486, and negative 486 times 4 is negative 1944.'
        write: '$= -486 \times 4 \times (4x + 5)^{-3} = -1944(4x + 5)^{-3}$'
      - say: 'A negative power means 1 over, so write it as a fraction.'
        write: '$= \dfrac{-1944}{(4x + 5)^{3}}$'
      - say: 'Now put $x = 1$ into the bracket. Picture the curve as a hillside, with a walker standing at $x = 1$: the derivative is how steep the ground is under their feet. 4 times 1 plus 5 is 9.'
        write: 'At $x = 1$: $4(1) + 5 = 9$, so $\dfrac{dy}{dx} = \dfrac{-1944}{9^{3}}$'
        doodle: {name: 'custom:1998_q38_a', id: hill, caption: 'how steep is the hill at x = 1?'}
      - say: '9 cubed is 9 times 9 times 9. 9 times 9 is 81, and 81 times 9 is 729.'
        write: '$9^{3} = 9 \times 9 \times 9 = 729$, so $\dfrac{dy}{dx} = \dfrac{-1944}{729}$'
      - say: 'To simplify, notice 729 is 243 times 3, and 1944 is 243 times 8. Remember the 1944 came from 243 times 8.'
        write: '$= -\dfrac{243 \times 8}{243 \times 3}$'
        point:
          - {line: 3, kind: circle, at: '−1944', text: '243 × 8'}
      - say: 'Cancel the 243 on top and bottom, and 8 over 3 is left, with its minus sign. That is the slope under the walker.'
        write: '$= -\dfrac{8}{3}$'
        point:
          - {line: 8, kind: highlight, at: '=-38', to: {doodle: hill, part: tangent}}
        doodle_do:
          - {id: hill, op: label, part: tangent, text: 'slope −8/3'}
      - say: 'Sense check: a negative power means $y$ gets smaller as $x$ grows, so the walker is going downhill and the gradient should be negative. It is.'
        write: 'Check: $-\dfrac{8}{3} < 0$, as expected'
        doodle_do:
          - {id: hill, op: circle, part: walker, text: downhill}
      - say: 'So the gradient at $x = 1$ is negative 8 over 3, which is answer choice A.'
        write: 'At $x = 1$: $\dfrac{dy}{dx} = -\dfrac{8}{3}$'
        answer: true
    traps:
      B: 'You went for 3 over 8. That is the answer upside down and without its minus sign. The derivative is negative 1944 over 729, which simplifies to negative 8 over 3.'
      C: 'You went for 9 over 8. A negative power makes $y$ fall as $x$ grows, so the gradient here must be negative. Working it through gives negative 1944 over 729, which is negative 8 over 3.'
      D: 'You went for negative 8 over 9. The sign is right, but check the cube: 9 cubed is 729, and 1944 over 729 simplifies to 8 over 3, not 8 over 9.'

  39:
    moments:
      - say: 'We want to differentiate $x$ over $\cos x$ with respect to $x$.'
        write: '$\dfrac{x}{\cos x}$'
      - say: 'One over $\cos x$ is $\sec x$, so this is simply $x$ times $\sec x$. Picture a rectangle $x$ wide and $\sec x$ tall: its area is the product.'
        write: '$\dfrac{x}{\cos x} = x\sec x$'
        doodle: {name: 'custom:1998_q39_a', id: rect, caption: 'x times sec x as a rectangle'}
      - say: 'For a product we use the product rule, $u''v + uv''$. When the rectangle grows, the new area comes in two strips: one down the side, $u''v$, and one along the top, $uv''$.'
        write: '$\dfrac{d}{dx}(uv) = u''v + uv''$'
        doodle_do:
          - {id: rect, op: stage, stage: 'custom:1998_q39_a2'}
      - say: 'Let $u$ be $x$ and $v$ be $\sec x$.'
        write: '$u = x, \quad v = \sec x$'
      - say: 'The derivative of $x$ is 1.'
        write: '$u'' = 1$'
      - say: 'The derivative of $\sec x$ is $\sec x \tan x$. Where does that come from? $\sec x$ is $\cos x$ to the power negative 1, and the chain rule gives $\sin x$ over $\cos^{2}x$.'
        write: '$\dfrac{d}{dx}(\cos x)^{-1} = \dfrac{\sin x}{\cos^{2}x} = \sec x\tan x$'
      - say: 'So $v''$ is $\sec x \tan x$.'
        write: '$v'' = \sec x\tan x$'
      - say: 'Now put them in: the side strip is 1 times $\sec x$, and the top strip is $x$ times $\sec x \tan x$.'
        write: '$\dfrac{dy}{dx} = 1 \times \sec x + x \times \sec x\tan x$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
          - {line: 7, kind: move, from: {line: 4, at: '= 1'}, at: '[[1]] ×', text: 'u′'}
          - {line: 7, kind: move, from: {line: 6, at: '= secxtanx'}, at: '× secxtanx', text: 'v′'}
        doodle_do:
          - {id: rect, op: label, part: side, text: '1 × sec x'}
          - {id: rect, op: label, part: top, text: 'x sec x tan x'}
      - say: 'Tidy up.'
        write: '$= \sec x + x\sec x\tan x$'
      - say: 'So the derivative is $\sec x + x\sec x\tan x$, which is answer choice D.'
        write: '$\dfrac{d}{dx}\left(\dfrac{x}{\cos x}\right) = \sec x + x\sec x\tan x$'
        answer: true
    traps:
      A: 'You went for $1 + x\sec x\tan x$. The first term of the product rule is $u''$ times $v$, which is 1 times $\sec x$, not just 1.'
      B: 'You went for $1 + \sec^{2}x$. That looks like the derivative of $x + \tan x$. Rewrite the expression as $x\sec x$ and use the product rule: $\sec x + x\sec x\tan x$.'
      C: 'You went for $\cos x + x\tan x$. The derivative of $\sec x$ is $\sec x\tan x$, not $\tan x$, and the first term is $\sec x$, not $\cos x$.'

  40:
    moments:
      - say: 'We want to evaluate the integral from 0 to $\tfrac{\pi}{2}$ of $\sec^{2}x - \tan^{2}x$.'
        write: '$\displaystyle\int_{0}^{\pi/2}(\sec^{2}x - \tan^{2}x)\,dx$'
      - say: 'Before integrating anything, let''s see whether the expression inside simplifies. There is an identity linking sec and tan, and it comes from $\sin^{2}x + \cos^{2}x = 1$.'
        write: 'Start from $\sin^{2}x + \cos^{2}x = 1$'
      - say: 'Divide every term by $\cos^{2}x$.'
        write: '$\dfrac{\sin^{2}x}{\cos^{2}x} + \dfrac{\cos^{2}x}{\cos^{2}x} = \dfrac{1}{\cos^{2}x}$'
      - say: '$\sin^{2}x$ over $\cos^{2}x$ is $\tan^{2}x$, $\cos^{2}x$ over itself is 1, and 1 over $\cos^{2}x$ is $\sec^{2}x$.'
        write: '$\tan^{2}x + 1 = \sec^{2}x$'
      - say: 'Subtract $\tan^{2}x$ from both sides.'
        write: '$\sec^{2}x - \tan^{2}x = 1$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: 'tan2x +'}, at: '− tan2x', text: 'across the ='}
      - say: 'Look back at the integral: that is exactly what is inside it. So the whole expression we are integrating is just the number 1. Picture its graph: a flat line at height 1.'
        write: 'So the integral $= \displaystyle\int_{0}^{\pi/2} 1\,dx$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '= 1'}, at: '[[1]]dx', text: 'identity'}
        doodle: {name: 'custom:1998_q40_a', id: strip, caption: 'the area under y = 1'}
        doodle_do:
          - {id: strip, op: highlight, part: line}
      - say: 'The integral of 1 is $x$, because differentiating $x$ gives 1.'
        write: '$= \left[x\right]_{0}^{\pi/2}$'
      - say: 'Now put in the limits: the top limit, $\tfrac{\pi}{2}$, minus the bottom limit, 0. Watch the strip under the line fill up from 0 to $\tfrac{\pi}{2}$.'
        write: '$= \dfrac{\pi}{2} - 0$'
        doodle_do:
          - {id: strip, op: fill, to: 1.0, fill: paint}
      - say: 'Taking away 0 changes nothing. The strip is 1 high and $\tfrac{\pi}{2}$ wide, so its area is $\tfrac{\pi}{2}$.'
        write: '$= \dfrac{\pi}{2}$'
        doodle_do:
          - {id: strip, op: label, part: strip, text: '1 × π/2 = π/2'}
      - say: 'So the integral is $\tfrac{\pi}{2}$, which is answer choice A.'
        write: 'Answer: $\dfrac{\pi}{2}$'
        answer: true
    traps:
      B: 'You went for $\pi - 2$. The integrand is exactly 1, because $\sec^{2}x - \tan^{2}x = 1$. Integrating 1 from 0 to $\tfrac{\pi}{2}$ gives just $\tfrac{\pi}{2}$.'
      C: 'You went for $\tfrac{\pi}{3}$. The integrand is 1, so the answer is simply the length of the interval from 0 to $\tfrac{\pi}{2}$, which is $\tfrac{\pi}{2}$.'
      D: 'You went for $\pi + 2$. There is nothing to add: the integrand simplifies to 1, and integrating 1 from 0 to $\tfrac{\pi}{2}$ gives $\tfrac{\pi}{2}$.'

  41:
    moments:
      - say: 'We want the equation of the curve that passes through the point 2, 5 and whose gradient at any point is $6x - 5$.'
        write: '$\dfrac{dy}{dx} = 6x - 5$'
      - say: 'The gradient is the derivative. To get back from the derivative to $y$, we integrate.'
        write: '$y = \displaystyle\int (6x - 5)\,dx$'
      - say: 'The rule for integrating a power of $x$: add one to the power, then divide by the new power.'
        write: '$\displaystyle\int x^{n}\,dx = \dfrac{x^{n + 1}}{n + 1} + c$'
      - say: 'For $6x$: add 1 to the power to get $x^{2}$, then divide by the new power, 2. 6 over 2 is 3.'
        write: '$\displaystyle\int 6x\,dx = \dfrac{6x^{2}}{2} = 3x^{2}$'
      - say: 'Negative 5 integrates to negative $5x$.'
        write: '$\displaystyle\int -5\,dx = -5x$'
      - say: 'Don''t forget the constant of integration, $c$. Every value of $c$ gives the same curve slid up or down; picture a stack of them.'
        write: '$y = 3x^{2} - 5x + c$'
        doodle: {name: 'custom:1998_q41_a', id: curves, caption: 'one shape, slid up and down by c'}
      - say: 'The curve passes through 2, 5, the dot in the picture, so when $x$ is 2, $y$ is 5. Substitute those in.'
        write: '$5 = 3(2)^{2} - 5(2) + c$'
        point:
          - {line: 5, kind: arrow, text: 'sub in'}
        doodle_do:
          - {id: curves, op: circle, part: dot}
      - say: '2 squared is 4, and 3 times 4 is 12. 5 times 2 is 10.'
        write: '$5 = 12 - 10 + c$'
      - say: '12 minus 10 is 2.'
        write: '$5 = 2 + c$'
      - say: 'Subtract 2 from both sides. 5 minus 2 is 3.'
        write: '$c = 3$'
      - say: 'Put $c$ back into the equation. Of all the curves in the stack, this is the one through the dot.'
        write: '$y = 3x^{2} - 5x + 3$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '= 3'}, at: '+ 3', text: 'c'}
        doodle_do:
          - {id: curves, op: highlight, part: mid, text: 'c = 3'}
      - say: 'Check: differentiating $3x^{2}$ gives $6x$, and $-5x$ gives negative 5, so the gradient is right. And at $x = 2$, 12 minus 10 plus 3 is 5.'
        write: '$3(4) - 10 + 3 = 5 \ \checkmark$'
      - say: 'So the curve is $y = 3x^{2} - 5x + 3$, which is answer choice D.'
        write: '$y = 3x^{2} - 5x + 3$'
        answer: true
    traps:
      A: 'You went for $y = 6x^{2} - 5x + 5$. Differentiating $6x^{2}$ gives $12x$, not $6x$. Integrating $6x$ gives $3x^{2}$.'
      B: 'You went for $y = 6x^{2} + 5x + 5$. The $6x$ should integrate to $3x^{2}$, and the negative 5 to negative $5x$. Then the point 2, 5 gives $c = 3$.'
      C: 'You went for $y = 3x^{2} - 5x - 5$. The first two terms are right, but check the point: at $x = 2$ this gives 12 minus 10 minus 5, which is negative 3, not 5. The constant is 3.'

  42:
    moments:
      - say: 'We have the numbers 2, 3, 9, 7, 6, 7, 8 and 5. Picture them as eight people with those heights. $m$ is the mean, $n$ is the median, and we want $m + 2n$ to the nearest whole number.'
        write: '$2, \ 3, \ 9, \ 7, \ 6, \ 7, \ 8, \ 5$'
        doodle: {name: 'custom:1998_q42_a', id: line, caption: '8 numbers as 8 people', size: scene}
      - say: 'The mean is the total divided by how many numbers there are. Let''s add them. 2 plus 3 is 5, plus 9 is 14, plus 7 is 21.'
        write: '$2 + 3 + 9 + 7 = 21$'
      - say: '21 plus 6 is 27, plus 7 is 34, plus 8 is 42, plus 5 is 47.'
        write: '$21 + 6 + 7 + 8 + 5 = 47$'
      - say: 'The mean is the sum of the values divided by how many values there are.'
        write: 'Mean $= \dfrac{\text{sum of the values}}{\text{number of values}}$'
      - say: 'There are 8 numbers, eight people. 47 divided by 8 is 5.875.'
        write: '$m = \dfrac{47}{8} = 5.875$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: '= 47'}, at: '47', text: 'total'}
        doodle_do:
          - {id: line, op: pulse, part: people}
      - say: 'For the median, first put the numbers in order, smallest to largest: line the people up by height.'
        write: 'In order: $2, \ 3, \ 5, \ 6, \ 7, \ 7, \ 8, \ 9$'
        point:
          - {line: 5, kind: highlight, at: '2, 3, 5, 6, 7, 7, 8, 9', to: {doodle: line, part: people}}
        doodle_do:
          - {id: line, op: stage, stage: 'custom:1998_q42_a2'}
      - say: 'With an even number of values, the median is the average of the two middle values.'
        write: 'Median $=$ mean of the two middle values'
      - say: 'There are 8 people, an even count, so nobody stands exactly in the middle. The median is the average of the 4th and 5th, which are 6 and 7.'
        write: '$n = \dfrac{6 + 7}{2}$'
        doodle_do:
          - {id: line, op: stage, stage: 'custom:1998_q42_a3'}
      - say: '6 plus 7 is 13, and 13 divided by 2 is 6.5, the height halfway between the two middle people.'
        write: '$n = 6.5$'
        doodle_do:
          - {id: line, op: label, part: mid, text: '(6 + 7) ÷ 2 = 6.5'}
      - say: 'Now $m + 2n$. 2 times 6.5 is 13.'
        write: '$m + 2n = 5.875 + 2(6.5) = 5.875 + 13$'
        point:
          - {line: 9, kind: move, from: {line: 4, at: '5.875'}, at: '[[5.875]] + 2', text: 'mean'}
          - {line: 9, kind: move, from: {line: 8, at: '6.5'}, at: '(6.5)', text: 'median'}
      - say: '5.875 plus 13 is 18.875.'
        write: '$= 18.875$'
      - say: 'To the nearest whole number: the decimal part, 0.875, is more than a half, so we round up to 19.'
        write: '$18.875 \approx 19$'
      - say: 'So $m + 2n$ is 19, which is answer choice A.'
        write: '$m + 2n = 19$'
        answer: true
    traps:
      B: 'You went for 18. That cuts off the decimal instead of rounding: 18.875 is closer to 19. It is also what you get if you take the median as 6 instead of averaging 6 and 7.'
      C: 'You went for 13. That is only $2n$, twice the median. We still need to add the mean, 5.875, to get 18.875, which rounds to 19.'
      D: 'You went for 12. That is about $m + n$: 5.875 plus 6.5 is 12.375. The question asks for $m$ plus twice $n$, which is 18.875, or 19.'

  43:
    moments:
      - say: 'We want to estimate the mode from this grouped table of hourly earnings. Picture the workers piled up by class: 17, 32, 25 and 24.'
        write: '$\text{frequencies: } 17, \ 32, \ 25, \ 24$'
        doodle: {name: 'custom:1998_q43_a', id: piles, caption: 'workers piled up by earnings', size: scene}
      - say: 'First, the modal class is the class with the highest frequency, the tallest pile. That is 10 to 14, with 32 workers.'
        write: 'Modal class: $10$ to $14$, with $f = 32$'
        point:
          - {line: 1, kind: highlight, at: 'f = 32', to: {doodle: piles, part: p2}}
        doodle_do:
          - {id: piles, op: circle, part: p2, text: 'modal class'}
      - say: 'The formula uses $L$, the lower class boundary, $f_{1}$, the modal frequency, $f_{0}$ and $f_{2}$, the frequencies either side, and $c$, the class width.'
        write: '$\text{mode} = L + \left(\dfrac{f_{1} - f_{0}}{(f_{1} - f_{0}) + (f_{1} - f_{2})}\right) \times c$'
      - say: 'Careful: $L$ is the boundary, not the limit. The classes jump from 9 to 10, so the boundary is halfway between, at 9.5.'
        write: '$L = \dfrac{9 + 10}{2} = 9.5$'
      - say: 'The class runs from 9.5 to 14.5, so its width is 5.'
        write: '$c = 14.5 - 9.5 = 5$'
      - say: 'The modal frequency is 32, the pile before it has 17, and the pile after it has 25.'
        write: '$f_{1} = 32, \ f_{0} = 17, \ f_{2} = 25$'
        doodle_do:
          - {id: piles, op: label, part: p1, text: 'f₀ = 17'}
          - {id: piles, op: label, part: p2, text: 'f₁ = 32'}
          - {id: piles, op: label, part: p3, text: 'f₂ = 25'}
      - say: '32 minus 17 is 15.'
        write: '$f_{1} - f_{0} = 32 - 17 = 15$'
      - say: '32 minus 25 is 7.'
        write: '$f_{1} - f_{2} = 32 - 25 = 7$'
      - say: 'Now substitute everything into the formula.'
        write: '$\text{mode} = 9.5 + \dfrac{15}{15 + 7} \times 5$'
        point:
          - {line: 8, kind: move, from: {line: 3, at: '9.5'}, at: '9.5', text: 'L'}
          - {line: 8, kind: move, from: {line: 6, at: '= 15'}, at: '7[[15]]', text: 'f1 − f0'}
          - {line: 8, kind: move, from: {line: 7, at: '= 7'}, at: '15 + [[7]]', text: 'f1 − f2'}
      - say: '15 plus 7 is 22, and 15 times 5 is 75.'
        write: '$= 9.5 + \dfrac{75}{22}$'
      - say: '75 divided by 22 is about 3.409.'
        write: '$= 9.5 + 3.409$'
      - say: '9.5 plus 3.409 is 12.909.'
        write: '$= 12.909$'
      - say: 'To one decimal place, the mode is 12.9, which is answer choice C.'
        write: '$\text{mode} \approx 12.9$'
        answer: true
    traps:
      A: 'You went for 12.2. Check the differences: 32 minus 17 is 15 and 32 minus 25 is 7, so the fraction is 15 over 22, and 15 over 22 times 5 is about 3.41. Added to 9.5, that gives 12.9.'
      B: 'You went for 12.7. Use the boundary 9.5, and the fraction 15 over 22 times the width 5, which is about 3.41. 9.5 plus 3.41 is 12.9.'
      D: 'You went for 13.4. That uses the class limit 10 instead of the boundary 9.5. The boundary sits halfway between 9 and 10, and it gives 12.9.'

  44:
    moments:
      - say: 'We want the variance of the three numbers $K$, $K + 1$ and $K + 2$.'
        write: '$K, \ K + 1, \ K + 2$'
      - say: 'The mean is the sum of the values divided by how many values there are.'
        write: 'Mean: $\bar{x} = \dfrac{\sum x}{n}$'
      - say: 'Variance is the average of the squared distances from the mean. So first, the mean: add them and divide by 3.'
        write: '$\bar{x} = \dfrac{K + (K + 1) + (K + 2)}{3}$'
      - say: 'Three $K$s make $3K$, and 1 plus 2 is 3.'
        write: '$= \dfrac{3K + 3}{3}$'
      - say: 'Divide each term by 3. The mean is $K + 1$, the middle number. Picture the three numbers as weights on a plank, one step apart: it balances at the middle one.'
        write: '$= K + 1$'
        doodle: {name: 'custom:1998_q44_a', id: plank, caption: 'three numbers, one step apart'}
      - say: 'Now subtract the mean from each number. $K$ minus $K + 1$ is negative 1.'
        write: '$K - (K + 1) = -1$'
      - say: '$K + 1$ minus $K + 1$ is 0.'
        write: '$(K + 1) - (K + 1) = 0$'
      - say: '$K + 2$ minus $K + 1$ is 1.'
        write: '$(K + 2) - (K + 1) = 1$'
      - say: 'The $K$ has cancelled every time. That makes sense: sliding the whole plank up or down doesn''t change how spread out the weights are.'
        doodle_do:
          - {id: plank, op: pulse, part: plank}
      - say: 'Square the deviations: each gap of 1 becomes a square of area 1, and the middle gives 0. The total is 2.'
        write: '$(-1)^{2} + 0^{2} + 1^{2} = 1 + 0 + 1 = 2$'
        point:
          - {line: 9, kind: highlight, at: '= 1 + 0 + 1 = 2', to: {doodle: plank, part: tiles}}
        doodle_do:
          - {id: plank, op: stage, stage: 'custom:1998_q44_a2'}
      - say: 'The variance is the mean of the squared deviations: square each value''s distance from the mean, add them up, and divide by how many values there are.'
        write: 'Variance $= \dfrac{\sum (x - \bar{x})^{2}}{n}$'
      - say: 'Divide by the number of values, 3: the two tiles shared among three numbers.'
        write: '$\text{variance} = \dfrac{2}{3}$'
        point:
          - {line: 11, kind: move, from: {line: 9, at: '= 2'}, at: '3[[2]]', text: 'sum of squares'}
        doodle_do:
          - {id: plank, op: label, part: tiles, text: '2 ÷ 3'}
      - say: 'So the variance is 2 over 3, which is answer choice A.'
        write: 'Variance $= \dfrac{2}{3}$'
        answer: true
    traps:
      B: 'You went for 1. That is what you get by dividing the total of 2 by 2 instead of 3. There are three numbers, so the variance is two thirds.'
      C: 'You went for $K + 1$. That is the mean, not the variance. The variance measures spread, and the spread doesn''t depend on $K$ at all.'
      D: 'You went for $(K + 1)^{2}$. That is the mean squared. The variance uses the squared distances from the mean, which are 1, 0 and 1, giving two thirds.'

  45:
    moments:
      - say: 'The standard deviation of 1, $x + 1$ and $2x + 1$ is $\sqrt{6}$. We want the positive value of $x$.'
        write: '$1, \ x + 1, \ 2x + 1, \quad \text{s.d.} = \sqrt{6}$'
      - say: 'The variance is the standard deviation squared. $\sqrt{6}$ squared is 6.'
        write: '$\text{variance} = (\sqrt{6})^{2} = 6$'
      - say: 'Now the mean. Add the three numbers: 1 plus $x + 1$ plus $2x + 1$. $x$ plus $2x$ is $3x$, and 1 plus 1 plus 1 is 3.'
        write: '$1 + (x + 1) + (2x + 1) = 3x + 3$'
      - say: 'The mean is the sum of the values divided by how many values there are.'
        write: 'Mean: $\bar{x} = \dfrac{\sum x}{n}$'
      - say: 'Divide by 3. The mean is $x + 1$, the middle number. Picture the three numbers on a plank, $x$ apart: it balances at the middle one.'
        write: '$\bar{x} = \dfrac{3x + 3}{3} = x + 1$'
        doodle: {name: 'custom:1998_q45_a', id: plank, caption: 'three numbers, x apart'}
      - say: 'Now the deviations from the mean. 1 minus $x + 1$ is negative $x$.'
        write: '$1 - (x + 1) = -x$'
      - say: '$x + 1$ minus $x + 1$ is 0.'
        write: '$(x + 1) - (x + 1) = 0$'
      - say: '$2x + 1$ minus $x + 1$ is $x$.'
        write: '$(2x + 1) - (x + 1) = x$'
      - say: 'Square them: each gap of $x$ becomes a square of area $x^{2}$, and the middle gives 0. The total is $2x^{2}$.'
        write: '$x^{2} + 0 + x^{2} = 2x^{2}$'
        point:
          - {line: 8, kind: highlight, at: '= 2x2', to: {doodle: plank, part: tiles}}
        doodle_do:
          - {id: plank, op: stage, stage: 'custom:1998_q45_a2'}
      - say: 'The variance is the mean of the squared deviations: square each value''s distance from the mean, add them up, and divide by how many values there are.'
        write: 'Variance $= \dfrac{\sum (x - \bar{x})^{2}}{n}$'
      - say: 'The variance is that total over 3, and it must equal 6.'
        write: '$\dfrac{2x^{2}}{3} = 6$'
        point:
          - {line: 10, kind: move, from: {line: 8, at: '= 2x2'}, at: '2x2', text: 'sum of squares'}
          - {line: 10, kind: move, from: {line: 1, at: '= 6'}, at: '= 6', text: 'variance'}
      - say: 'Multiply both sides by 3. 6 times 3 is 18.'
        write: '$2x^{2} = 18$'
      - say: 'Divide both sides by 2. 18 divided by 2 is 9.'
        write: '$x^{2} = 9$'
      - say: 'Take the square root. $x$ is plus or minus 3, and the question wants the positive value.'
        write: '$x = \pm 3$'
      - say: 'Check: with $x = 3$ the numbers on the plank are 1, 4 and 7, and the mean is 4. The squared deviations are 3 squared, 0 and 3 squared: 9, 0 and 9. And 18 over 3 is 6.'
        write: 'Check $x = 3$: $\dfrac{(1 - 4)^{2} + 0^{2} + (7 - 4)^{2}}{3} = \dfrac{9 + 0 + 9}{3} = 6$'
        doodle_do:
          - {id: plank, op: label, part: plank, text: 'x = 3: 1, 4, 7'}
      - say: 'So $x$ is 3, which is answer choice C.'
        write: '$x = 3$'
        answer: true
    traps:
      A: 'You went for 1. Then the numbers would be 1, 2 and 3, whose variance is 2 over 3, not 6. We need $\tfrac{2x^{2}}{3} = 6$, so $x = 3$.'
      B: 'You went for 2. Then the numbers would be 1, 3 and 5, whose variance is 8 over 3, not 6. We need $x^{2} = 9$, so $x = 3$.'
      D: 'You went for 4. Then the numbers would be 1, 5 and 9, whose variance is 32 over 3, not 6. We need $x^{2} = 9$, so $x = 3$.'

  46:
    moments:
      - say: 'A bag has 16 red balls and 20 blue balls. We want how many white balls to drop in so that the probability of picking red is 2 over 5.'
        write: '16 red, 20 blue, add $w$ white'
        doodle: {name: 'custom:1998_q46_a', id: bag, caption: 'Adding white balls leaves 16 reds'}
      - say: 'Here''s the key idea: dropping white balls into the bag doesn''t change the number of reds. The reds stay at 16. Only the total changes.'
        write: 'Red balls $= 16$ throughout'
        doodle_do:
          - {id: bag, op: circle, part: reds, text: 'still 16'}
      - say: 'Here are all the balls: 16 red and 20 blue. The total becomes 16 plus 20 plus $w$. 16 plus 20 is 36.'
        write: 'Total $= 16 + 20 + w = 36 + w$'
        point:
          - {line: 2, kind: highlight, at: '36 + w', to: {doodle: balls}}
        doodle: {id: balls, caption: '16 red and 20 blue: 36 balls', repeat: [{name: ball-red, n: 16}, {name: ball-blue, n: 20}], layout: grid}
        doodle_do:
          - {id: balls, op: count}
      - say: 'The probability of red is the number of reds over the total number of balls.'
        write: '$P(\text{red}) = \dfrac{\text{reds}}{\text{total}} = \dfrac{16}{36 + w}$'
        point:
          - {line: 3, kind: move, from: {line: 1, at: '16'}, at: '16', text: 'reds stay'}
          - {line: 3, kind: move, from: {line: 2, at: '= [[36 + w]]'}, at: '36 + w', text: 'new total'}
        doodle_do:
          - {id: balls, op: group, n: 16, text: '16 red'}
      - say: 'The question says this must equal 2 over 5.'
        write: '$\dfrac{16}{36 + w} = \dfrac{2}{5}$'
      - say: 'Cross-multiply: 16 times 5 on one side, and 2 times the bracket on the other.'
        write: '$16 \times 5 = 2(36 + w)$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '= [[5]]2'}, at: '× 5', text: 'across'}
          - {line: 5, kind: move, from: {line: 4, at: '=5[[2]]'}, at: '= [[2]](', text: 'across'}
      - say: '16 times 5 is 80. On the right, 2 times 36 is 72, and 2 times $w$ is $2w$.'
        write: '$80 = 72 + 2w$'
      - say: 'Subtract 72 from both sides. 80 minus 72 is 8.'
        write: '$2w = 80 - 72 = 8$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '72 +'}, at: '− 72', text: 'across the ='}
      - say: 'Divide both sides by 2. 8 divided by 2 is 4.'
        write: '$w = \dfrac{8}{2} = 4$'
      - say: 'Check: with these 4 white balls, the total is 36 plus 4, which is 40. And 16 over 40 simplifies to 2 over 5 when we divide both by 8.'
        write: 'Check: $\dfrac{16}{36 + 4} = \dfrac{16}{40} = \dfrac{16 \div 8}{40 \div 8} = \dfrac{2}{5}$'
        doodle: {name: ball-white, id: whites, caption: '4 white balls added', repeat: 4, layout: row}
        doodle_do:
          - {id: bag, op: pulse, part: whites}
      - say: 'So 4 white balls must be added, which is answer choice A.'
        write: 'White balls added $= 4$'
        answer: true
    traps:
      B: 'You went for 20. With 20 white balls the total is 56, and 16 over 56 is 2 over 7, not 2 over 5. Solving $\tfrac{16}{36 + w} = \tfrac{2}{5}$ gives $w = 4$.'
      C: 'You went for 24. With 24 white balls the total is 60, and 16 over 60 is 4 over 15, not 2 over 5. We need a total of 40, so only 4 white balls.'
      D: 'You went for 40. That is the total number of balls needed, not the number of white ones. The bag already has 36, so 4 white balls bring it to 40.'

  47:
    moments:
      - say: 'The pie chart shows a public servant''s monthly spending. Picture his ₦7,200 pay envelope being shared out: Housing is twice School Fees. We want the amount spent on housing.'
        write: 'Income: ₦7,200'
        doodle: {name: 'custom:1998_q47_a', id: pay, caption: 'Housing is twice school fees'}
      - say: 'A pie chart shares 360 degrees in proportion to the amounts. Food is marked 120 degrees, and Transport has a right-angle mark, so it is 90 degrees.'
        write: '$\text{Food} = 120^{\circ}, \quad \text{Transport} = 90^{\circ}$'
        point:
          - {figure: 0, kind: circle, target: '120°'}
          - {figure: 0, kind: label, target: Transport, text: '90°'}
      - say: '360 minus 120 is 240, and 240 minus 90 is 150. Those 150 degrees are shared between Housing and School Fees.'
        write: '$360^{\circ} - 120^{\circ} - 90^{\circ} = 150^{\circ}$'
      - say: 'Let School Fees be $s$ degrees. Housing is twice that, $2s$, as the picture shows. Together they make 150.'
        write: '$s + 2s = 150^{\circ}$'
        doodle_do:
          - {id: pay, op: label, part: fees, text: s}
          - {id: pay, op: label, part: house, text: '2s'}
      - say: '$s$ plus $2s$ is $3s$.'
        write: '$3s = 150^{\circ}$'
      - say: 'Divide by 3. 150 divided by 3 is 50.'
        write: '$s = 50^{\circ}$'
        point:
          - {figure: 0, kind: label, target: School, text: '50°'}
      - say: 'Housing is twice that. 2 times 50 is 100 degrees for the house.'
        write: '$\text{Housing} = 2 \times 50^{\circ} = 100^{\circ}$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '50'}, at: '× 50', text: 'twice'}
          - {figure: 0, kind: label, target: Housing, text: '100°'}
        doodle_do:
          - {id: pay, op: circle, part: house, text: '100°'}
      - say: 'In a pie chart, each item''s share is its angle over 360 degrees, times the whole amount.'
        write: 'Share $= \dfrac{\text{sector angle}}{360^{\circ}} \times \text{total}$'
      - say: 'Now turn the angle into money. The full 360 degrees stands for the whole income, so Housing gets 100 out of 360 of the ₦7,200.'
        write: 'Housing $= \dfrac{100}{360} \times 7200$'
        point:
          - {line: 8, kind: move, from: {line: 6, at: '100'}, at: '100', text: 'Housing angle'}
          - {line: 8, kind: move, from: {line: 0, at: '7,200'}, at: '7200', text: 'income'}
          - {figure: 0, kind: highlight, target: 'Housing', text: '100 of 360'}
      - say: 'Work out one degree first. 7200 divided by 360 is 20, so each degree stands for ₦20.'
        write: 'One degree $= \dfrac{7200}{360} = 20$'
      - say: 'Housing has 100 of those degrees. 100 times 20 is 2000, taken out of the ₦7,200 envelope.'
        write: 'Housing $= 100 \times 20 = 2000$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '= 20'}, at: '× 20', text: 'per degree'}
          - {line: 10, kind: highlight, at: '= 2000', to: {doodle: pay, part: house}}
        doodle_do:
          - {id: pay, op: label, part: house, text: '₦2,000'}
          - {id: pay, op: pulse, part: envelope}
      - say: 'So he spends ₦2,000 on housing, which is answer choice B.'
        write: 'Housing: ₦2,000'
        answer: true
        point:
          - {figure: 0, kind: circle, target: Housing, text: '₦2,000'}
    traps:
      A: 'You went for ₦1,000. That is School Fees'' share, 50 degrees at ₦20 each. Housing is the larger one, twice School Fees: 100 degrees, which is ₦2,000.'
      C: 'You went for ₦3,000. That is the whole 150 degrees left over, at ₦20 a degree. It has to be split between Housing and School Fees, and Housing gets 100 degrees, which is ₦2,000.'
      D: 'You went for ₦4,000. That would be 200 degrees, more than the 150 degrees left over. Housing is 100 degrees, and each degree is ₦20, so ₦2,000.'

  48:
    moments:
      - say: 'The bar chart shows the marks of 60 pupils in a test out of 10. The pass mark is 5. We want the percentage who failed.'
        point:
          - {figure: 0, kind: underline, target: 'Marks', text: 'out of 10'}
      - say: 'The height of each bar is the number of pupils with that mark. Read the bars from mark 0 up to mark 10.'
        write: 'Pupils for marks 0 to 10: $1, \ 3, \ 4, \ 7, \ 10, \ 8, \ 7, \ 9, \ 8, \ 2, \ 1$'
        point:
          - {figure: 0, kind: circle, target: 'Frequency', text: 'pupils'}
          - {figure: 0, kind: label, target: {x: 73.6, y: 196}, text: 'mark 0: 1'}
          - {figure: 0, kind: label, target: {x: 346.6, y: 196}, text: 'mark 10: 1'}
      - say: 'Let''s check they add to 60. Marks 0 to 4 first: 1 plus 3 is 4, plus 4 is 8, plus 7 is 15, plus 10 is 25.'
        write: 'Marks 0 to 4: $1 + 3 + 4 + 7 + 10 = 25$'
      - say: 'Then marks 5 to 10: 8 plus 7 is 15, plus 9 is 24, plus 8 is 32, plus 2 is 34, plus 1 is 35.'
        write: 'Marks 5 to 10: $8 + 7 + 9 + 8 + 2 + 1 = 35$'
      - say: 'And 25 plus 35 is 60, so every pupil is counted. Picture the 60 pupils as 12 figures, each standing for 5 pupils.'
        write: 'Total $= 25 + 35 = 60\ \checkmark$'
        doodle: {name: student-small, id: pupils, caption: '60 pupils: each figure = 5', repeat: 12, layout: grid}
      - say: 'Now the key detail. The pass mark is 5, so a paper marked exactly 5 passes. Failing means scoring below 5, like the paper marked 4: marks 0, 1, 2, 3 and 4.'
        write: 'Fail means a mark below 5: marks 0, 1, 2, 3, 4'
        point:
          - {figure: 0, kind: circle, target: '5', text: 'pass mark'}
        doodle: {name: 'custom:1998_q48_a', id: papers, caption: 'Scoring 5 is a pass; 4 is a fail'}
        doodle_do:
          - {id: papers, op: circle, part: fail, text: 'below 5'}
      - say: 'We already added those five bars: 25 pupils failed. That is 5 of the figures; the other 7 figures, 35 pupils, passed.'
        write: 'Failed $= 1 + 3 + 4 + 7 + 10 = 25$'
        point:
          - {line: 6, kind: move, from: {line: 2, at: '= 25'}, at: '= 25', text: 'already added'}
          - {line: 6, kind: highlight, at: '= 25', to: {doodle: pupils}}
        doodle_do:
          - {id: pupils, op: split, n: 5, text: '25 failed | 35 passed'}
      - say: 'A percentage is the part over the whole, times 100.'
        write: 'Percentage $= \dfrac{\text{part}}{\text{whole}} \times 100\%$'
      - say: 'As a percentage of the 60 pupils: the 5 failing figures out of 12. That is 25 over 60, times 100.'
        write: 'Percentage failed $= \dfrac{25}{60} \times 100\%$'
        point:
          - {line: 8, kind: move, from: {line: 6, at: '= 25'}, at: '60[[25]]', text: 'failed'}
          - {line: 8, kind: move, from: {line: 4, at: '= 60'}, at: '[[60]]25', text: 'all pupils'}
        doodle_do:
          - {id: pupils, op: circle, n: 5, text: '25 of 60'}
      - say: 'Divide the top and bottom by 5. 25 over 60 becomes 5 over 12.'
        write: '$= \dfrac{5}{12} \times 100\%$'
      - say: '5 times 100 is 500, and 500 divided by 12 is 41.67.'
        write: '$= \dfrac{500}{12}\% = 41.67\%$'
      - say: 'To one decimal place, 41.7% failed, which is answer choice C.'
        write: 'Percentage failed $\approx 41.7\%$'
        answer: true
    traps:
      A: 'You went for 59.4%. That is close to the pass rate, not the fail rate: 35 out of 60 passed, which is 58.3%. The question asks who failed: 25 out of 60, or 41.7%.'
      B: 'You went for 50%. Even counting the pupils on 5 as failures would give 33 out of 60, which is 55%. But scoring the pass mark is a pass, so 25 failed: 41.7%.'
      D: 'You went for 25%. 25 is the number of pupils who failed, not the percentage. Out of 60 pupils, that is 25 over 60 times 100, which is 41.7%.'

  49:
    moments:
      - say: 'Teams $X$ and $Y$ have probabilities 2 over 5 and 1 over 3 of winning the gold. We want the probability that either team wins it.'
        write: '$P(X) = \tfrac{2}{5}, \quad P(Y) = \tfrac{1}{3}$'
        doodle: {name: 'custom:1998_q49_a', id: gold, caption: 'One gold: X or Y, never both'}
      - say: 'There is only one gold medal, so only one team can win it. $X$ winning and $Y$ winning can''t both happen: the events are mutually exclusive.'
        write: '$X$ and $Y$ cannot both win: mutually exclusive'
        doodle_do:
          - {id: gold, op: circle, part: medal, text: 'only one'}
      - say: 'For mutually exclusive events there is no overlap to worry about, so the probability of one or the other is found by adding.'
        write: '$P(X \text{ or } Y) = P(X) + P(Y)$'
        point:
          - {line: 1, kind: underline, at: 'mutually exclusive', text: 'so add'}
      - say: 'Put in the two probabilities from the question: $X$''s 2 over 5 and $Y$''s 1 over 3.'
        write: '$= \dfrac{2}{5} + \dfrac{1}{3}$'
        point:
          - {line: 3, kind: move, from: {line: 0, at: '52'}, at: '52', text: 'P(X)'}
          - {line: 3, kind: move, from: {line: 0, at: '31'}, at: '31', text: 'P(Y)'}
          - {line: 3, kind: highlight, at: '52', to: {doodle: gold, part: team-x}}
        doodle_do:
          - {id: gold, op: highlight, part: team-x}
          - {id: gold, op: highlight, part: team-y}
      - say: 'To add fractions we need a common denominator. 5 times 3 is 15. For 2 over 5, multiply top and bottom by 3: 2 times 3 is 6, so that is 6 over 15.'
        write: '$\dfrac{2}{5} = \dfrac{2 \times 3}{5 \times 3} = \dfrac{6}{15}$'
      - say: 'For 1 over 3, multiply top and bottom by 5: 1 times 5 is 5, so that is 5 over 15.'
        write: '$\dfrac{1}{3} = \dfrac{1 \times 5}{3 \times 5} = \dfrac{5}{15}$'
      - say: 'Now add the two fractions we just made. 6 plus 5 is 11, so the probability the medal goes to $X$ or $Y$ is 11 over 15.'
        write: 'So $P(X \text{ or } Y) = \dfrac{6}{15} + \dfrac{5}{15} = \dfrac{11}{15}$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '= 156'}, at: '156 +', text: 'first'}
          - {line: 6, kind: move, from: {line: 5, at: '= 155'}, at: '+ 155', text: 'second'}
        doodle_do:
          - {id: gold, op: label, part: medal, text: 'X or Y: 11/15'}
      - say: 'Sense check: 11 over 15 is between 0 and 1, and it is bigger than each team''s probability on its own, as an "either" probability should be.'
        write: 'Check: $\dfrac{6}{15} < \dfrac{11}{15} < 1$'
      - say: 'Notice that the 10 teams in the question weren''t needed; only $X$ and $Y$ matter, and their probabilities were given directly.'
        doodle: {name: person-small, id: teams, caption: 'the 10 teams', repeat: 10, layout: row}
        doodle_do:
          - {id: teams, op: group, n: 2, text: 'X and Y'}
      - say: 'So the probability is 11 over 15, which is answer choice C.'
        write: '$P(X \text{ or } Y) = \dfrac{11}{15}$'
        answer: true
    traps:
      A: 'You went for 2 over 15. That is 2 over 5 times 1 over 3, the probability of both winning, which can''t happen here. For "either", when only one can win, we add: 11 over 15.'
      B: 'You went for 7 over 15. Check the conversion: 2 over 5 is 6 over 15 and 1 over 3 is 5 over 15, so the sum is 11 over 15.'
      D: 'You went for 13 over 15. Check the conversion: 1 over 3 is 5 over 15, not 7 over 15. 6 over 15 plus 5 over 15 is 11 over 15.'

  50:
    moments:
      - say: '$x$ and $y$ can each be 1, 2, 3 or 4, like two spinners marked 1 to 4. We want the probability that their product is not greater than 6.'
        write: '$x, \ y \in \{1, 2, 3, 4\}$'
        doodle: {name: 'custom:1998_q50_a', id: spinners, caption: 'x and y: each 1, 2, 3 or 4'}
      - say: 'Let me draw the table of products.'
        show_sketch: true
      - say: 'First, count all the possible pairs. Spinner $x$ has 4 choices and, for each one, spinner $y$ has 4 choices. 4 times 4 is 16, all equally likely.'
        write: 'All pairs: $4 \times 4 = 16$'
        point:
          - {figure: sketch, kind: circle, target: 'x', text: '4 choices'}
          - {figure: sketch, kind: circle, target: 'y', text: '4 choices'}
          - {line: 2, kind: highlight, at: '4 × 4 = 16', to: {doodle: spinners, part: question}}
        doodle_do:
          - {id: spinners, op: label, part: question, text: '4 × 4 = 16 pairs'}
      - say: 'What does "not greater than 6" mean? It means 6 or less. So a product of exactly 6 counts too.'
        write: 'Want: $xy \le 6$'
        point:
          - {figure: sketch, kind: underline, target: 'shaded: xy ≤ 6'}
      - say: 'Take each value of $x$ in turn. When the $x$ spinner shows 1, the products are 1, 2, 3 and 4. All four are 6 or less, so 4 pairs.'
        write: '$x = 1$: products $1, 2, 3, 4$, so 4 pairs'
        doodle_do:
          - {id: spinners, op: circle, part: spin-x, text: 'x = 1'}
      - say: 'When $x$ is 2, the products are 2, 4, 6 and 8. The first three are 6 or less, so 3 pairs.'
        write: '$x = 2$: products $2, 4, 6, 8$, so 3 pairs'
      - say: 'When $x$ is 3, the products are 3, 6, 9 and 12. Only 3 and 6 count, so 2 pairs.'
        write: '$x = 3$: products $3, 6, 9, 12$, so 2 pairs'
      - say: 'When $x$ is 4, the products are 4, 8, 12 and 16. Only 4 counts, so 1 pair.'
        write: '$x = 4$: products $4, 8, 12, 16$, so 1 pair'
      - say: 'Add up the pairs we just counted. 4 plus 3 plus 2 plus 1 is 10 favourable pairs.'
        write: 'Favourable pairs $= 4 + 3 + 2 + 1 = 10$'
        point:
          - {figure: sketch, kind: highlight, target: 'shaded: xy ≤ 6', text: '10 cells'}
      - say: 'The probability of an event is the number of favourable outcomes over the total number of outcomes.'
        write: '$P(\text{event}) = \dfrac{\text{number of favourable outcomes}}{\text{total number of outcomes}}$'
      - say: 'The probability is the favourable pairs over all 16 spins of the pair.'
        write: '$P(xy \le 6) = \dfrac{10}{16}$'
        point:
          - {line: 10, kind: move, from: {line: 8, at: '= 10'}, at: '16[[10]]', text: 'favourable'}
          - {line: 10, kind: move, from: {line: 2, at: '= 16'}, at: '[[16]]10', text: 'all pairs'}
        doodle_do:
          - {id: spinners, op: label, part: question, text: '10 of 16'}
      - say: 'Divide the top and bottom by 2. 10 over 16 is 5 over 8.'
        write: '$= \dfrac{10 \div 2}{16 \div 2} = \dfrac{5}{8}$'
      - say: 'So the probability is 5 over 8, which is answer choice A.'
        write: '$P(xy \le 6) = \dfrac{5}{8}$'
        answer: true
    traps:
      B: 'You went for 5 over 16. That is 5 favourable pairs out of 16, but there are 10 favourable pairs. 10 over 16 simplifies to 5 over 8.'
      C: 'You went for a half. That leaves out the two pairs whose product is exactly 6: 2 and 3, and 3 and 2. "Not greater than 6" includes 6, so there are 10 pairs, and 10 over 16 is 5 over 8.'
      D: 'You went for 3 over 8. That is 6 over 16, the pairs with a product greater than 6. The question wants the others: 10 pairs out of 16, which is 5 over 8.'
