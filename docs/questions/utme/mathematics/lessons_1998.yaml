      - say: 'We use the distance formula: the square root of the difference in $x$ squared, plus the difference in $y$ squared.'
        write: '$d = \sqrt{(x_{2} - x_{1})^{2} + (y_{2} - y_{1})^{2}}$'
      - say: 'The difference in $x$ is $x$ minus negative $x$. Subtracting a negative is adding, so that is $2x$, not zero.'
        write: 'Difference in $x$: $x - (-x) = 2x$'
        point:
          - {figure: sketch, kind: circle, target: '2x'}
      - say: 'The difference in $y$ is 3 minus 2, which is 1.'
        write: 'Difference in $y$: $3 - 2 = 1$'
        point:
          - {figure: sketch, kind: circle, target: '1'}
      - say: 'Put the two differences we just found into the formula, with the distance equal to 5.'
        write: '$5 = \sqrt{(2x)^{2} + 1^{2}}$'
        point:
