        write: '$c^{2} = 6 - 6\left(-\tfrac{1}{2}\right)$'
      - say: '6 times negative a half is negative 3, and minus negative 3 is plus 3.'
        write: '$c^{2} = 6 + 3 = 9$'
      - say: 'Take the square root. The square root of 9 is 3.'
        write: '$c = 3$'
