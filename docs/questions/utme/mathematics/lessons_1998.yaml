          - {figure: 0, kind: arc, target: PTR, text: '30°'}
      - say: 'First fact: $PR$ is a diameter, and the angle in a semicircle is a right angle. So the angle at $Q$, standing on $PR$, is 90 degrees.'
        write: '$\angle PQR = 90^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: PQR, text: '90°'}
      - say: 'Now look at the big triangle $PTR$. $S$ lies on the straight line $PT$, so the 35 degrees marked at $P$ is the angle of this triangle at $P$. It has 30 degrees at $T$.'
        write: 'In triangle $PTR$: $\angle TPR = 35^{\circ},\ \angle PTR = 30^{\circ}$'
        point:
          - {figure: 0, kind: highlight, target: 'PT', text: 'PST straight'}
          - {figure: 0, kind: circle, target: '35°'}
          - {figure: 0, kind: circle, target: '30°'}
      - say: 'Angles in a triangle always add up to 180 degrees.'
        write: 'Angle sum of a triangle $= 180^{\circ}$'
      - say: 'Angles in a triangle add to 180, so the third angle, at $R$, is 180 minus 35 minus 30.'
        write: '$\angle PRT = 180^{\circ} - 35^{\circ} - 30^{\circ}$'
        point:
          - {figure: 0, kind: circle, target: 'R', text: 'third angle'}
      - say: '180 minus 35 is 145, and 145 minus 30 is 115.'
