  50:
    moments:
      - say: '$x$ and $y$ can each be 1, 2, 3 or 4. We want the probability that their product is not greater than 6.'
        write: '$x, \ y \in \{1, 2, 3, 4\}$'
      - say: 'First, count all the possible pairs. There are 4 choices for $x$ and, for each one, 4 choices for $y$. 4 times 4 is 16, all equally likely.'
        write: 'All pairs: $4 \times 4 = 16$'
      - say: 'What does "not greater than 6" mean? It means 6 or less. So a product of exactly 6 counts too.'
        write: 'Want: $xy \le 6$'
      - say: 'Take each value of $x$ in turn. When $x$ is 1, the products are 1, 2, 3 and 4. All four are 6 or less, so 4 pairs.'
        write: '$x = 1$: products $1, 2, 3, 4$, so 4 pairs'
      - say: 'When $x$ is 2, the products are 2, 4, 6 and 8. The first three are 6 or less, so 3 pairs.'
        write: '$x = 2$: products $2, 4, 6, 8$, so 3 pairs'
      - say: 'When $x$ is 3, the products are 3, 6, 9 and 12. Only 3 and 6 count, so 2 pairs.'
        write: '$x = 3$: products $3, 6, 9, 12$, so 2 pairs'
      - say: 'When $x$ is 4, the products are 4, 8, 12 and 16. Only 4 counts, so 1 pair.'
        write: '$x = 4$: products $4, 8, 12, 16$, so 1 pair'
      - say: 'Add up the pairs we just counted. 4 plus 3 plus 2 plus 1 is 10 favourable pairs.'
        write: 'Favourable pairs $= 4 + 3 + 2 + 1 = 10$'
      - say: 'The probability is the favourable pairs over all 16 pairs.'
        write: '$P(xy \le 6) = \dfrac{10}{16}$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '= 10'}, at: '16[[10]]', text: 'favourable'}
          - {line: 8, kind: move, from: {line: 1, at: '= 16'}, at: '[[16]]10', text: 'all pairs'}
      - say: 'Divide the top and bottom by 2. 10 over 16 is 5 over 8.'
        write: '$= \dfrac{10 \div 2}{16 \div 2} = \dfrac{5}{8}$'
      - say: 'So the probability is 5 over 8, which is answer choice A.'
        write: '$P(xy \le 6) = \dfrac{5}{8}$'
        answer: true
    traps:
      B: 'You went for 5 over 16. That is 5 favourable pairs out of 16, but there are 10 favourable pairs. 10 over 16 simplifies to 5 over 8.'
      C: 'You went for a half. That leaves out the two pairs whose product is exactly 6: 2 and 3, and 3 and 2. "Not greater than 6" includes 6, so there are 10 pairs, and 10 over 16 is 5 over 8.'
      D: 'You went for 3 over 8. That is 6 over 16, the pairs with a product greater than 6. The question wants the others: 10 pairs out of 16, which is 5 over 8.'
