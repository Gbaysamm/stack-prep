          - {figure: sketch_b, kind: highlight, target: OB}
      - say: 'Two sides and the angle between them: that is the cosine rule. The side opposite the 120 degrees is the chord. Call it $c$.'
        write: 'Cosine rule: $c^{2} = a^{2} + b^{2} - 2ab\cos C$'
        point:
          - {figure: sketch_b, kind: highlight, target: 'AB', text: 'c'}
      - say: 'Put in $\sqrt{3}$ for both $a$ and $b$, and 120 degrees for the angle.'
