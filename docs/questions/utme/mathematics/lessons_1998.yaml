      - say: '$Q$, $R$ and $T$ lie on a straight line, so angles $PRQ$ and $PRT$ add to 180. 180 minus 115 is 65.'
        write: '$\angle PRQ = 180^{\circ} - 115^{\circ} = 65^{\circ}$'
