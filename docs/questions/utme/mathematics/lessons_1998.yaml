# UTME 1998 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1998.yaml. Answers match that file.
format_version: 1
exam_year: 1998
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'One-zero-one-one base two, plus X base seven, equals 25 base ten. Three bases at once, so we work in base ten, then write X in base seven.'
        write: 'If $1011_{2} + X_{7} = 25_{10}$, solve for $X$'
      - say: 'First, change one-zero-one-one base two to base ten.'
        write: 'Solution'
      - section: 'Step 1: base 2 to base 10'
        say: 'Write the index numbers over the digits, from nought on the right, so nought, one, two, three.'
        write: '$\overset{3}{1}\,\overset{2}{0}\,\overset{1}{1}\,\overset{0}{1}_{2}$'
      - say: 'Multiply each digit by two to the power of its index. That is 1 times 2 cubed, plus 0 times 2 squared, plus 1 times 2 to the 1, plus 1 times 2 to the nought.'
        write: '$= 1 \times 2^{3} + 0 \times 2^{2} + 1 \times 2^{1} + 1 \times 2^{0}$'
      - say: '2 cubed is 8, 2 squared is 4, 2 to the power 1 is 2, and 2 to the power nought is 1.'
        write: '$= 1 \times 8 + 0 \times 4 + 1 \times 2 + 1 \times 1$'
      - say: '1 times 8 is 8, 0 times 4 is 0, 1 times 2 is 2, and 1 times 1 is 1.'
        write: '$= 8 + 0 + 2 + 1$'
      - say: '8 plus 0 plus 2 plus 1 is 11, base ten.'
        write: '$= 11_{10}$'
      - section: 'Step 2: find X in base ten'
        say: 'Put 11 into the equation. 25 is already in base ten.'
        write: '$11 + X = 25$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '=[[11]]10'}, at: '11'}
      - say: 'Subtract 11 from both sides. 25 minus 11 is 14.'
        write: '$X = 25 - 11 = 14_{10}$'
      - section: 'Step 3: base 10 to base 7'
        say: 'But X carries the base seven label. So divide 14 by 7 on the ladder, and keep the remainders.'
        diagram: {id: L, kind: ladder, divisor: 7, number: 14, 'on': 'ladder'}
      - say: '14 divided by 7 is 2, remainder 0.'
        diagram_do:
          - {id: L, op: step}
      - say: '2 divided by 7 is 0, remainder 2. We stop at 0.'
        diagram_do:
          - {id: L, op: step}
      - say: 'Read the remainders from the bottom up, which gives two, zero. So 14 is two-zero base seven.'
        diagram_do:
          - {id: L, op: read, 'on': 'bottom up'}
        write: '$14_{10} = 20_{7}$'
        point:
          - {line: 12, kind: highlight, at: '207', to: {diagram: L, part: result}}
      - section: 'Check'
        say: 'Check by expanding two-zero base seven. 2 times 7, plus 0 times 1, is 14.'
        write: '$\overset{1}{2}\,\overset{0}{0}_{7} = 2 \times 7^{1} + 0 \times 7^{0} = 14$'
      - say: 'And 11 plus 14 is 25, just as the question says.'
        write: '$11 + 14 = 25\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore X is two-zero base seven, which is option B.'
        write: '$\therefore X = 20_{7}$'
        answer: true
    traps:
      A: 'You went for 14. That is the right value, but in base ten. X carries the base seven label, so 14 goes on the ladder: two-zero base seven.'
      C: 'You went for two-four. In base seven that is 2 times 7 plus 4, which is 18, and 11 plus 18 is 29, not 25. 14 divided by 7 is 2, remainder 0.'
      D: 'You went for 25. That is the total on the right, not X. Take away the 11 that one-zero-one-one base two is worth, then change 14 to base seven.'

  2:
    moments:
      - section: 'The question'
        say: 'A square bracket with a power of negative 1 outside, correct to 2 decimal places. Two flips happen in this question. Miss one and you land on a trap.'
        write: '$\left[\dfrac{1}{0.03} \div \dfrac{1}{0.024}\right]^{-1}$ (2 d.p.)'
      - section: 'Solution'
        say: 'Solution. By BODMAS, brackets come first, so we simplify inside the bracket, then use the power outside it.'
        write: 'By BODMAS: the bracket first'
      - section: 'Step 1: the bracket'
        say: 'To divide by a fraction, multiply by its reciprocal. Keep the first, change divide to times, and turn the second upside down.'
        write: 'Bracket: $\dfrac{1}{0.03} \div \dfrac{1}{0.024} = \dfrac{1}{0.03} \times \dfrac{0.024}{1}$'
      - say: 'Top times top is 0.024. Bottom times bottom is 0.03.'
        write: '$= \dfrac{0.024}{0.03}$'
      - say: 'Clear the decimals by multiplying the top and the bottom by 1000. 0.024 becomes 24, and 0.03 becomes 30.'
        write: '$= \dfrac{24}{30}$'
      - say: 'Divide the top and the bottom by 6. 24 divided by 6 is 4, and 30 divided by 6 is 5. Picture a bar of 5 pieces with 4 shaded.'
        write: '$= \dfrac{4}{5} = 0.8$'
        doodle: {name: 'custom:1998_q02_a', id: bar, caption: '4 pieces out of 5'}
        point:
          - {line: 5, kind: highlight, at: '0.8', to: {doodle: bar, part: row1}}
      - section: 'Step 2: the power'
        say: 'Now the power outside. A power of negative 1 means the reciprocal, so x to the power negative 1 is 1 over x.'
        write: '$x^{-1} = \dfrac{1}{x}$'
      - say: 'So the bracket, 4 over 5, to the power negative 1 is that fraction turned upside down, which is 5 over 4.'
        write: '$\left(\dfrac{4}{5}\right)^{-1} = \dfrac{5}{4}$'
        doodle_do:
          - {id: bar, op: stage, stage: 'custom:1998_q02_a2'}
      - say: '5 divided by 4 is 1.25, which is one whole and a quarter more, as the bar shows.'
        write: '$= 1.25$'
        doodle_do:
          - {id: bar, op: label, part: row2, text: '1.25'}
      - say: 'To 2 decimal places, 1.25 already has exactly two digits after the point, so it stays 1.25.'
        write: '$= 1.25$ (2 d.p.)'
      - section: 'Check'
        say: 'To check, 1.25 times the bracket, 0.8, should give 1. 1.25 times 0.8 is 1.00. It agrees.'
        write: 'Check: $1.25 \times 0.8 = 1$ ✓'
      - say: 'Therefore the value is 1.25, so option B.'
        write: '$\therefore$ value $= 1.25$ (B)'
        answer: true
    traps:
      A: 'You went for 3.76. That does not come from this working. The bracket simplifies to 0.024 over 0.03, which is 0.8, and its reciprocal is 1.25.'
      C: 'You went for 0.94. Check the bracket: dividing by 1 over 0.024 means multiplying by 0.024, which gives 0.8. The power of negative 1 then turns it to 1.25.'
      D: 'You went for 0.75. The bracket is 0.024 over 0.03, which is 0.8, not 0.75. And the power of negative 1 still has to turn it over: 1 over 0.8 is 1.25.'

  3:
    moments:
      - section: 'The question'
        say: 'Two conditions, three letters. The letter $b$ links them, so we find $b$ in terms of $a$ first, then put it into the second condition.'
        write: 'If $b^{3} = a^{-3}$ and $c^{\frac{1}{3}} = a^{\frac{1}{2}}b$, express $c$ in terms of $a$'
      - say: 'Solution. We start with the first condition.'
        write: 'Solution'
      - section: 'Find b'
        say: 'The law of indices for a power of a power says we multiply the indices.'
        write: 'Law of indices: $(a^{m})^{n} = a^{mn}$'
      - say: 'To undo a cube, raise both sides to the power 1 over 3. That is the cube root. In the picture, there are three $b$ blocks on one side and three blocks of 1 over $a$ on the other.'
        write: '$(b^{3})^{\frac{1}{3}} = (a^{-3})^{\frac{1}{3}}$'
        doodle: {name: 'custom:1998_q03_a', id: blocks, caption: 'b × b × b = 1/a × 1/a × 1/a'}
      - say: 'Multiply the indices. 3 times 1 over 3 is 1, and negative 3 times 1 over 3 is negative 1. One $b$ matches one 1 over $a$.'
        write: '$\therefore b = a^{-1}$'
        doodle_do:
          - {id: blocks, op: stage, stage: 'custom:1998_q03_a2'}
      - section: 'Substitute'
        say: 'Now substitute $a$ to the power negative 1 for $b$ in the second condition.'
        write: '$c^{\frac{1}{3}} = a^{\frac{1}{2}} \times a^{-1}$'
        doodle_do:
          - {id: blocks, op: pulse, part: root}
      - say: 'The law of indices for multiplying says that when we multiply powers of the same base, we add the indices.'
        write: 'Law of indices: $a^{m} \times a^{n} = a^{m + n}$'
      - say: 'So the index is 1 over 2 plus negative 1.'
        write: '$c^{\frac{1}{3}} = a^{\frac{1}{2} + (-1)}$'
      - say: '1 over 2 minus 1 is negative 1 over 2.'
        write: '$c^{\frac{1}{3}} = a^{-\frac{1}{2}}$'
      - section: 'Find c'
        say: 'The question wants $c$, not $c$ to the power 1 over 3. To undo the power 1 over 3, cube both sides.'
        write: '$(c^{\frac{1}{3}})^{3} = (a^{-\frac{1}{2}})^{3}$'
      - say: 'Multiply the indices. 1 over 3 times 3 is 1, leaving $c$. Negative 1 over 2 times 3 is negative 3 over 2.'
        write: '$\therefore c = a^{-\frac{3}{2}}$'
      - section: 'Check'
        say: 'Check with $a$ equal to 4. Then $b$ is 1 over 4, and $c$ to the power 1 over 3 is root 4 times 1 over 4, which is 2 over 4, or 1 over 2. Cubing, $c$ is 1 over 8.'
        write: 'Check, $a = 4$: $b = \tfrac{1}{4}$, $c^{\frac{1}{3}} = 2 \times \tfrac{1}{4} = \tfrac{1}{2}$, $c = \tfrac{1}{8}$'
      - say: 'Our answer gives 4 to the power negative 3 over 2, which is 1 over root 4 cubed, that is 1 over 2 cubed, or 1 over 8. They agree.'
        write: '$4^{-\frac{3}{2}} = \dfrac{1}{(\sqrt{4})^{3}} = \dfrac{1}{8}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore $c$ is $a$ to the power negative 3 over 2, which is option C.'
        write: '$\therefore c = a^{-\frac{3}{2}}$'
        answer: true
    traps:
      A: 'You went for $a$ to the power negative 1 over 2. That is $c$ to the power 1 over 3, the line before the last step. Cube both sides to get $c$: negative 1 over 2 times 3 is negative 3 over 2.'
      B: 'You went for $a$ to the power 1 over 2. The sign has gone wrong: 1 over 2 plus negative 1 is negative 1 over 2. And $c$ to the power 1 over 3 still needs cubing after that.'
      D: 'You went for $a$ to the power negative 2 over 3. To go from $c$ to the power 1 over 3 to $c$, we cube, which multiplies the index by 3. Negative 1 over 2 times 3 is negative 3 over 2.'

  4:
    moments:
      - section: 'The question'
        say: 'Two equations full of logs. They look frightening, but each one becomes a plain equation once you use two laws of logarithms. Recall the two laws, and the rest is ordinary algebra.'
        write: 'Find $x$ and $y$, in that order'
        doodle: {name: 'custom:1998_q04_a', id: count, caption: 'a log counts the factors'}
      - section: 'What we know'
        say: 'The first equation has logs in base 4.'
        write: '$\log_{4}(y + 1) + \log_{4}\left(\tfrac{1}{2}x\right) = 1$'
      - say: 'The second equation has logs in base 2.'
        write: '$\log_{2}(y - 1) + \log_{2}x = 2$'
      - say: 'Here is the plan. We turn each equation into one with no logs at all, then solve the two equations together.'
        write: 'Plan: remove the logs, then solve'
        'on': 'plan'
      - section: 'Recall: the laws of logarithms'
        say: 'First, the definition of a logarithm. Log base 4 of a number asks how many 4s we multiply together to make that number. Look at the picture, where one 4 makes 4. So log base 4 of 4 is 1.'
        write: 'Recall: $\log_{a}N = k$ means $N = a^{k}$'
        doodle_do:
          - {id: count, op: circle, part: fours, text: 'one 4 makes 4', 'on': 'one 4 makes 4'}
      - say: 'Second, the product law, for adding logs. When we add two logs with the same base, we multiply the numbers inside them, and keep one log.'
        write: 'Product law: $\log_{a}M + \log_{a}N = \log_{a}(M \times N)$'
        'on': 'adding logs'
      - section: 'The first equation'
        say: 'Use the product law on the first equation. Both logs are base 4, so multiply what is inside, which is y plus 1, times a half x.'
        write: '$\log_{4}\left[(y + 1) \times \tfrac{1}{2}x\right] = 1$'
        point:
          - {line: 6, kind: arrow, from: {line: 5, at: '(M×N)'}, at: '×', text: 'product law'}
      - say: 'Now change to index form, by the definition. Log base 4 of that product is 1, so the product is 4 to the power 1, one 4, which is 4.'
        write: '$(y + 1) \times \tfrac{1}{2}x = 4^{1} = 4$'
        point:
          - {line: 7, kind: highlight, at: '41 = 4', to: {doodle: count, part: fours}}
      - say: 'Multiply both sides by 2 to clear the half. 4 times 2 is 8. We call this equation 1.'
        write: '$(y + 1)x = 8 \quad (1)$'
      - section: 'The second equation'
        say: 'Now the second equation. Both logs are base 2, so by the product law, we multiply what is inside, y minus 1, times x.'
        write: '$\log_{2}\left[(y - 1)x\right] = 2$'
      - say: 'In index form, log base 2 of that product is 2, so the product is 2 to the power 2, which means two 2s multiplied, giving 4. Watch the two 2s join the picture. We call this equation 2.'
        write: '$(y - 1)x = 2^{2} = 4 \quad (2)$'
        doodle_do:
          - {id: count, op: stage, stage: 'custom:1998_q04_a2', 'on': 'two 2s join the picture'}
        point:
          - {line: 10, kind: highlight, at: '22 = 4', to: {doodle: count, part: twos}}
      - section: 'Solve the pair'
        say: 'Open the bracket in equation 1. y times x is xy, and 1 times x is x. So xy plus x equals 8.'
        write: '(1): $xy + x = 8$'
      - say: 'Open the bracket in equation 2 the same way, and we get xy minus x equals 4.'
        write: '(2): $xy - x = 4$'
      - say: 'Now take equation 2 away from equation 1. Watch the xy, because xy minus xy is 0, so it disappears. That is why we subtract.'
        write: '(1) $-$ (2): $(xy + x) - (xy - x) = 8 - 4$'
        point:
          - {line: 13, kind: travel, at: '(xy + x)', from: {line: 11, at: 'xy + x'}, text: '(1)'}
          - {line: 13, kind: travel, at: '(xy − x)', from: {line: 12, at: 'xy − x'}, text: '(2)'}
      - say: 'What is left is x minus negative x, which is x plus x, or 2x. On the right, 8 minus 4 is 4.'
        write: '$2x = 4$'
      - say: 'Divide both sides by 2. 4 divided by 2 is 2.'
        write: '$x = \dfrac{4}{2} = 2$'
      - say: 'Now put x equals 2 into equation 2.'
        write: 'Into (2): $(y - 1)(2) = 4$'
        point:
          - {line: 16, kind: travel, at: '[[(2)]] = 4', from: {line: 15, at: '= [[2]]'}, text: 'x'}
      - say: 'Divide both sides by 2. 4 divided by 2 is 2. So y minus 1 equals 2.'
        write: '$y - 1 = \dfrac{4}{2} = 2$'
      - say: 'Add 1 to both sides. 2 plus 1 is 3.'
        write: '$y = 2 + 1 = 3$'
      - section: 'Check'
        say: 'Let''s check in equation 1. y plus 1 is 3 plus 1, which is 4, and 4 times 2 is 8. It works. Every number inside a log is positive too, as it must be.'
        write: 'Check (1): $(3 + 1)(2) = 4 \times 2 = 8$'
      - say: 'The question says x and y respectively. Respectively means in the order asked, so x first, then y. So x is 2 and y is 3, which is answer choice A.'
        write: '$\therefore x = 2,\ y = 3$'
        answer: true
    traps:
      B: 'You went for 3, 2. Those are the right numbers in the wrong order. The question asks for x and y respectively, so x, which is 2, comes first.'
      C: 'You went for negative 2, negative 3. That is what you get if y plus 1 and y minus 1 are swapped between the two equations. Also, a log only takes a positive number, so negative values can''t fit. Here x is 2 and y is 3.'
      D: 'You went for negative 3, negative 2. A log only takes a positive number, so x and y minus 1 can''t be negative here. Solving gives x equals 2 and y equals 3, with x first.'

  5:
    moments:
      - section: 'The question'
        say: '$K$ is divided by a surd. Clear that division, open the brackets, and the surds nearly all cancel.'
        write: 'Find $K$ if $\dfrac{K}{\sqrt{3} + \sqrt{2}} = \sqrt{6} - 2$'
      - say: 'Solution. To get $K$ by itself, multiply both sides by root 3 plus root 2.'
        write: 'Solution'
      - section: 'Make K the subject'
        say: 'Multiply both sides by root 3 plus root 2. $K$ is left on its own.'
        write: '$K = (\sqrt{6} - 2)(\sqrt{3} + \sqrt{2})$'
        point:
          - {line: 2, kind: move, from: {line: 0, at: '3 + 2'}, at: '(3 + 2)', text: 'times both sides'}
      - section: 'Open the brackets'
        say: 'Each term in the first bracket multiplies each term in the second.'
        write: '$K = \sqrt{6}\sqrt{3} + \sqrt{6}\sqrt{2} - 2\sqrt{3} - 2\sqrt{2}$'
      - say: 'By the law of surds, root 6 times root 3 is root 18, and root 6 times root 2 is root 12.'
        write: '$= \sqrt{18} + \sqrt{12} - 2\sqrt{3} - 2\sqrt{2}$ $\quad [\sqrt{a}\sqrt{b} = \sqrt{ab}]$'
      - section: 'Basic form'
        say: '18 is 9 times 2, and root 9 is 3, so root 18 is 3 root 2.'
        write: '$\sqrt{18} = \sqrt{9 \times 2} = 3\sqrt{2}$'
      - say: '12 is 4 times 3, and root 4 is 2, so root 12 is 2 root 3.'
        write: '$\sqrt{12} = \sqrt{4 \times 3} = 2\sqrt{3}$'
      - section: 'Collect like surds'
        say: 'Put the basic forms back into the line for $K$.'
        write: '$K = 3\sqrt{2} + 2\sqrt{3} - 2\sqrt{3} - 2\sqrt{2}$'
      - say: '2 root 3 minus 2 root 3 is 0. And 3 root 2 minus 2 root 2 is root 2.'
        write: '$\therefore K = \sqrt{2}$'
        point:
          - {line: 7, kind: strike, at: '+[[23]]−', text: 'cancel'}
          - {line: 7, kind: strike, at: '−23−'}
      - section: 'Check'
        say: 'Check another way. Root 6 is root 2 times root 3, and 2 is root 2 times root 2, so root 6 minus 2 is root 2 times, bracket, root 3 minus root 2.'
        write: 'Check: $\sqrt{6} - 2 = \sqrt{2}(\sqrt{3} - \sqrt{2})$'
      - say: 'Then $K$ has root 3 minus root 2, times root 3 plus root 2, which is a difference of two squares. Picture a square of side root 3, area 3, with a square of side root 2, area 2, inside it.'
        doodle: {name: 'custom:1998_q05_a', id: tiles, caption: '√3 by √3 is a square of area 3'}
        doodle_do:
          - {id: tiles, op: stage, stage: 'custom:1998_q05_a2'}
        write: '$(\sqrt{3} - \sqrt{2})(\sqrt{3} + \sqrt{2}) = (\sqrt{3})^{2} - (\sqrt{2})^{2}$'
      - say: 'Root 3 squared is 3, root 2 squared is 2, and 3 minus 2 is 1, which is the strip left over.'
        doodle_do:
          - {id: tiles, op: stage, stage: 'custom:1998_q05_a3'}
        write: '$= 3 - 2 = 1$'
        point:
          - {line: 11, kind: highlight, at: '3 − 2 = 1', to: {doodle: tiles, part: rest}}
      - say: 'So $K$ is root 2 times 1, which is root 2. The same answer.'
        doodle_do:
          - {id: tiles, op: pulse, part: rest}
        write: '$K = \sqrt{2} \times 1 = \sqrt{2}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore $K$ is root 2, which is option D.'
        write: '$\therefore K = \sqrt{2}$'
        answer: true
    traps:
      A: 'You went for 3. That is root 3 squared, from the difference of two squares, but that step gives 3 minus 2, which is 1. Opening the brackets, everything cancels except root 2.'
      B: 'You went for 2. That is root 2 squared, but nothing here is squared on its own. 3 root 2 minus 2 root 2 is just root 2.'
      C: 'You went for root 3. The root 3 terms cancel: plus 2 root 3 and minus 2 root 3. What is left is 3 root 2 minus 2 root 2, which is root 2.'

  6:
    moments:
      - section: 'The question'
        say: 'A market woman buys a full jug of oil and pours it into small tins to sell. To find her profit, we first need how many tins the jug fills.'
        write: 'Find how much she made by selling all the oil.'
        doodle: {name: 'custom:1998_q06_a', id: stall, caption: 'pour the jug into tins, then sell them', size: scene}
      - say: 'Write Solution, then sketch the jug and one tin with their measurements.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'jug: ₦50', text: 'C.P.', 'on': 'the jug'}
          - {figure: sketch, kind: circle, target: 'tin: ₦15 each', text: 'S.P. each', 'on': 'one tin'}
      - section: 'What we know'
        say: 'List the givens. The jug is 10 cm across and 18 cm deep, and cost 50 naira. Each tin is 6 cm across and 10 cm deep, and sells for 15 naira.'
        write: 'Jug: $d = 10,\ h = 18$, C.P. $=$ ₦50; tin: $d = 6,\ h = 10$, ₦15 each'
      - section: 'The volumes'
        say: 'Both are cylinders. Volume of a cylinder is pi r squared h.'
        write: '$V = \pi r^{2}h$'
      - say: 'The sizes are diameters, and the formula needs radii. The jug''s radius is 10 over 2, which is 5 cm.'
        write: 'Jug: $r = \dfrac{10}{2} = 5$ cm, $h = 18$ cm'
      - say: 'The volume of the jug is pi times 5 squared times 18. 5 squared is 25, and 25 times 18 is 450.'
        write: 'Vol. of jug $= \pi \times 5^{2} \times 18 = 450\pi\ \text{cm}^{3}$'
      - say: 'The tin''s radius is 6 over 2, which is 3 cm.'
        write: 'Tin: $r = \dfrac{6}{2} = 3$ cm, $h = 10$ cm'
      - say: 'The volume of a tin is pi times 3 squared times 10. 3 squared is 9, and 9 times 10 is 90.'
        write: 'Vol. of tin $= \pi \times 3^{2} \times 10 = 90\pi\ \text{cm}^{3}$'
      - section: 'Number of tins'
        say: 'Number of tins is the volume of the jug divided by the volume of a tin. The pi cancels, and 450 over 90 is 5. Watch the five tins fill.'
        write: 'Number of tins $= \dfrac{450\pi}{90\pi} = 5$'
        doodle_do:
          - {id: stall, op: stage, stage: 'custom:1998_q06_a2', 'on': 'Watch the five tins fill'}
        point:
          - {figure: sketch, kind: label, target: 'how many tins?', text: '5 tins', 'on': 'is 5'}
      - section: 'The profit'
        say: 'Her selling price, S.P., for all the oil is 5 tins at 15 naira each, so 5 times 15 is 75 naira.'
        write: 'S.P. $= 5 \times 15 =$ ₦75'
        doodle_do:
          - {id: stall, op: stage, stage: 'custom:1998_q06_a3', 'on': '5 tins at 15 naira'}
      - say: 'Her cost price, C.P., is what she paid for the jug, which is 50 naira. Profit is S.P. minus C.P.'
        write: 'Profit $=$ S.P. $-$ C.P.'
        doodle_do:
          - {id: stall, op: circle, part: price, text: 'C.P. ₦50', 'on': 'cost price'}
      - say: '75 minus 50 is 25 naira.'
        write: '$= 75 - 50 =$ ₦25'
        point:
          - {line: 11, kind: move, from: {line: 9, at: '₦75'}, at: '75', text: 'S.P.', 'on': '75 minus'}
      - say: 'Therefore she made 25 naira.'
        write: '$\therefore$ profit $=$ ₦25.00'
        doodle_do:
          - {id: stall, op: label, part: money, text: '₦75 − ₦50 = ₦25 profit', 'on': 'Therefore'}
      - section: 'Check'
        say: 'To check, 5 tins of 90 pi each hold 450 pi, exactly the jug, so all the oil is sold. 5 tins at 15 naira is 75, and 75 minus 50 is 25.'
        write: 'Check: $5 \times 90\pi = 450\pi$ ✓; $75 - 50 = 25$ ✓'
      - section: 'Answer'
        say: 'So she made 25 naira, which is answer choice D.'
        write: '$\therefore$ profit $=$ ₦25.00 (D)'
        answer: true
    traps:
      A: 'You went for 62.50 naira. The volumes say otherwise: the jug, 450 pi, fills exactly 5 tins of 90 pi. S.P. is 75 naira, and S.P. minus C.P. is 75 minus 50: 25 naira.'
      B: 'You went for 35 naira. Recheck the number of tins: with radii 5 and 3, the jug is 450 pi and a tin is 90 pi, so 5 tins. S.P. is 75 naira, and the profit is 25 naira.'
      C: 'You went for 31 naira. Halve the diameters first, then divide the volumes: 450 pi over 90 pi is 5 tins. They sell for 75 naira, leaving 25 naira after the 50 naira C.P.'

  7:
    moments:
      - section: 'The question'
        say: 'A man earns r naira an hour for normal work, and double the rate for overtime. He works a 35-hour week, and q of those hours are overtime. What does he earn in the week?'
        write: 'Rate $= r$ naira/hour; overtime rate $= 2r$; 35 hours, $q$ of them overtime'
      - section: 'Solution'
        say: 'Solution. The key words are "which includes". The 35 hours already include the q overtime hours. Look at the week bar under the clocks.'
        write: 'Normal hours $= 35 - q$'
        doodle: {name: 'custom:1998_q07_a', id: clocks, caption: 'a 35-hour week: normal + overtime'}
      - say: 'Pay is rate times hours. Weekly earning is normal pay plus overtime pay.'
        write: 'Earning $=$ normal pay $+$ overtime pay'
      - section: 'Each part'
        say: 'Normal pay is 35 minus q hours at r naira each, the left-hand clock. That is r times bracket 35 minus q.'
        write: 'Normal pay $= r(35 - q)$'
        point:
          - {line: 3, kind: highlight, at: 'r(35 - q)', to: {doodle: clocks, part: week-normal}}
        doodle_do:
          - {id: clocks, op: highlight, part: week-normal, text: '35 − q at ₦r'}
      - say: 'Overtime pay is q hours at 2r naira each, the right-hand clock. 2r times q is 2rq.'
        write: 'Overtime pay $= 2r \times q = 2rq$'
        point:
          - {line: 4, kind: highlight, at: '2r × q', to: {doodle: clocks, part: week-over}}
        doodle_do:
          - {id: clocks, op: circle, part: overtime}
      - section: 'Add and simplify'
        say: 'Substitute both into the earning line.'
        write: 'Earning $= r(35 - q) + 2rq$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '= [[2rq]]'}, at: '+ [[2rq]]', text: 'overtime'}
      - say: 'Open the bracket. r times 35 is 35r, and r times negative q is negative rq.'
        write: '$= 35r - rq + 2rq$'
      - say: 'Collect like terms, and negative rq plus 2rq is positive rq.'
        write: '$= 35r + rq$'
      - say: 'r is a common factor of both terms, so take it out. 35r divided by r is 35, and rq divided by r is q.'
        write: '$= r(35 + q)$'
      - section: 'Check'
        say: 'Check with numbers. Let r be 100 and q be 5. 30 normal hours at 100 is 3000, and 5 overtime hours at 200 is 1000. That is 4000.'
        write: 'Check, $r = 100,\ q = 5$: $30 \times 100 + 5 \times 200 = 4000$'
      - say: 'The formula gives 100 times 35 plus 5, which is 100 times 40, also 4000. It agrees.'
        write: '$r(35 + q) = 100 \times 40 = 4000$ ✓'
      - say: 'Therefore his weekly earning is r times bracket 35 plus q, naira, which is option A.'
        write: '$\therefore$ weekly earning $= r(35 + q)$ naira (A)'
        answer: true
    traps:
      B: 'You went for q(35r − q). Here q is taken out as a factor, but q is not in every term. The earning is 35r plus rq, and the common factor is r.'
      C: 'You went for q(35r + r). That multiplies everything by q, the overtime hours. Only the overtime pay has q in it: the earning is 35r plus rq, which is r(35 + q).'
      D: 'You went for r(35r − q). Taking r out of 35r leaves 35, not 35r, and the overtime adds rq rather than taking it away. The earning is r(35 + q).'

  8:
    moments:
      - section: 'The question'
        say: 'Three sets inside the universal set U, which is 1 to 6. We want P union, bracket, Q union R. The bracket comes first.'
        write: 'Find $P \cup (Q \cup R)$'
      - section: 'Solution'
        say: 'Solution. Write out the sets. U, the universal set, is 1 to 6.'
        write: '$U = \{1, 2, 3, 4, 5, 6\}$'
      - say: 'P is 1, 2, 3, 4. Q is 3, 4, 5. R is 2, 4, 6.'
        write: '$P = \{1, 2, 3, 4\},\ Q = \{3, 4, 5\},\ R = \{2, 4, 6\}$'
      - say: 'Place each element in a Venn diagram. 4 is in all three sets, so it goes in the middle. 3 is in P and Q. 2 is in P and R.'
        diagram: {id: v, kind: venn, universal: {name: U}, sets: [{key: P, name: P}, {key: Q, name: Q}, {key: R, name: R}], size: scene}
        diagram_do:
          - {id: v, op: fill, part: 'P∩Q∩R', text: '4', 'on': middle}
          - {id: v, op: fill, part: 'P∩Q only', text: '3', 'on': 'P and Q'}
          - {id: v, op: fill, part: 'P∩R only', text: '2', 'on': 'P and R'}
      - say: 'The rest are in one set only, that is 1 in P, 5 in Q and 6 in R.'
        diagram_do:
          - {id: v, op: fill, part: 'P only', text: '1', 'on': '1 in P'}
          - {id: v, op: fill, part: 'Q only', text: '5', 'on': '5 in Q'}
          - {id: v, op: fill, part: 'R only', text: '6', 'on': '6 in R'}
      - section: 'Step 1: the bracket'
        say: 'A union collects every element in either set, each written once. For Q union R, we join 3, 4, 5 with 2, 4, 6. The 4 is in both, but we write it once.'
        write: '$Q \cup R = \{3, 4, 5\} \cup \{2, 4, 6\} = \{2, 3, 4, 5, 6\}$'
        diagram_do:
          - {id: v, op: shade, part: 'Q∪R', colour: blue, text: 'Q ∪ R', 'on': 'write it once'}
      - section: 'Step 2: union with P'
        say: 'Now P union that set. P brings in the 1, which was not there yet. Its 2, 3 and 4 are there already.'
        write: '$P \cup (Q \cup R) = \{1, 2, 3, 4\} \cup \{2, 3, 4, 5, 6\}$'
      - say: 'So P union, Q union R, is 1, 2, 3, 4, 5, 6.'
        write: '$= \{1, 2, 3, 4, 5, 6\}$'
        diagram_do:
          - {id: v, op: shade, part: 'P∪Q∪R', colour: green, text: 'P ∪ (Q ∪ R)', 'on': 'So P union'}
      - say: 'That is every element of the universal set, so the answer is U itself.'
        write: '$\{1, 2, 3, 4, 5, 6\} = U$'
      - section: 'Check'
        say: 'Check each element of U. 1, 2, 3 and 4 are in P. 5 is in Q. 6 is in R. Every one belongs.'
        write: 'Check: $1, 2, 3, 4 \in P;\ 5 \in Q;\ 6 \in R\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore P union, Q union R, is the set 1, 2, 3, 4, 5, 6, which is answer choice D.'
        write: '$\therefore P \cup (Q \cup R) = \{1, 2, 3, 4, 5, 6\}$'
        answer: true
    traps:
      A: 'You went for the set with only 4 in it. That is P intersection Q intersection R, the middle of the Venn diagram. A union keeps every element in any of the sets.'
      B: 'You went for 1, 2, 3, 4. That is P on its own. The union with Q union R also brings in 5 and 6.'
      C: 'You went for 1, 2, 3, 5, 6. The 4 has been dropped, perhaps because it is in more than one set. In a union, a shared element is kept, written once.'

  9:
    moments:
      - section: 'The question'
        say: 'Three circles, P, Q and R, and one region is shaded. We must name the shaded region in set notation.'
        write: 'Shaded region $= ?$'
        point:
          - {figure: 0, kind: highlight, target: {x: 110, y: 150}, text: 'shaded'}
      - section: 'Solution'
        say: 'Solution. Three circles make seven regions. Take each circle in turn and ask whether the shading is inside it or outside it.'
        write: 'For each circle: inside or outside?'
      - say: 'P, the left circle. The shading is inside P.'
        write: 'Inside $P$: $\ P$'
        point:
          - {figure: 0, kind: circle, target: P, text: 'inside'}
      - say: 'Q, the right circle. The shading stops at the edge of Q, so it is outside Q. Outside Q is Q complement, written Q dash.'
        write: 'Outside $Q$: $\ Q^{\prime}$'
        point:
          - {figure: 0, kind: strike, target: Q, text: 'outside'}
      - say: 'R, the bottom circle. The shading is inside R.'
        write: 'Inside $R$: $\ R$'
        point:
          - {figure: 0, kind: circle, target: R, text: 'inside'}
      - say: 'In P and in Q complement is P intersection Q complement. In set notation, "and" is intersection.'
        write: 'In $P$ and outside $Q$: $\ P \cap Q^{\prime}$'
      - say: 'It must be in R as well, so intersect that with R.'
        write: 'Shaded region $= (P \cap Q^{\prime}) \cap R$'
      - section: 'Check'
        say: 'To check, shade P intersection Q complement, intersection R, on a Venn diagram of our own, and compare it with the question''s picture.'
        write: 'Check: shade $(P \cap Q^{\prime}) \cap R$'
        diagram: {id: v, kind: venn, universal: {name: U}, sets: [{key: P, name: P}, {key: Q, name: Q}, {key: R, name: R}]}
        diagram_do:
          - {id: v, op: shade, part: "(P∩Q')∩R", colour: green, text: '(P ∩ Q′) ∩ R', 'on': 'compare'}
      - say: 'The middle piece, inside all three circles, is inside Q, so Q complement leaves it out. It is not shaded in the question either.'
        write: 'Middle piece: in $Q$, so left out'
        diagram_do:
          - {id: v, op: highlight, part: 'P∩Q∩R', colour: red, text: 'in Q: not shaded', 'on': 'middle piece'}
      - section: 'Answer'
        say: 'Therefore the shaded region is P intersection Q complement, intersection R, which is answer choice C.'
        write: '$\therefore$ shaded region $= (P \cap Q^{\prime}) \cap R$'
        answer: true
        point:
          - {figure: 0, kind: label, target: {x: 110, y: 150}, text: '(P ∩ Q′) ∩ R'}
    traps:
      A: 'You went for P intersection Q, union R. That union takes in all of circle R, which is far more than the shaded piece. The shaded piece is inside P and R and outside Q.'
      B: 'You went for P intersection Q, intersection R. That is the middle piece, inside all three circles. The shaded piece is outside Q, so it needs Q complement.'
      D: 'You went for P union Q complement, intersection R. That union takes in everything in R that is in P or outside Q, which is almost all of R. The piece is in P and outside Q at once: an intersection.'

  10:
    moments:
      - section: 'The question'
        say: 'Two divisions, two remainders, two unknowns. The remainder theorem turns each division into an equation, and then it is simultaneous equations you already know.'
        write: 'Remainder 2 on dividing by $(m - 1)$; remainder 4 by $(m + 1)$'
      - section: 'Solution'
        say: 'Solution. Let $f$ of $m$ be the expression. The remainder theorem says that when $f(m)$ is divided by $m - a$, the remainder is $f$ of $a$.'
        write: 'Let $f(m) = pm^{2} + qm + 1$'
      - section: 'First remainder'
        say: 'Set the first divisor equal to zero, so $m - 1 = 0$, and $m$ is 1. Picture a machine where you feed in 1, and out comes the remainder.'
        write: 'Let $m - 1 = 0$, $\ \therefore m = 1$'
        doodle: {name: 'custom:1998_q10_a', id: machine, caption: 'feed in the zero of the divisor'}
      - say: 'The remainder is $f$ of 1. Replace every $m$ with 1, in brackets.'
        write: 'Remainder $= f(1) = p(1)^{2} + q(1) + 1$'
      - say: '1 squared is 1, so $f$ of 1 is $p$ plus $q$ plus 1. The remainder is 2, so this equals 2.'
        write: '$p + q + 1 = 2$'
        doodle_do:
          - {id: machine, op: circle, part: run1}
      - say: 'Subtract 1 from both sides. 2 minus 1 is 1. Label this equation 1.'
        write: '$p + q = 1 \quad \ldots\ldots (1)$'
      - section: 'Second remainder'
        say: 'Now the second divisor. $m + 1 = 0$, so $m$ is minus 1. Feed minus 1 into the machine.'
        write: 'Let $m + 1 = 0$, $\ \therefore m = -1$'
        doodle_do:
          - {id: machine, op: stage, stage: 'custom:1998_q10_a2'}
      - say: 'The remainder is $f$ of minus 1. Replace every $m$ with minus 1, in brackets.'
        write: 'Remainder $= f(-1) = p(-1)^{2} + q(-1) + 1$'
      - say: 'Minus 1 squared is plus 1, and $q$ times minus 1 is minus $q$. The remainder is 4, so this equals 4.'
        write: '$p - q + 1 = 4$'
        doodle_do:
          - {id: machine, op: circle, part: run2}
      - say: 'Subtract 1 from both sides. 4 minus 1 is 3. Label this equation 2.'
        write: '$p - q = 3 \quad \ldots\ldots (2)$'
      - section: 'Solve (1) and (2)'
        say: 'The coefficients of $q$ are plus 1 and minus 1, so add the two equations and $q$ cancels. $p$ plus $p$ is $2p$, and 1 plus 3 is 4.'
        write: '(1) + (2): $\ 2p = 4$'
      - say: 'Divide both sides by 2. 4 over 2 is 2.'
        write: '$p = \dfrac{4}{2} = 2$'
      - say: 'Substitute $p = 2$ in equation 1.'
        write: 'Sub. $p = 2$ in (1): $\ 2 + q = 1$'
      - say: 'Subtract 2 from both sides. 1 minus 2 is minus 1.'
        write: '$q = 1 - 2 = -1$'
      - section: 'Check'
        say: 'Check. $f$ of 1 is 2 minus 1 plus 1, which is 2. $f$ of minus 1 is 2 plus 1 plus 1, which is 4. Both remainders work.'
        write: 'Check: $f(1) = 2 - 1 + 1 = 2$, $\ f(-1) = 2 + 1 + 1 = 4$'
      - say: 'Therefore $p$ is 2 and $q$ is minus 1, in that order, which is answer choice A.'
        write: '$\therefore p = 2,\ q = -1$'
        answer: true
    traps:
      B: 'You went for minus 1, 2. Those are the right numbers in the wrong order. The question asks for $p$ and $q$ respectively, and $p$ is 2.'
      C: 'You went for 3, minus 2. Those fit $p + q = 1$, but not the second remainder: $f(-1)$ would be 3 plus 2 plus 1, which is 6, not 4. For $m + 1$ we substitute minus 1 and get $p - q = 3$.'
      D: 'You went for minus 2, 3. That fits the first remainder, but $f(-1)$ would be minus 2 minus 3 plus 1, which is minus 4, not 4. Solve both equations together: $p = 2$, $q = -1$.'

  11:
    moments:
      - section: 'The question'
        say: 'Letters where you expect numbers. But this is just a quadratic in $r$, and the product and sum method works exactly as it does with numbers.'
        write: 'Factorise $r^{2} - r(2p + q) + 2pq$'
      - section: 'Solution'
        say: 'Solution. Read it as a quadratic in $r$. The coefficient of $r^{2}$ is 1, the coefficient of $r$ is minus, bracket, $2p + q$, and the constant is $2pq$.'
        write: '$a = 1,\ b = -(2p + q),\ c = 2pq$'
      - section: 'Product and sum'
        say: 'The product is $a$ times $c$, so 1 times $2pq$ is $2pq$. The sum is $b$, and opening the bracket gives minus $2p$ minus $q$.'
        write: 'Product $= ac = 2pq$, Sum $= b = -2p - q$'
      - say: 'Find two terms that multiply to $2pq$ and add up to minus $2p$ minus $q$. Minus $2p$ times minus $q$ is plus $2pq$, and they add up correctly.'
        write: 'Factors: $-2p,\ -q$'
      - say: 'Use the two terms to split the middle term. Minus $r$ times $2p + q$ becomes minus $2pr$ minus $qr$.'
        write: 'Expression $= r^{2} - 2pr - qr + 2pq$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '[[−2p]], −q'}, at: '−2pr', text: 'split'}
          - {line: 4, kind: move, from: {line: 3, at: '−2p, [[−q]]'}, at: '−qr'}
      - section: 'Group in pairs'
        say: 'From the first pair take out $r$, leaving $r - 2p$. From the second pair take out minus $q$, leaving $r - 2p$ again.'
        write: '$= r(r - 2p) - q(r - 2p)$'
      - say: 'The two brackets are the same, so the grouping is right. Take out the common bracket, $r - 2p$. What is left over is $r - q$.'
        write: '$= (r - 2p)(r - q)$'
        point:
          - {line: 6, kind: underline, at: '(r − 2p)', text: 'common bracket'}
      - section: 'Check'
        say: 'Check by expanding. We get $r$ times $r$, then minus $2pr$, minus $qr$, and minus $q$ times minus $2p$, which is plus $2pq$. The same four terms.'
        write: 'Check: $(r - q)(r - 2p) = r^{2} - 2pr - qr + 2pq \ \checkmark$'
      - say: 'Therefore the factors are $r - q$ and $r - 2p$, in either order, which is answer choice C.'
        write: '$\therefore r^{2} - r(2p + q) + 2pq = (r - q)(r - 2p)$'
        answer: true
    traps:
      A: 'You went for $(r - 2q)(2r - p)$. Expanding it gives $2r^{2}$ at the front, but our expression starts with just $r^{2}$. The two factors from product and sum are minus $2p$ and minus $q$.'
      B: 'You went for $(r - q)(r + p)$. Expanding gives a last term of minus $pq$, but we need plus $2pq$. The product is $2pq$, so the second bracket must be $r - 2p$.'
      D: 'You went for $(2r - q)(r + p)$. That expands to start with $2r^{2}$, and our expression starts with $r^{2}$. The correct factors are $(r - q)(r - 2p)$.'

  12:
    moments:
      - section: 'The question'
        say: 'Two square roots in one equation. Square it as it stands and you get a mess. Put one root on each side first, and squaring clears them one at a time.'
        write: 'Solve $\sqrt{x} - \sqrt{x - 2} - 1 = 0$'
      - section: 'Solution'
        say: 'Solution. Add root $x - 2$ and 1 to both sides, so one root stands alone on the left. Picture two squares where the big side is 1 longer than the small side.'
        write: '$\sqrt{x} = 1 + \sqrt{x - 2}$'
        point:
          - {line: 1, kind: move, from: {line: 0, at: '[[−1]] = 0'}, at: '= [[1]] +', text: 'across'}
        doodle: {name: 'custom:1998_q12_a', id: squares, caption: 'side √x is 1 longer than √(x − 2)'}
      - section: 'Square both sides'
        say: 'Square both sides. The left becomes $x$. The right is a two-term bracket, so we square the whole bracket, not each term.'
        write: '$x = \left(1 + \sqrt{x - 2}\right)^{2}$'
      - say: 'Expand like $a$ plus $b$, all squared. That gives 1 squared, plus 2 times 1 times root $x - 2$, plus root $x - 2$, squared, which is just $x - 2$.'
        write: '$x = 1 + 2\sqrt{x - 2} + (x - 2)$'
      - say: 'Collect the numbers on the right. 1 minus 2 is minus 1.'
        write: '$x = x - 1 + 2\sqrt{x - 2}$'
      - say: 'Subtract $x$ from both sides and add 1 to both sides. The $x$ terms cancel, and that is what makes this solvable.'
        write: '$1 = 2\sqrt{x - 2}$'
      - say: 'Divide both sides by 2. So the small square has side a half.'
        write: '$\sqrt{x - 2} = \dfrac{1}{2}$'
        doodle_do:
          - {id: squares, op: label, part: small, text: 'side ½'}
      - section: 'Square again'
        say: 'Square both sides again to remove the last root. A half, squared, is 1 over 4.'
        write: '$x - 2 = \left(\dfrac{1}{2}\right)^{2} = \dfrac{1}{4}$'
      - say: 'Add 2 to both sides. 2 is 8 over 4, and 8 over 4 plus 1 over 4 is 9 over 4.'
        write: '$x = 2 + \dfrac{1}{4} = \dfrac{9}{4}$'
        doodle_do:
          - {id: squares, op: stage, stage: 'custom:1998_q12_a2'}
      - section: 'Check'
        say: 'Squaring can bring in false roots, so check in the question. The square root of 9 over 4 is 3 over 2, and the square root of 1 over 4 is a half.'
        write: 'Check: $\sqrt{\dfrac{9}{4}} = \dfrac{3}{2}$, $\ \sqrt{\dfrac{9}{4} - 2} = \sqrt{\dfrac{1}{4}} = \dfrac{1}{2}$'
      - say: '3 over 2 minus 1 over 2 is 1, and 1 minus 1 is 0. It works.'
        write: '$\dfrac{3}{2} - \dfrac{1}{2} - 1 = 0 \ \checkmark$'
      - say: 'Therefore $x$ is 9 over 4, which is answer choice D.'
        write: '$\therefore x = \dfrac{9}{4}$'
        answer: true
    traps:
      A: 'You went for 3 over 2. That is $\sqrt{x}$, not $x$. Since $\sqrt{x}$ is 3 over 2, $x$ is 3 over 2, squared, which is 9 over 4.'
      B: 'You went for 2 over 3. That is less than 2, so $x - 2$ would be negative and $\sqrt{x - 2}$ would not exist. The answer must be bigger than 2: it is 9 over 4.'
      C: 'You went for 4 over 9. That is the reciprocal of the answer, and it is less than 2, so $\sqrt{x - 2}$ would not exist. From $x - 2 = \tfrac{1}{4}$, $x$ is 9 over 4.'

  13:
    moments:
      - section: 'The question'
        say: 'For which values of $m$ does this quadratic have real roots? The answer is a range, and one rule gets us there, which is the discriminant.'
        write: '$3x^{2} - 3mx + (m^{2} - m - 3) = 0$'
      - section: 'Solution'
        say: 'Solution. The discriminant is $b^{2} - 4ac$, the part under the square root in the formula. The roots are real when it is greater than or equal to zero.'
        write: 'For real roots: $b^{2} - 4ac \ge 0$'
      - say: 'List $a$, $b$ and $c$. $a$, the coefficient of $x^{2}$, is 3. $b$, the coefficient of $x$, is minus $3m$. $c$ is the whole bracket.'
        write: '$a = 3,\ b = -3m,\ c = m^{2} - m - 3$'
      - say: 'Substitute them, each in brackets. Minus $3m$ in brackets, squared, minus 4 times 3 times the bracket for $c$.'
        write: '$(-3m)^{2} - 4(3)(m^{2} - m - 3) \ge 0$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: 'b = −3m'}, at: '(−3m)', text: 'b'}
          - {line: 3, kind: move, from: {line: 2, at: 'a = 3'}, at: '4[[(3)]]', text: 'a'}
          - {line: 3, kind: move, from: {line: 2, at: 'c = m2 − m − 3'}, at: '(m2 − m − 3)', text: 'c'}
      - say: 'Minus $3m$, squared, is $9m^{2}$, because a minus times a minus is a plus. And 4 times 3 is 12.'
        write: '$9m^{2} - 12(m^{2} - m - 3) \ge 0$'
      - say: 'Open the bracket. Minus 12 times $m^{2}$ is minus $12m^{2}$, minus 12 times minus $m$ is plus $12m$, and minus 12 times minus 3 is plus 36.'
        write: '$9m^{2} - 12m^{2} + 12m + 36 \ge 0$'
      - say: 'Collect like terms. $9m^{2}$ minus $12m^{2}$ is minus $3m^{2}$.'
        write: '$-3m^{2} + 12m + 36 \ge 0$'
      - say: 'Divide every term by minus 3 to make the numbers small. Dividing by a negative number reverses the inequality sign, so greater than or equal becomes less than or equal.'
        write: 'Divide by $-3$: $\ m^{2} - 4m - 12 \le 0$'
        point:
          - {line: 7, kind: circle, at: '≤', text: 'sign reversed'}
      - section: 'Factorise: product and sum'
        say: 'Now factorise. The product is $a$ times $c$, 1 times minus 12, which is minus 12. The sum is $b$, minus 4.'
        write: 'Product $= ac = -12$, Sum $= b = -4$'
      - say: 'We need two numbers that multiply to minus 12 and add up to minus 4, and they are minus 6 and 2. Minus 6 times 2 is minus 12, and minus 6 plus 2 is minus 4.'
        write: 'Factors: $-6,\ 2$'
      - say: 'Split the middle term. Minus $4m$ becomes minus $6m$ plus $2m$.'
        write: '$m^{2} - 6m + 2m - 12 \le 0$'
        point:
          - {line: 10, kind: move, from: {line: 9, at: '[[−6]], 2'}, at: '−6m', text: 'split'}
          - {line: 10, kind: move, from: {line: 9, at: '−6, [[2]]'}, at: '+2m'}
      - say: 'Group in pairs. From the first pair take out $m$, leaving $m - 6$. From the second pair take out 2, leaving $m - 6$ again.'
        write: '$m(m - 6) + 2(m - 6) \le 0$'
      - say: 'The brackets match, so take out the common bracket, $m - 6$. What is left is $m + 2$.'
        write: '$(m - 6)(m + 2) \le 0$'
        point:
          - {line: 12, kind: underline, at: '(m − 6)', text: 'common bracket'}
      - section: 'Sign table'
        say: 'The critical values are where the product is zero. Either $m - 6$ is zero or $m + 2$ is zero. Look at them on the number line.'
        write: 'Critical values: $m = 6$ or $m = -2$'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '−2', 'on': 'number line'}
          - {figure: sketch, kind: circle, target: '6', 'on': 'number line'}
      - say: 'The two values cut the line into three regions. In a sign table, write the sign of each bracket in each region.'
        write: 'Sign table:'
        diagram:
          id: signs
          kind: table
          columns: ['Factor', 'm < −2', '−2 < m < 6', 'm > 6']
          rows: [['m + 2', '−', '+', '+'], ['m − 6', '−', '−', '+'], ['(m + 2)(m − 6)', '', '', '']]
          'on': 'sign table'
      - say: 'Multiply the signs down each column. Minus times minus is plus, plus times minus is minus, and plus times plus is plus.'
        write: 'Product: $+,\ -,\ +$'
        diagram_do:
          - {id: signs, op: fill, part: 'cell:3,2', text: '+'}
          - {id: signs, op: fill, part: 'cell:3,3', text: '−', colour: green}
          - {id: signs, op: fill, part: 'cell:3,4', text: '+'}
      - say: 'We want the product less than or equal to zero. It is negative only between the critical values, and zero at the two ends.'
        write: '$\therefore -2 \le m \le 6$'
        point:
          - {figure: sketch, kind: highlight, target: ['−2', '6'], text: 'real roots'}
        diagram_do:
          - {id: signs, op: highlight, part: 'col:3', text: 'negative here'}
      - section: 'Check'
        say: 'Check a value inside, $m = 0$. Then $b$ is zero, $a$ is 3 and $c$ is minus 3. 0 minus 4 times 3 times minus 3 is 36, which is positive. Real roots.'
        write: 'Check $m = 0$: $\ 0 - 4(3)(-3) = 36 \ge 0$'
      - say: 'Check a value outside, $m = 7$. Minus 3 times 49, plus 12 times 7, plus 36 is minus 27. Negative, so no real roots there.'
        write: '$m = 7$: $\ -3(49) + 12(7) + 36 = -27 < 0$'
      - say: 'At $m = -2$ and $m = 6$ the discriminant is zero, so the two roots are equal, and equal roots are real. Both ends are included. That is answer choice B.'
        write: 'Option B: $\ -2 \le m \le 6$'
        answer: true
        point:
          - {figure: sketch, kind: underline, target: 'real roots: m from −2 to 6'}
    traps:
      A: 'You went for minus 1 to 7. Those ends come from $m^{2} - 6m - 7$, where the sum is minus 6. Our quadratic is $m^{2} - 4m - 12$: product minus 12, sum minus 4, so the factors are minus 6 and 2.'
      C: 'You went for minus 3 to 9. Those ends multiply to minus 27, not minus 12. From $m^{2} - 4m - 12$, the factors are minus 6 and 2, so the critical values are 6 and minus 2.'
      D: 'You went for minus 4 to 8. Their sum is right, but minus 4 times 8 is minus 32, not minus 12. The product is minus 12, so the critical values are minus 2 and 6.'

  14:
    moments:
      - section: 'The question'
        say: 'The new subject here is not one letter but a fraction, $a$ over $x$. Our plan is to collect $a$ on one side and $x$ on the other, then divide.'
        write: 'Make $\dfrac{a}{x}$ the subject of $\dfrac{x + a}{x - a} = m$'
      - section: 'Solution'
        say: 'Solution. Write the formula down first.'
        write: '$\dfrac{x + a}{x - a} = m$'
      - say: 'Cross multiply to clear the fraction, so $x + a$ equals $m$ times $x - a$.'
        write: '$x + a = m(x - a)$'
        point:
          - {line: 2, kind: move, from: {line: 1, at: 'x − a'}, at: '(x − a)', text: 'cross multiply'}
      - say: 'Open the bracket. $m$ times $x$ is $mx$, and $m$ times minus $a$ is minus $ma$.'
        write: '$x + a = mx - ma$'
      - section: 'Collect the terms'
        say: 'Collect the terms in $a$ on the left. Add $ma$ to both sides.'
        write: '$x + a + ma = mx$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '− ma'}, at: '+ ma', text: 'add ma'}
      - say: 'Now the terms in $x$ go on the right. Subtract $x$ from both sides.'
        write: '$a + ma = mx - x$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '[[x]] + a'}, at: '− x', text: 'subtract x'}
      - say: 'Factorise each side. On the left, take out $a$, leaving 1 plus $m$. On the right, take out $x$, leaving $m$ minus 1.'
        write: '$a(1 + m) = x(m - 1)$'
      - section: 'Divide'
        say: 'Divide both sides by $x$. Now the left side has $a$ over $x$, the fraction we want.'
        write: '$\dfrac{a}{x}(1 + m) = m - 1$'
      - say: 'Divide both sides by 1 plus $m$. That leaves $a$ over $x$ alone.'
        write: '$\dfrac{a}{x} = \dfrac{m - 1}{1 + m}$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '(1 + m)'}, at: '1 + m', text: 'divide'}
      - section: 'Check'
        say: 'Check with numbers. Take $a = 1$ and $x = 3$. Then $m$ is 3 plus 1 over 3 minus 1, which is 4 over 2, which is 2.'
        write: 'Check $a = 1,\ x = 3$: $\ m = \dfrac{4}{2} = 2$'
      - say: 'Put $m = 2$ into our answer. 2 minus 1 over 1 plus 2 is 1 over 3. And $a$ over $x$ is 1 over 3. It works.'
        write: '$\dfrac{2 - 1}{1 + 2} = \dfrac{1}{3} = \dfrac{a}{x}$'
      - say: '1 plus $m$ is the same as $m$ plus 1. Therefore $a$ over $x$ is $m$ minus 1 over $m$ plus 1, which is answer choice A.'
        write: '$\therefore \dfrac{a}{x} = \dfrac{m - 1}{m + 1}$'
        answer: true
    traps:
      B: 'You went for 1 plus $m$ over 1 minus $m$. Test it with $a = 1$ and $x = 3$, so $m = 2$: it gives 3 over minus 1, which is minus 3, not 1 over 3.'
      C: 'You went for 1 minus $m$ over 1 plus $m$. The top has the wrong sign. Subtracting $x$ from both sides gives $mx - x$, which is $x(m - 1)$, not $x(1 - m)$.'
      D: 'You went for $m$ plus 1 over $m$ minus 1. That is $x$ over $a$, the reciprocal. The question wants $a$ over $x$, so $m$ minus 1 is on top.'

  15:
    moments:
      - section: 'The question'
        say: 'Dividing a polynomial is long division, set out like long division of numbers. Picture a rectangle with height $2x + 1$ and area the whole expression. We are finding its length.'
        write: '$(2x^{3} + 11x^{2} + 17x + 6) \div (2x + 1)$'
        doodle: {name: 'custom:1998_q15_a', id: rect, caption: 'height 2x + 1, length to be found', size: scene, 'on': 'rectangle'}
      - section: 'Long division'
        say: 'Solution. The divisor, $2x + 1$, goes outside the bracket. The dividend, the expression being divided, goes inside, in descending powers of $x$.'
        write: 'Set out: $\ 2x + 1\ \big)\ \overline{2x^{3} + 11x^{2} + 17x + 6}$'
      - say: 'Divide the first term inside by the first term outside. $2x^{3}$ divided by $2x$ is $x^{2}$. Write $x^{2}$ on top as the first term of the quotient.'
        write: '$2x^{3} \div 2x = x^{2}$'
      - say: 'Multiply back. $x^{2}$ times $2x + 1$ is $2x^{3}$ plus $x^{2}$. Write it under the first two terms. That is the first strip of the rectangle.'
        write: '$x^{2}(2x + 1) = 2x^{3} + x^{2}$'
        point:
          - {line: 3, kind: highlight, at: '= 2x3 + x2', to: {doodle: rect, part: round1}}
        doodle_do:
          - {id: rect, op: stage, stage: 'custom:1998_q15_a2', 'on': 'strip'}
      - say: 'Subtract. $2x^{3}$ minus $2x^{3}$ is zero, and $11x^{2}$ minus $x^{2}$ is $10x^{2}$. Then bring down the next term, plus $17x$.'
        write: 'Subtract, bring down: $\ 10x^{2} + 17x$'
        point:
          - {line: 4, kind: move, from: {line: 1, at: '17x'}, at: '17x', text: 'bring down'}
      - say: 'Divide again. $10x^{2}$ divided by $2x$ is $5x$. Write plus $5x$ on top.'
        write: '$10x^{2} \div 2x = 5x$'
      - say: 'Multiply back. $5x$ times $2x + 1$ is $10x^{2}$ plus $5x$. Write it under. That is the second strip.'
        write: '$5x(2x + 1) = 10x^{2} + 5x$'
        doodle_do:
          - {id: rect, op: stage, stage: 'custom:1998_q15_a3', 'on': 'strip'}
      - say: 'Subtract. $10x^{2}$ minus $10x^{2}$ is zero, and $17x$ minus $5x$ is $12x$. Bring down the last term, plus 6.'
        write: 'Subtract, bring down: $\ 12x + 6$'
        point:
          - {line: 7, kind: move, from: {line: 1, at: '+ 6'}, at: '+ 6', text: 'bring down'}
      - say: 'Divide again. $12x$ divided by $2x$ is 6. Write plus 6 on top.'
        write: '$12x \div 2x = 6$'
      - say: 'Multiply back. 6 times $2x + 1$ is $12x$ plus 6. Write it under. That is the third strip.'
        write: '$6(2x + 1) = 12x + 6$'
        point:
          - {line: 9, kind: highlight, at: '= 12x + 6', to: {doodle: rect, part: round3}}
        doodle_do:
          - {id: rect, op: stage, stage: 'custom:1998_q15_a4', 'on': 'strip'}
      - say: 'Subtract. $12x + 6$ minus $12x + 6$ is zero. The remainder is zero, so $2x + 1$ divides exactly.'
        write: 'Remainder $= 0$'
      - say: 'The quotient is what we wrote on top, which is $x^{2}$, then plus $5x$, then plus 6. It is the length of the rectangle.'
        write: 'Quotient $= x^{2} + 5x + 6$'
        point:
          - {line: 11, kind: move, from: {line: 2, at: '= x2'}, at: 'x2', text: 'first'}
          - {line: 11, kind: move, from: {line: 5, at: '= 5x'}, at: '+ 5x', text: 'second'}
          - {line: 11, kind: move, from: {line: 8, at: '= 6'}, at: '+ 6', text: 'third'}
        doodle_do:
          - {id: rect, op: underline, part: round1}
          - {id: rect, op: underline, part: round2}
          - {id: rect, op: underline, part: round3}
      - section: 'Check'
        say: 'Check by multiplying back, because the divisor times the quotient should give the dividend.'
        write: 'Check: $(2x + 1)(x^{2} + 5x + 6)$'
      - say: '$2x$ times each term gives $2x^{3}$, $10x^{2}$ and $12x$. Then 1 times each term gives $x^{2}$, $5x$ and 6.'
        write: '$= 2x^{3} + 10x^{2} + 12x + x^{2} + 5x + 6$'
      - say: 'Collect like terms. $10x^{2}$ plus $x^{2}$ is $11x^{2}$, and $12x$ plus $5x$ is $17x$. That is the dividend we started with.'
        write: '$= 2x^{3} + 11x^{2} + 17x + 6$'
      - say: 'Therefore the quotient is $x^{2} + 5x + 6$, which is answer choice A.'
        write: '$\therefore$ the quotient is $x^{2} + 5x + 6$'
        answer: true
    traps:
      B: 'You went for $2x^{2} + 5x + 6$. The first term is $2x^{3}$ divided by $2x$, which is $x^{2}$, not $2x^{2}$. The 2s cancel.'
      C: 'You went for $2x^{2} - 5x + 6$. The first term is $x^{2}$, since $2x^{3}$ divided by $2x$ is $x^{2}$. And $10x^{2}$ divided by $2x$ is plus $5x$.'
      D: 'You went for $x^{2} - 5x + 6$. The first term is right, but after the first subtraction we have plus $10x^{2}$, and $10x^{2}$ divided by $2x$ is plus $5x$.'

  16:
    moments:
      - section: 'The question'
        say: 'This one fraction was made by adding two simpler fractions, like two slices making one pizza. Partial fractions means finding the two slices again.'
        write: 'Express $\dfrac{11x + 2}{6x^{2} - x - 1}$ in partial fractions'
        doodle: {name: 'custom:1998_q16_a', id: pizza, caption: 'one fraction, made of two slices', size: scene, 'on': 'pizza'}
      - section: 'Factorise the denominator'
        say: 'Solution. First factorise the denominator. The product is $a$ times $c$, 6 times minus 1, which is minus 6. The sum is $b$, minus 1.'
        write: 'Product $= ac = -6$, Sum $= b = -1$'
      - say: 'We need two numbers that multiply to minus 6 and add up to minus 1, and they are minus 3 and 2.'
        write: 'Factors: $-3,\ 2$'
      - say: 'Split the middle term. Minus $x$ becomes minus $3x$ plus $2x$.'
        write: '$6x^{2} - x - 1 = 6x^{2} - 3x + 2x - 1$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '[[−3]], 2'}, at: '−3x', text: 'split'}
          - {line: 3, kind: move, from: {line: 2, at: '−3, [[2]]'}, at: '+2x'}
      - say: 'Group in pairs. From the first pair take out $3x$, leaving $2x - 1$. From the second pair take out 1, leaving $2x - 1$ again.'
        write: '$= 3x(2x - 1) + 1(2x - 1)$'
      - say: 'The brackets match. Take out the common bracket, $2x - 1$. What is left is $3x + 1$.'
        write: '$= (3x + 1)(2x - 1)$'
      - section: 'Set up the fractions'
        say: 'Each factor gets its own fraction, with a constant on top, which we call $A$ and $B$. The sign with three lines means identically equal, true for every $x$.'
        write: 'Let $\dfrac{11x + 2}{(3x + 1)(2x - 1)} \equiv \dfrac{A}{3x + 1} + \dfrac{B}{2x - 1}$'
        doodle_do:
          - {id: pizza, op: stage, stage: 'custom:1998_q16_a2', 'on': 'own'}
      - say: 'Multiply through by $(3x + 1)(2x - 1)$. Each fraction keeps the bracket it did not have.'
        write: '$11x + 2 \equiv A(2x - 1) + B(3x + 1)$'
      - section: 'Find B'
        say: 'Put $x$ equal to a half, because it makes $2x - 1$ zero. That wipes out the $A$ term.'
        write: 'Put $x = \tfrac{1}{2}$: $\ 11\left(\tfrac{1}{2}\right) + 2 = A(0) + B\left(\tfrac{3}{2} + 1\right)$'
      - say: 'On the left, 11 over 2 plus 2 is 15 over 2. On the right, 3 over 2 plus 1 is 5 over 2.'
        write: '$\tfrac{15}{2} = \tfrac{5}{2}B$'
      - say: 'Divide both sides by 5 over 2. Both are over 2, so it is 15 divided by 5, which is 3. That is the top of the $B$ slice.'
        write: '$B = \tfrac{15}{2} \div \tfrac{5}{2} = 3$'
        doodle_do:
          - {id: pizza, op: label, part: slice-b, text: 'B = 3'}
      - section: 'Find A'
        say: 'Now put $x$ equal to minus 1 over 3, because it makes $3x + 1$ zero. That wipes out the $B$ term.'
        write: 'Put $x = -\tfrac{1}{3}$: $\ 11\left(-\tfrac{1}{3}\right) + 2 = A\left(-\tfrac{2}{3} - 1\right) + B(0)$'
      - say: 'On the left, minus 11 over 3 plus 2 is minus 5 over 3. On the right, minus 2 over 3 minus 1 is also minus 5 over 3.'
        write: '$-\tfrac{5}{3} = -\tfrac{5}{3}A$'
      - say: 'Divide both sides by minus 5 over 3. So $A$ is 1, the top of the $A$ slice.'
        write: '$A = 1$'
        doodle_do:
          - {id: pizza, op: label, part: slice-a, text: 'A = 1'}
      - say: 'Put $A = 1$ and $B = 3$ back into the two fractions we set up.'
        write: '$\dfrac{11x + 2}{6x^{2} - x - 1} = \dfrac{1}{3x + 1} + \dfrac{3}{2x - 1}$'
        point:
          - {line: 14, kind: move, from: {line: 13, at: '= 1'}, at: '3x+1[[1]]', text: 'A'}
          - {line: 14, kind: move, from: {line: 10, at: '= 3'}, at: '2x−1[[3]]', text: 'B'}
      - section: 'Check'
        say: 'Check with $x = 0$. The left side is 2 over minus 1, which is minus 2. The right side is 1 over 1 plus 3 over minus 1, so 1 minus 3, also minus 2.'
        write: 'Check $x = 0$: $\ \dfrac{2}{-1} = -2$; $\ \dfrac{1}{1} + \dfrac{3}{-1} = -2$'
      - say: 'Therefore the partial fractions are 1 over $3x + 1$, plus 3 over $2x - 1$, which is answer choice D.'
        write: '$\therefore \dfrac{1}{3x + 1} + \dfrac{3}{2x - 1}$'
        answer: true
        doodle_do:
          - {id: pizza, op: pulse, part: whole}
    traps:
      A: 'You went for 1 over $3x - 1$ plus 3 over $2x + 1$. The tops are right, but the signs in the brackets are swapped: $(3x - 1)(2x + 1)$ is $6x^{2} + x - 1$, not $6x^{2} - x - 1$.'
      B: 'You went for 3 over $3x + 1$ minus 1 over $2x - 1$. The brackets are right, but the tops are not. Putting $x = \tfrac{1}{2}$ gives $B = 3$, so the 3 goes over $2x - 1$.'
      C: 'You went for 3 over $3x - 1$ minus 1 over $2x + 1$. Product minus 6 and sum minus 1 give the factors minus 3 and 2, so the denominator is $(3x + 1)(2x - 1)$.'

  17:
    moments:
      - section: 'The question'
        say: '$x$ is a positive real number. The algebra will give one answer, but that word "positive" changes the final range. Keep it in mind.'
        write: '$\dfrac{1}{3x} + \dfrac{1}{2} > \dfrac{1}{4x},\quad x > 0$'
      - say: 'Solution. The L.C.M. of $3x$, 2 and $4x$ is $12x$. Since $x$ is positive, $12x$ is positive, so multiplying by it keeps the sign.'
        write: 'Solution: L.C.M. $= 12x > 0$, so the sign stays'
      - say: 'Multiply every term by $12x$.'
        write: '$12x \times \dfrac{1}{3x} + 12x \times \dfrac{1}{2} > 12x \times \dfrac{1}{4x}$'
      - say: '$12x$ over $3x$ is 4. $12x$ times a half is $6x$. And $12x$ over $4x$ is 3.'
        write: '$4 + 6x > 3$'
      - say: 'Subtract 4 from both sides. 3 minus 4 is minus 1.'
        write: '$6x > 3 - 4 = -1$'
      - say: 'Divide both sides by 6. It is positive, so the sign stays.'
        write: '$x > -\dfrac{1}{6}$'
      - section: 'Use the condition'
        say: 'But the question says $x$ is positive. So $x$ must satisfy both, greater than minus a sixth and greater than 0.'
        write: '$x > -\dfrac{1}{6}$ and $x > 0$'
      - say: 'On a number line, the first is an open circle at minus a sixth, arrow to the right. The second starts at 0. Both hold from 0 onwards.'
        diagram: {id: n, kind: numberline, range: [-1, 2], step: 0.5}
        diagram_do:
          - {id: n, op: interval, from: -0.167, from_open: true, text: 'x > −1/6', colour: blue}
          - {id: n, op: interval, from: 0, from_open: true, text: 'x > 0', answer: true, 'on': 'starts at 0'}
      - say: 'Every positive number is already bigger than minus a sixth. So both hold exactly when $x$ is greater than 0.'
        write: '$\therefore\ x > 0$'
      - section: 'Check'
        say: 'Check with $x$ equals 1. A third plus a half is about 0.83, and a quarter is 0.25. 0.83 is greater than 0.25.'
        write: 'Check $x = 1$: $\ \tfrac{1}{3} + \tfrac{1}{2} \approx 0.83 > \tfrac{1}{4}\ \checkmark$'
      - say: 'So the inequality holds for every positive $x$, and that is option B.'
        write: '$x > 0$'
        answer: true
    traps:
      A: 'You went for $x > -\tfrac{1}{6}$. The algebra gives that, but the question says $x$ is positive, so negative values are not allowed. Together, the answer is $x > 0$.'
      C: 'You went for 0 to 4. Nothing in the working puts an upper limit on $x$. Multiplying by $12x$ gives $4 + 6x > 3$, which every positive $x$ satisfies.'
      D: 'You went for 0 to 1 over 6. The 1 over 6 comes from $6x > -1$, but that says $x$ is greater than minus 1 over 6, not less than 1 over 6. Every positive $x$ works.'

  18:
    moments:
      - section: 'The question'
        say: 'The shaded region has three edges, which are the two axes and a slanting line. Each edge gives one inequality. Two options even share the right line, so the sign decides it.'
        write: 'Shaded region: three boundaries'
        point:
          - {figure: 0, kind: highlight, target: {x: 250, y: 110}, text: 'shaded'}
      - say: 'Solution. The shading lies to the right of the $y$-axis, where $x$ is 0 or more.'
        write: 'Solution: $\ y$-axis: $\ x \ge 0$'
        point:
          - {figure: 0, kind: circle, target: 'y', text: 'x ≥ 0'}
      - say: 'It lies above the $x$-axis, where $y$ is 0 or more.'
        write: '$x$-axis: $\ y \ge 0$'
        point:
          - {figure: 0, kind: circle, target: 'x', text: 'y ≥ 0'}
      - section: 'The slanting line'
        say: 'The slanting line cuts the axes at 0, 3 and 2, 0. Its gradient is the change in $y$ over the change in $x$.'
        write: '$m = \dfrac{y_{2} - y_{1}}{x_{2} - x_{1}} = \dfrac{0 - 3}{2 - 0} = -\dfrac{3}{2}$'
        point:
          - {figure: 0, kind: circle, target: '(0, 3)'}
          - {figure: 0, kind: circle, target: '(2, 0)'}
      - say: 'The equation of a line is $y$ equals $mx$ plus $c$, where $c$ is the $y$-intercept, 3.'
        write: '$y = mx + c = -\dfrac{3}{2}x + 3$'
        point:
          - {figure: 0, kind: label, target: '(0, 3)', text: 'c = 3'}
      - say: 'Multiply every term by 2 to clear the fraction, then add $3x$ to both sides.'
        write: '$2y = -3x + 6 \Rightarrow 3x + 2y = 6$'
      - section: 'Which side?'
        say: 'Test the origin, 0, 0. $3x$ plus $2y$ is 0, which is less than 6.'
        write: 'Test $(0,\ 0)$: $\ 3(0) + 2(0) = 0 < 6$'
        point:
          - {figure: 0, kind: circle, target: {x: 70, y: 190}, text: 'origin'}
      - say: 'The origin is not in the shaded part. So the shaded side is the other side, where $3x$ plus $2y$ is 6 or more. The line is solid, so equal to is allowed.'
        write: 'Origin not shaded: $\ 3x + 2y \ge 6$'
        point:
          - {figure: 0, kind: label, target: {x: 250, y: 110}, text: '3x + 2y ≥ 6'}
      - say: 'Exam tip. In a JAMB diagram like this, the shaded part is the region asked for. In your own graph work, many textbooks shade the unwanted part instead, so always state which.'
      - section: 'Answer'
        say: 'Put the three together.'
        write: '$\therefore\ x \ge 0,\ \ y \ge 0,\ \ 3x + 2y \ge 6$'
        point:
          - {line: 9, kind: move, from: {line: 7, at: '3x + 2y ≥ 6'}, at: '3x + 2y ≥ 6', text: 'line'}
      - say: 'So the shaded area is $x \ge 0$, $y \ge 0$ and $3x + 2y \ge 6$, which is option D.'
        write: '$x \ge 0,\ y \ge 0,\ 3x + 2y \ge 6$'
        answer: true
    traps:
      A: 'You went for $x \ge 0$ with $3y + 2x \ge 6$. The coefficients are swapped: $3y + 2x = 6$ cuts the axes at 3, 0 and 0, 2, but our line cuts them at 2, 0 and 0, 3. It also leaves out $y \ge 0$.'
      B: 'You went for the choice with $y \ge 3$. That would cut off everything below height 3, but the shading comes right down to the $x$-axis. The condition is $y \ge 0$.'
      C: 'You went for $x \ge 2$ with $3x + 2y \le 6$. The less-than sign describes the origin''s side, which is not shaded. Testing 0, 0 gives 0, less than 6, so the shaded side is $3x + 2y \ge 6$.'

  19:
    moments:
      - section: 'The question'
        say: 'Three expressions in $p$ are consecutive terms of an A.P. One of them has $p$ squared, so expect a quadratic and two values of $p$.'
        write: '$p + 1,\ 2p - 10,\ 1 - 4p^{2}$ in A.P.; $\ p = ?$'
        doodle: {name: 'custom:1998_q19_a', id: stairs, caption: 'an AP: every step the same size', size: scene}
      - section: 'Solution'
        say: 'Solution. In an A.P. the common difference is the same, so the second term minus the first equals the third term minus the second.'
        write: 'Solution: $T_{2} - T_{1} = T_{3} - T_{2}$'
        doodle_do:
          - {id: stairs, op: circle, part: steps}
      - say: 'Work out the first difference. Put each term in a bracket, so the minus sign reaches all of it.'
        write: '$T_{2} - T_{1} = (2p - 10) - (p + 1)$'
      - say: '$2p$ minus $p$ is $p$, and negative 10 minus 1 is negative 11.'
        write: '$= p - 11$'
      - say: 'Now the second difference, the third term minus the second.'
        write: '$T_{3} - T_{2} = (1 - 4p^{2}) - (2p - 10)$'
      - say: 'Minus negative 10 is plus 10, and 1 plus 10 is 11.'
        write: '$= -4p^{2} - 2p + 11$'
      - say: 'The two differences are equal.'
        write: '$p - 11 = -4p^{2} - 2p + 11$'
      - say: 'Collect all the terms on the left. Add $4p$ squared and $2p$, and subtract 11, on both sides.'
        write: '$4p^{2} + 3p - 22 = 0$'
      - section: 'Factorise'
        say: 'Factorise by product and sum. The product is $a$ times $c$, which is 4 times negative 22, or negative 88. The sum is 3. The factors are 11 and negative 8.'
        write: 'Product $= -88$, Sum $= 3$: $\ 11,\ -8$'
      - say: 'Split the middle term, $3p$, into $11p$ minus $8p$.'
        write: '$4p^{2} + 11p - 8p - 22 = 0$'
      - say: 'Group in pairs. Take $p$ out of the first pair and negative 2 out of the second. The brackets match.'
        write: '$p(4p + 11) - 2(4p + 11) = 0$'
      - say: 'Take out the common bracket.'
        write: '$(p - 2)(4p + 11) = 0$'
      - say: 'Either $p$ minus 2 is 0, or $4p$ plus 11 is 0.'
        write: 'Either $p - 2 = 0$ or $4p + 11 = 0$'
      - say: 'So $p$ is 2, or $4p$ is negative 11 and $p$ is negative 11 over 4.'
        write: '$\therefore\ p = 2$ or $p = -\dfrac{11}{4}$'
      - section: 'Check'
        say: 'Check $p$ equal to 2. The terms are 2 plus 1, which is 3, then 4 minus 10, which is negative 6, and 1 minus 16, which is negative 15.'
        write: 'Check $p = 2$: $\ 3,\ -6,\ -15$'
        doodle_do:
          - {id: stairs, op: stage, stage: 'custom:1998_q19_a2'}
      - say: 'Negative 6 minus 3 is negative 9, and negative 15 minus negative 6 is also negative 9. Equal steps, so it is an A.P.'
        write: '$-6 - 3 = -9,\quad -15 - (-6) = -9\ \checkmark$'
        doodle_do:
          - {id: stairs, op: circle, part: values, text: 'equal steps'}
      - say: 'Therefore $p$ is negative 11 over 4 or 2, which is answer choice C.'
        write: '$\therefore\ p = -\dfrac{11}{4},\ 2$'
        answer: true
    traps:
      A: 'You went for negative 4 and 2. The 2 is right, but with $p$ equal to negative 4 the terms are negative 3, negative 18 and negative 63, and the steps are not equal. The other root is negative 11 over 4.'
      B: 'You went for negative 2 and 4 over 11. Those are the true roots with the signs swapped and the fraction turned over. From $p$ minus 2 times $4p$ plus 11 equals 0, $p$ is 2 or negative 11 over 4.'
      D: 'You went for 5 and negative 3. With $p$ equal to 5 the terms are 6, 0 and negative 99, and the steps are not equal. Equal differences give $p$ equal to 2 or negative 11 over 4.'

  20:
    moments:
      - section: 'The question'
        say: 'The first three terms of a G.P. add up to half of its sum to infinity. We know no term at all, yet we can find the ratio. Picture all the terms laid end to end as a bar.'
        write: '$S_{3} = \dfrac{1}{2}S_{\infty}$; $\ r = ?$ (positive)'
        doodle: {name: 'custom:1998_q20_a', id: bar, caption: 'three terms fill half the bar'}
      - section: 'Solution'
        say: 'Solution. Let the first term be $a$ and the common ratio be $r$. A sum to infinity exists only when $r$ is between negative 1 and 1, so $r$ is less than 1.'
        write: 'Solution: $-1 < r < 1$'
      - say: 'With $r$ less than 1, the sum of $n$ terms is $a$, times 1 minus $r$ to the $n$, over 1 minus $r$. For three terms, $n$ is 3.'
        write: '$S_{3} = \dfrac{a(1 - r^{3})}{1 - r}$'
      - say: 'The sum to infinity is $a$ over 1 minus $r$.'
        write: '$S_{\infty} = \dfrac{a}{1 - r}$'
      - say: 'Substitute both into the condition, which says $S$ 3 equals a half of $S$ infinity.'
        write: '$\dfrac{a(1 - r^{3})}{1 - r} = \dfrac{1}{2} \times \dfrac{a}{1 - r}$'
        doodle_do:
          - {id: bar, op: highlight, part: first3, text: '½ of S∞'}
      - say: 'Both sides have $a$ over 1 minus $r$, so divide both sides by it. That is why we never need the first term.'
        write: '$1 - r^{3} = \dfrac{1}{2}$'
      - say: 'Make $r$ cubed the subject. $r$ cubed is 1 minus 1 over 2, which is 1 over 2. On the bar, the rest after three terms is $r$ cubed of the whole.'
        write: '$r^{3} = 1 - \dfrac{1}{2} = \dfrac{1}{2}$'
        doodle_do:
          - {id: bar, op: stage, stage: 'custom:1998_q20_a2'}
      - say: 'Take the cube root of both sides.'
        write: '$r = \sqrt[3]{\dfrac{1}{2}}$'
      - say: 'The cube root of 1 is 1, so this is 1 over the cube root of 2.'
        write: '$\therefore\ r = \dfrac{1}{\sqrt[3]{2}}$'
      - section: 'Check'
        say: 'Check. The cube root of 2 is about 1.26, so $r$ is about 0.79. That is between negative 1 and 1, so the sum to infinity exists.'
        write: 'Check: $r \approx \dfrac{1}{1.26} \approx 0.79$, and $-1 < 0.79 < 1\ \checkmark$'
      - say: 'And $r$ cubed is 1 over 2, so 1 minus $r$ cubed is 1 over 2, just as the condition needs.'
        write: '$1 - r^{3} = 1 - \dfrac{1}{2} = \dfrac{1}{2}\ \checkmark$'
      - say: 'Therefore the positive common ratio is 1 over the cube root of 2, which is answer choice D.'
        write: '$\therefore\ r = \dfrac{1}{\sqrt[3]{2}}$'
        answer: true
    traps:
      A: 'You went for 1 over 4. Then $r$ cubed would be 1 over 64, and 1 minus $r$ cubed would be nearly 1, not 1 over 2. We need $r$ cubed equal to 1 over 2.'
      B: 'You went for 1 over 2. That is the value of $r$ cubed, not $r$. Take the cube root as the last step: $r$ is 1 over the cube root of 2.'
      C: 'You went for 1 over the cube root of 3. That makes $r$ cubed equal to 1 over 3, so 1 minus $r$ cubed is 2 over 3, not 1 over 2.'

  21:
    moments:
      - section: 'The question'
        say: 'A table for an operation on $p$, $q$, $r$ and $s$. You do not need any working with numbers here. You need to know how to read the table, row by row.'
        write: 'Find the identity element of $\otimes$ on $\{p, q, r, s\}$'
      - say: 'Solution. Let me draw the table. The heading row runs along the top, and the same elements run down the side.'
        write: 'Solution'
        diagram:
          id: t
          kind: table
          columns: ['⊗', 'p', 'q', 'r', 's']
          rows: [['p', 'r', 'p', 'r', 'p'], ['q', 'p', 'q', 'r', 's'], ['r', 'r', 'r', 'r', 'r'], ['s', 'q', 's', 'r', 'q']]
      - say: 'Read a row first, then a column. For example, row $p$ and column $q$ meet at $p$, so $p$ circle-times $q$ is $p$.'
        write: 'Row, then column: $p \otimes q = p$'
        diagram_do:
          - {id: t, op: highlight, part: 'cell:1,q'}
      - section: 'The identity'
        say: 'Let $e$ be the identity element. Then $x$ circle-times $e$ equals $e$ circle-times $x$ equals $x$, for every element $x$.'
        write: 'Let $e$ be the identity: $x \otimes e = e \otimes x = x$'
      - say: 'So the identity''s row must copy the heading row exactly. The heading row reads $p$, $q$, $r$, $s$.'
        write: 'Heading row: $p,\ q,\ r,\ s$'
      - section: 'Row by row'
        say: 'Row $p$ reads $r$, $p$, $r$, $p$. That is not the heading row, because $p$ circle-times $p$ is $r$. So $p$ is not the identity.'
        write: 'Row $p$: $r,\ p,\ r,\ p \neq$ heading row'
        diagram_do:
          - {id: t, op: highlight, part: 'row:1', colour: red}
      - say: 'Row $q$ reads $p$, $q$, $r$, $s$. That copies the heading row exactly.'
        write: 'Row $q$: $p,\ q,\ r,\ s =$ heading row'
        diagram_do:
          - {id: t, op: highlight, part: 'row:2', colour: green}
      - say: 'Row $r$ reads $r$, $r$, $r$, $r$. Everything combined with $r$ gives $r$, so $r$ changes the elements. Not the identity.'
        write: 'Row $r$: $r,\ r,\ r,\ r \neq$ heading row'
        diagram_do:
          - {id: t, op: highlight, part: 'row:3', colour: red}
      - say: 'Row $s$ reads $q$, $s$, $r$, $q$. Not the heading row either.'
        write: 'Row $s$: $q,\ s,\ r,\ q \neq$ heading row'
        diagram_do:
          - {id: t, op: highlight, part: 'row:4', colour: red}
      - section: 'Check'
        say: 'An identity works from both sides, so check column $q$ too. Going down, it reads $p$, $q$, $r$, $s$, so $p$ circle-times $q$ is $p$, and so on.'
        write: 'Check: $p \otimes q = p,\ q \otimes q = q,\ r \otimes q = r,\ s \otimes q = s\ \checkmark$'
        diagram_do:
          - {id: t, op: highlight, part: 'col:q', colour: green}
      - section: 'Answer'
        say: 'Therefore the identity element is $q$, which is option B.'
        write: '$\therefore e = q$'
        answer: true
        diagram_do:
          - {id: t, op: label, part: 'cell:2,1', text: 'e = q', answer: true}
    traps:
      A: 'You went for $p$. Row $p$ reads $r$, $p$, $r$, $p$, which does not copy the heading row: $p \otimes p$ is $r$, not $p$. The identity is $q$.'
      C: 'You went for $r$. Row $r$ is all $r$, so combining anything with $r$ gives $r$. That changes the elements, so it cannot be the identity. Row $q$ copies the heading row.'
      D: 'You went for $s$. Row $s$ reads $q$, $s$, $r$, $q$, and $s \otimes s$ is $q$, not $s$. The identity is $q$.'

  22:
    moments:
      - section: 'The question'
        say: '$x$ star 3 and 2 star $x$ look alike, but the order matters, because $x$ is first in one and second in the other. Work out each side, and set them equal.'
        write: '$x * y = xy - y - x$. If $x * 3 = 2 * x$, find $x$.'
      - say: 'Solution. Write the definition line. The first element takes the place of $x$, and the second takes the place of $y$.'
        write: 'Solution: $x * y = xy - y - x$'
        doodle: {name: 'custom:1998_q22_a', id: slots, caption: 'first element, second element', size: scene}
      - section: 'Each side'
        say: 'First, $x$ star 3. The second element is 3, so put 3 in place of $y$. That gives $x$ times 3, minus 3, minus $x$.'
        write: '$x * 3 = x(3) - 3 - x$'
      - say: 'Collect like terms, and $3x$ minus $x$ is $2x$. So $x$ star 3 is $2x$ minus 3.'
        write: '$= 2x - 3$'
        doodle_do:
          - {id: slots, op: circle, part: run1-out}
      - say: 'Next, 2 star $x$. Now 2 is the first element and $x$ is the second, so we get 2 times $x$, minus $x$, minus 2.'
        write: '$2 * x = 2(x) - x - 2$'
        doodle_do:
          - {id: slots, op: stage, stage: 'custom:1998_q22_a2'}
      - say: '$2x$ minus $x$ is $x$. So 2 star $x$ is $x$ minus 2.'
        write: '$= x - 2$'
      - section: 'Solve'
        say: 'The question says the two are equal. So $2x$ minus 3 equals $x$ minus 2.'
        write: '$\therefore 2x - 3 = x - 2$'
        point:
          - {line: 6, kind: move, from: {line: 3, at: '= 2x − 3'}, at: '2x − 3', text: 'x * 3'}
          - {line: 6, kind: move, from: {line: 5, at: '= x − 2'}, at: '= x − 2', text: '2 * x'}
        doodle_do:
          - {id: slots, op: arrow, part: run1-out, to_part: run2-out, text: equal}
      - say: 'Collect like terms, with the $x$ terms on the left and the numbers on the right. Each term changes its sign as it crosses the equals sign.'
        write: '$2x - x = -2 + 3$'
      - say: '$2x$ minus $x$ is $x$, and minus 2 plus 3 is 1.'
        write: '$\therefore x = 1$'
      - section: 'Check'
        say: 'To check, 1 star 3 is 1 times 3, minus 3, minus 1, which is minus 1. 2 star 1 is 2 times 1, minus 1, minus 2, also minus 1.'
        write: 'Check: $1 * 3 = 3 - 3 - 1 = -1,\ \ 2 * 1 = 2 - 1 - 2 = -1\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore $x$ is 1, which is option C.'
        write: '$\therefore x = 1$'
        answer: true
    traps:
      A: 'You went for minus 1. That is the value of 1 star 3, and of 2 star 1, not the value of $x$. Solving $2x - 3 = x - 2$ gives $x = 1$.'
      B: 'You went for 0. Test it: 0 star 3 is 0 minus 3 minus 0, which is minus 3, but 2 star 0 is 0 minus 0 minus 2, which is minus 2. They are not equal.'
      D: 'You went for 5. Test it: 5 star 3 is 15 minus 3 minus 5, which is 7, but 2 star 5 is 10 minus 5 minus 2, which is 3. Solving $2x - 3 = x - 2$ gives $x = 1$.'

  23:
    moments:
      - section: 'The question'
        say: 'A 3 by 3 determinant with $x$ in some entries. We want it as an expression in $x$. Expand along the first row, the textbook way.'
        write: '$\begin{vmatrix} x & 1 & 0 \\ 1 - x & 2 & 3 \\ 1 & 1 + x & 4 \end{vmatrix}$'
        doodle: {name: 'custom:1998_q23_a', id: grid, caption: 'cover a row and a column'}
      - section: 'Solution'
        say: 'Solution. The first row is $x$, 1 and 0, with the signs plus, minus, plus. Each entry multiplies its minor, which is the 2 by 2 left when we cover its row and column.'
        write: 'Solution: $x\begin{vmatrix} 2 & 3 \\ 1 + x & 4 \end{vmatrix} - 1\begin{vmatrix} 1 - x & 3 \\ 1 & 4 \end{vmatrix} + 0\begin{vmatrix} 1 - x & 2 \\ 1 & 1 + x \end{vmatrix}$'
        doodle_do:
          - {id: grid, op: stage, stage: 'custom:1998_q23_a2', 'on': 'cover'}
      - say: 'A 2 by 2 determinant is $ad$ minus $bc$. Apply it to each minor, with every entry in brackets. The last term is 0 times its minor, so it is 0.'
        write: '$= x[(2)(4) - (3)(1 + x)] - 1[(1 - x)(4) - (3)(1)] + 0$'
        doodle_do:
          - {id: grid, op: stage, stage: 'custom:1998_q23_a3', 'on': 'each minor'}
      - say: 'Inside the first bracket, 2 times 4 is 8, and 3 times $1 + x$ is $3 + 3x$. Inside the second, 4 times $1 - x$ is $4 - 4x$, and 3 times 1 is 3.'
        write: '$= x[8 - 3 - 3x] - 1[4 - 4x - 3]$'
      - say: '8 minus 3 is 5. 4 minus 3 is 1.'
        write: '$= x(5 - 3x) - 1(1 - 4x)$'
      - say: 'Open the brackets. $x$ times 5 is $5x$, and $x$ times negative $3x$ is negative $3x^{2}$. Minus 1 times $1 - 4x$ is negative 1 plus $4x$.'
        write: '$= 5x - 3x^{2} - 1 + 4x$'
      - say: 'Collect like terms, in descending powers of $x$. $5x$ plus $4x$ is $9x$.'
        write: '$\therefore\ \text{determinant} = -3x^{2} + 9x - 1$'
      - section: 'Check'
        say: 'Check with $x$ equals 1. The matrix becomes 1, 1, 0, then 0, 2, 3, then 1, 2, 4. Expanding, 1 times 8 minus 6, minus 1 times 0 minus 3, is 2 plus 3, which is 5.'
        write: 'Check, $x = 1$: $1(8 - 6) - 1(0 - 3) + 0 = 5$'
      - say: 'Our expression at $x$ equals 1 gives negative 3 plus 9 minus 1, which is also 5.'
        write: '$-3(1)^{2} + 9(1) - 1 = 5\ \checkmark$'
      - say: 'Therefore the determinant is $-3x^{2} + 9x - 1$, which is answer choice B.'
        write: '$\therefore\ \text{determinant} = -3x^{2} + 9x - 1$'
        answer: true
    traps:
      A: 'You went for $-3x^{2} - 17$. The $x$ terms have vanished and the constant is wrong. The two minors are $5 - 3x$ and $1 - 4x$, and $x(5 - 3x) - (1 - 4x)$ is $-3x^{2} + 9x - 1$.'
      C: 'You went for $3x^{2} + 17$. The $x^{2}$ term should be negative: $x$ times negative $3x$ is negative $3x^{2}$. Work each minor carefully and keep the minus sign on the middle term.'
      D: 'You went for $3x^{2} - 9x + 5$. The signs of the $x^{2}$ and $x$ terms are the wrong way round, and the constant is off. Expanding along the first row gives $x(5 - 3x) - (1 - 4x)$, which is $-3x^{2} + 9x - 1$.'

  24:
    moments:
      - section: 'The question'
        say: '$PQ$ equals $I$, the identity matrix. When a product of two matrices is the identity, each one is the inverse of the other. So $Q$ is $P$ inverse.'
        write: '$\begin{pmatrix} 2 & 3 \\ 4 & 5 \end{pmatrix}\begin{pmatrix} u & 4 + u \\ -2v & v \end{pmatrix} = \begin{pmatrix} 1 & 0 \\ 0 & 1 \end{pmatrix}$'
        doodle: {name: 'custom:1998_q24_a', id: grid, caption: 'P times Q gives I', size: scene}
      - section: 'Solution'
        say: 'Solution. Since $PQ$ equals $I$, $Q$ is the inverse of $P$. We find $P$ inverse, then match it with $Q$, entry by entry.'
        write: 'Solution: $PQ = I \Rightarrow Q = P^{-1}$'
      - say: 'First the determinant of $P$, which is $ad$ minus $bc$. 2 times 5 is 10, and 3 times 4 is 12.'
        write: '$|P| = (2)(5) - (3)(4) = 10 - 12 = -2$'
      - say: 'For the adjoint, swap the entries on the leading diagonal, 2 and 5, and change the signs of the other two, 3 and 4.'
        write: '$\text{adj } P = \begin{pmatrix} 5 & -3 \\ -4 & 2 \end{pmatrix}$'
      - say: 'The inverse is 1 over the determinant times the adjoint. The determinant is negative 2.'
        write: '$P^{-1} = \dfrac{1}{|P|}\,\text{adj } P = -\dfrac{1}{2}\begin{pmatrix} 5 & -3 \\ -4 & 2 \end{pmatrix}$'
      - say: 'Divide each entry by negative 2. 5 becomes negative 5 over 2, negative 3 becomes 3 over 2, negative 4 becomes 2, and 2 becomes negative 1.'
        write: '$= \begin{pmatrix} -\tfrac{5}{2} & \tfrac{3}{2} \\ 2 & -1 \end{pmatrix}$'
      - section: 'Match the entries'
        say: 'Now $Q$ equals $P$ inverse, so matching entries are equal.'
        write: '$\begin{pmatrix} u & 4 + u \\ -2v & v \end{pmatrix} = \begin{pmatrix} -\tfrac{5}{2} & \tfrac{3}{2} \\ 2 & -1 \end{pmatrix}$'
      - say: 'From the top-left entries, $u$ is negative 5 over 2. From the bottom-right entries, $v$ is negative 1.'
        write: '$u = -\tfrac{5}{2},\quad v = -1$'
      - say: 'Therefore $u$, $v$ is negative 5 over 2, negative 1.'
        write: '$\therefore\ (u, v) = \left(-\tfrac{5}{2}, -1\right)$'
      - section: 'Check'
        say: 'Check the other two entries of $Q$. Its top right, $4 + u$, is 4 minus 5 over 2, which is 3 over 2. Its bottom left, negative $2v$, is 2. Both match.'
        write: 'Check: $4 + u = 4 - \tfrac{5}{2} = \tfrac{3}{2}\ \checkmark,\quad -2v = -2(-1) = 2\ \checkmark$'
      - say: 'Multiply back, row by column. Row 1 of $P$ times column 1 of $Q$ gives 2 times negative 5 over 2, plus 3 times 2, which is negative 5 plus 6, or 1.'
        write: 'Row 1 × column 1: $2\left(-\tfrac{5}{2}\right) + 3(2) = -5 + 6 = 1\ \checkmark$'
        doodle_do:
          - {id: grid, op: highlight, part: row1, 'on': 'Row 1'}
          - {id: grid, op: highlight, part: col1, 'on': 'column 1'}
      - say: 'Row 2 times column 1 gives 4 times negative 5 over 2, plus 5 times 2, which is negative 10 plus 10, or 0. Both match the identity.'
        write: 'Row 2 × column 1: $4\left(-\tfrac{5}{2}\right) + 5(2) = -10 + 10 = 0\ \checkmark$'
        doodle_do:
          - {id: grid, op: stage, stage: 'custom:1998_q24_a2', 'on': 'Row 2'}
      - say: 'Therefore $u$, $v$ is negative 5 over 2, negative 1, which is answer choice A.'
        write: '$\therefore\ (u, v) = \left(-\tfrac{5}{2}, -1\right)$'
        answer: true
    traps:
      B: 'You went for negative 5 over 2, 3 over 2. The $u$ is right, but 3 over 2 is $4 + u$, the top-right entry of $Q$, not $v$. The bottom-right entry of $P^{-1}$ is negative 1, so $v = -1$.'
      C: 'You went for negative 5 over 6, and 1. The determinant of $P$ is 10 minus 12, which is negative 2, so every entry of the adjoint is divided by negative 2. That gives $u = -\tfrac{5}{2}$ and $v = -1$.'
      D: 'You went for 5 over 2, 2 over 3. The signs are lost: the determinant is negative 2, so 5 divided by negative 2 is negative 5 over 2. And $v$ is the bottom-right entry, 2 divided by negative 2, which is negative 1.'

  25:
    moments:
      - section: 'The question'
        say: 'A diameter, two straight lines meeting outside the circle, and angles of 35 and 30 degrees. Many students copy one of them across. Let''s find angle $QSR$, with a reason on every line.'
        write: '$PR$ a diameter; $PST$, $QRT$ straight; find $\angle QSR$'
        point:
          - {figure: 0, kind: highlight, target: PR, text: 'diameter'}
      - section: 'Solution'
        say: 'Solution. The givens on the diagram are angle $TPR$, 35 degrees at $P$, and angle $PTR$, 30 degrees at $T$.'
        write: 'Solution: $\angle TPR = 35^{\circ},\ \angle PTR = 30^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: TPR, text: '35°'}
          - {figure: 0, kind: arc, target: PTR, text: '30°'}
      - say: '$Q$, $R$ and $T$ are on a straight line, so angle $PRQ$ is the exterior angle of triangle $PRT$ at $R$. It equals the two interior opposite angles added.'
        write: '$\angle PRQ = 35^{\circ} + 30^{\circ}$ (ext. $\angle$ of $\triangle$)'
        point:
          - {figure: 0, kind: arc, target: PRQ}
      - say: '35 plus 30 is 65.'
        write: '$= 65^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: PRQ, text: '65°'}
      - say: '$PR$ is a diameter, so the angle it makes at $Q$, on the circle, is 90 degrees. The reason is the angle in a semicircle.'
        write: '$\angle PQR = 90^{\circ}$ ($\angle$ in a semicircle)'
        point:
          - {figure: 0, kind: arc, target: PQR, text: '90°'}
      - say: 'In triangle $PQR$ the angles add up to 180, so angle $QPR$ is 180 minus 90 minus 65.'
        write: '$\angle QPR = 180^{\circ} - (90^{\circ} + 65^{\circ})$ ($\angle$ sum of $\triangle$)'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '= [[65∘]]'}, at: '+ 65∘', text: 'angle PRQ'}
      - say: '90 plus 65 is 155, and 180 minus 155 is 25.'
        write: '$= 180^{\circ} - 155^{\circ} = 25^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: QPR, text: '25°'}
      - say: 'Angle $QSR$ at $S$ and angle $QPR$ at $P$ both stand on the chord $QR$, on the same side. The reason is that angles in the same segment are equal.'
        write: '$\angle QSR = \angle QPR = 25^{\circ}$ ($\angle$s in the same segment)'
        point:
          - {figure: 0, kind: highlight, target: QR, text: 'chord QR'}
          - {figure: 0, kind: label, target: '?', text: '25°'}
      - section: 'Check'
        say: 'Check with the cyclic quadrilateral $PQRS$. Angle $PSR$ is 90, so angle $PRS$ is 180 minus 90 minus 35, which is 55. Then angle $QRS$ is 65 plus 55, which is 120.'
        write: 'Check: $\angle PRS = 55^{\circ}$, so $\angle QRS = 65^{\circ} + 55^{\circ} = 120^{\circ}$'
      - say: 'Opposite angles must add up to 180. Angle $QPS$ is 25 plus 35, which is 60, and 60 plus 120 is 180. It agrees.'
        write: '$\angle QPS + \angle QRS = 60^{\circ} + 120^{\circ} = 180^{\circ}$ (opp. $\angle$s of a cyclic quad.) $\checkmark$'
      - say: 'Therefore angle $QSR$ is 25 degrees, which is option B.'
        write: '$\therefore \angle QSR = 25^{\circ}$'
        answer: true
    traps:
      A: 'You went for 20 degrees. Check triangle $PQR$: 180 minus 90 minus 65 is 25, not 20. And angle $QSR$ equals angle $QPR$, since they are in the same segment.'
      C: 'You went for 30 degrees. That is the angle at $T$, outside the circle. Angle $QSR$ equals angle $QPR$, and triangle $PQR$ gives that as 25 degrees.'
      D: 'You went for 35 degrees. That angle at $P$ stands on the chord $SR$, not on $QR$. The angle standing on $QR$ is angle $QPR$, which is 25 degrees.'

  26:
    moments:
      - section: 'The question'
        say: 'A bent line between two parallel lines. Many students add or subtract the 120 and 130 directly. The Nigerian classroom trick is to draw a third parallel line through the bend.'
        write: '$PQ \parallel ST$, $\angle PQR = 120^{\circ}$, $\angle RST = 130^{\circ}$; find $x$'
        point:
          - {figure: 0, kind: arc, target: PQR, text: '120°'}
          - {figure: 0, kind: arc, target: RST, text: '130°'}
          - {figure: 0, kind: circle, target: x, text: 'find'}
      - section: 'Solution'
        say: 'Solution. Let me re-draw the diagram, and through $R$ draw the line $URV$ parallel to $PQ$ and $ST$.'
        show_sketch: true
        write: 'Solution: draw $URV \parallel PQ \parallel ST$ through $R$'
        point:
          - {figure: sketch, kind: highlight, target: UV, text: 'construction line'}
      - say: '$PQ$ is parallel to $UR$, and $QR$ crosses both. Angles $PQR$ and $QRU$ are on the same side, between the parallels, so they are co-interior angles, which add up to 180.'
        write: '$\angle PQR + \angle QRU = 180^{\circ}$ (co-int. $\angle$s, $PQ \parallel UR$)'
        point:
          - {figure: sketch, kind: arc, target: PQR, text: '120°'}
          - {figure: sketch, kind: arc, target: QRU}
      - say: 'So angle $QRU$ is 180 minus 120, which is 60.'
        write: '$\angle QRU = 180^{\circ} - 120^{\circ} = 60^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: QRU, text: '60°'}
      - say: 'In the same way, $ST$ is parallel to $RV$, and $RS$ crosses both. Angles $RST$ and $SRV$ are co-interior, so they add up to 180.'
        write: '$\angle RST + \angle SRV = 180^{\circ}$ (co-int. $\angle$s, $ST \parallel RV$)'
        point:
          - {figure: sketch, kind: arc, target: RST, text: '130°'}
          - {figure: sketch, kind: arc, target: SRV}
      - say: 'So angle $SRV$ is 180 minus 130, which is 50.'
        write: '$\angle SRV = 180^{\circ} - 130^{\circ} = 50^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: SRV, text: '50°'}
      - say: 'At $R$, the 60, then $x$, then the 50 sit side by side on the straight line $URV$. Angles on a straight line add up to 180.'
        write: '$60^{\circ} + x + 50^{\circ} = 180^{\circ}$ ($\angle$s on a str. line)'
        point:
          - {line: 6, kind: move, from: {line: 3, at: '= [[60∘]]'}, at: '[[60∘]] +', text: 'QRU'}
          - {line: 6, kind: move, from: {line: 5, at: '= [[50∘]]'}, at: '+ 50∘', text: 'SRV'}
      - say: '60 plus 50 is 110, so $x$ plus 110 is 180.'
        write: '$x + 110^{\circ} = 180^{\circ}$'
      - say: 'Subtract 110 from both sides. 180 minus 110 is 70.'
        write: '$x = 180^{\circ} - 110^{\circ} = 70^{\circ}$'
        point:
          - {figure: sketch, kind: label, target: x, text: '70°'}
      - section: 'Check'
        say: 'To check, put the three angles at $R$ back together. 60 plus 70 plus 50 is 180, a straight line.'
        write: 'Check: $60^{\circ} + 70^{\circ} + 50^{\circ} = 180^{\circ}\ \checkmark$'
      - say: 'Therefore $x$ is 70 degrees, which is option C.'
        write: '$\therefore x = 70^{\circ}$'
        answer: true
    traps:
      A: 'You went for 50 degrees. That is angle $SRV$, the part next to $S$. $x$ is what is left of the straight line after both the 60 and the 50: 180 minus 110 is 70.'
      B: 'You went for 65 degrees. That does not come from the angles given. Co-interior angles give 60 and 50 at $R$, and $x$ is 180 minus 60 minus 50, which is 70.'
      D: 'You went for 80 degrees. Check the co-interior angles: 180 minus 120 is 60, and 180 minus 130 is 50. Then $x$ is 180 minus 60 minus 50, which is 70.'

  27:
    moments:
      - section: 'The question'
        say: 'A trapezium made of a parallelogram and a triangle. Many students halve or double the answer. Get the height from the triangle, then add the two areas.'
        write: '$TS = 10$ cm, $SR = 8$ cm, area of $\triangle QRS = 20\ \text{cm}^{2}$; area of $PQRT = ?$'
        point:
          - {figure: 0, kind: highlight, target: TS, text: '10 cm'}
          - {figure: 0, kind: highlight, target: SR, text: '8 cm'}
          - {figure: 0, kind: circle, target: '20 cm²'}
      - section: 'Solution'
        say: 'Solution. Start with triangle $QRS$, whose area is given. Its base is $SR$, 8 cm. Let its height, from $Q$ down to $TR$, be $h$.'
        write: 'Solution. In $\triangle QRS$: base $SR = 8$ cm; let the height be $h$'
        point:
          - {figure: 0, kind: underline, target: SR, text: 'base 8'}
      - say: 'The area of a triangle is half the base times the height.'
        write: 'Area of $\triangle = \dfrac{1}{2} \times \text{base} \times \text{height}$'
      - say: 'Substitute the area 20 and the base 8.'
        write: '$20 = \dfrac{1}{2} \times 8 \times h$'
      - say: 'Half of 8 is 4, so 20 equals $4h$. Divide both sides by 4, and $h$ is 5.'
        write: '$20 = 4h \Rightarrow h = 5$ cm'
      - say: '$PQ$ is parallel to $TR$, so $PQ$ stays 5 cm above $TR$ all the way along. The parallelogram has the same height.'
        write: 'Height of $PQST = 5$ cm ($PQ \parallel TR$)'
        point:
          - {figure: 0, kind: highlight, target: PQ}
          - {figure: 0, kind: highlight, target: TR, text: 'parallel'}
      - say: 'The area of a parallelogram is base times height. Its base $TS$ is 10, and 10 times 5 is 50.'
        write: 'Area of $PQST = \text{base} \times \text{height} = 10 \times 5 = 50\ \text{cm}^{2}$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: 'h = [[5]]'}, at: '× [[5]] =', text: 'h'}
          - {figure: 0, kind: label, target: {x: 135, y: 170}, text: '50 cm²'}
      - say: 'The trapezium is the parallelogram plus the triangle. 50 plus 20 is 70.'
        write: 'Area of $PQRT = 50 + 20 = 70\ \text{cm}^{2}$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '= [[50]] cm'}, at: '[[50]] +', text: 'parallelogram'}
      - section: 'Check'
        say: 'Check with the trapezium formula. $PQ$ equals $TS$, 10, because opposite sides of a parallelogram are equal. $TR$ is 10 plus 8, which is 18.'
        write: 'Check: $PQ = TS = 10$ (opp. sides of //gm); $\ TR = 10 + 8 = 18$'
      - say: 'The area of a trapezium is half the sum of the parallel sides, times the height. 10 plus 18 is 28, half of 28 is 14, and 14 times 5 is 70.'
        write: 'Area $= \dfrac{1}{2}(10 + 18) \times 5 = 14 \times 5 = 70\ \text{cm}^{2}\ \checkmark$'
      - say: 'Therefore the area of the trapezium is 70 square centimetres, which is option C.'
        write: '$\therefore$ area of $PQRT = 70\ \text{cm}^{2}$'
        answer: true
    traps:
      A: 'You went for 35. That is half the answer, as if the whole shape were a triangle. The parallelogram is 10 times 5, 50, and adding the triangle''s 20 gives 70.'
      B: 'You went for 65. Check the height: from half of 8 times $h$ equals 20, $h$ is 5. The parallelogram is 50 and the triangle 20, so the total is 70.'
      D: 'You went for 140. That is double the answer. The trapezium is half of 10 plus 18, times 5, which is 70; don''t forget the half.'

  28:
    moments:
      - section: 'The question'
        say: 'A tangent, a cyclic quadrilateral and two small angles. Many students take 180 minus just one of them. Two theorems, one after the other, give angle $YTR$.'
        write: '$TQ$ tangent at $T$; find $\angle YTR$'
        point:
          - {figure: 0, kind: highlight, target: TQ, text: 'tangent'}
      - section: 'Solution'
        say: 'Solution. The givens on the diagram are angle $YXT$, which is 32 degrees, and angle $RTQ$, which is 40 degrees.'
        write: 'Solution: $\angle YXT = 32^{\circ},\ \angle RTQ = 40^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: YXT, text: '32°'}
          - {figure: 0, kind: arc, target: RTQ, text: '40°'}
      - say: 'Angle $RTQ$ is between the tangent $TQ$ and the chord $TR$. It equals the angle $TR$ makes at $X$, in the other segment. The reason is the alternate segment theorem.'
        write: '$\angle TXR = \angle RTQ = 40^{\circ}$ (alt. segment theorem)'
        point:
          - {figure: 0, kind: highlight, target: TR, text: 'chord'}
          - {figure: 0, kind: arc, target: TXR, text: '40°'}
      - say: 'The whole angle of the quadrilateral at $X$ is made of the two parts, 32 and 40.'
        write: '$\angle YXR = \angle YXT + \angle TXR = 32^{\circ} + 40^{\circ}$'
      - say: '32 plus 40 is 72.'
        write: '$= 72^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: YXR, text: '72°'}
      - say: '$X$, $Y$, $T$ and $R$ are on the circle, so $XYTR$ is a cyclic quadrilateral. Its opposite angles, at $X$ and $T$, add up to 180.'
        write: '$\angle YTR + \angle YXR = 180^{\circ}$ (opp. $\angle$s of a cyclic quad.)'
        point:
          - {figure: 0, kind: arc, target: YTR}
      - say: 'Substitute 72 degrees for angle $YXR$.'
        write: '$\angle YTR = 180^{\circ} - 72^{\circ}$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '= [[72∘]]'}, at: '− 72∘', text: 'angle at X'}
      - say: '180 minus 72 is 108.'
        write: '$= 108^{\circ}$'
        point:
          - {figure: 0, kind: label, target: '?', text: '108°'}
      - section: 'Check'
        say: 'To check, 108 is obtuse and 72 is acute, as opposite angles of a cyclic quadrilateral must be when they are not both 90. And 108 plus 72 is 180.'
        write: 'Check: $108^{\circ} + 72^{\circ} = 180^{\circ}\ \checkmark$'
      - say: 'Therefore angle $YTR$ is 108 degrees, which is option A.'
        write: '$\therefore \angle YTR = 108^{\circ}$'
        answer: true
    traps:
      B: 'You went for 121 degrees. That does not come from the circle facts. The alternate segment theorem moves the 40 to $X$; add the 32 to get 72, and the opposite angle is 180 minus 72, which is 108.'
      C: 'You went for 140 degrees. That is 180 minus 40, which uses only the tangent angle. The angle at $X$ is 32 plus 40, which is 72, so the opposite angle is 108.'
      D: 'You went for 148 degrees. That is 180 minus 32, which uses only the 32. The alternate segment theorem adds another 40 at $X$, making 72, so the answer is 180 minus 72, which is 108.'

  29:
    moments:
      - section: 'The question'
        say: 'A chord makes 60 degrees at the circumference of a circle of radius root 3. Many students take the chord to be the radius. Circle theorems first, then the chord.'
        write: '$r = \sqrt{3}$ cm, $\angle$ at circumference $= 60^{\circ}$; find the chord'
      - section: 'Solution'
        say: 'Solution. Let me sketch the circle, centre $O$, with the chord $AB$ and the 60 degree angle at $C$ on the circumference.'
        show_sketch: true
        write: 'Solution: $\angle ACB = 60^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: ACB, text: '60°'}
          - {figure: sketch, kind: underline, target: 'radius √3 cm'}
      - say: 'Join $O$ to $A$ and to $B$. Angle $AOB$ at the centre stands on the same arc as angle $ACB$. The reason is that the angle at the centre is twice the angle at the circumference.'
        show_sketch: sketch_b
        write: '$\angle AOB = 2 \times 60^{\circ} = 120^{\circ}$ ($\angle$ at centre $= 2 \times \angle$ at circumference)'
        point:
          - {figure: sketch_b, kind: arc, target: AOB, text: '120°'}
      - say: '$OA$ and $OB$ are both radii, root 3 each. So triangle $AOB$ is isosceles, and its base angles are equal.'
        write: '$OA = OB = \sqrt{3}$ (radii)'
        point:
          - {figure: sketch_b, kind: highlight, target: OA}
          - {figure: sketch_b, kind: highlight, target: OB}
      - say: 'The base angles share 180 minus 120, which is 60. So each is 30 degrees.'
        write: '$\angle OAB = \dfrac{180^{\circ} - 120^{\circ}}{2} = 30^{\circ}$ (base $\angle$s of isos. $\triangle$)'
        point:
          - {figure: sketch_b, kind: arc, target: OAB, text: '30°'}
      - say: 'Draw $OM$ perpendicular to the chord. The perpendicular from the centre bisects the chord, so $AM$ equals $MB$.'
        write: '$OM \perp AB \Rightarrow AM = MB$ ($\perp$ from centre bisects chord)'
        point:
          - {figure: sketch_b, kind: label, target: {x: 160, y: 177.5}, text: 'M'}
      - say: 'In the right-angled triangle $OAM$, $AM$ is next to the 30 degree angle, and $OA$ is the hypotenuse. By SOH CAH TOA, cos 30 is adjacent over hypotenuse.'
        write: '$\cos 30^{\circ} = \dfrac{AM}{OA}$ (CAH)'
      - say: 'So $AM$ is root 3 times cos 30. Cos 30 is root 3 over 2, and root 3 times root 3 is 3.'
        write: '$AM = \sqrt{3} \times \dfrac{\sqrt{3}}{2} = \dfrac{3}{2}$'
      - say: '$M$ is the midpoint, so the chord is twice $AM$, that is 2 times 3 over 2, which is 3.'
        write: '$AB = 2 \times \dfrac{3}{2} = 3$ cm'
        point:
          - {figure: sketch_b, kind: label, target: '?', text: '3 cm'}
      - section: 'Check'
        say: 'Check with the cosine rule in triangle $AOB$. We get 3 plus 3, minus 2 times 3 times cos 120. Cos 120 is negative a half, so that is 6 plus 3, which is 9, and root 9 is 3.'
        write: 'Check: $AB^{2} = 3 + 3 - 2(3)\cos 120^{\circ} = 6 + 3 = 9\ \checkmark$'
      - say: 'Therefore the chord is 3 cm long, which is option D.'
        write: '$\therefore$ chord $AB = 3$ cm'
        answer: true
    traps:
      A: 'You went for root 3 over 2. That is $\sin 60^{\circ}$, not a length. Half the chord, $AM$, is root 3 times cos 30, which is 3 over 2, so the chord is 3 cm.'
      B: 'You went for 3 over 2 cm. That is $AM$, half the chord. $M$ is the midpoint, so the chord is twice that: 3 cm.'
      C: 'You went for root 3 cm, the radius itself. That would be right if the angle at the centre were 60 degrees. The 60 is at the circumference, so the angle at the centre is 120 and the chord is 3 cm.'

  30:
    moments:
      - section: 'The question'
        say: 'A drum of oil is a cylinder. We know how much it holds and how wide it is, so the cylinder formula, used backwards, gives its height.'
        write: 'Find the height of the drum in cm.'
      - say: 'Write Solution, then sketch the drum, with the diameter 56 cm across the top and the 123.2 litres inside.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: underline, target: '56 cm', text: 'diameter', 'on': 'diameter 56'}
          - {figure: sketch, kind: circle, target: '123.2 litres', text: 'volume', 'on': 'litres inside'}
      - section: 'What we know'
        say: 'List the givens. The diameter d is 56 cm, the volume V is 123.2 litres, and pi is 22 over 7.'
        write: '$d = 56$ cm, $V = 123.2$ litres, $\pi = \dfrac{22}{7}$'
      - say: 'The formula needs the radius, not the diameter. The radius is half the diameter, so 56 over 2 is 28.'
        write: '$r = \dfrac{56}{2} = 28$ cm'
      - say: 'Convert units first. 1 litre fills a cube 10 cm on each side, and 10 times 10 times 10 is 1000. So 1 litre is 1000 cubic centimetres.'
        write: '$1$ litre $= 1000\ \text{cm}^{3}$'
        doodle: {name: 'custom:1998_q30_a', id: litre, caption: '1 litre fills a 10 cm cube: 1000 cm³'}
        doodle_do:
          - {id: litre, op: circle, part: cube, text: '10 × 10 × 10', 'on': 'cube'}
      - say: 'So the drum holds 123.2 times 1000, which is 123,200 cubic centimetres.'
        write: '$V = 123.2 \times 1000 = 123{,}200\ \text{cm}^{3}$'
        doodle_do:
          - {id: litre, op: label, part: carton, text: '123.2 litres = 123,200 cm³', 'on': '123,200'}
      - say: 'Let the height of the drum be h centimetres.'
        write: 'Let the height be $h$ cm'
        point:
          - {figure: sketch, kind: circle, target: 'h = ?', text: 'h', 'on': 'height'}
      - section: 'The formula'
        say: 'Volume of a cylinder is V equals pi r squared h, which is the base area, pi r squared, times the height.'
        write: '$V = \pi r^{2}h$'
        'on': 'Volume of a cylinder'
      - say: 'Now substitute. V is 123,200, pi is 22 over 7, and r is 28.'
        write: '$123{,}200 = \dfrac{22}{7} \times 28 \times 28 \times h$'
      - section: 'Simplify'
        say: 'Cancel the 7, because 7 goes into 28 four times. That leaves 22 times 4 times 28.'
        write: '$123{,}200 = 22 \times 4 \times 28 \times h$'
      - say: '22 times 4 is 88, and 88 times 28 is 2464.'
        write: '$123{,}200 = 2464h$'
      - say: 'Divide both sides by 2464, the number beside h.'
        write: '$h = \dfrac{123{,}200}{2464}$'
      - say: 'By long division, 2464 goes into 12,320 exactly 5 times, and the last 0 comes down. So the answer is 50.'
        write: '$= 50$'
      - say: 'Therefore the height of the drum is 50 centimetres.'
        write: '$\therefore h = 50$ cm'
        point:
          - {figure: sketch, kind: label, target: 'h = ?', text: '50 cm', 'on': 'Therefore'}
      - section: 'Check'
        say: 'Check by putting 50 back. 2464 times 50 is 123,200 cubic centimetres, which is 123.2 litres.'
        write: 'Check: $2464 \times 50 = 123{,}200\ \text{cm}^{3} = 123.2$ litres ✓'
      - section: 'Answer'
        say: 'So the drum is 50.0 centimetres high, which is answer choice D.'
        write: '$\therefore$ height $= 50.0$ cm (D)'
        answer: true
    traps:
      A: 'You went for 12.5. That uses 56 as the radius, which makes r squared 4 times too big and the height 4 times too small. The radius is 56 over 2, which is 28, and the height is 50 cm.'
      B: 'You went for 25.0, half the answer. 22 over 7 times 28 times 28 is 2464, and 123,200 divided by 2464 is 50, not 25.'
      C: 'You went for 45.0. Check it: 2464 times 45 is only 110,880. 2464 times 50 is exactly 123,200, so the height is 50 cm.'

  31:
    moments:
      - section: 'The question'
        say: 'A locus 8 cm from a point, and a point $S$ equidistant from $T$ and $N$. Name the locus first, and the triangle shows its shape. Many students give 32 here.'
        write: 'Locus: $8$ cm from $N$, through $T$ and $S$; $\ ST = SN$'
      - section: 'Solution'
        say: 'Solution. Let me sketch the locus with $N$, $S$ and $T$.'
        show_sketch: true
        write: 'Solution'
        point:
          - {figure: sketch, kind: underline, target: 'locus: 8 cm from N'}
      - say: 'Name the standard locus. Points a fixed distance from a fixed point lie on a circle. Here it is a circle, centre $N$, radius 8 cm.'
        write: 'Locus $=$ circle, centre $N$, radius $8$ cm'
      - say: '$T$ and $S$ are on the circle, so $NT$ and $NS$ are radii, 8 cm each.'
        write: '$NT = NS = 8$ cm (radii)'
        point:
          - {figure: sketch, kind: highlight, target: NT}
          - {figure: sketch, kind: highlight, target: NS}
      - say: '$S$ is equidistant from $T$ and $N$, so $ST$ equals $SN$, which is 8 cm.'
        write: '$ST = SN = 8$ cm (given)'
        point:
          - {figure: sketch, kind: highlight, target: ST, text: '8 cm'}
      - say: 'All three sides are 8 cm, so triangle $STN$ is equilateral, and each angle is 60 degrees.'
        write: '$\triangle STN$ is equilateral: $\angle TNS = 60^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: TNS, text: '60°'}
      - say: 'The area of a triangle is a half times two sides times the sine of the angle between them.'
        write: 'Area $= \tfrac{1}{2}ab\sin C$'
      - say: 'Substitute $a$ and $b$ as 8 and 8, and $C$ as 60 degrees.'
        write: '$= \tfrac{1}{2} \times 8 \times 8 \times \sin 60^{\circ}$'
      - say: 'A half times 8 times 8 is 32, and sin 60 is root 3 over 2.'
        write: '$= 32 \times \dfrac{\sqrt{3}}{2} = 16\sqrt{3}$'
      - section: 'Check'
        say: 'Check with the equilateral triangle formula, which is root 3 over 4, times the side squared. 64 over 4 is 16, so it is 16 root 3.'
        write: 'Check: $\dfrac{\sqrt{3}}{4} \times 8^{2} = 16\sqrt{3}\ \checkmark$'
      - say: 'Therefore the area of triangle $STN$ is 16 root 3 square centimetres, which is option B.'
        write: '$\therefore$ area of $\triangle STN = 16\sqrt{3}\ \text{cm}^{2}$'
        answer: true
        point:
          - {figure: sketch, kind: label, target: '?', text: '16√3 cm²'}
    traps:
      A: 'You went for 4 root 3. That is the height of the triangle, not its area. The area is a half times 8 times 4 root 3, which is 16 root 3.'
      C: 'You went for 32. That is a half times 8 times 8, as if the angle were 90 degrees. The angle is 60 degrees, so we multiply by $\sin 60^{\circ}$ and get 16 root 3.'
      D: 'You went for 64. That is 8 squared, the area of a square of side 8. The triangle is equilateral, so its area is root 3 over 4 times 64, which is 16 root 3.'

  32:
    moments:
      - section: 'The question'
        say: 'The distance between the points $x$, 3 and negative $x$, 2 is 5 units. We want $x$.'
        write: '$(x,\ 3)$ and $(-x,\ 2)$; distance $= 5$; $x = ?$'
      - section: 'Solution'
        say: 'Solution. Let me plot the two points, 5 units apart.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '(x, 3)'}
          - {figure: sketch, kind: circle, target: '(−x, 2)'}
          - {figure: sketch, kind: circle, target: '5', text: 'distance'}
      - say: 'Label the points first. Let $x$ 1, $y$ 1 be negative $x$, 2, and $x$ 2, $y$ 2 be $x$, 3.'
        write: 'Let $(x_{1},\ y_{1}) = (-x,\ 2)$ and $(x_{2},\ y_{2}) = (x,\ 3)$'
      - section: 'The formula'
        say: 'The distance formula is the square root of $x$ 2 minus $x$ 1 squared, plus $y$ 2 minus $y$ 1 squared.'
        write: '$d = \sqrt{(x_{2} - x_{1})^{2} + (y_{2} - y_{1})^{2}}$'
      - say: 'Substitute, with negative $x$ in a bracket, and $d$ equal to 5.'
        write: '$5 = \sqrt{(x - (-x))^{2} + (3 - 2)^{2}}$'
      - say: '$x$ minus negative $x$ is $x$ plus $x$, which is $2x$, not 0. And 3 minus 2 is 1.'
        write: '$5 = \sqrt{(2x)^{2} + 1^{2}}$'
        point:
          - {figure: sketch, kind: circle, target: '2x'}
          - {figure: sketch, kind: circle, target: '1'}
      - say: '$2x$ squared is $4x$ squared, and 1 squared is 1.'
        write: '$5 = \sqrt{4x^{2} + 1}$'
      - section: 'Solve'
        say: 'Square both sides to remove the root. 5 squared is 25.'
        write: '$25 = 4x^{2} + 1$'
      - say: 'Subtract 1 from both sides. 25 minus 1 is 24.'
        write: '$4x^{2} = 24$'
      - say: 'Divide both sides by 4. 24 over 4 is 6.'
        write: '$x^{2} = 6$'
      - say: 'Take the square root of both sides. Remember the plus or minus.'
        write: '$\therefore\ x = \pm\sqrt{6}$'
      - section: 'Check'
        say: 'Check with $x$ equals root 6. $2x$ squared is 4 times 6, which is 24. 24 plus 1 is 25, and the square root of 25 is 5.'
        write: 'Check: $\sqrt{(2\sqrt{6})^{2} + 1} = \sqrt{24 + 1} = 5\ \checkmark$'
      - say: 'Only the positive value is among the options. Therefore $x$ is root 6, which is answer choice C.'
        write: '$\therefore\ x = \sqrt{6}$'
        answer: true
        point:
          - {figure: sketch, kind: label, target: 'x = ?', text: '√6'}
    traps:
      A: 'You went for 6. That is $x$ squared, not $x$. The last step is the square root: $x$ is root 6.'
      B: 'You went for 2.5. That treats $2x$ as the whole distance, 5. The distance also has the $y$ difference, 1, so $4x$ squared plus 1 equals 25, which gives root 6.'
      D: 'You went for root 3. Check the division: $4x$ squared equals 24 gives $x$ squared equals 6, not 3, so $x$ is root 6.'

  33:
    moments:
      - section: 'The question'
        say: 'The line cuts the two axes at two points. The piece between them is the segment. Find the two points, then use the midpoint formula.'
        write: 'Midpoint of the segment of $y = 4x + 3$ between the axes'
      - section: 'Solution'
        say: 'Solution. Let me draw the line. A is where it cuts the x-axis, and B is where it cuts the y-axis.'
        write: 'Solution'
        diagram:
          id: g
          kind: graph
          x: [-2, 1]
          y: [-2, 5]
          step: 1
          plots:
            - {fn: '4x + 3', label: 'y = 4x + 3', colour: blue}
          'on': 'draw the line'
      - section: 'The x-intercept, A'
        say: 'Every point on the x-axis has $y$ equal to 0. So for the x-intercept, put $y$ equal to 0.'
        write: '$x$-intercept: put $y = 0$'
      - say: 'Substitute 0 for $y$ in the equation.'
        write: '$0 = 4x + 3$'
      - say: 'Subtract 3 from both sides, so that $4x$ stands alone.'
        write: '$4x = -3$'
      - say: 'Divide both sides by 4. Negative 3 divided by 4 is negative 3 over 4.'
        write: '$x = -\dfrac{3}{4}$'
      - say: 'Therefore A is the point negative 3 over 4, 0.'
        write: '$\therefore\ A = \left(-\dfrac{3}{4},\ 0\right)$'
        diagram_do:
          - {id: g, op: point, x: -0.75, y: 0, text: 'A (−3/4, 0)', 'on': 'point'}
      - section: 'The y-intercept, B'
        say: 'Every point on the y-axis has $x$ equal to 0. So for the y-intercept, put $x$ equal to 0.'
        write: '$y$-intercept: put $x = 0$'
      - say: 'Substitute 0 for $x$. 4 times 0 is 0, and 0 plus 3 is 3.'
        write: '$y = 4(0) + 3 = 3$'
      - say: 'Therefore B is the point 0, 3.'
        write: '$\therefore\ B = (0,\ 3)$'
        diagram_do:
          - {id: g, op: point, x: 0, y: 3, text: 'B (0, 3)', 'on': 'point'}
      - section: 'The midpoint'
        say: 'Label the two points before using the formula. Let $x$ 1, $y$ 1 be A, and $x$ 2, $y$ 2 be B.'
        write: 'Let $(x_{1},\ y_{1}) = \left(-\dfrac{3}{4},\ 0\right)$ and $(x_{2},\ y_{2}) = (0,\ 3)$'
      - say: 'The midpoint formula says add the two $x$ values and divide by 2, then add the two $y$ values and divide by 2.'
        write: 'Midpoint $= \left(\dfrac{x_{1} + x_{2}}{2},\ \dfrac{y_{1} + y_{2}}{2}\right)$'
        'on': 'midpoint formula'
      - say: 'Substitute, with the negative in a bracket.'
        write: '$= \left(\dfrac{\left(-\tfrac{3}{4}\right) + 0}{2},\ \dfrac{0 + 3}{2}\right)$'
      - say: 'Negative 3 over 4 divided by 2 is negative 3 over 4 times a half. And 0 plus 3 over 2 is 3 over 2.'
        write: '$= \left(-\dfrac{3}{4} \times \dfrac{1}{2},\ \dfrac{3}{2}\right)$'
      - say: 'Negative 3 over 4 times a half is negative 3 over 8. Therefore the midpoint is negative 3 over 8, 3 over 2.'
        write: '$\therefore$ Midpoint $= \left(-\dfrac{3}{8},\ \dfrac{3}{2}\right)$'
        diagram_do:
          - {id: g, op: point, x: -0.375, y: 1.5, text: 'M (−3/8, 3/2)', colour: green, 'on': 'Therefore'}
      - section: 'Check'
        say: 'To check, the midpoint must lie on the line. 4 times negative 3 over 8 is negative 3 over 2, and negative 3 over 2 plus 3 is 3 over 2.'
        write: 'Check: $4\left(-\dfrac{3}{8}\right) + 3 = -\dfrac{3}{2} + 3 = \dfrac{3}{2}$ ✓'
      - section: 'Answer'
        say: 'So the midpoint is negative 3 over 8, 3 over 2, which is answer choice D.'
        write: '$\therefore$ Midpoint $= \left(-\dfrac{3}{8},\ \dfrac{3}{2}\right)$ (D)'
        answer: true
    traps:
      A: 'You went for negative 3 over 2, 3 over 2. The $y$ value is right, but the x-intercept is negative 3 over 4, and half of that is negative 3 over 8, not negative 3 over 2.'
      B: 'You went for negative 2 over 3, 3 over 2. Putting $y = 0$ gives $4x = -3$, so $x$ is negative 3 over 4. Half of negative 3 over 4 is negative 3 over 8.'
      C: 'You went for positive 3 over 8, 3 over 2. The size is right but the sign is wrong. $4x = -3$ gives $x$ equal to negative 3 over 4, so the midpoint''s $x$ value is negative 3 over 8.'

  34:
    moments:
      - section: 'The question'
        say: 'Solve for $x$ from 0 up to, but not including, $2\pi$. There is a fraction, so we clear it first, then use an identity.'
        write: '$\cos x + \sin x = \dfrac{1}{\cos x - \sin x}$, $\ 0 \le x < 2\pi$'
      - section: 'Solution'
        say: 'Solution. Multiply both sides by $\cos x$ minus $\sin x$, to clear the fraction.'
        write: 'Solution: $(\cos x + \sin x)(\cos x - \sin x) = 1$'
      - say: 'The left side is the difference of two squares, because $a$ plus $b$, times $a$ minus $b$, is $a$ squared minus $b$ squared.'
        write: '$\cos^{2}x - \sin^{2}x = 1$'
      - say: 'Now the identity, sin squared plus cos squared is 1. So cos squared $x$ is 1 minus sin squared $x$.'
        write: '$\sin^{2}x + \cos^{2}x = 1 \Rightarrow \cos^{2}x = 1 - \sin^{2}x$'
      - say: 'Substitute that for cos squared $x$.'
        write: '$1 - \sin^{2}x - \sin^{2}x = 1$'
      - say: 'Collect like terms, and subtract 1 from both sides.'
        write: '$-2\sin^{2}x = 0$'
      - say: 'Divide by minus 2. Sine squared is 0, so sine $x$ is 0.'
        write: '$\sin^{2}x = 0 \Rightarrow \sin x = 0$'
      - section: 'The angles'
        say: 'Where is sine 0? Let me draw the sine graph from 0 to 360 degrees. It cuts the axis at 0, 180 and 360 degrees.'
        write: '$\sin x = 0$: $\ x = 0^{\circ},\ 180^{\circ},\ 360^{\circ}$'
        diagram:
          id: g
          kind: graph
          x: [0, 360]
          y: [-1.5, 1.5]
          x_step: 90
          y_step: 0.5
          x_label: 'x°'
          plots:
            - {fn: 'sin(x)', label: 'y = sin x', colour: blue}
        diagram_do:
          - {id: g, op: intercepts, part: 'plot:1', axis: x}
      - say: 'The range is in radians. 180 degrees is $\pi$ radians, and 360 degrees is $2\pi$.'
        write: '$x = 0,\ \pi,\ 2\pi$ (radians)'
      - say: 'The range says $x$ is less than $2\pi$, strictly. So $2\pi$ is left out.'
        write: '$0 \le x < 2\pi$: $\ x = 0$ or $\pi$'
      - section: 'Check'
        say: 'Check $x = 0$. Cos 0 is 1 and sin 0 is 0. The left side is 1, and the right side is 1 over 1, which is 1.'
        write: 'Check $x = 0$: $\ 1 + 0 = \dfrac{1}{1 - 0} = 1\ \checkmark$'
      - say: 'Check $x = \pi$. Cos $\pi$ is minus 1 and sin $\pi$ is 0. Both sides come to minus 1.'
        write: 'Check $x = \pi$: $\ -1 + 0 = \dfrac{1}{-1 - 0} = -1\ \checkmark$'
      - section: 'Exam tip'
        say: 'Here is an exam tip. Cos squared minus sin squared is also cos $2x$, the double angle formula. So the equation says cos $2x$ is 1.'
        write: 'Exam tip: $\cos^{2}x - \sin^{2}x = \cos 2x = 1$'
        doodle: {name: 'custom:1998_q34_a', id: dial, caption: 'cos is 1 at the start of a turn'}
      - say: 'Cos is 1 at 0 and after each full turn, so $2x$ is 0 or $2\pi$. Halve them, and $x$ is 0 or $\pi$, the same.'
        write: '$2x = 0,\ 2\pi \Rightarrow x = 0,\ \pi\ \checkmark$'
        doodle_do:
          - {id: dial, op: stage, stage: 'custom:1998_q34_a2'}
          - {id: dial, op: circle, part: turn}
      - section: 'Answer'
        say: 'Therefore $x$ is 0 or $\pi$, which is answer choice D.'
        write: '$\therefore x = 0,\ \pi$'
        answer: true
    traps:
      A: 'You went for $\tfrac{\pi}{2}$ and $\tfrac{3\pi}{2}$. There sine is 1 or minus 1, not 0, and cos is 0, which also makes the right side 1 over minus 1. The equation reduces to $\sin x = 0$, so $x$ is 0 or $\pi$.'
      B: 'You went for $\tfrac{\pi}{3}$ and $\tfrac{2\pi}{3}$. Sine of those is root 3 over 2, not 0. The equation reduces to $\sin x = 0$, which gives 0 and $\pi$.'
      C: 'You went for 0 and $\tfrac{\pi}{3}$. The 0 is right, but sine of $\tfrac{\pi}{3}$ is not 0. The sine graph cuts the axis at 0 and at 180 degrees, which is $\pi$.'

  35:
    moments:
      - section: 'The question'
        say: 'In the figure, $QTR$ is a straight line. $PQ$ is 15, $PT$ is 8, and angle $PQT$ is 30 degrees. We want the sine of angle $PTR$.'
        write: '$|PQ| = 15$, $\ |PT| = 8$, $\ \angle PQT = 30^{\circ}$; $\ \sin\angle PTR = ?$'
        point:
          - {figure: 0, kind: highlight, target: PQ, text: '15'}
          - {figure: 0, kind: highlight, target: PT, text: '8'}
          - {figure: 0, kind: arc, target: PQT, text: '30°'}
      - section: 'Solution'
        say: 'Solution. Work in triangle $PQT$. We know two sides, and the angle opposite one of them, so we use the sine rule.'
        write: 'Solution: in $\triangle PQT$, sine rule: $\dfrac{a}{\sin A} = \dfrac{b}{\sin B}$'
      - say: 'Pair each side with the angle facing it. $PT$ faces the 30 degrees at $Q$. $PQ$ faces angle $PTQ$, at $T$.'
        write: '$\dfrac{|PT|}{\sin\angle PQT} = \dfrac{|PQ|}{\sin\angle PTQ}$'
        point:
          - {figure: 0, kind: underline, target: 'PT', text: 'faces 30°'}
          - {figure: 0, kind: arc, target: 'PTQ', text: 'faces PQ'}
      - say: 'Substitute, and we get 8 over sine 30 equals 15 over sine $PTQ$.'
        write: '$\dfrac{8}{\sin 30^{\circ}} = \dfrac{15}{\sin\angle PTQ}$'
      - say: 'Cross-multiply, so 8 sine $PTQ$ equals 15 sine 30.'
        write: '$8\sin\angle PTQ = 15\sin 30^{\circ}$'
      - say: 'Divide both sides by 8, and put in sine 30, which is a half.'
        write: '$\sin\angle PTQ = \dfrac{15 \times \frac{1}{2}}{8}$'
      - say: '15 times a half is 15 over 2. Divided by 8, that is 15 over 16.'
        write: '$= \dfrac{15}{16}$'
      - section: 'The angle PTR'
        say: 'The question asks for angle $PTR$, not $PTQ$. $QTR$ is a straight line, so the two angles at $T$ add up to 180. The reason is angles on a straight line.'
        write: '$\angle PTR = 180^{\circ} - \angle PTQ$ ($\angle$s on a str. line)'
        point:
          - {figure: 0, kind: arc, target: PTR}
      - say: 'By CAST, sine is positive in the second quadrant. So an angle and 180 minus that angle have the same sine.'
        write: '$\sin(180^{\circ} - \theta) = \sin\theta$ (CAST: sin + in 2nd quad.)'
      - say: 'So sine $PTR$ is the same 15 over 16. Notice we never needed the 10 on $PR$.'
        write: '$\sin\angle PTR = \sin\angle PTQ = \dfrac{15}{16}$'
        point:
          - {figure: 0, kind: strike, target: '10', text: 'not needed'}
      - section: 'Check'
        say: 'Check the sine rule ratio on both sides. 8 divided by a half is 16. 15 divided by 15 over 16 is also 16.'
        write: 'Check: $\dfrac{8}{\frac{1}{2}} = 16$, $\ \dfrac{15}{\frac{15}{16}} = 16\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the sine of angle $PTR$ is 15 over 16, which is answer choice D.'
        write: '$\therefore \sin\angle PTR = \dfrac{15}{16}$'
        answer: true
        point:
          - {figure: 0, kind: label, target: '?', text: 'sin = 15/16'}
    traps:
      A: 'You went for 8 over 15. That is $PT$ over $PQ$, without sine 30. The sine rule gives $8\sin\angle PTQ = 15 \times \tfrac{1}{2}$, so the sine is 15 over 16.'
      B: 'You went for 2 over 3. That is the 10 on $PR$ over the 15 on $PQ$, which are not a side and its sine in one rule. In triangle $PQT$, the sine rule gives 15 over 16.'
      C: 'You went for 3 over 4. That uses the 10 on $PR$ in place of $PT$: 15 times a half over 10. The side facing the 30 degrees in triangle $PQT$ is $PT = 8$, giving 15 over 16.'

  36:
    moments:
      - section: 'The question'
        say: 'We want the value of $x$, between 0 and 180 degrees, where the function is at its maximum. Here is its graph.'
        write: '$y = 6\sin(2x - 25)^{\circ}$, $\ 0^{\circ} \le x \le 180^{\circ}$'
        diagram:
          id: g
          kind: graph
          x: [0, 180]
          y: [-7, 7]
          x_step: 30
          y_step: 2
          x_label: 'x°'
          plots:
            - {fn: '6sin(2x - 25)', label: 'y = 6 sin(2x − 25)°', colour: blue}
      - section: 'Solution'
        say: 'Solution. The sine of any angle lies between minus 1 and 1. So its greatest value is 1.'
        write: '$-1 \le \sin\theta \le 1$'
      - say: 'The 6 only stretches the graph. So $y$ is greatest, 6 times 1, when the sine is 1.'
        write: '$y_{\max} = 6 \times 1 = 6$, when $\sin(2x - 25)^{\circ} = 1$'
      - say: 'Sine is 1 when its angle is 90 degrees.'
        write: '$\sin 90^{\circ} = 1$'
      - say: 'So equate the angle to 90 degrees.'
        write: '$\therefore 2x - 25 = 90$'
      - say: 'Add 25 to both sides. 90 plus 25 is 115.'
        write: '$2x = 90 + 25 = 115$'
      - say: 'Divide both sides by 2. 115 divided by 2 is 57 and a half.'
        write: '$x = \dfrac{115}{2} = 57\tfrac{1}{2}$'
        diagram_do:
          - {id: g, op: point, part: 'plot:1', x: 57.5, text: 'maximum, x = 57½', colour: green}
      - section: 'Check'
        say: 'To check, 2 times 57 and a half is 115, minus 25 is 90, and 6 times sine 90 is 6, the maximum.'
        write: 'Check: $2(57\tfrac{1}{2}) - 25 = 90$, $\ 6\sin 90^{\circ} = 6\ \checkmark$'
      - say: 'Is there another one in range? Sine is next 1 at 90 plus 360, which is 450 degrees. That gives $x$ equals 237 and a half, outside the range.'
        write: '$2x - 25 = 450 \Rightarrow x = 237\tfrac{1}{2} > 180$'
        point:
          - {line: 8, kind: strike, at: '237', text: 'out of range'}
      - say: 'Therefore the maximum is at $x$ equals 57 and a half, which is answer choice C.'
        write: '$\therefore x = 57\tfrac{1}{2}$'
        answer: true
    traps:
      A: 'You went for $12\tfrac{1}{2}$. That comes from $2x = 25$, where the angle is 0 and the sine is 0, not 1. Equate the angle to 90 degrees instead.'
      B: 'You went for $32\tfrac{1}{2}$. That comes from $2x = 65$, as if 25 were subtracted from 90 instead of added. From $2x - 25 = 90$, $2x$ is 115 and $x$ is $57\tfrac{1}{2}$.'
      D: 'You went for $147\tfrac{1}{2}$. There the angle $2x - 25$ is 270 degrees, where sine is minus 1: that is the minimum, not the maximum.'

  37:
    moments:
      - section: 'The question'
        say: 'From the top of a 150 m mast, one hut is due east at an angle of depression of 60 degrees, and another is due west at 45 degrees. We want the distance between the huts.'
        write: 'Mast $= 150$ m; depression: E hut $60^{\circ}$, W hut $45^{\circ}$'
      - section: 'Solution'
        say: 'Solution. Let me draw the mast $TF$, with a horizontal line at the top $T$. The angle of depression is measured down from that horizontal. Here is the west hut, $W$.'
        write: 'Solution: $|TF| = 150$ m, horizontal at $T$'
        show_sketch: true
        'on': 'draw'
        point:
          - {figure: sketch, kind: highlight, target: TF, text: '150 m'}
          - {figure: sketch, kind: circle, target: '45°'}
      - say: 'Now the east hut, $E$, on the other side of the mast, seen at 60 degrees.'
        write: 'Huts: $W$ due west, $E$ due east of $F$'
        show_sketch: sketch_b
        point:
          - {figure: sketch_b, kind: circle, target: '60°', text: 'east hut'}
      - say: 'The horizontal at $T$ is parallel to the ground. So each angle of depression equals the angle of elevation at the hut, because they are alternate angles.'
        write: '$\angle TWF = 45^{\circ}$, $\ \angle TEF = 60^{\circ}$ (alt. $\angle$s)'
        point:
          - {figure: sketch_b, kind: arc, target: 'TWF', text: '45°'}
          - {figure: sketch_b, kind: arc, target: 'TEF', text: '60°'}
      - say: 'Let $x$ be the distance from the west hut to the foot, and $y$ the distance from the foot to the east hut.'
        write: 'Let $|WF| = x$ m, $\ |FE| = y$ m'
        point:
          - {figure: sketch_b, kind: underline, target: 'WF', text: 'x'}
          - {figure: sketch_b, kind: underline, target: 'FE', text: 'y'}
      - say: 'In each triangle the mast is opposite the angle at the hut, and the ground is adjacent. Opposite and adjacent means TOA.'
        write: 'TOA: $\tan\theta = \dfrac{\text{opp}}{\text{adj}}$'
      - section: 'The west hut'
        say: 'In triangle $TWF$, tan 45 equals 150 over $x$.'
        write: '$\triangle TWF$: $\ \tan 45^{\circ} = \dfrac{150}{x}$'
      - say: 'Cross-multiply and divide, so $x$ is 150 over tan 45. Tan 45 is 1, from half a square. So $x$ is 150.'
        write: '$x = \dfrac{150}{\tan 45^{\circ}} = \dfrac{150}{1} = 150$'
        point:
          - {figure: sketch_b, kind: label, target: 'west hut', text: '150 m'}
      - section: 'The east hut'
        say: 'In triangle $TFE$, tan 60 equals 150 over $y$.'
        write: '$\triangle TFE$: $\ \tan 60^{\circ} = \dfrac{150}{y}$'
      - say: 'So $y$ is 150 over tan 60. Tan 60 is root 3, from half an equilateral triangle.'
        write: '$y = \dfrac{150}{\tan 60^{\circ}} = \dfrac{150}{\sqrt{3}}$'
      - say: 'Rationalise by multiplying the top and bottom by root 3. The bottom becomes 3, and 150 over 3 is 50.'
        write: '$y = \dfrac{150 \times \sqrt{3}}{\sqrt{3} \times \sqrt{3}} = \dfrac{150\sqrt{3}}{3} = 50\sqrt{3}$'
        point:
          - {figure: sketch_b, kind: label, target: 'east hut', text: '50√3 m'}
      - section: 'Between the huts'
        say: 'One hut is east of the mast and the other west, so the mast is between them. Add the two distances.'
        write: '$|WE| = x + y = 150 + 50\sqrt{3}$'
      - say: '150 is 50 times 3. Take out 50 as a common factor.'
        write: '$= 50(3 + \sqrt{3})$ m'
      - section: 'Check'
        say: 'To check, the steeper angle, 60 degrees, should give the nearer hut. $50\sqrt{3}$ is about 86.6 m, less than 150 m. Good.'
        write: 'Check: $50\sqrt{3} \approx 86.6 < 150\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the huts are $50(3 + \sqrt{3})$ metres apart, which is answer choice B.'
        write: '$\therefore |WE| = 50(3 + \sqrt{3})$ m'
        answer: true
        point:
          - {figure: sketch_b, kind: label, target: '?', text: '50(3 + √3) m'}
    traps:
      A: 'You went for $150(1 + \sqrt{3})$. That uses 150 times tan 60 for the east hut, multiplying where you should divide. A steeper angle means a nearer hut, so that distance must be under 150: it is $50\sqrt{3}$.'
      C: 'You went for $150\sqrt{3}$. That is only one hut, worked out by multiplying by tan 60. Add both distances: 150 plus $50\sqrt{3}$, which is $50(3 + \sqrt{3})$.'
      D: 'You went for $\tfrac{50}{\sqrt{3}}$. That is far too small: the west hut alone is 150 m from the mast. Add the two distances, 150 and $50\sqrt{3}$, to get $50(3 + \sqrt{3})$.'

  38:
    moments:
      - section: 'The question'
        say: 'A bracket to the power minus 2 is a function of a function. We let $u$ be the bracket, use the chain rule, then put $x$ equals 1.'
        write: '$y = 243(4x + 5)^{-2}$'
      - section: 'Solution'
        say: 'Solution. Let $u$ be the inside, $4x$ plus 5. Then $y$ is 243 $u$ to the power minus 2.'
        'on': 'Let'
        write: 'Let $u = 4x + 5$, $\ \therefore y = 243u^{-2}$'
      - say: '$\dfrac{du}{dx}$ is 4. For $\dfrac{dy}{du}$, multiply by the power, so 243 times minus 2 is minus 486, and the power drops to minus 3.'
        write: '$\dfrac{du}{dx} = 4$, $\ \dfrac{dy}{du} = 243(-2)u^{-3} = -486u^{-3}$'
      - say: 'The chain rule says $\dfrac{dy}{dx}$ equals $\dfrac{dy}{du}$ times $\dfrac{du}{dx}$.'
        'on': 'chain rule'
        write: '$\dfrac{dy}{dx} = \dfrac{dy}{du} \times \dfrac{du}{dx} = -486u^{-3} \times 4$'
      - say: 'Minus 486 times 4 is minus 1944. Put back $u$ equals $4x$ plus 5, and write the negative power as 1 over.'
        write: '$= -1944(4x + 5)^{-3} = \dfrac{-1944}{(4x + 5)^{3}}$'
      - section: 'At x = 1'
        say: 'Now $x$ equals 1. Picture a walker on the curve at $x$ equals 1, where the derivative is how steep the ground is. First, the bracket, so 4 times 1 plus 5 is 9.'
        write: 'At $x = 1$, $\ 4x + 5 = 4(1) + 5 = 9$'
        doodle: {name: 'custom:1998_q38_a', id: hill, caption: 'how steep is it at x = 1?'}
      - say: '9 cubed is 9 times 9 times 9, which is 729.'
        write: '$\dfrac{dy}{dx} = \dfrac{-1944}{9^{3}} = \dfrac{-1944}{729}$'
      - say: 'Simplify. 1944 is 243 times 8, and 729 is 243 times 3. Cancel the 243.'
        write: '$= -\dfrac{243 \times 8}{243 \times 3} = -\dfrac{8}{3}$'
        doodle_do:
          - {id: hill, op: label, part: tangent, text: 'slope −8/3'}
      - section: 'Check'
        say: 'Check the sign. With a negative power, $y$ falls as $x$ grows, so the walker goes downhill and the gradient must be negative. It is.'
        write: 'Check: $-\dfrac{8}{3} < 0$, $y$ falls as $x$ grows'
        doodle_do:
          - {id: hill, op: circle, part: walker, text: 'downhill'}
      - say: 'Therefore $\dfrac{dy}{dx}$ at $x$ equals 1 is minus 8 over 3, which is answer choice A.'
        write: '$\therefore \dfrac{dy}{dx} = -\dfrac{8}{3}$ at $x = 1$'
        answer: true
    traps:
      B: 'You went for 3 over 8. That is the answer upside down, without its minus. $\dfrac{dy}{dx}$ is minus 1944 over 729, which is minus 8 over 3.'
      C: 'You went for 9 over 8. With a negative power, $y$ falls as $x$ grows, so the gradient must be negative: minus 1944 over 729, which is minus 8 over 3.'
      D: 'You went for minus 8 over 9. The sign is right, but 9 cubed is 729, and 1944 over 729 is 8 over 3.'

  39:
    moments:
      - section: 'The question'
        say: 'Here one function is divided by another, $x$ over cos $x$. That is the quotient rule. Most slips here are the order of the top and a lost minus.'
        write: '$y = \dfrac{x}{\cos x}$'
      - section: 'Solution'
        say: 'Solution. Name the parts. Let $u$ be the top, $x$, and $v$ be the bottom, cos $x$.'
        write: 'Let $u = x$, $\ v = \cos x$'
      - say: 'Differentiate each. $x$ gives 1. Cos $x$ gives minus sine $x$.'
        write: '$\dfrac{du}{dx} = 1$, $\ \dfrac{dv}{dx} = -\sin x$'
      - say: 'The quotient rule is $v$ $\dfrac{du}{dx}$ minus $u$ $\dfrac{dv}{dx}$, all over $v$ squared. $v$ $\dfrac{du}{dx}$ always comes first.'
        'on': 'quotient rule'
        write: '$\dfrac{dy}{dx} = \dfrac{v\dfrac{du}{dx} - u\dfrac{dv}{dx}}{v^{2}}$'
      - say: 'Substitute, and we get cos $x$ times 1, minus $x$ times minus sine $x$, over cos squared $x$.'
        write: '$= \dfrac{\cos x(1) - x(-\sin x)}{\cos^{2}x}$'
        point:
          - {line: 3, kind: box, text: 'the rule'}
      - say: 'Minus times minus is plus.'
        write: '$= \dfrac{\cos x + x\sin x}{\cos^{2}x}$'
      - section: 'Simplify'
        say: 'Split it into two fractions over cos squared $x$.'
        write: '$= \dfrac{\cos x}{\cos^{2}x} + \dfrac{x\sin x}{\cos^{2}x}$'
      - say: 'The first is 1 over cos $x$. The second is $x$, times 1 over cos $x$, times sine $x$ over cos $x$.'
        write: '$= \dfrac{1}{\cos x} + x \times \dfrac{1}{\cos x} \times \dfrac{\sin x}{\cos x}$'
      - say: '1 over cos $x$ is sec $x$, and sine $x$ over cos $x$ is tan $x$.'
        write: '$= \sec x + x\sec x\tan x$'
      - say: 'Therefore the derivative is sec $x$ plus $x$ sec $x$ tan $x$, which is answer choice D.'
        write: '$\therefore \dfrac{dy}{dx} = \sec x + x\sec x\tan x$'
        answer: true
    traps:
      A: 'You went for $1 + x\sec x\tan x$. The first fraction is cos $x$ over cos squared $x$, which is sec $x$, not 1.'
      B: 'You went for $1 + \sec^{2}x$. That treats the top and bottom separately. Use the quotient rule: $\dfrac{v\frac{du}{dx} - u\frac{dv}{dx}}{v^{2}}$.'
      C: 'You went for $\cos x + x\tan x$. That forgets to divide by $v^{2}$, cos squared $x$. Dividing gives sec $x$ plus $x$ sec $x$ tan $x$.'

  40:
    moments:
      - section: 'The question'
        say: 'Evaluate the integral from 0 to $\tfrac{\pi}{2}$ of sec squared $x$ minus tan squared $x$. Before integrating, see whether the expression inside simplifies.'
        write: '$\displaystyle\int_{0}^{\pi/2}(\sec^{2}x - \tan^{2}x)\,dx$'
      - section: 'Solution'
        say: 'Solution. Start from the identity, which says sin squared $x$ plus cos squared $x$ is 1.'
        write: 'Solution: $\sin^{2}x + \cos^{2}x = 1$'
      - say: 'Divide every term by cos squared $x$.'
        write: '$\dfrac{\sin^{2}x}{\cos^{2}x} + \dfrac{\cos^{2}x}{\cos^{2}x} = \dfrac{1}{\cos^{2}x}$'
      - say: 'Sin over cos is tan, and 1 over cos is sec. So tan squared $x$ plus 1 is sec squared $x$.'
        write: '$\tan^{2}x + 1 = \sec^{2}x$'
      - say: 'Subtract tan squared $x$ from both sides.'
        write: '$\sec^{2}x - \tan^{2}x = 1$'
      - section: 'Integrate'
        say: 'That is exactly what is inside the integral. Let $I$ be the integral. It becomes the integral of 1.'
        write: 'Let $I = \displaystyle\int_{0}^{\pi/2}(\sec^{2}x - \tan^{2}x)\,dx = \int_{0}^{\pi/2} 1\,dx$'
      - say: 'The integral of 1 is $x$, because $x$ differentiates to 1. Write it in square brackets, with the limits on the bracket. No plus $c$ for a definite integral.'
        write: '$I = \left[x\right]_{0}^{\pi/2}$'
      - say: 'Take the upper limit minus the lower limit, so $\tfrac{\pi}{2}$ minus 0.'
        write: '$= \dfrac{\pi}{2} - 0 = \dfrac{\pi}{2}$'
      - section: 'Check'
        say: 'To check, the integral of 1 is the area under the flat line $y$ equals 1. The strip is 1 high and $\tfrac{\pi}{2}$ wide, so its area is $\tfrac{\pi}{2}$.'
        write: 'Check: area $= 1 \times \dfrac{\pi}{2} = \dfrac{\pi}{2}\ \checkmark$'
        doodle: {name: 'custom:1998_q40_a', id: strip, caption: 'the area under y = 1'}
        doodle_do:
          - {id: strip, op: highlight, part: line}
          - {id: strip, op: fill, to: 1.0, fill: paint}
          - {id: strip, op: label, part: strip, text: '1 × π/2 = π/2'}
      - section: 'Answer'
        say: 'Therefore the integral is $\tfrac{\pi}{2}$, which is answer choice A.'
        write: '$\therefore I = \dfrac{\pi}{2}$'
        answer: true
    traps:
      B: 'You went for $\pi - 2$. The expression inside is exactly 1, because sec squared minus tan squared is 1. Integrating 1 from 0 to $\tfrac{\pi}{2}$ gives just $\tfrac{\pi}{2}$.'
      C: 'You went for $\tfrac{\pi}{3}$. The expression inside is 1, so the answer is the upper limit minus the lower limit, $\tfrac{\pi}{2}$ minus 0, which is $\tfrac{\pi}{2}$.'
      D: 'You went for $\pi + 2$. There is nothing to add: the expression inside simplifies to 1, and $\left[x\right]$ from 0 to $\tfrac{\pi}{2}$ is $\tfrac{\pi}{2}$.'

  41:
    moments:
      - section: 'The question'
        say: 'The gradient of a curve at any point is $6x$ minus 5, and the curve passes through the point 2, 5. We want the equation of the curve.'
        write: '$\dfrac{dy}{dx} = 6x - 5$; curve through $(2,\ 5)$'
      - section: 'Solution'
        say: 'Solution. The gradient is $dy$ by $dx$. Integration is the reverse of differentiation, so to get back to $y$, we integrate.'
        write: 'Solution: $y = \displaystyle\int (6x - 5)\,dx$'
      - say: 'The rule is to add 1 to the power, divide by the new power, and add $c$, the constant of integration.'
        write: '$\displaystyle\int ax^{n}\,dx = \dfrac{ax^{n + 1}}{n + 1} + c$'
      - say: 'Term by term. $6x$ becomes $6x$ squared over 2. Negative 5 becomes negative $5x$. Then plus $c$.'
        write: '$y = \dfrac{6x^{2}}{2} - 5x + c$'
      - say: '6 over 2 is 3. Every value of $c$ gives the same shape slid up or down, so we need the point to fix $c$.'
        write: '$y = 3x^{2} - 5x + c$'
        doodle: {name: 'custom:1998_q41_a', id: curves, caption: 'one shape, slid up and down by c'}
      - section: 'Find c'
        say: 'The curve passes through 2, 5, which means when $x$ is 2, $y$ is 5. Substitute.'
        write: 'When $x = 2$, $y = 5$: $5 = 3(2)^{2} - 5(2) + c$'
        doodle_do:
          - {id: curves, op: circle, part: dot}
      - say: '2 squared is 4, and 3 times 4 is 12. 5 times 2 is 10.'
        write: '$5 = 12 - 10 + c$'
      - say: '12 minus 10 is 2.'
        write: '$5 = 2 + c$'
      - say: 'Subtract 2 from both sides.'
        write: '$\therefore\ c = 3$'
      - say: 'Put $c$ equals 3 back into the equation. Of all the curves in the stack, this is the one through the point.'
        write: '$\therefore\ y = 3x^{2} - 5x + 3$'
        doodle_do:
          - {id: curves, op: highlight, part: mid, text: 'c = 3'}
      - section: 'Check'
        say: 'Check both conditions. Differentiate, so $3x$ squared gives $6x$, and negative $5x$ gives negative 5. At $x$ equals 2, 12 minus 10 plus 3 is 5.'
        write: 'Check: $\dfrac{dy}{dx} = 6x - 5\ \checkmark$; $\ 12 - 10 + 3 = 5\ \checkmark$'
      - say: 'Therefore the equation of the curve is $y$ equals $3x$ squared minus $5x$ plus 3, which is answer choice D.'
        write: '$\therefore\ y = 3x^{2} - 5x + 3$'
        answer: true
    traps:
      A: 'You went for $y$ equals $6x$ squared minus $5x$ plus 5. Divide by the new power: $6x$ integrates to $6x$ squared over 2, which is $3x$ squared.'
      B: 'You went for $y$ equals $6x$ squared plus $5x$ plus 5. $6x$ integrates to $3x$ squared, and negative 5 to negative $5x$. Then the point 2, 5 gives $c$ equals 3.'
      C: 'You went for $y$ equals $3x$ squared minus $5x$ minus 5. The first two terms are right, but at $x$ equals 2 this gives 12 minus 10 minus 5, which is negative 3, not 5. $c$ is 3.'

  42:
    moments:
      - section: 'The question'
        say: 'There are eight numbers, 2, 3, 9, 7, 6, 7, 8 and 5. $m$ is their mean and $n$ their median. We want $m$ plus $2n$ to the nearest whole number. Picture them as eight people of those heights.'
        write: 'Data: $2,\ 3,\ 9,\ 7,\ 6,\ 7,\ 8,\ 5$; $\ m + 2n = ?$'
        doodle: {name: 'custom:1998_q42_a', id: line, caption: '8 numbers as 8 people', size: scene}
      - section: 'Solution'
        say: 'Solution. First the mean, $x$ bar, which is the sum of the values, sigma $x$, over the number of values, $n$.'
        write: 'Solution. $\ \bar{x} = \dfrac{\sum x}{n}$'
      - say: 'Add them in order. 2 plus 3 is 5, plus 9 is 14, plus 7 is 21, plus 6 is 27, plus 7 is 34, plus 8 is 42, plus 5 is 47.'
        write: '$\sum x = 2 + 3 + 9 + 7 + 6 + 7 + 8 + 5 = 47$'
      - say: 'There are 8 values. Substitute, and we get 47 over 8, which is 5.875.'
        write: '$\therefore m = \dfrac{47}{8} = 5.875$'
        doodle_do:
          - {id: line, op: pulse, part: people}
      - section: 'The median'
        say: 'For the median, first arrange the values in order of magnitude, smallest first. Line the people up by height.'
        write: 'In order: $2,\ 3,\ 5,\ 6,\ 7,\ 7,\ 8,\ 9$'
        doodle_do:
          - {id: line, op: stage, stage: 'custom:1998_q42_a2'}
      - say: 'For ungrouped data, the median is the $n$ plus 1 over 2th value. 8 plus 1 is 9, and 9 over 2 is 4.5.'
        write: 'Median $=$ the $\left(\dfrac{n + 1}{2}\right)$th $= \left(\dfrac{8 + 1}{2}\right)$th $= 4.5$th value'
      - say: 'The 4.5th value is halfway between the 4th and the 5th. Count along, and the 4th is 6, the 5th is 7.'
        write: '4th $= 6$, 5th $= 7$'
        point:
          - {line: 4, kind: circle, at: '5,[[6]],7', text: '4th'}
          - {line: 4, kind: circle, at: '6,[[7]],7', text: '5th'}
        doodle_do:
          - {id: line, op: stage, stage: 'custom:1998_q42_a3'}
      - say: 'So the median is the average of 6 and 7. 6 plus 7 is 13, and 13 over 2 is 6.5.'
        write: '$\therefore n = \dfrac{6 + 7}{2} = \dfrac{13}{2} = 6.5$'
        doodle_do:
          - {id: line, op: label, part: mid, text: '(6 + 7) ÷ 2 = 6.5'}
      - section: 'Combine'
        say: 'Now substitute into $m$ plus $2n$. 2 times 6.5 is 13.'
        write: '$m + 2n = 5.875 + 2(6.5) = 5.875 + 13$'
        point:
          - {line: 8, kind: move, from: {line: 3, at: '[[5.875]]'}, at: '[[5.875]]+2', text: 'm'}
          - {line: 8, kind: move, from: {line: 7, at: '[[6.5]]'}, at: '(6.5)', text: 'n'}
      - say: '5.875 plus 13 is 18.875.'
        write: '$= 18.875$'
      - say: 'To the nearest whole number, the decimal part, 0.875, is more than a half, so we round up.'
        write: '$\therefore m + 2n \approx 19$'
      - section: 'Answer'
        say: 'So $m$ plus $2n$ is 19 to the nearest whole number, which is option A.'
        write: '$\therefore m + 2n = 19$'
        answer: true
    traps:
      B: 'You went for 18. That cuts off the decimal instead of rounding: 18.875 is nearer 19. It is also what you get if you take the median as 6 instead of the average of the 4th and 5th values, 6 and 7.'
      C: 'You went for 13. That is only $2n$, twice the median. We still add the mean, 5.875, to get 18.875, which is 19 to the nearest whole number.'
      D: 'You went for 12. That is about $m$ plus $n$: 5.875 plus 6.5 is 12.375. The question asks for $m$ plus twice $n$, which is 18.875, or 19.'

  43:
    moments:
      - section: 'The question'
        say: 'Workers grouped by average hourly earnings in naira. We want to estimate the mode. The mode of grouped data needs a formula, and the formula needs class boundaries. Table first.'
        write: 'Mode $= ?$'
        diagram:
          id: t
          kind: table
          columns: ['Earnings (₦)', 'Class boundaries', 'f']
          rows: [['5 – 9', '', 17], ['10 – 14', '', 32], ['15 – 19', '', 25], ['20 – 24', '', 24]]
          'on': 'Table'
        doodle: {name: 'custom:1998_q43_a', id: piles, caption: 'workers piled up by earnings', size: scene}
      - section: 'Solution'
        say: 'Solution. The classes jump from 9 to 10, so each boundary sits halfway, half a naira below and above the limits, giving 4.5 to 9.5, then 9.5 to 14.5.'
        write: 'Solution. Boundaries: $4.5 - 9.5,\ 9.5 - 14.5,\ \ldots$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,2', text: '4.5 – 9.5'}
          - {id: t, op: fill, part: 'cell:2,2', text: '9.5 – 14.5'}
      - say: 'And 14.5 to 19.5, then 19.5 to 24.5.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:3,2', text: '14.5 – 19.5'}
          - {id: t, op: fill, part: 'cell:4,2', text: '19.5 – 24.5'}
      - say: 'The modal class is the class with the highest frequency. The highest $f$ is 32, so the modal class is 10 to 14.'
        write: 'Modal class: $10 - 14$ (highest $f = 32$)'
        diagram_do:
          - {id: t, op: highlight, part: 'row:2', text: 'modal class', 'on': 'modal', on_nth: 2}
        doodle_do:
          - {id: piles, op: circle, part: p2, text: 'modal class'}
      - section: 'The formula'
        say: 'The mode formula is $L_1$, plus $D_1$ over $D_1$ plus $D_2$, times $c$.'
        write: 'Mode $= L_{1} + \left(\dfrac{D_{1}}{D_{1} + D_{2}}\right) \times c$'
      - say: '$L_1$ is the lower class boundary of the modal class, which is 9.5, not the limit 10.'
        write: '$L_{1} = 9.5$'
        diagram_do:
          - {id: t, op: label, part: 'cell:2,2', text: 'L₁ = 9.5'}
      - say: '$D_1$ is the modal frequency minus the frequency of the class before, so 32 minus 17 is 15.'
        write: '$D_{1} = 32 - 17 = 15$'
        doodle_do:
          - {id: piles, op: label, part: p1, text: 'class before: 17'}
      - say: '$D_2$ is the modal frequency minus the frequency of the class after, so 32 minus 25 is 7.'
        write: '$D_{2} = 32 - 25 = 7$'
        doodle_do:
          - {id: piles, op: label, part: p3, text: 'class after: 25'}
      - say: '$c$ is the class width, the upper boundary minus the lower, so 14.5 minus 9.5, which is 5.'
        write: '$c = 14.5 - 9.5 = 5$'
      - section: 'Substitute'
        say: 'Substitute the four values into the formula.'
        write: 'Mode $= 9.5 + \left(\dfrac{15}{15 + 7}\right) \times 5$'
      - say: '15 plus 7 is 22. 15 over 22 times 5 is 75 over 22.'
        write: '$= 9.5 + \dfrac{75}{22}$'
      - say: '75 divided by 22 is 3.409, to three decimal places.'
        write: '$= 9.5 + 3.409$'
      - say: '9.5 plus 3.409 is 12.909, which is 12.9 to one decimal place.'
        write: '$\therefore$ Mode $= 12.909 \approx 12.9$'
      - section: 'Check'
        say: 'To check, the mode lies inside the modal class boundaries, and above the middle, 12, because the class after, 25, is fuller than the class before, 17.'
        write: 'Check: $12 < 12.9 < 14.5$ ✓'
      - section: 'Answer'
        say: 'So the mode is about 12.9 naira, which is option C.'
        write: '$\therefore$ Mode $\approx$ ₦$12.9$'
        answer: true
    traps:
      A: 'You went for 12.2. Check $D_1$ and $D_2$: 32 minus 17 is 15 and 32 minus 25 is 7, so the fraction is 15 over 22, and 15 over 22 times 5 is about 3.41. 9.5 plus 3.41 is 12.9.'
      B: 'You went for 12.7. Use $L_1$ = 9.5 and the fraction 15 over 22 times the width 5, which is about 3.41. 9.5 plus 3.41 is 12.9.'
      D: 'You went for 13.4. That uses the class limit 10 for $L_1$ instead of the lower class boundary 9.5. With 9.5 the mode is 12.9.'

  44:
    moments:
      - section: 'The question'
        say: 'We have three numbers, $K$, $K$ plus 1 and $K$ plus 2. We want their variance, which is how spread out they are about their mean.'
        write: 'Variance of $K,\ K + 1,\ K + 2$'
      - section: 'Solution'
        say: 'Solution. The variance is the sum of the squared deviations from the mean, over $n$, the number of values. The mean comes first.'
        write: 'Variance $= \dfrac{\sum (x - \bar{x})^{2}}{n}$'
      - section: 'The mean'
        say: 'The mean, $x$ bar, is the sum of the values over 3.'
        write: '$\bar{x} = \dfrac{K + (K + 1) + (K + 2)}{3}$'
      - say: 'Three $K$s make $3K$, and 1 plus 2 is 3. Divide each term by 3, and the mean is $K$ plus 1, the middle number. On a plank, the three balance at the middle.'
        write: '$= \dfrac{3K + 3}{3} = K + 1$'
        doodle: {name: 'custom:1998_q44_a', id: plank, caption: 'three numbers, one step apart'}
      - section: 'The deviation table'
        say: 'Now the deviation table, where we take each number, minus the mean, then squared.'
        diagram:
          id: d
          kind: table
          columns: ['x', 'x − x̄', '(x − x̄)²']
          rows: [['K', '', ''], ['K + 1', '', ''], ['K + 2', '', '']]
          'on': 'table'
      - say: '$K$ minus, bracket, $K$ plus 1, is minus 1. $K$ plus 1 minus $K$ plus 1 is 0. And $K$ plus 2 minus $K$ plus 1 is 1. The $K$ cancels every time.'
        write: '$K - (K + 1) = -1$'
        diagram_do:
          - {id: d, op: fill, part: 'cell:1,2', text: '−1'}
          - {id: d, op: fill, part: 'cell:2,2', text: '0'}
          - {id: d, op: fill, part: 'cell:3,2', text: '1'}
        doodle_do:
          - {id: plank, op: pulse, part: plank}
      - say: 'Square them. Minus 1 squared is 1, 0 squared is 0, and 1 squared is 1.'
        write: '$(-1)^{2} = 1,\ 0^{2} = 0,\ 1^{2} = 1$'
        diagram_do:
          - {id: d, op: fill, part: 'cell:1,3', text: '1'}
          - {id: d, op: fill, part: 'cell:2,3', text: '0'}
          - {id: d, op: fill, part: 'cell:3,3', text: '1'}
      - say: 'Add the last column, and 1 plus 0 plus 1 is 2.'
        write: '$\sum (x - \bar{x})^{2} = 1 + 0 + 1 = 2$'
        diagram_do:
          - {id: d, op: total, part: 'col:3', 'on': 'Add'}
      - section: 'The variance'
        say: 'Substitute 2 over $n$, and $n$ is 3. So the variance is 2 over 3.'
        write: '$\therefore$ Variance $= \dfrac{2}{3}$'
      - section: 'Check'
        say: 'Check with $K$ equals 0. The numbers are 0, 1 and 2, the mean is 1, and the squared deviations are 1, 0 and 1. That gives 2 over 3 again.'
        write: 'Check $K = 0$: $\ \dfrac{1 + 0 + 1}{3} = \dfrac{2}{3}$ ✓'
      - section: 'Answer'
        say: 'So the variance is 2 over 3, which is option A.'
        write: '$\therefore$ Variance $= \dfrac{2}{3}$'
        answer: true
    traps:
      B: 'You went for 1. That divides the total of 2 by 2 instead of 3. There are three numbers, so $n$ is 3 and the variance is 2 over 3.'
      C: 'You went for $K + 1$. That is the mean, not the variance. The variance measures spread, and the $K$ cancels from every deviation.'
      D: 'You went for $K + 1$ all squared. That is the mean squared. The variance uses the squared deviations, 1, 0 and 1, over 3: 2 over 3.'

  45:
    moments:
      - section: 'The question'
        say: 'The standard deviation, S.D., of 1, $x$ plus 1 and $2x$ plus 1 is root 6. We want the positive value of $x$.'
        write: '$1,\ x + 1,\ 2x + 1$; S.D. $= \sqrt{6}$'
      - section: 'Solution'
        say: 'Solution. The variance is the S.D. squared. Root 6 squared is 6.'
        write: 'Variance $= (\sqrt{6})^{2} = 6$'
      - say: 'And the variance is the sum of the squared deviations over $n$. We call each deviation $d$, which is the value minus the mean.'
        write: 'Variance $= \dfrac{\sum d^{2}}{n}$, where $d = $ value $- \bar{x}$'
      - section: 'The mean'
        say: 'The mean first. $x$ plus $2x$ is $3x$, and 1 plus 1 plus 1 is 3. Over 3, the mean is $x$ plus 1, the middle number.'
        write: '$\bar{x} = \dfrac{1 + (x + 1) + (2x + 1)}{3} = x + 1$'
        doodle: {name: 'custom:1998_q45_a', id: plank, caption: 'three numbers, x apart'}
      - section: 'The deviation table'
        say: 'Now the table, with each value, its deviation $d$ from the mean, then $d$ squared.'
        diagram:
          id: d
          kind: table
          columns: ['Value', 'd', 'd²']
          rows: [['1', '', ''], ['x + 1', '', ''], ['2x + 1', '', '']]
          'on': 'table'
      - say: '1 minus, bracket, $x$ plus 1, is minus $x$. The middle one gives 0. And $2x$ plus 1 minus $x$ plus 1 is $x$.'
        write: '$1 - (x + 1) = -x$'
        diagram_do:
          - {id: d, op: fill, part: 'cell:1,2', text: '−x'}
          - {id: d, op: fill, part: 'cell:2,2', text: '0'}
          - {id: d, op: fill, part: 'cell:3,2', text: 'x'}
      - say: 'Square them, so minus $x$ squared is $x$ squared, then 0, then $x$ squared.'
        write: '$(-x)^{2} = x^{2},\ 0^{2} = 0,\ x^{2}$'
        diagram_do:
          - {id: d, op: fill, part: 'cell:1,3', text: 'x²'}
          - {id: d, op: fill, part: 'cell:2,3', text: '0'}
          - {id: d, op: fill, part: 'cell:3,3', text: 'x²'}
      - say: 'Add the last column, and $x$ squared plus 0 plus $x$ squared is $2x$ squared.'
        write: '$\sum d^{2} = x^{2} + 0 + x^{2} = 2x^{2}$'
      - section: 'The equation'
        say: 'Substitute into the variance, so $2x$ squared over 3, and the variance is 6.'
        write: '$\dfrac{2x^{2}}{3} = 6$'
      - say: 'Multiply both sides by 3. 6 times 3 is 18.'
        write: '$2x^{2} = 18$'
      - say: 'Divide both sides by 2. 18 over 2 is 9.'
        write: '$x^{2} = 9$'
      - say: 'Take the square root of both sides, so $x$ is plus or minus 3. The question wants the positive value.'
        write: '$x = \pm 3$, $\ \therefore x = 3$'
      - section: 'Check'
        say: 'To check, with $x$ equals 3 the numbers are 1, 4 and 7, and the mean is 4. The squared deviations are 9, 0 and 9, and 18 over 3 is 6.'
        write: 'Check: $\dfrac{(1 - 4)^{2} + 0^{2} + (7 - 4)^{2}}{3} = \dfrac{18}{3} = 6$ ✓'
        doodle_do:
          - {id: plank, op: label, part: plank, text: 'x = 3: 1, 4, 7'}
      - section: 'Answer'
        say: 'So $x$ is 3, which is option C.'
        write: '$\therefore x = 3$'
        answer: true
    traps:
      A: 'You went for 1. Then the numbers would be 1, 2 and 3, whose variance is 2 over 3, not 6. We need $2x$ squared over 3 to be 6, so $x = 3$.'
      B: 'You went for 2. Then the numbers would be 1, 3 and 5, whose variance is 8 over 3, not 6. We need $x$ squared to be 9, so $x = 3$.'
      D: 'You went for 4. Then the numbers would be 1, 5 and 9, whose variance is 32 over 3, not 6. We need $x$ squared to be 9, so $x = 3$.'

  46:
    moments:
      - section: 'The question'
        say: 'A bag has 16 red balls and 20 blue balls. How many white balls must be added so that the probability of picking red is 2 over 5?'
        write: '16 red, 20 blue; $P(\text{red}) = \dfrac{2}{5}$ after adding white'
        doodle: {name: 'custom:1998_q46_a', id: bag, caption: 'Adding white balls leaves 16 reds'}
      - say: 'Solution. Let $x$ be the number of white balls added.'
        write: 'Solution: let $x$ = number of white balls'
      - say: 'The key idea is that adding white balls does not change the number of reds. n of red stays at 16. Only the total changes.'
        write: '$n(\text{red}) = 16$'
        doodle_do:
          - {id: bag, op: circle, part: reds, text: 'still 16'}
      - say: 'The new total, n of $S$, is 16 plus 20 plus $x$. 16 plus 20 is 36.'
        write: '$n(S) = 16 + 20 + x = 36 + x$'
      - section: 'The probability'
        say: 'The probability of red is n of red over n of $S$, the favourable outcomes over the total.'
        write: '$P(\text{red}) = \dfrac{n(\text{red})}{n(S)} = \dfrac{16}{36 + x}$'
      - say: 'The question says this must equal 2 over 5.'
        write: '$\dfrac{16}{36 + x} = \dfrac{2}{5}$'
      - section: 'Solve for x'
        say: 'Cross-multiply, so 16 times 5 equals 2 times the bracket, 36 plus $x$.'
        write: '$16 \times 5 = 2(36 + x)$'
      - say: '16 times 5 is 80. On the right, 2 times 36 is 72, and 2 times $x$ is $2x$.'
        write: '$80 = 72 + 2x$'
      - say: 'Subtract 72 from both sides. 80 minus 72 is 8.'
        write: '$2x = 80 - 72 = 8$'
      - say: 'Divide both sides by 2. 8 divided by 2 is 4.'
        write: '$\therefore x = \dfrac{8}{2} = 4$'
        doodle: {name: ball-white, id: whites, caption: '4 white balls added', repeat: 4, layout: row}
      - section: 'Check'
        say: 'To check, with 4 white balls the total is 36 plus 4, which is 40. And 16 over 40 is 2 over 5, dividing both by 8.'
        write: 'Check: $\dfrac{16}{36 + 4} = \dfrac{16}{40} = \dfrac{2}{5}\ \checkmark$'
        doodle_do:
          - {id: bag, op: pulse, part: whites}
      - section: 'Answer'
        say: 'Therefore 4 white balls must be added, which is option A.'
        write: 'White balls added $= 4$'
        answer: true
    traps:
      B: 'You went for 20. With 20 white balls n of S is 56, and 16 over 56 is 2 over 7, not 2 over 5. Solving 16 over 36 plus x equal to 2 over 5 gives x equal to 4.'
      C: 'You went for 24. With 24 white balls n of S is 60, and 16 over 60 is 4 over 15. We need n of S to be 40, so only 4 white balls.'
      D: 'You went for 40. That is the new total, n of S, not the number of white balls. The bag already has 36, so 4 white balls bring it to 40.'

  47:
    moments:
      - section: 'The question'
        say: 'The pie chart shows a public servant''s monthly spending from his ₦7,200 income. Housing is twice School Fees. We want the amount spent on housing.'
        write: 'Income $=$ ₦7,200; Housing $= 2 \times$ School Fees. Housing $= ?$'
        doodle: {name: 'custom:1998_q47_a', id: pay, caption: 'Housing is twice school fees'}
      - section: 'Solution'
        say: 'Solution. From the chart, Food is 120 degrees, and Transport has the right-angle mark, so it is 90 degrees.'
        write: 'Food $= 120^{\circ}$, Transport $= 90^{\circ}$'
        point:
          - {figure: 0, kind: circle, target: '120°'}
          - {figure: 0, kind: label, target: Transport, text: '90°'}
      - say: 'Let the angle for School Fees be x degrees. Housing is twice that, so it is 2x degrees.'
        write: 'Let School Fees $= x^{\circ}$, so Housing $= 2x^{\circ}$'
        doodle_do:
          - {id: pay, op: label, part: fees, text: x}
          - {id: pay, op: label, part: house, text: '2x'}
      - say: 'The angles at the centre make 360 degrees.'
        write: '$120 + 90 + x + 2x = 360$'
      - say: '120 plus 90 is 210, and x plus 2x is 3x.'
        write: '$210 + 3x = 360$'
      - say: 'Subtract 210 from both sides, so 3x is 150. Divide by 3, and x is 50.'
        write: '$3x = 150 \Rightarrow x = 50$'
        point:
          - {figure: 0, kind: label, target: School, text: '50°'}
      - say: 'So Housing is 2 times 50, which is 100 degrees.'
        write: 'Housing $= 2 \times 50^{\circ} = 100^{\circ}$'
        point:
          - {figure: 0, kind: label, target: Housing, text: '100°'}
        doodle_do:
          - {id: pay, op: circle, part: house, text: '100°'}
      - section: 'Housing in naira'
        say: 'Now the formula. An item''s amount is its sectoral angle over 360, times the total income.'
        write: 'Amount $= \dfrac{\text{sectoral angle}}{360^{\circ}} \times \text{total}$'
      - say: 'Now substitute. Housing is 100 degrees, and the income is ₦7,200.'
        write: 'Housing $= \dfrac{100}{360} \times 7200$'
        point:
          - {line: 8, kind: move, from: {line: 6, at: '= 100'}, at: '100', text: 'Housing angle'}
          - {line: 8, kind: move, from: {line: 0, at: '7,200'}, at: '7200', text: 'income'}
      - say: '7200 divided by 360 is 20, so this is 100 times 20.'
        write: '$= 100 \times 20$'
      - say: '100 times 20 is 2000.'
        write: '$= 2000$'
        doodle_do:
          - {id: pay, op: label, part: house, text: '₦2,000'}
          - {id: pay, op: pulse, part: envelope}
        point:
          - {line: 10, kind: highlight, at: '2000', to: {doodle: pay, part: house}}
      - section: 'Check'
        say: 'Check the condition. School Fees is 50 over 360 of 7200, which is 50 times 20, or ₦1,000. And ₦2,000 is twice ₦1,000.'
        write: 'Check: School Fees $= 50 \times 20 = 1000$; $\ 2000 = 2 \times 1000\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore he spends ₦2,000 on housing, which is answer choice B.'
        write: '$\therefore$ Housing $=$ ₦2,000'
        answer: true
        point:
          - {figure: 0, kind: circle, target: Housing, text: '₦2,000'}
    traps:
      A: 'You went for ₦1,000. That is School Fees, 50 degrees. Housing is twice School Fees: 100 degrees, and 100 over 360 of ₦7,200 is ₦2,000.'
      C: 'You went for ₦3,000. That is the whole 150 degrees left after Food and Transport. It is shared between Housing and School Fees, and Housing gets 100 degrees: ₦2,000.'
      D: 'You went for ₦4,000. That would be 200 degrees, more than the 150 degrees left. Housing is 100 degrees, and 100 over 360 of ₦7,200 is ₦2,000.'

  48:
    moments:
      - section: 'The question'
        say: 'The bar chart shows the marks of 60 pupils in a test out of 10. The pass mark is 5. We want the percentage of pupils who failed.'
        write: 'Pass mark $= 5$. Percentage who failed $= ?$'
        point:
          - {figure: 0, kind: underline, target: 'Marks', text: 'out of 10'}
      - section: 'Solution'
        say: 'Solution. The height of each bar is the frequency, which is the number of pupils with that mark. Read the bars, from mark 0 up to mark 10, into a frequency table.'
        write: 'Marks $0$ to $10$: $f = 1,\ 3,\ 4,\ 7,\ 10,\ 8,\ 7,\ 9,\ 8,\ 2,\ 1$'
        diagram: {id: t, kind: table, columns: ['Mark (x)', 'Frequency (f)'], rows: [[0, 1], [1, 3], [2, 4], [3, 7], [4, 10], [5, 8], [6, 7], [7, 9], [8, 8], [9, 2], [10, 1]]}
        point:
          - {figure: 0, kind: circle, target: 'Frequency', text: 'f'}
          - {figure: 0, kind: label, target: {x: 73.6, y: 196}, text: 'mark 0: 1'}
          - {figure: 0, kind: label, target: {x: 346.6, y: 196}, text: 'mark 10: 1'}
      - say: 'Check the table against the 60 pupils by adding the frequencies.'
        write: '$\Sigma f = 1 + 3 + 4 + 7 + 10 + 8 + 7 + 9 + 8 + 2 + 1$'
      - say: 'The first five make 25, and the last six make 35. 25 plus 35 is 60, so every pupil is counted.'
        write: '$= 25 + 35 = 60\ \checkmark$'
        diagram_do:
          - {id: t, op: total, part: 'col:2', 'on': 'is 60'}
      - section: 'Who failed'
        say: 'The pass mark is 5, so a mark of 5 is a pass. Failing means a mark below 5, that is marks 0, 1, 2, 3 and 4.'
        write: 'Failed: $x < 5$, that is marks $0,\ 1,\ 2,\ 3,\ 4$'
        doodle: {name: 'custom:1998_q48_a', id: papers, caption: 'Scoring 5 is a pass; 4 is a fail'}
        doodle_do:
          - {id: papers, op: circle, part: fail, text: 'below 5'}
        point:
          - {figure: 0, kind: circle, target: '5', text: 'pass mark'}
      - say: 'Add the frequencies of those five marks. 1 plus 3 is 4, plus 4 is 8, plus 7 is 15, plus 10 is 25 pupils.'
        write: 'Number failed $= 1 + 3 + 4 + 7 + 10 = 25$'
        diagram_do:
          - {id: t, op: highlight, part: 'row:5', text: 'marks 0 to 4: 25', 'on': '25 pupils'}
      - section: 'The percentage'
        say: 'A percentage is the part over the whole, times 100.'
        write: 'Percentage failed $= \dfrac{\text{number failed}}{\text{total}} \times 100\%$'
      - say: 'Substitute, and 25 failed, out of 60 pupils.'
        write: '$= \dfrac{25}{60} \times 100\%$'
        point:
          - {line: 7, kind: move, from: {line: 5, at: '= 25'}, at: '60[[25]]', text: 'failed'}
          - {line: 7, kind: move, from: {line: 3, at: '= 60'}, at: '[[60]]25', text: 'total'}
      - say: 'Divide the top and the bottom by 5 to get 5 over 12. And 5 times 100 is 500.'
        write: '$= \dfrac{5}{12} \times 100\% = \dfrac{500}{12}\%$'
      - say: '500 divided by 12 is 41.67, which is 41.7 to one decimal place.'
        write: '$= 41.67\% \approx 41.7\%$'
      - section: 'Check'
        say: 'Check with the pupils who passed. 35 over 60, times 100, is 58.3 percent. 41.7 plus 58.3 is 100 percent.'
        write: 'Check: $\dfrac{35}{60} \times 100\% = 58.3\%$; $\ 41.7 + 58.3 = 100\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore 41.7 percent of the pupils failed, which is answer choice C.'
        write: '$\therefore$ percentage failed $\approx 41.7\%$'
        answer: true
    traps:
      A: 'You went for 59.4%. That is near the pass rate, not the fail rate: 35 out of 60 passed, which is 58.3%. The question asks who failed: 25 out of 60, or 41.7%.'
      B: 'You went for 50%. Even counting the pupils on 5 as failures gives 33 out of 60, which is 55%. But scoring the pass mark is a pass, so 25 failed: 41.7%.'
      D: 'You went for 25%. 25 is the number of pupils who failed, not the percentage. 25 over 60, times 100, is 41.7%.'

  49:
    moments:
      - section: 'The question'
        say: 'In a championship, teams $X$ and $Y$ are given probabilities 2 over 5 and 1 over 3 of winning the gold. What is the probability that either team wins it?'
        write: '$P(X) = \dfrac{2}{5},\quad P(Y) = \dfrac{1}{3}$'
        doodle: {name: 'custom:1998_q49_a', id: gold, caption: 'One gold: X or Y, never both'}
      - say: 'Solution. There is only one gold medal, so $X$ and $Y$ cannot both win it. The two events are mutually exclusive.'
        write: 'Solution: $X$ and $Y$ are mutually exclusive'
        doodle_do:
          - {id: gold, op: circle, part: medal, text: 'only one'}
      - section: 'The addition rule'
        say: 'For mutually exclusive events, P of $X$ or $Y$ is P of $X$ plus P of $Y$.'
        write: '$P(X \text{ or } Y) = P(X) + P(Y)$'
        point:
          - {line: 1, kind: underline, at: 'mutually exclusive', text: 'so add'}
      - say: 'Substitute, which gives 2 over 5 plus 1 over 3.'
        write: '$= \dfrac{2}{5} + \dfrac{1}{3}$'
        point:
          - {line: 3, kind: move, from: {line: 0, at: '52'}, at: '[[52]] +', text: 'P(X)'}
          - {line: 3, kind: move, from: {line: 0, at: '31'}, at: '+ [[31]]', text: 'P(Y)'}
        doodle_do:
          - {id: gold, op: highlight, part: team-x}
          - {id: gold, op: highlight, part: team-y}
      - say: 'The L.C.M. of 5 and 3 is 15. 2 over 5 is 6 over 15, and 1 over 3 is 5 over 15.'
        write: '$= \dfrac{6}{15} + \dfrac{5}{15}$'
      - say: '6 plus 5 is 11, over the same 15.'
        write: '$= \dfrac{6 + 5}{15} = \dfrac{11}{15}$'
        doodle_do:
          - {id: gold, op: label, part: medal, text: 'X or Y: 11/15'}
      - section: 'Check'
        say: 'To check, 11 over 15 is less than 1, and bigger than each team on its own, as an "or" probability should be.'
        write: 'Check: $\dfrac{6}{15} < \dfrac{11}{15} < 1\ \checkmark$'
      - say: 'The 10 teams in the question were not needed. Only $X$ and $Y$ matter, and their probabilities were given.'
        write: 'The 10 teams: not needed'
        doodle: {name: person-small, id: teams, caption: 'the 10 teams', repeat: 10, layout: row}
        doodle_do:
          - {id: teams, op: group, n: 2, text: 'X and Y'}
      - section: 'Answer'
        say: 'Therefore the probability that either team wins the gold is 11 over 15, so the answer is option C.'
        write: '$\therefore P(X \text{ or } Y) = \dfrac{11}{15}$'
        answer: true
    traps:
      A: 'You went for 2 over 15. That is 2 over 5 times 1 over 3, the multiplication rule for both winning, which cannot happen here. For mutually exclusive events, "or" means add: 11 over 15.'
      B: 'You went for 7 over 15. Check the L.C.M. working: 2 over 5 is 6 over 15 and 1 over 3 is 5 over 15, so the sum is 11 over 15.'
      D: 'You went for 13 over 15. Check the L.C.M. working: 1 over 3 is 5 over 15, not 7 over 15. 6 over 15 plus 5 over 15 is 11 over 15.'

  50:
    moments:
      - section: 'The question'
        say: '$x$ and $y$ can each be 1, 2, 3 or 4, like two spinners. What is the probability that their product is not greater than 6? "Not greater than" lets 6 itself in.'
        write: '$x,\ y \in \{1, 2, 3, 4\}$: $P(xy \le 6) = ?$'
        doodle: {name: 'custom:1998_q50_a', id: spinners, caption: 'x and y: each 1, 2, 3 or 4'}
      - say: 'Solution. Not greater than 6 means 6 or less. Let $E$ be the event that $xy$ is at most 6.'
        write: 'Solution: let $E$ = $xy \le 6$'
      - section: 'The sample space'
        say: 'Draw the outcome table, with $x$ down the side, $y$ across the top, and the product in each cell.'
        diagram:
          id: s
          kind: table
          'on': 'outcome table'
          columns: ['×', '1', '2', '3', '4']
          rows: [[1, 1, 2, 3, 4], [2, 2, 4, 6, 8], [3, 3, 6, 9, 12], [4, 4, 8, 12, 16]]
      - say: 'Each spinner has 4 values, so the table has 4 times 4 cells. n of $S$ is 16.'
        write: '$n(S) = 4 \times 4 = 16$'
        doodle_do:
          - {id: spinners, op: label, part: question, text: '4 × 4 = 16 pairs'}
      - section: 'The favourable outcomes'
        say: 'Go row by row. When $x$ is 1, the products are 1, 2, 3 and 4, and all four are 6 or less.'
        write: '$x = 1$: $1, 2, 3, 4 \to 4$'
        diagram_do:
          - {id: s, op: highlight, part: 'row:1'}
        doodle_do:
          - {id: spinners, op: circle, part: spin-x, text: 'x = 1'}
      - say: 'When $x$ is 2, the products are 2, 4, 6 and 8. The first three count.'
        write: '$x = 2$: $2, 4, 6 \to 3$'
        diagram_do:
          - {id: s, op: highlight, part: 'cell:2,2'}
          - {id: s, op: highlight, part: 'cell:2,3'}
          - {id: s, op: highlight, part: 'cell:2,4'}
      - say: 'When $x$ is 3, the products are 3, 6, 9 and 12. Only 3 and 6 count.'
        write: '$x = 3$: $3, 6 \to 2$'
        diagram_do:
          - {id: s, op: highlight, part: 'cell:3,2'}
          - {id: s, op: highlight, part: 'cell:3,3'}
      - say: 'When $x$ is 4, the products are 4, 8, 12 and 16. Only 4 counts.'
        write: '$x = 4$: $4 \to 1$'
        diagram_do:
          - {id: s, op: highlight, part: 'cell:4,2'}
      - say: 'Add the ringed cells, so n of $E$ is 4 plus 3 plus 2 plus 1, which is 10.'
        write: '$n(E) = 4 + 3 + 2 + 1 = 10$'
      - section: 'The probability'
        say: 'The probability of $E$ is n of $E$ over n of $S$, which means the number of favourable outcomes over the total number of possible outcomes.'
        write: '$P(E) = \dfrac{n(E)}{n(S)}$'
      - say: 'Substitute, giving 10 over 16.'
        write: '$= \dfrac{10}{16}$'
        point:
          - {line: 10, kind: move, from: {line: 8, at: '= 10'}, at: '16[[10]]', text: 'n(E)'}
          - {line: 10, kind: move, from: {line: 3, at: '= 16'}, at: '[[16]]10', text: 'n(S)'}
        doodle_do:
          - {id: spinners, op: label, part: question, text: '10 of 16'}
      - say: 'Divide the top and the bottom by 2. 10 over 16 is 5 over 8.'
        write: '$= \dfrac{5}{8}$'
      - section: 'Check'
        say: 'Check with the cells not ringed, which are 8, 9, 12, 8, 12 and 16. That is 6 cells, and 10 plus 6 is 16.'
        write: 'Check: $16 - 10 = 6$ cells above 6 $\checkmark$'
      - section: 'Answer'
        say: 'Therefore the probability that the product is not greater than 6 is 5 over 8, which is option A.'
        write: '$\therefore P(xy \le 6) = \dfrac{5}{8}$'
        answer: true
    traps:
      B: 'You went for 5 over 16. n of E is 10 ringed cells, not 5. 10 over 16 simplifies to 5 over 8.'
      C: 'You went for a half. That leaves out the two cells where the product is exactly 6: 2 times 3 and 3 times 2. "Not greater than 6" includes 6, so n of E is 10, and 10 over 16 is 5 over 8.'
      D: 'You went for 3 over 8. That is 6 over 16, the cells with a product greater than 6, P of E complement. The question wants the other 10 cells: 5 over 8.'
