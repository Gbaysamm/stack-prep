  43:
    moments:
      - say: 'We want to estimate the mode from this grouped table of hourly earnings. The numbers of workers are 17, 32, 25 and 24.'
        write: '$\text{frequencies: } 17, \ 32, \ 25, \ 24$'
      - say: 'First, the modal class is the class with the highest frequency. That is 10 to 14, with 32 workers.'
        write: '$\text{modal class: } 10 - 14$'
      - say: 'The formula uses $L$, the lower class boundary, $f_{1}$, the modal frequency, $f_{0}$ and $f_{2}$, the frequencies either side, and $c$, the class width.'
        write: '$\text{mode} = L + \left(\dfrac{f_{1} - f_{0}}{(f_{1} - f_{0}) + (f_{1} - f_{2})}\right) \times c$'
      - say: 'Careful: $L$ is the boundary, not the limit. The classes jump from 9 to 10, so the boundary is halfway between, at 9.5.'
        write: '$L = \dfrac{9 + 10}{2} = 9.5$'
      - say: 'The class runs from 9.5 to 14.5, so its width is 5.'
        write: '$c = 14.5 - 9.5 = 5$'
      - say: 'The modal frequency is 32, the class before has 17, and the class after has 25.'
        write: '$f_{1} = 32, \ f_{0} = 17, \ f_{2} = 25$'
      - say: '32 minus 17 is 15.'
        write: '$f_{1} - f_{0} = 32 - 17 = 15$'
      - say: '32 minus 25 is 7.'
        write: '$f_{1} - f_{2} = 32 - 25 = 7$'
      - say: 'Now substitute everything into the formula.'
        write: '$\text{mode} = 9.5 + \dfrac{15}{15 + 7} \times 5$'
      - say: '15 plus 7 is 22, and 15 times 5 is 75.'
        write: '$= 9.5 + \dfrac{75}{22}$'
      - say: '75 divided by 22 is about 3.409.'
        write: '$= 9.5 + 3.409$'
