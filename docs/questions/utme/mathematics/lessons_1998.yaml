      - say: 'We expand along the top row, because it has a zero in it. Each entry in the row is multiplied by the small 2 by 2 determinant left when we cover that entry''s row and column.'
        write: 'Expand along row 1: $x,\ 1,\ 0$'
      - say: 'The signs along the top row go plus, minus, plus. And the last entry is 0, so its term vanishes and only two terms survive.'
        write: '$= x\begin{vmatrix} 2 & 3 \\ 1 + x & 4 \end{vmatrix} - 1\begin{vmatrix} 1 - x & 3 \\ 1 & 4 \end{vmatrix} + 0$'
      - say: 'First small determinant, for the $x$. It holds 2, 3, $1 + x$ and 4. Cross-multiply: 2 times 4, minus 3 times $1 + x$.'
        write: 'For $x$: $\begin{vmatrix} 2 & 3 \\ 1 + x & 4 \end{vmatrix} = 2 \times 4 - 3(1 + x)$'
      - say: '2 times 4 is 8. 3 times $1 + x$ is $3 + 3x$. And 8 minus 3 is 5.'
        write: '$= 8 - 3 - 3x = 5 - 3x$'
      - say: 'Second small determinant, for the 1. Cover its row and column, and that leaves $1 - x$, 3, 1 and 4. Cross-multiply: $1 - x$ times 4, minus 3 times 1.'
        write: 'For the 1: $\begin{vmatrix} 1 - x & 3 \\ 1 & 4 \end{vmatrix} = 4(1 - x) - 3 \times 1$'
      - say: '4 times $1 - x$ is $4 - 4x$, and 4 minus 3 is 1.'
        write: '$= 4 - 4x - 3 = 1 - 4x$'
      - say: 'Now put the two results back into the expansion, keeping the minus sign in front of the second one.'
        write: 'So the determinant $= x(5 - 3x) - 1(1 - 4x)$'
        point:
          - {line: 7, kind: move, from: {line: 4, at: '= 5 − 3x'}, at: '(5 − 3x)', text: 'for x'}
          - {line: 7, kind: move, from: {line: 6, at: '= 1 − 4x'}, at: '(1 − 4x)', text: 'for the 1'}
      - say: 'Expand. $x$ times 5 is $5x$, and $x$ times negative $3x$ is negative $3x^{2}$. Minus 1 times $1 - 4x$ is negative 1 plus $4x$.'
        write: '$= 5x - 3x^{2} - 1 + 4x$'
      - say: 'Collect like terms. $5x$ plus $4x$ is $9x$.'
        write: '$= -3x^{2} + 9x - 1$'
      - say: 'So the determinant is $-3x^{2} + 9x - 1$, which is answer choice B.'
        write: 'Determinant $= -3x^{2} + 9x - 1$'
        answer: true
    traps:
      A: 'You went for $-3x^{2} - 17$. The $x$ terms have vanished and the constant is wrong. The two small determinants are $5 - 3x$ and $1 - 4x$, and combining them gives $-3x^{2} + 9x - 1$.'
      C: 'You went for $3x^{2} + 17$. The $x^{2}$ term should be negative: $x$ times negative $3x$ is negative $3x^{2}$. Work each small determinant carefully and keep the minus in front of the second.'
      D: 'You went for $3x^{2} - 9x + 5$. The signs of the $x^{2}$ and $x$ terms are the wrong way round, and the constant is off. Expanding along the top row gives $x(5 - 3x) - (1 - 4x)$, which is $-3x^{2} + 9x - 1$.'

  24:
    moments:
      - say: 'We have matrices $P$ and $Q$, and $PQ$ equals the identity matrix $I$. We want $u$ and $v$.'
        write: '$\begin{pmatrix} 2 & 3 \\ 4 & 5 \end{pmatrix}\begin{pmatrix} u & 4 + u \\ -2v & v \end{pmatrix} = \begin{pmatrix} 1 & 0 \\ 0 & 1 \end{pmatrix}$'
      - say: 'To multiply matrices, we take a row of the first times a column of the second. We have two unknowns, so the first column of $Q$ gives us enough equations.'
      - say: 'Top-left entry: row 1 of $P$ times column 1 of $Q$. That is 2 times $u$, plus 3 times negative $2v$, and it must equal 1.'
        write: '$2u + 3(-2v) = 1$'
      - say: '3 times negative $2v$ is negative $6v$.'
        write: '$2u - 6v = 1$'
      - say: 'Bottom-left entry: row 2 times column 1. That is 4 times $u$, plus 5 times negative $2v$, and it must equal 0.'
        write: '$4u + 5(-2v) = 0$'
      - say: '5 times negative $2v$ is negative $10v$.'
        write: '$4u - 10v = 0$'
      - say: 'This second equation is easier, because it equals zero. Add $10v$ to both sides.'
        write: '$4u = 10v$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '−10v'}, at: '10v', text: 'across the ='}
      - say: 'Divide both sides by 4. 10 over 4 simplifies to 5 over 2.'
        write: '$u = \dfrac{10v}{4} = \dfrac{5v}{2}$'
      - say: 'Now go back to the first equation, $2u - 6v = 1$, and replace $u$ with the $5v$ over 2 we just found.'
        write: 'Into $2u - 6v = 1$: $2\left(\dfrac{5v}{2}\right) - 6v = 1$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '= 25v'}, at: '(25v)', text: 'u'}
      - say: '2 times $5v$ over 2 is $5v$, because the 2s cancel. Then $5v$ minus $6v$ is negative $v$.'
        write: '$5v - 6v = 1$, so $-v = 1$'
      - say: 'Multiply both sides by negative 1.'
        write: '$v = -1$'
      - say: 'Then $u$ is $5v$ over 2 with $v$ equal to negative 1. 5 times negative 1 is negative 5, so $u$ is negative 5 over 2.'
        write: '$u = \dfrac{5(-1)}{2} = -\dfrac{5}{2}$'
        point:
          - {line: 11, kind: move, from: {line: 10, at: '= −1'}, at: '(−1)', text: 'v'}
      - say: 'Let''s check with the second column of $Q$. Its top entry, $4 + u$, is 4 minus 5 over 2, which is 8 over 2 minus 5 over 2, so 3 over 2.'
        write: 'Check: $4 + u = \dfrac{8}{2} - \dfrac{5}{2} = \dfrac{3}{2}$'
      - say: 'Row 1 of $P$ times column 2 must give 0. 2 times 3 over 2 is 3, and 3 times negative 1 is negative 3. 3 minus 3 is 0. Good.'
        write: '$2\left(\tfrac{3}{2}\right) + 3(-1) = 3 - 3 = 0\ \checkmark$'
      - say: 'Row 2 times column 2 must give 1. 4 times 3 over 2 is 6, and 5 times negative 1 is negative 5. 6 minus 5 is 1. Good.'
        write: '$4\left(\tfrac{3}{2}\right) + 5(-1) = 6 - 5 = 1\ \checkmark$'
      - say: 'So $u$ is negative 5 over 2 and $v$ is negative 1, which is answer choice A.'
        write: '$(u, v) = \left(-\tfrac{5}{2}, -1\right)$'
        answer: true
    traps:
      B: 'You went for negative 5 over 2, 3 over 2. The $u$ is right, but 3 over 2 is $4 + u$, the top-right entry of $Q$, not $v$. From $-v = 1$, $v$ is negative 1.'
      C: 'You went for negative 5 over 6, and 1. Check the bottom-left entry: 4 times negative 5 over 6, minus 10, is not 0. The equation $4u - 10v = 0$ gives $u = \tfrac{5v}{2}$, and then $v = -1$ and $u = -\tfrac{5}{2}$.'
      D: 'You went for 5 over 2, 2 over 3. They fit the top-left entry, since 5 minus 4 is 1, but not the bottom-left: 10 minus 20 over 3 is not 0. Solving both gives $u = -\tfrac{5}{2}$ and $v = -1$.'

  25:
