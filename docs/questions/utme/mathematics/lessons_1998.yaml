        write: 'Divide by $-3$, sign flips: $\dfrac{-3m^{2}}{-3} + \dfrac{12m}{-3} + \dfrac{36}{-3} \le 0$'
      - say: 'Negative $3m^{2}$ over negative 3 is $m^{2}$. $12m$ over negative 3 is negative $4m$. And 36 over negative 3 is negative 12.'
        write: '$m^{2} - 4m - 12 \le 0$'
      - say: 'Factorise. We need two numbers that multiply to negative 12 and add to negative 4. Those are negative 6 and 2.'
        write: '$(m - 6)(m + 2) \le 0$'
      - say: 'The bracket product is zero at $m = 6$ and $m = -2$. Where is it negative? Try a value in between, like 0: negative 6 times 2 is negative 12, which is below zero. Good.'
