          - {figure: sketch, kind: circle, target: '123.2 litres'}
      - say: 'First, the units. 1 litre is 1000 cubic centimetres, so multiply 123.2 by 1000.'
        write: '$V = 123.2 \times 1000 = 123{,}200\ \text{cm}^{3}$'
      - say: 'Next, the radius is half the diameter. Half of 56 is 28.'
        write: '$r = 28 \text{ cm}$'
      - say: 'The volume of a cylinder is $\pi r^{2}h$, and the drum''s volume is the 123,200 we just found.'
        write: '$\pi r^{2}h = 123{,}200$'
        point:
          - {line: 3, kind: move, from: {line: 1, at: '123,200'}, at: '123,200', text: 'in cm³'}
      - say: 'Put in $r = 28$, and use $\pi$ as 22 over 7, which suits 28 nicely because 28 is a multiple of 7.'
        write: '$\dfrac{22}{7} \times 28^{2} \times h = 123{,}200$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: '28'}, at: '[[28]]2', text: 'radius'}
      - say: '28 squared is 784.'
        write: '$\dfrac{22}{7} \times 784 \times h = 123{,}200$'
