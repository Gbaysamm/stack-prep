        write: '$P = (Q + P) - Q$'
      - say: 'So we subtract the matrix $Q$ from the matrix $Q + P$.'
        write: '$= \begin{pmatrix} 7 & 2 \\ 6 & 8 \end{pmatrix} - \begin{pmatrix} 6 & 0 \\ 4 & 5 \end{pmatrix}$'
      - say: 'Matrices subtract entry by entry: 7 minus 6, 2 minus 0, 6 minus 4, and 8 minus 5.'
        write: '$= \begin{pmatrix} 7 - 6 & 2 - 0 \\ 6 - 4 & 8 - 5 \end{pmatrix}$'
      - say: '7 minus 6 is 1, 2 minus 0 is 2, 6 minus 4 is 2, and 8 minus 5 is 3.'
        write: '$= \begin{pmatrix} 1 & 2 \\ 2 & 3 \end{pmatrix}$'
      - say: 'Now double the $P$ we just found by multiplying every entry by 2. That gives 2, 4, 4 and 6.'
        write: '$2P = \begin{pmatrix} 2 \times 1 & 2 \times 2 \\ 2 \times 2 & 2 \times 3 \end{pmatrix} = \begin{pmatrix} 2 & 4 \\ 4 & 6 \end{pmatrix}$'
        point:
          - { line: 4, kind: arrow, text: 'P' }
      - say: 'Next, add $Q$ and $2P$, entry by entry.'
        write: '$Q + 2P = \begin{pmatrix} 6 + 2 & 0 + 4 \\ 4 + 4 & 5 + 6 \end{pmatrix}$'
      - say: '6 plus 2 is 8, 0 plus 4 is 4, 4 plus 4 is 8, and 5 plus 6 is 11.'
        write: '$= \begin{pmatrix} 8 & 4 \\ 8 & 11 \end{pmatrix}$'
      - say: 'The bars mean the determinant. For a 2 by 2 matrix, multiply along the leading diagonal, then subtract the product of the other diagonal.'
        write: 'Determinant: $\begin{vmatrix} a & b \\ c & d \end{vmatrix} = ad - bc$'
      - say: 'In the matrix we just built, the leading diagonal is 8 and 11, and the other diagonal is 4 and 8. So it is 8 times 11, minus 4 times 8.'
