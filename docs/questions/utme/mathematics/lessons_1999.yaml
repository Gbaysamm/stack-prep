# UTME 1999 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1999.yaml. Answers match that file.
format_version: 1
exam_year: 1999
lessons:
  1:
    moments:
      - say: 'We are told that this fraction of powers equals $a^{p}b^{q}c^{r}$, and we want the value of $p + 2q$.'
        write: '$\dfrac{a^{2}b^{3}c}{a^{-1}b^{4}c^{5}} = a^{p}b^{q}c^{r}$'
      - say: 'Here is the rule we need. When we divide powers of the same letter, we subtract the indices: the top index minus the bottom index.'
        write: '$\dfrac{x^{m}}{x^{n}} = x^{m - n}$'
      - say: 'We do this one letter at a time. Start with $a$. On top its index is 2, and underneath it is negative 1. So $p$ is 2 minus negative 1.'
        write: '$p = 2 - (-1)$'
      - say: 'Subtracting a negative is the same as adding. 2 plus 1 is 3.'
        write: '$p = 2 + 1 = 3$'
      - say: 'Now $b$. On top its index is 3, and underneath it is 4. 3 minus 4 is negative 1.'
        write: '$q = 3 - 4 = -1$'
      - say: 'Now $c$. The $c$ on top has no index written, and that means its index is 1. Underneath it is 5. 1 minus 5 is negative 4.'
        write: '$r = 1 - 5 = -4$'
      - say: 'So the whole fraction simplifies to $a^{3}b^{-1}c^{-4}$.'
        write: '$a^{3}b^{-1}c^{-4}$'
      - say: 'The question only wants $p + 2q$. Let''s substitute: $p$ is 3 and $q$ is negative 1.'
        write: '$p + 2q = 3 + 2(-1)$'
      - say: '2 times negative 1 is negative 2.'
        write: '$= 3 - 2$'
      - say: '3 minus 2 is 1, which is answer choice C.'
        write: '$= 1$'
        answer: true
    traps:
      A: 'You went for negative 3. That comes from taking $p$ as negative 1. Dividing means top index minus bottom index, and 2 minus negative 1 is 3, so $p$ is 3.'
      B: 'You went for negative 1. That happens if the $a^{-1}$ underneath is treated as an ordinary $a$, giving $p = 1$. But 2 minus negative 1 is 3, so $p + 2q = 3 - 2 = 1$.'
      D: 'You went for 5. That comes from taking $q$ as positive 1, subtracting the wrong way round. For $b$ it is top minus bottom: 3 minus 4 is negative 1.'

  2:
    moments:
      - say: 'We need the value of $x$ that makes these two fractions equal.'
        write: '$\dfrac{\sqrt{2}}{x + \sqrt{2}} = \dfrac{1}{x - \sqrt{2}}$'
      - say: 'The first thing to do is clear the fractions. When two fractions are equal, we can cross-multiply.'
        write: '$\sqrt{2}(x - \sqrt{2}) = 1(x + \sqrt{2})$'
      - say: 'Expand the left side. Root 2 times $x$ is root 2 $x$. Root 2 times root 2 is just 2.'
        write: '$\sqrt{2}x - 2 = x + \sqrt{2}$'
      - say: 'Now gather the $x$ terms on the left and the numbers on the right. Subtract $x$ from both sides, and add 2 to both sides.'
        write: '$\sqrt{2}x - x = 2 + \sqrt{2}$'
      - say: 'Both terms on the left have an $x$, so factor it out.'
        write: '$x(\sqrt{2} - 1) = 2 + \sqrt{2}$'
      - say: 'To get $x$ by itself, divide both sides by root 2 minus 1.'
        write: '$x = \dfrac{2 + \sqrt{2}}{\sqrt{2} - 1}$'
      - say: 'There is a surd on the bottom, so we rationalise. Multiply the top and the bottom by the conjugate, root 2 plus 1.'
        write: '$x = \dfrac{(2 + \sqrt{2})(\sqrt{2} + 1)}{(\sqrt{2} - 1)(\sqrt{2} + 1)}$'
      - say: 'The bottom is a difference of two squares: root 2 squared minus 1 squared. That is 2 minus 1, which is 1.'
        write: '$(\sqrt{2})^{2} - 1^{2} = 2 - 1 = 1$'
      - say: 'Now the top. 2 times root 2 is 2 root 2. 2 times 1 is 2. Root 2 times root 2 is 2. And root 2 times 1 is root 2.'
        write: '$2\sqrt{2} + 2 + 2 + \sqrt{2}$'
      - say: 'Collect like terms. 2 root 2 plus root 2 is 3 root 2, and 2 plus 2 is 4.'
        write: '$= 3\sqrt{2} + 4$'
      - say: 'Dividing by 1 changes nothing. So $x$ is 3 root 2 plus 4, which is answer choice A.'
        write: '$x = 3\sqrt{2} + 4$'
        answer: true
    traps:
      B: 'You went for 3 root 2 minus 4. That is a sign slip with the 2: moving negative 2 to the right-hand side makes it plus 2, and that is where the plus 4 comes from.'
      C: 'You went for 3 minus 2 root 2. That is not what the top multiplies out to. Multiply 2 plus root 2 by root 2 plus 1 term by term: 2 root 2, plus 2, plus 2, plus root 2.'
      D: 'You went for 4 plus 2 root 2. That misses the last product when expanding the top: root 2 times 1 gives one more root 2, making 3 root 2 plus 4.'

  3:
    moments:
      - say: 'A trader bought 100 oranges at 5 for ₦1.20. 20 got spoilt, and he sold the rest at 4 for ₦1.50. We want the percentage gain or loss.'
      - say: 'The plan: find what he spent, find what he received, and compare. Gain or loss is always measured against the cost.'
      - say: 'First the cost. He buys in lots of 5. How many lots of 5 are in 100? 100 divided by 5 is 20.'
        write: '$100 \div 5 = 20 \text{ lots}$'
      - say: 'Each lot costs ₦1.20, so 20 lots cost 20 times 1.20, which is 24. He spent ₦24.'
        write: '$\text{Cost} = 20 \times 1.20 = 24$'
      - say: 'Now the selling side. 20 oranges were spoilt, so 100 minus 20 leaves 80 to sell.'
        write: '$100 - 20 = 80 \text{ oranges}$'
      - say: 'He sells in lots of 4. 80 divided by 4 is 20 lots.'
        write: '$80 \div 4 = 20 \text{ lots}$'
      - say: 'Each lot sells for ₦1.50. 20 times 1.50 is 30. He received ₦30.'
        write: '$\text{Sales} = 20 \times 1.50 = 30$'
      - say: 'He received ₦30 and spent ₦24. 30 is more than 24, so it is a gain. 30 minus 24 is 6.'
        write: '$\text{Gain} = 30 - 24 = 6$'
      - say: 'To turn the gain into a percentage, divide it by the cost and multiply by 100.'
        write: '$\dfrac{6}{24} \times 100\%$'
      - say: '6 over 24 simplifies to one quarter, and a quarter of 100 is 25.'
        write: '$= \dfrac{1}{4} \times 100\% = 25\%$'
      - say: 'So it is a 25% gain, which is answer choice B.'
        write: '$25\% \text{ gain}$'
        answer: true
    traps:
      A: 'You went for 30% gain. The ₦6 gain must be divided by the cost, ₦24. 6 over 24 is a quarter, which is 25%.'
      C: 'You went for 30% loss. He received ₦30 and spent only ₦24, so he made money: it is a gain, not a loss. And 6 over 24 is 25%.'
      D: 'You went for 25% loss. The size is right, but the direction is wrong: ₦30 back on ₦24 spent is a gain.'

  4:
    moments:
      - say: 'We have a universal set $U$ and sets $P$, $Q$ and $R$. We want the complement of $P$ union $Q$, intersected with $R$.'
        write: '$(P \cup Q)'' \cap R$'
      - say: 'We work from the inside of the bracket outwards. First find $P$ union $Q$: everything that is in $P$ or in $Q$.'
        write: '$P = \{3, 4, 5\},\ Q = \{2, 4, 6\}$'
      - say: 'Put 3, 4, 5 together with 2, 4, 6. 4 is in both, but a set lists it only once.'
        write: '$P \cup Q = \{2, 3, 4, 5, 6\}$'
      - say: 'Next the complement, the dash. That means everything in $U$ that is not in $P$ union $Q$.'
        write: '$U = \{1, 2, 3, 4, 5, 6\}$'
      - say: 'Going through $U$: 2, 3, 4, 5 and 6 are all in the union. Only 1 is left out.'
        write: '$(P \cup Q)'' = \{1\}$'
      - say: 'Finally, intersect with $R$, which is 1, 2, 3, 4. Intersection means we keep only what is in both sets.'
        write: '$\{1\} \cap \{1, 2, 3, 4\}$'
      - say: '1 is in $R$, so it stays. The answer is the set containing just 1, which is answer choice C.'
        write: '$= \{1\}$'
        answer: true
    traps:
      A: 'You went for the set 1 to 6. That is the whole universal set. The complement of $P$ union $Q$ keeps only what is outside the union, which is just 1.'
      B: 'You went for 1, 2, 3, 4. That is $R$ itself. Intersecting with $R$ keeps only what is also in the complement, and the complement is just the set containing 1.'
      D: 'You went for the empty set. That comes from doing the steps in the wrong order. Take the complement of $P$ union $Q$ first, which is the set containing 1, and 1 is in $R$.'

  5:
    moments:
      - say: 'We want to divide $2434_{6}$ by $42_{6}$. The easiest way is to convert both to base ten, divide there, then convert back to base six.'
      - say: 'In base six, the place values from the right are 1, 6, 36 and 216. Each column is 6 times the one to its right.'
        write: '$6^{3} = 216,\ 6^{2} = 36,\ 6^{1} = 6,\ 6^{0} = 1$'
      - say: 'So $2434_{6}$ is 2 times 216, plus 4 times 36, plus 3 times 6, plus 4 times 1.'
        write: '$2434_{6} = 2 \times 216 + 4 \times 36 + 3 \times 6 + 4 \times 1$'
      - say: '2 times 216 is 432. 4 times 36 is 144. 3 times 6 is 18. And then 4.'
        write: '$= 432 + 144 + 18 + 4$'
      - say: '432 plus 144 is 576. Plus 18 is 594. Plus 4 is 598.'
        write: '$= 598$'
      - say: 'Now $42_{6}$. That is 4 times 6, plus 2. 24 plus 2 is 26.'
        write: '$42_{6} = 4 \times 6 + 2 = 26$'
      - say: 'Divide in base ten: 598 divided by 26. 26 times 20 is 520, and 26 times 3 is 78. 520 plus 78 is 598, so the answer is 23.'
        write: '$598 \div 26 = 23$'
      - say: 'But 23 is a base ten number, and we must convert it back to base six. Divide 23 by 6: 6 goes in 3 times, which is 18, remainder 5.'
        write: '$23 \div 6 = 3 \text{ remainder } 5$'
      - say: 'Then 3 divided by 6 is 0, remainder 3.'
        write: '$3 \div 6 = 0 \text{ remainder } 3$'
      - say: 'Read the remainders from the bottom up: 3, then 5. So the answer is $35_{6}$, which is answer choice B.'
        write: '$35_{6}$'
        answer: true
    traps:
      A: 'You went for $23_{6}$. 23 is the answer in base ten, written with a base six label. It still has to be converted: 23 is 3 sixes and 5, which is $35_{6}$.'
      C: 'You went for $52_{6}$. That is 5 sixes and 2, which is 32 in base ten. The quotient is 598 divided by 26, which is 23, and that is $35_{6}$.'
      D: 'You went for $55_{6}$. That is 35 in base ten. The quotient in base ten is 23, and 23 in base six is $35_{6}$.'

  6:
    moments:
      - say: 'We have 2 times $Y3$ in base nine equals 3 times $Y3$ in base five. $Y$ is an unknown digit, and we want its value.'
        write: '$2 \times (Y3)_{9} = 3 \times (Y3)_{5}$'
      - say: 'Convert each numeral to base ten, keeping $Y$ as a letter. In base nine, the two columns are worth 9 and 1.'
        write: '$(Y3)_{9} = 9Y + 3$'
      - say: 'In base five, the columns are worth 5 and 1.'
        write: '$(Y3)_{5} = 5Y + 3$'
      - say: 'Now put these into the equation.'
        write: '$2(9Y + 3) = 3(5Y + 3)$'
      - say: 'Expand. 2 times $9Y$ is $18Y$, and 2 times 3 is 6. 3 times $5Y$ is $15Y$, and 3 times 3 is 9.'
        write: '$18Y + 6 = 15Y + 9$'
      - say: 'Subtract $15Y$ from both sides. $18Y$ minus $15Y$ is $3Y$.'
        write: '$3Y + 6 = 9$'
      - say: 'Subtract 6 from both sides. 9 minus 6 is 3.'
        write: '$3Y = 3$'
      - say: 'Divide both sides by 3. 3 divided by 3 is 1.'
        write: '$Y = \dfrac{3}{3} = 1$'
      - say: 'Let''s check. 13 in base nine is 9 plus 3, which is 12, and 2 times 12 is 24. 13 in base five is 5 plus 3, which is 8, and 3 times 8 is 24. They match.'
        write: '$2 \times 12 = 24 = 3 \times 8$'
      - say: 'So $Y$ is 1, which is answer choice D.'
        write: '$Y = 1$'
        answer: true
    traps:
      A: 'You went for 4. Test it: 43 in base nine is 39, and 2 times 39 is 78. 43 in base five is 23, and 3 times 23 is 69. They are not equal. The equation $18Y + 6 = 15Y + 9$ gives $Y = 1$.'
      B: 'You went for 3. Test it: 33 in base nine is 30, doubled is 60. 33 in base five is 18, tripled is 54. Not equal. Solving $3Y = 3$ gives 1.'
      C: 'You went for 2. Test it: 23 in base nine is 21, doubled is 42. 23 in base five is 13, tripled is 39. Not equal. Solving $3Y = 3$ gives 1.'

  7:
    moments:
      - say: 'We want to simplify this square root. The plan: work out the whole fraction under the root first, then take the square root at the end.'
        write: '$\sqrt{\dfrac{0.0023 \times 750}{0.00345 \times 1.25}}$'
      - say: 'Start with the top. Forget the decimal point for a moment: 23 times 75 is 1725.'
        write: '$23 \times 75 = 1725$'
      - say: '0.0023 times 75 has four decimal places, so it is 0.1725. Then 750 is 75 times 10, so we multiply by 10 more and get 1.725.'
        write: '$0.0023 \times 750 = 1.725$'
      - say: 'So the fraction under the root is 1.725 over 0.00345 times 1.25.'
        write: '$\dfrac{1.725}{0.00345 \times 1.25}$'
      - say: 'Let''s divide 1.725 by 0.00345 first. Multiply the top and the bottom by 1000 to move the decimal points. That gives 1725 over 3.45.'
        write: '$\dfrac{1.725}{0.00345} = \dfrac{1725}{3.45}$'
      - say: 'What times 3.45 gives 1725? 3.45 times 100 is 345, and 345 times 5 is 1725. So 3.45 times 500 is 1725, and this is 500.'
        write: '$= 500$'
      - say: 'Now divide that 500 by the 1.25. 1.25 times 4 is 5, so 1.25 times 400 is 500. That gives 400.'
        write: '$\dfrac{500}{1.25} = 400$'
      - say: 'So the whole expression is the square root of 400.'
        write: '$\sqrt{400}$'
      - say: '20 times 20 is 400, so the square root is 20, which is answer choice B.'
        write: '$= 20$'
        answer: true
    traps:
      A: 'You went for 15. 15 squared is 225, but the fraction under the root works out to 400, and the square root of 400 is 20.'
      C: 'You went for 40. 40 squared is 1600. The fraction under the root is 400, whose square root is 20. Check the decimal places when multiplying 0.00345 by 1.25.'
      D: 'You went for 75. That number sits inside the 750 in the question, but it is not the result. The fraction under the root is 400, and its square root is 20.'

  8:
    moments:
      - say: 'We are told that log base 8 of 10 is $x$, and we want log base 8 of 5 in terms of $x$.'
        write: '$\log_{8}10 = x$'
      - say: 'The trick is to build 5 out of 10. 5 is 10 divided by 2.'
        write: '$5 = \dfrac{10}{2}$'
      - say: 'So log base 8 of 5 is log base 8 of 10 over 2.'
        write: '$\log_{8}5 = \log_{8}\dfrac{10}{2}$'
      - say: 'The log of a division is the log of the top minus the log of the bottom.'
        write: '$= \log_{8}10 - \log_{8}2$'
      - say: 'The first part is given to us: it is $x$.'
        write: '$= x - \log_{8}2$'
      - say: 'Now, log base 8 of 2 asks: what power of 8 gives 2? Well, 2 cubed is 8.'
        write: '$8 = 2^{3}$'
      - say: 'So 2 is the cube root of 8, and a cube root is the power one third. 8 to the power one third is 2.'
        write: '$8^{\frac{1}{3}} = 2$'
      - say: 'That means log base 8 of 2 is one third.'
        write: '$\log_{8}2 = \dfrac{1}{3}$'
      - say: 'So log base 8 of 5 is $x$ minus one third, which is answer choice C.'
        write: '$\log_{8}5 = x - \dfrac{1}{3}$'
        answer: true
    traps:
      A: 'You went for half of $x$. Halving the number does not halve the log. The log of 10 over 2 is log 10 minus log 2, which is $x$ minus one third.'
      B: 'You went for $x$ minus one quarter. Log base 8 of 2 is the power of 8 that gives 2. Since 2 cubed is 8, that power is one third, not one quarter.'
      D: 'You went for $x$ minus one half. One half would be log base 4 of 2. Here the base is 8, which is 2 cubed, so log base 8 of 2 is one third.'

  9:
    moments:
      - say: 'Every woman sells at least one of yam, plantain and maize. We know how many sell each item and each pair, and we want the total number of women.'
      - say: 'For three overlapping groups we use the inclusion-exclusion rule: add the singles, subtract the pairs, then add back those in all three.'
        write: '$n = n(Y) + n(P) + n(M) - n(Y \cap P) - n(Y \cap M) - n(P \cap M) + n(Y \cap P \cap M)$'
      - say: 'The singles: yam 10, plantain 14, maize 12.'
        write: '$n(Y) = 10,\ n(P) = 14,\ n(M) = 12$'
      - say: 'Plantain and maize is 5, and yam and maize is 4. These counts already include the women who sell all three.'
        write: '$n(P \cap M) = 5,\ n(Y \cap M) = 4$'
      - say: 'But careful: 2 sell yam and plantain only. The word only leaves out the 3 who sell all three. So the full yam and plantain overlap is 2 plus 3, which is 5.'
        write: '$n(Y \cap P) = 2 + 3 = 5$'
      - say: 'And 3 women sell all three items.'
        write: '$n(Y \cap P \cap M) = 3$'
      - say: 'Now substitute everything into the rule.'
        write: '$n = 10 + 14 + 12 - 5 - 4 - 5 + 3$'
      - say: 'Add the singles first. 10 plus 14 is 24, and 24 plus 12 is 36.'
        write: '$= 36 - 5 - 4 - 5 + 3$'
      - say: 'Now the pairs. 5 plus 4 plus 5 is 14, and 36 minus 14 is 22.'
        write: '$= 22 + 3$'
      - say: '22 plus 3 is 25. Everyone sells at least one item, so that is the whole group: 25 women, which is answer choice A.'
        write: '$= 25$'
        answer: true
    traps:
      B: 'You went for 19. That comes from subtracting the 3 who sell all three instead of adding them back. The rule ends with plus the triple overlap: 22 plus 3 is 25.'
      C: 'You went for 18. Re-check the rule: 10 plus 14 plus 12 is 36, minus the three pairs, 14, is 22, plus the 3 who sell everything is 25.'
      D: 'You went for 17. That undercounts. Remember the yam and plantain overlap is 2 plus 3, which is 5, and then 36 minus 14 plus 3 gives 25.'

  10:
    moments:
      - say: 'We are given the matrix $Q$ and the sum $Q + P$, and we want the determinant of $Q + 2P$.'
        write: '$Q = \begin{pmatrix} 6 & 0 \\ 4 & 5 \end{pmatrix}$'
      - say: 'The first job is to find $P$ on its own. Take $Q$ away from $Q + P$.'
        write: '$P = \begin{pmatrix} 7 & 2 \\ 6 & 8 \end{pmatrix} - \begin{pmatrix} 6 & 0 \\ 4 & 5 \end{pmatrix}$'
      - say: 'Matrices subtract entry by entry. 7 minus 6 is 1, 2 minus 0 is 2, 6 minus 4 is 2, and 8 minus 5 is 3.'
        write: '$P = \begin{pmatrix} 1 & 2 \\ 2 & 3 \end{pmatrix}$'
      - say: 'Now double $P$ by multiplying every entry by 2.'
        write: '$2P = \begin{pmatrix} 2 & 4 \\ 4 & 6 \end{pmatrix}$'
      - say: 'Next, add $Q$ and $2P$, entry by entry.'
        write: '$Q + 2P = \begin{pmatrix} 6 + 2 & 0 + 4 \\ 4 + 4 & 5 + 6 \end{pmatrix}$'
      - say: '6 plus 2 is 8, 0 plus 4 is 4, 4 plus 4 is 8, and 5 plus 6 is 11.'
        write: '$Q + 2P = \begin{pmatrix} 8 & 4 \\ 8 & 11 \end{pmatrix}$'
      - say: 'The bars mean the determinant. For a 2 by 2 matrix, multiply along the leading diagonal, then subtract the product of the other diagonal.'
        write: '$\begin{vmatrix} a & b \\ c & d \end{vmatrix} = ad - bc$'
      - say: 'So it is 8 times 11, minus 4 times 8.'
        write: '$|Q + 2P| = 8 \times 11 - 4 \times 8$'
      - say: '8 times 11 is 88, and 4 times 8 is 32.'
        write: '$= 88 - 32$'
      - say: '88 minus 32 is 56, which is answer choice B.'
        write: '$= 56$'
        answer: true
    traps:
      A: 'You went for 90. Build the matrix first: $Q + 2P$ has entries 8, 4, 8 and 11, and 8 times 11 minus 4 times 8 is 88 minus 32, which is 56.'
      C: 'You went for 102. Check the matrix $P$: it is $Q + P$ minus $Q$, entry by entry, giving 1, 2, 2, 3. Then $Q + 2P$ gives the determinant 56.'
      D: 'You went for 120. That is the size of $|Q|$ times $|2P|$, 30 times 4. Determinants do not combine like that. Add the matrices first, then take one determinant.'

  11:
    moments:
      - say: 'A binary operation star is defined by $a * b = ab + a + b$. The identity element is zero, and we want the inverse of 2.'
        write: '$a * b = ab + a + b$'
      - say: 'The inverse of 2 is the number that combines with 2 to give the identity. Let''s call it $b$. So we need 2 star $b$ to equal zero.'
        write: '$2 * b = 0$'
      - say: 'Use the rule with $a$ equal to 2. $ab$ becomes $2b$, then plus 2, then plus $b$.'
        write: '$2 * b = 2b + 2 + b$'
      - say: 'Collect the $b$ terms. $2b$ plus $b$ is $3b$.'
        write: '$= 3b + 2$'
      - say: 'Now set that equal to the identity, zero.'
        write: '$3b + 2 = 0$'
      - say: 'Subtract 2 from both sides.'
        write: '$3b = -2$'
      - say: 'Divide both sides by 3.'
        write: '$b = -\dfrac{2}{3}$'
      - say: 'Let''s check it. 2 times negative two thirds is negative four thirds. Then we add 2, and add negative two thirds.'
        write: '$2\left(-\tfrac{2}{3}\right) + 2 - \tfrac{2}{3}$'
      - say: 'Negative four thirds minus two thirds is negative six thirds, which is negative 2. Negative 2 plus 2 is zero. It works.'
        write: '$= -\tfrac{6}{3} + 2 = -2 + 2 = 0$'
      - say: 'So the inverse of 2 is negative two thirds, which is answer choice A.'
        write: '$2^{-1} = -\dfrac{2}{3}$'
        answer: true
    traps:
      B: 'You went for one half. That is the ordinary reciprocal of 2, its inverse under multiplication. Under this operation the inverse must make $2 * b$ equal the identity, zero, which gives negative two thirds.'
      C: 'You went for negative one half. Test it: 2 times negative a half is negative 1, plus 2, minus a half, gives a half, not zero. Solving $3b + 2 = 0$ gives negative two thirds.'
      D: 'You went for 56 over 9. Put it in and $2 * b$ comes out far bigger than zero. The identity is zero, so we solve $3b + 2 = 0$, giving negative two thirds.'

  12:
    moments:
      - say: 'In a geometric progression, the first term is twice the common ratio, and the sum to infinity is 8. We want the sum of the first two terms.'
      - say: 'Let the first term be $a$ and the common ratio be $r$. The first term is twice the common ratio, so $a$ equals $2r$.'
        write: '$a = 2r$'
      - say: 'The sum to infinity of a geometric progression is $a$ over 1 minus $r$. It exists when $r$ is between negative 1 and 1.'
        write: '$S_{\infty} = \dfrac{a}{1 - r}$'
      - say: 'The sum to infinity is 8, and $a$ is $2r$.'
        write: '$\dfrac{2r}{1 - r} = 8$'
      - say: 'Multiply both sides by 1 minus $r$ to clear the fraction.'
        write: '$2r = 8(1 - r)$'
      - say: 'Expand the bracket. 8 times 1 is 8, and 8 times $r$ is $8r$.'
        write: '$2r = 8 - 8r$'
      - say: 'Add $8r$ to both sides. $2r$ plus $8r$ is $10r$.'
        write: '$10r = 8$'
      - say: 'Divide both sides by 10. 8 over 10 simplifies to four fifths.'
        write: '$r = \dfrac{8}{10} = \dfrac{4}{5}$'
      - say: 'Four fifths is between negative 1 and 1, so the sum to infinity is fine. Now $a$ is 2 times four fifths, which is eight fifths.'
        write: '$a = 2 \times \dfrac{4}{5} = \dfrac{8}{5}$'
      - say: 'The second term is the first term times $r$. Eight fifths times four fifths: 8 times 4 is 32, and 5 times 5 is 25.'
        write: '$ar = \dfrac{8}{5} \times \dfrac{4}{5} = \dfrac{32}{25}$'
      - say: 'Now add the first two terms. To add, write eight fifths in twenty-fifths: 8 times 5 is 40, so it is 40 over 25.'
        write: '$a + ar = \dfrac{40}{25} + \dfrac{32}{25}$'
      - say: '40 plus 32 is 72. So the sum of the first two terms is 72 over 25, which is answer choice C.'
        write: '$= \dfrac{72}{25}$'
        answer: true
    traps:
      A: 'You went for eight fifths. That is the first term alone. The question wants the first two terms, so add the second term, 32 over 25, to get 72 over 25.'
      B: 'You went for eight thirds. Solve $\dfrac{2r}{1 - r} = 8$ carefully: $10r = 8$, so $r$ is four fifths, $a$ is eight fifths, and $a + ar$ is 72 over 25.'
