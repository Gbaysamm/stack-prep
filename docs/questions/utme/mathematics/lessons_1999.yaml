# UTME 1999 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1999.yaml. Answers match that file.
format_version: 1
exam_year: 1999
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'There are three letters, each with a power on top and a power underneath. One law of indices sorts out all three, letter by letter. Watch the negative index on the bottom $a$.'
        write: 'If $\dfrac{a^{2}b^{3}c}{a^{-1}b^{4}c^{5}} = a^{p}b^{q}c^{r}$, find $p + 2q$'
      - say: 'Solution. We simplify the left side one letter at a time.'
        write: 'Solution'
      - section: 'The law'
        say: 'The law of indices for dividing says that when we divide powers of the same base, we subtract the indices, the top index minus the bottom index.'
        write: 'Law of indices: $\dfrac{a^{m}}{a^{n}} = a^{m - n}$'
      - section: 'Simplify'
        say: 'The $c$ on top has no index written, and a letter with no index written has index 1. Now subtract for each letter. For $a$ it is 2 minus negative 1, for $b$ it is 3 minus 4, and for $c$ it is 1 minus 5.'
        write: '$a^{2 - (-1)}\,b^{3 - 4}\,c^{1 - 5} = a^{p}b^{q}c^{r}$'
        doodle: {name: 'custom:1999_q01_a', id: blocks, caption: 'b³ over b⁴, c over c⁵', size: scene}
      - say: '2 minus negative 1 is 2 plus 1, which is 3. 3 minus 4 is negative 1, and 1 minus 5 is negative 4.'
        write: '$a^{3}b^{-1}c^{-4} = a^{p}b^{q}c^{r}$'
      - section: 'Equate the indices'
        say: 'The bases are the same on both sides, so equate the indices of $a$, and $p$ is 3.'
        write: 'Equating the indices: $p = 3$'
      - say: 'For $b$, $q$ is negative 1. In the picture, 3 $b$s on top cancel 3 of the 4 underneath, and one $b$ is left underneath.'
        write: '$q = -1$'
        doodle_do:
          - {id: blocks, op: stage, stage: 'custom:1999_q01_a2'}
      - say: 'For $c$, $r$ is negative 4, because the one $c$ on top cancels one of the 5 underneath, and 4 are left underneath.'
        write: '$r = -4$'
        doodle_do:
          - {id: blocks, op: stage, stage: 'custom:1999_q01_a3'}
      - section: 'Find p + 2q'
        say: 'Substitute 3 for $p$ and negative 1 for $q$.'
        write: '$p + 2q = 3 + 2(-1)$'
      - say: '2 times negative 1 is negative 2.'
        write: '$= 3 - 2$'
      - say: '3 minus 2 is 1.'
        write: '$= 1$'
      - section: 'Check'
        say: 'To check, multiply our answer by the bottom of the fraction and add the indices. We should get the top back, which is $a$ squared, $b$ cubed and $c$.'
        write: 'Check: $a^{3}b^{-1}c^{-4} \times a^{-1}b^{4}c^{5} = a^{2}b^{3}c^{1}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore $p$ plus $2q$ is 1, which is option C.'
        write: '$\therefore p + 2q = 1$'
        answer: true
    traps:
      A: 'You went for negative 3. That comes from taking $p$ as negative 1. Dividing means top index minus bottom index, and 2 minus negative 1 is 3, so $p$ is 3.'
      B: 'You went for negative 1. That happens if the bottom $a$ to the power negative 1 is read as $a$ to the power 1, giving $p$ equal to 1. But 2 minus negative 1 is 3, so $p$ plus $2q$ is 3 minus 2, which is 1.'
      D: 'You went for 5. That comes from taking $q$ as positive 1, subtracting the wrong way round. For $b$ it is top minus bottom, and 3 minus 4 is negative 1.'

  2:
    moments:
      - section: 'The question'
        say: 'This is an equation with surds in it. Treat root 2 like any number, so cross-multiply, collect the $x$ terms, and rationalise at the end.'
        write: 'Find $x$ if $\dfrac{\sqrt{2}}{x + \sqrt{2}} = \dfrac{1}{x - \sqrt{2}}$'
      - say: 'Solution. Two fractions are equal, so we can cross-multiply, taking the numerator of each side times the denominator of the other.'
        write: 'Solution'
      - section: 'Cross-multiply'
        say: 'Root 2 times $x$ minus root 2, equals 1 times $x$ plus root 2.'
        write: '$\sqrt{2}(x - \sqrt{2}) = 1(x + \sqrt{2})$'
      - say: 'Open the bracket. Root 2 times $x$ is root 2 $x$. Root 2 times root 2 is 2, because squaring a square root gives back the number under it.'
        write: '$\sqrt{2}x - 2 = x + \sqrt{2}$'
      - section: 'Collect like terms'
        say: 'Collect the $x$ terms on the left and the rest on the right. Subtract $x$ from both sides, and add 2 to both sides.'
        write: '$\sqrt{2}x - x = 2 + \sqrt{2}$'
      - say: 'Both terms on the left have $x$, so factorise to get $x$, bracket, root 2 minus 1.'
        write: '$x(\sqrt{2} - 1) = 2 + \sqrt{2}$'
      - say: 'Divide both sides by root 2 minus 1.'
        write: '$x = \dfrac{2 + \sqrt{2}}{\sqrt{2} - 1}$'
      - section: 'Rationalise'
        say: 'There is a surd in the denominator, so multiply the numerator and denominator by the conjugate, root 2 plus 1.'
        write: '$x = \dfrac{2 + \sqrt{2}}{\sqrt{2} - 1} \times \dfrac{\sqrt{2} + 1}{\sqrt{2} + 1}$'
      - say: 'The denominator is a difference of two squares, because $a$ minus $b$, times $a$ plus $b$, is $a$ squared minus $b$ squared.'
        write: '$(a - b)(a + b) = a^{2} - b^{2}$'
      - say: 'So the denominator is root 2 squared minus 1 squared. Root 2 squared is 2 again, so this is 2 minus 1, which is 1.'
        write: 'Denominator $= (\sqrt{2})^{2} - 1^{2} = 2 - 1 = 1$'
      - say: 'Now the numerator. 2 times root 2 is 2 root 2, 2 times 1 is 2, root 2 times root 2 is 2, and root 2 times 1 is root 2.'
        write: 'Numerator $= 2\sqrt{2} + 2 + 2 + \sqrt{2}$'
      - say: 'Collect like terms. 2 plus 2 is 4, and 2 root 2 plus root 2 is 3 root 2.'
        write: '$= 4 + 3\sqrt{2}$'
      - say: 'So $x$ is 4 plus 3 root 2, over 1, which is just 3 root 2 plus 4.'
        write: '$\therefore x = \dfrac{4 + 3\sqrt{2}}{1} = 3\sqrt{2} + 4$'
      - section: 'Check'
        say: 'Check with decimals. $x$ is about 8.243. The left side is 1.414 over 9.657, about 0.1464. The right side is 1 over 6.828, also about 0.1464.'
        write: 'Check: $\dfrac{1.414}{9.657} \approx 0.1464 \approx \dfrac{1}{6.828}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore $x$ is 3 root 2 plus 4, which is option A.'
        write: '$\therefore x = 3\sqrt{2} + 4$'
        answer: true
    traps:
      B: 'You went for 3 root 2 minus 4. The numerator multiplies out to 2 root 2, plus 2, plus 2, plus root 2, and the two 2s make plus 4, not minus 4. Watch the sign when the minus 2 moves across the equals sign, because it becomes plus 2.'
      C: 'You went for 3 minus 2 root 2. That is not what the numerator multiplies out to. Multiply 2 plus root 2 by root 2 plus 1 term by term, and you get 2 root 2, plus 2, plus 2, plus root 2.'
      D: 'You went for 4 plus 2 root 2. That misses the last product when opening the brackets. Root 2 times 1 gives one more root 2, making 3 root 2 plus 4.'

  3:
    moments:
      - section: 'The question'
        say: 'A trader bought 100 oranges at 5 for ₦1.20. 20 got spoilt, and he sold the rest at 4 for ₦1.50. Did he gain or lose, and by what percentage? Spoilt oranges still cost money.'
        write: 'Bought 100 at 5 for ₦1.20; 20 spoilt; rest sold at 4 for ₦1.50'
      - section: 'Cost price'
        say: 'Solution. First we find the cost price, C.P., which is what he paid. 5 oranges cost 1 naira 20 kobo, so 100 oranges cost 100 over 5, times 1.20.'
        write: 'C.P. $= \dfrac{100}{5} \times 1.20$'
      - say: '100 over 5 is 20, and 20 times 1.20 is 24. He paid ₦24.00 for all 100 oranges, spoilt ones included.'
        write: '$= 20 \times 1.20 = 24$, so C.P. = ₦24.00'
      - section: 'Selling price'
        say: 'Now the selling price, S.P. Cross out the spoilt ones, and 100 minus 20 leaves 80 oranges to sell.'
        write: 'Oranges sold $= 100 - 20 = 80$'
      - say: '4 oranges sell for 1 naira 50 kobo, so 80 oranges sell for 80 over 4, times 1.50.'
        write: 'S.P. $= \dfrac{80}{4} \times 1.50$'
      - say: '80 over 4 is 20, and 20 times 1.50 is 30. He received ₦30.00.'
        write: '$= 20 \times 1.50 = 30$, so S.P. = ₦30.00'
      - section: 'Gain'
        say: 'S.P. is more than C.P., so he made a gain. The gain is S.P. minus C.P.'
        write: 'Gain $=$ S.P. $-$ C.P.'
      - say: 'Substitute, so 30 minus 24 is 6. The gain is ₦6.00.'
        write: '$= 30 - 24 = 6$, so gain = ₦6.00'
        point:
          - {line: 7, kind: move, from: {line: 5, at: '= [[30]], so'}, at: '= [[30]] −', text: 'S.P.'}
          - {line: 7, kind: move, from: {line: 2, at: '= [[24]], so'}, at: '− [[24]] =', text: 'C.P.'}
      - section: 'Gain per cent'
        say: 'Gain per cent is the gain over the cost price, times 100 percent. We always measure against the C.P.'
        write: 'Gain $\% = \dfrac{\text{gain}}{\text{C.P.}} \times 100\%$'
      - say: 'Substitute the gain, 6, over the C.P., 24, times 100 percent.'
        write: '$= \dfrac{6}{24} \times 100\%$'
      - say: 'Cancel, and 6 over 24 is 1 over 4, and 1 over 4 of 100 is 25.'
        write: '$= \dfrac{1}{4} \times 100\% = 25\%$'
      - section: 'Check'
        say: 'To check, 25 percent of the C.P., 24, is 6. 24 plus 6 is 30, the S.P. It agrees.'
        write: 'Check: $24 + 25\%$ of $24 = 24 + 6 = 30$ ✓'
      - say: 'Therefore the trader made a 25 percent gain, which is option B.'
        write: '$\therefore 25\%$ gain (B)'
        answer: true
    traps:
      A: 'You went for 30% gain. The 30 is the S.P., ₦30, not the gain. The gain is 30 minus 24, which is ₦6, and 6 over 24 is 25%.'
      C: 'You went for 30% loss. S.P., ₦30, is more than C.P., ₦24, so it is a gain, not a loss. And 6 over 24 is 25%.'
      D: 'You went for 25% loss. The size is right, but S.P. is more than C.P., so it is a gain.'

  4:
    moments:
      - section: 'The question'
        say: 'We have a universal set U and three sets P, Q and R. We want P union Q, complement, intersection R. The brackets set the order, so union, then complement, then intersection.'
        write: 'Find $(P \cup Q)^{\prime} \cap R$'
      - section: 'Solution'
        say: 'Solution. Write out the sets. U, the universal set, is 1 to 6.'
        write: '$U = \{1, 2, 3, 4, 5, 6\}$'
      - say: 'P is 3, 4, 5. Q is 2, 4, 6. R is 1, 2, 3, 4.'
        write: '$P = \{3, 4, 5\},\ Q = \{2, 4, 6\},\ R = \{1, 2, 3, 4\}$'
      - say: 'Place each element in a Venn diagram. 4 is in all three sets. 3 is in P and R. 2 is in Q and R.'
        diagram: {id: v, kind: venn, universal: {name: U}, sets: [{key: P, name: P}, {key: Q, name: Q}, {key: R, name: R}], size: scene}
        diagram_do:
          - {id: v, op: fill, part: 'P∩Q∩R', text: '4', 'on': 'all three'}
          - {id: v, op: fill, part: 'P∩R only', text: '3', 'on': 'P and R'}
          - {id: v, op: fill, part: 'Q∩R only', text: '2', 'on': 'Q and R'}
      - say: 'The rest are in one set only, which is 5 in P, 6 in Q, and 1 in R.'
        diagram_do:
          - {id: v, op: fill, part: 'P only', text: '5', 'on': '5 in P'}
          - {id: v, op: fill, part: 'Q only', text: '6', 'on': '6 in Q'}
          - {id: v, op: fill, part: 'R only', text: '1', 'on': '1 in R'}
      - section: 'Step 1: P union Q'
        say: 'P union Q is every element in P or in Q, each written once. 4 is in both, so we write it once.'
        write: '$P \cup Q = \{3, 4, 5\} \cup \{2, 4, 6\} = \{2, 3, 4, 5, 6\}$'
        diagram_do:
          - {id: v, op: shade, part: 'P∪Q', colour: blue, text: 'P ∪ Q', 'on': 'P union Q'}
      - section: 'Step 2: the complement'
        say: 'P union Q, complement, is everything in U that is not in P union Q. Go through U, and 1 is not in it. 2, 3, 4, 5 and 6 are. Only 1 is left.'
        write: '$(P \cup Q)^{\prime} = \{1\}$'
      - section: 'Step 3: intersect with R'
        say: 'Now intersect with R. Intersection keeps only what is in both sets. 1 is in R, so it stays.'
        write: '$(P \cup Q)^{\prime} \cap R = \{1\} \cap \{1, 2, 3, 4\} = \{1\}$'
        diagram_do:
          - {id: v, op: shade, part: "(P∪Q)'∩R", colour: green, text: '(P ∪ Q)′ ∩ R', 'on': 'it stays'}
      - section: 'Check'
        say: 'Check on the Venn diagram. Inside R but outside P and Q is the region R only, and the only element there is 1.'
        write: 'Check: R only $= \{1\}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore P union Q, complement, intersection R, is the set containing 1, which is answer choice C.'
        write: '$\therefore (P \cup Q)^{\prime} \cap R = \{1\}$'
        answer: true
    traps:
      A: 'You went for 1 to 6, the whole universal set. The complement of P union Q keeps only what is outside the union, which is just 1.'
      B: 'You went for 1, 2, 3 and 4. That is R itself. Intersecting with R keeps only what is also in the complement of P union Q, and that is just 1.'
      D: 'You went for the empty set. The complement of P union Q is the set containing 1, and 1 is in R, so one element survives.'

  5:
    moments:
      - section: 'The question'
        say: 'Divide two-four-three-four base six by four-two base six. Long division in base six is hard, so we change both to base ten, divide, and change the answer back.'
        write: 'Divide $2434_{6}$ by $42_{6}$'
      - say: 'First, each base six numeral goes to base ten.'
        write: 'Solution'
      - section: 'Step 1: base 6 to base 10'
        say: 'Write the index numbers three, two, one and nought over two-four-three-four. Each digit is multiplied by six to the power of its index.'
        write: '$\overset{3}{2}\,\overset{2}{4}\,\overset{1}{3}\,\overset{0}{4}_{6} = 2 \times 6^{3} + 4 \times 6^{2} + 3 \times 6^{1} + 4 \times 6^{0}$'
      - say: 'Six cubed is 216, six squared is 36, six to the power 1 is 6, and six to the power nought is 1.'
        write: '$= 2 \times 216 + 4 \times 36 + 3 \times 6 + 4 \times 1$'
      - say: '2 times 216 is 432. 4 times 36 is 144. 3 times 6 is 18. 4 times 1 is 4.'
        write: '$= 432 + 144 + 18 + 4$'
      - say: '432 plus 144 is 576, plus 18 is 594, plus 4 is 598.'
        write: '$= 598$'
      - say: 'Now four-two base six, with index numbers one and nought. That is 4 times 6, plus 2 times 1.'
        write: '$\overset{1}{4}\,\overset{0}{2}_{6} = 4 \times 6^{1} + 2 \times 6^{0}$'
      - say: '24 plus 2 is 26.'
        write: '$= 24 + 2 = 26$'
      - section: 'Step 2: divide in base ten'
        say: 'Now divide 598 by 26. 26 times 20 is 520, and 26 times 3 is 78. 520 plus 78 is 598, so 26 goes into 598 exactly 23 times.'
        write: '$598 \div 26 = 23$'
        point:
          - {line: 8, kind: move, from: {line: 5, at: '598'}, at: '598'}
          - {line: 8, kind: move, from: {line: 7, at: '=[[26]]'}, at: '26'}
      - section: 'Step 3: base 10 to base 6'
        say: '23 is in base ten, so change it to base six on the ladder, dividing by 6 again and again and keeping the remainders.'
        diagram: {id: L, kind: ladder, divisor: 6, number: 23, 'on': 'ladder'}
      - say: '23 divided by 6 is 3, remainder 5, because 3 times 6 is 18.'
        diagram_do:
          - {id: L, op: step}
      - say: '3 divided by 6 is 0, remainder 3. We stop at 0.'
        diagram_do:
          - {id: L, op: step}
      - say: 'Read the remainders from the bottom up, which gives three, five. So 23 is three-five base six.'
        diagram_do:
          - {id: L, op: read, 'on': 'bottom up'}
        write: '$23_{10} = 35_{6}$'
        point:
          - {line: 12, kind: highlight, at: '356', to: {diagram: L, part: result}}
      - section: 'Check'
        say: 'Check by expanding three-five base six. 3 times 6, plus 5, is 23.'
        write: '$\overset{1}{3}\,\overset{0}{5}_{6} = 3 \times 6^{1} + 5 \times 6^{0} = 23$'
      - say: 'And 23 times 26 is 598, the number we divided. It agrees.'
        write: '$23 \times 26 = 598\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore two-four-three-four base six divided by four-two base six is three-five base six, which is option B.'
        write: '$\therefore 2434_{6} \div 42_{6} = 35_{6}$'
        answer: true
    traps:
      A: 'You went for two-three base six. 23 is the answer in base ten, with a base six label stuck on. On the ladder, 23 becomes three-five base six.'
      C: 'You went for five-two base six. That is 5 times 6 plus 2, which is 32 in base ten, not 23. Read the ladder from the bottom up to get three-five.'
      D: 'You went for five-five base six. That is 35 in base ten, not 23. The quotient in base ten is 23, which is three-five base six.'

  6:
    moments:
      - section: 'The question'
        say: 'We have 2 times $Y$-three base nine equals 3 times $Y$-three base five. $Y$ is an unknown digit, and we want its value.'
        write: 'Solution: $2 \times (Y3)_{9} = 3 \times (Y3)_{5}$'
      - say: 'Change each numeral to base ten, keeping $Y$ as a letter. Then we have an ordinary equation to solve.'
        write: 'Change both numerals to base ten'
      - section: 'Base nine to base ten'
        say: 'Write the index numbers one and nought over $Y$-three base nine. Each digit is multiplied by nine to the power of its index.'
        write: '$\overset{1}{Y}\,\overset{0}{3}_{9} = Y \times 9^{1} + 3 \times 9^{0}$'
        doodle: {name: 'custom:1999_q06_a', id: bundles, caption: 'Y nines and 3 ones', size: scene}
      - say: 'Nine to the power 1 is 9, and nine to the power nought is 1. So it is $9Y$ plus 3, which means $Y$ nines and 3 ones.'
        write: '$= 9Y + 3$'
        point:
          - {line: 3, kind: highlight, at: '9Y + 3', to: {doodle: bundles, part: row9}}
      - section: 'Base five to base ten'
        say: 'We do the same for $Y$-three base five, with index numbers one and nought, and powers of five.'
        write: '$\overset{1}{Y}\,\overset{0}{3}_{5} = Y \times 5^{1} + 3 \times 5^{0}$'
      - say: 'Five to the power 1 is 5, and five to the power nought is 1. So it is $5Y$ plus 3, which means $Y$ fives and 3 ones.'
        write: '$= 5Y + 3$'
        point:
          - {line: 5, kind: highlight, at: '5Y + 3', to: {doodle: bundles, part: row5}}
        doodle_do:
          - {id: bundles, op: highlight, part: row5}
      - section: 'Solve'
        say: 'Substitute the two expressions into the equation.'
        write: '$2(9Y + 3) = 3(5Y + 3)$'
        point:
          - {line: 6, kind: move, from: {line: 3, at: '9Y + 3'}, at: '(9Y + 3)', text: 'base nine'}
          - {line: 6, kind: move, from: {line: 5, at: '5Y + 3'}, at: '(5Y + 3)', text: 'base five'}
      - say: 'Expand the brackets. 2 times $9Y$ is $18Y$, and 2 times 3 is 6. 3 times $5Y$ is $15Y$, and 3 times 3 is 9.'
        write: '$18Y + 6 = 15Y + 9$'
      - say: 'Collect like terms, with the $Y$ terms to the left and the numbers to the right. Each changes sign as it crosses the equals sign.'
        write: '$18Y - 15Y = 9 - 6$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '= [[15Y]]'}, at: '− 15Y', text: 'across'}
          - {line: 8, kind: move, from: {line: 7, at: '18Y [[+ 6]]'}, at: '− 6', text: 'across'}
      - say: '$18Y$ minus $15Y$ is $3Y$, and 9 minus 6 is 3.'
        write: '$3Y = 3$'
      - say: 'Divide both sides by 3.'
        write: '$Y = \dfrac{3}{3} = 1$'
        doodle_do:
          - {id: bundles, op: stage, stage: 'custom:1999_q06_a2'}
      - section: 'Check'
        say: 'A digit must be smaller than its base. 1 is smaller than 5 and smaller than 9, so it is a proper digit in both numerals.'
        write: 'Check the digit: $1 < 5$ and $1 < 9\ \checkmark$'
      - say: 'Now check the equation. One-three base nine is 9 plus 3, which is 12, and 2 times 12 is 24.'
        write: 'Left: $2 \times 13_{9} = 2 \times (9 + 3) = 2 \times 12 = 24$'
        doodle_do:
          - {id: bundles, op: label, part: row9, text: '9 + 3 = 12'}
      - say: 'One-three base five is 5 plus 3, which is 8, and 3 times 8 is 24. Both sides are 24.'
        write: 'Right: $3 \times 13_{5} = 3 \times (5 + 3) = 3 \times 8 = 24\ \checkmark$'
        doodle_do:
          - {id: bundles, op: label, part: row5, text: '5 + 3 = 8'}
      - section: 'Answer'
        say: 'Therefore $Y$ is 1, which is option D.'
        write: '$\therefore Y = 1$'
        answer: true
    traps:
      A: 'You went for 4. Test it. Four-three base nine is 39, and 2 times 39 is 78. Four-three base five is 23, and 3 times 23 is 69. They are not equal. $18Y + 6 = 15Y + 9$ gives $Y = 1$.'
      B: 'You went for 3. Test it. Three-three base nine is 30, and doubled it is 60. Three-three base five is 18, and tripled it is 54. They are not equal. Solving $3Y = 3$ gives 1.'
      C: 'You went for 2. Test it. Two-three base nine is 21, and doubled it is 42. Two-three base five is 13, and tripled it is 39. They are not equal. Solving $3Y = 3$ gives 1.'

  7:
    moments:
      - section: 'The question'
        say: 'We have a square root over four awkward decimals. Multiplying them all out is slow. Clear the decimals and cancel first, and it comes out to a whole number.'
        write: '$\sqrt{\dfrac{0.0023 \times 750}{0.00345 \times 1.25}}$'
      - section: 'Solution'
        say: 'Solution. Work out the fraction under the root first. Pair each top number with a bottom number, so each pair can be cancelled.'
        write: '$\dfrac{0.0023 \times 750}{0.00345 \times 1.25} = \dfrac{0.0023}{0.00345} \times \dfrac{750}{1.25}$'
      - section: 'First pair'
        say: 'Clear the decimals. 0.00345 has five digits after the point, so we multiply the top and the bottom by 100,000, which moves the point five places. 0.0023 becomes 230, and 0.00345 becomes 345.'
        write: '$\dfrac{0.0023}{0.00345} = \dfrac{230}{345}$'
      - say: 'Cancel. Both divide by 5, giving 46 over 69. Both divide by 23, giving 2 over 3.'
        write: '$= \dfrac{46}{69} = \dfrac{2}{3}$'
      - section: 'Second pair'
        say: 'Now 750 over 1.25. 1.25 has two digits after the point, so multiply the top and the bottom by 100. That gives 75,000 over 125.'
        write: '$\dfrac{750}{1.25} = \dfrac{75000}{125}$'
      - say: '125 times 8 is 1000, so 125 times 600 is 75,000. The pair is 600.'
        write: '$= 600$'
      - section: 'Under the root'
        say: 'Therefore the fraction under the root is 2 over 3 times 600. 600 divided by 3 is 200, and 200 times 2 is 400.'
        write: '$\therefore \dfrac{2}{3} \times 600 = 400$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '= [[600]]'}, at: '[[600]] =', text: 'second pair'}
      - say: 'So the expression is the square root of 400. Picture 400 tiles laid out as one big square, and the square root is the length of its side.'
        write: '$\sqrt{\dfrac{0.0023 \times 750}{0.00345 \times 1.25}} = \sqrt{400}$'
        doodle: {name: 'custom:1999_q07_a', id: tiles, caption: '400 tiles in one square'}
        doodle_do:
          - {id: tiles, op: circle, part: block, text: '5 × 5 = 25 tiles'}
      - say: '20 times 20 is 400, so the square root of 400 is 20, and the side of the square is 20 tiles.'
        write: '$= 20$'
        point:
          - {line: 8, kind: highlight, at: '= 20', to: {doodle: tiles, part: side}}
        doodle_do:
          - {id: tiles, op: stage, stage: 'custom:1999_q07_a2'}
      - section: 'Check'
        say: 'Check the first pair. 2 over 3 of 0.00345 should give 0.0023. 0.00345 divided by 3 is 0.00115, and times 2 is 0.0023. It agrees.'
        write: 'Check: $\dfrac{2}{3} \times 0.00345 = 0.0023$ ✓'
      - say: 'Therefore the value is 20, which is option B.'
        write: '$\therefore$ value $= 20$ (B)'
        answer: true
    traps:
      A: 'You went for 15. 15 squared is 225, but the fraction under the root is 400, and the square root of 400 is 20.'
      C: 'You went for 40. 40 squared is 1600. The fraction under the root is 2 over 3 times 600, which is 400, and its square root is 20.'
      D: 'You went for 75. That number sits inside the 750 in the question, but it is not the result. The fraction under the root is 400, and its square root is 20.'

  8:
    moments:
      - section: 'The question'
        say: 'We know log base 8 of 10, and we want log base 8 of 5. 5 is 10 divided by 2, so the quotient law links them. Then log base 8 of 2 is found from index form.'
        write: 'If $\log_{8}10 = x$, evaluate $\log_{8}5$ in terms of $x$'
      - say: 'Solution. First write 5 using 10, then use the laws of logarithms.'
        write: 'Solution'
      - section: 'Use the given log'
        say: '5 is 10 divided by 2.'
        write: '$\log_{8}5 = \log_{8}\dfrac{10}{2}$'
      - say: 'Recall the quotient law, which says the log of a division is the log of the top minus the log of the bottom.'
        write: 'Recall: $\log_{a}\dfrac{M}{N} = \log_{a}M - \log_{a}N$'
      - say: 'By the quotient law, log base 8 of 10 over 2 is log base 8 of 10, minus log base 8 of 2.'
        write: '$\log_{8}5 = \log_{8}10 - \log_{8}2$'
      - say: 'We are given that log base 8 of 10 is $x$. Substitute it.'
        write: '$\log_{8}5 = x - \log_{8}2$'
      - section: 'Find log base 8 of 2'
        say: 'Let log base 8 of 2 be $y$. In index form, 8 to the power $y$ equals 2.'
        write: 'Let $\log_{8}2 = y \Rightarrow 8^{y} = 2$'
      - say: 'Write both sides with base 2. 8 is 2 times 2 times 2, which is 2 cubed. And 2 is 2 to the power 1.'
        doodle: {name: 'custom:1999_q08_a', id: tower, caption: '8 = 2 × 2 × 2'}
        write: '$(2^{3})^{y} = 2^{1}$'
      - say: 'By the law of indices for a power of a power, multiply the indices, so 3 times $y$ is $3y$.'
        write: '$2^{3y} = 2^{1}$ $\quad [(a^{m})^{n} = a^{mn}]$'
      - say: 'The bases are the same, so equate the indices, and $3y$ equals 1.'
        write: '$3y = 1$'
      - say: 'Divide both sides by 3. $y$ is 1 over 3.'
        write: '$\therefore y = \dfrac{1}{3}$'
      - section: 'Put it back'
        say: 'Now put 1 over 3 in place of log base 8 of 2.'
        write: '$\log_{8}5 = x - \dfrac{1}{3}$'
      - section: 'Check'
        say: 'Check the value we found by going back to index form. 8 to the power 1 over 3 is the cube root of 8, which is 2.'
        write: 'Check: $8^{\frac{1}{3}} = \sqrt[3]{8} = 2\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore log base 8 of 5 is $x$ minus 1 over 3, which is option C.'
        write: '$\therefore \log_{8}5 = x - \dfrac{1}{3}$'
        answer: true
    traps:
      A: 'You went for a half of $x$. Halving the number does not halve the log. By the quotient law, the log of 10 over 2 is log 10 minus log 2, which is $x$ minus 1 over 3.'
      B: 'You went for $x$ minus 1 over 4. Let log base 8 of 2 be $y$. Then 8 to the power $y$ is 2, so 2 to the power $3y$ is 2 to the power 1, and $y$ is 1 over 3, not 1 over 4.'
      D: 'You went for $x$ minus a half. A half would be log base 4 of 2. Here the base is 8, which is 2 cubed, so $3y$ equals 1 and log base 8 of 2 is 1 over 3.'

  9:
    moments:
      - section: 'The question'
        say: 'Market women sell yam, plantain and maize, and many sell more than one. 10 plus 14 plus 12 is 36, but the group is smaller. We fill a three-circle Venn diagram from the middle out.'
        write: 'Number of women in the group $= ?$'
      - section: 'Solution'
        say: 'Solution. Here are the givens. n of Y, yam, is 10. n of P, plantain, is 14. n of M, maize, is 12.'
        write: '$n(Y) = 10,\ n(P) = 14,\ n(M) = 12$'
      - say: 'n of P intersection M is 5, and n of Y intersection M is 4. Be careful, because these include the women who sell all three.'
        write: '$n(P \cap M) = 5,\ n(Y \cap M) = 4$'
      - say: 'Yam and plantain only is 2. The word only means those 2 sell no maize. And n of Y intersection P intersection M, all three, is 3.'
        write: 'Yam and plantain only $= 2$, $\ n(Y \cap P \cap M) = 3$'
        point:
          - {line: 3, kind: underline, at: 'only', text: 'no maize'}
      - section: 'The Venn diagram'
        say: 'Now the Venn diagram, with three overlapping circles, one for each item. Every woman sells at least one item, so nobody is outside the circles.'
        diagram: {id: v, kind: venn, sets: [{key: Y, name: Yam, total: 10}, {key: P, name: Plantain, total: 14}, {key: M, name: Maize, total: 12}], size: scene}
      - section: 'Start from the middle'
        say: 'Start from the middle. All three is 3.'
        write: 'All three $= 3$'
        diagram_do:
          - {id: v, op: fill, part: 'Y∩P∩M', text: '3', colour: blue, 'on': middle}
      - say: 'Next the pairs. Yam and plantain only is given with the word only, so it goes in as it is, which is 2.'
        write: 'Yam and plantain only $= 2$'
        diagram_do:
          - {id: v, op: fill, part: 'Y∩P only', text: '2', 'on': 'as it is'}
      - say: 'Plantain and maize is 5 altogether, but 3 of those are in the middle. So plantain and maize only is 5 minus 3, which is 2.'
        write: 'Plantain and maize only $= 5 - 3 = 2$'
        diagram_do:
          - {id: v, op: fill, part: 'P∩M only', text: '2', 'on': 'which is 2'}
      - say: 'Yam and maize is 4 altogether. Take away the same 3, and 4 minus 3 is 1.'
        write: 'Yam and maize only $= 4 - 3 = 1$'
        diagram_do:
          - {id: v, op: fill, part: 'Y∩M only', text: '1', 'on': 'is 1'}
      - section: 'The singles'
        say: 'Now yam only. The yam circle holds 10, and we have already filled 2, 1 and 3 inside it. So yam only is 10 minus 6, which is 4.'
        write: 'Yam only $= 10 - (2 + 1 + 3) = 10 - 6 = 4$'
        diagram_do:
          - {id: v, op: fill, part: 'Y only', text: '4', 'on': 'which is 4'}
      - say: 'Next, plantain only. The plantain circle holds 14, and already has 2, 2 and 3, which is 7. 14 minus 7 is 7.'
        write: 'Plantain only $= 14 - (2 + 2 + 3) = 14 - 7 = 7$'
        diagram_do:
          - {id: v, op: fill, part: 'P only', text: '7', 'on': '14 minus 7'}
      - say: 'Then maize only. The maize circle holds 12, and already has 2, 1 and 3, which is 6. 12 minus 6 is 6.'
        write: 'Maize only $= 12 - (2 + 1 + 3) = 12 - 6 = 6$'
        diagram_do:
          - {id: v, op: fill, part: 'M only', text: '6', 'on': '12 minus 6'}
      - section: 'Add every region'
        say: 'Every woman is now in exactly one of the seven regions. So the group is the sum of the seven regions.'
        write: '$n(\varepsilon) = 4 + 7 + 6 + 2 + 2 + 1 + 3$'
        diagram_do:
          - {id: v, op: shade, part: 'Y∪P∪M', colour: green, 'on': 'seven regions'}
      - say: 'For the singles, 4 plus 7 plus 6 is 17. For the pairs and the middle, 2 plus 2 plus 1 plus 3 is 8. 17 plus 8 is 25.'
        write: '$= 17 + 8 = 25$'
      - section: 'Check by the formula'
        say: 'Check with the three-set formula. Add the three circles, take away the three pairs, and add back the middle. Yam and plantain altogether is 2 plus 3, which is 5.'
        write: '$n(Y \cup P \cup M) = 10 + 14 + 12 - (5 + 4 + 5) + 3$'
      - say: '10 plus 14 plus 12 is 36. The pairs make 14. 36 minus 14 is 22, and 22 plus 3 is 25. It is the same.'
        write: '$= 36 - 14 + 3 = 25\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore there are 25 women in the group, which is answer choice A.'
        write: '$\therefore$ 25 women are in the group'
        answer: true
    traps:
      B: 'You went for 19. That is 36 minus 14 minus 3, with the middle taken away instead of added back. Fill the regions from the middle, with 3, then 2, 2 and 1, then 4, 7 and 6. They add up to 25.'
      C: 'You went for 18. A region was left out or counted wrong. Fill from the middle, with 3 in the centre, 2, 2 and 1 in the pairs, and 4, 7 and 6 in the singles. That is 25.'
      D: 'You went for 17. That is only the singles, 4 plus 7 plus 6. The 8 women in the pairs and the middle also belong to the group, so the total is 25.'

  10:
    moments:
      - section: 'The question'
        say: 'We are given the matrix $Q$ and the sum $Q$ plus $P$. We want the determinant of $Q$ plus $2P$. First we must find $P$.'
        write: '$Q = \begin{pmatrix} 6 & 0 \\ 4 & 5 \end{pmatrix},\quad Q + P = \begin{pmatrix} 7 & 2 \\ 6 & 8 \end{pmatrix},\quad |Q + 2P| = ?$'
      - section: 'Solution: find P'
        say: 'Solution. Take $Q$ away from $Q$ plus $P$, and only $P$ is left.'
        write: 'Solution: $P = (Q + P) - Q$'
      - say: 'Matrices are subtracted element by element, so we take each entry minus the entry in the same place.'
        write: '$= \begin{pmatrix} 7 & 2 \\ 6 & 8 \end{pmatrix} - \begin{pmatrix} 6 & 0 \\ 4 & 5 \end{pmatrix} = \begin{pmatrix} 7 - 6 & 2 - 0 \\ 6 - 4 & 8 - 5 \end{pmatrix}$'
      - say: '7 minus 6 is 1, 2 minus 0 is 2, 6 minus 4 is 2, and 8 minus 5 is 3.'
        write: '$\therefore P = \begin{pmatrix} 1 & 2 \\ 2 & 3 \end{pmatrix}$'
      - section: 'Build Q + 2P'
        say: 'To find $2P$, multiply every element of $P$ by 2.'
        write: '$2P = \begin{pmatrix} 2 \times 1 & 2 \times 2 \\ 2 \times 2 & 2 \times 3 \end{pmatrix} = \begin{pmatrix} 2 & 4 \\ 4 & 6 \end{pmatrix}$'
      - say: 'Now add $Q$ and $2P$, element by element. 6 plus 2 is 8, 0 plus 4 is 4, 4 plus 4 is 8, and 5 plus 6 is 11.'
        write: '$Q + 2P = \begin{pmatrix} 6 + 2 & 0 + 4 \\ 4 + 4 & 5 + 6 \end{pmatrix} = \begin{pmatrix} 8 & 4 \\ 8 & 11 \end{pmatrix}$'
      - section: 'The determinant'
        say: 'The determinant of a 2 by 2 matrix is $ad$ minus $bc$, which is the product of the leading diagonal, minus the product of the other diagonal.'
        write: '$\begin{vmatrix} a & b \\ c & d \end{vmatrix} = ad - bc$'
      - say: 'Here $a$ is 8, $d$ is 11, $b$ is 4 and $c$ is 8. So it is 8 times 11, minus 4 times 8.'
        write: '$|Q + 2P| = 8 \times 11 - 4 \times 8$'
      - say: '8 times 11 is 88, and 4 times 8 is 32. 88 minus 32 is 56.'
        write: '$= 88 - 32 = 56$'
      - section: 'Check'
        say: 'Check $P$ by adding it back to $Q$. 6 plus 1 is 7, 0 plus 2 is 2, 4 plus 2 is 6, and 5 plus 3 is 8. That is $Q$ plus $P$ as given.'
        write: 'Check: $Q + P = \begin{pmatrix} 6 + 1 & 0 + 2 \\ 4 + 2 & 5 + 3 \end{pmatrix} = \begin{pmatrix} 7 & 2 \\ 6 & 8 \end{pmatrix}\ \checkmark$'
      - say: 'Therefore the determinant of $Q$ plus $2P$ is 56, which is option B.'
        write: '$\therefore |Q + 2P| = 56$'
        answer: true
    traps:
      A: 'You went for 90. Build the matrix first. $Q + 2P$ has elements 8, 4, 8 and 11, and 8 times 11 minus 4 times 8 is 88 minus 32, which is 56.'
      C: 'You went for 102. Check $P$. It is $Q + P$ minus $Q$, element by element, giving 1, 2, 2 and 3. Then $Q + 2P$ gives the determinant 56.'
      D: 'You went for 120. That is $|Q|$ times $|2P|$, 30 times minus 4, with the sign dropped. Determinants do not combine like that. Add the matrices first, then take one determinant.'

  11:
    moments:
      - section: 'The question'
        say: 'Many students give 1 over 2 here, because 2 times 1 over 2 is 1. But this star is not ordinary multiplication, and its identity is 0, not 1.'
        write: '$a * b = ab + a + b$, identity $= 0$. Find the inverse of 2.'
      - section: 'The identity'
        say: 'Solution. Always find the identity first. Let $e$ be the identity element, so $a$ star $e$ equals $e$ star $a$ equals $a$.'
        write: 'Solution: let $e$ be the identity: $a * e = e * a = a$'
      - say: 'Substitute $e$ for $b$ in the rule, and set it equal to $a$.'
        write: '$ae + a + e = a$'
      - say: 'Subtract $a$ from both sides. The $a$ on each side cancels.'
        write: '$ae + e = 0$'
      - say: 'Factorise, so $e$ times, bracket, $a$ plus 1, equals 0. This must hold for every $a$, so $e$ is 0, as the question says.'
        write: '$e(a + 1) = 0$ $\therefore e = 0$'
      - section: 'The inverse'
        say: 'Now let 2 inverse be the inverse of 2. The inverse combines with 2 to give the identity, so 2 star 2 inverse equals $e$, which is 0.'
        write: 'Let $2^{-1}$ be the inverse of 2: $2 * 2^{-1} = e = 0$'
        doodle: {name: 'custom:1999_q11_a', id: inv, caption: '2 and its inverse give 0'}
      - say: 'Use the rule with $a$ as 2 and $b$ as 2 inverse, giving 2 times 2 inverse, plus 2, plus 2 inverse.'
        write: '$2(2^{-1}) + 2 + 2^{-1} = 0$'
      - say: 'Collect like terms. 2 times 2 inverse, plus 2 inverse, is 3 times 2 inverse.'
        write: '$3(2^{-1}) + 2 = 0$'
      - say: 'Subtract 2 from both sides.'
        write: '$3(2^{-1}) = -2$'
      - say: 'Divide both sides by 3. So 2 inverse is minus 2 over 3.'
        write: '$\therefore 2^{-1} = -\dfrac{2}{3}$'
        doodle_do:
          - {id: inv, op: label, part: in-b, text: '−2/3'}
      - section: 'Check'
        say: 'To check, take 2 star minus 2 over 3. 2 times minus 2 over 3 is minus 4 over 3. Then add 2, and add minus 2 over 3.'
        write: 'Check: $2 * \left(-\tfrac{2}{3}\right) = -\tfrac{4}{3} + 2 - \tfrac{2}{3}$'
      - say: 'Minus 4 over 3 minus 2 over 3 is minus 6 over 3, which is minus 2. And minus 2 plus 2 is 0, the identity.'
        write: '$= -2 + 2 = 0\ \checkmark$'
        doodle_do:
          - {id: inv, op: circle, part: out}
      - say: 'The rule is the same with $a$ and $b$ swapped, so minus 2 over 3 star 2 is also 0. The inverse works both ways.'
        write: '$\left(-\tfrac{2}{3}\right) * 2 = 2 * \left(-\tfrac{2}{3}\right) = 0\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the inverse of 2 is minus 2 over 3, which is option A.'
        write: '$\therefore 2^{-1} = -\dfrac{2}{3}$'
        answer: true
    traps:
      B: 'You went for 1 over 2. That is the inverse of 2 under ordinary multiplication, where the identity is 1. Here the identity is 0, and $3(2^{-1}) + 2 = 0$ gives minus 2 over 3.'
      C: 'You went for minus 1 over 2. Test it. 2 times minus 1 over 2 is minus 1, and minus 1, plus 2, minus 1 over 2 gives 1 over 2, not 0. The inverse is minus 2 over 3.'
      D: 'You went for 56 over 9. Put it in and 2 star it comes out far bigger than 0, the identity. Solving $3(2^{-1}) + 2 = 0$ gives minus 2 over 3.'

  12:
    moments:
      - section: 'The question'
        say: 'We have a G.P. whose first term is twice its common ratio, and whose sum to infinity is 8. Picture a jar that holds 8, filled by the terms. We want the first two terms added.'
        write: 'First term $= 2 \times$ common ratio, $\ S_{\infty} = 8$'
        doodle: {name: 'custom:1999_q12_a', id: jar, caption: 'all the terms fill 8'}
      - section: 'Solution'
        say: 'Solution. Let the first term be $a$ and the common ratio be $r$. What is given is that $a$ is $2r$, and $S$ infinity is 8.'
        write: 'Solution: $a = 2r,\quad S_{\infty} = 8$'
      - say: 'The sum to infinity of a G.P. is $a$ over 1 minus $r$, for $r$ between negative 1 and 1.'
        write: '$S_{\infty} = \dfrac{a}{1 - r}$'
      - say: 'Substitute 8 for $S$ infinity and $2r$ for $a$.'
        write: '$8 = \dfrac{2r}{1 - r}$'
      - say: 'Cross multiply, so 8 times, 1 minus $r$, equals $2r$.'
        write: '$8(1 - r) = 2r$'
      - say: 'Open the bracket. 8 times 1 is 8, and 8 times $r$ is $8r$.'
        write: '$8 - 8r = 2r$'
      - say: 'Add $8r$ to both sides. $2r$ plus $8r$ is $10r$.'
        write: '$8 = 10r$'
      - say: 'Divide both sides by 10, and simplify 8 over 10 to 4 over 5. It is between negative 1 and 1, as it must be.'
        write: '$r = \dfrac{8}{10} = \dfrac{4}{5}$'
      - say: 'Now the first term. Substitute $r$ in $a$ equals $2r$, and 2 times 4 over 5 is 8 over 5.'
        write: '$a = 2\left(\dfrac{4}{5}\right) = \dfrac{8}{5}$'
        doodle_do:
          - {id: jar, op: fill, to: 0.2}
      - section: 'The first two terms'
        say: 'The first two terms are $a$ and $ar$. So their sum is $a$ plus $ar$.'
        write: '$T_{1} + T_{2} = a + ar = \dfrac{8}{5} + \dfrac{8}{5} \times \dfrac{4}{5}$'
      - say: '8 over 5 times 4 over 5 is 32 over 25. To add, write 8 over 5 as 40 over 25.'
        write: '$= \dfrac{40}{25} + \dfrac{32}{25}$'
        doodle_do:
          - {id: jar, op: fill, to: 0.36}
      - say: '40 plus 32 is 72.'
        write: '$\therefore\ T_{1} + T_{2} = \dfrac{72}{25}$'
        doodle_do:
          - {id: jar, op: label, text: 'first two terms: 72/25'}
      - section: 'Check'
        say: 'Check the sum to infinity, which is 8 over 5, divided by 1 minus 4 over 5. 1 minus 4 over 5 is 1 over 5, and 8 over 5 divided by 1 over 5 is 8. Correct.'
        write: 'Check: $S_{\infty} = \dfrac{8}{5} \div \dfrac{1}{5} = 8\ \checkmark$'
      - say: 'Therefore the sum of the first two terms is 72 over 25, which is answer choice C.'
        write: '$\therefore\ T_{1} + T_{2} = \dfrac{72}{25}$'
        answer: true
    traps:
      A: 'You went for 8 over 5. That is the first term alone. The question wants the first two terms, so add $ar$, which is 32 over 25, to get 72 over 25.'
      B: 'You went for 8 over 3. Solve 8 equals $2r$ over 1 minus $r$ carefully. 8 minus $8r$ equals $2r$, so $10r$ is 8 and $r$ is 4 over 5. Then $a$ plus $ar$ is 72 over 25.'
      D: 'You went for 56 over 9. Re-check $r$. Cross multiplying gives 8 minus $8r$ equals $2r$, so $r$ is 4 over 5, $a$ is 8 over 5, and $a$ plus $ar$ is 72 over 25.'

  13:
    moments:
      - section: 'The question'
        say: 'Tope bought $x$ oranges at ₦5 each, and twice as many mangoes at ₦4 each. She spent at least ₦65 and at most ₦130. We want the range of values of $x$.'
        write: 'Oranges: $x$ at ₦5; mangoes: twice as many at ₦4'
      - section: 'Solution'
        say: 'Solution. Let $x$ be the number of oranges. Twice as many mangoes means $2x$ mangoes.'
        write: 'Let oranges $= x$, then mangoes $= 2x$'
        point:
          - {line: 0, kind: underline, at: 'twice as many', text: 'so 2x'}
      - say: 'The cost of the oranges is $x$ of them at ₦5 each, which is 5 times $x$, or $5x$.'
        write: 'Cost of oranges $= 5 \times x = 5x$'
      - say: 'The cost of the mangoes is $2x$ of them at ₦4 each, which is 4 times $2x$, or $8x$.'
        write: 'Cost of mangoes $= 4 \times 2x = 8x$'
      - say: 'The total cost is $5x$ plus $8x$, which is $13x$ naira.'
        write: 'Total cost $= 5x + 8x = 13x$'
      - section: 'The inequality'
        say: '"At least ₦65" means 65 or more, so 65 is less than or equal to $13x$. "At most ₦130" means 130 or less, so $13x$ is less than or equal to 130. We write both in one line.'
        write: '$65 \le 13x \le 130$'
      - say: 'To get $x$ alone, divide every part by 13. 13 is positive, so the signs stay the same.'
        write: '$\dfrac{65}{13} \le \dfrac{13x}{13} \le \dfrac{130}{13}$'
      - say: '65 divided by 13 is 5, and 130 divided by 13 is 10.'
        write: '$\therefore\ 5 \le x \le 10$'
      - say: 'Show it on a number line, with filled circles at 5 and 10, because both ends are included.'
        write: 'Filled circles at $5$ and $10$ (both included)'
        diagram: {id: n, kind: numberline, range: [0, 14], step: 1}
        diagram_do:
          - {id: n, op: interval, from: 5, to: 10, text: '5 ≤ x ≤ 10', 'on': 'filled circles'}
      - section: 'Check'
        say: 'Check the ends. 5 oranges and 10 mangoes cost 25 plus 40, which is ₦65. 10 oranges and 20 mangoes cost 50 plus 80, which is ₦130.'
        write: 'Check: $13(5) = 65$ ✓, $\ 13(10) = 130$ ✓'
      - section: 'Answer'
        say: 'So $x$ is from 5 to 10, which is option C.'
        write: '$\therefore\ 5 \le x \le 10$'
        answer: true
    traps:
      A: 'You went for 4 to 5. The total cost is $13x$, and dividing 65 and 130 by 13 gives 5 and 10, so the range is 5 to 10.'
      B: 'You went for 5 to 8. The lower end is right, but 130 divided by 13 is 10, not 8. The mangoes cost $8x$, since there are $2x$ of them.'
      D: 'You went for 8 to 10. The upper end is right, but 65 divided by 13 is 5, so the lower end is 5.'

  14:
    moments:
      - section: 'The question'
        say: 'Minus 3 star 4 has a minus sign, two fractions and a subtraction. Most wrong answers here are sign slips. Brackets around every number we substitute will save us.'
        write: '$m * n = \dfrac{m}{n} - \dfrac{n}{m}$. Evaluate $-3 * 4$.'
      - say: 'Solution. Write the definition line first.'
        write: 'Solution: $m * n = \dfrac{m}{n} - \dfrac{n}{m}$'
        doodle: {name: 'custom:1999_q14_a', id: cards, caption: 'm over n, then n over m'}
      - say: '$m$ is the number before the star, minus 3, and $n$ is the number after it, 4. Write them down before substituting.'
        write: '$m = -3,\ n = 4$'
        point:
          - {line: 2, kind: highlight, at: 'm = −3', to: {doodle: cards, part: mn}}
      - section: 'Substitute'
        say: 'Substitute, with brackets, and we get minus 3 over 4, minus, 4 over minus 3.'
        write: '$-3 * 4 = \dfrac{(-3)}{(4)} - \dfrac{(4)}{(-3)}$'
        doodle_do:
          - {id: cards, op: pulse, part: flip}
      - say: 'A positive divided by a negative is negative. So 4 over minus 3 is minus 4 over 3. Keep it in brackets for now.'
        write: '$= -\dfrac{3}{4} - \left(-\dfrac{4}{3}\right)$'
        doodle_do:
          - {id: cards, op: stage, stage: 'custom:1999_q14_a2'}
      - say: 'Minus a negative is plus. So we add 4 over 3.'
        write: '$= -\dfrac{3}{4} + \dfrac{4}{3}$'
      - section: 'Simplify'
        say: 'To add the fractions, find the L.C.M. of the denominators. The L.C.M. of 4 and 3 is 12.'
        write: 'L.C.M. of 4 and 3 $= 12$'
      - say: 'Put both over 12. 12 divided by 4 is 3, and 3 times minus 3 is minus 9. 12 divided by 3 is 4, and 4 times 4 is 16.'
        write: '$= \dfrac{-9 + 16}{12}$'
      - say: 'Minus 9 plus 16 is 7.'
        write: '$= \dfrac{7}{12}$'
      - section: 'Check'
        say: 'Check with decimals. Minus 3 over 4 is minus 0.75, and 4 over 3 is about 1.333. Together that is about 0.583, and 7 over 12 is about 0.583 too.'
        write: 'Check: $-0.75 + 1.333 = 0.583 \approx \dfrac{7}{12}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore minus 3 star 4 is 7 over 12, which is option C.'
        write: '$\therefore -3 * 4 = \dfrac{7}{12}$'
        answer: true
    traps:
      A: 'You went for minus 25 over 12. That misses the double negative. 4 over minus 3 is minus 4 over 3, and subtracting it means adding 4 over 3. Minus 9 plus 16, over 12, is 7 over 12.'
      B: 'You went for minus 7 over 12. That is 4 star minus 3, with $m$ and $n$ swapped. Here $m$ is minus 3, the number before the star.'
      D: 'You went for 25 over 12. That adds 9 over 12 and 16 over 12, but the first fraction is negative, so minus 9 plus 16 is 7.'

  15:
    moments:
      - section: 'The question'
        say: 'We want a matrix $T$ such that $S$ times $T$ is the identity matrix. A matrix that does this is the inverse of $S$.'
        write: '$S = \begin{pmatrix} -1 & 1 \\ 1 & -2 \end{pmatrix},\quad ST = I$'
      - section: 'Solution'
        say: 'Solution. Since $S$ times $T$ is $I$, $T$ is $S$ inverse.'
        write: 'Solution: $ST = I \Rightarrow T = S^{-1}$'
      - say: 'The inverse of a 2 by 2 matrix is 1 over the determinant, times the adjoint. The adjoint swaps $a$ and $d$, and changes the signs of $b$ and $c$.'
        write: '$\begin{pmatrix} a & b \\ c & d \end{pmatrix}^{-1} = \dfrac{1}{ad - bc}\begin{pmatrix} d & -b \\ -c & a \end{pmatrix}$'
      - say: 'In $S$, $a$ is negative 1, $b$ is 1, $c$ is 1 and $d$ is negative 2.'
        write: '$a = -1,\ b = 1,\ c = 1,\ d = -2$'
      - say: 'The determinant is $ad$ minus $bc$. Negative 1 times negative 2 is 2, and 1 times 1 is 1.'
        write: '$|S| = (-1)(-2) - (1)(1) = 2 - 1 = 1$'
      - say: 'For the adjoint, swap $a$ and $d$, so negative 2 goes top left and negative 1 bottom right. Then change the signs of $b$ and $c$, so each 1 becomes negative 1.'
        write: '$\text{adj } S = \begin{pmatrix} -2 & -1 \\ -1 & -1 \end{pmatrix}$'
      - say: 'Now 1 over the determinant, times the adjoint. The determinant is 1, and dividing by 1 changes nothing.'
        write: '$T = \dfrac{1}{1}\begin{pmatrix} -2 & -1 \\ -1 & -1 \end{pmatrix}$'
      - say: 'Therefore $T$ is negative 2, negative 1, negative 1 and negative 1.'
        write: '$\therefore\ T = \begin{pmatrix} -2 & -1 \\ -1 & -1 \end{pmatrix}$'
      - section: 'Check'
        say: 'Check by multiplying $S$ by $T$, row by column. Write all four entries before simplifying.'
        write: 'Check: $ST = \begin{pmatrix} (-1)(-2) + (1)(-1) & (-1)(-1) + (1)(-1) \\ (1)(-2) + (-2)(-1) & (1)(-1) + (-2)(-1) \end{pmatrix}$'
      - say: 'In the top row, 2 minus 1 is 1, and 1 minus 1 is 0. In the bottom row, negative 2 plus 2 is 0, and negative 1 plus 2 is 1. That is the identity.'
        write: '$= \begin{pmatrix} 2 - 1 & 1 - 1 \\ -2 + 2 & -1 + 2 \end{pmatrix} = \begin{pmatrix} 1 & 0 \\ 0 & 1 \end{pmatrix} = I\ \checkmark$'
      - say: 'Therefore $T$ is negative 2, negative 1, negative 1 and negative 1, which is answer choice B.'
        write: '$\therefore\ T = \begin{pmatrix} -2 & -1 \\ -1 & -1 \end{pmatrix}$'
        answer: true
    traps:
      A: 'You went for negative 2, 1, negative 1 and 1. Multiply it back by $S$ and the bottom-right entry comes out as negative 1, not 1. Swap $a$ and $d$, and change the signs of $b$ and $c$ only.'
      C: 'You went for negative 1, negative 1, 0 and negative 1. That is not the inverse, because swapping $a$ and $d$ puts negative 2 in the top left. Build the adjoint, divide by the determinant, and check by multiplying.'
      D: 'You went for negative 1, negative 1, 0 and 1. Multiplying it by $S$ does not give the identity. Swap $a$ and $d$ to put negative 2 top left, and change the signs of $b$ and $c$.'

  16:
    moments:
      - section: 'The question'
        say: 'One power of $x$ is missing here, because there is no $x^{2}$ term. Forget to hold its place, and every column slips. Let''s set it out as long division.'
        write: '$(4x^{3} - 3x + 1) \div (2x - 1)$'
      - section: 'Fill the gap'
        say: 'Solution. Write the dividend in descending powers of $x$, a column for each power. There is no $x^{2}$, so put $0x^{2}$ in its place.'
        write: '$4x^{3} - 3x + 1 = 4x^{3} + 0x^{2} - 3x + 1$'
        doodle: {name: 'custom:1999_q16_a', id: cols, caption: 'a column for each power', size: scene, 'on': 'column'}
        point:
          - {line: 1, kind: highlight, at: '0x2', to: {doodle: cols, part: zero}}
        doodle_do:
          - {id: cols, op: circle, part: zero, text: 'placeholder'}
      - section: 'Long division'
        say: 'The divisor, $2x - 1$, goes outside the bracket. The dividend, with its $0x^{2}$, goes inside.'
        write: 'Set out: $\ 2x - 1\ \big)\ \overline{4x^{3} + 0x^{2} - 3x + 1}$'
      - say: 'Divide the first term inside by the first term outside. $4x^{3}$ divided by $2x$ is $2x^{2}$. Write it on top as the first term of the quotient.'
        write: '$4x^{3} \div 2x = 2x^{2}$'
      - say: 'Multiply back. $2x^{2}$ times $2x - 1$ is $4x^{3}$ minus $2x^{2}$. Write it under the first two terms.'
        write: '$2x^{2}(2x - 1) = 4x^{3} - 2x^{2}$'
      - say: 'Subtract by changing the signs and adding. $0x^{2}$ minus minus $2x^{2}$ is plus $2x^{2}$. Then bring down the next term, minus $3x$.'
        write: 'Subtract, bring down: $\ 2x^{2} - 3x$'
        point:
          - {line: 5, kind: move, from: {line: 2, at: '− 3x'}, at: '− 3x', text: 'bring down'}
        doodle_do:
          - {id: cols, op: pulse, part: zero}
      - say: 'Divide again. $2x^{2}$ divided by $2x$ is $x$. Write plus $x$ on top.'
        write: '$2x^{2} \div 2x = x$'
      - say: 'Multiply back. $x$ times $2x - 1$ is $2x^{2}$ minus $x$. Write it under.'
        write: '$x(2x - 1) = 2x^{2} - x$'
      - say: 'Subtract by changing the signs and adding. Minus $3x$ plus $x$ is minus $2x$. Bring down the last term, plus 1.'
        write: 'Subtract, bring down: $\ -2x + 1$'
        point:
          - {line: 8, kind: move, from: {line: 2, at: '+ 1'}, at: '+ 1', text: 'bring down'}
      - say: 'Divide again. Minus $2x$ divided by $2x$ is minus 1. Write minus 1 on top.'
        write: '$-2x \div 2x = -1$'
      - say: 'Multiply back. Minus 1 times $2x - 1$ is minus $2x$ plus 1. Write it under.'
        write: '$-1(2x - 1) = -2x + 1$'
      - say: 'Subtract, and nothing is left. The remainder is zero, so $2x - 1$ divides exactly.'
        write: 'Remainder $= 0$'
      - say: 'The quotient is what we wrote on top, which is $2x^{2}$, then plus $x$, then minus 1.'
        write: 'Quotient $= 2x^{2} + x - 1$'
        point:
          - {line: 12, kind: move, from: {line: 3, at: '= 2x2'}, at: '2x2', text: 'first'}
          - {line: 12, kind: move, from: {line: 6, at: '= x'}, at: '+ x', text: 'second'}
          - {line: 12, kind: move, from: {line: 9, at: '= −1'}, at: '− 1', text: 'third'}
        doodle_do:
          - {id: cols, op: stage, stage: 'custom:1999_q16_a2', 'on': 'quotient'}
      - section: 'Check'
        say: 'Check by multiplying back, since the divisor times the quotient should give the dividend.'
        write: 'Check: $(2x - 1)(2x^{2} + x - 1)$'
      - say: '$2x$ times each term gives $4x^{3}$, $2x^{2}$ and minus $2x$. Minus 1 times each term gives minus $2x^{2}$, minus $x$ and plus 1.'
        write: '$= 4x^{3} + 2x^{2} - 2x - 2x^{2} - x + 1$'
      - say: 'Plus $2x^{2}$ and minus $2x^{2}$ cancel, and minus $2x$ minus $x$ is minus $3x$. That is the dividend we started with.'
        write: '$= 4x^{3} - 3x + 1$'
        point:
          - {line: 14, kind: strike, at: '+ 2x2', text: 'cancel'}
          - {line: 14, kind: strike, at: '− 2x2'}
      - say: 'Therefore the quotient is $2x^{2} + x - 1$, which is answer choice D.'
        write: '$\therefore$ the quotient is $2x^{2} + x - 1$'
        answer: true
    traps:
      A: 'You went for $2x^{2} - x + 1$. Both signs after the first term are off. With the $0x^{2}$ in place, $0x^{2}$ minus minus $2x^{2}$ is plus $2x^{2}$, so the next term is plus $x$.'
      B: 'You went for $2x^{2} - x - 1$. The middle sign is off. After the first subtraction we have plus $2x^{2}$, and $2x^{2}$ divided by $2x$ is plus $x$.'
      C: 'You went for $2x^{2} + x + 1$. The last sign is off. Minus $2x$ divided by $2x$ is minus 1, so the last term is minus 1.'

  17:
    moments:
      - section: 'The question'
        say: 'We have three consecutive positive integers, $k$, $l$ and $m$, with $l^{2}$ equal to 3 times $k$ plus $m$. There are three unknowns, but one letter is enough.'
        write: '$l^{2} = 3(k + m)$'
      - section: 'Solution'
        say: 'Solution. Consecutive integers go up by 1, like house numbers next door. Let the middle one be $n$. The one before is $n - 1$ and the one after is $n + 1$.'
        write: 'Let $k = n - 1,\ l = n,\ m = n + 1$'
      - say: 'Substitute into $l^{2} = 3(k + m)$. $l$ becomes $n$, and $k + m$ becomes $n - 1$ plus $n + 1$.'
        write: 'Sub.: $\ n^{2} = 3(n - 1 + n + 1)$'
      - say: 'Collect like terms in the bracket. Minus 1 and plus 1 cancel, and $n$ plus $n$ is $2n$.'
        write: '$n^{2} = 3(2n)$'
      - say: '3 times $2n$ is $6n$.'
        write: '$n^{2} = 6n$'
      - say: 'Subtract $6n$ from both sides, so the right side is zero. Do not divide by $n$, because that would lose a root.'
        write: '$n^{2} - 6n = 0$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '= [[6n]]'}, at: '− 6n', text: 'across'}
      - say: 'Both terms have $n$, so factorise by taking out $n$, leaving $n - 6$.'
        write: '$n(n - 6) = 0$'
      - say: 'Two factors multiply to give zero, so one of them is zero.'
        write: 'Either $n = 0$ or $n - 6 = 0$'
      - say: 'Add 6 to both sides of the second.'
        write: '$\therefore n = 0$ or $n = 6$'
      - say: 'The integers are positive. $n = 0$ would make $k$ minus 1, so we reject it. $n$ is 6.'
        write: 'Positive integers: $\ n = 6$'
        point:
          - {line: 8, kind: strike, at: 'n = 0', text: 'not positive'}
      - say: 'Now the three numbers. $k$ is 6 minus 1, which is 5. $l$ is 6. $m$ is 6 plus 1, which is 7.'
        write: '$k = 5,\ l = 6,\ m = 6 + 1 = 7$'
        point:
          - {line: 10, kind: highlight, at: 'm = 6 + 1 = 7'}
      - section: 'Check'
        say: 'Check in the condition. $l^{2}$ is 6 squared, which is 36. And 3 times 5 plus 7 is 3 times 12, which is also 36.'
        write: 'Check: $6^{2} = 36$; $\ 3(5 + 7) = 3 \times 12 = 36$'
      - say: 'Therefore $m$, the largest of the three, is 7, which is answer choice D.'
        write: '$\therefore m = 7$'
        answer: true
    traps:
      A: 'You went for 4. Try 3, 4 and 5. 4 squared is 16, but 3 times 3 plus 5 is 24. Solving $n^{2} = 6n$ gives the middle number 6, so $m$ is 7.'
      B: 'You went for 5. That is $k$, the smallest of 5, 6 and 7. The question wants $m$, the largest.'
      C: 'You went for 6. That is $n$, the middle number $l$. The question wants $m$, which is one more, so it is 7.'

  18:
    moments:
      - section: 'The question'
        say: 'The shaded wedge sits between a straight line and a curve. Find each boundary''s equation, then decide which side of each the shading lies.'
        write: 'Boundaries: a straight line and a cubic curve'
        point:
          - {figure: 0, kind: circle, target: {x: 235, y: 108}, text: 'shaded region'}
      - section: 'The line'
        say: 'Solution. The line passes through the origin at 45 degrees. Its gradient is tan 45 degrees, which is 1.'
        write: 'Solution: line: $\ m = \tan 45^{\circ} = 1$'
        point:
          - {figure: 0, kind: circle, target: '45°', text: 'tan 45° = 1'}
      - say: 'A line through the origin has $c$ equal to 0. So $y$ equals 1 times $x$, which is $y$ equals $x$.'
        write: '$y = mx + c = 1x + 0$, $\ $so $y = x$'
        point:
          - {figure: 0, kind: circle, target: '0', text: 'origin'}
      - section: 'The curve'
        say: 'The curve crosses the $x$-axis at minus 1, 0 and 1. Each crossing gives a factor, so we have $x$ plus 1, $x$, and $x$ minus 1.'
        write: 'Curve: $\ y = x(x - 1)(x + 1)$'
        point:
          - {figure: 0, kind: label, target: '-1', text: 'x + 1'}
          - {figure: 0, kind: label, target: '0', text: 'x'}
          - {figure: 0, kind: label, target: '1', text: 'x − 1'}
      - say: '$x$ minus 1 times $x$ plus 1 is a difference of two squares, which is $x$ squared minus 1. Multiplying by $x$ gives $x$ cubed minus $x$.'
        write: '$y = x(x^{2} - 1) = x^{3} - x$'
      - section: 'Which side?'
        say: 'The shading lies below the line, so $y$ is at most $x$. Subtract $x$ from both sides.'
        write: 'Below the line: $\ y \le x \Rightarrow y - x \le 0$'
        point:
          - {figure: 0, kind: arrow, target: {x: 250, y: 71}, text: 'line y = x: shading below'}
      - say: 'The shading lies above the curve, so $y$ is at least $x$ cubed minus $x$. Add $x$ and subtract $x$ cubed on both sides.'
        write: 'Above the curve: $\ y \ge x^{3} - x \Rightarrow y + x - x^{3} \ge 0$'
        point:
          - {figure: 0, kind: arrow, target: {x: 215, y: 151}, text: 'curve: shading above'}
      - section: 'Check'
        say: 'Test a shaded point, 0.5, 0. $y$ plus $x$ minus $x$ cubed is 0 plus 0.5 minus 0.125, which is 0.375, so it is at least 0. And $y$ minus $x$ is minus 0.5, which is at most 0.'
        write: 'Test $(0.5,\ 0)$: $\ 0.375 \ge 0\ \checkmark,\ \ -0.5 \le 0\ \checkmark$'
        point:
          - {figure: 0, kind: circle, target: {x: 207, y: 130}, text: '(0.5, 0)'}
      - say: 'So the shaded portion is $y + x - x^{3} \ge 0$ and $y - x \le 0$, which is option A.'
        write: '$\therefore\ y + x - x^{3} \ge 0,\ \ y - x \le 0$'
        answer: true
    traps:
      B: 'You went for B. Its first inequality says $y \ge x - x^{3}$, which is the curve turned upside down. The curve here is $y = x^{3} - x$, so $y \ge x^{3} - x$ rearranges to $y + x - x^{3} \ge 0$.'
      C: 'You went for C. Its first sign is the wrong way round, and its line is $y = -x$, not $y = x$. Test the point 0.5, 0. There $y + x - x^{3}$ is 0.375, which is not at most 0.'
      D: 'You went for D. It uses the curve $y = x - x^{3}$ and the line $y = -x$, the mirror images of the boundaries in the diagram. Ours are $y = x^{3} - x$ and $y = x$.'

  19:
    moments:
      - section: 'The question'
        say: 'There are six terms and two letters. It looks too long to factorise, but hidden inside is a quadratic you already know how to do.'
        write: 'Factorise $x^{2} + 2xy + y^{2} + 3x + 3y - 18$'
      - section: 'Solution'
        say: 'Solution. Recall the perfect square, where $x + y$, all squared, is $x^{2}$ plus $2xy$ plus $y^{2}$.'
        write: 'Recall: $(x + y)^{2} = x^{2} + 2xy + y^{2}$'
      - say: 'Group the terms. The first three make the perfect square. The next two share a factor of 3.'
        write: '$= (x^{2} + 2xy + y^{2}) + (3x + 3y) - 18$'
      - say: 'So the first group is $x + y$, all squared. From the second group take out 3, leaving $x + y$. The same bracket appears twice, like the same parcel.'
        write: '$= (x + y)^{2} + 3(x + y) - 18$'
        doodle: {name: 'custom:1999_q19_a', id: parcel, caption: 'the same parcel twice', size: scene, 'on': 'parcel'}
      - say: 'Let $u$ stand for the bracket $x + y$. Then the expression is an ordinary quadratic in $u$.'
        write: 'Let $u = x + y$: $\ u^{2} + 3u - 18$'
        point:
          - {line: 4, kind: highlight, at: 'u = x + y', to: {doodle: parcel, part: tags}}
        doodle_do:
          - {id: parcel, op: stage, stage: 'custom:1999_q19_a2', 'on': 'quadratic'}
      - section: 'Factorise: product and sum'
        say: 'Compare $u^{2} + 3u - 18$ with $au^{2} + bu + c$. So $a$ is 1, $b$ is 3 and $c$ is minus 18. The product is $a$ times $c$, 1 times minus 18, which is minus 18. The sum is $b$, which is 3.'
        write: 'Product $= ac = -18$, Sum $= b = 3$'
      - say: 'We need two numbers that multiply to minus 18 and add up to 3, and they are 6 and minus 3. 6 times minus 3 is minus 18, and 6 minus 3 is 3.'
        write: 'Factors: $6,\ -3$'
      - say: 'Split the middle term. $3u$ becomes $6u$ minus $3u$.'
        write: '$u^{2} + 3u - 18 = u^{2} + 6u - 3u - 18$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '[[6]], −3'}, at: '+6u', text: 'split'}
          - {line: 7, kind: move, from: {line: 6, at: '6, [[−3]]'}, at: '−3u'}
      - say: 'Group in pairs. From the first pair take out $u$, leaving $u + 6$. From the second take out minus 3, leaving $u + 6$ again.'
        write: '$= u(u + 6) - 3(u + 6)$'
      - say: 'The brackets match. Take out the common bracket, $u + 6$. What is left is $u - 3$.'
        write: '$= (u + 6)(u - 3)$'
      - section: 'Put back x + y'
        say: 'Now put $x + y$ back in place of $u$ in each bracket.'
        write: '$= (x + y + 6)(x + y - 3)$'
        doodle_do:
          - {id: parcel, op: label, part: p1, text: 'unwrap: u = x + y'}
      - section: 'Check'
        say: 'Check with $x = 1$ and $y = 0$. The expression is 1 plus 3 minus 18, which is minus 14. The brackets give 7 times minus 2, also minus 14.'
        write: 'Check $x = 1,\ y = 0$: $\ 1 + 3 - 18 = -14$; $\ (7)(-2) = -14$'
      - say: 'Therefore the expression factorises as $x + y + 6$, times $x + y - 3$, which is answer choice A.'
        write: '$\therefore (x + y + 6)(x + y - 3)$'
        answer: true
    traps:
      B: 'You went for B, which uses $x - y$. $(x - y)^{2}$ has middle term minus $2xy$, but here it is plus $2xy$, so the bracket is $x + y$.'
      C: 'You went for C, which uses $x - y$. The plus $2xy$ tells you the perfect square is $(x + y)^{2}$, not $(x - y)^{2}$.'
      D: 'You went for D. The signs are swapped, because minus 6 and 3 multiply to minus 18 but add up to minus 3. The sum must be plus 3, so the factors are 6 and minus 3.'

  20:
    moments:
      - section: 'The question'
        say: 'We have two numbers we never see, only their sum and their difference. Two facts and two unknowns make a pair of simultaneous equations.'
        write: 'Sum $= 2 \times$ difference; difference $= P$'
      - section: 'Solution'
        say: 'Solution. Let the larger number be $a$ and the smaller be $b$. Picture them as two bars, where the piece of $a$ that sticks out beyond $b$ is the difference.'
        write: 'Let the larger be $a$ and the smaller be $b$'
        doodle: {name: 'custom:1999_q20_a', id: bars, caption: 'the larger and the smaller', size: scene, 'on': 'bars'}
      - say: 'The difference is $P$. Larger minus smaller gives $a$ minus $b$ equals $P$. Call it equation 1.'
        write: '$a - b = P \quad \ldots\ldots (1)$'
        doodle_do:
          - {id: bars, op: highlight, part: diff, text: 'difference P'}
      - say: 'The sum is twice the difference, and the difference is $P$. So $a$ plus $b$ equals $2P$. Call it equation 2.'
        write: '$a + b = 2P \quad \ldots\ldots (2)$'
      - section: 'Eliminate b'
        say: 'There is minus $b$ in equation 1 and plus $b$ in equation 2, so add the equations, and $b$ cancels. $P$ plus $2P$ is $3P$.'
        write: '(1) + (2): $\ 2a = 3P$'
        point:
          - {line: 2, kind: strike, at: '− b'}
          - {line: 3, kind: strike, at: '+ b'}
      - say: 'Divide both sides by 2.'
        write: '$a = \dfrac{3P}{2}$'
      - say: 'Now find the smaller number too. Substitute $a = \dfrac{3P}{2}$ in equation 2.'
        write: 'Sub. in (2): $\ \dfrac{3P}{2} + b = 2P$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '23P'}, at: '23P +', text: 'sub in'}
      - say: 'Subtract $3P$ over 2 from both sides. $2P$ is $4P$ over 2, and $4P$ over 2 minus $3P$ over 2 is $P$ over 2.'
        write: '$b = 2P - \dfrac{3P}{2} = \dfrac{P}{2}$'
      - say: 'Look at the bars, and the larger, $3P$ over 2, is exactly three times the smaller, $P$ over 2.'
        write: '$a = 3b$'
        doodle_do:
          - {id: bars, op: stage, stage: 'custom:1999_q20_a2', 'on': 'bars'}
      - section: 'Check'
        say: 'Check. The sum is $3P$ over 2 plus $P$ over 2, which is $2P$. The difference is $P$, and twice $P$ is $2P$. It matches.'
        write: 'Check: $\ \dfrac{3P}{2} + \dfrac{P}{2} = 2P = 2 \times P$'
        doodle_do:
          - {id: bars, op: stage, stage: 'custom:1999_q20_a3', 'on': 'sum'}
      - say: 'Therefore the larger number is $3P$ over 2, which is answer choice B.'
        write: '$\therefore$ the larger number is $\dfrac{3P}{2}$'
        answer: true
    traps:
      A: 'You went for $P$ over 2. That is the smaller number, $b$. The question wants the larger, $a$, which is $3P$ over 2.'
      C: 'You went for $5P$ over 2. That is the sum, $2P$, plus the smaller number. Adding equations one and two gives $2a = 3P$, so the larger is $3P$ over 2.'
      D: 'You went for $3P$. That is $2a$, from adding equations one and two. Divide both sides by 2, and the larger number is $3P$ over 2.'

  21:
    moments:
      - section: 'The question'
        say: 'This is one small fraction, but its denominator is a cube. Factorise the cube first, and the partial fractions follow.'
        write: 'Express $\dfrac{1}{x^{3} - 1}$ in partial fractions'
      - section: 'Factorise the denominator'
        say: 'Solution. $x^{3} - 1$ is $x$ cubed minus 1 cubed, a difference of two cubes. Recall how it factorises.'
        write: 'Recall: $a^{3} - b^{3} = (a - b)(a^{2} + ab + b^{2})$'
      - say: 'Here $a$ is $x$ and $b$ is 1. So $x^{3} - 1$ is $x - 1$, times $x^{2}$ plus $x$ plus 1.'
        write: '$x^{3} - 1 = (x - 1)(x^{2} + x + 1)$'
      - say: 'Can $x^{2} + x + 1$ factorise further? Its discriminant, $b^{2} - 4ac$, is 1 minus 4, which is minus 3. It is negative, so no.'
        write: '$b^{2} - 4ac = 1^{2} - 4(1)(1) = -3 < 0$'
      - section: 'Set up the fractions'
        say: 'The linear factor gets a constant on top, $A$. The quadratic factor gets a linear top, $Bx + C$.'
        write: 'Let $\dfrac{1}{x^{3} - 1} \equiv \dfrac{A}{x - 1} + \dfrac{Bx + C}{x^{2} + x + 1}$'
      - say: 'Multiply through by $(x - 1)(x^{2} + x + 1)$. Each fraction keeps the factor it did not have.'
        write: '$1 \equiv A(x^{2} + x + 1) + (Bx + C)(x - 1)$'
      - section: 'Find A'
        say: 'Put $x = 1$, because it makes $x - 1$ zero. That wipes out the $Bx + C$ term.'
        write: 'Put $x = 1$: $\ 1 = A(1 + 1 + 1) + (B + C)(0)$'
      - say: '1 plus 1 plus 1 is 3, and anything times zero is zero.'
        write: '$1 = 3A$'
      - say: 'Divide both sides by 3. $A$ is 1 over 3, the top of the first fraction.'
        write: '$A = \dfrac{1}{3}$'
      - section: 'Equate coefficients'
        say: 'No other value wipes out a term, so we equate coefficients. Expand the second part first.'
        write: '$(Bx + C)(x - 1) = Bx^{2} - Bx + Cx - C$'
      - say: 'Equate the coefficients of $x^{2}$. The left side, 1, has no $x^{2}$. On the right, we have $A$ from the first part and $B$ from the second.'
        write: 'Coefficient of $x^{2}$: $\ 0 = A + B$'
      - say: 'So $B$ is minus $A$, which is minus 1 over 3.'
        write: '$B = -A = -\dfrac{1}{3}$'
      - say: 'Equate the constant terms. On the left we have 1. On the right we have $A$ from the first part and minus $C$ from the second.'
        write: 'Constant terms: $\ 1 = A - C$'
      - say: 'So $C$ is $A$ minus 1. 1 over 3 minus 1 is minus 2 over 3.'
        write: '$C = A - 1 = \dfrac{1}{3} - 1 = -\dfrac{2}{3}$'
      - section: 'Put them together'
        say: 'The top of the second fraction is minus 1 over 3 $x$, minus 2 over 3. Take out minus 1 over 3, and that is minus $x + 2$, over 3.'
        write: '$Bx + C = -\dfrac{1}{3}x - \dfrac{2}{3} = -\dfrac{x + 2}{3}$'
      - say: 'Put $A$ and this top into the two fractions. The 3s move down into the denominators.'
        write: '$\dfrac{1}{x^{3} - 1} = \dfrac{1}{3(x - 1)} - \dfrac{x + 2}{3(x^{2} + x + 1)}$'
      - section: 'Check'
        say: 'Check with $x = 0$. The left side is 1 over minus 1, which is minus 1. The right side is minus 1 over 3, minus 2 over 3, which is also minus 1.'
        write: 'Check $x = 0$: $\ -1$; $\ \dfrac{1}{-3} - \dfrac{2}{3} = -1$'
      - say: 'Therefore the partial fractions are 1 over $3(x - 1)$, minus $x + 2$ over $3(x^{2} + x + 1)$, which is answer choice C.'
        write: '$\therefore \dfrac{1}{3(x - 1)} - \dfrac{x + 2}{3(x^{2} + x + 1)}$'
        answer: true
    traps:
      A: 'You went for A. It drops the factor of 3, as if $A$ were 1. Putting $x = 1$ gives $3A = 1$, so $A$ is 1 over 3.'
      B: 'You went for B. The sign between the fractions is wrong. $B$ is minus 1 over 3 and $C$ is minus 2 over 3, so the second fraction is subtracted.'
      D: 'You went for D. The top of the second fraction should be $x + 2$, not $x - 2$, because $C$ is minus 2 over 3, so $Bx + C$ is minus 1 over 3 times $x + 2$.'

  22:
    moments:
      - section: 'The question'
        say: 'The bisector of angle $M$ cuts the side $NO$ into two pieces. Many students split 12 in half, or in the ratio 2 to 1. One theorem tells us the exact ratio.'
        write: '$MN = 9,\ MO = 6,\ NO = 12$; bisector of $\angle M$ meets $NO$ at $P$'
      - section: 'Solution'
        say: 'Solution. Let me sketch triangle $MNO$ with the bisector $MP$.'
        show_sketch: true
        write: 'Solution'
        point:
          - {figure: sketch, kind: highlight, target: MP, text: 'bisector'}
          - {figure: sketch, kind: circle, target: '?', text: 'NP'}
      - say: 'The angle bisector theorem says the bisector of an angle of a triangle divides the opposite side in the ratio of the sides containing the angle.'
        write: '$NP : PO = MN : MO$ (angle bisector theorem)'
        point:
          - {figure: sketch, kind: highlight, target: MN, text: '9'}
          - {figure: sketch, kind: highlight, target: MO, text: '6'}
      - say: 'Substitute 9 for $MN$ and 6 for $MO$. Divide both by 3, so 9 to 6 is 3 to 2.'
        write: '$NP : PO = 9 : 6 = 3 : 2$'
      - say: 'Now share 12 in the ratio 3 to 2. The total number of parts is 3 plus 2, which is 5.'
        write: 'Total parts $= 3 + 2 = 5$'
      - say: '$NP$ takes 3 of the 5 parts, so $NP$ is 3 over 5 of 12.'
        write: '$NP = \dfrac{3}{5} \times 12$'
        point:
          - {figure: sketch, kind: underline, target: NP, text: '3 parts'}
      - say: '3 times 12 is 36, and 36 over 5 is 7.2.'
        write: '$= \dfrac{36}{5} = 7.2$'
        point:
          - {figure: sketch, kind: label, target: '?', text: '7.2'}
      - section: 'Check'
        say: 'To check, $PO$ is 2 over 5 of 12, which is 4.8. And 7.2 plus 4.8 is 12, the whole of $NO$.'
        write: 'Check: $PO = \dfrac{2}{5} \times 12 = 4.8$; $\ 7.2 + 4.8 = 12\ \checkmark$'
        point:
          - {figure: sketch, kind: underline, target: PO, text: '4.8'}
      - say: 'It also makes sense, because the longer piece lies next to the longer side. $MN$ is longer than $MO$, and $NP$ is longer than $PO$.'
        write: '$MN > MO$ and $NP > PO$'
      - say: 'Therefore $NP$ is 7.2 units, which is option B.'
        write: '$\therefore NP = 7.2$ units'
        answer: true
    traps:
      A: 'You went for 4.8. That is $PO$, the other piece. The longer piece lies next to the longer side, $MN$, so $NP$ is 3 over 5 of 12, which is 7.2.'
      C: 'You went for 8.0. That is 2 over 3 of 12, sharing in the ratio 2 to 1. The ratio is 9 to 6, which is 3 to 2, so $NP$ is 3 over 5 of 12, which is 7.2.'
      D: 'You went for 18. That is 12 times 9 over 6. But $NP$ is only part of $NO$, so it must be less than 12. Share 12 in the ratio 3 to 2.'

  23:
    moments:
      - section: 'The question'
        say: 'We have a point $P$ equidistant from $V$ and $W$. In coordinates, the locus is a straight line, and the distance formula finds its equation.'
        write: '$V(1,\ 1),\ W(3,\ 5)$; locus of $P(x,\ y)$ with $PV = PW$'
      - section: 'Solution'
        say: 'Solution. Let me plot $V$ and $W$. For points equidistant from two fixed points, the standard locus is the perpendicular bisector of $VW$. Now we find its equation.'
        show_sketch: true
        write: 'Solution: let $P(x,\ y)$ be any point on the locus'
        point:
          - {figure: sketch, kind: circle, target: 'locus of P', text: '⊥ bisector of VW'}
      - say: 'The distances are equal, so their squares are equal. Squaring removes the square roots in the distance formula.'
        write: '$PV = PW \Rightarrow PV^{2} = PW^{2}$'
        point:
          - {figure: sketch, kind: highlight, target: PV}
          - {figure: sketch, kind: highlight, target: PW}
      - say: 'The distance formula says $d$ squared equals $x_2$ minus $x_1$, squared, plus $y_2$ minus $y_1$, squared.'
        write: '$d^{2} = (x_{2} - x_{1})^{2} + (y_{2} - y_{1})^{2}$'
      - say: 'So $x$ minus 1, squared, plus $y$ minus 1, squared, equals $x$ minus 3, squared, plus $y$ minus 5, squared.'
        write: '$(x - 1)^{2} + (y - 1)^{2} = (x - 3)^{2} + (y - 5)^{2}$'
      - say: 'Expand each bracket. On the left we get $x^2 - 2x + 1$, and $y^2 - 2y + 1$.'
        write: 'Left: $x^{2} - 2x + 1 + y^{2} - 2y + 1$'
      - say: 'On the right we get $x^2 - 6x + 9$, and $y^2 - 10y + 25$.'
        write: 'Right: $x^{2} - 6x + 9 + y^{2} - 10y + 25$'
      - say: '$x$ squared and $y$ squared are on both sides, so they cancel. That is why the locus is a straight line. 1 plus 1 is 2, and 9 plus 25 is 34.'
        write: '$-2x - 2y + 2 = -6x - 10y + 34$'
      - say: 'Collect the terms. Add $6x$ and $10y$ to both sides, and subtract 2 from both sides. Minus $2x$ plus $6x$ is $4x$, minus $2y$ plus $10y$ is $8y$, and 34 minus 2 is 32.'
        write: '$4x + 8y = 32$'
      - say: 'Divide every term by 4.'
        write: '$x + 2y = 8$'
      - section: 'Check'
        say: 'Check with the midpoint of $VW$, which must be on the perpendicular bisector. It is 1 plus 3 over 2, 1 plus 5 over 2, which is the point 2, 3. And 2 plus 2 times 3 is 8.'
        write: 'Check: midpoint $(2,\ 3)$: $\ 2 + 2(3) = 8\ \checkmark$'
      - say: 'Therefore the locus of $P$ is $x$ plus $2y$ equals 8, which is option D.'
        write: '$\therefore$ locus: $x + 2y = 8$'
        answer: true
        point:
          - {figure: sketch, kind: label, target: 'locus of P', text: 'x + 2y = 8'}
    traps:
      A: 'You went for $2x + 2y = 9$. Try the midpoint 2, 3. 4 plus 6 is 10, not 9. The midpoint must be on the locus, and $x + 2y = 8$ passes that test.'
      B: 'You went for $2x + 3y = 8$. At the midpoint 2, 3 that gives 4 plus 9, which is 13, not 8. Expanding carefully gives $4x + 8y = 32$, which is $x + 2y = 8$.'
      C: 'You went for $2x + y = 9$. At the midpoint 2, 3 that gives 4 plus 3, which is 7, not 9. The correct working gives $x + 2y = 8$.'

  24:
    moments:
      - section: 'The question'
        say: 'A frustum is a cone with its top cut off. Its slanting side hides a right-angled triangle, and Pythagoras gives the slant side.'
        write: 'Find $l$ in the frustum.'
        point:
          - {figure: 0, kind: circle, target: 'l', text: 'slant side', 'on': 'slanting side'}
      - section: 'Solution'
        say: 'Solution. Write the givens from the diagram. The top radius r is 3 cm, the bottom radius R is 6 cm, and the height h is 4 cm.'
        write: 'Solution: $r = 3$ cm, $R = 6$ cm, $h = 4$ cm'
        point:
          - {figure: 0, kind: circle, target: '3 cm', text: 'top radius', 'on': 'top radius'}
          - {figure: 0, kind: circle, target: '6 cm', text: 'bottom radius', 'on': 'bottom radius'}
          - {figure: 0, kind: circle, target: '4 cm', text: 'height', 'on': 'height h'}
      - say: 'Now draw a line straight down from the edge of the top to the base. It is the height, 4 cm, and it makes a right-angled triangle with the slant side $l$.'
        write: 'Draw the perpendicular from the top edge to the base'
        point:
          - {figure: 0, kind: highlight, target: {x: 235, y: 195}, text: 'base of the triangle', 'on': 'right-angled triangle'}
      - say: 'The base of that triangle is the part of the bottom radius that sticks out beyond the top, so it is R minus r, or 6 minus 3, which is 3 cm.'
        write: 'Base of the right-angled $\triangle = R - r = 6 - 3 = 3$ cm'
      - section: 'Pythagoras'
        say: 'The slant side is the hypotenuse, so $l$ squared equals the base squared plus the height squared. The reason, in brackets, is Pythagoras.'
        write: '$l^{2} = 3^{2} + 4^{2}$ (Pythagoras)'
        'on': 'hypotenuse'
      - say: '3 squared is 9, and 4 squared is 16.'
        write: '$l^{2} = 9 + 16$'
      - say: '9 plus 16 is 25.'
        write: '$l^{2} = 25$'
      - say: 'Take the square root of both sides. 5 times 5 is 25, so $l$ is 5.'
        write: '$l = \sqrt{25} = 5$'
      - say: 'Therefore the slant side $l$ is 5 centimetres.'
        write: '$\therefore l = 5$ cm'
        point:
          - {figure: 0, kind: label, target: 'l', text: '5 cm', 'on': 'Therefore'}
      - section: 'Check'
        say: 'Check the other way round, because the slant side squared minus the height squared must give the base squared. 25 minus 16 is 9, which is 3 squared.'
        write: 'Check: $5^{2} - 4^{2} = 25 - 16 = 9 = 3^{2}$ ✓'
      - section: 'Answer'
        say: 'So $l$ is 5 cm, which is answer choice A.'
        write: '$\therefore l = 5$ cm (A)'
        answer: true
    traps:
      B: 'You went for 6 cm. That is the bottom radius, not the slant side. The slant side is the hypotenuse of a triangle with sides 3 and 4, which is 5.'
      C: 'You went for 7 cm. That comes from using the whole bottom radius, 6, as the base of the triangle. 36 plus 16 is 52, and root 52 is about 7.2. The base is R minus r, which is 3.'
      D: 'You went for 8 cm. The triangle has sides 3 and 4, and 9 plus 16 is 25, so the hypotenuse is 5, not 8.'

  25:
    moments:
      - section: 'The question'
        say: 'Two sides of a triangle and the angle between them are given, and the angle is obtuse. Many students treat cos 120 degrees as positive. Let''s find $XZ$ with the cosine rule.'
        write: 'Find $|XZ|$'
        point:
          - {figure: 0, kind: circle, target: '?', text: 'find'}
      - section: 'Solution'
        say: 'Solution. From the diagram, $XY$ is 2 m, $YZ$ is 1 m, and the angle at $Y$, between them, is 120 degrees.'
        write: 'Solution: $|XY| = 2$ m, $|YZ| = 1$ m, $\angle XYZ = 120^{\circ}$'
        point:
          - {figure: 0, kind: highlight, target: XY, text: '2 m'}
          - {figure: 0, kind: highlight, target: YZ, text: '1 m'}
          - {figure: 0, kind: arc, target: XYZ, text: '120°'}
      - say: 'Two sides and the included angle are known, and we want the third side. That is the cosine rule. $XZ$ is the side opposite the angle at $Y$.'
        write: '$|XZ|^{2} = |XY|^{2} + |YZ|^{2} - 2|XY||YZ|\cos Y$ (cosine rule)'
        point:
          - {figure: 0, kind: highlight, target: XZ, text: 'opposite Y'}
      - say: 'Now substitute 2 for $XY$, 1 for $YZ$, and 120 degrees for the angle at $Y$.'
        write: '$|XZ|^{2} = 2^{2} + 1^{2} - 2(2)(1)\cos 120^{\circ}$'
        point:
          - {line: 3, kind: move, from: {line: 1, at: 'XY∣ = [[2]]'}, at: '= [[2]]2', text: 'XY'}
          - {line: 3, kind: move, from: {line: 1, at: 'YZ∣ = [[1]]'}, at: '+ [[1]]2', text: 'YZ'}
          - {line: 3, kind: move, from: {line: 1, at: '= [[120∘]]'}, at: 'cos[[120∘]]', text: 'angle Y'}
      - say: '120 degrees is in the second quadrant, where cosine is negative. 120 is 180 minus 60, so cos 120 is minus cos 60, which is negative 1 over 2.'
        write: '$\cos 120^{\circ} = -\cos 60^{\circ} = -\dfrac{1}{2}$ (2nd quadrant)'
      - say: 'Back in the working, 2 squared is 4, 1 squared is 1, and 2 times 2 times 1 is 4. Put in negative 1 over 2 for cos 120.'
        write: '$|XZ|^{2} = 4 + 1 - 4\left(-\dfrac{1}{2}\right)$'
      - say: '4 plus 1 is 5. 4 times negative 1 over 2 is negative 2, and minus negative 2 is plus 2.'
        write: '$= 5 + 2$'
      - say: '5 plus 2 is 7.'
        write: '$|XZ|^{2} = 7$'
      - say: 'Take the square root of both sides.'
        write: '$|XZ| = \sqrt{7}$ m'
        point:
          - {figure: 0, kind: label, target: '?', text: '√7 m'}
      - section: 'Check'
        say: 'To check, with a right angle at $Y$, Pythagoras would give 4 plus 1, which is 5. An obtuse angle opens the triangle wider, so $XZ$ squared must be more than 5. 7 is.'
        write: 'Check: $7 > 2^{2} + 1^{2} = 5\ \checkmark$ ($\angle Y$ obtuse)'
      - say: 'Therefore $XZ$ is root 7 metres, which is option A.'
        write: '$\therefore |XZ| = \sqrt{7}$ m'
        answer: true
    traps:
      B: 'You went for root 6. The cosine rule gives 4 plus 1 minus 4 times negative 1 over 2, which is 5 plus 2, so $XZ$ squared is 7, not 6.'
      C: 'You went for root 5. That treats cos 120 degrees as 0, as if the angle at $Y$ were a right angle. Cos 120 degrees is negative 1 over 2, which adds 2 more to make 7.'
      D: 'You went for root 3. That uses cos 120 degrees as positive 1 over 2, giving 5 minus 2. 120 degrees is in the second quadrant, so its cosine is negative and we get 5 plus 2.'

  26:
    moments:
      - section: 'The question'
        say: 'Every circle equation can be matched with the general equation of a circle. Matching gives the radius in terms of $a$, and the radius is 4.'
        write: '$x^{2} + y^{2} - 2ax + 4y - a = 0$, centre $(a,\ -2)$, $r = 4$'
      - section: 'Solution'
        say: 'Solution. Let me draw the circle on the axes, with its centre $a$, negative 2, below the x-axis.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '(a, −2)', text: 'centre', 'on': 'centre'}
          - {figure: sketch, kind: circle, target: 'r = 4', text: 'radius', 'on': 'below'}
      - say: 'The general equation of a circle is $x$ squared plus $y$ squared plus $2gx$ plus $2fy$ plus $c$ equals 0.'
        write: '$x^{2} + y^{2} + 2gx + 2fy + c = 0$'
      - say: 'Its centre is negative $g$, negative $f$, and its radius squared is $g$ squared plus $f$ squared minus $c$.'
        write: 'Centre $= (-g,\ -f)$, $\ r^{2} = g^{2} + f^{2} - c$'
      - section: 'Compare'
        say: 'Compare the $x$ terms, so $2g$ equals negative $2a$, and $g$ is negative $a$.'
        write: '$2g = -2a \Rightarrow g = -a$'
      - say: 'Compare the $y$ terms, so $2f$ equals 4, and $f$ is 2.'
        write: '$2f = 4 \Rightarrow f = 2$'
      - say: 'Compare the constants, and $c$ is negative $a$. Keep the minus sign.'
        write: '$c = -a$'
      - say: 'Check the centre. Negative $g$ is $a$, and negative $f$ is negative 2. That agrees with the question.'
        write: 'Centre $= (-(-a),\ -2) = (a,\ -2)$ ✓'
      - section: 'The radius'
        say: 'Now the radius. Substitute into $r$ squared equals $g$ squared plus $f$ squared minus $c$, with $r$ as 4.'
        write: '$4^{2} = (-a)^{2} + 2^{2} - (-a)$'
      - say: '4 squared is 16. Negative $a$ squared is $a$ squared, 2 squared is 4, and minus negative $a$ is plus $a$.'
        write: '$16 = a^{2} + 4 + a$'
      - say: 'Collect everything on one side by subtracting 16 from both sides. 4 minus 16 is negative 12.'
        write: '$a^{2} + a - 12 = 0$'
      - section: 'Solve'
        say: 'Factorise. The product is negative 12, and the sum is 1. The two numbers are 4 and negative 3.'
        write: 'Product $= -12$, Sum $= 1$: $\ 4$ and $-3$'
        'on': 'Product'
      - say: 'Split the middle term, so $a$ becomes $4a$ minus $3a$.'
        write: '$a^{2} + 4a - 3a - 12 = 0$'
      - say: 'Group in pairs and take out the common factors, which are $a$ from the first pair and negative 3 from the second.'
        write: '$a(a + 4) - 3(a + 4) = 0$'
      - say: 'Now $a$ plus 4 is common.'
        write: '$(a + 4)(a - 3) = 0$'
      - say: 'Either $a$ plus 4 equals 0, or $a$ minus 3 equals 0.'
        write: 'Either $a + 4 = 0$ or $a - 3 = 0$'
        'on': 'Either'
      - say: 'So $a$ is negative 4 or $a$ is 3.'
        write: '$a = -4$ or $a = 3$'
      - say: 'The question wants the positive value. Therefore $a$ is 3.'
        write: '$\therefore a = 3$ (positive value)'
        point:
          - {line: 16, kind: strike, at: 'a = −4', text: 'not positive', 'on': 'positive value'}
          - {figure: sketch, kind: label, target: 'a = ?', text: 'a = 3', 'on': 'Therefore'}
      - section: 'Check'
        say: 'To check, with $a$ as 3, $r$ squared is 9 plus 4 plus 3, which is 16, and the square root of 16 is 4.'
        write: 'Check: $3^{2} + 4 + 3 = 16 = 4^{2}$ ✓'
      - section: 'Answer'
        say: 'So the positive value of $a$ is 3, which is answer choice C.'
        write: '$\therefore a = 3$ (C)'
        answer: true
    traps:
      A: 'You went for 1. With $a = 1$, the radius squared is 1 plus 4 plus 1, which is 6, not 16. Solving $a^{2} + a - 12 = 0$ gives 3.'
      B: 'You went for 2. With $a = 2$, the radius squared is 4 plus 4 plus 2, which is 10, not 16. The equation $a^{2} + a - 12 = 0$ gives 3.'
      D: 'You went for 4. That is the other root, negative 4, with its sign dropped. The question wants the positive root of $(a + 4)(a - 3) = 0$, which is 3.'

  27:
    moments:
      - section: 'The question'
        say: 'A man sees a bird on a tree, at an angle of elevation of 30 degrees. Many students forget the man''s own height. The angle is measured from his eyes, not the ground.'
        write: 'Find the height of the tree'
      - section: 'Solution'
        say: 'Solution. Let me draw the man and the tree. From his head $A$, a horizontal line meets the tree at $C$, and his line of sight goes up to the bird at $B$.'
        write: 'Solution: $|AB| = 25$ m, $\angle BAC = 30^{\circ}$, man $= 1.7$ m'
        show_sketch: true
        point:
          - {figure: sketch, kind: highlight, target: AB, text: '25 m'}
          - {figure: sketch, kind: arc, target: CAB, text: '30°'}
      - say: 'Let $h$ be the height of the bird above his head. That is the side $BC$.'
        write: 'Let $|BC| = h$ m'
        point:
          - {figure: sketch, kind: highlight, target: BC, text: 'h'}
      - say: 'Relative to the 30 degree angle, $h$ is the opposite side, and the 25 m line of sight is the hypotenuse. Opposite and hypotenuse means SOH, so we use sine.'
        write: 'opp $= h$, hyp $= 25$: use sine (SOH)'
      - say: 'Sine of the angle equals opposite over hypotenuse.'
        write: '$\sin 30^{\circ} = \dfrac{h}{25}$'
      - say: 'Cross-multiply, so $h$ equals 25 times sin 30 degrees.'
        write: '$h = 25\sin 30^{\circ}$'
      - say: 'Sin 30 degrees is 1 over 2, and 25 times 1 over 2 is 12.5.'
        write: '$= 25 \times \dfrac{1}{2} = 12.5$ m'
        point:
          - {figure: sketch, kind: label, target: '?', text: '12.5 m'}
      - say: 'That 12.5 m starts at his head, and his head is 1.7 m above the ground. So the tree is $h$ plus 1.7.'
        write: 'Height of tree $= h + 1.7$'
        point:
          - {figure: sketch, kind: circle, target: {x: 302, y: 210}, text: '+ 1.7 m'}
      - say: 'Substitute 12.5 for $h$. 12.5 plus 1.7 is 14.2.'
        write: '$= 12.5 + 1.7 = 14.2$ m'
        point:
          - {line: 8, kind: move, from: {line: 6, at: '= [[12.5]] m'}, at: '= [[12.5]] +', text: 'h'}
      - section: 'Check'
        say: 'Check by Pythagoras. The level distance $AC$ is 25 cos 30, so $AC$ squared is 468.75. Add 12.5 squared, 156.25, and we get 625, which is 25 squared.'
        write: 'Check: $156.25 + 468.75 = 625 = 25^{2}\ \checkmark$ (Pythagoras)'
      - say: 'Therefore the tree is 14.2 m tall, which is option B.'
        write: '$\therefore$ height of tree $= 14.2$ m'
        answer: true
    traps:
      A: 'You went for 26.7 m. That adds the whole 25 m line of sight to his height. The 25 m is the slanting hypotenuse. Only the opposite side, 25 sin 30 degrees, is vertical, and that is 12.5 m.'
      C: 'You went for C. That uses tangent, as if 25 m were the level distance. The 25 m runs from his head to the bird, so it is the hypotenuse, and SOH gives sine.'
      D: 'You went for D. That uses root 2 over 2, which is sin 45 degrees. The angle is 30 degrees, and sin 30 degrees is 1 over 2.'

  28:
    moments:
      - section: 'The question'
        say: 'We have a tangent and a line cutting the circle, both from $T$. Many students use $PQ$ instead of the whole line $TQ$. One theorem links them.'
        write: '$TZ$ tangent, $TZ = 6$, $PQ = 9$, $TP = x$'
        point:
          - {figure: 0, kind: highlight, target: TZ, text: 'tangent, 6'}
          - {figure: 0, kind: highlight, target: PQ, text: '9'}
      - section: 'Solution'
        say: 'Solution. From the outside point $T$, the tangent touches at $Z$, and the other line cuts the circle at $P$ and $Q$. $TQ$ is $TP$ plus $PQ$.'
        write: 'Solution: $TQ = TP + PQ = x + 9$'
        point:
          - {figure: 0, kind: underline, target: TQ, text: 'x + 9'}
      - say: 'The tangent squared equals the product of the whole secant and its outside part. The reason is the tangent-secant theorem, from intersecting chords.'
        write: '$TZ^{2} = TP \times TQ$ (tangent-secant theorem)'
      - say: 'Substitute 6 for $TZ$, $x$ for $TP$ and $x$ plus 9 for $TQ$.'
        write: '$6^{2} = x(x + 9)$'
        point:
          - {line: 3, kind: move, from: {line: 1, at: '= [[x + 9]]'}, at: '(x + 9)', text: 'TQ'}
      - say: '6 squared is 36. Expanding the bracket gives $x$ squared plus $9x$. Then bring 36 across to make the quadratic equal to zero.'
        write: '$x^{2} + 9x - 36 = 0$'
      - say: 'Factorise. The product is negative 36, and the sum is 9. The two numbers are 12 and negative 3.'
        write: 'Product $= -36$, Sum $= 9$: $\ 12$ and $-3$'
      - say: 'So the quadratic factorises into $x$ plus 12, times $x$ minus 3.'
        write: '$(x + 12)(x - 3) = 0$'
      - say: 'Either $x$ plus 12 is 0, or $x$ minus 3 is 0.'
        write: 'Either $x + 12 = 0$ or $x - 3 = 0$'
      - say: 'So $x$ is negative 12 or 3. A length cannot be negative, so $x$ is 3.'
        write: '$x = -12$ (not a length) or $x = 3$'
        point:
          - {figure: 0, kind: label, target: x, text: '3'}
      - section: 'Check'
        say: 'To check, $TQ$ is 3 plus 9, which is 12, and 3 times 12 is 36, which is 6 squared.'
        write: 'Check: $3 \times 12 = 36 = 6^{2}\ \checkmark$'
      - say: 'Therefore $x$ is 3, which is option A.'
        write: '$\therefore x = 3$'
        answer: true
    traps:
      B: 'You went for 4. That comes from $9x = 36$, using $PQ$ in place of the whole secant $TQ$. The theorem needs $TQ$, which is $x + 9$.'
      C: 'You went for 5. Check it. 5 times 14 is 70, not 36. Solving $x(x + 9) = 36$ gives 3.'
      D: 'You went for 6. That is the tangent length $TZ$, not $TP$. Solving $x(x + 9) = 36$ gives 3.'

  29:
    moments:
      - section: 'The question'
        say: 'We want the tangent of the acute angle between two lines. The angle depends only on their gradients, so we find each gradient first.'
        write: 'Lines: $2x + y = 3$ and $3x - 2y = 5$'
        show_sketch: true
        point:
          - { figure: sketch, kind: circle, target: '2x + y = 3' }
          - { figure: sketch, kind: circle, target: '3x − 2y = 5' }
      - section: 'Solution'
        say: 'Solution. Write each line in the form $y = mx + c$. Then $m$, the number in front of $x$, is the gradient.'
        write: 'Solution: $y = mx + c$, $\ m = $ gradient'
      - say: 'For the first line, subtract $2x$ from both sides. $y$ equals minus $2x$ plus 3.'
        write: '$2x + y = 3 \Rightarrow y = -2x + 3$'
      - say: 'So the first gradient, $m_1$, is minus 2.'
        write: '$\therefore m_{1} = -2$'
        point:
          - { figure: sketch, kind: circle, target: 'm₁ = −2' }
      - say: 'For the second line, subtract $3x$ from both sides, which gives minus $2y$ equals minus $3x$ plus 5. Then multiply every term by minus 1, so every sign changes, and $2y$ equals $3x$ minus 5.'
        write: '$3x - 2y = 5 \Rightarrow 2y = 3x - 5$'
      - say: 'Divide every term by 2.'
        write: '$y = \dfrac{3}{2}x - \dfrac{5}{2}$'
      - say: 'So the second gradient, $m_2$, is 3 over 2.'
        write: '$\therefore m_{2} = \dfrac{3}{2}$'
        point:
          - { figure: sketch, kind: circle, target: 'm₂ = 3/2' }
      - section: 'The angle'
        say: 'Here is the formula for the angle between two lines. The modulus bars make the tangent positive, which gives the acute angle.'
        write: '$\tan\theta = \left|\dfrac{m_{1} - m_{2}}{1 + m_{1}m_{2}}\right|$'
        point:
          - { figure: sketch, kind: circle, target: 'θ', text: 'acute angle' }
      - say: 'Substitute $m_1$ equals minus 2 and $m_2$ equals 3 over 2.'
        write: '$\tan\theta = \left|\dfrac{-2 - \frac{3}{2}}{1 + (-2)\left(\frac{3}{2}\right)}\right|$'
      - say: 'On the top, minus 2 minus 3 over 2 is minus 7 over 2. On the bottom, minus 2 times 3 over 2 is minus 3, and 1 minus 3 is minus 2.'
        write: '$= \left|\dfrac{-\frac{7}{2}}{-2}\right|$'
      - say: 'Dividing by minus 2 is multiplying by minus a half. Minus times minus is plus, so 7 over 2 times 1 over 2 is 7 over 4.'
        write: '$= \dfrac{7}{2} \times \dfrac{1}{2} = \dfrac{7}{4}$'
      - section: 'Check'
        say: 'Check with the gradients the other way round. 3 over 2 plus 2 is 7 over 2, over minus 2 again. The modulus is the same 7 over 4.'
        write: 'Check: $\left|\dfrac{\frac{3}{2} - (-2)}{1 - 3}\right| = \left|\dfrac{\frac{7}{2}}{-2}\right| = \dfrac{7}{4}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the tangent of the acute angle is 7 over 4, which is answer choice C.'
        write: '$\therefore \tan\theta = \dfrac{7}{4}$'
        answer: true
        point:
          - { figure: sketch, kind: circle, target: 'θ', text: 'tan θ = 7/4' }
    traps:
      A: 'You went for minus 7 over 4. A negative tangent belongs to the obtuse angle. The acute angle has a positive tangent, so take the modulus to get 7 over 4.'
      B: 'You went for 7 over 8. Minus 7 over 2 divided by minus 2 is 7 over 2 times 1 over 2, which is 7 over 4, not 7 over 8.'
      D: 'You went for 7 over 2. That is only the top of the formula. Divide by the bottom, $1 + m_{1}m_{2}$, which is minus 2, to get 7 over 4.'

  30:
    moments:
      - section: 'The question'
        say: 'From $P$, $Q$ is on N 67 degrees W and $R$ is on N 23 degrees E. From $Q$, $R$ is on N 68 degrees E. $PQ$ is 150 m. We want $PR$.'
        write: 'From $P$: $Q$ on $N67^{\circ}W$, $R$ on $N23^{\circ}E$; $\ |PQ| = 150$ m'
      - section: 'Solution'
        say: 'Solution. Let me draw it with a North line at $P$. N 67 degrees W means we face North, then turn 67 degrees towards West.'
        write: 'Solution: N line at $P$'
        show_sketch: true
        'on': 'North line'
        point:
          - { figure: sketch, kind: highlight, target: PQ, text: '150 m' }
          - { figure: sketch, kind: circle, target: '67°', text: 'N to W' }
      - say: 'At $P$, $Q$ and $R$ are on opposite sides of the North line, so we add the two angles.'
        write: '$\angle QPR = 67^{\circ} + 23^{\circ} = 90^{\circ}$'
        point:
          - { figure: sketch, kind: arc, target: QPR, text: '90°' }
      - section: 'The angle at Q'
        say: 'Now draw a North line at $Q$, and the line $QR$ on N 68 degrees E. North lines are always parallel.'
        write: 'N line at $Q$ ($\parallel$ N line at $P$)'
        show_sketch: sketch_b
        point:
          - { figure: sketch_b, kind: highlight, target: QR, text: 'N68°E' }
      - say: '$PQ$ cuts the two parallel North lines. The angles between them on the same side add up to 180, because they are co-interior angles.'
        write: '$\angle(\text{N at }Q,\ QP) = 180^{\circ} - 67^{\circ} = 113^{\circ}$ (co-int. $\angle$s)'
        point:
          - { figure: sketch_b, kind: circle, target: 'Q', text: '113° from N' }
      - say: '$QR$ is 68 degrees from North at $Q$, on the same side as $QP$. So the angle inside the triangle at $Q$ is 113 minus 68.'
        write: '$\angle PQR = 113^{\circ} - 68^{\circ} = 45^{\circ}$'
        point:
          - { figure: sketch_b, kind: circle, target: '68°', text: 'N68°E' }
          - { figure: sketch_b, kind: arc, target: PQR, text: '45°' }
      - section: 'The angle at R'
        say: 'The angles of a triangle add up to 180. So the angle at $R$ is 180 minus 90 minus 45.'
        write: '$\angle PRQ = 180^{\circ} - 90^{\circ} - 45^{\circ} = 45^{\circ}$ ($\angle$ sum of $\triangle$)'
        point:
          - { figure: sketch_b, kind: arc, target: PRQ, text: '45°' }
      - say: 'The angles at $Q$ and $R$ are equal, so the triangle is isosceles. $PR$ faces the angle at $Q$, and $PQ$ faces the angle at $R$. So they are equal.'
        write: '$|PR| = |PQ|$ (sides opp. equal $\angle$s)'
        point:
          - { figure: sketch_b, kind: highlight, target: PR, text: 'faces Q' }
          - { figure: sketch_b, kind: highlight, target: PQ, text: 'faces R' }
      - say: 'So $PR$ is 150 metres.'
        write: '$\therefore |PR| = 150$ m'
      - section: 'Check'
        say: 'Check with SOH CAH TOA. The right angle is at $P$. From the 45 degrees at $Q$, $PR$ is opposite and $PQ$ is adjacent, and tan 45 is 1.'
        write: 'Check: $\tan 45^{\circ} = \dfrac{|PR|}{150} \Rightarrow |PR| = 150 \times 1 = 150\ \checkmark$'
        point:
          - { figure: sketch_b, kind: highlight, target: 'PR', text: 'opp' }
          - { figure: sketch_b, kind: underline, target: 'PQ', text: 'adj' }
      - section: 'Answer'
        say: 'Therefore $PR$ is 150 m, which is answer choice C.'
        write: '$\therefore PR = 150$ m'
        answer: true
        point:
          - { figure: sketch_b, kind: label, target: '?', text: '150 m' }
    traps:
      A: 'You went for 120 m. The triangle has angles 90, 45 and 45, a right-angled isosceles triangle. The sides opposite the two 45 degree angles are equal, so $PR = PQ = 150$ m.'
      B: 'You went for 140 m. Find the angles first. The angle at $P$ is 90, and the angle at $Q$ is 113 minus 68, which is 45. So the angle at $R$ is 45, and $PR = PQ = 150$ m.'
      D: 'You went for 160 m. With 45 degrees at both $Q$ and $R$, the sides $PR$ and $PQ$ are equal, so $PR$ is 150 m.'

  31:
    moments:
      - section: 'The question'
        say: 'We have a cyclic quadrilateral, a parallel line and an isosceles triangle, all in one diagram. Many students stop at 70. Let''s find $x$, one reason at a time.'
        write: '$PQRS$ cyclic, $ST \parallel RQ$, $PT = PS$; find $x$'
        point:
          - {figure: 0, kind: circle, target: x, text: 'find'}
      - section: 'Solution'
        say: 'Solution. The givens on the diagram are that the angle at $R$ is 110 degrees, $ST$ is parallel to $RQ$, and $PT$ equals $PS$.'
        write: 'Solution: $\angle QRS = 110^{\circ}$'
        point:
          - {figure: 0, kind: circle, target: '110°', text: 'angle R'}
          - {figure: 0, kind: highlight, target: ST, text: '∥ RQ'}
      - say: 'Angles $P$ and $R$ are opposite angles of the cyclic quadrilateral, so they add up to 180. Angle $SPQ$ is 180 minus 110.'
        write: '$\angle SPQ = 180^{\circ} - 110^{\circ} = 70^{\circ}$ (opp. $\angle$s of a cyclic quad.)'
        point:
          - {figure: 0, kind: arc, target: SPQ, text: '70°'}
      - say: '$ST$ is parallel to $RQ$, and $PQ$ crosses both. Angle $PTS$ and angle $PQR$ are in the same position, so they are corresponding angles, which are equal.'
        write: '$\angle PTS = \angle PQR = x$ (corr. $\angle$s, $ST \parallel RQ$)'
        point:
          - {figure: 0, kind: arc, target: PTS, text: 'x'}
      - say: '$PT$ equals $PS$, so triangle $PTS$ is isosceles, and its base angles at $T$ and $S$ are equal.'
        write: '$\angle PST = \angle PTS = x$ (base $\angle$s of isos. $\triangle$)'
        point:
          - {figure: 0, kind: arc, target: PST, text: 'x'}
      - say: 'The angles of triangle $PTS$ are 70, $x$ and $x$, and they add up to 180.'
        write: '$70^{\circ} + x + x = 180^{\circ}$ ($\angle$ sum of $\triangle$)'
      - say: '$x$ plus $x$ is $2x$. Subtract 70 from both sides, and 180 minus 70 is 110.'
        write: '$2x = 180^{\circ} - 70^{\circ} = 110^{\circ}$'
      - say: 'Divide both sides by 2. Half of 110 is 55.'
        write: '$x = \dfrac{110^{\circ}}{2} = 55^{\circ}$'
        point:
          - {figure: 0, kind: label, target: x, text: '55°'}
      - section: 'Check'
        say: 'Check with the parallel lines. Angle $PSR$ is 180 minus 55, which is 125, by opposite angles. So angle $TSR$ is 125 minus 55, which is 70.'
        write: 'Check: $\angle PSR = 125^{\circ}$, $\ \angle TSR = 125^{\circ} - 55^{\circ} = 70^{\circ}$'
      - say: 'Angles $TSR$ and $SRQ$ are co-interior, so they should add up to 180. 70 plus 110 is 180. It agrees.'
        write: '$70^{\circ} + 110^{\circ} = 180^{\circ}$ (co-int. $\angle$s) $\checkmark$'
      - say: 'Therefore $x$ is 55 degrees, which is option B.'
        write: '$\therefore x = 55^{\circ}$'
        answer: true
    traps:
      A: 'You went for 70 degrees. That is the angle at $P$, between the equal sides. $x$ is one of the two equal base angles, which share the other 110 degrees, so each is 55.'
      C: 'You went for 40 degrees. That is 180 minus 2 times 70, treating 70 as a base angle. But 70 is the angle at $P$, between the equal sides, so the base angles are 55 each.'
      D: 'You went for 35 degrees. That is half of 70. The two base angles share 180 minus 70, which is 110, so each is 55.'

  32:
    moments:
      - section: 'The question'
        say: 'We have a cyclic quadrilateral with a pair of parallel sides, and two angles made by its diagonals. Many students add 34 and 42. Let''s find angle $HEG$ with the angle theorems.'
        write: '$EFGH$ cyclic, $EH \parallel FG$; find $\angle HEG$'
        point:
          - {figure: 0, kind: circle, target: '?', text: 'find'}
      - section: 'Solution'
        say: 'Solution. The givens on the diagram are angle $EFH$, 34 degrees at $F$, and angle $FHG$, 42 degrees at $H$. Let angle $HFG$ be $y$.'
        write: 'Solution: $\angle EFH = 34^{\circ},\ \angle FHG = 42^{\circ}$; let $\angle HFG = y$'
        point:
          - {figure: 0, kind: arc, target: EFH, text: '34°'}
          - {figure: 0, kind: arc, target: FHG, text: '42°'}
          - {figure: 0, kind: arc, target: HFG, text: 'y'}
      - say: '$EH$ is parallel to $FG$, and $FH$ crosses both. Angles $EHF$ and $HFG$ make a Z shape, so they are alternate angles, and they are equal.'
        write: '$\angle EHF = \angle HFG = y$ (alt. $\angle$s, $EH \parallel FG$)'
        point:
          - {figure: 0, kind: arc, target: EHF, text: 'y'}
      - say: 'Angles $EFG$ and $EHG$ are opposite angles of the cyclic quadrilateral, so they add up to 180.'
        write: '$\angle EFG + \angle EHG = 180^{\circ}$ (opp. $\angle$s of a cyclic quad.)'
      - say: 'Angle $EFG$ is 34 plus $y$, and angle $EHG$ is $y$ plus 42.'
        write: '$(34^{\circ} + y) + (y + 42^{\circ}) = 180^{\circ}$'
      - say: 'Collect terms, so $2y$ plus 76 is 180. 180 minus 76 is 104.'
        write: '$2y = 180^{\circ} - 76^{\circ} = 104^{\circ}$'
      - say: 'Divide by 2. Half of 104 is 52.'
        write: '$y = 52^{\circ}$'
      - say: 'Angle $HEG$ at $E$ and angle $HFG$ at $F$ both stand on the chord $HG$, on the same side. The reason is that angles in the same segment are equal.'
        write: '$\angle HEG = \angle HFG = 52^{\circ}$ ($\angle$s in the same segment)'
        point:
          - {figure: 0, kind: highlight, target: HG, text: 'chord HG'}
          - {figure: 0, kind: label, target: '?', text: '52°'}
      - section: 'Check'
        say: 'To check, angle $EGF$ stands on chord $EF$, like angle $EHF$, so it is also 52. And angle $EGF$ and angle $HEG$ are alternate angles, since $EH$ is parallel to $FG$. Both are 52.'
        write: 'Check: $\angle EGF = \angle EHF = 52^{\circ} = \angle HEG$ (alt. $\angle$s) $\checkmark$'
      - say: 'Therefore angle $HEG$ is 52 degrees, which is option C.'
        write: '$\therefore \angle HEG = 52^{\circ}$'
        answer: true
    traps:
      A: 'You went for 34 degrees. That is angle $EFH$, which stands on chord $EH$. Angle $HEG$ stands on chord $HG$, like angle $HFG$, which is 52.'
      B: 'You went for 42 degrees. That is angle $FHG$, which stands on chord $FG$. Angle $HEG$ stands on chord $HG$, and equals angle $HFG$, which is 52.'
      D: 'You went for 76 degrees. That is 34 plus 42. Use the parallel sides and the cyclic quadrilateral. Then $2y + 76 = 180$ gives $y = 52$, and angle $HEG$ equals $y$.'

  33:
    moments:
      - section: 'The question'
        say: 'The maximum value of $y$ is 13, and we want $h$. We find the maximum in terms of $h$, then set it equal to 13.'
        write: '$y = 1 + hx - 3x^{2}$, $\ y_{\max} = 13$'
      - section: 'Solution'
        say: 'Solution. Differentiate term by term, treating $h$ as a constant. 1 gives 0, $hx$ gives $h$, and minus $3x$ squared gives minus $6x$.'
        write: '$\dfrac{dy}{dx} = h - 6x$'
      - section: 'Turning point'
        say: 'At the turning point, the gradient is zero. So we write that at turning point, $\dfrac{dy}{dx}$ equals 0.'
        'on': 'turning point'
        write: 'At turning point, $\dfrac{dy}{dx} = 0$'
      - say: 'So $h$ minus $6x$ equals 0.'
        write: '$h - 6x = 0$'
        point:
          - {line: 3, kind: move, from: {line: 1, at: '= [[h − 6x]]'}, at: 'h − 6x', text: 'dy/dx'}
      - say: 'Add $6x$ to both sides, then divide by 6. $x$ equals $h$ over 6.'
        write: '$6x = h \Rightarrow x = \dfrac{h}{6}$'
      - section: 'Second derivative'
        say: 'Differentiate again, and $h$ gives 0, while minus $6x$ gives minus 6. It is negative, so the turning point is a maximum.'
        'on': 'negative'
        write: '$\dfrac{d^{2}y}{dx^{2}} = -6 < 0$, $\ \therefore$ maximum'
      - section: 'Maximum value'
        say: 'Substitute $x$ equals $h$ over 6 into the original equation, with it in brackets.'
        write: '$y_{\max} = 1 + h\left(\tfrac{h}{6}\right) - 3\left(\tfrac{h}{6}\right)^{2}$'
      - say: '$h$ times $h$ over 6 is $h$ squared over 6. $h$ over 6, squared, is $h$ squared over 36, and 3 times that is $3h$ squared over 36.'
        write: '$= 1 + \dfrac{h^{2}}{6} - \dfrac{3h^{2}}{36}$'
      - say: 'Cancel by 3, so $3h$ squared over 36 is $h$ squared over 12.'
        write: '$= 1 + \dfrac{h^{2}}{6} - \dfrac{h^{2}}{12}$'
      - say: 'The L.C.M. of 6 and 12 is 12. $h$ squared over 6 is $2h$ squared over 12, and $2h$ squared minus $h$ squared is $h$ squared.'
        write: '$= 1 + \dfrac{2h^{2} - h^{2}}{12} = 1 + \dfrac{h^{2}}{12}$'
      - section: 'Find h'
        say: 'But the maximum value is given as 13. So equate the two.'
        write: '$\therefore 1 + \dfrac{h^{2}}{12} = 13$'
      - say: 'Subtract 1 from both sides. 13 minus 1 is 12.'
        write: '$\dfrac{h^{2}}{12} = 12$'
      - say: 'Multiply both sides by 12. 12 times 12 is 144.'
        write: '$h^{2} = 144$'
      - say: 'Take the square root. $h$ is plus or minus 12, and only 12 is among the options.'
        write: '$h = \pm\sqrt{144} = \pm 12$'
      - section: 'Check'
        say: 'Check with $h$ equals 12. The turning point is at $x$ equals 12 over 6, which is 2. Then $y$ is 1 plus 24 minus 12, which is 13, the top of the graph.'
        write: 'Check: $x = \dfrac{12}{6} = 2$, $\ y = 1 + 24 - 12 = 13\ \checkmark$'
        diagram:
          id: g
          kind: graph
          x: [-1, 5]
          y: [-5, 15]
          y_step: 5
          plots:
            - {fn: '1 + 12x - 3x^2', label: 'y = 1 + 12x − 3x²', colour: blue}
        diagram_do:
          - {id: g, op: vertex, part: 'plot:1', text: 'maximum 13', colour: green, on: top}
      - say: 'Therefore $h$ is 12, which is answer choice B.'
        write: '$\therefore h = 12$'
        answer: true
    traps:
      A: 'You went for 13. That is the maximum value itself, copied into the answer. The question asks for $h$, and $1 + \dfrac{h^{2}}{12} = 13$ gives $h = 12$.'
      C: 'You went for 11. With $h = 11$ the maximum is $1 + \dfrac{121}{12}$, about 11.1, not 13. We need $h^{2} = 144$, so $h$ is 12.'
      D: 'You went for 10. With $h = 10$ the maximum is $1 + \dfrac{100}{12}$, about 9.3, not 13. We need $h^{2} = 144$, so $h$ is 12.'

  34:
    moments:
      - section: 'The question'
        say: 'This is a definite integral of a bracket squared, from minus 2 to 1. Let me draw the curve $y$ equals $x$ minus 1, all squared.'
        write: '$\displaystyle\int_{-2}^{1}(x - 1)^{2}\,dx$'
        diagram:
          id: g
          kind: graph
          x: [-3, 2.5]
          y: [-1, 10]
          plots:
            - {fn: '(x - 1)^2', label: 'y = (x − 1)²', colour: blue}
      - section: 'Solution'
        say: 'Solution. First expand the bracket. $x$ minus 1, times $x$ minus 1, gives $x$ squared, minus $x$, minus $x$, plus 1.'
        write: 'Solution: $(x - 1)^{2} = (x - 1)(x - 1) = x^{2} - x - x + 1 = x^{2} - 2x + 1$'
      - say: 'To integrate a power of $x$, add 1 to the power, and divide by the new power. Then add $c$, the constant of integration.'
        write: '$\displaystyle\int x^{n}\,dx = \dfrac{x^{n+1}}{n+1} + c$'
      - say: 'Integrate term by term. $x$ squared becomes $x$ cubed over 3. Minus $2x$ becomes minus $2x$ squared over 2. And 1 becomes $x$. The $c$ cancels in a definite integral.'
        write: '$\displaystyle\int_{-2}^{1}(x^{2} - 2x + 1)\,dx = \left[\dfrac{x^{3}}{3} - \dfrac{2x^{2}}{2} + x\right]_{-2}^{1}$'
        diagram_do:
          - {id: g, op: shade, part: 'plot:1', x: [-2, 1], text: 'Area = ?', colour: orange}
      - say: '2 over 2 is 1, so the middle term is minus $x$ squared.'
        write: '$= \left[\dfrac{x^{3}}{3} - x^{2} + x\right]_{-2}^{1}$'
      - section: 'Upper minus lower'
        say: 'Substitute the upper limit, 1, then subtract the value at the lower limit, minus 2. Put the minus 2 in brackets.'
        write: '$= \left(\dfrac{1^{3}}{3} - 1^{2} + 1\right) - \left(\dfrac{(-2)^{3}}{3} - (-2)^{2} + (-2)\right)$'
      - say: 'In the first bracket, 1 over 3 minus 1 plus 1 is 1 over 3. In the second, minus 2 cubed is minus 8, and minus 2 squared is plus 4.'
        write: '$= \dfrac{1}{3} - \left(-\dfrac{8}{3} - 4 - 2\right)$'
      - say: 'Minus 4 minus 2 is minus 6, which is minus 18 over 3. Minus 8 over 3 minus 18 over 3 is minus 26 over 3.'
        write: '$= \dfrac{1}{3} - \left(-\dfrac{26}{3}\right)$'
      - say: 'Minus a negative is plus. 1 over 3 plus 26 over 3 is 27 over 3, which is 9.'
        write: '$= \dfrac{1}{3} + \dfrac{26}{3} = \dfrac{27}{3} = 9$'
        diagram_do:
          - {id: g, op: label, part: 'shade:1', text: 'Area = 9', colour: green}
      - section: 'Check'
        say: 'Check by substitution. Let $u$ equal $x$ minus 1, so $du$ equals $dx$. When $x$ is minus 2, $u$ is minus 3. When $x$ is 1, $u$ is 0.'
        write: 'Check: let $u = x - 1$, $\ du = dx$; $\ x = -2 \Rightarrow u = -3,\ x = 1 \Rightarrow u = 0$'
      - say: 'The integral of $u$ squared is $u$ cubed over 3. At 0 it is 0. At minus 3 it is minus 27 over 3, which is minus 9. 0 minus minus 9 is 9.'
        write: '$\displaystyle\int_{-3}^{0}u^{2}\,du = \left[\dfrac{u^{3}}{3}\right]_{-3}^{0} = 0 - (-9) = 9\ \checkmark$'
      - say: 'Therefore the integral is 9, which is option C.'
        write: '$\therefore \displaystyle\int_{-2}^{1}(x - 1)^{2}\,dx = 9$'
        answer: true
    traps:
      A: 'You went for minus 3 and a third. The curve is a square, never below the axis, so the integral from minus 2 up to 1 cannot be negative. Minus a negative is plus, so 1 over 3 plus 26 over 3 is 9.'
      B: 'You went for 7. Recheck the lower bracket. Minus 8 over 3, minus 4, minus 2 is minus 26 over 3. Then 1 over 3 minus minus 26 over 3 is 27 over 3, which is 9.'
      D: 'You went for 11. Recheck the lower bracket. Minus 2 squared is plus 4, so minus $x$ squared gives minus 4. Upper minus lower is 1 over 3 plus 26 over 3, which is 9.'

  35:
    moments:
      - section: 'The question'
        say: 'Evaluate the integral of cos $x$ minus sin $x$, from 0 to $\tfrac{\pi}{4}$. Here is its graph, and we want the area under it between those limits.'
        write: '$\displaystyle\int_{0}^{\pi/4}(\cos x - \sin x)\,dx$'
        show_sketch: true
        point:
          - { figure: sketch, kind: circle, target: 'area = ?' }
      - section: 'Solution'
        say: 'Solution. Let $I$ be the integral. First, two standard integrals. Cos $x$ integrates to sin $x$, because sin $x$ differentiates to cos $x$.'
        write: 'Solution: $\displaystyle\int \cos x\,dx = \sin x + c$'
      - say: 'And sin $x$ integrates to minus cos $x$, because cos $x$ differentiates to minus sin $x$.'
        write: '$\displaystyle\int \sin x\,dx = -\cos x + c$'
      - say: 'Integrate term by term. Minus sin $x$ gives minus minus cos $x$, which is plus cos $x$. Write it in square brackets with the limits, and there is no $c$ for a definite integral.'
        write: '$I = \Big[\sin x - (-\cos x)\Big]_{0}^{\pi/4} = \Big[\sin x + \cos x\Big]_{0}^{\pi/4}$'
      - section: 'Upper minus lower'
        say: 'Now take the upper limit minus the lower limit, each in its own bracket.'
        write: '$= \left(\sin\dfrac{\pi}{4} + \cos\dfrac{\pi}{4}\right) - (\sin 0 + \cos 0)$'
        point:
          - { figure: sketch, kind: circle, target: 'π/4', text: 'upper limit' }
          - { figure: sketch, kind: circle, target: 'O', text: 'lower limit 0' }
      - say: '$\tfrac{\pi}{4}$ is 45 degrees. From half a square, sin 45 and cos 45 are both root 2 over 2. Sin 0 is 0 and cos 0 is 1.'
        write: '$= \left(\dfrac{\sqrt{2}}{2} + \dfrac{\sqrt{2}}{2}\right) - (0 + 1)$'
      - say: 'Root 2 over 2 plus root 2 over 2 is 2 root 2 over 2, which is root 2. So we get root 2 minus 1.'
        write: '$= \sqrt{2} - 1$'
      - section: 'Check'
        say: 'To check, between 0 and $\tfrac{\pi}{4}$, cos $x$ is bigger than sin $x$, so the curve is above the axis and the area is positive. Root 2 minus 1 is about 0.414.'
        write: 'Check: $\sqrt{2} - 1 \approx 1.414 - 1 = 0.414 > 0\ \checkmark$'
        point:
          - { figure: sketch, kind: circle, target: 'y = cos x − sin x', text: 'above the axis' }
      - section: 'Answer'
        say: 'Therefore the integral is root 2 minus 1, which is answer choice B.'
        write: '$\therefore I = \sqrt{2} - 1$'
        answer: true
        point:
          - { figure: sketch, kind: circle, target: 'area = ?', text: '√2 − 1' }
    traps:
      A: 'You went for root 2 plus 1. That adds the value at 0 instead of subtracting it. A definite integral is upper minus lower, which gives root 2 minus 1.'
      C: 'You went for minus root 2 minus 1. Both signs are off. $\left[\sin x + \cos x\right]$ is root 2 at the upper limit and 1 at the lower, so the answer is root 2 minus 1.'
      D: 'You went for 1 minus root 2. That is lower minus upper, the wrong way round. It is the value at $\tfrac{\pi}{4}$ minus the value at 0, which is root 2 minus 1.'

  36:
    moments:
      - section: 'The question'
        say: 'We want the area bounded by a curve, the $x$-axis and the ordinates $x$ equals 0 and $x$ equals 2. Let me draw the curve.'
        write: '$y = x(2 - x)$, $x$-axis, $x = 0$ to $x = 2$'
        diagram:
          id: g
          kind: graph
          x: [-0.5, 2.5]
          y: [-1.5, 1.5]
          x_step: 0.5
          y_step: 0.5
          plots:
            - {fn: 'x(2 - x)', label: 'y = x(2 − x)', colour: blue}
      - section: 'Solution'
        say: 'Solution. The area under a curve, from $x$ equals $a$ to $x$ equals $b$, is the integral of $y$ with respect to $x$. Here $a$ is 0 and $b$ is 2.'
        'on': 'area under'
        write: 'Area $= \displaystyle\int_{a}^{b} y\,dx = \int_{0}^{2} x(2 - x)\,dx$'
        diagram_do:
          - {id: g, op: shade, part: 'plot:1', x: [0, 2], text: 'Area = ?', colour: orange, on: here}
      - say: 'Expand the bracket so we can integrate term by term. $x$ times 2 is $2x$, and $x$ times minus $x$ is minus $x$ squared.'
        write: '$= \displaystyle\int_{0}^{2} (2x - x^{2})\,dx$'
      - say: 'The rule is to add 1 to the power, and divide by the new power. There is also a $c$, which cancels in a definite integral, so we leave it out below.'
        'on': 'add 1'
        write: '$\displaystyle\int x^{n}\,dx = \dfrac{x^{n+1}}{n+1} + c$'
      - say: 'Integrate term by term. $2x$ becomes $2x$ squared over 2. Minus $x$ squared becomes minus $x$ cubed over 3. Keep the limits on the square bracket.'
        write: '$= \left[\dfrac{2x^{2}}{2} - \dfrac{x^{3}}{3}\right]_{0}^{2}$'
        point:
          - {line: 3, kind: box, text: 'the rule'}
      - say: '2 over 2 is 1.'
        write: '$= \left[x^{2} - \dfrac{x^{3}}{3}\right]_{0}^{2}$'
      - section: 'Upper minus lower'
        say: 'Substitute the upper limit, 2, then subtract the value at the lower limit, 0. Put each in its own bracket.'
        write: '$= \left(2^{2} - \dfrac{2^{3}}{3}\right) - \left(0^{2} - \dfrac{0^{3}}{3}\right)$'
      - say: '2 squared is 4, and 2 cubed is 8. The second bracket is all zeros.'
        write: '$= \left(4 - \dfrac{8}{3}\right) - 0$'
      - say: 'Write 4 as 12 over 3. 12 over 3 minus 8 over 3 is 4 over 3.'
        write: '$= \dfrac{12}{3} - \dfrac{8}{3} = \dfrac{4}{3}$'
        diagram_do:
          - {id: g, op: label, part: 'shade:1', text: 'Area = 4/3', colour: green}
      - section: 'Check'
        say: 'Check that no part of the area is below the axis. The curve is zero at 0 and at 2, and at $x$ equals 1, $y$ is 1, which is positive.'
        write: 'Check: at $x = 1$, $y = 1(2 - 1) = 1 > 0\ \checkmark$'
      - say: 'Therefore the area is 4 over 3, that is 1 and a third square units, which is answer choice C.'
        write: '$\therefore$ Area $= \dfrac{4}{3} = 1\tfrac{1}{3}$ sq units'
        answer: true
    traps:
      A: 'You went for 4. That is only $x^{2}$ at $x = 2$. You must also subtract $\dfrac{x^{3}}{3}$, which is $\dfrac{8}{3}$, and 4 minus $\dfrac{8}{3}$ is $\dfrac{4}{3}$.'
      B: 'You went for 2. Integrate term by term. Then $\left[x^{2} - \dfrac{x^{3}}{3}\right]$ from 0 to 2 is 4 minus $\dfrac{8}{3}$, which is $\dfrac{4}{3}$.'
      D: 'You went for $\tfrac{1}{3}$. Write 4 as $\dfrac{12}{3}$. Then $\dfrac{12}{3} - \dfrac{8}{3} = \dfrac{4}{3}$, not $\dfrac{1}{3}$.'

  37:
    moments:
      - section: 'The question'
        say: 'We have two parts multiplied together, and one of them is a root with something inside it. That calls for the product rule, with the chain rule inside it.'
        write: '$y = 3x^{2}\sqrt{x^{3} + 1}$'
      - section: 'Solution'
        say: 'Solution. First write the square root as an index, because a square root is the power a half.'
        write: '$y = 3x^{2}(x^{3} + 1)^{\frac{1}{2}}$'
      - say: 'Name the two parts. Let $u$ be $3x$ squared, and let $v$ be $x$ cubed plus 1, all to the power a half.'
        write: 'Let $u = 3x^{2}$, $\ v = (x^{3} + 1)^{\frac{1}{2}}$'
      - say: 'The product rule says if $y$ equals $u v$, $\dfrac{dy}{dx}$ equals $u$ $\dfrac{dv}{dx}$ plus $v$ $\dfrac{du}{dx}$. Picture a rectangle of sides $u$ and $v$. When $x$ grows, it gains two strips, so the rule has two terms.'
        'on': 'product rule'
        write: '$\dfrac{dy}{dx} = u\dfrac{dv}{dx} + v\dfrac{du}{dx}$'
        doodle: {name: 'custom:1999_q37_a', id: rect, caption: 'area uv, sides u and v', on: rectangle}
      - section: 'Find du/dx'
        say: 'Differentiate $u$ by multiplying by the power, so 3 times 2 is 6, and reduce the power by 1. $\dfrac{du}{dx}$ is $6x$.'
        write: '$\dfrac{du}{dx} = 3(2)x^{2-1} = 6x$'
        doodle_do:
          - {id: rect, op: label, part: u-side, text: 'du/dx = 6x'}
      - section: 'Find dv/dx'
        say: '$v$ is a function of a function, so we use the chain rule. Let $t$ be the inside, $x$ cubed plus 1. Then $v$ is $t$ to the power a half.'
        'on': 'function of a function'
        write: 'Let $t = x^{3} + 1$, $\ \therefore v = t^{\frac{1}{2}}$'
      - say: 'Differentiate each. $\dfrac{dt}{dx}$ is $3x$ squared. $\dfrac{dv}{dt}$ is a half times $t$ to the power minus a half.'
        write: '$\dfrac{dt}{dx} = 3x^{2}$, $\ \dfrac{dv}{dt} = \tfrac{1}{2}t^{-\frac{1}{2}}$'
      - say: 'The chain rule says $\dfrac{dv}{dx}$ equals $\dfrac{dv}{dt}$ times $\dfrac{dt}{dx}$.'
        write: '$\dfrac{dv}{dx} = \dfrac{dv}{dt} \times \dfrac{dt}{dx} = \tfrac{1}{2}t^{-\frac{1}{2}} \times 3x^{2}$'
      - say: 'A half times $3x$ squared is $3x$ squared over 2. A power of minus a half means 1 over the square root, so $t$ goes under a root in the denominator. Put back $t$ equals $x$ cubed plus 1.'
        write: '$\dfrac{dv}{dx} = \dfrac{3x^{2}}{2\sqrt{x^{3} + 1}}$'
        doodle_do:
          - {id: rect, op: label, part: v-side, text: 'dv/dx'}
      - section: 'Substitute'
        say: 'Now substitute into the product rule, which gives $u$ times $\dfrac{dv}{dx}$, plus $v$ times $\dfrac{du}{dx}$.'
        write: '$\dfrac{dy}{dx} = 3x^{2} \cdot \dfrac{3x^{2}}{2\sqrt{x^{3} + 1}} + \sqrt{x^{3} + 1} \cdot 6x$'
        point:
          - {line: 3, kind: box, text: 'the rule'}
          - {line: 9, kind: move, from: {line: 8, at: '= [[2x3+13x2]]'}, at: '2x3+13x2', text: 'dv/dx'}
          - {line: 9, kind: move, from: {line: 4, at: '= [[6x]]'}, at: '6x', text: 'du/dx'}
      - say: '$3x$ squared times $3x$ squared is $9x$ to the power 4.'
        write: '$= \dfrac{9x^{4}}{2\sqrt{x^{3} + 1}} + 6x\sqrt{x^{3} + 1}$'
      - section: 'Simplify'
        say: 'Put the two terms over one denominator. The L.C.M. is 2 root $x$ cubed plus 1.'
        write: 'L.C.M. $= 2\sqrt{x^{3} + 1}$'
      - say: 'The second term must be multiplied by the L.C.M. on top.'
        write: '$= \dfrac{9x^{4} + 6x\sqrt{x^{3} + 1} \times 2\sqrt{x^{3} + 1}}{2\sqrt{x^{3} + 1}}$'
      - say: 'A square root times itself gives what is inside, $x$ cubed plus 1. And $6x$ times 2 is $12x$.'
        write: '$= \dfrac{9x^{4} + 12x(x^{3} + 1)}{2\sqrt{x^{3} + 1}}$'
      - say: 'Therefore $\dfrac{dy}{dx}$ is $12x$ bracket $x$ cubed plus 1, plus $9x$ to the power 4, all over 2 root $x$ cubed plus 1. That is answer choice D.'
        write: '$\therefore \dfrac{dy}{dx} = \dfrac{12x(x^{3} + 1) + 9x^{4}}{2\sqrt{x^{3} + 1}}$'
        answer: true
    traps:
      A: 'You went for A. The second term lost the factor 2 from the L.C.M., and $6x$ times 2 is $12x$. And $u$ times $\dfrac{dv}{dx}$ gives $9x^{4}$ on top, not $3x^{2}$.'
      B: 'You went for B. The $12x(x^{3} + 1)$ is right, but the other term is $u$ times $\dfrac{dv}{dx}$, which is $3x^{2}$ times $3x^{2}$, or $9x^{4}$. The $3x^{2}$ alone is only $\dfrac{dt}{dx}$.'
      C: 'You went for C. That does not come from the product rule. Write $u$ and $v$, find $\dfrac{du}{dx}$ and $\dfrac{dv}{dx}$, then $u\dfrac{dv}{dx} + v\dfrac{du}{dx}$ over the L.C.M. $2\sqrt{x^{3} + 1}$.'

  38:
    moments:
      - section: 'The question'
        say: 'The region is bounded by the $x$-axis, $y$ equals 0, the line $y$ equals $2x$ and the line $x$ equals 3. Let me draw it, and it is a triangle.'
        write: '$y = 0$, $y = 2x$, $x = 3$; rotated about the $x$-axis'
        diagram:
          id: g
          kind: graph
          x: [-1, 4]
          y: [-1, 7]
          plots:
            - {fn: '2x', domain: [0, 3], label: 'y = 2x', colour: blue}
            - {points: [[3, 0], [3, 6]], join: straight, label: 'x = 3', colour: blue}
      - say: 'Spin the triangle once round the $x$-axis. Each thin upright slice becomes a circular disc of radius $y$, and the discs stack up into a solid.'
        write: 'Each slice: a disc of radius $y$, area $\pi y^{2}$'
        diagram_do:
          - {id: g, op: shade, part: 'plot:1', x: [0, 3], text: 'region turned', colour: orange}
        doodle: {name: 'custom:1999_q38_a', id: discs, caption: 'each slice spins into a disc'}
      - section: 'Solution'
        say: 'Solution. Adding the discs from $x$ equals $a$ to $x$ equals $b$ gives the volume of revolution, which is pi times the integral of $y$ squared, $dx$.'
        'on': 'volume of revolution'
        write: '$V = \pi\displaystyle\int_{a}^{b} y^{2}\,dx$'
        doodle_do:
          - {id: discs, op: stage, stage: 'custom:1999_q38_a2'}
      - say: 'Now the limits. $y$ equals $2x$ meets $y$ equals 0 where $2x$ is 0, at $x$ equals 0. The right edge is $x$ equals 3.'
        write: '$2x = 0 \Rightarrow x = 0$; $\ \therefore a = 0$, $b = 3$'
      - say: 'The radius is $y$ equals $2x$. Square it, and 2 squared is 4.'
        write: '$y^{2} = (2x)^{2} = 4x^{2}$'
      - say: 'Substitute into the formula.'
        write: '$V = \pi\displaystyle\int_{0}^{3} 4x^{2}\,dx$'
        point:
          - {line: 2, kind: box, text: 'the formula'}
      - say: 'The rule is to add 1 to the power, and divide by the new power.'
        'on': 'add 1'
        write: '$\displaystyle\int x^{n}\,dx = \dfrac{x^{n+1}}{n+1} + c$'
      - say: '$4x$ squared becomes $4x$ cubed over 3. Keep the limits on the square bracket.'
        write: '$= \pi\left[\dfrac{4x^{3}}{3}\right]_{0}^{3}$'
      - section: 'Upper minus lower'
        say: 'Substitute the upper limit, 3, then subtract the value at the lower limit, 0.'
        write: '$= \pi\left(\dfrac{4(3)^{3}}{3} - \dfrac{4(0)^{3}}{3}\right)$'
      - say: '3 cubed is 27, and 4 times 27 is 108. The second term is 0.'
        write: '$= \pi\left(\dfrac{108}{3} - 0\right)$'
      - say: '108 over 3 is 36.'
        write: '$= 36\pi$'
      - section: 'Check'
        say: 'Check. The solid is a cone. At $x$ equals 3, the radius is 2 times 3, which is 6, and the height is 3. One third pi r squared h gives the same.'
        write: 'Check (cone): $\tfrac{1}{3}\pi r^{2}h = \tfrac{1}{3}\pi(6)^{2}(3) = 36\pi\ \checkmark$'
        doodle_do:
          - {id: discs, op: label, part: stack, text: 'cone: r = 6, h = 3'}
      - say: 'Therefore the volume is $36\pi$ cubic units, which is answer choice B.'
        write: '$\therefore V = 36\pi$ cubic units'
        answer: true
    traps:
      A: 'You went for $81\pi$. That is $3^{4}$, as if $4x^{2}$ integrated to $x^{4}$. Add 1 to the power and divide by the NEW power to get $\dfrac{4x^{3}}{3}$, which is 36 at $x = 3$. The cone check also gives $36\pi$.'
      C: 'You went for $18\pi$. That squares the $x$ but not the 2. $(2x)^{2} = 4x^{2}$, not $2x^{2}$, so the volume is $36\pi$.'
      D: 'You went for $9\pi$. That uses $x^{2}$ for $y^{2}$, leaving out the 2. $(2x)^{2} = 4x^{2}$, so the volume is 4 times $9\pi$, which is $36\pi$.'

  39:
    moments:
      - section: 'The question'
        say: '$t$ squared times a sine is a product. And the sine has a bracket inside, which is a function of a function. So we use the product rule, with the chain rule inside it.'
        write: '$y = t^{2}\sin(3t - 5)$'
      - section: 'Solution'
        say: 'Solution. The variable is $t$. Name the parts. Let $u$ be $t$ squared, and $v$ be sine of $3t$ minus 5.'
        write: 'Let $u = t^{2}$, $\ v = \sin(3t - 5)$'
      - say: 'The product rule says $\dfrac{dy}{dt}$ equals $u$ $\dfrac{dv}{dt}$ plus $v$ $\dfrac{du}{dt}$.'
        'on': 'product rule'
        write: '$\dfrac{dy}{dt} = u\dfrac{dv}{dt} + v\dfrac{du}{dt}$'
      - say: 'Differentiate $u$ by multiplying by the power 2 and reducing the power to 1.'
        write: '$\dfrac{du}{dt} = 2t$'
      - section: 'Find dv/dt'
        say: '$v$ is a function of a function. Let $w$ be the inside, $3t$ minus 5. Then $v$ is sine $w$.'
        write: 'Let $w = 3t - 5$, $\ \therefore v = \sin w$'
      - say: '$\dfrac{dw}{dt}$ is 3, and $\dfrac{dv}{dw}$ is cos $w$. Picture two gears, so when $t$ turns once, the inside turns 3 times.'
        write: '$\dfrac{dw}{dt} = 3$, $\ \dfrac{dv}{dw} = \cos w$'
        doodle: {name: 'custom:1999_q39_a', id: gears, caption: 'the inside turns 3 times as fast', on: gears}
      - say: 'The chain rule says $\dfrac{dv}{dt}$ is $\dfrac{dv}{dw}$ times $\dfrac{dw}{dt}$. Put back $w$, and the bracket stays the same, while the 3 comes out in front.'
        write: '$\dfrac{dv}{dt} = \dfrac{dv}{dw} \times \dfrac{dw}{dt} = 3\cos(3t - 5)$'
        doodle_do:
          - {id: gears, op: label, part: small, text: '× 3 out in front'}
      - section: 'Substitute'
        say: 'Substitute into the product rule, so we get $t$ squared times $3\cos(3t - 5)$, plus sine of $3t$ minus 5 times $2t$.'
        write: '$\dfrac{dy}{dt} = t^{2} \cdot 3\cos(3t - 5) + \sin(3t - 5) \cdot 2t$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
          - {line: 7, kind: move, from: {line: 3, at: '= [[2t]]'}, at: '⋅2t', text: 'du/dt'}
      - say: 'Tidy each term, writing the sine term first as the options do.'
        write: '$= 2t\sin(3t - 5) + 3t^{2}\cos(3t - 5)$'
      - say: 'Therefore the derivative is $2t$ sine of $3t$ minus 5, plus $3t$ squared cos of $3t$ minus 5. That is answer choice C.'
        write: '$\therefore \dfrac{dy}{dt} = 2t\sin(3t - 5) + 3t^{2}\cos(3t - 5)$'
        answer: true
    traps:
      A: 'You went for $6t\cos(3t - 5)$. That multiplies the two derivatives together. The product rule ADDS two terms, $u\dfrac{dv}{dt} + v\dfrac{du}{dt}$.'
      B: 'You went for B. The minus is wrong, because sine differentiates to PLUS cos, and the product rule adds the two terms.'
      D: 'You went for D. It drops the 3 from $\dfrac{dw}{dt}$ and changes the bracket to $3t$. The inside, $3t - 5$, stays the same, and its derivative, 3, comes out in front.'

  40:
    moments:
      - section: 'The question'
        say: 'Find the value of $x$ where $y$ has a minimum. A cubic has two turning points, so we must pick the minimum one.'
        write: '$y = x^{3} - x$'
        diagram:
          id: g
          kind: graph
          x: [-1.5, 1.5]
          y: [-1.5, 1.5]
          step: 0.5
          plots:
            - {fn: 'x^3 - x', label: 'y = x³ − x', colour: blue}
      - section: 'Solution'
        say: 'Solution. Differentiate term by term, multiplying by the power, then reducing the power by 1. $x$ cubed gives $3x$ squared, and minus $x$ gives minus 1.'
        write: '$\dfrac{dy}{dx} = 3x^{2} - 1$'
      - section: 'Turning points'
        say: 'At the turning point, the gradient is zero. So we write that at turning point, $\dfrac{dy}{dx}$ equals 0.'
        'on': 'turning point'
        write: 'At turning point, $\dfrac{dy}{dx} = 0$'
      - say: 'So $3x$ squared minus 1 equals 0.'
        write: '$3x^{2} - 1 = 0$'
        point:
          - {line: 3, kind: move, from: {line: 1, at: '= [[3x2 − 1]]'}, at: '3x2 − 1', text: 'dy/dx'}
      - say: 'Add 1 to both sides, then divide by 3. $x$ squared is 1 over 3.'
        write: '$3x^{2} = 1 \Rightarrow x^{2} = \dfrac{1}{3}$'
      - say: 'Take the square root, plus and minus. The square root of 1 over 3 is 1 over root 3.'
        write: '$x = \pm\dfrac{1}{\sqrt{3}}$'
      - say: 'Rationalise the denominator by multiplying the top and the bottom by root 3. Root 3 times root 3 is 3.'
        write: '$\dfrac{1}{\sqrt{3}} \times \dfrac{\sqrt{3}}{\sqrt{3}} = \dfrac{\sqrt{3}}{3}$'
      - say: 'So the turning points are at $x$ equals root 3 over 3, and minus root 3 over 3.'
        write: '$\therefore x = \dfrac{\sqrt{3}}{3}$ or $x = -\dfrac{\sqrt{3}}{3}$'
      - section: 'Second derivative'
        say: 'Which is the minimum? Differentiate again. $3x$ squared gives $6x$, and minus 1 gives 0.'
        write: '$\dfrac{d^{2}y}{dx^{2}} = 6x$'
      - say: 'At $x$ equals root 3 over 3, $6x$ is 2 root 3, which is positive. Positive means a minimum, the bottom of the valley.'
        'on': 'Positive means'
        write: 'At $x = \dfrac{\sqrt{3}}{3}$: $\ 6x = 2\sqrt{3} > 0$, minimum'
        diagram_do:
          - {id: g, op: point, part: 'plot:1', x: 0.5774, text: 'minimum', colour: green, on: valley}
      - say: 'At $x$ equals minus root 3 over 3, $6x$ is minus 2 root 3, which is negative. Negative means a maximum.'
        write: 'At $x = -\dfrac{\sqrt{3}}{3}$: $\ 6x = -2\sqrt{3} < 0$, maximum'
        diagram_do:
          - {id: g, op: point, part: 'plot:1', x: -0.5774, text: 'maximum'}
      - section: 'Check'
        say: 'To check, $y$ equals $x$, times $x$ minus 1, times $x$ plus 1, so the curve crosses the axis at minus 1, 0 and 1. The valley lies between 0 and 1, and root 3 over 3 is about 0.58.'
        write: 'Check: $\dfrac{\sqrt{3}}{3} \approx 0.58$, between 0 and 1 $\checkmark$'
        diagram_do:
          - {id: g, op: intercepts, part: 'plot:1', axis: x}
      - say: 'Therefore $y$ has its minimum at $x$ equals root 3 over 3, which is answer choice C.'
        write: '$\therefore$ minimum at $x = \dfrac{\sqrt{3}}{3}$'
        answer: true
    traps:
      A: 'You went for minus root 3. Solving $3x^{2} = 1$ gives $x^{2}$ equal to one third, not 3. And the negative turning point is the maximum, not the minimum.'
      B: 'You went for minus root 3 over 2. That is not a turning point, because $3x^{2} = 1$ gives $x = \pm\dfrac{\sqrt{3}}{3}$. And at a negative $x$, $6x$ is negative, which is a maximum.'
      D: 'You went for root 3. That comes from solving $3x^{2} = 1$ as $x^{2} = 3$. Dividing by 3 gives $x^{2}$ equal to one third, so $x$ is root 3 over 3.'

  41:
    moments:
      - section: 'The question'
        say: 'Three boys play a game of luck. Their probabilities of winning are 1 over 2, 1 over 3 and 1 over 4. What is the probability that one and only one of them wins? There are three ways that can happen.'
        write: '$P(A) = \tfrac{1}{2},\ \ P(B) = \tfrac{1}{3},\ \ P(C) = \tfrac{1}{4}$'
      - say: 'Solution. Call the boys $A$, $B$ and $C$. $A$ prime, A complement, means $A$ does not win, so P of $A$ prime is 1 minus 1 over 2, which is 1 over 2.'
        write: 'Solution: $P(A^{\prime}) = 1 - \tfrac{1}{2} = \tfrac{1}{2}$'
      - say: 'P of $B$ prime is 1 minus 1 over 3, which is 2 over 3.'
        write: '$P(B^{\prime}) = 1 - \tfrac{1}{3} = \tfrac{2}{3}$'
      - say: 'P of $C$ prime is 1 minus 1 over 4, which is 3 over 4.'
        write: '$P(C^{\prime}) = 1 - \tfrac{1}{4} = \tfrac{3}{4}$'
      - section: 'The tree diagram'
        say: 'The boys play independently. Draw the tree diagram, where each boy wins or loses, one level for each boy, with the probability on every branch.'
        write: '$A$, $B$, $C$ independent: multiply along a path'
        diagram:
          id: t
          kind: tree
          size: scene
          'on': 'tree diagram'
          levels: ['Boy A', 'Boy B', 'Boy C']
          branches:
            - label: Wins
              p: '1/2'
              then:
                - {label: Wins, p: '1/3', then: [{label: Wins, p: '1/4'}, {label: Loses, p: '3/4'}]}
                - {label: Loses, p: '2/3', then: [{label: Wins, p: '1/4'}, {label: Loses, p: '3/4'}]}
            - label: Loses
              p: '1/2'
              then:
                - {label: Wins, p: '1/3', then: [{label: Wins, p: '1/4'}, {label: Loses, p: '3/4'}]}
                - {label: Loses, p: '2/3', then: [{label: Wins, p: '1/4'}, {label: Loses, p: '3/4'}]}
      - say: 'Only one wins means $A$ only, or $B$ only, or $C$ only. These three paths cannot happen together, so we add across them.'
        write: '$P(\text{one only}) = P(AB^{\prime}C^{\prime}) + P(A^{\prime}BC^{\prime}) + P(A^{\prime}B^{\prime}C)$'
      - section: 'Multiply along each path'
        say: 'For $A$ only, $A$ wins, 1 over 2, $B$ loses, 2 over 3, and $C$ loses, 3 over 4. 1 times 2 times 3 is 6, and 2 times 3 times 4 is 24.'
        write: '$P(AB^{\prime}C^{\prime}) = \tfrac{1}{2} \times \tfrac{2}{3} \times \tfrac{3}{4} = \tfrac{6}{24}$'
        diagram_do:
          - {id: t, op: path, part: 'Wins/Loses/Loses', text: 'A only: 6/24'}
      - say: 'For $B$ only, we have 1 over 2, times 1 over 3, times 3 over 4. On top, 1 times 1 times 3 is 3. So it is 3 over 24.'
        write: '$P(A^{\prime}BC^{\prime}) = \tfrac{1}{2} \times \tfrac{1}{3} \times \tfrac{3}{4} = \tfrac{3}{24}$'
        diagram_do:
          - {id: t, op: path, part: 'Loses/Wins/Loses', text: 'B only: 3/24'}
      - say: 'For $C$ only, we have 1 over 2, times 2 over 3, times 1 over 4. On top, 1 times 2 times 1 is 2. So it is 2 over 24.'
        write: '$P(A^{\prime}B^{\prime}C) = \tfrac{1}{2} \times \tfrac{2}{3} \times \tfrac{1}{4} = \tfrac{2}{24}$'
        diagram_do:
          - {id: t, op: path, part: 'Loses/Loses/Wins', text: 'C only: 2/24'}
      - section: 'Add across the paths'
        say: 'Now add the three paths. 6 plus 3 plus 2 is 11, so we get 11 over 24.'
        write: '$P(\text{one only}) = \tfrac{6}{24} + \tfrac{3}{24} + \tfrac{2}{24} = \tfrac{11}{24}$'
        point:
          - {line: 9, kind: move, from: {line: 6, at: '= [[246]]'}, at: '= [[246]] +', text: 'A only'}
          - {line: 9, kind: move, from: {line: 7, at: '= [[243]]'}, at: '+ [[243]] +', text: 'B only'}
          - {line: 9, kind: move, from: {line: 8, at: '= [[242]]'}, at: '+ [[242]] =', text: 'C only'}
      - section: 'Check'
        say: 'To check, all the paths together make 1. Worked the same way, none wins is 6 over 24, exactly two win is 6 over 24, and all three win is 1 over 24.'
        write: 'Check: none $\tfrac{6}{24}$, two $\tfrac{6}{24}$, all three $\tfrac{1}{24}$'
      - say: '6 plus 11 plus 6 plus 1 is 24, and 24 over 24 is 1.'
        write: '$\tfrac{6 + 11 + 6 + 1}{24} = \tfrac{24}{24} = 1\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the probability that one and only one boy wins is 11 over 24, which is option C.'
        write: '$\therefore P(\text{one only}) = \dfrac{11}{24}$'
        answer: true
    traps:
      A: 'You went for 1 over 24. That is the path where all three win, which is 1 over 2 times 1 over 3 times 1 over 4. One and only one means three paths, which add to 11 over 24.'
      B: 'You went for 1 over 12. That is only one path, C winning alone, 2 over 24. Add all three paths, and 6 over 24, 3 over 24 and 2 over 24 make 11 over 24.'
      D: 'You went for 23 over 24. That is 1 minus the all-three-win path. We want exactly one winner, which gives 6 plus 3 plus 2, over 24, or 11 over 24.'

  42:
    moments:
      - section: 'The question'
        say: 'A number is picked at random from 0 to 20, like drawing one slip from a hat. What is the probability that it is an odd prime? Mind the 0, and mind the 2.'
        write: '$0$ to $20$: $P(\text{odd prime}) = ?$'
        doodle: {name: 'custom:1999_q42_a', id: hat, caption: 'Pick any number from 0 to 20'}
      - say: 'Solution. Let $E$ be the event that the number is an odd prime.'
        write: 'Solution: let $E$ = an odd prime'
      - section: 'The sample space'
        say: 'From 0 to 20 includes both ends. n of $S$ is 20 minus 0, plus 1, which is 21. So there are 21 slips in the hat.'
        write: '$n(S) = 20 - 0 + 1 = 21$'
      - section: 'The favourable outcomes'
        say: 'A prime has exactly two factors, 1 and itself. So 0 and 1 are not prime. The primes up to 20 are 2, 3, 5, 7, 11, 13, 17 and 19.'
        write: 'Primes: $2, 3, 5, 7, 11, 13, 17, 19$'
      - say: 'But 2 is even, so it is not an odd prime. Take it out.'
        write: '$E = \{3, 5, 7, 11, 13, 17, 19\}$'
        point:
          - {line: 3, kind: strike, at: '2,', text: 'even'}
      - say: 'Count what is left, and n of $E$ is 7.'
        write: '$n(E) = 7$'
      - section: 'The probability'
        say: 'The probability of $E$ is n of $E$ over n of $S$, meaning the number of favourable outcomes over the total number of possible outcomes.'
        write: '$P(E) = \dfrac{n(E)}{n(S)}$'
      - say: 'Substitute, giving 7 over 21.'
        write: '$= \dfrac{7}{21}$'
        point:
          - {line: 7, kind: move, from: {line: 5, at: '= 7'}, at: '21[[7]]', text: 'n(E)'}
          - {line: 7, kind: move, from: {line: 2, at: '= 21'}, at: '[[21]]7', text: 'n(S)'}
      - say: 'Divide the top and the bottom by 7. 7 divided by 7 is 1, and 21 divided by 7 is 3.'
        write: '$= \dfrac{7 \div 7}{21 \div 7} = \dfrac{1}{3}$'
      - section: 'Check'
        say: 'Check the count. There are 8 primes, and taking away the even prime 2 leaves 7. And 7 plus the 14 other numbers is 21.'
        write: 'Check: $8 - 1 = 7$, $\ 7 + 14 = 21\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the probability of an odd prime is 1 over 3, which is option B.'
        write: '$\therefore P(\text{odd prime}) = \dfrac{1}{3}$'
        doodle_do:
          - {id: hat, op: pulse, part: slips}
        answer: true
    traps:
      A: 'You went for 8 over 21. That counts all eight primes, including 2. But 2 is even, so n of E is 7, and 7 over 21 is 1 over 3.'
      C: 'You went for 2 over 7, which is 6 over 21. There are seven odd primes, not six. They are 3, 5, 7, 11, 13, 17 and 19.'
      D: 'You went for 5 over 21. That leaves out some odd primes. List them all up to 20, and you get 3, 5, 7, 11, 13, 17 and 19. n of E is 7, giving 7 over 21.'

  43:
    moments:
      - section: 'The question'
        say: '6 C $r$ over 6 P $r$ is 1 over 6. Find $r$. Write both formulas, and most of it cancels.'
        write: '$\dfrac{{}^{6}C_{r}}{{}^{6}P_{r}} = \dfrac{1}{6}$'
      - say: 'Solution. First the formulas. n P r, the arrangements of r things from n, is n factorial over n minus r factorial.'
        write: 'Solution: ${}^{n}P_{r} = \dfrac{n!}{(n - r)!}$'
      - say: 'n C r, the selections, is n factorial over n minus r factorial, times r factorial.'
        write: '${}^{n}C_{r} = \dfrac{n!}{(n - r)!\,r!}$'
      - section: 'Substitute'
        say: 'Put n equal to 6 in both, and divide the first by the second.'
        write: '$\dfrac{{}^{6}C_{r}}{{}^{6}P_{r}} = \dfrac{6!}{(6 - r)!\,r!} \div \dfrac{6!}{(6 - r)!}$'
      - say: 'To divide by a fraction, turn it upside down and multiply.'
        write: '$= \dfrac{6!}{(6 - r)!\,r!} \times \dfrac{(6 - r)!}{6!}$'
      - say: 'The 6 factorials cancel, and the 6 minus r factorials cancel. Only 1 over r factorial is left.'
        write: '$= \dfrac{1}{r!}$'
      - section: 'Solve for r'
        say: 'So 1 over r factorial equals 1 over 6. The tops are equal, so the bottoms are equal, and r factorial is 6.'
        write: '$\dfrac{1}{r!} = \dfrac{1}{6} \Rightarrow r! = 6$'
      - say: 'Which factorial is 6? 3 factorial is 3 times 2 times 1, which is 6. Here are three people in all 6 possible orders.'
        write: '$3! = 3 \times 2 \times 1 = 6$'
        doodle: {name: 'custom:1999_q43_a', id: orders, caption: 'three people, six line-ups'}
      - say: 'Therefore $r$ is 3.'
        write: '$\therefore r = 3$'
        doodle_do:
          - {id: orders, op: circle, part: note, text: 'r = 3'}
      - section: 'Check'
        say: 'Check with $r$ equal to 3. 6 C 3 is 6 factorial over 3 factorial times 3 factorial. 6 times 5 times 4 is 120, over 6, which is 20.'
        write: 'Check: ${}^{6}C_{3} = \dfrac{6 \times 5 \times 4 \times 3!}{3!\,3!} = \dfrac{120}{6} = 20$'
      - say: '6 P 3 is 6 factorial over 3 factorial, so 6 times 5 times 4, which is 120. And 20 over 120 is 1 over 6.'
        write: '${}^{6}P_{3} = \dfrac{6 \times 5 \times 4 \times 3!}{3!} = 120$, $\ \dfrac{20}{120} = \dfrac{1}{6}\ \checkmark$'
        doodle_do:
          - {id: orders, op: pulse, part: orders}
      - section: 'Answer'
        say: 'Therefore $r$ is 3, which is option B.'
        write: '$r = 3$'
        answer: true
    traps:
      A: 'You went for 1. With r equal to 1 the ratio is 1 over 1 factorial, which is 1, not 1 over 6. We need r factorial to be 6, so r is 3.'
      C: 'You went for 5. 5 factorial is 120, so the ratio would be 1 over 120. We need r factorial to be 6, which is 3 factorial.'
      D: 'You went for 6. That is the value of r factorial, not r. r factorial is 6, and 3 factorial is 6, so r is 3.'

  44:
    moments:
      - section: 'The question'
        say: 'The numbers 3, 6, $x$, 7 and 5 have a standard deviation, S.D., of root 2. We want the least possible value of $x$.'
        write: '$3,\ 6,\ x,\ 7,\ 5$; S.D. $= \sqrt{2}$'
        doodle: {name: 'custom:1999_q44_a', id: line, caption: '3, 6, x, 7, 5 on a line'}
      - section: 'Solution'
        say: 'Solution. The variance is the S.D. squared, and root 2 squared is 2.'
        write: 'Variance $= (\sqrt{2})^{2} = 2$'
      - say: 'The mean has $x$ in it, so we use the other form of the variance, which is sigma $x$ squared over $n$, minus $x$ bar squared, where $x$ bar is sigma $x$ over $n$.'
        write: 'Variance $= \dfrac{\sum x^{2}}{n} - \left(\dfrac{\sum x}{n}\right)^{2}$'
      - section: 'The table'
        say: 'So we need two columns, each number and its square. The unknown $x$ sits in the third row.'
        write: '$n = 5$'
        diagram:
          id: t
          kind: table
          columns: ['x', 'x²']
          rows: [[3, ''], [6, ''], ['x', ''], [7, ''], [5, '']]
          'on': 'columns'
      - say: '3 squared is 9, 6 squared is 36, and $x$ squared stays $x$ squared.'
        write: '$3^{2} = 9,\ 6^{2} = 36,\ x^{2}$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,2', text: '9'}
          - {id: t, op: fill, part: 'cell:2,2', text: '36'}
          - {id: t, op: fill, part: 'cell:3,2', text: 'x²'}
      - say: '7 squared is 49, and 5 squared is 25.'
        write: '$7^{2} = 49,\ 5^{2} = 25$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:4,2', text: '49'}
          - {id: t, op: fill, part: 'cell:5,2', text: '25'}
      - say: 'Add the first column, and 3 plus 6 plus 7 plus 5 is 21, plus $x$.'
        write: '$\sum x = 21 + x$'
      - say: 'Add the second column, and 9 plus 36 plus 49 plus 25 is 119, plus $x$ squared.'
        write: '$\sum x^{2} = 119 + x^{2}$'
      - section: 'The equation'
        say: 'Substitute, with $n$ equal to 5, and set the variance equal to 2.'
        write: '$\dfrac{119 + x^{2}}{5} - \left(\dfrac{21 + x}{5}\right)^{2} = 2$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '= [[119 + x2]]'}, at: '5[[119 + x2]]', text: 'Σx²'}
          - {line: 8, kind: move, from: {line: 6, at: '= [[21 + x]]'}, at: '5[[21 + x]]', text: 'Σx'}
      - say: 'Multiply every term by 25 to clear the fractions. The first term becomes 5 times its top, the bracket loses its 25, and 2 times 25 is 50.'
        write: '$5(119 + x^{2}) - (21 + x)^{2} = 50$'
      - say: 'Expand. 5 times 119 is 595. And $21 + x$ all squared is 441, plus $42x$, plus $x$ squared.'
        write: '$595 + 5x^{2} - (441 + 42x + x^{2}) = 50$'
      - say: 'Remove the bracket, and the minus in front changes every sign inside. Then collect like terms. $5x$ squared minus $x$ squared is $4x$ squared, and 595 minus 441 is 154. So we get $4x$ squared, minus $42x$, plus 154.'
        write: '$4x^{2} - 42x + 154 = 50$'
      - say: 'Subtract 50 from both sides, so 154 minus 50 is 104. Then divide every term by 2.'
        write: '$4x^{2} - 42x + 104 = 0 \Rightarrow 2x^{2} - 21x + 52 = 0$'
      - section: 'Factorise'
        say: 'Factorise. The product, 2 times 52, is 104, and the sum is minus 21. The two numbers are minus 8 and minus 13.'
        write: 'Product $= 104$, Sum $= -21$: $\ -8,\ -13$'
      - say: 'Split the middle term, so minus $21x$ becomes minus $8x$ minus $13x$. Then group in pairs, taking out $2x$ from the first pair and minus 13 from the second. That gives $2x$ bracket $x$ minus 4, minus 13 bracket $x$ minus 4.'
        write: '$2x(x - 4) - 13(x - 4) = 0$'
      - say: 'Take out the common bracket.'
        write: '$(x - 4)(2x - 13) = 0$'
      - say: 'Either $x$ minus 4 is 0, or $2x$ minus 13 is 0. So $x$ is 4 or 6.5, which are two places on the line.'
        write: 'Either $x = 4$ or $x = \dfrac{13}{2} = 6.5$'
        doodle_do:
          - {id: line, op: stage, stage: 'custom:1999_q44_a2'}
      - say: 'The least value is 4.'
        write: '$\therefore$ least $x = 4$'
        doodle_do:
          - {id: line, op: circle, part: four, text: least}
      - section: 'Check'
        say: 'Check $x$ equals 4. The numbers are 3, 6, 4, 7 and 5, the mean is 5, and the squared deviations are 4, 1, 1, 4 and 0. 10 over 5 is 2.'
        write: 'Check: $\bar{x} = 5$, $\ \dfrac{4 + 1 + 1 + 4 + 0}{5} = 2$ ✓'
      - section: 'Answer'
        say: 'So the least possible value of $x$ is 4, which is option C.'
        write: '$\therefore x = 4$'
        answer: true
    traps:
      A: 'You went for 2. With $x = 2$ the variance works out to about 3.44, not 2. The equation $2x^{2} - 21x + 52 = 0$ gives 4 or 6.5, and the least is 4.'
      B: 'You went for 3. With $x = 3$ the variance is 2.56, not 2. Factorising gives $x = 4$ or 6.5, and the least is 4.'
      D: 'You went for 6. With $x = 6$ the variance is 1.84, not 2. The two values that work are 4 and 6.5, and the least is 4.'

  45:
    moments:
      - section: 'The question'
        say: 'We count two-digit numbers made from the digits 0, 1, 2 and 3. Digits can be repeated, but no number may begin with 0. Think of four digit cards and two places to fill.'
        write: 'Digits: $0,\ 1,\ 2,\ 3$; repetition allowed; no leading $0$'
        doodle: {name: 'custom:1999_q45_a', id: cards, caption: 'The first digit cannot be 0'}
      - say: 'Because digits can repeat and 0 cannot come first, the $n$ P $r$ formula does not fit. We use the boxes, one box for each place, filled one at a time.'
        write: 'Solution: two boxes, tens and units'
      - section: 'Fill the boxes'
        say: 'The tens digit cannot be 0, or the number would be a one-digit number. It can be 1, 2 or 3, so there are 3 choices.'
        write: 'Tens digit: $1, 2$ or $3$ (not $0$): $3$ choices'
        point:
          - {line: 2, kind: highlight, at: '3 choices', to: {doodle: cards, part: place1}}
        doodle_do:
          - {id: cards, op: cross, part: card0, text: 'not first'}
          - {id: cards, op: label, part: place1, text: '3 choices'}
      - say: 'The units digit has no restriction, and repetition is allowed. So any of the four digits works, giving 4 choices.'
        write: 'Units digit: $0, 1, 2$ or $3$: $4$ choices'
        point:
          - {line: 3, kind: highlight, at: '4 choices', to: {doodle: cards, part: place2}}
        doodle_do:
          - {id: cards, op: label, part: place2, text: '4 choices'}
      - say: 'Each choice for the tens digit goes with every choice for the units digit, so multiply the numbers of choices.'
        write: 'Number of two-digit numbers $= 3 \times 4$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: '[[3]] choices'}, at: '[[3]] ×', text: 'tens'}
          - {line: 4, kind: move, from: {line: 3, at: '[[4]] choices'}, at: '× [[4]]', text: 'units'}
      - say: '3 times 4 is 12.'
        write: '$= 12$'
        doodle_do:
          - {id: cards, op: pulse, part: place1}
          - {id: cards, op: pulse, part: place2}
      - section: 'Check'
        say: 'Check by listing them. Starting with 1, there are four, which are 10, 11, 12 and 13.'
        write: 'Check: $10,\ 11,\ 12,\ 13$'
      - say: 'Starting with 2, there are another four, 20, 21, 22 and 23.'
        write: 'Then $20,\ 21,\ 22,\ 23$'
      - say: 'And starting with 3, there are four more, 30, 31, 32 and 33. 4 plus 4 plus 4 is 12.'
        write: 'Then $30,\ 31,\ 32,\ 33$: $\ 4 + 4 + 4 = 12\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore 12 two-digit numbers can be formed, and that is option B.'
        write: '$\therefore 12$ numbers'
        answer: true
    traps:
      A: 'You went for 4. That counts only the choices for one box. There are 3 choices for the tens digit and 4 for the units digit, and 3 times 4 is 12.'
      C: 'You went for 16. That is 4 times 4, which lets 0 come first. A number cannot begin with 0, so the tens digit has only 3 choices, which gives 12.'
      D: 'You went for 20. There are only 3 choices for the tens digit and 4 for the units digit, which gives 12. The list from 10 to 33 confirms it.'

  46:
    moments:
      - section: 'The question'
        say: 'The pie chart shows the grades of 36 students in a class test. We want the number who had Excellent.'
        write: 'Total $= 36$ students. Excellent $= ?$'
      - section: 'Solution'
        say: 'Solution. From the chart, Pass is 120 degrees, Credit is 80 degrees, and Very Good has the right-angle mark, so it is 90 degrees.'
        write: 'Pass $= 120^{\circ}$, Credit $= 80^{\circ}$, Very Good $= 90^{\circ}$'
        diagram: {id: t, kind: table, columns: [Grade, 'Sectoral angle', Students], rows: [[Pass, '120°', ''], [Credit, '80°', ''], [Very Good, '90°', ''], [Excellent, '', '']]}
        point:
          - {figure: 0, kind: circle, target: '120°'}
          - {figure: 0, kind: circle, target: '80°'}
          - {figure: 0, kind: circle, target: '90°'}
      - say: 'The angles at the centre make 360 degrees, so Excellent is 360 minus the other three.'
        write: 'Excellent $= 360^{\circ} - (120^{\circ} + 80^{\circ} + 90^{\circ})$'
      - say: '120 plus 80 plus 90 is 290, and 360 minus 290 is 70 degrees.'
        write: '$= 360^{\circ} - 290^{\circ} = 70^{\circ}$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:4,2', text: '70°', 'on': '70 degrees'}
        point:
          - {figure: 0, kind: label, target: 'Excellent', text: '70°'}
      - section: 'The number of students'
        say: 'Now the formula. The number in a sector is its sectoral angle over 360, times the total number of students.'
        write: 'Number $= \dfrac{\text{sectoral angle}}{360^{\circ}} \times \text{total}$'
      - say: 'Now substitute. Excellent is 70 degrees, and the total is 36 students.'
        write: 'Excellent $= \dfrac{70}{360} \times 36$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '= [[70]]∘'}, at: '70', text: 'Excellent angle'}
          - {line: 5, kind: move, from: {line: 0, at: '= 36'}, at: '× 36', text: 'total'}
      - say: '36 over 360 is 1 over 10, so this is 70 over 10.'
        write: '$= \dfrac{70}{10}$'
      - say: '70 over 10 is 7 students.'
        write: '$= 7$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:4,3', text: '7', 'on': '7 students'}
      - section: 'Check'
        say: 'Check that everyone is counted. In the same way, Pass is 120 over 10, which is 12. Credit is 8, and Very Good is 9.'
        write: 'Pass $= 12$, Credit $= 8$, Very Good $= 9$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,3', text: '12', 'on': '12'}
          - {id: t, op: fill, part: 'cell:2,3', text: '8', 'on': '8'}
          - {id: t, op: fill, part: 'cell:3,3', text: '9', 'on': '9'}
      - say: '12 plus 8 plus 9 plus 7 is 36, so every student is counted.'
        write: '$12 + 8 + 9 + 7 = 36\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore 7 students had Excellent, which is answer choice A.'
        write: '$\therefore$ Excellent $= 7$ students'
        answer: true
    traps:
      B: 'You went for 8. That is the Credit sector, 80 degrees. Excellent is the sector left over, 70 degrees, and 70 over 360 of 36 is 7.'
      C: 'You went for 9. That is the Very Good sector, the right angle. Excellent is 360 minus 290, which is 70 degrees, so 7 students.'
      D: 'You went for 12. That is the Pass sector, 120 degrees. Excellent is 70 degrees, and 70 over 360 of 36 is 7.'

  47:
    moments:
      - section: 'The question'
        say: 'We have marks in a test, and the number of students who scored each mark. We want the median. Every statistics answer starts with a table, so here it is, with a column for cf.'
        write: 'Median $= ?$'
        diagram:
          id: t
          kind: table
          columns: ['x (mark)', 'f', 'cf']
          rows: [[0, 2, ''], [1, 2, ''], [2, 11, ''], [3, 10, ''], [4, 16, ''], [5, 51, ''], [6, 40, ''], [7, 10, ''], [8, 25, ''], [9, 15, ''], [10, 20, '']]
          'on': 'table'
      - section: 'Solution'
        say: 'Solution. $x$ is the mark and $f$, the frequency, is the number of students. The median is the middle value with everyone in order, so we need cf, the cumulative frequency.'
        write: 'Solution'
        doodle: {name: 'custom:1999_q47_a', id: queue, caption: 'everyone in a line, by mark', size: scene}
      - section: 'The cf column'
        say: 'The cf column is a running total of $f$ down the table. It goes 2, then 4, 15, 25, 41, 92, 132, 142, 167, 182 and 202.'
        diagram_do:
          - {id: t, op: total, part: 'col:2', into: 'col:3', 'on': 'running'}
      - say: 'The last cf is $N$, the total number of students, which is 202.'
        write: '$N = \sum f = 202$'
      - section: 'The median'
        say: '$N$ is even, so the median is the average of the $N$ over 2th value, the 101st, and the one after it, the 102nd.'
        write: '$\dfrac{N}{2} = \dfrac{202}{2} = 101$: the 101st and 102nd values'
      - say: 'Go down the cf column to the first cf that reaches 102. Up to mark 4, cf is 41. Up to mark 5, cf is 92, which is still short.'
        write: 'cf at $x = 5$: $92 < 101$'
        diagram_do:
          - {id: t, op: highlight, part: 'row:6', text: '42nd to 92nd', 'on': 'short'}
        doodle_do:
          - {id: queue, op: highlight, part: m5, text: '92 so far'}
      - say: 'Up to mark 6, cf is 132, which passes 102. So the 93rd to the 132nd students all scored 6.'
        write: 'cf at $x = 6$: $132 \ge 102$; 93rd to 132nd values $= 6$'
        diagram_do:
          - {id: t, op: highlight, part: 'row:7', text: '93rd to 132nd', 'on': '132', on_nth: 1}
