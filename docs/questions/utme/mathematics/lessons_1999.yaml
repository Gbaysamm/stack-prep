          - { figure: sketch, kind: highlight, target: MO, text: '6' }
      - say: 'Divide the top and the bottom by 3: 9 over 6 simplifies to 3 over 2.'
        write: '$= \dfrac{3}{2}$'
      - say: 'So $NP$ is 3 parts and $PO$ is 2 parts. 3 plus 2 is 5 parts altogether, and together they make the whole of $NO$.'
        write: '$NP : PO = 3 : 2$, total $3 + 2 = 5$ parts'
