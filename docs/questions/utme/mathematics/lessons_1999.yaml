  15:
    moments:
      - say: 'We want a matrix $T$ such that $S$ times $T$ is the identity matrix.'
        write: '$ST = I$'
      - say: 'If $S$ times $T$ gives the identity, then $T$ undoes $S$. So $T$ is the inverse of $S$.'
        write: 'So $T = S^{-1}$'
      - say: 'For a 2 by 2 matrix, the inverse is 1 over the determinant, times the matrix with $a$ and $d$ swapped and $b$ and $c$ made negative.'
        write: 'Inverse: $\begin{pmatrix} a & b \\ c & d \end{pmatrix}^{-1} = \dfrac{1}{ad - bc}\begin{pmatrix} d & -b \\ -c & a \end{pmatrix}$'
      - say: 'In our matrix $S$, $a$ is negative 1, $b$ is 1, $c$ is 1, and $d$ is negative 2.'
        write: '$S = \begin{pmatrix} -1 & 1 \\ 1 & -2 \end{pmatrix}:\ a = -1,\ b = 1,\ c = 1,\ d = -2$'
      - say: 'First the determinant: $ad$ minus $bc$. Put in the four values.'
        write: 'Determinant: $ad - bc = (-1)(-2) - (1)(1)$'
      - say: 'Negative 1 times negative 2 is 2. 1 times 1 is 1. And 2 minus 1 is 1.'
        write: '$= 2 - 1 = 1$'
      - say: 'Now swap $a$ and $d$: negative 2 goes top left, negative 1 goes bottom right. Then change the signs of $b$ and $c$: each 1 becomes negative 1.'
        write: '$\begin{pmatrix} d & -b \\ -c & a \end{pmatrix} = \begin{pmatrix} -2 & -1 \\ -1 & -1 \end{pmatrix}$'
        point:
          - { line: 2, kind: box, text: 'the recipe' }
      - say: 'Now divide by the determinant we found, which is 1. Dividing by 1 changes nothing.'
        write: '$T = \dfrac{1}{1}\begin{pmatrix} -2 & -1 \\ -1 & -1 \end{pmatrix} = \begin{pmatrix} -2 & -1 \\ -1 & -1 \end{pmatrix}$'
        point:
          - { line: 7, kind: move, from: { line: 5, at: '= [[1]]' }, at: 'T = [[1]]', text: 'determinant' }
      - say: 'Let''s check by multiplying $S$ by $T$. Top left: the top row of $S$ times the first column of $T$. Negative 1 times negative 2, plus 1 times negative 1, is 2 minus 1, which is 1.'
        write: 'Top left of $ST$: $(-1)(-2) + (1)(-1) = 2 - 1 = 1$'
      - say: 'Top right: negative 1 times negative 1, plus 1 times negative 1. That is 1 minus 1, which is zero.'
        write: 'Top right: $(-1)(-1) + (1)(-1) = 1 - 1 = 0$'
      - say: 'Bottom left: 1 times negative 2, plus negative 2 times negative 1. That is negative 2 plus 2, which is zero.'
        write: 'Bottom left: $(1)(-2) + (-2)(-1) = -2 + 2 = 0$'
      - say: 'Bottom right: 1 times negative 1, plus negative 2 times negative 1. That is negative 1 plus 2, which is 1. So $S$ times $T$ is the identity.'
        write: 'Bottom right: $(1)(-1) + (-2)(-1) = -1 + 2 = 1$'
      - say: 'So $T$ is the matrix negative 2, negative 1, negative 1, negative 1, which is answer choice B.'
        write: '$T = \begin{pmatrix} -2 & -1 \\ -1 & -1 \end{pmatrix}$'
        answer: true
