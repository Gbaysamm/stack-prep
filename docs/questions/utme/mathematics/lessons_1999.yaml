          - { line: 4, kind: move, from: { line: 3, at: '= [[3(x + y)]]' }, at: '+ [[3(x + y)]]' }
      - say: 'Let''s call that bracket $u$. Then we have an ordinary quadratic in $u$.'
        write: 'Let $u = x + y$: $\ u^{2} + 3u - 18$'
      - say: 'We need two numbers that multiply to negative 18 and add to 3. 6 times negative 3 is negative 18, and 6 plus negative 3 is 3.'
        write: '$6 \times (-3) = -18,\quad 6 + (-3) = 3$'
      - say: 'So the quadratic factorises as $u$ plus 6, times $u$ minus 3.'
        write: '$u^{2} + 3u - 18 = (u + 6)(u - 3)$'
      - say: 'Quick check: $u$ times $u$ is $u$ squared, $6u$ minus $3u$ is $3u$, and 6 times negative 3 is negative 18. That matches.'
        write: 'Check: $(u + 6)(u - 3) = u^{2} - 3u + 6u - 18 = u^{2} + 3u - 18$'
      - say: 'Now put $x + y$ back in place of $u$ in each bracket.'
        write: '$= \big((x + y) + 6\big)\big((x + y) - 3\big)$'
