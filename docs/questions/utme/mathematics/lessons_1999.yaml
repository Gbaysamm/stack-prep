# UTME 1999 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_1999.yaml. Answers match that file.
format_version: 1
exam_year: 1999
lessons:
  1:
    moments:
      - say: 'We are told that this fraction of powers equals $a^{p}b^{q}c^{r}$, and we want the value of $p + 2q$.'
        write: '$\dfrac{a^{2}b^{3}c}{a^{-1}b^{4}c^{5}} = a^{p}b^{q}c^{r}$'
      - say: 'Here is the rule we need. When we divide powers of the same letter, we subtract the indices: the index on top minus the index underneath.'
        write: 'Rule: $\dfrac{x^{m}}{x^{n}} = x^{m - n}$'
      - say: 'We take one letter at a time, starting with $a$. On top, $a$ has index 2. Underneath, it has index negative 1.'
        write: 'For $a$: top index $2$, bottom index $-1$'
      - say: 'So $p$ is the top index minus the bottom index: 2 minus negative 1.'
        write: '$p = 2 - (-1)$'
        point:
          - { line: 1, kind: box, text: 'the rule' }
          - { line: 3, kind: move, from: { line: 2, at: 'index [[2]]' }, at: '= [[2]]', text: 'top' }
          - { line: 3, kind: move, from: { line: 2, at: 'index [[−1]]' }, at: '(−1)', text: 'bottom' }
      - say: 'Subtracting a negative is the same as adding, so 2 minus negative 1 is 2 plus 1, which is 3.'
        write: '$= 2 + 1 = 3$'
      - say: 'Now $b$. On top its index is 3, and underneath it is 4. So $q$ is 3 minus 4, which is negative 1.'
        write: 'For $b$: $q = 3 - 4 = -1$'
      - say: 'Now $c$. The $c$ on top has no index written, and that means its index is 1. Underneath, its index is 5.'
        write: 'For $c$: top $c = c^{1}$, bottom index $5$'
      - say: 'So $r$ is 1 minus 5, which is negative 4.'
        write: '$r = 1 - 5 = -4$'
      - say: 'Putting the three letters together, the fraction simplifies to $a^{3}b^{-1}c^{-4}$. So $p$ is 3, $q$ is negative 1 and $r$ is negative 4.'
        write: 'So $\dfrac{a^{2}b^{3}c}{a^{-1}b^{4}c^{5}} = a^{3}b^{-1}c^{-4}$'
      - say: 'The question only wants $p + 2q$. Using the values we just found, we put in 3 for $p$ and negative 1 for $q$.'
        write: '$p + 2q = 3 + 2(-1)$'
        point:
          - { line: 9, kind: move, from: { line: 4, at: '3' }, at: '[[3]] + 2', text: 'p' }
          - { line: 9, kind: move, from: { line: 5, at: '= [[−1]]' }, at: '(−1)', text: 'q' }
      - say: '2 times negative 1 is negative 2.'
        write: '$= 3 - 2$'
      - say: '3 minus 2 is 1. So $p + 2q$ is 1, which is answer choice C.'
        write: '$= 1$'
        answer: true
    traps:
      A: 'You went for negative 3. That comes from taking $p$ as negative 1. Dividing means top index minus bottom index, and 2 minus negative 1 is 3, so $p$ is 3.'
      B: 'You went for negative 1. That happens if the $a^{-1}$ underneath is treated as an ordinary $a$, giving $p = 1$. But 2 minus negative 1 is 3, so $p + 2q = 3 - 2 = 1$.'
      D: 'You went for 5. That comes from taking $q$ as positive 1, subtracting the wrong way round. For $b$ it is top minus bottom: 3 minus 4 is negative 1.'

  2:
    moments:
      - say: 'We need the value of $x$ that makes these two fractions equal.'
        write: '$\dfrac{\sqrt{2}}{x + \sqrt{2}} = \dfrac{1}{x - \sqrt{2}}$'
      - say: 'The first thing to do is clear the fractions. When two fractions are equal, we can cross-multiply: the top of each side times the bottom of the other.'
        write: 'Cross-multiply: $\sqrt{2}(x - \sqrt{2}) = 1(x + \sqrt{2})$'
      - say: 'Expand the left bracket. Root 2 times $x$ is root 2 $x$, and root 2 times root 2 is just 2.'
        write: 'Left side: $\sqrt{2} \times x - \sqrt{2} \times \sqrt{2} = \sqrt{2}x - 2$'
      - say: 'So, using the left side we just expanded, the equation becomes root 2 $x$ minus 2 equals $x$ plus root 2.'
        write: '$\sqrt{2}x - 2 = x + \sqrt{2}$'
        point:
          - { line: 3, kind: move, from: { line: 2, at: '= [[2x − 2]]' }, at: '[[2x − 2]] = x', text: 'from here' }
      - say: 'Now gather the $x$ terms on the left and the numbers on the right. Subtract $x$ from both sides, and add 2 to both sides.'
        write: '$\sqrt{2}x - x = 2 + \sqrt{2}$'
        point:
          - { line: 4, kind: move, from: { line: 3, at: '= [[x]]' }, at: '[[− x]] =', text: 'across' }
          - { line: 4, kind: move, from: { line: 3, at: '[[− 2]] =' }, at: '= [[2]] +', text: 'across' }
      - say: 'Both terms on the left have an $x$, so factor it out.'
        write: '$x(\sqrt{2} - 1) = 2 + \sqrt{2}$'
        point:
          - { line: 5, kind: move, from: { line: 4, at: '2[[x]] − x' }, at: '[[x]](', text: 'out front' }
      - say: 'To get $x$ by itself, divide both sides by root 2 minus 1.'
        write: '$x = \dfrac{2 + \sqrt{2}}{\sqrt{2} - 1}$'
        point:
          - { line: 6, kind: move, from: { line: 5, at: '(2 − 1)' }, at: '= [[2 − 1]]', text: 'divide' }
      - say: 'There is a surd on the bottom, so we rationalise. Multiply the top and the bottom by the conjugate, root 2 plus 1. That is multiplying by 1, so the value does not change.'
        write: '$x = \dfrac{(2 + \sqrt{2})(\sqrt{2} + 1)}{(\sqrt{2} - 1)(\sqrt{2} + 1)}$'
      - say: 'Start with the bottom. It is a difference of two squares: root 2 squared minus 1 squared. That is 2 minus 1, which is 1.'
        write: 'Bottom: $(\sqrt{2} - 1)(\sqrt{2} + 1) = (\sqrt{2})^{2} - 1^{2} = 2 - 1 = 1$'
      - say: 'Now the top. Multiply each term of the first bracket by each term of the second bracket.'
        write: 'Top: $(2 + \sqrt{2})(\sqrt{2} + 1) = 2 \times \sqrt{2} + 2 \times 1 + \sqrt{2} \times \sqrt{2} + \sqrt{2} \times 1$'
      - say: '2 times root 2 is 2 root 2. 2 times 1 is 2. Root 2 times root 2 is 2. And root 2 times 1 is root 2.'
        write: '$= 2\sqrt{2} + 2 + 2 + \sqrt{2}$'
      - say: 'Collect like terms. 2 root 2 plus root 2 is 3 root 2, and 2 plus 2 is 4.'
        write: '$= 3\sqrt{2} + 4$'
      - say: 'So the top is 3 root 2 plus 4, and the bottom we found is 1. Dividing by 1 changes nothing, so $x$ is 3 root 2 plus 4, which is answer choice A.'
        write: '$x = \dfrac{3\sqrt{2} + 4}{1} = 3\sqrt{2} + 4$'
        point:
          - { line: 12, kind: move, from: { line: 11, at: '= [[32 + 4]]' }, at: 'x = 1[[32 + 4]]', text: 'the top' }
          - { line: 12, kind: move, from: { line: 8, at: '2 − 1 = [[1]]' }, at: 'x = [[1]]', text: 'the bottom' }
        answer: true
    traps:
      B: 'You went for 3 root 2 minus 4. When the top is multiplied out it gives 2 root 2, plus 2, plus 2, plus root 2, and the two 2s make plus 4, not minus 4. Watch the sign when the negative 2 moves across the equals sign: it becomes plus 2.'
      C: 'You went for 3 minus 2 root 2. That is not what the top multiplies out to. Multiply 2 plus root 2 by root 2 plus 1 term by term: 2 root 2, plus 2, plus 2, plus root 2.'
      D: 'You went for 4 plus 2 root 2. That misses the last product when expanding the top: root 2 times 1 gives one more root 2, making 3 root 2 plus 4.'

  3:
    moments:
      - say: 'A trader bought 100 oranges at 5 for ₦1.20. 20 got spoilt, and he sold the rest at 4 for ₦1.50. We want the percentage gain or loss.'
        write: 'Bought 100 at 5 for ₦1.20; 20 spoilt; rest sold at 4 for ₦1.50'
      - say: 'The plan: find what he spent, find what he received, and compare. Gain or loss is always measured against the cost, so the cost goes on the bottom.'
        write: 'Gain % $= \dfrac{\text{gain}}{\text{cost}} \times 100\%$'
      - say: 'First the cost. He buys in lots of 5. How many lots of 5 are in 100? 100 divided by 5 is 20.'
        write: 'Lots bought: $100 \div 5 = 20$'
      - say: 'Each lot costs ₦1.20, so 20 lots cost 20 times 1.20, which is 24. He spent ₦24. Notice he paid for all 100 oranges, even the ones that spoilt.'
        write: 'Cost: $20 \times 1.20 = 24$, so ₦24'
      - say: 'Now the selling side. 20 oranges were spoilt, so 100 minus 20 leaves 80 to sell.'
        write: 'Left to sell: $100 - 20 = 80$'
      - say: 'He sells in lots of 4. 80 divided by 4 is 20 lots.'
        write: 'Lots sold: $80 \div 4 = 20$'
      - say: 'Each lot sells for ₦1.50. 20 times 1.50 is 30. He received ₦30.'
        write: 'Sales: $20 \times 1.50 = 30$, so ₦30'
      - say: 'Now compare the ₦30 he received with the ₦24 he spent. 30 is more than 24, so it is a gain. 30 minus 24 is 6.'
        write: 'Gain $= 30 - 24 = 6$, so ₦6'
        point:
          - { line: 7, kind: move, from: { line: 6, at: '₦[[30]]' }, at: '30', text: 'received' }
          - { line: 7, kind: move, from: { line: 3, at: '₦[[24]]' }, at: '24', text: 'spent' }
      - say: 'Now the percentage. Put the gain of 6 over the cost of 24, and multiply by 100.'
        write: 'Gain % $= \dfrac{6}{24} \times 100\%$'
        point:
          - { line: 1, kind: box, text: 'the rule' }
          - { line: 8, kind: move, from: { line: 7, at: '= [[6]]' }, at: '24[[6]]', text: 'gain' }
          - { line: 8, kind: move, from: { line: 7, at: '− [[24]]' }, at: '[[24]]6', text: 'cost' }
      - say: '6 over 24 simplifies. Divide the top and the bottom by 6, and we get 1 over 4, a quarter.'
        write: '$= \dfrac{1}{4} \times 100\%$'
      - say: 'A quarter of 100 is 25.'
        write: '$= 25\%$'
      - say: 'So the trader made a 25% gain, which is answer choice B.'
        write: 'Result: $25\%$ gain'
        answer: true
    traps:
      A: 'You went for 30% gain. The 30 is the ₦30 he received, not his gain. The gain is 30 minus 24, which is ₦6, and 6 over 24 is a quarter, which is 25%.'
      C: 'You went for 30% loss. He received ₦30 and spent only ₦24, so he made money: it is a gain, not a loss. And 6 over 24 is 25%.'
      D: 'You went for 25% loss. The size is right, but the direction is wrong: ₦30 back on ₦24 spent is a gain.'

  4:
    moments:
      - say: 'We have a universal set $U$ and sets $P$, $Q$ and $R$. We want the complement of $P$ union $Q$, intersected with $R$.'
        write: '$(P \cup Q)'' \cap R$'
        point:
          - { figure: sketch, kind: circle, target: 'U', text: 'universal set' }
      - say: 'Let me draw a Venn diagram, so we can see where everything belongs.'
        show_sketch: true
      - say: 'The brackets tell us the order. First we find $P$ union $Q$, then its complement, and only then do we intersect with $R$.'
        write: 'Step 1: find $P \cup Q$'
      - say: '$P$ is 3, 4, 5 and $Q$ is 2, 4, 6.'
        write: '$P = \{3, 4, 5\},\ Q = \{2, 4, 6\}$'
      - say: 'The union is everything that is in $P$ or in $Q$. Put 3, 4, 5 together with 2, 4, 6. 4 is in both, but a set lists it only once.'
        write: '$P \cup Q = \{2, 3, 4, 5, 6\}$'
        point:
          - { figure: sketch, kind: circle, target: 'P', text: '3, 4, 5' }
          - { figure: sketch, kind: circle, target: 'Q', text: '2, 4, 6' }
          - { figure: sketch, kind: circle, target: '4', text: 'in both' }
      - say: 'Step 2, the complement. The dash means everything in $U$ that is not in the union we just found. Here is $U$.'
        write: 'Step 2: $U = \{1, 2, 3, 4, 5, 6\}$'
      - say: 'Go through $U$ one element at a time. 1 is not in the union, so it stays. 2, 3, 4, 5 and 6 are all in the union, so they go.'
        write: 'Keep $1 \notin P \cup Q$; remove $2, 3, 4, 5, 6 \in P \cup Q$'
      - say: 'So only 1 is left in the complement.'
        write: '$(P \cup Q)'' = \{1\}$'
        point:
          - { figure: sketch, kind: circle, target: '1', text: 'outside P ∪ Q' }
      - say: 'Step 3. Now we intersect this with $R$, which is 1, 2, 3, 4. Intersection keeps only what is in both sets.'
        write: 'Step 3: $(P \cup Q)'' \cap R = \{1\} \cap \{1, 2, 3, 4\}$'
        point:
          - { line: 8, kind: move, from: { line: 7, at: '= [[{1}]]' }, at: '[[{1}]] ∩', text: 'from step 2' }
      - say: 'Is 1 in $R$? Yes, it is, so it stays.'
        write: 'Check: $1 \in R$'
        point:
          - { figure: sketch, kind: circle, target: 'R', text: '1 is in R' }
      - say: 'So the answer is the set containing just 1, which is answer choice C.'
        write: '$(P \cup Q)'' \cap R = \{1\}$'
        answer: true
    traps:
      A: 'You went for the set 1 to 6. That is the whole universal set. The complement of $P$ union $Q$ keeps only what is outside the union, which is just 1.'
      B: 'You went for 1, 2, 3, 4. That is $R$ itself. Intersecting with $R$ keeps only what is also in the complement, and the complement is just the set containing 1.'
      D: 'You went for the empty set. That comes from doing the steps in the wrong order. Take the complement of $P$ union $Q$ first, which is the set containing 1, and 1 is in $R$.'

  5:
    moments:
      - say: 'We want to divide $2434_{6}$ by $42_{6}$. The easiest way is to convert both to base ten, divide there, then convert back to base six.'
        write: '$2434_{6} \div 42_{6}$'
      - say: 'In base six, the place values from the right are 1, 6, 36 and 216. Each column is 6 times the one to its right.'
        write: 'Place values: $6^{3} = 216,\ 6^{2} = 36,\ 6^{1} = 6,\ 6^{0} = 1$'
      - say: 'So $2434_{6}$ is 2 times 216, plus 4 times 36, plus 3 times 6, plus 4 times 1.'
        write: '$2434_{6} = 2 \times 216 + 4 \times 36 + 3 \times 6 + 4 \times 1$'
      - say: '2 times 216 is 432. 4 times 36 is 144. 3 times 6 is 18. And 4 times 1 is 4.'
        write: '$= 432 + 144 + 18 + 4$'
      - say: '432 plus 144 is 576. Plus 18 is 594. Plus 4 is 598.'
        write: '$= 598$'
      - say: 'Now the divisor, $42_{6}$. That is 4 times 6, plus 2 times 1. 24 plus 2 is 26.'
        write: '$42_{6} = 4 \times 6 + 2 \times 1 = 24 + 2 = 26$'
      - say: 'Now we divide in base ten, using the 598 and the 26 we just found.'
        write: 'In base ten: $598 \div 26$'
        point:
          - { line: 6, kind: move, from: { line: 4, at: '598' }, at: '598', text: '598' }
          - { line: 6, kind: move, from: { line: 5, at: '= [[26]]' }, at: '26', text: '26' }
      - say: '26 times 20 is 520, and 26 times 3 is 78. 520 plus 78 is 598, so 26 goes into 598 exactly 23 times.'
        write: '$26 \times 23 = 520 + 78 = 598$, so $598 \div 26 = 23$'
      - say: 'But 23 is a base ten number, and we must convert it back to base six. Divide 23 by 6: 6 goes in 3 times, which is 18, remainder 5.'
        write: '$23 \div 6 = 3$ remainder $5$'
      - say: 'Then divide that 3 by 6. It goes 0 times, remainder 3.'
        write: '$3 \div 6 = 0$ remainder $3$'
      - say: 'Read the remainders from the bottom up: 3, then 5. So 23 in base ten is $35_{6}$.'
        write: 'So $23 = 35_{6}$'
        point:
          - { line: 10, kind: move, from: { line: 9, at: 'remainder [[3]]' }, at: '= [[3]]5', text: 'first digit' }
          - { line: 10, kind: move, from: { line: 8, at: 'remainder [[5]]' }, at: '= 3[[5]]', text: 'last digit' }
      - say: 'Check: $35_{6}$ is 3 times 6, plus 5. That is 18 plus 5, which is 23. It matches.'
        write: 'Check: $35_{6} = 3 \times 6 + 5 = 18 + 5 = 23$'
      - say: 'So $2434_{6}$ divided by $42_{6}$ is $35_{6}$, which is answer choice B.'
        write: '$2434_{6} \div 42_{6} = 35_{6}$'
        answer: true
    traps:
      A: 'You went for $23_{6}$. 23 is the answer in base ten, written with a base six label. It still has to be converted: 23 is 3 sixes and 5, which is $35_{6}$.'
      C: 'You went for $52_{6}$. That is 5 sixes and 2, which is 32 in base ten. The quotient is 598 divided by 26, which is 23, and that is $35_{6}$.'
      D: 'You went for $55_{6}$. That is 35 in base ten. The quotient in base ten is 23, and 23 in base six is $35_{6}$.'

  6:
    moments:
      - say: 'We have 2 times $Y3$ in base nine equals 3 times $Y3$ in base five. $Y$ is an unknown digit, and we want its value.'
        write: '$2 \times (Y3)_{9} = 3 \times (Y3)_{5}$'
      - say: 'Convert each numeral to base ten, keeping $Y$ as a letter. In base nine, a two-digit numeral has columns worth 9 and 1. So $Y3$ in base nine is $Y$ nines plus 3 ones.'
        write: '$(Y3)_{9} = Y \times 9 + 3 \times 1 = 9Y + 3$'
      - say: 'In base five, the columns are worth 5 and 1. So $Y3$ in base five is $Y$ fives plus 3 ones.'
        write: '$(Y3)_{5} = Y \times 5 + 3 \times 1 = 5Y + 3$'
      - say: 'Now go back to the equation and put these two expressions in place of the numerals.'
        write: '$2(9Y + 3) = 3(5Y + 3)$'
        point:
          - { line: 3, kind: move, from: { line: 1, at: '= [[9Y + 3]]' }, at: '(9Y + 3)', text: 'base nine' }
          - { line: 3, kind: move, from: { line: 2, at: '= [[5Y + 3]]' }, at: '(5Y + 3)', text: 'base five' }
      - say: 'Expand. 2 times $9Y$ is $18Y$, and 2 times 3 is 6. 3 times $5Y$ is $15Y$, and 3 times 3 is 9.'
        write: '$18Y + 6 = 15Y + 9$'
      - say: 'Subtract $15Y$ from both sides. $18Y$ minus $15Y$ is $3Y$.'
        write: '$18Y - 15Y + 6 = 9 \Rightarrow 3Y + 6 = 9$'
        point:
          - { line: 5, kind: move, from: { line: 4, at: '= [[15Y]]' }, at: '− 15Y', text: 'across' }
      - say: 'Subtract 6 from both sides. 9 minus 6 is 3.'
        write: '$3Y = 9 - 6 = 3$'
        point:
          - { line: 6, kind: move, from: { line: 5, at: '3Y [[+ 6]]' }, at: '− 6', text: 'across' }
      - say: 'Divide both sides by 3. 3 divided by 3 is 1.'
        write: '$Y = \dfrac{3}{3} = 1$'
      - say: 'A digit must be smaller than its base. 1 is smaller than 5 and smaller than 9, so it is a proper digit in both numerals.'
        write: 'Check the digit: $1 < 5$ and $1 < 9$'
      - say: 'Now check the equation. 13 in base nine is 9 plus 3, which is 12, and 2 times 12 is 24.'
        write: 'Left: $2 \times (13)_{9} = 2 \times (9 + 3) = 2 \times 12 = 24$'
      - say: '13 in base five is 5 plus 3, which is 8, and 3 times 8 is 24. Both sides are 24, so it works.'
        write: 'Right: $3 \times (13)_{5} = 3 \times (5 + 3) = 3 \times 8 = 24$'
      - say: 'So $Y$ is 1, which is answer choice D.'
        write: '$Y = 1$'
        answer: true
    traps:
      A: 'You went for 4. Test it: 43 in base nine is 39, and 2 times 39 is 78. 43 in base five is 23, and 3 times 23 is 69. They are not equal. The equation $18Y + 6 = 15Y + 9$ gives $Y = 1$.'
      B: 'You went for 3. Test it: 33 in base nine is 30, doubled is 60. 33 in base five is 18, tripled is 54. Not equal. Solving $3Y = 3$ gives 1.'
      C: 'You went for 2. Test it: 23 in base nine is 21, doubled is 42. 23 in base five is 13, tripled is 39. Not equal. Solving $3Y = 3$ gives 1.'

  7:
    moments:
      - say: 'We want to simplify this square root. The plan: work out the whole fraction under the root first, then take the square root at the end.'
        write: '$\sqrt{\dfrac{0.0023 \times 750}{0.00345 \times 1.25}}$'
      - say: 'Start with the top: 0.0023 times 750.'
        write: 'Top: $0.0023 \times 750$'
      - say: 'Forget the decimal points for a moment: 23 times 75 is 1725.'
        write: '$23 \times 75 = 1725$'
      - say: '0.0023 has four decimal places, so 0.0023 times 75 is 0.1725. And 750 is 75 times 10, so we multiply by 10 more and get 1.725.'
        write: '$0.0023 \times 750 = 0.1725 \times 10 = 1.725$'
      - say: 'The bottom is 0.00345 times 1.25. We keep it as two pieces for now, because it divides neatly one piece at a time.'
        write: 'Bottom: $0.00345 \times 1.25$'
      - say: 'So the fraction under the root is the 1.725 we just found, over 0.00345 times 1.25.'
        write: 'Under the root: $\dfrac{1.725}{0.00345 \times 1.25}$'
        point:
          - { line: 5, kind: move, from: { line: 3, at: '= [[1.725]]' }, at: '1.725', text: 'the top' }
      - say: 'Let''s divide 1.725 by 0.00345 first. Multiply the top and the bottom by 1000 to move both decimal points three places. That gives 1725 over 3.45.'
        write: '$\dfrac{1.725}{0.00345} = \dfrac{1725}{3.45}$'
      - say: 'What times 3.45 gives 1725? 3.45 times 100 is 345, and 345 times 5 is 1725. So 3.45 times 500 is 1725, and this division gives 500.'
        write: '$3.45 \times 500 = 1725$, so $\dfrac{1725}{3.45} = 500$'
      - say: 'Now divide that 500 by the 1.25 still waiting on the bottom. 1.25 times 4 is 5, so 1.25 times 400 is 500. That gives 400.'
        write: '$\dfrac{500}{1.25} = 400$, since $1.25 \times 400 = 500$'
        point:
          - { line: 8, kind: move, from: { line: 7, at: '= [[500]]' }, at: '[[500]] = 400', text: 'from here' }
      - say: 'So the whole fraction under the root is 400, and the expression is the square root of 400.'
        write: '$\sqrt{\dfrac{0.0023 \times 750}{0.00345 \times 1.25}} = \sqrt{400}$'
      - say: '20 times 20 is 400, so the square root of 400 is 20, which is answer choice B.'
        write: '$= 20$'
        answer: true
    traps:
      A: 'You went for 15. 15 squared is 225, but the fraction under the root works out to 400, and the square root of 400 is 20.'
      C: 'You went for 40. 40 squared is 1600. The fraction under the root is 400, whose square root is 20. Check the decimal places when multiplying 0.00345 by 1.25.'
      D: 'You went for 75. That number sits inside the 750 in the question, but it is not the result. The fraction under the root is 400, and its square root is 20.'

  8:
    moments:
      - say: 'We are told that log base 8 of 10 is $x$, and we want log base 8 of 5 in terms of $x$.'
        write: '$\log_{8}10 = x$'
      - say: 'The trick is to build 5 out of the 10 we were given. 5 is 10 divided by 2.'
        write: '$5 = \dfrac{10}{2}$'
      - say: 'So log base 8 of 5 is log base 8 of 10 over 2.'
        write: '$\log_{8}5 = \log_{8}\dfrac{10}{2}$'
      - say: 'Here is the law we need: the log of a division is the log of the top minus the log of the bottom.'
        write: 'Law: $\log\dfrac{m}{n} = \log m - \log n$'
      - say: 'Using that law, log base 8 of 10 over 2 splits into log base 8 of 10, minus log base 8 of 2.'
        write: '$\log_{8}5 = \log_{8}10 - \log_{8}2$'
        point:
          - { line: 3, kind: box, text: 'the law' }
      - say: 'The first part is given in the question: log base 8 of 10 is $x$.'
        write: '$= x - \log_{8}2$'
        point:
          - { line: 5, kind: move, from: { line: 0, at: '= [[x]]' }, at: '= [[x]]', text: 'given' }
      - say: 'Now, log base 8 of 2 asks: what power of 8 gives 2? Let''s start from the fact that 2 cubed is 8.'
        write: '$2^{3} = 2 \times 2 \times 2 = 8$'
      - say: 'So 2 is the cube root of 8, and a cube root is the same as the power 1 over 3. So 8 to the power 1 over 3 is 2.'
