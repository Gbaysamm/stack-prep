      - say: 'Let the first term be $a$ and the common ratio be $r$. The first term is twice the common ratio, so $a$ equals $2r$.'
        write: '$a = 2r$'
      - say: 'The sum to infinity of a geometric progression is $a$ over 1 minus $r$. It only exists when $r$ is between negative 1 and 1, so that the terms keep shrinking.'
        write: '$S_{\infty} = \dfrac{a}{1 - r}$'
