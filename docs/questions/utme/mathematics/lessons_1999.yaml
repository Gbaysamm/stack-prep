  25:
    moments:
      - say: 'In triangle $XYZ$, $XY$ is 2 m, $YZ$ is 1 m, and the angle at $Y$ is 120 degrees. We want the length $XZ$.'
        write: 'Triangle $XYZ$: $XY = 2$ m, $YZ = 1$ m, $\angle Y = 120^{\circ}$'
        point:
          - { figure: 0, kind: circle, target: '2 m', text: 'XY' }
          - { figure: 0, kind: circle, target: '1 m', text: 'YZ' }
          - { figure: 0, kind: arc, target: 'XYZ', text: '120°' }
      - say: 'We know two sides and the angle between them, and we want the third side. That is exactly what the cosine rule is for.'
        write: 'Cosine rule: $b^{2} = a^{2} + c^{2} - 2ac\cos B$'
        point:
          - { figure: 0, kind: highlight, target: 'XY' }
          - { figure: 0, kind: highlight, target: 'YZ' }
          - { figure: 0, kind: underline, target: 'XZ', text: 'third side' }
      - say: '$XZ$ is the side opposite the angle at $Y$, and $XY$ and $YZ$ are the two sides around that angle. So here the rule reads like this.'
        write: '$XZ^{2} = XY^{2} + YZ^{2} - 2(XY)(YZ)\cos Y$'
        point:
          - { line: 1, kind: box, text: 'the rule' }
          - { figure: 0, kind: highlight, target: XZ, text: 'opposite Y' }
          - { figure: 0, kind: arc, target: XYZ, text: '120°' }
      - say: 'Substitute: $XY$ is 2, $YZ$ is 1, and the angle is 120 degrees.'
        write: '$XZ^{2} = 2^{2} + 1^{2} - 2(2)(1)\cos 120^{\circ}$'
        point:
          - { line: 3, kind: move, from: { line: 0, at: 'XY = [[2]]' }, at: '= [[2]]2', text: 'XY' }
          - { line: 3, kind: move, from: { line: 0, at: 'YZ = [[1]]' }, at: '+ [[1]]2', text: 'YZ' }
          - { line: 3, kind: move, from: { line: 0, at: '∠Y = [[120∘]]' }, at: 'cos[[120∘]]', text: 'angle' }
      - say: 'What is cos 120 degrees? 120 is 180 minus 60, and cos of 180 minus an angle is minus the cos of the angle. Cos 60 is a half, so cos 120 is negative a half.'
        write: '$\cos 120^{\circ} = -\cos 60^{\circ} = -\dfrac{1}{2}$'
      - say: 'Back in our line: 2 squared is 4, 1 squared is 1, 2 times 2 times 1 is 4, and cos 120 is negative a half.'
        write: '$XZ^{2} = 4 + 1 - 4\left(-\dfrac{1}{2}\right)$'
        point:
          - { line: 5, kind: move, from: { line: 4, at: '= [[−21]]' }, at: '(−21)', text: 'cos 120°' }
      - say: '4 plus 1 is 5. 4 times negative a half is negative 2, and minus negative 2 is plus 2.'
        write: '$= 5 + 2$'
      - say: '5 plus 2 is 7.'
        write: '$XZ^{2} = 7$'
      - say: 'Does that make sense? With a right angle at $Y$ we would get 4 plus 1, which is 5. An obtuse angle opens the triangle wider, so $XZ$ should be longer, and 7 is more than 5.'
        write: 'Check: $XZ^{2} = 7 > 5 = 2^{2} + 1^{2}$'
        point:
          - { figure: 0, kind: arc, target: 'XYZ', text: 'obtuse' }
          - { figure: 0, kind: highlight, target: 'XZ', text: 'longer' }
      - say: 'Take the square root. $XZ$ is root 7 metres, which is answer choice A.'
        write: '$XZ = \sqrt{7}$ m'
        point:
          - { figure: 0, kind: label, target: '?', text: '√7 m' }
        answer: true
    traps:
      B: 'You went for root 6. The cosine rule gives 4 plus 1 minus 4 times negative one half, which is 5 plus 2, so $XZ$ squared is 7, not 6.'
      C: 'You went for root 5. That treats cos 120 degrees as zero, like a right angle. Cos 120 degrees is negative one half, which adds 2 more: 7.'
      D: 'You went for root 3. That uses cos 120 degrees as positive one half, giving 5 minus 2. The angle is obtuse, so its cosine is negative and we get 5 plus 2.'

  26:
    moments:
      - say: 'This circle has centre $a$, negative 2, and radius 4 units. We want the positive value of $a$.'
        write: '$x^{2} + y^{2} - 2ax + 4y - a = 0$'
        point:
          - { figure: sketch, kind: circle, target: 'C', text: 'centre (a, −2)' }
          - { figure: sketch, kind: circle, target: 'r = 4', text: 'radius' }
      - say: 'Let me draw a diagram of the circle first, so we can see what we are working with.'
        show_sketch: true
      - say: 'Compare it with the general equation of a circle, which has $2gx$, $2fy$ and a constant $c$.'
        write: 'General circle: $x^{2} + y^{2} + 2gx + 2fy + c = 0$'
      - say: 'For that general circle, the centre is negative $g$, negative $f$, and the radius is the square root of $g^{2} + f^{2} - c$.'
        write: 'Centre $= (-g,\ -f)$, radius $r = \sqrt{g^{2} + f^{2} - c}$'
      - say: 'Now match our equation with it. The $x$ terms: $2g$ is negative $2a$, so $g$ is negative $a$.'
        write: '$x$ terms: $2g = -2a \Rightarrow g = -a$'
      - say: 'The $y$ terms: $2f$ is 4, so $f$ is 2.'
        write: '$y$ terms: $2f = 4 \Rightarrow f = 2$'
      - say: 'And the constant term: $c$ is negative $a$. Keep that minus sign.'
        write: 'Constant: $c = -a$'
      - say: 'The centre is negative $g$, negative $f$. Negative of negative $a$ is $a$, and negative of 2 is negative 2. That agrees with the question, so our matching is right.'
        write: 'Centre $= (-g,\ -f) = (-(-a),\ -2) = (a,\ -2)$'
        point:
          - { figure: sketch, kind: circle, target: '(a, −2)', text: 'centre' }
      - say: 'Now the radius. The radius squared is $g^{2}$ plus $f^{2}$ minus $c$.'
        write: 'Radius: $r^{2} = g^{2} + f^{2} - c$'
      - say: 'Put in $g$ is negative $a$, $f$ is 2, and $c$ is negative $a$, from the matching we just did.'
        write: '$= (-a)^{2} + 2^{2} - (-a)$'
        point:
          - { line: 9, kind: move, from: { line: 4, at: 'g = [[−a]]' }, at: '[[(−a)]]2', text: 'g' }
          - { line: 9, kind: move, from: { line: 5, at: 'f = [[2]]' }, at: '+ [[2]]2', text: 'f' }
          - { line: 9, kind: move, from: { line: 6, at: 'c = [[−a]]' }, at: '− [[(−a)]]', text: 'c' }
      - say: 'Negative $a$ squared is $a^{2}$. 2 squared is 4. And minus negative $a$ is plus $a$.'
        write: '$= a^{2} + 4 + a$'
      - say: 'The radius is 4, so the radius squared is 4 squared, which is 16.'
        write: '$r = 4$, so $a^{2} + a + 4 = 4^{2} = 16$'
        point:
          - { figure: sketch, kind: circle, target: 'r = 4', text: 'r² = 16' }
      - say: 'Subtract 16 from both sides. 4 minus 16 is negative 12.'
        write: '$a^{2} + a + 4 - 16 = 0 \Rightarrow a^{2} + a - 12 = 0$'
        point:
          - { line: 12, kind: move, from: { line: 11, at: '= [[16]]' }, at: '− 16', text: 'across' }
      - say: 'We need two numbers that multiply to negative 12 and add to 1. 4 times negative 3 is negative 12, and 4 plus negative 3 is 1.'
        write: '$4 \times (-3) = -12,\quad 4 + (-3) = 1$'
      - say: 'So the quadratic factorises like this.'
        write: '$(a + 4)(a - 3) = 0$'
      - say: 'Either $a$ plus 4 is zero, giving negative 4, or $a$ minus 3 is zero, giving 3.'
        write: '$a = -4$ or $a = 3$'
      - say: 'The question wants the positive value, so $a$ is 3, which is answer choice C.'
        write: 'Positive value: $a = 3$'
        point:
          - { line: 15, kind: strike, at: 'a = −4', text: 'not positive' }
          - { figure: sketch, kind: circle, target: 'a = ?', text: 'a = 3' }
        answer: true
    traps:
      A: 'You went for 1. With $a = 1$, the radius squared is 1 plus 4 plus 1, which is 6, not 16. Solving $a^{2} + a + 4 = 16$ gives 3.'
      B: 'You went for 2. With $a = 2$, the radius squared is 4 plus 4 plus 2, which is 10, not 16. The equation $a^{2} + a - 12 = 0$ gives 3.'
      D: 'You went for 4. With $a = 4$, the radius squared is 16 plus 4 plus 4, which is 24. Watch the constant: $c$ is negative $a$, so it adds $a$, and the equation gives 3.'

  27:
    moments:
      - say: 'A man 1.7 m tall sees a bird on top of a tree at an angle of elevation of 30 degrees. The distance from his head to the bird is 25 m. We want the height of the tree.'
        write: 'Man $1.7$ m tall, elevation $30^{\circ}$, head to bird $25$ m'
        point:
          - { figure: sketch, kind: circle, target: { x: 28, y: 210 }, text: '1.7 m tall' }
          - { figure: sketch, kind: arc, target: 'CAB', text: '30°' }
          - { figure: sketch, kind: circle, target: '25 m', text: 'head to bird' }
