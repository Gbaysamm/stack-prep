        write: 'Height $= 4$ cm'
        point:
          - { figure: 0, kind: circle, target: '4 cm' }
      - say: 'Pythagoras says the hypotenuse squared equals the opposite squared plus the adjacent squared.'
        write: 'Pythagoras: $\text{hypotenuse}^{2} = \text{opposite}^{2} + \text{adjacent}^{2}$'
      - say: 'Here the hypotenuse is the slant side $l$, and the other two sides are 3 and 4.'
        write: 'Here: hypotenuse $= l$, other two sides $3$ and $4$'
      - say: 'The slant side $l$ is the hypotenuse of that triangle, so we use Pythagoras with the 3 and the 4 we just found.'
