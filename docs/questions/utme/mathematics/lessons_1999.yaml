  21:
    moments:
      - say: 'We want to express 1 over $x^{3} - 1$ in partial fractions.'
        write: '$\dfrac{1}{x^{3} - 1}$'
      - say: 'Partial fractions always start by factorising the denominator. $x^{3} - 1$ is a difference of two cubes, and it factorises like this.'
        write: 'Difference of cubes: $x^{3} - 1 = (x - 1)(x^{2} + x + 1)$'
      - say: 'Let''s check by expanding. $x$ times the quadratic gives $x^{3} + x^{2} + x$. Negative 1 times it gives negative $x^{2}$, negative $x$, negative 1. Everything cancels except $x^{3} - 1$.'
        write: 'Check: $x^{3} + x^{2} + x - x^{2} - x - 1 = x^{3} - 1$'
      - say: 'Does the quadratic factor break down further? Its discriminant is 1 squared minus 4 times 1 times 1, which is 1 minus 4, negative 3. That is negative, so no.'
        write: 'Discriminant: $b^{2} - 4ac = 1^{2} - 4(1)(1) = 1 - 4 = -3 < 0$'
      - say: 'So the linear factor gets a constant $A$ on top, and the quadratic factor gets a linear top, $Bx + C$.'
        write: '$\dfrac{1}{x^{3} - 1} = \dfrac{A}{x - 1} + \dfrac{Bx + C}{x^{2} + x + 1}$'
      - say: 'Multiply every term by $x^{3} - 1$ to clear the fractions. Each fraction keeps the factor it did not have.'
        write: '$1 = A(x^{2} + x + 1) + (Bx + C)(x - 1)$'
      - say: 'Now a neat move: put $x$ equal to 1. That makes $x - 1$ zero, so the second part vanishes.'
        write: 'Put $x = 1$: $\ 1 = A(1^{2} + 1 + 1) + (B + C)(1 - 1)$'
        point:
          - { line: 6, kind: strike, at: '(B + C)(1 − 1)', text: 'vanishes' }
      - say: '1 squared plus 1 plus 1 is 3, and anything times zero is zero. So $3A$ is 1, and $A$ is 1 over 3.'
        write: '$1 = 3A + 0 \Rightarrow A = \dfrac{1}{3}$'
      - say: 'To find $B$ and $C$, let''s expand the second part: $Bx + C$ times $x - 1$.'
        write: 'Expand: $(Bx + C)(x - 1) = Bx^{2} - Bx + Cx - C$'
      - say: 'Now compare the $x$ squared terms on both sides. On the left there are none. On the right we get $A$ from the first part and $B$ from the part we just expanded.'
        write: '$x^{2}$ terms: $0 = A + B$'
        point:
          - { line: 5, kind: circle, at: 'A(x2' }
          - { line: 8, kind: circle, at: '= Bx2' }
      - say: 'So $B$ is negative $A$, which is negative 1 over 3.'
        write: '$B = -A = -\dfrac{1}{3}$'
        point:
          - { line: 10, kind: move, from: { line: 7, at: 'A = [[31]]' }, at: '= −[[31]]', text: 'A' }
      - say: 'Now compare the constant terms. On the left it is 1. On the right, $A$ from the first part, and negative $C$ from the expanded part.'
        write: 'Constants: $1 = A - C$'
      - say: 'So $C$ is $A$ minus 1. 1 over 3 minus 1 is negative 2 over 3.'
        write: '$C = A - 1 = \dfrac{1}{3} - 1 = -\dfrac{2}{3}$'
        point:
          - { line: 12, kind: move, from: { line: 7, at: 'A = [[31]]' }, at: '= [[31]] − 1', text: 'A' }
      - say: 'So the top of the second fraction is negative 1 over 3 times $x$, minus 2 over 3. Take out negative 1 over 3, and that is negative $x + 2$ over 3.'
        write: '$Bx + C = -\dfrac{1}{3}x - \dfrac{2}{3} = -\dfrac{x + 2}{3}$'
      - say: 'Put $A$ and this top back into the two fractions. The 3s move down into the denominators.'
        write: '$\dfrac{1}{x^{3} - 1} = \dfrac{\tfrac{1}{3}}{x - 1} - \dfrac{\tfrac{x + 2}{3}}{x^{2} + x + 1}$'
      - say: 'So the answer is 1 over $3(x - 1)$, minus $x + 2$ over $3(x^{2} + x + 1)$. That is answer choice C.'
        write: '$= \dfrac{1}{3(x - 1)} - \dfrac{x + 2}{3(x^{2} + x + 1)}$'
        answer: true
    traps:
      A: 'You went for A. It drops the factor of 3 everywhere, which happens if $A$ is taken as 1. Putting $x = 1$ gives $3A = 1$, so $A$ is 1 over 3.'
      B: 'You went for B. The sign between the fractions is wrong. $B$ is negative 1 over 3 and $C$ is negative 2 over 3, so the second fraction is subtracted.'
      D: 'You went for D. The top of the second fraction should be $x + 2$, not $x - 2$: $C$ is negative 2 over 3, so $Bx + C$ is negative 1 over 3 times $x + 2$.'

  22:
    moments:
