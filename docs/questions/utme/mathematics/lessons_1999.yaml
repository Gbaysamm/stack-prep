  23:
    moments:
      - say: 'A point $P$ at $x$, $y$ is the same distance from $V$ at 1, 1 as from $W$ at 3, 5. We want the equation of its path, the locus.'
        write: '$V = (1,\ 1),\ W = (3,\ 5),\ PV = PW$'
        point:
          - { figure: sketch, kind: circle, target: 'V' }
          - { figure: sketch, kind: circle, target: 'W' }
      - say: 'Let me draw a diagram of the circle first, so we can see what we are working with.'
        show_sketch: true
      - say: 'A point that is always the same distance from two fixed points lies on a straight line: the perpendicular bisector of $VW$. Equal distances have equal squares, so let''s square both. That removes the square roots.'
        write: 'Equal distances: $PV = PW \Rightarrow PV^{2} = PW^{2}$'
        point:
          - { figure: sketch, kind: circle, target: 'locus of P', text: 'perpendicular bisector' }
      - say: 'The distance formula: the distance squared equals the change in $x$ squared plus the change in $y$ squared.'
        write: 'Distance formula: $d^{2} = (x_{2} - x_{1})^{2} + (y_{2} - y_{1})^{2}$'
      - say: 'By the distance formula, $PV$ squared is the difference in $x$ squared, plus the difference in $y$ squared: $x - 1$ squared plus $y - 1$ squared.'
        write: 'Distance formula: $PV^{2} = (x - 1)^{2} + (y - 1)^{2}$'
        point:
          - { figure: sketch, kind: highlight, target: PV }
      - say: 'In the same way, $PW$ squared is $x - 3$ squared plus $y - 5$ squared.'
        write: '$PW^{2} = (x - 3)^{2} + (y - 5)^{2}$'
        point:
          - { figure: sketch, kind: highlight, target: PW }
      - say: 'Now set the two equal.'
        write: '$(x - 1)^{2} + (y - 1)^{2} = (x - 3)^{2} + (y - 5)^{2}$'
        point:
          - { line: 2, kind: underline, at: 'PV2 = PW2', text: 'equal' }
          - { line: 6, kind: move, from: { line: 4, at: '= [[(x − 1)2 + (y − 1)2]]' }, at: '[[(x − 1)2 + (y − 1)2]] =', text: 'PV²' }
          - { line: 6, kind: move, from: { line: 5, at: '= [[(x − 3)2 + (y − 5)2]]' }, at: '= [[(x − 3)2 + (y − 5)2]]', text: 'PW²' }
      - say: 'Expand the left. $x - 1$ squared is $x^{2} - 2x + 1$, and $y - 1$ squared is $y^{2} - 2y + 1$.'
        write: 'Left: $(x - 1)^{2} + (y - 1)^{2} = x^{2} - 2x + 1 + y^{2} - 2y + 1$'
      - say: 'Expand the right. $x - 3$ squared is $x^{2} - 6x + 9$, and $y - 5$ squared is $y^{2} - 10y + 25$.'
        write: 'Right: $(x - 3)^{2} + (y - 5)^{2} = x^{2} - 6x + 9 + y^{2} - 10y + 25$'
      - say: 'Now put the two expanded sides together.'
        write: '$x^{2} - 2x + 1 + y^{2} - 2y + 1 = x^{2} - 6x + 9 + y^{2} - 10y + 25$'
      - say: 'The $x^{2}$ and $y^{2}$ are on both sides, so they cancel. That is why the locus is a straight line. Also, 1 plus 1 is 2, and 9 plus 25 is 34.'
        write: '$-2x - 2y + 2 = -6x - 10y + 34$'
      - say: 'Add $6x$ and $10y$ to both sides, and subtract 2 from both sides.'
        write: '$-2x + 6x - 2y + 10y = 34 - 2$'
        point:
          - { line: 11, kind: move, from: { line: 10, at: '= [[−6x]]' }, at: '+ 6x', text: 'across' }
          - { line: 11, kind: move, from: { line: 10, at: '[[−10y]]' }, at: '+ 10y', text: 'across' }
          - { line: 11, kind: move, from: { line: 10, at: '[[+ 2]] =' }, at: '34 [[− 2]]', text: 'across' }
      - say: 'Negative $2x$ plus $6x$ is $4x$. Negative $2y$ plus $10y$ is $8y$. And 34 minus 2 is 32.'
        write: '$4x + 8y = 32$'
      - say: 'Every number divides by 4. $4x$ over 4 is $x$, $8y$ over 4 is $2y$, and 32 over 4 is 8.'
        write: '$x + 2y = 8$'
      - say: 'The midpoint of two points is the average of their $x$ coordinates and the average of their $y$ coordinates.'
        write: 'Midpoint formula: $\left(\dfrac{x_{1} + x_{2}}{2},\ \dfrac{y_{1} + y_{2}}{2}\right)$'
      - say: 'Let''s check with the midpoint of $VW$, which must lie on the locus. Its $x$ is 1 plus 3 over 2, which is 2, and its $y$ is 1 plus 5 over 2, which is 3.'
        write: 'Midpoint of $VW$: $\left(\dfrac{1 + 3}{2},\ \dfrac{1 + 5}{2}\right) = (2,\ 3)$'
      - say: 'Put 2 and 3 into our line: 4 plus 2 times 3 is 2 plus 6, which is 8. It fits.'
        write: 'Check: $2 + 2(3) = 2 + 6 = 8$'
        point:
          - { line: 13, kind: box, text: 'our line' }
          - { line: 16, kind: move, from: { line: 15, at: '= ([[2]], 3)' }, at: '[[2]] + 2(', text: 'x' }
          - { line: 16, kind: move, from: { line: 15, at: '= (2, [[3]])' }, at: '2([[3]])', text: 'y' }
      - say: 'So the locus is $x + 2y = 8$, which is answer choice D.'
        write: 'Locus: $x + 2y = 8$'
        point:
          - { figure: sketch, kind: label, target: 'locus of P', text: 'x + 2y = 8' }
        answer: true
    traps:
      A: 'You went for $2x + 2y = 9$. Try the midpoint 2, 3: 4 plus 6 is 10, not 9. The midpoint must be on the locus, and $x + 2y = 8$ passes that test.'
      B: 'You went for $2x + 3y = 8$. At the midpoint 2, 3 that gives 4 plus 9, which is 13, not 8. Expanding carefully gives $4x + 8y = 32$, which is $x + 2y = 8$.'
      C: 'You went for $2x + y = 9$. At the midpoint 2, 3 that gives 4 plus 3, which is 7, not 9. The correct working gives $x + 2y = 8$.'

  24:
    moments:
      - say: 'In the frustum, the top radius is 3 cm, the bottom radius is 6 cm, and the vertical height is 4 cm. We want the slant side $l$.'
        write: 'Top radius $3$ cm, bottom radius $6$ cm, height $4$ cm'
        point:
          - { figure: 0, kind: circle, target: '3 cm', text: 'top radius' }
          - { figure: 0, kind: circle, target: '6 cm', text: 'bottom radius' }
          - { figure: 0, kind: circle, target: '4 cm', text: 'height' }
      - say: 'Hidden in the frustum is a right-angled triangle. Drop a line straight down from the edge of the top to the base. The triangle has the vertical height, a flat piece along the base, and the slant side $l$.'
        write: 'Right-angled triangle: height, flat piece, slant side $l$'
        point:
