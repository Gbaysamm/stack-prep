      - say: 'Sin 30 degrees is a half.'
        write: '$= 25 \times \dfrac{1}{2}$'
      - say: 'Half of 25 is 12.5.'
        write: '$= 12.5$ m'
      - say: 'But that 12.5 m is measured from his head, and his head is already 1.7 m above the ground. So we add his height.'
