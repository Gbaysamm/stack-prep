  48:
    moments:
      - section: 'The question'
        say: 'A student found the mean of 5 numbers as 45.3, but his total was short by 20.5. We want the correct mean.'
        write: 'Correct mean $= ?$'
      - section: 'Solution'
        say: 'Solution. The givens are that $n$, the number of values, is 5, his mean, $x$ bar, is 45.3, and his total was short by 20.5.'
        write: 'Solution. $n = 5$, $\ \bar{x} = 45.3$, total short by $20.5$'
      - say: 'The mean is the sum of the values, sigma $x$, over $n$. Multiply both sides by $n$, and the sum is $n$ times $x$ bar.'
        write: '$\bar{x} = \dfrac{\sum x}{n} \Rightarrow \sum x = n\bar{x}$'
      - say: 'Substitute his figures, so 5 times 45.3. 5 times 45 is 225, and 5 times 0.3 is 1.5. So his total was 226.5.'
        write: 'His $\sum x = 5 \times 45.3 = 226.5$'
      - say: 'Short by means too small, so the missing 20.5 is added back. 226.5 plus 20.5 is 247.'
        write: 'Correct $\sum x = 226.5 + 20.5 = 247$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '[[226.5]]'}, at: '=[[226.5]]+', text: 'his total'}
      - say: 'There are still 5 numbers. So the correct mean is the correct sum over 5.'
        write: 'Correct $\bar{x} = \dfrac{247}{5}$'
      - say: 'Divide 247 by 5. 5 into 24 goes 4, remainder 4, then 5 into 47 goes 9, remainder 2, then 5 into 20 goes 4. So the mean is 49.4.'
        write: '$\therefore$ Correct $\bar{x} = 49.4$'
      - section: 'Check'
        say: 'To check, the missing 20.5, shared among 5 numbers, raises the mean by 20.5 over 5, which is 4.1. And 45.3 plus 4.1 is 49.4.'
        write: 'Check: $45.3 + \dfrac{20.5}{5} = 45.3 + 4.1 = 49.4$ ✓'
      - section: 'Answer'
        say: 'So the correct mean is 49.4, which is option C.'
        write: '$\therefore$ Correct mean $= 49.4$'
        answer: true
    traps:
      A: 'You went for 24.8. That is 45.3 minus 20.5, taking the correction off the mean. The 20.5 belongs to the total, and it is added, so 247 over 5 is 49.4.'
      B: 'You went for 41.2. That subtracts 20.5 from the total. Short by means too small, so the 20.5 is added, giving 247, and 247 over 5 is 49.4.'
      D: 'You went for 65.8. That adds the whole 20.5 to the mean. It belongs to the total, so the mean rises by only 20.5 over 5, which is 4.1, giving 49.4.'

  49:
    moments:
      - section: 'The question'
        say: 'A state budget gives Agriculture 25 million naira, Education 20 million, Women affairs 35 million, and Commerce and Industries 20 million. We want the pie chart angle for Agriculture.'
        write: 'Angle for Agriculture $= ?$'
      - section: 'Solution'
        say: 'Solution. Draw the table with each ministry, its allocation in millions of naira, and its sectoral angle, which is allocation over total, times 360 degrees.'
        write: 'Sectoral angle $= \dfrac{\text{allocation}}{\text{total}} \times 360^{\circ}$'
        diagram: {id: t, kind: table, columns: [Ministry, '₦ million', 'Sectoral angle'], rows: [[Agriculture, 25, ''], [Education, 20, ''], [Women affairs, 35, ''], [Commerce, 20, '']]}
      - say: 'First the total allocation, in millions of naira.'
        write: 'Total $= 25 + 20 + 35 + 20$'
      - say: '25 plus 20 is 45, plus 35 is 80, plus 20 is 100 million naira.'
        write: '$= 100$ million'
        diagram_do:
          - {id: t, op: total, part: 'col:2', 'on': '100 million'}
      - section: 'Agriculture'
        say: 'Substitute for Agriculture, so 25 over the total of 100, times 360 degrees.'
        write: 'Agriculture $= \dfrac{25}{100} \times 360^{\circ}$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '= 100'}, at: '100', text: 'total'}
      - say: '25 over 100 is a quarter.'
        write: '$= \dfrac{1}{4} \times 360^{\circ}$'
      - say: 'A quarter of 360 is 90 degrees.'
        write: '$= 90^{\circ}$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,3', text: '90°', 'on': '90 degrees'}
      - section: 'Check'
        say: 'Check that the sectors fill the circle. In the same way, Education and Commerce are 72 degrees each, and Women affairs is 126 degrees.'
        write: 'Others: $72^{\circ}$, $126^{\circ}$, $72^{\circ}$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:2,3', text: '72°', 'on': '72 degrees'}
          - {id: t, op: fill, part: 'cell:3,3', text: '126°', 'on': '126'}
          - {id: t, op: fill, part: 'cell:4,3', text: '72°', 'on': 'each'}
      - say: '90 plus 72 plus 126 plus 72 is 360 degrees. The pie is full.'
        write: '$90 + 72 + 126 + 72 = 360^{\circ}\ \checkmark$'
        diagram: {id: p, kind: pie, show: angle, sectors: [{label: Agriculture, value: 25, colour: green}, {label: Education, value: 20}, {label: Women affairs, value: 35}, {label: Commerce, value: 20}]}
      - section: 'Answer'
        say: 'Therefore the angle for Agriculture is 90 degrees, which is answer choice D.'
        write: '$\therefore$ Agriculture $= 90^{\circ}$'
        answer: true
    traps:
      A: 'You went for 25 degrees. That reads the 25 million straight off as an angle. Agriculture is 25 over 100, times 360, which is 90 degrees.'
      B: 'You went for 45 degrees. That is half of the right angle. Agriculture is a quarter of the budget, and a quarter of 360 is 90 degrees.'
      C: 'You went for 50 degrees. Agriculture is 25 out of a total of 100, which is a quarter, and a quarter of 360 is 90 degrees.'

  50:
    moments:
      - section: 'The question'
        say: 'Four numbers have a mean of 5 and a mean deviation, M.D., of 3. The first three have an M.D. of 2 about the same mean. We want the fourth number.'
        write: 'Four numbers: $\bar{x} = 5$, M.D. $= 3$; first three: M.D. $= 2$'
      - section: 'Solution'
        say: 'Solution. Let $x_4$ be the fourth number.'
        write: 'Let the fourth number be $x_{4}$'
      - say: 'The M.D. is the sum of the absolute deviations, the distances from the mean with the minus signs ignored, over $n$.'
        write: 'M.D. $= \dfrac{\sum |x - \bar{x}|}{n}$'
      - say: 'Multiply both sides by $n$, so the sum of the absolute deviations is $n$ times the M.D.'
        write: '$\therefore \sum |x - \bar{x}| = n \times$ M.D.'
      - section: 'The sums'
        say: 'For all four numbers, $n$ is 4 and the M.D. is 3. So their absolute deviations add to 4 times 3, which is 12.'
        write: 'All four: $\sum |x - \bar{x}| = 4 \times 3 = 12$'
        doodle: {name: 'custom:1999_q50_a', id: dist, caption: '12 pieces of distance', size: scene}
      - say: 'For the first three, $n$ is 3 and the M.D. is 2, about the same mean of 5. Their absolute deviations add to 3 times 2, which is 6.'
        write: 'First three: $\sum |x - \bar{x}| = 3 \times 2 = 6$'
      - say: 'So the fourth number''s absolute deviation is what is left, 12 minus 6, which is 6.'
        write: '$|x_{4} - 5| = 12 - 6 = 6$'
        doodle_do:
          - {id: dist, op: stage, stage: 'custom:1999_q50_a2'}
      - section: 'Solve'
        say: 'An absolute value of 6 means the inside is 6 or minus 6, so the fourth number is 6 above the mean or 6 below it.'
        write: '$x_{4} - 5 = 6$ or $x_{4} - 5 = -6$'
        doodle_do:
          - {id: dist, op: stage, stage: 'custom:1999_q50_a3'}
      - say: 'Add 5 to both sides. 6 plus 5 is 11, and minus 6 plus 5 is minus 1.'
        write: '$x_{4} = 11$ or $x_{4} = -1$'
      - say: 'Minus 1 is not among the options. 11 is.'
        write: '$\therefore x_{4} = 11$'
        doodle_do:
          - {id: dist, op: cross, part: left, text: 'not an option'}
          - {id: dist, op: circle, part: right}
      - section: 'Check'
        say: 'Check with one set that fits, such as 3, 3, 3 and 11. They add to 20, so the mean is 5. The distances from 5 are 2, 2, 2 and 6, which add to 12. 12 over 4 is 3.'
        write: 'Check: $3, 3, 3, 11$: $\ \bar{x} = 5$, M.D. $= \dfrac{2 + 2 + 2 + 6}{4} = 3$ ✓'
      - section: 'Answer'
        say: 'So the fourth number is 11, which is option C.'
        write: '$\therefore$ fourth number $= 11$'
        answer: true
    traps:
      A: 'You went for 6. That is the fourth number''s distance from the mean, not the number itself. It is 6 away from 5, so it is 11.'
      B: 'You went for 10. Multiply each M.D. back into a sum, which gives 12 for all four and 6 for the first three. The fourth is 6 away from the mean of 5, so it is 11.'
      D: 'You went for 17. That uses the whole 12 as the distance. Take away the first three''s 6 first, leaving 6, so the number is 5 plus 6, which is 11.'
