        point:
          - { figure: sketch, kind: highlight, target: 'BC', text: 'opposite' }
          - { figure: sketch, kind: highlight, target: 'AB', text: 'hypotenuse' }
      - say: 'So sine of 30 degrees is $h$ over 25.'
        write: '$\sin 30^{\circ} = \dfrac{h}{25}$'
        point:
