      C: 'You went for 2, 1, 1. The derivative is $2ax + b$, so $2a = 2$, which makes $a$ equal to 1, not 2.'

  41:
    moments:
      - say: '$X$ and $Y$ are independent events. The probability of $X$ or $Y$ is 0.7, and the probability of $X$ is 0.4. We want the probability of $Y$.'
        write: '$P(X \cup Y) = 0.7,\quad P(X) = 0.4$'
        point:
          - { figure: sketch, kind: circle, target: 'X or Y: 0.7' }
          - { figure: sketch, kind: circle, target: '0.4', text: 'P(X)' }
      - say: 'Let me draw a Venn diagram, so we can see where everything belongs.'
        show_sketch: true
      - say: 'We need two rules. First, independent means the probability of both happening is the product of their separate probabilities. Picture two separate spinners: how one lands does not change the other.'
        write: 'Independent: $P(X \cap Y) = P(X) \times P(Y)$'
        point:
          - { figure: sketch, kind: circle, target: '0.4p', text: 'both' }
        doodle: {name: 'custom:2000_q41_a', id: spin, caption: 'Two spinners, spun separately'}
      - say: 'Second, the addition rule: $P$ of $X$ or $Y$ equals $P$ of $X$, plus $P$ of $Y$, minus $P$ of both. We subtract both because it was counted twice.'
        write: 'Addition rule: $P(X \cup Y) = P(X) + P(Y) - P(X \cap Y)$'
      - say: 'Now put the independence rule into the addition rule, in place of $P$ of both.'
        write: '$P(X \cup Y) = P(X) + P(Y) - P(X) \times P(Y)$'
        point:
          - { line: 2, kind: arrow, text: 'independent' }
      - say: 'Let''s call $P$ of $Y$ just $p$: the unknown share of spinner $Y$. Put in 0.7 for $X$ or $Y$, and 0.4 for $X$.'
        write: '$0.7 = 0.4 + p - 0.4 \times p$'
        point:
          - { line: 5, kind: move, from: { line: 0, at: 'Y) = [[0.7]]' }, at: '[[0.7]] =', text: 'X or Y' }
          - { line: 5, kind: move, from: { line: 0, at: 'P(X) = [[0.4]]' }, at: '= [[0.4]] +', text: 'X' }
          - { figure: sketch, kind: circle, target: 'p = ?', text: 'P(Y) = p' }
        doodle_do:
          - {id: spin, op: circle, part: spinx, text: '0.4'}
          - {id: spin, op: pulse, part: spiny}
      - say: '$p$ minus 0.4 $p$ is 0.6 $p$, because 1 minus 0.4 is 0.6.'
        write: '$0.7 = 0.4 + 0.6p$'
      - say: 'Subtract 0.4 from both sides. 0.7 minus 0.4 is 0.3.'
        write: '$0.6p = 0.7 - 0.4 = 0.3$'
        point:
          - { line: 7, kind: move, from: { line: 6, at: '= [[0.4]] +' }, at: '− 0.4', text: 'across' }
      - say: 'Divide both sides by 0.6. 0.3 is half of 0.6, so $p$ is 0.5: spinner $Y$ is half shaded.'
        write: '$p = \dfrac{0.3}{0.6} = 0.5$'
        point:
          - { line: 8, kind: move, from: { line: 7, at: '[[0.6]]p' }, at: 'p = [[0.6]]', text: 'divide' }
        doodle_do:
          - {id: spin, op: stage, stage: 'custom:2000_q41_a2'}
      - say: 'Let''s check. $P$ of both, both spinners landing in their shaded parts, is 0.4 times 0.5, which is 0.2.'
        write: 'Check: $P(X \cap Y) = 0.4 \times 0.5 = 0.2$'
        doodle_do:
          - {id: spin, op: label, part: half, text: 'both: 0.4 × 0.5 = 0.2'}
      - say: 'Then 0.4 plus 0.5 minus 0.2 is 0.7, which matches the question.'
        write: '$P(X \cup Y) = 0.4 + 0.5 - 0.2 = 0.7$'
      - say: 'So the probability of $Y$ is 0.50, which is answer choice B.'
        write: '$P(Y) = 0.50$'
        point:
          - { figure: sketch, kind: circle, target: 'p = ?', text: '0.5' }
        answer: true
    traps:
      A: 'You went for 0.30. That''s 0.7 minus 0.4, which forgets the overlap. The rule is $0.7 = 0.4 + p - 0.4p$, which gives $p = 0.5$.'
      C: 'You went for 0.57. Collect the $p$ terms carefully: $p$ minus 0.4$p$ is 0.6$p$, and 0.3 divided by 0.6 is 0.5.'
      D: 'You went for 1.80. A probability can never be more than 1, so this can be ruled out straight away. The answer is 0.5.'

  42:
    moments:
      - say: 'The numbers 0, $x + 2$, $3x + 6$ and $4x + 8$ have a mean of 4. We want their mean deviation.'
        write: '$0,\ x + 2,\ 3x + 6,\ 4x + 8$; mean $= 4$'
      - say: 'There is an unknown, $x$, in the numbers. So the first thing we need to do is use the mean to find $x$. Let''s add the four numbers.'
        write: 'Sum $= 0 + (x + 2) + (3x + 6) + (4x + 8)$'
      - say: 'Collect the $x$ terms: $x$ plus $3x$ plus $4x$ is $8x$. Collect the numbers: 2 plus 6 plus 8 is 16.'
        write: '$= 8x + 16$'
      - say: 'The mean is the sum of the values, divided by the number of values.'
        write: 'Mean $= \dfrac{\text{sum of the values}}{\text{number of values}}$'
      - say: 'The mean is the sum divided by 4, the number of values, and the question says it equals 4.'
        write: 'Mean: $\dfrac{8x + 16}{4} = 4$'
        point:
          - { line: 4, kind: move, from: { line: 2, at: '= [[8x + 16]]' }, at: '4[[8x + 16]]', text: 'the sum' }
      - say: 'Multiply both sides by 4. 4 times 4 is 16.'
        write: '$8x + 16 = 16$'
      - say: 'Subtract 16 from both sides, so $8x$ is 0, and $x$ is 0.'
        write: '$8x = 0,\quad x = 0$'
      - say: 'Now put $x$ equals 0 back into the numbers. $x + 2$ is 2, $3x + 6$ is 6, and $4x + 8$ is 8. Picture them as blocks on a see-saw: it balances at the mean, 4.'
        write: 'With $x = 0$: the numbers are $0,\ 2,\ 6,\ 8$'
        point:
          - { line: 6, kind: arrow, text: 'sub in' }
        doodle: {name: 'custom:2000_q42_a', id: seesaw, caption: 'The see-saw balances at the mean', size: scene}
      - say: 'Next, what is mean deviation? It is the average distance of the numbers from the mean, with every distance counted as positive. Here the mean is 4.'
        write: 'Mean deviation $= \dfrac{\text{sum of distances from the mean}}{\text{number of values}}$'
      - say: 'So we find how far each block is from the balance point, 4. 0 is 4 away, and 2 is 2 away.'
        write: '$|0 - 4| = 4,\quad |2 - 4| = 2$'
        doodle_do:
          - {id: seesaw, op: stage, stage: 'custom:2000_q42_a2'}
      - say: '6 is 2 away on the other side, and 8 is 4 away.'
        write: '$|6 - 4| = 2,\quad |8 - 4| = 4$'
        doodle_do:
          - {id: seesaw, op: pulse, part: dists}
      - say: 'Add the distances on the see-saw: 4 plus 2 plus 2 plus 4 is 12.'
        write: 'Sum of distances $= 4 + 2 + 2 + 4 = 12$'
        point:
          - {line: 11, kind: highlight, at: '12', to: {doodle: seesaw, part: dists}}
      - say: 'Divide by 4, the number of blocks. 12 divided by 4 is 3.'
        write: 'Mean deviation $= \dfrac{12}{4} = 3$'
        point:
          - { line: 8, kind: box, text: 'the rule' }
          - { line: 12, kind: move, from: { line: 11, at: '= [[12]]' }, at: '= 4[[12]]', text: 'sum of distances' }
        doodle_do:
          - {id: seesaw, op: circle, part: pivot, text: '12 ÷ 4 = 3'}
      - say: 'So the mean deviation is 3, which is answer choice C.'
        write: 'M.D. $= 3$'
        answer: true
    traps:
      A: 'You went for 0. That''s what you get if you keep the signs: deviations from the mean always add to zero. Mean deviation uses distances, which are all positive, giving 3.'
      B: 'You went for 2. The distances are 4, 2, 2 and 4. Their total is 12, and 12 divided by 4 is 3.'
      D: 'You went for 4. That''s the mean itself. The mean deviation is the average distance from it, which is 12 over 4, or 3.'

  43:
    moments:
      - say: 'We want the number of ways to arrange the letters of the word MATHEMATICS. Picture each letter on its own tile, ready to be shuffled.'
        write: 'MATHEMATICS'
        doodle: {name: 'custom:2000_q43_a', id: tiles, caption: 'M, A and T each appear twice'}
      - say: 'First, count the tiles: M, A, T, H, E, M, A, T, I, C, S. That is 11 letters.'
        write: 'Number of letters $= 11$'
        doodle_do:
          - {id: tiles, op: underline, part: count}
      - say: 'If all 11 letters were different, we could arrange them in 11 factorial ways: 11 choices for the first place, 10 for the next, and so on down to 1.'
        write: 'All different: $11! = 11 \times 10 \times 9 \times \cdots \times 1$'
      - say: 'But some letters repeat. Look at the pink tiles: M appears twice.'
        write: 'M: $2$ times'
        point:
          - {line: 3, kind: highlight, at: '2', to: {doodle: tiles, part: pair-m}}
        doodle_do:
          - {id: tiles, op: circle, part: pair-m, text: '2 Ms'}
      - say: 'The yellow tiles: A appears twice as well.'
        write: 'A: $2$ times'
        point:
          - {line: 4, kind: highlight, at: '2', to: {doodle: tiles, part: pair-a}}
        doodle_do:
          - {id: tiles, op: circle, part: pair-a, text: '2 As'}
      - say: 'And the blue tiles: T also appears twice. The other letters, H, E, I, C and S, appear once each.'
        write: 'T: $2$ times; H, E, I, C, S: once each'
        point:
          - {line: 5, kind: highlight, at: '2', to: {doodle: tiles, part: pair-t}}
        doodle_do:
          - {id: tiles, op: circle, part: pair-t, text: '2 Ts'}
      - say: 'Why does a repeat matter? If you swap the two Ms, you get exactly the same word. So 11 factorial counts every word twice over for the Ms, and we fix that by dividing by 2 factorial.'
        write: 'For the two Ms: divide by $2!$'
      - say: 'The same happens for the two As and the two Ts, so we divide by 2 factorial for each of them too.'
        write: 'For the two As and the two Ts: divide by $2!$ and $2!$'
      - say: 'Each 2 factorial is 2 times 1, which is 2. So altogether we are dividing by 2 times 2 times 2, which is 8.'
        write: '$2! \times 2! \times 2! = 2 \times 2 \times 2 = 8$'
      - say: 'So the number of arrangements is 11 factorial over 2 factorial, 2 factorial, 2 factorial, which is answer choice C.'
        write: 'Arrangements $= \dfrac{11!}{2!\,2!\,2!}$'
        point:
          - { line: 1, kind: circle, at: '= 11', text: 'letters' }
          - { line: 8, kind: arrow, text: 'repeats' }
        answer: true
    traps:
      A: 'You went for 11 factorial over 9 factorial times 2 factorial. That''s a choosing formula, not an arrangement of letters. We divide by 2 factorial for each of M, A and T.'
      B: 'You went for 11 factorial over 9 factorial, 2 factorial, 2 factorial. There is no 9 factorial here. Only the repeated letters matter: M, A and T, each twice.'
      D: 'You went for 11 factorial over 2 factorial, 2 factorial. That counts only two repeated letters. M, A and T all appear twice, so we need three 2 factorials.'

  44:
    moments:
      - say: 'A die was rolled 240 times, and the table shows how often each number came up. Picture that one die, rolled over and over. We want the pie chart angle for the number 4.'
        write: 'Total rolls $= 240$'
        point:
          - { figure: sketch, kind: circle, target: 'total 240' }
        doodle: {name: 'custom:2000_q44_a', id: die, caption: 'One die, 240 rolls'}
      - say: 'Let me draw the pie chart, so we can see the parts of the whole.'
        show_sketch: true
      - say: 'In a pie chart, the full 360 degrees is shared out in proportion to the frequencies. So each number gets its fraction of the total, times 360 degrees.'
        write: 'Angle $= \dfrac{\text{frequency}}{\text{total}} \times 360^{\circ}$'
      - say: 'Let''s first check that the frequencies really add up to 240. 30 plus 43 is 73.'
        write: '$30 + 43 = 73$'
      - say: '73 plus 54 is 127, and 127 plus 40 is 167.'
        write: '$73 + 54 + 40 = 167$'
      - say: '167 plus 41 is 208, and 208 plus 32 is 240. That matches the 240 rolls.'
        write: '$167 + 41 + 32 = 240$'
      - say: 'From the table, the die showed 4 on 40 of those rolls.'
        write: 'Frequency of 4 $= 40$'
        point:
          - { figure: sketch, kind: circle, target: '4: 40' }
          - { figure: sketch, kind: circle, target: '4', text: 'sector for 4' }
        doodle_do:
          - {id: die, op: label, part: die, text: '4 came up 40 times'}
      - say: 'Now put 40 and the total, 240, into the formula.'
        write: 'Angle $= \dfrac{40}{240} \times 360^{\circ}$'
        point:
          - { line: 2, kind: box, text: 'the rule' }
          - { line: 7, kind: move, from: { line: 6, at: '= [[40]]' }, at: '240[[40]]', text: 'frequency' }
          - { line: 7, kind: move, from: { line: 0, at: '= [[240]]' }, at: '= [[240]]40', text: 'total' }
      - say: '40 over 240 simplifies: divide top and bottom by 40, and we get 1 over 6. So the die showed 4 on one roll in every six.'
        write: '$= \dfrac{1}{6} \times 360^{\circ}$'
        doodle_do:
          - {id: die, op: circle, part: rolls, text: '1 roll in 6'}
      - say: '360 divided by 6 is 60.'
        write: '$= 60^{\circ}$'
        point:
          - { figure: sketch, kind: label, target: '4', text: '60°' }
      - say: 'So the angle for 4 is 60 degrees, which is answer choice D.'
        write: 'Angle for 4 $= 60^{\circ}$'
        answer: true
    traps:
      A: 'You went for 10 degrees. The share for 4 is 40 out of 240, which is 1 over 6, and 1 over 6 of 360 degrees is 60 degrees.'
      B: 'You went for 16 degrees. Multiply the share by 360: 40 over 240 times 360 is 60 degrees.'
      C: 'You went for 40 degrees. That''s the frequency, not the angle. We convert it using the total: 40 over 240 of 360 degrees is 60.'

  45:
    moments:
      - say: '$U$ is the whole numbers from 1 to 20. $E_2$ is the multiples of 4. Picture the numbers on slips in a box: we pick one at random, and we want the probability that it is not in $E_2$.'
        write: '$U = \{1, 2, 3, \ldots, 20\}$'
        point:
          - { figure: sketch, kind: circle, target: 'U', text: '1 to 20' }
        doodle: {name: 'custom:2000_q45_a', id: slips, caption: 'Pick one whole number, 1 to 20', size: scene}
      - say: 'Let me draw a Venn diagram, so we can see where everything belongs.'
        show_sketch: true
      - say: 'The question only asks about $E_2$, so $E_1$, the multiples of 3, is not needed. There are 20 numbers in $U$, all equally likely to be picked.'
        write: '$n(U) = 20$'
        point:
          - { figure: sketch, kind: circle, target: 'E₁', text: 'not needed' }
      - say: '$E_2$ is the multiples of 4. Counting in fours up to 20: 4, 8, 12, 16 and 20. Watch those slips turn pink.'
        write: '$E_2 = \{4, 8, 12, 16, 20\}$'
        point:
          - { figure: sketch, kind: circle, target: 'E₂', text: 'multiples of 4' }
        doodle_do:
          - {id: slips, op: stage, stage: 'custom:2000_q45_a2'}
      - say: 'That is 5 pink slips.'
        write: '$n(E_2) = 5$'
        point:
          - { figure: sketch, kind: circle, target: '4, 8' }
          - { figure: sketch, kind: circle, target: '12' }
          - { figure: sketch, kind: circle, target: '16, 20' }
        doodle_do:
          - {id: slips, op: circle, part: fours, text: '5 slips'}
      - say: 'So the probability that the number is in $E_2$ is 5 out of 20.'
        write: '$P(E_2) = \dfrac{5}{20}$'
        point:
          - { line: 5, kind: move, from: { line: 4, at: '= [[5]]' }, at: '= 20[[5]]', text: 'in E2' }
          - { line: 5, kind: move, from: { line: 2, at: '= [[20]]' }, at: '= [[20]]5', text: 'in U' }
      - say: 'Divide top and bottom by 5: 5 over 20 simplifies to 1 over 4, a quarter.'
        write: '$= \dfrac{1}{4}$'
      - say: 'But the question says not in $E_2$. The number is either in $E_2$ or not, so the two probabilities add up to 1.'
        write: '$P(\text{not } E_2) = 1 - P(E_2)$'
      - say: 'Put in the quarter we just found.'
        write: '$= 1 - \dfrac{1}{4}$'
        point:
          - { line: 8, kind: move, from: { line: 6, at: '= [[41]]' }, at: '− [[41]]', text: 'P(E2)' }
      - say: '1 minus a quarter is three quarters.'
        write: '$= \dfrac{3}{4}$'
      - say: 'Let''s check by counting the slips. 20 minus 5 is 15 slips that are not pink, and 15 over 20 is also three quarters.'
        write: 'Check: $\dfrac{20 - 5}{20} = \dfrac{15}{20} = \dfrac{3}{4}$'
        point:
          - { figure: sketch, kind: circle, target: '1, 2, 5, 7, 10, 11, 13, 14, 17, 19', text: 'not in E₂' }
          - { figure: sketch, kind: circle, target: '3, 6, 9', text: 'not in E₂' }
          - { figure: sketch, kind: circle, target: '15, 18', text: 'not in E₂' }
        doodle_do:
          - {id: slips, op: label, part: slips, text: '15 not pink'}
      - say: 'So the probability that it is not in $E_2$ is three quarters, which is answer choice A.'
        write: '$P(\text{not } E_2) = \dfrac{3}{4}$'
        answer: true
    traps:
      B: 'You went for 3 over 10. That''s the probability of picking a multiple of 3, which is $E_1$: 6 out of 20. The question is about $E_2$, the multiples of 4.'
      C: 'You went for a quarter. That''s the probability that the number is in $E_2$. The question says not in $E_2$, so subtract from 1 to get three quarters.'
      D: 'You went for 1 over 20. That''s the probability of one particular number. There are 15 numbers not in $E_2$, so the probability is 15 over 20, which is three quarters.'

  46:
    moments:
      - say: 'The cumulative frequency curve shows the ages of the students in a school. We want the age group that 70% of the students belong to.'
        write: 'Want: the age group holding $70\%$ of the students'
        point:
          - { figure: 0, kind: circle, target: 'Age (years)', text: 'ages' }
      - say: 'A cumulative frequency curve gives running totals. Its height at any age is the number of students at or below that age.'
        write: 'Height of curve $=$ number of students at or below that age'
        point:
          - { figure: 0, kind: arrow, target: { x: 210, y: 159 }, text: 'height = count' }
      - say: 'First, the total. In the diagram, the curve levels off at the top at 100, so there are 100 students. Picture them here, each figure standing for 2 students.'
        write: 'Total $= 100$ students'
        point:
          - { figure: 0, kind: circle, target: '100', text: 'levels off' }
        doodle: {name: student-small, id: school, caption: '100 students: each figure is 2', repeat: 50, layout: grid}
      - say: '70% of 100 is 70. So we want the group that holds 70 students.'
        write: '$70\% \times 100 = 70$ students'
      - say: 'To count the students in a group, read the curve at both ends of the group and subtract: the reading at the top end minus the reading at the bottom end.'
        write: 'Number in group $=$ reading at top end $-$ reading at bottom end'
      - say: 'Let''s try 17.5 to 20.5. In the diagram, the curve at 17.5 reads 30, and at 20.5 it reads 100.'
        write: 'At $17.5$: $30$; at $20.5$: $100$'
        point:
          - { figure: 0, kind: circle, target: '17.5', text: 'reads 30' }
          - { figure: 0, kind: circle, target: '20.5', text: 'reads 100' }
      - say: 'So that group holds 100 minus 30, which is 70 students. Watch the school split: the 30 younger ones to one side, the 70 aged 17.5 to 20.5 to the other. That is exactly 70%.'
        write: '$17.5$ to $20.5$: $100 - 30 = 70$'
        point:
          - { line: 4, kind: box, text: 'the rule' }
          - { line: 6, kind: move, from: { line: 5, at: '20.5: [[100]]' }, at: '[[100]] − 30', text: 'top end' }
          - { line: 6, kind: move, from: { line: 5, at: '17.5: [[30]]' }, at: '− [[30]] =', text: 'bottom end' }
        doodle_do:
          - {id: school, op: split, n: 15, text: '30 under 17.5 | 70 aged 17.5 to 20.5'}
      - say: 'Let''s check the other options the same way. At 15.5 the curve reads 10, and at 18.5 it reads 52. 52 minus 10 is 42.'
        write: '$15.5$ to $18.5$: $52 - 10 = 42$'
        point:
          - { figure: 0, kind: circle, target: '15.5', text: 'reads 10' }
          - { figure: 0, kind: circle, target: '18.5', text: 'reads 52' }
      - say: 'At 19.5 the curve reads 78, so 15.5 to 19.5 holds 78 minus 10, which is 68.'
        write: '$15.5$ to $19.5$: $78 - 10 = 68$'
        point:
          - { figure: 0, kind: circle, target: '19.5', text: 'reads 78' }
      - say: 'At 16.5 the curve reads 20, so 16.5 to 19.5 holds 78 minus 20, which is 58.'
        write: '$16.5$ to $19.5$: $78 - 20 = 58$'
        point:
          - { figure: 0, kind: circle, target: '16.5', text: 'reads 20' }
      - say: 'Only 17.5 to 20.5 holds 70 students, the big group in the picture, so 70% of the students are in the 17.5 to 20.5 group, which is answer choice D.'
        write: 'Age group: $17.5 - 20.5$'
        answer: true
        doodle_do:
          - {id: school, op: pulse}
    traps:
      A: 'You went for 15.5 to 18.5. Read the curve at both ends: 52 minus 10 is 42, which is only 42% of the students.'
      B: 'You went for 15.5 to 19.5. That holds 78 minus 10, which is 68 students. Close, but not 70. The group 17.5 to 20.5 holds exactly 70.'
      C: 'You went for 16.5 to 19.5. That holds 78 minus 20, which is 58 students. We need 70, and 17.5 to 20.5 gives 100 minus 30, which is 70.'

  47:
    moments:
      - say: 'We want the variance of $x$, $2x$, $3x$, $4x$ and $5x$. Picture them as towers of blocks, one block taller each time.'
        write: '$x,\ 2x,\ 3x,\ 4x,\ 5x$'
        doodle: {name: 'custom:2000_q47_a', id: towers, caption: 'x, 2x, 3x, 4x, 5x as towers'}
      - say: 'Variance measures spread: it is the average of the squared distances from the mean. So the first thing we need is the mean.'
        write: 'Variance $= \dfrac{\text{sum of } (\text{value} - \text{mean})^{2}}{\text{number of values}}$'
      - say: 'Add the five values: $x$ plus $2x$ plus $3x$ plus $4x$ plus $5x$ is $15x$.'
        write: 'Sum $= x + 2x + 3x + 4x + 5x = 15x$'
      - say: 'Divide by 5, the number of values. $15x$ over 5 is $3x$: if the towers were levelled out, each would be 3 blocks high.'
        write: 'Mean $= \dfrac{15x}{5} = 3x$'
        doodle_do:
          - {id: towers, op: stage, stage: 'custom:2000_q47_a2'}
      - say: 'Now take each value minus the mean, $3x$. $x$ minus $3x$ is negative $2x$, and $2x$ minus $3x$ is negative $x$.'
        write: '$x - 3x = -2x,\quad 2x - 3x = -x$'
        point:
          - { line: 4, kind: move, from: { line: 3, at: '= [[3x]]' }, at: 'x [[− 3x]] = −2x', text: 'mean' }
      - say: '$3x$ minus $3x$ is 0, $4x$ minus $3x$ is $x$, and $5x$ minus $3x$ is $2x$. Those are how far each tower sits from the dashed line.'
        write: '$3x - 3x = 0,\quad 4x - 3x = x,\quad 5x - 3x = 2x$'
        doodle_do:
          - {id: towers, op: stage, stage: 'custom:2000_q47_a3'}
      - say: 'Square each one. Negative $2x$ squared is $4x^{2}$, and negative $x$ squared is $x^{2}$. The minus signs disappear when we square.'
        write: '$(-2x)^{2} = 4x^{2},\quad (-x)^{2} = x^{2}$'
      - say: '0 squared is 0, $x$ squared is $x^{2}$, and $2x$ squared is $4x^{2}$.'
        write: '$0^{2} = 0,\quad (x)^{2} = x^{2},\quad (2x)^{2} = 4x^{2}$'
      - say: 'Add the squares: 4 plus 1 plus 0 plus 1 plus 4 is 10, so the total is $10x^{2}$.'
        write: 'Sum of squares $= 4x^{2} + x^{2} + 0 + x^{2} + 4x^{2} = 10x^{2}$'
        doodle_do:
          - {id: towers, op: label, part: devs, text: 'squared: 4 + 1 + 0 + 1 + 4'}
      - say: 'Now divide that total by 5, the number of values.'
        write: 'Variance $= \dfrac{10x^{2}}{5}$'
        point:
          - { line: 9, kind: move, from: { line: 8, at: '= [[10x2]]' }, at: '= 5[[10x2]]', text: 'sum of squares' }
      - say: '10 divided by 5 is 2.'
        write: '$= 2x^{2}$'
      - say: 'So the variance is $2x^{2}$, which is answer choice B.'
        write: 'Variance $= 2x^{2}$'
        answer: true
    traps:
      A: 'You went for $x\sqrt{2}$. That''s the standard deviation, the square root of the variance. The variance itself is $2x^{2}$.'
      C: 'You went for $x^{2}$. The squared deviations add to $10x^{2}$, and dividing by 5 gives $2x^{2}$, not $x^{2}$.'
      D: 'You went for $3x$. That''s the mean. The variance is the average squared deviation, which is $2x^{2}$.'

  48:
    moments:
      - say: 'We have a list of 22 numbers, and we want the range plus the mode.'
        write: 'Want: range $+$ mode'
      - say: 'These are two separate things, so we find each one first. Picture the 22 numbers sorted into piles, one pile for each value. The range is the largest value minus the smallest value.'
        write: 'Range $=$ largest $-$ smallest'
        doodle: {name: 'custom:2000_q48_a', id: piles, caption: 'One pile of blocks for each value', size: scene}
      - say: 'Scanning the list, nothing is bigger than 10, and nothing is smaller than 4.'
        write: 'Largest $= 10$, smallest $= 4$'
      - say: 'So the range is 10 minus 4, which is 6: from the pile at one end to the pile at the other.'
        write: 'Range $= 10 - 4 = 6$'
        doodle_do:
          - {id: piles, op: arrow, part: p4, to_part: p10}
          - {id: piles, op: label, part: p4, text: 'range 10 − 4 = 6'}
      - say: 'Now the mode: the value that appears most often. Let''s count each pile. 10 appears 7 times.'
        write: '$10$: $7$ times'
        doodle_do:
          - {id: piles, op: pulse, part: p10}
      - say: '9 appears 4 times. 8 appears 3 times, and so does 7.'
        write: '$9$: $4$ times; $8$: $3$ times; $7$: $3$ times'
      - say: '6 and 5 appear twice each, and 4 appears once.'
        write: '$6$: $2$ times; $5$: $2$ times; $4$: $1$ time'
      - say: 'Check that the counts cover all 22 numbers: 7 plus 4 plus 3 plus 3 plus 2 plus 2 plus 1 is 22. Good.'
        write: 'Check: $7 + 4 + 3 + 3 + 2 + 2 + 1 = 22$'
      - say: '10 appears most often, 7 times: it is the tallest pile. So the mode is 10.'
        write: 'Mode $= 10$'
        point:
          - {line: 8, kind: highlight, at: '10', to: {doodle: piles, part: p10}}
        doodle_do:
          - {id: piles, op: circle, part: p10, text: 'mode 10'}
      - say: 'Now add the range we found, 6, and the mode, 10. 6 plus 10 is 16.'
        write: 'Range $+$ mode $= 6 + 10 = 16$'
        point:
          - { line: 9, kind: move, from: { line: 3, at: '= [[6]]' }, at: '= [[6]] +', text: 'range' }
          - { line: 9, kind: move, from: { line: 8, at: '= [[10]]' }, at: '+ [[10]]', text: 'mode' }
      - say: 'So the sum of the range and the mode is 16, which is answer choice A.'
        write: '$= 16$'
        answer: true
    traps:
      B: 'You went for 14. That''s 10 plus 4, the mode plus the smallest value. The range is largest minus smallest, 10 minus 4, which is 6. So the sum is 16.'
      C: 'You went for 12. The range is 6 and the mode is 10, since 10 appears 7 times. 6 plus 10 is 16.'
      D: 'You went for 10. That''s the mode alone. We still need to add the range, 6, to get 16.'

  49:
    moments:
      - say: 'We are choosing a delegation of 3 from these 5 men and 3 women, with at least one man and at least one woman. We want the number of ways.'
        write: '$5$ men, $3$ women; choose $3$'
        doodle: {name: 'custom:2000_q49_a', id: people, caption: 'At least one man and one woman'}
      - say: 'At least one man and at least one woman is easiest by subtraction: count every delegation, then take away the ones with no woman and the ones with no man.'
        write: 'Wanted $=$ all $-$ all men $-$ all women'
      - say: 'The number of ways to choose $r$ things from $n$ is $n$ factorial, over $r$ factorial times $n - r$ factorial.'
        write: '$^{n}C_{r} = \dfrac{n!}{r!\,(n - r)!}$'
      - say: 'There are 5 plus 3, which is 8 people. The number of ways to choose 3 from 8 is 8 choose 3: 8 times 7 times 6, over 3 times 2 times 1.'
        write: 'All: $^{8}C_{3} = \dfrac{8 \times 7 \times 6}{3 \times 2 \times 1}$'
      - say: '8 times 7 is 56, and 56 times 6 is 336. On the bottom, 3 times 2 times 1 is 6.'
        write: '$= \dfrac{336}{6}$'
      - say: '336 divided by 6 is 56.'
        write: '$= 56$'
      - say: 'Now the ones with no woman: all 3 chosen from the 5 men in the top row. That is 5 choose 3: 5 times 4 times 3, over 3 times 2 times 1.'
        write: 'All men: $^{5}C_{3} = \dfrac{5 \times 4 \times 3}{3 \times 2 \times 1}$'
        doodle_do:
          - {id: people, op: circle, part: men, text: 'all men: 10 ways'}
      - say: '5 times 4 times 3 is 60, and 60 divided by 6 is 10.'
        write: '$= \dfrac{60}{6} = 10$'
        point:
          - {line: 7, kind: highlight, at: '10', to: {doodle: people, part: men}}
      - say: 'Now the ones with no man: all 3 chosen from the 3 women. There is only 1 way, taking all three of them.'
        write: 'All women: $^{3}C_{3} = 1$'
        doodle_do:
          - {id: people, op: circle, part: women, text: 'all women: 1 way'}
      - say: 'A delegation can''t be all men and all women at once, so we take both away from the 56 we found first. 56 minus 10 is 46, and 46 minus 1 is 45.'
        write: 'Wanted $= 56 - 10 - 1 = 45$'
        point:
          - { line: 9, kind: move, from: { line: 5, at: '= [[56]]' }, at: '= [[56]] −', text: 'all' }
          - { line: 9, kind: move, from: { line: 7, at: '= [[10]]' }, at: '− [[10]] −', text: 'all men' }
          - { line: 9, kind: move, from: { line: 8, at: '= [[1]]' }, at: '− [[1]] =', text: 'all women' }
      - say: 'Let''s check by counting directly. 2 men from the top row and 1 woman from the bottom: 5 choose 2 is 10, and 3 choose 1 is 3, so 10 times 3 is 30.'
        write: '2 men, 1 woman: $^{5}C_{2} \times {}^{3}C_{1} = 10 \times 3 = 30$'
        doodle_do:
          - {id: people, op: arrow, part: men, to_part: women}
          - {id: people, op: label, part: women, text: '2 men + 1 woman: 30'}
      - say: '1 man and 2 women: 5 choose 1 is 5, and 3 choose 2 is 3, so 5 times 3 is 15.'
        write: '1 man, 2 women: $^{5}C_{1} \times {}^{3}C_{2} = 5 \times 3 = 15$'
      - say: 'Together, 30 plus 15 is 45, the same as before.'
        write: 'Check: $30 + 15 = 45$'
      - say: 'So there are 45 ways, which is answer choice D.'
        write: 'Number of ways $= 45$'
        answer: true
    traps:
      A: 'You went for 15. That''s only the delegations with 1 man and 2 women. We also need 2 men and 1 woman, which gives 30 more, so 45.'
      B: 'You went for 28. That is 8 choose 2, which picks only 2 people. The delegation has 3: choosing 3 from 8 gives 56, and taking away the 10 all-men and 1 all-women delegations leaves 45.'
      C: 'You went for 30. That''s only 2 men and 1 woman. At least one of each also allows 1 man and 2 women, which adds 15, so 45.'

  50:
    moments:
      - say: 'The table shows the ages of pupils. We want the percentage who are over 15 years but less than 21 years.'
        write: 'Want: pupils over $15$ and under $21$, as a percentage'
      - say: 'A percentage needs the total first. Add all the frequencies: 6 plus 14 is 20, and 20 plus 15 is 35.'
        write: '$6 + 14 + 15 = 35$'
      - say: '35 plus 10 is 45, and 45 plus 5 is 50. So there are 50 pupils in all. Here they are.'
        write: 'Total $= 35 + 10 + 5 = 50$'
        doodle: {name: student-small, id: pupils, caption: '50 pupils', repeat: 50, layout: grid}
      - say: 'Now, which ages count? Over 15 means 16 or more. Less than 21 means 20 or less.'
        write: 'Over $15$ and under $21$: $16 \le \text{age} \le 20$'
      - say: 'The 16 to 18 group is inside that range, and it has 15 pupils.'
        write: '$16\text{-}18$: $15$ pupils'
      - say: 'The 19 to 20 group is inside too, with 10 pupils.'
        write: '$19\text{-}20$: $10$ pupils'
      - say: 'The 13 to 15 group stops at 15, which is not over 15, so it is out. And 21 to 23 starts at 21, which is not less than 21, so it is out too.'
        write: '$13\text{-}15$ and $21\text{-}23$: left out'
      - say: 'So the number of pupils we want is 15 plus 10, which is 25. Watch the pupils split: the 25 we want on one side, the other 25 on the other.'
        write: 'Number wanted $= 15 + 10 = 25$'
        point:
          - { line: 7, kind: move, from: { line: 4, at: '[[15]] pupils' }, at: '= [[15]] +', text: '16-18' }
          - { line: 7, kind: move, from: { line: 5, at: '[[10]] pupils' }, at: '+ [[10]]', text: '19-20' }
        doodle_do:
          - {id: pupils, op: split, n: 25, text: '25 aged 16 to 20 | 25 others'}
      - say: 'As a percentage of the 50 pupils: 25 over 50, times 100.'
        write: 'Percentage $= \dfrac{25}{50} \times 100\%$'
        point:
          - { line: 8, kind: move, from: { line: 7, at: '= [[25]]' }, at: '50[[25]]', text: 'wanted' }
          - { line: 8, kind: move, from: { line: 2, at: '= [[50]]' }, at: '= [[50]]25', text: 'total' }
      - say: '25 over 50 is a half: the two groups of pupils are the same size. And a half of 100 is 50.'
        write: '$= \dfrac{1}{2} \times 100\% = 50\%$'
        doodle_do:
          - {id: pupils, op: pulse}
      - say: 'So 50% of the pupils are over 15 but under 21, which is answer choice C.'
        write: '$50\%$ of the pupils'
        answer: true
    traps:
      A: 'You went for 35%. Count the pupils aged 16 to 20: 15 plus 10 is 25. Out of 50 pupils, that''s a half, which is 50%.'
      B: 'You went for 45%. Check the total first: it''s 50 pupils. Those over 15 and under 21 are 15 plus 10, which is 25, and 25 out of 50 is 50%.'
      D: 'You went for 60%. That includes the 21 to 23 group, but 21 is not less than 21. Leave those 5 out: 25 out of 50 is 50%.'
