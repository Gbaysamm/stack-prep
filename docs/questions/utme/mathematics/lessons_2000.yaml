  36:
    moments:
      - say: 'We have $y = 2x\cos 2x - \sin 2x$, and we want $\dfrac{dy}{dx}$ when $x$ is $\pi$ over 4.'
        write: '$y = 2x\cos 2x - \sin 2x$'
      - say: 'The first thing we need to do is differentiate. The first term, $2x\cos 2x$, is $2x$ times $\cos 2x$, a product, so it needs the product rule.'
        write: 'Product rule: $\dfrac{d}{dx}(uv) = u\dfrac{dv}{dx} + v\dfrac{du}{dx}$'
      - say: 'Let $u$ be $2x$ and $v$ be $\cos 2x$. The derivative of $2x$ is just 2.'
        write: '$u = 2x,\quad \dfrac{du}{dx} = 2$'
      - say: 'The derivative of $\cos 2x$ is negative $2\sin 2x$. The minus comes from differentiating cosine, and the 2 comes from the chain rule, because of the $2x$ inside.'
        write: '$v = \cos 2x,\quad \dfrac{dv}{dx} = -2\sin 2x$'
      - say: 'Now put these into the product rule: $2x$ times negative $2\sin 2x$, plus $\cos 2x$ times 2.'
        write: '$\dfrac{d}{dx}(2x\cos 2x) = 2x(-2\sin 2x) + \cos 2x \times 2$'
        point:
          - { line: 1, kind: box, text: 'the rule' }
          - { line: 4, kind: move, from: { line: 3, at: '= [[−2 sin 2x]]' }, at: '2x[[(−2 sin 2x)]]', text: 'dv/dx' }
          - { line: 4, kind: move, from: { line: 2, at: 'dxdu = [[2]]' }, at: '× [[2]]', text: 'du/dx' }
      - say: '$2x$ times negative 2 is negative $4x$. So this term gives negative $4x\sin 2x$, plus $2\cos 2x$.'
        write: '$= -4x\sin 2x + 2\cos 2x$'
      - say: 'Now the second term, negative $\sin 2x$. Sine differentiates to cosine, and the chain rule gives another 2, so it becomes negative $2\cos 2x$.'
        write: '$\dfrac{d}{dx}(-\sin 2x) = -2\cos 2x$'
      - say: 'Add the two results together, the one from the product rule and this one.'
        write: '$\dfrac{dy}{dx} = -4x\sin 2x + 2\cos 2x - 2\cos 2x$'
        point:
          - { line: 7, kind: move, from: { line: 5, at: '= [[−4x sin 2x + 2 cos 2x]]' }, at: '[[−4x sin 2x + 2 cos 2x]] −', text: 'product rule' }
          - { line: 7, kind: move, from: { line: 6, at: '= [[−2 cos 2x]]' }, at: '[[− 2 cos 2x]]', text: 'second term' }
      - say: 'The $2\cos 2x$ and the negative $2\cos 2x$ cancel each other out, leaving just negative $4x\sin 2x$.'
        write: '$= -4x\sin 2x$'
        point:
          - { line: 7, kind: strike, at: '+ 2 cos 2x', text: 'cancels' }
          - { line: 7, kind: strike, at: '− 2 cos 2x', text: 'cancels' }
      - say: 'Now put $x$ equals $\pi$ over 4 into this.'
        write: 'At $x = \dfrac{\pi}{4}$: $\dfrac{dy}{dx} = -4 \times \dfrac{\pi}{4} \times \sin\left(2 \times \dfrac{\pi}{4}\right)$'
      - say: '2 times $\pi$ over 4 is $\pi$ over 2, and sin of $\pi$ over 2 is 1.'
        write: '$= -4 \times \dfrac{\pi}{4} \times \sin\dfrac{\pi}{2} = -4 \times \dfrac{\pi}{4} \times 1$'
      - say: 'The 4 in front cancels the 4 underneath, leaving negative $\pi$.'
        write: '$= -\pi$'
      - say: 'So $\dfrac{dy}{dx}$ at $x$ equals $\pi$ over 4 is negative $\pi$, which is answer choice B.'
        write: '$\dfrac{dy}{dx} = -\pi$'
        answer: true
    traps:
      A: 'You went for $\pi$. The size is right, but the derivative of $\cos 2x$ is negative $2\sin 2x$, which makes the answer negative $\pi$.'
      C: 'You went for $\pi$ over 2. The derivative of $\cos 2x$ carries a 2 from the chain rule and a minus sign, giving $-4x\sin 2x$. At $\pi$ over 4 that''s negative $\pi$.'
      D: 'You went for negative $\pi$ over 2. You probably missed the 2 from the chain rule. The derivative is $-4x\sin 2x$, and at $\pi$ over 4 that''s negative $\pi$.'

  37:
    moments:
      - say: 'Let''s find the volume of this bowl. The region between the curve $y = x^{2} - 1$ and the lines $y = 0$ and $y = 3$ is spun all the way round the $y$-axis.'
        write: '$y = x^{2} - 1,\quad 0 \le y \le 3$'
        point:
          - { figure: sketch, kind: circle, target: 'y = x² − 1' }
          - { figure: sketch, kind: circle, target: 'y = 3' }
      - say: 'Let me sketch the graph, so we can see its shape.'
        show_sketch: true
      - say: 'When a region spins round the $y$-axis, it sweeps out thin circular discs, stacked up the $y$-axis. Picture the bowl built from them. Each disc has radius $x$, so its area is pi times $x$ squared.'
        write: 'Area of each disc $= \pi x^{2}$'
        point:
          - { figure: sketch, kind: circle, target: 'y', text: 'spin round here' }
          - { figure: sketch, kind: highlight, target: { x: 193, y: 130 }, text: 'radius x' }
        doodle: {name: 'custom:2000_q37_a', id: bowl, caption: 'A bowl made of thin discs'}
        doodle_do:
          - {id: bowl, op: circle, part: disc, text: 'area πx²'}
      - say: 'Adding up all those discs, from the bottom of the bowl at $y = 0$ to the rim at $y = 3$, gives the volume. So $V$ equals pi times the integral from 0 to 3 of $x$ squared, $dy$.'
        write: '$V = \pi\displaystyle\int_{0}^{3} x^{2}\,dy$'
        point:
          - { line: 0, kind: circle, at: '0 ≤ y ≤ 3', text: 'the limits' }
        doodle_do:
          - {id: bowl, op: pulse, part: discs}
      - say: 'But we are integrating with respect to $y$, so we need $x$ squared written in terms of $y$. For that, let''s go back to the equation of the curve.'
        write: 'From $y = x^{2} - 1$:'
        point:
          - { line: 0, kind: arrow, at: 'y = x2 − 1', text: 'the curve' }
          - { figure: sketch, kind: circle, target: 'y = x² − 1' }
      - say: 'Add 1 to both sides, and $x$ squared equals $y$ plus 1.'
        write: '$x^{2} = y + 1$'
        point:
          - { line: 5, kind: move, from: { line: 4, at: '[[− 1]]' }, at: '+ 1', text: 'across' }
      - say: 'Now we replace the $x$ squared in our integral with $y$ plus 1.'
        write: '$V = \pi\displaystyle\int_{0}^{3} (y + 1)\,dy$'
        point:
          - { line: 3, kind: strike, at: 'x2' }
          - { line: 6, kind: move, from: { line: 5, at: '= [[y + 1]]' }, at: '(y + 1)', text: 'swap it in' }
      - say: 'The rule for integrating a power of $x$: raise the power by 1, and divide by the new power.'
        write: 'Integration: $\displaystyle\int x^{n}\,dx = \dfrac{x^{n + 1}}{n + 1} + c$'
      - say: 'Let''s integrate. $y$ integrates to $y$ squared over 2, and 1 integrates to $y$.'
        write: '$= \pi\left[\dfrac{y^{2}}{2} + y\right]_{0}^{3}$'
      - say: 'Now we put in the limits: the value at the top limit, 3, minus the value at the bottom limit, 0. Watch the bowl fill from the bottom to the rim.'
        write: '$= \pi\left[\left(\dfrac{3^{2}}{2} + 3\right) - \left(\dfrac{0^{2}}{2} + 0\right)\right]$'
        point:
          - { line: 0, kind: underline, at: '0 ≤ y ≤ 3', text: 'top 3, bottom 0' }
        doodle_do:
          - {id: bowl, op: fill, to: 1}
      - say: 'At 3, 3 squared is 9, so that bracket is 9 over 2 plus 3. At 0, everything is zero, so the second bracket disappears.'
        write: '$= \pi\left(\dfrac{9}{2} + 3\right)$'
      - say: 'To add 9 over 2 and 3, we write the 3 as 6 over 2. Then 9 over 2 plus 6 over 2 is 15 over 2.'
        write: '$= \pi\left(\dfrac{9}{2} + \dfrac{6}{2}\right) = \pi \times \dfrac{15}{2}$'
      - say: 'So the volume of the bowl is 15 pi over 2 cubic units, which is answer choice B.'
        write: '$V = \dfrac{15\pi}{2}$ cubic units'
        answer: true
        doodle_do:
          - {id: bowl, op: label, part: discs, text: '15π/2'}
    traps:
