# UTME 2000 Mathematics — lessons for the board.
#
# Each lesson is a run of moments: what the teacher says, and the one line written while it
# is said. See lessons_2002.yaml for the full format notes. Answers match explanations_2000.yaml.
format_version: 1
exam_year: 2000
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'We have three sets, P, Q and R. We want P minus Q, in a bracket, intersection R. The bracket comes first.'
        write: 'Find $(P - Q) \cap R$'
      - section: 'Solution'
        say: 'Solution. Write out the sets. P is 1, 2, u, v, w, x. Q is 2, 3, u, v, w, 5, 6, y.'
        write: '$P = \{1, 2, u, v, w, x\},\ Q = \{2, 3, u, v, w, 5, 6, y\}$'
      - say: 'R is 2, 3, 4, v, x, y.'
        write: '$R = \{2, 3, 4, v, x, y\}$'
      - say: 'P minus Q means the elements of P that are not in Q. It is read P minus Q, or P difference Q.'
        write: '$P - Q = \{a : a \in P,\ a \notin Q\}$'
      - section: 'The Venn diagram'
        say: 'Place each element in a Venn diagram. 2 and v are in all three sets. u and w are in P and Q only. x is in P and R only.'
        diagram: {id: v, kind: venn, sets: [{key: P, name: P}, {key: Q, name: Q}, {key: R, name: R}], size: scene}
        diagram_do:
          - {id: v, op: fill, part: 'P∩Q∩R', text: '2, v', 'on': 'all three'}
          - {id: v, op: fill, part: 'P∩Q only', text: 'u, w', 'on': 'P and Q only'}
          - {id: v, op: fill, part: 'P∩R only', text: 'x', 'on': 'P and R only'}
      - say: '3 and y are in Q and R only. The rest are in one set only, so 1 in P only, 5 and 6 in Q only, and 4 in R only.'
        diagram_do:
          - {id: v, op: fill, part: 'Q∩R only', text: '3, y', 'on': 'Q and R only'}
          - {id: v, op: fill, part: 'P only', text: '1', 'on': '1 in P only'}
          - {id: v, op: fill, part: 'Q only', text: '5, 6', 'on': '5 and 6'}
      - say: 'And 4 goes in R only. Every element now has its place.'
        diagram_do:
          - {id: v, op: fill, part: 'R only', text: '4', 'on': 'R only'}
      - section: 'Step 1: P minus Q'
        say: 'Go through P and look for each element in Q. 1 is not in Q, so keep it. 2, u, v and w are in Q, so remove them. x is not in Q, so keep it.'
        write: '$P - Q = \{1, x\}$'
        diagram_do:
          - {id: v, op: shade, part: 'P−Q', colour: blue, text: 'P − Q', 'on': 'keep it', on_nth: 2}
      - section: 'Step 2: intersect with R'
        say: 'Now intersect with R, keeping only what is also in R. 1 is not in R, so it goes. x is in R, so it stays.'
        write: '$(P - Q) \cap R = \{1, x\} \cap \{2, 3, 4, v, x, y\} = \{x\}$'
        diagram_do:
          - {id: v, op: shade, part: '(P−Q)∩R', colour: green, text: '(P − Q) ∩ R', 'on': 'it stays'}
      - section: 'Check'
        say: 'Check x against each condition. x is in P, x is not in Q, and x is in R. All three hold.'
        write: 'Check: $x \in P,\ x \notin Q,\ x \in R\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore P minus Q, intersection R, is the set containing x, which is answer choice C.'
        write: '$\therefore (P - Q) \cap R = \{x\}$'
        answer: true
    traps:
      A: 'You went for the set 1, x. That is P minus Q on its own. You still intersect with R, and 1 is not in R, so it drops out.'
      B: 'You went for the set x, y. y is in R, but it is not in P at all, so it can never be in P minus Q.'
      D: 'You went for the empty set. But x is in P, is not in Q, and is in R, so one element survives: x.'

  2:
    moments:
      - section: 'The question'
        say: 'A town had 240,000 people in January 1998, and the population grows by 2% each year. What is it in January 2000? Each year''s 2% is taken on a bigger number.'
        write: 'Population: 240,000 in Jan 1998; increase $2\%$ each year'
      - section: 'Solution'
        say: 'Solution. List the givens. P, the starting population, is 240,000. R, the rate, is 2 percent. n, the number of years, is 2000 minus 1998, which is 2.'
        write: '$P = 240{,}000,\ R = 2,\ n = 2000 - 1998 = 2$'
      - say: 'The growth is taken on the new population each year, like compound interest. The formula is A equals P times bracket 1 plus R over 100, to the power n.'
        write: '$A = P\left(1 + \dfrac{R}{100}\right)^{n}$'
      - section: 'Substitute'
        say: 'Now substitute. P is 240,000, R is 2, and n is 2.'
        write: '$A = 240{,}000\left(1 + \dfrac{2}{100}\right)^{2}$'
        point:
          - {line: 2, kind: box, text: 'the formula'}
      - say: '2 over 100 is 0.02, and 1 plus 0.02 is 1.02.'
        write: '$= 240{,}000 \times (1.02)^{2}$'
      - say: '1.02 squared is 1.02 times 1.02. 102 times 102 is 10,404, and with 4 decimal places that is 1.0404.'
        write: '$(1.02)^{2} = 1.02 \times 1.02 = 1.0404$'
      - say: 'So A is 240,000 times 1.0404.'
        write: '$A = 240{,}000 \times 1.0404$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '= [[1.0404]]'}, at: '× [[1.0404]]', text: 'from here'}
      - say: '240,000 times 1 is 240,000, and 240,000 times 0.0404 is 9,696. Add them to get 249,696.'
        write: '$= 240{,}000 + 9{,}696 = 249{,}696$'
      - section: 'Check, year by year'
        say: 'Check year by year. 2% of 240,000 is 4,800. So January 1999 has 244,800 people.'
        write: '1999: $240{,}000 + 4{,}800 = 244{,}800$'
        point:
          - {line: 8, kind: highlight, at: '244,800'}
      - say: 'The next 2% is on 244,800, which is 4,896. So January 2000 has 249,696 people, as the formula gave.'
        write: '2000: $244{,}800 + 4{,}896 = 249{,}696$ ✓'
        point:
          - {line: 9, kind: highlight, at: '249,696'}
      - say: 'Therefore the population in January 2000 is 249,696, which is option B.'
        write: '$\therefore$ population in Jan 2000 $= 249{,}696$ (B)'
        answer: true
    traps:
      A: 'You went for 480,000. That doubles the population, which is growth of 100%, not 2%. Each year we multiply by 1.02.'
      C: 'You went for 249,600. That adds 2% of the first 240,000, which is 4,800, twice. The second year''s 2% is on 244,800, which is 4,896, so the answer is 249,696.'
      D: 'You went for 244,800. That is the population after one year, in January 1999. January 2000 needs n equal to 2.'

  3:
    moments:
      - section: 'The question'
        say: 'We have two unknowns from one equation. Once the left side is rationalised, we equate rational and irrational parts, and $m$ and $n$ drop out.'
        write: 'If $\dfrac{2\sqrt{3} - \sqrt{2}}{\sqrt{3} + 2\sqrt{2}} = m + n\sqrt{6}$, find $m$ and $n$'
      - say: 'Solution. Rationalise the left side, then compare it with $m$ plus $n$ root 6.'
        write: 'Solution'
      - section: 'The conjugate'
        say: 'The conjugate of root 3 plus 2 root 2 is root 3 minus 2 root 2, which is the same terms with the sign changed.'
        write: 'Conjugate of $\sqrt{3} + 2\sqrt{2}$ is $\sqrt{3} - 2\sqrt{2}$'
      - say: 'Multiply the numerator and the denominator by it. Something over itself is 1, so the value does not change.'
        write: '$= \dfrac{2\sqrt{3} - \sqrt{2}}{\sqrt{3} + 2\sqrt{2}} \times \dfrac{\sqrt{3} - 2\sqrt{2}}{\sqrt{3} - 2\sqrt{2}}$'
      - section: 'The denominator'
        say: 'The denominator is a difference of two squares, because $a$ plus $b$, times $a$ minus $b$, is $a$ squared minus $b$ squared.'
        write: '$(a + b)(a - b) = a^{2} - b^{2}$'
      - say: 'Here $a$ is root 3 and $b$ is 2 root 2.'
        write: 'Denominator $= (\sqrt{3})^{2} - (2\sqrt{2})^{2}$'
      - say: 'Root 3 squared is 3. 2 root 2 squared is 4 times 2, which is 8, because 2 squared is 4 and root 2 squared is 2.'
        write: '$= 3 - 4 \times 2 = 3 - 8$'
      - say: '3 minus 8 is minus 5. The denominator has no surd left.'
        write: '$= -5$'
      - section: 'The numerator'
        say: 'Now open the brackets in the numerator. The last product is plus, because minus root 2 times minus 2 root 2 is minus times minus.'
        write: 'Numerator $= 2\sqrt{3}\sqrt{3} - 4\sqrt{3}\sqrt{2} - \sqrt{2}\sqrt{3} + 2\sqrt{2}\sqrt{2}$'
      - say: '2 root 3 times root 3 is 2 times 3, which is 6. Root 3 times root 2 is root 6. And 2 root 2 times root 2 is 2 times 2, which is 4.'
        write: '$= 6 - 4\sqrt{6} - \sqrt{6} + 4$'
      - say: 'Collect like terms. 6 plus 4 is 10. Minus 4 root 6, minus another root 6, is minus 5 root 6.'
        write: '$= 10 - 5\sqrt{6}$'
      - section: 'Divide'
        say: 'Put the numerator over the denominator, minus 5, and divide each term. 10 over minus 5 is minus 2, and minus 5 root 6 over minus 5 is plus root 6.'
        write: '$\therefore$ Fraction $= \dfrac{10 - 5\sqrt{6}}{-5} = -2 + \sqrt{6}$'
      - section: 'Equate parts'
        say: 'Write root 6 as 1 root 6, and set it equal to $m$ plus $n$ root 6.'
        write: '$-2 + 1\sqrt{6} = m + n\sqrt{6}$'
      - say: 'Equate rational and irrational parts. The rational parts give $m$ equals minus 2. The root 6 parts give $n$ equals 1.'
        write: 'Equating rational and irrational parts: $m = -2,\ n = 1$'
      - section: 'Check'
        say: 'Check with decimals. The numerator is about 3.464 minus 1.414, which is 2.050. The denominator is about 4.560. 2.050 over 4.560 is 0.4495, and minus 2 plus root 6 is 0.4495.'
        write: 'Check: $\dfrac{2.050}{4.560} \approx 0.4495 \approx -2 + 2.4495\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore $m$ is minus 2 and $n$ is 1, which is option B.'
        write: '$\therefore m = -2,\ n = 1$'
        answer: true
    traps:
      A: 'You went for 1, minus 2. Those are the right numbers in the wrong places. After dividing by minus 5 we get minus 2 plus 1 root 6, so $m$, the rational part, is minus 2 and $n$ is 1.'
      C: 'You went for minus 2 over 5, and 1. The numerator simplifies to 10 minus 5 root 6, and 10 divided by minus 5 is minus 2, not minus 2 over 5.'
      D: 'You went for 2 and 3 over 5. Check the denominator: 3 minus 8 is minus 5, and dividing 10 minus 5 root 6 by minus 5 gives minus 2 plus root 6.'

  4:
    moments:
      - section: 'The question'
        say: 'A youth club has 94 members. 60 like modern music and 50 like traditional music. Those who like both are three times those who like neither. How many like only one type?'
        write: 'Club 94: modern 60, traditional 50, both $= 3 \times$ neither'
      - section: 'Solution'
        say: 'Solution. The club is the universal set, epsilon, so n of epsilon is 94. n of M, modern, is 60, and n of T, traditional, is 50.'
        write: '$n(\varepsilon) = 94,\ n(M) = 60,\ n(T) = 50$'
      - say: 'Both is given through neither, so we name neither first. Let the number who like neither be x.'
        write: 'Let $n(M \cup T)^{\prime} = x$'
      - say: 'Both is three times neither, so n of M intersection T is 3x.'
        write: '$n(M \cap T) = 3x$'
      - section: 'The Venn diagram'
        say: 'Now the Venn diagram. The box is the club of 94, with a circle for modern and a circle for traditional. Put 3x in the overlap and x outside the circles.'
        diagram: {id: v, kind: venn, universal: {name: 'Club', total: 94}, sets: [{key: M, name: Modern, total: 60}, {key: T, name: Traditional, total: 50}]}
        diagram_do:
          - {id: v, op: fill, part: 'M∩T', text: '3x', colour: orange, 'on': overlap}
          - {id: v, op: fill, part: outside, text: 'x', colour: orange, 'on': outside}
      - say: 'Modern only is 60 minus 3x. Traditional only is 50 minus 3x.'
        write: 'Modern only $= 60 - 3x$, traditional only $= 50 - 3x$'
        diagram_do:
          - {id: v, op: fill, part: 'M only', text: '60 − 3x', 'on': 'Modern only'}
          - {id: v, op: fill, part: 'T only', text: '50 − 3x', 'on': 'Traditional only'}
      - section: 'The equation'
        say: 'Every member is in exactly one region, so the four regions add up to the whole club, 94.'
        write: '$(60 - 3x) + 3x + (50 - 3x) + x = 94$'
      - say: 'Collect like terms. For the numbers, 60 plus 50 is 110. For the x terms, minus 3x, plus 3x, minus 3x, plus x leaves minus 2x.'
        write: '$110 - 2x = 94$'
      - say: 'Take 2x to the right and 94 to the left, so 110 minus 94 equals 2x. 110 minus 94 is 16.'
        write: '$2x = 110 - 94 = 16$'
      - say: 'Divide both sides by 2. x is 8, so eight members like neither.'
        write: '$x = 8$'
        diagram_do:
          - {id: v, op: fill, part: outside, text: '8', 'on': neither}
      - say: 'So the number who like both is 3x, and 3 times 8 is 24.'
        write: '$n(M \cap T) = 3 \times 8 = 24$'
        diagram_do:
          - {id: v, op: fill, part: 'M∩T', text: '24', 'on': '24'}
        point:
          - {line: 10, kind: move, from: {line: 9, at: '8'}, at: '× 8', text: 'x'}
      - section: 'Only one type'
        say: 'Modern only is 60 minus 24, which is 36. Traditional only is 50 minus 24, which is 26.'
        write: 'Modern only $= 60 - 24 = 36$, traditional only $= 50 - 24 = 26$'
        diagram_do:
          - {id: v, op: fill, part: 'M only', text: '36', 'on': 'is 36'}
          - {id: v, op: fill, part: 'T only', text: '26', 'on': 'is 26'}
      - say: 'Only one type means modern only plus traditional only, so 36 plus 26 is 62.'
        write: 'Only one type $= 36 + 26 = 62$'
        diagram_do:
          - {id: v, op: shade, part: 'M only', colour: green}
          - {id: v, op: shade, part: 'T only', colour: green, text: 'only one type: 62'}
      - section: 'Check'
        say: 'To check, 36 plus 24 plus 26 plus 8 is 94, the whole club.'
        write: '$36 + 24 + 26 + 8 = 94\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore 62 members like only one type of music, which is answer choice C.'
        write: '$\therefore$ 62 members like only one type'
        answer: true
    traps:
      A: 'You went for 8. That is x, the members who like neither, the region outside the circles. It is a step on the way: both is 3x, 24, and only one type is 36 plus 26, which is 62.'
      B: 'You went for 24. That is 3x, the members who like both, in the overlap. Only one type means the two "only" regions, so 36 plus 26, which is 62.'
      D: 'You went for 86. That is n of M union T, everyone in the circles, which still includes the 24 in the overlap. Take them out: 86 minus 24 is 62.'

  5:
    moments:
      - section: 'The question'
        say: 'Round each number to two significant figures first, then work it out, and give the answer to two significant figures. The options differ only in the last digit, so follow the order exactly.'
        write: '$\dfrac{(2.813 \times 10^{-3}) \times 1.063}{5.637 \times 10^{-2}}$'
      - section: 'Each number to 2 s.f.'
        say: 'Solution. For 2.813, keep 2 and 8. The next digit is 1, less than 5, so leave it, giving 2.8. On its number line, 2.813 is nearer 2.8.'
        write: '$2.813 = 2.8$ (2 s.f.)'
        doodle: {name: 'custom:2000_q05_a', id: lines, caption: 'Each number goes to the nearer end', size: scene}
      - say: 'For 1.063, keep 1 and 0. The next digit is 6, which is 5 or more, so add 1 to get 1.1.'
        write: '$1.063 = 1.1$ (2 s.f.)'
        doodle_do:
          - {id: lines, op: stage, stage: 'custom:2000_q05_a2'}
      - say: 'For 5.637, keep 5 and 6. The next digit is 3, less than 5, so leave it, giving 5.6. The powers of ten are exact and stay.'
        write: '$5.637 = 5.6$ (2 s.f.)'
        doodle_do:
          - {id: lines, op: stage, stage: 'custom:2000_q05_a3'}
      - say: 'Put the three rounded numbers back into the expression.'
        write: '$= \dfrac{2.8 \times 10^{-3} \times 1.1}{5.6 \times 10^{-2}}$'
        doodle_do:
          - {id: lines, op: pulse}
      - section: 'Cancel first'
        say: 'Cancel first. 2.8 is half of 5.6, so 2.8 over 5.6 is 1 over 2.'
        write: '$\dfrac{2.8}{5.6} = \dfrac{1}{2}$'
      - say: 'For the powers of ten, use the law of indices, so to divide powers of the same base, subtract the indices. Negative 3 minus negative 2 is negative 1.'
        write: '$\dfrac{10^{-3}}{10^{-2}} = 10^{-3 - (-2)} = 10^{-1}$'
      - say: 'Therefore the value is 1 over 2, times 1.1, times 10 to the power negative 1.'
        write: '$\therefore$ value $= \dfrac{1}{2} \times 1.1 \times 10^{-1}$'
      - say: 'Half of 1.1 is 0.55. Times 10 to the power negative 1 means divide by 10, which gives 0.055.'
        write: '$= 0.55 \times 10^{-1} = 0.055$'
      - say: 'To two significant figures, we count from the first non-zero digit, 5 and 5. 0.055 already has exactly two.'
        write: '$= 0.055$ (2 s.f.)'
      - section: 'Check'
        say: 'Check by multiplying back. 0.055 times 0.056 is 0.00308, and 0.0028 times 1.1 is also 0.00308. It agrees.'
        write: 'Check: $0.055 \times 0.056 = 0.00308 = 0.0028 \times 1.1$ ✓'
      - say: 'Therefore the value is 0.055, to two significant figures, which is option B.'
        write: '$\therefore$ value $= 0.055$ (2 s.f.) (B)'
        answer: true
    traps:
      A: 'You went for 0.056. With the rounded numbers, 2.8 over 5.6 is exactly a half, and half of 1.1 is 0.55, so the value is exactly 0.055, with nothing to add 1 to.'
      C: 'You went for 0.054. That is a slip in the last digit. Round each number first, then cancel: 2.8 over 5.6 is a half, and half of 1.1 is 0.55, so the value is exactly 0.055.'
      D: 'You went for 0.54. The digits are close, but the power of ten is off. 10 to the power negative 3 over 10 to the power negative 2 is 10 to the power negative 1, so 0.55 becomes 0.055.'

  6:
    moments:
      - section: 'The question'
        say: 'A man wants ₦150,000 for a car after 3 years, at 25% compound interest. How much must he deposit now? We know the end, not the start.'
        write: 'Find $P$: amount after 3 years at $25\%$ compound = ₦150,000'
      - section: 'Solution'
        say: 'Solution. List the givens. A, the amount at the end, is 150,000. R is 25 percent. n is 3 years. P, the deposit, is what we want.'
        write: '$A = 150{,}000,\ R = 25,\ n = 3,\ P = ?$'
      - say: 'The compound interest formula is A equals P times bracket 1 plus R over 100, to the power n.'
        write: '$A = P\left(1 + \dfrac{R}{100}\right)^{n}$'
      - section: 'Substitute'
        say: 'Now substitute. A is 150,000, R is 25, and n is 3.'
        write: '$150{,}000 = P\left(1 + \dfrac{25}{100}\right)^{3}$'
        point:
          - {line: 2, kind: box, text: 'the formula'}
      - say: '25 over 100 is 1 over 4, and 1 plus 1 over 4 is 5 over 4.'
        write: '$150{,}000 = P\left(\dfrac{5}{4}\right)^{3}$'
      - say: '5 over 4 cubed is 5 cubed over 4 cubed, which is 125 over 64.'
        write: '$150{,}000 = P \times \dfrac{125}{64}$'
      - say: 'To make P the subject, multiply both sides by 64 over 125.'
        write: '$P = 150{,}000 \times \dfrac{64}{125}$'
      - say: 'Cancel first, so 125 into 150,000 is 1,200. Then 1,200 times 64 is 76,800. That is what he must deposit now.'
        write: '$= 1{,}200 \times 64 = 76{,}800$'
        point:
          - {line: 7, kind: highlight, at: '76,800'}
      - section: 'Check, year by year'
        say: 'Check forwards. 25% of 76,800 is 19,200, so after 1 year it is 96,000. After 2 years, 120,000. After 3 years, 150,000. It works.'
        write: 'Check: $76{,}800 \to 96{,}000 \to 120{,}000 \to 150{,}000$ ✓'
      - say: 'Therefore he needs to deposit ₦76,800 now, and that is option D.'
        write: '$\therefore P$ = ₦76,800.00 (D)'
        answer: true
    traps:
      A: 'You went for ₦112,000.50. Grown at 25% for 3 years, that would be over ₦218,000, far more than ₦150,000. P is 150,000 times 64 over 125, which is ₦76,800.'
      B: 'You went for ₦96,000. That is the deposit after one year. The question wants P, the amount at the very start.'
      C: 'You went for ₦85,714.28. That is 150,000 divided by 1.75, which treats the interest as simple, with 25% added three times on the same P. Compound interest multiplies by 5 over 4 each year.'

  7:
    moments:
      - section: 'The question'
        say: '314 base ten, minus two-five-six base seven, equals three-four-nought base x. Find the base x. We put everything in base ten and make an equation in x.'
        write: 'If $314_{10} - 256_{7} = 340_{x}$, find $x$'
      - say: 'First, change two-five-six base seven to base ten.'
        write: 'Solution'
      - section: 'Step 1: base 7 to base 10'
        say: 'Write the index numbers two, one, nought over the digits. Each digit times seven to the power of its index.'
        write: '$\overset{2}{2}\,\overset{1}{5}\,\overset{0}{6}_{7} = 2 \times 7^{2} + 5 \times 7^{1} + 6 \times 7^{0}$'
      - say: 'Seven squared is 49, seven to the power 1 is 7, and seven to the power nought is 1.'
        write: '$= 2 \times 49 + 5 \times 7 + 6 \times 1$'
      - say: '2 times 49 is 98. 5 times 7 is 35. 6 times 1 is 6.'
        write: '$= 98 + 35 + 6$'
      - say: '98 plus 35 is 133, and 133 plus 6 is 139.'
        write: '$= 139$'
      - section: 'Step 2: the left side'
        say: '314 is already in base ten, so the left side is 314 minus 139, which is 175.'
        write: '$314 - 139 = 175$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '139'}, at: '139'}
      - section: 'Step 3: expand the base x numeral'
        say: 'Now three-four-nought base x. The index numbers are two, one, nought. That gives 3 times x squared, plus 4 times x to the power 1, plus 0 times x to the power nought.'
        write: '$\overset{2}{3}\,\overset{1}{4}\,\overset{0}{0}_{x} = 3 \times x^{2} + 4 \times x^{1} + 0 \times x^{0}$'
      - say: 'x to the power 1 is x, and the last term is 0. So it is 3 x squared plus 4x.'
        write: '$= 3x^{2} + 4x$'
      - section: 'Step 4: solve for x'
        say: 'Both sides are the same number, so 3 x squared plus 4x equals 175.'
        write: '$3x^{2} + 4x = 175$'
        point:
          - {line: 9, kind: move, from: {line: 6, at: '=[[175]]'}, at: '175'}
      - say: 'Subtract 175 from both sides, to get a quadratic equal to 0.'
        write: '$3x^{2} + 4x - 175 = 0$'
      - say: 'Factorise by product and sum. The product is a times c, so 3 times minus 175 is minus 525. The sum is b, which is 4.'
        write: 'Product $= 3 \times (-175) = -525$, Sum $= 4$'
      - say: 'We need two numbers that multiply to minus 525 and add to 4. They are 25 and minus 21.'
        write: 'Factors: $25$ and $-21$'
      - say: 'Split the middle term, so 4x becomes 25x minus 21x.'
        write: '$3x^{2} + 25x - 21x - 175 = 0$'
      - say: 'Group in pairs. x is common to the first pair, and minus 7 to the second.'
        write: '$x(3x + 25) - 7(3x + 25) = 0$'
      - say: 'The bracket 3x plus 25 is common, so take it out.'
        write: '$(x - 7)(3x + 25) = 0$'
      - say: 'Either x minus 7 equals 0, or 3x plus 25 equals 0.'
        write: 'Either $x = 7$ or $x = -\dfrac{25}{3}$'
      - say: 'A base is a whole number, bigger than every digit used. The largest digit in three-four-nought is 4, so we reject minus 25 over 3.'
        write: 'Reject $x = -\dfrac{25}{3}$: a base is a whole number $> 4$'
      - section: 'Check'
        say: 'Check by expanding three-four-nought base seven, with the index numbers over the digits again.'
        write: '$\overset{2}{3}\,\overset{1}{4}\,\overset{0}{0}_{7} = 3 \times 7^{2} + 4 \times 7^{1} + 0 \times 7^{0}$'
      - say: '3 times 49 is 147, and 4 times 7 is 28. 147 plus 28 is 175. It agrees.'
        write: '$= 147 + 28 + 0 = 175\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the base x is 7, which is option C.'
        write: '$\therefore x = 7$'
        answer: true
    traps:
      A: 'You went for 5. In base five, three-four-nought is 3 times 25 plus 4 times 5, which is 95, not 175. Solving 3 x squared plus 4x equals 175 gives 7.'
      B: 'You went for 6. In base six, three-four-nought is 108 plus 24, which is 132, not 175. The base that gives 175 is 7.'
      D: 'You went for 8. In base eight, three-four-nought is 192 plus 32, which is 224, too big. Base seven gives exactly 175.'

  8:
    moments:
      - section: 'The question'
        say: 'Audu paid ₦50,000 for an article and sold it to Femi at a loss of x percent. Femi sells to Oche at a 40% profit, making ₦10,000. Find x. Watch whose cost each percentage is on.'
        write: 'Audu: C.P. = ₦50,000, loss $x\%$. Femi: profit $40\%$ = ₦10,000'
      - section: 'Solution'
        say: 'Solution. A profit or loss percent is always on the cost price, C.P., of the person selling. Femi''s 40% is on what Femi paid, not on Audu''s ₦50,000.'
        write: 'Profit $\% = \dfrac{\text{profit}}{\text{C.P.}} \times 100\%$'
      - section: 'Femi''s cost price'
        say: 'Let Femi''s cost price be y naira.'
        write: 'Let Femi''s C.P. $= y$ naira'
      - say: 'Substitute into the formula, so Femi''s profit percent, 40, equals 10,000 over y, times 100.'
        write: '$40 = \dfrac{10{,}000}{y} \times 100$'
        point:
          - {line: 1, kind: box, text: 'the formula'}
      - say: 'Cross multiply, and 40 times y equals 10,000 times 100, which is 1,000,000.'
        write: '$40y = 1{,}000{,}000$'
      - say: 'Divide both sides by 40. 1,000,000 divided by 40 is 25,000.'
        write: '$y = \dfrac{1{,}000{,}000}{40} = 25{,}000$'
      - say: 'Femi paid ₦25,000. What Femi paid is exactly what Audu sold it for, which is Audu''s selling price, S.P.'
        write: 'Audu''s S.P. = Femi''s C.P. = ₦25,000'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '= [[25,000]]'}, at: '₦[[25,000]]', text: 'Femi paid'}
      - section: 'Audu''s loss'
        say: 'Audu''s loss is his C.P. minus his S.P., so 50,000 minus 25,000, which is 25,000.'
        write: 'Loss $=$ C.P. $-$ S.P. $= 50{,}000 - 25{,}000 = 25{,}000$'
      - say: 'Loss percent is the loss over Audu''s own C.P., times 100 percent.'
        write: 'Loss $\% = \dfrac{\text{loss}}{\text{C.P.}} \times 100\%$'
      - say: 'Substitute, so x is 25,000 over 50,000, times 100. 25,000 over 50,000 is 1 over 2, and half of 100 is 50.'
        write: '$x = \dfrac{25{,}000}{50{,}000} \times 100 = 50$'
      - section: 'Check'
        say: 'Check forwards. A 50% loss on ₦50,000 means Audu sold for ₦25,000. 40% of 25,000 is 10,000, Femi''s profit. It agrees.'
        write: 'Check: $40\%$ of $25{,}000 = 10{,}000$ ✓'
      - say: 'Therefore x is 50, which is option B.'
        write: '$\therefore x = 50$ (B)'
        answer: true
    traps:
      A: 'You went for 60. A 60% loss means Audu sold for ₦20,000, and 40% of that is only ₦8,000, not ₦10,000. Femi''s C.P. is ₦25,000, so the loss is 50%.'
      C: 'You went for 40. That is Femi''s profit percent, not Audu''s loss percent. Audu''s loss is on his own C.P., ₦50,000.'
      D: 'You went for 20. A 20% loss means Audu sold for ₦40,000, and 40% of that is ₦16,000, not ₦10,000. Work back from Femi''s ₦10,000 profit: Femi''s C.P. is ₦25,000, so x is 50.'

  9:
    moments:
      - section: 'The question'
        say: 'Every term is a power of 2 close to 2 to the power $n$. Write each one using 2 to the power $n$, and the $n$ disappears completely.'
        write: 'Simplify $\dfrac{3(2^{n+1}) - 4(2^{n-1})}{2^{n+1} - 2^{n}}$'
      - say: 'Solution. First, split each power using the laws of indices.'
        write: 'Solution'
      - section: 'Split the powers'
        say: 'The law of indices for multiplying says that when we multiply powers of the same base, we add the indices. Read backwards, it splits a power into two.'
        write: 'Law of indices: $a^{m} \times a^{n} = a^{m + n}$'
      - say: 'So 2 to the power $n$ plus 1 is 2 to the power $n$, times 2 to the power 1, which is 2 to the power $n$ times 2.'
        write: '$2^{n+1} = 2^{n} \times 2$'
      - say: '2 to the power $n$ minus 1 is 2 to the power $n$, times 2 to the power negative 1. And 2 to the power negative 1 is 1 over 2.'
        write: '$2^{n-1} = 2^{n} \times 2^{-1} = 2^{n} \times \tfrac{1}{2}$'
      - section: 'Let 2ⁿ = y'
        say: 'Now every term has 2 to the power $n$ in it. Let 2 to the power $n$ be $y$, which is one block in the picture.'
        write: 'Let $2^{n} = y$'
        doodle: {name: 'custom:2000_q09_b', id: blocks, caption: 'y = 2ⁿ is one block', size: scene}
      - say: 'Then 2 to the power $n$ plus 1 is $2y$, two blocks, and 2 to the power $n$ minus 1 is $y$ over 2, half a block.'
        write: '$2^{n+1} = 2y,\quad 2^{n-1} = \dfrac{y}{2}$'
        doodle_do:
          - {id: blocks, op: stage, stage: 'custom:2000_q09_b2'}
      - section: 'Substitute'
        say: 'Substitute into the fraction. On top we have 3 times $2y$, minus 4 times $y$ over 2, and underneath, $2y$ minus $y$.'
        write: '$= \dfrac{3(2y) - 4\left(\dfrac{y}{2}\right)}{2y - y}$'
      - say: 'Open the brackets. 3 times $2y$ is $6y$, and 4 times $y$ over 2 is $2y$.'
        write: '$= \dfrac{6y - 2y}{2y - y}$'
        doodle_do:
          - {id: blocks, op: stage, stage: 'custom:2000_q09_b3'}
      - say: 'Collect like terms. On top, $6y$ minus $2y$ is $4y$. Underneath, $2y$ minus $y$ is $y$.'
        write: '$= \dfrac{4y}{y}$'
        doodle_do:
          - {id: blocks, op: stage, stage: 'custom:2000_q09_b4'}
      - say: 'The $y$ on top cancels the $y$ underneath, leaving 4. That is four blocks over one block.'
        write: '$= 4$'
        doodle_do:
          - {id: blocks, op: circle, part: top, text: '4 blocks ÷ 1 block = 4'}
      - section: 'Check'
        say: 'Check with $n$ equal to 1. On top, 3 times 2 squared is 12, minus 4 times 2 to the power 0, which is 4, giving 8. Underneath, 2 squared minus 2 is 2. 8 over 2 is 4.'
        write: 'Check, $n = 1$: $\dfrac{3(4) - 4(1)}{4 - 2} = \dfrac{8}{2} = 4\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the expression simplifies to 4, which is option C.'
        write: '$\therefore \dfrac{3(2^{n+1}) - 4(2^{n-1})}{2^{n+1} - 2^{n}} = 4$'
        answer: true
    traps:
      A: 'You went for 2 to the power $n$ plus 1. Every term on top and underneath is a multiple of 2 to the power $n$, so with $y$ for 2 to the power $n$ the $y$ cancels and leaves a plain number, 4.'
      B: 'You went for 2 to the power $n$ minus 1. The powers of 2 cancel out. The top is $4y$ and the bottom is $y$, so the answer is just 4.'
      D: 'You went for 1 over 4. That is the fraction upside down. The top is $4y$ and the bottom is $y$, so it is 4.'

  10:
    moments:
      - section: 'The question'
        say: 'P-three-four-four base six, minus two-three-P-two base six, equals two-P-P-two base six. P is a digit. Expand each numeral in base ten, keeping P, and solve.'
        write: 'If $P344_{6} - 23P2_{6} = 2PP2_{6}$, find $P$'
      - say: 'In base six the index numbers over four digits are three, two, one, nought. Six cubed is 216, and six squared is 36.'
        write: 'Solution'
      - section: 'Expand each numeral'
        say: 'The first numeral is P times 6 cubed, plus 3 times 6 squared, plus 4 times 6, plus 4 times 1.'
        write: '$\overset{3}{P}\,\overset{2}{3}\,\overset{1}{4}\,\overset{0}{4}_{6} = P \times 6^{3} + 3 \times 6^{2} + 4 \times 6^{1} + 4 \times 6^{0}$'
      - say: 'P times 216 is 216P. 3 times 36 is 108, 4 times 6 is 24, and 4 times 1 is 4.'
        write: '$= 216P + 108 + 24 + 4$'
      - say: '108 plus 24 plus 4 is 136.'
        write: '$= 216P + 136$'
      - say: 'The second numeral is 2 times 6 cubed, plus 3 times 6 squared, plus P times 6, plus 2.'
        write: '$\overset{3}{2}\,\overset{2}{3}\,\overset{1}{P}\,\overset{0}{2}_{6} = 2 \times 6^{3} + 3 \times 6^{2} + P \times 6^{1} + 2 \times 6^{0}$'
      - say: '2 times 216 is 432, 3 times 36 is 108, P times 6 is 6P, and then 2.'
        write: '$= 432 + 108 + 6P + 2$'
      - say: '432 plus 108 plus 2 is 542.'
        write: '$= 542 + 6P$'
      - say: 'The third numeral is 2 times 6 cubed, plus P times 6 squared, plus P times 6, plus 2.'
        write: '$\overset{3}{2}\,\overset{2}{P}\,\overset{1}{P}\,\overset{0}{2}_{6} = 2 \times 6^{3} + P \times 6^{2} + P \times 6^{1} + 2 \times 6^{0}$'
      - say: '2 times 216 is 432, P times 36 is 36P, P times 6 is 6P, and then 2.'
        write: '$= 432 + 36P + 6P + 2$'
      - say: '432 plus 2 is 434, and 36P plus 6P is 42P.'
        write: '$= 434 + 42P$'
      - section: 'Form the equation and solve'
        say: 'Now the first minus the second equals the third. Keep the second in a bracket, because the whole of it is taken away.'
        write: '$(216P + 136) - (542 + 6P) = 434 + 42P$'
        point:
          - {line: 11, kind: move, from: {line: 4, at: '216P+136'}, at: '(216P+136)'}
          - {line: 11, kind: move, from: {line: 7, at: '542+6P'}, at: '(542+6P)'}
          - {line: 11, kind: move, from: {line: 10, at: '434+42P'}, at: '434+42P'}
      - say: 'Open the brackets. The minus sign changes both signs in the second bracket.'
        write: '$216P + 136 - 542 - 6P = 434 + 42P$'
      - say: 'Collect like terms on the left. 216P minus 6P is 210P, and 136 minus 542 is minus 406.'
        write: '$210P - 406 = 434 + 42P$'
      - say: 'Put the P terms on the left and the numbers on the right, changing sign as each crosses over.'
        write: '$210P - 42P = 434 + 406$'
      - say: '210P minus 42P is 168P, and 434 plus 406 is 840.'
        write: '$168P = 840$'
      - say: 'Divide both sides by 168. 168 times 5 is 840, so P is 5.'
        write: '$P = \dfrac{840}{168} = 5$'
      - say: 'Base six uses the digits 0 to 5, so 5 is allowed.'
        write: 'Base 6 digits: 0 to 5, so $P = 5$ is allowed'
      - section: 'Check'
        say: 'Check with P equals 5. The first numeral is 216 times 5 plus 136, which is 1216. The second is 542 plus 30, which is 572.'
        write: '$5344_{6} = 1216,\quad 2352_{6} = 572$'
      - say: '1216 minus 572 is 644. And the answer numeral, two-five-five-two base six, is 434 plus 210, which is also 644. It agrees.'
        write: '$1216 - 572 = 644 = 2552_{6}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore P is 5, which is option D.'
        write: '$\therefore P = 5$'
        answer: true
    traps:
      A: 'You went for 2. Put P equals 2 into 210P minus 406 equals 434 plus 42P, and the left is 14 while the right is 518. Solving gives P equals 5.'
      B: 'You went for 3. With P equals 3 the left is 224 and the right is 560, so it does not balance. 168P equals 840 gives 5.'
      C: 'You went for 4. With P equals 4 the left is 434 and the right is 602. Only P equals 5 balances, with 644 on both sides.'

  11:
    moments:
      - section: 'The question'
        say: 'Here the logs sit up in the indices. Let each factor be a letter, take logs of both sides, and the laws of logarithms bring the logs down to earth.'
        write: 'Evaluate $5^{-3\log_{5}2} \times 2^{2\log_{2}3}$'
      - say: 'Solution. We find the two factors one at a time, then multiply.'
        write: 'Solution'
      - section: 'The first factor'
        say: 'Let the first factor be $P$, so $P$ equals 5 to the power minus 3 log base 5 of 2.'
        write: 'Let $P = 5^{-3\log_{5}2}$'
      - say: 'Take log base 5 of both sides.'
        write: '$\log_{5}P = \log_{5}5^{-3\log_{5}2}$'
      - say: 'By the power law of logarithms, the index comes down in front. Then log base 5 of 5 is 1, so only the index is left.'
        write: '$\log_{5}P = -3\log_{5}2 \times \log_{5}5 = -3\log_{5}2$'
      - say: 'By the power law again, the minus 3 in front goes up as an index of 2.'
        write: '$\log_{5}P = \log_{5}2^{-3}$ $\quad [n\log M = \log M^{n}]$'
      - say: 'Both sides are logs to base 5, so the numbers inside are equal, and $P$ is 2 to the power minus 3.'
        write: '$P = 2^{-3}$'
      - say: 'By the negative index law, 2 to the minus 3 is 1 over 2 cubed, which is 1 over 8.'
        write: '$P = \dfrac{1}{2^{3}} = \dfrac{1}{8}$'
      - section: 'The second factor'
        say: 'Let the second factor be $Q$, so $Q$ equals 2 to the power 2 log base 2 of 3. Take log base 2 of both sides.'
        write: 'Let $Q = 2^{2\log_{2}3} \Rightarrow \log_{2}Q = 2\log_{2}3 \times \log_{2}2$'
      - say: 'Log base 2 of 2 is 1. By the power law, 2 log base 2 of 3 is log base 2 of 3 squared, which is log base 2 of 9.'
        write: '$\log_{2}Q = \log_{2}3^{2} = \log_{2}9$'
      - say: 'Both sides are logs to base 2, so $Q$ is 9.'
        write: '$Q = 9$'
      - section: 'Multiply'
        say: 'Now multiply the two factors, which gives 1 over 8, times 9.'
        write: '$5^{-3\log_{5}2} \times 2^{2\log_{2}3} = \dfrac{1}{8} \times 9$'
      - say: '1 over 8 times 9 is 9 over 8.'
        write: '$= \dfrac{9}{8}$'
      - say: '8 goes into 9 once, with 1 left over. So 9 over 8 is 1 and 1 over 8.'
        write: '$= 1\tfrac{1}{8}$'
      - section: 'Exam tip'
        say: 'Here is an exam tip. What we just did gives a rule, that $a$ to the power log base $a$ of $k$ is just $k$. In the picture, 1 over 8 goes in, through log base 5, then 5 to the power, and comes out unchanged.'
        doodle: {name: 'custom:2000_q11_a', id: mach, caption: 'log₅, then 5 to the power', size: scene}
        doodle_do:
          - {id: mach, op: move, part: card, path: through}
        write: 'Exam tip: $a^{\log_{a}k} = k$, so $5^{\log_{5}\frac{1}{8}} = \tfrac{1}{8}$'
      - section: 'Answer'
        say: 'Therefore the value is 1 and 1 over 8, which is option B.'
        write: '$\therefore 5^{-3\log_{5}2} \times 2^{2\log_{2}3} = 1\tfrac{1}{8}$'
        answer: true
    traps:
      A: 'You went for 8. That treats the first factor as 2 cubed, but the index is minus 3, so it is 1 over 8. And the second factor, 9, still has to multiply in.'
      C: 'You went for 2 over 5. The first factor is 1 over 8 and the second is 9, so the product is 9 over 8, which is 1 and 1 over 8.'
      D: 'You went for 1 over 8. That is only the first factor. We still multiply by the second factor, which is 9, giving 9 over 8.'

  12:
    moments:
      - section: 'The question'
        say: 'Star means $a$ to the power $b$, and $a$ star 2 equals 2 minus $a$. That gives a quadratic equation, so expect two values of $a$.'
        write: '$a * b = a^{b}$. If $a * 2 = 2 - a$, find $a$.'
      - say: 'Solution. Write the definition line. The second element is the power.'
        write: 'Solution: $a * b = a^{b}$'
        doodle: {name: 'custom:2000_q12_a', id: star, caption: 'a * b = a to the power b'}
      - section: 'Substitute'
        say: 'Put 2 in place of $b$. So $a$ star 2 is $a$ squared.'
        write: '$a * 2 = a^{2}$'
        doodle_do:
          - {id: star, op: label, part: out, text: 'a²'}
      - say: 'We are told $a$ star 2 equals 2 minus $a$. So $a$ squared equals 2 minus $a$.'
        write: '$\therefore a^{2} = 2 - a$'
      - say: 'Bring every term to the left, so the right side is 0. Minus $a$ becomes plus $a$, and 2 becomes minus 2.'
        write: '$a^{2} + a - 2 = 0$'
      - section: 'Factorise'
        say: 'To factorise, find the product and the sum. The product is 1 times minus 2, which is minus 2. The sum is the coefficient of $a$, which is 1.'
        write: 'Product $= -2$, Sum $= 1$'
      - say: 'We need two numbers that multiply to minus 2 and add to 1. They are 2 and minus 1, because 2 times minus 1 is minus 2, and 2 plus minus 1 is 1.'
        write: 'Factors: $2,\ -1$'
      - say: 'Replace the middle term, $a$, with $2a$ minus $a$.'
        write: '$a^{2} + 2a - a - 2 = 0$'
      - say: 'Group in pairs. Take out $a$ from the first pair and minus 1 from the second.'
        write: '$a(a + 2) - 1(a + 2) = 0$'
      - say: 'Both terms have the bracket $a$ plus 2, so take it out.'
        write: '$(a + 2)(a - 1) = 0$'
      - say: 'A product is zero when one factor is zero. Either $a$ plus 2 equals 0, or $a$ minus 1 equals 0.'
        write: 'Either $a + 2 = 0$ or $a - 1 = 0$'
      - say: 'So $a$ is minus 2 or 1.'
        write: '$\therefore a = -2$ or $a = 1$'
      - section: 'Check'
        say: 'Check $a$ equals 1, where 1 squared is 1, and 2 minus 1 is 1. Check $a$ equals minus 2, where minus 2 squared is 4, and 2 minus minus 2 is 4.'
        write: 'Check: $1^{2} = 1 = 2 - 1,\ \ (-2)^{2} = 4 = 2 - (-2)\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the possible values of $a$ are 1 and minus 2, which is option D.'
        write: '$\therefore a = 1, -2$'
        answer: true
    traps:
      A: 'You went for 1 and minus 1. 1 works, but test minus 1. Minus 1 squared is 1, while 2 minus minus 1 is 3. The factors are $(a + 2)(a - 1)$, so the other value is minus 2.'
      B: 'You went for 1 and 2. Test 2. 2 squared is 4, but 2 minus 2 is 0. The factors are $(a + 2)(a - 1)$, so the values are 1 and minus 2.'
      C: 'You went for 2 and minus 2. Minus 2 works, but 2 does not, because 2 squared is 4, and 2 minus 2 is 0. The other value is 1.'

  13:
    moments:
      - section: 'The question'
        say: 'The 3rd term of an A.P. is $4x$ minus $2y$, and the 9th term is $10x$ minus $8y$. The terms are algebra, but the method is the same as with numbers.'
        write: '$T_{3} = 4x - 2y,\quad T_{9} = 10x - 8y,\quad d = ?$'
        doodle: {name: 'custom:2000_q13_a', id: stairs, caption: 'every step rises by d', size: scene}
      - section: 'Solution'
        say: 'Solution. Let the first term be $a$ and the common difference be $d$. The $n$th term of an A.P. is $a$ plus $n$ minus 1, times $d$.'
        write: 'Solution: $T_{n} = a + (n - 1)d$'
      - say: 'For the 3rd term, $n$ minus 1 is 2. Call this equation 1.'
        write: '$T_{3} = a + 2d = 4x - 2y \quad \ldots (1)$'
        doodle_do:
          - {id: stairs, op: circle, part: t3}
      - say: 'For the 9th term, $n$ minus 1 is 8. Call this equation 2.'
        write: '$T_{9} = a + 8d = 10x - 8y \quad \ldots (2)$'
        doodle_do:
          - {id: stairs, op: circle, part: t9}
      - say: 'Subtract equation 1 from equation 2, so that $a$ goes. $8d$ minus $2d$ is $6d$.'
        write: '$(2) - (1):\quad 6d = (10x - 8y) - (4x - 2y)$'
        doodle_do:
          - {id: stairs, op: highlight, part: rise, text: '6 steps = 6d'}
      - say: 'Open the bracket. We get minus $4x$, and minus negative $2y$ is plus $2y$.'
        write: '$6d = 10x - 8y - 4x + 2y$'
      - say: '$10x$ minus $4x$ is $6x$. Negative $8y$ plus $2y$ is negative $6y$.'
        write: '$6d = 6x - 6y$'
      - say: 'Divide both sides by 6.'
        write: '$d = \dfrac{6x - 6y}{6}$'
      - say: 'Each term on top divides by 6.'
        write: '$\therefore\ d = x - y$'
        doodle_do:
          - {id: stairs, op: label, part: rise, text: 'd = x − y'}
      - section: 'Check'
        say: 'Check. Substitute $d$ in equation 1, so $a$ is $4x$ minus $2y$, minus 2 times, $x$ minus $y$, which is $2x$.'
        write: 'Check: $a = 4x - 2y - 2(x - y) = 2x$'
      - say: 'Then the 9th term is $2x$ plus 8 times, $x$ minus $y$, which is $2x$ plus $8x$ minus $8y$, or $10x$ minus $8y$. Correct.'
        write: '$T_{9} = 2x + 8(x - y) = 10x - 8y\ \checkmark$'
      - say: 'Therefore the common difference is $x$ minus $y$, which is answer choice C.'
        write: '$\therefore\ d = x - y$'
        answer: true
    traps:
      A: 'You went for $19x$ minus $17y$. That does not come from subtracting the equations. (2) minus (1) gives $6d$ equals $6x$ minus $6y$, so $d$ is $x$ minus $y$.'
      B: 'You went for $8x$ minus $4y$. From the 3rd term to the 9th there are 6 steps, so $6d$ equals $6x$ minus $6y$. Dividing by 6 gives $x$ minus $y$.'
      D: 'You went for $2x$. That is the first term, $a$, not the common difference. The common difference is $x$ minus $y$.'

  14:
    moments:
      - section: 'The question'
        say: 'We want the inverse of a letter, not a number. The answer is a formula in $p$, so the sign work must be careful. We find the identity first, then the inverse.'
        write: '$p * q = p + q - pq$, identity $= 0$. Find the inverse of $p$.'
      - section: 'The identity'
        say: 'Solution. Let $e$ be the identity element, so $p$ star $e$ equals $e$ star $p$ equals $p$.'
        write: 'Solution: let $e$ be the identity: $p * e = e * p = p$'
      - say: 'Substitute $e$ for $q$ in the rule, and set it equal to $p$.'
        write: '$p + e - pe = p$'
      - say: 'Subtract $p$ from both sides. The $p$ on each side cancels.'
        write: '$e - pe = 0$'
      - say: 'Factorise, so $e$ times, bracket, 1 minus $p$, equals 0. This holds for every $p$, so $e$ is 0, as the question says.'
        write: '$e(1 - p) = 0$ $\therefore e = 0$'
      - section: 'The inverse'
        say: 'Let $p$ inverse be the inverse of $p$. Then $p$ star $p$ inverse equals the identity, 0.'
        write: 'Let $p^{-1}$ be the inverse of $p$: $p * p^{-1} = e = 0$'
        doodle: {name: 'custom:2000_q14_a', id: star, caption: 'p and its inverse give 0'}
      - say: 'Use the rule with $p$ inverse in place of $q$, so $p$ plus $p$ inverse, minus $p$ times $p$ inverse, equals 0.'
        write: '$p + p^{-1} - p\,p^{-1} = 0$'
      - say: 'Keep the $p$ inverse terms on the left. Subtract $p$ from both sides.'
        write: '$p^{-1} - p\,p^{-1} = -p$'
      - say: 'Both terms on the left have $p$ inverse, so factorise it out.'
        write: '$p^{-1}(1 - p) = -p$'
      - say: 'Divide both sides by 1 minus $p$.'
        write: '$p^{-1} = \dfrac{-p}{1 - p}$'
      - say: 'Multiply the top and the bottom by minus 1 to tidy the signs. The top becomes $p$, and 1 minus $p$ becomes $p$ minus 1.'
        write: '$\therefore p^{-1} = \dfrac{p}{p - 1}$'
        doodle_do:
          - {id: star, op: label, part: slotq, text: 'p/(p − 1)'}
      - section: 'Check'
        say: 'To check, take $p$ star $p$ over $p$ minus 1. By the rule, that is $p$ plus $p$ over $p$ minus 1, minus $p$ squared over $p$ minus 1.'
        write: 'Check: $p * \dfrac{p}{p - 1} = p + \dfrac{p}{p - 1} - \dfrac{p^{2}}{p - 1}$'
      - say: 'Put everything over $p$ minus 1. The top is $p$ squared minus $p$, plus $p$, minus $p$ squared, which is 0. So the result is the identity, 0.'
        write: '$= \dfrac{p^{2} - p + p - p^{2}}{p - 1} = 0\ \checkmark$'
        doodle_do:
          - {id: star, op: circle, part: out}
      - say: 'The rule is the same with $p$ and $q$ swapped, so the inverse works from the other side too.'
        write: '$\dfrac{p}{p - 1} * p = p * \dfrac{p}{p - 1} = 0\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the inverse of $p$ is $p$ over $p$ minus 1, which is option C.'
        write: '$\therefore p^{-1} = \dfrac{p}{p - 1}$'
        answer: true
    traps:
      A: 'You went for $p$. Test $p = 3$. 3 star 3 is 3 plus 3 minus 9, which is minus 3, not the identity 0. The inverse is $p$ over $p - 1$.'
      B: 'You went for $p - 1$. Test $p = 3$. 3 star 2 is 3 plus 2 minus 6, which is minus 1, not 0. Solving $p^{-1}(1 - p) = -p$ gives $p$ over $p - 1$.'
      D: 'You went for $p$ over $p + 1$. That is a sign slip. When you multiply the top and bottom by minus 1, $1 - p$ becomes $p - 1$, not $p + 1$.'

  15:
    moments:
      - section: 'The question'
        say: 'A 2 by 2 matrix $P$ equals its own transpose, and $b$ is 1. A matrix equal to its transpose is called symmetric.'
        write: '$P = \begin{pmatrix} a & b \\ c & d \end{pmatrix},\quad P^{T} = P,\quad b = 1$'
        doodle: {name: 'custom:2000_q15_a', id: grid, caption: 'rows become columns'}
      - section: 'Solution'
        say: 'Solution. The transpose turns rows into columns, so the first row, $a$, $b$, becomes the first column, and the second row, $c$, $d$, becomes the second column.'
        write: 'Solution: $P^{T} = \begin{pmatrix} a & c \\ b & d \end{pmatrix}$'
        doodle_do:
          - {id: grid, op: circle, part: diag, text: 'a and d stay', 'on': 'transpose'}
          - {id: grid, op: pulse, part: swap, 'on': 'second column'}
      - say: '$P$ transpose equals $P$, and two matrices are equal when their matching entries are equal.'
        write: '$\begin{pmatrix} a & c \\ b & d \end{pmatrix} = \begin{pmatrix} a & b \\ c & d \end{pmatrix}$'
      - say: 'The entries on the leading diagonal match already, since $a$ equals $a$ and $d$ equals $d$. The top-right entries give the only condition, which is $c$ equals $b$.'
        write: 'Top right: $c = b$'
      - say: 'We are given $b$ equals 1, so $c$ is 1 as well.'
        write: '$\therefore\ c = b = 1$'
        doodle_do:
          - {id: grid, op: stage, stage: 'custom:2000_q15_a2', 'on': 'given'}
      - say: 'So $P$ has 1 in the top right and 1 in the bottom left. Nothing restricts $a$ and $d$, so we use the options to find them.'
        write: '$P = \begin{pmatrix} a & 1 \\ 1 & d \end{pmatrix}$'
      - section: 'Check the options'
        say: 'Compare the options with this form. B, C and D all have negative 1 in the bottom left, so they fail.'
        write: 'B, C, D: bottom left $= -1 \neq 1$'
      - say: 'Option A has 1 in both places. To check, transposing it swaps two 1s, so it gives back the same matrix.'
        write: 'Check: $\begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix}^{T} = \begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix}\ \checkmark$'
        doodle_do:
          - {id: grid, op: pulse, part: mirror}
      - say: 'Therefore $P$ is the matrix 0, 1, 1, 0, which is answer choice A.'
        write: '$\therefore\ P = \begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix}$'
        answer: true
    traps:
      B: 'You went for option B. Transposing it swaps the 1 and the negative 1, so its transpose is a different matrix. For $P^{T} = P$ the top-right and bottom-left entries must be equal, and both must be 1.'
      C: 'You went for option C. Its bottom-left entry is negative 1 while $b$ is 1, so transposing changes it. The bottom-left must equal $b$, which is 1.'
      D: 'You went for option D. Its bottom-left is negative 1, not 1, so it is not equal to its own transpose. Only a matrix with $c = b = 1$ is.'

  16:
    moments:
      - section: 'The question'
        say: 'Inside the bracket is a series that goes on forever, a half, minus a quarter, plus 1 over 8, minus 1 over 16, and so on. Then the whole bracket is raised to the power minus 1.'
        write: '$\left(\tfrac{1}{2} - \tfrac{1}{4} + \tfrac{1}{8} - \tfrac{1}{16} + \ldots\right)^{-1}$'
      - section: 'Solution'
        say: 'Solution. Each term is the one before it times the same number, so the series is a geometric progression, a G.P. The first term, $a$, is a half.'
        write: 'Solution: G.P. with $a = \tfrac{1}{2}$'
        doodle: {name: 'custom:2000_q16_a', id: walk, caption: 'Each jump is half the last, turned round', size: scene}
      - say: 'The common ratio, $r$, is the second term divided by the first. Minus a quarter divided by a half is minus a quarter times 2 over 1, which is minus a half.'
        write: '$r = \dfrac{T_{2}}{T_{1}} = -\dfrac{1}{4} \div \dfrac{1}{2} = -\dfrac{1}{4} \times \dfrac{2}{1} = -\dfrac{1}{2}$'
      - say: 'The sum to infinity exists only when $r$ is between minus 1 and 1. Minus a half is, so the jumps shrink and the sum settles down.'
        write: '$-1 < r < 1$, $\ \therefore S_{\infty}$ exists'
        doodle_do:
          - {id: walk, op: move, part: walker, path: hops}
      - section: 'Sum to infinity'
        say: 'The sum to infinity of a G.P. is $a$ over 1 minus $r$.'
        write: '$S_{\infty} = \dfrac{a}{1 - r}$'
      - say: 'Substitute $a$ equals a half and $r$ equals minus a half, in brackets. 1 minus minus a half is 1 plus a half, which is 3 over 2.'
        write: '$= \dfrac{\tfrac{1}{2}}{1 - \left(-\tfrac{1}{2}\right)} = \dfrac{\tfrac{1}{2}}{\tfrac{3}{2}}$'
      - say: 'To divide by 3 over 2, multiply by its reciprocal, 2 over 3. The 2s cancel, leaving 1 over 3.'
        write: '$= \dfrac{1}{2} \times \dfrac{2}{3} = \dfrac{1}{3}$'
        doodle_do:
          - {id: walk, op: stage, stage: 'custom:2000_q16_a2'}
      - section: 'The power minus 1'
        say: 'A power of minus 1 means the reciprocal, so $a$ to the minus 1 is 1 over $a$. So we flip 1 over 3.'
        write: '$\left(\dfrac{1}{3}\right)^{-1} = \dfrac{3}{1} = 3$'
        doodle_do:
          - {id: walk, op: label, part: flag, text: 'flip ⅓: 3'}
      - section: 'Check'
        say: 'Check by adding the first few terms. The sums are a half, then a quarter, then 3 over 8, then 5 over 16. These close in on a third from both sides.'
        write: 'Check: $\tfrac{1}{2},\ \tfrac{1}{4},\ \tfrac{3}{8},\ \tfrac{5}{16},\ \ldots \to \tfrac{1}{3}\ \checkmark$'
      - say: 'Therefore the value is 3, which is option B.'
        write: '$\therefore \left(\tfrac{1}{2} - \tfrac{1}{4} + \tfrac{1}{8} - \ldots\right)^{-1} = 3$'
        answer: true
    traps:
      A: 'You went for 2 over 3. That is the reciprocal of 3 over 2, which is only the bottom, 1 minus $r$. The sum is a third, and its reciprocal is 3.'
      C: 'You went for minus 2 over 3. The sum is positive, a third, because the first term is positive and each later term is smaller. Its reciprocal is 3.'
      D: 'You went for minus 1. The power minus 1 means take the reciprocal, not make it negative. The reciprocal of a third is 3.'

  17:
    moments:
      - section: 'The question'
        say: 'We have four graphs and two inequalities. Find each boundary line, where they cross, and which side of each is wanted. Then only one graph fits.'
        write: '$2x - 2 \le y,\quad 2y - 2 \le x$'
      - section: 'First inequality'
        say: 'Solution. Make $y$ the subject of each. The first says $y$ is at least $2x$ minus 2.'
        write: 'Solution: (1) $\ y \ge 2x - 2$'
      - say: 'Its boundary is the line $y$ equals $2x$ minus 2, with gradient 2, cutting the $y$-axis at minus 2. "At least" means the region above it.'
        write: 'Line $y = 2x - 2$: gradient 2, region above'
        point:
          - {figure: 0, kind: circle, target: {x: 60, y: 275}, text: 'cuts y-axis at −2'}
      - section: 'Second inequality'
        say: 'For the second, add 2 to both sides, then divide by 2. 2 is positive, so the sign stays.'
        write: '(2) $\ 2y \le x + 2 \Rightarrow y \le \tfrac{1}{2}x + 1$'
      - say: 'Its boundary is $y$ equals a half $x$ plus 1, with gradient a half, cutting the $y$-axis at 1. "At most" means the region below it.'
        write: 'Line $y = \tfrac{1}{2}x + 1$: gradient $\tfrac{1}{2}$, region below'
        point:
          - {figure: 0, kind: circle, target: {x: 60, y: 245}, text: 'cuts y-axis at 1'}
      - say: 'Both gradients are positive, so both lines slope upwards. That rules out graph B, whose lines slope down.'
        write: 'Both gradients $> 0$: not B'
        point:
          - {figure: 0, kind: strike, target: 'B', text: 'slopes down'}
      - section: 'Where they cross'
        say: 'Where do the lines cross? Solve them simultaneously by setting the two right-hand sides equal, and multiplying by 2.'
        write: '$2x - 2 = \tfrac{1}{2}x + 1 \Rightarrow 4x - 4 = x + 2$'
      - say: 'Subtract $x$ and add 4 on both sides, so $3x$ equals 6, and $x$ is 2. Then $y$ is 2 times 2 minus 2, which is 2.'
        write: '$3x = 6 \Rightarrow x = 2,\ \ y = 2(2) - 2 = 2$'
        point:
          - {figure: 0, kind: label, target: {x: 80, y: 235}, text: '(2, 2)'}
      - section: 'Test a point'
        say: 'Test the origin in both. Is 0 at least minus 2? Yes. Is 0 at most 1? Yes. So the origin is in the wanted region.'
        write: 'Test $(0,\ 0)$: $\ 0 \ge -2\ \checkmark,\ \ 0 \le 1\ \checkmark$'
        point:
          - {figure: 0, kind: circle, target: {x: 60, y: 255}, text: 'origin'}
      - say: 'So the region is above the steep line and below the gentle one, which is the wedge with its point at 2, 2, opening to the left over the origin.'
        write: '$\therefore$ wedge from $(2,\ 2)$ containing the origin'
        point:
          - {figure: 0, kind: arrow, target: {x: 35, y: 280}, text: 'origin inside'}
      - say: 'That is graph C, which is option C.'
        write: 'Graph C'
        answer: true
        point:
          - {figure: 0, kind: circle, target: 'C', text: 'this one'}
    traps:
      A: 'You went for graph A. It has the right lines, but it shades the wedge on the other side of the crossing point. The origin satisfies both inequalities, so it must be in the region, and in graph A it isn''t.'
      B: 'You went for graph B. Its lines slope downwards, but both boundary lines, $y = 2x - 2$ and $y = \tfrac{1}{2}x + 1$, have positive gradients.'
      D: 'You went for graph D. That shades below both lines. We need above the steep line and below the gentle one, and that region contains the origin.'

  18:
    moments:
      - section: 'The question'
        say: 'We want the values of $t$ that make this 3 by 3 determinant zero. Expand it, set it equal to zero, and solve.'
        write: '$\begin{vmatrix} t - 4 & 0 & 0 \\ -1 & t + 1 & 1 \\ 3 & 4 & t - 2 \end{vmatrix} = 0$'
      - section: 'Solution'
        say: 'Solution. Expand along the first row, which is $t - 4$, 0 and 0, with the signs plus, minus, plus. Each entry multiplies its minor, and the two zeros give zero terms.'
        write: 'Solution: $(t - 4)\begin{vmatrix} t + 1 & 1 \\ 4 & t - 2 \end{vmatrix} - 0 + 0 = 0$'
      - say: 'The minor of $t - 4$ is what is left when we cover its row and column. A 2 by 2 determinant is $ad$ minus $bc$.'
        write: '$(t - 4)[(t + 1)(t - 2) - (1)(4)] = 0$'
      - say: 'Expand the bracket. $t$ times $t$ is $t^{2}$, $t$ times negative 2 is negative $2t$, 1 times $t$ is $t$, and 1 times negative 2 is negative 2. Then minus 4.'
        write: '$(t - 4)(t^{2} - 2t + t - 2 - 4) = 0$'
      - say: 'Collect like terms. Negative $2t$ plus $t$ is negative $t$, and negative 2 minus 4 is negative 6.'
        write: '$(t - 4)(t^{2} - t - 6) = 0$'
      - section: 'Factorise the quadratic'
        say: 'Factorise $t^{2} - t - 6$. The product is negative 6 and the sum is negative 1. The factors are negative 3 and plus 2, because they multiply to negative 6 and add to negative 1.'
        write: 'Product $= -6$, Sum $= -1$; Factors: $-3,\ +2$'
      - say: 'Replace the middle term, negative $t$, with negative $3t$ plus $2t$.'
        write: '$t^{2} - t - 6 = t^{2} - 3t + 2t - 6$'
      - say: 'Group in pairs. Take $t$ out of the first pair and 2 out of the second. The two brackets match.'
        write: '$= t(t - 3) + 2(t - 3)$'
      - say: 'Take out the common bracket, $t - 3$.'
        write: '$= (t - 3)(t + 2)$'
      - say: 'So the whole equation is three factors multiplied together, equal to zero.'
        write: '$(t - 4)(t - 3)(t + 2) = 0$'
      - say: 'A product is zero only when one of its factors is zero.'
        write: 'Either $t - 4 = 0$ or $t - 3 = 0$ or $t + 2 = 0$'
      - say: 'Therefore $t$ is 4, 3 or negative 2.'
        write: '$\therefore\ t = 4,\ 3$ or $-2$'
      - section: 'Check'
        say: 'Check $t$ equals 3. The minor becomes 4, 1, 4, 1, and 4 times 1 minus 1 times 4 is 0. So the determinant is zero.'
        write: 'Check, $t = 3$: $(4)(1) - (1)(4) = 0\ \checkmark$'
      - say: 'Therefore $t$ is 4, negative 2 or 3, which is answer choice D.'
        write: '$\therefore\ t = 4,\ -2,\ 3$'
        answer: true
    traps:
      A: 'You went for 0, 2, 3. The first row gives the factor $t - 4$, so $t = 4$ must be a root. And $t^{2} - t - 6$ factorises to $(t - 3)(t + 2)$, giving 3 and negative 2.'
      B: 'You went for negative 4, 2, 3. The signs of two roots are flipped, because $t - 4 = 0$ gives positive 4, and $t + 2 = 0$ gives negative 2.'
      C: 'You went for negative 4, negative 2, negative 3. Setting $t - 4$ to zero gives positive 4, and $t - 3$ to zero gives positive 3.'

  19:
    moments:
      - section: 'The question'
        say: 'We have three factors and three unknowns. Each factor gives us one equation, by the factor theorem. Picture the cubic as a machine, so when you feed in the right number, out comes 0.'
        write: '$(x - 1),\ (x + 1),\ (x - 2)$ are factors of $ax^{3} + bx^{2} + cx - 1$'
        doodle: {name: 'custom:2000_q19_a', id: cubic, caption: 'feed in a root, out comes 0', 'on': 'machine'}
      - section: 'Solution'
        say: 'Solution. Give the polynomial a name, $f$ of $x$.'
        write: 'Let $f(x) = ax^{3} + bx^{2} + cx - 1$'
      - say: 'The factor theorem says $x - p$ is a factor of $f(x)$ when $f(p)$ is zero. So each factor gives an equation.'
        write: 'Factor theorem: $(x - p)$ is a factor $\Rightarrow f(p) = 0$'
      - section: 'Three equations'
        say: 'First factor, $x - 1$. Let $x - 1$ equal zero, therefore $x$ is 1.'
        write: 'Let $x - 1 = 0$, $\ \therefore x = 1$'
        doodle_do:
          - {id: cubic, op: label, part: inputs, text: 'feed in 1'}
      - say: 'Substitute 1 for $x$, each value in brackets. The answer must be zero.'
        write: '$f(1) = a(1)^{3} + b(1)^{2} + c(1) - 1 = 0$'
        doodle_do:
          - {id: cubic, op: pulse, part: out}
      - say: '1 cubed and 1 squared are both 1. So $a + b + c - 1 = 0$. Add 1 to both sides. Call it equation 1.'
        write: '$a + b + c = 1 \quad \ldots\ldots (1)$'
      - say: 'Second factor, $x + 1$. Let $x + 1$ equal zero, therefore $x$ is minus 1.'
        write: 'Let $x + 1 = 0$, $\ \therefore x = -1$'
      - say: 'Substitute minus 1 for $x$, each in brackets. Minus 1 cubed is minus 1, and minus 1 squared is plus 1.'
        write: '$f(-1) = a(-1)^{3} + b(-1)^{2} + c(-1) - 1 = 0$'
      - say: 'That is minus $a$ plus $b$ minus $c$ minus 1 equals zero. Add 1 to both sides. Call it equation 2.'
        write: '$-a + b - c = 1 \quad \ldots\ldots (2)$'
      - say: 'Third factor, $x - 2$. Let $x - 2$ equal zero, therefore $x$ is 2.'
        write: 'Let $x - 2 = 0$, $\ \therefore x = 2$'
      - say: 'Substitute 2 for $x$. 2 cubed is 8, and 2 squared is 4.'
        write: '$f(2) = a(2)^{3} + b(2)^{2} + c(2) - 1 = 0$'
      - say: 'That is $8a$ plus $4b$ plus $2c$ minus 1 equals zero. Add 1 to both sides. Call it equation 3.'
        write: '$8a + 4b + 2c = 1 \quad \ldots\ldots (3)$'
      - section: 'Solve the equations'
        say: 'Look at equations 1 and 2, with plus $a$ and minus $a$, plus $c$ and minus $c$. Add them, and both cancel.'
        write: '(1) + (2): $\ 2b = 2$'
        point:
          - {line: 5, kind: circle, at: 'a + b + c'}
          - {line: 8, kind: circle, at: '−a + b − c'}
      - say: 'Divide both sides by 2.'
        write: '$\therefore b = 1$'
      - say: 'Substitute $b = 1$ in equation 1.'
        write: 'Sub. $b = 1$ in (1): $\ a + 1 + c = 1$'
      - say: 'Subtract 1 from both sides. Call it equation 4.'
        write: '$a + c = 0 \quad \ldots\ldots (4)$'
      - say: 'Substitute $b = 1$ in equation 3. 4 times 1 is 4.'
        write: 'Sub. $b = 1$ in (3): $\ 8a + 4 + 2c = 1$'
      - say: 'Subtract 4 from both sides. 1 minus 4 is minus 3. Call it equation 5.'
        write: '$8a + 2c = -3 \quad \ldots\ldots (5)$'
      - say: 'To eliminate $c$, make its coefficients equal. Multiply equation 4 by 2. Call it equation 6.'
        write: '(4) $\times$ 2: $\ 2a + 2c = 0 \quad \ldots\ldots (6)$'
      - say: 'Now subtract equation 6 from equation 5. $2c$ cancels. $8a$ minus $2a$ is $6a$, and minus 3 minus 0 is minus 3.'
        write: '(5) $-$ (6): $\ 6a = -3$'
      - say: 'Divide both sides by 6. Minus 3 over 6 is minus 1 over 2.'
        write: '$a = -\dfrac{1}{2}$'
      - say: 'From equation 4, $c$ is minus $a$. Minus minus a half is plus a half.'
        write: 'From (4): $\ c = -a = \dfrac{1}{2}$'
      - section: 'Check'
        say: 'Check in equation 3. We get 8 times minus a half, plus 4 times 1, plus 2 times a half.'
        write: 'Check (3): $\ 8\left(-\tfrac{1}{2}\right) + 4(1) + 2\left(\tfrac{1}{2}\right)$'
      - say: 'Minus 4 plus 4 plus 1 is 1, as equation 3 says.'
        write: '$= -4 + 4 + 1 = 1$'
      - say: 'Therefore $a$ is minus a half, $b$ is 1 and $c$ is a half, which is answer choice A.'
        write: '$\therefore a = -\dfrac{1}{2},\ b = 1,\ c = \dfrac{1}{2}$'
        answer: true
    traps:
      B: 'You went for a half, 1, a half. Test equation 1. A half plus 1 plus a half is 2, not 1. Solving gives $6a = -3$, so $a$ is minus a half.'
      C: 'You went for a half, 1, minus a half. Equations 1 and 2 work, but test equation 3. 4 plus 4 minus 1 is 7, not 1. $a$ is minus a half and $c$ is plus a half.'
      D: 'You went for a half, minus 1, a half. Test equation 1. A half minus 1 plus a half is 0, not 1. Adding (1) and (2) gives $2b = 2$, so $b$ is plus 1.'

  20:
    moments:
      - section: 'The question'
        say: 'A trader makes $10x$ minus $x$ squared naira profit from selling $x$ bags of corn. We want the number of bags that gives the maximum profit.'
        write: 'Let the profit be $P$: $\ P = 10x - x^{2}$'
      - section: 'Solution'
        say: 'Solution. Differentiate with respect to $x$. $10x$ gives 10. For $x$ squared, bring down the 2 and reduce the power by 1, which gives $2x$.'
        write: 'Solution: $\dfrac{dP}{dx} = 10 - 2x$'
        diagram:
          id: g
          kind: graph
          x: [-1, 11]
          y: [-5, 30]
          y_step: 5
          x_label: x (bags)
          y_label: P (₦)
          plots:
            - {fn: '10x - x^2', label: 'P = 10x − x²', colour: blue}
      - section: 'Turning point'
        say: 'At the turning point, the gradient is zero. So we write that at turning point, $\dfrac{dP}{dx}$ equals 0.'
        'on': 'turning point'
        write: 'At turning point, $\dfrac{dP}{dx} = 0$'
      - say: 'So 10 minus $2x$ equals 0. Add $2x$ to both sides, and $2x$ equals 10.'
        write: '$10 - 2x = 0 \Rightarrow 2x = 10$'
      - say: 'Divide both sides by 2. $x$ equals 5.'
        write: '$x = \dfrac{10}{2} = 5$'
      - section: 'Maximum or minimum?'
        say: 'Differentiate again. 10 gives 0, and minus $2x$ gives minus 2.'
        write: '$\dfrac{d^{2}P}{dx^{2}} = -2$'
      - say: 'The second derivative is negative, less than zero, so the turning point is a maximum, the top of the hill.'
        'on': 'negative'
        write: '$\dfrac{d^{2}P}{dx^{2}} = -2 < 0$, $\ \therefore$ maximum'
        diagram_do:
          - {id: g, op: vertex, part: 'plot:1', text: 'maximum', 'on': 'maximum'}
      - say: 'The maximum profit itself is 10 times 5, minus 5 squared, so 50 minus 25, which is 25 naira.'
        write: '$P_{\max} = 10(5) - 5^{2} = 50 - 25 = 25$'
      - section: 'Check'
        say: 'Here is an exam tip, as a check. For a quadratic, the turning point is at $x$ equals minus $b$ over $2a$. Here $a$ is minus 1 and $b$ is 10.'
        write: 'Exam tip: $x = -\dfrac{b}{2a} = -\dfrac{10}{2(-1)} = 5\ \checkmark$'
      - say: 'Therefore 5 bags give the maximum profit, which is option B.'
        write: '$\therefore$ maximum profit at $x = 5$ bags'
        answer: true
    traps:
      A: 'You went for 4. At 4 bags the profit is 40 minus 16, which is ₦24, less than ₦25 at 5 bags. Set $\dfrac{dP}{dx} = 10 - 2x$ equal to 0, and $x = 5$.'
      C: 'You went for 6. At 6 bags the profit is 60 minus 36, which is ₦24, already falling. The turning point is at $x = 5$.'
      D: 'You went for 7. At 7 bags the profit is 70 minus 49, which is ₦21. The profit is highest at $x = 5$, where $\dfrac{dP}{dx} = 0$.'

  21:
    moments:
      - section: 'The question'
        say: 'This is a quadratic inequality with $x$ squared on the wrong side. Move everything across carefully, and the sign table does the rest.'
        write: '$2 - x > x^{2}$'
      - say: 'Solution. Bring everything to the right-hand side, so that $x$ squared stays positive. Subtract 2 and add $x$ on both sides.'
        write: 'Solution: $\ 0 > x^{2} + x - 2$'
      - say: 'Read it the other way round, so $x$ squared plus $x$ minus 2 is less than zero.'
        write: '$x^{2} + x - 2 < 0$'
      - section: 'Factorise'
        say: 'Product and sum. The product is minus 2 and the sum is 1. Plus 2 and minus 1 work, because they multiply to minus 2 and add to 1.'
        write: 'Product $= -2$, $\ $Sum $= 1$: $\ +2,\ -1$'
      - say: 'Split the middle term, $x$, into $2x$ minus $x$.'
        write: '$x^{2} + 2x - x - 2 < 0$'
      - say: 'Group in pairs. Take $x$ out of the first pair, and minus 1 out of the second.'
        write: '$x(x + 2) - 1(x + 2) < 0$'
      - say: 'Take out the common bracket, $x$ plus 2.'
        write: '$(x - 1)(x + 2) < 0$'
      - say: 'For the critical values, $x$ minus 1 is zero at 1, and $x$ plus 2 is zero at minus 2.'
        write: 'Critical values: $\ x = -2,\ \ x = 1$'
      - section: 'Sign table'
        say: 'Now the sign table, with three regions, one row for each bracket, then the product.'
        diagram:
          id: t
          kind: table
          columns: ['Factor', 'x < −2', '−2 < x < 1', 'x > 1']
          rows: [['x + 2', '', '', ''], ['x − 1', '', '', ''], ['product', '', '', '']]
      - say: '$x$ plus 2 is negative below minus 2, and positive above it.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,2', text: '−'}
          - {id: t, op: fill, part: 'cell:1,3', text: '+'}
          - {id: t, op: fill, part: 'cell:1,4', text: '+'}
      - say: '$x$ minus 1 is negative below 1, and positive above it.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:2,2', text: '−'}
          - {id: t, op: fill, part: 'cell:2,3', text: '−'}
          - {id: t, op: fill, part: 'cell:2,4', text: '+'}
      - say: 'Multiply down each column, which gives plus, minus, plus. The product is negative only in the middle.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:3,2', text: '+'}
          - {id: t, op: fill, part: 'cell:3,3', text: '−', colour: green}
          - {id: t, op: fill, part: 'cell:3,4', text: '+'}
      - section: 'Answer'
        say: 'We want less than zero, so we take the middle column.'
        write: '$\therefore\ -2 < x < 1$'
      - say: 'On a number line, we draw open circles at minus 2 and 1, and the stretch between.'
        diagram: {id: n, kind: numberline, range: [-4, 3]}
        diagram_do:
          - {id: n, op: interval, from: -2, to: 1, from_open: true, to_open: true, text: '−2 < x < 1', answer: true, 'on': 'open circles'}
      - section: 'Check'
        say: 'Check $x$ equals 0, inside. 2 minus 0 is 2, and 0 squared is 0. 2 is greater than 0. And for $x$ equals 2, outside, 0 is not greater than 4.'
        write: 'Check: $\ x = 0$: $2 > 0\ \checkmark$; $\ x = 2$: $0 > 4\ \times$'
      - say: 'So $x$ lies between minus 2 and 1, which is option D.'
        write: '$-2 < x < 1$'
        answer: true
    traps:
      A: 'You went for $x < -2$ or $x > 1$. The critical values are right, but those are the outer columns, where the product is positive. We need it less than zero, which is the middle column.'
      B: 'You went for $x > 2$ or $x < -1$. The factors are $(x - 1)(x + 2)$, so the critical values are minus 2 and 1, not 2 and minus 1. And less than zero means between them.'
      C: 'You went for minus 1 less than $x$ greater than 2. That is not a proper range, and the critical values are minus 2 and 1. The solution is $-2 < x < 1$.'

  22:
    moments:
      - section: 'The question'
        say: 'Alpha and beta are the roots of this quadratic, and we want 1 over alpha plus 1 over beta. We never need the roots themselves, because the coefficients tell us enough.'
        write: '$3x^{2} + 5x - 2 = 0$, find $\dfrac{1}{\alpha} + \dfrac{1}{\beta}$'
      - section: 'Solution'
        say: 'Solution. Compare the equation with the general quadratic, $a$ $x$ squared plus $b$ $x$ plus $c$ equals zero, and list $a$, $b$ and $c$ first.'
        write: 'Compare with $ax^{2} + bx + c = 0$:'
      - say: '$a$, the coefficient of $x$ squared, is 3. $b$, the number in front of $x$, is 5. $c$, the constant term, is minus 2, so keep its sign.'
        write: '$a = 3,\ b = 5,\ c = -2$'
      - section: 'Sum and product of roots'
        say: 'Recall that the sum of the roots, alpha plus beta, is minus $b$ over $a$.'
        write: '$\alpha + \beta = -\dfrac{b}{a}$'
      - say: 'Substitute $b$ equals 5 and $a$ equals 3. So alpha plus beta is minus 5 over 3. Keep the minus sign in front.'
        write: '$= -\dfrac{5}{3}$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: 'b = [[5]]'}, at: '5', text: 'b'}
          - {line: 4, kind: move, from: {line: 2, at: 'a = [[3]]'}, at: '3', text: 'a'}
      - say: 'The product of the roots, alpha times beta, is $c$ over $a$.'
        write: '$\alpha\beta = \dfrac{c}{a}$'
      - say: 'Substitute $c$ equals minus 2 and $a$ equals 3. Alpha beta is minus 2 over 3.'
        write: '$= \dfrac{-2}{3}$'
        point:
          - {line: 6, kind: move, from: {line: 2, at: 'c = [[−2]]'}, at: '−2', text: 'c'}
      - section: 'Sum over product'
        say: 'Now add the two fractions. The LCM of alpha and beta is alpha beta. So 1 over alpha plus 1 over beta is beta plus alpha, all over alpha beta.'
        write: '$\dfrac{1}{\alpha} + \dfrac{1}{\beta} = \dfrac{\beta + \alpha}{\alpha\beta}$'
      - say: 'Beta plus alpha is the same as alpha plus beta. So what we want is the sum of the roots over the product of the roots.'
        write: '$= \dfrac{\alpha + \beta}{\alpha\beta}$'
      - say: 'Substitute minus 5 over 3 for the sum, divided by minus 2 over 3 for the product. Keep each one in brackets.'
        write: '$= \left(-\dfrac{5}{3}\right) \div \left(-\dfrac{2}{3}\right)$'
        point:
          - {line: 9, kind: move, from: {line: 4, at: '−35'}, at: '(−35)', text: 'sum'}
          - {line: 9, kind: move, from: {line: 6, at: '3−2'}, at: '(−32)', text: 'product'}
      - say: 'To divide by a fraction, multiply by its reciprocal. The reciprocal of minus 2 over 3 is minus 3 over 2.'
        write: '$= -\dfrac{5}{3} \times \left(-\dfrac{3}{2}\right)$'
      - say: 'The 3s cancel, and minus times minus is plus. That leaves 5 over 2.'
        write: '$= \dfrac{5}{2}$'
      - section: 'Check'
        say: 'Check with the real roots. By product and sum, product minus 6, sum 5, the factors are 6 and minus 1. The equation factorises as $3x$ minus 1, times $x$ plus 2.'
        write: 'Check: $(3x - 1)(x + 2) = 0$'
      - say: 'Either $3x$ minus 1 is zero, or $x$ plus 2 is zero. So the roots are 1 over 3 and minus 2.'
        write: 'Roots: $x = \dfrac{1}{3}$ or $x = -2$'
      - say: 'The reciprocal of 1 over 3 is 3, and the reciprocal of minus 2 is minus 1 over 2. 3 minus 1 over 2 is 5 over 2. It agrees.'
        write: '$\dfrac{1}{\alpha} + \dfrac{1}{\beta} = 3 - \dfrac{1}{2} = \dfrac{5}{2}$'
      - say: 'Therefore 1 over alpha plus 1 over beta is 5 over 2, which is answer choice D.'
        write: '$\therefore \dfrac{1}{\alpha} + \dfrac{1}{\beta} = \dfrac{5}{2}$'
        answer: true
    traps:
      A: 'You went for minus 5 over 2. The size is right, but a sign went missing. The sum is minus 5 over 3 and the product is minus 2 over 3, and a minus divided by a minus is a plus.'
      B: 'You went for minus 2 over 3. That is the product of the roots, alpha beta, on its own. We want the sum of the roots divided by the product.'
      C: 'You went for 1 over 2. Add the fractions with LCM alpha beta: 1 over alpha plus 1 over beta is alpha plus beta over alpha beta. Minus 5 over 3 divided by minus 2 over 3 is 5 over 2.'

  23:
    moments:
      - section: 'The question'
        say: 'We want the smallest value of $f$ of $\theta$, which is 2 over, 3 minus cos $\theta$, for $\theta$ from 0 to 2 pi. Only cos $\theta$ changes, so we start from its range.'
        write: '$f(\theta) = \dfrac{2}{3 - \cos\theta}$, $\ 0 \le \theta \le 2\pi$'
      - section: 'Solution'
        say: 'Solution. For every angle, cos $\theta$ lies between minus 1 and 1.'
        write: '$-1 \le \cos\theta \le 1$'
      - say: 'Multiply through by minus 1. Multiplying an inequality by a negative number reverses the signs.'
        write: '$1 \ge -\cos\theta \ge -1$'
      - say: 'Add 3 throughout. 3 plus 1 is 4, and 3 minus 1 is 2.'
        write: '$4 \ge 3 - \cos\theta \ge 2$'
      - say: 'So the denominator lies between 2 and 4.'
        write: '$2 \le 3 - \cos\theta \le 4$'
      - section: 'Smallest value'
        say: 'The top is fixed at 2. A fraction with a fixed top is smallest when its bottom is biggest, just as 2 pizzas shared by more people give each a smaller share.'
        'on': 'smallest when'
        write: '$f$ is least when $3 - \cos\theta$ is greatest'
        doodle: {name: 'custom:2000_q23_a', id: pizza, caption: '2 pizzas, shared out', size: scene}
      - say: 'The greatest denominator is 4. It happens when cos $\theta$ is minus 1, at $\theta$ equals pi, which is in the range.'
        write: 'Greatest denominator $= 4$, when $\cos\theta = -1$ $(\theta = \pi)$'
        doodle_do:
          - {id: pizza, op: stage, stage: 'custom:2000_q23_a2'}
      - say: 'So the least value of $f$ is 2 over 4.'
        write: '$f_{\min} = \dfrac{2}{4}$'
      - say: '2 over 4 reduces to 1 over 2, which is half a pizza each, the smallest share.'
        write: '$= \dfrac{1}{2}$'
        doodle_do:
          - {id: pizza, op: circle, part: four, text: 'the smallest share'}
      - section: 'Check'
        say: 'Check by substituting $\theta$ equals pi. 3 minus minus 1 is 4, and 2 over 4 is a half. At the other end, the denominator 2 gives 1, the maximum.'
        write: 'Check: $f(\pi) = \dfrac{2}{3 - (-1)} = \dfrac{2}{4} = \dfrac{1}{2}\ \checkmark$'
      - say: 'Therefore the minimum value is 1 over 2, which is answer choice A.'
        write: '$\therefore f_{\min} = \dfrac{1}{2}$'
        answer: true
    traps:
      B: 'You went for 2 over 3. That is the value when cos $\theta$ is 0, so the bottom is 3. But cos $\theta$ goes down to minus 1, which makes the bottom 4 and the fraction smaller.'
      C: 'You went for 1. That comes from cos $\theta$ equal to 1, which makes the bottom smallest, 2, so it gives the maximum. For the minimum we want the greatest bottom, 4.'
      D: 'You went for 2. That is just the top of the fraction. The bottom lies between 2 and 4, so $f$ is never more than 1.'

  24:
    moments:
      - section: 'The question'
        say: 'A frustum is a big pyramid with a small pyramid cut off the top. The small pyramid has the same shape as the big one, so their sides and heights are in the same ratio.'
        write: 'Find the height of the pyramid.'
      - section: 'Solution'
        say: 'Write Solution, then sketch the frustum, with a 2 metre square on top and a 5 metre square at the bottom, 6 metres apart.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: underline, target: '2 m', text: 'top', 'on': '2 metre'}
          - {figure: sketch, kind: underline, target: '5 m', text: 'bottom', 'on': '5 metre'}
          - {figure: sketch, kind: underline, target: '6 m', text: 'depth', 'on': '6 metres apart'}
      - say: 'Now complete the pyramid the frustum was cut from, carrying its edges up to the vertex V.'
        write: 'Complete the pyramid to its vertex $V$'
        show_sketch: sketch_b
        point:
          - {figure: sketch_b, kind: circle, target: V, text: 'vertex', 'on': 'vertex'}
      - section: 'What we know'
        say: 'Let the height of the whole pyramid be $h$ metres.'
        write: 'Let the height of the pyramid be $h$ m'
        point:
          - {figure: sketch_b, kind: circle, target: 'h = ?', text: 'big pyramid', 'on': 'whole pyramid'}
      - say: 'The small pyramid on top is the whole height minus the 6 metres of the frustum, which is $h$ minus 6.'
        write: 'Height of small pyramid $= h - 6$'
        point:
          - {figure: sketch_b, kind: circle, target: 'h − 6', text: 'small pyramid', 'on': 'small pyramid'}
      - say: 'The small pyramid and the big pyramid are similar, because the cut is parallel to the base.'
        write: 'Small pyramid $|||$ big pyramid (cut parallel to the base)'
        'on': 'similar'
      - section: 'The ratio'
        say: 'For similar solids, corresponding lengths are in the same ratio. So base side over base side equals height over height.'
        write: '$\dfrac{\text{side of small}}{\text{side of big}} = \dfrac{\text{height of small}}{\text{height of big}}$'
      - say: 'Now substitute. The small side is 2, the big side is 5, the small height is $h$ minus 6, and the big height is $h$.'
        write: '$\dfrac{2}{5} = \dfrac{h - 6}{h}$'
      - say: 'Cross-multiply, so 2 times $h$ equals 5 times, $h$ minus 6.'
        write: '$2h = 5(h - 6)$'
        'on': 'Cross-multiply'
      - say: 'Expand the bracket. 5 times $h$ is $5h$, and 5 times 6 is 30.'
        write: '$2h = 5h - 30$'
      - say: 'Collect the $h$ terms on one side and the numbers on the other.'
        write: '$30 = 5h - 2h$'
      - say: '$5h$ minus $2h$ is $3h$.'
        write: '$30 = 3h$'
      - say: 'Divide both sides by 3. 30 divided by 3 is 10.'
        write: '$h = \dfrac{30}{3} = 10$'
      - say: 'Therefore the pyramid is 10 metres high.'
        write: '$\therefore$ height of pyramid $= 10$ m'
        point:
          - {figure: sketch_b, kind: label, target: 'h = ?', text: '10 m', 'on': 'Therefore'}
      - section: 'Check'
        say: 'To check, the small pyramid is 10 minus 6, which is 4 metres high. 4 over 10 is 2 over 5, the same ratio as the sides.'
        write: 'Check: $\dfrac{10 - 6}{10} = \dfrac{4}{10} = \dfrac{2}{5}$ ✓'
      - section: 'Answer'
        say: 'So the pyramid was 10.0 metres high, which is answer choice D.'
        write: '$\therefore h = 10.0$ m (D)'
        answer: true
    traps:
      A: 'You went for 8.0 metres. Then the small pyramid is 2 metres high, and 2 over 8 is not 2 over 5. Solve $\dfrac{2}{5} = \dfrac{h - 6}{h}$, and $h$ is 10.'
      B: 'You went for 8.4 metres. Check it in the ratio. 8.4 minus 6 is 2.4, and 2.4 over 8.4 is not 2 over 5. Solving $2h = 5(h - 6)$ gives 10.'
      C: 'You went for 9.0 metres. Then the small pyramid is 3 metres high, and 3 over 9 is a third, not 2 over 5. The height that fits the ratio is 10.'

  25:
    moments:
      - section: 'The question'
        say: 'We have a point moving in the same direction as a line, and a 50 degree angle. Name the locus first, and parallel-line angles do the rest. Many students give 50 here.'
        write: '$P$ moves in the direction of $UV$; $\angle VUS = 50^{\circ}$; find $\angle UST$'
      - section: 'Solution'
        say: 'Solution. Let me sketch $UV$, the path $ST$ of $P$, and the line $US$ joining them.'
        show_sketch: true
        write: 'Solution'
        point:
          - {figure: sketch, kind: arc, target: VUS, text: '50°'}
      - say: 'Name the locus. A point on one side of a line, moving in the same direction as the line, keeps a fixed distance from it. Its locus is a line parallel to $UV$.'
        write: 'Locus of $P$ $=$ a line parallel to $UV$'
        point:
          - {figure: sketch, kind: circle, target: 'locus of P', text: 'parallel to UV'}
      - say: '$ST$ is on the locus, so $ST$ is parallel to $UV$.'
        write: '$\therefore ST \parallel UV$'
        point:
          - {figure: sketch, kind: highlight, target: ST}
          - {figure: sketch, kind: highlight, target: UV}
      - say: '$US$ crosses both parallel lines. Angles $VUS$ and $UST$ are between the parallels, on the same side of $US$, so they are co-interior angles, which add up to 180.'
        write: '$\angle VUS + \angle UST = 180^{\circ}$ (co-int. $\angle$s, $ST \parallel UV$)'
        point:
          - {figure: sketch, kind: underline, target: US, text: 'transversal'}
          - {figure: sketch, kind: arc, target: UST}
      - say: 'Substitute 50 degrees for angle $VUS$.'
        write: '$50^{\circ} + \angle UST = 180^{\circ}$'
      - say: 'Subtract 50 from both sides. 180 minus 50 is 130.'
        write: '$\angle UST = 180^{\circ} - 50^{\circ} = 130^{\circ}$'
        point:
          - {figure: sketch, kind: label, target: '?', text: '130°'}
      - section: 'Check'
        say: 'To check, 130 plus 50 is 180. And the angle at $S$ is obtuse while the angle at $U$ is acute, as co-interior angles are when they are not both 90.'
        write: 'Check: $130^{\circ} + 50^{\circ} = 180^{\circ}\ \checkmark$'
      - say: 'Here is an exam tip. Alternate angles, the Z shape, are equal, and co-interior angles, the C shape, add up to 180. Here we have a C shape.'
        write: 'Z shape: equal; $\ $C shape: sum $= 180^{\circ}$'
      - say: 'Therefore angle $UST$ is 130 degrees, which is option B.'
        write: '$\therefore \angle UST = 130^{\circ}$'
        answer: true
    traps:
      A: 'You went for 310 degrees. That is 360 minus 50, as if the angles went all the way round a point. These are co-interior angles between parallel lines, so they add up to 180.'
      C: 'You went for 80 degrees. No step gives 80 here. $ST$ is parallel to $UV$, so the two angles are co-interior and add up to 180, so angle $UST$ is 130.'
      D: 'You went for 50 degrees. That would be right for alternate angles, on opposite sides of $US$. These two are on the same side, so they add up to 180, giving 130.'

  26:
    moments:
      - section: 'The question'
        say: 'A ship sails 50 km on S 50 degrees E, then 50 km on N 40 degrees E. Many students just add or subtract the two bearings. A bearing question needs a triangle.'
        write: '$50$ km on $S50^{\circ}E$, then $50$ km on $N40^{\circ}E$'
      - section: 'Solution'
        say: 'Solution. Let me draw the voyage, starting at $A$, turning at $B$, and ending at $C$. I put a North line at $A$ and at $B$. North lines are always parallel.'
        write: 'Solution: N lines at $A$ and $B$ ($\parallel$)'
        show_sketch: true
        'on': 'North line'
        point:
          - {figure: sketch, kind: highlight, target: AB, text: '50 km'}
          - {figure: sketch, kind: highlight, target: BC, text: '50 km'}
      - say: 'S 50 degrees E means we stand at $A$, face South, then turn 50 degrees towards East. So the angle between the South line at $A$ and $AB$ is 50 degrees.'
        write: '$\angle SAB = 50^{\circ}$ (given, $S50^{\circ}E$)'
        point:
          - {figure: sketch, kind: arc, target: SAB, text: '50°'}
      - section: 'The angle inside at B'
        say: 'Now stand at $B$. The North line at $B$ is parallel to the line $SA$, and $AB$ cuts both. So the angle between North at $B$ and $BA$ is also 50 degrees, because they are alternate angles.'
        write: '$\angle ABN = 50^{\circ}$ (alt. $\angle$s, N lines $\parallel$)'
        point:
          - {figure: sketch, kind: label, target: B, text: 'N to BA: 50° (alt.)'}
      - say: 'The second leg, N 40 degrees E, is measured from the North line at $B$, clockwise round to $BC$.'
        write: '$\angle NBC = 40^{\circ}$ (given, $N40^{\circ}E$)'
        point:
          - {figure: sketch, kind: circle, target: '40°', text: 'from N at B'}
      - say: 'The angle inside the triangle at $B$ is the two together, so 50 plus 40 is 90 degrees. That is a right angle.'
        write: '$\angle ABC = 50^{\circ} + 40^{\circ} = 90^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: ABC, text: '90°'}
      - section: 'The angle at A'
        say: 'Both legs are 50 km, so triangle $ABC$ is isosceles. Its base angles, at $A$ and at $C$, are equal.'
        write: '$\angle BAC = \angle BCA$ (base $\angle$s of isos. $\triangle$)'
        point:
          - {figure: sketch, kind: arc, target: BAC}
          - {figure: sketch, kind: arc, target: BCA}
      - say: 'Angles in a triangle add up to 180 degrees. Take away the 90, and share what is left equally between $A$ and $C$.'
        write: '$\angle BAC = \dfrac{180^{\circ} - 90^{\circ}}{2} = 45^{\circ}$'
        point:
          - {line: 7, kind: move, from: {line: 5, at: '= [[90∘]]'}, at: '− [[90∘]]', text: '∠ABC'}
          - {figure: sketch, kind: arc, target: BAC, text: '45°'}
      - section: 'Back to a bearing'
        say: 'Now turn it back into a bearing, measured clockwise from North at $A$. $AB$ is 50 degrees short of South, and South is 180. So 180 minus 50 is 130.'
        write: 'Bearing of $B$ from $A = 180^{\circ} - 50^{\circ} = 130^{\circ}$'
      - say: 'Let me join $A$ to $C$. $AC$ lies 45 degrees on the North side of $AB$, so we turn back 45 degrees, and 130 minus 45 is 85.'
        write: 'Bearing of $C$ from $A = 130^{\circ} - 45^{\circ} = 085^{\circ}$'
        show_sketch: sketch_b
        'on': 'join'
        point:
          - {line: 9, kind: move, from: {line: 7, at: '= [[45∘]]'}, at: '− [[45∘]]', text: '∠BAC'}
          - {figure: sketch_b, kind: circle, target: '?', text: '085°'}
      - say: 'A bearing is written in three figures, so it is zero-eight-five degrees. In the compass form, 85 degrees from North towards East is N 85 degrees E.'
        write: '$085^{\circ}$ is $N85^{\circ}E$'
      - section: 'Check'
        say: 'Check with SOH CAH TOA. Going North, the ship gains 50 cos 40. Going South, it loses 50 cos 50. The difference is 6.2 km North.'
        write: 'Check: $50\cos 40^{\circ} - 50\cos 50^{\circ} \approx 38.3 - 32.1 = 6.2$'
      - say: 'So $C$ ends a little North of due East of $A$. Due East is 090, so the bearing is a little under 090. 085 fits.'
        write: '$6.2 > 0$: just North of East, below $090^{\circ}$ $\checkmark$'
      - section: 'Answer'
        say: 'So the bearing of the ship from its starting point is N 85 degrees E, which is answer choice D.'
        write: '$\therefore$ Bearing of $C$ from $A = N85^{\circ}E$'
        answer: true
        point:
          - {figure: sketch_b, kind: label, target: '?', text: 'N85°E'}
    traps:
      A: 'You went for S 90 degrees E, due East. That writes the 90 degrees inside the triangle at $B$ as if it were the bearing. The bearing is taken at $A$, from the North line. 130 minus 45 is 085, which is N 85 degrees E.'
      B: 'You went for N 40 degrees E. That is only the direction of the second leg, taken at $B$. The bearing from the start needs the triangle. 130 minus 45 is 085, which is N 85 degrees E.'
      C: 'You went for S 95 degrees E. That adds the 45 degrees to the 50 degrees from South, turning the wrong way. $AC$ is on the North side of $AB$, so subtract. 130 minus 45 is 085, which is N 85 degrees E.'

  27:
    moments:
      - section: 'The question'
        say: 'We have an equilateral triangle with its corners on a circle. Many students give the diameter instead of the radius. The angle at the centre leads straight to the radius.'
        write: 'Equilateral $\triangle$, side $\sqrt{3}$ cm, inscribed in a circle; $R = ?$'
      - section: 'Solution'
        say: 'Solution. Let me sketch triangle $ABC$ in the circle, centre $O$. Each angle of an equilateral triangle is 60 degrees.'
        show_sketch: true
        write: 'Solution: $\angle BAC = 60^{\circ}$ (equilateral $\triangle$)'
        point:
          - {figure: sketch, kind: arc, target: BAC, text: '60°'}
      - say: 'Join $O$ to $B$ and $C$. Angle $BOC$ at the centre stands on the same arc as angle $BAC$. The reason is that the angle at the centre is twice the angle at the circumference.'
        show_sketch: sketch_b
        write: '$\angle BOC = 2 \times 60^{\circ} = 120^{\circ}$ ($\angle$ at centre $= 2 \times \angle$ at circumference)'
        point:
          - {figure: sketch_b, kind: arc, target: BOC, text: '120°'}
      - say: '$OB$ and $OC$ are radii, so both are $R$.'
        write: '$OB = OC = R$ (radii)'
        point:
          - {figure: sketch_b, kind: highlight, target: OB}
          - {figure: sketch_b, kind: highlight, target: OC}
      - say: 'In triangle $BOC$ we know two sides and the angle between them, so we use the cosine rule for the third side, $BC$.'
        write: '$BC^{2} = OB^{2} + OC^{2} - 2(OB)(OC)\cos 120^{\circ}$ (cosine rule)'
        point:
          - {figure: sketch_b, kind: highlight, target: BC, text: '√3'}
      - say: 'Substitute root 3 for $BC$ and $R$ for both radii.'
        write: '$(\sqrt{3})^{2} = R^{2} + R^{2} - 2R^{2}\cos 120^{\circ}$'
      - say: 'Root 3 squared is 3, and cos 120 is negative a half. So minus 2 $R$ squared times negative a half is plus $R$ squared.'
        write: '$3 = 2R^{2} + R^{2} = 3R^{2}$'
      - say: 'Divide both sides by 3. $R$ squared is 1.'
        write: '$R^{2} = 1$'
      - say: 'A radius is positive, so $R$ is the square root of 1, which is 1.'
        write: '$R = 1$ cm'
        point:
          - {figure: sketch_b, kind: label, target: 'R = ?', text: '1 cm'}
      - section: 'Check'
        say: 'Check with the sine rule, where a side over the sine of the opposite angle equals the diameter, $2R$. Root 3 over sin 60 is root 3 over root 3 over 2, which is 2. So $2R$ is 2, and $R$ is 1.'
        write: 'Check: $\dfrac{\sqrt{3}}{\sin 60^{\circ}} = 2 = 2R\ \checkmark$'
      - say: 'Therefore the radius of the circle is 1 cm, which is option C.'
        write: '$\therefore R = 1$ cm'
        answer: true
    traps:
      A: 'You went for 2 over 3 cm. The 2 over 3 belongs to a different fact, that the centre is 2 over 3 of the way down the height. The height here is 3 over 2, and 2 over 3 of that is 1.'
      B: 'You went for 2 cm. That is the diameter, $2R$, not the radius. Half of 2 is 1.'
      D: 'You went for 3 cm. That is the side squared. From $3 = 3R^{2}$, $R$ squared is 1, so $R$ is 1.'

  28:
    moments:
      - section: 'The question'
        say: 'Two lines are perpendicular, and one of them contains $K$. Many students forget the minus sign. Find both gradients, then use the perpendicular rule.'
        write: '$3y = 4x - 1,\ \ Ky = x + 3$ are $\perp$; find $K$'
      - section: 'Solution'
        say: 'Solution. Two lines are perpendicular when the product of their gradients is negative 1. So we need each gradient, from the form $y$ equals $mx$ plus $c$.'
        write: 'Solution: for $\perp$ lines, $m_{1}m_{2} = -1$'
      - say: 'First line. Divide 3 $y$ equals 4 $x$ minus 1 all through by 3, to make $y$ the subject.'
        write: '$y = \dfrac{4}{3}x - \dfrac{1}{3}$ (divide by 3)'
      - say: 'The gradient is the coefficient of $x$. So $m$ 1 is 4 over 3, meaning the line goes up 4 for every 3 along.'
        write: '$\therefore m_{1} = \dfrac{4}{3}$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '= [[34]]x'}, at: '= [[34]]', text: 'gradient'}
        doodle: {name: 'custom:2000_q28_a', id: hill, caption: 'Up 4 for every 3 along'}
      - say: 'Second line. Divide $Ky$ equals $x$ plus 3 all through by $K$.'
        write: '$y = \dfrac{1}{K}x + \dfrac{3}{K}$ (divide by $K$)'
      - say: 'The coefficient of $x$ is 1 over $K$, so that is $m$ 2.'
        write: '$\therefore m_{2} = \dfrac{1}{K}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '= [[K1]]x'}, at: '= [[K1]]', text: 'gradient'}
      - say: 'Substitute both gradients into $m$ 1 times $m$ 2 equals negative 1.'
        write: '$\dfrac{4}{3} \times \dfrac{1}{K} = -1$'
        point:
          - {line: 6, kind: move, from: {line: 3, at: '= [[34]]'}, at: '[[34]] ×', text: 'm₁'}
          - {line: 6, kind: move, from: {line: 5, at: '= [[K1]]'}, at: '× [[K1]]', text: 'm₂'}
        doodle_do:
          - {id: hill, op: pulse, part: hill1}
      - say: 'Multiply the fractions, and 4 times 1 over 3 times $K$ gives 4 over 3 $K$.'
        write: '$\dfrac{4}{3K} = -1$'
      - say: 'Cross-multiply, so 4 equals negative 1 times 3 $K$, which is negative 3 $K$.'
        write: '$4 = -3K$'
      - say: 'Divide both sides by negative 3.'
        write: '$K = -\dfrac{4}{3}$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '[[−3]]K'}, at: 'K = [[−3]]4', text: 'divide'}
      - section: 'Check'
        say: 'Check. With $K$ as negative 4 over 3, $m$ 2 is 1 over $K$, which is negative 3 over 4, so down 3 for every 4 along. And 4 over 3 times negative 3 over 4 is negative 1.'
        write: 'Check: $m_{2} = -\dfrac{3}{4}$, $\ \dfrac{4}{3} \times \left(-\dfrac{3}{4}\right) = -1\ \checkmark$'
        doodle_do:
          - {id: hill, op: stage, stage: 'custom:2000_q28_a2'}
      - say: 'Therefore $K$ is negative 4 over 3, which is option A.'
        write: '$\therefore K = -\dfrac{4}{3}$'
        answer: true
    traps:
      B: 'You went for negative 3 over 4. That is $m$ 2, which is 1 over $K$, not $K$ itself. If 1 over $K$ is negative 3 over 4, then $K$ is negative 4 over 3.'
      C: 'You went for 3 over 4. That makes $m$ 2 equal to 4 over 3, the same as $m$ 1, so the lines would be parallel, not perpendicular.'
      D: 'You went for 4 over 3. The size is right, but the minus sign is lost. The gradients must multiply to negative 1, which gives 4 equals negative 3 $K$.'

  29:
    moments:
      - section: 'The question'
        say: 'Four points on a circle, two equal chords, and two angles at $P$. Many students add the 50 and the 30. Let''s find angle $PRS$ with a reason on every line.'
        write: '$PQ = QR$; find $\angle PRS$'
        point:
          - {figure: 0, kind: circle, target: '?', text: 'find'}
      - section: 'Solution'
        say: 'Solution. The givens on the diagram are that angle $RPS$ is 50 degrees, angle $RPQ$ is 30 degrees, and $PQ$ equals $QR$.'
        write: 'Solution: $\angle RPS = 50^{\circ},\ \angle RPQ = 30^{\circ}$'
        point:
          - {figure: 0, kind: highlight, target: PQ}
          - {figure: 0, kind: highlight, target: QR, text: 'equal'}
      - say: 'Triangle $PQR$ has $PQ$ equal to $QR$, so its base angles at $P$ and $R$ are equal.'
        write: '$\angle QRP = \angle QPR = 30^{\circ}$ (base $\angle$s of isos. $\triangle$)'
        point:
          - {figure: 0, kind: arc, target: QRP, text: '30°'}
      - say: 'The angles of triangle $PQR$ add up to 180, so angle $PQR$ is 180 minus 30 minus 30.'
        write: '$\angle PQR = 180^{\circ} - (30^{\circ} + 30^{\circ}) = 120^{\circ}$ ($\angle$ sum of $\triangle$)'
        point:
          - {figure: 0, kind: arc, target: PQR, text: '120°'}
      - say: '$PQRS$ is a cyclic quadrilateral, and angles $Q$ and $S$ are opposite, so they add up to 180. Angle $PSR$ is 180 minus 120.'
        write: '$\angle PSR = 180^{\circ} - 120^{\circ} = 60^{\circ}$ (opp. $\angle$s of a cyclic quad.)'
        point:
          - {figure: 0, kind: arc, target: PSR, text: '60°'}
      - say: 'Now triangle $PSR$. It has 50 degrees at $P$ and 60 degrees at $S$, and its angles add up to 180.'
        write: '$\angle PRS = 180^{\circ} - (50^{\circ} + 60^{\circ})$ ($\angle$ sum of $\triangle$)'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '= [[60∘]]'}, at: '+ 60∘', text: 'angle S'}
      - say: '50 plus 60 is 110, and 180 minus 110 is 70.'
        write: '$= 180^{\circ} - 110^{\circ} = 70^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: PRS, text: '70°'}
      - section: 'Check'
        say: 'Check the other pair of opposite angles. Angle $QPS$ is 30 plus 50, which is 80, and angle $QRS$ is 30 plus 70, which is 100. 80 plus 100 is 180.'
        write: 'Check: $\angle QPS + \angle QRS = 80^{\circ} + 100^{\circ} = 180^{\circ}\ \checkmark$'
      - say: 'The other pair also adds up to 180, as opposite angles of a cyclic quadrilateral must.'
        write: '(opp. $\angle$s of a cyclic quad.)'
      - say: 'Therefore angle $PRS$ is 70 degrees, which is option B.'
        write: '$\therefore \angle PRS = 70^{\circ}$'
        answer: true
    traps:
      A: 'You went for 80 degrees. That is 50 plus 30, the two angles at $P$ added. They are in different triangles. Find angle $PSR$ from the cyclic quadrilateral, then use triangle $PSR$.'
      C: 'You went for 60 degrees. That is angle $PSR$, at $S$. We want the angle at $R$ in the same triangle, which is 180 minus 50 minus 60, so 70.'
      D: 'You went for 50 degrees. That is angle $RPS$, which was given. The angle at $R$ is 180 minus 50 minus 60, which is 70.'

  30:
    moments:
      - section: 'The question'
        say: 'A diameter meets a chord at right angles. Many students double $NH$ or add 24 and 8. Two chord theorems give the diameter $FH$.'
        write: '$FH$ a diameter, $GE \perp FH$ at $N$; find $FH$'
        point:
          - {figure: 0, kind: highlight, target: FH, text: 'diameter'}
          - {figure: 0, kind: highlight, target: GE, text: 'chord'}
      - section: 'Solution'
        say: 'Solution. The givens on the diagram are that $NH$ is 8 cm and the chord $GE$ is 24 cm.'
        write: 'Solution: $NH = 8$ cm, $\ GE = 24$ cm'
        point:
          - {figure: 0, kind: circle, target: '8 cm'}
          - {figure: 0, kind: circle, target: 'GE = 24 cm'}
      - say: 'A diameter that is perpendicular to a chord bisects the chord. So $N$ is the midpoint of $GE$.'
        write: '$GN = NE = \tfrac{1}{2} \times 24 = 12$ cm ($\perp$ from centre bisects chord)'
        point:
          - {figure: 0, kind: underline, target: GN, text: '12'}
          - {figure: 0, kind: underline, target: NE, text: '12'}
      - say: 'Chords $GE$ and $FH$ cross at $N$. The products of their parts are equal, and the reason is intersecting chords.'
        write: '$FN \times NH = GN \times NE$ (intersecting chords)'
        point:
          - {figure: 0, kind: highlight, target: FN}
          - {figure: 0, kind: highlight, target: NH}
      - say: 'Substitute 8 for $NH$, and 12 for both parts of the chord.'
        write: '$FN \times 8 = 12 \times 12$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: '= [[12]] cm'}, at: '[[12]] × 12', text: 'GN, NE'}
      - say: '12 times 12 is 144. Divide both sides by 8, and 144 over 8 is 18.'
        write: '$FN = \dfrac{144}{8} = 18$ cm'
        point:
          - {figure: 0, kind: label, target: FN, text: '18'}
      - say: 'The diameter is the two pieces either side of $N$, which is $FN$ plus $NH$.'
        write: '$FH = FN + NH = 18 + 8 = 26$ cm'
        point:
          - {figure: 0, kind: label, target: 'FH = ?', text: '26 cm'}
      - section: 'Check'
        say: 'Check with Pythagoras. The radius is half of 26, which is 13, so $ON$ is 13 minus 8, which is 5. Triangle $ONG$ has a right angle at $N$.'
        write: 'Check: $r = 13$, $\ ON = 13 - 8 = 5$'
        point:
          - {figure: 0, kind: arc, target: ONG, text: '90°'}
      - say: '5 squared plus 12 squared is 25 plus 144, which is 169, and 13 squared is 169. It agrees.'
        write: '$5^{2} + 12^{2} = 169 = 13^{2}$ (Pythagoras) $\checkmark$'
        point:
          - {figure: 0, kind: highlight, target: OG, text: '13'}
      - say: 'Therefore the diameter $FH$ is 26 cm, which is option C.'
        write: '$\therefore FH = 26$ cm'
        answer: true
    traps:
      A: 'You went for 16 cm. That is 2 times $NH$, as if $N$ were the centre. It is not, so use intersecting chords. $FN \times 8 = 12 \times 12$ gives $FN = 18$, and $FH$ is 18 plus 8.'
      B: 'You went for 20 cm. That is 12 plus 8, half the chord plus $NH$. $FN$ comes from $FN \times 8 = 144$, which gives 18, and then $FH$ is 26.'
      D: 'You went for 32 cm. That is 24 plus 8, the whole chord added to $NH$. Halve the chord first, find $FN$ from intersecting chords, then add $NH$.'

  31:
    moments:
      - section: 'The question'
        say: 'A point $X$ is always as far from $P$ as from $Q$. This is one of the four standard loci. Many students just say "a straight line". Name it exactly.'
        write: '$XP = XQ$; locus of $X$ $= ?$'
      - section: 'Solution'
        say: 'Solution. A locus is the path traced by a moving point under a given condition. Here $X$ is equidistant, that is, at equal distances, from $P$ and $Q$.'
        write: 'Solution: $X$ is equidistant from $P$ and $Q$'
      - say: 'Recall the four standard loci. They are a circle, the perpendicular bisector, a pair of parallel lines, and the angle bisector.'
        write: 'Standard loci: circle; $\perp$ bisector; parallel lines; $\angle$ bisector'
      - say: 'The locus of points equidistant from two fixed points is the perpendicular bisector of the line joining them.'
        write: 'Equidistant from two points $\Rightarrow$ $\perp$ bisector of $PQ$'
      - say: 'Construct it with ruler and compasses. Join $P$ and $Q$. With centre $P$ and radius more than half of $PQ$, draw arcs above and below $PQ$.'
        show_sketch: true
        write: 'Join $PQ$; centre $P$, radius $> \tfrac{1}{2}PQ$: arcs above and below'
        point:
          - {figure: sketch, kind: highlight, target: PQ}
      - say: 'With centre $Q$ and the same radius, draw arcs to cut the first two at $R$ and $S$.'
        write: 'Centre $Q$, same radius: arcs cut them at $R$ and $S$'
        point:
          - {figure: sketch, kind: circle, target: R}
          - {figure: sketch, kind: circle, target: S}
      - say: 'Join $R$ and $S$. The line $RS$ cuts $PQ$ at its midpoint $M$, at right angles. Every point $X$ on it has $XP$ equal to $XQ$.'
        write: 'Join $RS$: it bisects $PQ$ at $M$, at $90^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: QMS, text: '90°'}
          - {figure: sketch, kind: circle, target: 'locus of X'}
      - section: 'Check'
        say: 'Check one point. $M$ itself is halfway along $PQ$, so $MP$ equals $MQ$. And any $X$ on the line makes two mirror-image triangles, $XMP$ and $XMQ$.'
        write: 'Check: $MP = MQ$; $\ XP = XQ$ for $X$ on $RS\ \checkmark$'
        point:
          - {figure: sketch, kind: highlight, target: XP}
          - {figure: sketch, kind: highlight, target: XQ}
      - say: 'Leave the construction arcs showing in the exam, because they are the evidence that earns the marks.'
        write: 'Keep the arcs: they earn the marks'
      - say: 'Therefore the locus of $X$ is the perpendicular bisector of $PQ$, which is option D.'
        write: '$\therefore$ locus of $X$: the perpendicular bisector of $PQ$'
        answer: true
    traps:
      A: 'You went for a straight line. That is true, but it does not say which line. The locus is one particular line, the perpendicular bisector of $PQ$.'
      B: 'You went for a circle. A circle is the locus of points a fixed distance from ONE point. Equal distances from two points give the perpendicular bisector of $PQ$.'
      C: 'You went for the bisector of angle $PXQ$. That angle moves with $X$ itself, so it cannot describe a fixed path. Equal distances from $P$ and $Q$ give the perpendicular bisector of $PQ$.'

  32:
    moments:
      - section: 'The question'
        say: 'We have a regular polygon whose interior angle is double its exterior angle. Many students go for 3 or 4. Work through the exterior angle, because it is the simpler one.'
        write: 'Regular polygon: int. $\angle = 2 \times$ ext. $\angle$; $n = ?$'
      - section: 'Solution'
        say: 'Solution. Let me sketch one corner of the polygon, with its interior and exterior angles.'
        show_sketch: true
        write: 'Solution: let the exterior angle be $e$, so the interior angle is $2e$'
        point:
          - {figure: sketch, kind: arc, target: ABC, text: 'interior 2e'}
          - {figure: sketch, kind: arc, target: CBD, text: 'exterior e'}
      - say: 'At each corner the interior and exterior angles sit together on a straight line, so they add up to 180 degrees.'
        write: 'Int. $\angle$ + ext. $\angle = 180^{\circ}$ ($\angle$s on a str. line)'
        point:
          - {figure: sketch, kind: highlight, target: AD, text: 'straight line'}
      - say: 'Substitute $2e$ and $e$.'
        write: '$2e + e = 180^{\circ}$'
      - say: '$2e$ plus $e$ is $3e$. Divide both sides by 3, and 180 over 3 is 60.'
        write: '$3e = 180^{\circ} \Rightarrow e = 60^{\circ}$'
        point:
          - {figure: sketch, kind: label, target: e, text: '60°'}
      - say: 'The exterior angles of any polygon add up to 360 degrees. In a regular polygon they are all equal, so each one is 360 over $n$.'
        write: 'Ext. $\angle = \dfrac{360^{\circ}}{n}$ (sum of ext. $\angle$s $= 360^{\circ}$)'
      - say: 'So 360 over $n$ is 60, and $n$ is 360 over 60.'
        write: '$n = \dfrac{360^{\circ}}{60^{\circ}}$'
      - say: '360 divided by 60 is 6.'
        write: '$= 6$'
        point:
          - {figure: sketch, kind: circle, target: 'n = ?', text: '6'}
      - section: 'Check'
        say: 'Check with the interior angle formula, which is $n$ minus 2, times 180, over $n$. 4 times 180 over 6 is 120, and 120 is twice 60.'
        write: 'Check: $\dfrac{(6 - 2) \times 180^{\circ}}{6} = 120^{\circ} = 2 \times 60^{\circ}\ \checkmark$'
      - say: 'Therefore the polygon has 6 sides, a hexagon, which is option B.'
        write: '$\therefore n = 6$'
        answer: true
    traps:
      A: 'You went for 87. Each exterior angle is 60 degrees, and the exterior angles add up to 360, so there are 360 over 60, which is 6 sides.'
      C: 'You went for 4. In a square the interior and exterior angles are both 90 degrees, so they are equal, not double. The answer is 6.'
      D: 'You went for 3. In an equilateral triangle the interior angle is 60 and the exterior is 120, the other way round. We need interior 120, exterior 60, which gives 6 sides.'

  33:
    moments:
      - section: 'The question'
        say: 'The predator is always on the circle and the prey is always on the line. They can only meet where the line crosses the circle, so we solve the two equations together.'
        write: 'Circle: centre $(0,\ 0)$, $r = \sqrt{2}$; line: $y = x$, $0 \le x \le 2$'
      - section: 'Solution'
        say: 'Solution. Let me draw the circle of radius root 2 about the origin, and the line $y = x$ through it.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '√2', text: 'radius', 'on': 'radius root 2'}
          - {figure: sketch, kind: circle, target: 'y = x', text: 'prey', 'on': 'line'}
      - say: 'The equation of a circle with centre at the origin and radius $r$ is $x$ squared plus $y$ squared equals $r$ squared.'
        write: '$x^{2} + y^{2} = r^{2}$'
      - say: 'Here $r$ is root 2, and root 2 squared is 2. Call this equation 1.'
        write: '$x^{2} + y^{2} = (\sqrt{2})^{2} = 2$ ... (1)'
      - say: 'The line is $y = x$. Call it equation 2.'
        write: '$y = x$ ... (2)'
      - section: 'Solve together'
        say: 'Substitute equation 2 into equation 1, which means we replace $y$ with $x$.'
        write: 'Put (2) in (1): $x^{2} + x^{2} = 2$'
      - say: '$x$ squared plus $x$ squared is $2x$ squared.'
        write: '$2x^{2} = 2$'
      - say: 'Divide both sides by 2.'
        write: '$x^{2} = 1$'
      - say: 'Take the square root of both sides, and remember both signs.'
        write: '$x = 1$ or $x = -1$'
      - say: 'But the question says $x$ is from 0 to 2. 1 is in that range, but negative 1 is not, so we reject it.'
        write: 'Since $0 \le x \le 2$: $x = 1$ only'
        point:
          - {line: 8, kind: strike, at: 'x = −1', text: 'out of range', 'on': 'reject'}
          - {figure: sketch, kind: strike, target: '(−1, −1)', 'on': 'negative 1 is not'}
      - say: 'From equation 2, $y$ equals $x$, so $y$ is 1 too.'
        write: 'From (2): $y = 1$'
      - say: 'Therefore they meet at the point 1, 1 only.'
        write: '$\therefore$ they meet at $(1,\ 1)$ only'
        point:
          - {figure: sketch, kind: circle, target: '(1, 1)', text: 'they meet', 'on': 'Therefore'}
      - section: 'Check'
        say: 'Check in equation 1. 1 squared plus 1 squared is 2. And 1, 1 is on $y = x$.'
        write: 'Check: $1^{2} + 1^{2} = 2$ ✓'
      - section: 'Answer'
        say: 'So they meet only at the point 1, 1, which is answer choice A.'
        write: '$\therefore (1,\ 1)$ only (A)'
        answer: true
    traps:
      B: 'You went for 1, 1 and 1, 2. The point 1, 2 is not on the line $y = x$, and it is not on the circle either, since 1 plus 4 is 5, not 2.'
      C: 'You went for 1, 1 and negative 1, negative 1. Both are on the line and the circle, but the question says $x$ is from 0 to 2, so negative 1 is rejected.'
      D: 'You went for root 2, root 2. Check it in equation 1. 2 plus 2 is 4, not 2. Solving the two equations together gives 1, 1.'

  34:
    moments:
      - section: 'The question'
        say: 'The shaded region lies between the line $y = 16$ on top and the curve $y = x^{2}$ below. An area between two graphs is the integral of the top one minus the bottom one.'
        write: 'Find the shaded area between $y = x^{2}$ and $y = 16$.'
        point:
          - {figure: 0, kind: circle, target: 'y = 16', text: 'on top', 'on': 'on top'}
          - {figure: 0, kind: circle, target: 'y = x²', text: 'below', 'on': 'below'}
      - section: 'Solution'
        say: 'Solution. First the limits. The curve meets the line where $x$ squared equals 16.'
        write: 'Solution: where they meet, $x^{2} = 16$'
        point:
          - {figure: 0, kind: circle, target: {x: 236, y: 48}, text: 'they meet', 'on': 'meets'}
      - say: 'So $x$ is 4 or negative 4. In the diagram the shading runs from $x$ equals 0 to $x$ equals 4.'
        write: '$x = \pm 4$; limits: $x = 0$ to $x = 4$'
        point:
          - {figure: 0, kind: circle, target: '0', text: 'from 0', 'on': 'equals 0'}
          - {figure: 0, kind: circle, target: '4', text: 'to 4', 'on': 'equals 4'}
      - section: 'The formula'
        say: 'Area between two curves is the integral from $a$ to $b$ of the upper $y$ minus the lower $y$, $dx$.'
        write: 'Area $= \displaystyle\int_{a}^{b}\left(y_{\text{upper}} - y_{\text{lower}}\right)dx$'
        'on': 'Area between'
      - say: 'Each thin upright strip of the shading has height 16 minus $x$ squared, so substitute.'
        write: '$= \displaystyle\int_{0}^{4}\left(16 - x^{2}\right)dx$'
        point:
          - {figure: 0, kind: highlight, target: {x: 170, y: 95}, text: '16 − x²', 'on': 'strip'}
      - say: 'The rule is to add 1 to the power, and divide by the new power.'
        write: '$\displaystyle\int x^{n}\,dx = \dfrac{x^{n + 1}}{n + 1} + c$'
      - section: 'Integrate'
        say: 'So 16 integrates to $16x$, and $x$ squared integrates to $x$ cubed over 3. The limits go on the square bracket.'
        write: '$= \left[16x - \dfrac{x^{3}}{3}\right]_{0}^{4}$'
      - say: 'Put in the upper limit, 4, then subtract the value at the lower limit, 0.'
        write: '$= \left(16(4) - \dfrac{4^{3}}{3}\right) - \left(16(0) - \dfrac{0^{3}}{3}\right)$'
      - say: '16 times 4 is 64, and 4 cubed is 64. The second bracket is all zeros.'
        write: '$= 64 - \dfrac{64}{3}$'
      - say: 'Write 64 over 3 with the common denominator, so 64 times 3 is 192.'
        write: '$= \dfrac{192}{3} - \dfrac{64}{3}$'
      - say: '192 minus 64 is 128.'
        write: '$= \dfrac{128}{3}$'
      - say: 'Therefore the shaded area is 128 over 3 square units.'
        write: '$\therefore$ Area $= \dfrac{128}{3}$ square units'
        point:
          - {figure: 0, kind: label, target: {x: 150, y: 120}, text: '128/3', 'on': 'Therefore'}
      - section: 'Check'
        say: 'Check another way. The rectangle under the line is 4 times 16, which is 64. Take away the area under the curve, the integral of $x$ squared from 0 to 4, which is 64 over 3.'
        write: 'Check: $4 \times 16 - \displaystyle\int_{0}^{4}x^{2}\,dx = 64 - \dfrac{64}{3} = \dfrac{128}{3}$ ✓'
      - section: 'Answer'
        say: 'So the shaded area is 128 over 3 square units, which is answer choice B.'
        write: '$\therefore$ Area $= \dfrac{128}{3}$ square units (B)'
        answer: true
    traps:
      A: 'You went for 64. That is the whole rectangle, 4 wide and 16 high. The part under the curve is not shaded, so take away 64 over 3, leaving 128 over 3.'
      C: 'You went for 64 over 3. That is the area under the curve, the unshaded part. The shaded part is the integral of 16 minus $x^{2}$, which is 64 minus 64 over 3, or 128 over 3.'
      D: 'You went for 32. That is half of the 4 by 16 rectangle, but the curve does not cut the rectangle in half. The integral of $16 - x^{2}$ from 0 to 4 is 128 over 3.'

  35:
    moments:
      - section: 'The question'
        say: 'We want the integral from 0 to $\pi$ of cos squared theta minus 1, over sin squared theta. The fraction looks hard, so we simplify it first with an identity.'
        write: '$\displaystyle\int_{0}^{\pi} \dfrac{\cos^{2}\theta - 1}{\sin^{2}\theta}\,d\theta$'
      - section: 'Solution'
        say: 'Solution. The identity says sin squared theta plus cos squared theta is 1.'
        write: 'Solution: $\sin^{2}\theta + \cos^{2}\theta = 1$'
      - say: 'Subtract 1 and subtract sin squared theta from both sides. Cos squared theta minus 1 is minus sin squared theta.'
        write: '$\cos^{2}\theta - 1 = -\sin^{2}\theta$'
      - say: 'That is the top of our fraction. Replace it. Sin squared theta cancels top and bottom, leaving minus 1.'
        write: '$\dfrac{\cos^{2}\theta - 1}{\sin^{2}\theta} = \dfrac{-\sin^{2}\theta}{\sin^{2}\theta} = -1$'
      - section: 'Integrate'
        say: 'Let $I$ be the integral. It becomes the integral of minus 1 from 0 to $\pi$.'
        write: 'Let $I = \displaystyle\int_{0}^{\pi}(-1)\,d\theta$'
      - say: 'The integral of a constant is that constant times theta. So minus 1 gives minus theta, in square brackets with the limits on the bracket.'
        write: '$I = \left[-\theta\right]_{0}^{\pi}$'
      - say: 'Take the upper limit minus the lower limit, each in its own bracket.'
        write: '$= (-\pi) - (-0)$'
      - say: 'Minus 0 is just 0. So $I$ is minus $\pi$.'
        write: '$= -\pi$'
      - section: 'Check'
        say: 'Check with a graph. The line $y$ equals minus 1 lies below the axis, so its area counts as negative. The width is $\pi$ and the height is 1, so the value is minus $\pi$.'
        write: 'Check: $-1 \times (\pi - 0) = -\pi\ \checkmark$'
        diagram:
          id: g
          kind: graph
          x: [-0.5, 3.5]
          y: [-2, 1]
          step: 0.5
          x_label: 'θ'
          plots:
            - {fn: '-1', label: 'y = −1', colour: blue}
        diagram_do:
          - {id: g, op: shade, part: 'plot:1', x: [0, 3.14], text: 'width π, below axis', colour: orange}
      - section: 'Answer'
        say: 'Therefore the integral is minus $\pi$, which is answer choice D.'
        write: '$\therefore I = -\pi$'
        answer: true
    traps:
      A: 'You went for $\pi$. The sign is lost. Cos squared minus 1 is minus sin squared, so the fraction is minus 1, and the integral is minus $\pi$.'
      B: 'You went for $\tfrac{\pi}{2}$. The fraction simplifies to minus 1, and $\left[-\theta\right]$ from 0 to $\pi$ is minus $\pi$, not a half of anything.'
      C: 'You went for minus $\tfrac{\pi}{2}$. The sign is right, but the upper limit is $\pi$, not $\tfrac{\pi}{2}$. $\left[-\theta\right]$ from 0 to $\pi$ is minus $\pi$.'

  36:
    moments:
      - section: 'The question'
        say: 'Differentiate first, then put $x$ equals pi over 4. Watch closely, because two of the terms will cancel, which makes the substitution easy.'
        write: '$y = 2x\cos 2x - \sin 2x$'
      - section: 'Solution'
        say: 'Solution. The first term is a product. For $2x$ cos $2x$, let $u$ be $2x$ and $v$ be cos $2x$.'
        write: 'For $2x\cos 2x$: let $u = 2x$, $\ v = \cos 2x$'
      - say: '$\dfrac{du}{dx}$ is 2. Cos $ax$ differentiates to minus $a$ sine $ax$, so cos $2x$ gives minus 2 sine $2x$.'
        write: '$\dfrac{du}{dx} = 2$, $\ \dfrac{dv}{dx} = -2\sin 2x$'
      - say: 'The product rule gives $u$ $\dfrac{dv}{dx}$ plus $v$ $\dfrac{du}{dx}$. That is $2x$ times minus 2 sine $2x$, plus cos $2x$ times 2.'
        'on': 'product rule'
        write: '$\dfrac{d}{dx}(2x\cos 2x) = u\dfrac{dv}{dx} + v\dfrac{du}{dx} = 2x(-2\sin 2x) + \cos 2x(2)$'
      - say: '$2x$ times minus 2 is minus $4x$.'
        write: '$= -4x\sin 2x + 2\cos 2x$'
      - say: 'For the second term, sine $ax$ differentiates to $a$ cos $ax$. So minus sine $2x$ gives minus 2 cos $2x$.'
        write: '$\dfrac{d}{dx}(-\sin 2x) = -2\cos 2x$'
      - say: 'Add the two results. Plus 2 cos $2x$ and minus 2 cos $2x$ cancel.'
        write: '$\dfrac{dy}{dx} = -4x\sin 2x + 2\cos 2x - 2\cos 2x = -4x\sin 2x$'
        point:
          - {line: 6, kind: strike, at: '+ 2cos2x', text: 'cancel'}
          - {line: 6, kind: strike, at: '− 2cos2x'}
      - section: 'At x = π/4'
        say: 'Now substitute $x$ equals pi over 4. 2 times pi over 4 is pi over 2.'
        write: 'At $x = \dfrac{\pi}{4}$, $\ \dfrac{dy}{dx} = -4\left(\dfrac{\pi}{4}\right)\sin\dfrac{\pi}{2}$'
      - say: 'Sine of pi over 2, which is sine 90 degrees, is 1. And 4 times pi over 4 is pi.'
        write: '$= -\pi \times 1 = -\pi$'
      - say: 'Therefore $\dfrac{dy}{dx}$ at $x$ equals pi over 4 is minus pi, which is answer choice B.'
        write: '$\therefore \dfrac{dy}{dx} = -\pi$ at $x = \dfrac{\pi}{4}$'
        answer: true
    traps:
      A: 'You went for pi. The size is right, but cos $2x$ differentiates to MINUS 2 sine $2x$, so the answer is minus pi.'
      C: 'You went for pi over 2. Cos $2x$ gives minus 2 sine $2x$, because the 2 from the inside doubles it. So $\dfrac{dy}{dx}$ is minus $4x$ sine $2x$, which is minus pi.'
      D: 'You went for minus pi over 2. The sign is right, but the 2 from the inside of cos $2x$ was missed. $\dfrac{dy}{dx}$ is minus $4x$ sine $2x$, which is minus pi.'

  37:
    moments:
      - section: 'The question'
        say: 'Spin a region round the $y$-axis and it sweeps out a solid made of thin circular discs, stacked up the axis. Adding up the discs is an integral.'
        write: 'Find the volume when the region is rotated about the $y$-axis.'
        doodle: {name: 'custom:2000_q37_a', id: bowl, caption: 'a bowl made of thin discs'}
      - section: 'Solution'
        say: 'Solution. Let me sketch the curve $y = x^{2} - 1$, with the lines $y = 0$ and $y = 3$, and the region on the right of the $y$-axis.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'y = x² − 1', 'on': 'sketch the curve'}
          - {figure: sketch, kind: circle, target: 'y = 3', 'on': 'lines'}
      - say: 'Each disc has radius $x$ and area pi $x$ squared, so the volume about the $y$-axis is pi times the integral of $x$ squared, $dy$.'
        write: '$V = \pi\displaystyle\int_{a}^{b} x^{2}\,dy$'
        doodle_do:
          - {id: bowl, op: circle, part: disc, text: 'area πx²', 'on': 'Each disc'}
      - say: 'We integrate with respect to $y$, so make $x$ squared the subject of the curve by adding 1 to both sides.'
        write: '$y = x^{2} - 1 \Rightarrow x^{2} = y + 1$'
      - say: 'The bowl runs from its bottom, $y$ equals 0, to its rim, $y$ equals 3. Those are the limits.'
        write: 'Limits: $y = 0$ to $y = 3$'
        doodle_do:
          - {id: bowl, op: pulse, part: discs, 'on': 'limits'}
      - say: 'Substitute $y$ plus 1 for $x$ squared, with the limits 0 and 3.'
        write: '$V = \pi\displaystyle\int_{0}^{3} (y + 1)\,dy$'
      - section: 'Integrate'
        say: 'The rule is to add 1 to the power, then divide by the new power.'
        write: '$\displaystyle\int y^{n}\,dy = \dfrac{y^{n + 1}}{n + 1} + c$'
      - say: 'So $y$ integrates to $y$ squared over 2, and 1 integrates to $y$.'
        write: '$= \pi\left[\dfrac{y^{2}}{2} + y\right]_{0}^{3}$'
      - say: 'Put in the upper limit, 3, then subtract the value at the lower limit, 0.'
        write: '$= \pi\left[\left(\dfrac{3^{2}}{2} + 3\right) - \left(\dfrac{0^{2}}{2} + 0\right)\right]$'
        doodle_do:
          - {id: bowl, op: fill, to: 1, 'on': 'upper limit'}
      - say: '3 squared is 9, so the first bracket is 9 over 2 plus 3. The second bracket is 0.'
        write: '$= \pi\left(\dfrac{9}{2} + 3\right)$'
      - say: 'Write 3 as 6 over 2. 9 over 2 plus 6 over 2 is 15 over 2.'
        write: '$= \pi\left(\dfrac{9}{2} + \dfrac{6}{2}\right) = \dfrac{15\pi}{2}$'
      - say: 'Therefore the volume of the bowl is 15 pi over 2 cubic units.'
        write: '$\therefore V = \dfrac{15\pi}{2}$ cubic units'
        doodle_do:
          - {id: bowl, op: label, part: discs, text: '15π/2', 'on': 'Therefore'}
      - section: 'Check'
        say: 'Check the integration by differentiating back. $y$ squared over 2 plus $y$ differentiates to $y$ plus 1, which is what we integrated.'
        write: 'Check: $\dfrac{d}{dy}\left(\dfrac{y^{2}}{2} + y\right) = y + 1$ ✓'
      - section: 'Answer'
        say: 'So the volume of the bowl is 15 pi over 2 cubic units, which is answer choice B.'
        write: '$\therefore V = \dfrac{15\pi}{2}$ cubic units (B)'
        answer: true
    traps:
      A: 'You went for 7 pi. Check the last addition: 9 over 2 plus 3 is 9 over 2 plus 6 over 2, which is 15 over 2, so the volume is 15 pi over 2.'
      C: 'You went for 8 pi. That needs the bracket to come to 8, but 9 over 2 plus 3 is 7 and a half, which is 15 over 2.'
      D: 'You went for 17 pi over 2. Recheck the bracket at $y = 3$. 3 squared over 2 is 9 over 2, and adding 3 gives 15 over 2, not 17 over 2.'

  38:
    moments:
      - section: 'The question'
        say: 'Two things change with time, the volume and the radius. The chain rule links how fast they change.'
        write: 'Find the rate of change of the radius when $r = 6$ m.'
      - section: 'Solution'
        say: 'Solution. Let me draw the hemisphere, with its radius 6 m and the volume growing at 8 pi cubic metres per second.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'r = 6 m', 'on': 'radius 6'}
          - {figure: sketch, kind: circle, target: 'dV/dt = 8π m³/s', 'on': 'growing'}
      - say: 'List the givens. $\dfrac{dV}{dt}$ is 8 pi, $r$ is 6, and we want $\dfrac{dr}{dt}$.'
        write: '$\dfrac{dV}{dt} = 8\pi\ \text{m}^{3}\text{s}^{-1}$, $\ r = 6$ m, $\ \dfrac{dr}{dt} = ?$'
      - section: 'Link V and r'
        say: 'A hemisphere is half a sphere. A sphere is 4 over 3 pi $r$ cubed, so the hemisphere is half of that.'
        write: '$V = \dfrac{1}{2} \times \dfrac{4}{3}\pi r^{3} = \dfrac{2}{3}\pi r^{3}$'
      - say: 'Differentiate with respect to $r$, so bring the power 3 down and reduce it by 1.'
        write: '$\dfrac{dV}{dr} = \dfrac{2}{3}\pi \times 3r^{2}$'
      - say: '2 over 3 times 3 is 2, so $\dfrac{dV}{dr}$ is $2\pi r^{2}$.'
        write: '$\dfrac{dV}{dr} = 2\pi r^{2}$'
      - section: 'Chain rule'
        say: 'The chain rule says $\dfrac{dV}{dt}$ equals $\dfrac{dV}{dr}$ times $\dfrac{dr}{dt}$.'
        write: '$\dfrac{dV}{dt} = \dfrac{dV}{dr} \times \dfrac{dr}{dt}$'
      - say: 'Substitute 8 pi for $\dfrac{dV}{dt}$ and $2\pi r^{2}$ for $\dfrac{dV}{dr}$.'
        write: '$8\pi = 2\pi r^{2} \times \dfrac{dr}{dt}$'
      - say: 'At $r$ equals 6, $r$ squared is 36, and 2 pi times 36 is 72 pi.'
        write: 'At $r = 6$: $\ 8\pi = 2\pi \times 36 \times \dfrac{dr}{dt} = 72\pi\dfrac{dr}{dt}$'
      - say: 'Divide both sides by 72 pi.'
        write: '$\dfrac{dr}{dt} = \dfrac{8\pi}{72\pi}$'
      - say: 'Pi cancels, and 8 goes into 72 nine times. So it is 1 over 9.'
        write: '$= \dfrac{1}{9}$'
      - say: 'Therefore the radius is growing at 1 over 9 metres per second.'
        write: '$\therefore \dfrac{dr}{dt} = \dfrac{1}{9}\ \text{ms}^{-1}$'
        point:
          - {figure: sketch, kind: label, target: 'dr/dt = ?', text: '1/9 m/s', 'on': 'Therefore'}
      - section: 'Check'
        say: 'To check, $\dfrac{dV}{dr}$ times $\dfrac{dr}{dt}$ is 72 pi times 1 over 9, which is 8 pi, the rate we were given.'
        write: 'Check: $72\pi \times \dfrac{1}{9} = 8\pi$ ✓'
      - section: 'Answer'
        say: 'So the radius is changing at 1 over 9 metres per second, which is answer choice D.'
        write: '$\therefore \dfrac{dr}{dt} = \dfrac{1}{9}\ \text{ms}^{-1}$ (D)'
        answer: true
    traps:
      A: 'You went for 2.50 metres per second. The rate is 8 pi divided by $2\pi r^{2}$, and with $r = 6$ that is 8 pi over 72 pi, which is 1 over 9.'
      B: 'You went for 2.00 metres per second. Remember to square the radius. 2 pi times 36 is 72 pi, so the answer is 8 over 72, which is 1 over 9.'
      C: 'You went for 0.25 metres per second. That is what a radius of 4 would give, 8 over 32. With a radius of 6, $2\pi r^{2}$ is 72 pi, so the rate is 1 over 9.'

  39:
    moments:
      - section: 'The question'
        say: 'We know the derivative of a function, and we want the function itself. Going back from the derivative to the function is integration, the reverse of differentiation.'
        write: 'Passes through $(0, 0)$; $\ \dfrac{dy}{dx} = 3x + 2$'
      - section: 'Solution'
        say: 'Solution. Since $\dfrac{dy}{dx}$ is $3x$ plus 2, $y$ is the integral of $3x$ plus 2, with respect to $x$.'
        write: '$y = \displaystyle\int (3x + 2)\,dx$'
      - say: 'The rule is to add 1 to the power, and divide by the new power. We add $c$, the constant of integration, because a constant disappears when we differentiate.'
        'on': 'add 1'
        write: '$\displaystyle\int x^{n}\,dx = \dfrac{x^{n+1}}{n+1} + c$'
      - say: 'Term by term. $3x$ is $3x$ to the power 1, so the power becomes 2, and we divide by 2. The constant 2 integrates to $2x$.'
        write: '$y = \dfrac{3x^{1+1}}{1+1} + 2x + c$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
      - say: '1 plus 1 is 2. So $y$ is $3x$ squared over 2, plus $2x$, plus $c$.'
        write: '$y = \dfrac{3x^{2}}{2} + 2x + c$'
      - section: 'Find c'
        say: 'The curve passes through the origin, so when $x$ is 0, $y$ is 0. Substitute into the equation.'
        write: 'At $(0, 0)$: $\ 0 = \dfrac{3(0)^{2}}{2} + 2(0) + c$'
      - say: 'Both terms with $x$ are zero, so 0 equals $c$.'
        write: '$\therefore c = 0$'
      - say: 'Put $c$ equals 0 back into the equation.'
        write: '$y = \dfrac{3}{2}x^{2} + 2x$'
      - section: 'Check'
        say: 'Check by differentiating back. Three over two $x$ squared gives three over two times $2x$, which is $3x$. And $2x$ gives 2. That is $3x$ plus 2, as given.'
        write: 'Check: $\dfrac{dy}{dx} = \dfrac{3}{2} \times 2x + 2 = 3x + 2\ \checkmark$'
      - say: 'Therefore $f(x)$ is three over two $x$ squared, plus $2x$, which is answer choice A.'
        write: '$\therefore f(x) = \dfrac{3}{2}x^{2} + 2x$'
        answer: true
    traps:
      B: 'You went for $\tfrac{3}{2}x^{2} + x$. The first term is right, but the constant 2 integrates to $2x$, not $x$.'
      C: 'You went for $3x^{2} + \tfrac{x}{2}$. The divisions are on the wrong terms. $3x$ integrates to $\dfrac{3x^{2}}{2}$, and 2 integrates to $2x$.'
      D: 'You went for $3x^{2} + 2x$. You did not divide by the new power. $3x$ integrates to $\dfrac{3x^{2}}{2}$. Differentiate $3x^{2}$ and you get $6x$, not $3x$.'

  40:
    moments:
      - section: 'The question'
        say: 'There are three unknowns, $a$, $b$ and $c$, and two facts, the derivative and the value 5 at $x$ equals 1. The derivative gives $a$ and $b$, and the value gives $c$.'
        write: '$ax^{2} + bx + c = 5$ at $x = 1$; derivative $= 2x + 1$'
      - section: 'Solution'
        say: 'Solution. Let $y$ be the expression.'
        write: 'Let $y = ax^{2} + bx + c$'
      - say: 'Differentiate term by term, multiplying by the power, then reducing the power by 1. $ax$ squared gives $2ax$, $bx$ gives $b$, and the constant $c$ gives 0.'
        write: '$\dfrac{dy}{dx} = 2ax + b$'
      - say: 'But the question says the derivative is $2x$ plus 1. So the two are equal.'
        write: '$\therefore 2ax + b = 2x + 1$'
      - say: 'Compare the coefficients of $x$ on both sides, so $2a$ equals 2. Divide both sides by 2.'
        'on': 'coefficients'
        write: 'Comparing coefficients of $x$: $\ 2a = 2 \Rightarrow a = 1$'
      - say: 'Compare the constant terms, with $b$ on the left and 1 on the right.'
        write: 'Comparing constants: $\ b = 1$'
      - section: 'Find c'
        say: 'The derivative cannot give $c$, because $c$ differentiated to 0. So use the other fact, that at $x$ equals 1, $y$ is 5.'
        write: 'At $x = 1$, $y = 5$: $\ a(1)^{2} + b(1) + c = 5$'
      - say: '1 squared is 1, so this is $a$ plus $b$ plus $c$ equals 5.'
        write: '$a + b + c = 5$'
      - say: 'Substitute $a$ equals 1 and $b$ equals 1.'
        write: '$1 + 1 + c = 5$'
      - say: '1 plus 1 is 2. Take 2 from both sides, and 5 minus 2 is 3.'
        write: '$c = 5 - 2 = 3$'
      - section: 'Check'
        say: 'Check. The expression is $x$ squared plus $x$ plus 3. Its derivative is $2x$ plus 1, and at $x$ equals 1 it is 1 plus 1 plus 3, which is 5.'
        write: 'Check: $y = x^{2} + x + 3$; $\ \dfrac{dy}{dx} = 2x + 1$; $\ y(1) = 5\ \checkmark$'
      - say: 'Therefore $a$, $b$, $c$ are 1, 1, 3, which is answer choice D.'
        write: '$\therefore a = 1,\ b = 1,\ c = 3$'
        answer: true
    traps:
      A: 'You went for 1, 3, 1. Comparing constants in $2ax + b = 2x + 1$ gives $b = 1$, not 3. Then $1 + 1 + c = 5$ gives $c = 3$.'
      B: 'You went for 1, 2, 1. Comparing constants gives $b = 1$. And 1, 2, 1 adds up to 4, but $a + b + c$ must be 5.'
      C: 'You went for 2, 1, 1. Comparing coefficients of $x$ gives $2a = 2$, so $a = 1$, not 2.'

  41:
    moments:
      - section: 'The question'
        say: '$X$ and $Y$ are independent events. P of $X$ or $Y$ is 0.7, and P of $X$ is 0.4. Find P of $Y$. We need two rules together.'
        write: '$P(X \cup Y) = 0.7,\quad P(X) = 0.4$'
      - say: 'Solution. Let P of $Y$ be $p$.'
        write: 'Solution: let $P(Y) = p$'
      - section: 'The two rules'
        say: 'First, for independent events, P of $X$ and $Y$ is P of $X$ times P of $Y$. Picture two separate spinners, where how one lands does not change the other.'
        write: 'Independent: $P(X \cap Y) = P(X) \times P(Y) = 0.4p$'
        doodle: {name: 'custom:2000_q41_a', id: spin, caption: 'Two spinners, spun separately'}
      - say: 'Second, the addition rule says P of $X$ or $Y$ is P of $X$, plus P of $Y$, minus P of both. In the Venn diagram, both is the overlap, counted twice when we add.'
        write: '$P(X \cup Y) = P(X) + P(Y) - P(X \cap Y)$'
        diagram:
          id: v
          kind: venn
          'on': 'Venn diagram'
          sets:
            - {key: X, name: 'X', total: '0.4'}
            - {key: Y, name: 'Y', total: 'p'}
          counts: {'X∩Y': '0.4p'}
      - section: 'Substitute'
        say: 'Substitute 0.7 for $X$ or $Y$, 0.4 for $X$, $p$ for $Y$, and 0.4 $p$ for both.'
        write: '$0.7 = 0.4 + p - 0.4p$'
        point:
          - {line: 4, kind: move, from: {line: 0, at: 'Y) = [[0.7]]'}, at: '[[0.7]] =', text: 'X or Y'}
          - {line: 4, kind: move, from: {line: 2, at: '= [[0.4p]]'}, at: '− [[0.4p]]', text: 'both'}
        doodle_do:
          - {id: spin, op: circle, part: spinx, text: '0.4'}
      - say: '$p$ minus 0.4 $p$ is 0.6 $p$, because 1 minus 0.4 is 0.6.'
        write: '$0.7 = 0.4 + 0.6p$'
      - say: 'Subtract 0.4 from both sides. 0.7 minus 0.4 is 0.3.'
        write: '$0.6p = 0.7 - 0.4 = 0.3$'
      - say: 'Divide both sides by 0.6. 0.3 is half of 0.6, so $p$ is 0.5, and spinner $Y$ is half shaded.'
        write: '$\therefore p = \dfrac{0.3}{0.6} = 0.5$'
        doodle_do:
          - {id: spin, op: stage, stage: 'custom:2000_q41_a2'}
      - section: 'Check'
        say: 'Check. Both is 0.4 times 0.5, which is 0.2. Then 0.4 plus 0.5 minus 0.2 is 0.7, as the question says.'
        write: 'Check: $0.4 + 0.5 - 0.4 \times 0.5 = 0.9 - 0.2 = 0.7\ \checkmark$'
        doodle_do:
          - {id: spin, op: label, part: half, text: 'both: 0.4 × 0.5 = 0.2'}
      - section: 'Answer'
        say: 'Therefore the probability of $Y$ is 0.50, which is option B.'
        write: '$\therefore P(Y) = 0.50$'
        answer: true
    traps:
      A: 'You went for 0.30. That is 0.7 minus 0.4, which forgets the overlap, P of X and Y. The addition rule gives 0.7 equal to 0.4 plus p minus 0.4 p, so p is 0.5.'
      C: 'You went for 0.57. Collect the p terms carefully. p minus 0.4 p is 0.6 p, and 0.3 divided by 0.6 is 0.5.'
      D: 'You went for 1.80. A probability is never more than 1, so this is ruled out at once. The answer is 0.5.'

  42:
    moments:
      - section: 'The question'
        say: 'The numbers 0, $x$ plus 2, $3x$ plus 6 and $4x$ plus 8 have a mean of 4. We want their mean deviation, M.D.'
        write: '$0,\ x + 2,\ 3x + 6,\ 4x + 8$; $\ \bar{x} = 4$'
      - section: 'Solution'
        say: 'Solution. The numbers have $x$ in them, so first we use the mean to find $x$. The mean is the sum over $n$, and $n$ is 4.'
        write: '$\dfrac{0 + (x + 2) + (3x + 6) + (4x + 8)}{4} = 4$'
      - say: 'Collect like terms on top. $x$ plus $3x$ plus $4x$ is $8x$, and 2 plus 6 plus 8 is 16.'
        write: '$\dfrac{8x + 16}{4} = 4$'
      - say: 'Multiply both sides by 4, and 4 times 4 is 16.'
        write: '$8x + 16 = 16$'
      - say: 'Subtract 16 from both sides, so $8x$ is 0, and $x$ is 0.'
        write: '$8x = 0$, $\ \therefore x = 0$'
      - say: 'Put $x$ equals 0 back in. The numbers are 0, 2, 6 and 8. On a see-saw they balance at the mean, 4.'
        write: 'The numbers: $0,\ 2,\ 6,\ 8$'
        doodle: {name: 'custom:2000_q42_a', id: seesaw, caption: 'The see-saw balances at the mean', size: scene}
      - section: 'The mean deviation'
        say: 'The M.D. is the sum of the absolute deviations over $n$. Absolute means we ignore the minus signs.'
        write: 'M.D. $= \dfrac{\sum |x - \bar{x}|}{n}$'
      - say: 'Now the deviation table, where we take each number, minus the mean, then the absolute value.'
        write: '$\bar{x} = 4$, $\ n = 4$'
        diagram:
          id: d
          kind: table
          columns: ['x', 'x − x̄', '|x − x̄|']
          rows: [[0, '', ''], [2, '', ''], [6, '', ''], [8, '', '']]
          'on': 'table'
      - say: '0 minus 4 is minus 4. 2 minus 4 is minus 2. 6 minus 4 is 2.'
        write: '$0 - 4 = -4,\ 2 - 4 = -2,\ 6 - 4 = 2$'
        diagram_do:
          - {id: d, op: fill, part: 'cell:1,2', text: '−4'}
          - {id: d, op: fill, part: 'cell:2,2', text: '−2'}
          - {id: d, op: fill, part: 'cell:3,2', text: '2'}
      - say: 'And 8 minus 4 is 4. Ignore the minus signs, so the absolute deviations are 4, 2, 2 and 4.'
        write: '$8 - 4 = 4$'
        diagram_do:
          - {id: d, op: fill, part: 'cell:4,2', text: '4'}
          - {id: d, op: fill, part: 'cell:1,3', text: '4'}
          - {id: d, op: fill, part: 'cell:2,3', text: '2'}
      - say: 'The last two are 2 and 4.'
        write: '$|2| = 2,\ |4| = 4$'
        diagram_do:
          - {id: d, op: fill, part: 'cell:3,3', text: '2'}
          - {id: d, op: fill, part: 'cell:4,3', text: '4'}
        doodle_do:
          - {id: seesaw, op: stage, stage: 'custom:2000_q42_a2'}
      - say: 'Add the last column, so 4 plus 2 plus 2 plus 4 is 12.'
        write: '$\sum |x - \bar{x}| = 12$'
        diagram_do:
          - {id: d, op: total, part: 'col:3', 'on': 'Add'}
      - say: 'Substitute, which gives 12 over 4, or 3.'
        write: '$\therefore$ M.D. $= \dfrac{12}{4} = 3$'
        doodle_do:
          - {id: seesaw, op: circle, part: pivot, text: '12 ÷ 4 = 3'}
      - section: 'Check'
        say: 'Check the mean, because with their signs, the deviations must add to 0. Minus 4, minus 2, plus 2, plus 4 is 0. It agrees.'
        write: 'Check: $-4 - 2 + 2 + 4 = 0$ ✓'
      - section: 'Answer'
        say: 'So the mean deviation is 3, which is option C.'
        write: '$\therefore$ M.D. $= 3$'
        answer: true
    traps:
      A: 'You went for 0. That keeps the minus signs, and the deviations from the mean always add to 0. The M.D. uses absolute deviations, 4, 2, 2 and 4, which give 3.'
      B: 'You went for 2. The absolute deviations are 4, 2, 2 and 4. They add to 12, and 12 over 4 is 3.'
      D: 'You went for 4. That is the mean itself. The M.D. is the sum of the absolute deviations over $n$, so 12 over 4, which is 3.'

  43:
    moments:
      - section: 'The question'
        say: 'In how many ways can the letters of MATHEMATICS be arranged? Some letters repeat, and swapping two of the same letter gives the same word.'
        write: 'Arrangements of MATHEMATICS $= ?$'
        doodle: {name: 'custom:2000_q43_a', id: tiles, caption: 'M, A and T each appear twice'}
      - say: 'Solution. Count the letters M, A, T, H, E, M, A, T, I, C, S. That is 11.'
        write: 'Solution: $n = 11$ letters'
        doodle_do:
          - {id: tiles, op: underline, part: count}
      - section: 'The repeated letters'
        say: 'Now list the repeats. Look at the pink tiles, where M appears twice.'
        write: 'M: $2$ times'
        doodle_do:
          - {id: tiles, op: circle, part: pair-m, text: '2 Ms'}
      - say: 'In the yellow tiles, A appears twice as well.'
        write: 'A: $2$ times'
        doodle_do:
          - {id: tiles, op: circle, part: pair-a, text: '2 As'}
      - say: 'And in the blue tiles, T also appears twice. H, E, I, C and S appear once each.'
        write: 'T: $2$ times; H, E, I, C, S: once each'
        doodle_do:
          - {id: tiles, op: circle, part: pair-t, text: '2 Ts'}
      - section: 'The formula'
        say: 'n things with repeats, p of one kind, q of another, r of a third, can be arranged in n factorial over p factorial, q factorial, r factorial ways.'
        write: 'Number of arrangements $= \dfrac{n!}{p!\,q!\,r!}$'
      - say: 'Why divide? Swap the two Ms and you get the same word. So 11 factorial counts each word 2 factorial times over for the Ms. The same is true for the As and the Ts.'
        write: 'Swapping the 2 Ms gives the same word: divide by $2!$'
      - section: 'Substitute'
        say: 'Here n is 11, and p, q and r are each 2, for M, A and T.'
        write: '$= \dfrac{11!}{2!\,2!\,2!}$'
        point:
          - {line: 1, kind: circle, at: 'n = 11', text: 'letters'}
      - section: 'Check'
        say: 'Check the size. 2 factorial times 2 factorial times 2 factorial is 8. 11 factorial is 39,916,800, and 39,916,800 divided by 8 is 4,989,600 words.'
        write: 'Check: $2!\,2!\,2! = 8$, $\ \dfrac{39\,916\,800}{8} = 4\,989\,600$'
      - section: 'Answer'
        say: 'Therefore the letters of MATHEMATICS can be arranged in 11 factorial over 2 factorial, 2 factorial, 2 factorial ways, which is option C.'
        write: '$\therefore$ arrangements $= \dfrac{11!}{2!\,2!\,2!}$'
        answer: true
    traps:
      A: 'You went for 11 factorial over 9 factorial times 2 factorial. That is 11 C 2, a selection formula, not an arrangement of letters. Divide 11 factorial by 2 factorial for each of M, A and T.'
      B: 'You went for 11 factorial over 9 factorial, 2 factorial, 2 factorial. There is no 9 factorial here. Only the repeated letters matter: M, A and T, each twice.'
      D: 'You went for 11 factorial over 2 factorial, 2 factorial. That counts only two repeated letters. M, A and T all appear twice, so we need three 2 factorials.'

  44:
    moments:
      - section: 'The question'
        say: 'A die was rolled 240 times, and the table shows how often each number came up. What is the pie chart angle for the number 4?'
        write: 'Angle for 4 in the pie chart $= ?$'
      - say: 'Solution. In a pie chart, the 360 degrees are shared in proportion to the frequencies. The sectoral angle is the frequency over the total frequency, times 360 degrees.'
        write: 'Solution: sectoral angle $= \dfrac{\text{frequency}}{\text{total frequency}} \times 360^{\circ}$'
      - section: 'Total frequency'
        say: 'First the total frequency. 30 plus 43 is 73, plus 54 is 127, plus 40 is 167.'
        write: 'Total $= 30 + 43 + 54 + 40 + 41 + 32$'
      - say: '167 plus 41 is 208, and 208 plus 32 is 240. That matches the 240 rolls.'
        write: '$= 240$'
      - section: 'The angle for 4'
        say: 'From the table, 4 came up 40 times.'
        write: 'Frequency of 4 $= 40$'
      - say: 'Substitute 40 and 240 into the formula.'
        write: 'Angle for 4 $= \dfrac{40}{240} \times 360^{\circ}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '= 40'}, at: '240[[40]]', text: 'frequency'}
          - {line: 5, kind: move, from: {line: 3, at: '= 240'}, at: '[[240]]40', text: 'total'}
      - say: 'For 40 over 240, divide the top and the bottom by 40, which gives 1 over 6. So 4 came up on 1 roll in every 6.'
        write: '$= \dfrac{1}{6} \times 360^{\circ}$'
      - say: '360 divided by 6 is 60 degrees. Here is the pie chart, with the sector for 4.'
        write: '$= 60^{\circ}$'
        diagram:
          id: p
          kind: pie
          'on': 'pie chart'
          sectors:
            - {label: '1', value: 30}
            - {label: '2', value: 43}
            - {label: '3', value: 54}
            - {label: '4', value: 40, colour: orange}
            - {label: '5', value: 41}
            - {label: '6', value: 32}
          show: value
        diagram_do:
          - {id: p, op: angle, part: 'sector:4', answer: true}
      - section: 'Check'
        say: 'To check, 360 degrees over 240 rolls is 1.5 degrees for each roll. 40 rolls times 1.5 degrees is 60 degrees.'
        write: 'Check: $\dfrac{360^{\circ}}{240} = 1.5^{\circ}$, $\ 40 \times 1.5^{\circ} = 60^{\circ}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the angle for 4 is 60 degrees, which is option D.'
        write: '$\therefore$ angle for $4 = 60^{\circ}$'
        answer: true
    traps:
      A: 'You went for 10 degrees. The share for 4 is 40 over 240, which is 1 over 6, and 1 over 6 of 360 degrees is 60 degrees.'
      B: 'You went for 16 degrees. Use the sectoral angle formula. 40 over 240, times 360 degrees, is 60 degrees.'
      C: 'You went for 40 degrees. That is the frequency, not the angle. 40 over 240 of 360 degrees is 60 degrees.'

  45:
    moments:
      - section: 'The question'
        say: '$U$ is the whole numbers from 1 to 20. $E_1$ is the multiples of 3, and $E_2$ is the multiples of 4. One number is picked at random. What is the probability that it is not in $E_2$?'
        write: '$U = \{1, 2, \ldots, 20\}$: $P(E_2^{\prime}) = ?$'
        doodle: {name: 'custom:2000_q45_a', id: slips, caption: 'Pick one whole number, 1 to 20', size: scene}
      - say: 'Solution. "Not in $E_2$" is $E_2$ prime, $E_2$ complement. The question asks only about $E_2$, so $E_1$ is not needed.'
        write: 'Solution: want $P(E_2^{\prime})$; $E_1$ is not needed'
      - say: 'There are 20 numbers in $U$, all equally likely. So n of $U$ is 20.'
        write: '$n(U) = 20$'
      - section: 'The event E2'
        say: '$E_2$ is the multiples of 4. Counting in fours up to 20 gives 4, 8, 12, 16 and 20. Watch those slips turn pink.'
        write: '$E_2 = \{4,\ 8,\ 12,\ 16,\ 20\}$'
        doodle_do:
          - {id: slips, op: stage, stage: 'custom:2000_q45_a2'}
      - say: 'So n of $E_2$ is 5. In the Venn diagram, 12 is in both sets, and 4 numbers are in $E_2$ only.'
        write: '$n(E_2) = 5$'
        doodle_do:
          - {id: slips, op: circle, part: fours, text: '5 slips'}
        diagram:
          id: v
          kind: venn
          'on': 'Venn diagram'
          universal: {name: 'U: 1 to 20', total: '20'}
          sets:
            - {key: E1, name: 'E₁: multiples of 3'}
            - {key: E2, name: 'E₂: multiples of 4'}
          counts: {'E1 only': '5', 'E1∩E2': '1', 'E2 only': '4', outside: '10'}
      - section: 'The probability'
        say: 'P of $E_2$ is n of $E_2$ over n of $U$, which is 5 over 20, or 1 over 4.'
        write: '$P(E_2) = \dfrac{n(E_2)}{n(U)} = \dfrac{5}{20} = \dfrac{1}{4}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '= 5'}, at: '20[[5]]', text: 'n(E₂)'}
          - {line: 5, kind: move, from: {line: 2, at: '= 20'}, at: '[[20]]5', text: 'n(U)'}
      - say: 'A number is either in $E_2$ or not, so the complement rule applies, and P of $E_2$ prime is 1 minus P of $E_2$.'
        write: '$P(E_2^{\prime}) = 1 - P(E_2)$'
        diagram_do:
          - {id: v, op: shade, part: "E2'", text: "E₂′: outside E₂", 'on': 'complement rule'}
      - say: 'Substitute the 1 over 4 we just found. 1 minus 1 over 4 is 3 over 4.'
        write: '$= 1 - \dfrac{1}{4} = \dfrac{3}{4}$'
        point:
          - {line: 7, kind: move, from: {line: 5, at: '= [[41]]'}, at: '− [[41]]', text: 'P(E₂)'}
      - section: 'Check'
        say: 'Check by counting the shaded part. 5 plus 10 is 15 numbers not in $E_2$. And 15 over 20 is 3 over 4.'
        write: 'Check: $n(E_2^{\prime}) = 20 - 5 = 15$, $\ \dfrac{15}{20} = \dfrac{3}{4}\ \checkmark$'
        doodle_do:
          - {id: slips, op: label, part: slips, text: '15 not pink'}
      - section: 'Answer'
        say: 'Therefore the probability that the number is not in $E_2$ is 3 over 4, which is option A.'
        write: '$\therefore P(E_2^{\prime}) = \dfrac{3}{4}$'
        answer: true
    traps:
      B: 'You went for 3 over 10. That is P of E1, the multiples of 3, which is 6 out of 20. The question is about E2, the multiples of 4.'
      C: 'You went for 1 over 4. That is P of E2 itself. The question says NOT in E2, so use the complement rule. 1 minus 1 over 4 is 3 over 4.'
      D: 'You went for 1 over 20. That is the probability of one particular number. n of E2 complement is 15, so it is 15 over 20, which is 3 over 4.'

  46:
    moments:
      - section: 'The question'
        say: 'The cumulative frequency curve shows the ages of the students in a school. We want the age group that 70% of the students belong to.'
        write: 'Age group holding $70\%$ of the students $= ?$'
        point:
          - {figure: 0, kind: circle, target: 'Age (years)', text: 'ages'}
      - section: 'Solution'
        say: 'Solution. On a cumulative frequency curve, the cf at an age is the number of students at or below that age.'
        write: 'Solution. cf at an age $=$ number of students at or below it'
        point:
          - {figure: 0, kind: arrow, target: {x: 210, y: 159}, text: 'cf = count so far'}
      - say: 'The total, $N$, is where the curve levels off at the top, which is 100 students.'
        write: '$N = 100$'
        point:
          - {figure: 0, kind: circle, target: '100', text: 'levels off'}
      - say: '70% of 100 is 70 over 100, times 100, which is 70 students.'
        write: '$70\%$ of $N = \dfrac{70}{100} \times 100 = 70$ students'
      - section: 'Read the curve'
        say: 'Read the cf at each class boundary on the age axis, straight up to the curve and across. I''ll put the readings in a table.'
        write: 'Readings from the curve:'
        diagram:
          id: r
          kind: table
          columns: ['Age', 'cf']
          rows: [['15.5', 10], ['16.5', 20], ['17.5', 30], ['18.5', 52], ['19.5', 78], ['20.5', 100]]
          'on': 'table'
      - say: 'The number in an age group is the cf at its upper end minus the cf at its lower end.'
        write: 'Number in group $=$ cf at upper end $-$ cf at lower end'
      - section: 'Test the groups'
        say: 'For option A, 15.5 to 18.5, 52 minus 10 is 42. That is not 70.'
        write: '$15.5 - 18.5$: $\ 52 - 10 = 42$'
      - say: 'For option B, 15.5 to 19.5, 78 minus 10 is 68. That is close, but not 70.'
        write: '$15.5 - 19.5$: $\ 78 - 10 = 68$'
      - say: 'For option C, 16.5 to 19.5, 78 minus 20 is 58. That is not 70.'
        write: '$16.5 - 19.5$: $\ 78 - 20 = 58$'
      - say: 'For option D, 17.5 to 20.5, 100 minus 30 is 70. That is exactly 70% of the students.'
        write: '$17.5 - 20.5$: $\ 100 - 30 = 70$ ✓'
        diagram_do:
          - {id: r, op: highlight, part: 'row:3', text: 'lower end: 30'}
          - {id: r, op: highlight, part: 'row:6', text: 'upper end: 100'}
        point:
          - {figure: 0, kind: circle, target: '17.5', text: 'reads 30'}
          - {figure: 0, kind: circle, target: '20.5', text: 'reads 100'}
      - section: 'Answer'
        say: 'So 70% of the students are aged 17.5 to 20.5, which is option D.'
        write: '$\therefore$ Age group: $17.5 - 20.5$'
        answer: true
    traps:
      A: 'You went for 15.5 to 18.5. Read the cf at both ends. 52 minus 10 is 42, which is only 42% of the students.'
      B: 'You went for 15.5 to 19.5. That holds 78 minus 10, which is 68 students. That is close, but not 70. The group 17.5 to 20.5 holds 100 minus 30, exactly 70.'
      C: 'You went for 16.5 to 19.5. That holds 78 minus 20, which is 58 students. We need 70, and 17.5 to 20.5 gives 100 minus 30, which is 70.'

  47:
    moments:
      - section: 'The question'
        say: 'We want the variance of $x$, $2x$, $3x$, $4x$ and $5x$. Picture them as towers, one block taller each time.'
        write: 'Variance of $x,\ 2x,\ 3x,\ 4x,\ 5x$'
        doodle: {name: 'custom:2000_q47_a', id: towers, caption: 'x, 2x, 3x, 4x, 5x as towers'}
      - section: 'Solution'
        say: 'Solution. The variance is the sum of the squared deviations over $n$. We call each deviation $d$, which is the value minus the mean.'
        write: 'Variance $= \dfrac{\sum d^{2}}{n}$, where $d = $ value $- \bar{x}$'
      - section: 'The mean'
        say: 'The mean first. $x$ plus $2x$ plus $3x$ plus $4x$ plus $5x$ is $15x$, and $n$ is 5.'
        write: '$\bar{x} = \dfrac{x + 2x + 3x + 4x + 5x}{5} = \dfrac{15x}{5}$'
      - say: '$15x$ over 5 is $3x$. Levelled out, each tower would be $3x$ high.'
        write: '$= 3x$'
        doodle_do:
          - {id: towers, op: stage, stage: 'custom:2000_q47_a2'}
      - section: 'The deviation table'
        say: 'Now the table, with each value, its deviation $d$ from $3x$, then $d$ squared.'
        write: '$\bar{x} = 3x$, $\ n = 5$'
        diagram:
          id: d
          kind: table
          columns: ['Value', 'd', 'd²']
          rows: [['x', '', ''], ['2x', '', ''], ['3x', '', ''], ['4x', '', ''], ['5x', '', '']]
          'on': 'table'
      - say: '$x$ minus $3x$ is minus $2x$. $2x$ minus $3x$ is minus $x$. $3x$ minus $3x$ is 0.'
        write: '$x - 3x = -2x,\ 2x - 3x = -x,\ 3x - 3x = 0$'
        diagram_do:
          - {id: d, op: fill, part: 'cell:1,2', text: '−2x'}
          - {id: d, op: fill, part: 'cell:2,2', text: '−x'}
          - {id: d, op: fill, part: 'cell:3,2', text: '0'}
      - say: '$4x$ minus $3x$ is $x$, and $5x$ minus $3x$ is $2x$. Those are the gaps from the mean line.'
        write: '$4x - 3x = x,\ 5x - 3x = 2x$'
        diagram_do:
          - {id: d, op: fill, part: 'cell:4,2', text: 'x'}
          - {id: d, op: fill, part: 'cell:5,2', text: '2x'}
        doodle_do:
          - {id: towers, op: stage, stage: 'custom:2000_q47_a3'}
      - say: 'Square them. Minus $2x$ squared is $4x$ squared, minus $x$ squared is $x$ squared, and 0 squared is 0. The minus signs go.'
        write: '$(-2x)^{2} = 4x^{2},\ (-x)^{2} = x^{2},\ 0^{2} = 0$'
        diagram_do:
          - {id: d, op: fill, part: 'cell:1,3', text: '4x²'}
          - {id: d, op: fill, part: 'cell:2,3', text: 'x²'}
          - {id: d, op: fill, part: 'cell:3,3', text: '0'}
      - say: '$x$ squared is $x$ squared, and $2x$ squared is $4x$ squared.'
        write: '$x^{2},\ (2x)^{2} = 4x^{2}$'
        diagram_do:
          - {id: d, op: fill, part: 'cell:4,3', text: 'x²'}
          - {id: d, op: fill, part: 'cell:5,3', text: '4x²'}
      - say: 'Add the last column, and 4 plus 1 plus 0 plus 1 plus 4 is 10, so the sum is $10x$ squared.'
        write: '$\sum d^{2} = 4x^{2} + x^{2} + 0 + x^{2} + 4x^{2} = 10x^{2}$'
        doodle_do:
          - {id: towers, op: label, part: devs, text: 'squared: 4 + 1 + 0 + 1 + 4'}
      - section: 'The variance'
        say: 'Substitute, and we get $10x$ squared over 5, which is $2x$ squared.'
        write: '$\therefore$ Variance $= \dfrac{10x^{2}}{5} = 2x^{2}$'
      - section: 'Check'
        say: 'Check with $x$ equals 1. The numbers 1 to 5 have mean 3, and squared deviations 4, 1, 0, 1, 4. 10 over 5 is 2, and $2x$ squared is 2.'
        write: 'Check $x = 1$: $\ \dfrac{4 + 1 + 0 + 1 + 4}{5} = 2 = 2(1)^{2}$ ✓'
      - section: 'Answer'
        say: 'So the variance is $2x$ squared, which is option B.'
        write: '$\therefore$ Variance $= 2x^{2}$'
        answer: true
    traps:
      A: 'You went for $x$ root 2. That is the standard deviation, the square root of the variance. The variance itself is $2x^{2}$.'
      C: 'You went for $x^{2}$. The squared deviations add to $10x^{2}$, and $10x^{2}$ over 5 is $2x^{2}$, not $x^{2}$.'
      D: 'You went for $3x$. That is the mean. The variance is the sum of the squared deviations over $n$, which is $2x^{2}$.'

  48:
    moments:
      - section: 'The question'
        say: 'We have a list of 22 numbers, and we want the range plus the mode. The range is a measure of spread, and the mode is the value that appears most often.'
        write: 'Range $+$ mode $= ?$'
      - section: 'Solution'
        say: 'Solution. With this many numbers, make a frequency table showing each value and how many times it appears. Go through the list and count.'
        write: 'Solution: frequency table'
        diagram:
          id: t
          kind: table
          columns: ['x', 'f']
          rows: [[4, ''], [5, ''], [6, ''], [7, ''], [8, ''], [9, ''], [10, '']]
          'on': 'frequency table'
      - say: '4 appears once. 5 appears twice, and so does 6.'
        write: '$f$: $\ 4 \to 1,\ 5 \to 2,\ 6 \to 2$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,2', text: '1'}
          - {id: t, op: fill, part: 'cell:2,2', text: '2'}
          - {id: t, op: fill, part: 'cell:3,2', text: '2'}
      - say: '7 appears three times, 8 three times, and 9 four times.'
        write: '$7 \to 3,\ 8 \to 3,\ 9 \to 4$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:4,2', text: '3'}
          - {id: t, op: fill, part: 'cell:5,2', text: '3'}
          - {id: t, op: fill, part: 'cell:6,2', text: '4'}
      - say: 'And 10 appears seven times.'
        write: '$10 \to 7$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:7,2', text: '7'}
      - say: 'Check the count, because the $f$ column must add to 22. 1 plus 2 plus 2 plus 3 plus 3 plus 4 plus 7 is 22. Good.'
        write: '$\sum f = 22$ ✓'
        diagram_do:
          - {id: t, op: total, part: 'col:2', 'on': 'add'}
      - section: 'The range'
        say: 'The range is the highest value minus the lowest. The table runs from 4 to 10. So the range is 10 minus 4, which is 6.'
        write: 'Range $=$ highest $-$ lowest $= 10 - 4 = 6$'
        diagram_do:
          - {id: t, op: highlight, part: 'row:1', text: 'lowest'}
          - {id: t, op: highlight, part: 'row:7', text: 'highest'}
      - section: 'The mode'
        say: 'The mode is the value with the highest frequency. The biggest $f$ is 7, for the value 10. So the mode is 10.'
        write: 'Mode $= 10$ (highest frequency, $7$)'
        diagram_do:
          - {id: t, op: label, part: 'cell:7,2', text: 'mode: 10'}
      - section: 'The sum'
        say: 'Now add them, so the range, 6, plus the mode, 10, is 16.'
        write: 'Range $+$ mode $= 6 + 10 = 16$'
        point:
          - {line: 8, kind: move, from: {line: 6, at: '= [[6]]'}, at: '= [[6]] +', text: 'range'}
          - {line: 8, kind: move, from: {line: 7, at: '= [[10]]'}, at: '+ [[10]]', text: 'mode'}
      - section: 'Answer'
        say: 'So the sum of the range and the mode is 16, which is option A.'
        write: '$\therefore$ Range $+$ mode $= 16$'
        answer: true
    traps:
      B: 'You went for 14. That is 10 plus 4, the mode plus the lowest value. The range is highest minus lowest, 10 minus 4, which is 6. So the sum is 16.'
      C: 'You went for 12. The range is 6 and the mode is 10, since 10 appears 7 times. 6 plus 10 is 16.'
      D: 'You went for 10. That is the mode alone. We still need to add the range, 6, to get 16.'

  49:
    moments:
      - section: 'The question'
        say: 'A delegation of 3 is chosen from 5 men and 3 women, with at least one man and at least one woman. In how many ways? List the cases first.'
        write: '$5$ men, $3$ women; choose $3$, at least one of each'
        doodle: {name: 'custom:2000_q49_a', id: people, caption: 'At least one man and one woman'}
      - say: 'Solution. A delegation is a selection, so we use combinations, where n C r is n factorial over n minus r factorial, times r factorial.'
        write: 'Solution: ${}^{n}C_{r} = \dfrac{n!}{(n - r)!\,r!}$'
      - say: 'At least one of each, from 3 people, leaves two cases, which are 2 men and 1 woman, or 1 man and 2 women.'
        write: 'Cases: (2 men, 1 woman) or (1 man, 2 women)'
      - section: 'Case 1: 2 men, 1 woman'
        say: '2 men from 5 is 5 C 2, which is 5 factorial over 3 factorial times 2 factorial. Expand 5 factorial down to 3 factorial, and the 3 factorials cancel.'
        write: '${}^{5}C_{2} = \dfrac{5!}{3!\,2!} = \dfrac{5 \times 4 \times 3!}{3! \times 2 \times 1} = 10$'
        doodle_do:
          - {id: people, op: circle, part: men, text: '2 of 5 men: 10'}
      - say: '1 woman from 3 is 3 C 1, which is 3.'
        write: '${}^{3}C_{1} = \dfrac{3!}{2!\,1!} = 3$'
      - say: 'The men AND the woman means we multiply. 10 times 3 is 30.'
        write: 'Case 1 $= {}^{5}C_{2} \times {}^{3}C_{1} = 10 \times 3 = 30$'
      - section: 'Case 2: 1 man, 2 women'
        say: '1 man from 5 is 5 C 1, which is 5. 2 women from 3 is 3 C 2, which is 3. 5 times 3 is 15.'
        write: 'Case 2 $= {}^{5}C_{1} \times {}^{3}C_{2} = 5 \times 3 = 15$'
        doodle_do:
          - {id: people, op: circle, part: women, text: '2 of 3 women: 3'}
      - section: 'Total'
        say: 'Case 1 OR case 2 means we add. 30 plus 15 is 45.'
        write: 'Total $= 30 + 15 = 45$'
        point:
          - {line: 7, kind: move, from: {line: 5, at: '= 30'}, at: '[[30]] +', text: 'case 1'}
          - {line: 7, kind: move, from: {line: 6, at: '= 15'}, at: '+ [[15]]', text: 'case 2'}
      - section: 'Check'
        say: 'Check by subtraction. Take all delegations of 3 from 8, minus those with no woman, minus those with no man.'
        write: 'Check: ${}^{8}C_{3} - {}^{5}C_{3} - {}^{3}C_{3}$'
      - say: '8 C 3 is 56, 5 C 3 is 10, and 3 C 3 is 1. 56 minus 10 minus 1 is 45, the same.'
        write: '$= 56 - 10 - 1 = 45\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the delegation can be chosen in 45 ways, which is option D.'
        write: '$\therefore$ 45 ways'
        answer: true
    traps:
      A: 'You went for 15. That is only case 2, 1 man and 2 women. Case 1, 2 men and 1 woman, adds 30 more, giving 45.'
      B: 'You went for 28. That is 8 C 2, which chooses only 2 people. The delegation has 3, and the two cases give 30 plus 15, which is 45.'
      C: 'You went for 30. That is only case 1, 2 men and 1 woman. At least one of each also allows 1 man and 2 women, which adds 15, giving 45.'

  50:
    moments:
      - section: 'The question'
        say: 'The table shows the ages of pupils in a school, in classes. We want the percentage of pupils who are over 15 years but less than 21 years.'
        write: 'Percentage over $15$ and under $21$ $= ?$'
      - section: 'Solution'
        say: 'Solution. Copy the frequency table. A percentage is the number we want over the total, sigma f, times 100.'
        write: 'Percentage $= \dfrac{\text{number wanted}}{\Sigma f} \times 100\%$'
        diagram: {id: t, kind: table, columns: ['Age (years)', 'Frequency (f)'], rows: [['10–12', 6], ['13–15', 14], ['16–18', 15], ['19–20', 10], ['21–23', 5]]}
      - say: 'First sigma f, the total number of pupils.'
        write: '$\Sigma f = 6 + 14 + 15 + 10 + 5$'
      - say: '6 plus 14 is 20, plus 15 is 35, plus 10 is 45, plus 5 is 50 pupils.'
        write: '$= 50$'
        diagram_do:
          - {id: t, op: total, part: 'col:2', 'on': '50 pupils'}
      - section: 'The classes we want'
        say: 'Over 15 means 16 or more. Less than 21 means 20 or less.'
        write: 'Over 15 and under 21: $16 \le \text{age} \le 20$'
      - say: 'So the classes 16 to 18 and 19 to 20 are in. 13 to 15 stops at 15, and 21 to 23 starts at 21, so both are out.'
        write: 'Classes in: $16\text{-}18$ and $19\text{-}20$'
        diagram_do:
          - {id: t, op: highlight, part: 'row:3', 'on': '16 to 18'}
          - {id: t, op: highlight, part: 'row:4', 'on': '19 to 20'}
      - say: 'Add their frequencies, and 15 plus 10 is 25 pupils.'
        write: 'Number wanted $= 15 + 10 = 25$'
      - section: 'The percentage'
        say: 'Substitute, with 25 pupils wanted out of 50.'
        write: 'Percentage $= \dfrac{25}{50} \times 100\%$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '= 25'}, at: '50[[25]]', text: 'wanted'}
          - {line: 7, kind: move, from: {line: 3, at: '= 50'}, at: '[[50]]25', text: 'Σf'}
      - say: '25 over 50 is a half, and a half of 100 is 50 percent.'
        write: '$= \dfrac{1}{2} \times 100\% = 50\%$'
      - section: 'Check'
        say: 'Check with the pupils left out. 6 plus 14 plus 5 is 25, the other half. 25 plus 25 is 50 pupils.'
        write: 'Check: others $= 6 + 14 + 5 = 25$; $25 + 25 = 50\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore 50 percent of the pupils are over 15 years but less than 21 years, which is answer choice C.'
        write: '$\therefore$ percentage $= 50\%$'
        answer: true
    traps:
      A: 'You went for 35%. Count the pupils aged 16 to 20. 15 plus 10 is 25. 25 over 50, times 100, is 50%.'
      B: 'You went for 45%. Check sigma f first, and it is 50 pupils. Those over 15 and under 21 are 15 plus 10, which is 25, and 25 over 50 is 50%.'
      D: 'You went for 60%. That includes the 21 to 23 class, but 21 is not less than 21. Leave those 5 out, and 25 over 50 is 50%.'
