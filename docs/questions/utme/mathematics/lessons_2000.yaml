        write: '$m_{2} = \dfrac{1}{K}$'
        point:
          - { line: 5, kind: move, from: { line: 4, at: '= [[K1]]x' }, at: '= [[K1]]', text: 'gradient' }
      - say: 'Now use the perpendicular condition: 4 over 3, times 1 over $K$, equals negative 1.'
        write: '$\dfrac{4}{3} \times \dfrac{1}{K} = -1$'
        point:
