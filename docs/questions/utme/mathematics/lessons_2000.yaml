      - say: 'So the whole integral becomes the integral from 0 to $\pi$ of negative 1, $d\theta$.'
        write: 'Integral $= \displaystyle\int_{0}^{\pi}(-1)\,d\theta$'
      - say: 'Integrating a constant gives that constant times theta. So negative 1 integrates to negative theta.'
        write: '$= \left[-\theta\right]_{0}^{\pi}$'
      - say: 'Now put in the limits: the value at the top limit, $\pi$, minus the value at the bottom limit, 0.'
        write: '$= (-\pi) - (-0)$'
      - say: 'Negative 0 is just 0, so this is negative $\pi$ minus 0, which is negative $\pi$.'
        write: '$= -\pi - 0 = -\pi$'
      - say: 'So the integral equals negative $\pi$, which is answer choice D.'
