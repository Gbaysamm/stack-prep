          - { line: 9, kind: move, from: { line: 6, at: 'b = [[1]]' }, at: '1 + [[1]] + c', text: 'b' }
      - say: '1 plus 1 is 2, so 2 plus $c$ equals 5.'
        write: '$2 + c = 5$'
      - say: 'Subtract 2 from both sides: 5 minus 2 is 3. So $c$ is 3.'
        write: '$c = 5 - 2 = 3$'
        point:
          - { line: 11, kind: move, from: { line: 10, at: '[[2]] + c' }, at: '− 2', text: 'across' }
