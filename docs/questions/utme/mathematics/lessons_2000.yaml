        write: '$\sin^{2}\theta + \cos^{2}\theta - 1 = 0$'
      - say: 'Now subtract sin squared theta from both sides. So cos squared theta minus 1 equals negative sin squared theta.'
        write: '$\cos^{2}\theta - 1 = -\sin^{2}\theta$'
