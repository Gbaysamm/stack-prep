# UTME 2000 Mathematics — lessons for the board.
#
# Each lesson is a run of moments: what the teacher says, and the one line written while it
# is said. See lessons_2002.yaml for the full format notes. Answers match explanations_2000.yaml.
format_version: 1
exam_year: 2000
lessons:
  1:
    moments:
      - say: 'We have three sets, $P$, $Q$ and $R$, and we want $(P - Q) \cap R$.'
        write: '$(P - Q) \cap R$'
      - say: 'Let me draw a Venn diagram, so we can see where everything belongs.'
        show_sketch: true
      - say: 'The brackets tell us the order. First we work out $P - Q$, and only then do we intersect the result with $R$.'
        write: 'Step 1: find $P - Q$'
      - say: 'What does $P - Q$ mean? It is everything that is in $P$ but not in $Q$. So let''s write out $P$ first.'
        write: '$P = \{1, 2, u, v, w, x\}$'
        point:
          - { figure: sketch, kind: circle, target: 'P' }
      - say: 'And here is $Q$: 2, 3, $u$, $v$, $w$, 5, 6 and $y$.'
        write: '$Q = \{2, 3, u, v, w, 5, 6, y\}$'
        point:
          - { figure: sketch, kind: circle, target: 'Q' }
      - say: 'Now go through $P$ one element at a time and look for it in $Q$. Is 1 in $Q$? No, so 1 stays.'
        write: '$1 \notin Q$: keep'
        point:
          - { figure: sketch, kind: circle, target: '1', text: 'not in Q' }
      - say: '2 is in $Q$, so it goes. $u$, $v$ and $w$ are all in $Q$ as well, so they go too.'
        write: '$2, u, v, w \in Q$: remove'
        point:
          - { figure: sketch, kind: circle, target: '2, v', text: 'in Q' }
          - { figure: sketch, kind: circle, target: 'u, w', text: 'in Q' }
      - say: 'And $x$? Look back at $Q$: there is no $x$ in it, so $x$ stays.'
        write: '$x \notin Q$: keep'
        point:
          - { figure: sketch, kind: circle, target: 'x', text: 'not in Q' }
      - say: 'So what is left of $P$ is 1 and $x$.'
        write: '$P - Q = \{1, x\}$'
      - say: 'Step 2. Now we intersect this with $R$. The intersection keeps only what appears in both sets. Here is $R$.'
        write: '$R = \{2, 3, 4, v, x, y\}$'
        point:
          - { figure: sketch, kind: circle, target: 'R' }
      - say: 'Take the set we just found, 1 and $x$, and intersect it with $R$.'
        write: '$(P - Q) \cap R = \{1, x\} \cap \{2, 3, 4, v, x, y\}$'
        point:
          - { line: 10, kind: move, from: { line: 8, at: '= [[{1, x}]]' }, at: '= [[{1, x}]] ∩', text: 'from step 1' }
          - { line: 10, kind: move, from: { line: 9, at: '= [[{2, 3, 4, v, x, y}]]' }, at: '∩ [[{2, 3, 4, v, x, y}]]', text: 'R' }
      - say: 'Is 1 in $R$? No, so it drops out. Is $x$ in $R$? Yes, it is.'
        write: 'Check each: $1 \notin R,\ x \in R$'
        point:
          - { figure: sketch, kind: circle, target: 'x', text: 'in R' }
      - say: 'So only $x$ survives, and $(P - Q) \cap R$ is the set containing $x$ alone, which is answer choice C.'
        write: '$= \{x\}$'
        answer: true
    traps:
      A: 'You went for the set 1, $x$. That''s $P - Q$ on its own. You still have to intersect it with $R$, and 1 is not in $R$, so it drops out.'
      B: 'You went for the set $x$, $y$. $y$ is in $R$, but it is not in $P$ at all, so it can never be in $P - Q$. Only elements of $P$ can survive the first step.'
      D: 'You went for the empty set. But $x$ is in $P$, is not in $Q$, and is in $R$, so one element does survive: $x$.'

  2:
    moments:
      - say: 'A town had 240,000 people in January 1998, and the population grows by 2% each year. We want the population in January 2000.'
        write: 'Population in 1998: $240{,}000$'
      - say: 'First, how many years of growth is that? January 1998 to January 1999 is one year, and on to January 2000 is a second. So 2 years.'
        write: 'Number of years: $2000 - 1998 = 2$'
      - say: 'What does growing by 2% mean? Each year the population becomes 100% of what it was, plus 2% more. That is 102% of the year before.'
        write: 'Each year: $100\% + 2\% = 102\%$'
      - say: '102% as a decimal is 102 over 100, which is 1.02. So each year we multiply by 1.02.'
        write: '$= \dfrac{102}{100} = 1.02$'
      - say: 'Let''s do the first year. The population becomes 240,000 times 1.02.'
        write: 'After 1 year: $240{,}000 \times 1.02$'
        point:
          - { line: 4, kind: move, from: { line: 3, at: '= [[1.02]]' }, at: '× [[1.02]]', text: 'multiplier' }
      - say: 'That is 240,000 plus 2% of 240,000. 2% of 240,000 is 4,800, so we get 244,800.'
        write: '$= 240{,}000 + 2\% \times 240{,}000 = 240{,}000 + 4{,}800 = 244{,}800$'
      - say: 'Now the second year. The 2% is taken on the new, bigger population, so we multiply the 244,800 we just found by 1.02.'
        write: 'After 2 years: $244{,}800 \times 1.02$'
        point:
          - { line: 6, kind: move, from: { line: 5, at: '= [[244,800]]' }, at: '[[244,800]] ×', text: 'after 1 year' }
      - say: '2% of 244,800 is 4,896. So we add that on.'
        write: '$= 244{,}800 + 2\% \times 244{,}800 = 244{,}800 + 4{,}896$'
      - say: '244,800 plus 4,896 is 249,696.'
        write: '$= 249{,}696$'
      - say: 'The compound growth formula: the amount equals the starting value, times 1 plus the rate over 100, to the power of the number of years.'
        write: 'Compound growth: $A = P\left(1 + \dfrac{r}{100}\right)^{n}$'
      - say: 'We can check it in one go: two years of growth is 240,000 times 1.02 squared. 1.02 squared is 1.0404, and 240,000 times 1.0404 is also 249,696.'
        write: 'Check: $240{,}000 \times 1.02^{2} = 240{,}000 \times 1.0404 = 249{,}696$'
      - say: 'So the population in January 2000 is 249,696, which is answer choice B.'
        write: 'Population in 2000 $= 249{,}696$'
        answer: true
    traps:
      A: 'You went for 480,000. That doubles the population, which would be growth of 100%, not 2%. Each year we only multiply by 1.02.'
      C: 'You went for 249,600. That adds 2% of the original 240,000, which is 4,800, twice. But the second year''s 2% is taken on 244,800, which is 4,896, so the answer is 249,696.'
      D: 'You went for 244,800. That''s the population after only one year, in January 1999. January 2000 needs a second year of growth on top.'

  3:
    moments:
      - say: 'We are told this fraction of surds equals $m + n\sqrt{6}$, and we want $m$ and $n$.'
        write: '$\dfrac{2\sqrt{3} - \sqrt{2}}{\sqrt{3} + 2\sqrt{2}} = m + n\sqrt{6}$'
      - say: 'The first thing we need to do is clear the surds from the bottom. The trick is the conjugate: the same bottom with its middle sign changed, $\sqrt{3} - 2\sqrt{2}$.'
        write: 'Conjugate of $\sqrt{3} + 2\sqrt{2}$ is $\sqrt{3} - 2\sqrt{2}$'
      - say: 'We multiply the top and the bottom by it. That is multiplying by 1, so the value does not change.'
        write: '$= \dfrac{2\sqrt{3} - \sqrt{2}}{\sqrt{3} + 2\sqrt{2}} \times \dfrac{\sqrt{3} - 2\sqrt{2}}{\sqrt{3} - 2\sqrt{2}}$'
      - say: 'Difference of two squares: $A$ plus $B$, times $A$ minus $B$, is $A$ squared minus $B$ squared.'
        write: 'Difference of two squares: $(A + B)(A - B) = A^{2} - B^{2}$'
      - say: 'Start with the bottom. A plus B, times A minus B, is A squared minus B squared. So the bottom is root 3 squared minus $2\sqrt{2}$ squared.'
        write: 'Bottom: $(\sqrt{3} + 2\sqrt{2})(\sqrt{3} - 2\sqrt{2}) = (\sqrt{3})^{2} - (2\sqrt{2})^{2}$'
      - say: 'Root 3 squared is 3. $2\sqrt{2}$ squared is 2 squared times root 2 squared, which is 4 times 2, so 8.'
        write: '$= 3 - 4 \times 2 = 3 - 8$'
      - say: '3 minus 8 is negative 5. So the bottom is negative 5, a plain number with no surd in it.'
        write: '$= -5$'
      - say: 'Now the top. We multiply every term in the first bracket by every term in the second.'
        write: 'Top: $(2\sqrt{3} - \sqrt{2})(\sqrt{3} - 2\sqrt{2})$'
      - say: 'That gives four products. The last one is plus, because negative $\sqrt{2}$ times negative $2\sqrt{2}$ is minus times minus.'
        write: '$= 2\sqrt{3}\cdot\sqrt{3} - 2\sqrt{3}\cdot 2\sqrt{2} - \sqrt{2}\cdot\sqrt{3} + \sqrt{2}\cdot 2\sqrt{2}$'
      - say: 'Now each one. $2\sqrt{3}$ times $\sqrt{3}$ is 2 times 3, which is 6. $2\sqrt{3}$ times $2\sqrt{2}$ is 4 root 6. $\sqrt{2}$ times $\sqrt{3}$ is root 6. And $\sqrt{2}$ times $2\sqrt{2}$ is 2 times 2, which is 4.'
        write: '$= 6 - 4\sqrt{6} - \sqrt{6} + 4$'
      - say: 'Collect like terms. 6 plus 4 is 10. Negative 4 root 6, minus another root 6, is negative 5 root 6.'
        write: '$= 10 - 5\sqrt{6}$'
      - say: 'Now put the top we just found over the bottom, negative 5.'
        write: 'So the fraction $= \dfrac{10 - 5\sqrt{6}}{-5}$'
        point:
          - { line: 11, kind: move, from: { line: 10, at: '= [[10 − 56]]' }, at: '−5[[10 − 56]]', text: 'the top' }
          - { line: 11, kind: move, from: { line: 6, at: '= [[−5]]' }, at: '= [[−5]]10', text: 'the bottom' }
      - say: 'Divide each term on top by negative 5. 10 over negative 5 is negative 2. Negative 5 root 6 over negative 5 is positive root 6.'
        write: '$= \dfrac{10}{-5} + \dfrac{-5\sqrt{6}}{-5} = -2 + \sqrt{6}$'
      - say: 'Now match this with $m + n\sqrt{6}$. The number standing on its own is $m$, and the number in front of root 6 is $n$, which here is 1.'
        write: '$-2 + 1\sqrt{6} = m + n\sqrt{6}$'
      - say: 'So $m$ is negative 2 and $n$ is 1, which is answer choice B.'
        write: '$m = -2,\quad n = 1$'
        answer: true
    traps:
      A: 'You went for 1, negative 2. Those are the right numbers in the wrong places with the wrong signs. After dividing by negative 5 we get negative 2 plus 1 root 6, so $m$ is negative 2 and $n$ is 1.'
      C: 'You went for negative 2 over 5, and 1. The top simplifies to $10 - 5\sqrt{6}$, and 10 divided by negative 5 is negative 2, not negative 2 over 5.'
      D: 'You went for 2 and 3 over 5. Check the bottom: 3 minus 8 is negative 5, and dividing $10 - 5\sqrt{6}$ by negative 5 gives negative 2 plus root 6.'

  4:
    moments:
      - say: 'A club has 94 members. 60 like modern music and 50 like traditional. The number who like both is three times the number who like neither. We want how many like only one type.'
        write: '$n(M) = 60,\quad n(T) = 50,\quad \text{total} = 94$'
        point:
          - { figure: sketch, kind: circle, target: 'modern 60' }
          - { figure: sketch, kind: circle, target: 'traditional 50' }
          - { figure: sketch, kind: circle, target: '94' }
      - say: 'Let me draw a Venn diagram, so we can see where everything belongs.'
        show_sketch: true
      - say: 'The first thing we need to do is name the unknown. Let $n$ be the number who like neither.'
        write: 'Neither $= n$'
        point:
          - { figure: sketch, kind: circle, target: 'n', text: 'neither' }
      - say: 'Both is three times neither, so the number who like both is $3n$.'
        write: 'Both $= 3n$'
        point:
          - { figure: sketch, kind: circle, target: '3n', text: 'both' }
      - say: 'How many like at least one type? Adding modern and traditional counts the people who like both twice, so we subtract both once.'
        write: '$n(M \cup T) = n(M) + n(T) - n(M \cap T)$'
      - say: 'Put in 60 for modern, 50 for traditional, and $3n$ for both.'
        write: '$= 60 + 50 - 3n$'
        point:
          - { line: 5, kind: move, from: { line: 0, at: 'n(M) = [[60]]' }, at: '= [[60]]', text: 'modern' }
          - { line: 5, kind: move, from: { line: 0, at: 'n(T) = [[50]]' }, at: '+ [[50]]', text: 'traditional' }
          - { line: 5, kind: move, from: { line: 3, at: '= [[3n]]' }, at: '− 3n', text: 'both' }
      - say: '60 plus 50 is 110.'
        write: '$= 110 - 3n$'
      - say: 'Every member either likes at least one type or likes neither. So those two groups together make all 94 members.'
        write: 'At least one $+$ neither $= 94$'
      - say: 'Use $110 - 3n$ for at least one, from the line above, and $n$ for neither.'
        write: '$(110 - 3n) + n = 94$'
        point:
          - { line: 8, kind: move, from: { line: 6, at: '= [[110 − 3n]]' }, at: '(110 − 3n)', text: 'at least one' }
          - { line: 8, kind: move, from: { line: 2, at: '= [[n]]' }, at: '+ [[n]] =', text: 'neither' }
          - { figure: sketch, kind: circle, target: 'n', text: 'neither' }
      - say: 'Negative $3n$ plus $n$ is negative $2n$.'
        write: '$110 - 2n = 94$'
      - say: 'Add $2n$ to both sides and take 94 from both sides. 110 minus 94 is 16.'
        write: '$2n = 110 - 94 = 16$'
        point:
          - { line: 10, kind: move, from: { line: 9, at: '[[− 2n]]' }, at: '[[2n]] =', text: 'across' }
          - { line: 10, kind: move, from: { line: 9, at: '= [[94]]' }, at: '− 94', text: 'across' }
      - say: 'Divide both sides by 2, and $n$ is 8. So 8 members like neither.'
        write: '$n = 8$'
      - say: 'Now go back to both equals $3n$. 3 times 8 is 24, so 24 like both.'
        write: 'Both $= 3 \times 8 = 24$'
        point:
          - { line: 12, kind: move, from: { line: 11, at: '= [[8]]' }, at: '× [[8]]', text: 'sub in' }
      - say: 'And going back to $110 - 3n$, the number who like at least one type is 110 minus 24, which is 86.'
        write: 'At least one $= 110 - 24 = 86$'
        point:
          - { line: 13, kind: move, from: { line: 12, at: '= [[24]]' }, at: '− 24', text: 'both' }
      - say: 'But the question says only one type, so we take away the 24 who like both. 86 minus 24 is 62, which is answer choice C.'
        write: 'Only one type $= 86 - 24 = 62$'
        point:
          - { line: 14, kind: move, from: { line: 13, at: '= [[86]]' }, at: '= [[86]]', text: 'at least one' }
          - { line: 14, kind: move, from: { line: 12, at: '= [[24]]' }, at: '− 24', text: 'both' }
        answer: true
    traps:
      A: 'You went for 8. That''s the number who like neither type of music. It is only a stepping stone: from it we get both, 24, and then only one type, 62.'
      B: 'You went for 24. That''s the number who like both types. The question asks for those who like exactly one type.'
      D: 'You went for 86. That''s everyone who likes at least one type, and it still includes the 24 who like both. Take them away to get 62.'

  5:
    moments:
      - say: 'We have to evaluate this, rounding each number to two significant figures first, and giving the answer to two significant figures.'
        write: '$\dfrac{(2.813 \times 10^{-3}) \times 1.063}{5.637 \times 10^{-2}}$'
      - say: 'Round first. In 2.813 the first two significant figures are 2 and 8. The next digit, 1, is less than 5, so we round down to 2.8.'
        write: '$2.813 \to 2.8$'
      - say: 'In 1.063 the next digit after 1.0 is 6, which is 5 or more, so we round up to 1.1.'
        write: '$1.063 \to 1.1$'
      - say: 'In 5.637 the next digit after 5.6 is 3, so it rounds down to 5.6. The powers of ten are exact, so they stay as they are.'
        write: '$5.637 \to 5.6$'
      - say: 'Now put the three rounded numbers back into the expression.'
        write: '$= \dfrac{(2.8 \times 10^{-3}) \times 1.1}{5.6 \times 10^{-2}}$'
        point:
          - { line: 4, kind: move, from: { line: 1, at: '→ [[2.8]]' }, at: '([[2.8]]', text: '2.813' }
          - { line: 4, kind: move, from: { line: 2, at: '→ [[1.1]]' }, at: '× [[1.1]]', text: '1.063' }
          - { line: 4, kind: move, from: { line: 3, at: '→ [[5.6]]' }, at: '= [[5.6]]', text: '5.637' }
      - say: 'Let''s keep the ordinary numbers and the powers of ten apart, and group them like this.'
        write: '$= \dfrac{2.8 \times 1.1}{5.6} \times \dfrac{10^{-3}}{10^{-2}}$'
      - say: 'On top, 2.8 times 1.1 is 2.8 plus 0.28, which is 3.08.'
        write: 'Top: $2.8 \times 1.1 = 2.8 + 0.28 = 3.08$'
      - say: 'Now 3.08 divided by 5.6. That is 0.55, because 5.6 times 0.55 is 3.08.'
        write: '$\dfrac{3.08}{5.6} = 0.55$, since $5.6 \times 0.55 = 3.08$'
      - say: 'The law of indices for dividing: when we divide powers of the same base, we subtract the indices.'
        write: 'Division law: $\dfrac{a^{m}}{a^{n}} = a^{m - n}$'
      - say: 'Now the powers of ten. When we divide, we subtract the indices: negative 3 minus negative 2 is negative 3 plus 2, which is negative 1.'
        write: '$\dfrac{10^{-3}}{10^{-2}} = 10^{-3 - (-2)} = 10^{-1}$'
      - say: 'Put the two pieces back together: the 0.55 times the 10 to the negative 1.'
        write: 'So the value $= 0.55 \times 10^{-1}$'
        point:
          - { line: 10, kind: move, from: { line: 7, at: '= [[0.55]]' }, at: '= [[0.55]] ×' }
          - { line: 10, kind: move, from: { line: 9, at: '= [[10−1]]' }, at: '× [[10−1]]' }
      - say: '10 to the negative 1 means divide by 10, and 0.55 divided by 10 is 0.055. That has two significant figures, 5 and 5. So it''s answer choice B.'
        write: '$= 0.055$'
        answer: true
    traps:
      A: 'You went for 0.056. With the rounded numbers, 2.8 times 1.1 is 3.08, and 3.08 divided by 5.6 is exactly 0.55, so the answer is exactly 0.055 with nothing to round up.'
      C: 'You went for 0.054. The question says to round each number first. With 2.8, 1.1 and 5.6, 3.08 divided by 5.6 is exactly 0.55, giving 0.055.'
      D: 'You went for 0.54. The digits are close, but the power of ten is off. 10 to the negative 3 divided by 10 to the negative 2 is 10 to the negative 1, so 0.55 becomes 0.055.'

  6:
    moments:
      - say: 'A man wants ₦150,000 after 3 years, at 25% compound interest. We want how much he must put in now.'
        write: 'Amount after 3 years: ₦150,000'
      - say: 'Compound interest at 25% means each year the money becomes 125% of what it was. As a decimal, that is 1.25 times.'
        write: 'Each year: $100\% + 25\% = 125\% = 1.25$'
      - say: 'The compound interest formula: the amount equals the principal, times 1 plus the rate over 100, to the power of the number of years.'
        write: 'Compound interest: $A = P\left(1 + \dfrac{r}{100}\right)^{n}$'
      - say: 'Let the deposit be $P$. After one year it is $P$ times 1.25, after two years times 1.25 again, and after three years times 1.25 a third time.'
        write: 'After 3 years: $P \times 1.25 \times 1.25 \times 1.25 = P \times 1.25^{3}$'
      - say: 'And that must equal the 150,000 he wants.'
        write: '$P \times 1.25^{3} = 150{,}000$'
      - say: 'Let''s work out 1.25 cubed. 1.25 squared is 1.5625.'
        write: '$1.25^{2} = 1.25 \times 1.25 = 1.5625$'
      - say: 'Multiply by 1.25 once more. 1.5625 times 1.25 is 1.953125.'
        write: '$1.25^{3} = 1.5625 \times 1.25 = 1.953125$'
      - say: 'Put that back into our equation.'
        write: '$P \times 1.953125 = 150{,}000$'
        point:
          - { line: 7, kind: move, from: { line: 6, at: '= [[1.953125]]' }, at: '× [[1.953125]]', text: 'from here' }
      - say: 'We know the end amount, not the start, so we divide both sides by 1.953125.'
        write: '$P = \dfrac{150{,}000}{1.953125}$'
        point:
          - { line: 8, kind: move, from: { line: 7, at: '× [[1.953125]]' }, at: '= [[1.953125]]', text: 'divide' }
      - say: 'Here is an easier way to divide. 1.25 is 5 over 4, so 1.25 cubed is 125 over 64. Dividing by 125 over 64 is the same as multiplying by 64 over 125.'
        write: '$= 150{,}000 \times \dfrac{64}{125}$'
      - say: '150,000 divided by 125 is 1,200, and 1,200 times 64 is 76,800.'
        write: '$= 1{,}200 \times 64 = 76{,}800$'
      - say: 'Let''s check by going forwards. 76,800 times 1.25 is 96,000. Times 1.25 again is 120,000. And times 1.25 once more is 150,000. It works.'
        write: 'Check: $76{,}800 \to 96{,}000 \to 120{,}000 \to 150{,}000$'
      - say: 'So he needs to deposit ₦76,800 now, which is answer choice D.'
        write: 'Deposit: ₦76,800'
        answer: true
    traps:
      A: 'You went for ₦112,000.50. Grow it forwards and after 3 years at 25% it would be over ₦218,000, far more than ₦150,000. Divide 150,000 by 1.25 cubed to get ₦76,800.'
      B: 'You went for ₦96,000. That''s how much the deposit has grown to after one year. The question wants the amount at the very start.'
      C: 'You went for ₦85,714.28. That''s 150,000 divided by 1.75, which treats the interest as simple, 25% added three times. Compound interest multiplies by 1.25 each year.'

  7:
    moments:
      - say: 'We are told 314 in base ten, minus 256 in base seven, equals 340 in base $x$. We want $x$.'
        write: '$314_{10} - 256_{7} = 340_{x}$'
      - say: 'Three different bases are mixed here, so the first thing we need to do is put everything in base ten. In base seven, the place values are 7 squared, which is 49, then 7, then 1.'
        write: 'Place values in base 7: $49,\ 7,\ 1$'
      - say: 'So $256_{7}$ is 2 lots of 49, plus 5 lots of 7, plus 6 ones.'
        write: '$256_{7} = 2 \times 49 + 5 \times 7 + 6 \times 1$'
      - say: '2 times 49 is 98. 5 times 7 is 35. And 6 times 1 is 6.'
        write: '$= 98 + 35 + 6$'
      - say: '98 plus 35 is 133, and 133 plus 6 is 139.'
        write: '$= 139$'
      - say: 'Now the left-hand side. 314 is already in base ten, so we take away the 139 we just found. 314 minus 139 is 175.'
        write: 'Left side: $314 - 139 = 175$'
        point:
          - { line: 5, kind: move, from: { line: 4, at: '= [[139]]' }, at: '− 139', text: '256 in base 7' }
      - say: 'Now the right-hand side. In base $x$, the place values are $x$ squared, $x$ and 1. So $340_{x}$ is 3 lots of $x$ squared, plus 4 lots of $x$, plus 0.'
        write: '$340_{x} = 3 \times x^{2} + 4 \times x + 0 = 3x^{2} + 4x$'
      - say: 'Both sides are the same number, so $3x^{2} + 4x$ must equal the 175 from the left.'
        write: '$3x^{2} + 4x = 175$'
        point:
          - { line: 7, kind: move, from: { line: 5, at: '= [[175]]' }, at: '= [[175]]', text: 'left side' }
      - say: 'Subtract 175 from both sides to get a quadratic equal to zero.'
        write: '$3x^{2} + 4x - 175 = 0$'
        point:
          - { line: 8, kind: move, from: { line: 7, at: '= [[175]]' }, at: '− 175', text: 'across' }
      - say: 'The quadratic formula: $x$ equals negative $b$, plus or minus the square root of $b^{2} - 4ac$, all over $2a$.'
        write: 'Quadratic formula: $x = \dfrac{-b \pm \sqrt{b^{2} - 4ac}}{2a}$'
      - say: 'Let''s use the quadratic formula, with $a = 3$, $b = 4$ and $c = -175$. First the discriminant, $b^{2} - 4ac$.'
        write: '$b^{2} - 4ac = 4^{2} - 4(3)(-175)$'
      - say: '4 squared is 16. 4 times 3 times 175 is 2100, and taking away a negative makes it plus. 16 plus 2100 is 2116.'
        write: '$= 16 + 2100 = 2116$'
      - say: 'The square root of 2116 is 46, because 46 times 46 is 2116.'
