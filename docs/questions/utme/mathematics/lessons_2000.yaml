      - say: 'Let''s sum the bracket first. See how each term comes from the one before: a half times negative a half is negative a quarter, and negative a quarter times negative a half is 1 over 8.'
        write: '$\tfrac{1}{2} \times \left(-\tfrac{1}{2}\right) = -\tfrac{1}{4},\quad -\tfrac{1}{4} \times \left(-\tfrac{1}{2}\right) = \tfrac{1}{8}$'
      - say: 'Multiplying by the same number each time makes this a geometric progression. The first term is a half, and the common ratio is negative a half.'
        write: '$a = \tfrac{1}{2},\quad r = -\tfrac{1}{2}$'
      - say: 'Since $r$ is between negative 1 and 1, the terms shrink towards zero, and the series has a sum to infinity: $a$ over 1 minus $r$.'
        write: '$S_\infty = \dfrac{a}{1 - r}$'
      - say: 'Substitute $a$ equals a half and $r$ equals negative a half.'
