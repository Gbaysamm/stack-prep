  47:
    moments:
      - say: 'We want the variance of $x$, $2x$, $3x$, $4x$ and $5x$.'
        write: '$x,\ 2x,\ 3x,\ 4x,\ 5x$'
      - say: 'Variance measures spread: it is the average of the squared distances from the mean. So the first thing we need is the mean.'
        write: 'Variance $= \dfrac{\text{sum of } (\text{value} - \text{mean})^{2}}{\text{number of values}}$'
      - say: 'Add the five values: $x$ plus $2x$ plus $3x$ plus $4x$ plus $5x$ is $15x$.'
        write: 'Sum $= x + 2x + 3x + 4x + 5x = 15x$'
      - say: 'Divide by 5, the number of values. $15x$ over 5 is $3x$.'
        write: 'Mean $= \dfrac{15x}{5} = 3x$'
      - say: 'Now take the mean, $3x$, away from each value. $x$ minus $3x$ is negative $2x$, and $2x$ minus $3x$ is negative $x$.'
        write: '$x - 3x = -2x,\quad 2x - 3x = -x$'
        point:
          - { line: 4, kind: move, from: { line: 3, at: '= [[3x]]' }, at: 'x [[− 3x]] = −2x', text: 'mean' }
      - say: '$3x$ minus $3x$ is 0, $4x$ minus $3x$ is $x$, and $5x$ minus $3x$ is $2x$.'
        write: '$3x - 3x = 0,\quad 4x - 3x = x,\quad 5x - 3x = 2x$'
      - say: 'Square each one. Negative $2x$ squared is $4x^{2}$, and negative $x$ squared is $x^{2}$. The minus signs disappear when we square.'
        write: '$(-2x)^{2} = 4x^{2},\quad (-x)^{2} = x^{2}$'
      - say: '0 squared is 0, $x$ squared is $x^{2}$, and $2x$ squared is $4x^{2}$.'
        write: '$0^{2} = 0,\quad (x)^{2} = x^{2},\quad (2x)^{2} = 4x^{2}$'
      - say: 'Add the squares: 4 plus 1 plus 0 plus 1 plus 4 is 10, so the total is $10x^{2}$.'
        write: 'Sum of squares $= 4x^{2} + x^{2} + 0 + x^{2} + 4x^{2} = 10x^{2}$'
      - say: 'Now divide that total by 5, the number of values.'
        write: 'Variance $= \dfrac{10x^{2}}{5}$'
        point:
          - { line: 9, kind: move, from: { line: 8, at: '= [[10x2]]' }, at: '= 5[[10x2]]', text: 'sum of squares' }
      - say: '10 divided by 5 is 2.'
        write: '$= 2x^{2}$'
      - say: 'So the variance is $2x^{2}$, which is answer choice B.'
        write: 'Variance $= 2x^{2}$'
        answer: true
    traps:
      A: 'You went for $x\sqrt{2}$. That''s the standard deviation, the square root of the variance. The variance itself is $2x^{2}$.'
      C: 'You went for $x^{2}$. The squared deviations add to $10x^{2}$, and dividing by 5 gives $2x^{2}$, not $x^{2}$.'
      D: 'You went for $3x$. That''s the mean. The variance is the average squared deviation, which is $2x^{2}$.'

