        write: 'B, C, D: bottom left $= -1 \neq 1$'
      - say: 'Option A has 1 in the top right and 1 in the bottom left. Transposing swaps two 1s, which changes nothing.'
        write: '$\begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix}^{T} = \begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix}$'
