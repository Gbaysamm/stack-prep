      - say: 'That small determinant is what is left when we cross out the row and column of $t - 4$. For a 2 by 2, we multiply down the leading diagonal and subtract the product of the other diagonal.'
        write: '$\begin{vmatrix} t + 1 & 1 \\ 4 & t - 2 \end{vmatrix} = (t + 1)(t - 2) - (1)(4)$'
      - say: 'Expand the bracket: $t$ times $t$ is $t$ squared, $t$ times negative 2 is negative $2t$, 1 times $t$ is $t$, and 1 times negative 2 is negative 2. Then 1 times 4 is 4.'
        write: '$= t^{2} - 2t + t - 2 - 4$'
      - say: 'Negative $2t$ plus $t$ is negative $t$, and negative 2 minus 4 is negative 6.'
        write: '$= t^{2} - t - 6$'
