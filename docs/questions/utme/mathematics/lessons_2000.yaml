  39:
    moments:
      - say: 'A function passes through the origin, and its derivative is $3x + 2$. We want the function.'
        write: '$\dfrac{dy}{dx} = 3x + 2$'
      - say: 'We know the derivative and want the function, so we go backwards. Going backwards from a derivative means integrating.'
        write: '$y = \displaystyle\int (3x + 2)\,dx$'
      - say: 'The rule for integrating a power of $x$: raise the power by 1, and divide by the new power.'
        write: 'Integration: $\displaystyle\int x^{n}\,dx = \dfrac{x^{n + 1}}{n + 1} + c$'
      - say: 'Integrate one term at a time. For $3x$: raise the power of $x$ from 1 to 2, then divide by the new power, 2. That gives $3x^{2}$ over 2.'
        write: '$\displaystyle\int 3x\,dx = \dfrac{3x^{2}}{2}$'
      - say: 'For 2: a constant integrates to itself times $x$, so 2 becomes $2x$.'
        write: '$\displaystyle\int 2\,dx = 2x$'
      - say: 'Every integral also carries a constant, $c$, because a constant disappears when you differentiate. So $y$ is 3 over 2 $x^{2}$, plus $2x$, plus $c$.'
        write: '$y = \dfrac{3}{2}x^{2} + 2x + c$'
      - say: 'Now we find $c$. The curve passes through the origin, so when $x$ is 0, $y$ is 0. Put those into the equation we just found.'
        write: 'At $(0, 0)$: $0 = \dfrac{3}{2}(0)^{2} + 2(0) + c$'
        point:
          - { line: 5, kind: arrow, text: 'into this' }
      - say: 'The first two terms are both zero, so zero equals $c$.'
        write: '$0 = 0 + 0 + c$'
      - say: 'So $c$ is 0.'
        write: '$c = 0$'
      - say: 'Let''s check by differentiating back. 3 over 2 $x^{2}$ gives 3 over 2 times $2x$, which is $3x$, and $2x$ gives 2. That is $3x + 2$, as it should be.'
        write: 'Check: $\dfrac{d}{dx}\left(\dfrac{3}{2}x^{2} + 2x\right) = \dfrac{3}{2} \times 2x + 2 = 3x + 2$'
      - say: 'So $y$ equals 3 over 2 $x^{2}$, plus $2x$, which is answer choice A.'
        write: '$y = \dfrac{3}{2}x^{2} + 2x$'
        point:
          - { line: 8, kind: circle, text: 'c = 0' }
        answer: true
    traps:
      B: 'You went for 3 over 2 $x^{2}$ plus $x$. The first term is right, but 2 integrates to $2x$, not $x$.'
      C: 'You went for $3x^{2}$ plus $x$ over 2. The divisions are on the wrong terms. $3x$ integrates to $\tfrac{3}{2}x^{2}$, and 2 integrates to $2x$.'
      D: 'You went for $3x^{2}$ plus $2x$. You forgot to divide by the new power. $3x$ integrates to $3x^{2}$ over 2. Differentiate $3x^{2}$ and you''d get $6x$, not $3x$.'

  40:
    moments:
      - say: 'The expression $ax^{2} + bx + c$ equals 5 when $x$ is 1, and its derivative is $2x + 1$. We want $a$, $b$ and $c$.'
        write: 'Expression: $ax^{2} + bx + c$'
      - say: 'The rule for differentiating a power of $x$: bring the power down in front, and reduce the power by 1.'
        write: 'Differentiation: $\dfrac{d}{dx}\left(x^{n}\right) = nx^{n - 1}$'
      - say: 'We are given two facts, and each gives us equations. Let''s start with the derivative. $ax^{2}$ differentiates to $2ax$, $bx$ to $b$, and the constant $c$ disappears.'
        write: '$\dfrac{d}{dx}(ax^{2} + bx + c) = 2ax + b$'
      - say: 'The question says the derivative is $2x + 1$. So these two must be the same.'
        write: '$2ax + b = 2x + 1$'
      - say: 'Two expressions like this are equal for every $x$ only if their matching parts agree. Match the $x$ terms: $2a$ equals 2.'
        write: 'Match the $x$ terms: $2a = 2$'
      - say: 'Divide both sides by 2, so $a$ is 1.'
        write: '$a = 1$'
      - say: 'Now match the plain numbers: $b$ on the left, 1 on the right. So $b$ is 1.'
        write: 'Match the constants: $b = 1$'
      - say: 'The derivative cannot tell us $c$, because $c$ vanished. So we use the second fact: the expression equals 5 when $x$ is 1.'
        write: 'At $x = 1$: $a(1)^{2} + b(1) + c = 5$'
      - say: '1 squared is 1, so this is just $a$ plus $b$ plus $c$ equals 5.'
        write: '$a + b + c = 5$'
      - say: 'Now put in the $a$ and $b$ we found: both are 1.'
        write: '$1 + 1 + c = 5$'
