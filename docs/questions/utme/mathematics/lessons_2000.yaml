  18:
    moments:
      - say: 'We want the values of $t$ that make the determinant of this 3 by 3 matrix zero.'
        write: '$\begin{vmatrix} t - 4 & 0 & 0 \\ -1 & t + 1 & 1 \\ 3 & 4 & t - 2 \end{vmatrix} = 0$'
      - say: 'Look at the first row: $t - 4$, then 0, then 0. Expanding along that row is quickest, because each 0 wipes out its whole term.'
        write: 'Expand along row 1: $t - 4,\ 0,\ 0$'
      - say: 'Each entry in the row is multiplied by its minor, with signs plus, minus, plus. The two zeros give zero, so only the first term is left.'
        write: '$= (t - 4)\begin{vmatrix} t + 1 & 1 \\ 4 & t - 2 \end{vmatrix} - 0 + 0$'
        point:
          - { line: 2, kind: strike, at: '− 0 + 0', text: 'zeros' }
      - say: 'For a 2 by 2 determinant, multiply down the leading diagonal, and subtract the product of the other diagonal.'
