# UTME 2000 Mathematics — lessons for the board.
#
# Each lesson is a run of moments: what the teacher says, and the one line written while it
# is said. See lessons_2002.yaml for the full format notes. Answers match explanations_2000.yaml.
format_version: 1
exam_year: 2000
lessons:
  1:
    moments:
      - say: 'We have three sets, $P$, $Q$ and $R$, and we want $(P - Q) \cap R$.'
        write: '$(P - Q) \cap R$'
      - say: 'Let me draw a Venn diagram, so we can see where everything belongs.'
        show_sketch: true
      - say: 'The brackets tell us the order. First we work out $P - Q$, and only then do we intersect the result with $R$.'
        write: 'Step 1: find $P - Q$'
      - say: 'What does $P - Q$ mean? It is everything that is in $P$ but not in $Q$. So let''s write out $P$ first. Picture $P$ as a bag holding six balls: 1, 2, $u$, $v$, $w$ and $x$.'
        write: '$P = \{1, 2, u, v, w, x\}$'
        point:
          - { figure: sketch, kind: circle, target: 'P' }
        doodle: {name: 'custom:2000_q01_a', id: bag, caption: 'Set P: a bag of six'}
      - say: 'And here is $Q$: 2, 3, $u$, $v$, $w$, 5, 6 and $y$.'
        write: '$Q = \{2, 3, u, v, w, 5, 6, y\}$'
        point:
          - { figure: sketch, kind: circle, target: 'Q' }
      - say: 'Now go through $P$ one element at a time and look for it in $Q$. Is 1 in $Q$? No, so 1 stays.'
        write: '$1 \notin Q$: keep'
        point:
          - { figure: sketch, kind: circle, target: '1', text: 'not in Q' }
      - say: '2 is in $Q$, so it goes. $u$, $v$ and $w$ are all in $Q$ as well, so they go too. Watch them get crossed out of the bag.'
        write: '$2, u, v, w \in Q$: remove'
        point:
          - { figure: sketch, kind: circle, target: '2, v', text: 'in Q' }
          - { figure: sketch, kind: circle, target: 'u, w', text: 'in Q' }
        doodle_do:
          - {id: bag, op: stage, stage: 'custom:2000_q01_a2'}
      - say: 'And $x$? Look back at $Q$: there is no $x$ in it, so $x$ stays.'
        write: '$x \notin Q$: keep'
        point:
          - { figure: sketch, kind: circle, target: 'x', text: 'not in Q' }
      - say: 'So what is left in the bag is 1 and $x$.'
        write: '$P - Q = \{1, x\}$'
        point:
          - {line: 8, kind: highlight, at: '1', to: {doodle: bag, part: b1}}
        doodle_do:
          - {id: bag, op: circle, part: b1}
          - {id: bag, op: circle, part: bx}
      - say: 'Step 2. Now we intersect this with $R$. The intersection keeps only what appears in both sets. Here is $R$.'
        write: '$R = \{2, 3, 4, v, x, y\}$'
        point:
          - { figure: sketch, kind: circle, target: 'R' }
      - say: 'Take the set we just found, 1 and $x$, and intersect it with $R$.'
        write: '$(P - Q) \cap R = \{1, x\} \cap \{2, 3, 4, v, x, y\}$'
        point:
          - { line: 10, kind: move, from: { line: 8, at: '= [[{1, x}]]' }, at: '= [[{1, x}]] ∩', text: 'from step 1' }
          - { line: 10, kind: move, from: { line: 9, at: '= [[{2, 3, 4, v, x, y}]]' }, at: '∩ [[{2, 3, 4, v, x, y}]]', text: 'R' }
      - say: 'Is 1 in $R$? No, so it drops out of the bag as well. Is $x$ in $R$? Yes, it is.'
        write: 'Check each: $1 \notin R,\ x \in R$'
        point:
          - { figure: sketch, kind: circle, target: 'x', text: 'in R' }
        doodle_do:
          - {id: bag, op: stage, stage: 'custom:2000_q01_a3'}
      - say: 'So only $x$ survives, and $(P - Q) \cap R$ is the set containing $x$ alone, which is answer choice C.'
        write: '$= \{x\}$'
        answer: true
    traps:
      A: 'You went for the set 1, $x$. That''s $P - Q$ on its own. You still have to intersect it with $R$, and 1 is not in $R$, so it drops out.'
      B: 'You went for the set $x$, $y$. $y$ is in $R$, but it is not in $P$ at all, so it can never be in $P - Q$. Only elements of $P$ can survive the first step.'
      D: 'You went for the empty set. But $x$ is in $P$, is not in $Q$, and is in $R$, so one element does survive: $x$.'

  2:
    moments:
      - section: 'The question'
        say: 'A town had 240,000 people in January 1998, and the population grows by 2% each year. What is it in January 2000? Each year''s 2% is taken on a bigger number. Picture the town growing.'
        write: 'Population: 240,000 in Jan 1998; increase $2\%$ each year'
        doodle: {name: 'custom:2000_q02_a', id: town, caption: 'Up 2% each year, for 2 years'}
      - section: 'Solution'
        say: 'Solution. List the givens. P, the starting population, is 240,000. R, the rate, is 2 percent. n, the number of years, is 2000 minus 1998, which is 2.'
        write: '$P = 240{,}000,\ R = 2,\ n = 2000 - 1998 = 2$'
      - say: 'The growth is taken on the new population each year, like compound interest. The formula is A equals P times bracket 1 plus R over 100, to the power n.'
        write: '$A = P\left(1 + \dfrac{R}{100}\right)^{n}$'
      - section: 'Substitute'
        say: 'Substitute: P is 240,000, R is 2, and n is 2.'
        write: '$A = 240{,}000\left(1 + \dfrac{2}{100}\right)^{2}$'
        point:
          - {line: 2, kind: box, text: 'the formula'}
      - say: '2 over 100 is 0.02, and 1 plus 0.02 is 1.02.'
        write: '$= 240{,}000 \times (1.02)^{2}$'
      - say: '1.02 squared is 1.02 times 1.02. 102 times 102 is 10,404, with 4 decimal places: 1.0404.'
        write: '$(1.02)^{2} = 1.02 \times 1.02 = 1.0404$'
      - say: 'So A is 240,000 times 1.0404.'
        write: '$A = 240{,}000 \times 1.0404$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '= [[1.0404]]'}, at: '× [[1.0404]]', text: 'from here'}
      - say: '240,000 times 1 is 240,000, and 240,000 times 0.0404 is 9,696. Add them: 249,696.'
        write: '$= 240{,}000 + 9{,}696 = 249{,}696$'
      - section: 'Check, year by year'
        say: 'Check year by year. 2% of 240,000 is 4,800. So January 1999 has 244,800 people.'
        write: '1999: $240{,}000 + 4{,}800 = 244{,}800$'
        point:
          - {line: 8, kind: highlight, at: '244,800', to: {doodle: town, part: h1999}}
        doodle_do:
          - {id: town, op: circle, part: step1, text: '+ 2%'}
          - {id: town, op: label, part: h1999, text: '244,800'}
      - say: 'The next 2% is on 244,800, which is 4,896. So January 2000 has 249,696 people, as the formula gave.'
        write: '2000: $244{,}800 + 4{,}896 = 249{,}696$ ✓'
        point:
          - {line: 9, kind: highlight, at: '249,696', to: {doodle: town, part: h2000}}
        doodle_do:
          - {id: town, op: circle, part: step2, text: '+ 2% again'}
          - {id: town, op: label, part: h2000, text: '249,696'}
      - say: 'Therefore the population in January 2000 is 249,696: option B.'
        write: '$\therefore$ population in Jan 2000 $= 249{,}696$ (B)'
        answer: true
    traps:
      A: 'You went for 480,000. That doubles the population, which is growth of 100%, not 2%. Each year we multiply by 1.02.'
      C: 'You went for 249,600. That adds 2% of the first 240,000, which is 4,800, twice. The second year''s 2% is on 244,800, which is 4,896, so the answer is 249,696.'
      D: 'You went for 244,800. That is the population after one year, in January 1999. January 2000 needs n equal to 2.'

  3:
    moments:
      - say: 'We are told this fraction of surds equals $m + n\sqrt{6}$, and we want $m$ and $n$.'
        write: '$\dfrac{2\sqrt{3} - \sqrt{2}}{\sqrt{3} + 2\sqrt{2}} = m + n\sqrt{6}$'
      - say: 'The first thing we need to do is clear the surds from the bottom. The trick is the conjugate: the same bottom with its middle sign changed, $\sqrt{3} - 2\sqrt{2}$.'
        write: 'Conjugate of $\sqrt{3} + 2\sqrt{2}$ is $\sqrt{3} - 2\sqrt{2}$'
      - say: 'We multiply the top and the bottom by it. That is multiplying by 1, so the value does not change.'
        write: '$= \dfrac{2\sqrt{3} - \sqrt{2}}{\sqrt{3} + 2\sqrt{2}} \times \dfrac{\sqrt{3} - 2\sqrt{2}}{\sqrt{3} - 2\sqrt{2}}$'
      - say: 'Difference of two squares: $A$ plus $B$, times $A$ minus $B$, is $A$ squared minus $B$ squared.'
        write: 'Difference of two squares: $(A + B)(A - B) = A^{2} - B^{2}$'
      - say: 'Start with the bottom: it is root 3 squared minus $2\sqrt{2}$ squared. Picture each as a square: root 3 is the side of the yellow square, and $2\sqrt{2}$ is the side of the blue one.'
        write: 'Bottom: $(\sqrt{3} + 2\sqrt{2})(\sqrt{3} - 2\sqrt{2}) = (\sqrt{3})^{2} - (2\sqrt{2})^{2}$'
        doodle: {name: 'custom:2000_q03_a', id: tiles, caption: 'Surds as sides of squares'}
      - say: 'Root 3 squared is the yellow square''s area, 3. The blue square has side $2\sqrt{2}$, two root 2s, so it holds four small squares of area 2 each: 4 times 2, so 8.'
        write: '$= 3 - 4 \times 2 = 3 - 8$'
        point:
          - {line: 5, kind: highlight, at: '8', to: {doodle: tiles, part: big}}
        doodle_do:
          - {id: tiles, op: circle, part: big, text: '4 × 2 = 8'}
      - say: '3 minus 8 is negative 5: the yellow area take away the blue. So the bottom is negative 5, a plain number with no surd in it.'
        write: '$= -5$'
        doodle_do:
          - {id: tiles, op: stage, stage: 'custom:2000_q03_a2'}
      - say: 'Now the top. We multiply every term in the first bracket by every term in the second.'
        write: 'Top: $(2\sqrt{3} - \sqrt{2})(\sqrt{3} - 2\sqrt{2})$'
      - say: 'That gives four products. The last one is plus, because negative $\sqrt{2}$ times negative $2\sqrt{2}$ is minus times minus.'
        write: '$= 2\sqrt{3}\cdot\sqrt{3} - 2\sqrt{3}\cdot 2\sqrt{2} - \sqrt{2}\cdot\sqrt{3} + \sqrt{2}\cdot 2\sqrt{2}$'
      - say: 'Now each one. $2\sqrt{3}$ times $\sqrt{3}$ is 2 times 3, which is 6. $2\sqrt{3}$ times $2\sqrt{2}$ is 4 root 6. $\sqrt{2}$ times $\sqrt{3}$ is root 6. And $\sqrt{2}$ times $2\sqrt{2}$ is 2 times 2, which is 4.'
        write: '$= 6 - 4\sqrt{6} - \sqrt{6} + 4$'
      - say: 'Collect like terms. 6 plus 4 is 10. Negative 4 root 6, minus another root 6, is negative 5 root 6.'
        write: '$= 10 - 5\sqrt{6}$'
      - say: 'Now put the top we just found over the bottom, negative 5.'
        write: 'So the fraction $= \dfrac{10 - 5\sqrt{6}}{-5}$'
        point:
          - { line: 11, kind: move, from: { line: 10, at: '= [[10 − 56]]' }, at: '−5[[10 − 56]]', text: 'the top' }
          - { line: 11, kind: move, from: { line: 6, at: '= [[−5]]' }, at: '= [[−5]]10', text: 'the bottom' }
      - say: 'Divide each term on top by negative 5. 10 over negative 5 is negative 2. Negative 5 root 6 over negative 5 is positive root 6.'
        write: '$= \dfrac{10}{-5} + \dfrac{-5\sqrt{6}}{-5} = -2 + \sqrt{6}$'
      - say: 'Now match this with $m + n\sqrt{6}$. The number standing on its own is $m$, and the number in front of root 6 is $n$, which here is 1.'
        write: '$-2 + 1\sqrt{6} = m + n\sqrt{6}$'
      - say: 'So $m$ is negative 2 and $n$ is 1, which is answer choice B.'
        write: '$m = -2,\quad n = 1$'
        answer: true
    traps:
      A: 'You went for 1, negative 2. Those are the right numbers in the wrong places with the wrong signs. After dividing by negative 5 we get negative 2 plus 1 root 6, so $m$ is negative 2 and $n$ is 1.'
      C: 'You went for negative 2 over 5, and 1. The top simplifies to $10 - 5\sqrt{6}$, and 10 divided by negative 5 is negative 2, not negative 2 over 5.'
      D: 'You went for 2 and 3 over 5. Check the bottom: 3 minus 8 is negative 5, and dividing $10 - 5\sqrt{6}$ by negative 5 gives negative 2 plus root 6.'

  4:
    moments:
      - say: 'A club has 94 members. Picture them: 60 like modern music, the radio, and 50 like traditional, the drum. The number who like both is three times the number who like neither. We want how many like only one type.'
        write: '$n(M) = 60,\quad n(T) = 50,\quad \text{total} = 94$'
        point:
          - { figure: sketch, kind: circle, target: 'modern 60' }
          - { figure: sketch, kind: circle, target: 'traditional 50' }
          - { figure: sketch, kind: circle, target: '94' }
        doodle: {name: 'custom:2000_q04_a', id: club, caption: 'Both = 3 × neither'}
      - say: 'Let me draw a Venn diagram, so we can see where everything belongs.'
        show_sketch: true
      - say: 'The first thing we need to do is name the unknown. Let $n$ be the number who like neither.'
        write: 'Neither $= n$'
        point:
          - { figure: sketch, kind: circle, target: 'n', text: 'neither' }
      - say: 'Both is three times neither, so the number who like both is $3n$.'
        write: 'Both $= 3n$'
        point:
          - { figure: sketch, kind: circle, target: '3n', text: 'both' }
      - say: 'How many like at least one type? Adding modern and traditional counts the people who like both twice, so we subtract both once.'
        write: '$n(M \cup T) = n(M) + n(T) - n(M \cap T)$'
      - say: 'Put in 60 for modern, 50 for traditional, and $3n$ for both.'
        write: '$= 60 + 50 - 3n$'
        point:
          - { line: 5, kind: move, from: { line: 0, at: 'n(M) = [[60]]' }, at: '= [[60]]', text: 'modern' }
          - { line: 5, kind: move, from: { line: 0, at: 'n(T) = [[50]]' }, at: '+ [[50]]', text: 'traditional' }
          - { line: 5, kind: move, from: { line: 3, at: '= [[3n]]' }, at: '− 3n', text: 'both' }
      - say: '60 plus 50 is 110.'
        write: '$= 110 - 3n$'
      - say: 'Every member either likes at least one type or likes neither. So those two groups together make all 94 members.'
        write: 'At least one $+$ neither $= 94$'
      - say: 'Use $110 - 3n$ for at least one, from the line above, and $n$ for neither.'
        write: '$(110 - 3n) + n = 94$'
        point:
          - { line: 8, kind: move, from: { line: 6, at: '= [[110 − 3n]]' }, at: '(110 − 3n)', text: 'at least one' }
          - { line: 8, kind: move, from: { line: 2, at: '= [[n]]' }, at: '+ [[n]] =', text: 'neither' }
          - { figure: sketch, kind: circle, target: 'n', text: 'neither' }
      - say: 'Negative $3n$ plus $n$ is negative $2n$.'
        write: '$110 - 2n = 94$'
      - say: 'Add $2n$ to both sides and take 94 from both sides. 110 minus 94 is 16.'
        write: '$2n = 110 - 94 = 16$'
        point:
          - { line: 10, kind: move, from: { line: 9, at: '[[− 2n]]' }, at: '[[2n]] =', text: 'across' }
          - { line: 10, kind: move, from: { line: 9, at: '= [[94]]' }, at: '− 94', text: 'across' }
      - say: 'Divide both sides by 2, and $n$ is 8. So 8 of the club''s members like neither the radio nor the drum.'
        write: '$n = 8$'
        doodle_do:
          - {id: club, op: label, part: members, text: '8 like neither'}
      - say: 'Now go back to both equals $3n$. 3 times 8 is 24, so 24 members like both the radio and the drum.'
        write: 'Both $= 3 \times 8 = 24$'
        point:
          - { line: 12, kind: move, from: { line: 11, at: '= [[8]]' }, at: '× [[8]]', text: 'sub in' }
        doodle_do:
          - {id: club, op: arrow, part: radio, to_part: drum}
          - {id: club, op: label, part: drum, text: '24 like both'}
      - say: 'And going back to $110 - 3n$, the number who like at least one type is 110 minus 24, which is 86.'
        write: 'At least one $= 110 - 24 = 86$'
        point:
          - { line: 13, kind: move, from: { line: 12, at: '= [[24]]' }, at: '− 24', text: 'both' }
      - say: 'But the question says only one type, so we take away the 24 who like both. 86 minus 24 is 62 members who like just one of them, which is answer choice C.'
        write: 'Only one type $= 86 - 24 = 62$'
        point:
          - { line: 14, kind: move, from: { line: 13, at: '= [[86]]' }, at: '= [[86]]', text: 'at least one' }
          - { line: 14, kind: move, from: { line: 12, at: '= [[24]]' }, at: '− 24', text: 'both' }
          - {line: 14, kind: highlight, at: '62', to: {doodle: club, part: members}}
        answer: true
        doodle_do:
          - {id: club, op: highlight, part: members, text: '62 like only one'}
    traps:
      A: 'You went for 8. That''s the number who like neither type of music. It is only a stepping stone: from it we get both, 24, and then only one type, 62.'
      B: 'You went for 24. That''s the number who like both types. The question asks for those who like exactly one type.'
      D: 'You went for 86. That''s everyone who likes at least one type, and it still includes the 24 who like both. Take them away to get 62.'

  5:
    moments:
      - section: 'The question'
        say: 'Round each number to two significant figures first, then work it out, and give the answer to two significant figures. The options differ only in the last digit, so follow the order exactly.'
        write: '$\dfrac{(2.813 \times 10^{-3}) \times 1.063}{5.637 \times 10^{-2}}$'
      - section: 'Each number to 2 s.f.'
        say: 'Solution. 2.813: keep 2 and 8. The next digit is 1, less than 5, so leave it. 2.8. On its number line, 2.813 is nearer 2.8.'
        write: '$2.813 = 2.8$ (2 s.f.)'
        doodle: {name: 'custom:2000_q05_a', id: lines, caption: 'Each number goes to the nearer end', size: scene}
      - say: '1.063: keep 1 and 0. The next digit is 6, which is 5 or more, so add 1: 1.1.'
        write: '$1.063 = 1.1$ (2 s.f.)'
        doodle_do:
          - {id: lines, op: stage, stage: 'custom:2000_q05_a2'}
      - say: '5.637: keep 5 and 6. The next digit is 3, less than 5, so leave it: 5.6. The powers of ten are exact and stay.'
        write: '$5.637 = 5.6$ (2 s.f.)'
        doodle_do:
          - {id: lines, op: stage, stage: 'custom:2000_q05_a3'}
      - say: 'Put the three rounded numbers back into the expression.'
        write: '$= \dfrac{2.8 \times 10^{-3} \times 1.1}{5.6 \times 10^{-2}}$'
        doodle_do:
          - {id: lines, op: pulse}
      - section: 'Cancel first'
        say: 'Cancel first. 2.8 is half of 5.6, so 2.8 over 5.6 is 1 over 2.'
        write: '$\dfrac{2.8}{5.6} = \dfrac{1}{2}$'
      - say: 'For the powers of ten, use the law of indices: to divide powers of the same base, subtract the indices. Negative 3 minus negative 2 is negative 1.'
        write: '$\dfrac{10^{-3}}{10^{-2}} = 10^{-3 - (-2)} = 10^{-1}$'
      - say: 'Therefore the value is 1 over 2, times 1.1, times 10 to the power negative 1.'
        write: '$\therefore$ value $= \dfrac{1}{2} \times 1.1 \times 10^{-1}$'
      - say: 'Half of 1.1 is 0.55. Times 10 to the power negative 1 means divide by 10: 0.055.'
        write: '$= 0.55 \times 10^{-1} = 0.055$'
      - say: 'To two significant figures: count from the first non-zero digit, 5 and 5. 0.055 already has exactly two.'
        write: '$= 0.055$ (2 s.f.)'
      - section: 'Check'
        say: 'Check by multiplying back: 0.055 times 0.056 is 0.00308, and 0.0028 times 1.1 is also 0.00308. It agrees.'
        write: 'Check: $0.055 \times 0.056 = 0.00308 = 0.0028 \times 1.1$ ✓'
      - say: 'Therefore the value is 0.055, to two significant figures: option B.'
        write: '$\therefore$ value $= 0.055$ (2 s.f.) (B)'
        answer: true
    traps:
      A: 'You went for 0.056. With the rounded numbers, 2.8 over 5.6 is exactly a half, and half of 1.1 is 0.55, so the value is exactly 0.055, with nothing to add 1 to.'
      C: 'You went for 0.054. That is a slip in the last digit. Round each number first, then cancel: 2.8 over 5.6 is a half, and half of 1.1 is 0.55, so the value is exactly 0.055.'
      D: 'You went for 0.54. The digits are close, but the power of ten is off. 10 to the power negative 3 over 10 to the power negative 2 is 10 to the power negative 1, so 0.55 becomes 0.055.'

  6:
    moments:
      - section: 'The question'
        say: 'A man wants ₦150,000 for a car after 3 years, at 25% compound interest. How much must he deposit now? We know the end, not the start. Picture his savings jar and the car.'
        write: 'Find $P$: amount after 3 years at $25\%$ compound = ₦150,000'
        doodle: {name: 'custom:2000_q06_a', id: jar, caption: 'Growing 25% a year for 3 years'}
      - section: 'Solution'
        say: 'Solution. List the givens. A, the amount at the end, is 150,000. R is 25 percent. n is 3 years. P, the deposit, is what we want.'
        write: '$A = 150{,}000,\ R = 25,\ n = 3,\ P = ?$'
      - say: 'The compound interest formula: A equals P times bracket 1 plus R over 100, to the power n.'
        write: '$A = P\left(1 + \dfrac{R}{100}\right)^{n}$'
      - section: 'Substitute'
        say: 'Substitute: A is 150,000, R is 25, and n is 3.'
        write: '$150{,}000 = P\left(1 + \dfrac{25}{100}\right)^{3}$'
        point:
          - {line: 2, kind: box, text: 'the formula'}
        doodle_do:
          - {id: jar, op: arrow, part: jar, to_part: car}
      - say: '25 over 100 is 1 over 4, and 1 plus 1 over 4 is 5 over 4.'
        write: '$150{,}000 = P\left(\dfrac{5}{4}\right)^{3}$'
      - say: '5 over 4 cubed is 5 cubed over 4 cubed: 125 over 64.'
        write: '$150{,}000 = P \times \dfrac{125}{64}$'
      - say: 'To make P the subject, multiply both sides by 64 over 125.'
        write: '$P = 150{,}000 \times \dfrac{64}{125}$'
      - say: 'Cancel first: 125 into 150,000 is 1,200. Then 1,200 times 64 is 76,800. That is what goes into the jar now.'
        write: '$= 1{,}200 \times 64 = 76{,}800$'
        point:
          - {line: 7, kind: highlight, at: '76,800', to: {doodle: jar, part: jar}}
        doodle_do:
          - {id: jar, op: fill, to: 0.51}
          - {id: jar, op: label, part: jar, text: '₦76,800'}
      - section: 'Check, year by year'
        say: 'Check forwards, and watch the jar fill. 25% of 76,800 is 19,200, so after 1 year it is 96,000. After 2 years, 120,000. After 3 years, 150,000. It works.'
        write: 'Check: $76{,}800 \to 96{,}000 \to 120{,}000 \to 150{,}000$ ✓'
        doodle_do:
          - {id: jar, op: fill, to: 0.64}
          - {id: jar, op: fill, to: 0.8}
          - {id: jar, op: fill, to: 1}
      - say: 'Therefore he needs to deposit ₦76,800 now: option D.'
        write: '$\therefore P$ = ₦76,800.00 (D)'
        answer: true
        doodle_do:
          - {id: jar, op: circle, part: car, text: 'paid for'}
    traps:
      A: 'You went for ₦112,000.50. Grown at 25% for 3 years, that would be over ₦218,000, far more than ₦150,000. P is 150,000 times 64 over 125, which is ₦76,800.'
      B: 'You went for ₦96,000. That is the deposit after one year. The question wants P, the amount at the very start.'
      C: 'You went for ₦85,714.28. That is 150,000 divided by 1.75, which treats the interest as simple: 25% added three times on the same P. Compound interest multiplies by 5 over 4 each year.'

  7:
    moments:
      - section: 'The question'
        say: '314 base ten, minus two-five-six base seven, equals three-four-nought base x. Find the base x. We put everything in base ten and make an equation in x.'
        write: 'If $314_{10} - 256_{7} = 340_{x}$, find $x$'
      - say: 'First, change two-five-six base seven to base ten.'
        write: 'Solution'
      - section: 'Step 1: base 7 to base 10'
        say: 'Write the index numbers over the digits: two, one, nought. Each digit times seven to the power of its index.'
        write: '$\overset{2}{2}\,\overset{1}{5}\,\overset{0}{6}_{7} = 2 \times 7^{2} + 5 \times 7^{1} + 6 \times 7^{0}$'
      - say: 'Seven squared is 49, seven to the power 1 is 7, and seven to the power nought is 1.'
        write: '$= 2 \times 49 + 5 \times 7 + 6 \times 1$'
      - say: '2 times 49 is 98. 5 times 7 is 35. 6 times 1 is 6.'
        write: '$= 98 + 35 + 6$'
      - say: '98 plus 35 is 133, and 133 plus 6 is 139.'
        write: '$= 139$'
      - section: 'Step 2: the left side'
        say: '314 is already in base ten, so the left side is 314 minus 139, which is 175.'
        write: '$314 - 139 = 175$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '139'}, at: '139'}
      - section: 'Step 3: expand the base x numeral'
        say: 'Now three-four-nought base x. Index numbers two, one, nought. 3 times x squared, plus 4 times x to the power 1, plus 0 times x to the power nought.'
        write: '$\overset{2}{3}\,\overset{1}{4}\,\overset{0}{0}_{x} = 3 \times x^{2} + 4 \times x^{1} + 0 \times x^{0}$'
      - say: 'x to the power 1 is x, and the last term is 0. So it is 3 x squared plus 4x.'
        write: '$= 3x^{2} + 4x$'
      - section: 'Step 4: solve for x'
        say: 'Both sides are the same number, so 3 x squared plus 4x equals 175.'
        write: '$3x^{2} + 4x = 175$'
        point:
          - {line: 9, kind: move, from: {line: 6, at: '=[[175]]'}, at: '175'}
      - say: 'Subtract 175 from both sides, to get a quadratic equal to 0.'
        write: '$3x^{2} + 4x - 175 = 0$'
      - say: 'Factorise by product and sum. Product is a times c: 3 times minus 175 is minus 525. Sum is b, 4.'
        write: 'Product $= 3 \times (-175) = -525$, Sum $= 4$'
      - say: 'We need two numbers that multiply to minus 525 and add to 4. They are 25 and minus 21.'
        write: 'Factors: $25$ and $-21$'
      - say: 'Split the middle term: 4x becomes 25x minus 21x.'
        write: '$3x^{2} + 25x - 21x - 175 = 0$'
      - say: 'Group in pairs. x is common to the first pair, and minus 7 to the second.'
        write: '$x(3x + 25) - 7(3x + 25) = 0$'
      - say: 'The bracket 3x plus 25 is common, so take it out.'
        write: '$(x - 7)(3x + 25) = 0$'
      - say: 'Either x minus 7 equals 0, or 3x plus 25 equals 0.'
        write: 'Either $x = 7$ or $x = -\dfrac{25}{3}$'
      - say: 'A base is a whole number, bigger than every digit used. The largest digit in three-four-nought is 4, so we reject minus 25 over 3.'
        write: 'Reject $x = -\dfrac{25}{3}$: a base is a whole number $> 4$'
      - section: 'Check'
        say: 'Check by expanding three-four-nought base seven, with the index numbers over the digits again.'
        write: '$\overset{2}{3}\,\overset{1}{4}\,\overset{0}{0}_{7} = 3 \times 7^{2} + 4 \times 7^{1} + 0 \times 7^{0}$'
      - say: '3 times 49 is 147, and 4 times 7 is 28. 147 plus 28 is 175. It agrees.'
        write: '$= 147 + 28 + 0 = 175\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the base x is 7, which is option C.'
        write: '$\therefore x = 7$'
        answer: true
    traps:
      A: 'You went for 5. In base five, three-four-nought is 3 times 25 plus 4 times 5, which is 95, not 175. Solving 3 x squared plus 4x equals 175 gives 7.'
      B: 'You went for 6. In base six, three-four-nought is 108 plus 24, which is 132, not 175. The base that gives 175 is 7.'
      D: 'You went for 8. In base eight, three-four-nought is 192 plus 32, which is 224, too big. Base seven gives exactly 175.'

  8:
    moments:
      - section: 'The question'
        say: 'Audu paid ₦50,000 for an article and sold it to Femi at a loss of x percent. Femi sells to Oche at a 40% profit, making ₦10,000. Find x. Watch whose cost each percentage is on.'
        write: 'Audu: C.P. = ₦50,000, loss $x\%$. Femi: profit $40\%$ = ₦10,000'
        doodle: {name: 'custom:2000_q08_a', id: sale, caption: 'Femi''s profit: ₦10,000'}
      - section: 'Solution'
        say: 'Solution. A profit or loss percent is always on the cost price, C.P., of the person selling. Femi''s 40% is on what Femi paid, not on Audu''s ₦50,000.'
        write: 'Profit $\% = \dfrac{\text{profit}}{\text{C.P.}} \times 100\%$'
        doodle_do:
          - {id: sale, op: move, part: item, path: to-femi}
          - {id: sale, op: move, part: item, path: to-oche}
          - {id: sale, op: circle, part: sale2, text: '40% of Femi''s C.P.'}
      - section: 'Femi''s cost price'
        say: 'Let Femi''s cost price be y naira.'
        write: 'Let Femi''s C.P. $= y$ naira'
      - say: 'Substitute into the formula: Femi''s profit percent, 40, equals 10,000 over y, times 100.'
        write: '$40 = \dfrac{10{,}000}{y} \times 100$'
        point:
          - {line: 1, kind: box, text: 'the formula'}
      - say: 'Cross multiply: 40 times y equals 10,000 times 100, which is 1,000,000.'
        write: '$40y = 1{,}000{,}000$'
      - say: 'Divide both sides by 40. 1,000,000 divided by 40 is 25,000.'
        write: '$y = \dfrac{1{,}000{,}000}{40} = 25{,}000$'
      - say: 'Femi paid ₦25,000. What Femi paid is exactly what Audu sold it for: Audu''s selling price, S.P.'
        write: 'Audu''s S.P. = Femi''s C.P. = ₦25,000'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '= [[25,000]]'}, at: '₦[[25,000]]', text: 'Femi paid'}
        doodle_do:
          - {id: sale, op: label, part: femi, text: 'paid ₦25,000'}
      - section: 'Audu''s loss'
        say: 'Audu''s loss is his C.P. minus his S.P.: 50,000 minus 25,000, which is 25,000.'
        write: 'Loss $=$ C.P. $-$ S.P. $= 50{,}000 - 25{,}000 = 25{,}000$'
        doodle_do:
          - {id: sale, op: label, part: audu, text: 'lost ₦25,000'}
      - say: 'Loss percent is the loss over Audu''s own C.P., times 100 percent.'
        write: 'Loss $\% = \dfrac{\text{loss}}{\text{C.P.}} \times 100\%$'
      - say: 'Substitute: x is 25,000 over 50,000, times 100. 25,000 over 50,000 is 1 over 2, and half of 100 is 50.'
        write: '$x = \dfrac{25{,}000}{50{,}000} \times 100 = 50$'
      - section: 'Check'
        say: 'Check forwards. A 50% loss on ₦50,000 means Audu sold for ₦25,000. 40% of 25,000 is 10,000, Femi''s profit. It agrees.'
        write: 'Check: $40\%$ of $25{,}000 = 10{,}000$ ✓'
      - say: 'Therefore x is 50: option B.'
        write: '$\therefore x = 50$ (B)'
        answer: true
        doodle_do:
          - {id: sale, op: circle, part: sale1, text: 'x = 50'}
    traps:
      A: 'You went for 60. A 60% loss means Audu sold for ₦20,000, and 40% of that is only ₦8,000, not ₦10,000. Femi''s C.P. is ₦25,000, so the loss is 50%.'
      C: 'You went for 40. That is Femi''s profit percent, not Audu''s loss percent. Audu''s loss is on his own C.P., ₦50,000.'
      D: 'You went for 20. A 20% loss means Audu sold for ₦40,000, and 40% of that is ₦16,000, not ₦10,000. Work back from Femi''s ₦10,000 profit: Femi''s C.P. is ₦25,000, so x is 50.'

  9:
    moments:
      - say: 'We want to simplify this fraction full of powers of 2.'
        write: '$\dfrac{3(2^{n+1}) - 4(2^{n-1})}{2^{n+1} - 2^{n}}$'
      - say: 'Every term is a power of 2 close to 2 to the $n$. So let''s give 2 to the $n$ a single letter, $u$. Picture it as one block. That turns this into ordinary algebra.'
        write: 'Let $u = 2^{n}$'
        doodle: {name: 'custom:2000_q09_a', id: blocks, caption: 'u = 2ⁿ is one block', size: scene}
      - say: 'The law of indices for multiplying: when we multiply powers of the same base, we add the indices.'
        write: 'Multiplication law: $a^{m} \times a^{n} = a^{m + n}$'
      - say: 'By the laws of indices, 2 to the $n$ plus 1 is 2 to the $n$ times 2 to the 1. That is 2 times $u$.'
        write: '$2^{n+1} = 2^{n} \times 2^{1} = 2u$'
      - say: 'And 2 to the $n$ minus 1 is 2 to the $n$ divided by 2, which is $u$ over 2. So one power up is two blocks, and one power down is half a block.'
        write: '$2^{n-1} = \dfrac{2^{n}}{2} = \dfrac{u}{2}$'
        doodle_do:
          - {id: blocks, op: stage, stage: 'custom:2000_q09_a2'}
      - say: 'Now the top of the fraction. Replace 2 to the $n$ plus 1 with $2u$, and 2 to the $n$ minus 1 with $u$ over 2.'
        write: 'Top: $3(2^{n+1}) - 4(2^{n-1}) = 3(2u) - 4\left(\dfrac{u}{2}\right)$'
        point:
          - { line: 5, kind: move, from: { line: 3, at: '= [[2u]]' }, at: '3[[(2u)]]', text: 'swap in' }
          - { line: 5, kind: move, from: { line: 4, at: '= [[2u]]' }, at: '4[[(2u)]]', text: 'swap in' }
      - say: '3 times $2u$ is $6u$. 4 times $u$ over 2 is 4 over 2 times $u$, which is $2u$.'
        write: '$= 6u - 2u$'
      - say: '$6u$ minus $2u$ is $4u$. In blocks: six blocks, take away two, leaves four.'
        write: '$= 4u$'
        doodle_do:
          - {id: blocks, op: stage, stage: 'custom:2000_q09_a3'}
      - say: 'Now the bottom. Using the same swaps, 2 to the $n$ plus 1 is $2u$, and 2 to the $n$ is $u$.'
        write: 'Bottom: $2^{n+1} - 2^{n} = 2u - u$'
      - say: '$2u$ minus $u$ is $u$: two blocks take away one leaves one block.'
        write: '$= u$'
        doodle_do:
          - {id: blocks, op: stage, stage: 'custom:2000_q09_a4'}
      - say: 'So the whole fraction is the top we found, $4u$, over the bottom we found, $u$.'
        write: '$\dfrac{3(2^{n+1}) - 4(2^{n-1})}{2^{n+1} - 2^{n}} = \dfrac{4u}{u}$'
        point:
          - { line: 10, kind: move, from: { line: 7, at: '= [[4u]]' }, at: '= u[[4u]]', text: 'top' }
          - { line: 10, kind: move, from: { line: 9, at: '= [[u]]' }, at: '= [[u]]4u', text: 'bottom' }
      - say: 'So we have four blocks over one block. The $u$ on top cancels with the $u$ on the bottom, leaving just 4. That''s answer choice C.'
        write: '$= 4$'
        answer: true
        doodle_do:
          - {id: blocks, op: circle, part: top, text: '4 blocks ÷ 1 block = 4'}
    traps:
      A: 'You went for 2 to the $n$ plus 1. Every term on top and bottom is a multiple of 2 to the $n$, so the $n$ cancels completely and leaves a plain number, 4.'
      B: 'You went for 2 to the $n$ minus 1. The powers of 2 cancel out: the top is $4u$ and the bottom is $u$, so the answer is just 4.'
      D: 'You went for a quarter. That''s the fraction upside down. The top is $4u$ and the bottom is $u$, so it is 4, not a quarter.'

  10:
    moments:
      - section: 'The question'
        say: 'P-three-four-four base six, minus two-three-P-two base six, equals two-P-P-two base six. P is a digit. Expand each numeral in base ten, keeping P, and solve.'
        write: 'If $P344_{6} - 23P2_{6} = 2PP2_{6}$, find $P$'
      - say: 'In base six the index numbers over four digits are three, two, one, nought. Six cubed is 216, and six squared is 36.'
        write: 'Solution'
      - section: 'Expand each numeral'
        say: 'First numeral: P times 6 cubed, plus 3 times 6 squared, plus 4 times 6, plus 4 times 1.'
        write: '$\overset{3}{P}\,\overset{2}{3}\,\overset{1}{4}\,\overset{0}{4}_{6} = P \times 6^{3} + 3 \times 6^{2} + 4 \times 6^{1} + 4 \times 6^{0}$'
      - say: 'P times 216 is 216P. 3 times 36 is 108, 4 times 6 is 24, and 4 times 1 is 4.'
        write: '$= 216P + 108 + 24 + 4$'
      - say: '108 plus 24 plus 4 is 136.'
        write: '$= 216P + 136$'
      - say: 'Second numeral: 2 times 6 cubed, plus 3 times 6 squared, plus P times 6, plus 2.'
        write: '$\overset{3}{2}\,\overset{2}{3}\,\overset{1}{P}\,\overset{0}{2}_{6} = 2 \times 6^{3} + 3 \times 6^{2} + P \times 6^{1} + 2 \times 6^{0}$'
      - say: '2 times 216 is 432, 3 times 36 is 108, P times 6 is 6P, and then 2.'
        write: '$= 432 + 108 + 6P + 2$'
      - say: '432 plus 108 plus 2 is 542.'
        write: '$= 542 + 6P$'
      - say: 'Third numeral: 2 times 6 cubed, plus P times 6 squared, plus P times 6, plus 2.'
        write: '$\overset{3}{2}\,\overset{2}{P}\,\overset{1}{P}\,\overset{0}{2}_{6} = 2 \times 6^{3} + P \times 6^{2} + P \times 6^{1} + 2 \times 6^{0}$'
      - say: '2 times 216 is 432, P times 36 is 36P, P times 6 is 6P, and then 2.'
        write: '$= 432 + 36P + 6P + 2$'
      - say: '432 plus 2 is 434, and 36P plus 6P is 42P.'
        write: '$= 434 + 42P$'
      - section: 'Form the equation and solve'
        say: 'Now the first minus the second equals the third. Keep the second in a bracket, because the whole of it is taken away.'
        write: '$(216P + 136) - (542 + 6P) = 434 + 42P$'
        point:
          - {line: 11, kind: move, from: {line: 4, at: '216P+136'}, at: '(216P+136)'}
          - {line: 11, kind: move, from: {line: 7, at: '542+6P'}, at: '(542+6P)'}
          - {line: 11, kind: move, from: {line: 10, at: '434+42P'}, at: '434+42P'}
      - say: 'Open the brackets. The minus sign changes both signs in the second bracket.'
        write: '$216P + 136 - 542 - 6P = 434 + 42P$'
      - say: 'Collect like terms on the left. 216P minus 6P is 210P, and 136 minus 542 is minus 406.'
        write: '$210P - 406 = 434 + 42P$'
      - say: 'Put the P terms on the left and the numbers on the right, changing sign as each crosses over.'
        write: '$210P - 42P = 434 + 406$'
      - say: '210P minus 42P is 168P, and 434 plus 406 is 840.'
        write: '$168P = 840$'
      - say: 'Divide both sides by 168. 168 times 5 is 840, so P is 5.'
        write: '$P = \dfrac{840}{168} = 5$'
      - say: 'Base six uses the digits 0 to 5, so 5 is allowed.'
        write: 'Base 6 digits: 0 to 5, so $P = 5$ is allowed'
      - section: 'Check'
        say: 'Check with P equals 5. The first numeral is 216 times 5 plus 136, which is 1216. The second is 542 plus 30, which is 572.'
        write: '$5344_{6} = 1216,\quad 2352_{6} = 572$'
      - say: '1216 minus 572 is 644. And the answer numeral, two-five-five-two base six, is 434 plus 210, which is also 644. It agrees.'
        write: '$1216 - 572 = 644 = 2552_{6}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore P is 5, which is option D.'
        write: '$\therefore P = 5$'
        answer: true
    traps:
      A: 'You went for 2. Put P equals 2 into 210P minus 406 equals 434 plus 42P: the left is 14 and the right is 518. Solving gives P equals 5.'
      B: 'You went for 3. With P equals 3 the left is 224 and the right is 560, so it does not balance. 168P equals 840 gives 5.'
      C: 'You went for 4. With P equals 4 the left is 434 and the right is 602. Only P equals 5 balances, with 644 on both sides.'

  11:
    moments:
      - say: 'We want to evaluate 5 to the power negative 3 log base 5 of 2, times 2 to the power 2 log base 2 of 3.'
        write: '$5^{-3\log_{5}2} \times 2^{2\log_{2}3}$'
      - say: 'The key fact: a base and its own logarithm undo each other. Picture two machines: one takes the log base 5, the next raises 5 to that power. Whatever goes in comes out unchanged. $a$ to the power log base $a$ of $k$ is just $k$.'
        write: 'Key fact: $a^{\log_{a}k} = k$'
        doodle: {name: 'custom:2000_q11_a', id: mach, caption: 'log₅ in, then 5 to the power', size: scene}
      - say: 'To use it, the number in front of each log has to move inside. The power law of logs says $n$ times log of $k$ is the log of $k$ to the $n$.'
        write: 'Power law: $n\log_{a}k = \log_{a}k^{n}$'
      - say: 'Let''s take the first part. By the power law, the negative 3 in front moves inside as a power of 2.'
        write: 'First part: $-3\log_{5}2 = \log_{5}2^{-3}$'
        point:
          - { line: 2, kind: box, text: 'power law' }
          - { line: 3, kind: move, from: { line: 3, at: '[[−3]]log' }, at: 'log52[[−3]]', text: 'up as the power' }
      - say: '2 to the negative 3 is 1 over 2 cubed, which is 1 over 8.'
        write: '$2^{-3} = \dfrac{1}{2^{3}} = \dfrac{1}{8}$'
      - say: 'So the first part is 5 to the power log base 5 of 1 over 8. Watch 1 over 8 go through both machines: the 5 and its log cancel, leaving 1 over 8.'
        write: '$5^{-3\log_{5}2} = 5^{\log_{5}\frac{1}{8}} = \dfrac{1}{8}$'
        point:
          - { line: 1, kind: box, text: 'key fact' }
        doodle_do:
          - {id: mach, op: move, part: card, path: through}
      - say: 'Now the second part. The 2 in front of the log moves inside as a power of 3, and 3 squared is 9.'
        write: 'Second part: $2\log_{2}3 = \log_{2}3^{2} = \log_{2}9$'
        point:
          - { line: 6, kind: move, from: { line: 6, at: '[[2]]log23' }, at: 'log23[[2]] =', text: 'up as the power' }
      - say: 'So the second part is 2 to the power log base 2 of 9. It is the same pair of machines with 2 instead of 5: the 2 and its log cancel, leaving 9.'
        write: '$2^{2\log_{2}3} = 2^{\log_{2}9} = 9$'
        doodle_do:
          - {id: mach, op: label, part: m2, text: 'with 2s: 9 in, 9 out'}
      - say: 'Now multiply the two parts we found: 1 over 8 from the first, times 9 from the second.'
        write: '$5^{-3\log_{5}2} \times 2^{2\log_{2}3} = \dfrac{1}{8} \times 9$'
        point:
          - { line: 8, kind: move, from: { line: 5, at: '= [[81]]' }, at: '= [[81]] ×', text: 'first part' }
          - { line: 8, kind: move, from: { line: 7, at: '= [[9]]' }, at: '× [[9]]', text: 'second part' }
      - say: '1 over 8 times 9 is 9 over 8.'
        write: '$= \dfrac{9}{8}$'
      - say: '8 goes into 9 once, with 1 left over, so 9 over 8 is 1 and 1 over 8. That''s answer choice B.'
        write: '$= 1\tfrac{1}{8}$'
        answer: true
    traps:
      A: 'You went for 8. That treats the first part as 2 cubed, but the power is negative 3, so it is 1 over 8. And the second part, 9, still has to multiply in.'
      C: 'You went for 2 over 5. The first part is 1 over 8 and the second is 9, so the product is 9 over 8, which is 1 and 1 over 8.'
      D: 'You went for 1 over 8. That''s only the first part. We still have to multiply by the second part, which is 9, giving 9 over 8.'

  12:
    moments:
      - say: 'The operation star is defined by $a * b = a^{b}$. Picture it as a machine with two slots. We are told $a * 2 = 2 - a$, and we want the possible values of $a$.'
        write: '$a * b = a^{b}$'
        doodle: {name: 'custom:2000_q12_a', id: star, caption: 'Two slots in, a to the b out'}
      - say: 'The rule says: raise the first number to the power of the second. So when 2 goes into the second slot, out comes $a$ squared.'
        write: '$a * 2 = a^{2}$'
        point:
          - { line: 0, kind: box, text: 'the rule' }
        doodle_do:
          - {id: star, op: label, part: slotb, text: 'b = 2'}
          - {id: star, op: label, part: out, text: 'a²'}
      - say: 'The question says what comes out, $a * 2$, equals 2 minus $a$. So $a$ squared equals 2 minus $a$.'
        write: '$a^{2} = 2 - a$'
        doodle_do:
          - {id: star, op: circle, part: out, text: '= 2 − a'}
      - say: 'This is a quadratic, so let''s bring everything to one side. First add $a$ to both sides.'
        write: '$a^{2} + a = 2$'
        point:
          - { line: 3, kind: move, from: { line: 2, at: '[[− a]]' }, at: '+ a', text: 'across' }
      - say: 'Then subtract 2 from both sides.'
        write: '$a^{2} + a - 2 = 0$'
        point:
          - { line: 4, kind: move, from: { line: 3, at: '= [[2]]' }, at: '− 2', text: 'across' }
      - say: 'To factorise, we need two numbers that multiply to negative 2 and add to 1. 2 times negative 1 is negative 2, and 2 plus negative 1 is 1.'
        write: 'Numbers: $2 \times (-1) = -2,\quad 2 + (-1) = 1$'
      - say: 'So the two brackets are $a + 2$ and $a - 1$.'
        write: '$(a + 2)(a - 1) = 0$'
      - say: 'If two brackets multiply to zero, one of them must be zero. Either $a + 2$ is zero, which gives $a$ equals negative 2,'
        write: '$a + 2 = 0 \Rightarrow a = -2$'
      - say: 'or $a - 1$ is zero, which gives $a$ equals 1.'
        write: '$a - 1 = 0 \Rightarrow a = 1$'
      - say: 'Let''s check both in the original, $a$ squared equals 2 minus $a$. For 1: 1 squared is 1, and 2 minus 1 is 1. It works.'
        write: 'Check $a = 1$: $1^{2} = 1,\ 2 - 1 = 1$'
      - say: 'For negative 2: negative 2 squared is 4, and 2 minus negative 2 is 2 plus 2, which is 4. It works too.'
        write: 'Check $a = -2$: $(-2)^{2} = 4,\ 2 - (-2) = 4$'
      - say: 'So the possible values of $a$ are 1 and negative 2, which is answer choice D.'
        write: '$a = 1 \text{ or } a = -2$'
        answer: true
        doodle_do:
          - {id: star, op: pulse, part: slota}
    traps:
      A: 'You went for 1 and negative 1. 1 works, but try negative 1: negative 1 squared is 1, while 2 minus negative 1 is 3. The other root is negative 2.'
      B: 'You went for 1 and 2. Try 2: 2 squared is 4, but 2 minus 2 is 0. The factors are $(a + 2)(a - 1)$, so the roots are 1 and negative 2.'
      C: 'You went for 2 and negative 2. Negative 2 works, but 2 does not: 2 squared is 4, and 2 minus 2 is 0. The other root is 1.'

  13:
    moments:
      - say: 'The 3rd term of an A.P. is $4x - 2y$ and the 9th term is $10x - 8y$. We want the common difference.'
        write: '$T_{3} = 4x - 2y,\quad T_{9} = 10x - 8y$'
      - say: 'In an A.P., each term is the one before plus the common difference $d$. Picture a staircase where every step rises by the same $d$. So the $n$th term is the first term $a$, plus $n$ minus 1 lots of $d$.'
        write: '$T_{n} = a + (n - 1)d$'
        doodle: {name: 'custom:2000_q13_a', id: stairs, caption: 'Every step rises by d', size: scene}
      - say: 'For the 3rd step, $n$ is 3, and 3 minus 1 is 2. So the 3rd term is $a + 2d$, and that equals $4x - 2y$.'
        write: '$T_{3} = a + 2d = 4x - 2y$'
        point:
          - { line: 1, kind: box, text: 'the rule' }
        doodle_do:
          - {id: stairs, op: circle, part: t3}
      - say: 'For the 9th step, $n$ is 9, and 9 minus 1 is 8. So the 9th term is $a + 8d$, and that equals $10x - 8y$.'
        write: '$T_{9} = a + 8d = 10x - 8y$'
        doodle_do:
          - {id: stairs, op: circle, part: t9}
      - say: 'We don''t know $a$, but we don''t need it. If we work out the 9th term minus the 3rd term, the $a$ disappears.'
        write: '$T_{9} - T_{3} = (a + 8d) - (a + 2d)$'
      - say: '$a$ minus $a$ is zero, and $8d$ minus $2d$ is $6d$. On the staircase, that is the climb from step 3 up to step 9: six equal steps.'
        write: '$= 6d$'
        doodle_do:
          - {id: stairs, op: highlight, part: rise, text: '6 steps = 6d'}
      - say: 'Now do the same subtraction with the expressions we were given: $10x - 8y$, minus $4x - 2y$.'
        write: '$T_{9} - T_{3} = (10x - 8y) - (4x - 2y)$'
      - say: 'Take away the bracket carefully. It becomes minus $4x$, and minus negative $2y$, which is plus $2y$.'
        write: '$= 10x - 8y - 4x + 2y$'
      - say: '$10x$ minus $4x$ is $6x$. Negative $8y$ plus $2y$ is negative $6y$.'
        write: '$= 6x - 6y$'
      - say: 'Both of those lines are the 9th term minus the 3rd, so they must be equal: $6d$ equals $6x - 6y$.'
        write: '$6d = 6x - 6y$'
        point:
          - { line: 9, kind: move, from: { line: 5, at: '= [[6d]]' }, at: '[[6d]] =', text: 'T9 − T3' }
          - { line: 9, kind: move, from: { line: 8, at: '= [[6x − 6y]]' }, at: '= [[6x − 6y]]', text: 'T9 − T3' }
          - {line: 9, kind: highlight, at: '6d', to: {doodle: stairs, part: rise}}
      - say: 'Divide both sides by 6, and each step rises by $x - y$. That''s answer choice C.'
        write: '$d = x - y$'
        answer: true
        doodle_do:
          - {id: stairs, op: label, part: rise, text: 'd = x − y'}
    traps:
      A: 'You went for $19x - 17y$. Subtracting the 3rd term from the 9th gives $6d = 6x - 6y$, so $d$ is just $x - y$.'
      B: 'You went for $8x - 4y$. The gap from the 3rd to the 9th term is 6 lots of $d$, and it equals $6x - 6y$. Dividing by 6 gives $d = x - y$.'
      D: 'You went for $2x$. That is actually the first term: with $d = x - y$, $a + 2d = 4x - 2y$ gives $a = 2x$. The common difference is $x - y$.'

  14:
    moments:
      - say: 'The operation is $p * q = p + q - pq$, the identity is zero, and we want the inverse of $p$.'
        write: '$p * q = p + q - pq,\quad e = 0$'
      - say: 'What is an inverse? It is the element that combines with $p$ to give the identity. Picture the star machine: $p$ goes in one slot, and we want the $q$ for the other slot that makes it give out zero.'
        write: 'Inverse: $p * q = e = 0$'
        doodle: {name: 'custom:2000_q14_a', id: star, caption: 'Which q brings p back to 0?'}
      - say: 'Using the rule for star, $p * q$ is $p + q - pq$. So what comes out of the machine, that expression, equals zero.'
        write: '$p + q - pq = 0$'
        point:
          - { line: 0, kind: box, at: 'p + q − pq', text: 'the rule' }
          - { line: 0, kind: underline, at: 'e = 0', text: 'identity' }
        doodle_do:
          - {id: star, op: circle, part: out, text: 'the identity'}
      - say: 'We want $q$ by itself, so keep the $q$ terms on the left. Subtract $p$ from both sides.'
        write: '$q - pq = -p$'
        point:
          - { line: 3, kind: move, from: { line: 2, at: '[[p]] + q' }, at: '= [[−p]]', text: 'across' }
      - say: 'Both terms on the left have a $q$ in them, so factor $q$ out.'
        write: '$q(1 - p) = -p$'
        point:
          - { line: 4, kind: move, from: { line: 3, at: '[[q]] − pq' }, at: '[[q]](', text: 'out front' }
      - say: 'Divide both sides by 1 minus $p$.'
        write: '$q = \dfrac{-p}{1 - p}$'
        point:
          - { line: 5, kind: move, from: { line: 4, at: '(1 − p)' }, at: 'q = [[1 − p]]', text: 'divide' }
      - say: 'Let''s tidy the signs by multiplying top and bottom by negative 1. The top becomes $p$, and the bottom, 1 minus $p$, becomes $p$ minus 1. That is what goes in the second slot.'
        write: '$= \dfrac{-p \times (-1)}{(1 - p) \times (-1)} = \dfrac{p}{p - 1}$'
        doodle_do:
          - {id: star, op: label, part: slotq, text: 'q = p/(p − 1)'}
      - say: 'Let''s check with a number. Say $p$ is 3. Our formula gives the inverse as 3 over 3 minus 1, which is 3 over 2.'
        write: 'Check $p = 3$: $q = \dfrac{3}{3 - 1} = \dfrac{3}{2}$'
      - say: 'Then 3 star 3 over 2 should give zero. By the rule it is 3, plus 3 over 2, minus 3 times 3 over 2.'
        write: '$3 * \dfrac{3}{2} = 3 + \dfrac{3}{2} - 3 \times \dfrac{3}{2}$'
      - say: '3 is 6 over 2, and 3 times 3 over 2 is 9 over 2. So we get 6 over 2 plus 3 over 2 minus 9 over 2, which is zero. Put 3 and 3 over 2 in the slots, and out comes 0. It works.'
        write: '$= \dfrac{6}{2} + \dfrac{3}{2} - \dfrac{9}{2} = 0$'
        doodle_do:
          - {id: star, op: pulse, part: out}
      - say: 'So the inverse of $p$ is $p$ over $p - 1$, which is answer choice C.'
        write: '$p^{-1} = \dfrac{p}{p - 1}$'
        answer: true
    traps:
      A: 'You went for $p$. Try $p = 3$: 3 star 3 is 3 plus 3 minus 9, which is negative 3, not 0. The inverse is $p$ over $p - 1$.'
      B: 'You went for $p - 1$. Try $p = 3$: 3 star 2 is 3 plus 2 minus 6, which is negative 1, not 0. Solving $p + q - pq = 0$ for $q$ gives $p$ over $p - 1$.'
      D: 'You went for $p$ over $p + 1$. That''s the right shape with a sign slip. When you multiply top and bottom by negative 1, $1 - p$ becomes $p - 1$, not $p + 1$.'

  15:
    moments:
      - say: 'We have a 2 by 2 matrix $P$ whose transpose equals itself, and $b = 1$. We want to find which matrix $P$ is.'
        write: '$P = \begin{pmatrix} a & b \\ c & d \end{pmatrix},\quad P^{T} = P$'
      - say: 'What is the transpose? Picture the matrix as entries in rows and columns: row 1 holds $a$ and $b$, row 2 holds $c$ and $d$. Transposing turns rows into columns: the first row, $a$, $b$, becomes the first column, and the second row, $c$, $d$, becomes the second column.'
        write: '$P^{T} = \begin{pmatrix} a & c \\ b & d \end{pmatrix}$'
        doodle: {name: 'custom:2000_q15_a', id: seats, caption: 'Rows of entries become columns'}
      - say: 'It is like flipping the entries over the dashed diagonal. So $a$ and $d$ on the diagonal stay where they are, while $b$ and $c$ swap places.'
        write: 'Transposing: $b$ and $c$ swap'
        doodle_do:
          - {id: seats, op: circle, part: diag, text: 'a and d stay'}
          - {id: seats, op: pulse, part: swap}
      - say: 'Saying $P$ transpose equals $P$ means these two matrices match, entry by entry.'
        write: '$\begin{pmatrix} a & c \\ b & d \end{pmatrix} = \begin{pmatrix} a & b \\ c & d \end{pmatrix}$'
      - say: 'Compare them. Top left: $a$ equals $a$, always true. Bottom right: $d$ equals $d$, always true.'
        write: 'Diagonal: $a = a,\ d = d$'
      - say: 'Top right: the transpose has $c$ where $P$ has $b$. So $c$ must equal $b$. That''s the only real condition. A matrix like this is called symmetric.'
        write: 'Top right: $c = b$'
      - say: 'We are told $b = 1$, so $c$ must be 1 as well. Both pink entries hold a 1.'
        write: '$c = b = 1$'
        point:
          - { line: 5, kind: arrow, text: 'the condition' }
          - { line: 0, kind: underline, text: 'given' }
        doodle_do:
          - {id: seats, op: stage, stage: 'custom:2000_q15_a2'}
      - say: 'So we need 1 in the top right and 1 in the bottom left. Let''s check the options. B, C and D all have negative 1 in the bottom left, so they fail.'
        write: 'B, C, D: bottom left $= -1 \neq 1$'
      - say: 'Option A has 1 in the top right and 1 in the bottom left. Transposing swaps two 1s, which changes nothing: the entries look the same after the flip.'
        write: '$\begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix}^{T} = \begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix}$'
        doodle_do:
          - {id: seats, op: pulse, part: mirror}
      - say: 'So $P$ is the matrix 0, 1, 1, 0, which is answer choice A.'
        write: '$P = \begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix}$'
        answer: true
    traps:
      B: 'You went for option B. Transposing it swaps the 1 and the negative 1, so its transpose is a different matrix. For $P^{T} = P$ the top-right and bottom-left entries must be equal, and both must be 1.'
      C: 'You went for option C. Its bottom-left entry is negative 1 while $b$ is 1, so transposing changes it. The bottom-left must equal $b$, which is 1.'
      D: 'You went for option D. Its bottom-left is negative 1, not 1, so it is not equal to its own transpose. Only a matrix with $c = b = 1$ is.'

  16:
    moments:
      - say: 'We want to evaluate a half minus a quarter plus 1 over 8 minus 1 over 16, and so on forever, all raised to the power negative 1.'
        write: '$\left(\tfrac{1}{2} - \tfrac{1}{4} + \tfrac{1}{8} - \tfrac{1}{16} + \ldots\right)^{-1}$'
      - say: 'Let''s sum the bracket first. Picture a walker on a number line: forward a half, back a quarter, forward an eighth. See how each jump comes from the one before: a half times negative a half is negative a quarter, and negative a quarter times negative a half is 1 over 8.'
        write: '$\tfrac{1}{2} \times \left(-\tfrac{1}{2}\right) = -\tfrac{1}{4},\quad -\tfrac{1}{4} \times \left(-\tfrac{1}{2}\right) = \tfrac{1}{8}$'
        doodle: {name: 'custom:2000_q16_a', id: walk, caption: 'Each jump is half the last, turned round', size: scene}
      - say: 'Multiplying by the same number each time makes this a geometric progression. The first term is a half, and the common ratio is negative a half.'
        write: '$a = \tfrac{1}{2},\quad r = -\tfrac{1}{2}$'
      - say: 'Since $r$ is between negative 1 and 1, the jumps shrink towards zero, and the walker settles down. So the series has a sum to infinity: $a$ over 1 minus $r$.'
        write: '$S_\infty = \dfrac{a}{1 - r}$'
        doodle_do:
          - {id: walk, op: move, part: walker, path: hops}
      - say: 'Substitute $a$ equals a half and $r$ equals negative a half.'
        write: '$S_\infty = \dfrac{\tfrac{1}{2}}{1 - \left(-\tfrac{1}{2}\right)}$'
        point:
          - { line: 3, kind: box, text: 'the rule' }
          - { line: 4, kind: move, from: { line: 2, at: 'a = [[21]]' }, at: ')[[21]]', text: 'a' }
          - { line: 4, kind: move, from: { line: 2, at: 'r = [[−21]]' }, at: '(−21)', text: 'r' }
      - say: 'Subtracting a negative means adding. 1 plus a half is 3 over 2.'
        write: '$= \dfrac{\tfrac{1}{2}}{\tfrac{3}{2}}$'
      - say: 'Dividing by 3 over 2 means multiplying by its flip, 2 over 3.'
        write: '$= \dfrac{1}{2} \times \dfrac{2}{3}$'
      - say: '1 times 2 is 2, and 2 times 3 is 6. 2 over 6 is a third. That is where the walker settles.'
        write: '$= \dfrac{2}{6} = \dfrac{1}{3}$'
        doodle_do:
          - {id: walk, op: stage, stage: 'custom:2000_q16_a2'}
      - say: 'So the bracket adds up to a third. Now the power negative 1. A power of negative 1 means take the reciprocal, that is, flip the fraction.'
        write: 'So the expression $= \left(\dfrac{1}{3}\right)^{-1}$'
        point:
          - { line: 8, kind: move, from: { line: 7, at: '= [[31]]' }, at: '([[31]])', text: 'the sum' }
      - say: 'Flipping 1 over 3 gives 3 over 1, which is 3. So the answer is 3, which is answer choice B.'
        write: '$= \dfrac{3}{1} = 3$'
        answer: true
        doodle_do:
          - {id: walk, op: label, part: flag, text: 'flip ⅓: 3'}
    traps:
      A: 'You went for two thirds. That''s the flip of 3 over 2, which is only the bottom, 1 minus $r$. The sum is a third, and its reciprocal is 3.'
      C: 'You went for negative two thirds. The sum is positive, a third, because the first term is positive and each term after it is smaller. Its reciprocal is 3.'
      D: 'You went for negative 1. The power negative 1 means take the reciprocal, not make it negative. The reciprocal of a third is 3.'

  17:
    moments:
      - section: 'The question'
        say: 'Four graphs, two inequalities. Find each boundary line, where they cross, and which side of each is wanted. Then only one graph fits.'
        write: '$2x - 2 \le y,\quad 2y - 2 \le x$'
      - section: 'First inequality'
        say: 'Solution. Make $y$ the subject of each. The first says $y$ is at least $2x$ minus 2.'
        write: 'Solution: (1) $\ y \ge 2x - 2$'
      - say: 'Its boundary is the line $y$ equals $2x$ minus 2: gradient 2, cutting the $y$-axis at minus 2. "At least" means the region above it.'
        write: 'Line $y = 2x - 2$: gradient 2, region above'
        point:
          - {figure: 0, kind: circle, target: {x: 60, y: 275}, text: 'cuts y-axis at −2'}
      - section: 'Second inequality'
        say: 'The second: add 2 to both sides, then divide by 2. 2 is positive, so the sign stays.'
        write: '(2) $\ 2y \le x + 2 \Rightarrow y \le \tfrac{1}{2}x + 1$'
      - say: 'Its boundary is $y$ equals a half $x$ plus 1: gradient a half, cutting the $y$-axis at 1. "At most" means the region below it.'
        write: 'Line $y = \tfrac{1}{2}x + 1$: gradient $\tfrac{1}{2}$, region below'
        point:
          - {figure: 0, kind: circle, target: {x: 60, y: 245}, text: 'cuts y-axis at 1'}
      - say: 'Both gradients are positive, so both lines slope upwards. That rules out graph B, whose lines slope down.'
        write: 'Both gradients $> 0$: not B'
        point:
          - {figure: 0, kind: strike, target: 'B', text: 'slopes down'}
      - section: 'Where they cross'
        say: 'Where do the lines cross? Solve them simultaneously: set the two right-hand sides equal, and multiply by 2.'
        write: '$2x - 2 = \tfrac{1}{2}x + 1 \Rightarrow 4x - 4 = x + 2$'
      - say: 'Subtract $x$ and add 4 on both sides: $3x$ equals 6, so $x$ is 2. Then $y$ is 2 times 2 minus 2, which is 2.'
        write: '$3x = 6 \Rightarrow x = 2,\ \ y = 2(2) - 2 = 2$'
        point:
          - {figure: 0, kind: label, target: {x: 80, y: 235}, text: '(2, 2)'}
      - section: 'Test a point'
        say: 'Test the origin in both. Is 0 at least minus 2? Yes. Is 0 at most 1? Yes. So the origin is in the wanted region.'
        write: 'Test $(0,\ 0)$: $\ 0 \ge -2\ \checkmark,\ \ 0 \le 1\ \checkmark$'
        point:
          - {figure: 0, kind: circle, target: {x: 60, y: 255}, text: 'origin'}
      - say: 'So the region is above the steep line and below the gentle one: the wedge with its point at 2, 2, opening to the left over the origin.'
        write: '$\therefore$ wedge from $(2,\ 2)$ containing the origin'
        point:
          - {figure: 0, kind: arrow, target: {x: 35, y: 280}, text: 'origin inside'}
      - say: 'That is graph C: option C.'
        write: 'Graph C'
        answer: true
        point:
          - {figure: 0, kind: circle, target: 'C', text: 'this one'}
    traps:
      A: 'You went for graph A. It has the right lines, but it shades the wedge on the other side of the crossing point. The origin satisfies both inequalities, so it must be in the region, and in graph A it isn''t.'
      B: 'You went for graph B. Its lines slope downwards, but both boundary lines, $y = 2x - 2$ and $y = \tfrac{1}{2}x + 1$, have positive gradients.'
      D: 'You went for graph D. That shades below both lines. We need above the steep line and below the gentle one, and that region contains the origin.'

  18:
    moments:
      - say: 'We want the values of $t$ that make the determinant of this 3 by 3 matrix zero.'
        write: '$\begin{vmatrix} t - 4 & 0 & 0 \\ -1 & t + 1 & 1 \\ 3 & 4 & t - 2 \end{vmatrix} = 0$'
      - say: 'Look at the first row of the grid: $t - 4$, then 0, then 0. Expanding along that row is quickest, because each 0 wipes out its whole term.'
        write: 'Expand along row 1: $t - 4,\ 0,\ 0$'
        point:
          - {line: 1, kind: highlight, at: 'row 1', to: {doodle: plan, part: pivot}}
        doodle: {name: 'custom:2000_q18_a', id: plan, caption: 'Row 1: t − 4, then two zeros'}
      - say: 'Each entry in the row is multiplied by its minor, with signs plus, minus, plus. The two zeros give zero, so only the first term is left.'
        write: '$= (t - 4)\begin{vmatrix} t + 1 & 1 \\ 4 & t - 2 \end{vmatrix} - 0 + 0$'
        point:
          - { line: 2, kind: strike, at: '− 0 + 0', text: 'zeros' }
        doodle_do:
          - {id: plan, op: cross, part: zeros}
      - say: 'For a 2 by 2 determinant, multiply down the leading diagonal, and subtract the product of the other diagonal.'
        write: 'Determinant: $\begin{vmatrix} a & b \\ c & d \end{vmatrix} = ad - bc$'
      - say: 'That small determinant is what is left when we cover the row and column of $t - 4$ in the grid. Now use $ad - bc$ on it.'
        write: '$\begin{vmatrix} t + 1 & 1 \\ 4 & t - 2 \end{vmatrix} = (t + 1)(t - 2) - (1)(4)$'
        doodle_do:
          - {id: plan, op: stage, stage: 'custom:2000_q18_a2'}
          - {id: plan, op: circle, part: minor}
      - say: 'Expand the bracket: $t$ times $t$ is $t$ squared, $t$ times negative 2 is negative $2t$, 1 times $t$ is $t$, and 1 times negative 2 is negative 2. Then 1 times 4 is 4.'
        write: '$= t^{2} - 2t + t - 2 - 4$'
      - say: 'Negative $2t$ plus $t$ is negative $t$, and negative 2 minus 4 is negative 6.'
        write: '$= t^{2} - t - 6$'
      - say: 'To factorise, we need two numbers that multiply to negative 6 and add to negative 1. Negative 3 times 2 is negative 6, and negative 3 plus 2 is negative 1.'
        write: 'Numbers: $-3 \times 2 = -6,\quad -3 + 2 = -1$'
      - say: 'So $t^{2} - t - 6$ factorises into $t - 3$ times $t + 2$.'
        write: '$t^{2} - t - 6 = (t - 3)(t + 2)$'
      - say: 'Now put this back in place of the small determinant. The whole determinant is $t - 4$, times $t - 3$, times $t + 2$.'
        write: 'Determinant $= (t - 4)(t - 3)(t + 2)$'
        point:
          - { line: 9, kind: move, from: { line: 8, at: '= [[(t − 3)(t + 2)]]' }, at: '(t − 3)(t + 2)', text: 'swap in' }
      - say: 'We want it to be zero.'
        write: '$(t - 4)(t - 3)(t + 2) = 0$'
      - say: 'A product is zero when one of its factors is zero. $t - 4 = 0$ gives $t = 4$. $t - 3 = 0$ gives $t = 3$. And $t + 2 = 0$ gives $t = -2$.'
        write: '$t - 4 = 0,\quad t - 3 = 0,\quad t + 2 = 0$'
      - say: 'So $t$ is 4, negative 2 or 3, which is answer choice D.'
        write: '$t = 4,\ -2,\ 3$'
        answer: true
    traps:
      A: 'You went for 0, 2, 3. The first row gives the factor $t - 4$, so $t = 4$ must be a root. And $t^{2} - t - 6$ factorises to $(t - 3)(t + 2)$, giving 3 and negative 2.'
      B: 'You went for negative 4, 2, 3. The signs of two roots are flipped: $t - 4 = 0$ gives positive 4, and $t + 2 = 0$ gives negative 2.'
      C: 'You went for negative 4, negative 2, negative 3. Setting $t - 4$ to zero gives positive 4, and $t - 3$ to zero gives positive 3.'

  19:
    moments:
      - section: 'The question'
        say: 'Three factors, three unknowns. Each factor gives us one equation, by the factor theorem. Picture the cubic as a machine: feed in the right number, and out comes 0.'
        write: '$(x - 1),\ (x + 1),\ (x - 2)$ are factors of $ax^{3} + bx^{2} + cx - 1$'
        doodle: {name: 'custom:2000_q19_a', id: cubic, caption: 'feed in a root, out comes 0', 'on': 'machine'}
      - section: 'Solution'
        say: 'Solution. Give the polynomial a name: $f$ of $x$.'
        write: 'Let $f(x) = ax^{3} + bx^{2} + cx - 1$'
      - say: 'The factor theorem: $x - p$ is a factor of $f(x)$ when $f(p)$ is zero. So each factor gives an equation.'
        write: 'Factor theorem: $(x - p)$ is a factor $\Rightarrow f(p) = 0$'
      - section: 'Three equations'
        say: 'First factor, $x - 1$. Let $x - 1$ equal zero, therefore $x$ is 1.'
        write: 'Let $x - 1 = 0$, $\ \therefore x = 1$'
        doodle_do:
          - {id: cubic, op: label, part: inputs, text: 'feed in 1'}
      - say: 'Substitute 1 for $x$, each value in brackets. The answer must be zero.'
        write: '$f(1) = a(1)^{3} + b(1)^{2} + c(1) - 1 = 0$'
        doodle_do:
          - {id: cubic, op: pulse, part: out}
      - say: '1 cubed and 1 squared are both 1. So $a + b + c - 1 = 0$. Add 1 to both sides. Call it equation 1.'
        write: '$a + b + c = 1 \quad \ldots\ldots (1)$'
      - say: 'Second factor, $x + 1$. Let $x + 1$ equal zero, therefore $x$ is minus 1.'
        write: 'Let $x + 1 = 0$, $\ \therefore x = -1$'
      - say: 'Substitute minus 1 for $x$, each in brackets. Minus 1 cubed is minus 1, and minus 1 squared is plus 1.'
        write: '$f(-1) = a(-1)^{3} + b(-1)^{2} + c(-1) - 1 = 0$'
      - say: 'That is minus $a$ plus $b$ minus $c$ minus 1 equals zero. Add 1 to both sides. Call it equation 2.'
        write: '$-a + b - c = 1 \quad \ldots\ldots (2)$'
      - say: 'Third factor, $x - 2$. Let $x - 2$ equal zero, therefore $x$ is 2.'
        write: 'Let $x - 2 = 0$, $\ \therefore x = 2$'
      - say: 'Substitute 2 for $x$. 2 cubed is 8, and 2 squared is 4.'
        write: '$f(2) = a(2)^{3} + b(2)^{2} + c(2) - 1 = 0$'
      - say: 'That is $8a$ plus $4b$ plus $2c$ minus 1 equals zero. Add 1 to both sides. Call it equation 3.'
        write: '$8a + 4b + 2c = 1 \quad \ldots\ldots (3)$'
      - section: 'Solve the equations'
        say: 'Look at equations 1 and 2: plus $a$ and minus $a$, plus $c$ and minus $c$. Add them, and both cancel.'
        write: '(1) + (2): $\ 2b = 2$'
        point:
          - {line: 5, kind: circle, at: 'a + b + c'}
          - {line: 8, kind: circle, at: '−a + b − c'}
      - say: 'Divide both sides by 2.'
        write: '$\therefore b = 1$'
      - say: 'Substitute $b = 1$ in equation 1.'
        write: 'Sub. $b = 1$ in (1): $\ a + 1 + c = 1$'
      - say: 'Subtract 1 from both sides. Call it equation 4.'
        write: '$a + c = 0 \quad \ldots\ldots (4)$'
      - say: 'Substitute $b = 1$ in equation 3. 4 times 1 is 4.'
        write: 'Sub. $b = 1$ in (3): $\ 8a + 4 + 2c = 1$'
      - say: 'Subtract 4 from both sides. 1 minus 4 is minus 3. Call it equation 5.'
        write: '$8a + 2c = -3 \quad \ldots\ldots (5)$'
      - say: 'To eliminate $c$, make its coefficients equal. Multiply equation 4 by 2. Call it equation 6.'
        write: '(4) $\times$ 2: $\ 2a + 2c = 0 \quad \ldots\ldots (6)$'
      - say: 'Now subtract equation 6 from equation 5. $2c$ cancels. $8a$ minus $2a$ is $6a$, and minus 3 minus 0 is minus 3.'
        write: '(5) $-$ (6): $\ 6a = -3$'
      - say: 'Divide both sides by 6. Minus 3 over 6 is minus 1 over 2.'
        write: '$a = -\dfrac{1}{2}$'
      - say: 'From equation 4, $c$ is minus $a$. Minus minus a half is plus a half.'
        write: 'From (4): $\ c = -a = \dfrac{1}{2}$'
      - section: 'Check'
        say: 'Check in equation 3. 8 times minus a half, plus 4 times 1, plus 2 times a half.'
        write: 'Check (3): $\ 8\left(-\tfrac{1}{2}\right) + 4(1) + 2\left(\tfrac{1}{2}\right)$'
      - say: 'Minus 4 plus 4 plus 1 is 1, as equation 3 says.'
        write: '$= -4 + 4 + 1 = 1$'
      - say: 'Therefore $a$ is minus a half, $b$ is 1 and $c$ is a half, which is answer choice A.'
        write: '$\therefore a = -\dfrac{1}{2},\ b = 1,\ c = \dfrac{1}{2}$'
        answer: true
    traps:
      B: 'You went for a half, 1, a half. Test equation 1: a half plus 1 plus a half is 2, not 1. Solving gives $6a = -3$, so $a$ is minus a half.'
      C: 'You went for a half, 1, minus a half. Equations 1 and 2 work, but test equation 3: 4 plus 4 minus 1 is 7, not 1. $a$ is minus a half and $c$ plus a half.'
      D: 'You went for a half, minus 1, a half. Test equation 1: a half minus 1 plus a half is 0, not 1. Adding (1) and (2) gives $2b = 2$, so $b$ is plus 1.'

  20:
    moments:
      - say: 'A trader makes $10x - x^{2}$ naira profit from selling $x$ bags of corn. Picture his sacks and his takings. We want the number of bags that gives the most profit.'
        write: 'Profit $= 10x - x^{2}$'
        point:
          - { figure: sketch, kind: circle, target: '10x − x²', text: 'profit' }
        doodle: {name: 'custom:2000_q20_a', id: corn, caption: 'Profit ₦(10x − x²) on x bags'}
      - say: 'Let me sketch the graph, so we can see its shape.'
        show_sketch: true
      - say: 'Let''s write it in the usual order, with the $x$ squared first: negative $x^{2}$ plus $10x$. So $a$ is negative 1 and $b$ is 10.'
        write: 'Profit $= -x^{2} + 10x$, so $a = -1,\ b = 10$'
      - say: 'Because $a$ is negative, the graph is a parabola that opens downwards, like a hill. The top of the hill is the maximum profit.'
        write: '$a = -1 < 0$: a hill with a highest point'
        point:
          - { figure: sketch, kind: circle, target: 'highest point', text: 'top of the hill' }
      - say: 'The turning point of a quadratic is at $x$ equals negative $b$ over $2a$.'
        write: 'Turning point: $x = -\dfrac{b}{2a}$'
      - say: 'Substitute $b$ equals 10 and $a$ equals negative 1.'
        write: '$x = -\dfrac{10}{2(-1)}$'
        point:
          - { line: 4, kind: box, text: 'the rule' }
          - { line: 5, kind: move, from: { line: 2, at: 'b = [[10]]' }, at: ')[[10]]', text: 'b' }
          - { line: 5, kind: move, from: { line: 2, at: 'a = [[−1]]' }, at: '2[[(−1)]]', text: 'a' }
      - say: '2 times negative 1 is negative 2.'
        write: '$= -\dfrac{10}{-2}$'
      - say: '10 over negative 2 is negative 5, and the minus sign in front turns it into positive 5. So the trader should sell 5 bags.'
        write: '$= -(-5) = 5$'
        point:
          - { figure: sketch, kind: circle, target: 'x = ?', text: '5' }
        doodle_do:
          - {id: corn, op: label, part: xbags, text: 'x = 5'}
      - say: 'Let''s check on either side. At 4 bags the profit is 10 times 4 minus 4 squared, which is 40 minus 16, so 24.'
        write: '$x = 4$: $10(4) - 4^{2} = 40 - 16 = 24$'
      - say: 'At 5 bags: 50 minus 25, which is 25. That is ₦25 of profit, the most he can make.'
        write: '$x = 5$: $10(5) - 5^{2} = 50 - 25 = 25$'
        doodle_do:
          - {id: corn, op: label, part: coin, text: '₦25, the most'}
      - say: 'At 6 bags: 60 minus 36, which is 24 again. So the profit climbs to 25 at 5 bags and falls after.'
        write: '$x = 6$: $10(6) - 6^{2} = 60 - 36 = 24$'
      - say: 'So 5 bags of corn give the maximum profit, which is answer choice B.'
        write: 'Maximum at $x = 5$ bags'
        point:
          - { figure: sketch, kind: circle, target: 'highest point', text: '5 bags' }
          - {line: 11, kind: highlight, at: '5 bags', to: {doodle: corn, part: sacks}}
        answer: true
        doodle_do:
          - {id: corn, op: circle, part: sacks, text: '5 bags'}
    traps:
      A: 'You went for 4. At 4 bags the profit is 24 naira, but at 5 bags it is 25. The turning point is at negative $b$ over $2a$, which is 5.'
      C: 'You went for 6. At 6 bags the profit is back down to 24 naira. The peak is at 5 bags.'
      D: 'You went for 7. At 7 bags the profit is 70 minus 49, which is 21. The profit is highest at 5 bags.'

  21:
    moments:
      - section: 'The question'
        say: 'A quadratic inequality with $x$ squared on the wrong side. Move everything across carefully, and the sign table does the rest.'
        write: '$2 - x > x^{2}$'
      - say: 'Solution. Bring everything to the right-hand side, so that $x$ squared stays positive. Subtract 2 and add $x$ on both sides.'
        write: 'Solution: $\ 0 > x^{2} + x - 2$'
      - say: 'Read it the other way round: $x$ squared plus $x$ minus 2 is less than zero.'
        write: '$x^{2} + x - 2 < 0$'
      - section: 'Factorise'
        say: 'Product and sum. The product is minus 2 and the sum is 1. Plus 2 and minus 1 work: they multiply to minus 2 and add to 1.'
        write: 'Product $= -2$, $\ $Sum $= 1$: $\ +2,\ -1$'
      - say: 'Split the middle term, $x$, into $2x$ minus $x$.'
        write: '$x^{2} + 2x - x - 2 < 0$'
      - say: 'Group in pairs. Take $x$ out of the first pair, and minus 1 out of the second.'
        write: '$x(x + 2) - 1(x + 2) < 0$'
      - say: 'Take out the common bracket, $x$ plus 2.'
        write: '$(x - 1)(x + 2) < 0$'
      - say: 'Critical values: $x$ minus 1 is zero at 1, and $x$ plus 2 is zero at minus 2.'
        write: 'Critical values: $\ x = -2,\ \ x = 1$'
      - section: 'Sign table'
        say: 'Now the sign table: three regions, one row for each bracket, then the product.'
        diagram:
          id: t
          kind: table
          columns: ['Factor', 'x < −2', '−2 < x < 1', 'x > 1']
          rows: [['x + 2', '', '', ''], ['x − 1', '', '', ''], ['product', '', '', '']]
      - say: '$x$ plus 2 is negative below minus 2, and positive above it.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,2', text: '−'}
          - {id: t, op: fill, part: 'cell:1,3', text: '+'}
          - {id: t, op: fill, part: 'cell:1,4', text: '+'}
      - say: '$x$ minus 1 is negative below 1, and positive above it.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:2,2', text: '−'}
          - {id: t, op: fill, part: 'cell:2,3', text: '−'}
          - {id: t, op: fill, part: 'cell:2,4', text: '+'}
      - say: 'Multiply down each column: plus, minus, plus. The product is negative only in the middle.'
        diagram_do:
          - {id: t, op: fill, part: 'cell:3,2', text: '+'}
          - {id: t, op: fill, part: 'cell:3,3', text: '−', colour: green}
          - {id: t, op: fill, part: 'cell:3,4', text: '+'}
      - section: 'Answer'
        say: 'We want less than zero, so the middle column.'
        write: '$\therefore\ -2 < x < 1$'
      - say: 'On a number line: open circles at minus 2 and 1, and the stretch between.'
        diagram: {id: n, kind: numberline, range: [-4, 3]}
        diagram_do:
          - {id: n, op: interval, from: -2, to: 1, from_open: true, to_open: true, text: '−2 < x < 1', answer: true, 'on': 'open circles'}
      - section: 'Check'
        say: 'Check $x$ equals 0, inside: 2 minus 0 is 2, and 0 squared is 0. 2 is greater than 0. And $x$ equals 2, outside: 0 is not greater than 4.'
        write: 'Check: $\ x = 0$: $2 > 0\ \checkmark$; $\ x = 2$: $0 > 4\ \times$'
      - say: 'So $x$ lies between minus 2 and 1: option D.'
        write: '$-2 < x < 1$'
        answer: true
    traps:
      A: 'You went for $x < -2$ or $x > 1$. The critical values are right, but those are the outer columns, where the product is positive. We need it less than zero: the middle column.'
      B: 'You went for $x > 2$ or $x < -1$. The factors are $(x - 1)(x + 2)$, so the critical values are minus 2 and 1, not 2 and minus 1. And less than zero means between them.'
      C: 'You went for minus 1 less than $x$ greater than 2. That is not a proper range, and the critical values are minus 2 and 1. The solution is $-2 < x < 1$.'

  22:
    moments:
      - section: 'The question'
        say: 'Alpha and beta are the roots of this quadratic, and we want 1 over alpha plus 1 over beta. We never need the roots themselves: the coefficients tell us enough.'
        write: '$3x^{2} + 5x - 2 = 0$, find $\dfrac{1}{\alpha} + \dfrac{1}{\beta}$'
      - section: 'Solution'
        say: 'Solution. Compare the equation with the general quadratic, $a$ $x$ squared plus $b$ $x$ plus $c$ equals zero, and list $a$, $b$ and $c$ first.'
        write: 'Compare with $ax^{2} + bx + c = 0$:'
      - say: '$a$, the coefficient of $x$ squared, is 3. $b$, the number in front of $x$, is 5. $c$, the constant term, is minus 2: keep its sign.'
        write: '$a = 3,\ b = 5,\ c = -2$'
      - section: 'Sum and product of roots'
        say: 'Recall: the sum of the roots, alpha plus beta, is minus $b$ over $a$.'
        write: '$\alpha + \beta = -\dfrac{b}{a}$'
      - say: 'Substitute $b$ equals 5 and $a$ equals 3. So alpha plus beta is minus 5 over 3. Keep the minus sign in front.'
        write: '$= -\dfrac{5}{3}$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: 'b = [[5]]'}, at: '5', text: 'b'}
          - {line: 4, kind: move, from: {line: 2, at: 'a = [[3]]'}, at: '3', text: 'a'}
      - say: 'The product of the roots, alpha times beta, is $c$ over $a$.'
        write: '$\alpha\beta = \dfrac{c}{a}$'
      - say: 'Substitute $c$ equals minus 2 and $a$ equals 3. Alpha beta is minus 2 over 3.'
        write: '$= \dfrac{-2}{3}$'
        point:
          - {line: 6, kind: move, from: {line: 2, at: 'c = [[−2]]'}, at: '−2', text: 'c'}
      - section: 'Sum over product'
        say: 'Now add the two fractions. The LCM of alpha and beta is alpha beta. So 1 over alpha plus 1 over beta is beta plus alpha, all over alpha beta.'
        write: '$\dfrac{1}{\alpha} + \dfrac{1}{\beta} = \dfrac{\beta + \alpha}{\alpha\beta}$'
      - say: 'Beta plus alpha is the same as alpha plus beta. So what we want is the sum of the roots over the product of the roots.'
        write: '$= \dfrac{\alpha + \beta}{\alpha\beta}$'
      - say: 'Substitute: minus 5 over 3 for the sum, divided by minus 2 over 3 for the product. Keep each one in brackets.'
        write: '$= \left(-\dfrac{5}{3}\right) \div \left(-\dfrac{2}{3}\right)$'
        point:
          - {line: 9, kind: move, from: {line: 4, at: '−35'}, at: '(−35)', text: 'sum'}
          - {line: 9, kind: move, from: {line: 6, at: '3−2'}, at: '(−32)', text: 'product'}
      - say: 'To divide by a fraction, multiply by its reciprocal. The reciprocal of minus 2 over 3 is minus 3 over 2.'
        write: '$= -\dfrac{5}{3} \times \left(-\dfrac{3}{2}\right)$'
      - say: 'The 3s cancel, and minus times minus is plus. That leaves 5 over 2.'
        write: '$= \dfrac{5}{2}$'
      - section: 'Check'
        say: 'Check with the real roots. By product and sum, product minus 6, sum 5, the factors are 6 and minus 1. The equation factorises as $3x$ minus 1, times $x$ plus 2.'
        write: 'Check: $(3x - 1)(x + 2) = 0$'
      - say: 'Either $3x$ minus 1 is zero, or $x$ plus 2 is zero. So the roots are 1 over 3 and minus 2.'
        write: 'Roots: $x = \dfrac{1}{3}$ or $x = -2$'
      - say: 'The reciprocal of 1 over 3 is 3, and the reciprocal of minus 2 is minus 1 over 2. 3 minus 1 over 2 is 5 over 2. It agrees.'
        write: '$\dfrac{1}{\alpha} + \dfrac{1}{\beta} = 3 - \dfrac{1}{2} = \dfrac{5}{2}$'
      - say: 'Therefore 1 over alpha plus 1 over beta is 5 over 2, which is answer choice D.'
        write: '$\therefore \dfrac{1}{\alpha} + \dfrac{1}{\beta} = \dfrac{5}{2}$'
        answer: true
    traps:
      A: 'You went for minus 5 over 2. The size is right, but a sign went missing. The sum is minus 5 over 3 and the product is minus 2 over 3, and a minus divided by a minus is a plus.'
      B: 'You went for minus 2 over 3. That is the product of the roots, alpha beta, on its own. We want the sum of the roots divided by the product.'
      C: 'You went for 1 over 2. Add the fractions with LCM alpha beta: 1 over alpha plus 1 over beta is alpha plus beta over alpha beta. Minus 5 over 3 divided by minus 2 over 3 is 5 over 2.'

  23:
    moments:
      - say: 'We want the smallest value of $f$ of $\theta$, which is 2 over, 3 minus cos $\theta$, for $\theta$ from 0 to 2 pi.'
        write: '$f(\theta) = \dfrac{2}{3 - \cos\theta}$'
      - say: 'Here is the key idea. The top is fixed at 2. Picture 2 pizzas: the more people share them, the smaller each share. A fraction with a fixed top gets smaller as its bottom gets bigger. So we want the bottom as big as possible.'
        write: 'Smallest $f$ $\Rightarrow$ largest $3 - \cos\theta$'
        doodle: {name: 'custom:2000_q23_a', id: pizza, caption: '2 pizzas, shared out', size: scene}
      - say: 'How big can the bottom get? That depends on cos $\theta$. Cosine always lies between negative 1 and 1.'
        write: '$-1 \le \cos\theta \le 1$'
      - say: 'The bottom is 3 minus cos $\theta$, so it is biggest when cos $\theta$ is as small as possible, which is negative 1.'
        write: 'Largest bottom when $\cos\theta = -1$'
      - say: 'Does that happen in our range? Yes. At $\theta$ equals pi, cos $\theta$ is negative 1, and pi is between 0 and 2 pi.'
        write: '$\cos\pi = -1$'
      - say: 'Put negative 1 into the bottom. 3 minus negative 1 is 3 plus 1, which is 4: four people sharing the 2 pizzas.'
        write: '$3 - (-1) = 3 + 1 = 4$'
        point:
          - { line: 5, kind: move, from: { line: 4, at: '= [[−1]]' }, at: '([[−1]])', text: 'cos θ = −1' }
          - {line: 5, kind: highlight, at: '4', to: {doodle: pizza, part: four}}
        doodle_do:
          - {id: pizza, op: stage, stage: 'custom:2000_q23_a2'}
      - say: 'So the smallest value of the function is 2 over 4.'
        write: '$f_{\min} = \dfrac{2}{4}$'
        point:
          - { line: 6, kind: move, from: { line: 5, at: '3 + 1 = [[4]]' }, at: '= [[4]]2', text: 'bottom' }
      - say: '2 over 4 simplifies to a half. Half a pizza each: the smallest share.'
        write: '$= \dfrac{1}{2}$'
        doodle_do:
          - {id: pizza, op: circle, part: four, text: 'the smallest share'}
      - say: 'For comparison, the other end. When cos $\theta$ is 1, the bottom is 3 minus 1, which is 2, and $f$ is 2 over 2, which is 1: a whole pizza each. That is the largest value, not the smallest.'
        write: 'At $\cos\theta = 1$: $\ \dfrac{2}{3 - 1} = \dfrac{2}{2} = 1$ (maximum)'
        doodle_do:
          - {id: pizza, op: pulse, part: two}
      - say: 'So the minimum value is a half, which is answer choice A.'
        write: '$f_{\min} = \dfrac{1}{2}$'
        point:
          - { line: 8, kind: strike, text: 'the maximum' }
        answer: true
    traps:
      B: 'You went for 2 over 3. That is the value when cos $\theta$ is 0, so the bottom is 3. But cos $\theta$ can go down to negative 1, which makes the bottom 4 and the fraction smaller.'
      C: 'You went for 1. That comes from cos $\theta$ equal to 1, which makes the bottom smallest, so it gives the maximum. For the minimum we want the biggest bottom, 4.'
      D: 'You went for 2. That is just the top of the fraction. The bottom, 3 minus cos $\theta$, is always at least 2, so the value never gets above 1.'

  24:
    moments:
      - say: 'A frustum has a square top of side 2 metres and a square base of side 5 metres, and they are 6 metres apart. We want the height of the whole pyramid it was cut from.'
        write: 'Top $= 2$ m; base $= 5$ m; depth $= 6$ m'
        point:
          - { figure: sketch, kind: circle, target: '2 m' }
          - { figure: sketch, kind: circle, target: '5 m' }
          - { figure: sketch, kind: circle, target: '6 m' }
      - say: 'Let me draw the frustum.'
        show_sketch: true
      - say: 'Now let me finish the pyramid the frustum was cut from, carrying its edges up to the apex $V$.'
        show_sketch: sketch_b
        point:
          - { figure: sketch_b, kind: circle, target: V, text: 'apex' }
      - say: 'Here is the idea. A frustum is a big pyramid with a small pyramid cut off the top. The small pyramid has the same shape as the big one, so their sizes are in proportion.'
      - say: 'Let''s call the height of the full pyramid $h$.'
        write: 'Full pyramid height $= h$'
        point:
          - { figure: sketch_b, kind: circle, target: 'h = ?', text: 'full height' }
      - say: 'The small pyramid sits on top of the frustum. The frustum is 6 metres deep, so the small pyramid''s height is $h$ minus 6.'
        write: 'Small pyramid height $= h - 6$'
        point:
          - { figure: sketch_b, kind: circle, target: 'h − 6', text: 'small pyramid' }
      - say: 'For similar shapes, the sides are in the same ratio as the heights. The small pyramid''s base is the 2 metre square, and the full pyramid''s base is the 5 metre square.'
        write: '$\dfrac{\text{small side}}{\text{big side}} = \dfrac{\text{small height}}{\text{big height}}$'
      - say: 'Put in the numbers: 2 over 5 equals $h$ minus 6, over $h$.'
        write: '$\dfrac{2}{5} = \dfrac{h - 6}{h}$'
        point:
          - { line: 6, kind: box, text: 'the rule' }
          - { line: 7, kind: move, from: { line: 5, at: '= [[h − 6]]' }, at: '= h[[h − 6]]', text: 'small height' }
      - say: 'Cross-multiply: 2 times $h$ equals 5 times, $h$ minus 6.'
        write: '$2h = 5(h - 6)$'
        point:
          - { line: 8, kind: move, from: { line: 7, at: '[[5]]2' }, at: '= [[5]](', text: 'cross' }
          - { line: 8, kind: move, from: { line: 7, at: '= [[h]]h' }, at: '2[[h]] =', text: 'cross' }
      - say: 'Expand the bracket: 5 times $h$ is $5h$, and 5 times 6 is 30.'
        write: '$2h = 5h - 30$'
      - say: 'Move the $h$ terms together. Add 30 to both sides and take $2h$ from both sides. 30 equals $3h$.'
        write: '$30 = 5h - 2h = 3h$'
        point:
          - { line: 10, kind: move, from: { line: 9, at: '[[2h]] =' }, at: '− 2h', text: 'across' }
          - { line: 10, kind: move, from: { line: 9, at: '[[− 30]]' }, at: '[[30]] =', text: 'across' }
      - say: 'Divide both sides by 3. 30 divided by 3 is 10.'
        write: '$h = \dfrac{30}{3} = 10$'
        point:
          - { line: 11, kind: move, from: { line: 10, at: '= [[3]]h' }, at: 'h = [[3]]30', text: 'divide' }
      - say: 'Let''s check. The small pyramid is then 10 minus 6, which is 4 metres tall, and 4 over 10 is 2 over 5, the same as the sides. It works.'
        write: 'Check: $\ \dfrac{10 - 6}{10} = \dfrac{4}{10} = \dfrac{2}{5} \;\checkmark$'
      - say: 'So the pyramid was 10 metres high, which is answer choice D.'
        write: '$h = 10.0$ m'
        point:
          - { figure: sketch_b, kind: label, target: 'h = ?', text: '10 m' }
        answer: true
    traps:
      A: 'You went for 8.0 metres. That is not in the right ratio: with a full height of 8, the small pyramid is 2 metres tall, and 2 over 8 is not 2 over 5. Set $\dfrac{2}{5} = \dfrac{h - 6}{h}$ and solve.'
      B: 'You went for 8.4 metres. Check it in the ratio: 8.4 minus 6 is 2.4, and 2.4 over 8.4 is not 2 over 5. Solving $2h = 5(h - 6)$ gives 10.'
      C: 'You went for 9.0 metres. Then the small pyramid is 3 metres tall, and 3 over 9 is a third, not 2 over 5. The height that fits the ratio is 10.'

  25:
    moments:
      - say: 'A point $P$ moves in the same direction as the line $UV$, and the line $ST$ is on its path. We know angle $VUS$ is 50 degrees, and we want angle $UST$.'
        write: '$\angle VUS = 50^{\circ},\quad \angle UST = ?$'
        point:
          - { figure: sketch, kind: highlight, target: 'UV', text: 'direction' }
          - { figure: sketch, kind: highlight, target: 'ST', text: 'path of P' }
          - { figure: sketch, kind: arc, target: 'VUS', text: '50°' }
      - say: 'Let me draw the two parallel lines and the line $US$ crossing them.'
        show_sketch: true
      - say: 'First, what is the locus? A point that keeps moving in the same direction as $UV$, on one side of it, traces out a line parallel to $UV$.'
        point:
          - { figure: sketch, kind: circle, target: 'locus of P', text: 'parallel to UV' }
      - say: 'So $ST$ is parallel to $UV$.'
        write: 'So $ST \parallel UV$'
        point:
          - { figure: sketch, kind: highlight, target: ST }
          - { figure: sketch, kind: highlight, target: UV }
      - say: 'The line $US$ joins the two parallel lines, so it crosses both of them. A line like that is called a transversal.'
        write: '$US$ is a transversal'
        point:
          - { figure: sketch, kind: underline, target: US, text: 'transversal' }
      - say: 'Now, angle $VUS$ is at $U$, on the line $UV$, and angle $UST$ is at $S$, on the line $ST$. Both are between the parallels and on the same side of $US$.'
        point:
          - { figure: sketch, kind: arc, target: VUS, text: '50°' }
          - { figure: sketch, kind: arc, target: UST, text: '?' }
      - say: 'Angles like that are called co-interior angles. Co-interior angles between parallel lines add up to 180 degrees.'
        write: 'Co-interior: $\ \angle VUS + \angle UST = 180^{\circ}$'
      - say: 'Put in the 50 degrees we were given.'
        write: '$50^{\circ} + \angle UST = 180^{\circ}$'
        point:
          - { line: 6, kind: box, text: 'the rule' }
          - { line: 7, kind: move, from: { line: 0, at: '∠VUS = [[50∘]]' }, at: '[[50∘]] +', text: 'given' }
      - say: 'Take 50 from both sides.'
        write: '$\angle UST = 180^{\circ} - 50^{\circ}$'
        point:
          - { line: 8, kind: move, from: { line: 7, at: '[[50∘]] +' }, at: '− 50∘', text: 'across' }
      - say: '180 minus 50 is 130.'
        write: '$= 130^{\circ}$'
      - say: 'Check: 130 plus 50 is 180, so the two angles really do make a straight pair across the parallels.'
        write: 'Check: $\ 130^{\circ} + 50^{\circ} = 180^{\circ} \;\checkmark$'
      - say: 'So angle $UST$ is 130 degrees, which is answer choice B.'
        write: '$\angle UST = 130^{\circ}$'
        point:
          - { figure: sketch, kind: label, target: '?', text: '130°' }
        answer: true
    traps:
      A: 'You went for 310 degrees. That is 360 minus 50, the reflex angle, as if the angles went all the way round a point. Here they are co-interior angles between parallels, so they add to 180.'
      C: 'You went for 80 degrees. There is no step that gives 80 here. $ST$ is parallel to $UV$, so the two angles are co-interior and add to 180 degrees.'
      D: 'You went for 50 degrees. That would be right for alternate angles, on opposite sides of $US$. These two are on the same side, so they add to 180, giving 130.'

  26:
    moments:
      - say: 'A ship sails 50 kilometres on a bearing of S 50 degrees E, then 50 kilometres on N 40 degrees E. We want its bearing from where it started.'
        write: 'Leg 1: $50$ km, $S50^{\circ}E$; Leg 2: $50$ km, $N40^{\circ}E$'
        point:
          - { figure: sketch, kind: highlight, target: AB, text: 'leg 1' }
          - { figure: sketch, kind: highlight, target: BC, text: 'leg 2' }
      - say: 'Let me draw the voyage from $A$ to $B$ to $C$.'
        show_sketch: true
      - say: 'S 50 degrees E means: face south, then turn 50 degrees towards east. The plan is to split each leg into an east part and a north or south part, add them up, then turn the total back into a bearing.'
        point:
          - { figure: sketch, kind: circle, target: '50°', text: 'from south' }
      - say: 'SOH CAH TOA: the side opposite an angle is the hypotenuse times the sine of the angle, and the side next to it is the hypotenuse times the cosine.'
        write: 'SOH CAH TOA: $\text{opposite} = \text{hyp} \times \sin\theta,\ \ \text{adjacent} = \text{hyp} \times \cos\theta$'
      - say: 'First leg. The angle is measured from south, so the east part is 50 sin 50 degrees, which is about 38.3 kilometres.'
        write: 'Leg 1 east $= 50\sin 50^{\circ} \approx 38.3$ km'
        point:
          - { figure: sketch, kind: circle, target: '50°', text: 'east: 50 sin 50°' }
      - say: 'And the southward part is 50 cos 50 degrees, which is about 32.1 kilometres. Going south counts as negative north.'
        write: 'Leg 1 north $= -50\cos 50^{\circ} \approx -32.1$ km'
        point:
          - { figure: sketch, kind: circle, target: '50°', text: 'south: 50 cos 50°' }
      - say: 'Second leg, N 40 degrees E, measured from north. The east part is 50 sin 40 degrees, about 32.1 kilometres.'
        write: 'Leg 2 east $= 50\sin 40^{\circ} \approx 32.1$ km'
        point:
          - { figure: sketch, kind: circle, target: '40°', text: 'from north' }
      - say: 'And the north part is 50 cos 40 degrees, about 38.3 kilometres.'
        write: 'Leg 2 north $= 50\cos 40^{\circ} \approx 38.3$ km'
        point:
          - { figure: sketch, kind: circle, target: '40°', text: 'north: 50 cos 40°' }
      - say: 'Now add the east parts from the two legs: 38.3 plus 32.1 is 70.4 kilometres.'
        write: 'Total east $= 38.3 + 32.1 = 70.4$ km'
        point:
          - { line: 8, kind: move, from: { line: 4, at: '≈ [[38.3]]' }, at: '= [[38.3]] +', text: 'leg 1' }
          - { line: 8, kind: move, from: { line: 6, at: '≈ [[32.1]]' }, at: '+ [[32.1]]', text: 'leg 2' }
      - say: 'And add the north parts: negative 32.1 plus 38.3 is 6.2 kilometres. So the ship ends up a long way east and just a little north.'
        write: 'Total north $= -32.1 + 38.3 = 6.2$ km'
        point:
          - { line: 9, kind: move, from: { line: 5, at: '≈ [[−32.1]]' }, at: '= [[−32.1]]', text: 'leg 1' }
          - { line: 9, kind: move, from: { line: 7, at: '≈ [[38.3]]' }, at: '+ [[38.3]]', text: 'leg 2' }
          - { figure: sketch, kind: label, target: 'C', text: '70.4 E, 6.2 N' }
      - say: 'Now let me join $A$ to $C$ on the diagram. The direction of that line is the bearing we want.'
        show_sketch: sketch_b
        point:
          - {figure: sketch_b, kind: circle, target: '?', text: 'bearing of C from A'}
      - say: 'SOH CAH TOA: the tangent of an angle is the opposite side over the adjacent side.'
        write: 'TOA: $\tan\theta = \dfrac{\text{opposite}}{\text{adjacent}}$'
      - say: 'The angle north of due east has tan equal to north over east, 6.2 over 70.4.'
        write: '$\tan\alpha = \dfrac{6.2}{70.4} \approx 0.088$'
        point:
          - { line: 12, kind: move, from: { line: 9, at: '= [[6.2]]' }, at: '70.4[[6.2]]', text: 'north' }
          - { line: 12, kind: move, from: { line: 8, at: '= [[70.4]]' }, at: '= [[70.4]]6.2', text: 'east' }
          - { figure: sketch_b, kind: highlight, target: 'AC', text: 'tan = 6.2/70.4' }
      - say: 'The angle whose tan is 0.088 is about 5 degrees. So the ship is 5 degrees north of due east.'
        write: '$\alpha \approx 5^{\circ}$'
        point:
          - { figure: sketch_b, kind: label, target: 'A', text: '5° north of east' }
      - say: 'Bearings like this are measured from north. Due east is 90 degrees from north, and we are 5 degrees back towards north, so 90 minus 5 is 85 degrees.'
        write: 'From north: $\ 90^{\circ} - 5^{\circ} = 85^{\circ}$'
        point:
          - { figure: sketch_b, kind: circle, target: '?', text: '90° − 5° = 85°' }
      - say: 'So the bearing is N 85 degrees E, which is answer choice D.'
        write: 'Bearing $= N85^{\circ}E$'
        point:
          - { figure: sketch_b, kind: label, target: '?', text: 'N85°E' }
        answer: true
    traps:
      A: 'You went for S 90 degrees E, which is due east. That assumes the south part and the north part cancel. They don''t: the ship goes 32.1 kilometres south and 38.3 north, so it ends up 6.2 kilometres north.'
      B: 'You went for N 40 degrees E. That is only the direction of the second leg. The bearing from the start needs both legs added together.'
      C: 'You went for S 95 degrees E. The total north part is positive, 6.2 kilometres, so the ship is slightly north of east, not south of it. And bearings measured from south stop at 90 degrees.'

  27:
    moments:
      - say: 'An equilateral triangle with sides of root 3 centimetres sits inside a circle, with its corners on the circle. We want the radius.'
        write: 'Side $a = \sqrt{3}$ cm; radius $R = ?$'
        point:
          - { figure: sketch, kind: circle, target: '√3 cm', text: 'a' }
      - say: 'Let me draw the equilateral triangle inside the circle.'
        show_sketch: true
      - say: 'Let me join the centre $O$ to two corners of the triangle, $B$ and $C$.'
        show_sketch: sketch_b
        point:
          - { figure: sketch_b, kind: circle, target: O, text: 'centre' }
      - say: 'Here is the idea. Both lines from the centre are radii, so we get a triangle with two sides equal to $R$ and the third side equal to $a$.'
        point:
          - { figure: sketch_b, kind: highlight, target: OB, text: 'R' }
          - { figure: sketch_b, kind: highlight, target: OC, text: 'R' }
      - say: 'The three corners share the full turn at the centre equally, so the angle between those two radii is 360 over 3, which is 120 degrees.'
        write: 'Angle at centre $= \dfrac{360^{\circ}}{3} = 120^{\circ}$'
        point:
          - { figure: sketch_b, kind: arc, target: BOC, text: '120°' }
      - say: 'The cosine rule: $a$ squared equals $b$ squared plus $c$ squared, minus $2bc$ cos $A$, where $A$ is the angle opposite the side $a$.'
        write: 'Cosine rule: $a^{2} = b^{2} + c^{2} - 2bc\cos A$'
      - say: 'Here the side opposite the 120 degree angle is the triangle''s side $a$, and the other two sides are both radii, $R$.'
        write: 'Here: $b = c = R$, $\ A = 120^{\circ}$'
      - say: 'Now use the cosine rule on that triangle. $a$ squared equals $R$ squared plus $R$ squared, minus 2 times $R$ times $R$ times cos 120 degrees.'
        write: '$a^{2} = R^{2} + R^{2} - 2 \cdot R \cdot R\cos 120^{\circ}$'
        point:
          - { line: 7, kind: move, from: { line: 4, at: '= [[120∘]]' }, at: 'cos[[120∘]]', text: 'angle at O' }
          - { figure: sketch_b, kind: highlight, target: 'BC', text: 'a' }
      - say: 'Cos 120 degrees is negative a half.'
        write: '$\cos 120^{\circ} = -\dfrac{1}{2}$'
      - say: 'So the last term is minus 2 $R$ squared times negative a half, which is plus $R$ squared.'
        write: '$a^{2} = 2R^{2} - 2R^{2}\left(-\dfrac{1}{2}\right) = 2R^{2} + R^{2}$'
        point:
          - { line: 9, kind: move, from: { line: 8, at: '= [[−21]]' }, at: '([[−21]])', text: 'cos 120°' }
      - say: '2 $R$ squared plus $R$ squared is 3 $R$ squared.'
        write: '$a^{2} = 3R^{2}$'
      - say: 'Now put in our side, root 3.'
        write: '$(\sqrt{3})^{2} = 3R^{2}$'
        point:
          - { line: 11, kind: move, from: { line: 0, at: 'a = [[3]]' }, at: '([[3]])', text: 'side' }
          - { figure: sketch_b, kind: circle, target: '√3 cm', text: 'our side' }
      - say: 'Root 3 squared is 3, so 3 equals 3 $R$ squared.'
        write: '$3 = 3R^{2}$'
      - say: 'Divide both sides by 3. $R$ squared is 1.'
        write: '$R^{2} = 1$'
      - say: 'A radius is positive, so $R$ is the square root of 1, which is 1.'
        write: '$R = \sqrt{1} = 1$'
        point:
          - { figure: sketch_b, kind: highlight, target: 'OB', text: 'R = 1' }
      - say: 'So the radius of the circle is 1 centimetre, which is answer choice C.'
        write: '$R = 1$ cm'
        point:
          - { figure: sketch_b, kind: label, target: 'R = ?', text: '1 cm' }
        answer: true
    traps:
      A: 'You went for 2 over 3 centimetres. The two thirds belongs to a different fact: the centre is two thirds of the way down the triangle''s height. The height here is 3 over 2, and two thirds of that is 1.'
      B: 'You went for 2 centimetres. That is the diameter, not the radius. Using the cosine rule, $a^{2} = 3R^{2}$, so 3 equals 3 $R$ squared and $R$ is 1.'
      D: 'You went for 3 centimetres. That is the side squared. From $a^{2} = 3R^{2}$, we get 3 equals 3 $R$ squared, so $R$ squared is 1 and $R$ is 1.'

  28:
    moments:
      - say: 'We have two lines, 3 $y$ equals 4 $x$ minus 1, and $K y$ equals $x$ plus 3. They are perpendicular, and we want $K$.'
        write: '$3y = 4x - 1,\qquad Ky = x + 3$'
      - say: 'Here is the fact we need. Two lines are perpendicular when their gradients multiply to give negative 1. So first we find both gradients, by writing each line as $y$ equals $m x$ plus $c$.'
        write: 'Perpendicular: $\ m_{1} \times m_{2} = -1$'
      - say: 'First line: divide 3 $y$ equals 4 $x$ minus 1 all through by 3.'
        write: '$y = \dfrac{4}{3}x - \dfrac{1}{3}$'
      - say: 'The gradient is the number in front of $x$, so the first gradient is 4 over 3. Picture the first line as a hill: up 4 for every 3 along.'
        write: '$m_{1} = \dfrac{4}{3}$'
        point:
          - { line: 3, kind: move, from: { line: 2, at: '= [[34]]x' }, at: '= [[34]]', text: 'gradient' }
        doodle: {name: 'custom:2000_q28_a', id: hill, caption: 'Up 4 for every 3 along'}
      - say: 'Second line: divide $K y$ equals $x$ plus 3 all through by $K$.'
        write: '$y = \dfrac{1}{K}x + \dfrac{3}{K}$'
      - say: 'So the second gradient is 1 over $K$.'
        write: '$m_{2} = \dfrac{1}{K}$'
        point:
          - { line: 5, kind: move, from: { line: 4, at: '= [[K1]]x' }, at: '= [[K1]]', text: 'gradient' }
      - say: 'Now use the perpendicular condition: the first hill''s 4 over 3, times 1 over $K$, equals negative 1.'
        write: '$\dfrac{4}{3} \times \dfrac{1}{K} = -1$'
        point:
          - { line: 1, kind: box, text: 'the rule' }
          - { line: 6, kind: move, from: { line: 3, at: '= [[34]]' }, at: '[[34]] ×', text: 'm1' }
          - { line: 6, kind: move, from: { line: 5, at: '= [[K1]]' }, at: '× [[K1]]', text: 'm2' }
        doodle_do:
          - {id: hill, op: pulse, part: hill1}
      - say: 'Multiplying the fractions gives 4 over 3 $K$.'
        write: '$\dfrac{4}{3K} = -1$'
      - say: 'Multiply both sides by 3 $K$: 4 equals negative 3 $K$.'
        write: '$4 = -3K$'
        point:
          - { line: 8, kind: move, from: { line: 7, at: '[[3K]]4' }, at: '−[[3K]]', text: 'times both sides' }
      - say: 'Divide both sides by negative 3.'
        write: '$K = -\dfrac{4}{3}$'
        point:
          - { line: 9, kind: move, from: { line: 8, at: '[[−3]]K' }, at: 'K = [[−3]]4', text: 'divide' }
      - say: 'Let''s check. With $K$ equal to negative 4 over 3, the second gradient is 1 over $K$, which is negative 3 over 4. That is the hill turned through a right angle: down 3 for every 4 along. And 4 over 3 times negative 3 over 4 is negative 1.'
        write: 'Check: $\ \dfrac{4}{3} \times \left(-\dfrac{3}{4}\right) = -1 \;\checkmark$'
        doodle_do:
          - {id: hill, op: stage, stage: 'custom:2000_q28_a2'}
      - say: 'So $K$ is negative 4 over 3, which is answer choice A.'
        write: '$K = -\dfrac{4}{3}$'
        answer: true
    traps:
      B: 'You went for negative 3 over 4. That is the gradient the second line needs, 1 over $K$, not $K$ itself. If 1 over $K$ is negative 3 over 4, then $K$ is negative 4 over 3.'
      C: 'You went for 3 over 4. That makes the second gradient 4 over 3, the same as the first, so the lines would be parallel, not perpendicular.'
      D: 'You went for 4 over 3. The size is right, but the minus sign is lost. The gradients must multiply to negative 1, which gives 4 equals negative 3 $K$.'

  29:
    moments:
      - say: 'In the diagram, $P$, $Q$, $R$ and $S$ lie on a circle. Angle $RPS$ is 50 degrees, angle $RPQ$ is 30 degrees, and $PQ$ equals $QR$. We want angle $PRS$.'
        write: '$\angle RPS = 50^{\circ},\ \angle RPQ = 30^{\circ},\ PQ = QR$'
        point:
          - { figure: 0, kind: circle, target: '50°', text: 'RPS' }
          - { figure: 0, kind: circle, target: '30°', text: 'RPQ' }
          - { figure: 0, kind: circle, target: '?', text: 'PRS' }
      - say: 'The plan: use the equal sides in triangle $PQR$, then the circle to reach triangle $PSR$, where our angle is.'
      - say: '$PQ$ equals $QR$, so triangle $PQR$ is isosceles. The angles opposite the equal sides are equal, so angle $QRP$ equals angle $QPR$, which is 30 degrees.'
        write: 'Isosceles: $\ \angle QRP = \angle QPR = 30^{\circ}$'
        point:
          - { figure: 0, kind: highlight, target: PQ }
          - { figure: 0, kind: highlight, target: QR }
          - { figure: 0, kind: arc, target: QRP, text: '30°' }
      - say: 'The angles in any triangle add up to 180 degrees.'
        write: 'Angle sum of a triangle: $\text{sum of the three angles} = 180^{\circ}$'
      - say: 'Angles in a triangle add to 180 degrees, so angle $PQR$ is 180 minus 30 minus 30.'
        write: '$\angle PQR = 180^{\circ} - 30^{\circ} - 30^{\circ}$'
        point:
          - { figure: 0, kind: arc, target: 'PQR', text: '180 − 30 − 30' }
      - say: '180 minus 60 is 120.'
        write: '$= 120^{\circ}$'
        point:
          - { figure: 0, kind: arc, target: PQR, text: '120°' }
      - say: 'Now the circle. All four points are on it, so $PQRS$ is a cyclic quadrilateral, and opposite angles of a cyclic quadrilateral add to 180 degrees.'
        write: 'Cyclic: $\ \angle PQR + \angle PSR = 180^{\circ}$'
      - say: 'The angle at $Q$ is the 120 degrees we just found, so the angle at $S$ is 180 minus 120.'
        write: '$\angle PSR = 180^{\circ} - 120^{\circ} = 60^{\circ}$'
        point:
          - { line: 6, kind: box, text: 'the rule' }
          - { line: 7, kind: move, from: { line: 5, at: '= [[120∘]]' }, at: '− 120∘', text: 'angle Q' }
          - { figure: 0, kind: arc, target: PSR, text: '60°' }
      - say: 'Now look at triangle $PSR$. Its angle at $P$ is the 50 degrees given, and its angle at $S$ is the 60 degrees we just found.'
        write: 'In $\triangle PSR$: $\ \angle P = 50^{\circ},\ \angle S = 60^{\circ}$'
        point:
          - { line: 0, kind: highlight, at: '∠RPS = 50∘', text: 'given' }
          - { figure: 0, kind: circle, target: '50°' }
      - say: 'The angles add to 180, so angle $PRS$ is 180 minus 50 minus 60.'
        write: '$\angle PRS = 180^{\circ} - 50^{\circ} - 60^{\circ}$'
        point:
          - { line: 9, kind: move, from: { line: 8, at: '∠P = [[50∘]]' }, at: '− [[50∘]] −', text: 'at P' }
          - { line: 9, kind: move, from: { line: 8, at: '∠S = [[60∘]]' }, at: '− 60∘', text: 'at S' }
          - { figure: 0, kind: circle, target: '?', text: 'angle PRS' }
      - say: '180 minus 110 is 70.'
        write: '$= 70^{\circ}$'
      - say: 'Check the triangle: 50 plus 60 plus 70 is 180.'
        write: 'Check: $\ 50^{\circ} + 60^{\circ} + 70^{\circ} = 180^{\circ} \;\checkmark$'
      - say: 'So angle $PRS$ is 70 degrees, which is answer choice B.'
        write: '$\angle PRS = 70^{\circ}$'
        point:
          - { figure: 0, kind: arc, target: PRS, text: '70°' }
        answer: true
    traps:
      A: 'You went for 80 degrees. That is 50 plus 30, the two angles at $P$ added together. They belong to different triangles. Find angle $PSR$ from the cyclic quadrilateral, then use triangle $PSR$.'
      C: 'You went for 60 degrees. That is angle $PSR$, the angle at $S$. We want the angle at $R$ in the same triangle, which is 180 minus 50 minus 60, so 70.'
      D: 'You went for 50 degrees. That is angle $RPS$, which was given. The angle at $R$ is 180 minus 50 minus 60, which is 70.'

  30:
    moments:
      - say: 'In the diagram, $FH$ is a diameter, and the chord $GE$ meets it at right angles at $N$. $NH$ is 8 centimetres and $GE$ is 24 centimetres. We want the diameter $FH$.'
        write: '$NH = 8$ cm, $\ GE = 24$ cm, $\ FH = ?$'
        point:
          - { figure: 0, kind: highlight, target: 'FH', text: 'diameter' }
          - { figure: 0, kind: highlight, target: 'GE', text: 'chord' }
          - { figure: 0, kind: circle, target: 'N', text: 'right angle' }
      - say: 'First, a fact about circles. A diameter that meets a chord at right angles cuts the chord exactly in half. So $N$ is the midpoint of $GE$.'
        write: '$GN = NE = \dfrac{24}{2}$'
        point:
          - { figure: 0, kind: circle, target: 'N', text: 'midpoint of GE' }
      - say: 'Half of 24 is 12, so each piece of the chord is 12 centimetres.'
        write: '$GN = NE = 12$ cm'
        point:
          - { figure: 0, kind: underline, target: GN, text: '12' }
          - { figure: 0, kind: underline, target: NE, text: '12' }
      - say: 'Now the rule for two chords crossing inside a circle: the two pieces of one chord multiply to the same as the two pieces of the other. Here the chords are $GE$ and $FH$, crossing at $N$.'
        write: 'Crossing chords: $\ GN \times NE = FN \times NH$'
        point:
          - { figure: 0, kind: highlight, target: FN }
          - { figure: 0, kind: highlight, target: NH }
      - say: 'Put in what we know: 12 times 12 on the left, and $FN$ times 8 on the right.'
        write: '$12 \times 12 = FN \times 8$'
        point:
          - { line: 3, kind: box, text: 'the rule' }
          - { line: 4, kind: move, from: { line: 2, at: '= [[12]] cm' }, at: '[[12]] × 12', text: 'GN, NE' }
          - { line: 4, kind: move, from: { line: 0, at: 'NH = [[8]]' }, at: '× [[8]]', text: 'NH' }
      - say: '12 times 12 is 144.'
        write: '$144 = 8 \times FN$'
      - say: 'Divide both sides by 8. 144 divided by 8 is 18.'
        write: '$FN = \dfrac{144}{8} = 18$ cm'
        point:
          - { line: 6, kind: move, from: { line: 5, at: '[[8]] ×' }, at: 'FN = [[8]]', text: 'divide' }
      - say: 'But $FN$ is only part of the diameter. The whole of $FH$ is $FN$ plus $NH$, the pieces either side of $N$.'
        write: '$FH = FN + NH$'
        point:
          - { figure: 0, kind: highlight, target: 'FN', text: '18' }
          - { figure: 0, kind: highlight, target: 'NH', text: '8' }
      - say: 'That is 18 plus 8, which is 26.'
        write: '$= 18 + 8 = 26$ cm'
        point:
          - { line: 8, kind: move, from: { line: 6, at: '= [[18]]' }, at: '= [[18]] +', text: 'FN' }
          - { line: 8, kind: move, from: { line: 0, at: 'NH = [[8]]' }, at: '+ [[8]] =', text: 'NH' }
      - say: 'Let''s check with the radius. The radius is half of 26, which is 13. The centre $O$ is 13 from $H$, so $ON$ is 13 minus 8, which is 5.'
        write: 'Check: $\ r = 13,\ ON = 13 - 8 = 5$'
        point:
          - { figure: 0, kind: circle, target: 'O', text: 'centre' }
          - { figure: 0, kind: highlight, target: 'OH', text: '13' }
          - { figure: 0, kind: highlight, target: 'ON', text: '5' }
      - say: 'Pythagoras says the hypotenuse squared equals the opposite squared plus the adjacent squared.'
        write: 'Pythagoras: $\text{hypotenuse}^{2} = \text{opposite}^{2} + \text{adjacent}^{2}$'
      - say: 'Triangle $ONG$ has a right angle at $N$, so 5 squared plus 12 squared should be 13 squared. 25 plus 144 is 169, which is 13 squared. It works.'
        write: '$5^{2} + 12^{2} = 25 + 144 = 169 = 13^{2} \;\checkmark$'
        point:
          - { figure: 0, kind: arc, target: 'ONG', text: '90°' }
          - { figure: 0, kind: highlight, target: 'OG', text: '13' }
      - say: 'So the diameter $FH$ is 26 centimetres, which is answer choice C.'
        write: '$FH = 26$ cm'
        point:
          - { figure: 0, kind: label, target: 'FH = ?', text: '26 cm' }
        answer: true
    traps:
      A: 'You went for 16 centimetres. That is just 2 times $NH$. $N$ is not the centre, so use the crossing chords: 12 times 12 equals $FN$ times 8, so $FN$ is 18, and $FH$ is 18 plus 8.'
      B: 'You went for 20 centimetres. That is 12 plus 8, half the chord plus $NH$. The piece $FN$ comes from 12 times 12 equals $FN$ times 8, which gives 18, and then $FH$ is 26.'
      D: 'You went for 32 centimetres. That is 24 plus 8, the whole chord added to $NH$. Halve the chord first, find $FN$ from 144 equals 8 times $FN$, then add $NH$.'

  31:
    moments:
      - say: '$P$ and $Q$ are two fixed points. A point $X$ moves so that $XP$ always equals $XQ$. We want the locus of $X$, which means the whole path it can trace.'
        write: '$XP = XQ$'
        point:
          - { figure: sketch, kind: highlight, target: XP }
          - { figure: sketch, kind: highlight, target: XQ }
      - say: 'Let me draw $P$ and $Q$, and a point $X$ the same distance from both.'
        show_sketch: true
      - say: 'In words, $X$ must always be exactly as far from $P$ as it is from $Q$. So let''s hunt for points like that.'
        write: 'Condition: $X$ is equally far from $P$ and $Q$'
      - say: 'The obvious one is the midpoint of $PQ$. Let''s call it $M$. It sits exactly halfway, so it is the same distance from both ends.'
        write: 'Midpoint $M$ of $PQ$: $MP = MQ$'
      - say: 'Now draw a line through $M$ at right angles to $PQ$. Pick any point $X$ on that line, and join it to $P$ and to $Q$.'
        write: 'Line through $M$, at $90^{\circ}$ to $PQ$'
        point:
          - { figure: sketch, kind: circle, target: { x: 160, y: 170 }, text: 'M' }
          - { figure: sketch, kind: circle, target: 'locus of X', text: 'at 90° to PQ' }
          - { figure: sketch, kind: circle, target: 'X' }
      - say: 'Look at the two triangles $XMP$ and $XMQ$. $MP$ equals $MQ$, they share the side $XM$, and both have a right angle at $M$.'
        write: '$MP = MQ,\ \ XM \text{ common},\ \ \angle XMP = \angle XMQ = 90^{\circ}$'
        point:
          - { figure: sketch, kind: highlight, target: { x: 110, y: 170 }, text: 'MP' }
          - { figure: sketch, kind: highlight, target: { x: 210, y: 170 }, text: 'MQ' }
          - { figure: sketch, kind: highlight, target: { x: 160, y: 115 }, text: 'XM shared' }
      - say: 'So the two triangles are congruent, and their third sides match. That means $XP$ equals $XQ$ for every point on this line.'
        write: 'So $\triangle XMP \equiv \triangle XMQ$, giving $XP = XQ$'
        point:
          - { figure: sketch, kind: highlight, target: 'XP', text: 'equal' }
          - { figure: sketch, kind: highlight, target: 'XQ', text: 'equal' }
      - say: 'And a point off that line is nearer to one end than the other, so it does not qualify. The locus is exactly this line and nothing else.'
        write: 'Off the line: $XP \neq XQ$'
        point:
          - { figure: sketch, kind: circle, target: 'locus of X', text: 'only this line' }
      - say: 'This line has a name. It bisects $PQ$, meaning it cuts it into two equal parts, and it is perpendicular to $PQ$, meaning it meets it at a right angle.'
        write: 'It bisects $PQ$ and is $\perp PQ$'
        point:
