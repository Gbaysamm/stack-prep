          - { line: 4, kind: move, from: { line: 2, at: 'r = [[−21]]' }, at: '(−21)', text: 'r' }
      - say: 'Subtracting a negative means adding. 1 plus a half is 3 over 2.'
        write: '$= \dfrac{\tfrac{1}{2}}{\tfrac{3}{2}}$'
      - say: 'Dividing by 3 over 2 means multiplying by its flip, 2 over 3.'
        write: '$= \dfrac{1}{2} \times \dfrac{2}{3}$'
      - say: '1 times 2 is 2, and 2 times 3 is 6. 2 over 6 is a third.'
        write: '$= \dfrac{2}{6} = \dfrac{1}{3}$'
      - say: 'So the bracket adds up to a third. Now the power negative 1. A power of negative 1 means take the reciprocal, that is, flip the fraction.'
        write: 'So the expression $= \left(\dfrac{1}{3}\right)^{-1}$'
        point:
