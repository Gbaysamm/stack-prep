  13:
    moments:
      - say: 'In the graph, triangle $SPT$ is enclosed by the lines $2y - x - 2 = 0$ and $y + 2x + 2 = 0$, and the $x$-axis. We want the inequalities that describe it.'
        write: '$2y - x - 2 = 0,\quad y + 2x + 2 = 0$'
      - say: 'A region bounded by straight lines is described by one inequality for each boundary line. For each line, we decide which side the triangle is on. First, let''s find the corners.'
        write: 'Corners $S$ and $T$ are on the $x$-axis, where $y = 0$'
      - say: 'Put $y = 0$ into the first line: 2 times 0, minus $x$, minus 2, equals 0.'
        write: '$S:\ 2(0) - x - 2 = 0$'
      - say: 'That is negative $x$ minus 2 equals 0, so $x$ is negative 2. That''s the point $S$.'
        write: '$-x = 2 \Rightarrow x = -2$'
      - say: 'Now put $y = 0$ into the second line: 0 plus $2x$ plus 2 equals 0.'
        write: '$T:\ 0 + 2x + 2 = 0$'
      - say: 'So $2x$ is negative 2, and $x$ is negative 1. That''s $T$.'
        write: '$2x = -2 \Rightarrow x = -1$'
      - say: 'Now $P$, where the two lines meet. The second line gives $y$ equals negative $2x$ minus 2. The first line can be written $2y = x + 2$. Put that $y$ into it.'
        write: '$P:\ 2(-2x - 2) = x + 2$'
      - say: 'Expand the bracket: negative $4x$ minus 4 equals $x$ plus 2.'
        write: '$-4x - 4 = x + 2$'
      - say: 'Take $x$ from both sides and add 4: negative $5x$ equals 6. Divide by negative 5, and $x$ is negative 1.2.'
        write: '$-5x = 6 \Rightarrow x = -1.2$'
      - say: 'Now go back to $y = -2x - 2$. Negative 2 times negative 1.2 is 2.4, and 2.4 minus 2 is 0.4.'
        write: '$y = -2(-1.2) - 2 = 2.4 - 2 = 0.4$'
      - say: 'So $P$ is at height 0.4, above the $x$-axis. The triangle sits on the upper side of the axis, so $y$ is at least 0.'
        write: 'So $y \ge 0$'
        point:
          - { line: 9, kind: circle, at: '= 0.4', text: 'above' }
      - say: 'Now pick a point inside the triangle, like negative 1.4, 0.1, and test it in the first line''s expression.'
        write: 'Test $(-1.4,\ 0.1)$: $2(0.1) - (-1.4) - 2 = 0.2 + 1.4 - 2 = -0.4$'
      - say: 'That is negative, so every point of the triangle makes $2y - x - 2$ less than or equal to 0.'
        write: 'So $2y - x - 2 \le 0$'
