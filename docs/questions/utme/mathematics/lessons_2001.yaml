  14:
    moments:
      - say: 'In an arithmetic progression, the sixth term is half of the twelfth term. We want to know what the first term equals.'
        write: 'Given: $T_{6} = \tfrac{1}{2}T_{12}$'
      - say: 'In an AP, each term is the one before plus the common difference. So the $n$th term is the first term $a$, plus $n - 1$ lots of the common difference $d$.'
        write: '$T_{n} = a + (n - 1)d$'
      - say: 'For the sixth term, $n$ is 6, and 6 minus 1 is 5.'
        write: '$T_{6} = a + (6 - 1)d = a + 5d$'
        point:
          - { line: 1, kind: box, text: 'the rule' }
      - say: 'For the twelfth term, $n$ is 12, and 12 minus 1 is 11.'
        write: '$T_{12} = a + (12 - 1)d = a + 11d$'
      - say: 'Now go back to the condition: the sixth term is half of the twelfth. Put in the two expressions we just found.'
        write: '$a + 5d = \tfrac{1}{2}(a + 11d)$'
        point:
          - { line: 2, kind: circle, at: '= a + 5d' }
          - { line: 3, kind: circle, at: '= a + 11d' }
      - say: 'Let''s clear the fraction by multiplying both sides by 2. 2 times $a + 5d$ is $2a + 10d$, and 2 times a half of the bracket is just the bracket.'
        write: '$2a + 10d = a + 11d$'
      - say: 'Now collect the $a$ terms on the left. Subtract $a$ from both sides: $2a$ minus $a$ is $a$.'
        write: '$a + 10d = 11d$'
      - say: 'Then subtract $10d$ from both sides. $11d$ minus $10d$ is $d$.'
        write: '$a = 11d - 10d = d$'
      - say: 'Let''s check with numbers. Say $a$ and $d$ are both 1. The sixth term is 1 plus 5, which is 6, and the twelfth is 1 plus 11, which is 12. 6 is half of 12.'
        write: 'Check $a = d = 1$: $T_{6} = 6,\ T_{12} = 12$'
      - say: 'So the first term is equal to the common difference, which is answer choice C.'
        write: 'First term $=$ common difference'
        answer: true
    traps:
      A: 'You went for half of the common difference. The half belongs to the twelfth term only. Clearing it gives $2a + 10d = a + 11d$, and that leaves $a = d$ exactly.'
      B: 'You went for double the common difference. The equation $2a + 10d = a + 11d$ gives $a = d$. Take care when collecting the $a$ terms: $2a$ minus $a$ is just $a$.'
      D: 'You went for zero. If $a$ were zero, the sixth term would be $5d$ and the twelfth $11d$, and $5d$ is not half of $11d$. The equation gives $a = d$.'

  15:
    moments:
      - say: 'A man saves ₦100 in his first year, and each year he saves ₦20 more than the year before. We want how many years it takes for his savings to add up to ₦5,800.'
        write: 'Year 1: ₦100, year 2: ₦120, year 3: ₦140, ...'
      - say: 'Adding the same amount each time makes an arithmetic progression. The first term $a$ is 100, and the common difference $d$ is 20.'
        write: 'AP with $a = 100,\quad d = 20$'
      - say: 'The question is about the total saved, not one year''s saving. So we need the sum of the first $n$ terms.'
        write: '$S_{n} = \dfrac{n}{2}\left[2a + (n - 1)d\right]$'
      - say: 'Put in $a$ as 100 and $d$ as 20.'
        write: '$S_{n} = \dfrac{n}{2}\left[2(100) + (n - 1)(20)\right]$'
        point:
          - { line: 2, kind: box, text: 'the rule' }
          - { line: 1, kind: circle, at: 'a = 100, d = 20' }
      - say: '2 times 100 is 200, and 20 times $n - 1$ is $20n$ minus 20.'
        write: '$= \dfrac{n}{2}\left[200 + 20n - 20\right]$'
      - say: '200 minus 20 is 180.'
        write: '$= \dfrac{n}{2}(180 + 20n)$'
      - say: 'Now halve each term in the bracket. Half of 180 is 90, and half of $20n$ is $10n$.'
        write: '$= n(90 + 10n)$'
      - say: 'The total must be 5800. So set the sum we just found equal to 5800.'
        write: '$n(90 + 10n) = 5800$'
        point:
          - { line: 6, kind: arrow, text: 'the sum' }
      - say: 'Multiply out the bracket: $n$ times 90 is $90n$, and $n$ times $10n$ is $10n$ squared.'
        write: '$10n^{2} + 90n = 5800$'
      - say: 'Bring 5800 to the left, so the right side is 0.'
        write: '$10n^{2} + 90n - 5800 = 0$'
      - say: 'Every term divides by 10, which makes the numbers smaller.'
        write: '$n^{2} + 9n - 580 = 0$'
      - say: 'We need two numbers that multiply to negative 580 and add to 9. 29 and negative 20 work: 29 times negative 20 is negative 580, and 29 minus 20 is 9.'
        write: '$29 \times (-20) = -580,\quad 29 + (-20) = 9$'
      - say: 'So the quadratic factorises as $n$ plus 29, times $n$ minus 20, equals 0.'
        write: '$(n + 29)(n - 20) = 0$'
      - say: 'So $n$ is negative 29 or 20. A number of years can''t be negative, so $n$ is 20.'
        write: '$n = -29 \text{ or } n = 20$, so $n = 20$'
        point:
          - { line: 13, kind: strike, at: 'n = −29', text: 'not negative' }
      - say: 'Check: in year 20 he saves 100 plus 19 times 20, which is ₦480. The average year is 100 plus 480, over 2, which is 290, and 20 years of that is 5800.'
        write: 'Check: $\dfrac{100 + 480}{2} \times 20 = 290 \times 20 = 5800$'
      - say: 'So he takes 20 years, which is answer choice A.'
        write: 'Answer: $n = 20$ years'
        answer: true
    traps:
      B: 'You went for 29 years. 29 comes from the factor $n + 29$, but that factor gives $n$ as negative 29, which can''t be a number of years. The other root, 20, is the answer.'
      C: 'You went for 58 years. That''s 5800 divided by 100, as if he saved ₦100 every year. His savings grow by ₦20 each year, so it takes fewer years.'
      D: 'You went for 100 years. That''s just the first year''s saving. Use the sum of the progression, set it equal to 5800, and solve for $n$.'

  16:
    moments:
      - say: 'The operation star is defined by $a * b = a + b + 1$, and the identity element is negative 1. We want the inverse of 2.'
        write: '$a * b = a + b + 1,\quad e = -1$'
      - say: 'First, what is an identity? It is the element that leaves everything unchanged. Let''s check that negative 1 does: $a$ star negative 1 is $a$ plus negative 1 plus 1.'
        write: 'Check: $a * (-1) = a + (-1) + 1 = a$'
      - say: 'Good, it gives back $a$. Now, what is an inverse? The inverse of 2 is the element that combines with 2 to give the identity, negative 1. Let''s call it $x$.'
        write: 'Inverse $x$: $2 * x = -1$'
        point:
          - { line: 0, kind: underline, at: 'e = −1', text: 'identity' }
      - say: 'Now use the rule for star. 2 star $x$ means 2 plus $x$ plus 1.'
        write: '$2 + x + 1 = -1$'
        point:
          - { line: 0, kind: box, at: 'a + b + 1', text: 'the rule' }
      - say: '2 plus 1 is 3, so $x$ plus 3 equals negative 1.'
        write: '$x + 3 = -1$'
      - say: 'Subtract 3 from both sides. Negative 1 minus 3 is negative 4.'
        write: '$x = -1 - 3 = -4$'
      - say: 'Let''s check: 2 star negative 4 is 2 plus negative 4 plus 1.'
        write: 'Check: $2 * (-4) = 2 + (-4) + 1$'
      - say: '2 minus 4 is negative 2, and negative 2 plus 1 is negative 1. That''s the identity, so it works.'
        write: '$= -1$'
      - say: 'It works the other way round too: negative 4 star 2 is negative 4 plus 2 plus 1, which is also negative 1.'
        write: '$(-4) * 2 = -4 + 2 + 1 = -1$'
      - say: 'So the inverse of 2 is negative 4, which is answer choice A.'
        write: 'Inverse of $2 = -4$'
        answer: true
    traps:
      B: 'You went for negative 2. That''s the inverse under ordinary addition. Here, 2 star negative 2 is 2 minus 2 plus 1, which is 1, not the identity negative 1.'
      C: 'You went for 0. 2 star 0 is 2 plus 0 plus 1, which is 3, not negative 1. The inverse must give the identity, negative 1.'
      D: 'You went for 4. 2 star 4 is 2 plus 4 plus 1, which is 7. Set $2 + x + 1$ equal to negative 1 and solve.'

  17:
    moments:
      - say: 'We have a table for an operation on $k$, $l$ and $m$. We want the identity element.'
        write: '$\begin{array}{c|ccc} \otimes & k & l & m \\ \hline k & l & m & k \\ l & m & k & l \\ m & k & l & m \end{array}$'
      - say: 'The identity is the element that leaves every other element unchanged. So combining the identity with $k$, $l$ and $m$ must give back $k$, $l$ and $m$.'
        write: 'Identity $e$: $e \otimes k = k,\ e \otimes l = l,\ e \otimes m = m$'
      - say: 'So in the table, we look for the row that simply copies the column headings: $k$, $l$, $m$.'
        write: 'Column headings: $k,\ l,\ m$'
      - say: 'Row $k$ reads $l$, $m$, $k$. For example, $k$ with $k$ gives $l$, so $k$ changed something. $k$ is not the identity.'
        write: 'Row $k$: $l,\ m,\ k$ (not the headings)'
      - say: 'Row $l$ reads $m$, $k$, $l$. $l$ with $k$ gives $m$, again a change. Not the headings either.'
        write: 'Row $l$: $m,\ k,\ l$ (not the headings)'
      - say: 'Row $m$ reads $k$, $l$, $m$. That is exactly the headings!'
        write: 'Row $m$: $k,\ l,\ m$ (same as the headings)'
        point:
          - { line: 2, kind: arrow, text: 'matches' }
      - say: 'So $m$ with $k$ gives $k$, $m$ with $l$ gives $l$, and $m$ with $m$ gives $m$. Nothing changes.'
        write: '$m \otimes k = k,\ m \otimes l = l,\ m \otimes m = m$'
      - say: 'An identity has to work from both sides, so let''s check down the $m$ column too. Going down, it reads $k$, $l$, $m$, the same as the row labels.'
        write: 'Column $m$: $k \otimes m = k,\ l \otimes m = l,\ m \otimes m = m$'
      - say: 'It works both ways. So the identity element is $m$, which is answer choice C.'
        write: 'Identity $e = m$'
        answer: true
    traps:
      A: 'You went for $k$. Row $k$ reads $l$, $m$, $k$, so $k$ changes the other elements. The identity''s row must copy the headings.'
      B: 'You went for $l$. Row $l$ reads $m$, $k$, $l$, which is not the headings. Only row $m$ reads $k$, $l$, $m$.'
      D: 'You went for $o$. That letter isn''t in the table at all. The identity has to be one of the elements $k$, $l$ or $m$.'

  18:
    moments:
      - say: 'We have the matrix $k$ with rows 2, 1 and 3, 4. We want $k$ squared plus $k$ plus $I$.'
        write: '$k = \begin{pmatrix} 2 & 1 \\ 3 & 4 \end{pmatrix}$'
      - say: 'We''ll build it in three pieces: first $k$ squared, then add $k$, then add $I$. $k$ squared means $k$ times $k$.'
        write: '$k^{2} = \begin{pmatrix} 2 & 1 \\ 3 & 4 \end{pmatrix}\begin{pmatrix} 2 & 1 \\ 3 & 4 \end{pmatrix}$'
      - say: 'To multiply matrices, go along a row of the first and down a column of the second, multiplying and adding. Top-left uses row 1 and column 1: 2 times 2, plus 1 times 3.'
        write: 'Top-left $= (2)(2) + (1)(3) = 4 + 3 = 7$'
      - say: 'Top-right uses row 1 and column 2: 2 times 1, plus 1 times 4.'
        write: 'Top-right $= (2)(1) + (1)(4) = 2 + 4 = 6$'
