  23:
    moments:
      - section: 'The question'
        say: 'A tank is a cylinder standing up, and its depth is the height of the cylinder. We know the volume and the width, so the cylinder formula gives the depth.'
        write: 'Find the depth of the tank.'
      - say: 'Write Solution, then sketch the tank, with the diameter 14 m across the base and the capacity 3080 cubic metres.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: underline, target: '14 m', text: 'diameter', 'on': 'diameter 14'}
          - {figure: sketch, kind: circle, target: '3080 m³', text: 'volume', 'on': 'capacity'}
      - section: 'What we know'
        say: 'List the givens: the volume V is 3080 cubic metres, the diameter d is 14 m, and pi is 22 over 7.'
        write: '$V = 3080\ \text{m}^{3}$, $d = 14$ m, $\pi = \dfrac{22}{7}$'
      - say: 'The formula needs the radius, not the diameter. The radius is half the diameter: 14 over 2 is 7.'
        write: '$r = \dfrac{14}{2} = 7$ m'
        point:
          - {figure: sketch, kind: circle, target: '7 m', text: 'radius', 'on': 'radius is half'}
      - say: 'Let the depth of the tank be h metres.'
        write: 'Let the depth be $h$ m'
        point:
          - {figure: sketch, kind: circle, target: 'h = ?', text: 'depth', 'on': 'depth'}
      - section: 'The formula'
        say: 'Volume of a cylinder: V equals pi r squared h.'
        write: '$V = \pi r^{2}h$'
        'on': 'Volume of a cylinder'
      - say: 'Substitute: V is 3080, pi is 22 over 7, and r is 7.'
        write: '$3080 = \dfrac{22}{7} \times 7 \times 7 \times h$'
      - section: 'Simplify'
        say: 'Cancel the 7: 7 over 7 is 1. That leaves 22 times 7, which is 154.'
        write: '$3080 = 22 \times 7 \times h = 154h$'
      - say: 'Divide both sides by 154.'
        write: '$h = \dfrac{3080}{154}$'
      - say: '154 times 2 is 308, so 154 times 20 is 3080. The answer is 20.'
        write: '$= 20$'
      - say: 'Therefore the depth of the tank is 20 metres.'
        write: '$\therefore$ depth $= 20$ m'
        point:
          - {figure: sketch, kind: label, target: 'h = ?', text: '20 m', 'on': 'Therefore'}
      - section: 'Check'
        say: 'Check by putting 20 back: 22 over 7, times 49, times 20 is 154 times 20, which is 3080.'
        write: 'Check: $\dfrac{22}{7} \times 49 \times 20 = 154 \times 20 = 3080$ ✓'
      - section: 'Answer'
        say: 'So the depth is 20 metres, which is answer choice A.'
        write: '$\therefore$ depth $= 20$ m (A)'
        answer: true
    traps:
      B: 'You went for 22 m. That is the 22 from pi as 22 over 7, not the depth. Divide 3080 by 154 to get 20.'
      C: 'You went for 23 m. Check it: 154 times 23 is 3542, not 3080. The depth is 3080 divided by 154, which is 20.'
      D: 'You went for 25 m. Check it: 154 times 25 is 3850, which is too much. 154 times 20 gives exactly 3080.'

  24:
    moments:
      - section: 'The question'
        say: 'When a sector is rolled into a cone, its two straight edges meet, and its curved arc goes all the way round the base of the cone.'
        write: 'Find the radius of the base of the cone.'
      - section: 'Solution'
        say: 'Write Solution, then sketch the sector: radius 7.2 cm, angle 300 degrees at the centre.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: underline, target: '7.2 cm', text: 'radius', 'on': 'radius 7.2'}
          - {figure: sketch, kind: circle, target: '300°', text: 'angle', 'on': 'angle 300'}
      - say: 'Now roll it up and sketch the cone it makes. The radius of its base is what we want.'
        write: 'Sector rolled into a cone'
        show_sketch: sketch_b
        point:
          - {figure: sketch_b, kind: circle, target: 'r = ?', text: 'base radius', 'on': 'radius of its base'}
      - section: 'What we know'
        say: 'List the givens. Call the radius of the sector capital R: 7.2 cm. The angle theta is 300 degrees.'
        write: '$R = 7.2$ cm, $\theta = 300^{\circ}$'
      - say: 'Let the radius of the base of the cone be small r.'
        write: 'Let the base radius of the cone be $r$'
      - section: 'The key fact'
        say: 'The rule for a sector folded into a cone: the arc length of the sector becomes the circumference of the base of the cone.'
        write: 'Arc length of sector $=$ circumference of base'
        point:
          - {figure: sketch_b, kind: circle, target: 'arc of sector = circumference of base', 'on': 'becomes'}
      - say: 'In symbols: theta over 360, times 2 pi capital R, equals 2 pi small r.'
        write: '$\dfrac{\theta}{360} \times 2\pi R = 2\pi r$'
      - section: 'Substitute'
        say: 'Substitute: theta is 300 and capital R is 7.2.'
        write: '$\dfrac{300}{360} \times 2\pi \times 7.2 = 2\pi r$'
      - say: 'Divide both sides by 2 pi. It cancels on both sides.'
        write: '$\dfrac{300}{360} \times 7.2 = r$'
      - section: 'Simplify'
        say: '300 over 360: divide top and bottom by 60, and it is 5 over 6.'
        write: '$\dfrac{5}{6} \times 7.2 = r$'
      - say: '7.2 divided by 6 is 1.2, and 5 times 1.2 is 6.'
        write: '$r = 5 \times 1.2 = 6$'
      - say: 'Therefore the radius of the base of the cone is 6 centimetres.'
        write: '$\therefore$ base radius $= 6$ cm'
        point:
          - {figure: sketch_b, kind: label, target: 'r = ?', text: '6 cm', 'on': 'Therefore'}
      - section: 'Check'
        say: 'Check: the base circumference is 2 pi times 6, which is 12 pi. The arc is 5 over 6 of 2 pi times 7.2, which is 5 over 6 of 14.4 pi, also 12 pi.'
        write: 'Check: $2\pi \times 6 = 12\pi$ and $\dfrac{5}{6} \times 14.4\pi = 12\pi$ ✓'
      - section: 'Answer'
        say: 'So the base radius is 6 cm, which is answer choice A.'
        write: '$\therefore r = 6$ cm (A)'
        answer: true
    traps:
      B: 'You went for 7 cm. That is close to the sector''s radius, 7.2, but the sector''s radius becomes the slant height of the cone, not its base radius.'
      C: 'You went for 8 cm. Check it: the base circumference would be 16 pi, but the arc is only 12 pi. The base radius is 5 over 6 of 7.2, which is 6.'
      D: 'You went for 9 cm. That would need an arc of 18 pi, but the arc is 5 over 6 of 14.4 pi, which is 12 pi. So the radius is 6.'

  25:
    moments:
      - section: 'The question'
