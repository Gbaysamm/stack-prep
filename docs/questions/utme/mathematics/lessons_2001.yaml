      C: 'You went for 8 cm. That is $PR$ itself, or the cosine rule with cos 120 degrees taken as positive a half. $QR$ is opposite the 120 degree angle, so it is longer than 8: $8\sqrt{3}$.'

  27:
    moments:
      - section: 'The question'
        say: 'A point moves so that its distance from the line $y = 4$ is always $k$. We want the equation of its locus.'
        write: 'Distance from the line $y = 4$ is $k$; locus $= ?$'
      - section: 'Solution'
        say: 'Solution. The standard locus: points at a fixed distance from a straight line form a pair of parallel lines, one on each side of it.'
        write: 'Solution: fixed distance from a line $\Rightarrow$ two parallel lines, one on each side'
      - say: 'Let me draw the line $y = 4$. It is horizontal, 4 units above the $x$-axis, with one dashed line above it and one below.'
        show_sketch: true
        write: '$y = 4$ is horizontal'
        point:
          - {figure: sketch, kind: circle, target: 'y = 4'}
      - say: 'Let $P(x, y)$ be any point on the locus. Its distance from a horizontal line is the difference in height, $y$ minus 4, taken without its sign.'
        write: 'Let $P(x, y)$ be on the locus: $|y - 4| = k$'
      - say: 'So either $y$ minus 4 is $k$, above the line, or $y$ minus 4 is negative $k$, below it.'
        write: 'Either $y - 4 = k$ or $y - 4 = -k$'
      - say: 'Add 4 to both sides of each.'
        write: '$y = 4 + k$ or $y = 4 - k$'
        point:
          - {figure: sketch, kind: circle, target: 'y = 4 + k', text: 'above'}
          - {figure: sketch, kind: circle, target: 'y = 4 − k', text: 'below'}
      - say: 'Both lines are part of the locus. We write them together with plus or minus.'
        write: 'Locus: $y = 4 \pm k$'
      - section: 'Check'
        say: 'Check with $k$ equals 1. The lines are $y = 5$ and $y = 3$, and each is exactly 1 unit from $y = 4$.'
        write: 'Check $k = 1$: $y = 5$ and $y = 3$; $\ 5 - 4 = 4 - 3 = 1\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the locus is $y$ equals 4 plus or minus $k$, which is option D.'
        write: '$\therefore$ locus: $y = 4 \pm k$'
        answer: true
    traps:
      A: 'You went for $y = 4 + k$. That is only the line above. The distance can be on either side, so $y - 4 = k$ or $y - 4 = -k$: the locus is $y = 4 \pm k$.'
      B: 'You went for $y = k - 4$. That puts the 4 on the wrong side. Start from $y - 4 = \pm k$ and add 4: $y = 4 \pm k$.'
      C: 'You went for $y = k \pm 4$. That swaps the roles of 4 and $k$. The fixed line is $y = 4$ and the distance is $k$, so $y = 4 \pm k$.'

  28:
    moments:
      - section: 'The question'
        say: 'A straight line makes an angle of 30 degrees with the positive $x$-axis, and cuts the $y$-axis at $y$ equals 5. We want its equation.'
        write: 'Angle with positive $x$-axis $= 30^{\circ}$; $y$-intercept $= 5$'
      - section: 'Solution'
        say: 'Solution. Let me draw the line, rising at 30 degrees and cutting the $y$-axis at 5.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '30°'}
          - {figure: sketch, kind: circle, target: '5', text: 'y-intercept'}
      - say: 'A straight line is $y$ equals $mx$ plus $c$: $m$ is the gradient, and $c$ is the $y$-intercept.'
        write: '$y = mx + c$'
      - section: 'm and c'
        say: 'The gradient of a line is the tangent of the angle it makes with the positive $x$-axis. Here that angle is 30 degrees.'
        write: '$m = \tan\theta = \tan 30^{\circ}$'
        point:
          - {figure: sketch, kind: circle, target: '30°', text: 'tan 30°'}
      - say: 'Tan 30 degrees is 1 over root 3, from the special-angle triangle.'
        write: '$\therefore\ m = \dfrac{1}{\sqrt{3}}$'
      - say: 'The line cuts the $y$-axis at 5, so $c$ is 5.'
        write: '$c = 5$ ($y$-intercept)'
        point:
          - {figure: sketch, kind: circle, target: '5', text: 'c = 5'}
      - section: 'The equation'
        say: 'Substitute $m$ and $c$ into $y$ equals $mx$ plus $c$.'
        write: '$y = \dfrac{1}{\sqrt{3}}x + 5$'
      - say: 'Multiply every term by root 3 to clear the fraction. Root 3 times 1 over root 3 is 1, and root 3 times 5 is 5 root 3.'
        write: '$\sqrt{3}\,y = x + 5\sqrt{3}$'
      - section: 'Check'
        say: 'Check the intercept: put $x$ equals 0. Root 3 $y$ equals 5 root 3, so $y$ is 5.'
        write: 'Check: $x = 0$: $\sqrt{3}\,y = 5\sqrt{3} \Rightarrow y = 5\ \checkmark$'
      - say: 'Therefore the equation is root 3 $y$ equals $x$ plus 5 root 3, which is answer choice A.'
        write: '$\therefore\ \sqrt{3}\,y = x + 5\sqrt{3}$'
        answer: true
    traps:
      B: 'You went for the one with negative $x$. That line slopes downwards, at 150 degrees to the positive $x$-axis. Tan 30 degrees is positive, so the $x$ term is positive.'
      C: 'You went for $y$ equals $x$ plus 5. A gradient of 1 means an angle of 45 degrees. For 30 degrees the gradient is tan 30, which is 1 over root 3.'
      D: 'You went for a gradient of 1 over 10. The gradient is tan 30 degrees, which is 1 over root 3, about 0.577, not 0.1.'

  29:
    moments:
      - section: 'The question'
        say: 'The two ends of a diameter are one diameter apart. So the distance $PQ$ is the diameter, and the radius is half of it.'
        write: '$P(-6,\ 1)$ and $Q(6,\ 6)$ are the ends of a diameter. Find the radius.'
      - section: 'Solution'
        say: 'Write Solution, then sketch the circle with $P$ and $Q$ at the ends of a diameter.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: '(−6, 1)', 'on': 'ends'}
          - {figure: sketch, kind: circle, target: '(6, 6)', 'on': 'diameter'}
      - say: 'Label the points first. Let $x$ 1, $y$ 1 be negative 6, 1, and $x$ 2, $y$ 2 be 6, 6.'
        write: 'Let $(x_{1},\ y_{1}) = (-6,\ 1)$ and $(x_{2},\ y_{2}) = (6,\ 6)$'
      - section: 'The formula'
        say: 'The distance formula: $PQ$ is the square root of, $x$ 2 minus $x$ 1 squared, plus $y$ 2 minus $y$ 1 squared.'
        write: '$|PQ| = \sqrt{(x_{2} - x_{1})^{2} + (y_{2} - y_{1})^{2}}$'
        'on': 'distance formula'
      - say: 'Substitute, with the negative in a bracket: 6 minus negative 6, and 6 minus 1.'
        write: '$= \sqrt{(6 - (-6))^{2} + (6 - 1)^{2}}$'
      - section: 'Simplify'
        say: 'Minus a negative is plus, so 6 minus negative 6 is 12. And 6 minus 1 is 5.'
        write: '$= \sqrt{12^{2} + 5^{2}}$'
        point:
          - {figure: sketch, kind: circle, target: '12', 'on': '12'}
          - {figure: sketch, kind: circle, target: '5', 'on': 'And'}
      - say: '12 squared is 144, and 5 squared is 25.'
        write: '$= \sqrt{144 + 25}$'
      - say: '144 plus 25 is 169, and 13 times 13 is 169.'
        write: '$= \sqrt{169} = 13$'
      - say: 'So the diameter is 13 units.'
        write: 'Diameter $= 13$ units'
        point:
          - {figure: sketch, kind: highlight, target: PQ, text: '13', 'on': 'diameter'}
      - say: 'The radius is half the diameter: 13 over 2 is 6.5.'
        write: 'Radius $= \dfrac{13}{2} = 6.5$'
      - say: 'Therefore the radius is 6.5 units.'
        write: '$\therefore r = 6.5$ units'
        point:
          - {figure: sketch, kind: label, target: 'r = ?', text: '6.5', 'on': 'Therefore'}
      - section: 'Check'
        say: 'Check: the centre is the midpoint of $PQ$, 0, 3.5. From there to $P$: 6 squared plus 2.5 squared is 36 plus 6.25, which is 42.25, and its square root is 6.5.'
        write: 'Check: centre $(0,\ 3.5)$; $\sqrt{6^{2} + 2.5^{2}} = \sqrt{42.25} = 6.5$ ✓'
      - section: 'Answer'
        say: 'So the radius is 6.5 units, which is answer choice B.'
        write: '$\therefore r = 6.5$ units (B)'
        answer: true
    traps:
      A: 'You went for 3.5 units. That is the $y$ value of the centre, not the radius. The diameter is the square root of 144 plus 25, which is 13, so the radius is 6.5.'
      C: 'You went for 7.0 units. The diameter is 13, not 14, so the radius is 6.5. Check: 12 squared plus 5 squared is 169, and the square root of 169 is 13.'
      D: 'You went for 13.0 units. That is the diameter. The question asks for the radius, which is half of it: 6.5.'

  30:
    moments:
      - section: 'The question'
        say: 'The line joining $p$, 4 and 6, negative 2 is perpendicular to the line joining 2, $p$ and negative 1, 3. We want $p$.'
        write: '$(p,\ 4),\ (6,\ -2)\ \perp\ (2,\ p),\ (-1,\ 3)$'
      - section: 'Solution'
        say: 'Solution. Perpendicular lines meet at a right angle, and the product of their gradients is negative 1.'
        write: 'Solution: perpendicular, so $m_{1} \times m_{2} = -1$'
        doodle: {name: 'custom:2001_q30_a', id: cross, caption: 'meeting at a right angle'}
      - say: 'Each gradient is the change in $y$ over the change in $x$, taking both in the same order.'
        write: '$m = \dfrac{y_{2} - y_{1}}{x_{2} - x_{1}}$'
      - section: 'The two gradients'
        say: 'First line: negative 2 minus 4, over 6 minus $p$. Negative 2 minus 4 is negative 6.'
        write: '$m_{1} = \dfrac{-2 - 4}{6 - p} = \dfrac{-6}{6 - p}$'
      - say: 'Second line: 3 minus $p$, over negative 1 minus 2. Negative 1 minus 2 is negative 3.'
        write: '$m_{2} = \dfrac{3 - p}{-1 - 2} = \dfrac{3 - p}{-3}$'
      - say: 'Multiply the top and the bottom by negative 1: 3 minus $p$ over negative 3 is $p$ minus 3, over 3.'
        write: '$m_{2} = \dfrac{p - 3}{3}$'
      - section: 'Solve'
        say: 'Substitute both gradients into $m$ 1 times $m$ 2 equals negative 1.'
        write: '$\dfrac{-6}{6 - p} \times \dfrac{p - 3}{3} = -1$'
        doodle_do:
          - {id: cross, op: circle, part: corner}
      - say: 'Negative 6 over 3 is negative 2.'
        write: '$\dfrac{-2(p - 3)}{6 - p} = -1$'
      - say: 'Multiply both sides by 6 minus $p$ to clear the fraction.'
        write: '$-2(p - 3) = -(6 - p)$'
      - say: 'Expand both brackets. Negative 2 times $p$ is negative $2p$; negative 2 times negative 3 is plus 6. On the right, negative 6 plus $p$.'
        write: '$-2p + 6 = -6 + p$'
      - say: 'Collect the $p$ terms on the right and the numbers on the left: add $2p$ and add 6 to both sides.'
        write: '$12 = 3p$'
      - say: 'Divide both sides by 3. 12 over 3 is 4.'
        write: '$\therefore\ p = 4$'
      - section: 'Check'
        say: 'Check with $p$ equals 4. The first gradient is negative 6 over 2, negative 3. The second is 1 over 3. Negative 3 times 1 over 3 is negative 1.'
        write: 'Check: $m_{1} = \dfrac{-6}{2} = -3,\ m_{2} = \dfrac{1}{3}$; $-3 \times \dfrac{1}{3} = -1\ \checkmark$'
        doodle_do:
          - {id: cross, op: label, part: l1, text: 'm1 = −3'}
          - {id: cross, op: label, part: l2, text: 'm2 = 1/3'}
      - say: 'Therefore $p$ is 4, which is answer choice C.'
        write: '$\therefore\ p = 4$'
        answer: true
    traps:
      A: 'You went for 0. Then the gradients are negative 1 and negative 1, whose product is positive 1, not negative 1.'
      B: 'You went for 3. Then the second gradient is 0 and the first is negative 2. Their product is 0, not negative 1.'
      D: 'You went for 6. Then 6 minus $p$ is 0, and the first gradient cannot be worked out. Solving the equation gives $p$ equals 4.'

  31:
    moments:
      - section: 'The question'
        say: 'From a point $N$, $P$ is on a bearing of 020 degrees and $Q$ is on 300 degrees. $P$ and $Q$ are the same distance from $N$. We want the bearing of $P$ from $Q$.'
        write: 'From $N$: $P$ on $020^{\circ}$, $Q$ on $300^{\circ}$; $\ |NP| = |NQ|$'
      - section: 'Solution'
        say: 'Solution. Let me draw the North line at $N$. Bearings are measured clockwise from North. $P$ is just east of North; $Q$ is round in the north-west.'
        write: 'Solution: N line at $N$'
        show_sketch: true
        'on': 'North line'
        point:
          - { figure: sketch, kind: highlight, target: NP }
          - { figure: sketch, kind: highlight, target: NQ }
      - say: 'The angle at $N$: from $Q$ at 300 round to North at 360 is 60 degrees, then on to $P$ at 20 is 20 more.'
        write: '$\angle QNP = (360^{\circ} - 300^{\circ}) + 20^{\circ} = 80^{\circ}$'
        point:
          - { figure: sketch, kind: arc, target: QNP, text: '80°' }
      - section: 'The base angles'
        say: 'Let me join $P$ to $Q$. $NP$ equals $NQ$, so triangle $NPQ$ is isosceles, and its base angles are equal.'
        write: '$\angle NQP = \angle NPQ$ (base $\angle$s of isos. $\triangle$)'
        show_sketch: sketch_b
        point:
          - { figure: sketch_b, kind: highlight, target: PQ, text: 'join' }
      - say: 'The angles of the triangle add up to 180. Take away the 80, and share the rest equally.'
        write: '$\angle NQP = \dfrac{180^{\circ} - 80^{\circ}}{2} = 50^{\circ}$'
        point:
          - { figure: sketch_b, kind: arc, target: NQP, text: '50°' }
      - section: 'The bearing from Q'
        say: 'Now stand at $Q$, with a North line there. $N$ is in the reverse direction to the bearing 300. The back bearing is the bearing minus 180.'
        write: 'Bearing of $N$ from $Q = 300^{\circ} - 180^{\circ} = 120^{\circ}$ (back bearing)'
        point:
          - { figure: sketch_b, kind: circle, target: 'Q', text: 'stand here' }
      - say: 'From $Q$, $P$ is 50 degrees round from $N$, on the North side. Turning towards North takes 50 off the bearing.'
        write: 'Bearing of $P$ from $Q = 120^{\circ} - 50^{\circ} = 70^{\circ}$'
      - say: 'A bearing is written in three figures: zero-seven-zero degrees.'
        write: '$= 070^{\circ}$'
        point:
          - { figure: sketch_b, kind: label, target: '?', text: '070°' }
      - section: 'Check'
        say: 'Check from $P$. The bearing of $N$ from $P$ is 020 plus 180, which is 200. $Q$ is a further 50 degrees clockwise: 250. And 250 minus 180 is 070.'
        write: 'Check: $Q$ from $P = 200^{\circ} + 50^{\circ} = 250^{\circ}$; $\ 250^{\circ} - 180^{\circ} = 070^{\circ}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the bearing of $P$ from $Q$ is 070 degrees, which is answer choice C.'
        write: '$\therefore$ Bearing of $P$ from $Q = 070^{\circ}$'
        answer: true
        point:
          - { figure: sketch_b, kind: circle, target: '?', text: '070°' }
    traps:
      A: 'You went for 320 degrees. That points north-west from $Q$, away from $P$. $P$ is east of $Q$, so its bearing is under 180: the back bearing 120, minus 50, is 070.'
      B: 'You went for 280 degrees. That points almost due west, but $P$ is east of $Q$. Use the back bearing, 120 degrees, then turn 50 degrees towards North: 070.'
      D: 'You went for 040 degrees. Check the base angle: half of 180 minus 80 is 50. Then 120 minus 50 is 070, not 040.'

  32:
    moments:
      - section: 'The question'
        say: 'All three sides of the triangle are given in terms of $t$, and we want the angle between the equal sides. Many students drop the minus sign. Three sides known: the cosine rule.'
        write: 'Find $\theta$'
        point:
          - {figure: 0, kind: circle, target: 'θ', text: 'find'}
      - section: 'Solution'
        say: 'Solution. From the diagram: $AB$ and $AC$ are both $t$, the base $BC$ is root 3 $t$, and theta is the angle at $A$.'
        write: 'Solution: $|AB| = |AC| = t$, $|BC| = \sqrt{3}\,t$, $\angle BAC = \theta$'
        point:
          - {figure: 0, kind: circle, target: '√3 t', text: 'base'}
      - say: 'With three sides known, the cosine rule for an angle: cos $A$ equals $b$ squared plus $c$ squared minus $a$ squared, all over 2 $bc$. Here $a$ is $BC$, the side opposite $A$.'
        write: '$\cos A = \dfrac{b^{2} + c^{2} - a^{2}}{2bc}$ (cosine rule)'
        point:
          - {figure: 0, kind: highlight, target: BC, text: 'a, opposite A'}
      - say: 'Substitute: $b$ and $c$ are both $t$, and $a$ is root 3 $t$, in a bracket.'
        write: '$\cos\theta = \dfrac{t^{2} + t^{2} - (\sqrt{3}\,t)^{2}}{2(t)(t)}$'
      - say: '$t$ squared plus $t$ squared is 2 $t$ squared. Root 3 $t$, all squared, is 3 $t$ squared. And 2 times $t$ times $t$ is 2 $t$ squared.'
        write: '$= \dfrac{2t^{2} - 3t^{2}}{2t^{2}}$'
      - say: '2 $t$ squared minus 3 $t$ squared is negative $t$ squared. Cancel $t$ squared, top and bottom.'
        write: '$= \dfrac{-t^{2}}{2t^{2}} = -\dfrac{1}{2}$'
      - say: 'Cos 60 degrees is 1 over 2. The cosine here is negative, so theta is in the second quadrant: 180 minus 60.'
        write: '$\cos\theta = -\dfrac{1}{2} \Rightarrow \theta = 180^{\circ} - 60^{\circ}$ (2nd quadrant)'
      - say: '180 minus 60 is 120.'
        write: '$\theta = 120^{\circ}$'
        point:
          - {figure: 0, kind: label, target: 'θ', text: '120°'}
      - section: 'Check'
        say: 'Check: the perpendicular from $A$ cuts the base in half, because the triangle is isosceles. Half of root 3 $t$, over $t$, is root 3 over 2.'
        write: 'Check: $\sin\dfrac{\theta}{2} = \dfrac{\frac{\sqrt{3}}{2}t}{t} = \dfrac{\sqrt{3}}{2}$'
      - say: 'Sin 60 is root 3 over 2, so half of theta is 60 degrees, and theta is 120 degrees. It agrees.'
        write: '$\dfrac{\theta}{2} = 60^{\circ}$, $\ \theta = 120^{\circ}\ \checkmark$'
      - say: 'Therefore theta is 120 degrees, which is option D.'
        write: '$\therefore \theta = 120^{\circ}$'
        answer: true
    traps:
      A: 'You went for 30 degrees. That is each base angle, at $B$ or $C$, not the angle between the equal sides. The angles are 30, 30 and 120.'
      B: 'You went for 60 degrees. That drops the minus sign. Cos theta is negative 1 over 2, so theta is in the second quadrant: 180 minus 60 is 120.'
      C: 'You went for 100 degrees. Cos 100 degrees is not negative 1 over 2. The cosine rule gives negative 1 over 2, and the angle with that cosine is 120 degrees.'

  33:
    moments:
      - section: 'The question'
        say: 'One bracket times another, and the first bracket is squared. That calls for the product rule, with the chain rule inside it.'
        write: '$y = (2x + 5)^{2}(x - 4)$'
      - section: 'Solution'
        say: 'Solution. Name the two parts. Let $u$ be $2x$ plus 5, all squared, and let $v$ be $x$ minus 4.'
        write: 'Let $u = (2x + 5)^{2}$, $\ v = x - 4$'
      - say: 'The product rule: if $y$ equals $u v$, $\dfrac{dy}{dx}$ equals $u$ $\dfrac{dv}{dx}$ plus $v$ $\dfrac{du}{dx}$. Picture a rectangle of sides $u$ and $v$: when $x$ grows, it gains two strips, so the rule has two terms.'
        'on': 'product rule'
        write: '$\dfrac{dy}{dx} = u\dfrac{dv}{dx} + v\dfrac{du}{dx}$'
        doodle: {name: 'custom:2001_q33_a', id: rect, caption: 'a product is a rectangle'}
        doodle_do:
          - {id: rect, op: stage, stage: 'custom:2001_q33_a2'}
      - section: 'Find du/dx'
        say: '$u$ is a function of a function, so we use the chain rule. Let $t$ be the inside, $2x$ plus 5. Then $u$ is $t$ squared.'
        'on': 'function of a function'
        write: 'Let $t = 2x + 5$, $\ \therefore u = t^{2}$'
      - say: 'Differentiate each. $\dfrac{dt}{dx}$ is 2. $\dfrac{du}{dt}$ is $2t$.'
        write: '$\dfrac{dt}{dx} = 2$, $\ \dfrac{du}{dt} = 2t$'
      - say: 'The chain rule: $\dfrac{du}{dx}$ equals $\dfrac{du}{dt}$ times $\dfrac{dt}{dx}$. $2t$ times 2 is $4t$. Put back $t$ equals $2x$ plus 5.'
        write: '$\dfrac{du}{dx} = \dfrac{du}{dt} \times \dfrac{dt}{dx} = 2t \times 2 = 4(2x + 5)$'
        doodle_do:
          - {id: rect, op: highlight, part: right}
      - section: 'Find dv/dx'
        say: '$v$ is $x$ minus 4. $x$ gives 1, and the constant gives 0.'
        write: '$\dfrac{dv}{dx} = 1$'
        doodle_do:
          - {id: rect, op: highlight, part: top}
      - section: 'Substitute'
        say: 'Substitute into the product rule: $u$ times $\dfrac{dv}{dx}$, plus $v$ times $\dfrac{du}{dx}$.'
        write: '$\dfrac{dy}{dx} = (2x + 5)^{2}(1) + (x - 4) \cdot 4(2x + 5)$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
      - section: 'Simplify'
        say: 'Both terms contain $2x$ plus 5, so take it out as a common factor.'
        write: '$= (2x + 5)\left[(2x + 5) + 4(x - 4)\right]$'
      - say: 'Open the bracket: 4 times $x$ minus 4 is $4x$ minus 16.'
        write: '$= (2x + 5)(2x + 5 + 4x - 16)$'
      - say: 'Collect like terms: $2x$ plus $4x$ is $6x$, and 5 minus 16 is minus 11.'
        write: '$= (2x + 5)(6x - 11)$'
      - section: 'Check'
        say: 'Check by expanding first. $y$ is $4x$ cubed plus $4x$ squared minus $55x$ minus 100, so $\dfrac{dy}{dx}$ is $12x$ squared plus $8x$ minus 55.'
        write: 'Check: $y = 4x^{3} + 4x^{2} - 55x - 100 \Rightarrow \dfrac{dy}{dx} = 12x^{2} + 8x - 55$'
      - say: 'And $2x$ plus 5, times $6x$ minus 11, expands to the same thing.'
        write: '$(2x + 5)(6x - 11) = 12x^{2} + 8x - 55\ \checkmark$'
      - say: 'Therefore $\dfrac{dy}{dx}$ is $2x$ plus 5, times $6x$ minus 11, which is answer choice A.'
        write: '$\therefore \dfrac{dy}{dx} = (2x + 5)(6x - 11)$'
        answer: true
    traps:
      B: 'You went for $(2x + 5)(2x - 13)$. The 4 from $\dfrac{du}{dx}$ must multiply both parts of $x - 4$: $4(x - 4) = 4x - 16$. Then $2x + 5 + 4x - 16 = 6x - 11$.'
      C: 'You went for $4(2x + 5)(x - 4)$. That is only $v\dfrac{du}{dx}$, one term of the product rule. Add $u\dfrac{dv}{dx}$, which is $(2x + 5)^{2}$.'
      D: 'You went for $4(2x + 5)(4x - 3)$. After taking out $(2x + 5)$, the bracket is $(2x + 5) + 4(x - 4) = 6x - 11$, with no extra factor of 4 outside.'

  34:
    moments:
      - section: 'The question'
        say: '$y$ is $x$ times sin $x$, a product of two functions of $x$. So we use the product rule, then put $x$ equals $\tfrac{\pi}{2}$.'
        write: '$y = x\sin x$; $\ \dfrac{dy}{dx}$ at $x = \dfrac{\pi}{2}$'
      - section: 'Solution'
        say: 'Solution. Name the two parts first. Let $u$ be $x$ and $v$ be sin $x$.'
        write: 'Solution: Let $u = x$, $\ v = \sin x$'
      - say: 'Differentiate each part. $x$ gives 1, and sin $x$ gives cos $x$.'
        write: '$\dfrac{du}{dx} = 1$, $\ \dfrac{dv}{dx} = \cos x$'
      - say: 'The product rule: $u$ times $dv$ by $dx$, plus $v$ times $du$ by $dx$.'
        write: 'Product rule: $\dfrac{dy}{dx} = u\dfrac{dv}{dx} + v\dfrac{du}{dx}$'
      - say: 'Substitute: $x$ times cos $x$, plus sin $x$ times 1.'
        write: '$\dfrac{dy}{dx} = x\cos x + \sin x\,(1)$'
      - say: 'Tidy it up.'
        write: '$= x\cos x + \sin x$'
      - section: 'At x = π/2'
        say: 'Now put $x$ equals $\tfrac{\pi}{2}$ everywhere.'
        write: 'At $x = \dfrac{\pi}{2}$: $\ \dfrac{dy}{dx} = \dfrac{\pi}{2}\cos\dfrac{\pi}{2} + \sin\dfrac{\pi}{2}$'
      - say: '$\tfrac{\pi}{2}$ radians is 90 degrees. Cos 90 is 0 and sin 90 is 1.'
        write: '$\cos\dfrac{\pi}{2} = \cos 90^{\circ} = 0$, $\ \sin\dfrac{\pi}{2} = \sin 90^{\circ} = 1$'
      - say: 'So $\tfrac{\pi}{2}$ times 0 is 0, and 0 plus 1 is 1.'
        write: '$\dfrac{dy}{dx} = \dfrac{\pi}{2}(0) + 1 = 1$'
        doodle: {name: 'custom:2001_q34_a', id: dial, caption: 'dy/dx: how fast y is changing'}
        doodle_do:
          - {id: dial, op: pulse, part: reading}
          - {id: dial, op: stage, stage: 'custom:2001_q34_a2'}
          - {id: dial, op: circle, part: one}
      - section: 'Check'
        say: 'Check with the rule the other way round: $v$ $du$ by $dx$ first. Sin 90 times 1, plus $\tfrac{\pi}{2}$ times cos 90, is 1 plus 0. The same.'
        write: 'Check: $\sin 90^{\circ}(1) + \dfrac{\pi}{2}\cos 90^{\circ} = 1 + 0 = 1\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore $dy$ by $dx$ at $x$ equals $\tfrac{\pi}{2}$ is 1, which is answer choice B.'
        write: '$\therefore \dfrac{dy}{dx} = 1$'
        answer: true
    traps:
      A: 'You went for $\tfrac{\pi}{2}$. That keeps only the $x\cos x$ term and takes cos 90 as 1. Cos 90 is 0; it is the sin $x$ term that gives the 1.'
      C: 'You went for minus 1. Sin $x$ differentiates to plus cos $x$, and sin 90 is plus 1. The answer is 1.'
      D: 'You went for minus $\tfrac{\pi}{2}$. The $x\cos x$ term is 0 at $\tfrac{\pi}{2}$, because cos 90 is 0. Only sin $x$ is left, and that is 1.'

  35:
    moments:
      - section: 'The question'
        say: 'The gradient of a curve at a point is how steep it is there, like a hill under your feet. We know the gradient at $x$ equals 1 is 9, and we want $k$.'
        write: '$y = 2kx^{2} + x + 1$; gradient $= 9$ at $x = 1$'
        doodle: {name: 'custom:2001_q35_a', id: hill, caption: 'gradient = steepness'}
      - section: 'Solution'
        say: 'Solution. The gradient is $\dfrac{dy}{dx}$. $k$ is a constant, so it stays as it is while we differentiate.'
        write: 'Gradient $= \dfrac{dy}{dx}$'
      - say: 'The power rule: multiply by the power, then reduce the power by 1.'
        'on': 'power rule'
        write: 'If $y = ax^{n}$, $\ \dfrac{dy}{dx} = nax^{n-1}$'
      - say: 'Term by term. For $2kx$ squared: 2 times $2k$, power 2 minus 1. $x$ gives 1, and the constant 1 gives 0.'
        write: '$\dfrac{dy}{dx} = 2(2k)x^{2-1} + 1 + 0$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
      - say: '2 times $2k$ is $4k$, and the power is 1.'
        write: '$= 4kx + 1$'
      - section: 'At x = 1'
        say: 'Substitute $x$ equals 1, where we stand on the hill.'
        write: 'At $x = 1$: $\ \dfrac{dy}{dx} = 4k(1) + 1 = 4k + 1$'
        doodle_do:
          - {id: hill, op: highlight, part: walker}
      - say: 'But the gradient there is given as 9. So $4k$ plus 1 equals 9.'
        write: '$4k + 1 = 9$'
        doodle_do:
          - {id: hill, op: label, part: slope, text: 'gradient 9'}
      - say: 'Take 1 from both sides: 9 minus 1 is 8.'
        write: '$4k = 9 - 1 = 8$'
      - say: 'Divide both sides by 4: 8 over 4 is 2.'
        write: '$k = \dfrac{8}{4} = 2$'
      - section: 'Check'
        say: 'Check. With $k$ equals 2, $y$ is $4x$ squared plus $x$ plus 1, so $\dfrac{dy}{dx}$ is $8x$ plus 1. At $x$ equals 1, that is 9.'
        write: 'Check: $\dfrac{dy}{dx} = 8x + 1$; $\ 8(1) + 1 = 9\ \checkmark$'
      - say: 'Therefore $k$ is 2, which is answer choice B.'
        write: '$\therefore k = 2$'
        answer: true
    traps:
      A: 'You went for 1. Then $\dfrac{dy}{dx} = 4x + 1$, and at $x = 1$ the gradient is 5, not 9.'
      C: 'You went for 3. Then $\dfrac{dy}{dx} = 12x + 1$, and at $x = 1$ the gradient is 13, not 9.'
      D: 'You went for 4. That is the 4 in $4k$, not $k$ itself. From $4k = 8$, divide both sides by 4: $k = 2$.'

  36:
    moments:
      - section: 'The question'
        say: 'Rate of change of the volume with respect to the radius means: differentiate $V$ with respect to $r$. Then put $r$ equals 1.'
        write: 'Find $\dfrac{dV}{dr}$ when $r = 1$'
      - section: 'Solution'
        say: 'Solution. Let me draw the sphere of radius $r$. Its volume is 4 over 3, times pi, times $r$ cubed.'
        write: '$V = \dfrac{4}{3}\pi r^{3}$'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: 'V = 4/3 πr³'}
      - say: 'Differentiate with respect to $r$: multiply by the power 3, then reduce the power by 1. The 4 over 3 pi is a constant, so it stays in front.'
        write: '$\dfrac{dV}{dr} = 3 \times \dfrac{4}{3}\pi r^{3 - 1}$'
      - say: '3 times 4 is 12, over 3. And 3 minus 1 is 2, so $r$ squared.'
        write: '$= \dfrac{12}{3}\pi r^{2}$'
      - say: '12 divided by 3 is 4.'
        write: '$\dfrac{dV}{dr} = 4\pi r^{2}$'
      - section: 'Substitute'
        say: 'Now substitute $r$ equals 1.'
        write: 'At $r = 1$: $\ \dfrac{dV}{dr} = 4\pi(1)^{2}$'
        point:
          - {figure: sketch, kind: circle, target: 'r = 1'}
      - say: '1 squared is 1, and 4 pi times 1 is 4 pi.'
        write: '$= 4\pi$'
        point:
          - {figure: sketch, kind: label, target: 'dV/dr = ?', text: '4π'}
      - section: 'Check'
        say: 'Check: 4 pi $r$ squared is the surface area of a sphere. As the sphere grows, it adds a thin skin of that area, so the rate makes sense.'
        write: 'Check: $4\pi r^{2}$ = surface area of a sphere $\checkmark$'
      - say: 'Therefore the rate of change is 4 pi, which is answer choice A.'
        write: '$\therefore \dfrac{dV}{dr} = 4\pi$ when $r = 1$'
        answer: true
    traps:
      B: 'You went for 8 pi. 3 times 4 over 3 is 4, so the derivative is $4\pi r^{2}$, and at $r = 1$ that is just 4 pi.'
      C: 'You went for 12 pi. That is 4 pi times 3: the power 3 came down, but it was not cancelled with the 3 under the 4. 3 times 4 over 3 is 4.'
      D: 'You went for 24 pi. That is far too big. 3 times 4 over 3 is 4, and at $r = 1$, $4\pi r^{2}$ is 4 pi.'

  37:
    moments:
      - section: 'The question'
        say: 'A rectangle has a fixed perimeter $p$. We want the sides that give the greatest area: a maximum problem.'
        write: 'Perimeter $= p$ (fixed); area $A$ greatest'
      - section: 'Solution'
        say: 'Solution. Let me draw the rectangle. Let its sides be $x$ and $y$.'
        write: 'Let the sides be $x$ and $y$'
        show_sketch: true
      - say: 'The perimeter is the distance round: $x$ plus $y$ plus $x$ plus $y$, which is $2x$ plus $2y$. It equals $p$.'
        write: '$2x + 2y = p$'
        point:
          - {figure: sketch, kind: circle, target: 'perimeter 2x + 2y = p'}
      - say: 'Divide both sides by 2.'
        write: '$x + y = \dfrac{p}{2}$'
      - say: 'Make $y$ the subject: subtract $x$ from both sides. Call this equation 1.'
        write: '$y = \dfrac{p}{2} - x \quad \ldots (1)$'
      - say: 'The area of a rectangle is length times breadth.'
        write: '$A = xy$'
        point:
          - {figure: sketch, kind: circle, target: 'area A = xy'}
      - say: 'Substitute equation 1 for $y$, so the area has one variable, $x$. Then expand the bracket.'
        write: '$A = x\left(\dfrac{p}{2} - x\right) = \dfrac{px}{2} - x^{2}$'
      - section: 'Turning point'
        say: 'Differentiate $A$ with respect to $x$. $p$ is a constant, so $px$ over 2 gives $p$ over 2, and minus $x$ squared gives minus $2x$.'
        write: '$\dfrac{dA}{dx} = \dfrac{p}{2} - 2x$'
      - say: 'At turning point, $\dfrac{dA}{dx}$ equals 0.'
        'on': 'turning point'
        write: 'At turning point, $\dfrac{dA}{dx} = 0$'
      - say: 'So $p$ over 2 minus $2x$ equals 0.'
        write: '$\dfrac{p}{2} - 2x = 0$'
      - say: 'Add $2x$ to both sides, then divide by 2. $p$ over 2, divided by 2, is $p$ over 4.'
        write: '$2x = \dfrac{p}{2} \Rightarrow x = \dfrac{p}{4}$'
        point:
          - {figure: sketch, kind: label, target: 'x', text: 'p/4'}
      - section: 'Second derivative'
        say: 'Differentiate again: $p$ over 2 gives 0, and minus $2x$ gives minus 2. It is negative, so the area is a maximum.'
        'on': 'negative'
        write: '$\dfrac{d^{2}A}{dx^{2}} = -2 < 0$, $\ \therefore$ maximum'
      - section: 'The other side'
        say: 'Substitute $x$ equals $p$ over 4 into equation 1. $p$ over 2 is $2p$ over 4, and $2p$ over 4 minus $p$ over 4 is $p$ over 4.'
        write: 'From (1): $y = \dfrac{p}{2} - \dfrac{p}{4} = \dfrac{p}{4}$'
        point:
          - {line: 12, kind: arrow, from: {line: 4, at: '(1)'}, at: 'From (1)', text: 'equation 1'}
          - {figure: sketch, kind: label, target: 'y', text: 'p/4'}
      - section: 'Check'
        say: 'Both sides are $p$ over 4, so the rectangle is a square. Check: 4 sides of $p$ over 4 make a perimeter of $p$.'
        write: 'Check: $4 \times \dfrac{p}{4} = p\ \checkmark$'
      - say: 'Therefore the greatest area comes from a square of side $p$ over 4, which is answer choice A.'
        write: '$\therefore$ a square of side $\dfrac{p}{4}$'
        answer: true
    traps:
      B: 'You went for a square of side $p$ over 2. That is $x + y$, two sides together. Its perimeter would be 4 times $p$ over 2, which is $2p$.'
      C: 'You went for a square of side $p$. Its perimeter would be $4p$. From $\dfrac{dA}{dx} = 0$, each side is $p$ over 4.'
      D: 'You went for a square of side $2p$. Its perimeter would be $8p$, far more than $p$. Each side is $p$ over 4.'

  38:
    moments:
      - section: 'The question'
        say: 'We must integrate 2 times, bracket, $2x$ minus 3, to the power 2 over 3. A bracket raised to a power: we integrate it by substitution.'
        write: '$\displaystyle\int 2(2x - 3)^{\frac{2}{3}}\,dx$'
      - section: 'Solution'
        say: 'Solution. Let $u$ be the inside of the bracket, $2x$ minus 3.'
        write: 'Solution: let $u = 2x - 3$'
      - say: 'Differentiate $u$ with respect to $x$: $du$ by $dx$ is 2. So $du$ equals 2 $dx$.'
        write: '$\dfrac{du}{dx} = 2 \Rightarrow du = 2\,dx$'
      - say: 'Look: the integral already has a 2 and a $dx$. Together, 2 $dx$ is $du$. And the bracket is $u$. So the integral becomes $u$ to the 2 over 3, $du$.'
        write: '$\displaystyle\int (2x - 3)^{\frac{2}{3}} \times 2\,dx = \int u^{\frac{2}{3}}\,du$'
      - section: 'Integrate'
        say: 'To integrate a power: add 1 to the power, and divide by the new power. Plus $k$, the constant of integration.'
        write: '$\displaystyle\int u^{n}\,du = \dfrac{u^{n+1}}{n+1} + k$'
      - say: 'Here $n$ is 2 over 3. Picture the power climbing one step. 2 over 3 plus 3 over 3 is 5 over 3.'
        doodle: {name: 'custom:2001_q38_a', id: steps, caption: 'the power goes up one step'}
        write: '$n + 1 = \dfrac{2}{3} + \dfrac{3}{3} = \dfrac{5}{3}$'
      - say: 'Dividing by 5 over 3 is the same as multiplying by its reciprocal, 3 over 5.'
        write: '$\displaystyle\int u^{\frac{2}{3}}\,du = \dfrac{u^{\frac{5}{3}}}{\frac{5}{3}} + k = \dfrac{3}{5}u^{\frac{5}{3}} + k$'
        doodle_do:
          - {id: steps, op: label, part: high, text: '÷ 5/3 is × 3/5'}
      - say: 'Now put back $u$ equals $2x$ minus 3, so the answer is in terms of $x$.'
        write: '$\therefore \displaystyle\int 2(2x - 3)^{\frac{2}{3}}\,dx = \dfrac{3}{5}(2x - 3)^{\frac{5}{3}} + k$'
      - section: 'Check'
        say: 'Check by differentiating back, down the step. Bring down the 5 over 3: 3 over 5 times 5 over 3 is 1. The power drops to 2 over 3. Then multiply by 2, the derivative of the inside.'
        write: 'Check: $\dfrac{d}{dx}\left[\dfrac{3}{5}(2x - 3)^{\frac{5}{3}}\right] = \dfrac{3}{5} \times \dfrac{5}{3}(2x - 3)^{\frac{2}{3}} \times 2 = 2(2x - 3)^{\frac{2}{3}}\ \checkmark$'
        doodle_do:
          - {id: steps, op: stage, stage: 'custom:2001_q38_a2'}
      - say: 'Therefore the answer is 3 over 5, times $2x$ minus 3 to the power 5 over 3, plus $k$, which is option D.'
        write: '$\therefore \dfrac{3}{5}(2x - 3)^{\frac{5}{3}} + k$'
        answer: true
    traps:
      A: 'You went for $2x - 3 + k$. The power does not disappear when you integrate; it goes up by one, from 2 over 3 to 5 over 3.'
      B: 'You went for $2(2x - 3) + k$. That drops the power. Integrating raises the power by one, to 5 over 3, then divides by it.'
      C: 'You went for 6 over 5. That keeps the 2 in front as well as using $du = 2\,dx$. The 2 and the $dx$ together make $du$, so only 3 over 5 is left.'

  39:
    moments:
      - section: 'The question'
        say: 'The area between a curve and the $x$-axis. No limits are given, so we must find where the curve meets the axis. Let me draw the curve.'
        write: '$y = 4 - x^{2}$ and the $x$-axis'
        diagram:
          id: g
          kind: graph
          x: [-3, 3]
          y: [-3, 5]
          plots:
            - {fn: '4 - x^2', label: 'y = 4 − x²', colour: blue}
      - section: 'Solution'
        say: 'Solution. On the $x$-axis, $y$ is 0. So set $4$ minus $x$ squared equal to 0.'
        write: 'At the $x$-axis, $y = 0$: $\ 4 - x^{2} = 0$'
      - say: '4 minus $x$ squared is a difference of two squares: 2 minus $x$, times 2 plus $x$.'
        write: '$(2 - x)(2 + x) = 0$'
      - say: 'Either 2 minus $x$ is 0, or 2 plus $x$ is 0. So $x$ is 2 or minus 2. These are the limits.'
        write: 'Either $2 - x = 0$ or $2 + x = 0$; $\ \therefore x = 2$ or $x = -2$'
        diagram_do:
          - {id: g, op: intercepts, part: 'plot:1', axis: x}
      - say: 'The area is the integral of $y$ with respect to $x$, from minus 2 to 2.'
        'on': 'integral'
        write: 'Area $= \displaystyle\int_{-2}^{2} (4 - x^{2})\,dx$'
        diagram_do:
          - {id: g, op: shade, part: 'plot:1', x: [-2, 2], text: 'Area = ?', colour: orange}
      - say: 'The rule: add 1 to the power, and divide by the new power.'
        'on': 'add 1'
        write: '$\displaystyle\int x^{n}\,dx = \dfrac{x^{n+1}}{n+1} + c$'
      - say: 'Term by term. 4 becomes $4x$. Minus $x$ squared becomes minus $x$ cubed over 3. Keep the limits on the square bracket.'
        write: '$= \left[4x - \dfrac{x^{3}}{3}\right]_{-2}^{2}$'
        point:
          - {line: 5, kind: box, text: 'the rule'}
      - section: 'Upper minus lower'
        say: 'Substitute the upper limit, 2, then subtract the value at the lower limit, minus 2. Put the minus 2 in brackets.'
        write: '$= \left(4(2) - \dfrac{(2)^{3}}{3}\right) - \left(4(-2) - \dfrac{(-2)^{3}}{3}\right)$'
      - say: '4 times 2 is 8, and 2 cubed is 8. 4 times minus 2 is minus 8. Minus 2 cubed is minus 8, and minus, minus 8 over 3, is plus 8 over 3.'
        write: '$= \left(8 - \dfrac{8}{3}\right) - \left(-8 + \dfrac{8}{3}\right)$'
      - say: '8 is 24 over 3. 24 over 3 minus 8 over 3 is 16 over 3. And minus 24 over 3 plus 8 over 3 is minus 16 over 3.'
        write: '$= \dfrac{16}{3} - \left(-\dfrac{16}{3}\right)$'
      - say: 'Minus a negative is plus. 16 over 3 plus 16 over 3 is 32 over 3.'
        write: '$= \dfrac{16}{3} + \dfrac{16}{3} = \dfrac{32}{3}$'
      - say: '3 into 32 goes 10 times, remainder 2. So 32 over 3 is 10 and two thirds.'
        write: '$= 10\tfrac{2}{3}$'
        diagram_do:
          - {id: g, op: label, part: 'shade:1', text: 'Area = 10⅔', colour: green}
      - section: 'Check'
        say: 'Check. The hump sits inside a rectangle 4 wide and 4 tall, of area 16. A parabola''s hump fills exactly two thirds of that rectangle. Two thirds of 16 is 10 and two thirds.'
        write: 'Check: $\tfrac{2}{3} \times (4 \times 4) = \tfrac{32}{3}\ \checkmark$'
      - say: 'Therefore the area is 10 and two thirds square units, which is answer choice B.'
        write: '$\therefore$ Area $= 10\tfrac{2}{3}$ sq. units'
        answer: true
    traps:
      A: 'You went for $10\tfrac{1}{3}$. The working is right up to $\dfrac{32}{3}$. 3 into 32 goes 10 times, remainder 2, so it is $10\tfrac{2}{3}$.'
      C: 'You went for $20\tfrac{1}{3}$. That is far too big: the hump fits inside a rectangle 4 wide and 4 tall, of area 16. Upper minus lower gives $\dfrac{16}{3} - \left(-\dfrac{16}{3}\right) = \dfrac{32}{3}$.'
      D: 'You went for $20\tfrac{2}{3}$. That is more than the 4 by 4 rectangle round the hump, of area 16. Check each bracket: at 2 it is $\dfrac{16}{3}$, at minus 2 it is $-\dfrac{16}{3}$, so the area is $\dfrac{32}{3}$.'

  40:
    moments:
      - section: 'The question'
        say: 'Picture the street. The bar chart shows the colours of cars passing a point in two minutes. We want the fraction of all the cars that are yellow.'
        doodle: {name: 'custom:2001_q40_a', id: street, caption: 'every car passing in 2 minutes'}
        write: 'Fraction of cars that are yellow $= ?$'
        point:
          - {figure: 0, kind: circle, target: 'Yellow'}
      - section: 'Solution'
        say: 'Solution. The height of each bar is the frequency: the number of cars of that colour. The fraction is the yellow cars over the total, sigma f.'
        write: 'Fraction yellow $= \dfrac{\text{yellow cars}}{\Sigma f}$'
        point:
          - {figure: 0, kind: circle, target: 'No. of cars', text: 'f'}
      - say: 'Read the bars into a frequency table: yellow 3, white 4, red 8, green 2, blue 6 and black 2.'
        write: 'Yellow 3, White 4, Red 8, Green 2, Blue 6, Black 2'
        diagram: {id: t, kind: table, columns: [Colour, 'Frequency (f)'], rows: [[Yellow, 3], [White, 4], [Red, 8], [Green, 2], [Blue, 6], [Black, 2]]}
        point:
          - {figure: 0, kind: label, target: 'Yellow', text: '3'}
          - {figure: 0, kind: label, target: 'Red', text: '8'}
      - say: 'Now sigma f: add all six frequencies.'
        write: '$\Sigma f = 3 + 4 + 8 + 2 + 6 + 2$'
      - say: '3 plus 4 is 7, plus 8 is 15, plus 2 is 17, plus 6 is 23, plus 2 is 25 cars.'
        write: '$= 25$'
        diagram_do:
          - {id: t, op: total, part: 'col:2', 'on': '25 cars'}
        doodle_do:
          - {id: street, op: label, part: total, text: '25 cars'}
      - section: 'The fraction'
        say: 'Substitute: the yellow bar is 3, and sigma f is 25.'
        write: 'Fraction yellow $= \dfrac{3}{25}$'
        diagram_do:
          - {id: t, op: highlight, part: 'row:1', text: 'yellow: 3', 'on': 'yellow bar'}
        doodle_do:
          - {id: street, op: circle, part: yellow}
        point:
          - {line: 5, kind: move, from: {line: 4, at: '= 25'}, at: '25', text: 'Σf'}
      - say: 'Can it be simplified? 3 is prime, and 25 is 5 times 5. They have no common factor, so 3 over 25 is in its lowest terms.'
        write: 'H.C.F. of $3$ and $25$ $= 1$, so $\dfrac{3}{25}$ is in lowest terms'
        doodle_do:
          - {id: street, op: label, part: yellow, text: '3 of the 25'}
      - section: 'Check'
        say: 'Check by going back. 3 over 25 of the 25 cars is 3, the height of the yellow bar.'
        write: 'Check: $\dfrac{3}{25} \times 25 = 3\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the fraction of the cars that are yellow is 3 over 25, which is answer choice C.'
        write: '$\therefore$ fraction yellow $= \dfrac{3}{25}$'
        answer: true
    traps:
      A: 'You went for 4 over 15. That is the white bar over a total that stops at red. Use the yellow bar, 3, over all 25 cars.'
      B: 'You went for 1 over 5. That is 3 over 15, the yellow bar over only the first three bars. Sigma f includes all six bars: 25.'
      D: 'You went for 2 over 25. Sigma f, 25, is right, but 2 is the green or the black bar. The yellow bar is 3.'

  41:
    moments:
      - section: 'The question'
        say: 'Picture a taxi at the park. The histogram shows the number of passengers in the taxis at a motor park. We want the number of taxis with more than 4 passengers.'
        doodle: {name: 'custom:2001_q41_a', id: taxi, caption: 'more than 4 means 5 or more'}
        write: 'Taxis with more than $4$ passengers $= ?$'
      - section: 'Solution'
        say: 'Solution. A histogram''s bars stand on class boundaries. Passengers are whole numbers, so the bar from 0.5 to 2.5 holds the taxis with 1 or 2 passengers.'
        write: 'Boundaries $0.5$ to $2.5 \Rightarrow 1$ or $2$ passengers'
        point:
          - {figure: 0, kind: circle, target: '0.5'}
          - {figure: 0, kind: circle, target: '2.5'}
      - say: 'In the same way, 2.5 to 4.5 means 3 or 4 passengers, and 4.5 to 6.5 means 5 or 6.'
        write: 'Boundaries $2.5$ to $4.5 \Rightarrow 3$ or $4$; $4.5$ to $6.5 \Rightarrow 5$ or $6$'
      - say: 'Read the bars into a table: the class, its boundaries, and its frequency. The heights are 3, 4, 7, 5, 4 and 1 taxis.'
        write: 'Frequencies: $f = 3,\ 4,\ 7,\ 5,\ 4,\ 1$'
        diagram: {id: t, kind: table, columns: [Passengers, Boundaries, 'Taxis (f)'], rows: [['1–2', '0.5–2.5', 3], ['3–4', '2.5–4.5', 4], ['5–6', '4.5–6.5', 7], ['7–8', '6.5–8.5', 5], ['9–10', '8.5–10.5', 4], ['11–12', '10.5–12.5', 1]]}
        point:
          - {figure: 0, kind: circle, target: 'No. of taxis', text: 'f'}
      - section: 'More than 4 passengers'
        say: 'More than 4 passengers means 5 or more, like the five heads in this taxi. That starts at the boundary 4.5, so we take the class 5 to 6 and every class above it.'
        write: 'More than $4 \Rightarrow 5$ or more $\Rightarrow$ from $4.5$ upwards'
        doodle_do:
          - {id: taxi, op: circle, part: heads}
        point:
          - {figure: 0, kind: circle, target: '4.5', text: 'from here'}
      - say: 'Those are the last four rows of the table, with frequencies 7, 5, 4 and 1.'
        write: 'Number $= 7 + 5 + 4 + 1$'
        diagram_do:
          - {id: t, op: highlight, part: 'row:3', text: 'from 4.5 up', 'on': 'last four rows'}
      - say: '7 plus 5 is 12, plus 4 is 16, plus 1 is 17 taxis.'
        write: '$= 17$'
        doodle_do:
          - {id: taxi, op: label, part: taxi, text: '17 taxis like this'}
        point:
          - {line: 6, kind: highlight, at: '17', to: {doodle: taxi, part: taxi}}
      - section: 'Check'
        say: 'Check from the other side. All the taxis: sigma f is 24. Those with 4 or fewer passengers are 3 plus 4, which is 7. 24 minus 7 is 17.'
        write: 'Check: $\Sigma f = 24$; $24 - (3 + 4) = 17\ \checkmark$'
        diagram_do:
          - {id: t, op: total, part: 'col:3', 'on': 'is 24'}
      - section: 'Answer'
        say: 'Therefore 17 taxis have more than 4 passengers, which is answer choice D.'
        write: '$\therefore$ number of taxis $= 17$'
        answer: true
    traps:
      A: 'You went for 14. That is 3 plus 4 plus 7, the first three bars. More than 4 passengers means the bars from 4.5 upwards: 7, 5, 4 and 1.'
      B: 'You went for 15. Read the bars from 4.5 upwards carefully: 7, 5, 4 and 1, which add up to 17.'
      C: 'You went for 16. That is 7 plus 5 plus 4, which leaves out the last bar of 1 taxi. All the bars from 4.5 upwards make 17.'

  42:
    moments:
      - section: 'The question'
        say: 'A table of scores and their frequencies. We want the square of the mode. Table first, written down the page.'
        write: '$(\text{Mode})^{2} = ?$'
        diagram:
          id: t
          kind: table
          columns: ['x (score)', 'f']
          rows: [[4, 3], [7, 5], [8, 2], [11, 7], [13, 2], [8, 1]]
          'on': 'Table'
      - section: 'Solution'
        say: 'Solution. The mode is the value with the highest frequency. Picture each student as a dot stacked above the score.'
        write: 'Solution. Mode $=$ the value of $x$ with the highest $f$'
        doodle: {name: 'custom:2001_q42_a', id: stacks, caption: 'one dot per student'}
      - say: 'Careful: the score 8 is listed twice, with frequencies 2 and 1. Together that is 3, still not the highest.'
        write: '$x = 8$: $\ f = 2 + 1 = 3$'
        diagram_do:
          - {id: t, op: highlight, part: 'row:3', text: '8: f = 2'}
          - {id: t, op: highlight, part: 'row:6', text: '8: f = 1'}
        doodle_do:
          - {id: stacks, op: highlight, part: s8}
      - say: 'Down the $f$ column: 3, 5, 3, 7, 2. The highest frequency is 7, at the score 11.'
        write: 'Highest $f = 7$ at $x = 11$'
        diagram_do:
          - {id: t, op: highlight, part: 'row:4', text: 'highest f', 'on': 'highest'}
        doodle_do:
          - {id: stacks, op: circle, part: s11}
      - say: 'Therefore the mode is 11. The mode is the score, 11; the 7 only tells us how often it happened.'
        write: '$\therefore$ Mode $= 11$'
        doodle_do:
          - {id: stacks, op: label, part: s11, text: 'mode = 11'}
        point:
          - {line: 4, kind: highlight, at: '11', to: {diagram: t, part: 'row:4'}}
      - section: 'The square'
        say: 'Now square the mode: 11 squared.'
        write: '$(\text{Mode})^{2} = 11^{2}$'
      - say: '11 times 11 is 121.'
        write: '$= 11 \times 11 = 121$'
      - section: 'Check'
        say: 'Check: no other score comes near. The next highest frequency is 5, at the score 7, so 11 is the only mode.'
        write: 'Check: next highest $f = 5 < 7$ ✓'
      - section: 'Answer'
        say: 'So the square of the mode is 121, which is option D.'
        write: '$\therefore (\text{Mode})^{2} = 121$'
        answer: true
    traps:
      A: 'You went for 25. That is 5 squared, and 5 is a frequency, not a score. The mode is the score with the highest frequency: 11, and 11 squared is 121.'
      B: 'You went for 49. That is 7 squared, but 7 is the highest frequency. The score it belongs to is 11, and 11 squared is 121.'
      C: 'You went for 64. That is 8 squared. The score 8 is listed twice, but its total frequency is only 2 plus 1, which is 3. The score 11 happens 7 times.'

  43:
    moments:
      - section: 'The question'
        say: 'The same table of scores and frequencies. Now we want the mean score. Every statistics answer starts with a table, with a column for $fx$.'
        write: 'Mean $= ?$'
        diagram:
          id: t
          kind: table
          columns: ['x', 'f', 'fx']
          rows: [[4, 3, ''], [7, 5, ''], [8, 2, ''], [11, 7, ''], [13, 2, ''], [8, 1, '']]
          'on': 'table'
      - section: 'Solution'
        say: 'Solution. $x$ is the score and $f$ its frequency. Each score must count as often as it happens, so we multiply: $f$ times $x$.'
        write: 'Solution'
      - section: 'The fx column'
        say: 'The $fx$ column. 4 times 3 is 12. 7 times 5 is 35. 8 times 2 is 16.'
        write: '$fx$: $\ 4 \times 3 = 12,\ 7 \times 5 = 35,\ 8 \times 2 = 16$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,3', text: '12'}
          - {id: t, op: fill, part: 'cell:2,3', text: '35'}
          - {id: t, op: fill, part: 'cell:3,3', text: '16'}
      - say: '11 times 7 is 77. 13 times 2 is 26. The second 8, times 1, is 8.'
        write: '$11 \times 7 = 77,\ 13 \times 2 = 26,\ 8 \times 1 = 8$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:4,3', text: '77'}
          - {id: t, op: fill, part: 'cell:5,3', text: '26'}
          - {id: t, op: fill, part: 'cell:6,3', text: '8'}
      - say: 'Add down the $f$ column. 3 plus 5 is 8, plus 2 is 10, plus 7 is 17, plus 2 is 19, plus 1 is 20.'
        write: '$\sum f = 20$'
        diagram_do:
          - {id: t, op: total, part: 'col:2', 'on': 'Add'}
      - say: 'Add down the $fx$ column. 12 plus 35 is 47, plus 16 is 63, plus 77 is 140, plus 26 is 166, plus 8 is 174.'
        write: '$\sum fx = 174$'
        diagram_do:
          - {id: t, op: total, part: 'col:3', 'on': 'Add'}
      - section: 'The mean'
        say: 'The mean, $x$ bar, is the sum of $fx$ over the sum of $f$.'
        write: '$\bar{x} = \dfrac{\sum fx}{\sum f}$'
      - say: 'Substitute: 174 over 20.'
        write: '$= \dfrac{174}{20}$'
        point:
          - {line: 7, kind: move, from: {line: 5, at: '174'}, at: '20[[174]]', text: 'Σfx'}
          - {line: 7, kind: move, from: {line: 4, at: '20'}, at: '[[20]]174', text: 'Σf'}
      - say: '174 divided by 20: 20 eights are 160, leaving 14, and 14 over 20 is 0.7. Picture the blocks on a plank: they balance at 8.7.'
        write: '$\therefore \bar{x} = 8.7$'
        doodle: {name: 'custom:2001_q43_a', id: plank, caption: 'the mean is the balance point'}
        doodle_do:
          - {id: plank, op: label, part: pivot, text: 'balances at 8.7'}
      - section: 'Check'
        say: 'Check: 20 times 8.7 is 174, the sum of $fx$.'
        write: 'Check: $20 \times 8.7 = 174$ ✓'
      - section: 'Answer'
        say: 'So the mean score is 8.7, which is option C.'
        write: '$\therefore$ Mean $= 8.7$'
        answer: true
    traps:
      A: 'You went for 11.0. That is the mode, the score with the highest frequency. The mean is the sum of $fx$ over the sum of $f$: 174 over 20, which is 8.7.'
      B: 'You went for 9.5. Check the totals: the sum of $fx$ is 174 and the sum of $f$ is 20, so the mean is 8.7.'
      D: 'You went for 7.0. That is too low. 174 divided by 20 is 8.7. Make sure every product, like 11 times 7 is 77, is in the $fx$ column.'

  44:
    moments:
      - section: 'The question'
        say: 'Six fractions: 1 over 6, 1 over 3, 3 over 2, 2 over 3, 8 over 9 and 4 over 3. We want their range.'
        write: 'Range of $\tfrac{1}{6},\ \tfrac{1}{3},\ \tfrac{3}{2},\ \tfrac{2}{3},\ \tfrac{8}{9},\ \tfrac{4}{3}$'
        doodle: {name: 'custom:2001_q44_a', id: line, caption: 'lowest to highest'}
      - section: 'Solution'
        say: 'Solution. The range is the highest value minus the lowest.'
        write: 'Range $=$ highest $-$ lowest'
      - say: 'To compare fractions, put them over one denominator. The denominators are 6, 3, 2, 3, 9 and 3, and their L.C.M. is 18.'
        write: 'L.C.M. of $6, 3, 2, 9 = 18$'
      - say: '1 over 6 is 3 over 18. 1 over 3 is 6 over 18. 3 over 2 is 27 over 18.'
        write: '$\tfrac{1}{6} = \tfrac{3}{18},\ \tfrac{1}{3} = \tfrac{6}{18},\ \tfrac{3}{2} = \tfrac{27}{18}$'
      - say: '2 over 3 is 12 over 18. 8 over 9 is 16 over 18. 4 over 3 is 24 over 18.'
        write: '$\tfrac{2}{3} = \tfrac{12}{18},\ \tfrac{8}{9} = \tfrac{16}{18},\ \tfrac{4}{3} = \tfrac{24}{18}$'
      - say: 'Now compare the numerators: 3, 6, 27, 12, 16 and 24. The highest is 27, from 3 over 2.'
        write: 'Highest $= \tfrac{27}{18} = \tfrac{3}{2}$'
        doodle_do:
          - {id: line, op: circle, part: big}
      - say: 'The lowest numerator is 3, from 1 over 6.'
        write: 'Lowest $= \tfrac{3}{18} = \tfrac{1}{6}$'
        doodle_do:
          - {id: line, op: circle, part: small}
      - say: 'Substitute: 3 over 2 minus 1 over 6.'
        write: 'Range $= \tfrac{3}{2} - \tfrac{1}{6}$'
      - say: 'The L.C.M. of 2 and 6 is 6. 3 over 2 is 9 over 6, and 9 minus 1 is 8. So 8 over 6.'
        write: '$= \dfrac{9 - 1}{6} = \dfrac{8}{6}$'
      - say: 'Reduce to lowest terms: divide the top and the bottom by 2. That gives 4 over 3.'
        write: '$\therefore$ Range $= \dfrac{4}{3}$'
        doodle_do:
          - {id: line, op: label, part: gap, text: '4/3'}
      - section: 'Check'
        say: 'Check: start from the lowest, 1 over 6, and add the range. 1 over 6 plus 8 over 6 is 9 over 6, which is 3 over 2, the highest.'
        write: 'Check: $\tfrac{1}{6} + \tfrac{8}{6} = \tfrac{9}{6} = \tfrac{3}{2}$ ✓'
      - section: 'Answer'
        say: 'So the range is 4 over 3, which is option A.'
        write: '$\therefore$ Range $= \tfrac{4}{3}$'
        answer: true
    traps:
      B: 'You went for 7 over 6. That is 4 over 3 minus 1 over 6, taking 4 over 3 as the highest. 3 over 2 is bigger: 27 over 18 against 24 over 18.'
      C: 'You went for 5 over 6. That is 3 over 2 minus 2 over 3, which uses the wrong lowest value. The lowest is 1 over 6.'
      D: 'You went for 3 over 4. The highest is 3 over 2 and the lowest is 1 over 6, and 9 over 6 minus 1 over 6 is 8 over 6, which is 4 over 3.'

  45:
    moments:
      - section: 'The question'
        say: 'Six numbers: 2, 6, 8, 6, 2 and 6. We want their variance: how spread out they are about the mean.'
        write: 'Variance of $2, 6, 8, 6, 2, 6$'
        doodle: {name: 'custom:2001_q45_a', id: dots, caption: 'how spread out?'}
      - section: 'Solution'
        say: 'Solution. Some values repeat, so we use a frequency table. The variance is the sum of $f$ times the squared deviation, over the sum of $f$.'
        write: 'Variance $= \dfrac{\sum f(x - \bar{x})^{2}}{\sum f}$'
      - section: 'The mean'
        say: 'The table. Count each value: 2 appears twice, 6 three times, and 8 once.'
        write: '$f$: $\ 2 \to 2,\ 6 \to 3,\ 8 \to 1$'
        diagram:
          id: t
          kind: table
          size: scene
          columns: ['x', 'f', 'fx', 'x − x̄', '(x − x̄)²', 'f(x − x̄)²']
          rows: [[2, 2, '', '', '', ''], [6, 3, '', '', '', ''], [8, 1, '', '', '', '']]
          'on': 'table'
      - say: 'The $fx$ column: 2 times 2 is 4, 6 times 3 is 18, and 8 times 1 is 8.'
        write: '$2 \times 2 = 4,\ 6 \times 3 = 18,\ 8 \times 1 = 8$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,3', text: '4'}
          - {id: t, op: fill, part: 'cell:2,3', text: '18'}
          - {id: t, op: fill, part: 'cell:3,3', text: '8'}
      - say: 'Add the $f$ column: 6. Add the $fx$ column: 4 plus 18 plus 8 is 30.'
        write: '$\sum f = 6,\ \ \sum fx = 30$'
        diagram_do:
          - {id: t, op: total, part: 'col:2'}
          - {id: t, op: total, part: 'col:3'}
      - say: 'The mean, $x$ bar, is the sum of $fx$ over the sum of $f$: 30 over 6, which is 5.'
        write: '$\bar{x} = \dfrac{\sum fx}{\sum f} = \dfrac{30}{6} = 5$'
        doodle_do:
          - {id: dots, op: stage, stage: 'custom:2001_q45_a2'}
      - section: 'The deviations'
        say: 'Now each value minus the mean. 2 minus 5 is minus 3, 6 minus 5 is 1, and 8 minus 5 is 3.'
        write: '$2 - 5 = -3,\ 6 - 5 = 1,\ 8 - 5 = 3$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,4', text: '−3'}
          - {id: t, op: fill, part: 'cell:2,4', text: '1'}
          - {id: t, op: fill, part: 'cell:3,4', text: '3'}
      - say: 'Square them: minus 3 squared is 9, 1 squared is 1, and 3 squared is 9.'
        write: '$(-3)^{2} = 9,\ 1^{2} = 1,\ 3^{2} = 9$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,5', text: '9'}
          - {id: t, op: fill, part: 'cell:2,5', text: '1'}
          - {id: t, op: fill, part: 'cell:3,5', text: '9'}
      - say: 'Times $f$: 2 times 9 is 18, 3 times 1 is 3, and 1 times 9 is 9. Don''t forget to multiply by $f$.'
        write: '$2 \times 9 = 18,\ 3 \times 1 = 3,\ 1 \times 9 = 9$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,6', text: '18'}
          - {id: t, op: fill, part: 'cell:2,6', text: '3'}
          - {id: t, op: fill, part: 'cell:3,6', text: '9'}
      - say: 'Add the last column: 18 plus 3 plus 9 is 30.'
        write: '$\sum f(x - \bar{x})^{2} = 30$'
        diagram_do:
          - {id: t, op: total, part: 'col:6', 'on': 'Add'}
      - section: 'The variance'
        say: 'Substitute: 30 over 6, which is 5.'
        write: '$\therefore$ Variance $= \dfrac{30}{6} = 5$'
      - section: 'Check'
        say: 'Check with the other formula: sigma $fx$ squared over sigma $f$, minus $x$ bar squared. $fx$ squared adds to 8 plus 108 plus 64, 180. 180 over 6 is 30, and 30 minus 25 is 5.'
        write: 'Check: $\dfrac{\sum fx^{2}}{\sum f} - \bar{x}^{2} = \dfrac{180}{6} - 5^{2} = 30 - 25 = 5$ ✓'
      - section: 'Answer'
        say: 'So the variance is 5, which is option C.'
        write: '$\therefore$ Variance $= 5$'
        answer: true
    traps:
      A: 'You went for root 5. That is the standard deviation, the square root of the variance. The question asks for the variance itself, which is 5.'
      B: 'You went for root 6. The variance has no square root: the sum, 30, over $\sum f$, 6, is 5.'
      D: 'You went for 6. That divides 30 by 5 instead of 6. There are six values, so $\sum f$ is 6 and the variance is 30 over 6, which is 5.'

  46:
    moments:
      - section: 'The question'
        say: 'The ogive, the cumulative frequency curve, of the masses of fertilizer for 48 workers. We want the expression that gives the interquartile range.'
        write: 'Interquartile range $= ?$'
        point:
          - {figure: 0, kind: circle, target: 'cumulative frequency', text: 'ogive'}
      - section: 'Solution'
        say: 'Solution. The total frequency, $N$, is 48. The quartiles cut the ordered data into four equal parts, each holding a quarter of the workers.'
        write: 'Solution. $N = 48$'
        point:
          - {figure: 0, kind: circle, target: '48', text: 'N = 48'}
        doodle: {name: person-small, id: workers, repeat: 48, layout: grid, caption: '48 workers in order'}
      - say: 'The lower quartile, $Q_1$, is read at $N$ over 4 on the cf axis: 48 over 4 is 12.'
        write: '$Q_{1}$: at $\dfrac{N}{4} = \dfrac{48}{4} = 12$'
        point:
          - {figure: 0, kind: circle, target: 'Q₁'}
        doodle_do:
          - {id: workers, op: group, n: 12, text: '12 below Q1'}
      - say: 'The median, $Q_2$, is read at $N$ over 2: 48 over 2 is 24.'
        write: '$Q_{2}$ (median): at $\dfrac{N}{2} = \dfrac{48}{2} = 24$'
        point:
          - {figure: 0, kind: circle, target: 'Q₂'}
        doodle_do:
          - {id: workers, op: group, n: 24, text: '24 below Q2'}
      - say: 'The upper quartile, $Q_3$, is read at 3 $N$ over 4: 3 times 48 over 4 is 36.'
        write: '$Q_{3}$: at $\dfrac{3N}{4} = \dfrac{3 \times 48}{4} = 36$'
        point:
          - {figure: 0, kind: circle, target: 'Q₃'}
        doodle_do:
          - {id: workers, op: group, n: 36, text: '36 below Q3'}
      - section: 'The definition'
        say: 'The interquartile range is the spread of the middle half of the data: from the lower quartile to the upper quartile, 12th to 36th, which is 24 of the 48.'
        write: 'Middle half: $Q_{1}$ to $Q_{3}$ ($36 - 12 = 24 = \tfrac{1}{2} \times 48$)'
        doodle_do:
          - {id: workers, op: label, text: 'Q1 to Q3: the middle 24'}
      - say: 'Its length is the upper quartile minus the lower quartile.'
        write: '$\therefore$ Interquartile range $= Q_{3} - Q_{1}$'
        point:
          - {figure: 0, kind: highlight, target: ['Q₁', 'Q₃'], text: 'middle half'}
      - section: 'Check'
        say: 'Check: half of it is a different measure, the semi-interquartile range. The question asks for the interquartile range itself.'
        write: 'Check: semi-interquartile range $= \tfrac{1}{2}(Q_{3} - Q_{1})$, not asked'
      - section: 'Answer'
        say: 'So the interquartile range is $Q_3$ minus $Q_1$, which is option A.'
        write: '$\therefore$ Interquartile range $= Q_{3} - Q_{1}$'
        answer: true
    traps:
      B: 'You went for $Q_3$ minus $Q_2$. That covers only one quarter of the data, from the median to the upper quartile. The interquartile range covers the middle half, $Q_1$ to $Q_3$.'
      C: 'You went for $Q_2$ minus $Q_1$. That is just one quarter of the data, from the lower quartile to the median. The interquartile range goes from $Q_1$ to $Q_3$.'
      D: 'You went for a half of $Q_3$ minus $Q_1$. That is the semi-interquartile range, a different measure. The interquartile range itself is $Q_3$ minus $Q_1$.'

  47:
    moments:
      - section: 'The question'
        say: 'We want the number of ways of selecting 8 subjects from 12. Selecting means order does not matter: Maths then English is the same choice as English then Maths. So we use combinations.'
        write: 'Select $8$ subjects from $12$: order does not matter'
        doodle: {name: book-small, id: books, repeat: 12, layout: row, caption: 'any 8 of the 12 subjects'}
        doodle_do:
          - {id: books, op: group, n: 8, text: 'these 8, in any order', 'on': 'English then Maths'}
      - section: 'Solution'
        say: 'Solution. Write the givens: $n$, the number to choose from, is 12; $r$, the number chosen, is 8.'
        write: 'Solution: $n = 12,\ r = 8$'
      - say: 'The number of combinations of $r$ things from $n$ is $n$ C $r$: $n$ factorial over $r$ factorial times $n - r$ factorial.'
        write: '$^{n}C_{r} = \dfrac{n!}{(n - r)!\,r!}$'
      - say: 'Substitute. 12 minus 8 is 4.'
        write: '$^{12}C_{8} = \dfrac{12!}{(12 - 8)!\,8!} = \dfrac{12!}{4!\,8!}$'
      - say: '12 factorial is 12 times 11 times 10 times 9, times 8 factorial. The 8 factorial cancels with the one underneath.'
        write: '$= \dfrac{12 \times 11 \times 10 \times 9 \times 8!}{4! \times 8!} = \dfrac{12 \times 11 \times 10 \times 9}{4 \times 3 \times 2 \times 1}$'
      - say: 'Cancel before multiplying. 4 times 3 is 12, which cancels the 12 on top. 10 divided by 2 is 5.'
        write: '$= 11 \times 5 \times 9$'
      - say: '11 times 5 is 55, and 55 times 9 is 495.'
        write: '$= 55 \times 9 = 495$'
      - say: 'Therefore there are 495 ways.'
        write: '$\therefore\ ^{12}C_{8} = 495$ ways'
      - section: 'Check'
        say: 'Check the long way. 12 times 11 times 10 times 9 is 11,880, and 4 factorial is 24. 11,880 divided by 24 is 495.'
        write: 'Check: $\dfrac{11880}{24} = 495\ \checkmark$'
      - say: 'Therefore there are 495 ways, which is answer choice C.'
        write: '$\therefore\ 495$ ways'
        answer: true
        doodle_do:
          - {id: books, op: label, text: '495 ways to pick 8'}
    traps:
      A: 'You went for 498. Check the division: 24 times 495 is 11,880 exactly, so the answer is 495.'
      B: 'You went for 496. Close, but cancelling first gives 11 times 5 times 9, which is exactly 495.'
      D: 'You went for 490. Check: 24 times 490 is 11,760, not 11,880. The answer is 495.'

  48:
    moments:
      - section: 'The question'
        say: '6 P $r$ is 6. Find 6 P $r$ plus 1. First find $r$, then use it.'
        write: '${}^{6}P_{r} = 6$: find ${}^{6}P_{r+1}$'
      - say: 'Solution. n P r is n factorial over n minus r factorial. Picture the places to fill: the first place has 6 choices, the next 5, and so on.'
        write: 'Solution: ${}^{n}P_{r} = \dfrac{n!}{(n - r)!}$'
        doodle: {name: 'custom:2001_q48_a', id: places, caption: 'one place, 6 choices'}
      - section: 'Find r'
        say: 'Put n equal to 6, and set it equal to 6, as the question says.'
        write: '$\dfrac{6!}{(6 - r)!} = 6$'
      - say: 'Multiply both sides by 6 minus r factorial, and divide both sides by 6.'
        write: '$(6 - r)! = \dfrac{6!}{6}$'
      - say: '6 factorial is 6 times 5 factorial, so 6 factorial over 6 is 5 factorial.'
        write: '$(6 - r)! = \dfrac{6 \times 5!}{6} = 5!$'
      - say: 'The factorials match, so 6 minus $r$ is 5. Therefore $r$ is 1: just one place, like the picture.'
        write: '$6 - r = 5 \Rightarrow r = 1$'
        doodle_do:
          - {id: places, op: label, part: first, text: 'r = 1: one place'}
      - section: 'Find 6P(r + 1)'
        say: '$r$ plus 1 is 2, so we want 6 P 2.'
        write: '${}^{6}P_{r+1} = {}^{6}P_{2} = \dfrac{6!}{(6 - 2)!} = \dfrac{6!}{4!}$'
      - say: 'Expand 6 factorial only down to 4 factorial: 6 times 5 times 4 factorial. The 4 factorials cancel.'
        write: '$= \dfrac{6 \times 5 \times 4!}{4!}$'
      - say: 'That leaves 6 times 5, which is 30: two places, 6 choices for the first and 5 for the second.'
        write: '$= 6 \times 5 = 30$'
        doodle_do:
          - {id: places, op: stage, stage: 'custom:2001_q48_a2'}
          - {id: places, op: label, part: second, text: '6 × 5 = 30'}
        point:
          - {line: 8, kind: highlight, at: '= 30', to: {doodle: places, part: second}}
      - section: 'Check'
        say: 'Check $r$: 6 P 1 is 6 factorial over 5 factorial, which is 6. That matches the question.'
        write: 'Check: ${}^{6}P_{1} = \dfrac{6!}{5!} = 6\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore 6 P $r$ plus 1 is 30: option B.'
        write: '$\therefore {}^{6}P_{r+1} = 30$'
        answer: true
    traps:
      A: 'You went for 15. That is 6 C 2, a selection. Permutations count the order too: 6 P 2 is 6 factorial over 4 factorial, which is 6 times 5, 30.'
      C: 'You went for 33. 6 P 2 is 6 factorial over 4 factorial. Cancel the 4 factorials and 6 times 5 is left: 30.'
      D: 'You went for 35. First find r: 6 P 1 is 6, so r is 1. Then 6 P 2 is 6 times 5, which is 30.'

  49:
    moments:
      - section: 'The question'
        say: 'A bowl of beads: 1 blue, 2 black, 4 yellow, 5 white and 3 brown. One bead is picked at random. What is the probability that it is blue or white?'
        write: '$P(\text{blue or white}) = ?$'
        doodle: {name: 'custom:2001_q49_a', id: bowl, caption: '15 beads: 1 blue, 5 white'}
      - say: 'Solution. Let $B$ be the event "a blue bead" and $W$ "a white bead". Copy the table first.'
        write: 'Solution: let $B$ = blue, $W$ = white'
        diagram:
          id: f
          kind: table
          'on': 'table'
          columns: ['Colour', 'No. of beads']
          rows: [[Blue, 1], [Black, 2], [Yellow, 4], [White, 5], [Brown, 3]]
      - section: 'The sample space'
        say: 'Every bead is equally likely. n of $S$ is the total: 1 plus 2 plus 4 plus 5 plus 3, which is 15.'
        write: '$n(S) = 1 + 2 + 4 + 5 + 3 = 15$'
        diagram_do:
          - {id: f, op: total, part: 'col:2', text: '15'}
        doodle_do:
          - {id: bowl, op: label, part: bowl, text: '15 beads'}
      - section: 'Each event'
        say: 'P of $B$: 1 blue bead out of 15. P of $W$: 5 white beads out of 15.'
        write: '$P(B) = \dfrac{1}{15},\quad P(W) = \dfrac{5}{15}$'
        diagram_do:
          - {id: f, op: highlight, part: 'row:1'}
          - {id: f, op: highlight, part: 'row:4'}
        doodle_do:
          - {id: bowl, op: circle, part: blue}
          - {id: bowl, op: circle, part: white}
      - section: 'The addition rule'
        say: 'A bead cannot be blue and white at once: the events are mutually exclusive. So P of $B$ or $W$ is P of $B$ plus P of $W$.'
        write: '$P(B \text{ or } W) = P(B) + P(W)$'
      - say: 'Substitute: 1 over 15 plus 5 over 15.'
        write: '$= \dfrac{1}{15} + \dfrac{5}{15}$'
      - say: '1 plus 5 is 6, over the same 15.'
        write: '$= \dfrac{6}{15}$'
      - say: 'Both 6 and 15 divide by 3. 6 divided by 3 is 2, and 15 divided by 3 is 5.'
        write: '$= \dfrac{6 \div 3}{15 \div 3} = \dfrac{2}{5}$'
      - section: 'Check'
        say: 'Check by counting: the blue and white beads together are 1 plus 5, which is 6 of the 15. 6 over 15 is 2 over 5.'
        write: 'Check: $\dfrac{1 + 5}{15} = \dfrac{6}{15} = \dfrac{2}{5}\ \checkmark$'
        doodle_do:
          - {id: bowl, op: label, part: white, text: '6 of the 15'}
      - section: 'Answer'
        say: 'Therefore the probability that the bead is blue or white is 2 over 5: option C.'
        write: '$\therefore P(B \text{ or } W) = \dfrac{2}{5}$'
        answer: true
    traps:
      A: 'You went for 1 over 15. That is P of B, the blue bead alone. "Or" adds the white beads too: 1 over 15 plus 5 over 15 is 6 over 15.'
      B: 'You went for 1 over 3. That is 5 over 15, P of W alone. Add the 1 blue bead to get 6 over 15, which is 2 over 5.'
      D: 'You went for 7 over 15. Blue and white together are 1 plus 5, which is 6, not 7. So it is 6 over 15, which is 2 over 5.'

  50:
    moments:
      - section: 'The question'
        say: 'Teams $P$ and $Q$ play a football match. What is the probability that the game ends in a draw? Picture the scoreboard. First, list every possible result.'
        write: 'Find $P(\text{draw})$'
        doodle: {name: 'custom:2001_q50_a', id: match, caption: 'win, draw or lose'}
      - say: 'Solution. Let $E$ be the event that the game ends in a draw.'
        write: 'Solution: let $E$ = a draw'
      - section: 'The sample space'
        say: 'How can a football match end? Team $P$ can win.'
        write: 'Result 1: $P$ wins'
        doodle_do:
          - {id: match, op: stage, stage: 'custom:2001_q50_a2'}
      - say: 'Team $Q$ can win.'
        write: 'Result 2: $Q$ wins'
        doodle_do:
          - {id: match, op: stage, stage: 'custom:2001_q50_a3'}
      - say: 'Or the game can end level. That is a draw.'
        write: 'Result 3: draw'
        doodle_do:
          - {id: match, op: stage, stage: 'custom:2001_q50_a4'}
      - say: 'So the sample space has 3 results. We know nothing about either team, so we treat them as equally likely. n of $S$ is 3.'
        write: '$S = \{P \text{ wins},\ Q \text{ wins},\ \text{draw}\}$, $\ n(S) = 3$'
      - section: 'The favourable outcome'
        say: 'Only one of those results is a draw. n of $E$ is 1.'
        write: '$n(E) = 1$'
        doodle_do:
          - {id: match, op: circle, part: draw}
      - section: 'The probability'
        say: 'The probability of $E$ is n of $E$ over n of $S$: the number of favourable outcomes over the total number of possible outcomes.'
        write: '$P(E) = \dfrac{n(E)}{n(S)}$'
      - say: 'Substitute: 1 over 3.'
        write: '$= \dfrac{1}{3}$'
        doodle_do:
          - {id: match, op: label, part: draw, text: '1 of the 3'}
        point:
          - {line: 8, kind: move, from: {line: 6, at: '= 1'}, at: '3[[1]]', text: 'n(E)'}
          - {line: 8, kind: move, from: {line: 5, at: 'n(S) = 3'}, at: '[[3]]1', text: 'n(S)'}
      - section: 'Check'
        say: 'Check: the three results are equally likely, so each has probability 1 over 3, and the three add up to 1.'
        write: 'Check: $\dfrac{1}{3} + \dfrac{1}{3} + \dfrac{1}{3} = 1\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the probability of a draw is 1 over 3: option B.'
        write: '$\therefore P(\text{draw}) = \dfrac{1}{3}$'
        answer: true
    traps:
      A: 'You went for 1 over 4. n of S is 3, not 4: P wins, Q wins, or a draw.'
      C: 'You went for 1 over 2. That counts only two results, one team winning or the other, and forgets the draw itself. n of S is 3.'
      D: 'You went for 2 over 3. That is P of E complement, NOT a draw: P wins or Q wins. A draw is 1 result out of 3.'
