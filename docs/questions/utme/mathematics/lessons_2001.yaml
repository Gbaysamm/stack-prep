        write: '$L = \dfrac{60}{360} \times 2\pi r$'
      - section: 'Simplify'
        say: '60 over 360 is 1 over 6.'
        write: '$= \dfrac{1}{6} \times 2\pi r = \dfrac{2\pi r}{6}$'
      - say: 'Divide top and bottom by 2: pi $r$ over 3.'
        write: '$= \dfrac{\pi r}{3}$'
      - say: 'Therefore the arc $ST$ is pi $r$ over 3.'
        write: '$\therefore$ arc $ST = \dfrac{\pi r}{3}$'
        point:
          - {figure: sketch_b, kind: label, target: 'arc ST = ?', text: 'πr/3', 'on': 'Therefore'}
      - section: 'Check'
        say: 'Check: 6 chords like $ST$ go exactly round the circle, 6 times 60 degrees is 360. So 6 arcs of pi $r$ over 3 must make the whole circumference, 2 pi $r$.'
        write: 'Check: $6 \times \dfrac{\pi r}{3} = 2\pi r$ ✓'
      - section: 'Answer'
        say: 'So the arc is pi $r$ over 3, which is answer choice B.'
        write: '$\therefore$ arc $ST = \dfrac{\pi r}{3}$ (B)'
        answer: true
    traps:
