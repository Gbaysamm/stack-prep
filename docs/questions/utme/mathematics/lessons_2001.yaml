          - {figure: sketch, kind: circle, target: '30°'}
      - say: '$P$ is equidistant from $Q$ and $R$, so $PQ$ equals $PR$, which is 8 centimetres.'
        write: '$|PQ| = |PR| = 8$ cm (given)'
        point:
          - {figure: sketch, kind: highlight, target: PQ}
          - {figure: sketch, kind: highlight, target: PR}
      - say: 'The locus of points equidistant from $Q$ and $R$ is the perpendicular bisector of $QR$. So $P$ lies on it, and it meets $QR$ at its midpoint $M$, at right angles.'
        write: '$P$ on the $\perp$ bisector of $QR$: $|QM| = |MR|$, $\angle PMR = 90^{\circ}$'
        point:
          - {figure: sketch, kind: circle, target: M, text: 'midpoint'}
          - {figure: sketch, kind: arc, target: PMR, text: '90°'}
      - say: 'In the right-angled triangle $PMR$, $MR$ is adjacent to the 30 degrees and $PR$ is the hypotenuse. SOH CAH TOA: adjacent and hypotenuse, so we use cosine.'
        write: 'In $\triangle PMR$: $\cos 30^{\circ} = \dfrac{|MR|}{|PR|}$ (CAH)'
        point:
          - {figure: sketch, kind: highlight, target: MR, text: 'adj'}
          - {figure: sketch, kind: highlight, target: PR, text: 'hyp'}
      - say: 'Substitute $PR$ equals 8.'
        write: '$\cos 30^{\circ} = \dfrac{|MR|}{8}$'
      - say: 'Multiply both sides by 8. Cos 30 degrees is root 3 over 2.'
        write: '$|MR| = 8\cos 30^{\circ} = 8 \times \dfrac{\sqrt{3}}{2}$'
      - say: '8 divided by 2 is 4, so $MR$ is 4 root 3 centimetres.'
        write: '$|MR| = 4\sqrt{3}$ cm'
      - say: '$M$ is the midpoint of $QR$, so $QR$ is twice $MR$.'
        write: '$|QR| = 2 \times |MR| = 2 \times 4\sqrt{3} = 8\sqrt{3}$ cm'
        point:
          - {figure: sketch, kind: label, target: 'QR = ?', text: '8√3 cm'}
      - section: 'Check'
        say: 'Check with the cosine rule. The base angles are both 30 degrees, so the angle at $P$ is 180 minus 60, which is 120 degrees.'
        write: 'Check: $\angle QPR = 180^{\circ} - 30^{\circ} - 30^{\circ} = 120^{\circ}$ (angle sum of $\triangle$)'
        point:
          - {figure: sketch, kind: arc, target: QPR, text: '120°'}
      - say: 'The cosine rule: $QR$ squared is 8 squared plus 8 squared, minus 2 times 8 times 8 times cos 120 degrees. Cos 120 degrees is negative a half.'
        write: '$|QR|^{2} = 8^{2} + 8^{2} - 2(8)(8)\cos 120^{\circ} = 64 + 64 + 64 = 192$'
      - say: '192 is 64 times 3, so $QR$ is 8 root 3. The same answer.'
        write: '$|QR| = \sqrt{192} = \sqrt{64 \times 3} = 8\sqrt{3}\ \checkmark$'
