# UTME 2001 Mathematics — lessons for the board (version 2).
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_2001.yaml. Answers match that file.
format_version: 1
exam_year: 2001
lessons:
  1:
    moments:
      - say: 'We want the principal that grows to ₦5,000 at simple interest, over 5 years, at 2% per annum. "Amounts to" means ₦5,000 is where the money finishes, not where it starts.'
        write: 'Amount $A = 5000$, rate $2\%$, time $5$ years'
      - say: 'With simple interest, the interest is the same every single year, because it is always worked out on the original principal $P$.'
        write: 'Interest each year $= 2\%$ of $P$'
      - say: 'Over 5 years, that is 2% five times. 2 times 5 is 10, so the total interest is 10% of the principal.'
        write: 'Total interest $= 2\% \times 5 = 10\%$ of $P$'
      - say: '10% means 10 over 100, which is 0.1. So the interest is $0.1P$.'
        write: '$10\% \text{ of } P = \dfrac{10}{100} \times P = 0.1P$'
      - say: 'The amount is the principal plus the interest. So the amount is $P$ plus $0.1P$.'
        write: 'Amount $= P + 0.1P$'
      - say: '$P$ is the same as 1 $P$. 1 plus 0.1 is 1.1, so the amount is $1.1P$.'
        write: '$= 1.1P$'
      - say: 'Now go back to what the question told us: the amount is ₦5,000. So $1.1P$ equals 5000.'
        write: '$1.1P = 5000$'
        point:
          - { line: 0, kind: underline, at: 'A = 5000', text: 'given' }
          - { line: 5, kind: arrow, text: 'amount' }
      - say: 'How do we get $P$ by itself? We divide both sides by 1.1.'
        write: '$P = \dfrac{5000}{1.1}$'
      - say: 'To clear the decimal, multiply the top and the bottom by 10. That gives 50,000 over 11.'
        write: '$= \dfrac{50000}{11}$'
      - say: '50,000 divided by 11 is 4545.4545 and so on. To the nearest kobo, that is 4545.45.'
        write: '$= 4545.4545\ldots \approx 4545.45$'
      - say: 'Let''s check it. 10% of 4545.45 is about 454.55, and 4545.45 plus 454.55 is 5000. It works.'
        write: 'Check: $10\%$ of $4545.45 \approx 454.55$, and $4545.45 + 454.55 = 5000$'
      - say: 'So the principal is ₦4,545.45, which is answer choice D.'
        write: 'Principal $=$ ₦4,545.45'
        answer: true
    traps:
      A: 'You went for ₦5,000. That''s the amount at the end, after the interest has been added. If ₦5,000 were the principal, it would grow to ₦5,500. Divide 5000 by 1.1 instead.'
      B: 'You went for ₦4,900. Check it: 10% of 4900 is 490, and 4900 plus 490 is 5390, not 5000. The principal is 5000 divided by 1.1.'
      C: 'You went for ₦4,800. Check it: 10% of 4800 is 480, and 4800 plus 480 is 5280, not 5000. The principal is 5000 divided by 1.1.'

  2:
    moments:
      - say: 'A dealer buys a car for ₦250,000, spends ₦70,000 refurbishing it, and sells it for ₦400,000. We want his percentage gain.'
        write: 'Bought ₦250,000, refurbishing ₦70,000, sold ₦400,000'
      - say: 'Percentage gain is always measured against what the car really cost him. He spent money twice: once buying it, and again fixing it. So both go into the cost.'
        write: 'Cost $=$ buying price $+$ refurbishing'
      - say: 'Put in the numbers: 250,000 plus 70,000.'
        write: '$= 250{,}000 + 70{,}000$'
      - say: '250,000 plus 70,000 is 320,000. That is his total cost.'
        write: '$= 320{,}000$'
      - say: 'Now the profit. That is what he sold it for, minus the total cost we just found.'
        write: 'Profit $=$ selling price $-$ cost'
      - say: 'The selling price is 400,000 and the cost is 320,000.'
        write: '$= 400{,}000 - 320{,}000$'
        point:
          - { line: 3, kind: arrow, text: 'cost' }
      - say: '400,000 minus 320,000 is 80,000.'
        write: '$= 80{,}000$'
      - say: 'Percentage gain is the profit over the cost, times 100.'
        write: '$\text{Percentage gain} = \dfrac{\text{profit}}{\text{cost}} \times 100$'
      - say: 'Put in the profit, 80,000, and the cost, 320,000, from the lines above.'
        write: '$= \dfrac{80{,}000}{320{,}000} \times 100$'
        point:
          - { line: 6, kind: circle, text: 'profit' }
          - { line: 3, kind: circle, text: 'cost' }
      - say: 'Cancel the thousands, and we have 80 over 320. 80 goes into 320 four times, so the fraction is 1 over 4.'
        write: '$= \dfrac{80}{320} \times 100 = \dfrac{1}{4} \times 100$'
      - say: 'A quarter of 100 is 25. So the gain is 25%, which is answer choice B.'
        write: '$= 25\%$'
        answer: true
    traps:
      A: 'You went for 20%. That''s the profit over the selling price, 80,000 over 400,000. Percentage gain is always measured against the cost, ₦320,000.'
      C: 'You went for 32%. That''s 80,000 over 250,000, which leaves the ₦70,000 refurbishing out of the cost. The cost is everything he spent: ₦320,000.'
      D: 'You went for 60%. That ignores the refurbishing money completely: a profit of 150,000 over 250,000. The ₦70,000 is part of his cost, so the profit is only ₦80,000 on ₦320,000.'

  3:
    moments:
      - say: 'We need 21.05347 minus 1.6324 times 0.43, correct to 3 decimal places.'
        write: '$21.05347 - 1.6324 \times 0.43$'
      - say: 'Which do we do first? Multiplication comes before subtraction, so we work out 1.6324 times 0.43 first, and subtract afterwards.'
        write: 'Multiply first: $1.6324 \times 0.43$'
      - say: 'Ignore the decimal points for a moment and multiply the whole numbers: 16324 times 43. Split 43 into 40 plus 3.'
        write: '$16324 \times 43 = 16324 \times 40 + 16324 \times 3$'
      - say: '16324 times 40 is 652,960, and 16324 times 3 is 48,972.'
        write: '$= 652{,}960 + 48{,}972$'
      - say: 'Adding those gives 701,932.'
        write: '$= 701{,}932$'
      - say: 'Now put the decimal point back. 1.6324 has four decimal places and 0.43 has two, so the product has six.'
        write: 'So $1.6324 \times 0.43 = 0.701932$'
      - say: 'Now go back to the start, and take that product away from 21.05347.'
        write: '$21.05347 - 1.6324 \times 0.43 = 21.05347 - 0.701932$'
        point:
          - { line: 5, kind: arrow, at: '= 0.701932', text: 'the product' }
      - say: 'Line up the decimal points. Put an extra zero on the end of 21.05347, so both numbers have six decimal places.'
        write: '$= 21.053470 - 0.701932$'
      - say: 'Subtracting gives 20.351538.'
        write: '$= 20.351538$'
      - say: 'To round to 3 decimal places, look at the fourth digit after the point. It is a 5, so the third digit, 1, rounds up to 2.'
        write: 'Fourth decimal digit is $5$, so round up'
      - say: 'So the answer is 20.352, which is answer choice B.'
        write: '$21.05347 - 1.6324 \times 0.43 \approx 20.352$'
        answer: true
    traps:
      A: 'You went for 20.351. That cuts the number off instead of rounding it. The fourth decimal digit is 5, so the 1 rounds up to 2.'
      C: 'You went for 20.980. That is what happens when a decimal place slips in the product, so only about 0.07 is taken away instead of 0.70. 1.6324 times 0.43 is 0.701932.'
      D: 'You went for 20.981. A decimal place has slipped in the product, so too little was taken away. 1.6324 times 0.43 is 0.701932, and 21.05347 minus that is 20.351538.'

  4:
    moments:
      - say: 'We need 0.14 squared, times 0.275, all over 7 times 0.02, correct to 3 decimal places.'
        write: '$\dfrac{(0.14)^{2} \times 0.275}{7(0.02)}$'
      - say: 'The plan: work out the top, then the bottom, and only then divide. Let''s start the top with 0.14 squared.'
        write: 'Top: $(0.14)^{2} \times 0.275$'
      - say: '0.14 squared is 0.14 times 0.14. 14 times 14 is 196. Each 0.14 has two decimal places, so the answer has four.'
        write: '$14 \times 14 = 196$, so $(0.14)^{2} = 0.0196$'
      - say: 'Now multiply that by 0.275. For the whole numbers, 196 times 275 is 53,900.'
        write: '$196 \times 275 = 53{,}900$'
      - say: 'Count the decimal places: 0.0196 has four and 0.275 has three, so seven in all. 53,900 with seven decimal places is 0.00539.'
        write: 'So top $= 0.0196 \times 0.275 = 0.00539$'
      - say: 'Now the bottom: 7 times 0.02. 7 times 2 is 14, with two decimal places, so 0.14.'
        write: 'Bottom: $7 \times 0.02 = 0.14$'
      - say: 'So the whole expression is the top we found, 0.00539, over the bottom, 0.14.'
        write: '$\dfrac{(0.14)^{2} \times 0.275}{7(0.02)} = \dfrac{0.00539}{0.14}$'
        point:
          - { line: 4, kind: circle, at: '= 0.00539', text: 'top' }
          - { line: 5, kind: circle, at: '= 0.14', text: 'bottom' }
      - say: 'Dividing by a decimal is awkward, so multiply the top and the bottom by 100. That turns 0.14 into 14, and 0.00539 into 0.539.'
        write: '$= \dfrac{0.00539 \times 100}{0.14 \times 100} = \dfrac{0.539}{14}$'
      - say: '0.539 divided by 14 is 0.0385. Check: 14 times 0.0385 is 0.539.'
        write: '$= 0.0385$, since $14 \times 0.0385 = 0.539$'
      - say: 'To 3 decimal places, look at the fourth digit after the point. It is 5, so the third digit, 8, rounds up to 9.'
        write: 'Fourth decimal digit is $5$, so round up'
      - say: 'That gives 0.039, which is answer choice B.'
        write: '$\dfrac{(0.14)^{2} \times 0.275}{7(0.02)} \approx 0.039$'
        answer: true
    traps:
      A: 'You went for 0.033. The exact value is 0.0385, so an arithmetic slip has crept in. Square 0.14 carefully to get 0.0196, then multiply by 0.275 and divide by 0.14 step by step.'
      C: 'You went for 0.308. That''s far too big, the kind of answer you get when a decimal place is lost. Squaring doubles the decimal places: 0.14 squared is 0.0196, not 0.196.'
      D: 'You went for 0.358. That''s about ten times too big, so a decimal place has gone missing. Count the places carefully: the value is 0.0385, which rounds to 0.039.'

  5:
    moments:
      - say: 'We''re given $p = 1 + \sqrt{2}$ and $q = 1 - \sqrt{2}$, and we want $p$ squared minus $q$ squared, over $2pq$.'
        write: '$p = 1 + \sqrt{2},\quad q = 1 - \sqrt{2},\quad \text{find } \dfrac{p^{2} - q^{2}}{2pq}$'
      - say: 'We could square both brackets, but there is a shortcut. The top, $p^2 - q^2$, is a difference of two squares, and that always factorises.'
        write: '$p^{2} - q^{2} = (p - q)(p + q)$'
      - say: 'So let''s find $p + q$ first. Write in both values.'
        write: '$p + q = (1 + \sqrt{2}) + (1 - \sqrt{2})$'
      - say: 'The plus root 2 and the minus root 2 cancel, leaving 1 plus 1, which is 2.'
        write: '$= 2$'
      - say: 'Now $p - q$. Careful: the minus in front of the second bracket changes the sign of everything inside it.'
        write: '$p - q = (1 + \sqrt{2}) - (1 - \sqrt{2}) = 1 + \sqrt{2} - 1 + \sqrt{2}$'
      - say: 'The 1s cancel, and root 2 plus root 2 is 2 root 2.'
        write: '$= 2\sqrt{2}$'
      - say: 'Now go back to the factorised top and put in what we just found: $p - q$ is 2 root 2, and $p + q$ is 2.'
        write: 'So $p^{2} - q^{2} = 2\sqrt{2} \times 2 = 4\sqrt{2}$'
        point:
          - { line: 5, kind: circle, text: 'p − q' }
          - { line: 3, kind: circle, text: 'p + q' }
      - say: 'Now the bottom. We need $pq$, which is 1 plus root 2, times 1 minus root 2.'
        write: '$pq = (1 + \sqrt{2})(1 - \sqrt{2})$'
      - say: 'That is another difference of two squares: 1 squared minus root 2 squared.'
        write: '$= 1^{2} - (\sqrt{2})^{2}$'
      - say: '1 squared is 1, and root 2 squared is 2. 1 minus 2 is negative 1.'
        write: '$= 1 - 2 = -1$'
      - say: 'So $2pq$ is 2 times negative 1, which is negative 2.'
        write: '$2pq = 2 \times (-1) = -2$'
      - say: 'Now put the top and the bottom together: 4 root 2 over negative 2.'
        write: '$\dfrac{p^{2} - q^{2}}{2pq} = \dfrac{4\sqrt{2}}{-2}$'
        point:
          - { line: 6, kind: arrow, text: 'top' }
          - { line: 10, kind: arrow, text: 'bottom' }
      - say: '4 divided by negative 2 is negative 2. So the answer is negative 2 root 2, which is answer choice C.'
        write: '$= -2\sqrt{2}$'
        answer: true
    traps:
      A: 'You went for negative 2 times 2 plus root 2. That has a whole-number part that shouldn''t be there, a sign that the squares were expanded wrongly. Factorise the top as $(p - q)(p + q)$ to get just $4\sqrt{2}$.'
      B: 'You went for 2 times 2 plus root 2. The top simplifies to $4\sqrt{2}$ and the bottom to negative 2, so no plain number is left over, and the sign is negative.'
      D: 'You went for 2 root 2. The size is right, but the sign is lost. $pq$ is 1 minus 2, which is negative 1, so the bottom is negative and so is the answer.'

  6:
    moments:
      - say: 'We''re told $y$ over 2 equals $x$, and we have to evaluate this big fraction built from $x$ over $y$.'
        write: '$\dfrac{\frac{x^{3}}{y^{3}} + \frac{1}{2}}{\frac{1}{2} - \frac{x^{2}}{y^{2}}}$'
      - say: 'Every term involves $x$ over $y$. If we can turn $x$ over $y$ into a plain number, the whole thing becomes ordinary fractions. So start from what we are given.'
        write: 'Given: $\dfrac{y}{2} = x$'
      - say: 'Multiply both sides by 2, and $y$ equals $2x$.'
        write: '$y = 2x$'
      - say: 'Now replace $y$ with $2x$ in $x$ over $y$. The $x$ on top and the $x$ underneath cancel, leaving 1 over 2.'
        write: '$\dfrac{x}{y} = \dfrac{x}{2x} = \dfrac{1}{2}$'
        point:
          - { line: 2, kind: arrow, text: 'swap in' }
      - say: '$x$ cubed over $y$ cubed is just $x$ over $y$, cubed. So it is 1 over 2, cubed.'
        write: '$\dfrac{x^{3}}{y^{3}} = \left(\dfrac{1}{2}\right)^{3}$'
      - say: '1 cubed is 1, and 2 cubed is 8. So that is 1 over 8.'
        write: '$= \dfrac{1}{8}$'
      - say: 'In the same way, $x$ squared over $y$ squared is 1 over 2, squared, which is 1 over 4.'
        write: '$\dfrac{x^{2}}{y^{2}} = \left(\dfrac{1}{2}\right)^{2} = \dfrac{1}{4}$'
      - say: 'Now the top of the big fraction. Put in the 1 over 8 we just found: 1 over 8 plus 1 over 2.'
        write: 'Top $= \dfrac{1}{8} + \dfrac{1}{2}$'
      - say: 'To add, write 1 over 2 as 4 over 8. Then 1 over 8 plus 4 over 8 is 5 over 8.'
        write: '$= \dfrac{1}{8} + \dfrac{4}{8} = \dfrac{5}{8}$'
      - say: 'Now the bottom: 1 over 2, minus the 1 over 4 we found for $x$ squared over $y$ squared.'
        write: 'Bottom $= \dfrac{1}{2} - \dfrac{1}{4}$'
      - say: 'Write 1 over 2 as 2 over 4. Then 2 over 4 minus 1 over 4 is 1 over 4.'
        write: '$= \dfrac{2}{4} - \dfrac{1}{4} = \dfrac{1}{4}$'
      - say: 'So the whole fraction is the top, 5 over 8, divided by the bottom, 1 over 4. Dividing by 1 over 4 is the same as multiplying by 4.'
        write: 'Whole fraction $= \dfrac{5}{8} \div \dfrac{1}{4} = \dfrac{5}{8} \times 4$'
        point:
          - { line: 8, kind: arrow, text: 'top' }
          - { line: 10, kind: arrow, text: 'bottom' }
      - say: '5 times 4 is 20, so that is 20 over 8. Dividing top and bottom by 4 gives 5 over 2, which is answer choice D.'
        write: '$= \dfrac{20}{8} = \dfrac{5}{2}$'
        answer: true
    traps:
      A: 'You went for 5 over 16. That multiplies the top by 1 over 2 instead of dividing by the bottom, 1 over 4. Dividing by 1 over 4 means multiplying by 4.'
      B: 'You went for 5 over 8. That''s only the top of the big fraction. You still have to divide it by the bottom, which is 1 over 4.'
      C: 'You went for 5 over 4. That divides by 1 over 2 instead of 1 over 4. The bottom is 1 over 2 minus 1 over 4, which is 1 over 4.'

  7:
    moments:
      - say: 'We need to simplify the cube root of $64a^3$.'
        write: '$\sqrt[3]{64a^{3}}$'
      - say: 'First, what is a cube root? It is the number that, multiplied by itself three times, gives you back what is under the root. The small 3 on the root sign tells us it is a cube root, not a square root.'
        write: '$\sqrt[3]{N} = m$ when $m^{3} = N$'
      - say: 'A cube root can be taken of each factor separately. So we split it into the cube root of 64, times the cube root of $a$ cubed.'
        write: '$\sqrt[3]{64a^{3}} = \sqrt[3]{64} \times \sqrt[3]{a^{3}}$'
      - say: 'Take the number first. What number times itself three times gives 64? Let''s try 4.'
        write: 'Try $4$: $4 \times 4 \times 4$'
      - say: '4 times 4 is 16, and 16 times 4 is 64. It works.'
        write: '$= 16 \times 4 = 64$'
      - say: 'So the cube root of 64 is 4.'
        write: 'So $\sqrt[3]{64} = 4$'
      - say: 'Now the letter. $a$ cubed is $a$ times $a$ times $a$, so the thing that multiplies by itself three times to give $a$ cubed is just $a$.'
        write: '$\sqrt[3]{a^{3}} = \sqrt[3]{a \times a \times a} = a$'
      - say: 'Now go back to the line where we split the root, and put both results in: 4 times $a$.'
        write: '$\sqrt[3]{64a^{3}} = 4 \times a$'
        point:
          - { line: 2, kind: arrow, text: 'the split' }
      - say: 'So the answer is $4a$, which is answer choice B.'
        write: '$= 4a$'
        answer: true
    traps:
      A: 'You went for $8a$. 8 is the square root of 64, but the small 3 makes this a cube root. 8 cubed is 512, while 4 cubed is 64.'
      C: 'You went for 1 over $4a$. That''s the reciprocal, which would need a negative power. A cube root just undoes the cube, giving $4a$.'
      D: 'You went for $a$ over 4. The cube root of 64 is 4, not 1 over 4: 4 times 4 times 4 is 64.'

  8:
    moments:
      - say: 'We need to factorise $4x^2$ minus $9y^2$ plus $20x$ plus 25.'
        write: '$4x^{2} - 9y^{2} + 20x + 25$'
      - say: 'Four terms in this order don''t factorise directly. The trick is to look for a perfect square hiding inside. The terms without $y$, that is $4x^2$, $20x$ and 25, look promising, so let''s group them.'
        write: '$= (4x^{2} + 20x + 25) - 9y^{2}$'
      - say: 'Remember, a perfect square, $A$ plus $B$ all squared, expands to $A$ squared plus $2AB$ plus $B$ squared. Let''s see if our bracket fits.'
        write: 'Perfect square: $(A + B)^{2} = A^{2} + 2AB + B^{2}$'
      - say: '$4x^2$ is $2x$ all squared, so $A$ would be $2x$. And 25 is 5 squared, so $B$ would be 5.'
        write: '$4x^{2} = (2x)^{2},\quad 25 = 5^{2}$'
      - say: 'Now check the middle term, $2AB$. 2 times $2x$ times 5 is $20x$, exactly the middle term we have. So it is a perfect square.'
        write: 'Middle term: $2 \times 2x \times 5 = 20x$'
      - say: 'So the bracket is $2x + 5$, all squared.'
        write: 'So $4x^{2} + 20x + 25 = (2x + 5)^{2}$'
        point:
          - { line: 2, kind: box, text: 'the pattern' }
      - say: 'Put that back into our grouped line. And $9y^2$ is $3y$ all squared, because 3 squared is 9.'
        write: '$4x^{2} - 9y^{2} + 20x + 25 = (2x + 5)^{2} - (3y)^{2}$'
        point:
          - { line: 5, kind: arrow, at: '= (2x + 5)2', text: 'swap in' }
      - say: 'Now we have one square minus another square. That is a difference of two squares.'
        write: 'Difference of two squares: $A^{2} - B^{2} = (A - B)(A + B)$'
      - say: 'This time $A$ is the whole bracket $2x + 5$, and $B$ is $3y$.'
        write: 'Here $A = 2x + 5,\quad B = 3y$'
      - say: 'So we get $2x + 5$ minus $3y$, times $2x + 5$ plus $3y$.'
        write: '$= \left[(2x + 5) - 3y\right]\left[(2x + 5) + 3y\right]$'
        point:
          - { line: 7, kind: box, text: 'the rule' }
      - say: 'Remove the inner brackets and put the terms in a tidy order.'
        write: '$= (2x - 3y + 5)(2x + 3y + 5)$'
      - say: 'Quick check: the $y$ parts multiply to negative $3y$ times $3y$, which is negative $9y^2$. That matches the question.'
        write: 'Check: $(-3y)(3y) = -9y^{2}$'
      - say: 'So the factorisation is $2x - 3y + 5$, times $2x + 3y + 5$, which is answer choice C.'
        write: 'Answer: $(2x - 3y + 5)(2x + 3y + 5)$'
        answer: true
    traps:
      A: 'You went for $2x - 3y$ times $2x + 3y$. That only gives $4x^2 - 9y^2$ and drops the $20x + 25$. Group $4x^2 + 20x + 25$ as the perfect square $(2x + 5)^2$ first.'
      B: 'You went for $2x + 5$ times $2x - 9y + 5$. Expanding that gives $xy$ and $y$ terms, and no $y$ squared at all. The $9y^2$ must be written as $3y$ all squared.'
      D: 'You went for $2x - 3y$ times $2x + 3y + 5$. Expanding gives $10x$ and a $y$ term, and no 25. Spot the perfect square $(2x + 5)^2$ first, then use the difference of two squares.'

  9:
    moments:
      - say: 'Two graphs, $y = px^2 + q$ and $y = 2x^2 - 1$, cross at $x = 2$. We want $p$ in terms of $q$.'
        write: '$y = px^{2} + q,\quad y = 2x^{2} - 1$'
      - say: 'What does it mean for two graphs to intersect? At the crossing point both graphs pass through the same point, so they have the same $y$ for the same $x$.'
        write: 'At the crossing point, $y$ is the same on both graphs'
      - say: 'So we set the two expressions for $y$ equal to each other.'
        write: '$px^{2} + q = 2x^{2} - 1$'
      - say: 'They cross at $x = 2$, so replace every $x$ with 2, on both sides.'
        write: '$p(2)^{2} + q = 2(2)^{2} - 1$'
      - say: '2 squared is 4. So the left side is $4p$ plus $q$, and the right side is 2 times 4, minus 1.'
        write: '$4p + q = 2(4) - 1$'
      - say: '2 times 4 is 8, and 8 minus 1 is 7.'
        write: '$4p + q = 8 - 1 = 7$'
      - say: 'The question wants $p$ in terms of $q$, so $p$ must end up alone. First, take $q$ away from both sides.'
        write: '$4p = 7 - q$'
      - say: 'Now divide both sides by 4.'
        write: '$p = \dfrac{7 - q}{4}$'
      - say: 'Let''s check. Put this $p$ back into $4p$ plus $q$: the 4s cancel, and 7 minus $q$ plus $q$ is 7, which is exactly what the other graph gives at $x = 2$.'
        write: 'Check: $4 \times \dfrac{7 - q}{4} + q = 7 - q + q = 7$'
        point:
          - { line: 7, kind: arrow, text: 'this p' }
      - say: 'So $p$ is 7 minus $q$, over 4, which is answer choice A.'
        write: 'Answer: $p = \dfrac{7 - q}{4}$'
        answer: true
    traps:
      B: 'You went for 8 minus $q$, over 2. That forgets the minus 1 on the right, and divides by 2 instead of 4. At $x = 2$, $2x^2 - 1$ is 7, and $px^2$ is $4p$.'
      C: 'You went for $q$ minus 8, over 7. That mixes up which letter is the subject. From $4p + q = 7$, subtract $q$ and divide by 4.'
      D: 'You went for 7 over $q$ minus 1. The $q$ is added to $4p$, not multiplied, so you subtract it: $4p = 7 - q$, then divide by 4.'

  10:
    moments:
      - say: 'We need to solve $m^2 + n^2 = 29$ and $m + n = 7$ at the same time.'
        write: '$m^{2} + n^{2} = 29,\quad m + n = 7$'
