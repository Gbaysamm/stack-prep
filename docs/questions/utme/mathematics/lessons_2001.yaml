        write: '$OS = OT = ST = r$ $\therefore \triangle OST$ is equilateral'
        'on': 'equilateral'
      - say: 'Each angle of an equilateral triangle is 60 degrees.'
        write: '$\angle SOT = 60^{\circ}$ ($\angle$ of equilateral $\triangle$)'
        point:
          - {figure: sketch_b, kind: arc, target: SOT, text: '60°', 'on': '60 degrees'}
