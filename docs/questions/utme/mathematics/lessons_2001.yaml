        write: '$\begin{array}{c|ccccc} \text{Colour} & \text{Blue} & \text{Black} & \text{Yellow} & \text{White} & \text{Brown} \\ \hline \text{No.} & 1 & 2 & 4 & 5 & 3 \end{array}$'
      - say: 'Probability is the number of favourable outcomes over the total number of outcomes. Every bead is equally likely to be picked, so first we need the total number of beads.'
        write: 'Probability $= \dfrac{\text{favourable}}{\text{total}}$'
      - say: 'Add the whole row: 1 plus 2 plus 4 plus 5 plus 3.'
        write: 'Total $= 1 + 2 + 4 + 5 + 3$'
      - say: '1 plus 2 is 3, plus 4 is 7, plus 5 is 12, plus 3 is 15.'
        write: '$= 3 + 4 + 5 + 3 = 7 + 5 + 3 = 12 + 3 = 15$'
      - say: 'Now, blue or white. A bead can''t be both colours at once, so we simply add the two counts. There is 1 blue bead and there are 5 white ones.'
        write: 'Blue or white $= 1 + 5$'
      - say: '1 plus 5 is 6.'
        write: '$= 6$'
      - say: 'So the probability is the 6 favourable beads over the 15 in total.'
        write: '$P(\text{blue or white}) = \dfrac{6}{15}$'
        point:
          - { line: 5, kind: circle, text: 'favourable' }
          - { line: 3, kind: circle, at: '= 15', text: 'total' }
      - say: 'Both 6 and 15 divide by 3. 6 divided by 3 is 2, and 15 divided by 3 is 5.'
        write: '$= \dfrac{6 \div 3}{15 \div 3} = \dfrac{2}{5}$'
      - say: 'So the probability is 2 over 5, which is answer choice C.'
        write: 'Answer: $\dfrac{2}{5}$'
        answer: true
    traps:
      A: 'You went for 1 over 15. That''s only the blue bead. The question says blue or white, so add the 5 white beads too.'
      B: 'You went for 1 over 3. That''s 5 over 15, the white beads alone. Add the 1 blue bead to get 6 over 15.'
      D: 'You went for 7 over 15. Blue and white together make 1 plus 5, which is 6, not 7. So it''s 6 over 15, which is 2 over 5.'

  50:
    moments:
      - say: 'Teams $P$ and $Q$ play a football match. We want the probability that the game ends in a draw.'
        write: 'Find $P(\text{draw})$'
      - say: 'The first thing to do in any probability question is list every possible outcome. So, how can a football match end?'
        write: 'List every possible result'
      - say: 'Team $P$ can win.'
        write: 'Result 1: $P$ wins'
      - say: 'Team $Q$ can win.'
        write: 'Result 2: $Q$ wins'
      - say: 'Or the game can end level. That''s a draw.'
        write: 'Result 3: draw'
      - say: 'So there are 3 possible results. We know nothing about either team, no form and no scores, so we treat the three results as equally likely.'
        write: 'Number of equally likely results $= 3$'
      - say: 'How many of those results are a draw? Just one.'
        write: 'Results that are a draw $= 1$'
      - say: 'Probability is the favourable results over all the results: 1 over 3.'
        write: '$P(\text{draw}) = \dfrac{1}{3}$'
        point:
          - { line: 6, kind: circle, at: '= 1' }
          - { line: 5, kind: circle, at: '= 3' }
      - say: 'Quick check: the three probabilities should add up to 1. A third, plus a third, plus a third, is 1. Good.'
        write: 'Check: $\dfrac{1}{3} + \dfrac{1}{3} + \dfrac{1}{3} = 1$'
      - say: 'So the probability of a draw is 1 over 3, which is answer choice B.'
        write: 'Answer: $\dfrac{1}{3}$'
        answer: true
    traps:
      A: 'You went for 1 over 4. There are only three possible results, not four: $P$ wins, $Q$ wins, or a draw.'
      C: 'You went for 1 over 2. That counts only two outcomes, one team winning or the other, and forgets the draw itself. There are three outcomes.'
      D: 'You went for 2 over 3. That''s the chance the game does NOT end in a draw: $P$ wins or $Q$ wins. A draw is one outcome out of three.'
