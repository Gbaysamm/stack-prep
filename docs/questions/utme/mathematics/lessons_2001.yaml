  11:
    moments:
      - say: 'We need to divide $a^{3x} - 26a^{2x} + 156a^x - 216$ by $a^{2x} - 24a^x + 108$.'
        write: '$\dfrac{a^{3x} - 26a^{2x} + 156a^{x} - 216}{a^{2x} - 24a^{x} + 108}$'
      - say: 'Look at the powers: $3x$, $2x$ and $x$. $a^{3x}$ is $a^x$ cubed, and $a^{2x}$ is $a^x$ squared. So everything is built from one thing, $a^x$. Let''s give it a single letter, $u$.'
        write: 'Let $u = a^{x}$'
      - say: 'Then $a^{2x}$ is $u$ squared, and $a^{3x}$ is $u$ cubed.'
        write: 'Then $a^{2x} = (a^{x})^{2} = u^{2},\quad a^{3x} = (a^{x})^{3} = u^{3}$'
      - say: 'Replace them, and the division becomes an ordinary one between two polynomials in $u$.'
        write: '$= \dfrac{u^{3} - 26u^{2} + 156u - 216}{u^{2} - 24u + 108}$'
        point:
          - { line: 2, kind: arrow, text: 'swap in' }
      - say: 'Let''s factorise the bottom first. We want two numbers that multiply to 108 and add to negative 24. Negative 6 and negative 18 work.'
        write: '$(-6)(-18) = 108,\ (-6) + (-18) = -24$, so bottom $= (u - 6)(u - 18)$'
      - say: 'If the division is going to come out neatly, the top should share these factors. So let''s test $u = 6$ in the top.'
        write: 'Top at $u = 6$: $6^{3} - 26(6^{2}) + 156(6) - 216$'
      - say: '6 cubed is 216. 6 squared is 36, and 26 times 36 is 936. And 156 times 6 is also 936.'
        write: '$= 216 - 26(36) + 936 - 216 = 216 - 936 + 936 - 216$'
      - say: 'Everything cancels, and we get 0. When putting in 6 gives 0, $u - 6$ is a factor. So $u - 6$ is a factor of the top too.'
        write: '$= 0$, so $(u - 6)$ is a factor of the top'
      - say: 'Dividing the top by $u - 6$ leaves $u$ squared minus $20u$ plus 36. You can check by multiplying it back out.'
        write: 'Top $= (u - 6)(u^{2} - 20u + 36)$'
      - say: 'Now factorise that quadratic. Two numbers that multiply to 36 and add to negative 20 are negative 2 and negative 18.'
        write: '$(-2)(-18) = 36,\ (-2) + (-18) = -20$, so $u^{2} - 20u + 36 = (u - 2)(u - 18)$'
      - say: 'So the top is $u - 6$, times $u - 2$, times $u - 18$. Now put the factorised top over the factorised bottom.'
        write: 'Division $= \dfrac{(u - 6)(u - 2)(u - 18)}{(u - 6)(u - 18)}$'
      - say: 'The $u - 6$ and the $u - 18$ appear on the top and the bottom, so they cancel, leaving $u - 2$.'
        write: '$= u - 2$'
        point:
          - { line: 10, kind: strike, at: '(u − 6)', text: 'cancels' }
          - { line: 10, kind: strike, at: '(u − 18)', text: 'cancels' }
      - say: 'Finally, put $a^x$ back in place of $u$. The answer is $a^x - 2$, which is answer choice C.'
        write: '$= a^{x} - 2$'
        answer: true
    traps:
      A: 'You went for $a^x - 18$. That factor is on the top and on the bottom, so it cancels. What''s left after cancelling is $a^x - 2$.'
      B: 'You went for $a^x - 6$. That factor is on both the top and the bottom, so it cancels too. The factor left over is $a^x - 2$.'
      D: 'You went for $a^x + 2$. The sign is wrong. The top factorises with $u - 2$, because negative 2 and negative 18 multiply to 36 and add to negative 20.'

