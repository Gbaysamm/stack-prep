# UTME 2001 Mathematics — lessons for the board (version 2).
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_2001.yaml. Answers match that file.
format_version: 1
exam_year: 2001
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'Find the principal that amounts to ₦5,000 at simple interest in 5 years at 2% per annum. "Amounts to" means ₦5,000 is where the money finishes, not where it starts. Picture a money jar.'
        write: 'Find $P$: amounts to ₦5,000 in 5 years at $2\%$ simple interest'
        doodle: {name: 'custom:2001_q01_a', id: jar, caption: 'P grows to ₦5,000'}
      - section: 'Solution'
        say: 'Solution. List the givens. A, the amount, is 5,000. R is 2 percent. T is 5 years. P, the principal, is what we want.'
        write: '$A = 5000,\ R = 2,\ T = 5,\ P = ?$'
      - say: 'The amount is the principal plus the interest.'
        write: '$A = P + I$'
      - say: 'Simple interest is I equals P R T over 100. The same slice is added every year, because it is always on the first P.'
        write: '$I = \dfrac{PRT}{100}$'
        doodle_do:
          - {id: jar, op: stage, stage: 'custom:2001_q01_a2'}
      - section: 'Substitute'
        say: 'Substitute R equals 2 and T equals 5. P times 2 times 5 is 10 P, over 100.'
        write: '$I = \dfrac{P \times 2 \times 5}{100} = \dfrac{10P}{100}$'
        point:
          - {line: 3, kind: box, text: 'the formula'}
        doodle_do:
          - {id: jar, op: circle, part: slices}
      - say: 'Cancel: 10 over 100 is 1 over 10. So the interest is P over 10.'
        write: '$I = \dfrac{P}{10}$'
      - say: 'Therefore, from A equals P plus I: P plus P over 10 equals 5,000.'
        write: '$\therefore P + \dfrac{P}{10} = 5000$'
        point:
          - {line: 6, kind: box, at: 'P + ', text: 'A = P + I'}
        doodle_do:
          - {id: jar, op: highlight, part: target}
      - section: 'Solve for P'
        say: 'The L.C.M. of the denominators is 10. Over 10, P is 10 P over 10, so the left side is 10 P plus P, over 10.'
        write: '$\dfrac{10P + P}{10} = 5000$'
      - say: '10 P plus P is 11 P. Multiply both sides by 10: 11 P equals 50,000.'
        write: '$11P = 50{,}000$'
      - say: 'Divide both sides by 11.'
        write: '$P = \dfrac{50{,}000}{11}$'
      - say: 'By long division, 50,000 divided by 11 is 4545.4545 and so on. To the nearest kobo, 2 decimal places, that is 4545.45.'
        write: '$= 4545.4545\ldots = 4545.45$ (2 d.p.)'
      - section: 'Check'
        say: 'Check with the formula. 4545.45 times 2 times 5, over 100, is 454.55 to the nearest kobo.'
        write: 'Check: $I = \dfrac{4545.45 \times 2 \times 5}{100} = 454.55$'
      - say: 'And 4545.45 plus 454.55 is 5000.00, the amount we were given. It agrees.'
        write: '$A = 4545.45 + 454.55 = 5000.00$ ✓'
      - say: 'Therefore the principal is ₦4,545.45: option D.'
        write: '$\therefore P$ = ₦4,545.45 (D)'
        answer: true
        doodle_do:
          - {id: jar, op: label, part: principal, text: 'P = ₦4,545.45'}
        point:
          - {line: 13, kind: highlight, at: '₦4,545.45', to: {doodle: jar, part: principal}}
    traps:
      A: 'You went for ₦5,000. That is the amount at the end, after the interest is added. If ₦5,000 were the principal, it would grow to ₦5,500. Solve P plus P over 10 equals 5,000 instead.'
      B: 'You went for ₦4,900. Check it: the interest on 4,900 is 490, and 4,900 plus 490 is 5,390, not 5,000. P is 50,000 over 11.'
      C: 'You went for ₦4,800. Check it: the interest on 4,800 is 480, and 4,800 plus 480 is 5,280, not 5,000. P is 50,000 over 11.'

  2:
    moments:
      - section: 'The question'
        say: 'A dealer buys a car for ₦250,000, spends ₦70,000 refurbishing it, and sells it for ₦400,000. What is his percentage gain? Three options come from leaving something out.'
        write: 'Bought ₦250,000; refurbishing ₦70,000; sold ₦400,000'
        doodle: {name: 'custom:2001_q02_a', id: car, size: scene, caption: 'the dealer''s car'}
      - section: 'Cost price'
        say: 'Solution. The cost price, C.P., is everything the car cost him: the buying price plus the refurbishing. There is the spanner.'
        write: 'C.P. $=$ buying price $+$ refurbishing'
        doodle_do:
          - {id: car, op: stage, stage: 'custom:2001_q02_a2'}
      - say: '250,000 plus 70,000 is 320,000. His cost price is ₦320,000.'
        write: '$= 250{,}000 + 70{,}000 = 320{,}000$'
        doodle_do:
          - {id: car, op: label, part: car, text: 'C.P. = ₦320,000'}
        point:
          - {line: 2, kind: highlight, at: '320,000', to: {doodle: car, part: car}}
      - section: 'Gain'
        say: 'The selling price, S.P., is ₦400,000. Now the sale tag goes on the car. Gain is S.P. minus C.P.'
        write: 'Gain $=$ S.P. $-$ C.P.'
        doodle_do:
          - {id: car, op: stage, stage: 'custom:2001_q02_a3'}
      - say: '400,000 minus 320,000 is 80,000.'
        write: '$= 400{,}000 - 320{,}000 = 80{,}000$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: '= [[320,000]]'}, at: '− [[320,000]]', text: 'C.P.'}
        doodle_do:
          - {id: car, op: label, part: sell, text: 'gain ₦80,000'}
      - section: 'Gain per cent'
        say: 'Gain per cent is the gain over the C.P., times 100 percent.'
        write: 'Gain $\% = \dfrac{\text{gain}}{\text{C.P.}} \times 100\%$'
      - say: 'Substitute the gain, 80,000, and the C.P., 320,000.'
        write: '$= \dfrac{80{,}000}{320{,}000} \times 100\%$'
      - say: 'Cancel the thousands: 80 over 320. 80 goes into 320 four times, so it is 1 over 4. And 1 over 4 of 100 is 25.'
        write: '$= \dfrac{80}{320} \times 100\% = \dfrac{1}{4} \times 100\% = 25\%$'
      - section: 'Check'
        say: 'Check: 25% of the C.P., 320,000, is 80,000. 320,000 plus 80,000 is 400,000, the S.P. It agrees.'
        write: 'Check: $320{,}000 + 25\%$ of $320{,}000 = 400{,}000$ ✓'
      - say: 'Therefore the percentage gain is 25 percent: option B.'
        write: '$\therefore$ gain $\% = 25\%$ (B)'
        answer: true
    traps:
      A: 'You went for 20%. That is the gain over the S.P., 80,000 over 400,000. Gain per cent is always on the C.P., ₦320,000.'
      C: 'You went for 32%. That is 80,000 over 250,000, leaving the ₦70,000 refurbishing out of the C.P. The C.P. is everything he spent: ₦320,000.'
      D: 'You went for 60%. That ignores the refurbishing completely: a gain of 150,000 over 250,000. The ₦70,000 is part of the C.P., so the gain is ₦80,000 on ₦320,000.'

  3:
    moments:
      - section: 'The question'
        say: 'Evaluate 21.05347 minus 1.6324 times 0.43, to 3 decimal places. Two operations: which comes first? And two options sit near 20.98, the mark of a slipped decimal point.'
        write: '$21.05347 - 1.6324 \times 0.43$ (3 d.p.)'
      - section: 'Solution'
        say: 'Solution. BODMAS: Brackets, Of, Division, Multiplication, Addition, Subtraction. Multiplication comes before subtraction, so we multiply first.'
        write: 'By BODMAS: multiply first, then subtract'
      - section: 'Multiply'
        say: 'Ignore the points and multiply 16324 by 43 in long multiplication. 3 times 16324 is 48,972. 40 times 16324 is 652,960. Add them: 701,932.'
        write: 'Long multiplication: $\begin{array}{r} 16324 \\ \times\ 43 \\ \hline 48972 \\ 652960 \\ \hline 701932 \end{array}$'
      - say: 'Now place the point. 1.6324 has 4 decimal places and 0.43 has 2, so the product has 6.'
        write: '$1.6324 \times 0.43 = 0.701932$'
      - section: 'Subtract'
        say: 'Now the subtraction: 21.05347 minus 0.701932.'
        write: '$21.05347 - 1.6324 \times 0.43 = 21.05347 - 0.701932$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '= [[0.701932]]'}, at: '− [[0.701932]]', text: 'the product'}
      - say: 'Line up the points, and add a zero to 21.05347 so both have 6 decimal places. Subtract column by column from the right, borrowing where needed.'
        write: 'Subtract: $\begin{array}{r} 21.053470 \\ -\ \ 0.701932 \\ \hline 20.351538 \end{array}$'
      - section: 'Correct to 3 d.p.'
        say: 'For decimal places, count from the point: 3, 5, 1. Mark the cut after the third digit. Picture the number on a line from 20.351 to 20.352.'
        write: 'Cut after 3 d.p.: $20.351\,|\,538$'
        doodle: {name: 'custom:2001_q03_a', id: line, caption: 'which end is nearer?'}
      - say: 'The next digit is 5. The rule: 5 or more, add 1 to the last digit kept. So the 1 becomes 2. On the line, the number is just past halfway.'
        write: 'Next digit $5$: add $1$, so $20.351538 = 20.352$ (3 d.p.)'
        doodle_do:
          - {id: line, op: stage, stage: 'custom:2001_q03_a2'}
      - section: 'Check'
        say: 'Check the subtraction by adding back: 20.351538 plus 0.701932 is 21.053470. It agrees.'
        write: 'Check: $20.351538 + 0.701932 = 21.05347$ ✓'
      - say: 'Therefore the value is 20.352, to 3 decimal places: option B.'
        write: '$\therefore$ value $= 20.352$ (3 d.p.) (B)'
        answer: true
        doodle_do:
          - {id: line, op: circle, part: high}
        point:
          - {line: 9, kind: highlight, at: '20.352', to: {doodle: line, part: high}}
    traps:
      A: 'You went for 20.351. That cuts the number off without the rule. The next digit is 5, and 5 or more means add 1, so the 1 becomes 2.'
      C: 'You went for 20.980. That comes from a decimal place slipping in the product, so only about 0.07 is taken away and you land near 20.98. 1.6324 times 0.43 is 0.701932: 6 decimal places.'
      D: 'You went for 20.981. A decimal place has slipped in the product, so too little was taken away. Count the decimal places, 4 plus 2 is 6: the product is 0.701932.'

  4:
    moments:
      - section: 'The question'
        say: '0.14 squared, times 0.275, over 7 times 0.02, correct to 3 decimal places. It looks like a lot of multiplying. Look at the bottom first: something there cancels.'
        write: '$\dfrac{(0.14)^{2} \times 0.275}{7(0.02)}$ (3 d.p.)'
      - section: 'Solution'
        say: 'Solution. The bottom is 7 times 0.02. 7 times 2 is 14, with 2 decimal places: 0.14.'
        write: 'Bottom: $7(0.02) = 0.14$'
      - say: '0.14 squared means 0.14 times 0.14. Write it out, with the bottom we just found.'
        write: '$= \dfrac{0.14 \times 0.14 \times 0.275}{0.14}$'
      - section: 'Cancel first'
        say: 'Cancel first: one 0.14 on top cancels the 0.14 below. That leaves 0.14 times 0.275.'
        write: '$= 0.14 \times 0.275$'
      - section: 'Multiply'
        say: 'Ignore the points: 275 times 14 in long multiplication. 4 times 275 is 1100. 10 times 275 is 2750. Add them: 3850.'
        write: 'Long multiplication: $\begin{array}{r} 275 \\ \times\ 14 \\ \hline 1100 \\ 2750 \\ \hline 3850 \end{array}$'
      - say: 'Place the point. 0.14 has 2 decimal places and 0.275 has 3, so the product has 5: 0.03850.'
        write: '$0.14 \times 0.275 = 0.03850$'
      - section: 'Correct to 3 d.p.'
        say: 'For decimal places, count from the point: 0, 3, 8. Mark the cut after the 8. Picture the value on a line from 0.038 to 0.039.'
        write: 'Cut after 3 d.p.: $0.038\,|\,50$'
        doodle: {name: 'custom:2001_q04_a', id: line, caption: 'which end does it go to?'}
      - say: 'The next digit is 5. The rule: 5 or more, add 1 to the last digit kept. So the 8 becomes 9. The value sits on the halfway flag, and a 5 goes up.'
        write: 'Next digit $5$: add $1$, so $0.0385 = 0.039$ (3 d.p.)'
        doodle_do:
          - {id: line, op: stage, stage: 'custom:2001_q04_a2'}
      - section: 'Check'
        say: 'Check the long way: 0.14 squared is 0.0196, and 0.0196 times 0.275 is 0.00539. Divide by 0.14: 0.0385. It agrees.'
        write: 'Check: $\dfrac{0.0196 \times 0.275}{0.14} = \dfrac{0.00539}{0.14} = 0.0385$ ✓'
      - say: 'Therefore the value is 0.039, to 3 decimal places: option B.'
        write: '$\therefore$ value $= 0.039$ (3 d.p.) (B)'
        answer: true
        doodle_do:
          - {id: line, op: circle, part: high}
        point:
          - {line: 9, kind: highlight, at: '0.039', to: {doodle: line, part: high}}
    traps:
      A: 'You went for 0.033. The value is 0.0385, so a slip has crept into the arithmetic. Cancel the 0.14 first: 0.14 times 0.275 is 0.0385, which is 0.039.'
      C: 'You went for 0.308. That is far too big: a decimal place has been lost. 0.14 times 0.275 has 5 decimal places: 0.03850.'
      D: 'You went for 0.358. That is about ten times too big, so a decimal place has gone missing. Count the places: the value is 0.0385, which is 0.039.'

  5:
    moments:
      - section: 'The question'
        say: 'You could square both brackets. But the numerator, $p$ squared minus $q$ squared, is a difference of two squares, and that factorises into something much easier.'
        write: '$p = 1 + \sqrt{2},\ q = 1 - \sqrt{2}$; evaluate $\dfrac{p^{2} - q^{2}}{2pq}$'
      - say: 'Solution. Find the numerator and the denominator separately, then divide.'
        write: 'Solution'
      - section: 'The numerator'
        say: 'Difference of two squares: $p$ squared minus $q$ squared is $p$ minus $q$, times $p$ plus $q$. Picture a $p$ by $p$ square with a $q$ by $q$ square cut from its corner.'
        doodle: {name: 'custom:2001_q05_a', id: tiles, caption: 'p² − q² as tiles'}
        write: '$p^{2} - q^{2} = (p - q)(p + q)$'
      - say: 'Cut off the strip and lay it at the end: the shape becomes a rectangle, $p$ plus $q$ long and $p$ minus $q$ tall. First $p$ plus $q$. Put in both values.'
        doodle_do:
          - {id: tiles, op: stage, stage: 'custom:2001_q05_a2'}
        write: '$p + q = (1 + \sqrt{2}) + (1 - \sqrt{2})$'
      - say: 'Plus root 2 and minus root 2 cancel, leaving 1 plus 1, which is 2. That is the rectangle''s length.'
        doodle_do:
          - {id: tiles, op: label, part: long, text: '= 2'}
        write: '$= 2$'
      - say: 'Now $p$ minus $q$. The minus in front of the second bracket changes both signs inside it.'
        write: '$p - q = (1 + \sqrt{2}) - (1 - \sqrt{2}) = 1 + \sqrt{2} - 1 + \sqrt{2}$'
      - say: 'The 1s cancel, and root 2 plus root 2 is 2 root 2. That is the rectangle''s height.'
        doodle_do:
          - {id: tiles, op: label, part: short, text: '= 2√2'}
        write: '$= 2\sqrt{2}$'
      - say: 'So the numerator is 2 root 2 times 2, which is 4 root 2.'
        doodle_do:
          - {id: tiles, op: pulse, part: rect}
        write: '$\therefore p^{2} - q^{2} = 2\sqrt{2} \times 2 = 4\sqrt{2}$'
        point:
          - {line: 7, kind: move, from: {line: 6, at: '= 22'}, at: '= [[22]] ×', text: 'p − q'}
      - section: 'The denominator'
        say: '$pq$ is 1 plus root 2, times 1 minus root 2. That is another difference of two squares: 1 squared minus root 2 squared.'
        write: '$pq = (1 + \sqrt{2})(1 - \sqrt{2}) = 1^{2} - (\sqrt{2})^{2}$'
      - say: '1 squared is 1, and root 2 squared is 2. 1 minus 2 is minus 1.'
        write: '$= 1 - 2 = -1$'
      - say: 'So $2pq$ is 2 times minus 1, which is minus 2.'
        write: '$2pq = 2(-1) = -2$'
      - section: 'Divide'
        say: 'Put the numerator over the denominator: 4 root 2 over minus 2. 4 divided by minus 2 is minus 2.'
        write: '$\therefore \dfrac{p^{2} - q^{2}}{2pq} = \dfrac{4\sqrt{2}}{-2} = -2\sqrt{2}$'
      - section: 'Check'
        say: 'Check with decimals. $p$ is about 2.414 and $q$ about minus 0.414. $p$ squared minus $q$ squared is 5.828 minus 0.172, which is 5.657. $2pq$ is minus 2. 5.657 over minus 2 is minus 2.828, which is minus 2 root 2.'
        write: 'Check: $\dfrac{5.828 - 0.172}{-2} = -2.828 \approx -2(1.414)\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the value is minus 2 root 2, which is option C.'
        write: '$\therefore$ the answer is $-2\sqrt{2}$'
        answer: true
    traps:
      A: 'You went for minus 2 times, bracket, 2 plus root 2. That has a whole-number part that should not be there, a sign that the squares were expanded wrongly. Factorise the numerator as $p$ minus $q$, times $p$ plus $q$, to get just 4 root 2.'
      B: 'You went for 2 times, bracket, 2 plus root 2. The numerator simplifies to 4 root 2 and the denominator to minus 2, so no plain number is left over, and the sign is negative.'
      D: 'You went for 2 root 2. The size is right, but the sign is lost. $pq$ is 1 minus 2, which is minus 1, so the denominator is negative and so is the answer.'

  6:
    moments:
      - section: 'The question'
        say: 'We are told $y$ over 2 equals $x$, and we must evaluate a fraction whose top and bottom are both built from $x$ over $y$.'
        write: '$\dfrac{y}{2} = x$; $\ \dfrac{\frac{x^{3}}{y^{3}} + \frac{1}{2}}{\frac{1}{2} - \frac{x^{2}}{y^{2}}} = ?$'
      - section: 'Solution'
        say: 'Solution. Multiply both sides of the given equation by 2. $y$ equals $2x$: picture $y$ as two $x$ bars end to end.'
        doodle: {name: 'custom:2001_q06_a', id: bars, caption: 'y is two x''s'}
        write: 'Solution: $y = 2x$'
      - say: 'Now replace $y$ with $2x$ in $x$ over $y$. $x$ over $y$ equals $x$ over $2x$, and the $x$s cancel: 1 over 2.'
        write: '$\therefore \dfrac{x}{y} = \dfrac{x}{2x} = \dfrac{1}{2}$'
        doodle_do:
          - {id: bars, op: label, part: bars, text: 'x/y = 1/2'}
      - section: 'The powers'
        say: 'By the laws of indices, $x$ cubed over $y$ cubed is $x$ over $y$, all cubed. So it is 1 over 2, cubed: 1 over 8.'
        write: '$\dfrac{x^{3}}{y^{3}} = \left(\dfrac{x}{y}\right)^{3} = \left(\dfrac{1}{2}\right)^{3} = \dfrac{1}{8}$'
        doodle_do:
          - {id: bars, op: stage, stage: 'custom:2001_q06_a2'}
      - say: 'In the same way, $x$ squared over $y$ squared is 1 over 2, squared: 1 over 4.'
        write: '$\dfrac{x^{2}}{y^{2}} = \left(\dfrac{x}{y}\right)^{2} = \left(\dfrac{1}{2}\right)^{2} = \dfrac{1}{4}$'
        doodle_do:
          - {id: bars, op: stage, stage: 'custom:2001_q06_a3'}
      - section: 'Substitute'
        say: 'Substitute 1 over 8 and 1 over 4 into the big fraction.'
        write: '$\dfrac{\frac{x^{3}}{y^{3}} + \frac{1}{2}}{\frac{1}{2} - \frac{x^{2}}{y^{2}}} = \dfrac{\frac{1}{8} + \frac{1}{2}}{\frac{1}{2} - \frac{1}{4}}$'
      - say: 'The numerator: the L.C.M. of 8 and 2 is 8. 1 plus 4, over 8, is 5 over 8.'
        write: 'Numerator: $\dfrac{1}{8} + \dfrac{1}{2} = \dfrac{1 + 4}{8} = \dfrac{5}{8}$ (L.C.M. $= 8$)'
      - say: 'The denominator: the L.C.M. of 2 and 4 is 4. 2 minus 1, over 4, is 1 over 4.'
        write: 'Denominator: $\dfrac{1}{2} - \dfrac{1}{4} = \dfrac{2 - 1}{4} = \dfrac{1}{4}$ (L.C.M. $= 4$)'
      - section: 'Divide'
        say: 'Numerator divided by denominator. To divide by 1 over 4, multiply by its reciprocal, 4 over 1.'
        write: '$= \dfrac{5}{8} \div \dfrac{1}{4} = \dfrac{5}{8} \times \dfrac{4}{1}$'
      - say: 'Cancel first: 4 goes into 8 twice. That leaves 5 over 2.'
        write: '$= \dfrac{5}{2}$'
      - section: 'Check'
        say: 'Check with numbers: take $x$ equals 1, so $y$ equals 2. The top is 1 over 8 plus 1 over 2, which is 5 over 8. The bottom is 1 over 2 minus 1 over 4, which is 1 over 4. 5 over 8 times 4 is 5 over 2.'
        write: 'Check: $x = 1,\ y = 2$: $\ \dfrac{5}{8} \div \dfrac{1}{4} = \dfrac{5}{2}\ \checkmark$'
      - say: 'Therefore the value is 5 over 2, which is option D.'
        write: '$\therefore$ the value $= \dfrac{5}{2}$'
        answer: true
    traps:
      A: 'You went for 5 over 16. That multiplies the numerator by 1 over 2 instead of dividing by the denominator, 1 over 4. Dividing by 1 over 4 means multiplying by 4.'
      B: 'You went for 5 over 8. That is only the numerator. You still have to divide it by the denominator, which is 1 over 4.'
      C: 'You went for 5 over 4. That divides by 1 over 2 instead of 1 over 4. The denominator is 1 over 2 minus 1 over 4, which is 1 over 4.'

  7:
    moments:
      - section: 'The question'
        say: 'A cube root over a number and a letter. Many students take the square root of 64 by habit. The small 3 on the root sign says cube root.'
        write: 'Simplify $\sqrt[3]{64a^{3}}$'
      - say: 'Solution. First, change the root into a fractional index.'
        write: 'Solution'
      - section: 'Index form'
        say: 'The law of indices for a root: the $n$th root of $a$ is $a$ to the power 1 over $n$.'
        write: 'Law of indices: $\sqrt[n]{a} = a^{\frac{1}{n}}$'
      - say: 'So the cube root of $64a$ cubed is $64a$ cubed, to the power 1 over 3.'
        write: '$\sqrt[3]{64a^{3}} = (64a^{3})^{\frac{1}{3}}$'
      - say: 'The law of indices for a product: a product to a power is each factor to that power.'
        write: '$= 64^{\frac{1}{3}} \times (a^{3})^{\frac{1}{3}}$ $\quad [(ab)^{n} = a^{n}b^{n}]$'
      - section: 'The number'
        say: 'Write 64 as a power. 4 times 4 is 16, and 16 times 4 is 64, so 64 is 4 cubed. The cube of 64 blocks has 4 along each edge.'
        write: '$64 = 4 \times 4 \times 4 = 4^{3}$'
        doodle: {name: 'custom:2001_q07_a', id: cube, caption: '64 blocks in one cube'}
        doodle_do:
          - {id: cube, op: label, part: edge, text: '4 along each edge'}
      - say: 'Substitute 4 cubed for 64.'
        write: '$= (4^{3})^{\frac{1}{3}} \times (a^{3})^{\frac{1}{3}}$'
      - section: 'Multiply the indices'
        say: 'The law of indices for a power of a power: multiply the indices. 3 times 1 over 3 is 1, for the 4 and for the $a$.'
        write: '$= 4^{1} \times a^{1}$ $\quad [(a^{m})^{n} = a^{mn}]$'
      - say: '4 to the power 1 is 4, and $a$ to the power 1 is $a$.'
        write: '$= 4a$'
      - section: 'Check'
        say: 'Check by cubing the answer. $4a$ cubed is 4 cubed times $a$ cubed, which is $64a$ cubed: exactly what was under the root.'
        write: 'Check: $(4a)^{3} = 4^{3}a^{3} = 64a^{3}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the cube root of $64a$ cubed is $4a$, which is option B.'
        write: '$\therefore \sqrt[3]{64a^{3}} = 4a$'
        answer: true
    traps:
      A: 'You went for $8a$. 8 is the square root of 64, but the small 3 makes this a cube root. 8 cubed is 512, while 4 cubed is 64.'
      C: 'You went for 1 over $4a$. That is the reciprocal, which would need a negative index. The index here is 1 over 3, positive, so the answer is $4a$.'
      D: 'You went for $a$ over 4. The cube root of 64 is 4, not 1 over 4: 4 times 4 times 4 is 64.'

  8:
    moments:
      - section: 'The question'
        say: 'Four terms, two letters, and no common factor. The secret is a perfect square hiding inside. Find it first, and the rest is a difference of two squares.'
        write: 'Factorise $4x^{2} - 9y^{2} + 20x + 25$'
      - section: 'Solution'
        say: 'Solution. The three terms in $x$ belong together, so rearrange them side by side and put the $y$ term last. Picture those three as tiles that fit into one square.'
        write: '$= 4x^{2} + 20x + 25 - 9y^{2}$'
        doodle: {name: 'custom:2001_q08_a', id: tiles, caption: '4x² + 20x + 25 as a square of tiles', 'on': 'Picture'}
      - say: 'Bracket the three $x$ terms. We factorise the bracket first, by product and sum.'
        write: '$= (4x^{2} + 20x + 25) - 9y^{2}$'
      - section: 'Factorise the bracket'
        say: 'In the bracket, $a$ is 4, $b$ is 20 and $c$ is 25. The product is $a$ times $c$, 4 times 25, which is 100. The sum is $b$, 20.'
        write: 'Product $= 4 \times 25 = 100$, Sum $= 20$'
      - say: 'Two numbers that multiply to 100 and add up to 20: 10 and 10. 10 times 10 is 100, and 10 plus 10 is 20.'
        write: 'Factors: $10,\ 10$'
      - say: 'Split the middle term, $20x$, into $10x$ plus $10x$. In the picture, these are the two strips beside the big square.'
        write: '$= 4x^{2} + 10x + 10x + 25$'
        doodle_do:
          - {id: tiles, op: circle, part: strips, 'on': 'two strips'}
        point:
          - {line: 5, kind: move, from: {line: 4, at: '[[10]], 10'}, at: '[[10x]] + 10x', text: 'split'}
          - {line: 5, kind: move, from: {line: 4, at: '10, [[10]]'}, at: '10x + [[10x]]'}
      - say: 'Group in pairs. From the first pair take out $2x$, leaving $2x$ plus 5. From the second pair take out 5, leaving $2x$ plus 5 again.'
        write: '$= 2x(2x + 5) + 5(2x + 5)$'
      - say: 'The brackets match, so take out $2x$ plus 5. The same bracket twice is a perfect square: $2x$ plus 5, all squared. Look along the side of the square.'
        write: '$= (2x + 5)(2x + 5) = (2x + 5)^{2}$'
        doodle_do:
          - {id: tiles, op: highlight, part: side, 'on': 'Look along'}
      - section: 'Difference of two squares'
        say: 'Put it back in place of the bracket. The whole expression is $2x$ plus 5 all squared, minus 9 $y$ squared: the big square with a square taken away.'
        write: '$\therefore$ expression $= (2x + 5)^{2} - 9y^{2}$'
        doodle_do:
          - {id: tiles, op: stage, stage: 'custom:2001_q08_a2', 'on': 'taken away'}
      - say: '9 $y$ squared is $3y$ all squared, because 3 times 3 is 9. Now it is one square minus another square.'
        write: '$= (2x + 5)^{2} - (3y)^{2}$'
        point:
          - {line: 9, kind: underline, at: '(3y)2', text: '9y² = (3y)²'}
      - say: 'That is a difference of two squares. $A$ squared minus $B$ squared equals $A$ minus $B$, times $A$ plus $B$.'
        write: 'Difference of two squares: $A^{2} - B^{2} = (A - B)(A + B)$'
      - say: 'Here $A$ is the whole bracket, $2x$ plus 5, and $B$ is $3y$.'
        write: 'Here $A = 2x + 5,\ B = 3y$'
      - say: 'So we get $2x$ plus 5 minus $3y$, times $2x$ plus 5 plus $3y$.'
        write: '$= (2x + 5 - 3y)(2x + 5 + 3y)$'
        point:
          - {line: 12, kind: move, from: {line: 11, at: 'A = [[2x + 5]]'}, at: '[[2x + 5]] − 3y', text: 'A'}
          - {line: 12, kind: move, from: {line: 11, at: 'B = [[3y]]'}, at: '− [[3y]]', text: 'B'}
      - say: 'Rearrange each bracket, with the $y$ term second and the number last.'
        write: '$= (2x - 3y + 5)(2x + 3y + 5)$'
      - section: 'Check'
        say: 'Check two of the terms. The $y$ parts give minus $3y$ times $3y$, minus 9 $y$ squared. The numbers give 5 times 5, 25. Both match the question.'
        write: 'Check: $(-3y)(3y) = -9y^{2}$, $\ 5 \times 5 = 25$'
      - say: 'Therefore the factors are $2x$ minus $3y$ plus 5, times $2x$ plus $3y$ plus 5, which is answer choice C.'
        write: '$\therefore (2x - 3y + 5)(2x + 3y + 5)$'
        answer: true
    traps:
      A: 'You went for $2x$ minus $3y$, times $2x$ plus $3y$. That gives only $4x^2$ minus $9y^2$ and drops $20x$ plus 25. Factorise $4x^2 + 20x + 25$ as $(2x + 5)^2$ first.'
      B: 'You went for $2x$ plus 5, times $2x$ minus $9y$ plus 5. Expanding that gives $xy$ and $y$ terms, and no $y$ squared at all. Write $9y^2$ as $3y$ all squared.'
      D: 'You went for $2x$ minus $3y$, times $2x$ plus $3y$ plus 5. Expanding gives $10x$ and a $y$ term, and no 25. Find the perfect square $(2x + 5)^2$ first, then use the difference of two squares.'

  9:
    moments:
      - section: 'The question'
        say: 'Two curves cross where $x$ is 2. At that crossing they share one point, and that single fact gives us an equation linking $p$ and $q$.'
        write: '$y = px^{2} + q,\ \ y = 2x^{2} - 1$; meet at $x = 2$'
        doodle: {name: 'custom:2001_q09_a', id: graphs, caption: 'where the two curves cross'}
      - section: 'Solution'
        say: 'Solution. Number the two equations. The first graph is equation 1.'
        write: '$y = px^{2} + q \quad \ldots\ldots (1)$'
      - say: 'The second graph is equation 2.'
        write: '$y = 2x^{2} - 1 \quad \ldots\ldots (2)$'
      - say: 'Where two graphs intersect, they pass through the same point, so they have the same $y$. So we equate equation 1 and equation 2.'
        write: 'At the point of intersection, (1) = (2):'
        doodle_do:
          - {id: graphs, op: circle, part: meet, 'on': 'same point'}
      - say: 'The right-hand sides must be equal: $p$ $x$ squared plus $q$ equals 2 $x$ squared minus 1.'
        write: '$px^{2} + q = 2x^{2} - 1$'
      - say: 'They intersect at $x$ equals 2, so substitute 2 for $x$ on both sides, in brackets.'
        write: 'Sub. $x = 2$: $\ p(2)^{2} + q = 2(2)^{2} - 1$'
        doodle_do:
          - {id: graphs, op: highlight, part: xline}
      - say: '2 squared is 4, so $p$ times 4 is $4p$. On the right, 2 times 4 is 8.'
        write: '$4p + q = 8 - 1$'
      - say: '8 minus 1 is 7. Both graphs are at height 7 when $x$ is 2.'
        write: '$4p + q = 7$'
        doodle_do:
          - {id: graphs, op: label, part: meet, text: 'y = 7 on both'}
      - section: 'Make p the subject'
        say: 'The question wants $p$ in terms of $q$, so make $p$ the subject. Subtract $q$ from both sides.'
        write: '$4p = 7 - q$'
        point:
          - {line: 8, kind: move, from: {line: 7, at: '+ [[q]]'}, at: '− q', text: 'subtract q'}
      - say: 'Divide both sides by 4, the coefficient of $p$, the number in front of it.'
        write: '$p = \dfrac{7 - q}{4}$'
        point:
          - {line: 9, kind: move, from: {line: 8, at: '[[4]]p'}, at: '4', text: '÷ 4'}
      - section: 'Check'
        say: 'Check: put this $p$ back into $4p$ plus $q$. The 4s cancel, and 7 minus $q$ plus $q$ is 7, which is the height of the second graph at $x$ equals 2.'
        write: 'Check: $4\left(\dfrac{7 - q}{4}\right) + q = 7 - q + q = 7$'
      - say: 'Therefore $p$ is 7 minus $q$, all over 4, which is answer choice A.'
        write: '$\therefore p = \dfrac{7 - q}{4}$'
        answer: true
    traps:
      B: 'You went for 8 minus $q$, over 2. That drops the minus 1 and divides by 2 instead of 4. At $x = 2$, $2x^2 - 1$ is 7, and $px^2$ is $4p$.'
      C: 'You went for $q$ minus 8, over 7. That mixes up which letter is the subject. From $4p + q = 7$, subtract $q$ from both sides, then divide both sides by 4.'
      D: 'You went for 7 over $q$ minus 1. The $q$ is added to $4p$, not multiplied, so subtract it: $4p = 7 - q$, then divide both sides by 4.'

  10:
    moments:
      - section: 'The question'
        say: 'Picture a rectangle with sides $m$ and $n$. One equation is linear and one is quadratic, so we use substitution: get one letter from the linear equation and put it into the quadratic.'
        write: 'Solve $m^{2} + n^{2} = 29$, $\ m + n = 7$'
        doodle: {name: 'custom:2001_q10_a', id: rect, caption: 'sides m and n', 'on': 'Picture'}
      - section: 'Solution'
        say: 'Solution. Number the equations. The quadratic one, $m$ squared plus $n$ squared equals 29, is equation 1.'
        write: '$m^{2} + n^{2} = 29 \quad \ldots\ldots (1)$'
      - say: 'The linear one, $m$ plus $n$ equals 7, is equation 2. The two sides of the rectangle add up to 7.'
        write: '$m + n = 7 \quad \ldots\ldots (2)$'
        doodle_do:
          - {id: rect, op: pulse, part: sum, 'on': 'add up to 7'}
      - section: 'Substitute'
        say: 'Make $m$ the subject of the linear equation: subtract $n$ from both sides. Label this new equation 3.'
        write: 'From (2): $\ m = 7 - n \quad \ldots\ldots (3)$'
      - say: 'Substitute equation 3 into equation 1. Wherever we see $m$, write 7 minus $n$, in a bracket.'
        write: 'Sub. (3) in (1): $\ (7 - n)^{2} + n^{2} = 29$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '= [[7 − n]]'}, at: '7 − n', text: 'sub in'}
      - say: 'To open the bracket, 7 minus $n$, all squared, means 7 minus $n$ times 7 minus $n$.'
        write: '$(7 - n)(7 - n) + n^{2} = 29$'
      - say: 'Expand: 7 times 7 is 49, 7 times minus $n$ is minus $7n$, twice, and minus $n$ times minus $n$ is plus $n$ squared.'
        write: '$49 - 7n - 7n + n^{2} + n^{2} = 29$'
      - say: 'Collect like terms, and subtract 29 from both sides so that the right side is zero.'
        write: '$2n^{2} - 14n + 49 - 29 = 0$'
      - say: '49 minus 29 is 20.'
        write: '$2n^{2} - 14n + 20 = 0$'
      - say: 'Every term divides by 2. Divide through by 2 to make the numbers smaller.'
        write: '$n^{2} - 7n + 10 = 0$'
      - section: 'Factorise: product and sum'
        say: 'Here $a$ is 1, $b$ is minus 7 and $c$ is 10. The product is $a$ times $c$, 10. The sum is $b$, minus 7.'
        write: 'Product $= ac = 10$, Sum $= b = -7$'
      - say: 'Two numbers that multiply to 10 and add to minus 7: minus 2 and minus 5. Minus 2 times minus 5 is 10, and minus 2 plus minus 5 is minus 7.'
        write: 'Factors: $-2,\ -5$'
      - say: 'Split the middle term. Minus $7n$ becomes minus $2n$ minus $5n$.'
        write: '$n^{2} - 2n - 5n + 10 = 0$'
        point:
          - {line: 12, kind: move, from: {line: 11, at: '[[−2]], −5'}, at: '−2n', text: 'split'}
          - {line: 12, kind: move, from: {line: 11, at: '−2, [[−5]]'}, at: '−5n'}
      - say: 'Group in pairs. From the first pair take out $n$, leaving $n$ minus 2. From the second pair take out minus 5, leaving $n$ minus 2 again.'
        write: '$n(n - 2) - 5(n - 2) = 0$'
      - say: 'The brackets match. Take out the common bracket, $n$ minus 2, and $n$ minus 5 is left.'
        write: '$(n - 2)(n - 5) = 0$'
      - say: 'Two brackets multiply to give zero, so one of them must be zero.'
        write: 'Either $n - 2 = 0$ or $n - 5 = 0$'
      - say: 'Add 2 to both sides of the first, and 5 to both sides of the second.'
        write: '$\therefore n = 2$ or $n = 5$'
      - section: 'Find m'
        say: 'Now find $m$ from equation 3, the linear one. When $n$ is 2, $m$ is 7 minus 2, which is 5.'
        write: 'Sub. in (3): $n = 2$, $\ m = 7 - 2 = 5$'
      - say: 'When $n$ is 5, $m$ is 7 minus 5, which is 2. Pair each $m$ with its own $n$.'
        write: '$n = 5$, $\ m = 7 - 5 = 2$'
      - section: 'Check'
        say: 'Check in equation 1: 5 squared plus 2 squared is 25 plus 4, which is 29. A 5 by 2 rectangle: the sides add to 7.'
        write: 'Check (1): $5^{2} + 2^{2} = 25 + 4 = 29$'
        doodle_do:
          - {id: rect, op: stage, stage: 'custom:2001_q10_a2', 'on': 'A 5 by 2'}
      - say: 'Therefore $m$, $n$ is 5, 2 or 2, 5. The options list the pairs as 2, 5 and 5, 2, which is answer choice D.'
        write: '$\therefore (m,\ n) = (5,\ 2)$ or $(2,\ 5)$'
        answer: true
    traps:
      A: 'You went for 5, 2 and 5, 3. The pair 5, 3 adds to 8, not 7, so it fails equation 2, $m + n = 7$.'
      B: 'You went for 5, 3 and 3, 5. Those add to 8, not 7, and 25 plus 9 is 34, not 29.'
      C: 'You went for 2, 3 and 3, 5. 2 plus 3 is 5 and 3 plus 5 is 8, so neither pair satisfies $m + n = 7$.'

  11:
    moments:
      - section: 'The question'
        say: 'Look at the powers: $3x$, $2x$ and $x$. Everything is built from $a$ to the power $x$. Give it one letter, and this becomes an ordinary long division.'
        write: '$\dfrac{a^{3x} - 26a^{2x} + 156a^{x} - 216}{a^{2x} - 24a^{x} + 108}$'
      - section: 'Solution'
        say: 'Solution. Let $a$ to the power $x$ be $u$.'
        write: 'Let $a^{x} = u$'
      - say: 'A power of a power: multiply the indices. $a$ to the power $2x$ is $a$ to the $x$, all squared, which is $u$ squared.'
        write: '$a^{2x} = (a^{x})^{2} = u^{2}$'
      - say: 'In the same way, $a$ to the power $3x$ is $a$ to the $x$, all cubed, which is $u$ cubed.'
        write: '$a^{3x} = (a^{x})^{3} = u^{3}$'
      - say: 'Substitute, and the question becomes: divide $u$ cubed minus 26 $u$ squared plus 156 $u$ minus 216, by $u$ squared minus 24 $u$ plus 108.'
        write: '$= \dfrac{u^{3} - 26u^{2} + 156u - 216}{u^{2} - 24u + 108}$'
      - section: 'Long division'
        say: 'Long division, as with numbers. First term: $u$ cubed divided by $u$ squared is $u$. That is the first term of the quotient.'
        write: '$u^{3} \div u^{2} = u$'
      - say: 'Multiply the whole divisor by $u$: $u$ cubed minus 24 $u$ squared plus 108 $u$.'
        write: '$u(u^{2} - 24u + 108) = u^{3} - 24u^{2} + 108u$'
      - say: 'Subtract it from the first three terms: change the signs and add. $u$ cubed cancels. Minus 26 plus 24 is minus 2. 156 minus 108 is 48.'
        write: 'Subtract: $-2u^{2} + 48u$'
      - say: 'Bring down the next term, minus 216.'
        write: 'Bring down: $\ -2u^{2} + 48u - 216$'
      - say: 'Next term: minus 2 $u$ squared divided by $u$ squared is minus 2.'
        write: '$-2u^{2} \div u^{2} = -2$'
      - say: 'Multiply the divisor by minus 2: minus 2 $u$ squared plus 48 $u$ minus 216.'
        write: '$-2(u^{2} - 24u + 108) = -2u^{2} + 48u - 216$'
      - say: 'Subtract, and every term cancels. The remainder is zero, so the division is exact.'
        write: 'Subtract: remainder $= 0$'
      - say: 'The terms we found, $u$ and minus 2, make the quotient: $u$ minus 2.'
        write: 'Quotient $= u - 2$'
        point:
          - {line: 12, kind: move, from: {line: 5, at: '= [[u]]'}, at: '[[u]] − 2', text: 'first term'}
          - {line: 12, kind: move, from: {line: 9, at: '= [[−2]]'}, at: '− 2', text: 'second term'}
      - section: 'Check'
        say: 'Check by multiplying back: quotient times divisor should give the top. $u$ minus 2, times $u$ squared minus 24 $u$ plus 108.'
        write: 'Check: $(u - 2)(u^{2} - 24u + 108)$'
      - say: '$u$ times the bracket, then minus 2 times the bracket.'
        write: '$= u^{3} - 24u^{2} + 108u - 2u^{2} + 48u - 216$'
      - say: 'Collect like terms: minus 24 minus 2 is minus 26, and 108 plus 48 is 156. That is exactly the top.'
        write: '$= u^{3} - 26u^{2} + 156u - 216 \ \checkmark$'
      - section: 'Exam tip'
        say: 'Exam tip: the bottom factorises. Product 108, sum minus 24: minus 6 and minus 18. Picture each factor as a block.'
        write: 'Exam tip: $u^{2} - 24u + 108 = (u - 6)(u - 18)$'
        doodle: {name: 'custom:2001_q11_a', id: blocks, caption: 'factors as blocks', 'on': 'Picture'}
      - say: 'So the top is $u$ minus 2, times $u$ minus 6, times $u$ minus 18. The blocks $u$ minus 6 and $u$ minus 18 cancel, leaving $u$ minus 2.'
        write: 'Top $= (u - 2)(u - 6)(u - 18)$'
        doodle_do:
          - {id: blocks, op: cross, part: six}
          - {id: blocks, op: cross, part: eighteen}
          - {id: blocks, op: circle, part: two}
      - say: 'Finally, put back $a$ to the power $x$ in place of $u$. The quotient is $a$ to the $x$ minus 2, which is answer choice C.'
        write: '$\therefore$ quotient $= a^{x} - 2$'
        point:
          - {line: 18, kind: move, from: {line: 1, at: 'ax'}, at: 'ax', text: 'u = aˣ'}
        answer: true
    traps:
      A: 'You went for $a^x$ minus 18. That is a factor of the divisor, not the quotient. The long division gives $u$ minus 2, so the answer is $a^x$ minus 2.'
      B: 'You went for $a^x$ minus 6. That is a factor of the divisor too. In the long division the second term is minus 2 $u$ squared divided by $u$ squared, which is minus 2.'
      D: 'You went for $a^x$ plus 2. The sign slipped. After subtracting, the remainder line starts with minus 2 $u$ squared, and minus 2 $u$ squared divided by $u$ squared is minus 2.'

  12:
    moments:
      - section: 'The question'
        say: 'We want whole-number points $x$, $y$ that satisfy all four conditions at once. The two strict signs, $y$ less than 3 and $x$ greater than 0, decide which points count.'
        write: '$3y + 5x \le 15,\quad 0 < y < 3,\quad x > 0$'
      - say: 'Solution. Start with $y$. It is a whole number greater than 0 and less than 3, so $y$ is 1 or 2. 3 itself is not allowed.'
        write: 'Solution: $\ 0 < y < 3 \Rightarrow y = 1$ or $2$'
      - say: '$x$ is a whole number greater than 0, so $x$ is at least 1.'
        write: '$x > 0 \Rightarrow x \ge 1$'
      - say: 'Here is the graph. The boundary line $3y$ plus $5x$ equals 15 cuts the axes at 3, 0 and 0, 5. The line $y$ equals 3 is the top limit.'
        diagram:
          id: g
          kind: graph
          x: [-1, 4]
          y: [-1, 6]
          plots:
            - {fn: '5 - 5x/3', label: '3y + 5x = 15', colour: blue}
            - {fn: '3', label: 'y = 3', colour: orange}
      - section: 'y = 1'
        say: 'Put $y$ equals 1 into the main inequality. 3 times 1 is 3.'
        write: '$y = 1$: $\ 3(1) + 5x \le 15$'
      - say: 'Subtract 3 from both sides: $5x$ is at most 12. Divide by 5: $x$ is at most 2.4. So $x$ is 1 or 2.'
        write: '$5x \le 12 \Rightarrow x \le 2.4$, $\ $so $x = 1,\ 2$'
        diagram_do:
          - {id: g, op: point, x: 1, y: 1, text: '(1, 1)', colour: green}
          - {id: g, op: point, x: 2, y: 1, text: '(2, 1)', colour: green}
      - section: 'y = 2'
        say: 'Now $y$ equals 2. 3 times 2 is 6.'
        write: '$y = 2$: $\ 3(2) + 5x \le 15$'
      - say: 'Subtract 6: $5x$ is at most 9. Divide by 5: $x$ is at most 1.8. So $x$ is 1 only.'
        write: '$5x \le 9 \Rightarrow x \le 1.8$, $\ $so $x = 1$'
        diagram_do:
          - {id: g, op: point, x: 1, y: 2, text: '(1, 2)', colour: green}
      - section: 'Answer'
        say: 'Collect the points, $x$ first, then $y$. All three lie under the boundary line and below $y$ equals 3.'
        write: '$\therefore\ (1,\ 1),\ (1,\ 2),\ (2,\ 1)$'
      - section: 'Check'
        say: 'Check a point just outside, 2, 2: 6 plus 10 is 16, more than 15. It lies above the line, so it is rightly left out.'
        write: 'Check $(2,\ 2)$: $\ 3(2) + 5(2) = 16 > 15\ \times$'
        diagram_do:
          - {id: g, op: point, x: 2, y: 2, text: '(2, 2) out', colour: red}
      - say: 'So the points are 1, 1, then 1, 2, and 2, 1: option C.'
        write: '$(1,\ 1),\ (1,\ 2),\ (2,\ 1)$'
        answer: true
    traps:
      A: 'You went for a list with 1, 3 in it. That point fits $3y + 5x \le 15$, since 9 plus 5 is 14, but $y$ must be strictly less than 3. The list also misses 1, 2.'
      B: 'You went for 1, 1, then 1, 2, then 1, 3. The point 1, 3 has $y = 3$, but $y$ must be strictly less than 3. You also missed 2, 1.'
      D: 'You went for a list with 3, 1 and 2, 2. For 3, 1: 3 plus 15 is 18, which is more than 15. For 2, 2: 6 plus 10 is 16, also too big.'

  13:
    moments:
      - section: 'The question'
        say: 'Triangle $SPT$ is bounded by two lines and the $x$-axis. One inequality for each edge. The options differ mainly on whether the triangle is above or below the axis.'
        write: '$2y - x - 2 = 0,\quad y + 2x + 2 = 0$'
        point:
          - {figure: 0, kind: circle, target: '2y − x − 2 = 0'}
          - {figure: 0, kind: circle, target: 'y + 2x + 2 = 0'}
      - section: 'The corners'
        say: 'Solution. $S$ and $T$ are on the $x$-axis, where $y$ is 0. Put $y$ equals 0 in the first line: minus $x$ minus 2 is 0, so $x$ is minus 2.'
        write: 'Solution: $\ S$: $\ 2(0) - x - 2 = 0 \Rightarrow x = -2$'
        point:
          - {figure: 0, kind: circle, target: 'S', text: 'x = −2'}
      - say: 'Put $y$ equals 0 in the second line: $2x$ plus 2 is 0, so $x$ is minus 1.'
        write: '$T$: $\ 0 + 2x + 2 = 0 \Rightarrow x = -1$'
        point:
          - {figure: 0, kind: circle, target: 'T', text: 'x = −1'}
      - say: '$P$ is where the lines meet. From the second line, $y$ is minus $2x$ minus 2. Substitute that into the first line.'
        write: '$P$: $\ 2(-2x - 2) - x - 2 = 0$'
        point:
          - {figure: 0, kind: circle, target: 'P', text: 'on both lines'}
      - say: 'Open the bracket and collect like terms: minus $4x$ minus 4 minus $x$ minus 2 is minus $5x$ minus 6. So $x$ is minus 1.2.'
        write: '$-5x - 6 = 0 \Rightarrow x = -1.2$'
      - say: 'Then $y$ is minus 2 times minus 1.2, minus 2. That is 2.4 minus 2, which is 0.4. $P$ is above the $x$-axis.'
        write: '$y = -2(-1.2) - 2 = 0.4$'
        point:
          - {figure: 0, kind: label, target: 'P', text: 'height 0.4'}
      - say: 'So the triangle sits on the upper side of the axis.'
        write: '$\therefore\ y \ge 0$'
      - section: 'Test a point'
        say: 'Test a point inside the triangle, minus 1.4, 0.1, in the first expression: 0.2 plus 1.4 minus 2 is minus 0.4. Negative, so at most 0.'
        write: 'Test $(-1.4,\ 0.1)$: $\ 2y - x - 2 = -0.4 \Rightarrow 2y - x - 2 \le 0$'
        point:
          - {figure: 0, kind: circle, target: {x: 152, y: 163}, text: '(−1.4, 0.1)'}
      - say: 'In the second: 0.1 minus 2.8 plus 2 is minus 0.7. Negative again, so at most 0.'
        write: '$y + 2x + 2 = -0.7 \Rightarrow y + 2x + 2 \le 0$'
      - say: 'All three corners have negative $x$, so every point of the triangle has $x$ at most 0 as well.'
        write: '$S,\ P,\ T$ all have $x < 0$: $\ x \le 0$'
      - section: 'Answer'
        say: 'So triangle $SPT$ is the solution of these four: option A.'
        write: '$\therefore\ 2y - x - 2 \le 0,\ y + 2x + 2 \le 0,\ y \ge 0,\ x \le 0$'
        answer: true
    traps:
      B: 'You went for the set with $y \le 0$. That describes points below the $x$-axis, but $P$ is at height 0.4, so the triangle is above the axis: $y \ge 0$.'
      C: 'You went for the set with $y \le 0$ and $x \le -1$. $P$ is at height 0.4, so the triangle lies above the axis. And $T$ is at $x = -1$ while $S$ is at $-2$, so $x \le -1$ is not an edge.'
      D: 'You went for the set that starts with minus $2y < x$. That first inequality is not one of the boundary lines, and $y \le 0$ puts the region below the axis. The triangle is above it.'

  14:
    moments:
      - section: 'The question'
        say: 'In an A.P., the sixth term is half of the twelfth term. The options compare the first term with the common difference. So we want a link between $a$ and $d$.'
        write: '$T_{6} = \dfrac{1}{2}T_{12}$; $\ a = ?$'
        doodle: {name: 'custom:2001_q14_a', id: stairs, caption: 'an AP is a staircase'}
      - section: 'Solution'
        say: 'Solution. Let the first term be $a$ and the common difference be $d$. The $n$th term of an A.P. is $a$ plus $n$ minus 1, times $d$.'
        write: 'Solution: $T_{n} = a + (n - 1)d$'
      - say: 'For the sixth term, $n$ minus 1 is 5.'
        write: '$T_{6} = a + 5d$'
        doodle_do:
          - {id: stairs, op: highlight, part: six}
      - say: 'For the twelfth term, $n$ minus 1 is 11.'
        write: '$T_{12} = a + 11d$'
        doodle_do:
          - {id: stairs, op: highlight, part: twelve}
      - say: 'Substitute both into the condition: the sixth term is half of the twelfth.'
        write: '$a + 5d = \dfrac{1}{2}(a + 11d)$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: 'a + 5d'}, at: '[[a + 5d]] =', text: 'T6'}
          - {line: 4, kind: move, from: {line: 3, at: 'a + 11d'}, at: '(a + 11d)', text: 'T12'}
      - say: 'Multiply both sides by 2 to clear the fraction.'
        write: '$2a + 10d = a + 11d$'
      - say: 'Collect like terms: subtract $a$ and $10d$ from both sides. $2a$ minus $a$ is $a$, and $11d$ minus $10d$ is $d$.'
        write: '$2a - a = 11d - 10d$'
      - say: 'Therefore $a$ equals $d$: the first term equals the common difference.'
        write: '$\therefore\ a = d$'
        doodle_do:
          - {id: stairs, op: label, part: first, text: 'a = d'}
      - section: 'Check'
        say: 'Check with numbers. Take $a$ and $d$ both equal to 1. The sixth term is 1 plus 5, which is 6, and the twelfth is 1 plus 11, which is 12. 6 is half of 12.'
        write: 'Check: $a = d = 1$: $\ T_{6} = 6,\ T_{12} = 12,\ 6 = \dfrac{1}{2}(12)\ \checkmark$'
      - say: 'Therefore the first term is equal to the common difference, which is answer choice C.'
        write: '$\therefore$ first term $=$ common difference'
        answer: true
    traps:
      A: 'You went for half of the common difference. The half belongs to the twelfth term. Clearing it gives $2a$ plus $10d$ equals $a$ plus $11d$, and that leaves $a$ equals $d$.'
      B: 'You went for double the common difference. From $2a$ plus $10d$ equals $a$ plus $11d$: $2a$ minus $a$ is just $a$, and $11d$ minus $10d$ is just $d$. So $a$ equals $d$.'
      D: 'You went for zero. If $a$ were 0, the sixth term would be $5d$ and the twelfth $11d$, and $5d$ is not half of $11d$. The equation gives $a$ equals $d$.'

  15:
    moments:
      - section: 'The question'
        say: 'A man saves 100 naira in his first year, and each year 20 naira more than the year before. In how many years will his savings add up to 5,800 naira?'
        write: '₦100, ₦120, ₦140, … : total ₦5,800 after $n$ years?'
        doodle: {name: 'custom:2001_q15_a', id: savings, caption: '₦20 more saved each year'}
      - section: 'Solution'
        say: 'Solution. The yearly savings go up by the same 20 naira, so they form an A.P. The first term $a$ is 100, $d$ is 20, and the sum is 5800. We want $n$.'
        write: '$a = 100,\ \ d = 20,\ \ S_{n} = 5800,\ \ n = ?$'
        doodle_do:
          - {id: savings, op: label, part: steps, text: '+₦20 each year'}
      - say: 'The total is a sum, not one year''s saving. The sum of $n$ terms of an A.P. is $n$ over 2, times, 2 $a$ plus $n$ minus 1 times $d$.'
        write: '$S_{n} = \dfrac{n}{2}[2a + (n - 1)d]$'
      - say: 'Substitute $S$ $n$ equals 5800, $a$ equals 100 and $d$ equals 20.'
        write: '$5800 = \dfrac{n}{2}[2(100) + (n - 1)(20)]$'
        doodle_do:
          - {id: savings, op: fill, to: 0.3}
      - say: '2 times 100 is 200, and 20 times, $n$ minus 1, is $20n$ minus 20.'
        write: '$5800 = \dfrac{n}{2}[200 + 20n - 20]$'
      - say: '200 minus 20 is 180.'
        write: '$5800 = \dfrac{n}{2}(180 + 20n)$'
      - say: 'Half of each term in the bracket: 180 over 2 is 90, and $20n$ over 2 is $10n$.'
        write: '$5800 = n(90 + 10n)$'
      - say: 'Open the bracket, and bring 5800 to the left, so the right side is 0.'
        write: '$10n^{2} + 90n - 5800 = 0$'
      - say: 'Every term divides by 10.'
        write: '$n^{2} + 9n - 580 = 0$'
      - section: 'Factorise'
        say: 'Product and sum. The product is negative 580 and the sum is 9. The factors are 29 and negative 20: 29 times negative 20 is negative 580, and 29 minus 20 is 9.'
        write: 'Product $= -580$, Sum $= 9$: $\ 29,\ -20$'
      - say: 'Split the middle term, $9n$, into $29n$ minus $20n$.'
        write: '$n^{2} + 29n - 20n - 580 = 0$'
      - say: 'Group in pairs: $n$ times, $n$ plus 29, minus 20 times, $n$ plus 29. The brackets match.'
        write: '$n(n + 29) - 20(n + 29) = 0$'
      - say: 'Take out the common bracket.'
        write: '$(n - 20)(n + 29) = 0$'
      - say: 'Either $n$ is 20 or $n$ is negative 29. A number of years cannot be negative, so we reject negative 29.'
        write: 'Either $n = 20$ or $n = -29$ (rejected)'
        point:
          - {line: 13, kind: strike, at: 'n = −29', text: 'not negative'}
      - say: 'Therefore he takes 20 years.'
        write: '$\therefore\ n = 20$ years'
        doodle_do:
          - {id: savings, op: fill, to: 1}
          - {id: savings, op: label, part: years, text: '20 years'}
      - section: 'Check'
        say: 'Check. In year 20 he saves 100 plus 19 times 20, which is 480 naira.'
        write: 'Check: $T_{20} = 100 + 19(20) = 480$'
      - say: 'Then $S$ 20 is 20 over 2, times 100 plus 480: 10 times 580, which is 5800. Correct.'
        write: '$S_{20} = \dfrac{20}{2}(100 + 480) = 5800\ \checkmark$'
      - say: 'Therefore he will save 5,800 naira in 20 years, which is answer choice A.'
        write: '$\therefore\ n = 20$ years'
        answer: true
    traps:
      B: 'You went for 29 years. 29 comes from the factor $n$ plus 29, but that factor gives $n$ equal to negative 29, which is rejected. The other root, 20, is the answer.'
      C: 'You went for 58 years. That is 5800 divided by 100, as if he saved 100 naira every year. His savings grow by 20 naira a year, so it takes fewer years.'
      D: 'You went for 100 years. That is the first year''s saving, not a number of years. Set the sum of the A.P. equal to 5800 and solve for $n$.'

  16:
    moments:
      - section: 'The question'
        say: 'The identity here is minus 1, not 0, so the inverse is not just minus 2. The inverse must bring 2 back to minus 1. We confirm the identity first.'
        write: '$a * b = a + b + 1$, identity $= -1$. Find the inverse of 2.'
      - section: 'The identity'
        say: 'Solution. Let $e$ be the identity element: $a$ star $e$ equals $e$ star $a$ equals $a$.'
        write: 'Solution: let $e$ be the identity: $a * e = e * a = a$'
      - say: 'Substitute $e$ for $b$ in the rule, and set it equal to $a$.'
        write: '$a + e + 1 = a$'
      - say: 'Subtract $a$ from both sides. The $a$ on each side cancels.'
        write: '$e + 1 = 0$'
      - say: 'Subtract 1 from both sides. So $e$ is minus 1, for every $a$, as the question says.'
        write: '$\therefore e = -1$'
      - section: 'The inverse'
        say: 'Let 2 inverse be the inverse of 2. Then 2 star 2 inverse equals the identity, minus 1.'
        write: 'Let $2^{-1}$ be the inverse of 2: $2 * 2^{-1} = e = -1$'
        doodle: {name: 'custom:2001_q16_a', id: inv, caption: '2 and its inverse give −1'}
      - say: 'Use the rule with $a$ as 2 and $b$ as 2 inverse: 2 plus 2 inverse plus 1.'
        write: '$2 + 2^{-1} + 1 = -1$'
      - say: 'Collect like terms: 2 plus 1 is 3.'
        write: '$2^{-1} + 3 = -1$'
      - say: 'Subtract 3 from both sides. Minus 1 minus 3 is minus 4.'
        write: '$\therefore 2^{-1} = -1 - 3 = -4$'
        doodle_do:
          - {id: inv, op: label, part: inx, text: '−4'}
      - section: 'Check'
        say: 'Check: 2 star minus 4 is 2 plus minus 4 plus 1. 2 minus 4 is minus 2, and minus 2 plus 1 is minus 1, the identity.'
        write: 'Check: $2 * (-4) = 2 + (-4) + 1 = -1\ \checkmark$'
        doodle_do:
          - {id: inv, op: highlight, part: out}
      - say: 'And the other way round: minus 4 star 2 is minus 4 plus 2 plus 1, which is also minus 1.'
        write: '$(-4) * 2 = -4 + 2 + 1 = -1\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the inverse of 2 is minus 4, which is option A.'
        write: '$\therefore 2^{-1} = -4$'
        answer: true
    traps:
      B: 'You went for minus 2. That is the inverse under ordinary addition, where the identity is 0. Here 2 star minus 2 is 2 minus 2 plus 1, which is 1, not the identity minus 1.'
      C: 'You went for 0. 2 star 0 is 2 plus 0 plus 1, which is 3, not minus 1. The inverse must give the identity, minus 1.'
      D: 'You went for 4. 2 star 4 is 2 plus 4 plus 1, which is 7. Set $2 + 2^{-1} + 1$ equal to minus 1 and solve: minus 4.'

  17:
    moments:
      - section: 'The question'
        say: 'A table for an operation on $k$, $l$ and $m$. One of the options is not even in the table. The identity is found by reading the table row by row.'
        write: 'Find the identity element of $\otimes$ on $\{k, l, m\}$'
      - say: 'Solution. Let me draw the table. The heading row runs along the top, and the same elements run down the side.'
        write: 'Solution'
        diagram:
          id: t
          kind: table
          columns: ['⊗', 'k', 'l', 'm']
          rows: [['k', 'l', 'm', 'k'], ['l', 'm', 'k', 'l'], ['m', 'k', 'l', 'm']]
      - say: 'Read a row first, then a column. For example, row $k$ and column $l$ meet at $m$, so $k$ circle-times $l$ is $m$.'
        write: 'Row, then column: $k \otimes l = m$'
        diagram_do:
          - {id: t, op: highlight, part: 'cell:1,l'}
      - section: 'The identity'
        say: 'Let $e$ be the identity element. Then $x$ circle-times $e$ equals $e$ circle-times $x$ equals $x$. In the picture, every element comes out as it went in.'
        write: 'Let $e$ be the identity: $x \otimes e = e \otimes x = x$'
        doodle: {name: 'custom:2001_q17_a', id: idn, caption: 'e leaves every element unchanged'}
      - say: 'So the identity''s row must copy the heading row exactly. The heading row reads $k$, $l$, $m$.'
        write: 'Heading row: $k,\ l,\ m$'
      - section: 'Row by row'
        say: 'Row $k$ reads $l$, $m$, $k$. That is not the heading row: $k$ circle-times $k$ is $l$. So $k$ is not the identity.'
        write: 'Row $k$: $l,\ m,\ k \neq$ heading row'
        diagram_do:
          - {id: t, op: highlight, part: 'row:1', colour: red}
      - say: 'Row $l$ reads $m$, $k$, $l$. Not the heading row either: $l$ circle-times $k$ is $m$.'
        write: 'Row $l$: $m,\ k,\ l \neq$ heading row'
        diagram_do:
          - {id: t, op: highlight, part: 'row:2', colour: red}
      - say: 'Row $m$ reads $k$, $l$, $m$. That copies the heading row exactly.'
        write: 'Row $m$: $k,\ l,\ m =$ heading row'
        diagram_do:
          - {id: t, op: highlight, part: 'row:3', colour: green}
        doodle_do:
          - {id: idn, op: stage, stage: 'custom:2001_q17_a2'}
      - section: 'Check'
        say: 'An identity works from both sides, so check column $m$ too. Going down, it reads $k$, $l$, $m$: $k$ circle-times $m$ is $k$, and so on.'
        write: 'Check: $k \otimes m = k,\ l \otimes m = l,\ m \otimes m = m\ \checkmark$'
        diagram_do:
          - {id: t, op: highlight, part: 'col:m', colour: green}
      - section: 'Answer'
        say: 'Therefore the identity element is $m$, which is option C.'
        write: '$\therefore e = m$'
        answer: true
        diagram_do:
          - {id: t, op: label, part: 'cell:3,1', text: 'e = m', answer: true}
        doodle_do:
          - {id: idn, op: pulse, part: answer}
    traps:
      A: 'You went for $k$. Row $k$ reads $l$, $m$, $k$, so $k$ changes the other elements: $k \otimes k$ is $l$. The identity''s row must copy the heading row.'
      B: 'You went for $l$. Row $l$ reads $m$, $k$, $l$, which is not the heading row. Only row $m$ reads $k$, $l$, $m$.'
      D: 'You went for $o$. That letter is not in the table at all. The identity must be one of the elements $k$, $l$ or $m$.'

  18:
    moments:
      - section: 'The question'
        say: 'We want $k^{2}$ plus $k$ plus $I$. We find $k^{2}$ first, by multiplying $k$ by itself, then add $k$, then add $I$.'
        write: '$k = \begin{pmatrix} 2 & 1 \\ 3 & 4 \end{pmatrix}$'
        doodle: {name: 'custom:2001_q18_a', id: grid, caption: 'row of k meets column of k'}
      - section: 'Solution'
        say: 'Solution. $k^{2}$ means $k$ times $k$, not squaring each entry.'
        write: 'Solution: $k^{2} = \begin{pmatrix} 2 & 1 \\ 3 & 4 \end{pmatrix}\begin{pmatrix} 2 & 1 \\ 3 & 4 \end{pmatrix}$'
      - say: 'Multiply row by column, and write the products inside the matrix. Top left is row 1 times column 1: 2 times 2, plus 1 times 3. Top right is row 1 times column 2.'
        write: '$= \begin{pmatrix} (2)(2) + (1)(3) & (2)(1) + (1)(4) \\ (3)(2) + (4)(3) & (3)(1) + (4)(4) \end{pmatrix}$'
        doodle_do:
          - {id: grid, op: highlight, part: row1, 'on': 'row 1'}
          - {id: grid, op: highlight, part: col1, 'on': 'column 1'}
      - say: 'Multiply each pair. 4 plus 3; 2 plus 4; 6 plus 12; 3 plus 16.'
        write: '$= \begin{pmatrix} 4 + 3 & 2 + 4 \\ 6 + 12 & 3 + 16 \end{pmatrix} = \begin{pmatrix} 7 & 6 \\ 18 & 19 \end{pmatrix}$'
      - say: '$I$ is the identity matrix: 1s on the leading diagonal, 0s everywhere else.'
        write: '$I = \begin{pmatrix} 1 & 0 \\ 0 & 1 \end{pmatrix}$'
        doodle_do:
          - {id: grid, op: stage, stage: 'custom:2001_q18_a2', 'on': 'identity'}
          - {id: grid, op: circle, part: diag, 'on': 'leading diagonal'}
      - say: 'Now add the three matrices. Matrices add entry by entry, each entry to the one in the same place.'
        write: '$k^{2} + k + I = \begin{pmatrix} 7 & 6 \\ 18 & 19 \end{pmatrix} + \begin{pmatrix} 2 & 1 \\ 3 & 4 \end{pmatrix} + \begin{pmatrix} 1 & 0 \\ 0 & 1 \end{pmatrix}$'
      - say: 'Top left: 7 plus 2 plus 1. Top right: 6 plus 1 plus 0. Bottom left: 18 plus 3 plus 0. Bottom right: 19 plus 4 plus 1.'
        write: '$= \begin{pmatrix} 7 + 2 + 1 & 6 + 1 + 0 \\ 18 + 3 + 0 & 19 + 4 + 1 \end{pmatrix}$'
      - say: 'That is 10, 7, 21 and 24.'
        write: '$\therefore\ k^{2} + k + I = \begin{pmatrix} 10 & 7 \\ 21 & 24 \end{pmatrix}$'
      - section: 'Check'
        say: 'Check one entry another way. $k^{2}$ plus $k$ is $k$ times $k$ plus $I$. Row 2 of $k$ is 3, 4; column 1 of $k + I$ is 3, 3. 9 plus 12 is 21, the bottom left.'
        write: 'Check: $k(k + I)$, bottom left $= (3)(3) + (4)(3) = 21\ \checkmark$'
      - say: 'Therefore the matrix is 10, 7, 21, 24, which is answer choice B.'
        write: '$\therefore\ k^{2} + k + I = \begin{pmatrix} 10 & 7 \\ 21 & 24 \end{pmatrix}$'
        answer: true
    traps:
      A: 'You went for 9, 8, 22, 23. That adds the 1s to the wrong corners. The identity matrix has its 1s on the leading diagonal, so the 9 and the 23 go up to 10 and 24.'
      C: 'You went for 7, 2, 12, 21. That does not match the row-by-column products. $k^{2}$ is 7, 6, 18, 19, and then you add $k$ and $I$.'
      D: 'You went for 6, 3, 13, 20. Work $k^{2}$ out entry by entry, row by column: 7, 6, 18, 19. Then add $k$, and add 1 on the leading diagonal only.'

  19:
    moments:
      - section: 'The question'
        say: 'A 3 by 3 determinant: nine entries in three rows and three columns. Every entry in the first row is minus 1, so watch the signs.'
        write: '$\begin{vmatrix} -1 & -1 & -1 \\ 3 & 1 & 1 \\ 1 & 2 & 1 \end{vmatrix}$'
      - section: 'Solution'
        say: 'Solution. We expand along the first row. Each entry of the first row is multiplied by its minor, and the signs along the first row are plus, minus, plus.'
        write: 'Solution: expand along the first row; signs $+,\ -,\ +$'
      - say: 'The minor of an entry is the 2 by 2 determinant left when we cover its row and column. A 2 by 2 determinant is $ad$ minus $bc$.'
        write: '$\begin{vmatrix} a & b \\ c & d \end{vmatrix} = ad - bc$'
      - section: 'Expand'
        say: 'Write all three terms. Plus minus 1 times the minor 1, 1, 2, 1. Minus minus 1 times the minor 3, 1, 1, 1. Plus minus 1 times the minor 3, 1, 1, 2.'
        write: '$= +(-1)\begin{vmatrix} 1 & 1 \\ 2 & 1 \end{vmatrix} - (-1)\begin{vmatrix} 3 & 1 \\ 1 & 1 \end{vmatrix} + (-1)\begin{vmatrix} 3 & 1 \\ 1 & 2 \end{vmatrix}$'
      - say: 'Work out each minor as $ad$ minus $bc$, with every product in brackets.'
        write: '$= -1[(1)(1) - (1)(2)] + 1[(3)(1) - (1)(1)] - 1[(3)(2) - (1)(1)]$'
      - say: 'The first minor is 1 minus 2, which is minus 1. The second is 3 minus 1, which is 2. The third is 6 minus 1, which is 5.'
        write: '$= -1(-1) + 1(2) - 1(5)$'
      - say: 'Minus 1 times minus 1 is plus 1. 1 times 2 is 2. Minus 1 times 5 is minus 5.'
        write: '$= 1 + 2 - 5$'
      - say: '1 plus 2 is 3, and 3 minus 5 is minus 2.'
        write: '$= -2$'
      - section: 'Check'
        say: 'Check by expanding along the third row instead: 1, 2, 1, with signs plus, minus, plus. The three minors are 0, 2 and 2.'
        write: 'Check (3rd row): $1(-1 + 1) - 2(-1 + 3) + 1(-1 + 3) = 0 - 4 + 2 = -2\ \checkmark$'
      - say: 'Therefore the determinant is minus 2, which is option B.'
        write: '$\therefore$ determinant $= -2$'
        answer: true
    traps:
      A: 'You went for 4. A sign has slipped in one of the terms. Expand along the first row with the signs plus, minus, plus: the terms are 1, 2 and minus 5, which add to minus 2.'
      C: 'You went for minus 4. That takes the first term as minus 1. But it is minus 1 times minus 1, which is plus 1, and 1 plus 2 minus 5 is minus 2.'
      D: 'You went for minus 12. Each minor is multiplied by its own entry, minus 1 each time, with the signs plus, minus, plus: 1, 2 and minus 5. They add to minus 2.'

  20:
    moments:
      - section: 'The question'
        say: 'We want negative 2 times the matrix $P$. Multiplying a matrix by a number is called scalar multiplication.'
        write: '$P = \begin{pmatrix} 3 & -3 & 4 \\ 5 & 0 & 6 \\ 1 & 2 & 1 \end{pmatrix}$'
      - section: 'Solution'
        say: 'Solution. To multiply a matrix by a number, multiply every entry by that number. The order stays 3 by 3.'
        write: 'Solution: $-2P = -2\begin{pmatrix} 3 & -3 & 4 \\ 5 & 0 & 6 \\ 1 & 2 & 1 \end{pmatrix}$'
      - say: 'Write each product inside the matrix, with every number in brackets so the signs are clear.'
        write: '$= \begin{pmatrix} (-2)(3) & (-2)(-3) & (-2)(4) \\ (-2)(5) & (-2)(0) & (-2)(6) \\ (-2)(1) & (-2)(2) & (-2)(1) \end{pmatrix}$'
      - say: 'The sign rule: a negative times a positive is negative, and a negative times a negative is positive. Times negative 2, each number moves to the other side of zero, twice as far out.'
        write: '$(-)(+) = -,\quad (-)(-) = +$'
        doodle: {name: 'custom:2001_q20_a', id: lines, caption: 'what × (−2) does'}
        doodle_do:
          - {id: lines, op: stage, stage: 'custom:2001_q20_a2', 'on': 'other side'}
      - say: 'First row: negative 2 times 3 is negative 6. Negative 2 times negative 3 is positive 6. Negative 2 times 4 is negative 8.'
        write: 'Row 1: $-6,\ 6,\ -8$'
      - say: 'Second row: negative 2 times 5 is negative 10. Negative 2 times 0 is 0. Negative 2 times 6 is negative 12.'
        write: 'Row 2: $-10,\ 0,\ -12$'
      - say: 'Third row: negative 2 times 1 is negative 2, times 2 is negative 4, and times 1 is negative 2.'
        write: 'Row 3: $-2,\ -4,\ -2$'
      - say: 'Put the three rows together.'
        write: '$\therefore\ -2P = \begin{pmatrix} -6 & 6 & -8 \\ -10 & 0 & -12 \\ -2 & -4 & -2 \end{pmatrix}$'
      - section: 'Check'
        say: 'Check: multiplying by a negative number changes the sign of every non-zero entry. The positive entries of $P$ became negative, the negative 3 became positive 6, and the 0 stayed 0.'
        write: 'Check: every non-zero entry changed sign $\checkmark$'
        doodle_do:
          - {id: lines, op: pulse, part: rule}
      - say: 'Therefore negative 2 $P$ is the matrix with rows negative 6, 6, negative 8; negative 10, 0, negative 12; and negative 2, negative 4, negative 2. That is answer choice D.'
        write: '$\therefore\ -2P = \begin{pmatrix} -6 & 6 & -8 \\ -10 & 0 & -12 \\ -2 & -4 & -2 \end{pmatrix}$'
        answer: true
    traps:
      A: 'You went for the matrix with 5, 0, 6 in the middle row. Those entries were not multiplied at all. Every entry must be multiplied by negative 2.'
      B: 'You went for the matrix with a positive 6 in the middle row and negative 14 at the bottom. Every entry is multiplied by negative 2: the 6 becomes negative 12, and the bottom row is negative 2, negative 4, negative 2.'
      C: 'You went for the matrix that starts negative 6, negative 4, 2. Negative 2 times negative 3 is positive 6, and negative 2 times 4 is negative 8. Go entry by entry.'

  21:
    moments:
      - section: 'The question'
        say: 'Each interior angle of a regular polygon is twice its exterior angle. Many students go straight for the interior angle. Nigerian teachers say: work through the exterior angle, it is simpler.'
        write: 'Int. $\angle = 2 \times$ Ext. $\angle$; find $n$'
      - section: 'Solution'
        say: 'Solution. Let me draw one corner of the polygon. The interior and exterior angles sit together on a straight line.'
        write: 'Solution: Int. $\angle$ + Ext. $\angle = 180^{\circ}$ ($\angle$s on a str. line)'
        show_sketch: true
        point:
          - {figure: sketch, kind: highlight, target: AD, text: 'straight line'}
          - {figure: sketch, kind: arc, target: ABC, text: 'interior'}
          - {figure: sketch, kind: arc, target: CBD, text: 'exterior'}
      - say: 'Let the exterior angle be $e$. The interior angle is twice it, so it is $2e$.'
        write: 'Let Ext. $\angle = e$, then Int. $\angle = 2e$'
        point:
          - {figure: sketch, kind: circle, target: 'e'}
          - {figure: sketch, kind: circle, target: '2e'}
      - say: 'Substitute into the straight-line equation: $2e$ plus $e$ equals 180.'
        write: '$2e + e = 180^{\circ}$'
      - say: '$2e$ plus $e$ is $3e$.'
        write: '$3e = 180^{\circ}$'
      - say: 'Divide both sides by 3. 180 divided by 3 is 60.'
        write: '$e = \dfrac{180^{\circ}}{3} = 60^{\circ}$'
        point:
          - {figure: sketch, kind: label, target: 'e', text: '60°'}
      - say: 'Each exterior angle of a regular polygon with $n$ sides is 360 over $n$, because the exterior angles add up to 360 degrees.'
        write: 'Ext. $\angle = \dfrac{360^{\circ}}{n}$ (regular polygon)'
      - say: 'Substitute 60 degrees for the exterior angle.'
        write: '$60^{\circ} = \dfrac{360^{\circ}}{n}$'
      - say: 'Cross-multiply and divide: $n$ is 360 over 60.'
        write: '$n = \dfrac{360^{\circ}}{60^{\circ}} = 6$'
        point:
          - {figure: sketch, kind: circle, target: 'n = ?', text: '6'}
      - section: 'Check'
        say: 'Check with the interior angle formula. With 6 sides, each interior angle is 6 minus 2, times 180, over 6. That is 4 times 180 over 6, which is 120, and 120 is twice 60.'
        write: 'Check: $\dfrac{(6 - 2) \times 180^{\circ}}{6} = 120^{\circ} = 2 \times 60^{\circ}\ \checkmark$'
      - say: 'Therefore the polygon has 6 sides. It is a hexagon, which is option C.'
        write: '$\therefore n = 6$ (a hexagon)'
        answer: true
    traps:
      A: 'You went for 2. A polygon needs at least 3 sides. The exterior angle is 60 degrees, and 360 divided by 60 is 6.'
      B: 'You went for 3. In an equilateral triangle the interior angle is 60 and the exterior is 120, so the interior is half the exterior, not twice it.'
      D: 'You went for 8. In a regular octagon the exterior angle is 45 and the interior is 135, which is three times, not twice. Here the exterior angle is 60, so $n$ is 6.'

