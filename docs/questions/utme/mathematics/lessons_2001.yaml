      C: 'You went for the set with $y \le 0$ and $x \le -1$. The $y \le 0$ is the problem: $P$ is at height 0.4, so the triangle lies above the axis. And $S$ at negative 2 and $T$ at negative 1 don''t fit a single $x \le -1$ edge.'
