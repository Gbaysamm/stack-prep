      C: 'You went for pi $r$ over 6. That takes 1 over 6 of pi $r$ instead of 1 over 6 of the whole circumference, 2 pi $r$.'
      D: 'You went for pi $r$ over 12. That would be the arc of a 15 degree angle. The angle at the centre is 60 degrees, and 60 over 360 of 2 pi $r$ is pi $r$ over 3.'

  26:
