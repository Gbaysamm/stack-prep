        write: 'When $y = 1$: $3(1) + 5x \le 15$'
      - say: '3 times 1 is 3. Subtract 3 from both sides: 15 minus 3 is 12.'
        write: '$5x \le 15 - 3 = 12$'
      - say: 'Divide both sides by 5. 12 over 5 is 2.4, so $x$ is at most 2.4. The whole numbers from 1 up to 2.4 are 1 and 2.'
        write: '$x \le 2.4$, so $x = 1 \text{ or } 2$'
      - say: 'That gives the points 1, 1 and 2, 1. Remember, each point is written $x$ first, then $y$.'
        write: 'Points: $(1,\ 1),\ (2,\ 1)$'
      - say: 'Now test $y = 2$. Replace $y$ with 2.'
        write: 'When $y = 2$: $3(2) + 5x \le 15$'
      - say: '3 times 2 is 6. Subtract 6 from both sides: 15 minus 6 is 9.'
        write: '$5x \le 15 - 6 = 9$'
      - say: 'Divide by 5. 9 over 5 is 1.8, so $x$ is at most 1.8. Only $x = 1$ works.'
        write: '$x \le 1.8$, so $x = 1$'
      - say: 'That gives the point 1, 2.'
        write: 'Point: $(1,\ 2)$'
      - say: 'Putting both cases together, the solutions are 1, 1, then 1, 2, and 2, 1. That''s answer choice C.'
        write: 'Solutions: $(1,\ 1),\ (1,\ 2),\ (2,\ 1)$'
        point:
