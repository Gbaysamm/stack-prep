# UTME 2001 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_2001.yaml. Answers match that file.
format_version: 1
exam_year: 2001
lessons:
  1:
    moments:
      - say: 'We want the principal that grows to ₦5,000 at simple interest, over 5 years, at 2% per annum. So ₦5,000 is the amount at the end, not the start.'
        write: 'Amount: ₦5,000'
      - say: 'With simple interest, the interest is the same every year. So the total interest rate is the rate times the number of years. 2% times 5 is 10%.'
        write: '$2\% \times 5 = 10\%$'
      - say: 'That means the amount is the principal, plus 10% of the principal. 10% is 0.1.'
        write: '$A = P + 0.1P$'
      - say: '$P$ plus $0.1P$ is $1.1P$.'
        write: '$A = 1.1P$'
      - say: 'Now we know the amount is 5000, so $1.1P$ equals 5000.'
        write: '$1.1P = 5000$'
      - say: 'How do we get $P$ by itself? We divide both sides by 1.1.'
        write: '$P = \dfrac{5000}{1.1}$'
      - say: '5000 divided by 1.1 is 4545.45, to the nearest kobo.'
        write: '$P = 4545.45$'
      - say: 'Let''s check. 10% of 4545.45 is 454.55, and 4545.45 plus 454.55 is exactly 5000. It works.'
        write: '$4545.45 + 454.55 = 5000$'
      - say: 'So the principal is ₦4,545.45, which is answer choice D.'
        write: 'Principal: ₦4,545.45'
        answer: true
    traps:
      A: 'You went for ₦5,000. That''s the amount at the end, after the interest has been added. The principal must be smaller, because interest is added to it.'
      B: 'You went for ₦4,900. Check it: 10% of 4900 is 490, and 4900 plus 490 is 5390, not 5000. Divide 5000 by 1.1 instead.'
      C: 'You went for ₦4,800. Check it: 10% of 4800 is 480, and 4800 plus 480 is 5280, not 5000. The principal is 5000 divided by 1.1.'

  2:
    moments:
      - say: 'A dealer buys a car for ₦250,000, spends ₦70,000 fixing it up, and sells it for ₦400,000. We want his percentage gain.'
      - say: 'The first thing we need is what the car really cost him. That''s the buying price plus the refurbishing money.'
        write: '$\text{Cost} = 250{,}000 + 70{,}000$'
      - say: '250,000 plus 70,000 is 320,000.'
        write: 'Cost: ₦320,000'
      - say: 'Now the profit. That''s the selling price minus the cost: 400,000 minus 320,000.'
        write: '$\text{Profit} = 400{,}000 - 320{,}000$'
      - say: '400,000 minus 320,000 is 80,000.'
        write: 'Profit: ₦80,000'
      - say: 'Percentage gain is the profit divided by the cost, times 100.'
        write: '$\%\text{ gain} = \dfrac{\text{profit}}{\text{cost}} \times 100$'
      - say: 'So we put 80,000 over 320,000, times 100.'
        write: '$\dfrac{80{,}000}{320{,}000} \times 100$'
      - say: '80,000 goes into 320,000 four times, so the fraction is one quarter.'
        write: '$= \dfrac{1}{4} \times 100$'
      - say: 'A quarter of 100 is 25. So the gain is 25%, which is answer choice B.'
        write: '$= 25\%$'
        answer: true
    traps:
      A: 'You went for 20%. That''s the profit as a fraction of the selling price, 80,000 over 400,000. Percentage gain is always measured against the cost, ₦320,000.'
      C: 'You went for 32%. That''s 80,000 over 250,000, which forgets the ₦70,000 refurbishing in the cost. The cost is everything he spent: ₦320,000.'
      D: 'You went for 60%. That ignores the refurbishing money completely: 150,000 over 250,000. The ₦70,000 is part of his cost, so the profit is only ₦80,000.'

  3:
    moments:
      - say: 'We need to evaluate 21.05347 minus 1.6324 times 0.43, to 3 decimal places.'
        write: '$21.05347 - 1.6324 \times 0.43$'
      - say: 'Remember the order of operations: multiplication comes before subtraction. So let''s do 1.6324 times 0.43 first.'
      - say: 'Ignore the decimal points for now. 16324 times 43 is 701,932.'
        write: '$16324 \times 43 = 701{,}932$'
      - say: 'Now count the decimal places. 1.6324 has four, and 0.43 has two. That''s six in total, so the product is 0.701932.'
        write: '$1.6324 \times 0.43 = 0.701932$'
      - say: 'Now we subtract that from 21.05347.'
        write: '$21.05347 - 0.701932$'
      - say: 'Line up the decimal points and subtract. We get 20.351538.'
        write: '$= 20.351538$'
      - say: 'To round to 3 decimal places, look at the fourth digit after the point. It''s a 5, so the third digit, 1, rounds up to 2.'
        write: '$20.351\underline{5}38$'
      - say: 'So the answer is 20.352, which is answer choice B.'
        write: '$\approx 20.352$'
        answer: true
    traps:
      A: 'You went for 20.351. That cuts the number off instead of rounding it. The next digit is 5, so the 1 rounds up to 2.'
      C: 'You went for 20.980. That comes from subtracting only about 0.07 instead of 0.70, so a decimal place slipped in the multiplication. 1.6324 times 0.43 is 0.701932.'
      D: 'You went for 20.981. A decimal place slipped in the product, so too little was taken away. 1.6324 times 0.43 is 0.701932, and 21.05347 minus that is 20.351538.'

  4:
    moments:
      - say: 'We need 0.14 squared, times 0.275, all over 7 times 0.02, to 3 decimal places.'
        write: '$\dfrac{(0.14)^{2} \times 0.275}{7(0.02)}$'
      - say: 'Let''s work out the top and the bottom separately. First, 0.14 squared. 14 squared is 196, and squaring doubles the decimal places from two to four.'
        write: '$(0.14)^{2} = 0.0196$'
      - say: 'Now multiply that by 0.275. 196 times 275 is 53,900, and we have seven decimal places, so we get 0.00539.'
        write: '$0.0196 \times 0.275 = 0.00539$'
      - say: 'Now the bottom. 7 times 0.02 is 0.14.'
        write: '$7 \times 0.02 = 0.14$'
      - say: 'So the whole thing is 0.00539 divided by 0.14.'
        write: '$\dfrac{0.00539}{0.14}$'
      - say: 'To clear the decimal on the bottom, multiply top and bottom by 100. That gives 0.539 over 14.'
        write: '$= \dfrac{0.539}{14}$'
      - say: '0.539 divided by 14 is 0.0385.'
        write: '$= 0.0385$'
      - say: 'To 3 decimal places, the fourth digit is 5, so we round up. That gives 0.039, which is answer choice B.'
        write: '$\approx 0.039$'
        answer: true
    traps:
      A: 'You went for 0.033. The exact value is 0.0385, so an arithmetic slip has crept in. Square 0.14 carefully to get 0.0196, then multiply and divide step by step.'
      C: 'You went for 0.308. That''s far too big, the kind of answer you get when a decimal place is lost. Squaring 0.14 gives 0.0196, with four decimal places.'
      D: 'You went for 0.358. That''s about ten times too big. Count the decimal places carefully: the answer is 0.0385, which rounds to 0.039.'

  5:
    moments:
      - say: 'We''re given $p$ equals 1 plus root 2, and $q$ equals 1 minus root 2. We want $p$ squared minus $q$ squared, over $2pq$.'
        write: '$\dfrac{p^{2} - q^{2}}{2pq}$'
      - say: 'The top is a difference of two squares, so let''s factorise it instead of expanding.'
        write: '$p^{2} - q^{2} = (p - q)(p + q)$'
      - say: 'First, $p$ plus $q$. The root 2 and the minus root 2 cancel, so we''re left with 1 plus 1, which is 2.'
        write: '$p + q = (1 + \sqrt{2}) + (1 - \sqrt{2}) = 2$'
      - say: 'Now $p$ minus $q$. The ones cancel, and root 2 minus negative root 2 is 2 root 2.'
        write: '$p - q = (1 + \sqrt{2}) - (1 - \sqrt{2}) = 2\sqrt{2}$'
      - say: 'So the top is 2 root 2 times 2, which is 4 root 2.'
        write: '$p^{2} - q^{2} = 2\sqrt{2} \times 2 = 4\sqrt{2}$'
      - say: 'Now the bottom. $pq$ is 1 plus root 2, times 1 minus root 2. That''s another difference of two squares: 1 squared minus root 2 squared.'
        write: '$pq = 1^{2} - (\sqrt{2})^{2}$'
      - say: '1 minus 2 is negative 1.'
        write: '$pq = 1 - 2 = -1$'
      - say: 'So $2pq$ is 2 times negative 1, which is negative 2.'
        write: '$2pq = -2$'
      - say: 'Now divide: 4 root 2 over negative 2.'
        write: '$\dfrac{4\sqrt{2}}{-2}$'
      - say: '4 divided by negative 2 is negative 2. So the answer is negative 2 root 2, which is answer choice C.'
        write: '$= -2\sqrt{2}$'
        answer: true
    traps:
      A: 'You went for negative 2 times 2 plus root 2. That comes from a slip when expanding the squares. Factorise the top as $(p - q)(p + q)$ to get $4\sqrt{2}$, with no whole-number part.'
      B: 'You went for 2 times 2 plus root 2. The top simplifies to $4\sqrt{2}$ and the bottom to negative 2, so there''s no plain number left over, and the sign is negative.'
      D: 'You went for 2 root 2. The size is right, but the sign is lost. $pq$ is 1 minus 2, which is negative 1, so the answer is negative.'

  6:
    moments:
      - say: 'We''re told $y$ over 2 equals $x$, and we have to evaluate this big fraction made of $x$ over $y$ terms.'
        write: '$\dfrac{\frac{x^{3}}{y^{3}} + \frac{1}{2}}{\frac{1}{2} - \frac{x^{2}}{y^{2}}}$'
      - say: 'The key is to find $x$ over $y$ as a number. If $y$ over 2 is $x$, then $y$ is $2x$.'
        write: '$y = 2x$'
      - say: 'So $x$ over $y$ is $x$ over $2x$. The $x$''s cancel, leaving one half.'
        write: '$\dfrac{x}{y} = \dfrac{x}{2x} = \dfrac{1}{2}$'
      - say: 'Then $x$ cubed over $y$ cubed is one half cubed, which is one eighth.'
        write: '$\dfrac{x^{3}}{y^{3}} = \left(\dfrac{1}{2}\right)^{3} = \dfrac{1}{8}$'
      - say: 'And $x$ squared over $y$ squared is one half squared, which is one quarter.'
        write: '$\dfrac{x^{2}}{y^{2}} = \left(\dfrac{1}{2}\right)^{2} = \dfrac{1}{4}$'
      - say: 'Now the top: one eighth plus one half. One half is four eighths, so we get five eighths.'
        write: '$\dfrac{1}{8} + \dfrac{4}{8} = \dfrac{5}{8}$'
      - say: 'The bottom: one half minus one quarter. One half is two quarters, so we get one quarter.'
        write: '$\dfrac{2}{4} - \dfrac{1}{4} = \dfrac{1}{4}$'
      - say: 'Now divide the top by the bottom. Dividing by one quarter is the same as multiplying by 4.'
        write: '$\dfrac{5}{8} \div \dfrac{1}{4} = \dfrac{5}{8} \times 4$'
      - say: '5 times 4 is 20, and 20 over 8 simplifies to 5 over 2. That''s answer choice D.'
        write: '$= \dfrac{20}{8} = \dfrac{5}{2}$'
        answer: true
    traps:
      A: 'You went for five sixteenths. That multiplies the top by one half instead of dividing by one quarter. Dividing by one quarter means multiplying by 4.'
      B: 'You went for five eighths. That''s just the top of the fraction. You still have to divide it by the bottom, which is one quarter.'
      C: 'You went for five quarters. That divides by one half instead of one quarter. The bottom is one half minus one quarter, which is one quarter.'

  7:
    moments:
      - say: 'We need to simplify the cube root of $64a^3$.'
        write: '$\sqrt[3]{64a^{3}}$'
      - say: 'A cube root can be taken of each factor separately. So we take the cube root of 64, and the cube root of $a$ cubed.'
        write: '$= \sqrt[3]{64} \times \sqrt[3]{a^{3}}$'
      - say: 'What number cubed gives 64? 4 times 4 is 16, and 16 times 4 is 64. So the cube root of 64 is 4.'
        write: '$\sqrt[3]{64} = 4$'
      - say: 'And a cube root undoes a cube, so the cube root of $a$ cubed is just $a$.'
        write: '$\sqrt[3]{a^{3}} = a$'
      - say: 'Put them together: 4 times $a$ is $4a$. That''s answer choice B.'
        write: '$= 4a$'
        answer: true
    traps:
      A: 'You went for $8a$. 8 is the square root of 64, but this is a cube root. 8 cubed is 512, while 4 cubed is 64.'
      C: 'You went for 1 over $4a$. That''s the reciprocal, which would need a negative power. A cube root just undoes the cube, giving $4a$.'
      D: 'You went for one quarter $a$. The cube root of 64 is 4, not one quarter. 4 cubed is 64.'

  8:
    moments:
      - say: 'We need to factorise $4x^2$ minus $9y^2$ plus $20x$ plus 25.'
        write: '$4x^{2} - 9y^{2} + 20x + 25$'
      - say: 'With four terms, look for a perfect square. The terms $4x^2$, $20x$ and 25 might be one, so let''s group them.'
        write: '$= (4x^{2} + 20x + 25) - 9y^{2}$'
      - say: 'Check: $2x$ squared is $4x^2$, 5 squared is 25, and 2 times $2x$ times 5 is $20x$. Yes, it''s a perfect square.'
        write: '$4x^{2} + 20x + 25 = (2x + 5)^{2}$'
      - say: 'And $9y^2$ is $3y$ all squared. So now we have one square minus another square.'
        write: '$= (2x + 5)^{2} - (3y)^{2}$'
      - say: 'Difference of two squares: $A$ squared minus $B$ squared is $A$ minus $B$, times $A$ plus $B$. Here $A$ is $2x + 5$ and $B$ is $3y$.'
        write: '$A^{2} - B^{2} = (A - B)(A + B)$'
      - say: 'So we get $2x + 5$ minus $3y$, times $2x + 5$ plus $3y$.'
        write: '$= \left[(2x + 5) - 3y\right]\left[(2x + 5) + 3y\right]$'
      - say: 'Tidying up the order, that''s $2x - 3y + 5$, times $2x + 3y + 5$. That''s answer choice C.'
        write: '$= (2x - 3y + 5)(2x + 3y + 5)$'
        answer: true
    traps:
      A: 'You went for $2x - 3y$ times $2x + 3y$. That only covers $4x^2 - 9y^2$ and drops the $20x + 25$. Group $4x^2 + 20x + 25$ as a perfect square first.'
      B: 'You went for $2x + 5$ times $2x - 9y + 5$. Expanding that gives a $-18xy$ term and a $-45y$ term, not $-9y^2$. The $9y^2$ must be written as $3y$ squared.'
      D: 'You went for $2x - 3y$ times $2x + 3y + 5$. Expanding gives $10x$ and $-15y$, not $20x + 25$. Spot the perfect square $(2x + 5)^2$ first.'

  9:
    moments:
      - say: 'Two graphs, $y = px^2 + q$ and $y = 2x^2 - 1$, meet at $x = 2$. We want $p$ in terms of $q$.'
      - say: 'Where two graphs meet, they have the same $y$ for the same $x$. So we set the two expressions equal.'
        write: '$px^{2} + q = 2x^{2} - 1$'
      - say: 'They meet at $x = 2$, so let''s replace $x$ with 2 on both sides.'
        write: '$p(2)^{2} + q = 2(2)^{2} - 1$'
      - say: '2 squared is 4. So the left side is $4p + q$.'
        write: '$4p + q = 2(4) - 1$'
      - say: 'On the right, 2 times 4 is 8, and 8 minus 1 is 7.'
        write: '$4p + q = 7$'
      - say: 'Now we make $p$ the subject. Subtract $q$ from both sides.'
        write: '$4p = 7 - q$'
      - say: 'Then divide both sides by 4. So $p$ is 7 minus $q$, over 4, which is answer choice A.'
        write: '$p = \dfrac{7 - q}{4}$'
        answer: true
    traps:
      B: 'You went for 8 minus $q$, over 2. That forgets the minus 1 on the right, and divides by 2 instead of 4. At $x = 2$, $2x^2 - 1$ is 7, and $px^2$ is $4p$.'
      C: 'You went for $q$ minus 8, over 7. That mixes up which letter is the subject. From $4p + q = 7$, subtract $q$ and divide by 4.'
      D: 'You went for 7 over $q$ minus 1. The $q$ is added to $4p$, not multiplied, so you subtract it: $4p = 7 - q$, then divide by 4.'

  10:
    moments:
      - say: 'We need to solve $m^2 + n^2 = 29$ and $m + n = 7$ together.'
        write: '$m^{2} + n^{2} = 29,\quad m + n = 7$'
      - say: 'There''s a useful identity: $m + n$ all squared is $m^2 + n^2$ plus $2mn$.'
        write: '$(m + n)^{2} = m^{2} + n^{2} + 2mn$'
      - say: 'Now fill in what we know. $m + n$ is 7, and $m^2 + n^2$ is 29.'
        write: '$7^{2} = 29 + 2mn$'
      - say: '7 squared is 49.'
        write: '$49 = 29 + 2mn$'
      - say: 'Subtract 29 from both sides. 49 minus 29 is 20.'
        write: '$2mn = 20$'
      - say: 'Divide by 2, and $mn$ is 10.'
        write: '$mn = 10$'
      - say: 'So we want two numbers that add to 7 and multiply to 10. Those are the roots of $t^2 - 7t + 10 = 0$.'
        write: '$t^{2} - 7t + 10 = 0$'
      - say: 'Which two numbers multiply to 10 and add to 7? 2 and 5.'
        write: '$(t - 2)(t - 5) = 0$'
      - say: 'So the numbers are 2 and 5.'
        write: '$t = 2 \text{ or } t = 5$'
      - say: 'Either one can be $m$. So the solutions are 2, 5 and 5, 2, which is answer choice D.'
        write: '$(2,\ 5) \text{ and } (5,\ 2)$'
        answer: true
    traps:
      A: 'You went for 5, 2 and 5, 3. The pair 5, 3 adds to 8, not 7, so it fails $m + n = 7$.'
      B: 'You went for 5, 3 and 3, 5. Those add to 8, not 7, and 25 plus 9 is 34, not 29.'
      C: 'You went for 2, 3 and 3, 5. 2 plus 3 is 5 and 3 plus 5 is 8, so neither pair adds to 7.'

  11:
    moments:
      - say: 'We need to divide $a^{3x} - 26a^{2x} + 156a^x - 216$ by $a^{2x} - 24a^x + 108$.'
        write: '$\dfrac{a^{3x} - 26a^{2x} + 156a^{x} - 216}{a^{2x} - 24a^{x} + 108}$'
      - say: 'Notice the powers: $a^{3x}$ is $a^x$ cubed, and $a^{2x}$ is $a^x$ squared. So let''s call $a^x$ by a single letter, $u$.'
        write: '$u = a^{x},\quad a^{2x} = u^{2},\quad a^{3x} = u^{3}$'
      - say: 'Now the division becomes an ordinary one with polynomials in $u$.'
        write: '$\dfrac{u^{3} - 26u^{2} + 156u - 216}{u^{2} - 24u + 108}$'
      - say: 'Let''s factorise the bottom. We want two numbers that multiply to 108 and add to negative 24. Negative 6 and negative 18 work.'
        write: '$u^{2} - 24u + 108 = (u - 6)(u - 18)$'
      - say: 'Now the top. Let''s try $u = 6$. 6 cubed is 216, 26 times 36 is 936, and 156 times 6 is 936.'
        write: '$216 - 936 + 936 - 216 = 0$'
      - say: 'It gives zero, so $u - 6$ is a factor of the top too. Dividing it out leaves $u^2 - 20u + 36$.'
        write: '$u^{3} - 26u^{2} + 156u - 216 = (u - 6)(u^{2} - 20u + 36)$'
      - say: 'Now factorise $u^2 - 20u + 36$. Two numbers that multiply to 36 and add to negative 20 are negative 2 and negative 18.'
        write: '$u^{2} - 20u + 36 = (u - 2)(u - 18)$'
      - say: 'So the whole division is this. The $u - 6$ and the $u - 18$ cancel, top and bottom.'
        write: '$\dfrac{(u - 6)(u - 2)(u - 18)}{(u - 6)(u - 18)} = u - 2$'
      - say: 'Finally, put $a^x$ back in place of $u$. The answer is $a^x - 2$, which is answer choice C.'
        write: '$= a^{x} - 2$'
        answer: true
    traps:
      A: 'You went for $a^x - 18$. That''s one of the factors that cancels, because it is on the top and the bottom. What''s left after cancelling is $a^x - 2$.'
      B: 'You went for $a^x - 6$. That factor is on both the top and the bottom, so it cancels. The factor left over is $a^x - 2$.'
      D: 'You went for $a^x + 2$. The sign is wrong. The top factorises with $u - 2$, because negative 2 and negative 18 multiply to 36 and add to negative 20.'

  12:
    moments:
      - say: 'We want whole-number pairs $x$, $y$ with $3y + 5x \le 15$, where $y$ is between 0 and 3, and $x$ is more than 0.'
        write: '$3y + 5x \le 15,\quad 0 < y < 3,\quad x > 0$'
      - say: 'First, $y$. It''s a whole number, bigger than 0 and less than 3. So $y$ can only be 1 or 2.'
        write: '$y = 1 \text{ or } y = 2$'
      - say: 'And $x$ is a whole number bigger than 0, so $x$ is at least 1.'
        write: '$x \ge 1$'
      - say: 'Let''s try $y = 1$. 3 times 1 is 3, so $3 + 5x \le 15$.'
        write: '$3(1) + 5x \le 15$'
      - say: 'Subtract 3 from both sides: $5x \le 12$. Divide by 5: $x \le 2.4$. So $x$ can be 1 or 2.'
        write: '$5x \le 12 \Rightarrow x \le 2.4$'
      - say: 'That gives the points 1, 1 and 2, 1.'
        write: '$(1,\ 1),\ (2,\ 1)$'
      - say: 'Now $y = 2$. 3 times 2 is 6, so $6 + 5x \le 15$.'
        write: '$3(2) + 5x \le 15$'
      - say: 'Subtract 6: $5x \le 9$. Divide by 5: $x \le 1.8$. So only $x = 1$ works.'
        write: '$5x \le 9 \Rightarrow x \le 1.8$'
      - say: 'That gives the point 1, 2.'
        write: '$(1,\ 2)$'
      - say: 'So the solutions are 1, 1, then 1, 2, and 2, 1. That''s answer choice C.'
        write: '$(1,\ 1),\ (1,\ 2),\ (2,\ 1)$'
        answer: true
    traps:
      A: 'You went for a list with 1, 3 in it. It fits $3y + 5x \le 15$, since 9 plus 5 is 14, but $y$ must be strictly less than 3. You also missed 1, 2.'
      B: 'You went for 1, 1, then 1, 2, then 1, 3. The point 1, 3 has $y = 3$, but $y$ must be strictly less than 3. You also missed 2, 1.'
      D: 'You went for a list with 3, 1 and 2, 2. For 3, 1: 3 plus 15 is 18, which is more than 15. For 2, 2: 6 plus 10 is 16, also too big.'

  13:
    moments:
      - say: 'In the graph, the triangle $SPT$ is made by the lines $2y - x - 2 = 0$, $y + 2x + 2 = 0$, and the $x$-axis. We want the inequalities that describe it.'
      - say: 'First, the corners. The line $2y - x - 2 = 0$ meets the $x$-axis where $y$ is zero. Then negative $x$ minus 2 is zero, so $x$ is negative 2. That''s $S$.'
        write: '$S:\ 2(0) - x - 2 = 0 \Rightarrow x = -2$'
      - say: 'The line $y + 2x + 2 = 0$ meets the $x$-axis where $2x + 2 = 0$, so $x$ is negative 1. That''s $T$.'
        write: '$T:\ 0 + 2x + 2 = 0 \Rightarrow x = -1$'
      - say: 'Now $P$, where the lines meet. The second line gives $y = -2x - 2$. Put that into the first line, $2y = x + 2$.'
        write: '$2(-2x - 2) = x + 2$'
      - say: 'Expand: negative $4x$ minus 4 equals $x$ plus 2.'
        write: '$-4x - 4 = x + 2$'
      - say: 'Subtract $x$ and add 4 to both sides: negative $5x$ equals 6. So $x$ is negative 1.2.'
        write: '$-5x = 6 \Rightarrow x = -1.2$'
      - say: 'Then $y$ is negative 2 times negative 1.2, minus 2. That''s 2.4 minus 2, which is 0.4.'
        write: '$y = 2.4 - 2 = 0.4$'
      - say: 'So $P$ is above the $x$-axis, and the triangle sits above the axis. That means $y \ge 0$.'
        write: '$y \ge 0$'
      - say: 'Now pick a point inside the triangle, like negative 1.4, 0.1, and test it in the first line''s expression.'
        write: '$2(0.1) - (-1.4) - 2 = -0.4$'
      - say: 'That''s negative, so the triangle has $2y - x - 2 \le 0$.'
        write: '$2y - x - 2 \le 0$'
      - say: 'Test the same point in the second expression: 0.1, plus 2 times negative 1.4, plus 2. That''s 0.1 minus 2.8 plus 2, which is negative 0.7.'
        write: '$0.1 + 2(-1.4) + 2 = -0.7$'
      - say: 'Negative again, so $y + 2x + 2 \le 0$.'
        write: '$y + 2x + 2 \le 0$'
