        write: '$= \dfrac{1}{10} \times 360^{\circ}$'
      - say: '360 divided by 10 is 36 degrees.'
        write: '$= 36^{\circ}$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:3,3', text: '36°', 'on': '36 degrees'}
        doodle_do:
          - {id: plots, op: label, part: cassava, text: '36°'}
