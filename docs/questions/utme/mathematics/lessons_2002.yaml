# UTME 2002 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS, taught the way a good whiteboard teacher teaches: one or two
# short things said, and at most one line written while they are said. The line starts being
# written as its words start, so every line of working must be here — the board shows nothing
# the lesson does not write, and a jump from "0 = 4x - 8" to "(2, 0)" reads as missing steps.
#
#   say:    what the teacher says. Plain spoken English; mathematics may be written in $...$
#           and is said in words ("2y equals 4x minus 8"). One or two short sentences.
#   write:  the one line written while it is said, in LaTeX, or left out for nothing.
#   answer: true on the moment that gives the answer, which the board marks.
#
#   traps:  said at the end to a student who chose that wrong option: why it tempts, kindly.
#
# Keyed on question number, like explanations_2002.yaml. Answers match that file.
format_version: 1
exam_year: 2002
lessons:
  1:
    moments:
      - say: 'A trader bought goats at ₦4,000 each and sold them all for ₦180,000, at a loss of 25%. We want the number of goats he bought.'
        write: 'Selling price: ₦180,000'
      - say: 'The key question is: what did he pay for all the goats? The ₦180,000 is what he sold them for, not what he paid.'
      - say: 'A loss of 25% means he got back 25% less than he paid. So the selling price is 100 minus 25, which is 75% of the cost.'
        write: '$100\% - 25\% = 75\%$'
      - say: 'So 75% of the cost price is ₦180,000. As a decimal, 75% is 0.75.'
        write: '$0.75 \times \text{cost} = 180{,}000$'
      - say: 'To get the cost by itself, divide both sides by 0.75.'
        write: '$\text{cost} = \dfrac{180{,}000}{0.75}$'
      - say: '0.75 is three quarters, and dividing by three quarters means dividing by 3 and multiplying by 4. 180,000 divided by 3 is 60,000, and 60,000 times 4 is 240,000.'
        write: '$\text{cost} = 240{,}000$'
      - say: 'So he paid ₦240,000 for all the goats. Each goat cost ₦4,000, so the number of goats is 240,000 divided by 4,000.'
        write: '$\text{number of goats} = \dfrac{240{,}000}{4{,}000}$'
      - say: 'Cancel three zeros on the top and the bottom. 240 divided by 4 is 60.'
        write: '$= \dfrac{240}{4} = 60$'
      - say: 'So he bought 60 goats, which is answer choice D.'
        write: '$60 \text{ goats}$'
        answer: true
    traps:
      A: 'You went for 36. That doesn''t come from the cost price. The ₦180,000 is 75% of what he paid, so he paid ₦240,000, and 240,000 divided by 4,000 is 60.'
      B: 'You went for 45. That''s 180,000 divided by 4,000, which uses the selling price. The goats cost ₦4,000 each to buy, so divide the cost price, ₦240,000, by 4,000.'
      C: 'You went for 50. The cost price has to be found exactly: the ₦180,000 is 75% of the cost, so the cost is 180,000 divided by 0.75, which is ₦240,000, giving 60 goats.'
  2:
    moments:
      - say: 'We''re asked to simplify the square of root 0.7 plus root 70.'
        write: '$\left(\sqrt{0.7} + \sqrt{70}\right)^{2}$'
      - say: 'Squaring a bracket means multiplying it by itself, and that follows the pattern: $a$ plus $b$, squared, equals $a$ squared plus $2ab$ plus $b$ squared.'
        write: '$(a + b)^{2} = a^{2} + 2ab + b^{2}$'
      - say: 'Here $a$ is root 0.7 and $b$ is root 70. Let''s put them into the pattern.'
        write: '$= (\sqrt{0.7})^{2} + 2\sqrt{0.7}\sqrt{70} + (\sqrt{70})^{2}$'
      - say: 'Squaring a square root just undoes it. So root 0.7 squared is 0.7, and root 70 squared is 70.'
        write: '$(\sqrt{0.7})^{2} = 0.7,\quad (\sqrt{70})^{2} = 70$'
      - say: 'Now the middle term. When two square roots multiply, we can put everything under one root.'
        write: '$2\sqrt{0.7}\sqrt{70} = 2\sqrt{0.7 \times 70}$'
      - say: '0.7 times 70 is 49. And the square root of 49 is 7.'
        write: '$= 2\sqrt{49} = 2 \times 7$'
      - say: '2 times 7 is 14. So the middle term is 14.'
        write: '$= 14$'
      - say: 'Now add the three pieces: 0.7 plus 14 plus 70.'
        write: '$0.7 + 14 + 70$'
      - say: '14 plus 70 is 84, and adding 0.7 gives 84.7, which is answer choice C.'
        write: '$= 84.7$'
        answer: true
    traps:
      A: 'You went for 217.7. The middle term came out too big. It''s 2 times root 0.7 times root 70, which is 2 times root 49, so just 2 times 7, which is 14.'
      B: 'You went for 168.7. That uses 2 times 49 for the middle term. But 49 is still under a square root: root 49 is 7, so the middle term is 2 times 7, which is 14.'
      D: 'You went for 70.7. That''s the two squares added with the middle term forgotten. Squaring a sum always gives a middle term, $2ab$, and here it is 14.'
  3:
    moments:
      - say: 'We need to evaluate this fraction of small decimals, correct to four significant figures.'
        write: '$\dfrac{0.21 \times 0.072 \times 0.0054}{0.006 \times 1.68 \times 0.063}$'
      - say: 'Rather than multiply everything out, let''s pair each number on top with one on the bottom and simplify each pair.'
        write: '$= \dfrac{0.21}{0.063} \times \dfrac{0.072}{0.006} \times \dfrac{0.0054}{1.68}$'
      - say: 'First pair: 0.21 over 0.063. Multiply top and bottom by 1000 to clear the decimals. That gives 210 over 63.'
        write: '$\dfrac{0.21}{0.063} = \dfrac{210}{63}$'
      - say: '210 and 63 are both divisible by 21. 210 divided by 21 is 10, and 63 divided by 21 is 3.'
        write: '$= \dfrac{10}{3}$'
      - say: 'Second pair: 0.072 over 0.006. Multiply top and bottom by 1000: 72 over 6, which is 12.'
        write: '$\dfrac{0.072}{0.006} = \dfrac{72}{6} = 12$'
      - say: 'Third pair: 0.0054 over 1.68. Multiply top and bottom by 10,000: 54 over 16,800.'
        write: '$\dfrac{0.0054}{1.68} = \dfrac{54}{16800}$'
      - say: 'Now multiply the first two: ten thirds times 12. 12 divided by 3 is 4, and 4 times 10 is 40.'
        write: '$\dfrac{10}{3} \times 12 = 40$'
      - say: 'So we have 40 times 54 over 16,800. 40 times 54 is 2,160.'
        write: '$40 \times \dfrac{54}{16800} = \dfrac{2160}{16800}$'
      - say: 'Cancel a zero from top and bottom to get 216 over 1,680. Then divide both by 24: 216 divided by 24 is 9, and 1,680 divided by 24 is 70.'
        write: '$= \dfrac{216}{1680} = \dfrac{9}{70}$'
      - say: '9 divided by 70 is 0.128571, and so on.'
        write: '$= 0.128571\ldots$'
      - say: 'For four significant figures, count from the first non-zero digit: 1, 2, 8, 5. The next digit is 7, which is 5 or more, so the 5 rounds up to 6.'
        write: '$\approx 0.1286$'
      - say: 'So the answer is 0.1286, which is answer choice A.'
        write: '$0.1286$'
        answer: true
    traps:
      B: 'You went for 0.1285. The digits are right, but the fifth significant digit is 7, so the fourth digit rounds up from 5 to 6. Don''t just chop the number off.'
      C: 'You went for 0.01286. The digits are right, but the decimal point has slipped one place. Pairing the factors keeps the size right: ten thirds times 12 times 54 over 16,800 is about 0.13.'
      D: 'You went for 0.01285. The decimal point has slipped one place, and the last digit was chopped instead of rounded up. The value is 0.128571..., which is 0.1286.'
  4:
    moments:
      - say: 'We have 220 students offering Biology or Mathematics or both. 125 offer Biology and 110 offer Mathematics. We want those who offer Biology but not Mathematics.'
      - say: 'Notice that 125 plus 110 is 235, which is more than 220. That''s because the students taking both subjects were counted twice.'
        write: '$125 + 110 = 235$'
      - say: 'The formula for two sets says: the union equals the first set plus the second set, minus the overlap.'
        write: '$n(B \cup M) = n(B) + n(M) - n(B \cap M)$'
      - say: 'Substitute: 220 equals 125 plus 110, minus the overlap.'
        write: '$220 = 125 + 110 - n(B \cap M)$'
      - say: '125 plus 110 is 235.'
        write: '$220 = 235 - n(B \cap M)$'
      - say: 'So the overlap is 235 minus 220, which is 15. 15 students offer both subjects.'
        write: '$n(B \cap M) = 235 - 220 = 15$'
      - say: 'Biology but not Mathematics means the Biology students with those 15 taken out.'
        write: '$n(B \text{ only}) = 125 - 15$'
      - say: '125 minus 15 is 110, which is answer choice B.'
        write: '$= 110$'
        answer: true
    traps:
      A: 'You went for 125. That''s everyone offering Biology, including the 15 who also offer Mathematics. The words ''but not Mathematics'' take those 15 away.'
      C: 'You went for 95. That''s 110 minus 15, the students offering Mathematics but not Biology. The question asks for Biology only, which is 125 minus 15.'
      D: 'You went for 80. First find the overlap: 125 plus 110 minus 220 is 15. Then Biology only is 125 minus 15, which is 110.'
  5:
    moments:
      - say: 'We need to simplify 52.4 minus 5.7 minus 3.45 minus 1.75.'
        write: '$52.4 - 5.7 - 3.45 - 1.75$'
      - say: 'The safest plan is to add up everything being taken away first, then subtract it all at once.'
        write: '$= 52.4 - (5.7 + 3.45 + 1.75)$'
      - say: 'Line up the decimal points. 5.7 is the same as 5.70. And 5.70 plus 3.45 is 9.15.'
        write: '$5.70 + 3.45 = 9.15$'
      - say: 'Now 9.15 plus 1.75. 0.15 plus 0.75 is 0.90, and 9 plus 1 is 10, so it''s 10.90.'
        write: '$9.15 + 1.75 = 10.90$'
      - say: 'So we take 10.9 away from 52.4.'
        write: '$52.4 - 10.9$'
      - say: 'Take away the 10 first: 52.4 minus 10 is 42.4.'
        write: '$52.4 - 10 = 42.4$'
      - say: 'Then take away the 0.9: 42.4 minus 0.9 is 41.5, which is answer choice C.'
        write: '$42.4 - 0.9 = 41.5$'
        answer: true
    traps:
      A: 'You went for 42.2. The amount taken away is 5.7 plus 3.45 plus 1.75, which is 10.9. Line up the decimal points, and 52.4 minus 10.9 is 41.5.'
      B: 'You went for 42.1. Check the decimals: 5.7 is 5.70, not 5.07. The three amounts add to 10.9, and 52.4 minus 10.9 is 41.5.'
      D: 'You went for 41.4. That''s just one tenth off. 52.4 minus 10 is 42.4, and 42.4 minus 0.9 is 41.5.'
  6:
    moments:
      - say: 'Without tables, we evaluate 343 to the power one third, times 0.14 to the power negative 1, times 25 to the power negative one half.'
        write: '$(343)^{\frac{1}{3}} \times (0.14)^{-1} \times (25)^{-\frac{1}{2}}$'
      - say: 'Let''s take each factor on its own. Remember: a fractional index means a root, and a negative index means a reciprocal, one over the number.'
      - say: 'First factor. The power one third means the cube root. 7 times 7 is 49, and 49 times 7 is 343. So the cube root of 343 is 7.'
        write: '$(343)^{\frac{1}{3}} = \sqrt[3]{343} = 7$'
      - say: 'Second factor. The power negative 1 means one over the number.'
        write: '$(0.14)^{-1} = \dfrac{1}{0.14}$'
      - say: 'Multiply top and bottom by 100 to clear the decimal: 100 over 14. Divide both by 2, and that''s 50 over 7.'
        write: '$= \dfrac{100}{14} = \dfrac{50}{7}$'
      - say: 'Third factor. The power negative one half means one over the square root. The square root of 25 is 5.'
        write: '$(25)^{-\frac{1}{2}} = \dfrac{1}{\sqrt{25}} = \dfrac{1}{5}$'
      - say: 'Now multiply the three together.'
        write: '$7 \times \dfrac{50}{7} \times \dfrac{1}{5}$'
      - say: 'The 7s cancel, leaving 50.'
        write: '$= 50 \times \dfrac{1}{5}$'
      - say: '50 divided by 5 is 10, which is answer choice C.'
        write: '$= 10$'
        answer: true
    traps:
      A: 'You went for 7. That''s only the first factor, the cube root of 343. Multiply it by the other two: 50 over 7, and one fifth.'
      B: 'You went for 8. Check each factor: the cube root of 343 is 7, one over 0.14 is 50 over 7, and one over root 25 is one fifth. Together they make 10.'
      D: 'You went for 12. The 7s cancel to leave 50, and 50 times one fifth is 10. Take care with one over 0.14: it is 100 over 14, which is 50 over 7.'
  7:
    moments:
      - say: 'In the diagram, two circles share the centre $O$. The small one has radius $r$, the big one radius $R$, and $r$ is two fifths of $R$. We want the shaded area.'
        write: '$r = \tfrac{2}{5}R$'
      - say: 'The shaded part is the ring between the circles. So its area is the big circle minus the small circle.'
        write: '$\text{shaded} = \pi R^{2} - \pi r^{2}$'
      - say: 'Now replace $r$ with two fifths of $R$.'
        write: '$= \pi R^{2} - \pi\left(\tfrac{2}{5}R\right)^{2}$'
      - say: 'To square two fifths, square the top and the bottom. 2 squared is 4, and 5 squared is 25.'
        write: '$\left(\tfrac{2}{5}R\right)^{2} = \tfrac{4}{25}R^{2}$'
      - say: 'So the small circle has area four twenty-fifths of $\pi R^{2}$.'
        write: '$= \pi R^{2} - \tfrac{4}{25}\pi R^{2}$'
      - say: 'Take out the common factor, $\pi R^{2}$.'
        write: '$= \left(1 - \tfrac{4}{25}\right)\pi R^{2}$'
      - say: '1 is twenty-five twenty-fifths, and 25 minus 4 is 21.'
        write: '$1 - \tfrac{4}{25} = \tfrac{25}{25} - \tfrac{4}{25} = \tfrac{21}{25}$'
      - say: 'So the shaded area is twenty-one twenty-fifths of $\pi R^{2}$, which is answer choice C.'
        write: '$\tfrac{21}{25}\pi R^{2}$'
        answer: true
    traps:
      A: 'You went for nine twenty-fifths. That''s three fifths squared, from taking 1 minus two fifths first and then squaring. Square the radius ratio first: the small circle is four twenty-fifths of the big one, leaving twenty-one twenty-fifths.'
      B: 'You went for five ninths. The ratio of areas is the square of the ratio of radii: two fifths squared is four twenty-fifths, and 1 minus that is twenty-one twenty-fifths.'
      D: 'You went for twenty-one twenty-thirds. The top is right, but the bottom must stay 25, because 5 squared is 25.'
  8:
    moments:
      - say: 'The line $2y - kx + 4 = 0$ is perpendicular to the line $y + \tfrac{1}{4}x - 7 = 0$. We want $k$.'
        write: '$2y - kx + 4 = 0$'
      - say: 'The key fact: when two lines are perpendicular, their gradients multiply to give negative 1.'
        write: '$m_1 \times m_2 = -1$'
      - say: 'Let''s put the first line in the form $y = mx + c$. Move the $kx$ and the 4 to the other side.'
        write: '$2y = kx - 4$'
      - say: 'Divide everything by 2.'
        write: '$y = \tfrac{k}{2}x - 2$'
      - say: 'So the first gradient is $k$ over 2.'
        write: '$m_1 = \tfrac{k}{2}$'
      - say: 'Now the second line. Move the quarter $x$ and the negative 7 to the other side.'
        write: '$y = -\tfrac{1}{4}x + 7$'
      - say: 'So the second gradient is negative one quarter.'
        write: '$m_2 = -\tfrac{1}{4}$'
      - say: 'Now multiply the gradients and set the product equal to negative 1.'
        write: '$\tfrac{k}{2} \times \left(-\tfrac{1}{4}\right) = -1$'
      - say: '2 times 4 is 8, so the left side is negative $k$ over 8.'
        write: '$-\tfrac{k}{8} = -1$'
      - say: 'Multiply both sides by negative 8, and $k$ is 8, which is answer choice D.'
        write: '$k = 8$'
        answer: true
    traps:
      A: 'You went for negative 8. That''s what you get if the product of the gradients is set to positive 1. For perpendicular lines the product is negative 1, so $k$ is positive 8.'
      B: 'You went for negative 4. Remember to divide the first line by 2: its gradient is $k$ over 2, not $k$. Then $k$ over 2 times negative one quarter equals negative 1 gives $k = 8$.'
      C: 'You went for 4. The first line''s gradient is $k$ over 2, and $k$ over 2 times negative one quarter is negative $k$ over 8. Setting that to negative 1 gives $k = 8$.'
  9:
    moments:
      - say: 'A bucket is 12 cm across the top, 8 cm across the bottom, and 4 cm deep. We want its volume.'
      - say: 'A bucket is wider at the top than the bottom, so it''s not a cylinder. It''s a frustum: a cone with its tip cut off.'
      - say: 'The volume of a frustum is $\pi h$ over 3, times the bracket $R^{2}$ plus $Rr$ plus $r^{2}$.'
        write: '$V = \dfrac{\pi h}{3}\left(R^{2} + Rr + r^{2}\right)$'
      - say: 'The formula uses radii, so halve the diameters. 12 divided by 2 is 6, and 8 divided by 2 is 4. The height is 4.'
        write: '$R = 6,\quad r = 4,\quad h = 4$'
      - say: 'Now the bracket, one piece at a time. $R^{2}$ is 6 squared, which is 36.'
        write: '$R^{2} = 36$'
      - say: '$R$ times $r$ is 6 times 4, which is 24.'
        write: '$Rr = 24$'
      - say: '$r^{2}$ is 4 squared, which is 16.'
        write: '$r^{2} = 16$'
      - say: 'Adding: 36 plus 24 is 60, and 60 plus 16 is 76.'
        write: '$36 + 24 + 16 = 76$'
      - say: 'Now put it all into the formula.'
        write: '$V = \dfrac{\pi \times 4}{3} \times 76$'
      - say: '4 times 76 is 304. So the volume is 304 $\pi$ over 3 cubic centimetres, which is answer choice B.'
        write: '$V = \dfrac{304\pi}{3}\ \text{cm}^{3}$'
        answer: true
    traps:
      A: 'You went for 144 $\pi$. That treats the bucket as a cylinder of radius 6, but the bottom is narrower than the top. The bucket is a frustum, so use the frustum formula.'
      C: 'You went for 72 $\pi$. The bucket is a frustum, so its volume is $\pi h$ over 3 times $R^{2} + Rr + r^{2}$, which is 4 $\pi$ over 3 times 76.'
      D: 'You went for 128 $\pi$. Use the frustum formula with the radii 6 and 4: the bracket is 36 plus 24 plus 16, which is 76, and 4 $\pi$ over 3 times 76 is 304 $\pi$ over 3.'
  10:
    moments:
      - say: 'In the diagram, $XZ$ is a diameter of the circle, the radius is 15 over 2 cm, and $XY$ is 12 cm. We want the area of triangle $XYZ$.'
      - say: 'Here''s the key fact: the angle in a semicircle is a right angle. Since $XZ$ is a diameter, the angle at $Y$ is 90 degrees.'
        write: '$\angle XYZ = 90^{\circ}$'
      - say: 'The diameter is twice the radius. 2 times 15 over 2 is 15. So $XZ$ is 15 cm, and it''s the hypotenuse.'
        write: '$XZ = 2 \times \tfrac{15}{2} = 15\ \text{cm}$'
      - say: 'Now let''s find the third side, $YZ$, using Pythagoras.'
        write: '$XZ^{2} = XY^{2} + YZ^{2}$'
      - say: 'Substitute 15 and 12.'
        write: '$15^{2} = 12^{2} + YZ^{2}$'
      - say: '15 squared is 225, and 12 squared is 144.'
        write: '$225 = 144 + YZ^{2}$'
      - say: 'Subtract 144 from both sides. 225 minus 144 is 81.'
        write: '$YZ^{2} = 81$'
      - say: 'The square root of 81 is 9.'
        write: '$YZ = 9\ \text{cm}$'
      - say: 'In a right-angled triangle, the two sides that meet at the right angle are the base and the height.'
        write: '$\text{Area} = \tfrac{1}{2} \times XY \times YZ$'
      - say: 'So the area is one half times 12 times 9.'
        write: '$= \tfrac{1}{2} \times 12 \times 9$'
      - say: 'Half of 12 is 6, and 6 times 9 is 54. So the area is 54 square centimetres, which is answer choice B.'
        write: '$= 54\ \text{cm}^{2}$'
        answer: true
    traps:
      A: 'You went for 75. The diameter, 15, is the hypotenuse, so it can''t be the base or height. Use the two sides that meet at the right angle at $Y$: 12 and 9.'
      C: 'You went for 45. Find the third side by Pythagoras: 15 squared minus 12 squared is 81, so $YZ$ is 9. Then the area is one half times 12 times 9, which is 54.'
      D: 'You went for 27. That''s half of the right answer, as if the one half was used twice. One half times 12 times 9 is 54.'
  11:
    moments:
      - say: 'Let''s find the midpoint of the $x$ and $y$ intercepts of the line $2y = 4x - 8$.'
        write: '$2y = 4x - 8$'
      - say: 'First, what is an intercept? It''s where the line crosses an axis. On the $x$-axis, $y$ is zero, and on the $y$-axis, $x$ is zero.'
      - say: 'So to find the $x$-intercept, let''s replace $y$ with zero.'
        write: '$2(0) = 4x - 8$'
      - say: 'Two times zero is zero, so we have zero equals $4x$ minus 8.'
        write: '$0 = 4x - 8$'
      - say: 'Now let''s add 8 to both sides. That gives us 8 equals $4x$.'
        write: '$4x = 8$'
      - say: 'To get $x$ by itself, divide both sides by 4. 8 divided by 4 is 2.'
        write: '$x = 2$'
      - say: 'So the line crosses the $x$-axis at the point 2, 0.'
        write: '$x\text{-intercept: } (2,\ 0)$'
      - say: 'Now the $y$-intercept. This time, we replace $x$ with zero.'
        write: '$2y = 4(0) - 8$'
      - say: '4 times zero is zero, so $2y$ equals negative 8.'
        write: '$2y = -8$'
      - say: 'Divide both sides by 2, and $y$ is negative 4.'
        write: '$y = -4$'
      - say: 'So the line crosses the $y$-axis at the point 0, negative 4.'
        write: '$y\text{-intercept: } (0,\ -4)$'
      - say: 'Now we have our two points. To find the midpoint, we average the $x$-values, and we average the $y$-values.'
        write: '$\text{midpoint} = \left(\dfrac{x_1 + x_2}{2},\ \dfrac{y_1 + y_2}{2}\right)$'
      - say: 'The $x$-values are 2 and 0. 2 plus 0 is 2, and 2 divided by 2 is 1.'
        write: '$\dfrac{2 + 0}{2} = 1$'
      - say: 'The $y$-values are 0 and negative 4. 0 plus negative 4 is negative 4, and negative 4 divided by 2 is negative 2.'
        write: '$\dfrac{0 + (-4)}{2} = -2$'
      - say: 'So the midpoint is 1, negative 2, which is answer choice D.'
        write: '$(1,\ -2)$'
        answer: true
    traps:
      A: 'You went for negative 1, negative 2. The $y$-value is right, but the $x$-value is 1, not negative 1: 2 plus 0 is positive 2, and half of that is positive 1.'
      B: 'You went for 1, 2. The $x$-value is right, but the $y$-intercept is negative 4, so the average of the $y$-values is negative 2, not 2. Watch the sign.'
      C: 'You went for 2, 0. That''s the $x$-intercept on its own. The question wants the point halfway between both intercepts.'
  12:
    moments:
      - say: 'A chord makes an angle of 120 degrees at the centre of a circle of diameter $4\sqrt{3}$ cm. We want the area of the major sector.'
      - say: 'The chord splits the circle into two sectors. The minor one has the 120 degrees. The major one is the rest of the full turn, so 360 minus 120, which is 240 degrees.'
        write: '$\theta = 360^{\circ} - 120^{\circ} = 240^{\circ}$'
      - say: 'Next, the radius is half the diameter. Half of $4\sqrt{3}$ is $2\sqrt{3}$.'
        write: '$r = \dfrac{4\sqrt{3}}{2} = 2\sqrt{3}$'
      - say: 'We need $r$ squared. Square the 2 and square the root 3: 4 times 3 is 12.'
        write: '$r^{2} = (2\sqrt{3})^{2} = 4 \times 3 = 12$'
      - say: 'The area of a sector is the angle over 360, times $\pi r^{2}$.'
        write: '$\text{Area} = \dfrac{\theta}{360} \times \pi r^{2}$'
      - say: 'Substitute 240 degrees and 12.'
        write: '$= \dfrac{240}{360} \times \pi \times 12$'
      - say: '240 over 360 simplifies. Divide both by 120, and it''s 2 over 3.'
        write: '$= \dfrac{2}{3} \times 12\pi$'
      - say: '12 divided by 3 is 4, and 4 times 2 is 8. So the area is 8 $\pi$ square centimetres, which is answer choice C.'
        write: '$= 8\pi\ \text{cm}^{2}$'
        answer: true
    traps:
      A: 'You went for 32 $\pi$. That uses the diameter as the radius. Halve it first: the radius is $2\sqrt{3}$, so $r^{2}$ is 12, not 48.'
      B: 'You went for 16 $\pi$. That''s the 120 degree sector with the diameter used as the radius. The major sector is 240 degrees, and the radius is half the diameter.'
      D: 'You went for 4 $\pi$. That''s the minor sector, using the 120 degrees. The major sector is the bigger part, 360 minus 120, which is 240 degrees.'
  13:
    moments:
      - say: 'We''re told $\tan\theta$ is 4 over 3, and we want $\sin^{2}\theta$ minus $\cos^{2}\theta$.'
        write: '$\tan\theta = \tfrac{4}{3}$'
      - say: 'Tangent is opposite over adjacent. So picture a right-angled triangle with the opposite side 4 and the adjacent side 3.'
