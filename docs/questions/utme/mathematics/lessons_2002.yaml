        write: 'Sectoral angle $= \dfrac{\text{acres}}{\text{total acres}} \times 360^{\circ}$'
        diagram: {id: t, kind: table, columns: [Crop, Acres, 'Sectoral angle'], rows: [[Rice, 2, ''], [Groundnut, 5, ''], [Cassava, 3, ''], [Cocoa, 11, ''], [Palm oil, 9, '']]}
      - say: 'First the total, so add all five.'
        write: 'Total $= 2 + 5 + 3 + 11 + 9$'
      - say: '2 plus 5 is 7, plus 3 is 10, plus 11 is 21, plus 9 is 30 acres.'
        write: '$= 30$ acres'
        diagram_do:
          - {id: t, op: total, part: 'col:2', 'on': '30 acres'}
        doodle_do:
          - {id: plots, op: label, text: '30 plots'}
      - section: 'Cassava'
        say: 'Cassava is the third crop, with 3 acres, the green plots. Substitute 3 over 30, times 360 degrees.'
        write: 'Cassava $= \dfrac{3}{30} \times 360^{\circ}$'
