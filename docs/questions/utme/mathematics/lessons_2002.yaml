  32:
    moments:
      - say: 'The 9th term of an A.P. is five times the 5th term. We want a relationship between the first term $a$ and the common difference $d$.'
        write: 'Given: $T_9 = 5 \times T_5$'
      - say: 'In an A.P. you start at $a$ and add $d$ each time. To reach the $n$th term you add $d$ one fewer times than $n$, so the $n$th term is $a$ plus $n$ minus 1 times $d$.'
        write: '$T_n = a + (n - 1)d$'
      - say: 'For the 9th term, put $n$ equals 9. 9 minus 1 is 8.'
        write: '$T_9 = a + (9 - 1)d = a + 8d$'
      - say: 'For the 5th term, put $n$ equals 5. 5 minus 1 is 4.'
        write: '$T_5 = a + (5 - 1)d = a + 4d$'
      - say: 'Now go back to the first line and replace each term with what we found.'
        write: '$a + 8d = 5(a + 4d)$'
      - say: 'Expand the bracket. 5 times $a$ is $5a$, and 5 times $4d$ is $20d$.'
        write: '$a + 8d = 5a + 20d$'
      - say: 'Move everything to the right side by taking $a$ and $8d$ from both sides.'
        write: '$0 = 5a - a + 20d - 8d$'
      - say: '$5a$ minus $a$ is $4a$, and $20d$ minus $8d$ is $12d$.'
        write: '$0 = 4a + 12d$'
      - say: 'Every term divides by 4. $4a$ over 4 is $a$, and $12d$ over 4 is $3d$.'
        write: '$0 = \dfrac{4a}{4} + \dfrac{12d}{4} = a + 3d$'
      - say: 'So $a$ plus $3d$ equals zero, which is answer choice B.'
        write: 'So $a + 3d = 0$'
        answer: true
