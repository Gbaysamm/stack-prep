# UTME 2002 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS, taught the way a good whiteboard teacher teaches: one or two
# short things said, and at most one line written while they are said. The line starts being
# written as its words start, so every line of working must be here — the board shows nothing
# the lesson does not write, and a jump from "0 = 4x - 8" to "(2, 0)" reads as missing steps.
#
#   say:    what the teacher says. Plain spoken English; mathematics may be written in $...$
#           and is said in words ("2y equals 4x minus 8"). One or two short sentences.
#   write:  the one line written while it is said, in LaTeX, or left out for nothing.
#   answer: true on the moment that gives the answer, which the board marks.
#
#   traps:  said at the end to a student who chose that wrong option: why it tempts, kindly.
#
# Keyed on question number, like explanations_2002.yaml. Answers match that file.
format_version: 1
exam_year: 2002
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'A trader bought goats at ₦4,000 each and sold them all for ₦180,000, at a loss of 25%. How many goats? The ₦180,000 is what he sold for, not what he paid.'
        write: 'S.P. = ₦180,000; loss $= 25\%$; C.P. of one goat = ₦4,000'
        doodle: {name: 'custom:2002_q01_a', id: goats, caption: 'Sold at a 25% loss'}
      - section: 'Solution'
        say: 'Solution. To count the goats, we need the total cost price, C.P. A loss of 25% means the selling price, S.P., is 100 minus 25, which is 75 percent of the C.P.'
        write: 'S.P. $= (100 - 25)\% = 75\%$ of C.P.'
        doodle_do:
          - {id: goats, op: highlight, part: loss}
      - say: 'So the C.P. is 100 over 75 times the S.P. In general, C.P. equals 100 over 100 minus the loss percent, times the S.P.'
        write: 'C.P. $= \dfrac{100}{100 - \text{loss}\%} \times$ S.P.'
      - section: 'Substitute'
        say: 'Now substitute. The loss is 25 and the S.P. is 180,000.'
        write: 'C.P. $= \dfrac{100}{75} \times 180{,}000$'
        point:
          - {line: 2, kind: box, text: 'the formula'}
        doodle_do:
          - {id: goats, op: circle, part: sold}
      - say: 'Cancel, so 100 over 75 is 4 over 3. 180,000 divided by 3 is 60,000, and 60,000 times 4 is 240,000.'
        write: '$= \dfrac{4}{3} \times 180{,}000 = 240{,}000$'
        doodle_do:
          - {id: goats, op: label, part: cost, text: 'C.P. = ₦240,000'}
        point:
          - {line: 4, kind: highlight, at: '240,000', to: {doodle: goats, part: cost}}
      - section: 'Count the goats'
        say: 'The number of goats is the total C.P. divided by the C.P. of one goat.'
        write: 'Number of goats $= \dfrac{240{,}000}{4{,}000}$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '= [[240,000]]'}, at: '[[240,000]]', text: 'total C.P.'}
      - say: 'Cancel three zeros top and bottom, so we get 240 over 4, which is 60.'
        write: '$= \dfrac{240}{4} = 60$'
        doodle_do:
          - {id: goats, op: label, part: goats, text: '60 goats'}
      - section: 'Check'
        say: 'To check, 60 goats at ₦4,000 is ₦240,000. A 25% loss is 60,000, and 240,000 minus 60,000 is 180,000, the S.P. It agrees.'
        write: 'Check: $240{,}000 - 25\%$ of $240{,}000 = 240{,}000 - 60{,}000 = 180{,}000$ ✓'
        doodle_do:
          - {id: goats, op: label, part: loss, text: '₦60,000'}
      - say: 'Therefore he bought 60 goats, which is option D.'
        write: '$\therefore$ number of goats $= 60$ (D)'
        answer: true
    traps:
      A: 'You went for 36. That treats ₦180,000 as 125% of the C.P., as if he made a profit. A loss means S.P. is 75% of C.P., so C.P. is ₦240,000, which buys 60 goats.'
      B: 'You went for 45. That is 180,000 divided by 4,000, using the S.P. The ₦4,000 is the C.P. of one goat, so divide the total C.P., ₦240,000, by 4,000.'
      C: 'You went for 50. That needs a C.P. of ₦200,000. But C.P. is 100 over 75 times 180,000, which is ₦240,000, giving 60 goats.'
  2:
    moments:
      - section: 'The question'
        say: 'Picture a square whose side is root 0.7 plus root 70. Most students forget the middle term when they square a bracket. Here the middle term is the biggest surprise.'
        doodle: {name: 'custom:2002_q02_a', id: tiles, caption: 'side a + b'}
        write: 'Simplify $\left(\sqrt{0.7} + \sqrt{70}\right)^{2}$'
      - say: 'Solution. Expand the bracket as the square of a sum, then simplify each term.'
        write: 'Solution'
      - section: 'Expand'
        say: 'When we square a sum, $a$ plus $b$, all squared, is $a$ squared plus $2ab$ plus $b$ squared. Here $a$ is root 0.7 and $b$ is root 70.'
        write: '$(a + b)^{2} = a^{2} + 2ab + b^{2}$'
      - say: 'Put them in. We get root 0.7 squared, plus 2 times root 0.7 times root 70, plus root 70 squared.'
        write: '$= (\sqrt{0.7})^{2} + 2\sqrt{0.7}\sqrt{70} + (\sqrt{70})^{2}$'
      - section: 'Simplify'
        say: 'Squaring a square root removes it. Root 0.7 squared is 0.7, the small pink square, and root 70 squared is 70, the big blue square. The middle goes under one root.'
        doodle_do:
          - {id: tiles, op: highlight, part: a-sq}
          - {id: tiles, op: highlight, part: b-sq}
        write: '$= 0.7 + 2\sqrt{0.7 \times 70} + 70$ $\quad [\sqrt{a}\sqrt{b} = \sqrt{ab}]$'
      - say: 'Now the middle term, the two yellow strips. 0.7 times 70 is 49, because 7 times 7 is 49.'
        doodle_do:
          - {id: tiles, op: circle, part: middle}
        write: '$= 0.7 + 2\sqrt{49} + 70$'
      - say: 'Root 49 is 7, so the middle term is 2 times 7.'
        write: '$= 0.7 + 2(7) + 70$'
      - say: '2 times 7 is 14. Both strips together are 14.'
        doodle_do:
          - {id: tiles, op: label, part: middle, text: '7 + 7 = 14'}
          - {id: tiles, op: stage, stage: 'custom:2002_q02_a2'}
        write: '$= 0.7 + 14 + 70$'
        point:
          - {line: 7, kind: highlight, at: '14', to: {doodle: tiles, part: middle}}
      - say: '14 plus 70 is 84, and adding 0.7 gives 84.7.'
        write: '$= 84.7$'
      - section: 'Check'
        say: 'Check with decimals. Root 0.7 is about 0.8367 and root 70 about 8.3666. Their sum is 9.2033, and 9.2033 squared is about 84.70.'
        write: 'Check: $(0.8367 + 8.3666)^{2} = 9.2033^{2} \approx 84.70\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the bracket squared is 84.7, which is option C.'
        write: '$\therefore \left(\sqrt{0.7} + \sqrt{70}\right)^{2} = 84.7$'
        answer: true
    traps:
      A: 'You went for 217.7. The middle term came out far too big. It is 2 times root 0.7 times root 70, which is 2 times root 49, so just 2 times 7, which is 14.'
      B: 'You went for 168.7. That uses 2 times 49 for the middle term. But the 49 is still under a square root. Root 49 is 7, so the middle term is 2 times 7, which is 14.'
      D: 'You went for 70.7. That is the two squares added with the middle term forgotten. Squaring a sum always gives a middle term, $2ab$, and here it is 14.'
  3:
    moments:
      - section: 'The question'
        say: 'We must evaluate six small decimals, correct to four significant figures. Two options differ only in the last digit, and two only in the decimal point. Cancel first, round last.'
        write: '$\dfrac{0.21 \times 0.072 \times 0.0054}{0.006 \times 1.68 \times 0.063}$ (4 s.f.)'
      - section: 'Solution'
        say: 'Solution. Multiplying can be done in any order, so pair each number on top with one below, like the three loops in the picture, and cancel each pair.'
        write: '$= \dfrac{0.21}{0.063} \times \dfrac{0.072}{0.006} \times \dfrac{0.0054}{1.68}$'
        doodle: {name: 'custom:2002_q03_a', id: pairs, caption: 'three pairs'}
      - section: 'Cancel each pair'
        say: 'For the first pair, multiply top and bottom by 1000 to clear the decimals, giving 210 over 63. Both divide by 21, so it is 10 over 3.'
        write: '$\dfrac{0.21}{0.063} = \dfrac{210}{63} = \dfrac{10}{3}$'
        doodle_do:
          - {id: pairs, op: label, part: res1, text: '10/3'}
      - say: 'For the second pair, multiply top and bottom by 1000, giving 72 over 6, which is 12.'
        write: '$\dfrac{0.072}{0.006} = \dfrac{72}{6} = 12$'
        doodle_do:
          - {id: pairs, op: label, part: res2, text: '12'}
      - say: 'For the third pair, multiply top and bottom by 10,000, giving 54 over 16,800.'
        write: '$\dfrac{0.0054}{1.68} = \dfrac{54}{16800}$'
        doodle_do:
          - {id: pairs, op: label, part: res3, text: '54/16800'}
      - section: 'Put the pairs together'
        say: 'Therefore the value is 10 over 3, times 12, times 54 over 16,800.'
        write: '$\therefore$ value $= \dfrac{10}{3} \times 12 \times \dfrac{54}{16800}$'
      - say: 'Now cancel. 3 into 12 is 4, and 4 times 10 is 40. Then 40 times 54 is 2,160.'
        write: '$= \dfrac{40 \times 54}{16800} = \dfrac{2160}{16800}$'
      - say: 'Cancel a zero, then divide top and bottom by 24. 216 divided by 24 is 9, and 1,680 divided by 24 is 70.'
        write: '$= \dfrac{216}{1680} = \dfrac{9}{70}$'
      - say: 'Now divide 9 by 70 by long division, and we get 0.128571 and so on.'
        write: '$= 9 \div 70 = 0.128571\ldots$'
      - section: 'Correct to 4 s.f.'
        say: 'For significant figures, start at the first non-zero digit, so we take 1, 2, 8, 5. Mark the cut after the 5.'
        write: 'Cut after 4 s.f.: $0.1285\,|\,71$'
      - say: 'The next digit is 7. The rule says 5 or more, add 1 to the last digit kept. So the 5 becomes 6.'
        write: 'Next digit $7$: add $1$, so $0.128571 = 0.1286$ (4 s.f.)'
      - section: 'Check'
        say: 'To check, 0.1286 times 70 is 9.002, very close to 9. It agrees.'
        write: 'Check: $0.1286 \times 70 = 9.002 \approx 9$ ✓'
      - say: 'Therefore the value is 0.1286, correct to four significant figures, which is option A.'
        write: '$\therefore$ value $= 0.1286$ (4 s.f.) (A)'
        answer: true
    traps:
      B: 'You went for 0.1285. The digits are right, but the next digit is 7, and 5 or more means add 1. So the 5 becomes 6, giving 0.1286.'
      C: 'You went for 0.01286. The digits are right, but the decimal point has slipped one place. The value is 9 over 70, which is about 0.13.'
      D: 'You went for 0.01285. The decimal point has slipped, and the last digit was cut off instead of rounded. 9 over 70 is 0.128571 and so on, which is 0.1286.'
  4:
    moments:
      - section: 'The question'
        say: '220 students offer Biology or Mathematics or both. 125 offer Biology and 110 offer Mathematics. But 125 plus 110 is 235, more than 220. Some names are on both lists. How many offer Biology but not Mathematics?'
        write: '220 students: Biology 125, Maths 110. Biology only $= ?$'
        doodle: {name: 'custom:2002_q04_a', id: lists, caption: 'Everyone offers at least one'}
      - section: 'Solution'
        say: 'Solution. Every one of the 220 offers at least one subject, so they are all inside the circles, and n of B union M is 220. n of B is 125 and n of M is 110.'
        write: '$n(B \cup M) = 220,\ n(B) = 125,\ n(M) = 110$'
      - say: 'We do not know how many offer both. Let n of B intersection M be x.'
        write: 'Let $n(B \cap M) = x$'
      - section: 'The Venn diagram'
        say: 'Now the Venn diagram, with a circle for Biology and a circle for Mathematics. Put x where they overlap.'
        diagram: {id: v, kind: venn, sets: [{key: B, name: Biology, total: 125}, {key: M, name: Maths, total: 110}]}
        diagram_do:
          - {id: v, op: fill, part: 'B∩M', text: 'x', colour: orange, 'on': overlap}
      - say: 'Biology only is 125 minus x. Mathematics only is 110 minus x.'
        write: 'Biology only $= 125 - x$, Maths only $= 110 - x$'
        diagram_do:
          - {id: v, op: fill, part: 'B only', text: '125 − x', 'on': 'Biology only'}
          - {id: v, op: fill, part: 'M only', text: '110 − x', 'on': 'Mathematics only'}
      - section: 'The equation'
        say: 'Each student is in exactly one region, so the three regions add up to the 220 students.'
        write: '$(125 - x) + x + (110 - x) = 220$'
      - say: 'Collect like terms. 125 plus 110 is 235. Minus x, plus x, minus x leaves minus x.'
        write: '$235 - x = 220$'
      - say: 'So x equals 235 minus 220, which is 15. Fifteen students are on both lists.'
        write: '$x = 235 - 220 = 15$'
        diagram_do:
          - {id: v, op: fill, part: 'B∩M', text: '15', 'on': 'which is 15'}
        doodle_do:
          - {id: lists, op: label, part: both, text: '15 on both'}
      - section: 'Biology only'
        say: 'Biology but not Mathematics is the region 125 minus x. Put x equals 15, and 125 minus 15 is 110.'
        write: 'Biology only $= 125 - x = 125 - 15 = 110$'
        diagram_do:
          - {id: v, op: fill, part: 'B only', text: '110', 'on': 'is 110'}
        point:
          - {line: 8, kind: move, from: {line: 7, at: '= [[15]]'}, at: '− 15', text: 'x'}
      - section: 'Check'
        say: 'Check. Mathematics only is 110 minus 15, which is 95. 110 plus 15 plus 95 is 220. It agrees.'
        write: 'Maths only $= 110 - 15 = 95$; $\ 110 + 15 + 95 = 220\ \checkmark$'
        diagram_do:
          - {id: v, op: fill, part: 'M only', text: '95', 'on': 'is 95'}
      - say: 'The formula gives x too. n of B union M equals n of B plus n of M minus n of B intersection M. 220 equals 235 minus x, so x is 15. The 15 on both lists were counted twice in 235.'
        write: '$n(B \cup M) = n(B) + n(M) - n(B \cap M) \Rightarrow 220 = 235 - x$'
        doodle_do:
          - {id: lists, op: highlight, part: both}
      - section: 'Answer'
        say: 'Therefore 110 students offer Biology but not Mathematics, which is answer choice B.'
        write: '$\therefore$ Biology only $= 110$'
        diagram_do:
          - {id: v, op: highlight, part: 'B only', text: 'Biology only: 110', answer: true}
        doodle_do:
          - {id: lists, op: label, part: bio, text: '110 Biology only'}
        answer: true
    traps:
      A: 'You went for 125. That is n of B, the whole Biology circle, which still includes the 15 in the overlap. Biology but not Mathematics is 125 minus 15, which is 110.'
      C: 'You went for 95. That is Mathematics only, 110 minus 15. The question asks for Biology only, 125 minus 15, which is 110.'
      D: 'You went for 80. Solve for x first: 235 minus x equals 220, so x is 15. Then Biology only is 125 minus 15, which is 110.'
  5:
    moments:
      - section: 'The question'
        say: 'Simplify 52.4 minus 5.7 minus 3.45 minus 1.75. Picture a rod 52.4 long with three pieces cut off. The danger is lining up the digits instead of the decimal points.'
        write: '$52.4 - 5.7 - 3.45 - 1.75$'
        doodle: {name: 'custom:2002_q05_a', id: rod, caption: '52.4, three pieces cut off'}
      - section: 'Solution'
        say: 'Solution. Taking away three numbers one after another is the same as taking away their sum. So add the three pieces first.'
        write: '$= 52.4 - (5.7 + 3.45 + 1.75)$'
        doodle_do:
          - {id: rod, op: circle, part: pieces}
      - section: 'Add the pieces'
        say: 'To add decimals, the decimal points must be in a line. 5.7 has one decimal place and the others have two, so write 5.7 as 5.70.'
        write: 'Points in a line: $5.7 = 5.70$'
      - say: 'Now add from the right. 0, 5 and 5 make 10, so write 0 carry 1. 7, 4, 7 and the carried 1 make 19, so write 9 carry 1. Then 5, 3, 1 and 1 make 10.'
        write: 'Add: $\begin{array}{r} 5.70 \\ 3.45 \\ +\ 1.75 \\ \hline 10.90 \end{array}$'
        doodle_do:
          - {id: rod, op: label, part: total, text: '10.9'}
      - say: 'So the bracket is 10.9, and we need 52.4 minus 10.9.'
        write: '$= 52.4 - 10.9$'
      - section: 'Subtract'
        say: 'Points in a line again. 4 minus 9 needs a borrow, so 14 minus 9 is 5. Then 1 minus 0 is 1, and 5 minus 1 is 4. So 41.5.'
        write: 'Subtract: $\begin{array}{r} 52.4 \\ -\ 10.9 \\ \hline 41.5 \end{array}$'
        doodle_do:
          - {id: rod, op: label, part: left, text: '41.5'}
      - section: 'Check'
        say: 'Check by adding back, and 41.5 plus 10.9 is 52.4. It agrees.'
        write: 'Check: $41.5 + 10.9 = 52.4$ ✓'
      - say: 'Or check from left to right. 52.4 minus 5.7 is 46.7. 46.7 minus 3.45 is 43.25. 43.25 minus 1.75 is 41.5. It is the same.'
        write: '$52.4 - 5.7 = 46.7;\ 46.7 - 3.45 = 43.25;\ 43.25 - 1.75 = 41.5$ ✓'
      - say: 'Therefore 52.4 minus 5.7 minus 3.45 minus 1.75 is 41.5, which is option C.'
        write: '$\therefore 52.4 - 5.7 - 3.45 - 1.75 = 41.5$ (C)'
        answer: true
    traps:
      A: 'You went for 42.2. The three pieces add to 10.9, not 10.2. Line up the decimal points, and 5.70 plus 3.45 plus 1.75 is 10.90, and 52.4 minus 10.9 is 41.5.'
      B: 'You went for 42.1. Check the decimals. 5.7 is 5.70, not 5.07. The three pieces add to 10.9, and 52.4 minus 10.9 is 41.5.'
      D: 'You went for 41.4. That is one tenth off, a slip in the borrowing. 14 minus 9 is 5, so 52.4 minus 10.9 is 41.5.'
  6:
    moments:
      - section: 'The question'
        say: 'We have a fractional index, a negative index, and both together, with no tables allowed. Two laws of indices turn each factor into a plain number, which is a cube, a reciprocal and a square.'
        write: 'Without tables, evaluate $(343)^{\frac{1}{3}} \times (0.14)^{-1} \times (25)^{-\frac{1}{2}}$'
        doodle: {name: 'custom:2002_q06_a', id: three, caption: 'a cube, a square, a flip'}
      - say: 'Solution. We take each factor on its own, then multiply.'
        write: 'Solution'
      - section: 'The laws'
        say: 'The law for a fractional index says $a$ to the power 1 over $n$ is the $n$th root of $a$.'
        write: 'Law of indices: $a^{\frac{1}{n}} = \sqrt[n]{a}$'
      - say: 'The law for a negative index says $a$ to the power negative $n$ is 1 over $a$ to the power $n$.'
        write: 'Law of indices: $a^{-n} = \dfrac{1}{a^{n}}$'
      - section: 'First factor'
        say: '7 times 7 is 49, and 49 times 7 is 343, so 343 is 7 cubed.'
        write: '$(343)^{\frac{1}{3}} = (7^{3})^{\frac{1}{3}}$'
      - say: 'A power of a power multiplies the indices, so 3 times 1 over 3 is 1. So the first factor is 7, the edge of the cube.'
        write: '$= 7^{1} = 7$'
        doodle_do:
          - {id: three, op: label, part: cube, text: 'edge 7'}
      - section: 'Second factor'
        say: 'By the negative-index law, 0.14 to the power negative 1 is 1 over 0.14.'
        write: '$(0.14)^{-1} = \dfrac{1}{0.14}$'
      - say: 'Multiply the top and bottom by 100 to clear the decimal, giving 100 over 14. Then divide both by 2 to get 50 over 7.'
        write: '$= \dfrac{100}{14} = \dfrac{50}{7}$'
        doodle_do:
          - {id: three, op: label, part: flip, text: '= 50/7'}
      - section: 'Third factor'
        say: 'The negative index puts it under 1, and the index 1 over 2 means the square root.'
        write: '$(25)^{-\frac{1}{2}} = \dfrac{1}{25^{\frac{1}{2}}} = \dfrac{1}{\sqrt{25}}$'
      - say: 'The square of 25 tiles has side 5, so the square root of 25 is 5. The third factor is 1 over 5.'
        write: '$= \dfrac{1}{5}$'
        doodle_do:
          - {id: three, op: label, part: square, text: 'side 5, so 1/5'}
      - section: 'Multiply'
        say: 'Substitute the three values into the product.'
        write: '$\therefore$ Product $= 7 \times \dfrac{50}{7} \times \dfrac{1}{5}$'
      - say: 'The 7 cancels the 7 underneath, leaving 50.'
        write: '$= 50 \times \dfrac{1}{5}$'
      - say: '50 times 1 over 5 is 50 divided by 5, which is 10.'
        write: '$= 10$'
      - section: 'Check'
        say: 'Check by working backwards. 10 times 5 times 0.14 should give back the cube root of 343. 10 times 5 is 50, and 50 times 0.14 is 7.'
        write: 'Check: $10 \times 5 \times 0.14 = 7 = \sqrt[3]{343}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the value is 10, which is option C.'
        write: '$\therefore$ Value $= 10$'
        answer: true
    traps:
      A: 'You went for 7. That is only the first factor, the cube root of 343. Multiply it by the other two, 50 over 7 and 1 over 5.'
      B: 'You went for 8. Work out each factor again. The cube root of 343 is 7, 1 over 0.14 is 50 over 7, and 1 over root 25 is 1 over 5. Together they make 10.'
      D: 'You went for 12. The 7s cancel to leave 50, and 50 times 1 over 5 is 10. Take care with 1 over 0.14. It is 100 over 14, which is 50 over 7.'
  7:
    moments:
      - section: 'The question'
        say: 'The shaded ring is the big circle with the small circle cut out of it. So its area is one circle''s area minus the other''s.'
        write: '$r = \dfrac{2}{5}R$. Find the shaded area in terms of $\pi$ and $R$.'
        point:
          - {figure: 0, kind: circle, target: {x: 130, y: 53}, text: 'the shaded ring', 'on': 'shaded ring'}
      - section: 'Solution'
        say: 'Solution. The big circle has radius capital R, and the small circle has radius small r.'
        write: 'Solution'
        point:
          - {figure: 0, kind: circle, target: R, text: 'big radius', 'on': 'big circle'}
          - {figure: 0, kind: circle, target: r, text: 'small radius', 'on': 'small circle'}
      - say: 'The shaded area equals the area of the big circle minus the area of the small circle.'
        write: 'Shaded area $=$ area of big circle $-$ area of small circle'
      - say: 'The area of a circle is pi times radius squared, so this is pi capital R squared minus pi small r squared.'
        write: '$= \pi R^{2} - \pi r^{2}$'
      - section: 'Substitute'
        say: 'The answer must be in terms of capital R only, so substitute 2 over 5 of R for small r.'
        write: '$= \pi R^{2} - \pi\left(\dfrac{2}{5}R\right)^{2}$'
      - say: 'Square the bracket. 2 squared is 4, 5 squared is 25, so it is 4 over 25 R squared.'
        write: '$= \pi R^{2} - \dfrac{4}{25}\pi R^{2}$'
      - section: 'Simplify'
        say: 'Both terms have pi R squared. Take it out as a common factor.'
        write: '$= \pi R^{2}\left(1 - \dfrac{4}{25}\right)$'
      - say: 'Write 1 as 25 over 25. 25 minus 4 is 21.'
        write: '$= \pi R^{2}\left(\dfrac{25 - 4}{25}\right) = \dfrac{21}{25}\pi R^{2}$'
      - say: 'Therefore the shaded area is 21 over 25 pi R squared.'
        write: '$\therefore$ shaded area $= \dfrac{21}{25}\pi R^{2}$'
        point:
          - {figure: 0, kind: label, target: {x: 130, y: 186}, text: '21/25 πR²', 'on': 'Therefore'}
      - section: 'Check'
        say: 'Check with numbers. Take R as 5, so r is 2. 25 pi minus 4 pi is 21 pi, and 21 over 25 of pi times 25 is also 21 pi.'
        write: 'Check: $R = 5,\ r = 2$: $\ 25\pi - 4\pi = 21\pi = \dfrac{21}{25}\pi \times 25$ ✓'
      - section: 'Answer'
        say: 'So the shaded area is 21 over 25 pi R squared, which is answer choice C.'
        write: '$\therefore$ shaded area $= \dfrac{21}{25}\pi R^{2}$ (C)'
        answer: true
    traps:
      A: 'You went for 9 over 25 pi R squared. That takes 1 minus 2 over 5 first and then squares it. Square the radius first. The small circle is 4 over 25 pi R squared, leaving 21 over 25.'
      B: 'You went for 5 over 9 pi R squared. Square 2 over 5 to get 4 over 25, then take it from 1 to get 21 over 25.'
      D: 'You went for 21 over 23 pi R squared. The top is right, but the bottom must stay 25, because 5 squared is 25 and 1 is 25 over 25.'
  8:
    moments:
      - section: 'The question'
        say: 'The line $2y$ minus $kx$ plus 4 equals 0 is perpendicular to the line $y$ plus a quarter $x$ minus 7 equals 0. We want $k$.'
        write: '$2y - kx + 4 = 0\ \perp\ y + \tfrac{1}{4}x - 7 = 0$; $k = ?$'
      - section: 'Solution'
        say: 'Solution. Let me draw the second line, the one we know fully. The first line must cross it at a right angle.'
        write: 'Solution'
        diagram:
          id: g
          kind: graph
          x: [-1, 8]
          y: [-3, 9]
          step: 1
          plots:
            - {fn: '7 - x/4', label: 'y + ¼x − 7 = 0', colour: blue}
            - {fn: '4x - 2', label: '2y − 8x + 4 = 0', colour: green, later: true}
          'on': 'draw'
      - section: 'The first gradient'
        say: 'To read a gradient, make $y$ the subject. For the first line, take $kx$ and 4 to the other side, and their signs change.'
        write: 'Line 1: $2y = kx - 4$'
      - say: 'Divide every term by 2. 4 over 2 is 2.'
        write: '$y = \dfrac{k}{2}x - 2$'
      - say: 'The gradient is the coefficient of $x$, which is $k$ over 2.'
        write: '$\therefore\ m_{1} = \dfrac{k}{2}$'
      - section: 'The second gradient'
        say: 'For the second line, take a quarter $x$ and negative 7 to the other side.'
        write: 'Line 2: $y = -\dfrac{1}{4}x + 7$'
      - say: 'The gradient is the coefficient of $x$, so it is negative 1 over 4.'
        write: '$\therefore\ m_{2} = -\dfrac{1}{4}$'
        diagram_do:
          - {id: g, op: label, part: 'plot:1', text: 'm2 = −¼', 'on': 'negative'}
      - section: 'Perpendicular'
        say: 'For perpendicular lines, the product of their gradients is negative 1.'
        write: 'Perpendicular: $m_{1}m_{2} = -1$'
      - say: 'Substitute $m$ 1 equals $k$ over 2, and $m$ 2 equals negative 1 over 4.'
        write: '$\dfrac{k}{2} \times \left(-\dfrac{1}{4}\right) = -1$'
      - say: 'Multiply the fractions. $k$ times negative 1 is negative $k$, and 2 times 4 is 8.'
        write: '$-\dfrac{k}{8} = -1$'
      - say: 'Multiply both sides by negative 8. Negative 1 times negative 8 is 8.'
        write: '$\therefore\ k = 8$'
      - section: 'Check'
        say: 'To check, with $k$ equals 8, the first gradient is 8 over 2, which is 4. 4 times negative 1 over 4 is negative 1. Here is that line, at right angles to the other.'
        write: 'Check: $m_{1} = \dfrac{8}{2} = 4$; $4 \times \left(-\dfrac{1}{4}\right) = -1\ \checkmark$'
        diagram_do:
          - {id: g, op: plot, 'on': 'Here'}
      - say: 'Therefore $k$ is 8, which is answer choice D.'
        write: '$\therefore\ k = 8$'
        answer: true
    traps:
      A: 'You went for negative 8. That comes from setting the product of the gradients to positive 1. For perpendicular lines the product is negative 1, so $k$ is positive 8.'
      B: 'You went for negative 4. There are two slips. The first gradient is $k$ over 2, not $k$, because $2y$ must be divided by 2. And the product of the gradients is negative 1, not positive 1.'
      C: 'You went for 4. That takes $k$ as the first gradient, forgetting to divide by the 2 in $2y$. The gradient is $k$ over 2, and $k$ over 2 times negative 1 over 4 equals negative 1 gives $k$ equals 8.'
  9:
    moments:
      - section: 'The question'
        say: 'A bucket is wider at the top than at the bottom, so it is not a cylinder. It is a frustum, which is a big cone with a small cone cut off its tip.'
        write: 'Find the volume of the bucket.'
      - section: 'Solution'
        say: 'Write Solution, then sketch the bucket, 12 cm across the top, 8 cm across the bottom, and 4 cm deep.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: underline, target: '12 cm', text: 'top', 'on': '12 cm'}
          - {figure: sketch, kind: underline, target: '8 cm', text: 'bottom', 'on': '8 cm'}
          - {figure: sketch, kind: underline, target: '4 cm', text: 'depth', 'on': 'deep'}
      - section: 'What we know'
        say: 'The formulas need radii, so halve the diameters. The top radius capital R is 6 cm, and the bottom radius small r is 4 cm.'
        write: '$R = \dfrac{12}{2} = 6$ cm, $\ r = \dfrac{8}{2} = 4$ cm, depth $= 4$ cm'
      - say: 'Complete the cone below the bucket. Let the height of the small cone, the tip that was cut off, be $h$ cm. The big cone is then $h$ plus 4.'
        write: 'Let the height of the small cone be $h$; big cone $= h + 4$'
      - section: 'Similar triangles'
        say: 'The small cone and the big cone are similar, so radius over radius equals height over height.'
        write: '$\dfrac{r}{R} = \dfrac{h}{h + 4}$ (similar cones)'
        'on': 'similar'
      - say: 'Substitute 4 for small r and 6 for capital R.'
        write: '$\dfrac{4}{6} = \dfrac{h}{h + 4}$'
      - say: 'Cross-multiply, so 4 times, $h$ plus 4, equals 6h.'
        write: '$4(h + 4) = 6h$'
      - say: 'Expand, and $4h$ plus 16 equals $6h$. Take $4h$ from both sides, so 16 equals $2h$.'
        write: '$4h + 16 = 6h \Rightarrow 2h = 16$'
      - say: 'Divide by 2, and $h$ is 8. So the small cone is 8 cm high, and the big cone is 8 plus 4, which is 12 cm.'
        write: '$h = 8$ cm; big cone height $= 12$ cm'
      - section: 'Big cone minus small cone'
        say: 'The volume of a cone is a third pi r squared h. So the frustum is the big cone minus the small cone.'
        write: 'Vol. of frustum $=$ vol. of big cone $-$ vol. of small cone'
      - say: 'The big cone is a third, times pi, times 6 squared, times 12. 6 squared is 36, 36 times 12 is 432, and a third of that is 144.'
        write: 'Big cone $= \dfrac{1}{3} \times \pi \times 6^{2} \times 12 = 144\pi$'
      - say: 'The small cone is a third, times pi, times 4 squared, times 8. 16 times 8 is 128, so it is 128 pi over 3.'
        write: 'Small cone $= \dfrac{1}{3} \times \pi \times 4^{2} \times 8 = \dfrac{128\pi}{3}$'
      - say: 'Now subtract. Write 144 pi over 3, because 144 times 3 is 432.'
        write: 'Frustum $= 144\pi - \dfrac{128\pi}{3} = \dfrac{432\pi - 128\pi}{3}$'
      - say: '432 minus 128 is 304.'
        write: '$= \dfrac{304\pi}{3}$'
      - say: 'Therefore the volume of the bucket is 304 pi over 3 cubic centimetres.'
        write: '$\therefore$ volume $= \dfrac{304\pi}{3}\ \text{cm}^{3}$'
      - section: 'Check'
        say: 'Check with the frustum formula, which is a third pi h, times R squared plus R r plus r squared. 36 plus 24 plus 16 is 76, and 4 pi over 3 times 76 is 304 pi over 3.'
        write: 'Check: $\dfrac{1}{3}\pi \times 4\left(6^{2} + 6 \times 4 + 4^{2}\right) = \dfrac{4\pi}{3} \times 76 = \dfrac{304\pi}{3}$ ✓'
      - section: 'Answer'
        say: 'So the volume is 304 pi over 3 cubic centimetres, which is answer choice B.'
        write: '$\therefore V = \dfrac{304\pi}{3}\ \text{cm}^{3}$ (B)'
        answer: true
    traps:
      A: 'You went for 144 pi. That is the big cone before the tip was cut off. Take away the small cone, 128 pi over 3, to leave 304 pi over 3.'
      C: 'You went for 72 pi. That is not big cone minus small cone. The big cone is 144 pi, the small cone is 128 pi over 3, and the difference is 304 pi over 3.'
      D: 'You went for 128 pi. That is 3 times the small cone, with the third left out. The frustum is the big cone, 144 pi, minus the small cone, 128 pi over 3, which leaves 304 pi over 3.'
  10:
    moments:
      - section: 'The question'
        say: 'A triangle stands on the diameter of a circle. Many students use the diameter as the base or the height. One circle theorem tells us where the right angle is.'
        write: 'Find the area of $\triangle XYZ$'
      - section: 'Solution'
        say: 'Solution. From the diagram, the radius is 15 over 2 cm, $XY$ is 12 cm, and $XZ$ is a diameter.'
        write: 'Solution: $r = \dfrac{15}{2}$ cm, $|XY| = 12$ cm, $XZ$ a diameter'
        point:
          - {figure: 0, kind: highlight, target: XY, text: '12 cm'}
          - {figure: 0, kind: highlight, target: XZ, text: 'diameter'}
      - say: 'The angle at $Y$ stands on the diameter $XZ$. The angle in a semicircle is a right angle.'
        write: '$\angle XYZ = 90^{\circ}$ ($\angle$ in a semicircle)'
        point:
          - {figure: 0, kind: arc, target: XYZ, text: '90°'}
      - say: 'The diameter is twice the radius. 2 times 15 over 2 is 15.'
        write: '$|XZ| = 2r = 2 \times \dfrac{15}{2} = 15$ cm'
        point:
          - {figure: 0, kind: label, target: XZ, text: '15 cm'}
      - say: '$XZ$ is opposite the right angle, so it is the hypotenuse. Find the third side, $YZ$, by Pythagoras.'
        write: '$|XZ|^{2} = |XY|^{2} + |YZ|^{2}$ (Pythagoras)'
        point:
          - {figure: 0, kind: highlight, target: YZ, text: '?'}
      - say: 'Substitute 15 for $XZ$ and 12 for $XY$.'
        write: '$15^{2} = 12^{2} + |YZ|^{2}$'
      - say: '15 squared is 225 and 12 squared is 144. Subtract 144 from both sides, and 225 minus 144 is 81.'
        write: '$|YZ|^{2} = 225 - 144 = 81$'
      - say: 'The square root of 81 is 9.'
        write: '$|YZ| = \sqrt{81} = 9$ cm'
        point:
          - {figure: 0, kind: label, target: YZ, text: '9 cm'}
      - say: 'The area of a triangle is half base times height. In a right-angled triangle, the two sides at the right angle are the base and the height.'
        write: 'Area $= \dfrac{1}{2} \times \text{base} \times \text{height}$'
      - say: 'Substitute 12 for the base, $XY$, and 9 for the height, $YZ$.'
        write: '$= \dfrac{1}{2} \times 12 \times 9$'
        point:
          - {line: 9, kind: move, from: {line: 7, at: '= [[9]] cm'}, at: '× [[9]]', text: 'YZ'}
      - say: 'Half of 12 is 6, and 6 times 9 is 54.'
        write: '$= 6 \times 9 = 54\ \text{cm}^{2}$'
      - section: 'Check'
        say: 'Check the sides. 9, 12 and 15 are 3 times 3, 4 and 5, a Pythagorean triple. So the right angle and $YZ$ are correct.'
        write: 'Check: $9 : 12 : 15 = 3 : 4 : 5\ \checkmark$'
      - say: 'Therefore the area of triangle $XYZ$ is 54 square centimetres, which is option B.'
        write: '$\therefore$ Area of $\triangle XYZ = 54\ \text{cm}^{2}$'
        answer: true
    traps:
      A: 'You went for 75. That uses the diameter, 15, as a side of the right angle. The diameter is the hypotenuse. The base and height are $XY$ and $YZ$, 12 and 9.'
      C: 'You went for 45. Find the third side by Pythagoras. 15 squared minus 12 squared is 81, so $YZ$ is 9. Then 1 over 2 times 12 times 9 is 54.'
      D: 'You went for 27. That uses the 1 over 2 twice. Area is 1 over 2 times 12 times 9, which is 54.'
  11:
    moments:
      - section: 'The question'
        say: 'A straight line cuts the two axes at two points. We want the point exactly halfway between them. First find the two points, then use the midpoint formula.'
        write: 'Midpoint of the intercepts of $2y = 4x - 8$'
        doodle: {name: 'custom:2002_q11_a', id: half, caption: 'halfway along each axis'}
      - section: 'Solution'
        say: 'Solution. Let me draw the line. An intercept is where a line cuts an axis, so A is on the $x$-axis, and B is on the $y$-axis.'
        write: 'Solution'
        diagram:
          id: g
          kind: graph
          x: [-1, 4]
          y: [-5, 2]
          step: 1
          plots:
            - {fn: '2x - 4', label: '2y = 4x − 8', colour: blue}
          'on': 'draw the line'
      - section: 'The x-intercept, A'
        say: 'Every point on the $x$-axis has $y$ equal to 0. So for the $x$-intercept, put $y$ equal to 0.'
        write: '$x$-intercept: put $y = 0$'
      - say: 'Substitute 0 for $y$ in the equation.'
        write: '$2(0) = 4x - 8$'
      - say: '2 times 0 is 0.'
        write: '$0 = 4x - 8$'
      - say: 'Add 8 to both sides, so that $4x$ stands alone.'
        write: '$8 = 4x$'
      - say: 'Divide both sides by 4. 8 divided by 4 is 2.'
        write: '$x = \dfrac{8}{4} = 2$'
      - say: 'Therefore A is the point 2, 0.'
        write: '$\therefore\ A = (2,\ 0)$'
        diagram_do:
          - {id: g, op: point, x: 2, y: 0, text: 'A (2, 0)', 'on': 'point 2, 0'}
        point:
          - {line: 7, kind: highlight, at: '(2, 0)', to: {diagram: g, part: 'point:1'}}
      - section: 'The y-intercept, B'
        say: 'Every point on the $y$-axis has $x$ equal to 0. So for the $y$-intercept, put $x$ equal to 0.'
        write: '$y$-intercept: put $x = 0$'
      - say: 'Substitute 0 for $x$. 4 times 0 is 0.'
        write: '$2y = 4(0) - 8$'
      - say: 'So $2y$ equals negative 8.'
        write: '$2y = -8$'
      - say: 'Divide both sides by 2. Negative 8 divided by 2 is negative 4.'
        write: '$y = \dfrac{-8}{2} = -4$'
      - say: 'Therefore B is the point 0, negative 4.'
        write: '$\therefore\ B = (0,\ -4)$'
        diagram_do:
          - {id: g, op: point, x: 0, y: -4, text: 'B (0, −4)', 'on': 'point 0'}
        point:
          - {line: 12, kind: highlight, at: '(0, −4)', to: {diagram: g, part: 'point:2'}}
      - section: 'The midpoint'
        say: 'Now label the two points before using the formula. Let $x$ 1, $y$ 1 be A, 2, 0. Let $x$ 2, $y$ 2 be B, 0, negative 4.'
        write: 'Let $(x_{1},\ y_{1}) = (2,\ 0)$ and $(x_{2},\ y_{2}) = (0,\ -4)$'
        point:
          - {line: 13, kind: move, from: {line: 7, at: '(2, 0)'}, at: '= (2, 0)', text: 'A'}
          - {line: 13, kind: move, from: {line: 12, at: '(0, −4)'}, at: '(0, −4)', text: 'B'}
      - say: 'The midpoint formula says add the two $x$ values and divide by 2, then add the two $y$ values and divide by 2.'
        write: 'Midpoint $= \left(\dfrac{x_{1} + x_{2}}{2},\ \dfrac{y_{1} + y_{2}}{2}\right)$'
        'on': 'midpoint formula'
      - say: 'Substitute. $x$ 1 plus $x$ 2 is 2 plus 0. $y$ 1 plus $y$ 2 is 0 plus negative 4, with the negative in a bracket.'
        write: '$= \left(\dfrac{2 + 0}{2},\ \dfrac{0 + (-4)}{2}\right)$'
      - say: '2 plus 0 is 2. 0 plus negative 4 is negative 4. On the number lines, halfway from 0 to 2 is 1, and halfway from 0 to negative 4 is negative 2.'
        write: '$= \left(\dfrac{2}{2},\ \dfrac{-4}{2}\right)$'
        doodle_do:
          - {id: half, op: label, part: xmid, text: 'halfway: 1', 'on': 'halfway'}
          - {id: half, op: label, part: ymid, text: 'halfway: −2', 'on': 'negative 2'}
      - say: 'Therefore the midpoint is 1, negative 2.'
        write: '$\therefore$ Midpoint $= (1,\ -2)$'
        diagram_do:
          - {id: g, op: point, x: 1, y: -2, text: 'M (1, −2)', colour: green, 'on': 'midpoint'}
        point:
          - {line: 17, kind: highlight, at: '(1, −2)', to: {diagram: g, part: 'point:3'}}
      - section: 'Check'
        say: 'To check, the midpoint must lie on the line. Put $x$ as 1 and $y$ as negative 2. Both sides give negative 4.'
        write: 'Check: $2(-2) = -4,\quad 4(1) - 8 = -4\ \checkmark$'
      - say: 'Therefore the midpoint of the intercepts is 1, negative 2, which is answer choice D.'
        write: '$\therefore$ the midpoint is $(1,\ -2)$'
        answer: true
    traps:
      A: 'You went for negative 1, negative 2. The $y$ value is right, but $x$ 1 plus $x$ 2 is 2 plus 0, which is positive 2, and 2 over 2 is positive 1.'
      B: 'You went for 1, 2. The $x$ value is right, but the $y$-intercept is negative 4, so the $y$ value is negative 4 over 2, which is negative 2. Watch the sign.'
      C: 'You went for 2, 0. That is A, the $x$-intercept, on its own. The question wants the point halfway between both intercepts.'
  12:
    moments:
      - section: 'The question'
        say: 'The two radii to the ends of a chord cut the circle into two sectors. The minor sector has the 120 degrees, and the major sector is the bigger slice, the rest of the 360.'
        write: 'Find the area of the major sector.'
      - section: 'Solution'
        say: 'Write Solution, then sketch the circle with the chord $AB$, the 120 degrees at the centre, and the major sector shaded.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: arc, target: AOB, text: '120°', 'on': '120 degrees'}
          - {figure: sketch, kind: circle, target: '?', text: 'major sector', 'on': 'major sector'}
      - section: 'What we know'
        say: 'List the givens. The diameter is 4 root 3 cm, so the radius is half of it, 2 root 3 cm.'
        write: '$d = 4\sqrt{3}$ cm $\Rightarrow r = \dfrac{4\sqrt{3}}{2} = 2\sqrt{3}$ cm'
        point:
          - {figure: sketch, kind: underline, target: '4√3 cm', text: 'diameter', 'on': 'diameter'}
      - say: 'The angle of the major sector is 360 minus 120, which is 240 degrees.'
        write: '$\theta = 360^{\circ} - 120^{\circ} = 240^{\circ}$'
        point:
          - {figure: sketch, kind: label, target: '?', text: '240°', 'on': '240'}
      - section: 'The formula'
        say: 'Area of a sector is A equals theta over 360, times pi r squared.'
        write: '$A = \dfrac{\theta}{360} \times \pi r^{2}$'
        'on': 'Area of a sector'
      - say: 'Substitute, so theta is 240, and r is 2 root 3.'
        write: '$A = \dfrac{240}{360} \times \pi \times (2\sqrt{3})^{2}$'
      - section: 'Simplify'
        say: '240 over 360 is 2 over 3. And 2 root 3 squared is 2 squared times root 3 squared, which is 4 times 3, or 12.'
        write: '$= \dfrac{2}{3} \times \pi \times 12$'
      - say: '12 divided by 3 is 4, and 2 times 4 is 8.'
        write: '$= 8\pi$'
      - say: 'Therefore the area of the major sector is 8 pi square centimetres.'
        write: '$\therefore$ area of major sector $= 8\pi\ \text{cm}^{2}$'
      - section: 'Check'
        say: 'To check, the minor sector is 120 over 360 of 12 pi, which is 4 pi. The two sectors together make 4 pi plus 8 pi, which is 12 pi, the whole circle, pi r squared.'
        write: 'Check: $4\pi + 8\pi = 12\pi = \pi(2\sqrt{3})^{2}$ ✓'
      - section: 'Answer'
        say: 'So the major sector is 8 pi square centimetres, which is answer choice C.'
        write: '$\therefore A = 8\pi\ \text{cm}^{2}$ (C)'
        answer: true
    traps:
      A: 'You went for 32 pi. That uses the whole diameter as the radius, so r squared became 48. Halve it first. The radius is $2\sqrt{3}$, so r squared is 12.'
      B: 'You went for 16 pi. That is the 120 degree sector with the diameter used as the radius. The major sector is 240 degrees, and the radius is half the diameter.'
      D: 'You went for 4 pi. That is the minor sector, using the 120 degrees. The major sector is the bigger part, 360 minus 120, which is 240 degrees.'
  13:
    moments:
      - section: 'The question'
        say: 'Tan theta is 4 over 3, and we want sin squared theta minus cos squared theta. Draw the triangle, and it gives sin and cos.'
        write: '$\tan\theta = \dfrac{4}{3}$; find $\sin^{2}\theta - \cos^{2}\theta$'
      - section: 'Solution'
        say: 'Solution. Let me draw a right-angled triangle $ABC$, with the right angle at $B$ and theta at $A$.'
        write: 'Solution: right $\angle$ at $B$, $\theta$ at $A$'
        show_sketch: true
        'on': 'draw'
      - say: 'TOA says tan is opposite over adjacent. So the opposite side $BC$ is 4 and the adjacent side $AB$ is 3.'
        write: 'TOA: $\dfrac{\text{opp}}{\text{adj}} = \dfrac{4}{3}$: opp $= 4$, adj $= 3$'
        point:
          - {figure: sketch, kind: circle, target: '4', text: 'opp'}
          - {figure: sketch, kind: circle, target: '3', text: 'adj'}
      - section: 'The hypotenuse'
        say: 'By Pythagoras, the hypotenuse squared equals the opposite squared plus the adjacent squared.'
        write: 'Pythagoras: $\text{hyp}^{2} = 4^{2} + 3^{2} = 16 + 9 = 25$'
      - say: 'The square root of 25 is 5. So the hypotenuse is 5.'
        write: '$\text{hyp} = \sqrt{25} = 5$'
        point:
          - {figure: sketch, kind: label, target: '?', text: '5'}
      - section: 'sin θ and cos θ'
        say: 'SOH says sin is opposite over hypotenuse, so it is 4 over 5.'
        write: 'SOH: $\sin\theta = \dfrac{\text{opp}}{\text{hyp}} = \dfrac{4}{5}$'
      - say: 'CAH says cos is adjacent over hypotenuse, so it is 3 over 5.'
        write: 'CAH: $\cos\theta = \dfrac{\text{adj}}{\text{hyp}} = \dfrac{3}{5}$'
      - say: 'Square each one by squaring the top and the bottom. 4 over 5 squared is 16 over 25, and 3 over 5 squared is 9 over 25.'
        write: '$\sin^{2}\theta = \dfrac{16}{25}$, $\ \cos^{2}\theta = \dfrac{9}{25}$'
      - section: 'Subtract'
        say: 'Now sin squared minus cos squared. The denominators are the same, so subtract the numerators, and 16 minus 9 is 7.'
        write: '$\sin^{2}\theta - \cos^{2}\theta = \dfrac{16}{25} - \dfrac{9}{25} = \dfrac{7}{25}$'
      - section: 'Check'
        say: 'Check with the identity, because sin squared plus cos squared must be 1. 16 over 25 plus 9 over 25 is 25 over 25, which is 1.'
        write: 'Check: $\dfrac{16}{25} + \dfrac{9}{25} = \dfrac{25}{25} = 1\ \checkmark$'
      - section: 'Answer'
        say: 'So sin squared theta minus cos squared theta is 7 over 25, which is answer choice A.'
        write: '$\therefore \sin^{2}\theta - \cos^{2}\theta = \dfrac{7}{25}$'
        answer: true
    traps:
      B: 'You went for 9 over 25. That is cos squared theta on its own. The question wants sin squared minus cos squared, which is 16 over 25 minus 9 over 25.'
      C: 'You went for 16 over 25. That is sin squared theta on its own. Subtract cos squared, 9 over 25, to get 7 over 25.'
      D: 'You went for 24 over 25. That is 2 times sin times cos. The question asks for sin squared minus cos squared, 7 over 25.'
  14:
    moments:
      - section: 'The question'
        say: 'Three equal lengths make two isosceles triangles, one after the other. Many students stop after the first one. Let''s carry $x$ through both, with a reason on every line.'
        write: '$|PQ| = |QS| = |RS|$, $\angle RST = 72^{\circ}$; find $x$'
        point:
          - {figure: 0, kind: circle, target: x, text: 'find'}
      - section: 'Solution'
        say: 'Solution. Start with triangle $PQS$. $PQ$ equals $QS$, so it is isosceles.'
        write: 'Solution: in $\triangle PQS$, $|PQ| = |QS|$'
        point:
          - {figure: 0, kind: highlight, target: PQ}
          - {figure: 0, kind: highlight, target: QS, text: 'equal'}
      - say: 'The base angles of an isosceles triangle are equal. So the angle at $S$ in this triangle is also $x$.'
        write: '$\angle QSP = \angle QPS = x$ (base $\angle$s of isos. $\triangle$)'
        point:
          - {figure: 0, kind: arc, target: QSP, text: 'x'}
      - say: '$RQP$ is a straight line, so angle $RQS$ is an exterior angle of triangle $PQS$. It equals the two interior opposite angles added, which is $x$ plus $x$.'
        write: '$\angle RQS = x + x = 2x$ (ext. $\angle$ of $\triangle$)'
        point:
          - {figure: 0, kind: arc, target: RQS, text: '2x'}
      - say: 'Now triangle $QRS$. $QS$ equals $RS$, so it is isosceles too.'
        write: 'In $\triangle QRS$, $|QS| = |RS|$'
        point:
          - {figure: 0, kind: highlight, target: QS}
          - {figure: 0, kind: highlight, target: RS, text: 'equal'}
      - say: 'Its base angles, at $Q$ and $R$, are equal. So the angle at $R$ is $2x$ as well.'
        write: '$\angle QRS = \angle RQS = 2x$ (base $\angle$s of isos. $\triangle$)'
        point:
          - {figure: 0, kind: arc, target: SRQ, text: '2x'}
      - say: 'Now the big triangle $PRS$. $PST$ is a straight line, so the 72 degrees is its exterior angle at $S$. It equals the angles at $P$ and $R$ added.'
        write: '$\angle RST = \angle SPR + \angle PRS$ (ext. $\angle$ of $\triangle$)'
        point:
          - {figure: 0, kind: arc, target: RST, text: '72°'}
      - say: 'Now substitute 72 for angle $RST$, $x$ for the angle at $P$, and $2x$ for the angle at $R$.'
        write: '$72^{\circ} = x + 2x$'
      - say: '$x$ plus $2x$ is $3x$.'
        write: '$3x = 72^{\circ}$'
      - say: 'Divide both sides by 3. 72 divided by 3 is 24.'
        write: '$x = \dfrac{72^{\circ}}{3} = 24^{\circ}$'
        point:
          - {figure: 0, kind: label, target: x, text: '24°'}
      - section: 'Check'
        say: 'Check at $S$. The angle $QSR$ is 180 minus $2x$ minus $2x$, which is 180 minus 96, so 84 degrees.'
        write: 'Check: $\angle QSR = 180^{\circ} - 4(24^{\circ}) = 84^{\circ}$ ($\angle$ sum of $\triangle$)'
      - say: 'The three angles at $S$ on the straight line are 24 plus 84 plus 72, which is 180. It works.'
        write: '$24^{\circ} + 84^{\circ} + 72^{\circ} = 180^{\circ}\ \checkmark$ ($\angle$s on a str. line)'
        point:
          - {figure: 0, kind: highlight, target: PT, text: 'straight line'}
      - say: 'Therefore $x$ is 24 degrees, which is option C.'
        write: '$\therefore x = 24^{\circ}$'
        answer: true
    traps:
      A: 'You went for 72 degrees. That is angle $RST$, which was given. It is the exterior angle of triangle $PRS$, so it equals $x$ plus $2x$.'
      B: 'You went for 36 degrees. That is 72 divided by 2, as if the angle at $R$ were $x$. Triangle $QRS$ makes the angle at $R$ equal to $2x$, so 72 is $3x$.'
      D: 'You went for 18 degrees. That is 72 divided by 4. The exterior angle 72 equals $x$ plus $2x$, which is $3x$, so divide by 3.'
  15:
    moments:
      - section: 'The question'
        say: 'A point $P$ is always equidistant from two fixed points $S$ and $T$. This is one of the four standard loci. Name it exactly.'
        write: '$|PS| = |PT|$; locus of $P = ?$'
      - section: 'Solution'
        say: 'Solution. A locus is the path traced by a moving point under a given condition. Here $P$ is equidistant, that is, at equal distances, from $S$ and $T$.'
        write: 'Solution: $P$ is equidistant from $S$ and $T$'
      - say: 'Recall the four standard loci, which are a circle, the perpendicular bisector, a pair of parallel lines, and the angle bisector.'
        write: 'Standard loci: circle; $\perp$ bisector; parallel lines; $\angle$ bisector'
      - say: 'The locus of points equidistant from two fixed points is the perpendicular bisector of the line joining them.'
        write: 'Equidistant from two points $\Rightarrow$ $\perp$ bisector of $ST$'
      - say: 'Construct it with ruler and compasses. Join $S$ and $T$. With centre $S$ and radius more than half of $ST$, draw arcs above and below $ST$.'
        show_sketch: true
        write: 'Join $ST$; centre $S$, radius $> \tfrac{1}{2}|ST|$: arcs above and below'
        point:
          - {figure: sketch, kind: highlight, target: ST}
      - say: 'With centre $T$ and the same radius, draw arcs to cut the first two at $X$ and $Y$.'
        write: 'Centre $T$, same radius: arcs cut them at $X$ and $Y$'
        point:
          - {figure: sketch, kind: circle, target: X}
          - {figure: sketch, kind: circle, target: Y}
      - say: 'Join $X$ and $Y$. The line $XY$ cuts $ST$ at its midpoint $M$, at right angles. Every point $P$ on it has $PS$ equal to $PT$.'
        write: 'Join $XY$: it bisects $ST$ at $M$, at $90^{\circ}$'
        point:
          - {figure: sketch, kind: arc, target: TMX, text: '90°'}
          - {figure: sketch, kind: circle, target: locus}
      - section: 'Check'
        say: 'Check one point. $M$ is halfway along $ST$, so $MS$ equals $MT$. And triangles $PMS$ and $PMT$ have $MS$ equal to $MT$, $PM$ common and right angles at $M$, so they are congruent.'
        write: 'Check: $\triangle PMS \equiv \triangle PMT$ (SAS) $\Rightarrow |PS| = |PT|\ \checkmark$'
        point:
          - {figure: sketch, kind: highlight, target: PS}
          - {figure: sketch, kind: highlight, target: PT}
      - say: 'Leave the construction arcs showing in the exam, because they are the evidence that earns the marks.'
        write: 'Keep the arcs: they earn the marks'
      - section: 'Answer'
        say: 'Therefore the locus of $P$ is the perpendicular bisector of $ST$, which is option D.'
        write: '$\therefore$ locus of $P$: the perpendicular bisector of $ST$'
        answer: true
    traps:
      A: 'You went for a perpendicular to $ST$. There are many lines perpendicular to $ST$, but only the one through its MIDPOINT keeps $P$ equally far from $S$ and $T$. That is the perpendicular bisector.'
      B: 'You went for a line parallel to $ST$. Moving along such a line, $P$ gets nearer one point and further from the other. Equal distances from two points give the perpendicular bisector.'
      C: 'You went for an angle bisector. An angle bisector gives points equidistant from two LINES. Here we have two POINTS, so the locus is the perpendicular bisector of $ST$.'
  16:
    moments:
      - section: 'The question'
        say: 'Total surface means every face. A solid hemisphere is half a ball, with a curved dome on top and a flat circle underneath.'
        write: 'Find the total surface area of a solid hemisphere, $r = 7$ cm.'
      - section: 'Solution'
        say: 'Write Solution, then sketch the hemisphere, radius 7 cm, with its flat base.'
        write: 'Solution'
        show_sketch: true
        point:
          - {figure: sketch, kind: underline, target: '7 cm', text: 'r', 'on': 'radius 7'}
      - say: 'List the givens. r is 7 cm, and pi is 22 over 7.'
        write: '$r = 7$ cm, $\pi = \dfrac{22}{7}$'
      - section: 'The formula'
        say: 'The total surface area equals the curved surface plus the flat base.'
        write: 'Total S.A. $=$ curved surface $+$ flat base'
      - say: 'The curved surface is half of a sphere''s 4 pi r squared, which is 2 pi r squared. The flat base is a circle, pi r squared.'
        write: '$= 2\pi r^{2} + \pi r^{2}$'
        point:
          - {figure: sketch, kind: label, target: {x: 215, y: 193}, text: 'flat base: πr²', 'on': 'flat base'}
      - say: '2 pi r squared plus pi r squared is 3 pi r squared.'
        write: '$= 3\pi r^{2}$'
      - section: 'Substitute'
        say: 'Substitute, so pi is 22 over 7 and r is 7.'
        write: '$= 3 \times \dfrac{22}{7} \times 7 \times 7$'
      - section: 'Simplify'
        say: 'Cancel the 7, since 7 over 7 is 1. That leaves 3 times 22 times 7.'
        write: '$= 3 \times 22 \times 7$'
      - say: '3 times 22 is 66, and 66 times 7 is 462.'
        write: '$= 462$'
      - say: 'Therefore the total surface area is 462 square centimetres.'
        write: '$\therefore$ total surface area $= 462\ \text{cm}^{2}$'
      - section: 'Check'
        say: 'Check the parts. The dome, 2 pi r squared, is 308, and the base, pi r squared, is 154. 308 plus 154 is 462.'
        write: 'Check: $308 + 154 = 462$ ✓'
      - section: 'Answer'
        say: 'So the total surface area is 462 square centimetres, which is answer choice A.'
        write: '$\therefore$ T.S.A. $= 462\ \text{cm}^{2}$ (A)'
        answer: true
    traps:
      B: 'You went for 400. The total surface is $3\pi r^{2}$, which is 3 times 22 over 7 times 49, which is 3 times 22 times 7, or 462.'
      C: 'You went for 308. That is $2\pi r^{2}$, the curved dome only. The hemisphere is solid, so add the flat circular base, $\pi r^{2}$, which is 154.'
      D: 'You went for 66. That is 3 times 22, with the last 7 left out. After cancelling, it is 3 times 22 times 7, which is 462.'
  17:
    moments:
      - section: 'The question'
        say: 'We must name the type of triangle. The 128 degrees is outside the triangle, and many students call it obtuse because of it. We need the three angles inside.'
        write: 'What type of triangle is $\triangle PQR$?'
      - section: 'Solution'
        say: 'Solution. From the diagram, angle $PQR$ is 50 degrees, and the exterior angle at $P$, where $RP$ is produced, is 128 degrees.'
        write: 'Solution: $\angle PQR = 50^{\circ}$, ext. $\angle$ at $P = 128^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: PQR, text: '50°'}
          - {figure: 0, kind: circle, target: '128°', text: 'outside'}
      - say: 'The angle inside at $P$ and the 128 degrees lie on a straight line, so they add up to 180. The inside angle is 180 minus 128.'
        write: '$\angle QPR = 180^{\circ} - 128^{\circ} = 52^{\circ}$ ($\angle$s on a str. line)'
        point:
          - {figure: 0, kind: arc, target: QPR, text: '52°'}
      - say: 'The 128 degrees is an exterior angle of the triangle, so it equals the two interior opposite angles, at $Q$ and $R$, added together.'
        write: '$128^{\circ} = \angle PQR + \angle PRQ$ (ext. $\angle$ of $\triangle$)'
      - say: 'Substitute 50 for angle $PQR$, and take it from 128. 128 minus 50 is 78.'
        write: '$\angle PRQ = 128^{\circ} - 50^{\circ} = 78^{\circ}$'
        point:
          - {figure: 0, kind: arc, target: PRQ, text: '78°'}
      - say: 'So the three angles inside the triangle are 52, 50 and 78 degrees. No two are equal.'
        write: '$\angle P = 52^{\circ}$, $\angle Q = 50^{\circ}$, $\angle R = 78^{\circ}$'
      - say: 'Equal sides face equal angles. Here no two angles are equal, so no two sides are equal.'
        write: 'All $\angle$s different $\Rightarrow$ all sides different'
        point:
          - {figure: 0, kind: highlight, target: PQ}
          - {figure: 0, kind: highlight, target: QR}
          - {figure: 0, kind: highlight, target: PR, text: 'all different'}
      - say: 'The largest angle is 78 degrees, which is less than 90. So no angle inside is obtuse, and it is an acute-angled triangle.'
        write: 'Largest $\angle = 78^{\circ} < 90^{\circ}$ (not obtuse)'
      - section: 'Check'
        say: 'To check, the three angles must add up to 180. 52 plus 50 plus 78 is 180.'
        write: 'Check: $52^{\circ} + 50^{\circ} + 78^{\circ} = 180^{\circ}\ \checkmark$ ($\angle$ sum of $\triangle$)'
      - say: 'A triangle with all three sides different is scalene. Therefore triangle $PQR$ is scalene, which is option A.'
        write: '$\therefore \triangle PQR$ is scalene'
        answer: true
    traps:
      B: 'You went for isosceles. An isosceles triangle has two equal angles. Here the angles are 52, 50 and 78 degrees, all different.'
      C: 'You went for equilateral. An equilateral triangle has every angle 60 degrees. These angles are 52, 50 and 78.'
      D: 'You went for obtuse-angled. The 128 degrees is obtuse, but it is the exterior angle, outside the triangle. The angles inside are 52, 50 and 78, all less than 90.'
  18:
    moments:
      - section: 'The question'
        say: 'The interior angles of a polygon add up to 20 right angles. Many students answer 20. First turn right angles into degrees, then use the angle-sum formula.'
        write: 'Sum of int. $\angle$s $= 20$ right angles; find $n$'
        doodle: {name: 'custom:2002_q18_a', id: poly, caption: 'a polygon'}
      - section: 'Solution'
        say: 'Solution. One right angle is 90 degrees.'
        write: 'Solution: 1 right angle $= 90^{\circ}$'
      - say: 'So 20 right angles is 20 times 90, which is 1800 degrees.'
        write: 'Sum $= 20 \times 90^{\circ} = 1800^{\circ}$'
      - say: 'From one corner, a polygon of $n$ sides splits into $n$ minus 2 triangles, each holding 180 degrees. So the interior angles add up to $n$ minus 2, times 180.'
        write: 'Sum of int. $\angle$s $= (n - 2) \times 180^{\circ}$'
        doodle_do:
          - {id: poly, op: stage, stage: 'custom:2002_q18_a2'}
      - say: 'Let $n$ be the number of sides. Equate the formula to 1800.'
        write: '$(n - 2) \times 180 = 1800$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: '= [[1800∘]]'}, at: '= [[1800]]', text: 'the sum'}
      - say: 'Divide both sides by 180.'
        write: '$n - 2 = \dfrac{1800}{180}$'
      - say: '1800 divided by 180 is 10. Our polygon splits into 10 triangles.'
        write: '$n - 2 = 10$'
        doodle_do:
          - {id: poly, op: label, part: count, text: 'ours: 10 triangles'}
      - say: 'Add 2 to both sides. 10 plus 2 is 12.'
        write: '$n = 10 + 2 = 12$'
        doodle_do:
          - {id: poly, op: circle, part: note}
      - section: 'Check'
        say: 'Check with the older form of the rule, where the angle sum is 2 $n$ minus 4 right angles. 2 times 12 minus 4 is 20 right angles.'
        write: 'Check: $(2n - 4)$ right angles $= 2(12) - 4 = 20\ \checkmark$'
      - say: 'Therefore the polygon has 12 sides, which is option B.'
        write: '$\therefore n = 12$'
        answer: true
    traps:
      A: 'You went for 10. That is $n$ minus 2, one step early. Add the 2, and $n$ is 12.'
      C: 'You went for 20. That is the number of right angles, not the number of sides. 20 right angles is 1800 degrees, and $(n - 2) \times 180 = 1800$ gives 12.'
      D: 'You went for 40. Set $(n - 2) \times 180$ equal to 1800. Dividing by 180 gives $n - 2 = 10$, so $n$ is 12.'
  19:
    moments:
      - section: 'The question'
        say: 'We want the equation of the set of points equidistant from the parallel lines $x = 1$ and $x = 7$.'
        write: 'Equidistant from $x = 1$ and $x = 7$; locus $= ?$'
      - section: 'Solution'
        say: 'Solution. Let me draw the two lines. Along $x = 1$, $x$ stays fixed while $y$ changes, so it is vertical. So is $x = 7$.'
        show_sketch: true
        write: 'Solution: $x = 1$ and $x = 7$ are vertical, so parallel'
        point:
          - {figure: sketch, kind: underline, target: 'x = 1'}
          - {figure: sketch, kind: underline, target: 'x = 7'}
      - say: 'Points equidistant from two parallel lines lie on the line parallel to both, midway between them. So the locus is a vertical line too.'
        write: 'Equidistant from two parallel lines $\Rightarrow$ the parallel line midway between them'
        point:
          - {figure: sketch, kind: circle, target: 'x = ?'}
      - say: 'Let $P(x, y)$ be any point on the locus. Its distance from $x = 1$ is $x$ minus 1, and its distance from $x = 7$ is 7 minus $x$.'
        write: 'Let $P(x, y)$ be on the locus: distances $x - 1$ and $7 - x$'
      - say: 'Equidistant means the two distances are equal.'
        write: '$x - 1 = 7 - x$'
      - say: 'Collect the $x$ terms on the left and the numbers on the right. $x$ plus $x$ is $2x$, and 7 plus 1 is 8.'
        write: '$x + x = 7 + 1$'
      - say: 'Simplify.'
        write: '$2x = 8$'
      - say: 'Divide both sides by 2. 8 divided by 2 is 4.'
        write: '$x = \dfrac{8}{2} = 4$'
      - section: 'Check'
        say: 'To check, 4 is the average of 1 and 7, and it is 3 units from each line.'
        write: 'Check: $\dfrac{1 + 7}{2} = 4$; $\ 4 - 1 = 7 - 4 = 3\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the locus is the line $x$ equals 4, which is option D.'
        write: '$\therefore$ locus: $x = 4$'
        answer: true
        point:
          - {figure: sketch, kind: label, target: 'x = ?', text: 'x = 4'}
    traps:
      A: 'You went for $y = 4$. The number 4 is right, but $y = 4$ is a horizontal line. The given lines are vertical, so the line midway between them is vertical too, and it is $x = 4$.'
      B: 'You went for $y = 3$. That is a horizontal line. The midway line between two vertical lines is vertical, and $x - 1 = 7 - x$ gives $x = 4$.'
      C: 'You went for $x = 3$. 3 is the DISTANCE from each line, not the position. Solving $x - 1 = 7 - x$ gives $x = 4$, which is 3 units from each.'
  20:
    moments:
      - section: 'The question'
        say: 'The solid is two pieces, a cylinder with a hemisphere on top. Its volume is the cylinder plus the hemisphere.'
        write: 'Find the volume of the solid.'
      - section: 'Solution'
        say: 'Solution. From the diagram, the radius r is 3 cm, and the whole solid is 23 cm high.'
        write: 'Solution: $r = 3$ cm, height of solid $= 23$ cm'
        point:
          - {figure: 0, kind: circle, target: '3 cm', text: 'r', 'on': 'radius'}
          - {figure: 0, kind: underline, target: '23 cm', text: 'whole height', 'on': 'whole solid'}
      - say: 'The 23 cm covers both pieces. The hemisphere on top is as tall as its radius, 3 cm, so the cylinder is 23 minus 3, which is 20 cm.'
        write: 'Height of cylinder, $h = 23 - 3 = 20$ cm'
        point:
          - {figure: 0, kind: label, target: {x: 240, y: 70}, text: 'hemisphere: 3 cm', 'on': 'as tall'}
      - section: 'The formula'
        say: 'The volume of the solid equals the volume of the cylinder plus the volume of the hemisphere.'
        write: 'Vol. of solid $=$ vol. of cylinder $+$ vol. of hemisphere'
      - say: 'The cylinder is pi r squared h. The hemisphere is half of 4 over 3 pi r cubed, which is 2 over 3 pi r cubed.'
        write: '$V = \pi r^{2}h + \dfrac{2}{3}\pi r^{3}$'
      - section: 'Substitute'
        say: 'Now substitute. r is 3 and h is 20.'
        write: '$V = \pi \times 3^{2} \times 20 + \dfrac{2}{3} \times \pi \times 3^{3}$'
      - section: 'Simplify'
        say: '3 squared is 9, and 9 times 20 is 180. 3 cubed is 27, a third of 27 is 9, and 2 times 9 is 18.'
        write: '$= 180\pi + 18\pi$'
      - say: '180 plus 18 is 198.'
        write: '$= 198\pi$'
      - say: 'Therefore the volume of the solid is 198 pi cubic centimetres.'
        write: '$\therefore$ volume $= 198\pi\ \text{cm}^{3}$'
      - section: 'Check'
        say: 'Check by factorising. Pi r squared is common, so V is 9 pi, times 20 plus 2 over 3 of 3. That is 9 pi times 22, which is 198 pi.'
        write: 'Check: $\pi r^{2}\left(h + \dfrac{2}{3}r\right) = 9\pi(20 + 2) = 198\pi$ ✓'
      - section: 'Answer'
        say: 'So the volume is 198 pi cubic centimetres, which is answer choice B.'
        write: '$\therefore V = 198\pi\ \text{cm}^{3}$ (B)'
        answer: true
    traps:
      A: 'You went for 216 pi. That adds a whole sphere, 36 pi, on top. The top is only half a sphere, so it adds 18 pi.'
      C: 'You went for 180 pi. That is the cylinder on its own. Add the hemisphere on top, which is 18 pi.'
      D: 'You went for 162 pi. That takes the hemisphere away from the cylinder. The hemisphere sits on top of the cylinder, so its volume is added.'
  21:
    moments:
      - section: 'The question'
        say: 'A hunter sees a bird on a tree at an angle of elevation of 45 degrees. Many students forget his height. The angle is measured from his eye, 1.6 m above the ground.'
        write: 'Find the height of the tree'
      - section: 'Solution'
        say: 'Solution. Let me draw the hunter and the tree. From his eye $B$, a horizontal line $BC$ meets the tree, and his line of sight goes up to the bird at $D$.'
        write: 'Solution: $|BC| = 10.4$ m, $\angle CBD = 45^{\circ}$, hunter $= 1.6$ m'
        show_sketch: true
        point:
          - {figure: sketch, kind: highlight, target: BC, text: '10.4 m'}
          - {figure: sketch, kind: arc, target: CBD, text: '45°'}
      - say: 'Let $h$ be the height of the bird above his eye level. That is the side $CD$.'
        write: 'Let $|CD| = h$ m'
        point:
          - {figure: sketch, kind: highlight, target: CD, text: 'h'}
      - say: 'Relative to the 45 degree angle, $h$ is the opposite side and 10.4 m is the adjacent side. Opposite and adjacent means TOA, so we use tangent.'
        write: 'opp $= h$, adj $= 10.4$: use tangent (TOA)'
      - say: 'The tangent of the angle equals opposite over adjacent.'
        write: '$\tan 45^{\circ} = \dfrac{h}{10.4}$'
      - say: 'Cross-multiply, so $h$ equals 10.4 times tan 45 degrees.'
        write: '$h = 10.4\tan 45^{\circ}$'
      - say: 'Tan 45 degrees is 1, so $h$ is 10.4 m.'
        write: '$= 10.4 \times 1 = 10.4$ m'
      - say: 'That is only the part of the tree above his eye. The part below, $CE$, equals his height, 1.6 m. So the tree is $h$ plus 1.6.'
        write: 'Height of tree $= h + 1.6$'
        point:
          - {figure: sketch, kind: highlight, target: CE, text: '1.6 m'}
      - say: 'Substitute 10.4 for $h$. 10.4 plus 1.6 is 12.0.'
        write: '$= 10.4 + 1.6 = 12.0$ m'
        point:
          - {figure: sketch, kind: label, target: DE, text: '12.0 m'}
      - section: 'Check'
        say: 'To check, the angle at $D$ is 180 minus 90 minus 45, which is 45. Two equal angles mean two equal sides, so $h$ equals $BC$, 10.4 m.'
        write: 'Check: $\angle BDC = 180^{\circ} - 90^{\circ} - 45^{\circ} = 45^{\circ}$, so $h = |BC|\ \checkmark$'
      - say: 'Therefore the tree is 12.0 m tall, which is option D.'
        write: '$\therefore$ height of tree $= 12.0$ m'
        answer: true
    traps:
      A: 'You went for 8.8 m. That takes the hunter''s height away. The angle starts at his eye, 1.6 m up, so his height must be added, giving 10.4 plus 1.6.'
      B: 'You went for 9.0 m. Tan 45 degrees is 1, so the height above his eye equals the level distance, 10.4 m. Then add his height, 1.6 m, to get 12.0 m.'
      C: 'You went for 10.4 m. That is only $h$, the height above the hunter''s eye. His eye is 1.6 m above the ground, so add that to get 12.0 m.'
  22:
    moments:
      - section: 'The question'
        say: 'Six numbers have a mean of 60. The first five of them have a mean of 50. We want the sixth number. Picture six towers of blocks.'
        doodle: {name: 'custom:2002_q22_a', id: towers, caption: 'six towers'}
        write: 'Sixth number $= ?$'
      - section: 'Solution'
        say: 'Solution. The mean is the sum over the number of values. Multiply both sides by $n$, and the sum is $n$ times $x$ bar.'
        write: 'Solution. $\bar{x} = \dfrac{\sum x}{n} \Rightarrow \sum x = n\bar{x}$'
      - say: 'The first five numbers have a mean of 50, so their sum is 5 times 50, which is 250.'
        write: 'Sum of first 5 $= 5 \times 50 = 250$'
        doodle_do:
          - {id: towers, op: label, part: five, text: '5 × 50 = 250'}
      - say: 'Let the sixth number be $x$. Then the sum of all six is 250 plus $x$.'
        write: 'Let the sixth number be $x$. Sum of all 6 $= 250 + x$'
      - say: 'The mean of all six is 60. So 250 plus $x$, over 6, equals 60.'
        write: '$\dfrac{250 + x}{6} = 60$'
      - say: 'Multiply both sides by 6. 6 times 60 is 360.'
        write: '$250 + x = 6 \times 60 = 360$'
        doodle_do:
          - {id: towers, op: label, part: level, text: '6 × 60 = 360'}
      - say: 'Subtract 250 from both sides. 360 minus 250 is 110.'
        write: '$x = 360 - 250$'
      - say: 'Therefore the sixth number is 110, which is the tall sixth tower.'
        write: '$\therefore x = 110$'
        doodle_do:
          - {id: towers, op: label, part: sixth, text: '110'}
        point:
          - {line: 7, kind: highlight, at: '110', to: {doodle: towers, part: sixth}}
      - section: 'Check'
        say: 'To check, the five numbers make 250. Add 110 to get 360, and 360 divided by 6 is 60, the mean we were given.'
        write: 'Check: $\dfrac{250 + 110}{6} = \dfrac{360}{6} = 60$ ✓'
      - section: 'Answer'
        say: 'So the sixth number is 110, which is option A.'
        write: '$\therefore$ Sixth number $= 110$'
        answer: true
    traps:
      B: 'You went for 105. Turn each mean into a sum. 5 times 50 is 250 and 6 times 60 is 360. Then 250 plus $x$ equals 360 gives $x$ = 110.'
      C: 'You went for 100. Means cannot be subtracted and scaled like that. Use sums: 6 times 60 is 360, 5 times 50 is 250, and 360 minus 250 is 110.'
      D: 'You went for 95. The sum of all six is 360 and the first five make 250, so the sixth is 360 minus 250, which is 110.'
  23:
    moments:
      - section: 'The question'
        say: 'We have nine values, each one $k$ plus or minus a number. We want the range. Picture them as dots on a line.'
        write: '$k+2,\ k-3,\ k+4,\ k-2,\ k,\ k-5,\ k+3,\ k-1,\ k+6$'
        doodle: {name: 'custom:2002_q23_a', id: line, caption: 'nine values'}
      - section: 'Solution'
        say: 'Solution. The range is the highest value minus the lowest.'
        write: 'Range $=$ highest $-$ lowest'
      - say: 'Every value is $k$ plus something. Look at what is added. The biggest is plus 6, so the highest value is $k$ plus 6.'
        write: 'Highest $= k + 6$'
        doodle_do:
          - {id: line, op: circle, part: high}
        point:
          - {line: 0, kind: circle, at: 'k+6', text: 'highest'}
      - say: 'The smallest is minus 5, so the lowest value is $k$ minus 5.'
        write: 'Lowest $= k - 5$'
        doodle_do:
          - {id: line, op: circle, part: low}
        point:
          - {line: 0, kind: circle, at: 'k−5', text: 'lowest'}
      - say: 'Substitute, and we get $k$ plus 6, minus the bracket $k$ minus 5.'
        write: 'Range $= (k + 6) - (k - 5)$'
      - say: 'Open the bracket. The minus in front changes both signs inside, giving minus $k$, plus 5.'
        write: '$= k + 6 - k + 5$'
      - say: '$k$ minus $k$ is 0, and 6 plus 5 is 11. The range is 11, whatever $k$ is.'
        write: '$\therefore$ Range $= 11$'
        doodle_do:
          - {id: line, op: label, part: span, text: '11'}
      - section: 'Check'
        say: 'Check with $k$ equals 0. The values run from minus 5 to 6, and 6 minus minus 5 is 11.'
        write: 'Check $k = 0$: $\ 6 - (-5) = 11$ ✓'
      - section: 'Answer'
        say: 'So the range is 11, which is option D.'
        write: '$\therefore$ Range $= 11$'
        answer: true
    traps:
      A: 'You went for 6. That is just the largest amount added to $k$. The range is highest minus lowest, so it is $k + 6$ minus $k - 5$, which is 11.'
      B: 'You went for 8. Find the extremes carefully. The highest is $k + 6$ and the lowest is $k - 5$. Their difference is 6 plus 5, which is 11.'
      C: 'You went for 10. The lowest value is $k - 5$, and the highest is $k + 6$. Subtracting minus 5 adds 5, so the range is 6 plus 5, which is 11.'
  24:
    moments:
      - section: 'The question'
        say: 'The table shows the number of days 260 students were absent in a term. Two frequencies are unknown, $x$ and $2x$. We want how many were absent for at least four days.'
        write: 'Total $= 260$ students. Absent at least $4$ days $= ?$'
      - section: 'Solution'
        say: 'Solution. Copy the frequency table. Every student is counted once, so sigma f, the sum of the frequencies, is 260.'
        write: '$\Sigma f = 260$'
        diagram: {id: t, kind: table, columns: ['No. of days', 'Students (f)'], rows: [[1, 20], [2, x], [3, 50], [4, 40], [5, 2x], [6, 60]]}
      - say: 'Write that as an equation, adding the frequencies in the table.'
        write: '$20 + x + 50 + 40 + 2x + 60 = 260$'
      - say: 'Collect like terms. The numbers give 20 plus 50 plus 40 plus 60, which is 170. The $x$ terms give $x$ plus $2x$, which is $3x$.'
        write: '$170 + 3x = 260$'
      - say: 'Subtract 170 from both sides. 260 minus 170 is 90.'
        write: '$3x = 260 - 170 = 90$'
      - say: 'Divide both sides by 3. 90 divided by 3 is 30. So the missing frequencies are 30 and 60.'
        write: '$x = \dfrac{90}{3} = 30$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:2,2', text: '30', 'on': 'is 30'}
          - {id: t, op: fill, part: 'cell:5,2', text: '60', 'on': '30 and 60'}
      - section: 'At least four days'
        say: 'At least four days means four days or more, so 4, 5 or 6 days, not just 4.'
        write: 'At least 4 days: $4,\ 5$ or $6$ days'
        diagram_do:
          - {id: t, op: highlight, part: 'row:4', text: '4, 5 and 6 days', 'on': 'four days or more'}
      - say: 'Add their frequencies, which are 40, $2x$ and 60.'
        write: 'Number $= 40 + 2x + 60$'
      - say: 'Substitute $x$ equals 30. 2 times 30 is 60.'
        write: '$= 40 + 2(30) + 60 = 40 + 60 + 60$'
        point:
          - {line: 8, kind: move, from: {line: 5, at: '= 30'}, at: '2(30)', text: 'x = 30'}
      - say: '40 plus 60 is 100, and 100 plus 60 is 160 students.'
        write: '$= 160$'
      - section: 'Check'
        say: 'Check sigma f with x equals 30. 20 plus 30 plus 50 plus 40 plus 60 plus 60 is 260, all the students.'
        write: 'Check: $20 + 30 + 50 + 40 + 60 + 60 = 260\ \checkmark$'
        diagram_do:
          - {id: t, op: total, part: 'col:2', 'on': 'is 260'}
      - section: 'Answer'
        say: 'Therefore 160 students were absent for at least four days, which is answer choice C.'
        write: '$\therefore$ number of students $= 160$'
        answer: true
    traps:
      A: 'You went for 40. That is only the four-day frequency. At least four days means four, five or six days, so add all three, 40 plus 60 plus 60.'
      B: 'You went for 120. That is the five-day and six-day frequencies only. At least four includes four itself, so add the 40 as well.'
      D: 'You went for 210. That includes the three-day frequency. At least four days starts at four, so it is 40 plus 60 plus 60, which is 160.'
  25:
    moments:
      - section: 'The question'
        say: 'The Venn diagram shows a class of 80. The regions are written in terms of x. Find x first, then the probability that a student picked at random offers Music only.'
        write: 'Class 80. $P(\text{Music only}) = ?$'
        point:
          - {figure: 0, kind: circle, target: '30 − x', text: 'Music only'}
      - section: 'Solution'
        say: 'Solution. Read the givens off the diagram. n of epsilon, the whole class, is 80. Music only is 30 minus x, both is x, History only is 40 minus x, and 20 offer neither.'
        write: '$n(\varepsilon) = 80$: $\ 30 - x,\ \ x,\ \ 40 - x,\ \ 20$'
        point:
          - {figure: 0, kind: circle, target: '80', text: 'n(ε)'}
          - {figure: 0, kind: circle, target: '20', text: 'neither'}
      - section: 'The equation'
        say: 'Every student is in exactly one region, so the four regions add up to the whole class, 80.'
        write: '$(30 - x) + x + (40 - x) + 20 = 80$'
      - say: 'Collect like terms. The numbers give 30 plus 40 plus 20, which is 90. For the x terms, minus x, plus x, minus x leaves minus x.'
        write: '$90 - x = 80$'
      - say: 'So x equals 90 minus 80, which is 10. Ten students offer both subjects.'
        write: '$x = 90 - 80 = 10$'
        point:
          - {figure: 0, kind: label, target: x, text: '10'}
      - section: 'Music only'
        say: 'Music only is the region 30 minus x. Put x equals 10, and 30 minus 10 is 20.'
        write: 'Music only $= 30 - x = 30 - 10 = 20$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '= [[10]]'}, at: '− 10', text: 'x'}
          - {figure: 0, kind: label, target: '30 − x', text: '20'}
      - section: 'The probability'
        say: 'Probability is the number of favourable outcomes over the total possible outcomes. Here E is picking a Music-only student, and S is the whole class.'
        write: '$P(E) = \dfrac{n(E)}{n(S)}$'
      - say: 'n of E is the 20 Music-only students, and n of S is the 80 in the class.'
        write: '$P(\text{Music only}) = \dfrac{20}{80}$'
        point:
          - {line: 7, kind: move, from: {line: 5, at: '= [[20]]'}, at: '80[[20]]', text: 'Music only'}
      - say: 'For 20 over 80, divide top and bottom by 20, and it is 1 over 4. As a decimal, 1 over 4 is 0.25.'
        write: '$= \dfrac{1}{4} = 0.25$'
      - section: 'Check'
        say: 'Check the regions with x equals 10, which gives 20, 10, 30 and 20. They add up to 80, the whole class.'
        write: '$20 + 10 + 30 + 20 = 80\ \checkmark$'
        point:
          - {figure: 0, kind: label, target: '40 − x', text: '30'}
      - section: 'Answer'
        say: 'Therefore the probability that the student offers Music only is 0.25, which is answer choice B.'
        write: '$\therefore P(\text{Music only}) = 0.25$'
        answer: true
    traps:
      A: 'You went for 0.13. That is 10 over 80, the probability for x, the students in both. Music only is the region 30 minus x, which is 20, so the probability is 20 over 80.'
      C: 'You went for 0.38. That is 30 over 80, which reads 30 as Music only. Music only is 30 minus x, and x is 10, so it is 20 over 80.'
      D: 'You went for 0.50. That is 40 over 80, from the History side. Music only is 30 minus 10, which is 20, and 20 over 80 is 0.25.'
  26:
    moments:
      - section: 'The question'
        say: 'We have ten numbers, some of them negative. We want their mean. Picture them as bars, up for positive and down for negative.'
        doodle: {name: 'custom:2002_q26_a', id: bars, caption: 'up for +, down for −'}
        write: 'Data: $7,\ -3,\ 4,\ -2,\ 5,\ -9,\ 4,\ 8,\ -6,\ 12$'
      - section: 'Solution'
        say: 'Solution. The mean, $x$ bar, is the sum of the values, sigma $x$, over the number of values, $n$.'
        write: 'Solution. $\bar{x} = \dfrac{\sum x}{n}$'
      - say: 'Count the values, and there are 10.'
        write: '$n = 10$'
      - section: 'The sum'
        say: 'To add safely, take the positive numbers first. 7 plus 4 is 11, plus 5 is 16, plus 4 is 20, plus 8 is 28, plus 12 is 40.'
        write: 'Positives: $7 + 4 + 5 + 4 + 8 + 12 = 40$'
        doodle_do:
          - {id: bars, op: label, part: pos, text: '+40'}
      - say: 'Now the negative numbers. 3 plus 2 is 5, plus 9 is 14, plus 6 is 20. So together they make negative 20.'
        write: 'Negatives: $-3 - 2 - 9 - 6 = -20$'
        doodle_do:
          - {id: bars, op: label, part: neg, text: '−20'}
      - say: 'The sum is 40 plus negative 20, which is 40 minus 20, so 20.'
        write: '$\sum x = 40 + (-20) = 40 - 20 = 20$'
      - section: 'The mean'
        say: 'Substitute into the formula, and we get 20 over 10.'
        write: '$\bar{x} = \dfrac{20}{10}$'
      - say: '20 divided by 10 is 2, which is the level line across the bars.'
        write: '$\therefore \bar{x} = 2$'
        doodle_do:
          - {id: bars, op: stage, stage: 'custom:2002_q26_a2'}
          - {id: bars, op: label, part: mean, text: 'mean 2'}
      - section: 'Check'
        say: 'Check with a running total, in the order given, which goes 7, 4, 8, 6, 11, 2, 6, 14, 8 and 20. It gives the same sum, 20.'
        write: 'Check: $7 - 3 + 4 - 2 + 5 - 9 + 4 + 8 - 6 + 12 = 20$ ✓'
      - section: 'Answer'
        say: 'So the mean is 2, which is option B.'
        write: '$\therefore$ Mean $= 2$'
        answer: true
    traps:
      A: 'You went for 1. Check the sum. The positives make 40 and the negatives make negative 20, so the sum is 20. 20 divided by 10 is 2.'
      C: 'You went for 3. Divide by all ten numbers, not just the six positive ones. The sum is 20, and 20 divided by 10 is 2.'
      D: 'You went for 4. That is 40 over 10, using only the positive numbers. The negatives take away 20, so the sum is 20 and the mean is 2.'
  27:
    moments:
      - section: 'The question'
        say: 'The probability of passing any examination is 2 over 3. A student takes three. What is the probability that he passes none of them? Picture his three papers.'
        write: '$P(\text{pass}) = \dfrac{2}{3}$; three examinations'
        doodle: {name: 'custom:2002_q27_a', id: exams, caption: 'Pass none = fail all three'}
      - say: 'Solution. Passing none means failing all three. Let $F$ be the event that he fails one examination.'
        write: 'Solution: pass none $=$ fail all three'
        doodle_do:
          - {id: exams, op: stage, stage: 'custom:2002_q27_a2'}
      - section: 'Fail one'
        say: 'Fail is the complement of pass, so P of $F$ is 1 minus P of pass.'
        write: '$P(F) = 1 - P(\text{pass})$'
      - say: 'Substitute 2 over 3. 1 is 3 over 3, and 3 minus 2 is 1, so P of $F$ is 1 over 3, the pink slice on each paper.'
        write: '$= 1 - \dfrac{2}{3} = \dfrac{1}{3}$'
        doodle_do:
          - {id: exams, op: circle, part: pink1}
      - section: 'The tree diagram'
        say: 'The examinations are independent, so one result does not change another. Draw the tree diagram, one level for each examination.'
        write: 'The three examinations are independent'
        diagram:
          id: t
          kind: tree
          size: scene
          'on': 'tree diagram'
          levels: ['1st exam', '2nd exam', '3rd exam']
          branches:
            - label: Pass
              p: '2/3'
              then:
                - {label: Pass, p: '2/3', then: [{label: Pass, p: '2/3'}, {label: Fail, p: '1/3'}]}
                - {label: Fail, p: '1/3', then: [{label: Pass, p: '2/3'}, {label: Fail, p: '1/3'}]}
            - label: Fail
              p: '1/3'
              then:
                - {label: Pass, p: '2/3', then: [{label: Pass, p: '2/3'}, {label: Fail, p: '1/3'}]}
                - {label: Fail, p: '1/3', then: [{label: Pass, p: '2/3'}, {label: Fail, p: '1/3'}]}
      - section: 'Fail all three'
        say: 'By the multiplication rule for independent events, we multiply along the path, fail, fail, fail.'
        write: '$P(F_1F_2F_3) = P(F_1) \times P(F_2) \times P(F_3)$'
      - say: 'Each is the 1 over 3 we just found, once for each crossed paper.'
        write: '$= \dfrac{1}{3} \times \dfrac{1}{3} \times \dfrac{1}{3}$'
        diagram_do:
          - {id: t, op: path, part: 'Fail/Fail/Fail'}
        doodle_do:
          - {id: exams, op: highlight, part: fails}
      - say: 'Multiply the tops, and 1 times 1 times 1 is 1. Multiply the bottoms, and 3 times 3 times 3 is 27.'
        write: '$= \dfrac{1 \times 1 \times 1}{3 \times 3 \times 3} = \dfrac{1}{27}$'
      - section: 'Check'
        say: 'To check, the opposite end of the tree, pass all three, is 2 over 3 cubed, which is 8 over 27. Failing all three must be much less likely, and 1 over 27 is.'
        write: 'Check: $P(\text{pass all}) = \dfrac{8}{27} > \dfrac{1}{27}\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the probability that he passes none of them is 1 over 27, which is option A.'
        write: '$\therefore P(\text{pass none}) = \dfrac{1}{27}$'
        doodle_do:
          - {id: exams, op: label, part: fails, text: '1/3 × 1/3 × 1/3 = 1/27'}
        answer: true
    traps:
      B: 'You went for 8 over 27. That is the Pass, Pass, Pass path, 2 over 3 cubed. We want Fail, Fail, Fail, and 1 over 3 cubed is 1 over 27.'
      C: 'You went for 4 over 9. That is 2 over 3 squared. The question is about failing. P of F is 1 over 3, and there are three examinations, so the answer is 1 over 27.'
      D: 'You went for 2 over 3. That is passing one examination. Failing one is 1 over 3, and failing all three is 1 over 3 times 1 over 3 times 1 over 3.'
  28:
    moments:
      - section: 'The question'
        say: 'We want how many three-digit numbers we can make from the digits of 32564, with no digit repeated. Think of five digit cards and three places to fill.'
        write: 'Digits: $3,\ 2,\ 5,\ 6,\ 4$; no repetition'
        doodle: {name: 'custom:2002_q28_a', id: cards, caption: '5 digits, 3 places, no repeats'}
      - say: 'Order matters, because 325 and 523 are different numbers. So this is an arrangement, which is a permutation of 3 digits from 5.'
        write: 'Solution: $n = 5,\ r = 3$; order matters'
      - section: 'The formula'
        say: 'The number of arrangements of $r$ things from $n$ is $n$ P $r$, which is $n$ factorial over, $n$ minus $r$, factorial.'
        write: '${}^{n}P_{r} = \dfrac{n!}{(n - r)!}$'
      - say: 'Substitute $n = 5$ and $r = 3$. 5 minus 3 is 2.'
        write: '${}^{5}P_{3} = \dfrac{5!}{(5 - 3)!} = \dfrac{5!}{2!}$'
      - say: 'Expand 5 factorial only down to 2 factorial, the one that cancels, so we get 5 times 4 times 3 times 2 factorial.'
        write: '$= \dfrac{5 \times 4 \times 3 \times 2!}{2!}$'
      - say: '2 factorial cancels top and bottom, leaving 5 times 4 times 3.'
        write: '$= 5 \times 4 \times 3$'
      - say: '5 times 4 is 20, and 20 times 3 is 60.'
        write: '$= 60$'
      - section: 'Check'
        say: 'Check by filling the places. For the hundreds place, any of the 5 cards can go there, so that is 5 choices.'
        write: 'Check: hundreds: $5$ choices'
        doodle_do:
          - {id: cards, op: move, part: card, path: to-h}
          - {id: cards, op: label, part: slot-h, text: '5 choices'}
      - say: 'A used card cannot be used again, so the tens place has 4 choices left, and the units place 3.'
        write: 'Tens: $4$, units: $3$'
        doodle_do:
          - {id: cards, op: label, part: slot-t, text: '4 choices'}
          - {id: cards, op: label, part: slot-u, text: '3 choices'}
      - say: 'Each choice for one place goes with every choice for the next, so multiply. 5 times 4 times 3 is 60 again.'
        write: '$5 \times 4 \times 3 = 60\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore 60 three-digit numbers can be formed, which is option C.'
        write: '$\therefore 60$ numbers'
        answer: true
    traps:
      A: 'You went for 10. That is 5 C 3, the number of ways to choose three digits when order does not matter. But 325 and 523 are different numbers, so use 5 P 3, which is 60.'
      B: 'You went for 20. That is 5 times 4, 5 P 2, which fills only two places. A three-digit number has three places, and 5 P 3 is 5 times 4 times 3.'
      D: 'You went for 120. That is 5 times 4 times 3 times 2, which fills four places, or 5 factorial over 1 factorial. We need 5 factorial over 2 factorial, which is 60.'
  29:
    moments:
      - section: 'The question'
