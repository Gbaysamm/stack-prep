# UTME 2002 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS, taught the way a good whiteboard teacher teaches: one or two
# short things said, and at most one line written while they are said. The line starts being
# written as its words start, so every line of working must be here — the board shows nothing
# the lesson does not write, and a jump from "0 = 4x - 8" to "(2, 0)" reads as missing steps.
#
#   say:    what the teacher says. Plain spoken English; mathematics may be written in $...$
#           and is said in words ("2y equals 4x minus 8"). One or two short sentences.
#   write:  the one line written while it is said, in LaTeX, or left out for nothing.
#   answer: true on the moment that gives the answer, which the board marks.
#
#   traps:  said at the end to a student who chose that wrong option: why it tempts, kindly.
#
# Keyed on question number, like explanations_2002.yaml. Answers match that file.
format_version: 1
exam_year: 2002
lessons:
  1:
    moments:
      - say: 'A trader bought goats at ₦4,000 each and sold them all for ₦180,000, making a loss of 25%. We want to know how many goats he bought.'
        write: 'Selling price: ₦180,000'
      - say: 'To count the goats, we need the total amount he paid, the cost price. Then we divide it by the ₦4,000 each goat cost. Be careful: the ₦180,000 is what he sold them for, not what he paid.'
        write: 'Cost of one goat: ₦4,000'
      - say: 'What does a loss of 25% mean? He got back 25% less than he paid. The cost is the full 100%, so the selling price is 100% minus 25%, which is 75% of the cost.'
        write: 'Selling price $= 100\% - 25\% = 75\%$ of cost'
      - say: 'So 75% of the cost is ₦180,000. As a decimal, 75% is 0.75, so 0.75 times the cost equals 180,000.'
        write: '$0.75 \times \text{cost} = 180{,}000$'
      - say: 'How do we get the cost by itself? We divide both sides by 0.75.'
        write: '$\text{cost} = \dfrac{180{,}000}{0.75}$'
      - say: '0.75 is 3 over 4, and dividing by 3 over 4 is the same as multiplying by 4 over 3.'
        write: '$= 180{,}000 \div \dfrac{3}{4} = 180{,}000 \times \dfrac{4}{3}$'
      - say: '180,000 divided by 3 is 60,000. Then 60,000 times 4 is 240,000. So he paid ₦240,000 for all the goats.'
        write: '$= 60{,}000 \times 4 = 240{,}000$'
      - say: 'Let''s check that. 25% of 240,000 is a quarter of it, which is 60,000.'
        write: 'Check: $25\%$ of $240{,}000 = 60{,}000$'
      - say: 'And 240,000 minus that 60,000 is 180,000, exactly the selling price we were given.'
        write: '$240{,}000 - 60{,}000 = 180{,}000$'
      - say: 'Now back to the goats. Each goat cost ₦4,000, so the number of goats is the total cost we just found, 240,000, divided by 4,000.'
        write: 'Number of goats $= \dfrac{240{,}000}{4{,}000}$'
      - say: 'Cancel three zeros on the top and on the bottom. That leaves 240 over 4.'
        write: '$= \dfrac{240}{4}$'
      - say: '240 divided by 4 is 60. So he bought 60 goats, which is answer choice D.'
        write: '$= 60$ goats'
        answer: true
    traps:
      A: 'You went for 36. That comes from treating ₦180,000 as 125% of the cost, as if he made a profit. A loss means he sold for less than he paid, so ₦180,000 is 75% of the cost, the cost is ₦240,000, and that buys 60 goats.'
      B: 'You went for 45. That''s 180,000 divided by 4,000, which uses the selling price. The ₦4,000 is what each goat cost to buy, so divide the cost price, ₦240,000, by 4,000.'
      C: 'You went for 50. That needs a total cost of ₦200,000. But the ₦180,000 is exactly 75% of the cost, so the cost is 180,000 divided by 0.75, which is ₦240,000, giving 60 goats.'
  2:
    moments:
      - say: 'We''re asked to simplify root 0.7 plus root 70, all squared.'
        write: '$\left(\sqrt{0.7} + \sqrt{70}\right)^{2}$'
      - say: 'Squaring a bracket means multiplying it by itself. That always follows one pattern: $a$ plus $b$, squared, equals $a$ squared plus $2ab$ plus $b$ squared.'
        write: '$(a + b)^{2} = a^{2} + 2ab + b^{2}$'
      - say: 'In our bracket, $a$ is root 0.7 and $b$ is root 70.'
        write: 'Here $a = \sqrt{0.7},\quad b = \sqrt{70}$'
      - say: 'Let''s put them into the pattern: root 0.7 squared, plus 2 times root 0.7 times root 70, plus root 70 squared.'
        write: '$= (\sqrt{0.7})^{2} + 2\sqrt{0.7}\sqrt{70} + (\sqrt{70})^{2}$'
      - say: 'Take the three terms one at a time. Squaring a square root just undoes it, so the first term, root 0.7 squared, is 0.7.'
        write: 'First term: $(\sqrt{0.7})^{2} = 0.7$'
      - say: 'In the same way, the last term, root 70 squared, is 70.'
        write: 'Last term: $(\sqrt{70})^{2} = 70$'
      - say: 'Now the middle term, where the care goes. When two square roots multiply, we can put both numbers under one root.'
        write: 'Middle term: $2\sqrt{0.7}\sqrt{70} = 2\sqrt{0.7 \times 70}$'
      - say: '0.7 times 70 is 49, because 7 times 7 is 49. So we have 2 times root 49.'
        write: '$= 2\sqrt{0.7 \times 70} = 2\sqrt{49}$'
      - say: 'The square root of 49 is 7, and 2 times 7 is 14. So the middle term is 14.'
        write: '$= 2 \times 7 = 14$'
      - say: 'Now go back to the expansion and put in the three pieces we found: 0.7 for the first term, 14 for the middle, and 70 for the last.'
        write: 'So $\left(\sqrt{0.7} + \sqrt{70}\right)^{2} = 0.7 + 14 + 70$'
      - say: '14 plus 70 is 84, and adding 0.7 gives 84.7, which is answer choice C.'
        write: '$= 84 + 0.7 = 84.7$'
        answer: true
    traps:
      A: 'You went for 217.7. The middle term came out far too big. It''s 2 times root 0.7 times root 70, which is 2 times root 49, so just 2 times 7, which is 14.'
      B: 'You went for 168.7. That uses 2 times 49 for the middle term. But the 49 is still under a square root: root 49 is 7, so the middle term is 2 times 7, which is 14.'
      D: 'You went for 70.7. That''s the two squares added with the middle term forgotten. Squaring a sum always gives a middle term, $2ab$, and here it is 14.'
  3:
    moments:
      - say: 'We need to evaluate this fraction of small decimals, correct to four significant figures.'
        write: '$\dfrac{0.21 \times 0.072 \times 0.0054}{0.006 \times 1.68 \times 0.063}$'
      - say: 'Rather than multiply everything out, let''s pair each number on top with one on the bottom, and simplify each pair on its own.'
        write: '$= \dfrac{0.21}{0.063} \times \dfrac{0.072}{0.006} \times \dfrac{0.0054}{1.68}$'
      - say: 'First pair: 0.21 over 0.063. Multiply the top and bottom by 1000 to clear the decimals. 0.21 becomes 210, and 0.063 becomes 63.'
        write: 'First pair: $\dfrac{0.21}{0.063} = \dfrac{210}{63}$'
      - say: '210 and 63 are both divisible by 21. 210 divided by 21 is 10, and 63 divided by 21 is 3. So the first pair is 10 over 3.'
        write: '$= \dfrac{210 \div 21}{63 \div 21} = \dfrac{10}{3}$'
      - say: 'Second pair: 0.072 over 0.006. Multiply the top and bottom by 1000: that''s 72 over 6, which is 12.'
        write: 'Second pair: $\dfrac{0.072}{0.006} = \dfrac{72}{6} = 12$'
      - say: 'Third pair: 0.0054 over 1.68. Multiply the top and bottom by 10,000. 0.0054 becomes 54, and 1.68 becomes 16,800.'
        write: 'Third pair: $\dfrac{0.0054}{1.68} = \dfrac{54}{16800}$'
      - say: 'Now put the three pairs back together: 10 over 3, times 12, times 54 over 16,800.'
        write: 'So the fraction $= \dfrac{10}{3} \times 12 \times \dfrac{54}{16800}$'
      - say: 'Start with 10 over 3 times 12. 12 divided by 3 is 4, and 4 times 10 is 40.'
        write: '$= \dfrac{12}{3} \times 10 \times \dfrac{54}{16800} = 40 \times \dfrac{54}{16800}$'
      - say: '40 times 54 is 2,160, so we have 2,160 over 16,800.'
        write: '$= \dfrac{40 \times 54}{16800} = \dfrac{2160}{16800}$'
      - say: 'Cancel a zero from the top and the bottom to get 216 over 1,680.'
        write: '$= \dfrac{216}{1680}$'
      - say: 'Now divide both by 24: 216 divided by 24 is 9, and 1,680 divided by 24 is 70.'
        write: '$= \dfrac{216 \div 24}{1680 \div 24} = \dfrac{9}{70}$'
      - say: '9 divided by 70 is 0.128571, and so on.'
        write: '$= 9 \div 70 = 0.128571\ldots$'
      - say: 'For four significant figures, count from the first non-zero digit: 1, 2, 8, 5. The next digit is 7, which is 5 or more, so the 5 rounds up to 6. That gives 0.1286, which is answer choice A.'
        write: '$\approx 0.1286$ (4 s.f.)'
        answer: true
    traps:
      B: 'You went for 0.1285. The digits are right, but the fifth significant digit is 7, so the fourth digit rounds up from 5 to 6. Don''t just chop the number off.'
      C: 'You went for 0.01286. The digits are right, but the decimal point has slipped one place. Pairing the factors keeps the size right: 10 over 3, times 12, times 54 over 16,800 is about 0.13.'
      D: 'You went for 0.01285. The decimal point has slipped one place, and the last digit was chopped instead of rounded up. The value is 0.128571 and so on, which is 0.1286.'
  4:
    moments:
      - say: 'In a school, 220 students offer Biology or Mathematics or both. We want the number who offer Biology but not Mathematics.'
        write: 'Total: $n(B \cup M) = 220$'
      - say: '125 offer Biology, and 110 offer Mathematics.'
        write: '$n(B) = 125,\quad n(M) = 110$'
      - say: 'Notice that 125 plus 110 is 235, which is more than 220. That''s because the students taking both subjects were counted twice, once in each subject.'
        write: '$125 + 110 = 235$'
      - say: 'So we need the formula for two sets: the union equals the first set plus the second set, minus the overlap, so the overlap is only counted once.'
        write: '$n(B \cup M) = n(B) + n(M) - n(B \cap M)$'
      - say: 'Substitute the numbers: 220 for the union, 125 for Biology and 110 for Mathematics.'
        write: '$220 = 125 + 110 - n(B \cap M)$'
      - say: 'We already know 125 plus 110 is 235.'
        write: '$220 = 235 - n(B \cap M)$'
      - say: 'Move the overlap to the left and the 220 to the right. The overlap is 235 minus 220.'
        write: '$n(B \cap M) = 235 - 220$'
      - say: '235 minus 220 is 15. So 15 students offer both subjects.'
        write: '$= 15$'
      - say: 'Now the wording. Biology but not Mathematics means all the Biology students, with the 15 who also take Mathematics taken out.'
        write: 'Biology only $= n(B) - n(B \cap M)$'
      - say: 'That''s 125 minus the 15 we just found.'
        write: '$= 125 - 15$'
      - say: '125 minus 15 is 110, which is answer choice B.'
        write: '$= 110$'
        answer: true
    traps:
      A: 'You went for 125. That''s everyone offering Biology, including the 15 who also offer Mathematics. The words ''but not Mathematics'' take those 15 away.'
      C: 'You went for 95. That''s 110 minus 15, the students offering Mathematics but not Biology. The question asks for Biology only, which is 125 minus 15.'
      D: 'You went for 80. First find the overlap: 125 plus 110 minus 220 is 15. Then Biology only is 125 minus 15, which is 110.'
  5:
    moments:
      - say: 'We need to simplify 52.4 minus 5.7 minus 3.45 minus 1.75.'
        write: '$52.4 - 5.7 - 3.45 - 1.75$'
      - say: 'Taking away three amounts one after another is the same as taking away their total. So let''s add up everything being taken away first.'
        write: '$= 52.4 - (5.7 + 3.45 + 1.75)$'
      - say: 'When adding decimals, line up the decimal points. 5.7 has one decimal place, so write it as 5.70 to match 3.45.'
        write: 'Line up: $5.7 = 5.70$'
      - say: 'Now 5.70 plus 3.45, column by column from the right. 0 plus 5 is 5. Next, 7 plus 4 is 11, so write 1 and carry 1. Then 5 plus 3 plus the carried 1 is 9. So 9.15.'
        write: '$5.70 + 3.45 = 9.15$'
      - say: 'Now add the 1.75 to that 9.15, again from the right. 5 plus 5 is 10, so write 0 and carry 1. Next, 1 plus 7 plus the carried 1 is 9. Then 9 plus 1 is 10. So 10.90.'
        write: '$9.15 + 1.75 = 10.90$'
      - say: 'So the total being taken away is 10.9.'
        write: 'Total taken away $= 10.9$'
      - say: 'Go back to our second line and put that total in. We now need 52.4 minus 10.9.'
        write: '$52.4 - (5.7 + 3.45 + 1.75) = 52.4 - 10.9$'
      - say: 'Take away the 10 first: 52.4 minus 10 is 42.4.'
        write: '$52.4 - 10 = 42.4$'
      - say: 'Then take away the remaining 0.9: 42.4 minus 0.9 is 41.5.'
        write: '$42.4 - 0.9 = 41.5$'
      - say: 'Let''s check by adding back: 41.5 plus 10.9 is 52.4. Good.'
        write: 'Check: $41.5 + 10.9 = 52.4$'
      - say: 'So 52.4 minus 5.7 minus 3.45 minus 1.75 is 41.5, which is answer choice C.'
        write: '$52.4 - 5.7 - 3.45 - 1.75 = 41.5$'
        answer: true
    traps:
      A: 'You went for 42.2. The amount taken away is 5.7 plus 3.45 plus 1.75, which is 10.9. Line up the decimal points, and 52.4 minus 10.9 is 41.5.'
      B: 'You went for 42.1. Check the decimals: 5.7 is 5.70, not 5.07. The three amounts add to 10.9, and 52.4 minus 10.9 is 41.5.'
      D: 'You went for 41.4. That''s just one tenth off. 52.4 minus 10 is 42.4, and 42.4 minus 0.9 is 41.5.'
  6:
    moments:
      - say: 'Without tables, we evaluate 343 to the power 1 over 3, times 0.14 to the power negative 1, times 25 to the power negative a half.'
        write: '$(343)^{\frac{1}{3}} \times (0.14)^{-1} \times (25)^{-\frac{1}{2}}$'
      - say: 'Two rules will do all the work. A fractional index means a root: power 1 over $n$ is the $n$th root. A negative index means a reciprocal: one over the number.'
        write: 'Rules: $a^{\frac{1}{n}} = \sqrt[n]{a},\quad a^{-1} = \dfrac{1}{a}$'
      - say: 'Let''s take each factor on its own. First factor: the power 1 over 3 means the cube root.'
        write: 'First factor: $(343)^{\frac{1}{3}} = \sqrt[3]{343}$'
      - say: 'Which number times itself three times gives 343? 7 times 7 is 49, and 49 times 7 is 343. So the cube root of 343 is 7.'
        write: '$= \sqrt[3]{7 \times 7 \times 7} = 7$'
      - say: 'Second factor: the power negative 1 means one over the number.'
        write: 'Second factor: $(0.14)^{-1} = \dfrac{1}{0.14}$'
      - say: 'Multiply the top and bottom by 100 to clear the decimal. That gives 100 over 14.'
        write: '$= \dfrac{100}{14}$'
      - say: 'Divide the top and bottom by 2, and that''s 50 over 7.'
        write: '$= \dfrac{50}{7}$'
      - say: 'Third factor: the minus in the power means one over, and the half means square root. So it''s one over root 25.'
        write: 'Third factor: $(25)^{-\frac{1}{2}} = \dfrac{1}{\sqrt{25}}$'
      - say: 'The square root of 25 is 5, so the third factor is 1 over 5.'
        write: '$= \dfrac{1}{5}$'
      - say: 'Now go back to the product and replace each factor with what we found: 7, then 50 over 7, then 1 over 5.'
        write: 'So the product $= 7 \times \dfrac{50}{7} \times \dfrac{1}{5}$'
      - say: 'The 7 on top cancels the 7 underneath, leaving 50.'
        write: '$= 50 \times \dfrac{1}{5}$'
      - say: '50 divided by 5 is 10, which is answer choice C.'
        write: '$= 10$'
        answer: true
    traps:
      A: 'You went for 7. That''s only the first factor, the cube root of 343. Multiply it by the other two: 50 over 7, and 1 over 5.'
      B: 'You went for 8. Check each factor: the cube root of 343 is 7, one over 0.14 is 50 over 7, and one over root 25 is 1 over 5. Together they make 10.'
      D: 'You went for 12. The 7s cancel to leave 50, and 50 times 1 over 5 is 10. Take care with one over 0.14: it is 100 over 14, which is 50 over 7.'
  7:
    moments:
      - say: 'In the diagram, two circles share the centre $O$. The small one has radius $r$, the big one radius $R$, and $r$ is 2 over 5 of $R$. We want the shaded area.'
        write: '$r = \tfrac{2}{5}R$'
      - say: 'The shaded part is the ring between the two circles. So its area is the whole big circle, with the small circle cut out of it.'
        write: 'Shaded $=$ big circle $-$ small circle'
      - say: 'The area of a circle is pi times radius squared. So the big circle is $\pi R^{2}$, and the small circle is $\pi r^{2}$.'
        write: 'Shaded $= \pi R^{2} - \pi r^{2}$'
      - say: 'The answer must be in terms of $R$ only, so replace $r$ with 2 over 5 of $R$, from our first line.'
        write: '$= \pi R^{2} - \pi\left(\tfrac{2}{5}R\right)^{2}$'
      - say: 'To square 2 over 5 of $R$, square the top, square the bottom, and square the $R$. 2 squared is 4, and 5 squared is 25.'
        write: '$\left(\tfrac{2}{5}R\right)^{2} = \dfrac{2^{2}}{5^{2}}R^{2} = \dfrac{4}{25}R^{2}$'
      - say: 'So the small circle is 4 over 25 of $\pi R^{2}$. Put that back into the shaded area.'
        write: 'Shaded $= \pi R^{2} - \tfrac{4}{25}\pi R^{2}$'
      - say: 'Both terms have $\pi R^{2}$, so take it out as a common factor. That leaves 1 minus 4 over 25 in the bracket.'
        write: '$= \left(1 - \tfrac{4}{25}\right)\pi R^{2}$'
      - say: 'To subtract, write 1 as 25 over 25.'
        write: '$= \left(\tfrac{25}{25} - \tfrac{4}{25}\right)\pi R^{2}$'
      - say: '25 minus 4 is 21. So the shaded area is 21 over 25 of $\pi R^{2}$, which is answer choice C.'
        write: '$= \tfrac{25 - 4}{25}\pi R^{2} = \tfrac{21}{25}\pi R^{2}$'
        answer: true
    traps:
      A: 'You went for 9 over 25 of $\pi R^{2}$. That''s 3 over 5 squared, from taking 1 minus 2 over 5 first and then squaring. Square the radius ratio first: the small circle is 4 over 25 of the big one, leaving 21 over 25.'
      B: 'You went for 5 over 9 of $\pi R^{2}$. The ratio of the areas is the square of the ratio of the radii: 2 over 5 squared is 4 over 25, and 1 minus that is 21 over 25.'
      D: 'You went for 21 over 23 of $\pi R^{2}$. The top is right, but the bottom must stay 25, because 5 squared is 25 and 1 is 25 over 25.'
  8:
    moments:
      - say: 'The line $2y - kx + 4 = 0$ is perpendicular to the line $y + \tfrac{1}{4}x - 7 = 0$. We want the value of $k$.'
        write: '$2y - kx + 4 = 0$'
      - say: 'Perpendicular means the lines meet at a right angle. The key fact: when two lines are perpendicular, their gradients multiply to give negative 1.'
        write: 'Perpendicular: $m_1 \times m_2 = -1$'
      - say: 'To read off a gradient, we put each line in the form $y = mx + c$. The number in front of $x$ is then the gradient. Start with the first line: move the $kx$ and the 4 to the other side.'
        write: '$2y = kx - 4$'
      - say: 'Divide everything by 2. $kx$ over 2 is $k$ over 2 times $x$, and 4 over 2 is 2.'
        write: '$y = \dfrac{k}{2}x - 2$'
      - say: 'So the first gradient is the number in front of $x$: $k$ over 2.'
        write: '$m_1 = \dfrac{k}{2}$'
      - say: 'Now the second line, $y + \tfrac{1}{4}x - 7 = 0$. Take the quarter $x$ to the other side, where it becomes negative, and the negative 7 becomes plus 7.'
        write: '$y = -\dfrac{1}{4}x + 7$'
      - say: 'So the second gradient is negative 1 over 4.'
        write: '$m_2 = -\dfrac{1}{4}$'
      - say: 'Now use the perpendicular rule: put both gradients into $m_1$ times $m_2$ equals negative 1.'
        write: '$\dfrac{k}{2} \times \left(-\dfrac{1}{4}\right) = -1$'
      - say: 'Multiply the fractions: the tops give negative $k$, and 2 times 4 is 8 on the bottom. So negative $k$ over 8 equals negative 1.'
        write: '$-\dfrac{k}{2 \times 4} = -\dfrac{k}{8} = -1$'
      - say: 'To get $k$ by itself, multiply both sides by negative 8.'
        write: '$k = (-1) \times (-8)$'
      - say: 'Negative 1 times negative 8 is positive 8. So $k$ is 8, which is answer choice D.'
        write: '$k = 8$'
        answer: true
    traps:
      A: 'You went for negative 8. That''s what you get if the product of the gradients is set to positive 1. For perpendicular lines the product is negative 1, so $k$ is positive 8.'
      B: 'You went for negative 4. Two slips: the first gradient is $k$ over 2, not $k$, because the $2y$ must be divided by 2; and the product of the gradients must be negative 1, not positive 1.'
      C: 'You went for 4. That uses $k$ as the first gradient, forgetting to divide by the 2 in $2y$. The gradient is $k$ over 2, and $k$ over 2 times negative 1 over 4 equals negative 1 gives $k = 8$.'
  9:
    moments:
      - say: 'A bucket is 12 cm across the top, 8 cm across the bottom, and 4 cm deep. We want its volume.'
        write: 'Top diameter $= 12$ cm, bottom diameter $= 8$ cm, depth $= 4$ cm'
      - say: 'First, what shape is it? A bucket is wider at the top than at the bottom, so it isn''t a cylinder. It''s a frustum: a cone with its tip cut off.'
        write: 'Shape: frustum of a cone'
      - say: 'The volume of a frustum is pi $h$ over 3, times the bracket $R$ squared plus $R$ times $r$ plus $r$ squared. $R$ is the big radius, $r$ the small radius, and $h$ the height.'
        write: '$V = \dfrac{\pi h}{3}\left(R^{2} + Rr + r^{2}\right)$'
      - say: 'The formula uses radii, so we halve the diameters. The top radius is 12 over 2, which is 6 cm.'
        write: 'Top radius: $R = \dfrac{12}{2} = 6$ cm'
      - say: 'The bottom radius is 8 over 2, which is 4 cm.'
        write: 'Bottom radius: $r = \dfrac{8}{2} = 4$ cm'
      - say: 'And the height is the depth, 4 cm.'
        write: 'Height: $h = 4$ cm'
      - say: 'Now substitute into the formula: 4 for $h$, 6 for $R$, and 4 for $r$.'
        write: '$V = \dfrac{\pi \times 4}{3}\left(6^{2} + 6 \times 4 + 4^{2}\right)$'
      - say: 'Work out the bracket piece by piece. 6 squared is 36, 6 times 4 is 24, and 4 squared is 16.'
        write: '$= \dfrac{4\pi}{3}\left(36 + 24 + 16\right)$'
      - say: '36 plus 24 is 60, and 60 plus 16 is 76.'
        write: '$= \dfrac{4\pi}{3} \times (60 + 16) = \dfrac{4\pi}{3} \times 76$'
      - say: '4 times 76 is 304. So the volume is 304 pi over 3 cubic centimetres, which is answer choice B.'
        write: '$= \dfrac{4 \times 76\,\pi}{3} = \dfrac{304\pi}{3}\ \text{cm}^{3}$'
        answer: true
    traps:
      A: 'You went for 144 pi. That treats the bucket as a cylinder of radius 6 and height 4, but the bottom is narrower than the top. The bucket is a frustum, so use the frustum formula.'
      C: 'You went for 72 pi. The bucket is a frustum, so its volume is pi $h$ over 3 times the bracket $R^{2} + Rr + r^{2}$, which is 4 pi over 3 times 76.'
      D: 'You went for 128 pi. Use the frustum formula with the radii 6 and 4, not the diameters: the bracket is 36 plus 24 plus 16, which is 76, and 4 pi over 3 times 76 is 304 pi over 3.'
  10:
    moments:
      - say: 'In the diagram, $XZ$ is a diameter of the circle, the radius is 15 over 2 cm, and $XY$ is 12 cm. We want the area of triangle $XYZ$.'
        write: 'Radius $= \tfrac{15}{2}$ cm, $XY = 12$ cm'
      - say: 'Here''s the key fact: the angle in a semicircle is a right angle. $XZ$ is a diameter, so the angle at $Y$, standing on it, is 90 degrees. Triangle $XYZ$ is right-angled.'
        write: '$\angle XYZ = 90^{\circ}$'
      - say: 'The diameter is twice the radius. 2 times 15 over 2 is 15. So $XZ$ is 15 cm, and since it''s opposite the right angle, it''s the hypotenuse.'
        write: 'Diameter: $XZ = 2 \times \tfrac{15}{2} = 15$ cm'
      - say: 'We know two sides, so let''s find the third side, $YZ$, using Pythagoras: the hypotenuse squared equals the sum of the squares of the other two sides.'
        write: '$XZ^{2} = XY^{2} + YZ^{2}$'
      - say: 'Substitute 15 for $XZ$ and 12 for $XY$.'
        write: '$15^{2} = 12^{2} + YZ^{2}$'
      - say: '15 squared is 225, and 12 squared is 144.'
        write: '$225 = 144 + YZ^{2}$'
      - say: 'Subtract 144 from both sides. 225 minus 144 is 81.'
        write: '$YZ^{2} = 225 - 144 = 81$'
      - say: 'The square root of 81 is 9, so $YZ$ is 9 cm.'
        write: '$YZ = \sqrt{81} = 9$ cm'
      - say: 'Now the area. In a right-angled triangle, the two sides that meet at the right angle are the base and the height. Here those are $XY$ and $YZ$.'
