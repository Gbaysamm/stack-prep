        say: 'Check that the sectors fill the circle. In the same way, rice is 24 degrees, groundnut 60, and cocoa 132.'
        write: 'Rice $24^{\circ}$, groundnut $60^{\circ}$, cocoa $132^{\circ}$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:1,3', text: '24°', 'on': '24 degrees'}
          - {id: t, op: fill, part: 'cell:2,3', text: '60°', 'on': '60'}
          - {id: t, op: fill, part: 'cell:4,3', text: '132°', 'on': '132'}
      - say: 'Palm oil is 108 degrees. 24 plus 60 plus 36 plus 132 plus 108 is 360 degrees. The pie is full.'
        write: 'Palm oil $108^{\circ}$; $24 + 60 + 36 + 132 + 108 = 360^{\circ}\ \checkmark$'
        diagram_do:
          - {id: t, op: fill, part: 'cell:5,3', text: '108°', 'on': '108 degrees'}
        diagram: {id: p, kind: pie, show: angle, sectors: [{label: Rice, value: 2}, {label: Groundnut, value: 5}, {label: Cassava, value: 3, colour: green}, {label: Cocoa, value: 11}, {label: Palm oil, value: 9}]}
      - section: 'Answer'
        say: 'Therefore the angle of the cassava sector is 36 degrees, which is answer choice A.'
        write: '$\therefore$ cassava $= 36^{\circ}$'
        answer: true
    traps:
      B: 'You went for 60 degrees. That is the groundnut sector, 5 out of 30. Cassava is the third crop, with 3 acres, and 3 over 30, times 360, is 36 degrees.'
      C: 'You went for 108 degrees. That is 3 over 10 of 360, and also the palm oil sector. Cassava is 3 out of a total of 30, so its angle is 36 degrees.'
      D: 'You went for 180 degrees. That would be half the land. Cassava is only 3 out of 30 acres, which is 1 over 10, so its angle is 36 degrees.'
  30:
    moments:
      - section: 'The question'
        say: 'We have six numbers, 7, 3, 14, 9, 7 and 8. We want their mean deviation, M.D. Picture them as dots on a line.'
        write: 'M.D. of $7,\ 3,\ 14,\ 9,\ 7,\ 8$'
        doodle: {name: 'custom:2002_q30_a', id: flag, caption: 'six numbers on a line'}
      - section: 'Solution'
        say: 'Solution. The M.D. is the sum of the absolute deviations over $n$. Absolute, the two straight lines, means we ignore the minus signs.'
        write: 'M.D. $= \dfrac{\sum |x - \bar{x}|}{n}$'
      - section: 'The mean'
        say: 'The mean first. 7 plus 3 is 10, plus 14 is 24, plus 9 is 33, plus 7 is 40, plus 8 is 48.'
        write: '$\sum x = 7 + 3 + 14 + 9 + 7 + 8 = 48$'
      - say: 'There are 6 numbers. The mean, $x$ bar, is 48 over 6, which is 8.'
        write: '$\bar{x} = \dfrac{\sum x}{n} = \dfrac{48}{6} = 8$'
        doodle_do:
          - {id: flag, op: label, part: mean, text: 'x̄ = 8'}
      - section: 'The deviation table'
        say: 'Now the deviation table. Take each number minus 8, then the absolute value.'
        write: '$\bar{x} = 8$, $\ n = 6$'
        diagram:
          id: d
          kind: table
          columns: ['x', 'x − x̄', '|x − x̄|']
          rows: [[7, '', ''], [3, '', ''], [14, '', ''], [9, '', ''], [7, '', ''], [8, '', '']]
          'on': 'table'
      - say: '7 minus 8 is minus 1. 3 minus 8 is minus 5. 14 minus 8 is 6.'
        write: '$7 - 8 = -1,\ 3 - 8 = -5,\ 14 - 8 = 6$'
        diagram_do:
          - {id: d, op: fill, part: 'cell:1,2', text: '−1'}
          - {id: d, op: fill, part: 'cell:2,2', text: '−5'}
          - {id: d, op: fill, part: 'cell:3,2', text: '6'}
      - say: '9 minus 8 is 1. 7 minus 8 is minus 1. 8 minus 8 is 0.'
        write: '$9 - 8 = 1,\ 7 - 8 = -1,\ 8 - 8 = 0$'
        diagram_do:
          - {id: d, op: fill, part: 'cell:4,2', text: '1'}
          - {id: d, op: fill, part: 'cell:5,2', text: '−1'}
          - {id: d, op: fill, part: 'cell:6,2', text: '0'}
      - say: 'Ignore the minus signs, so we get 1, 5 and 6.'
        write: '$|-1| = 1,\ |-5| = 5,\ |6| = 6$'
        diagram_do:
          - {id: d, op: fill, part: 'cell:1,3', text: '1'}
          - {id: d, op: fill, part: 'cell:2,3', text: '5'}
          - {id: d, op: fill, part: 'cell:3,3', text: '6'}
        doodle_do:
          - {id: flag, op: stage, stage: 'custom:2002_q30_a2'}
      - say: 'Then we get 1, 1 and 0.'
        write: '$|1| = 1,\ |-1| = 1,\ |0| = 0$'
        diagram_do:
          - {id: d, op: fill, part: 'cell:4,3', text: '1'}
          - {id: d, op: fill, part: 'cell:5,3', text: '1'}
          - {id: d, op: fill, part: 'cell:6,3', text: '0'}
      - say: 'Add the last column, and 1 plus 5 plus 6 plus 1 plus 1 plus 0 is 14.'
        write: '$\sum |x - \bar{x}| = 14$'
        diagram_do:
          - {id: d, op: total, part: 'col:3', 'on': 'Add'}
        doodle_do:
          - {id: flag, op: label, part: gaps, text: '1+5+6+1+1+0 = 14'}
      - section: 'The mean deviation'
        say: 'Substitute, and we get 14 over 6. Divide the top and the bottom by 2 to get 7 over 3.'
        write: 'M.D. $= \dfrac{14}{6} = \dfrac{7}{3}$'
      - say: '3 goes into 7 twice, remainder 1. So 7 over 3 is 2 and one third.'
        write: '$\therefore$ M.D. $= 2\tfrac{1}{3}$'
      - section: 'Check'
        say: 'Check the mean, because with their signs, the deviations add to 0. Minus 1, minus 5, plus 6, plus 1, minus 1, plus 0 is 0.'
        write: 'Check: $-1 - 5 + 6 + 1 - 1 + 0 = 0$ ✓'
      - section: 'Answer'
        say: 'So the mean deviation is 2 and one third, which is option B.'
        write: '$\therefore$ M.D. $= 2\tfrac{1}{3}$'
        answer: true
    traps:
      A: 'You went for 2 and a half. That is 15 over 6. Check the absolute deviations from the mean of 8. They are 1, 5, 6, 1, 1 and 0, which add to 14, not 15.'
      C: 'You went for 2 and 1 over 6, which is 13 over 6. The absolute deviations 1, 5, 6, 1, 1 and 0 add to 14, so the M.D. is 14 over 6.'
      D: 'You went for 1 and 1 over 6, which is 7 over 6. The absolute deviations add to 14, and 14 over 6 is 7 over 3, which is 2 and one third.'
  31:
    moments:
      - section: 'The question'
        say: 'Find the maximum value of $y$. Many students stop at the $x$ of the turning point. The question wants the value of $y$ there.'
        write: '$y = 1 - 2x - 3x^{2}$'
        diagram:
          id: g
          kind: graph
          x: [-2, 1.5]
          y: [-5, 2]
          plots:
            - {fn: '1 - 2x - 3x^2', label: 'y = 1 − 2x − 3x²', colour: blue}
      - section: 'Solution'
        say: 'Solution. Differentiate term by term, so multiply by the power, then reduce the power by 1. The constant 1 gives 0, and minus $2x$ gives minus 2.'
        write: '$\dfrac{dy}{dx} = 0 - 2 - 3(2)x^{2-1}$'
      - say: 'For minus $3x$ squared, 3 times the power 2 is 6, and the power drops to 1. So it gives minus $6x$.'
        write: '$\dfrac{dy}{dx} = -2 - 6x$'
      - section: 'Turning point'
        say: 'At the turning point, the gradient is zero. So we write, at turning point, $\dfrac{dy}{dx}$ equals 0.'
        'on': 'turning point'
        write: 'At turning point, $\dfrac{dy}{dx} = 0$'
      - say: 'So minus 2 minus $6x$ equals 0.'
        write: '$-2 - 6x = 0$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: '= [[−2 − 6x]]'}, at: '−2 − 6x', text: 'dy/dx'}
      - say: 'Add 2 to both sides. Minus $6x$ equals 2.'
        write: '$-6x = 2$'
      - say: 'Divide both sides by minus 6. $x$ equals 2 over minus 6, which is minus 1 over 3.'
        write: '$x = \dfrac{2}{-6} = -\dfrac{1}{3}$'
      - section: 'Second derivative'
        say: 'Is it a maximum or a minimum? Differentiate again. Minus 2 gives 0, and minus $6x$ gives minus 6.'
        write: '$\dfrac{d^{2}y}{dx^{2}} = -6$'
      - say: 'The second derivative is negative, less than zero. A negative second derivative means a maximum, so the curve is a hill, as on the graph.'
        'on': 'negative second'
        write: '$\dfrac{d^{2}y}{dx^{2}} = -6 < 0$, $\ \therefore$ maximum'
        diagram_do:
          - {id: g, op: vertex, part: 'plot:1', text: 'maximum', on: hill}
      - section: 'Maximum value'
        say: 'Now the value. Substitute $x$ equals minus 1 over 3 into the original equation, with the minus 1 over 3 in brackets.'
        write: '$y_{\max} = 1 - 2\left(-\tfrac{1}{3}\right) - 3\left(-\tfrac{1}{3}\right)^{2}$'
        point:
          - {line: 9, kind: move, from: {line: 6, at: '= [[−31]]'}, at: '2(−31)', text: 'x'}
      - say: 'Minus 2 times minus 1 over 3 is plus 2 over 3. Minus 1 over 3, squared, is 1 over 9.'
        write: '$= 1 + \tfrac{2}{3} - 3 \times \tfrac{1}{9}$'
      - say: '3 times 1 over 9 is 1 over 3.'
        write: '$= 1 + \tfrac{2}{3} - \tfrac{1}{3}$'
      - say: '2 over 3 minus 1 over 3 is 1 over 3. 1 plus 1 over 3 is 4 over 3.'
        write: '$= 1 + \tfrac{1}{3} = \tfrac{4}{3}$'
        diagram_do:
          - {id: g, op: label, part: 'point:1', text: 'y max = 4/3', colour: green}
      - section: 'Check'
        say: 'Here is an exam tip we can use as a check. For a quadratic, the turning point is at $x$ equals minus $b$ over $2a$. Here $a$ is minus 3 and $b$ is minus 2.'
        write: 'Exam tip: $x = -\dfrac{b}{2a} = -\dfrac{(-2)}{2(-3)} = -\dfrac{1}{3}\ \checkmark$'
      - say: 'It agrees. Therefore the maximum value of $y$ is 4 over 3, which is answer choice B.'
        write: '$\therefore$ maximum value of $y = \tfrac{4}{3}$'
        answer: true
    traps:
      A: 'You went for 5 over 3. That is 1 plus 2 over 3, with the last term left out. Minus 1 over 3, squared, is 1 over 9, and minus 3 times 1 over 9 takes away 1 over 3.'
      C: 'You went for 5 over 4. At turning point, $\dfrac{dy}{dx}$ is 0, which gives $x$ equals minus 1 over 3. Substituting gives 1 plus 2 over 3 minus 1 over 3, which is 4 over 3.'
      D: 'You went for 3 over 4. Watch the signs. $x$ is minus 1 over 3, so minus $2x$ becomes plus 2 over 3. Then $y$ is 1 plus 2 over 3 minus 1 over 3, which is 4 over 3.'
  32:
    moments:
      - section: 'The question'
        say: 'In an A.P., the 9th term is five times the 5th term. We want an equation connecting the first term $a$ and the common difference $d$.'
        write: '$T_{9} = 5T_{5}$; $\ a$ and $d$?'
        doodle: {name: 'custom:2002_q32_a', id: stairs, caption: 'equal steps'}
      - section: 'Solution'
        say: 'Solution. The $n$th term of an A.P. is $a$ plus $n$ minus 1, times $d$.'
        write: 'Solution: $T_{n} = a + (n - 1)d$'
        doodle_do:
          - {id: stairs, op: circle, part: note}
      - say: 'For the 9th term, $n$ minus 1 is 8.'
        write: '$T_{9} = a + 8d$'
        doodle_do:
          - {id: stairs, op: label, part: t9, text: 'a + 8d'}
      - say: 'For the 5th term, $n$ minus 1 is 4.'
        write: '$T_{5} = a + 4d$'
        doodle_do:
          - {id: stairs, op: label, part: t5, text: 'a + 4d'}
      - say: 'Substitute both into the condition, which says the 9th term equals 5 times the 5th.'
        write: '$a + 8d = 5(a + 4d)$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: 'a + 8d'}, at: '[[a + 8d]] =', text: 'T9'}
          - {line: 4, kind: move, from: {line: 3, at: 'a + 4d'}, at: '(a + 4d)', text: 'T5'}
      - say: 'Open the bracket. 5 times $a$ is $5a$, and 5 times $4d$ is $20d$.'
        write: '$a + 8d = 5a + 20d$'
      - say: 'Collect like terms on the right by subtracting $a$ and $8d$ from both sides. $5a$ minus $a$ is $4a$, and $20d$ minus $8d$ is $12d$.'
        write: '$0 = 4a + 12d$'
      - say: 'Divide every term by 4.'
        write: '$\therefore\ a + 3d = 0$'
      - section: 'Check'
        say: 'Check with numbers that fit, say $d$ equal to 1 and $a$ equal to negative 3. Then the 5th term is negative 3 plus 4, which is 1, and the 9th term is negative 3 plus 8, which is 5.'
        write: 'Check: $a = -3,\ d = 1$: $\ T_{5} = 1,\ T_{9} = 5 = 5 \times 1\ \checkmark$'
      - say: 'Therefore $a$ plus $3d$ equals 0, which is answer choice B.'
        write: '$\therefore\ a + 3d = 0$'
        answer: true
    traps:
      A: 'You went for $a$ plus $2d$ equals 0. Check the terms. The 9th is $a$ plus $8d$ and the 5th is $a$ plus $4d$. Then $4a$ plus $12d$ equals 0, which divides to $a$ plus $3d$ equals 0.'
      C: 'You went for $3a$ plus $5d$ equals 0. Use $n$ minus 1 in both terms, so $a$ plus $8d$ equals $5a$ plus $20d$. That gives $4a$ plus $12d$ equals 0, so $a$ plus $3d$ equals 0.'
      D: 'You went for $2a$ plus $d$ equals 0. Multiply the whole bracket by 5 to get $5a$ plus $20d$. Collecting gives $4a$ plus $12d$ equals 0, so $a$ plus $3d$ equals 0.'
  33:
    moments:
      - section: 'The question'
        say: 'Here are 45 men, and they finish a job in 5 days. Send some home and keep only 25. Will the job take more days or fewer, and exactly how many?'
        doodle: {name: person-small, id: men, repeat: 45, layout: grid, caption: '45 men, 5 days'}
        write: '45 men take 5 days; $\ $25 men take ? days'
      - say: 'Solution. Let $T$ be the number of days and $M$ the number of men.'
        write: 'Solution: let $T$ = number of days, $M$ = number of men'
      - say: 'Time is inversely proportional to the number of men, so $T$ is proportional to 1 over $M$.'
        write: '$T \propto \dfrac{1}{M}$'
      - say: 'Replace the sign with the constant $k$. More men means fewer days.'
        write: '$\therefore\ T = \dfrac{k}{M}$'
      - section: 'Find k'
        say: 'Substitute the case we know, where $M$ is 45 and $T$ is 5.'
        write: 'When $M = 45,\ T = 5$: $\ 5 = \dfrac{k}{45}$'
      - say: 'Multiply both sides by 45. 5 times 45 is 225. Think of $k$ as the whole job, which is 225 man-days of work.'
        doodle_do:
          - {id: men, op: group, n: 45, text: '225 man-days', 'on': 'man-days'}
        write: '$\therefore\ k = 5 \times 45 = 225$'
      - section: 'The equation'
        say: 'So the equation connecting $T$ and $M$ is $T$ equals 225 over $M$.'
        write: '$\therefore\ T = \dfrac{225}{M}$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '= 225'}, at: '225', text: 'k'}
      - section: 'Find T for 25 men'
        say: 'Now keep only 25 men. Substitute $M$ equals 25.'
        doodle_do:
          - {id: men, op: split, n: 25, text: '25 men | 20 sent home'}
        write: 'When $M = 25$: $\ T = \dfrac{225}{25}$'
      - say: '225 divided by 25 is 9, because 25 times 9 is 225. So 25 men take 9 days.'
        write: '$\therefore\ T = 9$ days'
        point:
          - {line: 8, kind: highlight, at: '9'}
      - section: 'Check'
        say: 'To check, fewer men should take more days, and 9 is more than 5. And 25 men times 9 days gives back the 225 man-days.'
        doodle_do:
          - {id: men, op: pulse}
        write: 'Check: $\ 25 \times 9 = 225\ \checkmark$'
      - say: 'So 25 men take 9 days, which is option B.'
        write: 'Time $= 9$ days'
        answer: true
    traps:
      A: 'You went for 5 days. That''s the time for 45 men. With fewer men, the same work takes longer.'
      C: 'You went for 12 days. The constant is 5 times 45, which is 225. Then $T$ is 225 divided by 25, which is 9 days.'
      D: 'You went for 15 days. Find $k$ first. 5 times 45 is 225. Then 225 divided by 25 is 9, not 15.'
  34:
    moments:
      - section: 'The question'
        say: 'We have two stars and a bracket. A common slip is to stop after the bracket and pick its value. The bracket comes first, and its answer goes back into the rule.'
        write: '$p * q = pq + p + q$. Find $2 * (3 * 4)$.'
      - say: 'Solution. Write the definition line, which says $p$ star $q$ is $p$ times $q$, plus $p$, plus $q$.'
        write: 'Solution: $p * q = pq + p + q$'
        doodle: {name: 'custom:2002_q34_a', id: two, caption: 'the bracket first, then the outside'}
      - section: 'The bracket first'
        say: 'Like BODMAS, the bracket comes first, so we do 3 star 4. Here $p$ is 3 and $q$ is 4.'
        write: '$p = 3,\ q = 4$'
        doodle_do:
          - {id: two, op: highlight, part: mach1}
      - say: 'Substitute, and we get 3 times 4, plus 3, plus 4.'
        write: '$3 * 4 = (3)(4) + 3 + 4$'
      - say: '3 times 4 is 12.'
        write: '$= 12 + 3 + 4$'
      - say: '12 plus 3 is 15, and 15 plus 4 is 19.'
        write: '$= 19$'
        doodle_do:
          - {id: two, op: label, part: out1, text: '19'}
      - section: 'Then the outside'
        say: 'Replace the bracket with 19. The question becomes 2 star 19.'
        write: '$2 * (3 * 4) = 2 * 19$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '19'}, at: '∗ 19', text: 'from the bracket'}
        doodle_do:
          - {id: two, op: arrow, part: out1, to_part: mach2}
      - say: 'Use the rule again, with $p$ as 2 and $q$ as 19, so 2 times 19, plus 2, plus 19.'
        write: '$= (2)(19) + 2 + 19$'
      - say: '2 times 19 is 38.'
        write: '$= 38 + 2 + 19$'
      - say: '38 plus 2 is 40, and 40 plus 19 is 59.'
        write: '$= 59$'
        doodle_do:
          - {id: two, op: label, part: out2, text: '59'}
      - section: 'Answer'
        say: 'Therefore 2 star, bracket, 3 star 4, is 59, which is option C.'
        write: '$\therefore 2 * (3 * 4) = 59$'
        answer: true
    traps:
      A: 'You went for 19. That is only the bracket, 3 star 4. Now use the rule again for 2 star 19, which is 59.'
      B: 'You went for 38. That is just 2 times 19. The rule also adds $p$ and $q$, so 38 plus 2 plus 19 is 59.'
      D: 'You went for 67. Check the rule: 2 star 19 is 2 times 19, plus 2, plus 19. That is 38 plus 21, which is 59.'
  35:
    moments:
      - section: 'The question'
        say: 'Picture the equation as a balance, where both sides must weigh the same. We are told minus 2 is the solution, and we want $c$.'
        write: '$2x + 1 - 3c = 2c + 3x - 7$'
        doodle: {name: 'custom:2002_q35_a', id: scale, caption: 'both sides must balance', 'on': 'Picture'}
      - section: 'Solution'
        say: 'Solution. Minus 2 is the solution, so $x$ equals minus 2 makes the equation true. Substitute minus 2 for $x$.'
        write: 'Sub. $x = -2$:'
        doodle_do:
          - {id: scale, op: circle, part: tag}
      - say: 'Put minus 2 in place of $x$ on both sides, keeping it in brackets.'
        write: '$2(-2) + 1 - 3c = 2c + 3(-2) - 7$'
        point:
          - {line: 2, kind: move, from: {line: 1, at: '−2'}, at: '2(−2)', text: 'sub in'}
          - {line: 2, kind: move, from: {line: 1, at: '−2'}, at: '3(−2)'}
      - say: 'Open the brackets. 2 times minus 2 is minus 4. 3 times minus 2 is minus 6.'
        write: '$-4 + 1 - 3c = 2c - 6 - 7$'
      - say: 'Simplify each side. Minus 4 plus 1 is minus 3. Minus 6 minus 7 is minus 13.'
        write: '$-3 - 3c = 2c - 13$'
        doodle_do:
          - {id: scale, op: label, part: left-pan, text: '−3 − 3c'}
          - {id: scale, op: label, part: right-pan, text: '2c − 13'}
      - section: 'Collect like terms'
        say: 'Collect like terms, with the $c$ terms on the right and the numbers on the left. Add $3c$ to both sides, and add 13 to both sides.'
        write: '$-3 + 13 = 2c + 3c$'
        point:
          - {line: 5, kind: move, from: {line: 4, at: '− 3c'}, at: '+ 3c', text: '+3c'}
          - {line: 5, kind: move, from: {line: 4, at: '− 13'}, at: '+ 13', text: '+13'}
      - say: 'Minus 3 plus 13 is 10, and $2c$ plus $3c$ is $5c$.'
        write: '$10 = 5c$'
      - say: 'Divide both sides by 5, the coefficient of $c$. 10 divided by 5 is 2.'
        write: '$c = \dfrac{10}{5} = 2$'
      - section: 'Check'
        say: 'Check with $c$ equals 2. The left side is minus 3 minus 6, which is minus 9. The right side is 4 minus 13, also minus 9. The pans balance.'
        write: 'Check: $-3 - 3(2) = -9$, $\ 2(2) - 13 = -9$'
        doodle_do:
          - {id: scale, op: label, part: beam, text: '−9 = −9'}
      - say: 'Therefore $c$ is 2, which is answer choice B.'
        write: '$\therefore c = 2$'
        answer: true
    traps:
      A: 'You went for 1. Substitute $x = -2$ carefully. The left side is minus 3 minus $3c$ and the right side is $2c$ minus 13. That gives $5c = 10$, so $c$ is 2.'
      C: 'You went for 3. Watch the signs. 3 times minus 2 is minus 6, and minus 6 minus 7 is minus 13. Then $-3 - 3c = 2c - 13$ gives $c = 2$.'
      D: 'You went for 4. After substituting, we get $-3 - 3c = 2c - 13$. Adding $3c$ and 13 to both sides gives $10 = 5c$, so $c$ is 2.'
  36:
    moments:
      - section: 'The question'
        say: 'This is a 3 by 3 determinant, with nine entries in three rows and three columns. Most students who miss this lose one sign. Let''s expand it the textbook way.'
        doodle: {name: 'custom:2002_q36_a', id: grid, caption: 'nine entries'}
        write: '$|N| = \begin{vmatrix} 3 & 5 & -4 \\ 6 & -3 & -5 \\ -2 & 2 & 1 \end{vmatrix}$'
      - section: 'Solution'
        say: 'Solution. We expand along the first row. Each entry of the first row, 3, 5 and negative 4, is multiplied by its minor.'
        write: 'Solution: expand along the first row'
        doodle_do:
          - {id: grid, op: circle, part: toprow, 'on': 'first row'}
      - say: 'Each entry takes a sign from this pattern. Along the first row the signs are plus, minus, plus. The middle sign is minus.'
        write: 'Signs: $\begin{matrix} + & - & + \\ - & + & - \\ + & - & + \end{matrix}$'
      - say: 'The minor of an entry is the 2 by 2 determinant left when we cover that entry''s row and column. A 2 by 2 determinant is $ad$ minus $bc$.'
        write: '$\begin{vmatrix} a & b \\ c & d \end{vmatrix} = ad - bc$'
      - section: 'First term: + 3'
        say: 'Cover the row and column of the 3. What is left is negative 3, negative 5, 2, 1. Put every entry in brackets.'
        write: '$+3\begin{vmatrix} -3 & -5 \\ 2 & 1 \end{vmatrix} = 3[(-3)(1) - (-5)(2)]$'
        doodle_do:
          - {id: grid, op: stage, stage: 'custom:2002_q36_a2', 'on': 'Cover'}
          - {id: grid, op: highlight, part: cross, 'on': 'brackets'}
        point:
          - {line: 4, kind: arrow, at: '(−3)(1)', from: {line: 3, at: 'ad'}, text: 'ad − bc'}
      - say: 'Negative 3 times 1 is negative 3. Negative 5 times 2 is negative 10, and minus negative 10 is plus 10. Negative 3 plus 10 is 7.'
        write: '$= 3(-3 + 10) = 3(7) = 21$'
        doodle_do:
          - {id: grid, op: label, part: minor, text: 'minor = 7'}
        point:
          - {line: 5, kind: highlight, at: '3(7)', to: {doodle: grid, part: minor}}
      - section: 'Second term: − 5'
        say: 'Now the 5, with a minus sign. Cover its row and column, and 6, negative 5, negative 2, 1 are left.'
        write: '$-5\begin{vmatrix} 6 & -5 \\ -2 & 1 \end{vmatrix} = -5[(6)(1) - (-5)(-2)]$'
      - say: '6 times 1 is 6. Negative 5 times negative 2 is 10. 6 minus 10 is negative 4, and minus 5 times negative 4 is plus 20.'
        write: '$= -5(6 - 10) = -5(-4) = 20$'
      - section: 'Third term: + (−4)'
        say: 'Last comes the negative 4, with a plus sign. Cover its row and column, and 6, negative 3, negative 2, 2 are left.'
        write: '$+(-4)\begin{vmatrix} 6 & -3 \\ -2 & 2 \end{vmatrix} = -4[(6)(2) - (-3)(-2)]$'
      - say: '6 times 2 is 12. Negative 3 times negative 2 is 6. 12 minus 6 is 6, and negative 4 times 6 is negative 24.'
        write: '$= -4(12 - 6) = -4(6) = -24$'
      - section: 'Add the three terms'
        say: 'The determinant is the sum of the three terms, so 21, plus 20, plus negative 24.'
        write: '$|N| = 21 + 20 - 24$'
        point:
          - {line: 10, kind: move, from: {line: 5, at: '= 21'}, at: '= [[21]] +', text: '1st'}
          - {line: 10, kind: move, from: {line: 7, at: '= 20'}, at: '+ 20', text: '2nd'}
          - {line: 10, kind: move, from: {line: 9, at: '= −24'}, at: '− 24', text: '3rd'}
      - say: '21 plus 20 is 41, and 41 minus 24 is 17.'
        write: '$\therefore\ |N| = 17$'
      - section: 'Check'
        say: 'Check by expanding along the third row instead, which is negative 2, 2, 1, with signs plus, minus, plus. The three terms are 74, negative 18 and negative 39.'
        write: 'Check (3rd row): $-2(-37) - 2(9) + 1(-39) = 74 - 18 - 39 = 17\ \checkmark$'
      - say: 'Therefore the determinant of $N$ is 17, which is answer choice D.'
        write: '$\therefore\ |N| = 17$'
        answer: true
    traps:
      A: 'You went for 91. Work the three terms with the signs plus, minus, plus. 3 times 7 is 21, minus 5 times negative 4 is 20, and negative 4 times 6 is negative 24. They add to 17.'
      B: 'You went for 65. That is 21 plus 20 plus 24, with the third term taken as plus 24. The entry is negative 4, so its term is negative 4 times 6, which is negative 24, and the total is 17.'
      C: 'You went for 23. That comes from dropping the minus sign on the middle term. 21 minus 20 minus 24 is negative 23. The middle term is minus 5 times negative 4, which is plus 20.'
  37:
    moments:
      - section: 'The question'
        say: 'The edge of the shaded region is the line $px + qy = 4$. Two points on it give two equations, and those give $p$ and $q$.'
        write: '$px + qy < 4$'
      - say: 'Solution. The boundary line is where the two sides are equal.'
        write: 'Solution: boundary $\ px + qy = 4$'
        point:
          - {figure: 0, kind: highlight, target: AB, text: 'boundary line'}
      - say: 'From the graph, the line cuts the $x$-axis at minus 4 and the $y$-axis at 2.'
        write: 'Intercepts: $\ (-4,\ 0)$ and $(0,\ 2)$'
        point:
          - {figure: 0, kind: circle, target: '(−4, 0)'}
          - {figure: 0, kind: circle, target: '(0, 2)', text: 'on the line'}
      - section: 'Find p'
        say: 'Substitute the first point, where $x$ is minus 4 and $y$ is 0. $q$ times 0 is 0.'
        write: 'At $(-4,\ 0)$: $\ p(-4) + q(0) = 4 \Rightarrow -4p = 4$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '(−4, 0)'}, at: '(−4, 0)', text: 'point 1'}
      - say: 'Divide both sides by minus 4. 4 over minus 4 is minus 1.'
        write: '$\therefore\ p = \dfrac{4}{-4} = -1$'
      - section: 'Find q'
        say: 'Substitute the second point, where $x$ is 0 and $y$ is 2. $p$ times 0 is 0.'
        write: 'At $(0,\ 2)$: $\ p(0) + q(2) = 4 \Rightarrow 2q = 4$'
        point:
          - {line: 5, kind: move, from: {line: 2, at: '(0, 2)'}, at: '(0, 2)', text: 'point 2'}
      - say: 'Divide both sides by 2. 4 over 2 is 2.'
        write: '$\therefore\ q = 2$'
      - section: 'Check'
        say: 'So the inequality is minus $x$ plus $2y$ less than 4. Test the origin, which is shaded, and 0 is less than 4. It fits.'
        write: 'Check $(0,\ 0)$: $\ -0 + 2(0) = 0 < 4\ \checkmark$'
        point:
          - {figure: 0, kind: circle, target: {x: 215, y: 130}, text: 'origin'}
      - say: 'So $p$ is minus 1 and $q$ is 2, which is option C.'
        write: '$p = -1,\quad q = 2$'
        answer: true
    traps:
      A: 'You went for $p = 1$, $q = 2$. That line would cut the $x$-axis at positive 4. On the graph it cuts at minus 4, so $-4p = 4$ and $p$ is minus 1.'
      B: 'You went for $p = 2$, $q = 1$. That line cuts the axes at 2 and 4. The graph''s line cuts the $x$-axis at minus 4 and the $y$-axis at 2.'
      D: 'You went for $p = 2$, $q = -1$. That line cuts the axes at 2 and minus 4, the wrong way round. Substitute the points. The point $(-4, 0)$ gives $p = -1$, and $(0, 2)$ gives $q = 2$.'
  38:
    moments:
      - section: 'The question'
        say: 'We want the inverse of the function $f(x) = 3x + 4$. The inverse undoes $f$, so it takes the output back to the input.'
        write: '$f(x) = 3x + 4$'
        doodle: {name: 'custom:2002_q38_a', id: machine, caption: 'f, and its inverse run backwards'}
      - section: 'Solution'
        say: 'Solution. Let $y$ equal $f(x)$, then make $x$ the subject.'
        write: 'Solution: Let $y = 3x + 4$'
      - say: 'Subtract 4 from both sides.'
        write: '$y - 4 = 3x$'
      - say: 'Divide both sides by 3.'
        write: '$x = \dfrac{y - 4}{3}$'
        doodle_do:
          - {id: machine, op: stage, stage: 'custom:2002_q38_a2', 'on': 'Divide'}
      - say: 'So $f$ inverse takes $y$ to $y - 4$ over 3. The inverse is written as a function of $x$, so replace $y$ with $x$.'
        write: '$f^{-1}(x) = \dfrac{x - 4}{3}$'
      - say: 'Dividing by 3 is the same as multiplying by 1 over 3.'
        write: '$\therefore\ f^{-1}(x) = \tfrac{1}{3}(x - 4)$'
      - section: 'Check'
        say: 'Check with a number. $f$ of 2 is 3 times 2 plus 4, which is 10.'
        write: 'Check: $f(2) = 3(2) + 4 = 10$'
        doodle_do:
          - {id: machine, op: label, part: fwd, text: '2 → 10'}
      - say: 'The inverse should bring 10 back to 2. 10 minus 4 is 6, and 6 over 3 is 2. It does.'
        write: '$f^{-1}(10) = \tfrac{1}{3}(10 - 4) = \tfrac{6}{3} = 2\ \checkmark$'
        doodle_do:
          - {id: machine, op: label, part: back, text: '10 → 2'}
      - say: 'Therefore the inverse is 1 over 3 times, $x$ minus 4, which is answer choice D.'
        write: '$\therefore\ f^{-1}(x) = \tfrac{1}{3}(x - 4)$'
        answer: true
    traps:
      A: 'You went for 1 over 3 times, $x$ plus 4. The function adds 4, so the inverse must subtract 4. From $y = 3x + 4$, subtract 4 from both sides first.'
      B: 'You went for 1 over 4 times, $x$ plus 3. That swaps the 3 and the 4. Making $x$ the subject of $y = 3x + 4$ means subtracting 4, then dividing by 3.'
      C: 'You went for 1 over 5 times, $x$ minus 5. To make $x$ the subject of $y = 3x + 4$, subtract 4, then divide by 3. That gives 1 over 3 times, $x$ minus 4.'
  39:
    moments:
      - section: 'The question'
        say: 'This is a cubic equation, so the curve can cross the axis up to three times. Four terms with no common factor is the signal to factorise by grouping.'
        write: '$x^{3} - 5x^{2} - x + 5 = 0$'
        doodle: {name: 'custom:2002_q39_a', id: curve, caption: 'where does it cross?'}
      - section: 'Solution'
        say: 'Solution. Group in pairs. From the first pair take out $x$ squared, leaving $x$ minus 5. From the second pair take out minus 1, leaving $x$ minus 5 again.'
        write: '$x^{2}(x - 5) - 1(x - 5) = 0$'
      - say: 'The two brackets match, so the grouping is right. Take out the common bracket, $x$ minus 5. What is left is $x$ squared minus 1.'
        write: '$(x - 5)(x^{2} - 1) = 0$'
        point:
          - {line: 1, kind: underline, at: '[[(x − 5)]] − 1', text: 'common bracket'}
          - {line: 1, kind: underline, at: '− 1[[(x − 5)]]'}
      - section: 'Difference of two squares'
        say: '$x$ squared minus 1 is $x$ squared minus 1 squared, a difference of two squares. So it factorises as $x$ minus 1, times $x$ plus 1.'
        write: '$x^{2} - 1 = x^{2} - 1^{2} = (x - 1)(x + 1)$'
      - say: 'Put that in place of $x$ squared minus 1. Now we have three brackets.'
        write: '$(x - 5)(x - 1)(x + 1) = 0$'
        point:
          - {line: 4, kind: move, from: {line: 3, at: '= [[(x − 1)(x + 1)]]'}, at: '(x − 1)(x + 1)', text: 'from here'}
      - say: 'A product is zero only when one of its factors is zero. Watch the three crossings appear.'
        write: 'Either $x - 5 = 0$ or $x - 1 = 0$ or $x + 1 = 0$'
        doodle_do:
          - {id: curve, op: stage, stage: 'custom:2002_q39_a2', 'on': 'Watch'}
      - say: 'Add 5 to both sides of the first, add 1 to the second, and subtract 1 from the third. Notice that $x$ plus 1 gives minus 1.'
        write: '$\therefore x = 5$ or $x = 1$ or $x = -1$'
        doodle_do:
          - {id: curve, op: circle, part: r-neg, 'on': 'minus 1'}
      - section: 'Check'
        say: 'Check $x$ equals minus 1 in the equation, keeping minus 1 in brackets.'
        write: 'Check $x = -1$: $\ (-1)^{3} - 5(-1)^{2} - (-1) + 5$'
      - say: 'Minus 1 cubed is minus 1. 5 times 1 is 5. Minus minus 1 is plus 1. Minus 1 minus 5 plus 1 plus 5 is zero.'
        write: '$= -1 - 5 + 1 + 5 = 0$'
      - say: 'Therefore the solutions are 1, minus 1 or 5, which is answer choice D.'
        write: '$\therefore x = 1,\ -1$ or $5$'
        answer: true
    traps:
      A: 'You went for 1, 1 or 5. The factor $x$ squared minus 1 gives two different roots, 1 and minus 1, because minus 1 squared is also 1.'
      B: 'You went for minus 1, 1 or minus 5. The factor $x$ minus 5 gives $x = 5$, plus 5, because 5 minus 5 is zero.'
      C: 'You went for 1, 1 or minus 5. The factors are $x - 5$, $x - 1$ and $x + 1$, so the roots are 5, 1 and minus 1.'
  40:
    moments:
      - section: 'The question'
        say: 'We want $P^{2}$ minus $2P$ plus $4I$, where $I$ is the 2 by 2 unit matrix. Find each piece, then combine them entry by entry.'
        write: '$P = \begin{pmatrix} 2 & 1 \\ -3 & 0 \end{pmatrix}$'
        doodle: {name: 'custom:2002_q40_a', id: grid, caption: 'row of P meets column of P'}
      - section: 'Solution'
        say: 'Solution. $P^{2}$ means $P$ times $P$, not squaring each entry.'
        write: 'Solution: $P^{2} = \begin{pmatrix} 2 & 1 \\ -3 & 0 \end{pmatrix}\begin{pmatrix} 2 & 1 \\ -3 & 0 \end{pmatrix}$'
      - say: 'Multiply row by column, and write the products inside the matrix. Top left is the first row times the first column, so 2 times 2, plus 1 times negative 3.'
        write: '$= \begin{pmatrix} (2)(2) + (1)(-3) & (2)(1) + (1)(0) \\ (-3)(2) + (0)(-3) & (-3)(1) + (0)(0) \end{pmatrix}$'
        doodle_do:
          - {id: grid, op: circle, part: row1, 'on': 'first row'}
          - {id: grid, op: circle, part: col1, 'on': 'first column'}
          - {id: grid, op: label, part: res-tl, text: '1', 'on': 'negative 3'}
      - say: 'Simplify each entry. 4 minus 3 is 1. 2 plus 0 is 2. Negative 6 plus 0 is negative 6. Negative 3 plus 0 is negative 3.'
        write: '$= \begin{pmatrix} 1 & 2 \\ -6 & -3 \end{pmatrix}$'
        doodle_do:
          - {id: grid, op: stage, stage: 'custom:2002_q40_a2', 'on': 'Simplify'}
      - say: 'Next, $2P$, so multiply every entry of $P$ by 2.'
        write: '$2P = \begin{pmatrix} 4 & 2 \\ -6 & 0 \end{pmatrix}$'
      - say: 'And $4I$. The unit matrix has 1s on the leading diagonal and 0s elsewhere, so $4I$ has 4s on the diagonal.'
        write: '$4I = 4\begin{pmatrix} 1 & 0 \\ 0 & 1 \end{pmatrix} = \begin{pmatrix} 4 & 0 \\ 0 & 4 \end{pmatrix}$'
      - say: 'Now put the three pieces into the expression.'
        write: '$P^{2} - 2P + 4I = \begin{pmatrix} 1 & 2 \\ -6 & -3 \end{pmatrix} - \begin{pmatrix} 4 & 2 \\ -6 & 0 \end{pmatrix} + \begin{pmatrix} 4 & 0 \\ 0 & 4 \end{pmatrix}$'
      - say: 'Combine them entry by entry, in the same positions.'
        write: '$= \begin{pmatrix} 1 - 4 + 4 & 2 - 2 + 0 \\ -6 + 6 + 0 & -3 - 0 + 4 \end{pmatrix}$'
      - say: 'Top left is 1 minus 4 plus 4, which is 1. Top right is 2 minus 2, which is 0. Bottom left is negative 6 plus 6, which is 0. Bottom right is negative 3 plus 4, which is 1.'
        write: '$\therefore\ P^{2} - 2P + 4I = \begin{pmatrix} 1 & 0 \\ 0 & 1 \end{pmatrix}$'
      - section: 'Check'
        say: 'Check the top left another way. $P^{2}$ minus $2P$ is $P$ times $P - 2I$. Row 1 of $P$ times column 1 of $P - 2I$ gives negative 3, and plus 4 is 1.'
        write: 'Check: $(2)(0) + (1)(-3) + 4 = 1\ \checkmark$'
      - say: 'Therefore the answer is the unit matrix, with 1s on the leading diagonal, which is answer choice B.'
        write: '$\therefore\ P^{2} - 2P + 4I = I$'
        answer: true
        doodle_do:
          - {id: grid, op: label, part: res, text: 'the answer is I'}
    traps:
      A: 'You went for the matrix 2, 1, 4, 1. Work out $P^{2}$ row by column. It is 1, 2, negative 6, negative 3. Then subtracting $2P$ and adding $4I$ gives the unit matrix.'
      C: 'You went for negative 3 on the leading diagonal. That is $P^{2}$ minus $2P$, with the $4I$ forgotten. Adding 4 to each diagonal entry makes each of them 1.'
      D: 'You went for 9, 4, 12, 1. $P^{2}$ must be found row by column, not by squaring each entry. Done properly, $P^{2}$ is 1, 2, negative 6, negative 3, and the whole expression comes to the unit matrix.'
  41:
    moments:
      - section: 'The question'
        say: 'We have two fractions, a subtraction and a negative at the end. That makes three places to slip. Let''s go line by line.'
        write: '$\dfrac{x+2}{4} - \dfrac{2x-3}{3} < 4$'
      - say: 'Solution. The denominators are 4 and 3, so the L.C.M. is 12. Multiply every term by 12. 12 is positive, so the sign stays.'
        write: 'Solution: multiply through by the L.C.M., 12'
      - say: '12 over 4 is 3, 12 over 3 is 4, and 12 times 4 is 48. Keep each top in a bracket.'
        write: '$3(x + 2) - 4(2x - 3) < 48$'
      - say: 'Open the brackets. 3 times $x$ plus 2 is $3x$ plus 6. Minus 4 times $2x$ is minus $8x$, and minus 4 times minus 3 is plus 12.'
        write: '$3x + 6 - 8x + 12 < 48$'
        point:
          - {line: 3, kind: circle, at: '+ 12', text: '−4 × −3'}
      - say: 'Collect like terms. $3x$ minus $8x$ is minus $5x$, and 6 plus 12 is 18.'
        write: '$-5x + 18 < 48$'
      - say: 'Subtract 18 from both sides. 48 minus 18 is 30.'
        write: '$-5x < 48 - 18 = 30$'
      - section: 'Divide by a negative'
        say: 'Now divide both sides by minus 5. It is negative, so less-than reverses to greater-than.'
        write: 'Divide by $-5$, reverse the sign: $\ x > \dfrac{30}{-5}$'
      - say: '30 divided by minus 5 is minus 6.'
        write: '$\therefore\ x > -6$'
      - section: 'The number line'
        say: 'On a number line, draw an open circle at minus 6, not included, and an arrow to the right.'
        diagram: {id: n, kind: numberline, range: [-9, 1]}
        diagram_do:
          - {id: n, op: interval, from: -6, from_open: true, text: 'x > −6', answer: true, 'on': 'open circle'}
      - section: 'Check'
        say: 'Check with $x$ equals 0, on the arrow. 2 over 4 is a half. Minus 3 over 3 is minus 1, and taking it away adds 1. A half plus 1 is 1.5, which is less than 4.'
        write: 'Check $x = 0$: $\ \dfrac{2}{4} - \dfrac{-3}{3} = \dfrac{1}{2} + 1 = 1.5 < 4\ \checkmark$'
      - say: 'So $x$ is greater than minus 6, which is option C.'
        write: '$x > -6$'
        answer: true
    traps:
      A: 'You went for $x > -3$. Clear the fractions with 12, and open the brackets carefully. Minus 4 times minus 3 is plus 12. That leads to $-5x < 30$, so $x > -6$.'
      B: 'You went for $x < 4$. Check the expanding, because $3(x + 2) - 4(2x - 3)$ is $-5x + 18$. Then $-5x < 30$, and dividing by minus 5 reverses the sign to give $x > -6$.'
      D: 'You went for $x < 8$. The inequality simplifies to $-5x < 30$. Dividing by minus 5 reverses the sign, giving $x > -6$.'
  42:
    moments:
      - section: 'The question'
        say: '$x$ varies directly as the square root of $n$, and $x$ is 9 when $n$ is 9. We want $x$ when $n$ is 1 and 7 over 9. That mixed number is the trap.'
        write: '$x = 9$ when $n = 9$; $\ x = ?$ when $n = 1\tfrac{7}{9}$'
      - say: 'Solution. The variation statement says $x$ is proportional to root $n$. Picture root $n$ as the side of a square of area $n$.'
        doodle: {name: 'custom:2002_q42_a', id: squares, caption: 'root n is a square''s side'}
        write: 'Solution: $\ x \propto \sqrt{n}$'
      - say: 'Replace the sign with the constant $k$.'
        write: '$\therefore\ x = k\sqrt{n}$'
      - section: 'Find k'
        say: 'Substitute the given pair, $x$ equals 9 and $n$ equals 9.'
        write: 'When $x = 9,\ n = 9$: $\ 9 = k\sqrt{9}$'
      - say: 'The square root of 9 is 3, so 9 equals 3 $k$.'
        write: '$9 = 3k$'
      - say: 'Divide both sides by 3, so $k$ is 3. This means $x$ is always three sides laid end to end.'
        doodle_do:
          - {id: squares, op: label, part: bar1, text: 'k = 3 sides'}
        write: '$\therefore\ k = \dfrac{9}{3} = 3$'
      - section: 'The equation'
        say: 'So the equation connecting $x$ and $n$ is $x$ equals 3 root $n$.'
        write: '$\therefore\ x = 3\sqrt{n}$'
        point:
          - {line: 6, kind: move, from: {line: 5, at: '39=[[3]]'}, at: 'x = [[3]]n', text: 'k'}
      - section: 'Find x'
        say: 'Change 1 and 7 over 9 to an improper fraction. 1 times 9 is 9, and 9 plus 7 is 16. So it is 16 over 9.'
        write: '$n = 1\tfrac{7}{9} = \dfrac{9 + 7}{9} = \dfrac{16}{9}$'
      - say: 'Here is the new, smaller square. Substitute $n$ equals 16 over 9 into the equation.'
        doodle_do:
          - {id: squares, op: stage, stage: 'custom:2002_q42_a2'}
        write: 'When $n = \dfrac{16}{9}$: $\ x = 3\sqrt{\dfrac{16}{9}}$'
      - say: 'Take the square root of the top and of the bottom. Root 16 is 4, and root 9 is 3.'
        write: '$= 3 \times \dfrac{\sqrt{16}}{\sqrt{9}} = 3 \times \dfrac{4}{3}$'
      - say: 'The 3s cancel, leaving 4, which is three sides of 4 over 3 each.'
        doodle_do:
          - {id: squares, op: label, part: bar2, text: 'x = 4'}
        write: '$\therefore\ x = 4$'
        point:
          - {line: 10, kind: highlight, at: '4', to: {doodle: squares, part: bar2}}
      - section: 'Check'
        say: 'To check, $n$ went from 9 down to 16 over 9, so root $n$ went from 3 to 4 over 3. $x$ shrinks by the same factor, so 9 times 4 over 9 is 4.'
        write: 'Check: $\ 9 \times \dfrac{4/3}{3} = 9 \times \dfrac{4}{9} = 4\ \checkmark$'
      - say: 'So $x$ is 4, which is option C.'
        write: '$x = 4$'
        answer: true
    traps:
      A: 'You went for 27. That uses 9 times 3. First find $k$: 9 equals $k$ times root 9, so $k$ is 3. Then $x$ is 3 times the root of 16 over 9, which is 4.'
      B: 'You went for root 17. Convert 1 and 7 over 9 carefully: it is 16 over 9, and its square root is 4 over 3. Then $x$ is 3 times 4 over 3, which is 4.'
      D: 'You went for root 3. The constant $k$ is 3, and the root of 16 over 9 is 4 over 3. So $x$ is 3 times 4 over 3, which is 4.'
  43:
    moments:
      - section: 'The question'
        say: 'We have one, plus 1 over 3, plus 1 over 9, and on for ever. Picture a ball bouncing to a third of its last height each time. Where does the total settle?'
        write: '$S_{\infty}$ of $1 + \tfrac{1}{3} + \tfrac{1}{9} + \tfrac{1}{27} + \ldots$'
        doodle: {name: 'custom:2002_q43_a', id: ball, caption: 'a third each bounce'}
      - section: 'Solution'
        say: 'Solution. Find the common ratio by dividing the second term by the first. 1 over 3 divided by 1 is 1 over 3.'
        write: 'Solution: $r = \dfrac{T_{2}}{T_{1}} = \dfrac{1}{3} \div 1 = \dfrac{1}{3}$'
        doodle_do:
          - {id: ball, op: label, part: bounce, text: '× 1/3 each time'}
      - say: 'Check it with the next pair. 1 over 9 divided by 1 over 3 is 1 over 9 times 3, which is 1 over 3. So it is a G.P.'
        write: '$\dfrac{T_{3}}{T_{2}} = \dfrac{1}{9} \times 3 = \dfrac{1}{3}$'
      - say: 'List what is given. The first term $a$ is 1, and $r$ is 1 over 3.'
        write: '$a = 1,\quad r = \dfrac{1}{3}$'
      - say: 'A sum to infinity exists only when $r$ is between negative 1 and 1, so the terms keep shrinking. 1 over 3 passes, just as each bounce is smaller than the last.'
        write: '$-1 < \dfrac{1}{3} < 1$'
      - say: 'The sum to infinity of a G.P. is $a$ over 1 minus $r$.'
        write: '$S_{\infty} = \dfrac{a}{1 - r}$'
      - say: 'Substitute $a$ equals 1 and $r$ equals 1 over 3.'
        write: '$S_{\infty} = \dfrac{1}{1 - \frac{1}{3}}$'
      - say: 'Work out the bottom. 1 is 3 over 3, and 3 over 3 minus 1 over 3 is 2 over 3.'
        write: '$= \dfrac{1}{\frac{2}{3}}$'
      - say: 'Dividing by 2 over 3 is the same as multiplying by its reciprocal, 3 over 2.'
        write: '$= 1 \times \dfrac{3}{2}$'
      - say: 'Therefore the sum to infinity is 3 over 2.'
        write: '$\therefore\ S_{\infty} = \dfrac{3}{2}$'
        doodle_do:
          - {id: ball, op: label, part: limit, text: '3/2'}
      - section: 'Check'
        say: 'To check, written over 27, the first four terms are 27, 9, 3 and 1. They add up to 40 over 27, about 1.48, which is already close to 1.5.'
        write: 'Check: $1 + \dfrac{1}{3} + \dfrac{1}{9} + \dfrac{1}{27} = \dfrac{40}{27} \approx 1.48$'
      - say: 'Therefore the sum to infinity is 3 over 2, which is answer choice A.'
        write: '$\therefore\ S_{\infty} = \dfrac{3}{2}$'
        answer: true
    traps:
      B: 'You went for 5 over 2. The formula is $a$ over 1 minus $r$, which gives 1 divided by 2 over 3, or 3 over 2. The sum can only be a little more than the first term, 1.'
      C: 'You went for 10 over 3. With $a$ equal to 1 and $r$ equal to 1 over 3, $S_{\infty}$ is 1 divided by 2 over 3, which is 3 over 2.'
      D: 'You went for 11 over 3. The sum is 1 over, 1 minus 1 over 3, which is 1 divided by 2 over 3, so 3 over 2. The first four terms already give about 1.48, and the rest add very little.'
  44:
    moments:
      - section: 'The question'
        say: 'Make $r$ the subject, which means get $r$ alone on one side. The catch is that $r$ appears in two places, so at some point we must factorise it out.'
        write: 'Make $r$ the subject: $\ \dfrac{x}{r + a} = \dfrac{a}{r}$'
        doodle: {name: 'custom:2002_q44_a', id: fracs, caption: 'two fractions'}
      - section: 'Solution'
        say: 'Solution. One fraction equals another, so cross multiply, and $x$ times $r$ equals $a$ times $r$ plus $a$, along the two crossing lines.'
        write: 'Cross multiply: $\ xr = a(r + a)$'
        doodle_do:
          - {id: fracs, op: highlight, part: cross, 'on': 'crossing lines'}
          - {id: fracs, op: stage, stage: 'custom:2002_q44_a2', 'on': 'crossing lines'}
      - say: 'Open the bracket. $a$ times $r$ is $ar$, and $a$ times $a$ is $a$ squared.'
        write: 'Open the bracket: $\ xr = ar + a^{2}$'
      - say: 'Collect the terms in $r$ on the left. Subtract $ar$ from both sides.'
        write: 'Subtract $ar$: $\ xr - ar = a^{2}$'
        point:
          - {line: 3, kind: move, from: {line: 2, at: '= [[ar]]'}, at: '− ar', text: 'subtract ar'}
      - say: 'Both terms on the left contain $r$, so factorise out $r$. That leaves $x$ minus $a$ in the bracket.'
        write: 'Factorise out $r$: $\ r(x - a) = a^{2}$'
        doodle_do:
          - {id: fracs, op: label, part: result, text: 'r(x − a) = a²'}
        point:
          - {line: 4, kind: move, from: {line: 3, at: 'x[[r]]'}, at: '[[r]](x', text: 'r out'}
      - say: 'Divide both sides by $x$ minus $a$. Now $r$ stands alone.'
        write: 'Divide by $(x - a)$: $\ r = \dfrac{a^{2}}{x - a}$'
      - section: 'Check'
        say: 'Check with numbers. Take $a$ as 2 and $x$ as 6. The formula gives $r$ as 2 squared over 6 minus 2, which is 4 over 4, so 1.'
        write: 'Check $a = 2,\ x = 6$: $\ r = \dfrac{2^{2}}{6 - 2} = 1$'
      - say: 'In the question, the left is 6 over 1 plus 2, which is 2. The right is 2 over 1, which is also 2. They agree.'
        write: '$\dfrac{6}{1 + 2} = 2$ and $\dfrac{2}{1} = 2$'
      - say: 'Therefore $r$ equals $a$ squared over $x$ minus $a$, which is answer choice C.'
        write: '$\therefore r = \dfrac{a^{2}}{x - a}$'
        answer: true
    traps:
      A: 'You went for $a$ over $x$ minus $a$. The bottom is right, but when you open the bracket, $a$ times $a$ is $a$ squared, not $a$.'
      B: 'You went for $a$ over $x$ plus $a$. There are two slips. $a$ times $a$ is $a$ squared, and subtracting $ar$ from both sides leaves $x$ minus $a$ in the bracket.'
      D: 'You went for $a$ squared over $x$ plus $a$. The top is right, but $ar$ is subtracted from both sides, so the bracket is $x$ minus $a$.'
  45:
    moments:
      - section: 'The question'
        say: 'We want $\dfrac{dy}{dx}$, so we differentiate $y$ with respect to $x$. The power rule works on powers of $x$, so first write 1 over $x$ as a power.'
        write: '$y = x^{2} - \dfrac{1}{x}$'
      - section: 'Solution'
        say: 'Solution. 1 over $x$ is $x$ to the power negative 1.'
        write: 'Solution: $y = x^{2} - x^{-1}$'
      - say: 'The rule says if $y$ is $x$ to the $n$, then $\dfrac{dy}{dx}$ is $n$ times $x$ to the $n$ minus 1. Multiply by the power, then reduce the power by 1.'
        write: 'If $y = x^{n},\ \dfrac{dy}{dx} = nx^{n - 1}$'
        doodle: {name: 'custom:2002_q45_a', id: power, caption: 'the power comes down in front'}
      - say: 'Differentiate term by term. For $x^{2}$, bring down the 2. For minus $x^{-1}$, keep the minus and bring down the negative 1. Each power drops by 1.'
        write: '$\dfrac{dy}{dx} = 2x^{2 - 1} - (-1)x^{-1 - 1}$'
        doodle_do:
          - {id: power, op: circle, part: row1, 'on': 'bring down the 2'}
          - {id: power, op: circle, part: row2, 'on': 'keep the minus'}
      - say: '2 minus 1 is 1, and negative 1 minus 1 is negative 2.'
        write: '$= 2x - (-1)x^{-2}$'
      - say: 'Minus negative 1 is plus 1. The two minus signs, one from the term and one from the power, make a plus.'
        write: '$= 2x + x^{-2}$'
        doodle_do:
          - {id: power, op: stage, stage: 'custom:2002_q45_a2', 'on': 'make a plus'}
      - say: '$x$ to the negative 2 is 1 over $x$ squared.'
        write: '$\therefore\ \dfrac{dy}{dx} = 2x + \dfrac{1}{x^{2}}$'
      - section: 'Check'
        say: 'Check the sign of the second term. As $x$ grows, 1 over $x$ gets smaller, so negative 1 over $x$ gets bigger. A rising term has a positive gradient, and 1 over $x$ squared is positive.'
        write: 'Check: $-\dfrac{1}{x}$ increases, so its gradient $\dfrac{1}{x^{2}} > 0\ \checkmark$'
      - say: 'Therefore $\dfrac{dy}{dx}$ is $2x$ plus 1 over $x$ squared, which is answer choice C.'
        write: '$\therefore\ \dfrac{dy}{dx} = 2x + \dfrac{1}{x^{2}}$'
        answer: true
    traps:
      A: 'You went for $2x$ plus $x^{2}$. The second term is $x$ to the negative 2, which is 1 over $x$ squared, not $x$ squared.'
      B: 'You went for $2x$ minus $x^{2}$. Write 1 over $x$ as $x^{-1}$. Differentiating gives $x^{-2}$, which is 1 over $x$ squared, and the sign is plus.'
      D: 'You went for $2x$ minus 1 over $x$ squared. The two minus signs, one in front of the term and one from the power, make a plus.'
  46:
    moments:
      - section: 'The question'
        say: 'We want the integral of sin $3x$. The angle is $3x$, not $x$, so we substitute for it first.'
        write: '$\displaystyle\int \sin 3x\,dx$'
      - section: 'Solution'
        say: 'Solution. Let $u$ be the inside, $3x$.'
        write: 'Solution: Let $u = 3x$'
      - say: 'Differentiate, and $du$ by $dx$ is 3. So $dx$ is $du$ over 3.'
        write: '$\dfrac{du}{dx} = 3 \Rightarrow dx = \dfrac{du}{3}$'
      - say: 'Replace $3x$ with $u$, and $dx$ with $du$ over 3.'
        write: '$\displaystyle\int \sin 3x\,dx = \int \sin u \times \dfrac{du}{3}$'
      - say: 'The 1 over 3 is a constant, so bring it outside the integral sign.'
        write: '$= \dfrac{1}{3}\displaystyle\int \sin u\,du$'
      - say: 'This is a standard integral. The integral of sin $u$ is minus cos $u$, plus $c$, the constant of integration.'
        write: '$\displaystyle\int \sin u\,du = -\cos u + c$'
      - say: 'So we get 1 over 3, times minus cos $u$, plus $c$.'
        write: '$= -\dfrac{1}{3}\cos u + c$'
      - say: 'Substitute back, because $u$ is $3x$.'
        write: '$= -\dfrac{1}{3}\cos 3x + c$'
      - section: 'Check'
        say: 'To check, remember integration is the reverse of differentiation. Differentiate the answer. Cos $3x$ gives minus sin $3x$, times 3 by the chain rule.'
        write: 'Check: $\dfrac{d}{dx}\left(-\dfrac{1}{3}\cos 3x + c\right) = -\dfrac{1}{3}(-3\sin 3x) + 0$'
      - say: 'Minus 1 over 3 times minus 3 is plus 1. We get back sin $3x$.'
        write: '$= \sin 3x\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore the integral of sin $3x$ is minus 1 over 3 cos $3x$, plus $c$, which is answer choice B.'
        write: '$\therefore \displaystyle\int \sin 3x\,dx = -\dfrac{1}{3}\cos 3x + c$'
        answer: true
    traps:
      A: 'You went for minus 2 over 3 cos $3x$. With $u = 3x$, $dx$ is $du$ over 3, so the factor is 1 over 3, not 2 over 3.'
      C: 'You went for plus 1 over 3 cos $3x$. The 1 over 3 is right, but the integral of sin is minus cos. Differentiate it back to check the sign.'
      D: 'You went for plus 2 over 3 cos $3x$. Both the sign and the factor are off. The integral of sin $u$ is minus cos $u$, and $dx$ is $du$ over 3.'
  47:
    moments:
      - section: 'The question'
        say: 'The radius grows with time, so the area grows too, like a ripple spreading on a pond. We want the rate of increase of the area when the radius is 5 cm.'
        write: '$r = 5$ cm, $\ \dfrac{dr}{dt} = 0.2$ cm s$^{-1}$, $\ \dfrac{dA}{dt} = ?$'
        doodle: {name: 'custom:2002_q47_a', id: pond, caption: 'a ripple and a stopwatch'}
      - section: 'Solution'
        say: 'Solution. Let me draw the circle of radius 5 cm. Its area is pi $r$ squared.'
        write: '$A = \pi r^{2}$'
        show_sketch: true
        point:
          - {figure: sketch, kind: underline, target: 'A = πr²'}
      - say: 'Differentiate with respect to $r$. Multiply by the power 2, and reduce the power to 1. Unroll the thin new ring, and it is a strip as long as the circumference.'
        write: '$\dfrac{dA}{dr} = 2\pi r$'
        doodle_do:
          - {id: pond, op: stage, stage: 'custom:2002_q47_a2', on: Unroll}
      - section: 'Chain rule'
        say: 'The area depends on $r$, and $r$ depends on time. The chain rule links the rates, so $\dfrac{dA}{dt}$ equals $\dfrac{dA}{dr}$ times $\dfrac{dr}{dt}$.'
        'on': 'chain rule'
        write: '$\dfrac{dA}{dt} = \dfrac{dA}{dr} \times \dfrac{dr}{dt}$'
      - say: 'Replace $\dfrac{dA}{dr}$ with the $2\pi r$ we just found.'
        write: '$= 2\pi r \times \dfrac{dr}{dt}$'
        point:
          - {line: 4, kind: move, from: {line: 2, at: '2πr'}, at: '2πr', text: 'dA/dr'}
      - say: 'Substitute $r$ equals 5 and $\dfrac{dr}{dt}$ equals 0.2.'
        write: '$= 2\pi(5)(0.2)$'
        doodle_do:
          - {id: pond, op: label, part: strip, text: '2π × 5 by 0.2'}
        point:
          - {figure: sketch, kind: circle, target: 'r = 5 cm'}
          - {figure: sketch, kind: arrow, target: '+0.2 cm/s', text: 'dr/dt'}
      - say: '5 times 0.2 is 1. So the area grows at 2 pi square centimetres per second.'
        write: '$= 2\pi(1) = 2\pi$ cm$^{2}$ s$^{-1}$'
        doodle_do:
          - {id: pond, op: highlight, part: strip}
        point:
          - {figure: sketch, kind: label, target: 'dA/dt = ?', text: '2π cm²/s'}
      - section: 'Check'
        say: 'To check, in 1 second the radius goes from 5 to 5.2. The area grows by pi times 5.2 squared minus 5 squared, which is 2.04 pi, very close to 2 pi.'
        write: 'Check: $\pi(5.2^{2} - 5^{2}) = \pi(27.04 - 25) = 2.04\pi \approx 2\pi\ \checkmark$'
      - say: 'Therefore the area increases at 2 pi square centimetres per second, which is answer choice C.'
        write: '$\therefore \dfrac{dA}{dt} = 2\pi$ cm$^{2}$ s$^{-1}$'
        answer: true
    traps:
      A: 'You went for 5 pi. That is the area, 25 pi, times 0.2. We need $\dfrac{dA}{dr} = 2\pi r$, times $\dfrac{dr}{dt}$, which is 2 pi times 5 times 0.2.'
      B: 'You went for 4 pi. Check the multiplication. 5 times 0.2 is 1, and 2 pi times 1 is 2 pi.'
      D: 'You went for pi. That misses the power 2 brought down when differentiating $r^{2}$. The derivative of $\pi r^{2}$ is $2\pi r$.'
  48:
    moments:
      - section: 'The question'
        say: 'We are given $dy/dx$ equals $2x - 3$, and $y$ is 3 when $x$ is 0. We want $y$ in terms of $x$.'
        write: 'Solution: $\dfrac{dy}{dx} = 2x - 3$; $\ y = 3$ when $x = 0$'
      - section: 'Integrate'
        say: 'Integration is the reverse of differentiation. To go from $dy/dx$ back to $y$, we integrate with respect to $x$.'
        write: '$y = \displaystyle\int (2x - 3)\,dx$'
      - say: 'The rule is to add one to the power and divide by the new power, and always add $c$, the constant of integration.'
        write: '$\displaystyle\int x^{n}\,dx = \dfrac{x^{n+1}}{n+1} + c$'
      - say: 'Go term by term. For $2x$, the power goes from 1 to 2, and we divide by 2. Negative 3 becomes negative $3x$. Then plus $c$.'
        write: '$y = \dfrac{2x^{2}}{2} - 3x + c$'
        point:
          - {line: 3, kind: underline, at: '22x2', text: 'new power 2'}
      - say: '2 over 2 is 1. Every curve $x^{2} - 3x + c$ has this gradient, since a constant differentiates to zero, so we get the whole family in the picture.'
        write: '$y = x^{2} - 3x + c$'
        doodle: {name: 'custom:2002_q48_a', id: family, caption: 'same gradient, many curves'}
        doodle_do:
          - {id: family, op: circle, part: family}
      - section: 'Find c'
        say: 'To find which curve, use $y = 3$ when $x = 0$. Substitute both into the equation.'
        write: 'When $x = 0,\ y = 3$: $\ 3 = 0^{2} - 3(0) + c$'
        point:
          - {line: 5, kind: arrow, from: {line: 4, at: 'x2 − 3x + c'}, at: '02 − 3(0) + c', text: 'substitute'}
        doodle_do:
          - {id: family, op: stage, stage: 'custom:2002_q48_a2'}
      - say: '0 squared is 0, and 3 times 0 is 0.'
        write: '$3 = 0 - 0 + c$'
      - say: 'So $c$ is 3, and it is the curve through the dot.'
        write: '$c = 3$'
        doodle_do:
          - {id: family, op: label, part: chosen, text: 'c = 3'}
        point:
          - {line: 7, kind: highlight, at: 'c = 3', to: {doodle: family, part: chosen}}
      - section: 'Check'
        say: 'Check both facts. Differentiate $x^{2} - 3x + 3$, and we get $2x - 3$, as given. And at $x = 0$, $y$ is 0 minus 0 plus 3, which is 3.'
        write: 'Check: $\dfrac{dy}{dx} = 2x - 3\ \checkmark$; $\ 0 - 0 + 3 = 3\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore $y = x^{2} - 3x + 3$, which is option B.'
        write: '$\therefore y = x^{2} - 3x + 3$'
        point:
          - {line: 9, kind: move, from: {line: 7, at: '3'}, at: '+ 3', text: 'c'}
        answer: true
    traps:
      A: 'You went for $x^{2} - 3x$. That leaves out the constant of integration. Since $y$ is 3 when $x$ is 0, the constant must be 3.'
      C: 'You went for $2x^{2} - 3x$. When you integrate $2x$, you divide by the new power, 2, so it becomes $x^{2}$. And the constant 3 is missing.'
      D: 'You went for $x^{2} - 3x - 3$. Substitute $x = 0$, and $y$ would be negative 3, but we are told $y$ is 3. So the constant is plus 3.'
  49:
    moments:
      - section: 'The question'
        say: 'Sine squared of $5x$ means sine $5x$, all squared. There are layers, like boxes inside boxes, with a square outside, a sine in the middle, and $5x$ inside.'
        write: '$y = \sin^{2}(5x) = \left(\sin 5x\right)^{2}$'
        doodle: {name: 'custom:2002_q49_a', id: layers, caption: 'boxes inside boxes'}
      - section: 'Solution'
        say: 'Solution. This is a function of a function, so we use the chain rule. Let $u$ be the inside, sine $5x$. Then $y$ is $u$ squared.'
        'on': 'function of a function'
        write: 'Let $u = \sin 5x$, $\ \therefore y = u^{2}$'
      - say: 'Differentiate the outer layer, so $u$ squared gives $2u$.'
        write: '$\dfrac{dy}{du} = 2u$'
        doodle_do:
          - {id: layers, op: highlight, part: outer}
      - say: 'Now $u$. The standard derivative of sine $ax$ is $a$ cos $ax$. So sine $5x$ gives 5 cos $5x$.'
        write: '$\dfrac{du}{dx} = 5\cos 5x$'
        doodle_do:
          - {id: layers, op: highlight, part: middle}
          - {id: layers, op: label, part: inner, text: '× 5'}
      - say: 'The chain rule says $\dfrac{dy}{dx}$ equals $\dfrac{dy}{du}$ times $\dfrac{du}{dx}$.'
        'on': 'chain rule'
        write: '$\dfrac{dy}{dx} = \dfrac{dy}{du} \times \dfrac{du}{dx}$'
      - say: 'Substitute to get $2u$ times 5 cos $5x$.'
        write: '$= 2u \times 5\cos 5x$'
      - say: 'Put back $u$ equals sine $5x$. We must not leave $u$ in the answer.'
        write: '$= 2\sin 5x \times 5\cos 5x$'
      - say: '2 times 5 is 10.'
        write: '$= 10\sin 5x\cos 5x$'
      - section: 'Check'
        say: 'Check by another route. Sine squared $5x$ is a half minus a half cos $10x$. Differentiating gives a half times 10 sine $10x$, which is 5 sine $10x$.'
        write: 'Check: $\dfrac{d}{dx}\left(\tfrac{1}{2} - \tfrac{1}{2}\cos 10x\right) = 5\sin 10x$'
      - say: 'And 10 sine $5x$ cos $5x$ is 5 times 2 sine $5x$ cos $5x$, which is 5 sine $10x$. They agree.'
        write: '$10\sin 5x\cos 5x = 5(2\sin 5x\cos 5x) = 5\sin 10x\ \checkmark$'
      - say: 'Therefore the derivative is 10 sine $5x$ cos $5x$, which is answer choice C.'
        write: '$\therefore \dfrac{dy}{dx} = 10\sin 5x\cos 5x$'
        answer: true
    traps:
      A: 'You went for $2\sin 5x\cos 5x$. That misses the inner layer. Sine $5x$ differentiates to 5 cos $5x$, so multiply by 5 as well.'
      B: 'You went for $5\sin 5x\cos 5x$. That drops the 2 from the square. For $y = u^{2}$, $\dfrac{dy}{du}$ is $2u$.'
      D: 'You went for $15\sin 5x\cos 5x$. The factors are 2 from the square and 5 from the inside, and they multiply, so 2 times 5 is 10, not 15.'
  50:
    moments:
      - section: 'The question'
        say: 'A tangent is the straight line that just touches the curve at one point. Let me draw the curve and mark the point 1, 6.'
        write: '$y = 3x^{2} - 2x + 5$, at $(1, 6)$'
        diagram:
          id: g
          kind: graph
          x: [-1.5, 2.5]
          y: [-2, 20]
          y_step: 4
          plots:
            - {fn: '3x^2 - 2x + 5', label: 'y = 3x² − 2x + 5', colour: blue}
          points:
            - {x: 1, y: 6, text: 'P (1, 6)'}
      - section: 'Solution'
        say: 'Solution. The tangent has the same slope as the curve at the point where it touches. And the slope of the curve is $\dfrac{dy}{dx}$.'
        write: 'Slope of tangent $= \dfrac{dy}{dx}$ at the point'
      - say: 'The power rule says multiply by the power, then reduce the power by 1.'
        'on': 'power rule'
        write: 'If $y = ax^{n}$, $\ \dfrac{dy}{dx} = nax^{n-1}$'
      - say: 'Term by term. $3x$ squared gives 2 times 3, power 1. Minus $2x$ gives minus 2. The constant 5 gives 0.'
        write: '$\dfrac{dy}{dx} = 2(3)x^{2-1} - 2 + 0$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
      - say: '2 times 3 is 6.'
        write: '$= 6x - 2$'
      - section: 'At the point'
        say: 'At the point 1, 6, $x$ is 1. Substitute $x$ equals 1 into $\dfrac{dy}{dx}$, not into $y$.'
        write: 'At $x = 1$: $\ \dfrac{dy}{dx} = 6(1) - 2$'
      - say: '6 times 1 is 6, and 6 minus 2 is 4. So the tangent at P has slope 4. I''ll draw it.'
        write: '$= 6 - 2 = 4$'
        diagram_do:
          - {id: g, op: line, m: 4, c: 2, label: 'tangent, slope 4', colour: green, on: 'draw it'}
      - section: 'Check'
        say: 'Check that P is on the curve. 3 times 1 squared, minus 2 times 1, plus 5, is 3 minus 2 plus 5, which is 6.'
        write: 'Check: $3(1)^{2} - 2(1) + 5 = 3 - 2 + 5 = 6\ \checkmark$'
      - say: 'Therefore the slope of the tangent at 1, 6 is 4, which is answer choice B.'
        write: '$\therefore$ slope of tangent $= 4$'
        answer: true
    traps:
      A: 'You went for 1. Differentiate first to get $\dfrac{dy}{dx} = 6x - 2$. At $x = 1$, that is 6 minus 2, which is 4.'
      C: 'You went for 5. The constant 5 differentiates to 0, so it plays no part in the slope. $\dfrac{dy}{dx} = 6x - 2$, which is 4 at $x = 1$.'
      D: 'You went for 61. The slope comes from $\dfrac{dy}{dx} = 6x - 2$, not from $y$ itself. At $x = 1$ it is 4.'
