  46:
    moments:
      - section: 'The question'
        say: 'A fair die is tossed 120 times. The frequencies are 12, 20, $x$, 21, $x$ minus 1 and 28. Find $x$. The two unknown cells are different.'
        write: 'Die tossed 120 times: find $x$'
      - say: 'Solution. Copy the table. Every toss gives exactly one number, so the frequencies add up to the 120 tosses: sigma $f$ is 120.'
        write: 'Solution: $\Sigma f = 120$'
        diagram:
          id: f
          kind: table
          'on': 'Copy the table'
          columns: ['Number', 'Frequency (f)']
          rows: [[1, 12], [2, 20], [3, 'x'], [4, 21], [5, 'x − 1'], [6, 28]]
      - section: 'The equation'
        say: 'Write the sum with all six frequencies. Keep $x$ minus 1 in a bracket.'
        write: '$12 + 20 + x + 21 + (x - 1) + 28 = 120$'
        diagram_do:
          - {id: f, op: highlight, part: 'cell:3,2'}
          - {id: f, op: highlight, part: 'cell:5,2'}
      - say: 'Add the numbers: 12 plus 20 is 32, plus 21 is 53, plus 28 is 81. Then minus 1 is 80. And $x$ plus $x$ is 2 $x$.'
        write: '$80 + 2x = 120$'
      - say: 'Subtract 80 from both sides. 120 minus 80 is 40.'
        write: '$2x = 120 - 80 = 40$'
      - say: 'Divide both sides by 2. 40 divided by 2 is 20.'
        write: '$\therefore x = \dfrac{40}{2} = 20$'
      - section: 'Check'
        say: 'Check. Put 20 in the table: $x$ is 20, and $x$ minus 1 is 19.'
        write: 'Check: $x = 20$, $\ x - 1 = 19$'
        diagram_do:
          - {id: f, op: fill, part: 'cell:3,2', text: '20'}
          - {id: f, op: fill, part: 'cell:5,2', text: '19'}
      - say: 'Now add the column: 12 plus 20 plus 20 plus 21 plus 19 plus 28 is 120, the number of tosses.'
        write: '$12 + 20 + 20 + 21 + 19 + 28 = 120\ \checkmark$'
        diagram_do:
          - {id: f, op: total, part: 'col:2', text: '120'}
      - section: 'Answer'
        say: 'Therefore $x$ is 20: option D.'
        write: '$x = 20$'
        answer: true
    traps:
      A: 'You went for 21. Check it in the table: with x equal to 21 the frequencies add to 122, not 120. 80 plus 2x equal to 120 gives x equal to 20.'
      B: 'You went for 19. That is the frequency of 5, which is x minus 1. The question wants x itself, which is 20.'
      C: 'You went for 22. With x equal to 22 the frequencies add to 124. Sigma f must be 120, which gives x equal to 20.'

  47:
    moments:
      - section: 'The question'
        say: 'n P 3 minus 6 times n C 4 is zero. Find $n$. Write the factorial formulas, and the factorials cancel.'
        write: '${}^{n}P_{3} - 6\left({}^{n}C_{4}\right) = 0$'
      - say: 'Solution. n P r is n factorial over n minus r factorial.'
        write: 'Solution: ${}^{n}P_{r} = \dfrac{n!}{(n - r)!}$'
      - say: 'n C r is n factorial over n minus r factorial, times r factorial.'
        write: '${}^{n}C_{r} = \dfrac{n!}{(n - r)!\,r!}$'
      - section: 'Substitute'
        say: 'Put r equal to 3 in the first, and r equal to 4 in the second.'
        write: '$\dfrac{n!}{(n - 3)!} - 6 \times \dfrac{n!}{(n - 4)!\,4!} = 0$'
      - say: 'Move the second term across the equals sign.'
        write: '$\dfrac{n!}{(n - 3)!} = \dfrac{6 \times n!}{(n - 4)!\,4!}$'
      - say: '4 factorial is 4 times 3 times 2 times 1, which is 24. And 6 over 24 is 1 over 4.'
        write: '$\dfrac{n!}{(n - 3)!} = \dfrac{n!}{4\,(n - 4)!}$'
      - section: 'Cancel the factorials'
        say: 'Divide both sides by n factorial.'
        write: '$\dfrac{1}{(n - 3)!} = \dfrac{1}{4\,(n - 4)!}$'
      - say: 'Cross-multiply.'
        write: '$(n - 3)! = 4\,(n - 4)!$'
      - say: 'Expand n minus 3 factorial down to n minus 4 factorial: it is n minus 3, times n minus 4 factorial.'
        write: '$(n - 3)(n - 4)! = 4\,(n - 4)!$'
        point:
          - {line: 7, kind: underline, at: '(n − 3)!'}
      - say: 'Divide both sides by n minus 4 factorial.'
        write: '$n - 3 = 4$'
      - say: 'Add 3 to both sides. 4 plus 3 is 7.'
        write: '$\therefore n = 7$'
      - section: 'Check'
        say: 'Check with $n$ equal to 7. 7 P 3 is 7 factorial over 4 factorial: 7 times 6 times 5, which is 210. Picture three places: 7 choices, then 6, then 5.'
        write: 'Check: ${}^{7}P_{3} = \dfrac{7!}{4!} = 7 \times 6 \times 5 = 210$'
        doodle: {name: 'custom:2003_q47_a', id: slots, caption: '7, then 6, then 5 choices'}
      - say: '7 C 4 is 7 factorial over 3 factorial times 4 factorial: 210 over 6, which is 35. And 6 times 35 is 210. The difference is zero.'
        write: '$6 \times {}^{7}C_{4} = 6 \times \dfrac{7!}{3!\,4!} = 6 \times 35 = 210\ \checkmark$'
      - section: 'Answer'
        say: 'Therefore $n$ is 7: option D.'
        write: '$n = 7$'
        answer: true
    traps:
      A: 'You went for 6. Check: 6 P 3 is 120, but 6 times 6 C 4 is 6 times 15, which is 90. They are not equal. Cancelling the factorials gives n minus 3 equal to 4, so n is 7.'
      B: 'You went for 5. Check: 5 P 3 is 60, but 6 times 5 C 4 is 6 times 5, which is 30. Solving properly gives n minus 3 equal to 4, so n is 7.'
      C: 'You went for 8. Check: 8 P 3 is 336, but 6 times 8 C 4 is 6 times 70, which is 420. The factor n minus 3 must equal 4, so n is 7.'

  48:
    moments:
      - section: 'The question'
        say: 'Two dice are thrown together. What is the probability that the sum is divisible by 3? The sums are not equally likely, so we count outcomes, not sums.'
        write: 'Two dice: $P(\text{sum divisible by } 3) = ?$'
        doodle: {name: 'custom:2003_q48_a', id: dice, caption: 'Is the sum divisible by 3?'}
      - say: 'Solution. Let $E$ be the event that the sum is divisible by 3.'
        write: 'Solution: let $E$ = sum divisible by 3'
      - section: 'The sample space'
        say: 'The sample space, $S$, is every way the two dice can land. Draw the outcome table: the first die down the side, the second across the top, and the sum in each cell.'
        diagram:
          id: s
          kind: table
          'on': 'outcome table'
          columns: ['+', '1', '2', '3', '4', '5', '6']
          rows: [[1, 2, 3, 4, 5, 6, 7], [2, 3, 4, 5, 6, 7, 8], [3, 4, 5, 6, 7, 8, 9], [4, 5, 6, 7, 8, 9, 10], [5, 6, 7, 8, 9, 10, 11], [6, 7, 8, 9, 10, 11, 12]]
      - say: 'Each die has 6 faces, so the table has 6 times 6 cells. n of $S$, the number of possible outcomes, is 36.'
        write: '$n(S) = 6 \times 6 = 36$'
      - section: 'The favourable outcomes'
        say: 'The sums run from 2 to 12. The ones divisible by 3 are 3, 6, 9 and 12.'
        write: 'Sums divisible by 3: $3,\ 6,\ 9,\ 12$'
      - say: 'Sum 3: 1 and 2, or 2 and 1. I ring both cells in the table: 2 outcomes.'
        write: 'Sum 3: $(1, 2),\ (2, 1) \to 2$'
        diagram_do:
          - {id: s, op: highlight, part: 'cell:1,3', 'on': 'ring'}
          - {id: s, op: highlight, part: 'cell:2,2'}
      - say: 'Sum 6 runs along a slanting line of the table: 1 and 5, 2 and 4, 3 and 3, 4 and 2, 5 and 1. That is 5 outcomes.'
        write: 'Sum 6: $(1, 5),\ (2, 4),\ (3, 3),\ (4, 2),\ (5, 1) \to 5$'
        diagram_do:
          - {id: s, op: highlight, part: 'cell:1,6'}
          - {id: s, op: highlight, part: 'cell:2,5'}
          - {id: s, op: highlight, part: 'cell:3,4'}
      - say: 'Ring the last two cells of that slanting line, 4 and 2, and 5 and 1.'
        diagram_do:
          - {id: s, op: highlight, part: 'cell:4,3'}
          - {id: s, op: highlight, part: 'cell:5,2'}
      - say: 'Sum 9, like the two dice in the picture: 3 and 6, 4 and 5, 5 and 4, 6 and 3. That is 4 outcomes.'
        write: 'Sum 9: $(3, 6),\ (4, 5),\ (5, 4),\ (6, 3) \to 4$'
        doodle_do:
          - {id: dice, op: circle, part: sum}
        diagram_do:
          - {id: s, op: highlight, part: 'cell:3,7'}
          - {id: s, op: highlight, part: 'cell:4,6'}
          - {id: s, op: highlight, part: 'cell:5,5'}
      - say: 'Ring 6 and 3 to finish the nines. Sum 12 comes only from 6 and 6: 1 outcome.'
        write: 'Sum 12: $(6, 6) \to 1$'
        diagram_do:
          - {id: s, op: highlight, part: 'cell:6,4'}
          - {id: s, op: highlight, part: 'cell:6,7', 'on': 'only from'}
      - say: 'Add the ringed cells. n of $E$ is 2 plus 5 plus 4 plus 1, which is 12.'
        write: '$n(E) = 2 + 5 + 4 + 1 = 12$'
      - section: 'The probability'
        say: 'The probability of $E$ is n of $E$ over n of $S$: the number of favourable outcomes over the total number of possible outcomes.'
        write: '$P(E) = \dfrac{n(E)}{n(S)}$'
      - say: 'Substitute: n of $E$ is 12 and n of $S$ is 36. So 12 over 36.'
        write: '$= \dfrac{12}{36}$'
        point:
          - {line: 12, kind: move, from: {line: 10, at: '= 12'}, at: '36[[12]]', text: 'n(E)'}
          - {line: 12, kind: move, from: {line: 3, at: '= 36'}, at: '[[36]]12', text: 'n(S)'}
      - say: 'Divide the top and the bottom by 12. 12 divided by 12 is 1, and 36 divided by 12 is 3.'
        write: '$= \dfrac{1}{3}$'
      - section: 'Check'
        say: 'Check: every row of the table has exactly 2 ringed cells. 6 rows times 2 is 12, the same n of $E$.'
        write: 'Check: 2 in each row, $6 \times 2 = 12\ \checkmark$'
        diagram_do:
          - {id: s, op: label, part: 'row:1', text: '2 ringed in each row'}
      - section: 'Answer'
        say: 'Therefore the probability that the sum is divisible by 3 is 1 over 3: option B.'
        write: '$\therefore P(\text{sum divisible by } 3) = \dfrac{1}{3}$'
        answer: true
    traps:
      A: 'You went for a half. That is the probability of an even sum, 18 cells out of 36. Divisible by 3 means a sum of 3, 6, 9 or 12: only 12 of the 36 cells.'
      C: 'You went for 1 over 4, which is 9 out of 36. Recount the ringed cells: 2 for a sum of 3, 5 for 6, 4 for 9 and 1 for 12. n of E is 12.'
      D: 'You went for 2 over 3. That is the probability that the sum is NOT divisible by 3, 24 cells out of 36. We want the 12 ringed cells: 1 over 3.'

  49:
    moments:
      - section: 'The question'
        say: 'How many committees of three, with two men and one woman, can be formed from the four men and three women in the picture?'
        write: 'Committee: 2 of 4 men and 1 of 3 women'
        doodle: {name: 'custom:2003_q49_a', id: people, caption: '2 of 4 men, 1 of 3 women'}
      - say: 'Solution. A committee is a selection: Ade then Bola is the same committee as Bola then Ade. So we use combinations: n C r is n factorial over n minus r factorial, times r factorial.'
        write: 'Solution: ${}^{n}C_{r} = \dfrac{n!}{(n - r)!\,r!}$'
      - say: 'We choose 2 men from 4 AND 1 woman from 3. "And" means multiply.'
        write: 'Number of committees $= {}^{4}C_{2} \times {}^{3}C_{1}$'
      - section: 'The men'
        say: '4 C 2 is 4 factorial over 4 minus 2 factorial, times 2 factorial.'
        write: '${}^{4}C_{2} = \dfrac{4!}{(4 - 2)!\,2!} = \dfrac{4!}{2!\,2!}$'
        doodle_do:
          - {id: people, op: circle, part: men}
      - say: 'Expand 4 factorial down to 2 factorial: 4 times 3 times 2 factorial. One 2 factorial cancels, leaving 4 times 3 over 2 times 1.'
        write: '$= \dfrac{4 \times 3 \times 2!}{2! \times 2 \times 1} = \dfrac{12}{2} = 6$'
      - section: 'The woman'
        say: '3 C 1 is 3 factorial over 2 factorial times 1 factorial. 3 factorial is 3 times 2 factorial, so it is 3.'
        write: '${}^{3}C_{1} = \dfrac{3!}{2!\,1!} = \dfrac{3 \times 2!}{2! \times 1} = 3$'
        doodle_do:
          - {id: people, op: circle, part: women}
        point:
          - {line: 5, kind: highlight, at: '= 3', to: {doodle: people, part: women}}
      - section: 'Multiply'
        say: 'Substitute: 6 times 3 is 18.'
        write: '$= 6 \times 3 = 18$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '= 6'}, at: '[[6]] × 3', text: 'men'}
          - {line: 6, kind: move, from: {line: 5, at: '1 = 3'}, at: '6 × [[3]]', text: 'woman'}
      - section: 'Check'
        say: 'Check the pairs of men by listing. Call them A, B, C and D. Join each pair with an arc: AB, AC, AD, BC, BD and CD. That is 6.'
        write: 'Check: AB, AC, AD, BC, BD, CD $\to 6\ \checkmark$'
        doodle_do:
          - {id: people, op: stage, stage: 'custom:2003_q49_a2'}
        point:
          - {line: 7, kind: highlight, at: '6', to: {doodle: people, part: pairs}}
      - say: 'Each of the 6 arcs goes with any of the 3 women. 6 times 3 is 18 committees.'
        write: '$6 \times 3 = 18\ \checkmark$'
        doodle_do:
          - {id: people, op: label, part: pairs, text: 'each arc × 3 women'}
      - section: 'Answer'
        say: 'Therefore 18 committees can be formed: option B.'
        write: '$\therefore$ 18 committees'
        answer: true
    traps:
      A: 'You went for 24. Recheck the two counts: 4 C 2 is 4 factorial over 2 factorial times 2 factorial, which is 6, and 3 C 1 is 3. 6 times 3 is 18.'
      C: 'You went for 3. That is only 3 C 1, the ways to choose the woman. Each goes with any of the 6 pairs of men: 18.'
      D: 'You went for 6. That is only 4 C 2, the pairs of men. Each pair goes with any of the 3 women, so multiply by 3: 18.'

  50:
    moments:
      - section: 'The question'
        say: 'Six numbers: 30, 56, 31, 55, 43 and 44. By how much is their mean less than their median? Picture them as six towers.'
        doodle: {name: 'custom:2003_q50_a', id: towers, caption: 'Six numbers as towers'}
        write: 'Data: $30,\ 56,\ 31,\ 55,\ 43,\ 44$'
      - section: 'Solution'
        say: 'Solution. First the mean, $x$ bar: the sum of the values over $n$, the number of values. Here $n$ is 6.'
        write: 'Solution. $\bar{x} = \dfrac{\sum x}{n}$, $\ n = 6$'
      - say: 'Add them. 30 plus 56 is 86, plus 31 is 117, plus 55 is 172, plus 43 is 215, plus 44 is 259.'
        write: '$\sum x = 30 + 56 + 31 + 55 + 43 + 44 = 259$'
      - say: 'Substitute: 259 over 6, which is 43.1666 and so on, about 43.17.'
        write: '$\bar{x} = \dfrac{259}{6} = 43.17$ (2 d.p.)'
        doodle_do:
          - {id: towers, op: label, part: given, text: 'mean ≈ 43.17'}
      - section: 'The median'
        say: 'For the median, first arrange the values in order of magnitude. Watch the towers line up.'
        write: 'In order: $30,\ 31,\ 43,\ 44,\ 55,\ 56$'
        doodle_do:
          - {id: towers, op: stage, stage: 'custom:2003_q50_a2'}
      - say: 'The median is the $n$ plus 1 over 2th value. 6 plus 1 is 7, over 2 is 3.5. So it is halfway between the 3rd and 4th values: 43 and 44.'
        write: 'Median $=$ the $\left(\dfrac{6 + 1}{2}\right)$th $= 3.5$th value'
        point:
          - {line: 4, kind: circle, at: '31,[[43]],44', text: '3rd'}
          - {line: 4, kind: circle, at: '43,[[44]],55', text: '4th'}
        doodle_do:
          - {id: towers, op: circle, part: middle}
      - say: 'So the median is the average of 43 and 44. 43 plus 44 is 87, and 87 over 2 is 43.5.'
        write: 'Median $= \dfrac{43 + 44}{2} = \dfrac{87}{2} = 43.5$'
        doodle_do:
          - {id: towers, op: label, part: middle, text: 'median 43.5'}
      - section: 'The difference'
        say: 'The mean is less than the median, so we take the median minus the mean.'
        write: 'Median $-$ mean $= 43.5 - 43.17$'
      - say: '43.5 minus 43.17 is 0.33.'
        write: '$\therefore$ Median $-$ mean $= 0.33$'
      - section: 'Check'
        say: 'Check with exact fractions. 43.5 is 261 over 6, and the mean is 259 over 6. The difference is 2 over 6, a third, which is 0.33.'
        write: 'Check: $\dfrac{261}{6} - \dfrac{259}{6} = \dfrac{2}{6} = \dfrac{1}{3} \approx 0.33$ ✓'
      - section: 'Answer'
        say: 'So the mean is less than the median by 0.33, which is option D.'
        write: '$\therefore$ The mean is less than the median by $0.33$'
        answer: true
    traps:
      A: 'You went for 0.50. That is 43.5 minus 43, as if the mean were exactly 43. The mean is 259 over 6, about 43.17, so the gap is 0.33.'
      B: 'You went for 0.75. Check both: the mean is 259 over 6, about 43.17, and the median is 43.5. The difference is 0.33.'
      C: 'You went for 0.17. That uses a median of 43, from the middle two of the list as given, 31 and 55, without arranging it first. In order, the middle two are 43 and 44, so the median is 43.5 and the gap is 0.33.'
