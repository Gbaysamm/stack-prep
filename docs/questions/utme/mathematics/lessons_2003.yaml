      - say: 'Now the full circumference. 21 over 7 is 3, so it''s 2 times 22 times 3.'
        write: '$= \dfrac{1}{6} \times 2 \times 22 \times 3$'
      - say: '2 times 22 is 44, and 44 times 3 is 132. So the whole circumference is 132 centimetres.'
        write: '$= \dfrac{1}{6} \times 132$'
