        write: '$y = 3\sin(-4x)$'
      - say: 'The angle inside the sine is $-4x$, not just $x$. That makes this a function inside a function, so we need the chain rule.'
        write: 'Inside function: $-4x$'
      - say: 'The chain rule says: differentiate the outside function, then multiply by the derivative of the inside.'
        write: 'Chain rule: $\dfrac{dy}{dx} = \dfrac{dy}{du} \times \dfrac{du}{dx}$'
      - say: 'Let''s call the inside $u$. So $u$ is negative $4x$, and $y$ is 3 sine $u$.'
        write: '$u = -4x,\quad y = 3\sin u$'
      - say: 'The outside first. The derivative of sine is cosine, so 3 sine $u$ becomes 3 cosine $u$. The 3 in front just stays.'
        write: '$\dfrac{dy}{du} = 3\cos u$'
      - say: 'Now the inside. The derivative of negative $4x$ is negative 4, just as the derivative of $5x$ is 5.'
        write: '$\dfrac{du}{dx} = -4$'
      - say: 'Put both of those into the chain rule we wrote earlier.'
        write: '$\dfrac{dy}{dx} = 3\cos u \times (-4)$'
        point:
          - {line: 6, kind: move, from: {line: 4, at: '3cos u'}, at: '3cos u', text: 'outside'}
          - {line: 6, kind: move, from: {line: 5, at: '−4'}, at: '(−4)', text: 'inside'}
      - say: 'Now replace $u$ with what it stands for, negative $4x$.'
        write: '$= 3\cos(-4x) \times (-4)$'
        point:
          - {line: 7, kind: move, from: {line: 3, at: '−4x'}, at: '(−4x)', text: 'u'}
      - say: '3 times negative 4 is negative 12.'
        write: '$= -12\cos(-4x)$'
      - say: 'So $\dfrac{dy}{dx}$ is negative 12 cosine of negative $4x$, which is answer choice A.'
        write: 'Answer: $\dfrac{dy}{dx} = -12\cos(-4x)$'
        answer: true
