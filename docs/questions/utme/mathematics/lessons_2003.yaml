  31:
    moments:
      - say: 'We want the equation of the locus of $P(x, y)$, which is always the same distance from $Q(0, 0)$ as from $R(2, 1)$.'
        write: '$P(x, y),\quad Q(0, 0),\quad R(2, 1)$'
        show_sketch: true
        point:
          - {figure: sketch, kind: circle, target: Q, text: '(0, 0)'}
          - {figure: sketch, kind: circle, target: '(2, 1)'}
      - say: 'Equidistant means the same distance. So the distance from $P$ to $Q$ equals the distance from $P$ to $R$. Writing that as an equation is the whole method.'
        write: '$PQ = PR$'
        point:
          - {figure: sketch, kind: highlight, target: PQ}
          - {figure: sketch, kind: highlight, target: PR, text: 'equal'}
      - say: 'The distance between two points is the square root of the change in $x$ squared, plus the change in $y$ squared.'
        write: 'Distance $= \sqrt{(x_2 - x_1)^{2} + (y_2 - y_1)^{2}}$'
      - say: 'From $P$ to $Q$, the changes are $x$ minus 0 and $y$ minus 0.'
        write: '$PQ = \sqrt{(x - 0)^{2} + (y - 0)^{2}} = \sqrt{x^{2} + y^{2}}$'
        point:
          - {line: 2, kind: box, text: 'the formula'}
      - say: 'From $P$ to $R$, the changes are $x$ minus 2 and $y$ minus 1.'
        write: '$PR = \sqrt{(x - 2)^{2} + (y - 1)^{2}}$'
      - say: 'Now put both distances into $PQ = PR$.'
        write: 'So $\sqrt{x^{2} + y^{2}} = \sqrt{(x - 2)^{2} + (y - 1)^{2}}$'
        point:
          - {line: 1, kind: arrow, text: 'PQ = PR'}
          - {line: 5, kind: move, from: {line: 3, at: '= [[x2+y2]]'}, at: 'x2+y2'}
          - {line: 5, kind: move, from: {line: 4, at: '(x−2)2+(y−1)2'}, at: '(x−2)2+(y−1)2'}
      - say: 'Square both sides to remove the square roots. Distances are never negative, so squaring loses nothing.'
        write: '$x^{2} + y^{2} = (x - 2)^{2} + (y - 1)^{2}$'
      - say: 'Expand the first bracket. $x - 2$ squared is $x^2$ minus $4x$ plus 4.'
        write: '$(x - 2)^{2} = x^{2} - 4x + 4$'
      - say: 'And $y - 1$ squared is $y^2$ minus $2y$ plus 1.'
        write: '$(y - 1)^{2} = y^{2} - 2y + 1$'
      - say: 'Put those two expansions back into the squared equation.'
        write: '$x^{2} + y^{2} = x^{2} - 4x + 4 + y^{2} - 2y + 1$'
        point:
          - {line: 9, kind: move, from: {line: 7, at: '= [[x2−4x+4]]'}, at: 'x2−4x+4', text: 'first bracket'}
          - {line: 9, kind: move, from: {line: 8, at: '= [[y2−2y+1]]'}, at: 'y2−2y+1', text: 'second bracket'}
      - say: 'The $x^2$ and the $y^2$ appear on both sides, so subtracting them from both sides cancels them. And 4 plus 1 is 5.'
        write: '$0 = -4x - 2y + 5$'
      - say: 'Add $4x$ and $2y$ to both sides.'
        write: '$4x + 2y = 5$'
        point:
          - {line: 11, kind: move, from: {line: 10, at: '−4x'}, at: '4x', text: 'across'}
          - {line: 11, kind: move, from: {line: 10, at: '− 2y'}, at: '+ 2y', text: 'across'}
      - say: 'So the locus is the straight line $4x + 2y = 5$, which is answer choice C.'
        write: 'Locus: $4x + 2y = 5$'
        point:
          - {figure: sketch, kind: label, target: '?', text: '4x + 2y = 5'}
        answer: true
    traps:
      A: 'You went for $2x + y = 5$. The left side has been halved but the 5 has not. From $0 = -4x - 2y + 5$, the equation is $4x + 2y = 5$.'
      B: 'You went for $2x + 2y = 5$. Check the expansion: $(x - 2)^2$ gives negative $4x$, not negative $2x$. So the $x$ term is $4x$.'
      D: 'You went for $4x - 2y = 5$. Watch the sign of the $y$ term: $(y - 1)^2$ gives negative $2y$ on the right, which becomes plus $2y$ when you move it across.'

  32:
