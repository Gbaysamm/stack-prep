  36:
    moments:
      - say: 'We need the integral from 2 to 3 of $x^2 - 2x$.'
        write: '$\displaystyle\int_{2}^{3} (x^{2} - 2x)\,dx$'
      - say: 'A definite integral has two parts. First we integrate. Then we put in the limits: the value at the top limit minus the value at the bottom limit.'
      - say: 'To integrate a power of $x$, add one to the index and divide by the new index. We do it to each term in turn.'
        write: 'Rule: $\displaystyle\int x^{n}\,dx = \dfrac{x^{n+1}}{n+1}$'
      - say: 'For $x^2$, the index 2 becomes 3, and we divide by 3. So we get $x^3$ over 3.'
        write: 'First term: $\displaystyle\int x^{2}\,dx = \dfrac{x^{3}}{3}$'
        point:
          - {line: 2, kind: box, text: 'the rule'}
      - say: 'For $2x$, the index 1 becomes 2, and we divide by 2. So we get $2x^2$ over 2, which is just $x^2$.'
        write: 'Second term: $\displaystyle\int 2x\,dx = \dfrac{2x^{2}}{2} = x^{2}$'
      - say: 'Put the two together, keeping the minus sign between them, and write the limits 2 and 3 on the square bracket.'
        write: '$\displaystyle\int_{2}^{3} (x^{2} - 2x)\,dx = \left[\dfrac{x^{3}}{3} - x^{2}\right]_{2}^{3}$'
        point:
          - {line: 5, kind: move, from: {line: 3, at: '= [[3x3]]'}, at: '3x3', text: 'first term'}
          - {line: 5, kind: move, from: {line: 4, at: '= [[x2]]'}, at: '3x3 [[− x2]]', text: 'second term'}
      - say: 'Now put in the limits: the value at 3, minus the value at 2. Keep each one in its own bracket.'
        write: '$= \left(\dfrac{3^{3}}{3} - 3^{2}\right) - \left(\dfrac{2^{3}}{3} - 2^{2}\right)$'
      - say: 'In the first bracket, 3 cubed is 27 and 3 squared is 9. In the second, 2 cubed is 8 and 2 squared is 4.'
        write: '$= \left(\dfrac{27}{3} - 9\right) - \left(\dfrac{8}{3} - 4\right)$'
      - say: 'The first bracket: 27 over 3 is 9, and 9 minus 9 is 0.'
        write: '$= (9 - 9) - \left(\dfrac{8}{3} - 4\right) = 0 - \left(\dfrac{8}{3} - 4\right)$'
      - say: 'The second bracket: to take 4 from 8 over 3, write 4 as 12 over 3. Then 8 over 3 minus 12 over 3 is negative 4 over 3.'
        write: '$= 0 - \left(\dfrac{8}{3} - \dfrac{12}{3}\right) = 0 - \left(-\dfrac{4}{3}\right)$'
      - say: 'Subtracting a negative is the same as adding. So 0 minus negative 4 over 3 is plus 4 over 3.'
        write: '$= \dfrac{4}{3}$'
        point:
          - {line: 9, kind: circle, at: '− (−', text: 'minus a negative'}
      - say: 'So the integral is 4 over 3, which is answer choice A.'
        write: 'Answer: $\dfrac{4}{3}$'
        answer: true
    traps:
      B: 'You went for 1 over 3. Check the bottom limit: 8 over 3 minus 4 is 8 over 3 minus 12 over 3, which is negative 4 over 3. Then 0 minus negative 4 over 3 is 4 over 3.'
      C: 'You went for 2. Recheck the two brackets: at 3 the value is 9 minus 9, which is 0, and at 2 it is 8 over 3 minus 4, which is negative 4 over 3. The top value minus the bottom value is 4 over 3.'
      D: 'You went for 4. The bracket values are 0 at the top and negative 4 over 3 at the bottom, so the answer is 4 over 3, not 4. Remember the $x^3$ is divided by 3.'

  37:
    moments:
