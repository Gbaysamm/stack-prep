      - say: 'The arc length formula needs the angle at the centre of the circle. But we''ve been given the angle at the circumference.'
      - say: 'A circle theorem links them: the angle at the centre is twice the angle at the circumference, when both stand on the same arc.'
        write: 'Angle at centre $= 2 \times$ angle at circumference'
