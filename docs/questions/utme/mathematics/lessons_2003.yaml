      B: 'You went for 12 sine of negative $4x$. The derivative of sine is cosine, not sine. And the chain rule brings in a negative 4, so the number in front is negative 12.'
      C: 'You went for $12x\cos(4x)$. There''s no extra $x$ in front: the derivative of negative $4x$ is just negative 4. So we get negative 12 cosine of negative $4x$.'
      D: 'You went for negative $12x$ cosine of negative $4x$. Nearly right, but there''s no $x$ in front. The derivative of the inside, negative $4x$, is the number negative 4.'

  38:
