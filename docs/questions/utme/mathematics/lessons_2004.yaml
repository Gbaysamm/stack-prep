  31:
    moments:
      - say: 'We know $\alpha$ plus $\beta$ is 2, and the distance between the points 1, $\alpha$ and $\beta$, 1 is 3 units. We want $\alpha$ squared plus $\beta$ squared.'
        write: 'Given: $\alpha + \beta = 2$; distance from $(1,\ \alpha)$ to $(\beta,\ 1)$ is $3$'
      - say: 'We can''t find $\alpha$ and $\beta$ one at a time, and we don''t need to. The plan is to write the distance as an equation and arrange it so that $\alpha$ plus $\beta$ appears.'
      - say: 'The distance squared between two points is the change in $x$ squared plus the change in $y$ squared. Squaring saves us carrying a square root.'
        write: '$d^{2} = (x_{2} - x_{1})^{2} + (y_{2} - y_{1})^{2}$'
      - say: 'Put in our points. The change in $x$ is $\beta$ minus 1, the change in $y$ is 1 minus $\alpha$, and the distance is 3.'
        write: '$3^{2} = (\beta - 1)^{2} + (1 - \alpha)^{2}$'
      - say: '3 squared is 9.'
        write: '$9 = (\beta - 1)^{2} + (1 - \alpha)^{2}$'
      - say: 'Expand the first bracket: $\beta$ minus 1, squared, is $\beta$ squared minus 2 $\beta$ plus 1.'
        write: '$(\beta - 1)^{2} = \beta^{2} - 2\beta + 1$'
      - say: 'And the second: 1 minus $\alpha$, squared, is 1 minus 2 $\alpha$ plus $\alpha$ squared.'
        write: '$(1 - \alpha)^{2} = 1 - 2\alpha + \alpha^{2}$'
      - say: 'Put both back into the equation. The two ones add to make 2.'
        write: '$9 = \alpha^{2} + \beta^{2} - 2\alpha - 2\beta + 2$'
      - say: 'Now the useful move. Take out 2 from the two middle terms: minus 2 $\alpha$ minus 2 $\beta$ is minus 2 times, $\alpha$ plus $\beta$.'
        write: '$9 = \alpha^{2} + \beta^{2} - 2(\alpha + \beta) + 2$'
      - say: 'And $\alpha$ plus $\beta$ is the 2 we were given. So put 2 in the bracket.'
        write: '$9 = \alpha^{2} + \beta^{2} - 2(2) + 2$'
      - say: 'Minus 2 times 2 is minus 4, and minus 4 plus 2 is minus 2.'
        write: '$9 = \alpha^{2} + \beta^{2} - 2$'
