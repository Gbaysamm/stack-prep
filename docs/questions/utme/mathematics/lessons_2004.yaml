# UTME 2004 Mathematics — lessons for the board.
#
# Each lesson is a run of MOMENTS: one or two short things said, and at most one line written
# while they are said. See lessons_2002.yaml for the full format notes.
#
# Keyed on question number, like explanations_2004.yaml. Answers match that file.
format_version: 1
exam_year: 2004
lessons:
  1:
    moments:
      - say: 'We have a subtraction done in base 5, with two missing digits, $x$ and $y$. We want to find them.'
        write: '$4243_5 - 13x4_5 = y344_5$'
      - say: 'The one new idea is the borrow. In base 5, borrowing one from the next column gives you 5, not 10.'
        write: '$\text{borrow} = 5$'
      - say: 'We work from right to left. The units column is 3 take away 4. We can''t do that, so we borrow. 3 plus 5 is 8.'
        write: '$3 + 5 = 8$'
      - say: '8 minus 4 is 4, and that matches the 4 in the answer.'
        write: '$8 - 4 = 4$'
      - say: 'Now the fives column. The top digit was 4, but we borrowed from it, so it is now 3.'
        write: '$4 - 1 = 3$'
      - say: '3 minus $x$ has to give 4. That can''t happen without another borrow, so we borrow again. 3 plus 5 is 8.'
        write: '$3 + 5 = 8$'
      - say: 'So 8 minus $x$ equals 4. What must $x$ be? 8 minus 4 is 4, so $x$ is 4.'
        write: '$8 - x = 4 \Rightarrow x = 4$'
      - say: 'Next, the twenty-fives column. The top digit 2 has lost 1 to the borrow, so it is now 1.'
        write: '$2 - 1 = 1$'
      - say: '1 minus 3 needs a borrow as well. 1 plus 5 is 6, and 6 minus 3 is 3. That matches the 3 in the answer.'
        write: '$1 + 5 = 6,\ 6 - 3 = 3$'
      - say: 'Last column. The 4 has lost 1, so it is 3. 3 minus 1 is 2, so $y$ is 2.'
        write: '$3 - 1 = 2 \Rightarrow y = 2$'
      - say: 'The question asks for $x$ and $y$ respectively, so that''s 4, then 2, which is answer choice C.'
        write: '$x = 4,\ y = 2$'
        answer: true
    traps:
      A: 'You went for 2, 4. Those are the right digits in the wrong order. The question says $x$ and $y$ respectively, so $x$ comes first: 4, then 2.'
      B: 'You went for 3, 2. $y$ is right, but $x$ is not. Remember the fives column had already lost 1 to a borrow, so it is 3 plus 5, which is 8, and 8 minus 4 gives $x = 4$.'
      D: 'You went for 4, 3. $x$ is right, but in the last column the 4 had lost 1 to the borrow before it. So it is 3 minus 1, which is 2, not 4 minus 1.'
  2:
    moments:
      - say: 'We have $451_6$ minus $p$ in base 7 equals $305_6$, and we want $p$. There are two different bases here.'
        write: '$451_6 - p_7 = 305_6$'
      - say: 'The safe plan is to change everything into base ten, do the subtraction there, and then change the answer into base 7.'
      - say: 'First, $451_6$. The place values in base 6 are 36, 6 and 1. So it is 4 times 36, plus 5 times 6, plus 1.'
        write: '$451_6 = 4(36) + 5(6) + 1$'
      - say: '4 times 36 is 144. 5 times 6 is 30. 144 plus 30 plus 1 is 175.'
        write: '$= 144 + 30 + 1 = 175$'
      - say: 'Now $305_6$. That is 3 times 36, plus 0 times 6, plus 5.'
        write: '$305_6 = 3(36) + 0(6) + 5$'
      - say: '3 times 36 is 108, so we get 108 plus 0 plus 5, which is 113.'
        write: '$= 108 + 0 + 5 = 113$'
      - say: 'So in base ten, 175 minus $p$ equals 113.'
        write: '$175 - p = 113$'
      - say: 'To get $p$ by itself, we take 113 from 175. That gives 62.'
        write: '$p = 175 - 113 = 62$'
      - say: 'Now we change 62 into base 7. The place values in base 7 are 49, 7 and 1.'
      - say: 'How many 49s are in 62? Just 1, with 13 left over.'
        write: '$62 \div 49 = 1\ \text{r}\ 13$'
      - say: 'How many 7s are in 13? 1, with 6 left over.'
        write: '$13 \div 7 = 1\ \text{r}\ 6$'
      - say: 'So the digits are 1, 1 and 6, and $p$ is $116_7$, which is answer choice C.'
        write: '$p = 116_7$'
        answer: true
    traps:
      A: 'You went for $611_7$. Those are the right digits, but read backwards. The first division, by 49, gives the leftmost digit, so it is $116_7$.'
      B: 'You went for $142_7$. That is what you get by subtracting the base-6 digits directly. The subscripts are different, so change to base ten first.'
      D: 'You went for $62_7$. 62 is the right number in base ten, but the options are in base 7. You still need to convert it, which gives $116_7$.'
  3:
    moments:
      - say: 'We need to simplify a fraction with fractions on top and on the bottom. We''ll tidy the top, tidy the bottom, and then divide.'
        write: '$\dfrac{\tfrac{1}{10} \times \tfrac{2}{3} + \tfrac{1}{4}}{\tfrac{1}{2} \div \tfrac{3}{5} - \tfrac{1}{4}}$'
      - say: 'Start with the top. First, one tenth times two thirds. Multiply the tops and the bottoms: that is two thirtieths, which is one fifteenth.'
        write: '$\tfrac{1}{10} \times \tfrac{2}{3} = \tfrac{2}{30} = \tfrac{1}{15}$'
      - say: 'Now we add one quarter. The common denominator of 15 and 4 is 60.'
        write: '$\tfrac{1}{15} + \tfrac{1}{4}$'
      - say: 'One fifteenth is four sixtieths, and one quarter is fifteen sixtieths. Together that''s nineteen sixtieths.'
        write: '$= \tfrac{4}{60} + \tfrac{15}{60} = \tfrac{19}{60}$'
      - say: 'Now the bottom. Dividing by three fifths is the same as multiplying by five thirds.'
        write: '$\tfrac{1}{2} \div \tfrac{3}{5} = \tfrac{1}{2} \times \tfrac{5}{3} = \tfrac{5}{6}$'
      - say: 'Then subtract one quarter. The common denominator of 6 and 4 is 12. Five sixths is ten twelfths, and one quarter is three twelfths.'
        write: '$\tfrac{5}{6} - \tfrac{1}{4} = \tfrac{10}{12} - \tfrac{3}{12}$'
      - say: '10 minus 3 is 7, so the bottom is seven twelfths.'
        write: '$= \tfrac{7}{12}$'
      - say: 'Now divide the top by the bottom. Dividing by seven twelfths means multiplying by twelve sevenths.'
        write: '$\tfrac{19}{60} \div \tfrac{7}{12} = \tfrac{19}{60} \times \tfrac{12}{7}$'
      - say: '12 goes into 60 five times, so the 12 cancels and leaves 5 on the bottom.'
        write: '$= \dfrac{19}{5 \times 7}$'
      - say: '5 times 7 is 35, so the answer is nineteen thirty-fifths, which is answer choice D.'
        write: '$= \tfrac{19}{35}$'
        answer: true
    traps:
      A: 'You went for two twenty-fifths. That doesn''t come from this working. The top simplifies to nineteen sixtieths and the bottom to seven twelfths, and dividing gives nineteen thirty-fifths.'
      B: 'You went for nineteen sixtieths. That is the top of the fraction on its own. You still have to divide it by the bottom, seven twelfths.'
      C: 'You went for seven twelfths. That is the bottom of the fraction on its own. The whole thing is the top, nineteen sixtieths, divided by it.'
  4:
    moments:
      - say: 'A farmer sowed 5000 grains and harvested 5000 cobs, each with 500 grains. We want the ratio of grains sowed to grains harvested.'
      - say: 'A ratio compares like with like, so we need grains on both sides. The grains sowed are given: 5000.'
        write: '$\text{sowed} = 5000$'
      - say: 'The grains harvested are not given directly. There are 5000 cobs, and each cob has 500 grains, so we multiply.'
        write: '$\text{harvested} = 5000 \times 500$'
      - say: '5000 times 500 is 2 million, 500 thousand.'
        write: '$= 2{,}500{,}000$'
      - say: 'So the ratio of sowed to harvested is 5000 to 2,500,000.'
        write: '$5000 : 2{,}500{,}000$'
      - say: 'Let''s divide both sides by 5000. 5000 divided by 5000 is 1, and 2,500,000 divided by 5000 is 500.'
        write: '$= 1 : 500$'
      - say: 'So the ratio is 1 to 500, which is answer choice A.'
        write: '$1 : 500$'
        answer: true
    traps:
      B: 'You went for 1 to 5000. The harvest is 2,500,000 grains, and 2,500,000 divided by 5000 is 500, not 5000.'
      C: 'You went for 1 to 25000. Check the division: 2,500,000 divided by 5000 is 500. It helps to cancel the zeros carefully.'
      D: 'You went for 1 to 250000. It looks like a slip with the zeros. 5000 grains against 2,500,000 grains simplifies to 1 to 500.'
  5:
    moments:
      - say: 'Three teachers share chalk. The first gets two fifths. The second gets two fifteenths of the remainder. We want the third teacher''s share.'
      - say: 'The key words are ''of the remainder''. So first, what is left after the first teacher? The whole packet is 1, and 1 minus two fifths is three fifths.'
        write: '$1 - \tfrac{2}{5} = \tfrac{3}{5}$'
      - say: 'The second teacher gets two fifteenths of that three fifths. ''Of'' means multiply.'
        write: '$\tfrac{2}{15} \times \tfrac{3}{5} = \tfrac{6}{75}$'
      - say: 'Divide the top and bottom by 3. 6 divided by 3 is 2, and 75 divided by 3 is 25.'
        write: '$\tfrac{6}{75} = \tfrac{2}{25}$'
      - say: 'The third teacher gets what is left of the whole packet after the first two shares.'
        write: '$1 - \tfrac{2}{5} - \tfrac{2}{25}$'
      - say: 'Put everything over 25. 1 is twenty-five twenty-fifths, and two fifths is ten twenty-fifths.'
        write: '$= \tfrac{25}{25} - \tfrac{10}{25} - \tfrac{2}{25}$'
      - say: '25 minus 10 is 15, and 15 minus 2 is 13. So the third teacher gets thirteen twenty-fifths, which is answer choice C.'
        write: '$= \tfrac{13}{25}$'
        answer: true
    traps:
      A: 'You went for eleven twenty-fifths. Check the subtraction over 25: 25 minus 10 minus 2 is 13, not 11.'
      B: 'You went for twelve twenty-fifths. The second teacher''s share is two twenty-fifths, so over 25 it is 25 minus 10 minus 2, which is 13.'
      D: 'You went for eight fifteenths. That is two fifths plus two fifteenths, the first two shares if the second teacher took two fifteenths of the whole packet. It''s two fifteenths of the remainder, and the question wants the third share.'
  6:
    moments:
      - say: 'We''re told the cube root of 4 to the power $2x$ equals 16, and we want $x$.'
        write: '$\sqrt[3]{4^{2x}} = 16$'
      - say: 'The plan is to write both sides as powers of the same base, 4, and then compare the indices.'
      - say: 'A cube root is the same as the power one third. So we multiply the index $2x$ by one third.'
        write: '$\sqrt[3]{4^{2x}} = 4^{\frac{2x}{3}}$'
      - say: 'On the right, 16 is 4 times 4, which is 4 squared.'
        write: '$16 = 4^{2}$'
      - say: 'So 4 to the $\tfrac{2x}{3}$ equals 4 squared.'
        write: '$4^{\frac{2x}{3}} = 4^{2}$'
      - say: 'The bases are the same, so the indices must be equal.'
        write: '$\dfrac{2x}{3} = 2$'
      - say: 'Multiply both sides by 3. That gives $2x$ equals 6.'
        write: '$2x = 6$'
      - say: 'Divide both sides by 2, and $x$ is 3, which is answer choice B.'
        write: '$x = 3$'
        answer: true
    traps:
      A: 'You went for 2. That is the index on the right-hand side, 16 as 4 squared. We still need to solve two thirds of $x$ equals 2, which gives 3.'
      C: 'You went for 4. That''s the base, not the value of $x$. Once both sides are powers of 4, compare the indices: two $x$ over 3 equals 2.'
      D: 'You went for 6. That is $2x$, not $x$. Divide by 2 at the end and you get 3.'
  7:
    moments:
      - say: 'We want to write 1 over root 3 plus 2 in the form $a + b\sqrt{3}$. That means clearing the surd from the bottom.'
        write: '$\dfrac{1}{\sqrt{3} + 2}$'
      - say: 'The tool is the conjugate. We flip the middle sign of the denominator, so the conjugate of 2 plus root 3 is 2 minus root 3.'
        write: '$\text{conjugate: } 2 - \sqrt{3}$'
      - say: 'Multiply the top and the bottom by it. That doesn''t change the value.'
        write: '$\dfrac{1}{2 + \sqrt{3}} \times \dfrac{2 - \sqrt{3}}{2 - \sqrt{3}}$'
      - say: 'The bottom is a difference of two squares: 2 squared minus root 3 squared.'
        write: '$(2 + \sqrt{3})(2 - \sqrt{3}) = 2^{2} - (\sqrt{3})^{2}$'
      - say: '2 squared is 4, and root 3 squared is 3. 4 minus 3 is 1.'
        write: '$= 4 - 3 = 1$'
      - say: 'The top is just 1 times 2 minus root 3. So we have 2 minus root 3 over 1.'
        write: '$\dfrac{2 - \sqrt{3}}{1}$'
      - say: 'Anything over 1 is itself, so the answer is 2 minus root 3, which is answer choice C.'
        write: '$= 2 - \sqrt{3}$'
        answer: true
    traps:
      A: 'You went for negative 2 minus root 3. Both signs are flipped. The bottom works out to 4 minus 3, which is positive 1, so nothing changes sign.'
      B: 'You went for negative 2 plus root 3. That''s the answer times negative 1, which happens if the bottom is worked out as 3 minus 4. It is 2 squared minus root 3 squared, 4 minus 3, which is positive 1.'
      D: 'You went for 2 plus root 3. That is the conjugate with the wrong sign. We multiply by 2 minus root 3, and the answer is 2 minus root 3.'
  8:
    moments:
      - say: 'We have 6 log 2 minus 3 log 3, both to base $x$, equals 3. We want $x$.'
        write: '$6\log_x 2 - 3\log_x 3 = 3$'
      - say: 'The first thing to do is move the numbers in front into the powers. That''s the power law of logs.'
      - say: '6 log 2 becomes log of 2 to the power 6. 2 to the 6 is 64.'
        write: '$6\log_x 2 = \log_x 2^{6} = \log_x 64$'
      - say: '3 log 3 becomes log of 3 cubed. 3 cubed is 27.'
        write: '$3\log_x 3 = \log_x 3^{3} = \log_x 27$'
      - say: 'Now a log minus a log is the log of a division.'
        write: '$\log_x 64 - \log_x 27 = \log_x \dfrac{64}{27}$'
      - say: 'So log to base $x$ of sixty-four twenty-sevenths equals 3.'
        write: '$\log_x \dfrac{64}{27} = 3$'
      - say: 'Read that as a power: $x$ cubed equals sixty-four twenty-sevenths.'
        write: '$x^{3} = \dfrac{64}{27}$'
      - say: 'Take the cube root of the top and the bottom. The cube root of 64 is 4, and the cube root of 27 is 3.'
        write: '$x = \dfrac{\sqrt[3]{64}}{\sqrt[3]{27}}$'
      - say: 'So $x$ is four thirds, which is answer choice C.'
        write: '$x = \dfrac{4}{3}$'
        answer: true
    traps:
      A: 'You went for three eighths. Check the roots: the cube root of 64 is 4, not 8, and the fraction is 64 over 27, so the answer is four thirds.'
      B: 'You went for three quarters. That is the right fraction upside down. $x$ cubed is 64 over 27, so the 4 is on top.'
      D: 'You went for eight thirds. 8 is the square root of 64, but the power here is 3, so you need the cube root, which is 4.'
  9:
    moments:
      - say: 'We want to name the shaded region in the Venn diagram with three circles, $P$, $Q$ and $R$.'
      - say: 'The plan is to ask three questions about the shaded patch: is it inside $P$, inside $Q$, inside $R$?'
      - say: 'In the diagram, the shading sits inside the circle $Q$.'
        write: '$\text{in } Q$'
      - say: 'It also sits inside the lower circle, $R$.'
        write: '$\text{in } R$'
      - say: 'But it stops at the edge of $P$. So it is outside $P$.'
        write: '$\text{not in } P$'
      - say: 'In $Q$ and in $R$ is the intersection, $Q$ intersect $R$.'
        write: '$Q \cap R$'
      - say: 'Not in $P$ is the complement of $P$, written $P$ with a small c.'
        write: '$P^{c}$'
      - say: 'All three must hold together, so we join them with ''and'', which is intersect.'
        write: '$P^{c} \cap (Q \cap R)$'
      - say: 'So the shaded region is $P^{c} \cap (Q \cap R)$, which is answer choice A.'
        write: '$P^{c} \cap (Q \cap R)$'
        answer: true
    traps:
      B: 'You went for $P$ intersect $Q$. That region is inside $P$, but the shading stops at the edge of $P$. It is outside $P$.'
      C: 'You went for the version with union at the front. That would shade every point outside $P$, even points in no circle at all. The shading must be outside $P$ AND in both $Q$ and $R$.'
      D: 'You went for $Q$ union $R$ inside the bracket. That would shade everything in $Q$ or in $R$ outside $P$, which is far more. The shading is only where $Q$ and $R$ overlap.'
  10:
    moments:
      - say: 'There are 40 students, and each takes at least one of Physics and Chemistry. We want the number taking Physics only.'
      - say: 'Everything is described using the number who take both. So let''s call that $b$.'
        write: '$\text{both} = b$'
      - say: 'Physics is three times the number taking both, so Physics is $3b$.'
        write: '$P = 3b$'
      - say: 'Chemistry is twice the Physics number. 2 times $3b$ is $6b$.'
        write: '$C = 2 \times 3b = 6b$'
      - say: 'Everyone takes at least one subject, so the union is the whole class of 40. Physics plus Chemistry counts the ''both'' group twice, so we take it away once.'
        write: '$P + C - b = 40$'
      - say: 'Substitute: $3b$ plus $6b$ minus $b$ is $8b$.'
        write: '$3b + 6b - b = 40$'
      - say: 'So $8b$ equals 40.'
        write: '$8b = 40$'
      - say: 'Divide both sides by 8, and $b$ is 5.'
        write: '$b = 5$'
      - say: 'So Physics altogether is 3 times 5, which is 15.'
        write: '$P = 3(5) = 15$'
      - say: 'But ''Physics only'' leaves out the 5 who also take Chemistry. 15 minus 5 is 10, which is answer choice C.'
        write: '$15 - 5 = 10$'
        answer: true
    traps:
      A: 'You went for 25. That''s Chemistry only: 30 minus 5. The question asks for Physics only, which is 15 minus 5.'
      B: 'You went for 15. That is everyone who takes Physics, including the 5 who also take Chemistry. ''Only'' means taking those 5 away.'
      D: 'You went for 5. That is the number taking both subjects. Physics only is the 15 Physics students minus those 5.'
  11:
    moments:
      - say: 'We want the values of $x$ where the curve $y = x^{3} + 2x^{2} - 5x - 6$ crosses the $x$-axis.'
        write: '$y = x^{3} + 2x^{2} - 5x - 6$'
      - say: 'On the $x$-axis, $y$ is zero. So we are really solving this cubic equal to zero.'
        write: '$x^{3} + 2x^{2} - 5x - 6 = 0$'
      - say: 'For a cubic, we find one root by trying. We try factors of the constant term, 6: plus or minus 1, 2, 3 and 6.'
        write: '$\text{try } \pm 1,\ \pm 2,\ \pm 3,\ \pm 6$'
      - say: 'Let''s try $x = 2$. 2 cubed is 8. 2 times 2 squared is 8. 5 times 2 is 10.'
        write: '$2^{3} + 2(2)^{2} - 5(2) - 6$'
      - say: 'So we get 8 plus 8 minus 10 minus 6. 16 minus 16 is zero.'
        write: '$= 8 + 8 - 10 - 6 = 0$'
      - say: 'It gives zero, so $x = 2$ is a root, and $x - 2$ is a factor.'
        write: '$(x - 2) \text{ is a factor}$'
      - say: 'Dividing the cubic by $x - 2$ leaves the quadratic $x^{2} + 4x + 3$.'
        write: '$(x - 2)(x^{2} + 4x + 3) = 0$'
      - say: 'Now factorise the quadratic. We need two numbers that multiply to 3 and add to 4. That''s 1 and 3.'
        write: '$x^{2} + 4x + 3 = (x + 1)(x + 3)$'
      - say: 'So the whole cubic is $x - 2$, times $x + 1$, times $x + 3$.'
        write: '$(x - 2)(x + 1)(x + 3) = 0$'
      - say: 'Set each bracket to zero. $x - 2 = 0$ gives 2. $x + 1 = 0$ gives negative 1. $x + 3 = 0$ gives negative 3.'
        write: '$x = 2,\ x = -1,\ x = -3$'
      - say: 'So the curve crosses at 2, negative 1 and negative 3, which is answer choice C.'
        write: '$2,\ -1,\ -3$'
        answer: true
    traps:
      A: 'You went for negative 2, negative 1 and 3. The signs of 2 and negative 3 are flipped. Try $x = -2$: negative 8 plus 8 plus 10 minus 6 is 4, not zero.'
      B: 'You went for negative 2, 1 and negative 3. A bracket $x + 1$ gives the root negative 1, and $x - 2$ gives positive 2. Flip the sign from the bracket.'
      D: 'You went for 2, 1 and 3. Only 2 is right. The brackets $x + 1$ and $x + 3$ give the roots negative 1 and negative 3.'
  12:
    moments:
      - say: 'We want the remainder when $3x^{3} + 5x^{2} - 11x + 4$ is divided by $x + 3$.'
        write: '$f(x) = 3x^{3} + 5x^{2} - 11x + 4$'
      - say: 'We don''t need long division. The remainder theorem says: dividing by $x - a$ leaves the remainder $f(a)$.'
        write: '$\text{remainder} = f(a)$'
      - say: 'What value makes $x + 3$ zero? $x = -3$. So $a$ is negative 3.'
        write: '$x + 3 = 0 \Rightarrow x = -3$'
      - say: 'So we work out $f$ of negative 3.'
        write: '$f(-3) = 3(-3)^{3} + 5(-3)^{2} - 11(-3) + 4$'
      - say: 'Negative 3 cubed is negative 27, and 3 times negative 27 is negative 81.'
        write: '$3(-27) = -81$'
      - say: 'Negative 3 squared is positive 9, and 5 times 9 is 45.'
        write: '$5(9) = 45$'
      - say: 'Negative 11 times negative 3 is positive 33, because a negative times a negative is positive.'
        write: '$-11(-3) = 33$'
      - say: 'Now add them all with the 4: negative 81 plus 45 plus 33 plus 4.'
        write: '$-81 + 45 + 33 + 4$'
      - say: '45 plus 33 plus 4 is 82, and 82 minus 81 is 1. So the remainder is 1, which is answer choice B.'
        write: '$= 1$'
        answer: true
    traps:
      A: 'You went for 4. That''s just the constant term, which is $f(0)$. The divisor $x + 3$ is zero at $x = -3$, so we need $f(-3)$.'
      C: 'You went for negative 1. Check the signs: negative 81 plus 45 plus 33 plus 4 is positive 1. Remember negative 11 times negative 3 is positive 33.'
      D: 'You went for negative 4. Watch the signs when you substitute negative 3. The square gives positive 45, and negative 11 times negative 3 is positive 33, so the total is 1.'
  13:
    moments:
      - say: 'We want to factorise $ac - 2bc - a^{2} + 4b^{2}$ completely.'
        write: '$ac - 2bc - a^{2} + 4b^{2}$'
      - say: 'There are four terms with nothing common to all of them, so we group them in pairs.'
        write: '$(ac - 2bc) + (-a^{2} + 4b^{2})$'
      - say: 'In the first pair, $c$ is common. Take it out, and we get $c$ times $a - 2b$.'
        write: '$ac - 2bc = c(a - 2b)$'
      - say: 'In the second pair, take out a minus sign. That leaves $a^{2} - 4b^{2}$ inside.'
        write: '$-a^{2} + 4b^{2} = -(a^{2} - 4b^{2})$'
      - say: '$a^{2} - 4b^{2}$ is a difference of two squares, $a$ squared minus $2b$ squared.'
        write: '$= -(a - 2b)(a + 2b)$'
      - say: 'Put the two parts back together.'
        write: '$c(a - 2b) - (a - 2b)(a + 2b)$'
      - say: 'Both parts share the bracket $a - 2b$, so we take it out as a common factor.'
        write: '$(a - 2b)\left[c - (a + 2b)\right]$'
      - say: 'Now carefully remove the inner bracket. The minus applies to both terms, so we get $c - a - 2b$.'
        write: '$(a - 2b)(c - a - 2b)$'
      - say: 'So the factorisation is $(a - 2b)(c - a - 2b)$, which is answer choice B.'
        write: '$(a - 2b)(c - a - 2b)$'
        answer: true
    traps:
      A: 'You went for $c + a - 2b$ in the second bracket. The minus sign in front of $a + 2b$ turns $a$ into negative $a$ and $2b$ into negative $2b$.'
      C: 'You went for $c + a + 2b$. The second pair was negative $a$ squared plus $4b$ squared, so a minus comes out in front of $a + 2b$. Carry it through.'
      D: 'You went for $c - a + 2b$. You changed the sign of $a$ but not of $2b$. The minus applies to the whole bracket, so both signs change.'
  14:
    moments:
      - say: '$y$ is inversely proportional to $x$, and $y = 4$ when $x$ is one half. We want $x$ when $y = 10$.'
      - say: 'Inversely proportional means $y$ equals $k$ over $x$. In other words, $x$ times $y$ is always the same number, $k$.'
        write: '$y = \dfrac{k}{x} \Rightarrow xy = k$'
      - say: 'Let''s find $k$ from the pair we''re given. One half times 4 is 2.'
        write: '$k = \tfrac{1}{2} \times 4 = 2$'
      - say: 'So $xy$ is always 2.'
        write: '$xy = 2$'
      - say: 'Now put in $y = 10$. That gives $10x = 2$.'
        write: '$10x = 2$'
      - say: 'Divide both sides by 10. 2 over 10 simplifies to one fifth.'
