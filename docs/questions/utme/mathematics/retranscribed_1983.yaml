  - number: 46
    stem: >-
      In a triangle $PQR$, $QR = 3$ cm, $PR = \sqrt{3}$ cm, $PQ = 2\sqrt{3}$ cm and
      $\angle PQR = 30^{\circ}$. Find the angles $P$ and $R$.
    options:
      A: '$P = 60^{\circ}$ and $R = 90^{\circ}$'
      B: '$P = 30^{\circ}$ and $R = 120^{\circ}$'
      C: '$P = 90^{\circ}$ and $R = 60^{\circ}$'
      D: '$P = 60^{\circ}$ and $R = 60^{\circ}$'
      E: '$P = 45^{\circ}$ and $R = 105^{\circ}$'
    corrected: >-
      the paper's radical signs have slipped below the line, so both PR and PQ read as √3
      (or as 3, making the triangle equilateral against the stated 30°). The sides √3, 3 and
      2√3 are the 30°-60°-90° triangle, the only reading consistent with ∠PQR = 30° that
      gives an offered answer.

