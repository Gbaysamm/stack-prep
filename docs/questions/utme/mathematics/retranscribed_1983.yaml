# UTME 1983 Mathematics — re-transcribed by hand from MATHEMATICS-questions.pdf, pages 2-5.
#
# All 50 questions. This is a five-option paper (A-E), the earliest in the compilation. It
# runs from the top of page 2 to the top of page 5, above the 1984 paper.
#
# keys_1983.yaml answered 21 and set aside the rest; all 21 agree with this file. The rest
# resolve from the page images, but this paper is the most damaged of all: Q8 and Q11 have
# options too garbled to read and are rebuilt, Q44's printed options satisfy neither of its
# own straight-line conditions, and Q48's options belong to no mean of its numbers. Every
# rebuild says so in its note.
source:
  file: docs/questions/utme/mathematics/MATHEMATICS-questions.pdf
  exam_year: 1983
  paper_label: UTME 1983 Mathematics (objective)
  paper_code: UTME-1983-MATH
  pages: [2, 3, 4, 5]
  transcribed_by: hand
  answer_source: unverified

questions:
  - number: 1
    stem: >-
      If $M$ represents the median and $D$ the mode of the measurements 5, 9, 3, 5, 8, then
      $(M, D)$ is
    options:
      A: '(6, 5)'
      B: '(5, 8)'
      C: '(5, 7)'
      D: '(5, 5)'
      E: '(7, 5)'

  - number: 2
    stem: >-
      A construction company is owned by two partners X and Y, and it is agreed that their
      profit will be divided in the ratio 4 : 5. At the end of the year Y received ₦5,000 more
      than X. What is the total profit of the company for the year?
    options:
      A: '₦20,000.00'
      B: '₦25,000.00'
      C: '₦30,000.00'
      D: '₦15,000.00'
      E: '₦45,000.00'
    corrected: >-
      the paper prints options B and D with stray characters ("P'0#25,000.00",
      "#15,000.003"); they are ₦25,000.00 and ₦15,000.00.

  - number: 3
    stem: 'Given a regular hexagon, calculate each interior angle of the hexagon.'
    options:
      A: '$60^{\circ}$'
      B: '$30^{\circ}$'
      C: '$120^{\circ}$'
      D: '$45^{\circ}$'
      E: '$135^{\circ}$'

  - number: 4
    stem: 'Solve the following equations: $4x - 3 = 3x + y = 2y + 5x - 12$'
    options:
      A: '$x = 5$, $y = 2$'
      B: '$x = 2$, $y = 5$'
      C: '$x = -2$, $y = -5$'
      D: '$x = 5$, $y = -2$'
      E: '$x = -5$, $y = -2$'
    corrected: >-
      the paper prints option A as "4x = 5, y = 2", a stray 4 before the x; the solution is
      x = 5, y = 2.

  - number: 5
    stem: >-
      If $x = 1$ is a root of the equation $x^{3} - 2x^{2} - 5x + 6 = 0$, find the other
      roots.
    options:
      A: '−3 and 2'
      B: '−2 and 2'
      C: '3 and −2'
      D: '1 and 3'
      E: '−3 and 1'

  - number: 6
    stem: >-
      If $x$ is jointly proportional to the cube of $y$ and the fourth power of $z$, in what
      ratio is $x$ increased or decreased when $y$ is halved and $z$ is doubled?
    options:
      A: '4 : 1 increase'
      B: '2 : 1 increase'
      C: '1 : 4 decrease'
      D: '1 : 1 no change'
      E: '3 : 4 decrease'

  - number: 7
    stem: >-
      In the figure above, $\angle PQR = 60^{\circ}$, $\angle QPR = 90^{\circ}$,
      $\angle PRS = 90^{\circ}$, $\angle RPS = 45^{\circ}$ and $QR = 8$ cm. Determine $PS$.
    options:
      A: '$2\sqrt{3}$ cm'
      B: '$4\sqrt{6}$ cm'
      C: '$2\sqrt{6}$ cm'
      D: '$8\sqrt{6}$ cm'
      E: '8 cm'
    needs_figure: true
    figure_svg: |
      <svg viewBox="0 0 320 232" width="320" height="232" role="img"
           aria-label="Quadrilateral P Q R S: P R is perpendicular to P Q and to R S; the angle at Q is 60 degrees, the angle R P S is 45 degrees and Q R is 8 cm">
        <path d="M192.4 40.0 L280.4 40.0 L192.4 192.4 L40.0 192.4 Z" fill="none" stroke="#1a1a1f" stroke-width="1.8"/><path d="M192.4 40.0 L192.4 192.4" fill="none" stroke="#1a1a1f" stroke-width="1.7"/><path d="M201.4 40.0 L201.4 49.0 L192.4 49.0" fill="none" stroke="#1a1a1f" stroke-width="1.2"/><path d="M192.4 183.4 L183.4 183.4 L183.4 192.4" fill="none" stroke="#1a1a1f" stroke-width="1.2"/><path d="M269.42 59.05 A22 22 0 0 1 258.42 40.00" fill="none" stroke="#b91c1c" stroke-width="1.5"/><path d="M192.42 70.00 A30 30 0 0 1 171.21 61.21" fill="none" stroke="#b91c1c" stroke-width="1.5"/><g fill="#1a1a1f"><circle cx="192.4" cy="40.0" r="3.2"/><circle cx="280.4" cy="40.0" r="3.2"/><circle cx="192.4" cy="192.4" r="3.2"/><circle cx="40.0" cy="192.4" r="3.2"/></g><text x="188.4" y="31.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">P</text><text x="286.4" y="36.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">Q</text><text x="196.4" y="210.4" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">R</text><text x="24.0" y="198.4" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">S</text><text x="240.4" y="60.0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">60°</text><text x="158.4" y="84.0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">45°</text><text x="272.4" y="110.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">8 cm</text>
      </svg>

  - number: 8
    stem: >-
      Given that $\cos z = L$, where $z$ is an acute angle, find an expression for
      $\dfrac{\cot z - \operatorname{cosec} z}{\sec z + \tan z}$.
    options:
      A: '$\dfrac{1 - L}{1 + L}$'
      B: '$\dfrac{L^{2} - L}{1 - L^{2} + \sqrt{1 - L^{2}}}$'
      C: '$\dfrac{L - L^{2}}{1 - L^{2} + \sqrt{1 - L^{2}}}$'
      D: '$\dfrac{L^{2} - L}{1 + L^{2} + \sqrt{1 - L^{2}}}$'
      E: '$\dfrac{L - L^{2}}{1 + \sqrt{1 - L^{2}}}$'
    corrected: >-
      the stem is legible once its "Co+Z" is read as cot z, but the options are not — they
      mix stray letters and radicals ("L²−√1−L²", "(C1+L)+√1−L²") and none can be read as a
      definite expression. Options B to E are rebuilt around the true value, with the sign
      and the denominator as the distractors; A is kept as printed. Treat the options as a
      reconstruction.

  - number: 9
    stem: >-
      If $0.0000152 \times 0.00042 = A \times 10^{B}$, where $1 \le A < 10$, find $A$ and $B$.
    options:
      A: '$A = 9$, $B = 6.38$'
      B: '$A = 6.38$, $B = -9$'
      C: '$A = 6.38$, $B = 9$'
      D: '$A = 6.38$, $B = -1$'
      E: '$A = 6.38$, $B = 1$'

  - number: 10
    stem: >-
      If $x + 2$ and $x - 1$ are factors of the expression $lx^{3} + 2kx^{2} + 24$, find the
      values of $l$ and $k$.
    options:
      A: '$l = -6$, $k = -9$'
      B: '$l = -2$, $k = 1$'
      C: '$l = -2$, $k = -1$'
      D: '$l = 0$, $k = 1$'
      E: '$l = 6$, $k = 0$'
    corrected: >-
      the paper prints the first term as lx; with it the expression is a quadratic and gives
      l = −12, k = −6, not an option. The cube restores the cubic that the answer A fits.

  - number: 11
    stem: >-
      Make $T$ the subject of the equation
      $\dfrac{av}{1 - v} = \sqrt[3]{\dfrac{2v + T}{2aT}}$
    options:
      A: '$T = \dfrac{3av}{1 - v}$'
      B: '$T = \dfrac{2v(1 - v)^{2}}{2a^{2}v^{2} - (1 - v)^{2}}$'
      C: '$T = \dfrac{2v(1 - v)^{2}}{2a^{3}v^{2} + (1 - v)^{2}}$'
      D: '$T = \dfrac{2v(1 - v)^{3}}{2a^{4}v^{3} - (1 - v)^{3}}$'
      E: '$T = \dfrac{2v(1 - v)^{3}}{2a^{4}v^{3} + (1 - v)^{3}}$'
    corrected: >-
      the paper's equation and options are both garbled: the equation reads
      "av/(1−V) = ∛(2V/a + T/2T)" and the options run fractions together without bars. The
      cube root, the powers a⁴v³ and (1 − v)³ in the options, and the 2v in their numerators
      point to this equation, whose solution is option D; the options are rebuilt on it.
      Treat the question as a reconstruction.

  - number: 12
    stem: >-
      In a class of 60 pupils, the statistical distribution of the number of pupils offering
      Biology, History, French, Geography and Additional Mathematics is as shown in the pie
      chart above. How many pupils offer Additional Mathematics?
    options:
      A: "15"
      B: "10"
      C: "18"
      D: "12"
      E: "28"
    needs_figure: true
    figure_svg: |
      <svg viewBox="0 0 320 300" width="320" height="300" role="img"
           aria-label="Pie chart of 60 pupils by subject: Biology (3x minus 18) degrees, History (2x plus 12), French (x plus 12), Geography x and Additional Mathematics (2x minus 24)">
        <path d="M160.0 150.0 L160.0 35.0 A115.0 115.0 0 0 1 269.4 185.5 Z" fill="none" fill-opacity="0.18" stroke="#1a1a1f" stroke-width="1.6"/><path d="M160.0 150.0 L269.4 185.5 A115.0 115.0 0 0 1 113.2 255.1 Z" fill="none" fill-opacity="0.18" stroke="#1a1a1f" stroke-width="1.6"/><path d="M160.0 150.0 L113.2 255.1 A115.0 115.0 0 0 1 47.5 173.9 Z" fill="none" fill-opacity="0.18" stroke="#1a1a1f" stroke-width="1.6"/><path d="M160.0 150.0 L47.5 173.9 A115.0 115.0 0 0 1 60.4 92.5 Z" fill="none" fill-opacity="0.18" stroke="#1a1a1f" stroke-width="1.6"/><path d="M160.0 150.0 L60.4 92.5 A115.0 115.0 0 0 1 160.0 35.0 Z" fill="#3f2fa8" fill-opacity="0.18" stroke="#1a1a1f" stroke-width="1.6"/><text x="215.8" y="106.4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1a1a1f">Biology</text><text x="215.8" y="120.4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#b91c1c">(3x − 18)°</text><text x="188.1" y="210.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1a1a1f">History</text><text x="188.1" y="224.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#b91c1c">(2x + 12)°</text><text x="106.4" y="190.4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1a1a1f">French</text><text x="106.4" y="204.4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#b91c1c">(x + 12)°</text><text x="91.8" y="136.2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1a1a1f">Geography</text><text x="91.8" y="150.2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#b91c1c">x°</text><text x="125.5" y="87.2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1a1a1f">Add. Maths</text><text x="125.5" y="101.2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#b91c1c">(2x − 24)°</text>
      </svg>

  - number: 13
    stem: 'The value of $(0.3)^{3} - (0.2)^{3}$ is'
    options:
      A: "0.019"
      B: "0.0019"
      C: "0.00019"
      D: "0.000019"
      E: "0.000035"
    corrected: >-
      the paper prints "(0.303)³ − (0.02)³", which is about 0.0278 and matches no option. The
      options are the digits 19 at different decimal places, which (0.3)³ − (0.2)³ = 0.019
      gives exactly; the brackets and exponents have been run into the numbers.

  - number: 14
    stem: >-
      $y$ varies partly as the square of $x$ and partly as the inverse of the square root of
      $x$. Write down the expression for $y$ if $y = 2$ when $x = 1$ and $y = 6$ when $x = 4$.
    options:
      A: '$y = \dfrac{10x^{2}}{31} + \dfrac{52}{31\sqrt{x}}$'
      B: '$y = x^{2} + \dfrac{1}{\sqrt{x}}$'
      C: '$y = x^{2} + \dfrac{1}{x}$'
      D: '$y = \dfrac{x^{2}}{31} + \dfrac{1}{31\sqrt{x}}$'
      E: '$y = \dfrac{10}{31}\left(x^{2} + \dfrac{1}{\sqrt{x}}\right)$'

  - number: 15
    stem: 'Simplify $\dfrac{x - 7}{x^{2} - 9} \times \dfrac{x^{2} - 3x}{x^{2} - 49}$'
    options:
      A: '$\dfrac{x}{(x - 3)(x + 7)}$'
      B: '$\dfrac{(x + 3)(x + 7)}{x}$'
      C: '$\dfrac{x}{(x - 3)(x - 7)}$'
      D: '$\dfrac{x}{(x + 3)(x + 7)}$'
      E: '$\dfrac{x}{(x + 4)(x + 7)}$'

  - number: 16
    stem: >-
      The lengths of the sides of a right-angled triangle are $(3x + 1)$ cm, $(3x - 1)$ cm and
      $x$ cm. Find $x$.
    options:
      A: "2"
      B: "6"
      C: "18"
      D: "12"
      E: "0"

  - number: 17
    stem: >-
      The scores of a set of final-year students in the first-semester examination in a paper
      are 41, 29, 55, 21, 47, 70, 70, 40, 43, 56, 73, 23, 50, 50. Find the median of the
      scores.
    options:
      A: "47"
      B: '$48\tfrac{1}{2}$'
      C: "50"
      D: "48"
      E: "49"

  - number: 18
    stem: 'Which of the following equations represents the graph above?'
    options:
      A: '$y = 1 + 2x + 3x^{2}$'
      B: '$y = 1 - 2x + 3x^{2}$'
      C: '$y = 1 + 2x - 3x^{2}$'
      D: '$y = 1 - 2x - 3x^{2}$'
      E: '$y = 3x^{2} + 2x - 1$'
    needs_figure: true
    corrected: >-
      the paper prints option C as "1 + 2x3x²", its sign lost; it is 1 + 2x − 3x². Its graph
      also misnumbers the positive x-axis (3, 2, 1 running outwards); the figure below is
      drawn from the equation.
    figure_svg: |
      <svg viewBox="0 0 360 300" width="360" height="300" role="img"
           aria-label="A parabola opening downwards that crosses the y-axis at 1 and the x-axis at minus 1 and one third">
