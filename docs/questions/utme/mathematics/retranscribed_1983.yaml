  - number: 19
    stem: >-
      The figure above, $FGHK$, is a rhombus, and $\angle GKF = 30^{\circ}$. What is the value
      of the angle $x = \angle KHG$?
    options:
      A: '$90^{\circ}$'
      B: '$30^{\circ}$'
      C: '$150^{\circ}$'
      D: '$120^{\circ}$'
      E: '$60^{\circ}$'
    needs_figure: true
    figure_svg: |
      <svg viewBox="0 0 320 219" width="320" height="219" role="img"
           aria-label="Rhombus F G H K with diagonal K G; the angle G K F is 30 degrees and x is the angle at H">
        <path d="M40.0 178.6 L200.0 178.6 L280.0 40.0 L120.0 40.0 Z" fill="none" stroke="#1a1a1f" stroke-width="1.8"/><path d="M40.0 178.6 L280.0 40.0" fill="none" stroke="#1a1a1f" stroke-width="1.7"/><path d="M74.64 158.56 A40 40 0 0 1 80.00 178.56" fill="none" stroke="#b91c1c" stroke-width="1.5"/><path d="M144.00 40.00 A24 24 0 0 1 108.00 60.78" fill="none" stroke="#3f2fa8" stroke-width="1.7"/><g fill="#1a1a1f"><circle cx="40.0" cy="178.6" r="3.2"/><circle cx="200.0" cy="178.6" r="3.2"/><circle cx="280.0" cy="40.0" r="3.2"/><circle cx="120.0" cy="40.0" r="3.2"/></g><text x="24.0" y="184.6" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">K</text><text x="206.0" y="192.6" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">F</text><text x="286.0" y="36.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">G</text><text x="114.0" y="31.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">H</text><text x="84.0" y="174.6" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">30°</text><text x="132.0" y="66.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#3f2fa8" font-style="italic">x</text>
      </svg>

  - number: 20
    stem: >-
      $PQRS$ is a desk of dimensions 2 m × 0.8 m which is inclined at $30^{\circ}$ to the
      horizontal along its 2 m edge $PQ$. Find the inclination of the diagonal $PR$ to the
      horizontal.
    options:
      A: '$23^{\circ}35''$'
      B: '$30^{\circ}$'
      C: '$15^{\circ}36''$'
      D: '$10^{\circ}$'
      E: '$10^{\circ}42''$'
    needs_figure: true
    corrected: >-
      the paper gives the inclination as "300"; it is 30°, its degree sign set as a zero.
    figure_svg: |
