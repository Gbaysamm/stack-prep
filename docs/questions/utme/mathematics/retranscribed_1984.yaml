  - number: 29
    stem: >-
      The sides of a triangle are $(x + 4)$ cm, $x$ cm and $(x - 4)$ cm respectively. If the
      cosine of the largest angle is $\tfrac{1}{5}$, find the value of $x$.
    options:
      A: '24 cm'
      B: '20 cm'
      C: '28 cm'
      D: '$\tfrac{88}{7}$ cm'
      E: '0 cm'

  - number: 30
    stem: >-
      If $a = \dfrac{2x}{1 - x}$ and $b = \dfrac{1 + x}{1 - x}$, then $a^{2} - b^{2}$ in its
      simplest form is
    options:
      A: '$\dfrac{3x + 1}{x - 1}$'
      B: '$\dfrac{3x^{2} - 1}{(x - 1)^{2}}$'
      C: '$\dfrac{3x^{2} + 1}{(1 - x)^{2}}$'
      D: '$\dfrac{5x^{2} - 1}{(1 - x)^{2}}$'
      E: '$\dfrac{5x^{2} - 2x - 1}{(1 - x)^{2}}$'

  - number: 31
    stem: 'Simplify $\left(1 + \dfrac{x - 1}{x + 1}\right)(x + 2)$'
    options:
      A: '$(x^{2} - 1)(x + 2)$'
      B: '$\dfrac{x^{2}(x + 2)}{x + 1}$'
      C: '$x^{2} - (x + 2)$'
      D: '$2x(x + 2)$'
      E: '$\dfrac{2x(x + 2)}{x + 1}$'
    corrected: >-
      the paper sets the fraction inside the bracket with its numerator, x − 1, on a line of
      its own above the question and prints "1" in its place.

  - number: 32
    stem: >-
      In the figure above, $PQRSTW$ is a regular hexagon. $QS$ intersects $RT$ at $V$.
      Calculate $\angle TVS$.
    options:
      A: '$60^{\circ}$'
      B: '$90^{\circ}$'
      C: '$120^{\circ}$'
      D: '$30^{\circ}$'
      E: '$80^{\circ}$'
    needs_figure: true
    figure_svg: |
      <svg viewBox="0 0 260 240" width="260" height="240" role="img"
           aria-label="A regular hexagon P Q R S T W with the diagonals Q S and R T crossing at V">
