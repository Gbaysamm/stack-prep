        <path d="M152.37 93.83 A18 18 0 0 1 121.20 94.54" fill="none" stroke="#b91c1c" stroke-width="1.5"/>
        <path d="M64.18 129.22 A40 40 0 0 1 70.00 150.00" fill="none" stroke="#3f2fa8" stroke-width="1.7"/>
        <g fill="#1a1a1f"><circle cx="136.6" cy="85.2" r="3.2"/><circle cx="30.0" cy="150.0" r="3.2"/><circle cx="255.0" cy="150.0" r="3.2"/></g>
        <text x="131.6" y="76.2" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">X</text><text x="14.0" y="156.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">Y</text><text x="262.0" y="156.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">Z</text>
        <text x="122.6" y="119.2" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">120°</text><text x="196.6" y="105.2" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">3 cm</text><text x="130.0" y="168.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">5 cm</text>
        <text x="74.0" y="144.0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#3f2fa8">?</text>
