# UTME 1984 Mathematics — re-transcribed by hand from MATHEMATICS-questions.pdf, pages 5-9.
#
# All 50 questions. This is a five-option paper (A-E). It starts part-way down page 5,
# below the end of the 1983 paper, and ends at the top of page 9, above the 1985 paper.
#
# keys_1984.yaml answered 24 and set aside the rest; all 24 agree with this file. The rest
# resolve from the page images. Two are rebuilt, and their notes say so: Q25 (no option is a
# multiple of its printed prism length) and Q35 (its text belongs to a figure the paper
# never prints — the figure printed under it is Q38's).
source:
  file: docs/questions/utme/mathematics/MATHEMATICS-questions.pdf
  exam_year: 1984
  paper_label: UTME 1984 Mathematics (objective)
  paper_code: UTME-1984-MATH
  pages: [5, 6, 7, 8, 9]
  transcribed_by: hand
  answer_source: unverified

questions:
  - number: 1
    stem: >-
      Simplify $\dfrac{\left(\frac{2}{3} - \frac{1}{5}\right) - \frac{1}{3} \text{ of }
      \frac{2}{5}}{3 - \dfrac{1}{1/2}}$
    options:
      A: '$\tfrac{1}{7}$'
      B: "7"
      C: '$\tfrac{1}{3}$'
      D: "3"
      E: '$\tfrac{1}{5}$'

  - number: 2
    stem: 'If $263 + 441 = 714$, what number base has been used?'
    options:
      A: "12"
      B: "11"
      C: "10"
      D: "9"
      E: "8"

  - number: 3
    stem: >-
      $\dfrac{0.00014323}{1{,}940{,}000} = k \times 10^{n}$, where $1 \le k < 10$ and $n$ is a
      whole number. The values of $k$ and $n$ are
    options:
      A: '7.383 and −11'
      B: '2.34 and 10'
      C: '3.87 and 2'
      D: '7.831 and −11'
      E: '5.41 and −2'
    corrected: >-
      the paper prints the divisor as 1.940000, its thousands separators set as points; read
      as 1.94 the quotient is 7.38 × 10⁻⁵, and no option has n = −5, while every serious
      option has −11. The paper also prints option A as 7.381; the quotient is 7.383 (it is
      0.73830… × 10⁻¹⁰), and D's 7.831 is the digit-swapped distractor.

  - number: 4
    stem: >-
      P sold his bicycle to Q at a profit of 10%. Q sold it to R for ₦209 at a loss of 5%. How
      much did the bicycle cost P?
    options:
      A: '₦200'
      B: '₦196'
      C: '₦180'
      D: '₦205'
      E: '₦150'

  - number: 5
    stem: >-
      If the price of oranges was raised by $\tfrac{1}{2}$k per orange, the number of oranges a
      customer can buy for ₦2.40 will be less by 16. What is the present price of an orange?
    options:
      A: '$2\tfrac{1}{2}$k'
      B: '$3\tfrac{1}{2}$k'
      C: '$5\tfrac{1}{2}$k'
      D: '20k'
      E: '$21\tfrac{1}{2}$k'

  - number: 6
    stem: >-
      A man invested a total of ₦50,000 in two companies. If these companies pay dividends of
      6% and 8% respectively, how much did he invest at 8% if the total yield is ₦3,700?
    options:
      A: '₦15,000'
      B: '₦29,600'
      C: '₦21,400'
      D: '₦27,800'
      E: '₦35,000'
    corrected: >-
      the paper prints the yield as "₦3.700", its thousands separator set as a point.

  - number: 7
    stem: >-
      Thirty boys and $x$ girls sat for a test. The mean of the boys' scores and that of the
      girls were respectively 6 and 8. Find $x$ if the total score was 468.
    options:
      A: "38"
      B: "24"
      C: "36"
      D: "22"
      E: "41"

  - number: 8
    stem: >-
      The cost of production of an article is made up as follows: labour ₦70, power ₦15,
      materials ₦30 and miscellaneous ₦5. Find the angle of the sector representing labour in
      a pie chart.
    options:
      A: '$210^{\circ}$'
      B: '$105^{\circ}$'
      C: '$175^{\circ}$'
      D: '$150^{\circ}$'
      E: '$90^{\circ}$'

  - number: 9
    stem: >-
      Bola chooses at random a number from 1 to 300. What is the probability that the number
      is divisible by 4?
    options:
      A: '$\tfrac{1}{3}$'
      B: '$\tfrac{1}{4}$'
      C: '$\tfrac{1}{5}$'
      D: '$\tfrac{4}{300}$'
      E: '$\tfrac{1}{300}$'

  - number: 10
    stem: >-
      Find, without using logarithm tables, the value of
      $\dfrac{\log_{3}27 - \log_{1/4}64}{\log_{3}\frac{1}{81}}$
    options:
      A: '$\tfrac{7}{4}$'
      B: '$-\tfrac{7}{4}$'
      C: '$-\tfrac{3}{2}$'
      D: '$\tfrac{7}{3}$'
      E: '$-\tfrac{1}{4}$'

  - number: 11
    stem: >-
      A variable point $P(x, y)$ traces a graph in a two-dimensional plane. $(0, -3)$ is one
      position of $P$. If $x$ increases by 1 unit, $y$ increases by 4 units. The equation of
      the graph is
    options:
      A: '$-3 = \dfrac{y + 4}{x + 1}$'
      B: '$4y = -3 + x$'
      C: '$\dfrac{y}{x} = -\dfrac{3}{4}$'
      D: '$y + 3 = 4x$'
      E: '$4y = x + 3$'

  - number: 12
    stem: >-
      A trader in a country where the currency, the MONT (M), is in base five bought
      $103_{5}$ oranges at $\text{M}14_{5}$ each. If he sold the oranges at $\text{M}24_{5}$
      each, what will be his gain?
    options:
      A: '$\text{M}103_{5}$'
      B: '$\text{M}1030_{5}$'
      C: '$\text{M}102_{5}$'
      D: '$\text{M}2002_{5}$'
      E: '$\text{M}3032_{5}$'

  - number: 13
    stem: 'Rationalize $\dfrac{5\sqrt{7} - 7\sqrt{5}}{\sqrt{7} - \sqrt{5}}$'
    options:
      A: '$-2\sqrt{35}$'
      B: '$4\sqrt{7} - 6\sqrt{5}$'
      C: '$-\sqrt{35}$'
      D: '$4\sqrt{7} - 8\sqrt{5}$'
      E: '$\sqrt{35}$'
    corrected: >-
      the paper prints the numerator as 5√5 − 7√5, which is just −2√5 and gives no option.
      With 5√7 the numerator and denominator share structure, and the result is exactly the
      offered −√35.

  - number: 14
    stem: 'Simplify $\dfrac{3^{n} - 3^{n-1}}{3^{3} \times 3^{n} - 27 \times 3^{n-1}}$'
    options:
      A: "1"
      B: "0"
      C: '$\tfrac{1}{27}$'
      D: '$3^{n} - 3^{n-1}$'
      E: '$\tfrac{2}{27}$'

  - number: 15
    stem: >-
      $p$ varies directly as the square of $q$ and inversely as $r$. If $p = 36$ when $q = 3$
      and $r = 4$, find $p$ when $q = 5$ and $r = 2$.
    options:
      A: "72"
      B: "100"
      C: "90"
      D: "200"
      E: "125"
    corrected: >-
      the paper prints "r = p" in the first condition. It is a 4: that value, and only a
      whole-number value near it, makes the answer one of the options (200).

  - number: 16
    stem: 'Factorise $6x^{2} - 14x - 12$'
    options:
      A: '$2(x + 3)(3x - 2)$'
      B: '$6(x - 2)(x + 1)$'
      C: '$2(x - 3)(3x + 2)$'
      D: '$6(x + 2)(x - 1)$'
      E: '$(3x + 4)(2x + 3)$'

  - number: 17
    stem: >-
      A straight line $y = mx$ meets the curve $y = x^{2} - 12x + 40$ in two distinct points.
      If one of them is $(5, 5)$, find the other.
    options:
      A: '(5, 6)'
      B: '(8, 8)'
      C: '(8, 5)'
      D: '(7, 7)'
      E: '(7, 5)'

  - number: 18
    stem: >-
      The table below is drawn for the graph of $y = x^{2} - 3x + 1$.
      $$\begin{array}{|c|c|c|c|c|c|c|c|}\hline
      x & -3 & -2 & -1 & 0 & 1 & 2 & 3 \\ \hline
      y & 19 & 11 & 5 & 1 & -1 & -1 & 1 \\ \hline\end{array}$$
      From $x = -2$ to $x = 1$, the graph crosses the $x$-axis in the range(s)
    options:
      A: '$-1 < x < 0$ and $0 < x < 1$'
      B: '$-2 < x < -1$ and $0 < x < 1$'
      C: '$-1 < x < 0$ only'
      D: '$0 < x < 1$'
      E: '$1 < x < 2$'
    corrected: >-
      the paper's table prints the y-row as 1, −1, 3, 1, −1, 3, 1, which does not come from
      y = x² − 3x + 1 at most of its points; the row is recomputed from the equation. Its
      options B and C are printed identically, and C is given "−1 < x < 0 only".

  - number: 19
    stem: >-
      In a racing competition, Musa covered a distance of $5x$ km in the first hour and
      $(x + 10)$ km in the next hour. He was second to Ngozi, who covered a total distance of
      118 km in the two hours. Which of the following inequalities is correct?
    options:
      A: '$0 < -x < 15$'
      B: '$-3 < x < 3$'
      C: '$15 < x < 18$'
      D: '$0 < x < 15$'
      E: '$0 < x < 18$'

  - number: 20
    stem: 'If $2x + 3y = 1$ and $x - 2y = 11$, find $x + y$.'
    options:
      A: "5"
      B: "-3"
      C: "8"
      D: "2"
      E: "-2"
    corrected: >-
      the paper prints the second equation as "y = x − 2y = 11", a stray "y =" in front.

  - number: 21
    stem: >-
      Tunde and Shola can do a piece of work together in 18 days. Tunde can do it alone in $x$
      days, whilst Shola takes 15 days longer to do it alone. Which of the following equations
      is satisfied by $x$?
    options:
      A: '$x^{2} - 5x - 18 = 0$'
      B: '$x^{2} - 20x + 360 = 0$'
      C: '$x^{2} - 21x - 270 = 0$'
      D: '$2x^{2} + 42x - 190 = 0$'
      E: '$3x^{2} - 31x + 150 = 0$'

  - number: 22
    stem: >-
      If $f(x) = 2(x - 3)^{2} + 3(x - 3) - 5$ and $g(y) = \sqrt{5 + y}$, find $g(f(3))$ and
      $g(f(4))$.
    options:
      A: '3 and 4'
      B: '−3 and 4'
      C: '−3 and −4'
      D: '3 and −4'
      E: '0 and $\sqrt{5}$'
    corrected: >-
      the paper prints the constant in f as −4, which gives g(f(3)) = 1 and g(f(4)) = √6 —
      not an option. With −5 the two values are exactly the offered 0 and √5. This is the
      smallest change that reaches an option; either constant could have been misprinted.

  - number: 23
    stem: >-
      The quadratic equation whose roots are $1 - \sqrt{13}$ and $1 + \sqrt{13}$ is
    options:
      A: '$x^{2} + (1 - \sqrt{13})x + 1 + \sqrt{13} = 0$'
      B: '$x^{2} + (1 - \sqrt{13})x + 1 - \sqrt{13} = 0$'
      C: '$x^{2} + 2x + 12 = 0$'
      D: '$x^{2} - 2x + 12 = 0$'
      E: '$x^{2} - 2x - 12 = 0$'

  - number: 24
    stem: >-
      Find a factor which is common to all three binomial expressions $4a^{2} - 9b^{2}$,
      $8a^{3} + 27b^{3}$, $(4a + 6b)^{2}$.
    options:
      A: '$4a + 6b$'
      B: '$4a - 6b$'
      C: '$2a + 3b$'
      D: '$2a - 3b$'
      E: 'none'
    corrected: >-
      the paper prints the second expression as a³ + 27b³, whose factors (a + 3b) and
      (a² − 3ab + 9b²) share nothing with the other two, making "none" the answer. With 8a³
      it is (2a)³ + (3b)³, which has the factor 2a + 3b that the other two share — the common
      factor the options are built around.

  - number: 25
    stem: >-
      The figure above is a right triangular prism. Its uniform cross-section is a
      right-angled triangle whose hypotenuse is 5 cm and one of whose shorter sides is 4 cm,
      and the prism is 8 cm long. What is its volume?
    options:
      A: '$160\ \text{cm}^{3}$'
      B: '$48\ \text{cm}^{3}$'
      C: '$96\ \text{cm}^{3}$'
      D: '$120\ \text{cm}^{3}$'
      E: '$40\ \text{cm}^{3}$'
    needs_figure: true
    corrected: >-
      the paper labels the prism 11 cm long, but no option is a multiple of 11, so no
      cross-section can give any of them. This stem is a reconstruction: it keeps the 5 cm and
      4 cm of the figure as the hypotenuse and a leg of the right-angled cross-section (area
      6 cm²), and uses a length of 8 cm.
    figure_svg: |
      <svg viewBox="0 0 330 230" width="330" height="230" role="img"
           aria-label="A right triangular prism 8 cm long whose cross-section is a right-angled triangle with hypotenuse 5 cm and one shorter side 4 cm">
        <path d="M40.0 200.0 L128.0 134.0 L128.0 200.0 Z" fill="#3f2fa8" fill-opacity="0.14" stroke="none"/>
        <g fill="none" stroke="#1a1a1f" stroke-width="1.7">
          <path d="M40.0 200.0 L128.0 134.0 M128.0 134.0 L280.0 70.0 M280.0 70.0 L192.0 136.0 M192.0 136.0 L40.0 200.0 M280.0 70.0 L280.0 136.0 M280.0 136.0 L192.0 136.0 M40.0 200.0 L128.0 200.0 M128.0 200.0 L128.0 134.0"/>
        </g>
        <g fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="5 4"><path d="M128.0 200.0 L280.0 136.0"/></g>
        <path d="M120.0 200.0 L120.0 192.0 L128.0 192.0" fill="none" stroke="#1a1a1f" stroke-width="1.2"/>
        <text x="124.0" y="125.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">P</text><text x="24.0" y="206.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">Q</text><text x="186.0" y="154.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">R</text><text x="286.0" y="66.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">S</text><text x="286.0" y="148.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">T</text>
        <text x="60.0" y="160.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">5 cm</text><text x="70.0" y="216.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">4 cm</text><text x="106.0" y="106.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">8 cm</text>
      </svg>

  - number: 26
    stem: >-
      If $(x - 2)$ and $(x + 1)$ are factors of the expression $x^{3} + px^{2} + qx + 1$, what
      is the sum of $p$ and $q$?
    options:
      A: "0"
      B: "-3"
      C: "3"
      D: '$-\tfrac{17}{3}$'
      E: '$-\tfrac{2}{3}$'

  - number: 27
    stem: >-
      A cone is formed by bending a sector of a circle having an angle of $210^{\circ}$. Find
      the radius of the base of the cone if the diameter of the circle is 12 cm.
    options:
      A: '7.00 cm'
      B: '1.75 cm'
      C: '$\sqrt{21}$ cm'
      D: '3.50 cm'
      E: '$2\sqrt{21}$ cm'
    corrected: >-
      the paper repeats a clause ("if the diameter of the circle is base of the cone if the
      diameter of the circle is 12 cm"); the duplicate is removed.

  - number: 28
    stem: >-
      Using $\triangle XYZ$ in the figure above, in which $\angle YXZ = 120^{\circ}$,
      $XZ = 3$ cm and $YZ = 5$ cm, find $\angle XYZ$.
    options:
      A: '$29^{\circ}$'
      B: '$31^{\circ}20''$'
      C: '$31^{\circ}$'
      D: '$31^{\circ}18''$'
      E: '$59^{\circ}$'
    needs_figure: true
    figure_svg: |
      <svg viewBox="0 0 290 180" width="290" height="180" role="img"
           aria-label="Triangle X Y Z with the angle at X 120 degrees, X Z 3 cm and Y Z 5 cm">
