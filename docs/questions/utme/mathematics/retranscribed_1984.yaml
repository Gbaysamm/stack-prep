        </g>
        <path d="M195.74 133.86 A16 16 0 0 1 179.74 133.86" fill="none" stroke="#3f2fa8" stroke-width="1.7"/>
        <g fill="#1a1a1f"><circle cx="43.4" cy="70.0" r="3.2"/><circle cx="130.0" cy="20.0" r="3.2"/><circle cx="216.6" cy="70.0" r="3.2"/><circle cx="216.6" cy="170.0" r="3.2"/><circle cx="130.0" cy="220.0" r="3.2"/><circle cx="43.4" cy="170.0" r="3.2"/><circle cx="187.7" cy="120.0" r="3.2"/></g>
        <text x="27.4" y="70.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">P</text><text x="126.0" y="11.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">Q</text><text x="223.6" y="70.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">R</text><text x="223.6" y="180.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">S</text>
        <text x="126.0" y="240.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">T</text><text x="25.4" y="180.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">W</text><text x="169.7" y="124.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">V</text>
      </svg>

  - number: 33
    stem: 'Find the integral values of $x$ which satisfy the inequalities $-3 < 2 - 5x < 12$'
    options:
      A: '−2, −1'
      B: '−2, 2'
      C: '−1, 0'
      D: '0, 1'
      E: '1, 2'

  - number: 34
    stem: >-
      Find the area of the shaded portion of the semicircular figure above, in which three
      equilateral triangles of side $r$ are drawn from the centre of a semicircle of radius
      $r$.
    options:
      A: '$\dfrac{r^{2}}{4}(4\pi - 3\sqrt{3})$'
      B: '$\dfrac{r^{2}}{4}(2\pi - 3\sqrt{3})$'
      C: '$\tfrac{1}{2}\pi r^{2}$'
      D: '$\tfrac{1}{8}r\sqrt{3}$'
      E: '$\dfrac{r^{2}}{8}(4\pi + 3\sqrt{3})$'
    needs_figure: true
    corrected: >-
      the paper sets π as "p" throughout and prints option B as r²/4(2π + 3√3). The shaded
      area is the semicircle minus the three triangles, r²/4(2π − 3√3); no option was correct
      as printed, and B has lost its minus sign.
    figure_svg: |
      <svg viewBox="0 0 280 150" width="280" height="150" role="img"
