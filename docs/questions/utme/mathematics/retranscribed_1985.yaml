      E: "17"

  - number: 26
    stem: >-
      In $\triangle XYZ$, $XY = 13$ cm, $YZ = 9$ cm, $XZ = 11$ cm and $\angle XYZ =
      \theta^{\circ}$. Find $\cos\theta^{\circ}$.
    options:
      A: '$\tfrac{4}{39}$'
      B: '$\tfrac{43}{39}$'
      C: '$\tfrac{209}{286}$'
      D: '$\tfrac{1}{6}$'
      E: '$\tfrac{43}{78}$'

  - number: 27
    stem: >-
      Find the missing value in the table below.
      $$\begin{array}{|c|c|c|c|c|c|c|}\hline
      x & -2 & -1 & 0 & 1 & 2 & 3 \\ \hline
      y = x^{3} - x + 3 & & 3 & 3 & 3 & 9 & 27 \\ \hline\end{array}$$
    options:
      A: "-3"
      B: "-14"
      C: "40"
      D: "22"
      E: "37"
    corrected: >-
      the paper labels the row y = x² − x + 3, but the printed values (3, 3, 3, 9, 27) fit
      y = x³ − x + 3 exactly — the image even shows a 2 overprinted on a 3. That makes the
      missing value −3, which no option carries; option A, printed −32, is corrected to −3.

  - number: 28
    stem: >-
      The number of goals scored by a football team in 20 matches is shown below.
