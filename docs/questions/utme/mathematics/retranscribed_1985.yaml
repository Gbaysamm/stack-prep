      \text{No. of goals} & 0 & 1 & 2 & 3 & 4 & 5 \\ \hline
      \text{No. of matches} & 3 & 5 & 7 & 4 & 1 & 0 \\ \hline\end{array}$$
      What are the values of the mean and the mode respectively?
    options:
