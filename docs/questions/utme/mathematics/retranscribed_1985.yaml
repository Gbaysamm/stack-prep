      B: '$(3, -4)$; $(-1, 4)$'
      C: '$(8, -4)$; $(-1, 4)$'
      D: '$(-8, 6)$; $(8, -2)$'
      E: '$(-4, 3)$; $(4, -1)$'

  - number: 24
    stem: 'Solve the simultaneous equations $2x - 3y + 10 = 10x - 6y = 5$'
    options:
