        <path d="M126.58 98.82 A20 20 0 0 1 126.58 121.18" fill="none" stroke="#3f2fa8" stroke-width="1.7"/>
        <g fill="#1a1a1f"><circle cx="110.0" cy="110.0" r="3.2"/><circle cx="184.6" cy="59.7" r="3.2"/><circle cx="184.6" cy="160.3" r="3.2"/><circle cx="218.6" cy="110.0" r="3.2"/></g>
        <text x="92.0" y="115.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">O</text><text x="182.6" y="50.7" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">Q</text><text x="182.6" y="180.3" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">R</text><text x="225.6" y="115.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">P</text>
