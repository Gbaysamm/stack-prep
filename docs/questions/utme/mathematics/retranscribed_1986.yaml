# UTME 1986 Mathematics — re-transcribed by hand from MATHEMATICS-questions.pdf, pages 12-15.
#
# All 50 questions. The paper starts part-way down page 12, below the end of the 1985 paper,
# and its last seven questions (44-50) sit at the top of page 15, above the 1987 paper.
#
# keys_1986.yaml answered 34 and set aside the rest; all 34 agree with this file. The rest
# resolve from the page images, though three have to be rebuilt: Q7 and Q14 (whose printed
# expressions reach no option under any reading) and Q8 (whose options cannot come from its
# numbers). Their notes say so.
source:
  file: docs/questions/utme/mathematics/MATHEMATICS-questions.pdf
  exam_year: 1986
  paper_label: UTME 1986 Mathematics (objective)
  paper_code: UTME-1986-MATH
  pages: [12, 13, 14, 15]
  transcribed_by: hand
  answer_source: unverified

questions:
  - number: 1
    stem: 'Evaluate $212_{3} - 121_{3} + 222_{3}$'
    options:
      A: '$313_{3}$'
      B: '$1000_{3}$'
      C: '$1020_{3}$'
      D: '$1222_{3}$'

  - number: 2
    stem: >-
      If Musa scored 75 in Biology instead of 57, his average mark in four subjects would
      have been 60. What was his total mark?
    options:
      A: "282"
      B: "240"
      C: "222"
      D: "210"

  - number: 3
    stem: 'Divide the L.C.M. of 48, 64 and 80 by their H.C.F.'
    options:
      A: "20"
      B: "30"
      C: "48"
      D: "60"

  - number: 4
    stem: 'Find the smallest number by which 252 can be multiplied to obtain a perfect square.'
    options:
      A: "2"
      B: "3"
      C: "5"
      D: "7"

  - number: 5
    stem: 'Find the reciprocal of $\dfrac{\tfrac{2}{3}}{\tfrac{1}{2} + \tfrac{1}{3}}$'
    options:
      A: '$\tfrac{4}{5}$'
      B: '$\tfrac{5}{4}$'
      C: '$\tfrac{2}{5}$'
      D: '$\tfrac{6}{7}$'

  - number: 6
    stem: >-
      Three boys shared some oranges. The first received $\tfrac{1}{3}$ of the oranges and the
      second received $\tfrac{2}{3}$ of the remainder. If the third boy received the remaining
      12 oranges, how many oranges did they share?
    options:
      A: "60"
      B: "54"
      C: "48"
      D: "42"

  - number: 7
    stem: >-
      If $P = 18$, $Q = 21$, $R = -6$ and $S = -4$, calculate $\dfrac{P - Q + 2S}{R^{3}}$
    options:
      A: '$-\tfrac{11}{216}$'
      B: '$\tfrac{11}{216}$'
      C: '$-\tfrac{43}{115}$'
      D: '$\tfrac{41}{116}$'
    corrected: >-
      the paper prints the expression as "(P − Q) + S²", which is 13 and matches no option.
      Every option is a fraction, and the two leading ones have 216 = 6³ underneath, so the
      expression was divided by R³; no reading using S² over R³ lands on ±11/216, but 2S does.
      This stem is a reconstruction, not a repair.

  - number: 8
    stem: 'Simplify $\dfrac{0.03 \times 4 \times 0.00064}{0.48 \times 0.012}$'
    options:
      A: '$1.3 \times 10^{-2}$'
      B: '$1.3 \times 10^{-3}$'
      C: '$7.5 \times 10^{1}$'
      D: '$7.5 \times 10^{-1}$'
    corrected: >-
      the stem is printed clearly and equals 1/75 ≈ 0.0133, but the four printed options —
      3.6 × 10², 36 × 10², 3.6 × 10³ and 3.6 × 10⁴ — cannot come from these numbers: no
      choice of multiplying or dividing by each of the five, and no shift of any decimal
      point, gives the digits 36. The options are rebuilt around the true value, with its
      reciprocal (75) and the power-of-ten slips as distractors.

  - number: 9
    stem: >-
      Udoh deposited ₦150.00 in the bank. At the end of 5 years the simple interest on the
      principal was ₦55.00. At what rate per annum was the interest paid?
    options:
      A: '11%'
      B: '$7\tfrac{1}{3}\%$'
      C: '5%'
      D: '$3\tfrac{1}{2}\%$'

  - number: 10
    stem: >-
      A number of pencils were shared out among Bisi, Sola and Tunde in the ratio 2 : 3 : 5
      respectively. If Bisi got 5, how many were shared out?
    options:
      A: "15"
      B: "25"
      C: "30"
      D: "50"

  - number: 11
    stem: >-
      The ages of Tosan and Isa differ by 6 and the product of their ages is 187. Write their
      ages in the form $(x, y)$, where $x > y$.
    options:
      A: '(12, 9)'
      B: '(23, 17)'
      C: '(17, 11)'
      D: '(18, 12)'

  - number: 12
    stem: >-
      In 1984, Ike was 24 years old and his father was 45 years old. In what year was Ike
      exactly half his father's age?
    options:
      A: "1982"
      B: "1981"
      C: "1979"
      D: "1978"

  - number: 13
    stem: >-
      Simplify $\left(\dfrac{1}{\sqrt{5} + \sqrt{3}} - \dfrac{1}{\sqrt{5} - \sqrt{3}}\right)
      \times \dfrac{1}{\sqrt{3}}$
    options:
      A: '$\dfrac{\sqrt{3}}{\sqrt{5}}$'
      B: '$-\dfrac{2}{\sqrt{3}}$'
      C: "-2"
      D: "-1"
    corrected: >-
      the paper prints the multiplier as "x −1/√3", which gives +1 and matches no option;
      without the stray minus it is exactly the offered −1.

  - number: 14
    stem: 'Find $n$ if $\log_{2}4 + \log_{2}7 - \log_{2}n = 1$'
    options:
      A: "10"
      B: "14"
      C: "27"
      D: "28"
    corrected: >-
      the paper prints "log₂4 + log₂Z − log₂n = −1". Z is a misprinted 7 (the options are
      built from 28 = 4 × 7), but even so the equation gives n = 56, which is not offered.
      With the right-hand side 1 it gives the offered 14. This stem is a reconstruction.

  - number: 15
    stem: >-
      Simplify $\dfrac{9^{\frac{1}{3}} \times 27^{-\frac{1}{2}}}{3^{-\frac{1}{6}} \times
      3^{-\frac{2}{3}}}$
    options:
      A: '$\tfrac{1}{3}$'
      B: "1"
      C: "3"
      D: "9"

  - number: 16
    stem: >-
      If $x$ varies directly as $y^{3}$ and $x = 2$ when $y = 1$, find $x$ when $y = 5$.
    options:
      A: "2"
      B: "10"
      C: "125"
      D: "250"

  - number: 17
    stem: 'Factorize completely $8a + 125ax^{3}$'
    options:
      A: '$(2a + 5x^{2})(4 + 25ax)$'
      B: '$a(2 + 5x)(4 - 10x + 25x^{2})$'
      C: '$(2a + 5x)(4 - 10ax + 25ax^{2})$'
      D: '$a(2 + 5x)(4 + 10ax + 25ax^{2})$'
    corrected: >-
      the paper prints the first term as 3a, which with 125ax³ is not a sum of cubes. Every
      option is built on 2 + 5x, whose cube pairs with 8, so the term is 8a. Option B also
      carries a stray a in its last term (25ax²), which is removed.

  - number: 18
    stem: 'If $y = \dfrac{x}{x - 3} + \dfrac{x}{x + 4}$, find $y$ when $x = -2$.'
    options:
      A: '$-\tfrac{3}{5}$'
      B: '$\tfrac{3}{5}$'
      C: '$-\tfrac{7}{5}$'
      D: '$\tfrac{7}{5}$'

  - number: 19
    stem: >-
      Find all the numbers $x$ which satisfy the inequality
      $\tfrac{1}{3}(x + 1) - 1 > \tfrac{1}{5}(x + 4)$
    options:
      A: '$x < 11$'
      B: '$x < -1$'
      C: '$x > 6$'
      D: '$x > 11$'

  - number: 20
    stem: 'Factorize $x^{2} + 2a + ax + 2x$'
    options:
      A: '$(x + 2a)(x + 1)$'
      B: '$(x + 2a)(x - 1)$'
      C: '$(x^{2} - 1)(x + a)$'
      D: '$(x + 2)(x + a)$'

  - number: 21
    stem: 'Solve the equation $3x^{2} + 6x - 2 = 0$'
    options:
      A: '$x = -1 \pm \tfrac{\sqrt{3}}{3}$'
      B: '$x = -1 \pm \tfrac{\sqrt{15}}{3}$'
      C: '$x = -2 \pm \tfrac{2\sqrt{3}}{3}$'
      D: '$x = -2 \pm \tfrac{2\sqrt{15}}{3}$'
    corrected: >-
      the paper prints option B as −1 ± √15/√3, which equals −1 ± √5; the quadratic formula
      gives −1 ± √15/3, the second root sign having become a radical.

  - number: 22
    stem: 'Simplify $\dfrac{1}{5x + 5} + \dfrac{1}{7x + 7}$'
    options:
      A: '$\dfrac{12}{35} + 7$'
      B: '$\dfrac{1}{35(x + 1)}$'
      C: '$\dfrac{12x}{35(x + 1)}$'
      D: '$\dfrac{12}{35x + 35}$'

  - number: 23
    stem: 'The curve $y = -x^{2} + 3x + 4$ intersects the coordinate axes at'
    options:
      A: '(4, 0), (0, 0), (−1, 0)'
      B: '(−4, 0), (0, 4), (1, 1)'
      C: '(0, 0), (0, 1), (1, 0)'
      D: '(0, 4), (4, 0), (−1, 0)'

  - number: 24
    stem: 'Factorize $(4a + 3)^{2} - (3a - 2)^{2}$'
    options:
      A: '$(a + 1)(a + 5)$'
      B: '$(a - 5)(7a - 1)$'
      C: '$(a + 5)(7a + 1)$'
      D: '$a(7a + 1)$'

  - number: 25
    stem: 'If $5^{(x + 2y)} = 5$ and $4^{(x + 3y)} = 16$, find $3^{(x + y)}$.'
    options:
      A: "0"
      B: "1"
      C: "3"
      D: "27"

  - number: 26
    stem: 'Simplify $\dfrac{1}{x - 2} + \dfrac{1}{x + 2} + \dfrac{2x}{x^{2} - 4}$'
    options:
      A: '$\dfrac{2x}{(x - 2)(x + 2)(x^{2} - 4)}$'
      B: '$\dfrac{2x}{x^{2} - 4}$'
      C: '$\dfrac{x}{x^{2} - 4}$'
      D: '$\dfrac{4x}{x^{2} - 4}$'

  - number: 27
    stem: 'Make $v$ the subject of the formula $S = \sqrt{\dfrac{6}{v} - \dfrac{w}{2}}$'
    options:
      A: '$v = \dfrac{6}{S^{2}} - \dfrac{12}{w}$'
      B: '$v = \dfrac{12}{2S^{2} - w}$'
      C: '$v = \dfrac{12}{w} - 2S^{2}$'
      D: '$v = \dfrac{12}{2S^{2} + w}$'
    corrected: >-
      the paper asks to make "r" the subject — a letter not in the formula; every option
      solves for v. It prints the formula without a root, but every option contains S², which
      only a square root around the right-hand side produces. Option B's "25²" is 2S².

  - number: 28
    stem: 'Find the values of $x$ which satisfy the equation $16^{x} - 5(4^{x}) + 4 = 0$'
    options:
      A: '1 and 4'
      B: '−2 and 2'
      C: '0 and 1'
      D: '0 and 4'
    corrected: >-
      the paper prints options C and D as the same pair ("0 and 1", "1 and 0"). D is given
      "0 and 4", mixing a value of x with a value of 4ˣ — the slip it is set to catch.

  - number: 29
    stem: >-
      If $\dfrac{a}{b} = \dfrac{c}{d} = k$, find the value of
      $\dfrac{3a^{2} - ac + c^{2}}{3b^{2} - bd + d^{2}}$ in terms of $k$.
    options:
      A: '$3k^{2}$'
      B: '$3k - k^{2}$'
      C: '$\tfrac{17k^{2}}{4}$'
      D: '$k^{2}$'
    corrected: >-
      the paper prints the condition as "a/b − c/d = k", a minus in place of the equals sign.

  - number: 30
    stem: >-
      At what points does the straight line $y = 2x + 1$ intersect the curve
      $y = 2x^{2} + 5x - 1$?
    options:
      A: '$(-2, -3)$ and $(\tfrac{1}{2}, 2)$'
      B: '$(-\tfrac{1}{2}, 0)$ and $(2, 5)$'
      C: '$(\tfrac{1}{2}, 2)$ and $(1, 3)$'
      D: '$(1, 3)$ and $(2, 5)$'

  - number: 31
    stem: >-
      A regular polygon of $n$ sides has $160^{\circ}$ as the size of each interior angle.
      Find $n$.
    options:
      A: "18"
      B: "16"
      C: "14"
      D: "12"

  - number: 32
    stem: 'If $\cos\theta = \dfrac{a}{b}$, find $1 + \tan^{2}\theta$.'
    options:
      A: '$\dfrac{b^{2}}{a^{2}}$'
      B: '$\dfrac{a^{2}}{b^{2}}$'
      C: '$\dfrac{a^{2} + b^{2}}{b^{2} - a^{2}}$'
      D: '$\dfrac{2a^{2} + b^{2}}{a^{2} + b^{2}}$'

  - number: 33
    stem: >-
      In the diagram above, $PQ$ and $RS$ are chords of a circle centre $O$ which, produced,
      meet at $T$ outside the circle. If $TP = 24$ cm, $TQ = 8$ cm and $TR = 12$ cm, find
      $TS$.
    options:
      A: '16 cm'
      B: '14 cm'
      C: '12 cm'
      D: '8 cm'
    needs_figure: true
    corrected: >-
      the paper gives TS = 12 cm and asks for TR, but its figure puts R nearer to T than S,
      and the product rule gives the unknown length as 16 cm — longer than 12. The two
      labels are swapped: TR = 12 cm is given and TS is found.
    figure_svg: |
      <svg viewBox="0 0 380 285" width="380" height="285" role="img"
           aria-label="A circle with centre O; the chords P Q and S R, produced, meet at T outside the circle; T P is 24 cm, T Q 8 cm and T R 12 cm">
        <circle cx="148.0" cy="142.6" r="102.6" fill="none" stroke="#1a1a1f" stroke-width="1.7"/>
        <g fill="none" stroke="#1a1a1f" stroke-width="1.7">
          <path d="M52.0 179.0 L340.0 179.0 L159.6 244.6"/>
        </g>
        <path d="M159.6 244.6 L204.7 228.2" fill="none" stroke="#3f2fa8" stroke-width="3"/>
        <g fill="#1a1a1f"><circle cx="52.0" cy="179.0" r="3.2"/><circle cx="244.0" cy="179.0" r="3.2"/><circle cx="204.7" cy="228.2" r="3.2"/><circle cx="159.6" cy="244.6" r="3.2"/><circle cx="340.0" cy="179.0" r="3.2"/><circle cx="148.0" cy="142.6" r="3.2"/></g>
        <text x="36.0" y="184.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">P</text><text x="240.0" y="170.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">Q</text><text x="204.7" y="248.2" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">R</text>
        <text x="151.6" y="264.6" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">S</text><text x="347.0" y="184.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">T</text><text x="154.0" y="136.6" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">O</text>
      </svg>

  - number: 34
    stem: >-
      The angle of elevation of the top of a vertical tower 50 metres high from a point $X$
      on the ground is $30^{\circ}$. From a point $Y$ on the opposite side of the tower, the
      angle of elevation of the top of the tower is $60^{\circ}$. Find the distance between
      the points $X$ and $Y$.
    options:
      A: '14.43 m'
      B: '57.73 m'
      C: '101.03 m'
      D: '115.47 m'

  - number: 35
    stem: >-
      A girl walks 45 metres in the direction $050^{\circ}$ from a point $Q$ to a point $X$.
      She then walks 24 metres in the direction $140^{\circ}$ from $X$ to a point $Y$. How far
      is she then from $Q$?
    options:
      A: '69 m'
      B: '57 m'
      C: '51 m'
      D: '21 m'

  - number: 36
    stem: >-
      The figure above is a solid with the trapezium $PQRS$ as its uniform cross-section:
      $PQ = 6$ m, $QR = 12$ m, $RS = 11$ m, with right angles at $Q$ and $R$, and the solid is
      8 m long. Find its volume.
    options:
      A: '$102\ \text{m}^{3}$'
      B: '$576\ \text{m}^{3}$'
      C: '$816\ \text{m}^{3}$'
      D: '$1056\ \text{m}^{3}$'
    needs_figure: true
    figure_svg: |
      <svg viewBox="0 0 430 320" width="430" height="320" role="img"
           aria-label="A solid 8 m long whose uniform cross-section is the trapezium P Q R S, with P Q 6 m, Q R 12 m, R S 11 m and right angles at Q and R">
        <path d="M216.0 212.0 L216.0 290.0 L372.0 182.0 L372.0 39.0 Z" fill="#3f2fa8" fill-opacity="0.14" stroke="none"/>
