      </svg>

  - number: 38
    stem: 'An arc of a circle of radius 6 cm is 8 cm long. Find the area of the sector.'
    options:
      A: '$5\tfrac{1}{3}\ \text{cm}^{2}$'
      B: '$24\ \text{cm}^{2}$'
      C: '$36\ \text{cm}^{2}$'
      D: '$48\ \text{cm}^{2}$'

  - number: 39
    stem: >-
      In $\triangle XYZ$ above, $XY = 4$, $XZ = 3$ and $YZ = 6$. Determine the cosine of
      angle $Z$.
    options:
      A: '$\tfrac{3}{4}$'
      B: '$\tfrac{29}{36}$'
      C: '$\tfrac{2}{3}$'
      D: '$\tfrac{1}{2}$'
    needs_figure: true
    figure_svg: |
      <svg viewBox="0 0 300 180" width="300" height="180" role="img"
           aria-label="Triangle X Y Z with X Y 4, X Z 3 and Y Z 6">
        <path d="M173.3 78.9 L30.0 150.0 L270.0 150.0 Z" fill="none" stroke="#1a1a1f" stroke-width="1.8"/>
        <path d="M244.00 150.00 A26 26 0 0 1 249.06 134.59" fill="none" stroke="#3f2fa8" stroke-width="1.7"/>
