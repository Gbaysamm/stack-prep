        </g>
        <g fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="5 4">
          <path d="M40.0 290.0 L196.0 182.0 M196.0 182.0 L372.0 182.0 M196.0 182.0 L196.0 39.0"/>
        </g>
        <path d="M216.0 281.0 L223.4 275.9 L223.4 284.9" fill="none" stroke="#1a1a1f" stroke-width="1.2"/><path d="M364.6 187.1 L364.6 178.1 L372.0 173.0" fill="none" stroke="#1a1a1f" stroke-width="1.2"/>
        <text x="212.0" y="203.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">P</text><text x="218.0" y="308.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">Q</text><text x="378.0" y="194.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">R</text><text x="378.0" y="37.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">S</text>
        <text x="2.0" y="226.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">6 m</text><text x="112.0" y="308.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">8 m</text>
        <text x="286.0" y="256.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">12 m</text><text x="380.0" y="118.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">11 m</text>
      </svg>

  - number: 37
    stem: >-
      $PQ$ and $PR$ are tangents from $P$ to a circle centre $O$, as shown in the figure
