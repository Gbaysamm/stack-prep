  - number: 33
    stem: >-
      Three angles of a nonagon are equal and the sum of the six other angles is
      $1110^{\circ}$. Calculate the size of one of the equal angles.
    options:
      A: '$210^{\circ}$'
      B: '$150^{\circ}$'
