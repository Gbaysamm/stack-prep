  - number: 26
    stem: 'Solve the inequality $x - 1 > 4(x + 2)$'
    options:
      A: '$x > -3$'
      B: '$x < -3$'
      C: '$2 < x < 3$'
      D: '$-3 < x < -2$'

  - number: 27
    stem: 'Simplify $\dfrac{x^{2} - y^{2}}{2x^{2} + xy - y^{2}}$'
    options:
      A: '$\dfrac{x + y}{2x + y}$'
      B: '$\dfrac{x + y}{2x - y}$'
      C: '$\dfrac{x - y}{2x - y}$'
      D: '$\dfrac{x - y}{2x + y}$'

  - number: 28
    stem: 'The minimum value of $y$ in the equation $y = x^{2} - 6x + 8$ is'
    options:
      A: "8"
      B: "3"
      C: "0"
      D: "-1"

  - number: 29
    stem: 'Find the sum of the first 21 terms of the progression $-10, -8, -6, \ldots$'
    options:
      A: "180"
      B: "190"
      C: "200"
      D: "210"

  - number: 30
    stem: 'Find the eleventh term of the progression $4, 8, 16, \ldots$'
    options:
      A: '$2^{13}$'
      B: '$2^{12}$'
      C: '$2^{11}$'
      D: '$2^{10}$'

  - number: 31
    stem: >-
      In the diagram above, $POQ$ is a diameter, $O$ is the centre of the circle, $TP$ is a
      tangent at $P$, $ORT$ is a straight line and $\angle OTP = 30^{\circ}$. Find the value
      of $x = \angle PQR$.
    options:
      A: '$30^{\circ}$'
      B: '$40^{\circ}$'
      C: '$45^{\circ}$'
      D: '$50^{\circ}$'
    needs_figure: true
    corrected: >-
      the paper leaves option A blank. The answer, 30°, is written into it; the stem also
      names the angle marked x and the straight line ORT, which the figure shows.
