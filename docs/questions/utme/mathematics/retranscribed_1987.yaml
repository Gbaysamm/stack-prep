# UTME 1987 Mathematics — re-transcribed by hand from MATHEMATICS-questions.pdf, pages 15-18.
#
# All 50 questions. The paper starts part-way down page 15, below the end of the 1986 paper,
# and its last eleven questions (40-50) sit at the top of page 18, above the 1988 paper.
#
# keys_1987.yaml answered 29 and set aside the rest; read off the page images, every one of
# them resolves, though Q11 and Q12 have to be rebuilt.
#
# One answer differs from keys_1987.yaml:
#   Q20 — the key answers D, 1/(∛Z − ∛x²). Solving Z = x² + 1/y³ gives
#         y = 1/(Z − x²)^{1/3}, option C; a cube root does not split over a subtraction.
source:
  file: docs/questions/utme/mathematics/MATHEMATICS-questions.pdf
  exam_year: 1987
  paper_label: UTME 1987 Mathematics (objective)
  paper_code: UTME-1987-MATH
  pages: [15, 16, 17, 18]
  transcribed_by: hand
  answer_source: unverified

questions:
  - number: 1
    stem: 'Convert $241_{5}$ to base 8.'
    options:
      A: '$71_{8}$'
      B: '$107_{8}$'
      C: '$176_{8}$'
      D: '$241_{8}$'

  - number: 2
    stem: >-
      Find the least length of a rod which can be cut into exactly equal strips, each of
      either 40 cm or 48 cm in length.
    options:
      A: '120 cm'
      B: '240 cm'
      C: '360 cm'
      D: '480 cm'

  - number: 3
    stem: >-
      A rectangular lawn has an area of 1815 square yards. If its length is 50 metres, find
      its width in metres, given that 1 metre equals 1.1 yards.
    options:
      A: "39.93"
      B: "35.00"
      C: "33.00"
      D: "30.00"

  - number: 4
    stem: >-
      Reduce each number to two significant figures and then evaluate
      $\dfrac{0.02174 \times 1.2047}{0.023789}$
    options:
      A: "0.8"
      B: "0.9"
      C: "1.1"
      D: "1.2"

  - number: 5
    stem: >-
      A train moves from $P$ to $Q$ at an average speed of 90 km/h and immediately returns
      from $Q$ to $P$ through the same route at an average speed of 45 km/h. Find the average
      speed for the entire journey.
    options:
      A: '55.00 km/h'
      B: '60.00 km/h'
      C: '67.50 km/h'
      D: '75.00 km/h'
    corrected: >-
      the paper prints "returns from O to P" and "the centre journey"; they are Q to P and
      the entire journey.

  - number: 6
    stem: >-
      If the length of a square is increased by 20% while its width is decreased by 20% to
      form a rectangle, what is the ratio of the area of the rectangle to the area of the
      square?
    options:
      A: '6 : 5'
      B: '25 : 24'
      C: '5 : 6'
      D: '24 : 25'
    corrected: >-
      the paper prints the four ratios with points for colons — 6.5, 25.24, 5.6, 24.25 —
      which read as decimals.

  - number: 7
    stem: >-
      Two brothers invested a total of ₦5,000.00 on a farm project. The farm yield was sold
      for ₦15,000.00 at the end of the season. If the profit was shared in the ratio 2 : 3,
      what is the difference in the amount of profit received by the brothers?
    options:
      A: '₦2,000.00'
      B: '₦4,000.00'
      C: '₦6,000.00'
      D: '₦10,000.00'

  - number: 8
    stem: >-
      Peter's weekly wages are ₦20.00 for the first 20 weeks and ₦36.00 for the next 24
      weeks. If his average weekly wage for the whole year is ₦30.00, find his average weekly
      wage for the remaining 8 weeks of the year.
    options:
      A: '₦37.00'
      B: '₦35.00'
      C: '₦30.00'
      D: '₦5.00'
    corrected: >-
      the paper puts the condition ("if his average weekly wage for the whole year is
      ₦30.00") after the question; it is moved before it.

  - number: 9
    stem: >-
      A man invests a sum of money at 4% per annum simple interest. After 3 years, the
      principal amounts to ₦7,000.00. Find the sum invested.
    options:
      A: '₦7,840.00'
      B: '₦6,250.00'
      C: '₦6,160.00'
      D: '₦5,833.33'

  - number: 10
    stem: >-
      By selling 20 oranges for ₦1.35 a trader makes a profit of 8%. What is his percentage
      gain or loss if he sells the same 20 oranges for ₦1.10?
    options:
      A: '8%'
      B: '10%'
      C: '12%'
      D: '15%'

  - number: 11
    stem: >-
      Four boys and eight girls can cut a field in 5 hours. If the boys work at
      $\tfrac{1}{4}$ the rate at which the girls work, how many boys will be needed to cut the
      field in 3 hours?
    options:
      A: "180"
      B: "60"
      C: "25"
      D: "20"
    corrected: >-
      the paper says "four boys and ten girls". With ten girls the field takes 220
      boy-hours and needs 73⅓ boys in 3 hours, which no option offers — the question cannot
      be answered as printed. It is rebuilt with eight girls, the smallest single change that
      gives a whole number of boys among the options (60). Treat it as a reconstruction.

  - number: 12
    stem: 'Evaluate without using tables $\dfrac{125^{\frac{4}{3}}}{16^{\frac{3}{4}}}$'
    options:
      A: '$\tfrac{625}{8}$'
      B: '$\tfrac{8}{625}$'
      C: '$\tfrac{1}{8}$'
      D: "8"
    corrected: >-
      the paper prints only "Evaluate without using tables." — the expression itself is
      missing. This stem is a reconstruction, not a repair: an index expression built to
      reach the offered 625/8 and to exercise the fractional-index rules the question name
      implies.

  - number: 13
    stem: >-
      Instead of writing $\tfrac{35}{6}$ as a decimal correct to 3 significant figures, a
      student wrote it correct to 3 places of decimals. Find his error in standard form.
    options:
      A: "0.003"
      B: '$3.0 \times 10^{-3}$'
      C: '$0.3 \times 10^{2}$'
      D: '$0.3 \times 10^{-3}$'

  - number: 14
    stem: >-
      Simplify without using tables
      $\dfrac{\log_{2}6 - \log_{2}3}{\log_{2}8 - 2\log_{2}\tfrac{1}{2}}$
    options:
      A: '$\tfrac{1}{5}$'
      B: '$\tfrac{1}{2}$'
      C: '$-\tfrac{1}{2}$'
      D: '$\dfrac{\log_{2}3}{\log_{2}7}$'

  - number: 15
    stem: >-
      Simplify without using tables
      $\dfrac{2\sqrt{14} \times 3\sqrt{21}}{7\sqrt{24} \times 2\sqrt{98}}$
    options:
      A: '$\dfrac{3\sqrt{14}}{4}$'
      B: '$\dfrac{3\sqrt{21}}{4}$'
      C: '$\dfrac{3\sqrt{14}}{28}$'
      D: '$\dfrac{3\sqrt{2}}{28}$'

  - number: 16
    stem: >-
      If $p = \dfrac{2}{3} \cdot \dfrac{1 - r^{2}}{n^{2}}$, find $n$ when
      $r = \sqrt{\tfrac{1}{3}}$ and $p = 1$.
    options:
      A: '$\tfrac{3}{2}$'
      B: "3"
      C: '$\tfrac{1}{3}$'
      D: '$\tfrac{2}{3}$'
    corrected: >-
      the paper prints "If p − 2/3 (1 − r²)/n²", with the equals sign printed as a minus, and
      the root in r = √(1/3) as "Ö".

  - number: 17
    stem: >-
      If $a = u^{2} - 3v^{2}$ and $b = 2uv + v^{2}$, evaluate $(2a - b)(a - b^{2})$ when
      $u = 1$ and $v = -1$.
    options:
      A: "9"
      B: "15"
      C: "27"
      D: "33"
    corrected: >-
      the paper prints the second bracket as (a − b³), which gives 3 and matches no option.
      With b² — a superscript misread, as throughout this compilation — it gives exactly the
      offered 9.

  - number: 18
    stem: >-
      The formula $Q = 15 + 0.5n$ gives the cost $Q$ (in naira) of feeding $n$ people for a
      week. Find, in kobo, the extra cost of feeding one additional person.
    options:
      A: '350k'
      B: '200k'
      C: '150k'
      D: '50k'

  - number: 19
    stem: >-
      If $P$ varies inversely as $V$ and $V$ varies directly as $R^{2}$, find the
      relationship between $P$ and $R$, given that $R = 7$ when $P = 2$.
    options:
      A: '$P = 98R^{2}$'
      B: '$PR^{2} = 98$'
      C: '$P = \dfrac{1}{98R}$'
      D: '$P = \dfrac{R^{2}}{98}$'

  - number: 20
    stem: 'Make $y$ the subject of the formula $Z = x^{2} + \dfrac{1}{y^{3}}$'
    options:
      A: '$y = \dfrac{1}{(Z - x^{2})^{3}}$'
      B: '$y = \dfrac{1}{(Z + x^{3})^{\frac{1}{3}}}$'
      C: '$y = \dfrac{1}{(Z - x^{2})^{\frac{1}{3}}}$'
      D: '$y = \dfrac{1}{\sqrt[3]{Z} - \sqrt[3]{x^{2}}}$'

  - number: 21
    stem: >-
      Find the values of $m$ which make the following quadratic function a perfect square:
      $x^{2} + 2(m + 1)x + m + 3$
    options:
      A: '$-1, 1$'
      B: '$-1, 2$'
      C: '$1, -2$'
      D: '$2, -2$'

  - number: 22
    stem: 'Factorize $6^{2x + 1} - 7(6^{x}) - 5$'
    options:
      A: '$\{3(6^{x}) - 5\}\{2(6^{x}) + 1\}$'
      B: '$\{3(6^{x}) - 5\}\{2(6^{x}) - 1\}$'
      C: '$\{2(6^{x}) - 5\}\{3(6^{x}) + 1\}$'
      D: '$\{2(6^{x}) - 5\}\{3(6^{x}) - 1\}$'
    corrected: >-
      the paper prints the middle term as +7(6x). As 6u² + 7u − 5 (with u = 6ˣ) it factorises
      as (3u + 5)(2u − 1), which no option offers; all four options are built from ∓5 and
      ±1 in the pattern that −7 produces, and with −7 option A is exact.

  - number: 23
    stem: >-
      Find two values of $y$ which satisfy the simultaneous equations $x + y = 5$ and
      $x^{2} - 2y^{2} = 1$.
    options:
      A: '$12, -2$'
      B: '$-12, 12$'
      C: '$-12, 2$'
      D: '$2, -2$'

  - number: 24
    stem: >-
      An $(n - 2)^{2}$-sided figure has $n$ diagonals. Find the number $n$ of diagonals for a
      25-sided figure.
    options:
      A: "7"
      B: "8"
      C: "9"
      D: "10"

