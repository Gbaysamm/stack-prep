  - number: 26
    stem: >-
      Using the same graph, for what values of $x$ is the curve
      $y = \dfrac{x^{2} + 3}{x + 4}$ below the line $y = 1$?
    options:
      A: '$-0.6 < x < 1.6$'
      B: '$-1.6 < x < 0.6$'
      C: '$x < -0.6$ or $x > 1.6$'
      D: '$0 < x < 3$'
    needs_figure: true
    corrected: >-
      the paper's question stops mid-sentence ("For what values of x is the curve y = …")
      and its options are printed as two identical pairs (−3 < x < 0 twice, 0 < x < 3 twice).
      Neither the question nor its answer can be recovered. It is rebuilt as the question the
      graph was drawn for — where the curve lies below the line — with options built from the
      same two crossing points as question 25.
    figure_svg: |
      <svg viewBox="0 0 360 265" width="360" height="265" role="img"
           aria-label="The curve y equals x squared plus 3 over x plus 4, falling from about 4 at x equals minus 2 to a low point near 0.7 and rising again, crossed by the horizontal line y equals 1 at x about minus 0.6 and x about 1.6">
        <g fill="none" stroke="#1a1a1f" stroke-width="1.4">
          <path d="M20.0 230.0 H340.0"/><path d="M150.0 10.0 V250.0"/>
          <path d="M50.0 225.0 V235.0"/><path d="M100.0 225.0 V235.0"/><path d="M200.0 225.0 V235.0"/><path d="M250.0 225.0 V235.0"/><path d="M300.0 225.0 V235.0"/><path d="M145.0 180.0 H155.0"/><path d="M145.0 130.0 H155.0"/><path d="M145.0 80.0 H155.0"/><path d="M145.0 30.0 H155.0"/>
