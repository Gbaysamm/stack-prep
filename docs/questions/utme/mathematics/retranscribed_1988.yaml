# UTME 1988 Mathematics — re-transcribed by hand from MATHEMATICS-questions.pdf, pages 18-21.
#
# 49 questions: the paper runs 1-42 and 44-50, with no question 43 anywhere on the pages.
# The paper starts part-way down page 18, below the end of the 1987 paper.
#
# keys_1988.yaml answered 27 and set aside the rest; read off the page images, every one of
# them resolves, though Q26 has to be rebuilt.
#
# Three answers differ from keys_1988.yaml:
#   Q6  — the key answers B (4:2:1). With 10 blue balls there are 50 green and 20 black;
#         removing 10 of each leaves 40:10:10 = 4:1:1, option D. The key removed only the
#         green.
#   Q13 — the key answers C. With 1/p = (a + b)²/(a − b) and 1/q = (a + b)/(a − b)², the
#         ratio p/q = 1/(a² − b²), option B. No reading of the printed stem gives C.
#   Q39 — the key answers B (14 m). That is the height above the man's eye; the question
#         says his eye is 2 m above the ground, so the tree is 16 m, option D.
source:
  file: docs/questions/utme/mathematics/MATHEMATICS-questions.pdf
  exam_year: 1988
  paper_label: UTME 1988 Mathematics (objective)
  paper_code: UTME-1988-MATH
  pages: [18, 19, 20, 21]
  transcribed_by: hand
  answer_source: unverified

questions:
  - number: 1
    stem: 'Simplify $\dfrac{1\tfrac{1}{2}}{2 \div \tfrac{1}{4} \text{ of } 32}$'
    options:
      A: '$\tfrac{3}{256}$'
      B: '$\tfrac{3}{32}$'
      C: "6"
      D: "85"

  - number: 2
    stem: >-
      If $x$ is the sum of the prime numbers between 1 and 6, and $y$ is the H.C.F. of 6, 9
      and 15, find the product of $x$ and $y$.
    options:
      A: "27"
      B: "30"
      C: "33"
      D: "90"

  - number: 3
    stem: >-
      A 5.0 g mass of salt was weighed by Tunde as 5.1 g. What is the percentage error?
    options:
      A: "20"
      B: "2"
      C: "0.02"
      D: "0.2"
    corrected: >-
      the paper prints options B and C identically, as 2. C is given 0.02 — the relative
      error before it is turned into a percentage, which is the natural slip here.

  - number: 4
    stem: 'Find, correct to one decimal place, $\dfrac{0.24633}{0.0306}$'
    options:
      A: "0.8"
      B: "1.8"
      C: "8.0"
      D: "8.1"

  - number: 5
    stem: >-
      Two sisters, Taiwo and Kehinde, own a store. The ratio of Taiwo's share to Kehinde's is
      11 : 9. Later Kehinde sells $\tfrac{2}{3}$ of her share to Taiwo for ₦720.00. Find the
      value of the store.
    options:
      A: '₦1,080.00'
      B: '₦2,400.00'
      C: '₦3,000.00'
      D: '₦3,600.00'

  - number: 6
    stem: >-
      A basket contains green, black and blue balls in the ratio 5 : 2 : 1. If there are 10
      blue balls, find the corresponding new ratio when 10 green and 10 black balls are
      removed from the basket.
    options:
      A: '1 : 1 : 1'
      B: '4 : 2 : 1'
      C: '5 : 1 : 1'
      D: '4 : 1 : 1'

  - number: 7
    stem: >-
      A taxpayer is allowed $\tfrac{1}{8}$ of his income tax-free, and pays 20% on the
      remainder. If he pays ₦490.00 tax, what is his income?
    options:
      A: '₦560.00'
      B: '₦2,450.00'
      C: '₦2,800.00'
      D: '₦3,920.00'

  - number: 8
    stem: 'Evaluate $\dfrac{8^{\frac{1}{3}} \times 5^{\frac{2}{3}}}{10^{\frac{2}{3}}}$'
    options:
      A: '$\tfrac{2}{5}$'
      B: '$\tfrac{5}{3}$'
      C: '$\sqrt[3]{2}$'
      D: '$\sqrt[3]{5}$'
    corrected: >-
      the stem is printed clearly and equals ∛2, but no option does: they are printed as
      2/5, 5/3, "2√5" and "3√5". The last is ∛5 with its root index set in front, as this
      compilation habitually does; option C, "2√5", is replaced by the true value ∛2.

  - number: 9
    stem: >-
      If $\log_{10}2 = 0.3010$ and $\log_{10}3 = 0.4771$, evaluate, without using
      logarithm tables, $\log_{10}4.5$.
    options:
      A: "0.3010"
      B: "0.4771"
      C: "0.6532"
      D: "0.9542"
    corrected: >-
      the paper prints option C as 0.6352, two digits transposed; 2 log 3 − log 2 is
      0.9542 − 0.3010 = 0.6532.

  - number: 10
    stem: 'Find $m$ such that $(m + \sqrt{3})(1 - \sqrt{3})^{2} = 6 - 2\sqrt{3}$'
    options:
      A: "1"
      B: "2"
      C: "3"
      D: "4"
    corrected: >-
      the paper prints "(m , 3)(1 − √3)² = 6 − √3 = 6 − 2√3", with the first bracket's sign
      and root lost and a stray middle expression. As (m + √3) the equation holds for
      exactly one m, and both its rational and its surd parts agree on it.

  - number: 11
    stem: >-
      The thickness of an 800-page book is 18 mm. Calculate the thickness of one leaf of the
      book, giving your answer in metres and in standard form.
    options:
      A: '$2.25 \times 10^{-4}$ m'
      B: '$4.50 \times 10^{-4}$ m'
      C: '$2.25 \times 10^{-5}$ m'
      D: '$4.50 \times 10^{-5}$ m'

  - number: 12
    stem: 'Simplify $\dfrac{x + 2}{x + 1} - \dfrac{x - 2}{x + 2}$'
    options:
      A: '$\dfrac{3}{x + 1}$'
      B: '$\dfrac{3x + 2}{(x + 1)(x + 2)}$'
      C: '$\dfrac{5x + 6}{(x + 1)(x + 2)}$'
      D: '$\dfrac{2x^{2} + 5x + 2}{(x + 1)(x + 2)}$'

  - number: 13
    stem: >-
      If $\dfrac{1}{p} = \dfrac{a^{2} + 2ab + b^{2}}{a - b}$ and
      $\dfrac{1}{q} = \dfrac{a + b}{a^{2} - 2ab + b^{2}}$, find $\dfrac{p}{q}$.
    options:
      A: '$\dfrac{a + b}{a - b}$'
      B: '$\dfrac{1}{a^{2} - b^{2}}$'
      C: '$\dfrac{a - b}{a + b}$'
      D: '$a^{2} - b^{2}$'
    corrected: >-
      the paper sets options B and D as one stack — "1", "a² − b²", a bar, "a² − b²" — so
      that each is hard to read on its own. They are taken as 1/(a² − b²) and a² − b².

  - number: 14
    stem: >-
      If $x$ varies inversely as the cube root of $y$, and $x = 1$ when $y = 8$, find $y$
      when $x = 3$.
    options:
      A: '$\tfrac{1}{3}$'
      B: '$\tfrac{2}{3}$'
      C: '$\tfrac{8}{27}$'
      D: '$\tfrac{4}{9}$'

  - number: 15
    stem: >-
      If $a = -3$, $b = 2$ and $c = 4$, calculate $\dfrac{a^{3} - b^{3} - c^{\frac{1}{2}}}{b - a - c}$
    options:
      A: "37"
      B: '$-\tfrac{37}{5}$'
      C: '$\tfrac{37}{5}$'
      D: "-37"
    corrected: >-
      the paper prints the denominator as (b − 1 − c), which gives 37/3 and matches no
      option. The options are ±37 and ±37/5, so the denominator must be ±1 or ±5; read as
      (b − a − c), with the a misprinted as a 1, it is exactly 1.

  - number: 16
    stem: >-
      If $g(y) = \dfrac{y - 3}{11} + \dfrac{11}{y^{2} - 9}$, what is $g(y + 3)$?
    options:
      A: '$\dfrac{y}{11} + \dfrac{11}{y(y + 6)}$'
      B: '$\dfrac{y}{11} + \dfrac{11}{y(y + 3)}$'
      C: '$\dfrac{y + 30}{11} + \dfrac{11}{y(y + 3)}$'
      D: '$\dfrac{y + 3}{11} + \dfrac{11}{y(y - 6)}$'

  - number: 17
    stem: 'Factorize completely $(x^{2} + x)^{2} - (2x + 2)^{2}$'
    options:
      A: '$(x + y)(x + 2)(x - 2)$'
      B: '$(x + y)^{2}(x - 2)^{2}$'
      C: '$(x + 1)^{2}(x + 2)^{2}$'
      D: '$(x + 1)^{2}(x + 2)(x - 2)$'
    corrected: >-
      the paper prints the expression as "(x2 + x)² (2x + 2)²", with the index of the first
      x dropped to the line and the minus sign between the brackets lost.

  - number: 18
    stem: 'Simplify $\dfrac{x - y}{x^{\frac{1}{3}} - y^{\frac{1}{3}}}$'
    options:
      A: '$x^{2} + xy + y^{2}$'
      B: '$x^{\frac{2}{3}} + x^{\frac{1}{3}}y^{\frac{1}{3}} + y^{\frac{2}{3}}$'
      C: '$x^{\frac{2}{3}} - x^{\frac{1}{3}}y^{\frac{1}{3}} - y^{\frac{2}{3}}$'
      D: '$x^{2} - xy + y^{2}$'
    corrected: >-
      the paper prints the second index in the denominator as ½ and option B without the
      middle term's y^{1/3}. Both indices are ⅓ — only then is x − y a difference of cubes
      over the denominator — and B is the quotient.

  - number: 19
    stem: 'Solve for $x$: $x^{2} + \dfrac{2x}{r^{2}} + \dfrac{1}{r^{4}} = 0$'
    options:
      A: '$r^{2}$'
      B: '$\dfrac{1}{r^{2}}$'
      C: '$-\dfrac{1}{r^{2}}$'
      D: '$\dfrac{1}{r}$'
    corrected: >-
      the paper prints the last term's denominator as r¹, which gives no solution among the
      options. With r⁴ the left side is the perfect square (x + 1/r²)², and every option is
      a power of r that fits that pattern.

  - number: 20
    stem: >-
      List the integral values of $x$ which satisfy the inequality
      $1 \le 5 - 2x \le 7$.
    options:
      A: '$-1, 0, 1, 2$'
      B: '$0, 1, 2, 3$'
      C: '$-1, 0, 1, 2, 3$'
      D: '$-1, 0, 2, 3$'
    corrected: >-
      the paper prints "1 < 5 < −2x < 7", with the subtraction broken apart and strict signs.
      Strict inequalities would leave only 0 and 1, which no option lists; with ≤ the
      integers are exactly −1, 0, 1 and 2.

  - number: 21
    stem: >-
      Given that $3x - 5y - 3 = 0$ and $2y - 6x + 5 = 0$, the value of $(x, y)$ is
    options:
      A: '$\left(-\tfrac{1}{8}, \tfrac{19}{24}\right)$'
      B: '$\left(8, \tfrac{24}{10}\right)$'
      C: '$\left(-8, \tfrac{24}{19}\right)$'
      D: '$\left(\tfrac{19}{24}, -\tfrac{1}{8}\right)$'

  - number: 22
    stem: 'The solution of the quadratic equation $px^{2} + qx + b = 0$ is'
    options:
      A: '$\dfrac{-b \pm \sqrt{b^{2} - 4ac}}{2a}$'
      B: '$\dfrac{-b \pm \sqrt{p^{2} - 4pb}}{2a}$'
      C: '$\dfrac{-q \pm \sqrt{q^{2} - 4bp}}{2p}$'
      D: '$\dfrac{-q \pm \sqrt{p^{2} - 4bp}}{2p}$'
    corrected: >-
      the paper prints the equation as bx² + qx + b = 0. Every option built from this
      equation divides by 2p, so the leading coefficient is p.

  - number: 23
    stem: 'Simplify $\dfrac{1}{x^{2} + 5x + 6} + \dfrac{1}{x^{2} + 3x + 2}$'
    options:
      A: '$\dfrac{x + 3}{(x + 1)(x + 2)}$'
      B: '$\dfrac{1}{(x + 1)(x + 2)(x + 3)}$'
      C: '$\dfrac{2}{(x + 1)(x + 3)}$'
      D: '$\dfrac{4}{(x + 1)(x + 3)}$'

  - number: 24
    stem: 'Simplify $\dfrac{4a^{2} - 49b^{2}}{2a^{2} + 5ab - 7b^{2}}$'
    options:
      A: '$\dfrac{a - b}{2a + b}$'
      B: '$\dfrac{2a + 7b}{a - b}$'
      C: '$\dfrac{2a - 7b}{a + b}$'
      D: '$\dfrac{2a - 7b}{a - b}$'
    corrected: >-
      the paper prints the numerator as 4a² − 4ab², which shares no factor with the
      denominator. It is 4a² − 49b², a difference of squares whose factor (2a + 7b) is
      also a factor of the denominator; the 9 has printed as an a.

  - number: 25
