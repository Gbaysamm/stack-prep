      The graph above shows the curve $y = \dfrac{x^{2} + 3}{x + 4}$ and the line $y = 1$.
      Use it to find the solution of the equation $x^{2} - x - 1 = 0$.
    options:
      A: '$x = 1.6$ and $x = -0.6$'
      B: '$x = -1.6$ and $x = 0.6$'
      C: '$x = 1.6$ and $x = 0.6$'
      D: '$x = -1.6$ and $x = -0.6$'
    needs_figure: true
    figure_note: >-
      the paper's graph mislabels its axes — the last x-tick reads 1 where it should read 3,
      and the negative y-ticks run −2 then −1 downwards. The figure below is drawn from the
