  - number: 29
    stem: >-
      The sum of the first two terms of a geometric progression is $x$ and the sum of the
      last two terms is $y$. If there are $n$ terms in all, then the common ratio is
    options:
      A: '$\dfrac{x}{y}$'
      B: '$\dfrac{y}{x}$'
      C: '$\left(\dfrac{x}{y}\right)^{\frac{1}{n - 2}}$'
      D: '$\left(\dfrac{y}{x}\right)^{\frac{1}{n - 2}}$'
    corrected: >-
      the paper prints the indices of options C and D as ½, which is right only when n = 4.
      The ratio of the last pair to the first is r^{n−2}, so the index is 1/(n − 2) — the n
      that the question introduces and otherwise never uses.

  - number: 30
    stem: 'If $-8, m, n, 19$ are in arithmetic progression, find $(m, n)$.'
    options:
      A: '$(1, 10)$'
      B: '$(2, 10)$'
      C: '$(3, 13)$'
      D: '$(4, 16)$'

  - number: 31
