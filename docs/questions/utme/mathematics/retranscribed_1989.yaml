# UTME 1989 Mathematics — re-transcribed by hand from MATHEMATICS-questions.pdf, pages 22-24.
#
# All 50 questions. keys_1989.yaml answered 34 and set aside the rest; read off the page
# images, all but one resolve cleanly, and Q14 is reconstructed.
#
# Two answers differ from keys_1989.yaml:
#   Q25 — the key answers B (r > abc). Dividing r(1/a + 1/b + 1/c) > 1 by the positive
#         bracket gives r > abc/(bc + ac + ab), which is option A.
#   Q26 — the key answers A. 1/(x + 1) − 1/(x − 2) = −3/((x + 1)(x − 2)), which is
#         3/((x + 1)(2 − x)) — option B. At x = 0 the expression is 3/2; A gives −3/2.
#
# Q14 prints three fractions whose powers of x and whose second denominator are unreadable.
# It is rebuilt as a well-posed substitution question that keeps what can be read, and its
# note says plainly that more than one reading fits.
source:
  file: docs/questions/utme/mathematics/MATHEMATICS-questions.pdf
  exam_year: 1989
  paper_label: UTME 1989 Mathematics (objective)
  paper_code: UTME-1989-MATH
  pages: [22, 23, 24]
  transcribed_by: hand
  answer_source: unverified

questions:
  - number: 1
    stem: 'Which of the following is in descending order?'
    options:
      A: '$\tfrac{9}{10}, \tfrac{4}{5}, \tfrac{3}{4}, \tfrac{17}{10}$'
      B: '$\tfrac{4}{5}, \tfrac{9}{10}, \tfrac{3}{4}, \tfrac{17}{20}$'
      C: '$\tfrac{9}{10}, \tfrac{17}{20}, \tfrac{4}{5}, \tfrac{3}{4}$'
      D: '$\tfrac{4}{5}, \tfrac{9}{10}, \tfrac{17}{10}, \tfrac{3}{4}$'
    corrected: >-
      the paper prints option C as beginning 6/10, which makes no option descending at all
      (6/10 is smaller than the 17/20 after it). The first entry is 9/10 — the same fraction
      that heads option A — and with it C runs 0.9, 0.85, 0.8, 0.75.

  - number: 2
    stem: 'Evaluate $2{,}700{,}000 \times 0.03 \div 18{,}000$'
    options:
      A: '$4.5 \times 10^{0}$'
      B: '$4.5 \times 10^{1}$'
      C: '$4.5 \times 10^{2}$'
      D: '$4.5 \times 10^{3}$'

  - number: 3
    stem: 'The prime factors of 2,520 are'
    options:
      A: '2, 9, 5'
      B: '2, 9, 7'
      C: '2, 3, 5, 7'
      D: '2, 3, 7, 9'

  - number: 4
    stem: 'If $12_{e} = x_{7}$, find $x$, where $e$ stands for twelve.'
    options:
      A: "20"
      B: "15"
      C: "14"
      D: "12"

  - number: 5
    stem: 'Simplify $\left(\sqrt[3]{64r^{-6}}\right)^{\frac{1}{2}}$'
    options:
      A: '$r$'
      B: '$2r$'
      C: '$\dfrac{1}{2r}$'
      D: '$\dfrac{2}{r}$'
    corrected: >-
      the paper prints "3√64r⁻⁶)^{1/2}", with the cube-root index set in front of the radical
      as a coefficient and the opening bracket lost.

  - number: 6
    stem: >-
      What is the difference between 0.007685 correct to three significant figures and
      0.007685 correct to four places of decimal?
    options:
      A: '$10^{-5}$'
      B: '$7 \times 10^{-4}$'
      C: '$8 \times 10^{-5}$'
      D: '$10^{-6}$'

  - number: 7
    stem: 'If $a : b = 5 : 8$ and $x : y = 25 : 16$, evaluate $\dfrac{a}{x} : \dfrac{b}{y}$'
    options:
      A: '125 : 128'
      B: '3 : 5'
      C: '3 : 4'
      D: '2 : 5'

  - number: 8
    stem: >-
      Oke deposited ₦800.00 in the bank at the rate of $12\tfrac{1}{2}\%$ simple interest.
      After some time the total amount was one and a half times the principal. For how many
      years was the money left in the bank?
    options:
      A: "2"
      B: "4"
      C: '$5\tfrac{1}{2}$'
      D: "8"

  - number: 9
    stem: >-
      If the surface area of a sphere is increased by 44%, find the percentage increase in
      its diameter.
    options:
      A: "44"
      B: "30"
      C: "22"
      D: "20"

  - number: 10
    stem: 'Simplify $4 - \dfrac{1}{2 - \sqrt{3}}$'
    options:
      A: '$2\sqrt{3}$'
      B: '$-2 - \sqrt{3}$'
      C: '$-2 + \sqrt{3}$'
      D: '$2 - \sqrt{3}$'
    corrected: >-
      the paper prints options B and D with commas where the minus signs belong ("−2., √3",
      "2, −√3"); they are single numbers, −2 − √3 and 2 − √3.

  - number: 11
    stem: 'Find $p$ in terms of $q$ if $\log_{3}p + 3\log_{3}q = 3$'
    options:
      A: '$\left(\dfrac{3}{q}\right)^{3}$'
      B: '$\left(\dfrac{q}{3}\right)^{\frac{1}{3}}$'
      C: '$\left(\dfrac{q}{3}\right)^{3}$'
      D: '$\left(\dfrac{3}{q}\right)^{\frac{1}{3}}$'
    corrected: >-
      the paper sets each option as two bracketed numbers stacked without a fraction bar,
      with the index on the top one only — "(3)³ over (q)". Read as a fraction raised to the
      power, the four are the pairs (3/q) and (q/3) with indices 3 and 1/3.

  - number: 12
    stem: >-
      What are the values of $y$ which satisfy the equation $9^{y} - 4(3^{y}) + 3 = 0$?
    options:
      A: '$-1$ and $0$'
      B: '$-1$ and $1$'
      C: '$1$ and $3$'
      D: '$0$ and $1$'
    corrected: >-
      the paper prints the middle term as 4(3y), its index dropped to the line; it is 4(3^y).

  - number: 13
    stem: 'Make $R$ the subject of the formula $S = \sqrt{\dfrac{2R + T}{2RT}}$'
    options:
      A: '$R = \dfrac{T}{TS^{2} - 1}$'
      B: '$R = \dfrac{T}{2(TS^{2} - 1)}$'
      C: '$R = \dfrac{T}{TS^{2} + 1}$'
      D: '$R = \dfrac{T}{2(TS^{2} + 1)}$'
    corrected: >-
      the paper prints the denominator under the root as 3RT, which rearranges to
      R = T/(3TS² − 2) and matches no option. With 2RT it gives exactly option B; every
      option carries TS² ± 1, which only a 2 there produces.

  - number: 14
    stem: >-
      Find the value of the expression
      $\dfrac{32}{81}x^{3} - \dfrac{64}{27}x^{2} - \dfrac{81}{16}x^{-3}$ when
      $x = -\dfrac{3}{4}$.
    options:
      A: '$10\tfrac{1}{2}$'
      B: '$10\tfrac{1}{6}$'
      C: '$3\tfrac{3}{8}$'
      D: '$-13\tfrac{1}{2}$'
    corrected: >-
      the paper's expression cannot be read: it prints the numerators 32, 64 and 81 over
      "81x³", "x^{x2}" and "16", with the powers of x misplaced and the second denominator
      lost. This stem is a reconstruction, not a repair, and the original cannot be pinned
      down: a search over whole-number powers of x, keeping the printed coefficients 32/81
      and 81/16, the cube on the first term and a middle term 64/27 x², finds three readings
      that each land on an offered answer (A, B and D). This one keeps the printed minus
      sign, and its three terms are all clean at x = −3/4 (−1/6, −4/3 and +12). Treat the
      question as a well-posed substitution exercise rather than as the 1989 original.

  - number: 15
    stem: >-
      The cost of dinner for a group of students is partly constant and partly varies
      directly as the number of students. If the cost is ₦74.00 when the number of students
      is 20, and ₦96.00 when the number is 30, find the cost when there are 15 students.
    options:
      A: '₦68.50'
      B: '₦63.00'
      C: '₦60.00'
      D: '₦52.00'

  - number: 16
    stem: 'If $f(x) = 2x^{2} - 5x + 3$, find $f(x + 1)$'
    options:
      A: '$2x^{2} - x$'
      B: '$2x^{2} - x + 10$'
      C: '$4x^{2} + 3x + 2$'
      D: '$4x^{2} + 3x + 12$'
    corrected: >-
      the paper prints the middle term as +5x, which makes f(x + 1) = 2x² + 9x + 10 and
      matches no option. With −5x it is exactly 2x² − x, option A; the minus sign has been
      lost, as it so often is in this compilation.

  - number: 17
    stem: 'Find the positive number $x$ such that $2^{x^{3} - x^{2} - 2x} = 1$'
    options:
      A: "4"
      B: "3"
      C: "2"
      D: "1"

  - number: 18
    stem: 'Simplify $\dfrac{324 - 4x^{2}}{2x + 18}$'
    options:
      A: '$2(x - 9)$'
      B: '$2(9 + x)$'
      C: '$81 - x^{2}$'
      D: '$-2(x - 9)$'
    corrected: >-
      the paper prints the numerator as 32x − 4x², which does not share a factor with
      2x + 18 at all. It is 324 − 4x², a difference of two squares — the x is a misread 4.

  - number: 19
    stem: 'Factorize completely $y^{3} - 4xy + xy^{3} - 4y$'
    options:
      A: '$(x + xy)(y + 2)(y - 2)$'
      B: '$(y + xy)(y + 2)(y - 2)$'
      C: '$y(1 + x)(y + 2)(y - 2)$'
      D: '$y(1 - x)(y + 2)(y - 2)$'

  - number: 20
    stem: >-
      If one factor of $x^{3} - 8^{-1}$ is $x - 2^{-1}$, the other factor is
    options:
      A: '$x^{2} + 2^{-1}x - 4^{-1}$'
      B: '$x^{2} - 2^{-1}x - 4^{-1}$'
      C: '$x^{2} + 2^{-1}x + 4^{-1}$'
      D: '$x^{2} - 2^{-1}x + 4^{-1}$'
    corrected: >-
      the paper prints options A and D identically; D is given the one sign pattern the other
      three do not use.

  - number: 21
    stem: 'Factorize $4a^{2} + 12ab - c^{2} + 9b^{2}$'
    options:
      A: '$4a(a - 3b) + (3b - c)^{2}$'
      B: '$(2a + 3b - c)(2a + 3b + c)$'
      C: '$(2a - 3b - c)(2a - 3b + c)$'
      D: '$4a(a - 3b) + (3b + c)^{2}$'

  - number: 22
    stem: >-
      What are $K$ and $L$ respectively if
      $\tfrac{1}{2}(3y - 4x)^{2} = 8x^{2} + Kxy + Ly^{2}$?
    options:
      A: '$-12,\ \tfrac{9}{2}$'
      B: '$-6,\ 9$'
      C: '$6,\ 9$'
      D: '$12,\ \tfrac{9}{2}$'

  - number: 23
    stem: >-
      Solve the pair of equations for $x$ and $y$ respectively:
      $2x^{-1} - 3y^{-1} = 4$ and $4x^{-1} + y^{-1} = 1$.
    options:
      A: '$-1,\ 2$'
      B: '$1,\ 2$'
      C: '$2,\ 1$'
      D: '$2,\ -1$'

  - number: 24
    stem: >-
      What value of $Q$ will make the expression $4x^{2} + 5x + Q$ a complete square?
    options:
      A: '$\tfrac{25}{16}$'
      B: '$\tfrac{25}{64}$'
      C: '$\tfrac{5}{8}$'
      D: '$\tfrac{5}{4}$'

  - number: 25
    stem: >-
      Find the range of values of $r$ which satisfies the inequality
      $\dfrac{r}{a} + \dfrac{r}{b} + \dfrac{r}{c} > 1$, where $a$, $b$ and $c$ are positive.
    options:
      A: '$r > \dfrac{abc}{bc + ac + ab}$'
      B: '$r > abc$'
      C: '$r > \dfrac{1}{a} + \dfrac{1}{b} + \dfrac{1}{c}$'
      D: '$r > \dfrac{1}{abc}$'

  - number: 26
    stem: 'Express $\dfrac{1}{x + 1} - \dfrac{1}{x - 2}$ as a single fraction.'
    options:
      A: '$\dfrac{-3}{(x + 1)(2 - x)}$'
      B: '$\dfrac{3}{(x + 1)(2 - x)}$'
      C: '$\dfrac{-1}{(x + 1)(x - 2)}$'
      D: '$\dfrac{1}{(x + 1)(x - 2)}$'

  - number: 27
    stem: 'Simplify $\dfrac{x}{x + 1} - \dfrac{(x + 1)^{\frac{1}{2}}}{(x + 1)^{\frac{1}{2}}}$'
    options:
      A: '$\dfrac{1}{x + 1}$'
      B: '$-\dfrac{1}{x + 1}$'
      C: '$\dfrac{1}{x}$'
      D: '$-\dfrac{1}{x}$'
    corrected: >-
      the paper prints options A and D identically, as 1/(x + 1); D is given the fourth
      combination of sign and denominator the others do not use.

