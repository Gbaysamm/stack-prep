        <g fill="#1a1a1f"><circle cx="150.0" cy="25.0" r="3.2"/><circle cx="227.9" cy="217.9" r="3.2"/><circle cx="83.3" cy="276.3" r="3.2"/><circle cx="123.3" cy="125.5" r="3.2"/><circle cx="198.7" cy="145.5" r="3.2"/></g>
