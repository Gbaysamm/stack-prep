# UTME 1990 Mathematics — re-transcribed by hand from MATHEMATICS-questions.pdf, pages 25-27.
#
# All 50 questions. keys_1990.yaml answered 31 and set aside the rest; read off the page
# images, every one of them resolves.
#
# Two answers differ from keys_1990.yaml:
#   Q13 — the key answers A (Z²Y = C), which needs one of the stem's two squares deleted. As
#         printed the stem gives Y = k/X² with X = cZ², so YZ⁴ is constant. Option C is a
#         word-for-word duplicate of option B, and it is that broken slot, not the stem, that
#         this file repairs; the answer is C.
#   Q50 — the key answers B (2/15), which counts the numbers from 41 to 56 as 56 − 41 = 15.
#         There are 16 of them, two are multiples of 9, and the probability is 2/16 = 1/8.
#         The printed "3/16" is that 2/16 with a misread digit; option D, 7/8, is its
#         complement. This file answers C.
#
# Q24 is printed out of order on the page, between Q27 and Q28, and its options C and D
# were displaced into the next column; both are restored.
source:
  file: docs/questions/utme/mathematics/MATHEMATICS-questions.pdf
  exam_year: 1990
  paper_label: UTME 1990 Mathematics (objective)
  paper_code: UTME-1990-MATH
  pages: [25, 26, 27]
  transcribed_by: hand
  answer_source: unverified

questions:
  - number: 1
    stem: 'Simplify $\dfrac{4\tfrac{3}{4} - 6\tfrac{1}{4}}{4\tfrac{1}{5} \text{ of } 1\tfrac{1}{4}}$'
    options:
      A: '$-7\tfrac{7}{8}$'
      B: '$-\tfrac{2}{7}$'
      C: '$-\tfrac{10}{21}$'
      D: '$\tfrac{10}{21}$'
    corrected: >-
      the paper sets the fractional parts of the four mixed numbers as superscripts
      ("4^{3/4} − 6^{1/4}"), which reads as powers. They are the mixed numbers 4¾, 6¼, 4⅕ and
      1¼, and read that way the expression gives the offered −2/7.

  - number: 2
    stem: 'The H.C.F. of $a^{2}bx + abx^{2}$ and $a^{2}b - b^{3}$ is'
    options:
      A: '$b$'
      B: '$a + b$'
      C: '$a(a + b)$'
      D: '$abx(a^{2} - b^{2})$'

  - number: 3
    stem: 'Correct $241.34 \times (3 \times 10^{-3})^{2}$ to 4 significant figures.'
    options:
      A: "0.0014"
      B: "0.001448"
      C: "0.0022"
      D: "0.002172"

  - number: 4
    stem: >-
      At what rate would a sum of ₦100.00 deposited for 5 years raise a simple interest of
      ₦7.50?
    options:
      A: '$1\tfrac{1}{2}\%$'
      B: '$2\tfrac{1}{2}\%$'
      C: '$15\%$'
      D: '$25\%$'

  - number: 5
    stem: >-
      Three children shared a basket of mangoes in such a way that the first child took
      $\tfrac{1}{4}$ of the mangoes and the second $\tfrac{3}{4}$ of the remainder. What
      fraction of the mangoes did the third child take?
    options:
      A: '$\tfrac{3}{16}$'
      B: '$\tfrac{7}{16}$'
      C: '$\tfrac{9}{16}$'
      D: '$\tfrac{13}{16}$'

  - number: 6
    stem: >-
      Simplify and express in standard form
      $\dfrac{0.00275 \times 0.00640}{0.025 \times 0.08}$
    options:
      A: '$8.8 \times 10^{-1}$'
      B: '$8.8 \times 10^{2}$'
      C: '$8.8 \times 10^{-3}$'
      D: '$8.8 \times 10^{3}$'

  - number: 7
    stem: >-
      Three brothers in a business deal share the profit at the end of a contract. The first
      received $\tfrac{1}{3}$ of the profit and the second $\tfrac{2}{3}$ of the remainder. If
      the third received the remaining ₦12,000.00, how much profit did they share?
    options:
      A: '₦60,000.00'
      B: '₦54,000.00'
      C: '₦48,000.00'
      D: '₦42,000.00'

  - number: 8
    stem: 'Simplify $\sqrt{160r^{2} + \sqrt{71r^{4} + \sqrt{100r^{8}}}}$'
    options:
      A: '$9r^{2}$'
      B: '$12\sqrt{3}\,r$'
      C: '$13r$'
      D: '$\sqrt{13}\,r$'
    corrected: >-
      the paper prints three separate radicals, "√160r² + √(71r⁴ + √100r³", with an
      unclosed bracket and the last index as 3. The radicals are nested — each sits inside the
      one before — and the innermost term is 100r⁸, whose square root 10r⁴ is what combines
      with 71r⁴ to make the perfect square 81r⁴.

  - number: 9
    stem: 'Simplify $\sqrt{27} + \dfrac{3}{\sqrt{3}}$'
    options:
      A: '$4\sqrt{3}$'
      B: '$\tfrac{4}{\sqrt{3}}$'
      C: '$3\sqrt{3}$'
      D: '$3\sqrt{4}$'

  - number: 10
    stem: 'Simplify $3\log_{6}9 + \log_{6}12 + \log_{6}64 - \log_{6}72$'
    options:
      A: "5"
      B: "7776"
      C: '$\log_{6}31$'
      D: '$(7776)^{6}$'

  - number: 11
    stem: 'Simplify $\left(\dfrac{1}{x^{-1}} + \dfrac{1}{y^{-1}}\right)^{-1}$'
    options:
      A: '$\dfrac{x}{y}$'
      B: '$xy$'
      C: '$\dfrac{1}{x + y}$'
      D: '$(xy)^{-1}$'
    corrected: >-
      the stem is printed clearly, but no option equals its value: the bracket is x + y, so
      the expression is 1/(x + y). Option C is printed as y/x, which is what the expression
      would give with ÷ in place of +; it is replaced by the true value.

  - number: 12
    stem: >-
      If $a = 2$, $b = -2$ and $c = -\tfrac{1}{2}$, evaluate
      $(ab^{2} - bc^{2})(a^{2}c - abc)$
    options:
      A: "0"
      B: "-28"
      C: "-30"
      D: "-34"

  - number: 13
    stem: >-
      $Y$ varies inversely as $X^{2}$ and $X$ varies directly as $Z^{2}$. Find the
      relationship between $Y$ and $Z$, if $C$ is a constant.
    options:
      A: '$Z^{2}Y = C$'
      B: '$Y = CZ^{2}$'
      C: '$Z^{4}Y = C$'
      D: '$Y = C$'
    corrected: >-
      the paper prints options B and C identically, as Y = CZ². Combining the two variations
      as printed gives Y = k/X² = k/(cZ²)², so YZ⁴ is constant; the duplicated slot C is where
      that answer belongs.

  - number: 14
    stem: >-
      Find the value of $r$ in terms of $p$ and $q$ in the equation
      $\dfrac{p}{2} = \dfrac{r}{r + q}$
    options:
      A: '$r = \dfrac{q}{2 - p^{2}}$'
      B: '$r = \dfrac{pq^{2}}{2 - q^{2}}$'
      C: '$r = \dfrac{p^{2}q^{2}}{2 - pq}$'
      D: '$r = \dfrac{pq}{2 - p}$'
    corrected: >-
      the paper prints option D as p/(q(2 − p)), with the q moved from the numerator into the
      denominator. Solving the equation gives r = pq/(2 − p), which no option otherwise
      offers.

  - number: 15
    stem: 'If $f(x - 4) = x^{2} + 2x + 3$, find $f(2)$'
    options:
      A: "6"
      B: "11"
      C: "27"
      D: "51"

  - number: 16
    stem: 'Factorize $9(x + y)^{2} - 4(x - y)^{2}$'
    options:
      A: '$(x + y)(5x + y)$'
      B: '$(x + y)^{2}$'
      C: '$(x + 5y)(5x + y)$'
      D: '$5(x + y)^{2}$'

  - number: 17
    stem: >-
      If $a^{2} + b^{2} = 16$ and $2ab = 7$, find all the possible values of $a - b$.
    options:
      A: '3, -3'
      B: '2, -2'
      C: '1, -1'
      D: '3, -1'

  - number: 18
    stem: 'Divide $x^{3} - 2x^{2} - 5x + 6$ by $x - 1$'
    options:
      A: '$x^{2} - x - 6$'
      B: '$x^{2} - 5x + 6$'
      C: '$x^{2} - 7x + 6$'
      D: '$x^{2} - 5x - 6$'

  - number: 19
    stem: 'If $x + \dfrac{1}{x} = 4$, find $x^{2} + \dfrac{1}{x^{2}}$'
    options:
      A: "16"
      B: "14"
      C: "12"
      D: "9"
    corrected: >-
      the paper prints "If x + = 4, find the x² + 1/x", losing the 1/x from the condition and
      the square from the second term.

  - number: 20
    stem: 'What must be added to $4x^{2} - 4$ to make it a perfect square?'
    options:
      A: '$-\dfrac{1}{x^{2}}$'
      B: '$\dfrac{1}{x^{2}}$'
      C: "1"
      D: "-1"

  - number: 21
    stem: 'Find the solution of the equation $x - 8\sqrt{x} + 15 = 0$'
    options:
      A: '3, 5'
      B: '-3, -5'
      C: '9, 25'
      D: '-9, 25'

  - number: 22
    stem: >-
      The lengths of the sides of a right-angled triangle are $x$ cm, $(3x - 1)$ cm and
      $(3x + 1)$ cm. Find $x$.
    options:
      A: "5"
      B: "7"
      C: "8"
      D: "12"

  - number: 23
    stem: >-
      The perimeter of a rectangular lawn is 24 m. If the area of the lawn is
      $35\ \text{m}^{2}$, how wide is the lawn?
    options:
      A: '5 m'
      B: '7 m'
      C: '12 m'
      D: '14 m'

  - number: 24
    stem: >-
      A car painter charges ₦40.00 per day for himself and ₦10.00 per day for his assistant.
      If a fleet of cars were painted for ₦2,000.00 and the painter worked 10 days more than
      his assistant, how much did the assistant receive?
    options:
      A: '₦32.00'
      B: '₦320.00'
      C: '₦800.00'
      D: '₦1,000.00'
    corrected: >-
      the page prints this question out of sequence, after question 27, with only options A
      and B beneath it; its options C and D (800 and 1000) were displaced into the adjacent
      column and are restored here.

  - number: 25
    stem: >-
      Simplify $\dfrac{x}{x + y} + \dfrac{y}{x - y} - \dfrac{x^{2}}{x^{2} - y^{2}}$
    options:
      A: '$\dfrac{x^{2}}{x^{2} - y^{2}}$'
      B: '$\dfrac{y^{2}}{x^{2} - y^{2}}$'
      C: '$\dfrac{x}{x^{2} - y^{2}}$'
      D: '$\dfrac{y}{x^{2} - y^{2}}$'
    corrected: >-
      the paper prints the last numerator as "x2", its index dropped to the line; it is x².

  - number: 26
    stem: >-
      Given that $x^{2} + y^{2} + z^{2} = 194$, calculate $z$ if $x = 7$ and $\sqrt{y} = 3$.
    options:
      A: '$\sqrt{10}$'
      B: "8"
      C: "12.2"
      D: "13.4"

  - number: 27
    stem: >-
      Find the sum of the first twenty terms of the arithmetic progression
      $\log a,\ \log a^{2},\ \log a^{3}, \ldots$
    options:
      A: '$\log a^{20}$'
      B: '$\log a^{21}$'
      C: '$\log a^{200}$'
      D: '$\log a^{210}$'

  - number: 28
    stem: 'Find the sum of the first 18 terms of the progression $3, 6, 12, \ldots$'
    options:
      A: '$3(2^{17} - 1)$'
      B: '$3(2^{18}) - 1$'
      C: '$3(2^{18} + 1)$'
      D: '$3(2^{18} - 1)$'

