      A: '21 cm'
      B: '$17\tfrac{1}{2}$ cm'
      C: '14 cm'
      D: '$10\tfrac{1}{2}$ cm'
    needs_figure: true
    figure_svg: |
      <svg viewBox="0 0 270 250" width="270" height="250" role="img"
           aria-label="Trapezium P Q R S with Q R parallel to P S, Q R one third of P S, and the height of 10.5 cm drawn from Q">
