      </svg>

  - number: 34
    stem: >-
      In triangles $XYZ$ and $XQP$, $\angle XQP = \angle XZY$, $XP = 4$ cm, $XQ = 5$ cm and
      $PQ = QY = 3$ cm. Find $ZY$.
    options:
      A: '8 cm'
      B: '6 cm'
      C: '4 cm'
      D: '3 cm'
    needs_figure: true
    corrected: >-
      the paper marks the equal angles at Q and Z with a symbol that has printed as "0"; the
      equality they express is written into the stem.
    figure_svg: |
      <svg viewBox="0 0 270 290" width="270" height="290" role="img"
           aria-label="Triangle X Y Z with P on X Z and Q on X Y; X P is 4 cm, X Q is 5 cm, P Q and Q Y are both 3 cm, and the angle X Q P equals the angle X Z Y">
        <g fill="none" stroke="#1a1a1f" stroke-width="1.8">
          <path d="M150.0 25.0 L227.9 217.9 L83.3 276.3 Z"/>
