  - number: 32
    stem: >-
      The angle of a sector of a circle of radius 10.5 cm is $48^{\circ}$. Calculate the
      perimeter of the sector. (Take $\pi = \tfrac{22}{7}$.)
    options:
      A: '8.8 cm'
      B: '25.4 cm'
      C: '25.6 cm'
      D: '29.8 cm'

  - number: 33
    stem: >-
      In the figure above, $PS = QS = RS$ and $\angle QSR = 100^{\circ}$. Find
      $\angle QPR$.
    options:
      A: '$40^{\circ}$'
      B: '$50^{\circ}$'
      C: '$80^{\circ}$'
      D: '$100^{\circ}$'
    needs_figure: true
    corrected: >-
      the paper's stem states only PS = QS, but its figure marks all three of PS, QS and RS
      as equal; the third equality, which the question needs, is written in.
    figure_svg: |
      <svg viewBox="0 0 300 225" width="300" height="225" role="img"
           aria-label="Triangle P Q R with a point S inside joined to all three vertices, S P, S Q and S R equal, and the angle Q S R equal to 100 degrees">
        <g fill="none" stroke="#1a1a1f" stroke-width="1.8">
