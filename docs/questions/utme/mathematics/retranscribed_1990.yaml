  - number: 30
    stem: 'At what value of $x$ is the function $x^{2} + x + 1$ minimum?'
    options:
      A: "-1"
      B: '$-\tfrac{1}{2}$'
      C: '$\tfrac{1}{2}$'
      D: "1"

  - number: 31
    stem: >-
      In the diagram above, $QR \parallel PS$, the area of $PQRS$ is $73.5\ \text{cm}^{2}$
      and its height is 10.5 cm. Find the length of $PS$ if $QR$ is one-third of $PS$.
