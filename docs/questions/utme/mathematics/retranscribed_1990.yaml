          <path d="M110.3 31.5 L117.3 36.5 L110.3 41.5"/><path d="M122.2 210.0 L129.2 215.0 L122.2 220.0"/>
        </g>
        <path d="M87.6 36.5 V215.0" fill="none" stroke="#3f2fa8" stroke-width="1.6" stroke-dasharray="5 4"/>
        <path d="M87.6 204.0 L98.6 204.0 L98.6 215.0" fill="none" stroke="#1a1a1f" stroke-width="1.2"/>
        <g fill="#1a1a1f"><circle cx="40.0" cy="215.0" r="3.2"/><circle cx="87.6" cy="36.5" r="3.2"/><circle cx="147.1" cy="36.5" r="3.2"/><circle cx="218.5" cy="215.0" r="3.2"/></g>
