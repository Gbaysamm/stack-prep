  - number: 31
    stem: >-
      The angles of a quadrilateral are $(5x - 30)^{\circ}$, $(4x + 60)^{\circ}$,
      $(60 - x)^{\circ}$ and $(3x + 61)^{\circ}$. Find the smallest of these angles.
    options:
      A: '$5x - 30$'
      B: '$4x + 60$'
      C: '$60 - x$'
      D: '$3x + 61$'

  - number: 32
    stem: >-
      The area of a square is $144\ \text{cm}^{2}$. Find the length of its diagonal.
    options:
      A: '$11\sqrt{3}$ cm'
      B: '12 cm'
      C: '$12\sqrt{2}$ cm'
      D: '13 cm'

  - number: 33
    stem: >-
      One angle of a rhombus is $60^{\circ}$. The shorter of the two diagonals is 8 cm long.
      Find the length of the longer one.
    options:
      A: '$8\sqrt{3}$'
      B: '$\tfrac{16}{\sqrt{3}}$'
      C: '$5\sqrt{3}$'
      D: '$\tfrac{10}{\sqrt{3}}$'

  - number: 34
    stem: >-
      If the exterior angles of a pentagon are $x^{\circ}$, $(x + 5)^{\circ}$,
      $(x + 10)^{\circ}$, $(x + 15)^{\circ}$ and $(x + 20)^{\circ}$, find $x$.
    options:
      A: '$118^{\circ}$'
      B: '$72^{\circ}$'
      C: '$62^{\circ}$'
      D: '$36^{\circ}$'

