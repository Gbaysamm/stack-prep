# UTME 1991 Mathematics — re-transcribed by hand from MATHEMATICS-questions.pdf, pages 28-30.
#
# All 50 questions. keys_1991.yaml answered 27 and set aside the rest as unreadable or
# figure-dependent; read off the page images, every one of them resolves.
#
# All 27 of the key's answers agree with this file.
#
# Fourteen questions carry a correction note. The heaviest repairs are Q12 (the options
# print -(3 - a) where the product gives -(3 + a), and two of them have lost their x) and
# Q17 (the cubic as printed has no rational root and none of the four factorisations
# expands to it; the grouping form the options are built on restores it).
source:
  file: docs/questions/utme/mathematics/MATHEMATICS-questions.pdf
  exam_year: 1991
  paper_label: UTME 1991 Mathematics (objective)
  paper_code: UTME-1991-MATH
  pages: [28, 29, 30]
  transcribed_by: hand
  answer_source: unverified

questions:
  - number: 1
    stem: 'Simplify $3\tfrac{1}{3} - 1\tfrac{1}{4} \times \tfrac{2}{3} + 1\tfrac{2}{5}$'
    options:
      A: '$2\tfrac{17}{30}$'
      B: '$3\tfrac{9}{10}$'
      C: '$4\tfrac{1}{10}$'
      D: '$4\tfrac{11}{36}$'

  - number: 2
    stem: >-
      If $2257$ is the result of subtracting $4577$ from $7056$ in base $n$, find $n$.
    options:
      A: "8"
      B: "9"
      C: "10"
      D: "11"

  - number: 3
    stem: >-
      Find, correct to 3 decimal places,
      $\left(\dfrac{1}{0.05} \div \dfrac{1}{5.005}\right) - (0.05 \times 2.05)$
    options:
      A: "99.998"
      B: "98.999"
      C: "89.899"
      D: "9.998"

  - number: 4
    stem: 'Express $\dfrac{62}{3}$ as a decimal correct to 3 significant figures.'
    options:
      A: "20.6"
      B: "20.667"
      C: "20.67"
      D: "20.7"

  - number: 5
    stem: >-
      Factory P produces 20,000 bags of cement per day while factory Q produces 15,000 bags
      per day. If P reduces production by 5% and Q increases production by 5%, determine the
      effective loss in the number of bags produced per day by the two factories.
    options:
      A: "250"
      B: "750"
      C: "1000"
      D: "1250"

  - number: 6
    stem: >-
      Musa borrows ₦10.00 at 2% per month simple interest and repays ₦8.00 after 4 months.
      How much does he still owe?
    options:
      A: '₦10.80'
      B: '₦10.67'
      C: '₦2.80'
      D: '₦2.67'
    corrected: >-
      the paper labels the last two options C and C; the second is D. It also leaves the kind
      of interest unstated — simple interest, as the offered ₦2.80 requires, is written in.

  - number: 7
    stem: >-
      If 3 gallons of spirit containing 20% water are added to 5 gallons of another spirit
      containing 15% water, what percentage of the mixture is water?
    options:
      A: '$2\tfrac{4}{5}\%$'
      B: '$16\tfrac{7}{8}\%$'
      C: '$18\tfrac{1}{8}\%$'
      D: '$18\tfrac{7}{8}\%$'

  - number: 8
    stem: >-
      What is the product of $\dfrac{27}{5}$, $(3)^{-3}$ and $\left(\dfrac{1}{5}\right)^{-1}$?
    options:
      A: "5"
      B: "3"
      C: "1"
      D: '$\tfrac{1}{25}$'
    corrected: >-
      the paper prints "the product of 27/5 − (3)³ and (1/5)", a subtraction inside a
      product that yields none of the options. The three factors were separated by commas and
      carried negative indices; the minus signs of those indices are what survive as the stray
      dash, and restored they give exactly the offered 1.

  - number: 9
    stem: 'Simplify $2\log\dfrac{2}{5} - \log\dfrac{72}{125} + \log 9$'
    options:
      A: '$1 - 4\log 3$'
      B: '$-1 + 2\log 3$'
      C: '$-1 + 5\log 2$'
      D: '$1 - 2\log 2$'

  - number: 10
    stem: 'Rationalize $\dfrac{2\sqrt{3} + 3\sqrt{2}}{3\sqrt{2} - 2\sqrt{3}}$'
    options:
      A: '$5 - 2\sqrt{6}$'
      B: '$5 + 2\sqrt{6}$'
      C: '$5\sqrt{3}$'
      D: "5"

  - number: 11
    stem: 'Simplify $\dfrac{1}{3 + \sqrt{5}} - \dfrac{1}{3 - \sqrt{5}}$'
    options:
      A: '$-\tfrac{1}{2}\sqrt{5}$'
      B: '$\tfrac{1}{2}\sqrt{5}$'
      C: '$-\tfrac{1}{4}\sqrt{5}$'
      D: "0"
    corrected: >-
      the paper prints "(1/3 + √5) − 1/3 − √5", which as written is just −2√5 and matches no
      option. The two fractions are 1/(3 + √5) and 1/(3 − √5), their denominators having
      lost their brackets.

  - number: 12
    stem: 'Multiply $(x^{2} - 3x + 1)$ by $(x - a)$'
    options:
      A: '$x^{3} - (3 + a)x^{2} + (1 + 3a)x - 1$'
      B: '$x^{3} - (3 + a)x^{2} + 3ax - a$'
      C: '$x^{3} - (3 + a)x^{2} + (1 + 3a)x - a$'
      D: '$x^{3} + (3 + a)x^{2} + (1 + 3a)x - a$'
    corrected: >-
      the paper prints the first factor as "(x² − 3x − + 1)²" — a stray sign and a stray
      square, since every option is a cubic. In all four options the bracket is printed
      (3 − a), a sign the product cannot produce: the x² terms are −3x² and −ax², which make
      −(3 + a)x². Options C and D have also lost the x after (1 + 3a). With those restored,
      C is the product.

  - number: 13
    stem: >-
      Evaluate $\dfrac{xy^{2} - x^{2}y}{x^{2} - xy}$ when $x = -2$ and $y = 3$
    options:
      A: "-3"
      B: '$-\tfrac{3}{5}$'
      C: '$\tfrac{3}{5}$'
      D: "3"

  - number: 14
    stem: >-
      A car travels from Calabar to Enugu, a distance of $p$ km, with an average speed of $u$
      km per hour, and continues to Benin, a distance of $q$ km, with an average speed of $w$
      km per hour. Find its average speed from Calabar to Benin.
    options:
      A: '$\dfrac{p + q}{up + wq}$'
      B: '$u + w$'
      C: '$\dfrac{uw(p + q)}{wp + uq}$'
      D: '$\dfrac{wp + uq}{u + wq}$'

  - number: 15
    stem: >-
      If $w$ varies inversely as $\dfrac{uv}{u + v}$ and is equal to 8 when $u = 2$ and
      $v = 6$, find a relationship between $u$, $v$ and $w$.
    options:
      A: '$uvw = 16(u + v)$'
      B: '$16uv = 3w(u + v)$'
      C: '$uvw = 12(u + v)$'
      D: '$12uvw = u + v$'
    corrected: >-
      the paper's options print the letter v variously as p, r and t ("upw = 16(u + t)",
      "16ur = …", "12upw = u + r") — letters the question never mentions. All are v.

  - number: 16
    stem: 'If $g(x) = x^{2} + 3x$, find $g(x + 1) - g(x)$'
    options:
      A: '$x + 2$'
      B: '$2(x + 2)$'
      C: '$2x + 1$'
      D: '$x + 4$'

  - number: 17
    stem: 'Factorize $m^{3} - m^{2} + 2m - 2$'
    options:
      A: '$(m^{2} + 1)(m - 2)$'
      B: '$(m + 1)(m + 1)(m + 2)$'
      C: '$(m + 1)(m + 1)(m - 2)$'
      D: '$(m^{2} + 2)(m - 1)$'
    corrected: >-
      the paper prints the cubic as m³ − m² − m + 2. That has no rational root at all (it is
      1 at m = ±1 and 4 at m = 2), and none of the four options expands to it. The options
      are grouping factorisations of the form (m² + k)(m − j), and the stem they are built on
      is m³ − m² + 2m − 2 = m²(m − 1) + 2(m − 1): the 2 and the m of the last two terms have
      been transposed and their signs lost.

  - number: 18
    stem: 'Factorize $1 - (a - b)^{2}$'
    options:
      A: '$(1 - a - b)(1 - a - b)$'
      B: '$(1 - a + b)(1 + a - b)$'
      C: '$(1 - a + b)(1 - a + b)$'
      D: '$(1 - a - b)(1 + a - b)$'

  - number: 19
    stem: 'Which of the following is a factor of $rs + tr - pt - ps$?'
    options:
      A: '$p - s$'
      B: '$s - p$'
      C: '$r - p$'
      D: '$r + p$'

  - number: 20
    stem: >-
      Find the two values of $y$ which satisfy the simultaneous equations $3x + y = 8$ and
      $x^{2} + xy = 6$.
    options:
      A: '$-1$ and $5$'
      B: '$-5$ and $1$'
      C: '$1$ and $5$'
      D: '$1$ and $1$'

  - number: 21
    stem: >-
      Find the range of values of $x$ which satisfy the inequality
      $\dfrac{x}{2} + \dfrac{x}{3} + \dfrac{x}{4} < 1$
    options:
      A: '$x < \tfrac{12}{13}$'
      B: '$x < 13$'
      C: '$x < 9$'
      D: '$x < \tfrac{13}{12}$'

  - number: 22
    stem: >-
      Find the positive number $n$ such that thrice its square is equal to twelve times the
      number.
    options:
      A: "1"
      B: "2"
      C: "3"
      D: "4"

  - number: 23
    stem: 'Solve the equation $(x - 2)(x - 3) = 12$'
    options:
      A: '2, 3'
      B: '3, 6'
      C: '-1, 6'
      D: '1, 6'

  - number: 24
    stem: 'Simplify $\dfrac{\sqrt{1 + x} + \sqrt{x}}{\sqrt{1 + x} - \sqrt{x}}$'
    options:
      A: '$1 - 2x - 2\sqrt{x(1 + x)}$'
      B: '$1 + 2x + 2\sqrt{x(1 + x)}$'
      C: '$\sqrt{x(1 + x)}$'
      D: '$1 + 2x - 2\sqrt{x(1 + x)}$'

  - number: 25
    stem: 'Simplify $x^{2}(x^{2} - 1)^{-\frac{1}{2}} - (x^{2} - 1)^{\frac{1}{2}}$'
    options:
      A: '$(x^{2} - 1)^{\frac{1}{2}}$'
      B: '$x^{2} - 1$'
      C: '$(x^{2} - 1)^{-1}$'
      D: '$(x^{2} - 1)^{-\frac{1}{2}}$'
    corrected: >-
      the paper prints the first index as +½, which makes the expression (x² − 1)^{3/2} and
      matches no option. With −½ — the minus lost from a superscript, a constant fault in this
      compilation — it simplifies to exactly the offered (x² − 1)^{−½}.

  - number: 26
    stem: >-
      Find the gradient of the line passing through the points $(-2, 0)$ and $(0, -4)$
    options:
      A: "2"
      B: "-4"
      C: "-2"
      D: "4"

  - number: 27
    stem: 'At what value of $x$ is the function $y = x^{2} - 2x - 3$ minimum?'
    options:
      A: "1"
      B: "-1"
      C: "-4"
      D: "4"

  - number: 28
    stem: 'What is the $n$th term of the progression $27, 9, 3, \ldots$?'
    options:
      A: '$27\left(\tfrac{1}{3}\right)^{n - 1}$'
      B: '$3^{n + 2}$'
      C: '$27 + 18(n - 1)$'
      D: '$27 + 6(n - 1)$'

  - number: 29
    stem: >-
      Find the sum of the first 20 terms of an arithmetic progression whose first term is 7
      and whose last term is 117.
    options:
      A: "2480"
      B: "1240"
      C: "620"
      D: "124"

