  - number: 38
    stem: >-
      In the figure above, $PQ = PR = PS$, $QRT$ is a straight line and
      $\angle SRT = 68^{\circ}$. Find $\angle QPS$.
    options:
      A: '$136^{\circ}$'
      B: '$124^{\circ}$'
      C: '$112^{\circ}$'
      D: '$68^{\circ}$'
    needs_figure: true
    corrected: >-
      the paper names the given angle "SRTY", a fourth letter that appears nowhere in the
      figure; the marked angle is ∠SRT.
    figure_svg: |
      <svg viewBox="0 0 500 320" width="500" height="320" role="img"
           aria-label="P is joined to Q, R and S with P Q, P R and P S all equal; Q, R and T lie on a straight line and the angle S R T is 68 degrees">
        <g fill="none" stroke="#1a1a1f" stroke-width="1.7">
          <path d="M37.2 285.0 H475.0"/>
