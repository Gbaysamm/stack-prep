  - number: 18
    stem: >-
      Find the sum to infinity of the following series: $3 + 2 + \tfrac{4}{3} + \tfrac{8}{9} +
      \tfrac{16}{27} + \ldots$
    options:
      A: "1270"
      B: "190"
      C: "18"
      D: "9"

  - number: 19
    stem: 'What is the $n$th term of the sequence $2, 6, 12, 20, \ldots$?'
    options:
      A: '$4n - 2$'
      B: '$2(3n - 1)$'
      C: '$n^{2} + n$'
      D: '$n^{2} + 3n + 2$'

  - number: 20
    stem: >-
      For an arithmetic sequence, the first term is 2 and the common difference is 3. Find the
      sum of the first 11 terms.
    options:
      A: "157"
      B: "187"
      C: "197"
      D: "200"

  - number: 21
    stem: >-
      If the binary operation $*$ is defined by $m * n = mn + m + n$ for any real numbers $m$
      and $n$, find the identity element under this operation.
    options:
      A: '$e = 1$'
      B: '$e = -1$'
      C: '$e = -2$'
      D: '$e = 0$'

  - number: 22
    stem: >-
      Let $P = \begin{pmatrix} x + 2 & 1 & 3 \\ 0 & y + 2 & 1 \\ 0 & 0 & z + 2 \end{pmatrix}$
      and let $Q = P^{T}$ be the transpose of $P$. Calculate $|P^{T}|$ when $x = 0$, $y = 1$
      and $z = 2$.
    options:
      A: "48"
      B: "24"
      C: "-24"
      D: "-48"
    corrected: >-
      the paper prints the heading "Use the matrices below to answer questions 22 and 23" and
      then no matrices at all — neither P nor Q appears anywhere on the page. P is
      reconstructed here as a matrix in x, y and z whose determinant at the stated values is
      one of the offered numbers, and Q as its transpose, which is what Q23's options require.
      Both questions are reconstructed, not merely repaired.

  - number: 23
    stem: 'If $Q = P^{T}$ is the transpose of a matrix $P$, then $PQ$ is equivalent to'
    corrected: >-
      the paper prints only "PQ is equivalent to", relying on question 22 for what P and Q are;
      a student meets this question on its own, so the definition Q = P^T is stated here. The
      matrices it refers to are absent from the page too; its options only make sense if Q is
      the transpose of P, and that is how the pair is restored.
    options:
      A: '$PP^{T}$'
      B: '$PP^{-T}$'
      C: '$QP$'
      D: '$PP$'

  - number: 24
    stem: >-
      In the figure above, $UPQ$ and $TSR$ are parallel straight lines, $\angle TSP =
      105^{\circ}$ and $\angle PRQ = 20^{\circ}$. Find $\angle PQR$.
    options:
      A: '$130^{\circ}$'
      B: '$120^{\circ}$'
      C: '$75^{\circ}$'
      D: '$30^{\circ}$'
    needs_figure: true
    figure_note: >-
      the two stated angles do not by themselves fix ∠PQR — the trapezium can be sheared
      without changing either of them, so a third angle is needed and the question does not
      print one. The paper's own drawing supplies it: measured off the page, ∠QPR is 28.1°,
      against a drawing that runs 3.4° shy at S (it draws the angle marked 105° as 101.6°).
      The intended 30° gives ∠PQR = 180° - 30° - 20° = 130°; 40°, which option B would need,
      is 12° from what is drawn. The figure below marks that 30° explicitly.
    figure_svg: |
      <svg viewBox="0 0 470 225" width="470" height="225" role="img"
           aria-label="Two parallel lines U P Q and T S R with P joined to S and to R and Q joined to R; the angle T S P is 105 degrees, the angle Q P R is 30 degrees and the angle P R Q is 20 degrees">
