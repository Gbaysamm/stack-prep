  - number: 27
    stem: >-
      Determine the distance on the earth's surface between two towns
      $P(\text{Lat. }60^{\circ}\text{N},\ \text{Long. }20^{\circ}\text{E})$ and
      $Q(\text{Lat. }60^{\circ}\text{N},\ \text{Long. }25^{\circ}\text{W})$
