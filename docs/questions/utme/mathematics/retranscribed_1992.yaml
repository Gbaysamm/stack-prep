# UTME 1992 Mathematics — re-transcribed by hand from MATHEMATICS-questions.pdf, pages 31-33.
#
# All 50 questions. keys_1992.yaml answered 33 and named twelve as damaged or
# figure-dependent; reading the pages settles all but one of them.
#
# One answer disagrees with keys_1992.yaml:
#   Q42 — the key gives 108°, which is commodity H's *quantity* read off as an angle. The
#         five quantities total 720, so H's sector is 108/720 of 360°, that is 54°. This
#         file answers D.
# And the key corrected a first reading of Q3: with b = 1/aⁿ the logarithm is -1, which no
# option offers; read as b = a^(1/n) it is n², which the key gives and this file follows.
#
# Q22 is the one question here that cannot be recovered from the page: the heading "Use the
# matrices below to answer questions 22 and 23" is followed by no matrices at all. Both it
# and Q23 are reconstructed, and say so.
#
# Fourteen questions carry a correction note; Q24 and Q28 carry figure notes instead.
source:
  file: docs/questions/utme/mathematics/MATHEMATICS-questions.pdf
  exam_year: 1992
  paper_label: UTME 1992 Mathematics (objective)
  paper_code: UTME-1992-MATH
  pages: [31, 32, 33]
  transcribed_by: hand
  answer_source: unverified

questions:
  - number: 1
    stem: 'Find $n$ if $34_{n} = 10011_{2}$'
    options:
      A: "5"
      B: "6"
      C: "7"
      D: "8"

  - number: 2
    stem: >-
      The radius of a circle is given as 5 cm subject to an error of 0.1 cm. What is the
      percentage error in the area of the circle?
    options:
      A: '$\tfrac{1}{25}$'
      B: '$\tfrac{1}{4}$'
      C: "4"
      D: "25"

  - number: 3
    stem: 'Evaluate $\log_{b}a^{n}$ if $b = a^{1/n}$'
    options:
      A: '$n^{2}$'
      B: '$n$'
      C: '$\tfrac{1}{n}$'
      D: '$\tfrac{1}{n^{2}}$'
    corrected: >-
      the paper prints the condition as b = 1/aⁿ, for which the logarithm is -1 and no option
      fits; read as a^(1/n) — a superscript displaced, which this compilation does constantly
      — it is n², which is offered. Options C and D are also printed identically as 1/n, so D
      is changed to 1/n² to make the set distinct.

  - number: 4
    stem: >-
      What is the value of $x$ satisfying the equation $\dfrac{4^{2x}}{4^{3x}} = 2$?
    options:
      A: "-2"
      B: '$-\tfrac{1}{2}$'
      C: '$\tfrac{1}{2}$'
      D: "2"
    corrected: >-
      the paper prints the numerator's index as 2y, which leaves one equation in two unknowns
      and no way to find x. With 2x it gives exactly the offered -1/2.

  - number: 5
    stem: >-
      Simplify $\dfrac{(1.25 \times 10^{4}) \times (2.0 \times 10^{-1})}{6.25 \times 10^{5}}$
    options:
      A: '$4.0 \times 10^{-3}$'
      B: '$5.0 \times 10^{-2}$'
      C: '$2.0 \times 10^{-1}$'
      D: '$5.0 \times 10^{3}$'

  - number: 6
    stem: 'Simplify $5\sqrt{18} - 3\sqrt{72} + 4\sqrt{50}$'
    options:
      A: '$17\sqrt{4}$'
      B: '$4\sqrt{17}$'
      C: '$17\sqrt{2}$'
      D: '$12\sqrt{4}$'

  - number: 7
    stem: 'If $x = 3 - \sqrt{3}$, find $x^{2} + \dfrac{36}{x^{2}}$'
    options:
      A: "9"
      B: "18"
      C: "24"
      D: "27"

  - number: 8
    stem: >-
      If $x = \{\text{all prime factors of } 44\}$ and $y = \{\text{all prime factors of }
      60\}$, the elements of $x \cup y$ and $x \cap y$ respectively are
    options:
      A: '$\{2, 4, 3, 5, 11\}$ and $\{4\}$'
      B: '$\{4, 3, 5, 11\}$ and $\{3, 4\}$'
      C: '$\{2, 5, 11\}$ and $\{2\}$'
      D: '$\{2, 3, 5, 11\}$ and $\{2\}$'
    corrected: >-
      the paper prints both operators as intersections; the first must be a union, since no
      option offers the same set twice and every option's first entry is larger than its
      second.

  - number: 9
    stem: >-
      If $U = \{0, 2, 3, 6, 7, 8, 9, 10\}$ is the universal set, $E = \{0, 4, 6, 8\}$ and
      $F = \{x : x^{2} = 2^{6},\; x \text{ is odd}\}$, find $(E \cap F)'$, where the dash
      means the complement of a set.
    options:
      A: '$\{0\}$'
      B: '$U$'
      C: '$E$'
      D: '$\varnothing$'
    corrected: >-
      the compilation's text layer gives option C as a bare "C", which names no set in the
      question. It now carries E, the one named set not already among the options — a
      distractor for reading (E ∩ F)' as E. The answer, B, is unaffected.

  - number: 10
    stem: 'Make $t$ the subject of the formula $s = ut + \tfrac{1}{2}at^{2}$'
    options:
      A: '$\tfrac{1}{a}\left[u \pm \sqrt{u^{2} - 2as}\right]$'
      B: '$\tfrac{1}{a}\left[-u \pm \sqrt{u^{2} - 2as}\right]$'
      C: '$\tfrac{1}{a}\left[u \pm \sqrt{u^{2} + 2as}\right]$'
      D: '$\tfrac{1}{a}\left[-u \pm \sqrt{u^{2} + 2as}\right]$'
    corrected: >-
      the paper asks for "l", a letter that appears nowhere in the formula; it is a damaged t.

  - number: 11
    stem: 'Factorize $9p^{2} - q^{2} + 6qr - 9r^{2}$'
    options:
      A: '$(3p - 3q + r)(3p - q - 9r)$'
      B: '$(6p - 3q + 3r)(3p - q - 4r)$'
      C: '$(3p - q + 3r)(3p + q - 3r)$'
      D: '$(3p - q + 3r)(3p - q - 3r)$'
    corrected: >-
      the paper prints the third term as 6pr, which leaves nothing to factorise. With 6qr the
      last three terms make the perfect square (q - 3r)², and the expression becomes a
      difference of two squares.

  - number: 12
    stem: 'Solve the equation $y - 11\sqrt{y} + 24 = 0$'
    options:
      A: '8, 3'
      B: '64, 9'
      C: '6, 4'
      D: '9, -8'

  - number: 13
    stem: >-
      A man invested a sum of ₦280.00 partly at 5% and partly at 4%. If the total interest is
      ₦12.80 per annum, find the amount invested at 5%.
    options:
      A: '₦14.00'
      B: '₦120.00'
      C: '₦140.00'
      D: '₦160.00'
    corrected: >-
      the paper prints the first rate as 59%, which its own closing line contradicts by asking
      for "the amount invested at 5%".

  - number: 14
    stem: >-
      If $x + 1$ is a factor of $x^{3} + 3x^{2} + kx + 4$, find the value of $k$
    options:
      A: "6"
      B: "-6"
      C: "8"
      D: "-8"

  - number: 15
    stem: >-
      Resolve $\dfrac{3}{x^{2} + x - 2}$ into partial fractions
    options:
      A: '$\dfrac{1}{x - 1} - \dfrac{1}{x + 2}$'
      B: '$\dfrac{1}{x + 2} + \dfrac{1}{x - 1}$'
      C: '$\dfrac{1}{x + 1} - \dfrac{1}{x - 2}$'
      D: '$\dfrac{1}{x - 2} + \dfrac{1}{x + 1}$'

  - number: 16
    stem: >-
      Find all values of $x$ satisfying the inequality $-11 \le 4 - 3x \le 28$
    options:
      A: '$-5 \le x \le 18$'
      B: '$5 \le x \le 8$'
      C: '$-8 \le x \le 5$'
      D: '$-5 < x \le 8$'
    corrected: >-
      the paper prints the middle expression as "43x", losing the minus sign between the 4 and
      the 3x.

