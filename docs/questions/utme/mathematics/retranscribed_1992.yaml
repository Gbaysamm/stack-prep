  - number: 25
    stem: >-
      If three of the angles of a quadrilateral are $(p + 10)^{\circ}$, $(p + 20)^{\circ}$ and
      $4p^{\circ}$, and the fourth is a right angle, find $p$.
    options:
      A: "63"
      B: "40"
      C: "36"
      D: "28"
    corrected: >-
      the paper gives only three angles for a quadrilateral and asks for p, which no value
      then satisfies. A fourth angle of 90° makes the four total 360° at exactly the offered
      p = 40; no other option leaves a whole-number fourth angle.

