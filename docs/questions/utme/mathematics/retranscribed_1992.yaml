      B: '$\tfrac{800\sqrt{3}\pi}{9}$ km'
      C: '$800\pi$ km'
      D: '$800\sqrt{3}\pi$ km'

  - number: 28
    stem: >-
      If in the diagram above $FG$ is parallel to $KM$, find the value of $x$.
    options:
      A: '$75^{\circ}$'
      B: '$95^{\circ}$'
      C: '$105^{\circ}$'
      D: '$125^{\circ}$'
    needs_figure: true
    figure_note: >-
      $FG$ and $KM$ are the two near-vertical parallels, $F$ above $G$ and $K$ above $M$, and
      the path $G \to H \to K$ crosses between them. The paper prints 109° twice: once at
      $K$, where an arc plainly marks $\angle HKM$, and once beside the $x$ at $H$, where the
      arc already belongs to $x$. Those two cannot both stand — with $\angle FGH$ and
      $\angle HKM$ both 109° the relation $x = 180^{\circ} + \angle FGH - \angle HKM$ forces
      $x = 180^{\circ}$ and the figure collapses into a straight line. Measured off the page,
      $\angle FGH$ is 24.8°, which with the 109° at $K$ gives $x = 95^{\circ}$ almost exactly;
      105° would need 34° there. The figure below marks the 24° the drawing supports.
    figure_svg: |
      <svg viewBox="0 0 450 400" width="450" height="400" role="img"
           aria-label="F G and K M are parallel; the path from G up to H and across to K makes an angle of 24 degrees at G, x at H and 109 degrees at K">
