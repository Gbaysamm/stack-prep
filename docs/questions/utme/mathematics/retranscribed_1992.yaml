        </g>
        <path d="M122.17 110.14 A30 30 0 0 1 81.61 127.78" fill="none" stroke="#3f2fa8" stroke-width="1.7"/>
        <g fill="#1a1a1f">
          <circle cx="45.0" cy="210.0" r="3.2"/>
          <circle cx="93.8" cy="100.4" r="3.2"/>
          <circle cx="391.6" cy="202.9" r="3.2"/>
        </g>
        <g font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">
          <text x="27.0" y="31.5">F</text>
          <text x="25.0" y="216.0">G</text>
          <text x="87.8" y="88.4">H</text>
          <text x="401.6" y="198.9">K</text>
