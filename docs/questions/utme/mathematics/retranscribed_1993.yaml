          <circle cx="177.8" cy="132.7" r="3.2"/>
          <circle cx="88.1" cy="205.3" r="3.2"/>
          <circle cx="285.5" cy="205.3" r="3.2"/>
        </g>

        <g font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">
          <text x="56" y="56">Q</text>
          <text x="256" y="56">P</text>
