# UTME 1993 Mathematics — re-transcribed by hand from MATHEMATICS-questions.pdf, pages 34-37.
#
# All 50 questions. keys_1993.yaml answered 24 and named thirteen as unreconstructable or
# figure-dependent; reading the pages settles every one, and all 24 it covers agree with it.
#
# Several of the key's complaints are text-layer artefacts rather than faults on the page:
# Q20's options are inequality ranges, Q24's are number pairs, Q41's are lengths and Q46's
# are ages. The extractor simply could not see them.
#
# The one real oddity is Q16, which carries a circle diagram but the text and options of a
# question about two parabolas. The circle diagram belongs to no question on this paper —
# every other figure-dependent question has its own — so Q16's graph is missing and is drawn
# here from the two equations its stem names.
#
# Eleven questions carry a correction note.
source:
  file: docs/questions/utme/mathematics/MATHEMATICS-questions.pdf
  exam_year: 1993
  paper_label: UTME 1993 Mathematics (objective)
  paper_code: UTME-1993-MATH
  pages: [34, 35, 36, 37]
  transcribed_by: hand
  answer_source: unverified

questions:
  - number: 1
    stem: 'Change $71_{10}$ to base 8'
    options:
      A: '$107_{8}$'
      B: '$106_{8}$'
      C: '$71_{8}$'
      D: '$17_{8}$'

  - number: 2
    stem: 'Evaluate $\dfrac{3524}{0.05}$ correct to 3 significant figures.'
    options:
      A: "705"
      B: "70000"
      C: "70480"
      D: "70500"

  - number: 3
    stem: 'If $9^{(x - 1/2)} = 3^{x^{2}}$, find the value of $x$.'
    options:
      A: '$\tfrac{1}{2}$'
      B: "1"
      C: "2"
      D: "3"

  - number: 4
    stem: >-
      Solve for $y$ in the equation $10^{y} \times 5^{(2y - 2)} \times 4^{(y - 1)} = 1$
    options:
      A: '$\tfrac{3}{4}$'
      B: '$\tfrac{2}{3}$'
      C: "1"
      D: '$\tfrac{5}{4}$'
    corrected: >-
      the paper prints the first factor as "10y, X", losing the index on the 10 and turning
      the multiplication sign into a capital X.

  - number: 5
    stem: >-
      Simplify $\dfrac{1}{\sqrt{3} - 2} - \dfrac{1}{\sqrt{3} + 2}$
    options:
      A: "4"
      B: '$\tfrac{2}{3}$'
      C: "0"
      D: "-4"
    corrected: >-
      the paper prints the two denominators without their radical signs, as "1/3-2 - 1/3+2".

  - number: 6
    stem: 'If $2\log_{3}y + \log_{3}x^{2} = 4$, then $y$ is'
    options:
      A: '$\dfrac{4 - \log_{3}x^{2}}{2}$'
      B: '$\dfrac{4}{\log_{3}x^{2}}$'
      C: '$\tfrac{2}{x}$'
      D: '$\pm\tfrac{9}{x}$'

  - number: 7
    stem: >-
      Solve without using tables: $\log_{5}(62.5) - \log_{5}\left(\tfrac{1}{2}\right)$
    options:
      A: "3"
      B: "4"
      C: "5"
      D: "8"

  - number: 8
    stem: >-
      If ₦225.00 yields ₦27.00 in $x$ years simple interest at the rate of 4% per annum,
      find $x$.
    options:
      A: "3"
      B: "4"
      C: "12"
      D: "27"

  - number: 9
    stem: 'The shaded portion in the Venn diagram above is'
    options:
      A: '$X \cap Z$'
      B: '$X^{c} \cap Y \cap Z$'
      C: '$X \cap Y^{c} \cap Z$'
      D: '$X \cap Y \cap Z^{c}$'
    needs_figure: true
    figure_svg: |
      <svg viewBox="0 0 300 230" width="300" height="230" role="img"
           aria-label="Three overlapping circles X, Y and Z; the region inside both X and Z but outside Y is shaded">
        <defs>
          <clipPath id="v93x"><circle cx="110" cy="90" r="70"/></clipPath>
          <mask id="v93noty">
            <rect x="0" y="0" width="300" height="230" fill="#fff"/>
            <circle cx="190" cy="90" r="70" fill="#000"/>
          </mask>
        </defs>
        <g clip-path="url(#v93x)" mask="url(#v93noty)">
          <circle cx="150" cy="150" r="70" fill="#6d5ae0" fill-opacity="0.55"/>
        </g>
        <g fill="none" stroke="#1a1a1f" stroke-width="1.6">
          <circle cx="110" cy="90" r="70"/>
          <circle cx="190" cy="90" r="70"/>
          <circle cx="150" cy="150" r="70"/>
        </g>
        <g font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">
          <text x="58" y="34" text-anchor="middle">X</text>
          <text x="244" y="34" text-anchor="middle">Y</text>
          <text x="150" y="226" text-anchor="middle">Z</text>
        </g>
      </svg>

  - number: 10
    stem: 'If $\sqrt{x^{2} + 9} = x + 1$, solve for $x$'
    options:
      A: "5"
      B: "4"
      C: "3"
      D: "1"

  - number: 11
    stem: >-
      Make $x$ the subject of the relation $\dfrac{1 + ax}{1 - ax} = \dfrac{p}{q}$
    options:
      A: '$\dfrac{p + q}{a(p - q)}$'
      B: '$\dfrac{p - q}{a(p + q)}$'
      C: '$\dfrac{p - q}{apq}$'
      D: '$\dfrac{pq}{a(p - q)}$'

  - number: 12
    stem: 'Which of the following is a factor of $15 + 7x - 2x^{2}$?'
    options:
      A: '$x - 3$'
      B: '$x + 3$'
      C: '$x - 5$'
      D: '$x + 5$'

  - number: 13
    stem: >-
      Evaluate $\left(x + \dfrac{1}{x} + 1\right)^{2} - \left(x - \dfrac{1}{x} - 1\right)^{2}$
    options:
      A: '$4x^{2}$'
      B: '$\left(\tfrac{2}{x} + 2\right)^{2}$'
      C: "4"
      D: '$4(1 + x)$'
    corrected: >-
      the paper prints both brackets without their fraction bars, as "(x+1/x+1)² - (x-1/x-1)²".

  - number: 14
    stem: >-
      Solve the following simultaneous equations for $x$: $x^{2} + y - 5 = 0$ and
      $y - 7x + 3 = 0$
    options:
      A: '-2, 4'
      B: '2, 4'
      C: '-1, 8'
      D: '1, -8'

  - number: 15
    stem: 'Solve the equation $(3x - 2)(5x - 4) = (3x - 2)^{2}$'
    options:
      A: '$-\tfrac{3}{2},\; 1$'
      B: "1"
      C: '$\tfrac{2}{3},\; 1$'
      D: '$\tfrac{2}{3},\; \tfrac{4}{5}$'

  - number: 16
    stem: >-
      The figure above represents the graphs of $y = x(2 - x)$ and $y = (x - 1)(x - 3)$. What
      are the $x$-coordinates of $p$, $q$ and $r$ respectively?
    options:
      A: '1, 3, 2'
      B: '0, 0, 0'
      C: '0, 2, 3'
      D: '1, 2, 3'
    needs_figure: true
    corrected: >-
      the paper prints a circle diagram above this stem — a tangent-and-angles figure that
      belongs to no question on the paper, since every other figure-dependent question has
      its own. The graph this stem describes is missing, and is drawn here from the two
      equations the stem names, with p, q and r at the three crossings after the origin.
    figure_note: >-
      drawn from the two equations the stem names, since the paper prints a circle diagram in this place instead. p, q and r mark the three points where the curves meet the x-axis after the origin.
    figure_svg: |
      <svg viewBox="0 0 360 260" width="360" height="260" role="img"
           aria-label="The downward parabola y = x(2-x) and the upward parabola y = (x-1)(x-3), meeting the x-axis at 0, 1, 2 and 3">
        <g stroke="#1a1a1f" stroke-width="1.5" fill="none">
          <path d="M40 150 H340"/>
          <path d="M80 238 V60"/>
        </g>
        <g fill="#1a1a1f">
          <path d="M340 150 l-7 -3.5 v7 Z"/>
          <path d="M80 60 l-3.5 7 h7 Z"/>
        </g>

        <path d="M62 177.6 L80 150 L110 120 L140 110 L170 120 L200 150 L230 200"
              fill="none" stroke="#3f2fa8" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M122 122.4 L140 150 L170 180 L200 190 L230 180 L260 150 L284 111.6"
              fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-linejoin="round"/>

        <g fill="#1a1a1f">
          <circle cx="140" cy="150" r="3.4"/>
          <circle cx="200" cy="150" r="3.4"/>
          <circle cx="260" cy="150" r="3.4"/>
        </g>
        <g font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1a1f">
          <text x="140" y="170" text-anchor="middle">p</text>
          <text x="200" y="170" text-anchor="middle">q</text>
          <text x="260" y="170" text-anchor="middle">r</text>
        </g>
        <g font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1f">
          <text x="72" y="166" text-anchor="end">0</text>
          <text x="326" y="144" font-style="italic">x</text>
          <text x="62" y="68" font-style="italic">y</text>
        </g>
      </svg>

  - number: 17
    stem: >-
      If the function $f$ is defined by $f(x + 2) = 2x^{2} + 7x - 5$, find $f(-1)$
    options:
      A: "-10"
      B: "-8"
      C: "4"
      D: "10"

  - number: 18
    stem: >-
      Divide the expression $x^{3} + 7x^{2} - x - 7$ by $-1 + x^{2}$
    options:
      A: '$-x^{3} + 7x^{2} - x - 7$'
      B: '$-x^{3} - 7x + 7$'
      C: '$x - 7$'
      D: '$x + 7$'

  - number: 19
    stem: >-
      Simplify $\dfrac{\dfrac{1}{p} - \dfrac{1}{q}}{\dfrac{p}{q} - \dfrac{q}{p}}$
    options:
      A: '$\dfrac{1}{p - q}$'
      B: '$-\dfrac{1}{p + q}$'
      C: '$\dfrac{1}{pq}$'
      D: '$\dfrac{1}{pq(p - q)}$'
    corrected: >-
      the paper prints the compound fraction flat, as "1/p-1/q - p/q-q/p", with the main
      dividing bar lost.

  - number: 20
    stem: 'Solve the inequality $y^{2} - 3y > 18$'
    options:
      A: '$-2 < y < 6$'
      B: '$y < -3$ or $y > 6$'
      C: '$y > -3$ or $y > 6$'
      D: '$y < -3$ or $y < 6$'

  - number: 21
    stem: >-
      If $x$ is negative, what is the range of values of $x$ within which
      $\dfrac{x + 1}{3} > \dfrac{1}{x + 3}$?
    options:
      A: '$3 < x < 4$'
      B: '$-4 < x < -3$'
      C: '$-2 < x < -1$'
      D: '$-3 < x < 0$'
    corrected: >-
      the paper prints both fractions flat, as "x+1/3 > 1/x+3".

  - number: 22
    stem: >-
      A man's initial salary is ₦540.00 a month and increases after each period of six months
      by ₦36.00 a month. Find his salary in the eighth month of the third year.
    options:
      A: '₦828.00'
      B: '₦756.00'
      C: '₦720.00'
      D: '₦684.00'

  - number: 23
    stem: >-
      If $k + 1$, $2k - 1$, $3k + 1$ are three consecutive terms of a geometric progression,
      find the possible values of the common ratio.
    options:
      A: '0, 8'
      B: '$-1,\; \tfrac{5}{3}$'
      C: '2, 3'
      D: '1, -1'

  - number: 24
    stem: >-
      A binary operation $*$ is defined on the set of real numbers by $x * y = x^{y}$ for all
      real values of $x$ and $y$. If $x * 2 = x$, find the possible values of $x$.
    options:
      A: '0, 1'
      B: '1, 2'
      C: '2, 2'
      D: '0, 2'
    corrected: >-
      the paper prints the definition as x*y = xy, losing the index. With ordinary
      multiplication x*2 = x has the single solution 0, and every option offers two values.

