  - number: 31
    stem: >-
      In the figure above, $PT$ is a tangent to the circle at $U$ and $QU \parallel RS$. If
      $\angle TUR = 35^{\circ}$ and $\angle SRU = 50^{\circ}$, find $x$.
    options:
      A: '$95^{\circ}$'
      B: '$85^{\circ}$'
      C: '$50^{\circ}$'
      D: '$35^{\circ}$'
    needs_figure: true
    figure_svg: |
      <svg viewBox="0 0 340 290" width="340" height="290" role="img"
           aria-label="Circle with tangent PT at U; QU is parallel to RS, the angle TUR is 35 degrees and the angle SRU is 50 degrees">
        <circle cx="160" cy="150" r="90" fill="none" stroke="#1a1a1f" stroke-width="1.7"/>
        <path d="M50 60 H310" fill="none" stroke="#3f2fa8" stroke-width="1.9"/>

        <g fill="none" stroke="#1a1a1f" stroke-width="1.8" stroke-linejoin="round">
          <path d="M160 60 L244.6 119.3 L175.6 238.6 Z"/>
        </g>
        <path d="M244.6 119.3 L239.4 59.5" fill="none" stroke="#3f2fa8" stroke-width="1.6"/>

