  - number: 30
    stem: >-
      In the diagram above, $QP \parallel ST$ and $Q$, $R$, $T$ lie on a straight line. If
      $\angle QRS = 73^{\circ}$, find $\angle SRT$.
    options:
      A: '$68^{\circ}$'
      B: '$102^{\circ}$'
      C: '$107^{\circ}$'
      D: '$141^{\circ}$'
    needs_figure: true
    corrected: >-
      the paper also gives angle PQR = 34° and RS = RT. Those two are not consistent with the
      73°: taken together they would put angle SRT at 112°, which is not offered, while the
      straight line QRT gives exactly the offered 107°. The stem keeps only what the answer
      rests on.
