          <circle cx="230" cy="45" r="3.2"/>
          <circle cx="267.1" cy="159.1" r="3.2"/>
          <circle cx="170" cy="229.7" r="3.2"/>
          <circle cx="72.9" cy="159.1" r="3.2"/>
          <circle cx="110" cy="186.1" r="3.2"/>
          <circle cx="230" cy="186.1" r="3.2"/>
        </g>

        <g font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">
