        <path d="M143.9 159.3 A44 44 0 0 0 152.1 173.6" fill="none" stroke="#1a1a1f" stroke-width="1.4"/>
        <path d="M201.5 148.6 A28 28 0 0 1 160.5 154.5" fill="none" stroke="#b91c1c" stroke-width="1.7"/>

        <g fill="#1a1a1f">
