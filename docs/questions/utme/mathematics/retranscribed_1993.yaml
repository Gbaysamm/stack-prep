          <text x="96" y="200">U</text>
          <text x="236" y="200">V</text>
        </g>
      </svg>

  - number: 26
    stem: >-
      A regular polygon has $150^{\circ}$ as the size of each interior angle. How many sides
      has the polygon?
    options:
      A: "12"
      B: "10"
      C: "9"
      D: "8"

  - number: 27
    stem: >-
      Calculate the length, in cm, of the arc of a circle of diameter 8 cm which subtends an
      angle of $22\tfrac{1}{2}^{\circ}$
    options:
      A: '$2\pi$'
      B: '$\pi$'
      C: '$\tfrac{2}{3}\pi$'
      D: '$\tfrac{\pi}{2}$'

  - number: 28
