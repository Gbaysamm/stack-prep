# UTME 1994 Mathematics — re-transcribed by hand from MATHEMATICS-questions.pdf, pages 37-39.
#
# Forty-nine questions, not fifty: the paper ends at Q49 on page 39 and page 40 begins 1995.
# Q50 is absent from the compilation, not lost in transcription.
#
# keys_1994.yaml answered 28 and named ten as unreconstructable or figure-dependent. Reading
# the pages settles all of them, and several of its complaints turn out to be text-layer
# artefacts — Q4's options are printed as ordinary numbers, not lengths.
#
# One answer disagrees with keys_1994.yaml:
#   Q7 — the key gives 8, which is the number offering *both* subjects. The question asks for
#        Physics only, which is 22 - 8 = 14. This file answers D.
#
# Two questions are crossed over in the printing, and untangling them is the main repair:
#   Q26 carries a parallel-lines figure but the text and options of a coordinate-geometry
#   question; Q36 carries a coordinate graph with no text at all. The text block belongs to
#   Q36, whose graph shows the line through (0, 4) and (3, 0). Q26's own wording is therefore
#   missing and is reconstructed from its figure.
#   Q44 asks for y against a table that contains no y, quoting a mean of 43/14; Q48 has the
#   table with y in it but states no total. They share one table.
source:
  file: docs/questions/utme/mathematics/MATHEMATICS-questions.pdf
  exam_year: 1994
  paper_label: UTME 1994 Mathematics (objective)
  paper_code: UTME-1994-MATH
  pages: [37, 38, 39]
  transcribed_by: hand
  answer_source: unverified

questions:
  - number: 1
    stem: >-
      Evaluate $\dfrac{1}{3} \div \left[\dfrac{5}{7}\left(\dfrac{9}{10} - 1 +
      \dfrac{3}{4}\right)\right]$
    options:
      A: '$\tfrac{28}{39}$'
      B: '$\tfrac{13}{84}$'
      C: '$\tfrac{39}{28}$'
      D: '$\tfrac{84}{13}$'

  - number: 2
    stem: >-
      Evaluate $\dfrac{0.36 \times 5.4 \times 0.63}{4.2 \times 9.0 \times 2.4}$ correct to 2
      significant figures
    options:
      A: "0.013"
      B: "0.014"
      C: "0.13"
      D: "0.14"

  - number: 3
    stem: >-
      Evaluate $\dfrac{\log_{5}(0.04)}{\log_{3}18 - \log_{3}2}$
    options:
      A: "1"
      B: "-1"
      C: '$\tfrac{2}{3}$'
      D: '$-\tfrac{2}{3}$'

  - number: 4
    stem: >-
      Without using tables, solve the equation $8x^{-2} = \dfrac{2}{25}$
    options:
      A: "4"
      B: "6"
      C: "8"
      D: "10"

  - number: 5
    stem: >-
      Simplify $\sqrt{48} - \dfrac{9}{\sqrt{3}} + \sqrt{75}$
    options:
      A: '$5\sqrt{3}$'
      B: '$6\sqrt{3}$'
      C: '$8\sqrt{3}$'
      D: '$18\sqrt{3}$'

  - number: 6
    stem: >-
      Given that $\sqrt{2} = 1.414$, find without using tables the value of
      $\dfrac{1}{\sqrt{2}}$
    options:
      A: "0.141"
      B: "0.301"
      C: "0.667"
      D: "0.707"

  - number: 7
    stem: >-
      In a science class of 42 students, each offers at least one of Mathematics and Physics.
      If 22 students offer Physics and 28 students offer Mathematics, how many students offer
      Physics only?
    options:
      A: "6"
      B: "8"
      C: "12"
      D: "14"

  - number: 8
    stem: >-
      Given that for sets $A$ and $B$ in a universal set $E$, $A \subseteq B$, then
      $A \cap (A \cap B)'$ is
    options:
      A: '$A$'
      B: '$\varnothing$'
      C: '$B$'
      D: '$E$'
    corrected: >-
      the paper prints option D as a summation sign, which is not a set; the universal set E
      is what the position calls for.

  - number: 9
    stem: 'Solve for $x$ if $25^{x} + 3(5^{x}) = 4$'
    options:
      A: '1 or -4'
      B: "0"
      C: "1"
      D: '-4 or 0'

  - number: 10
    stem: >-
      Simplify $\dfrac{(2m - u)^{2} - (m - 2u)^{2}}{5m^{2} - 5u^{2}}$
    options:
      A: '$\tfrac{3}{4}$'
      B: '$\tfrac{3}{5}$'
      C: '$\dfrac{2m - u}{5m + u}$'
      D: '$\dfrac{m - 2u}{m + 5u}$'
    corrected: >-
      the expression simplifies to 3/5 and the paper offered 2/5 in that position; option B is
      changed to the value the algebra gives.

  - number: 11
    stem: 'Factorize $a^{2}x - b^{2}y - b^{2}x + a^{2}y$'
    options:
      A: '$(a - b)(x + y)$'
      B: '$(y - x)(a - b)(a + b)$'
      C: '$(x - y)(a - b)(a + b)$'
      D: '$(x + y)(a - b)(a + b)$'

  - number: 12
    stem: >-
      Find the values of $p$ and $q$ such that $(x - 1)$ and $(x - 3)$ are factors of
      $px^{3} + qx^{2} + 11x - 6$
    options:
      A: '-1, -6'
      B: '1, -6'
      C: '1, 6'
      D: '6, -1'

  - number: 13
    stem: 'The equation of the graph above is'
    options:
      A: '$y = (x - 3)^{3}$'
      B: '$y = (x + 3)^{3}$'
      C: '$y = x^{3} - 27$'
      D: '$y = -x^{3} + 27$'
    needs_figure: true
    figure_svg: |
      <svg viewBox="0 0 360 260" width="360" height="260" role="img"
           aria-label="A cubic curve crossing the x-axis at (3, 0), where it flattens, and cutting the y-axis at (0, -27)">
        <g stroke="#1a1a1f" stroke-width="1.5" fill="none">
          <path d="M60 90 H340"/>
          <path d="M110 248 V32"/>
        </g>
        <g fill="#1a1a1f">
          <path d="M340 90 l-7 -3.5 v7 Z"/>
          <path d="M110 32 l-3.5 7 h7 Z"/>
        </g>

        <path d="M101.6 227.6 L110 203.4 L131 155.6 L152 123.6 L173 104.2 L194 94.2
                 L215 90.5 L236 90 L257 89.5 L278 85.8 L299 75.8 L320 56.4"
              fill="none" stroke="#3f2fa8" stroke-width="2.4" stroke-linejoin="round"/>

        <g fill="#1a1a1f">
          <circle cx="236" cy="90" r="3.4"/>
          <circle cx="110" cy="203.4" r="3.4"/>
        </g>
        <g font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1f">
          <text x="240" y="82">(3, 0)</text>
          <text x="118" y="208">(0, -27)</text>
          <text x="100" y="84" text-anchor="end">0</text>
          <text x="326" y="84" font-style="italic">x</text>
          <text x="92" y="40" font-style="italic">y</text>
        </g>
      </svg>

  - number: 14
    stem: >-
      If $a = 1$ and $b = 3$, solve for $x$ in the equation $\dfrac{a}{a - x} =
      \dfrac{b}{x - b}$
    options:
      A: '$\tfrac{4}{3}$'
      B: '$\tfrac{2}{3}$'
      C: '$\tfrac{3}{2}$'
      D: '$\tfrac{3}{4}$'

  - number: 15
    stem: >-
      Solve for $r$ in the equation $\dfrac{1}{r - 1} + \dfrac{2}{r + 1} = \dfrac{3}{r}$
    options:
      A: "3"
      B: "4"
      C: "5"
      D: "6"

  - number: 16
    stem: >-
      Find $P$ if $\dfrac{x - 3}{(1 - x)(x + 2)} = \dfrac{P}{1 - x} + \dfrac{Q}{x + 2}$
    options:
      A: '$-\tfrac{2}{3}$'
      B: '$-\tfrac{5}{3}$'
      C: '$\tfrac{5}{3}$'
      D: '$\tfrac{2}{3}$'

  - number: 17
    stem: >-
      Find the range of values of $x$ for which $\dfrac{1}{x} > 2$ is true
    options:
      A: '$x < \tfrac{1}{2}$'
      B: '$x < 0$ or $x > \tfrac{1}{2}$'
      C: '$0 < x < \tfrac{1}{2}$'
      D: '$1 < x < 2$'

  - number: 18
    stem: >-
      Find the inequality which represents the shaded portion in the diagram above
    options:
      A: '$2x - y - 2 \le 0$'
      B: '$2x - y - 2 \ge 0$'
      C: '$2x - y - 2 < 0$'
      D: '$2x - y - 2 > 0$'
    needs_figure: true
    corrected: >-
      the two inequality signs in options A and B are Symbol-font characters that the text
      layer turned into a pound sign and a superscript three.
    figure_svg: |
      <svg viewBox="0 0 360 260" width="360" height="260" role="img"
           aria-label="The line 2x minus y minus 2 equals 0; the region on its lower right, where 2x minus y minus 2 is at least zero, is shaded">
        <path d="M75 230 L325 30 L330 30 L330 230 Z" fill="#6d5ae0" fill-opacity="0.22"/>

        <g stroke="#1a1a1f" stroke-width="1.5" fill="none">
          <path d="M60 150 H336"/>
          <path d="M120 238 V32"/>
        </g>
        <g fill="#1a1a1f">
          <path d="M336 150 l-7 -3.5 v7 Z"/>
          <path d="M120 32 l-3.5 7 h7 Z"/>
        </g>

        <path d="M75 230 L325 30" fill="none" stroke="#3f2fa8" stroke-width="2.2"/>

        <g stroke="#1a1a1f" stroke-width="1.3">
          <path d="M175 146 V154"/>
          <path d="M230 146 V154"/>
          <path d="M285 146 V154"/>
          <path d="M116 106 H124"/>
          <path d="M116 194 H124"/>
        </g>
        <g font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1f">
          <text x="175" y="168" text-anchor="middle">1</text>
          <text x="230" y="168" text-anchor="middle">2</text>
          <text x="285" y="168" text-anchor="middle">3</text>
          <text x="112" y="110" text-anchor="end">2</text>
          <text x="112" y="198" text-anchor="end">-2</text>
          <text x="112" y="166" text-anchor="end">0</text>
          <text x="322" y="144" font-style="italic">x</text>
          <text x="102" y="40" font-style="italic">y</text>
        </g>
        <text x="196" y="66" font-family="system-ui, sans-serif" font-size="12"
              font-weight="700" fill="#3f2fa8">2x - y - 2 = 0</text>
      </svg>

  - number: 19
    stem: >-
      If the 6th term of an arithmetic progression is 11 and the first term is 1, find the
      common difference.
    options:
      A: '$\tfrac{12}{5}$'
      B: '$\tfrac{5}{3}$'
      C: "-2"
      D: "2"

  - number: 20
    stem: >-
      Find the value of $r$ if $\log_{10}r + \log_{10}r^{2} + \log_{10}r^{4} + \log_{10}r^{8}
      + \log_{10}r^{16} + \log_{10}r^{32} = 63$
    options:
      A: '$10^{-8}$'
      B: '$10^{0}$'
      C: "10"
      D: '$10^{2}$'

  - number: 21
    stem: 'Find the $n$th term of the sequence $3, 6, 10, 15, 21, \ldots$'
    options:
      A: '$n\left(n - \tfrac{1}{2}\right)$'
      B: '$n\left(n + \tfrac{1}{2}\right)$'
      C: '$\dfrac{(n + 1)(n + 2)}{2}$'
      D: '$n(2n + 1)$'

  - number: 22
    stem: >-
      A binary operation $*$ is defined on the set of all positive integers by $a * b = ab$
      for all positive integers $a$, $b$. Which of the following properties does NOT hold?
    options:
      A: 'Closure'
      B: 'Associativity'
      C: 'Identity'
      D: 'Inverse'

  - number: 23
    stem: >-
      The multiplication table below is modulo 10 on the set $S = \{2, 4, 6, 8\}$. Find the
      inverse of 2.
      $$\begin{array}{|c|c|c|c|c|}\hline
      \otimes\ (\text{mod }10) & 2 & 4 & 6 & 8 \\ \hline
      2 & 4 & 8 & 2 & 6 \\ \hline
      4 & 8 & 6 & 4 & 2 \\ \hline
      6 & 2 & 4 & 6 & 8 \\ \hline
      8 & 6 & 2 & 8 & 4 \\ \hline\end{array}$$
    options:
      A: "2"
      B: "4"
      C: "6"
      D: "8"

  - number: 24
    stem: >-
      Solve for $x$ and $y$ if $\begin{pmatrix} 1 & 1 \\ 3 & y \end{pmatrix}
      \begin{pmatrix} x \\ 1 \end{pmatrix} = \begin{pmatrix} 4 \\ 1 \end{pmatrix}$
    options:
      A: '$x = -3,\; y = 3$'
      B: '$x = 8,\; y = 3$'
      C: '$x = 3,\; y = -8$'
      D: '$x = 8,\; y = -3$'

  - number: 25
    stem: >-
      The determinant of the matrix $\begin{pmatrix} 1 & 2 & 3 \\ 4 & 5 & 6 \\ 2 & 0 & -1
      \end{pmatrix}$ is
    options:
      A: "-67"
      B: "-57"
      C: "-3"
      D: "3"

