  - number: 27
    stem: >-
      $PT$ is a tangent to the circle $TYZX$, $YT = YX$ and $\angle PTX = 50^{\circ}$.
      Calculate $\angle TZY$.
    options:
      A: '$50^{\circ}$'
      B: '$65^{\circ}$'
      C: '$85^{\circ}$'
      D: '$130^{\circ}$'
    needs_figure: true
    figure_svg: |
      <svg viewBox="0 0 320 275" width="320" height="275" role="img"
           aria-label="Circle TYZX with the tangent PT at T, chords XY and ZT drawn, YT equal to YX, and the angle PTX marked 50 degrees">
