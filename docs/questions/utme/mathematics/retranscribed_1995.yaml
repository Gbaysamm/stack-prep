        </g>

        <g font-family="system-ui, sans-serif" font-size="13" font-weight="600">
          <text x="160" y="212" fill="#b91c1c" text-anchor="middle">14 cm</text>
          <text x="262" y="136" fill="#3f2fa8">12 cm</text>
        </g>
      </svg>

  - number: 34
    stem: >-
      In the diagram above, find $PQ$ if the area of triangle $PQR$ is $35\ \text{cm}^{2}$.
    options:
      A: '97 cm'
      B: '10 cm'
      C: '14 cm'
      D: '17 cm'
    needs_figure: true
