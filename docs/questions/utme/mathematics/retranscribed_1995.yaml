# UTME 1995 Mathematics — re-transcribed by hand from MATHEMATICS-questions.pdf, pages 40-42.
#
# All 50 questions. The paper starts partway down page 40 and ends at the top of page 42.
# keys_1995.yaml answered 26 and named eleven as unreconstructable or figure-dependent;
# reading the pages settles every one.
#
# This is the most heavily damaged paper so far — fourteen questions carry a correction note.
# Two answers disagree with keys_1995.yaml:
#   Q15 — the key gives (bx + 3)(ax - 2y), which expands to abx² + 3ax - 2bxy - 6y. The
#         question has -3ax and +6y, so that is wrong; (ax - 2y)(bx - 3) expands to the stem
#         exactly. This file answers A.
#   Q35 — the key gives 60 m, the nearest printed option to 30·tan 60° = 51.96. But option B,
#         printed "30.3m", is 30√3 with the radical damaged, and that is exactly 51.96. The
#         same damage appears in C and D, whose 10√3 is the tan-inverted slip. This file
#         answers B.
source:
  file: docs/questions/utme/mathematics/MATHEMATICS-questions.pdf
  exam_year: 1995
  paper_label: UTME 1995 Mathematics (objective)
  paper_code: UTME-1995-MATH
  pages: [40, 41, 42]
  transcribed_by: hand
  answer_source: unverified

questions:
  - number: 1
    stem: 'Calculate $3310_{5} - 1442_{5}$'
    options:
      A: '$1313_{5}$'
      B: '$2113_{5}$'
      C: '$4302_{5}$'
      D: '$1103_{5}$'

  - number: 2
    stem: 'Convert 3.1415926 to 5 decimal places'
    options:
      A: "3.14160"
      B: "3.14159"
      C: "0.31415"
      D: "3.14200"

  - number: 3
    stem: >-
      The length of a notebook, 15 cm, was measured as 16.8 cm. Calculate the percentage error
      to 2 significant figures.
    options:
      A: '12.00%'
      B: '11.00%'
      C: '10.71%'
      D: '0.12%'

  - number: 4
    stem: >-
      A worker's present salary is ₦24,000 per annum. His annual increment is 10% of his basic
      salary. What would be his annual salary at the beginning of the third year?
    options:
      A: '₦28,800'
      B: '₦29,040'
      C: '₦31,200'
      D: '₦31,944'

  - number: 5
    stem: 'Express the product of 0.0014 and 0.011 in standard form.'
    options:
      A: '$1.54 \times 10^{2}$'
      B: '$1.54 \times 10^{-3}$'
      C: '$1.54 \times 10^{4}$'
      D: '$1.54 \times 10^{-5}$'

  - number: 6
    stem: 'Evaluate $\dfrac{81^{3/4} - 27^{1/3}}{3 \times 2^{3}}$'
    options:
      A: "27"
      B: "1"
      C: '$\tfrac{1}{3}$'
      D: '$\tfrac{1}{8}$'

  - number: 7
    stem: >-
      Find the value of $(16)^{3/2} + \log_{10}0.0001 + \log_{2}32$
    options:
      A: "0.065"
      B: "0.650"
      C: "6.500"
      D: "65.00"

  - number: 8
    stem: 'Simplify $\dfrac{\sqrt{12} - \sqrt{3}}{\sqrt{12} + \sqrt{3}}$'
    options:
      A: '$\tfrac{1}{3}$'
      B: "0"
      C: '$\tfrac{9}{15}$'
      D: "1"

  - number: 9
    stem: >-
      Four members of a school first eleven cricket team are also members of the first fourteen
      rugby team. How many boys play for at least one of the two teams?
    options:
      A: "25"
      B: "21"
      C: "16"
      D: "3"

  - number: 10
    stem: 'If $S = \{x : x^{2} = 9,\; x > 4\}$, then $S$ is equal to'
    options:
      A: "0"
      B: '$\{0\}$'
      C: '$\varnothing$'
      D: '$\{\varnothing\}$'

  - number: 11
    stem: >-
      If $x - 1$ and $x + 1$ are both factors of the equation $x^{3} + px^{2} + qx + 6 = 0$,
      evaluate $p$ and $q$.
    options:
      A: '$-6, -1$'
      B: '$6, 1$'
      C: '$-1, 6$'
      D: '$6, -6$'
    corrected: >-
      the paper prints the cubic as x³ + px³ + qx + 6, with two cube terms and no square term.
      Option C is also printed as a single value, "-1"; it is completed to the pair -1, 6.

  - number: 12
    stem: >-
      Find a positive value of $p$ if the expression $2x^{2} - px + p$ leaves a remainder 6
      when divided by $x + 1$.
    options:
      A: "1"
      B: "2"
      C: "3"
      D: "4"
    corrected: >-
      the paper ends the stem "leaves a remainder 6 when added", naming no divisor. Dividing
      by x + 1 gives 2 + 2p = 6 and p = 2, which is offered.

  - number: 13
    stem: >-
      Find $T$ in terms of $K$, $Q$, $r$ and $s$ if $s = 2r\sqrt{Q\pi T + K}$
    options:
      A: '$\dfrac{s^{2}}{2\pi r^{2}Q} - \dfrac{K}{Q}$'
      B: '$\dfrac{s^{2}}{4\pi r^{2}Q} - \dfrac{K}{\pi Q}$'
      C: '$\dfrac{s^{2}}{2\pi r^{2}Q} - K$'
      D: '$\dfrac{s^{2}}{4\pi r^{2}Q} - K$'
    corrected: >-
      the paper asks for r although r appears in every option's denominator, and prints the
      numerators as r² where the working gives s². Restored as a question about T, with the
      options set over the denominators the printed ones imply. This question is
      reconstructed, not merely repaired.

  - number: 14
    stem: >-
      The graph of $f(x) = x^{2} - 5x + 6$ crosses the $x$-axis at the points
    options:
      A: '$(-6, 0)$, $(-1, 0)$'
      B: '$(-3, 0)$, $(-2, 0)$'
      C: '$(-6, 0)$, $(1, 0)$'
      D: '$(2, 0)$, $(3, 0)$'

  - number: 15
    stem: >-
      Factorize completely the expression $abx^{2} + 6y - 3ax - 2byx$
    options:
      A: '$(ax - 2y)(bx - 3)$'
      B: '$(bx + 3)(2y - ax)$'
      C: '$(bx + 3)(ax - 2y)$'
      D: '$(ax - 2y)(ax - b)$'

  - number: 16
    stem: 'Solve the inequality $(x - 3)(x - 4) \le 0$'
    options:
      A: '$3 \le x \le 4$'
      B: '$3 < x < 4$'
      C: '$3 \le x < 4$'
      D: '$3 < x \le 4$'

  - number: 17
    stem: >-
      The 4th term of an A.P. is 13 while the 10th term is 31. Find the 21st term.
    options:
      A: "175"
      B: "85"
      C: "64"
      D: "45"
    corrected: >-
      the paper asks for the 31st term, which is 94 and matches no option. The 21st term is
      64, which is offered; the 31 is an echo of the 10th term's value on the line above. The
      paper also gives the 4th term as "13cm", a length for a plain number.

  - number: 18
    stem: 'Simplify $\dfrac{x^{2} - 1}{x^{3} + 2x^{2} - x - 2}$'
    options:
      A: '$\dfrac{1}{x + 2}$'
      B: '$\dfrac{x - 1}{x + 1}$'
      C: '$\dfrac{x - 1}{x + 2}$'
      D: '$\dfrac{1}{x - 2}$'

  - number: 19
    stem: >-
      Express $\dfrac{5x - 12}{(x - 2)(x - 3)}$ in partial fractions
    options:
      A: '$\dfrac{2}{x - 2} - \dfrac{3}{x - 3}$'
      B: '$\dfrac{2}{x - 2} + \dfrac{3}{x - 3}$'
      C: '$\dfrac{2}{x - 3} - \dfrac{3}{x - 2}$'
      D: '$\dfrac{5}{x - 3} + \dfrac{4}{x - 2}$'
    corrected: >-
      the paper prints the numerator as a one-half glyph, giving "5x - ½ (x-2)(x-3)", which is
      not a fraction at all. Read as 12 it makes the expression a proper fraction whose
      decomposition is exactly option B.

  - number: 20
    stem: >-
      Use the graph of the curve $y = f(x)$ above to solve the inequality $f(x) > 0$.
    options:
      A: '$-1 < x < 1,\; x > 2$'
      B: '$x \le -1,\; 1 < x > 2$'
      C: '$x \le -1,\; 1 \le x \le 2$'
      D: '$x \le 2,\; -1 \le x \le 1$'
    corrected: >-
      the paper prints option A as -1 <= x <= 1, x > 2. At x = -1 and x = 1 the curve is on the
      x-axis, so f(x) = 0 there, not > 0, and the ends are excluded: the answer is
      -1 < x < 1 or x > 2, and option A reads with strict signs.
    needs_figure: true
    figure_svg: |
      <svg viewBox="0 0 340 250" width="340" height="250" role="img"
           aria-label="A cubic curve crossing the x-axis at -1, 1 and 2, positive between -1 and 1 and again beyond 2">
        <g stroke="#1a1a1f" stroke-width="1.5" fill="none">
          <path d="M60 150 H322"/>
          <path d="M170 232 V26"/>
        </g>
        <g fill="#1a1a1f">
          <path d="M322 150 l-7 -3.5 v7 Z"/>
          <path d="M170 26 l-3.5 7 h7 Z"/>
        </g>

        <path d="M107.6 195.1 L118 150 L128.4 117.7 L138.8 96.8 L149.2 85.5 L159.6 82.4
                 L170 86 L180.4 94.7 L190.8 107 L201.2 121.3 L211.6 136.2 L222 150
                 L232.4 161.3 L242.8 168.4 L253.2 170 L263.6 164.3 L274 150
                 L284.4 125.4 L294.8 89.1 L305.2 39.4"
              fill="none" stroke="#3f2fa8" stroke-width="2.4" stroke-linejoin="round"/>

        <g stroke="#1a1a1f" stroke-width="1.4">
          <path d="M118 145 V155"/>
          <path d="M222 145 V155"/>
          <path d="M274 145 V155"/>
        </g>
        <g font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1f" text-anchor="middle">
          <text x="116" y="168">-1</text>
          <text x="161" y="168">0</text>
          <text x="224" y="168">1</text>
          <text x="276" y="168">2</text>
        </g>
        <g font-family="system-ui, sans-serif" font-size="12" font-style="italic" fill="#1a1a1f">
          <text x="310" y="145">x</text>
          <text x="152" y="34">y</text>
        </g>
      </svg>

  - number: 21
    stem: >-
      Which of the following binary operations is commutative on the set of integers?
    options:
      A: '$a * b = a + 2b$'
      B: '$a * b = a + b - ab$'
      C: '$a * b = a^{2} + b$'
      D: '$a * b = \dfrac{a(b + 1)}{2}$'

  - number: 22
    stem: 'If $a * b = +\sqrt{ab}$, evaluate $2 * (12 * 27)$'
    options:
      A: "12"
      B: "9"
      C: "6"
      D: "2"

  - number: 23
    stem: >-
      Find the sum to infinity of the sequence $1,\; \tfrac{9}{10},\;
      \left(\tfrac{9}{10}\right)^{2},\; \left(\tfrac{9}{10}\right)^{3},\; \ldots$
    options:
      A: '$\tfrac{1}{10}$'
      B: '$\tfrac{9}{10}$'
      C: '$\tfrac{10}{9}$'
      D: "10"

  - number: 24
    stem: >-
      Find the value of $K$ if $\begin{vmatrix} -2 & 1 & 1 \\ 2 & 1 & k \\ 1 & 3 & -1
      \end{vmatrix} = 23$
    options:
      A: "1"
      B: "2"
      C: "3"
      D: "4"
    corrected: >-
      the paper prints the top-left entry as 2. That makes the first two rows share their
      leading pair, fixing the determinant at 5 - 5k, which equals 23 only at k = -3.6. With
      the minus sign restored the determinant is 9 + 7k, and k = 2 gives exactly 23.

  - number: 25
    stem: >-
      If $X = \begin{pmatrix} 1 & 2 \\ 0 & 3 \end{pmatrix}$ and
      $Y = \begin{pmatrix} 2 & 1 \\ 4 & 3 \end{pmatrix}$, find $XY$.
    options:
      A: '$\begin{pmatrix} 10 & 7 \\ 12 & 9 \end{pmatrix}$'
      B: '$\begin{pmatrix} 2 & 7 \\ 1 & 17 \end{pmatrix}$'
      C: '$\begin{pmatrix} 10 & 4 \\ 4 & 6 \end{pmatrix}$'
      D: '$\begin{pmatrix} 4 & 3 \\ 10 & 9 \end{pmatrix}$'
    corrected: >-
      the paper gives the two matrices and then goes straight to the options, never saying
      what to do with them. The options are the product XY.

