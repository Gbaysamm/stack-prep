        </g>

        <path d="M187.8 78.8 A40 40 0 0 1 135.9 81.9" fill="none" stroke="#1a1a1f" stroke-width="1.4"/>
        <path d="M226.2 157.6 A34 34 0 0 1 236.3 129" fill="none" stroke="#1a1a1f" stroke-width="1.4"/>
