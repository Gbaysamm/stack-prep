  - number: 28
    stem: >-
      In a triangle $XYZ$, $\angle YXZ = 44^{\circ}$ and $\angle XYZ = 112^{\circ}$. Calculate
      the acute angle between the internal bisectors of $\angle XYZ$ and $\angle XZY$.
    options:
      A: '$42^{\circ}$'
      B: '$56^{\circ}$'
      C: '$68^{\circ}$'
      D: '$78^{\circ}$'
    corrected: >-
      the paper reads "the acute angle between the internal triangle of ∠XYZ and ∠XZY"; an
      angle has no triangle, and bisectors are what two angles have in common.

  - number: 29
    stem: >-
      Find the distance between two towns $P(45^{\circ}\text{N}, 30^{\circ}\text{W})$ and
      $Q(15^{\circ}\text{N}, 30^{\circ}\text{W})$ if the radius of the earth is 7,000 km.
      $\left[\pi = \tfrac{22}{7}\right]$
    options:
      A: '$\tfrac{1100}{3}$ km'
      B: '$\tfrac{2200}{3}$ km'
      C: '$\tfrac{11000}{3}$ km'
      D: '$\tfrac{22000}{3}$ km'
    corrected: >-
      the paper gives P's longitude as 30°N, which is not a longitude, and Q's latitude as
      15°S. With both towns on 30°W and Q at 15°N the separation is 30° and the distance is
      the offered 11000/3. Its fourth option is also blank on the page; D is supplied as the
      value for a 60° separation, which is what 15°S would have given.

  - number: 30
    stem: >-
      Two perpendicular lines $PQ$ and $QR$ intersect at $(1, -1)$. If the equation of $PQ$ is
      $x - 2y - 3 = 0$, find the equation of $QR$.
    corrected: >-
      the paper prints PQ as x − 2y + 4 = 0, but the point (1, −1) where the lines are said to
      meet is not on that line (1 + 2 + 4 = 7, not 0). PQ is read as x − 2y − 3 = 0: the same
      gradient, through (1, −1). The keyed answer, 2x + y − 1 = 0, is unchanged.
    options:
      A: '$x - 2y + 1 = 0$'
      B: '$2x + y - 3 = 0$'
      C: '$x - 2y - 3 = 0$'
      D: '$2x + y - 1 = 0$'

  - number: 31
    stem: >-
      $P$ is on the locus of points equidistant from two given points $X$ and $Y$. $UV$ is a
      straight line through $Y$ parallel to the locus. If $\angle PYU$ is $40^{\circ}$, find
      $\angle XPY$.
    options:
      A: '$100^{\circ}$'
      B: '$80^{\circ}$'
      C: '$50^{\circ}$'
      D: '$40^{\circ}$'

  - number: 32
