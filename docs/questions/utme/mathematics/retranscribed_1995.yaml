              stroke-width="1.4" stroke-dasharray="6 4"/>

        <g stroke="#b91c1c" stroke-width="1.4" fill="none">
          <path d="M96 190 H224"/>
          <path d="M96 190 l8 -4 v8 Z" fill="#b91c1c"/>
