        <g fill="none" stroke="#1a1a1f" stroke-width="1.3">
          <path d="M82 110 L82 122 L70 122"/>
          <path d="M82 170 L82 158 L70 158"/>
        </g>

        <g font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1f">
          <text x="60" y="145" text-anchor="end">5 cm</text>
          <text x="118" y="128" text-anchor="middle">8 cm</text>
          <text x="130" y="190" text-anchor="middle">10 cm</text>
          <text x="258" y="166">11 cm</text>
        </g>
      </svg>

  - number: 31
    stem: >-
      A cone with a sector angle of $45^{\circ}$ is cut out of a circle of radius $r$ cm. Find
      the base radius of the cone.
    options:
      A: '$\tfrac{r}{16}$ cm'
      B: '$\tfrac{r}{8}$ cm'
      C: '$\tfrac{r}{4}$ cm'
      D: '$\tfrac{r}{2}$ cm'

  - number: 32
    stem: >-
      A point $P$ moves so that it is equidistant from points $L$ and $M$. If $LM$ is 16 cm,
      find the distance of $P$ from $LM$ when $P$ is 10 cm from $L$.
    options:
      A: '12 cm'
      B: '10 cm'
      C: '8 cm'
      D: '6 cm'

  - number: 33
    stem: >-
      The angle between the positive horizontal axis and a given line is $135^{\circ}$. Find
      the equation of the line if it passes through the point $(2, 3)$.
    options:
      A: '$x - y = 1$'
      B: '$x + y = 1$'
      C: '$x + y = 5$'
      D: '$x - y = 5$'

  - number: 34
    stem: >-
      Find the distance between the point $Q(4, 3)$ and the point common to the lines
      $2x - y = 4$ and $x + y = 2$
    options:
      A: '$3\sqrt{10}$'
      B: '$3\sqrt{5}$'
      C: '$\sqrt{26}$'
      D: '$\sqrt{13}$'

  - number: 35
    stem: >-
      The angle of elevation of a building from a measuring instrument placed on the ground is
      $30^{\circ}$. If the building is 40 m high, how far is the instrument from the foot of
      the building?
    options:
      A: '$20\sqrt{3}$ m'
      B: '$40\sqrt{3}$ m'
      C: '$\tfrac{40}{\sqrt{3}}$ m'
      D: '$\tfrac{20}{\sqrt{3}}$ m'
    corrected: >-
      the paper prints options C and D as 20√3 m³ and 40√3 m³ — the same two values as A and
      B, in cubic metres, which is not a unit of distance. They are replaced by the values a
      student gets from using tan where cot is needed.

  - number: 36
    stem: >-
      In a triangle $XYZ$, if $\angle XYZ$ is $60^{\circ}$, $XY = 3$ cm and $YZ = 4$ cm,
      calculate the length of the side $XZ$.
    options:
      A: '$\sqrt{23}$ cm'
      B: '$\sqrt{13}$ cm'
      C: '$2\sqrt{5}$ cm'
      D: '$2\sqrt{3}$ cm'

  - number: 37
