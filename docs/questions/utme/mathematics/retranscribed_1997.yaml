        <text x="122" y="200" font-family="system-ui, sans-serif" font-size="13"
              font-weight="700" fill="#b91c1c">θ</text>
      </svg>

  - number: 38
    stem: >-
      Differentiate $\dfrac{6x^{3} - 5x^{2} + 1}{3x^{2}}$
    options:
      A: '$2 + \dfrac{2}{3x^{3}}$'
      B: '$2 + \dfrac{1}{6x}$'
      C: '$2 - \dfrac{2}{3x^{3}}$'
      D: '$2 - \dfrac{1}{6x}$'

  - number: 39
    stem: '$\dfrac{d}{dx}\cos(3x^{2} - 2x)$ is equal to'
    options:
