    figure_svg: |
      <svg viewBox="0 0 380 250" width="380" height="250" role="img"
           aria-label="Triangle XYZ with XY 5 cm and XZ 2 cm, XZ produced to E so that the angle YZE is 150 degrees; the angle at Y is theta">
