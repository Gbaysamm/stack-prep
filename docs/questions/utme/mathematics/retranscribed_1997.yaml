# UTME 1997 Mathematics — re-transcribed by hand from MATHEMATICS-questions.pdf, pages 42-45.
#
# All 50 questions. The paper starts partway down page 42 and ends at the top of page 45.
# keys_1997.yaml answered 31 and named ten as damaged or figure-dependent; reading the pages
# settles every one. All 31 answers the key covers agree with it.
#
# Several of the key's complaints were artefacts of the text layer rather than the page:
# Q8's options are printed as ordinary percentages, Q14's formula is on the page as a
# graphic, and Q24's four options are distinct. Three genuine faults remain, and Q9 is the
# worst of them — the line defining the set Z is blank on the page.
#
# Nine questions carry a correction note.
source:
  file: docs/questions/utme/mathematics/MATHEMATICS-questions.pdf
  exam_year: 1997
  paper_label: UTME 1997 Mathematics (objective)
  paper_code: UTME-1997-MATH
  pages: [42, 43, 44, 45]
  transcribed_by: hand
  answer_source: unverified

questions:
  - number: 1
    stem: 'If $(1P03)_{4} = 115_{10}$, find $P$'
    options:
      A: "0"
      B: "1"
      C: "2"
      D: "3"

  - number: 2
    stem: >-
      Evaluate $64.764^{2} - 35.236^{2}$ correct to 3 significant figures
    options:
      A: "2960"
      B: "2950"
      C: "2860"
      D: "2850"

  - number: 3
    stem: >-
      Find the value of $(0.006)^{3} + (0.004)^{3}$ in standard form.
    options:
      A: '$2.8 \times 10^{-9}$'
      B: '$2.8 \times 10^{-8}$'
      C: '$2.8 \times 10^{-7}$'
      D: '$2.8 \times 10^{-6}$'

  - number: 4
    stem: >-
      Given that $\log_{a}2 = 0.693$ and $\log_{a}3 = 1.097$, find $\log_{a}13.5$
    options:
      A: "1.404"
      B: "1.790"
      C: "2.598"
      D: "2.790"

  - number: 5
    stem: 'Simplify $\log_{2}96 - 2\log_{2}6$'
    options:
      A: '$2 - \log_{2}3$'
      B: '$3 - \log_{2}3$'
      C: '$\log_{2}3 - 3$'
      D: '$\log_{2}3 - 2$'

  - number: 6
    stem: 'If $8^{x/2} = \left[2^{3/8}\right]\left[4^{3/4}\right]$, find $x$'
    options:
      A: '$\tfrac{3}{8}$'
      B: '$\tfrac{3}{4}$'
      C: '$\tfrac{4}{5}$'
      D: '$\tfrac{5}{4}$'

  - number: 7
    stem: >-
      Simplify $\dfrac{2\sqrt{3} + 3\sqrt{5}}{3\sqrt{5} - 2\sqrt{3}}$
    options:
      A: '$\dfrac{19 + 4\sqrt{15}}{11}$'
      B: '$\dfrac{19 + 4\sqrt{15}}{19}$'
      C: '$\dfrac{19 + 2\sqrt{15}}{11}$'
      D: '$\dfrac{19 + 2\sqrt{15}}{19}$'

  - number: 8
    stem: >-
      Find the simple interest rate per cent per annum at which ₦1,000 accumulates to ₦1,240
      in 3 years.
    options:
      A: '6%'
      B: '8%'
      C: '10%'
      D: '12%'

  - number: 9
    stem: >-
      If $U = \{S, P, L, E, N, D, O, U, R\}$, $X = \{S, P, E, N, D\}$,
      $Y = \{P, N, O, U, R\}$ and $Z = \{L, O, U, D\}$, find $X \cap (Y \cup Z)$.
    options:
      A: '$\{P, O, U, R\}$'
      B: '$\{S, P, D, R\}$'
      C: '$\{P, N, D\}$'
      D: '$\{N, D, U\}$'
    corrected: >-
      the paper's line defining Z is blank — the set is used in the expression but never
      given. Z is restored as {L, O, U, D}, the letters of SPLENDOUR that make the answer one
      of the options; the printed prime on Y is dropped, since X ∩ Y' contains S and E and no
      option does. Independently of the reconstruction, only option C is a subset of X, and
      X ∩ (anything) must be. This question is reconstructed, not merely repaired.

  - number: 10
    stem: >-
      A survey of 100 students in an institution shows that 80 students speak Hausa and 20
      students speak Igbo, while only 9 students speak both languages. How many students speak
      neither Hausa nor Igbo?
    options:
      A: "0"
      B: "9"
      C: "11"
      D: "20"

  - number: 11
    stem: >-
      If the function $f(x) = x^{3} + 2x^{2} + qx - 6$ is divisible by $x + 1$, find $q$.
    options:
      A: "-5"
      B: "-2"
      C: "2"
      D: "5"
    corrected: >-
      the paper prints "the function (x) = ...", with the f lost.

  - number: 12
    stem: >-
      Solve the simultaneous equations $\dfrac{2}{x} - \dfrac{3}{y} = 2$ and
      $\dfrac{4}{x} + \dfrac{3}{y} = 10$
    options:
      A: '$x = \tfrac{3}{2},\; y = \tfrac{1}{2}$'
      B: '$x = \tfrac{1}{2},\; y = \tfrac{3}{2}$'
      C: '$x = -\tfrac{1}{2},\; y = -\tfrac{3}{2}$'
      D: '$x = \tfrac{1}{2},\; y = -\tfrac{3}{2}$'

  - number: 13
    stem: >-
      Find the minimum value of $x^{2} - 3x + 2$ for all real values of $x$.
    options:
      A: '$-\tfrac{1}{4}$'
      B: '$-\tfrac{1}{2}$'
      C: '$\tfrac{1}{4}$'
      D: '$\tfrac{1}{2}$'

  - number: 14
    stem: >-
      Make $f$ the subject of the formula
      $t = \sqrt{\dfrac{v}{\dfrac{1}{f} + \dfrac{1}{g}}}$
    options:
      A: '$\dfrac{gv - t^{2}}{gt^{2}}$'
      B: '$\dfrac{gt^{2}}{gv - t^{2}}$'
      C: '$\dfrac{v}{t^{1/2}} - \dfrac{1}{g}$'
      D: '$\dfrac{gv}{t^{2}} - g$'

  - number: 15
    stem: >-
      What value of $g$ will make the expression $4x^{2} - 18xy + g$ a perfect square?
    options:
      A: "9"
      B: '$\tfrac{9y^{2}}{4}$'
      C: '$81y^{2}$'
      D: '$\tfrac{81y^{2}}{4}$'
    corrected: >-
      the paper prints the expression as 4x² - 18xy - g, for which g would have to be negative
      and no option is. With + g the answer is exactly the offered 81y²/4.

  - number: 16
    stem: >-
      Find the value of $K$ if $\dfrac{5 + 2r}{(r + 1)(r - 2)}$ expressed in partial fractions
      is $\dfrac{K}{r - 2} + \dfrac{L}{r + 1}$, where $K$ and $L$ are constants.
    options:
      A: "3"
      B: "2"
      C: "1"
      D: "-1"

  - number: 17
    stem: >-
      Let $f(x) = 2x + 4$ and $g(x) = 6x + 7$ where $g(x) > 0$. Solve the inequality
      $\dfrac{f(x)}{g(x)} < 1$
    options:
      A: '$x < -\tfrac{3}{4}$'
      B: '$x > -\tfrac{4}{3}$'
      C: '$x > -\tfrac{3}{4}$'
      D: '$x > -12$'

  - number: 18
    stem: >-
      Find the range of values of $x$ which satisfies the inequality $12x^{2} < x + 1$
    options:
      A: '$-\tfrac{1}{4} < x < \tfrac{1}{3}$'
      B: '$\tfrac{1}{4} < x < \tfrac{1}{3}$'
      C: '$-\tfrac{1}{3} < x < \tfrac{1}{4}$'
      D: '$-\tfrac{1}{4} < x < -\tfrac{1}{3}$'

  - number: 19
    stem: >-
      $S_{n}$ is the sum of the first $n$ terms of a series given by $S_{n} = n^{2} - 1$. Find
      the $n$th term.
    options:
      A: '$4n + 1$'
      B: '$4n - 1$'
      C: '$2n + 1$'
      D: '$2n - 1$'

  - number: 20
    stem: >-
      The $n$th term of a sequence is given by $3^{1-n}$. Find the sum of the first three terms
      of the sequence.
    options:
      A: '$\tfrac{13}{9}$'
      B: "1"
      C: '$\tfrac{1}{3}$'
      D: '$\tfrac{1}{9}$'

  - number: 21
    stem: >-
      Two binary operations $*$ and $\oplus$ are defined as $m * n = mn - n - 1$ and
      $m \oplus n = mn + n - 2$ for all real numbers $m$, $n$. Find the value of
      $3 \oplus (4 * 5)$.
    options:
      A: "60"
      B: "57"
      C: "54"
      D: "42"

  - number: 22
    stem: >-
      If $x * y = x + y - xy$, find $x$ when $(x * 2) + (x * 3) = 68$
    options:
      A: "24"
      B: "22"
      C: "-12"
      D: "-21"
    corrected: >-
      the paper prints the definition as "xy = x + y - xy", losing the star between x and y
      and so defining nothing.

  - number: 23
    stem: >-
      Determine $x + y$ if $\begin{pmatrix} 2 & -3 \\ -1 & 4 \end{pmatrix}
      \begin{pmatrix} x \\ y \end{pmatrix} = \begin{pmatrix} -1 \\ 8 \end{pmatrix}$
    options:
      A: "3"
      B: "4"
      C: "7"
      D: "12"

  - number: 24
    stem: >-
      Find the non-zero positive value of $x$ which satisfies the equation
      $\begin{vmatrix} x & 1 & 0 \\ 1 & x & 1 \\ 0 & 1 & x \end{vmatrix} = 0$
    options:
      A: "2"
      B: '$\sqrt{3}$'
      C: '$\sqrt{2}$'
      D: "1"

  - number: 25
    stem: >-
      Each of the base angles of an isosceles triangle is $58^{\circ}$ and all the vertices of
      the triangle lie on a circle. Determine the angle which the base of the triangle subtends
      at the centre of the circle.
    options:
      A: '$128^{\circ}$'
      B: '$116^{\circ}$'
      C: '$64^{\circ}$'
      D: '$58^{\circ}$'

  - number: 26
    stem: >-
      From the figure above, $FK \parallel GR$ and $FH = GH$, $\angle RFK = 34^{\circ}$ and
      $\angle FGH = 47^{\circ}$. Calculate the angle marked $x$.
