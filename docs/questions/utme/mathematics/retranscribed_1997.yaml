      </svg>

  - number: 27
    stem: >-
      The figure above shows circles of radii 3 cm and 2 cm with centres at $X$ and $Y$
      respectively. The circles have a direct common tangent of length 25 cm. Calculate
      $XY^{2}$.
    options:
      A: '$630\ \text{cm}^{2}$'
      B: '$626\ \text{cm}^{2}$'
      C: '$615\ \text{cm}^{2}$'
      D: '$600\ \text{cm}^{2}$'
    needs_figure: true
    figure_note: >-
      the circles are drawn larger than scale so they stay visible beside a tangent 25
      units long; at true scale they would be dots. Their 3 : 2 radius ratio and the
      right angles where the tangent meets each radius are exact.
    corrected: >-
      two repairs. The paper calls the tangent transverse, but the figure draws it touching
      both circles on the same side — a direct common tangent — and only the direct case gives
      an offered value. And it asks for XY while offering numbers in the hundreds: those are
      XY², since XY itself is √626, about 25.0 cm.
    figure_svg: |
      <svg viewBox="0 0 380 250" width="380" height="250" role="img"
           aria-label="Two circles of radii 3 cm and 2 cm with centres X and Y, joined by a common tangent of length 25 cm touching each circle">
        <g fill="none" stroke="#1a1a1f" stroke-width="1.7">
          <circle cx="80" cy="150" r="42"/>
          <circle cx="300" cy="150" r="28"/>
        </g>

        <g fill="none" stroke="#3f2fa8" stroke-width="1.9">
          <path d="M82.67 108.09 L301.78 122.06"/>
          <path d="M82.67 191.91 L301.78 177.94"/>
        </g>

        <g fill="none" stroke="#b91c1c" stroke-width="1.4">
          <path d="M80 150 L82.67 108.09"/>
          <path d="M300 150 L301.78 122.06"/>
        </g>
        <g fill="none" stroke="#1a1a1f" stroke-width="1.2">
          <path d="M84.6 108.2 L95.5 108.9 L95.2 119.8"/>
          <path d="M303.5 122.2 L314.4 122.9 L314.1 133.8"/>
        </g>

        <path d="M80 150 H300" fill="none" stroke="#555" stroke-width="1.3" stroke-dasharray="6 4"/>
        <g fill="#1a1a1f">
          <circle cx="80" cy="150" r="3.2"/>
          <circle cx="300" cy="150" r="3.2"/>
        </g>

        <g font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">
          <text x="80" y="174" text-anchor="middle">X</text>
          <text x="300" y="174" text-anchor="middle">Y</text>
        </g>
        <g font-family="system-ui, sans-serif" font-size="12" fill="#b91c1c">
          <text x="66" y="130" text-anchor="end">3 cm</text>
          <text x="312" y="140">2 cm</text>
        </g>
        <text x="190" y="104" font-family="system-ui, sans-serif" font-size="12"
              font-weight="600" fill="#3f2fa8" text-anchor="middle">25 cm</text>
        <text x="190" y="170" font-family="system-ui, sans-serif" font-size="12"
              fill="#555" text-anchor="middle">XY = ?</text>
      </svg>

  - number: 28
    stem: >-
      A chord of a circle of diameter 42 cm subtends an angle of $60^{\circ}$ at the centre of
      the circle. Find the length of the minor arc. $\left[\pi = \tfrac{22}{7}\right]$
    options:
      A: '22 cm'
      B: '44 cm'
      C: '110 cm'
      D: '220 cm'

  - number: 29
    stem: >-
      An arc of a circle subtends an angle of $70^{\circ}$ at the centre. If the radius of the
      circle is 6 cm, calculate the area of the sector subtended by the given angle.
      $\left[\pi = \tfrac{22}{7}\right]$
    options:
      A: '$22\ \text{cm}^{2}$'
      B: '$44\ \text{cm}^{2}$'
      C: '$66\ \text{cm}^{2}$'
      D: '$88\ \text{cm}^{2}$'

  - number: 30
    stem: 'Find the volume of the prism above.'
    options:
      A: '$990\ \text{cm}^{3}$'
      B: '$880\ \text{cm}^{3}$'
      C: '$550\ \text{cm}^{3}$'
      D: '$495\ \text{cm}^{3}$'
    needs_figure: true
    figure_svg: |
      <svg viewBox="0 0 360 250" width="360" height="250" role="img"
           aria-label="A prism whose cross-section is a right trapezium with parallel sides 8 cm and 10 cm and height 5 cm, and whose length is 11 cm">
