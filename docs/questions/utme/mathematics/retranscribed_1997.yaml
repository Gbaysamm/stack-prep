        <g font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1f">
          <text x="104" y="176" text-anchor="end">5 cm</text>
          <text x="216" y="132" text-anchor="middle">2 cm</text>
          <text x="252" y="198" text-anchor="middle">150°</text>
