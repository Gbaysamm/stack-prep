        <g fill="none" stroke="#1a1a1f" stroke-width="1.8" stroke-linejoin="round">
          <path d="M70 110 L166 110 L190 170 L70 170 Z"/>
          <path d="M70 110 L190 60 L286 60 L166 110"/>
