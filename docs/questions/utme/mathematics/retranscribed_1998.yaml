# UTME 1998 Mathematics — re-transcribed by hand from MATHEMATICS-questions.pdf, pages 45-47.
#
# All 50 questions. The extractor kept 46; keys_1998.yaml answered 34 and named twelve as
# damaged, truncated or figure-dependent. Reading the pages settles every one of them.
#
# Two answers here disagree with keys_1998.yaml:
#   Q37 — the key gives 150(1 + √3), which requires the horizontal distance to be h·tan θ.
#         For an angle of depression it is h/tan θ, giving 150 + 50√3 = 50(3 + √3). The key
#         is wrong; this file answers B.
#   Q40 — the key gives π/2 and this file agrees, against a first reading of the printed
#         limits as 2 and π. The paper renders "π/2" as a π with a subscript 2, exactly as
#         it renders 12½ as 12 with a superscript 1 and subscript 2 in Q36's options. The
#         subscript is a lost fraction slash, not a lower limit.
#
# Nine questions carry a correction note. Q9 is the notable one: options C and D are printed
# identically, so the question had no unique answer as it stood.
source:
  file: docs/questions/utme/mathematics/MATHEMATICS-questions.pdf
  exam_year: 1998
  paper_label: UTME 1998 Mathematics (objective)
  paper_code: UTME-1998-MATH
  pages: [45, 46, 47]
  transcribed_by: hand
  answer_source: unverified

questions:
  - number: 1
    stem: 'If $1011_{2} + X_{7} = 25_{10}$, solve for $X$'
    options:
      A: "14"
      B: "20"
      C: "24"
      D: "25"

  - number: 2
    stem: >-
      Evaluate $\left[\dfrac{1}{0.03} \div \dfrac{1}{0.024}\right]^{-1}$, correct to 2 decimal
      places
    options:
      A: "3.76"
      B: "1.25"
      C: "0.94"
      D: "0.75"

  - number: 3
    stem: >-
      If $b^{3} = a^{-3}$ and $c^{1/3} = a^{1/2}b$, express $c$ in terms of $a$
    options:
      A: '$a^{-1/2}$'
      B: '$a^{1/2}$'
      C: '$a^{-3/2}$'
      D: '$a^{-2/3}$'
    corrected: >-
      the paper prints "express in terms of a" with no subject at all; c is the only one the
      two conditions leave unknown. Its option C then prints as a^(3/2), which is the answer
      with the minus sign lost — a^(-1/2), option A, is exactly c^(1/3), the value before
      cubing, so the option set only makes sense with C negative.

  - number: 4
    stem: >-
      Given that $\log_{4}(y - 1) + \log_{4}\left(\tfrac{1}{2}x\right) = 1$ and
      $\log_{2}(y + 1) + \log_{2}x = 2$, solve for $x$ and $y$ respectively
    options:
      A: '2, 3'
      B: '3, 2'
      C: '-2, -3'
      D: '-3, -2'

  - number: 5
    stem: >-
      Find the value of $K$ if $\dfrac{K}{\sqrt{3} + \sqrt{2}} = \sqrt{6} - 2$
    options:
      A: "3"
      B: "2"
      C: '$\sqrt{3}$'
      D: '$\sqrt{2}$'
    corrected: >-
      the paper prints the right-hand side as √3 - 2, which gives K = 3 + √6 - 2√3 - 2√2 and
      matches no option. With √6 - 2 it gives exactly √2, which is offered; the 6 is damaged
      to a 3.

  - number: 6
    stem: >-
      A market woman sells oil in cylindrical tins 10 cm deep and 6 cm in diameter at ₦15.00
      each. If she bought a full cylindrical jug 18 cm deep and 10 cm in diameter for ₦50.00,
      how much did she make by selling all the oil?
    options:
      A: '₦62.50'
      B: '₦35.00'
      C: '₦31.00'
      D: '₦25.00'

  - number: 7
    stem: >-
      A man is paid $r$ naira per hour for normal work and double the rate for overtime. If he
      does a 35-hour week which includes $q$ hours of overtime, what is his weekly earning in
      naira?
    options:
      A: '$r(35 + q)$'
      B: '$q(35r - q)$'
      C: '$q(35r + r)$'
      D: '$r(35r - q)$'

  - number: 8
    stem: >-
      Given the universal set $U = \{1, 2, 3, 4, 5, 6\}$ and the sets $P = \{1, 2, 3, 4\}$,
      $Q = \{3, 4, 5\}$ and $R = \{2, 4, 6\}$, find $P \cup (Q \cup R)$.
    options:
      A: '$\{4\}$'
      B: '$\{1, 2, 3, 4\}$'
      C: '$\{1, 2, 3, 5, 6\}$'
      D: '$\{1, 2, 3, 4, 5, 6\}$'

  - number: 9
    stem: >-
      In the Venn diagram above, the shaded region is
    options:
      A: '$(P \cap Q) \cup R$'
      B: '$(P \cap Q) \cap R$'
      C: '$(P \cap Q'') \cap R$'
      D: '$(P \cup Q'') \cap R$'
    needs_figure: true
    corrected: >-
      the paper prints options C and D identically, as (P∩Q')∩R both times, so the question
      had two correct answers and no unique one. D's first operator is changed to a union,
      which makes it a genuine distractor and leaves C as the only correct option.
    figure_svg: |
      <svg viewBox="0 0 300 230" width="300" height="230" role="img"
           aria-label="Three overlapping circles P, Q and R; the region inside both P and R but outside Q is shaded">
        <defs>
          <clipPath id="v98p"><circle cx="110" cy="90" r="70"/></clipPath>
          <mask id="v98notq">
            <rect x="0" y="0" width="300" height="230" fill="#fff"/>
            <circle cx="190" cy="90" r="70" fill="#000"/>
          </mask>
        </defs>
        <g clip-path="url(#v98p)" mask="url(#v98notq)">
          <circle cx="150" cy="150" r="70" fill="#6d5ae0" fill-opacity="0.55"/>
        </g>
        <g fill="none" stroke="#1a1a1f" stroke-width="1.6">
          <circle cx="110" cy="90" r="70"/>
          <circle cx="190" cy="90" r="70"/>
          <circle cx="150" cy="150" r="70"/>
        </g>
        <g font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">
          <text x="58" y="34" text-anchor="middle">P</text>
          <text x="244" y="34" text-anchor="middle">Q</text>
          <text x="150" y="226" text-anchor="middle">R</text>
        </g>
      </svg>

  - number: 10
    stem: >-
      When the expression $pm^{2} + qm + 1$ is divided by $(m - 1)$ it has remainder 2, and
      when divided by $(m + 1)$ the remainder is 4. Find $p$ and $q$ respectively.
    options:
      A: '2, -1'
      B: '-1, 2'
      C: '3, -2'
      D: '-2, 3'

  - number: 11
    stem: 'Factorize $r^{2} - r(2p + q) + 2pq$'
    options:
      A: '$(r - 2q)(2r - p)$'
      B: '$(r - q)(r + p)$'
      C: '$(r - q)(r - 2p)$'
      D: '$(2r - q)(r + p)$'

  - number: 12
    stem: 'Solve the equation $\sqrt{x} - \sqrt{x - 2} - 1 = 0$'
    options:
      A: '$\tfrac{3}{2}$'
      B: '$\tfrac{2}{3}$'
      C: '$\tfrac{4}{9}$'
      D: '$\tfrac{9}{4}$'

  - number: 13
    stem: >-
      Find the range of values of $m$ for which the roots of the equation
      $3x^{2} - 3mx + (m^{2} - m - 3) = 0$ are real.
    options:
      A: '$-1 < m < 7$'
      B: '$-2 < m < 6$'
      C: '$-3 < m < 9$'
      D: '$-4 < m < 8$'
    corrected: >-
      the paper's stem stops after the equation, leaving out the condition on the roots. Real
      roots is the only condition that produces any of the offered ranges.

  - number: 14
    stem: >-
      Make $\dfrac{a}{x}$ the subject of the formula $\dfrac{x + a}{x - a} = m$
    options:
      A: '$\dfrac{m - 1}{m + 1}$'
      B: '$\dfrac{1 + m}{1 - m}$'
      C: '$\dfrac{1 - m}{1 + m}$'
      D: '$\dfrac{m + 1}{m - 1}$'

  - number: 15
    stem: 'Divide $2x^{3} + 11x^{2} + 17x + 6$ by $2x + 1$'
    options:
      A: '$x^{2} + 5x + 6$'
      B: '$2x^{2} + 5x + 6$'
      C: '$2x^{2} - 5x + 6$'
      D: '$x^{2} - 5x + 6$'

  - number: 16
    stem: >-
      Express $\dfrac{11x + 2}{6x^{2} - x - 1}$ in partial fractions
    options:
      A: '$\dfrac{1}{3x - 1} + \dfrac{3}{2x + 1}$'
      B: '$\dfrac{3}{3x + 1} - \dfrac{1}{2x - 1}$'
      C: '$\dfrac{3}{3x - 1} - \dfrac{1}{2x + 1}$'
      D: '$\dfrac{1}{3x + 1} + \dfrac{3}{2x - 1}$'

  - number: 17
    stem: >-
      If $x$ is a positive real number, find the range of values for which
      $\dfrac{1}{3x} + \dfrac{1}{2} > \dfrac{1}{4x}$
    options:
      A: '$x > -\tfrac{1}{6}$'
      B: '$x > 0$'
      C: '$0 < x < 4$'
      D: '$0 < x < \tfrac{1}{6}$'

  - number: 18
    stem: 'The shaded area above represents'
    options:
      A: '$x \ge 0,\; 3y + 2x \ge 6$'
      B: '$x \ge 0,\; y \ge 3,\; 3x + 2y \ge 6$'
      C: '$x \ge 2,\; y \ge 0,\; 3x + 2y \le 6$'
      D: '$x \ge 0,\; y \ge 0,\; 3x + 2y \ge 6$'
    needs_figure: true
    figure_svg: |
      <svg viewBox="0 0 340 240" width="340" height="240" role="img"
