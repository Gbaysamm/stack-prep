          <text x="312" y="184" font-style="italic">x</text>
          <text x="54" y="38" font-style="italic">y</text>
        </g>
      </svg>

  - number: 19
    stem: >-
      If $p + 1$, $2p - 10$, $1 - 4p^{2}$ are consecutive terms of an arithmetic progression,
      find the possible values of $p$.
    options:
      A: '-4, 2'
      B: '$-2, \tfrac{4}{11}$'
      C: '$-\tfrac{11}{4}, 2$'
      D: '5, -3'

  - number: 20
    stem: >-
      The sum of the first three terms of a geometric progression is half its sum to infinity.
      Find the positive common ratio of the progression.
    options:
      A: '$\tfrac{1}{4}$'
      B: '$\tfrac{1}{2}$'
      C: '$\dfrac{1}{\sqrt[3]{3}}$'
      D: '$\dfrac{1}{\sqrt[3]{2}}$'

  - number: 21
    stem: >-
      The identity element with respect to the multiplication shown in the table below is
      $$\begin{array}{|c|c|c|c|c|}\hline
      \otimes & p & q & r & s \\ \hline
      p & r & p & r & p \\ \hline
      q & p & q & r & s \\ \hline
      r & r & r & r & r \\ \hline
      s & q & s & r & q \\ \hline\end{array}$$
    options:
      A: '$p$'
      B: '$q$'
      C: '$r$'
      D: '$s$'

  - number: 22
    stem: >-
      The binary operation $*$ is defined by $x * y = xy - y - x$ for all real values $x$ and
      $y$. If $x * 3 = 2 * x$, find $x$.
    options:
      A: "-1"
      B: "0"
      C: "1"
      D: "5"

  - number: 23
    stem: >-
      The determinant of the matrix $\begin{pmatrix} x & 1 & 0 \\ 1 - x & 2 & 3 \\ 1 & 1 + x &
      4 \end{pmatrix}$ in terms of $x$ is
    options:
      A: '$-3x^{2} - 17$'
      B: '$-3x^{2} + 9x - 1$'
      C: '$3x^{2} + 17$'
      D: '$3x^{2} - 9x + 5$'

  - number: 24
    stem: >-
      Let $I = \begin{pmatrix} 1 & 0 \\ 0 & 1 \end{pmatrix}$, $P = \begin{pmatrix} 2 & 3 \\ 4 &
      5 \end{pmatrix}$ and $Q = \begin{pmatrix} u & 4 + u \\ -2v & v \end{pmatrix}$ be
      $2 \times 2$ matrices such that $PQ = I$. Find $(u, v)$.
    options:
      A: '$\left(-\tfrac{5}{2}, -1\right)$'
      B: '$\left(-\tfrac{5}{2}, \tfrac{3}{2}\right)$'
      C: '$\left(-\tfrac{5}{6}, 1\right)$'
      D: '$\left(\tfrac{5}{2}, \tfrac{2}{3}\right)$'

