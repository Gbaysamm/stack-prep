  - number: 25
    stem: >-
      Find the length $XZ$ in the triangle above.
    options:
      A: '$\sqrt{7}$ m'
      B: '$\sqrt{6}$ m'
      C: '$\sqrt{5}$ m'
      D: '$\sqrt{3}$ m'
    needs_figure: true
    corrected: >-
      the figure's labels print as "120cm" for the angle at Y and "1cm" for YZ. The angle is
      120° and YZ is 1 m; with XY = 2 m the cosine rule then gives √7 m, which is offered.
    figure_svg: |
      <svg viewBox="0 0 270 245" width="270" height="245" role="img"
           aria-label="Triangle XYZ with XY = 2 m, YZ = 1 m and the angle at Y equal to 120 degrees; XZ is required">
