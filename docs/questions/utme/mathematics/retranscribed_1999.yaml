        <g font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">
          <text x="42" y="146">P</text>
          <text x="270" y="146">Q</text>
          <text x="208" y="252">R</text>
          <text x="56" y="212">S</text>
          <text x="106" y="138">T</text>
        </g>
