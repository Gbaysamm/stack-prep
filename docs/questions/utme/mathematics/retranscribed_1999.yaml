        </g>
        <text x="126" y="120" font-family="system-ui, sans-serif" font-size="14"
              font-weight="700" fill="#3f2fa8">?</text>
      </svg>

  - number: 26
    stem: >-
      Find a positive value of $a$ if the coordinate of the centre of a circle
      $x^{2} + y^{2} - 2ax + 4y - a = 0$ is $(a, -2)$ and the radius is 4 units.
    options:
      A: "1"
      B: "2"
      C: "3"
      D: "4"

  - number: 27
    stem: >-
      A man 1.7 m tall observes a bird on top of a tree at an angle of $30^{\circ}$. If the
      distance between the man's head and the bird is 25 m, what is the height of the tree?
    options:
      A: '26.7 m'
      B: '14.2 m'
      C: '$\tfrac{1.7 + 25\sqrt{3}}{3}$ m'
      D: '$\tfrac{1.7 + 25\sqrt{2}}{2}$ m'

  - number: 28
    stem: >-
