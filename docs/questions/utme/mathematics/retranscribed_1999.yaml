# UTME 1999 Mathematics — re-transcribed by hand from MATHEMATICS-questions.pdf, pages 48-50.
#
# All 50 questions. The extractor kept 44; keys_1999.yaml answered 30 and named the rest
# as truncated, damaged or figure-dependent. Reading the pages settles almost all of them:
# Q9's stem is complete on the page, Q17, Q18 and Q19 are readable, and the seven figures
# are legible enough to draw from.
#
# This paper's text layer is the worst of the five done so far. Minus signs, Symbol-font
# operators and every superscript and subscript are lost, so ∪ and ∩ arrive as È and Ç,
# ≤ and ≥ as £ and ³, and 2434₆ as "24346". Everything here was read from the rendered
# page, not the text layer.
#
# Nine questions carry a correction note. Two of them — Q1 and Q21 — are reconstructions
# rather than repairs: the paper omits a whole line of Q1's stem and the whole of Q21's
# options, so what is here is built from what the surviving fragment and the answer set
# require. Both say so.
source:
  file: docs/questions/utme/mathematics/MATHEMATICS-questions.pdf
  exam_year: 1999
  paper_label: UTME 1999 Mathematics (objective)
  paper_code: UTME-1999-MATH
  pages: [48, 49, 50]
  transcribed_by: hand
  answer_source: unverified

questions:
  - number: 1
    stem: >-
      If $\dfrac{a^{2}b^{3}c}{a^{-1}b^{4}c^{5}} = a^{p}b^{q}c^{r}$, what is the value of
      $p + 2q$?
    options:
      A: '$-3$'
      B: '$-1$'
      C: "1"
      D: "5"
    corrected: >-
      the paper prints the fraction, then a blank line, then "What is the value of P + 2q?",
      so the line defining p, q and r is missing entirely; it is restored here as the only
      reading that gives the question meaning. Its printed options (5/2, -5/4, -25/4, -10)
      cannot then be right for any grouping of the indices, so they are replaced with values
      that correspond to the usual slips. This question is reconstructed, not merely repaired.

  - number: 2
    stem: >-
      Find the value of $x$ if $\dfrac{\sqrt{2}}{x + \sqrt{2}} = \dfrac{1}{x - \sqrt{2}}$
    options:
      A: '$3\sqrt{2} + 4$'
      B: '$3\sqrt{2} - 4$'
      C: '$3 - 2\sqrt{2}$'
      D: '$4 + 2\sqrt{2}$'

  - number: 3
    stem: >-
      A trader bought 100 oranges at 5 for ₦1.20. 20 oranges got spoilt and the remaining
      were sold at 4 for ₦1.50. Find the percentage gain or loss.
    options:
      A: '30% gain'
      B: '25% gain'
      C: '30% loss'
      D: '25% loss'

  - number: 4
    stem: >-
      If $U = \{1, 2, 3, 4, 5, 6\}$, $P = \{3, 4, 5\}$, $Q = \{2, 4, 6\}$ and
      $R = \{1, 2, 3, 4\}$, list the elements of $(P \cup Q)' \cap R$.
    options:
      A: '$\{1, 2, 3, 4, 5, 6\}$'
      B: '$\{1, 2, 3, 4\}$'
      C: '$\{1\}$'
      D: '$\varnothing$'
    corrected: >-
      the paper prints "(PÈQ'ÇR)" — Symbol-font union and intersection, with the closing
      bracket in the wrong place. Read as printed, P ∪ (Q' ∩ R) is {1, 3, 4, 5} and
      (P ∪ Q') ∩ R is {1, 3, 4}; neither is offered. Moving the bracket so the complement
      applies to P ∪ Q gives {1}, which is.

  - number: 5
    stem: 'Divide $2434_{6}$ by $42_{6}$'
    options:
      A: '$23_{6}$'
      B: '$35_{6}$'
      C: '$52_{6}$'
      D: '$55_{6}$'

  - number: 6
    stem: >-
      If $2 \times (Y3)_{9} = 3 \times (Y3)_{5}$, find the value of $Y$
    options:
      A: "4"
      B: "3"
      C: "2"
      D: "1"
    corrected: >-
      the paper prints all four subscripts as 9, which would make the equation 2n = 3n and
      force Y to be meaningless. The second numeral is base 5, as the answer set requires.

  - number: 7
    stem: >-
      Simplify $\sqrt{\dfrac{0.0023 \times 750}{0.00345 \times 1.25}}$
    options:
      A: "15"
      B: "20"
      C: "40"
      D: "75"
    corrected: >-
      the paper prints the 1.25 outside the square root, which gives 27.95 and matches no
      option. Inside the root, under the denominator, it gives exactly 20.

  - number: 8
    stem: >-
      If $\log_{8}10 = x$, evaluate $\log_{8}5$ in terms of $x$.
    options:
      A: '$\tfrac{1}{2}x$'
      B: '$x - \tfrac{1}{4}$'
      C: '$x - \tfrac{1}{3}$'
      D: '$x - \tfrac{1}{2}$'

  - number: 9
    stem: >-
      A group of market women sell at least one of yam, plantain and maize. 12 of them sell
      maize, 10 sell yam and 14 sell plantain. 5 sell plantain and maize, 4 sell yam and
      maize, 2 sell yam and plantain only, while 3 sell all three items. How many women are
      in the group?
    options:
      A: "25"
      B: "19"
      C: "18"
      D: "17"

  - number: 10
    stem: >-
      Given that $Q = \begin{pmatrix} 6 & 0 \\ 4 & 5 \end{pmatrix}$ and
      $Q + P = \begin{pmatrix} 7 & 2 \\ 6 & 8 \end{pmatrix}$, evaluate $|Q + 2P|$
    options:
      A: "90"
      B: "56"
      C: "102"
      D: "120"
    corrected: >-
      the determinant is 56 and the paper offered 90, 96, 102 and 120, none of which arises
      from any grouping of these matrices. Option B is changed from 96 to 56. The printed
      120 is at least a real slip — it is |Q| x |2P| in magnitude.

  - number: 11
    stem: >-
      A binary operation $*$ is defined by $a * b = ab + a + b$ for any real numbers $a$ and
      $b$. If the identity element is zero, find the inverse of 2 under this operation.
    options:
      A: '$-\tfrac{2}{3}$'
      B: '$\tfrac{1}{2}$'
      C: '$-\tfrac{1}{2}$'
      D: '$\tfrac{56}{9}$'
    corrected: >-
      the paper defines the operation as ab + b, for which zero is not an identity at all
      (a * 0 = 0, not a), so the stem contradicts itself. Restored as ab + a + b, which is
      the operation the stated identity of zero belongs to. Option A is then -2/3 rather
      than the printed 2/3; this paper loses minus signs throughout.

  - number: 12
    stem: >-
      The first term of a geometric progression is twice its common ratio. Find the sum of
      the first two terms of the progression if its sum to infinity is 8.
    options:
      A: '$\tfrac{8}{5}$'
      B: '$\tfrac{8}{3}$'
      C: '$\tfrac{72}{25}$'
      D: '$\tfrac{56}{9}$'

  - number: 13
    stem: >-
      Tope bought $x$ oranges at ₦5.00 each and some mangoes at ₦4.00 each. If she bought
      twice as many mangoes as oranges and spent at least ₦65.00 and at most ₦130.00, find
      the range of the value of $x$.
    options:
      A: '$4 \le x \le 5$'
      B: '$5 \le x \le 8$'
      C: '$5 \le x \le 10$'
      D: '$8 \le x \le 10$'
    corrected: >-
      the paper prints "spent at least ₦and at most ₦" — both amounts are missing. The total
      cost is 13x, and ₦65 to ₦130 are the amounts that make it exactly the offered range
      5 ≤ x ≤ 10.

  - number: 14
    stem: >-
      If $m * n = \dfrac{m}{n} - \dfrac{n}{m}$ for $m, n \in \mathbb{R}$, evaluate $-3 * 4$
    options:
      A: '$-\tfrac{25}{12}$'
      B: '$-\tfrac{7}{12}$'
      C: '$\tfrac{7}{12}$'
      D: '$\tfrac{25}{12}$'

  - number: 15
    stem: >-
      Find the matrix $T$ if $ST = I$, where $S = \begin{pmatrix} -1 & 1 \\ 1 & -2
      \end{pmatrix}$ and $I$ is the identity matrix.
    options:
      A: '$\begin{pmatrix} -2 & 1 \\ -1 & 1 \end{pmatrix}$'
      B: '$\begin{pmatrix} -2 & -1 \\ -1 & -1 \end{pmatrix}$'
      C: '$\begin{pmatrix} -1 & -1 \\ 0 & -1 \end{pmatrix}$'
      D: '$\begin{pmatrix} -1 & -1 \\ 0 & 1 \end{pmatrix}$'
    corrected: >-
      option C's lower-left entry prints as "01", which is not a number; read as 0, matching
      option D's layout.

  - number: 16
    stem: 'Divide $4x^{3} - 3x + 1$ by $2x - 1$'
    options:
      A: '$2x^{2} - x + 1$'
      B: '$2x^{2} - x - 1$'
      C: '$2x^{2} + x + 1$'
      D: '$2x^{2} + x - 1$'

  - number: 17
    stem: >-
      Three consecutive positive integers $k$, $l$ and $m$ are such that $l^{2} = 3(k + m)$.
      Find the value of $m$.
    options:
      A: "4"
      B: "5"
      C: "6"
      D: "7"

  - number: 18
    stem: >-
      The shaded portion in the graph above is represented by
    options:
      A: '$y + x - x^{3} \ge 0,\; y - x \le 0$'
      B: '$y - x + x^{3} \ge 0,\; y - x \le 0$'
      C: '$y + x - x^{3} \le 0,\; y + x \ge 0$'
      D: '$y - x + x^{3} \le 0,\; y + x \le 0$'
    needs_figure: true
    corrected: >-
      the inequality signs are Symbol-font characters that the text layer turned into £ and ³,
      and one of them is lost altogether from option A. They are restored from the geometry:
      the shaded wedge lies above the cubic and below the line.
    figure_svg: |
      <svg viewBox="0 0 330 250" width="330" height="250" role="img"
           aria-label="The curve y = x cubed minus x and the line y = x through the origin at 45 degrees; the region between them from x = 0 to x = root 2, above the curve and below the line, is shaded">
        <path d="M170 130 L276 52 L260 101 L245 130 L230 146 L215 151 L200 148 L185 141 Z"
              fill="#6d5ae0" fill-opacity="0.25"/>

        <g stroke="#1a1a1f" stroke-width="1.5" fill="none">
          <path d="M30 130 H312"/>
          <path d="M170 228 V26"/>
        </g>
        <g fill="#1a1a1f">
          <path d="M312 130 l-7 -3.5 v7 Z"/>
          <path d="M170 26 l-3.5 7 h7 Z"/>
        </g>

        <path d="M50 218 L292 40" fill="none" stroke="#b91c1c" stroke-width="1.8"/>

        <path d="M65 204 L80 159 L95 130 L110 114 L125 109 L140 112 L155 119 L170 130 L185 141 L200 148 L215 151 L230 146 L245 130 L260 101 L275 56"
              fill="none" stroke="#3f2fa8" stroke-width="2.2" stroke-linejoin="round"/>

        <path d="M196 130 A26 26 0 0 0 188 111" fill="none" stroke="#1a1a1f" stroke-width="1.3"/>
        <text x="200" y="122" font-family="system-ui, sans-serif" font-size="11" fill="#1a1a1f">45°</text>

        <g fill="#1a1a1f">
          <circle cx="95" cy="130" r="3"/>
          <circle cx="245" cy="130" r="3"/>
        </g>
        <g font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1f" text-anchor="middle">
          <text x="93" y="147">-1</text>
          <text x="247" y="147">1</text>
          <text x="161" y="147">0</text>
        </g>
        <g font-family="system-ui, sans-serif" font-size="12" font-style="italic" fill="#1a1a1f">
          <text x="300" y="126">x</text>
          <text x="152" y="34">y</text>
        </g>
      </svg>

  - number: 19
    stem: >-
      Factorize completely $x^{2} + 2xy + y^{2} + 3x + 3y - 18$
    options:
      A: '$(x + y + 6)(x + y - 3)$'
      B: '$(x - y - 6)(x - y + 3)$'
      C: '$(x - y + 6)(x - y - 3)$'
      D: '$(x + y - 6)(x + y + 3)$'
    corrected: >-
      the paper prints only three options; D is blank. It is supplied here as the sign-swapped
      version of the correct factorisation, which is the slip the question invites.

  - number: 20
    stem: >-
      The sum of two numbers is twice their difference. If the difference of the numbers is
      $P$, find the larger of the two numbers.
    options:
      A: '$\tfrac{P}{2}$'
      B: '$\tfrac{3P}{2}$'
      C: '$\tfrac{5P}{2}$'
      D: '$3P$'

  - number: 21
    stem: >-
      Express $\dfrac{1}{x^{3} - 1}$ in partial fractions.
    options:
      A: '$\dfrac{1}{x - 1} - \dfrac{x + 2}{x^{2} + x + 1}$'
      B: '$\dfrac{1}{3(x - 1)} + \dfrac{x + 2}{3(x^{2} + x + 1)}$'
      C: '$\dfrac{1}{3(x - 1)} - \dfrac{x + 2}{3(x^{2} + x + 1)}$'
      D: '$\dfrac{1}{3(x - 1)} - \dfrac{x - 2}{3(x^{2} + x + 1)}$'
    corrected: >-
      the paper prints "Express 1/x3 - 1" and then four option letters with nothing after
      them — all four options are blank on the page. The stem is completed as the partial
      fractions question the fragment implies, and the options are built around the correct
      decomposition. This question is reconstructed, not merely repaired.

  - number: 22
    stem: >-
      In $\triangle MNO$, $MN = 6$ units, $MO = 4$ units and $NO = 12$ units. If the bisector
      of angle $M$ meets $NO$ at $P$, calculate $NP$.
    options:
      A: '4.8 units'
      B: '7.2 units'
      C: '8.0 units'
      D: '18.0 units'
    corrected: >-
      the three printed lengths cannot form a triangle, since 6 + 4 is less than 12. The
      angle-bisector ratio the question examines does not depend on that, and gives 7.2.

  - number: 23
    stem: >-
      Find the equation of the locus of a point $P(x, y)$ such that $PV = PW$, where
      $V = (1, 1)$ and $W = (3, 5)$
    options:
      A: '$2x + 2y = 9$'
      B: '$2x + 3y = 8$'
      C: '$2x + y = 9$'
      D: '$x + 2y = 8$'

