          <clipPath id="p2000b"><rect x="0" y="0" width="150" height="135"/></clipPath>
          <clipPath id="p2000c"><rect x="0" y="0" width="150" height="135"/></clipPath>
          <clipPath id="p2000d"><rect x="0" y="0" width="150" height="135"/></clipPath>
        </defs>

        <!-- panel A: correct lines, opposite wedge -->
        <g transform="translate(10,10)">
          <rect x="0" y="0" width="150" height="135" fill="#fff" stroke="#d6d6de" stroke-width="1"/>
          <g clip-path="url(#p2000a)">
