  - number: 18
    stem: >-
      Find the values of $t$ for which the determinant of the matrix
      $\begin{pmatrix} t - 4 & 0 & 0 \\ -1 & t + 1 & 1 \\ 3 & 4 & t - 2 \end{pmatrix}$ is zero
    options:
      A: '$0, 2, 3$'
      B: '$-4, 2, 3$'
      C: '$-4, -2, -3$'
      D: '$4, -2, 3$'
    corrected: >-
      the paper prints the centre entry as "t + t", which is 2t and gives a determinant
      whose roots are irrational and match no option. Read as t + 1 it factorises to
      (t - 4)(t - 3)(t + 2), giving option D exactly, so the second t is a damaged 1.

  - number: 19
    stem: >-
      If $(x - 1)$, $(x + 1)$ and $(x - 2)$ are factors of the polynomial
      $ax^{3} + bx^{2} + cx - 1$, find $a$, $b$, $c$ respectively.
    options:
      A: '$-\tfrac{1}{2}, 1, \tfrac{1}{2}$'
      B: '$\tfrac{1}{2}, 1, \tfrac{1}{2}$'
      C: '$\tfrac{1}{2}, 1, -\tfrac{1}{2}$'
      D: '$\tfrac{1}{2}, -1, \tfrac{1}{2}$'

  - number: 20
    stem: >-
      A trader realizes $10x - x^{2}$ naira profit from the sale of $x$ bags of corn. How many
      bags will give him the maximum profit?
    options:
      A: "4"
      B: "5"
      C: "6"
      D: "7"

  - number: 21
    stem: Solve the inequality $2 - x > x^{2}$
    options:
      A: '$x < -2$ or $x > 1$'
      B: '$x > 2$ or $x < -1$'
      C: '$-1 < x > 2$'
      D: '$-2 < x < 1$'

  - number: 22
    stem: >-
      If $\alpha$ and $\beta$ are the roots of the equation $3x^{2} + 5x - 2 = 0$, find the
      value of $\tfrac{1}{\alpha} + \tfrac{1}{\beta}$
    options:
      A: '$-\tfrac{5}{2}$'
      B: '$-\tfrac{2}{3}$'
      C: '$\tfrac{1}{2}$'
      D: '$\tfrac{5}{2}$'

  - number: 23
    stem: >-
      Find the minimum value of the function $f(\theta) = \dfrac{2}{3 - \cos\theta}$ for
      $0 \le \theta \le 2\pi$
    options:
      A: '$\tfrac{1}{2}$'
      B: '$\tfrac{2}{3}$'
      C: "1"
      D: "2"
    corrected: >-
      the paper prints the function as "2/3 - cos θ", which is ambiguous; read as a single
      fraction, since otherwise the minimum is 2/3 - 1, which is not offered.

  - number: 24
    stem: >-
      A frustum of a pyramid with square base has its upper and lower sections as squares of
      sizes 2 m and 5 m respectively, and the distance between them 6 m. Find the height of
      the pyramid from which the frustum was obtained.
    options:
      A: 8.0 m
      B: 8.4 m
      C: 9.0 m
      D: 10.0 m

  - number: 25
    stem: >-
      $P$ is a point on one side of the straight line $UV$ and $P$ moves in the same direction
      as $UV$. If the straight line $ST$ is on the locus of $P$ and $\angle VUS = 50^{\circ}$,
      find $\angle UST$.
    options:
      A: '$310^{\circ}$'
      B: '$130^{\circ}$'
      C: '$80^{\circ}$'
      D: '$50^{\circ}$'

  - number: 26
    stem: >-
      A ship sails a distance of 50 km in the direction $S50^{\circ}E$ and then sails a
      distance of 50 km in the direction $N40^{\circ}E$. Find the bearing of the ship from its
      original position.
    options:
      A: '$S90^{\circ}E$'
      B: '$N40^{\circ}E$'
      C: '$S95^{\circ}E$'
      D: '$N85^{\circ}E$'

  - number: 27
    stem: >-
      An equilateral triangle of side $\sqrt{3}$ cm is inscribed in a circle. Find the radius
      of the circle.
    options:
      A: '$\tfrac{2}{3}$ cm'
      B: 2 cm
      C: 1 cm
      D: 3 cm

  - number: 28
    stem: >-
      $3y = 4x - 1$ and $Ky = x + 3$ are equations of two straight lines. If the two lines are
      perpendicular to each other, find $K$.
    options:
      A: '$-\tfrac{4}{3}$'
      B: '$-\tfrac{3}{4}$'
      C: '$\tfrac{3}{4}$'
      D: '$\tfrac{4}{3}$'

  - number: 29
    stem: >-
      In the diagram above, $\angle RPS = 50^{\circ}$, $\angle RPQ = 30^{\circ}$ and
      $PQ = QR$. Find the value of $\angle PRS$.
    options:
      A: '$80^{\circ}$'
      B: '$70^{\circ}$'
      C: '$60^{\circ}$'
      D: '$50^{\circ}$'
    needs_figure: true
    figure_svg: |
      <svg viewBox="0 0 300 285" width="300" height="285" role="img"
           aria-label="Circle through P, Q, R and S with PQ equal to QR, diagonal PR drawn, angle RPQ 30 degrees and angle RPS 50 degrees; angle PRS is required">
