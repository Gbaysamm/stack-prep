      C: "4"
      D: "3"

  - number: 33
    stem: >-
      A predator moves in a circle of radius $\sqrt{2}$ centre $(0, 0)$, while a prey moves
      along the line $y = x$. If $0 \le x \le 2$, at which point(s) will they meet?
