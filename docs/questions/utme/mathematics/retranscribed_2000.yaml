        <g fill="none" stroke="#1a1a1f" stroke-width="1.8" stroke-linejoin="round">
          <path d="M46.6 167.6 L130.9 238.3 L234.3 200.7 L205.0 34.7 Z"/>
        </g>
        <path d="M46.6 167.6 L234.3 200.7" fill="none" stroke="#3f2fa8"
              stroke-width="1.6" stroke-dasharray="5 3"/>

        <!-- equal-side ticks on PQ and QR -->
