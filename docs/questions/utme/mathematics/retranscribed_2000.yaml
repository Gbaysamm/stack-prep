          <rect x="0" y="0" width="150" height="135" fill="#fff" stroke="#d6d6de" stroke-width="1"/>
          <g clip-path="url(#p2000d)">
            <path d="M70 70 L150 30 L150 135 L37.5 135 Z" fill="#6d5ae0" fill-opacity="0.22"/>
            <g stroke="#b9b9c6" stroke-width="1">
