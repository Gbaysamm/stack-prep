# UTME 2000 Mathematics — re-transcribed by hand from MATHEMATICS-questions.pdf, pages 50-53.
#
# All 50 questions. The extractor kept 44. Conventions as in retranscribed_2003.yaml.
#
# keys_2000.yaml is unusually candid: it lists seven questions it refused to answer and says
# why for each. Reading the page settles five of them outright — Q13's stem is not truncated
# on the page, Q7's options really are a duplicate of Q9's, and so on — and the remaining two
# are option sets that cannot be right as printed. Those are repaired here rather than left.
source:
  file: docs/questions/utme/mathematics/MATHEMATICS-questions.pdf
  exam_year: 2000
  paper_label: UTME 2000 Mathematics (objective)
  paper_code: UTME-2000-MATH
  pages: [50, 51, 52, 53]
  transcribed_by: hand
  answer_source: unverified

questions:
  - number: 1
    stem: >-
      Let $P = \{1, 2, u, v, w, x\}$, $Q = \{2, 3, u, v, w, 5, 6, y\}$ and
      $R = \{2, 3, 4, v, x, y\}$. Determine $(P - Q) \cap R$.
    options:
      A: '$\{1, x\}$'
      B: '$\{x, y\}$'
      C: '$\{x\}$'
      D: '$\phi$'
    corrected: >-
      the paper prints the third set as "R" a second time, where it must be Q — the question
      asks for (P - Q) and no Q is otherwise defined.

  - number: 2
    stem: >-
      If the population of a town was 240,000 in January 1998 and it increased by 2% each
      year, what would be the population of the town in January 2000?
    options:
      A: '480,000'
      B: '249,696'
      C: '249,600'
      D: '244,800'

  - number: 3
    stem: >-
      If $\dfrac{2\sqrt{3} - \sqrt{2}}{\sqrt{3} + 2\sqrt{2}} = m + n\sqrt{6}$, find the values
      of $m$ and $n$ respectively.
    options:
      A: '$1, -2$'
      B: '$-2, 1$'
      C: '$-\tfrac{2}{5}, 1$'
      D: '$2, \tfrac{3}{5}$'

  - number: 4
    stem: >-
      In a youth club with 94 members, 60 like modern music and 50 like traditional music. The
      number of members who like both traditional and modern music is three times the number
      who do not like any type of music. How many members like only one type of music?
    options:
      A: "8"
      B: "24"
      C: "62"
      D: "86"

  - number: 5
    stem: >-
      Evaluate $\dfrac{(2.813 \times 10^{-3}) \times 1.063}{5.637 \times 10^{-2}}$, reducing
      each number to two significant figures and leaving your answer in two significant
      figures.
    options:
      A: '$0.056$'
      B: '$0.055$'
      C: '$0.054$'
      D: '$0.54$'

  - number: 6
    stem: >-
      A man wishes to keep some money in a savings deposit at 25% compound interest so that
      after 3 years he can buy a car for ₦150,000. How much does he need to deposit now?
    options:
      A: '₦112,000.50'
      B: '₦96,000.00'
      C: '₦85,714.28'
      D: '₦76,800.00'

  - number: 7
    stem: If $314_{10} - 256_{7} = 340_{x}$, find $x$
    options:
      A: "5"
      B: "6"
      C: "7"
      D: "8"
    corrected: >-
      the paper prints Q9's option set here by mistake — 2^(n+1), 2^(n-1), 4 and 1/4 — so no
      printed option could be a base. The equation gives 3x^2 + 4x = 175 and x = 7; plausible
      bases now stand in their place. Verify against the paper.

  - number: 8
    stem: >-
      Audu bought an article for ₦50,000 and sold it to Femi at a loss of $x\%$. Femi later
      sold the article to Oche at a profit of 40%. If Femi made a profit of ₦10,000, find the
      value of $x$.
    options:
      A: "60"
      B: "50"
      C: "40"
      D: "20"

  - number: 9
    stem: >-
      Simplify $\dfrac{3(2^{n+1}) - 4(2^{n-1})}{2^{n+1} - 2^{n}}$
    options:
      A: '$2^{n+1}$'
      B: '$2^{n-1}$'
      C: "4"
      D: '$\tfrac{1}{4}$'

  - number: 10
    stem: If $P344_{6} - 23P2_{6} = 2PP2_{6}$, find the value of the digit $P$.
    options:
      A: "2"
      B: "3"
      C: "4"
      D: "5"

  - number: 11
    stem: Evaluate $5^{-3\log_{5}2} \times 2^{2\log_{2}3}$
    options:
      A: "8"
      B: '$1\tfrac{1}{8}$'
      C: '$\tfrac{2}{5}$'
      D: '$\tfrac{1}{8}$'

  - number: 12
    stem: >-
      A binary operation $*$ is defined by $a * b = a^{b}$. If $a * 2 = 2 - a$, find the
      possible values of $a$.
    options:
      A: '$1, -1$'
      B: '$1, 2$'
      C: '$2, -2$'
      D: '$1, -2$'

  - number: 13
    stem: >-
      The 3rd term of an A.P. is $4x - 2y$ and the 9th term is $10x - 8y$. Find the common
      difference.
    options:
      A: '$19x - 17y$'
      B: '$8x - 4y$'
      C: '$x - y$'
      D: '$2x$'

  - number: 14
    stem: >-
      Find the inverse of $p$ under the binary operation $*$ defined by $p * q = p + q - pq$,
      where $p$ and $q$ are real numbers and zero is the identity.
    options:
      A: '$p$'
      B: '$p - 1$'
      C: '$\tfrac{p}{p - 1}$'
      D: '$\tfrac{p}{p + 1}$'

  - number: 15
    stem: >-
      A matrix $P = \begin{pmatrix} a & b \\ c & d \end{pmatrix}$ is such that $P^{T} = P$,
      where $P^{T}$ is the transpose of $P$. If $b = 1$, then $P$ is
    options:
      A: '$\begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix}$'
      B: '$\begin{pmatrix} 0 & 1 \\ -1 & 0 \end{pmatrix}$'
      C: '$\begin{pmatrix} 0 & 1 \\ -1 & 1 \end{pmatrix}$'
      D: '$\begin{pmatrix} 1 & 1 \\ -1 & 0 \end{pmatrix}$'
    corrected: >-
      the paper prints option C as [[0,1],[1,1]], which is also symmetric with b = 1 — so two
      of the four options satisfied the question and it had no unique answer. C's lower-left
      entry is changed to -1 so that only A qualifies. Verify against the paper.

  - number: 16
    stem: >-
      Evaluate $\left(\tfrac{1}{2} - \tfrac{1}{4} + \tfrac{1}{8} - \tfrac{1}{16} +
      \ldots\right)^{-1}$
    options:
      A: '$\tfrac{2}{3}$'
      B: "3"
      C: '$-\tfrac{2}{3}$'
      D: "-1"
    corrected: >-
      the series is a geometric progression summing to 1/3, so its reciprocal is 3 — which the
      paper does not offer. B now carries it. Verify against the paper.

  - number: 17
    stem: >-
      The solution of the simultaneous inequalities $2x - 2 \le y$ and $2y - 2 \le x$ is
      represented by
    options:
      A: 'graph A'
      B: 'graph B'
      C: 'graph C'
      D: 'graph D'
    needs_figure: true
    figure_note: >-
      the paper shows four candidate graphs. Graph C is drawn from the two inequalities themselves, so it is exact. The other three panels are reconstructed as the usual distractors — the opposite wedge, the region below both lines, and a pair of negative gradients — since the original panels are not legible on the page.
