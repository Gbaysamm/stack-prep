  - number: 30
    stem: >-
      In the diagram above, $EFGH$ is a circle centre $O$. $FH$ is a diameter and $GE$ is a
      chord which meets $FH$ at right angle at the point $N$. If $NH = 8$ cm and $GE = 24$ cm,
      calculate $FH$.
