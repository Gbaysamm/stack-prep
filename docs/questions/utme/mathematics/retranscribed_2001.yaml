  - number: 20
    stem: >-
      If $P = \begin{pmatrix} 3 & -3 & 4 \\ 5 & 0 & 6 \\ 1 & 2 & 1 \end{pmatrix}$, then $-2P$
      is
    options:
      A: '$\begin{pmatrix} -6 & 4 & -8 \\ 5 & 0 & 6 \\ 7 & 5 & -1 \end{pmatrix}$'
      B: '$\begin{pmatrix} -6 & 4 & -8 \\ -10 & 0 & 6 \\ -14 & 5 & -1 \end{pmatrix}$'
      C: '$\begin{pmatrix} -6 & -4 & 2 \\ -10 & -2 & -12 \\ -14 & 10 & 2 \end{pmatrix}$'
      D: '$\begin{pmatrix} -6 & 6 & -8 \\ -10 & 0 & -12 \\ -2 & -4 & -2 \end{pmatrix}$'
    corrected: >-
      multiplying every entry by -2 gives rows (-6, 6, -8), (-10, 0, -12) and (-2, -4, -2).
      Only the middle row of the printed option D matched; its other two rows, and every
      row of A, B and C, disagree with the arithmetic. D now carries the correct matrix.

