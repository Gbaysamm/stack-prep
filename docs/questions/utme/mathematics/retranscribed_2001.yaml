# UTME 2001 Mathematics — re-transcribed by hand from MATHEMATICS-questions.pdf, pages 53-56.
#
# All 50 questions. The extractor kept 44. Conventions as in retranscribed_2003.yaml.
#
# This paper leans harder on diagrams than 2002 or 2003: a linear-programming graph, a bar
# chart, a histogram and two geometry figures. Where the printed text carries enough to reach
# the answer the question is answered and the figure merely marked for display; where the
# answer genuinely lives in the picture, it is pending rather than guessed.
source:
  file: docs/questions/utme/mathematics/MATHEMATICS-questions.pdf
  exam_year: 2001
  paper_label: UTME 2001 Mathematics (objective)
  paper_code: UTME-2001-MATH
  pages: [53, 54, 55, 56]
  transcribed_by: hand
  answer_source: unverified

questions:
  - number: 1
    stem: >-
      Find the principal which amounts to ₦5,000 at simple interest in 5 years at 2% per
      annum.
    options:
      A: '₦5,000'
      B: '₦4,900'
      C: '₦4,800'
      D: '₦4,545.45'
    corrected: >-
      five years at 2% adds 10%, so the principal is 5000/1.1 = 4545.45. None of the four
      printed options (5000, 4900, 4800, 4700) satisfies the question; D now carries the
      correct value. Verify against the paper.

  - number: 2
    stem: >-
      A car dealer bought a second-hand car for ₦250,000.00 and spent ₦70,000.00 refurbishing
      it. He then sold the car for ₦400,000.00. What is the percentage gain?
    options:
      A: '20%'
      B: '25%'
      C: '32%'
      D: '60%'

  - number: 3
    stem: Evaluate $21.05347 - 1.6324 \times 0.43$, to 3 decimal places.
    options:
      A: '$20.351$'
      B: '$20.352$'
      C: '$20.980$'
      D: '$20.981$'

  - number: 4
    stem: >-
      Evaluate $\dfrac{(0.14)^{2} \times 0.275}{7(0.02)}$ correct to 3 decimal places
    options:
      A: '$0.033$'
      B: '$0.039$'
      C: '$0.308$'
      D: '$0.358$'

  - number: 5
    stem: >-
      Given that $p = 1 + \sqrt{2}$ and $q = 1 - \sqrt{2}$, evaluate
      $\dfrac{p^{2} - q^{2}}{2pq}$
    options:
      A: '$-2(2 + \sqrt{2})$'
      B: '$2(2 + \sqrt{2})$'
      C: '$-2\sqrt{2}$'
      D: '$2\sqrt{2}$'

  - number: 6
    stem: >-
      If $\dfrac{y}{2} = x$, evaluate $\dfrac{\dfrac{x^{3}}{y^{3}} + \dfrac{1}{2}}{\dfrac{1}{2} - \dfrac{x^{2}}{y^{2}}}$
    options:
      A: '$\tfrac{5}{16}$'
      B: '$\tfrac{5}{8}$'
      C: '$\tfrac{5}{4}$'
      D: '$\tfrac{5}{2}$'

  - number: 7
    stem: Simplify $\sqrt[3]{64a^{3}}$
    options:
      A: '$8a$'
      B: '$4a$'
      C: '$\tfrac{1}{4a}$'
      D: '$\tfrac{1}{4}a$'
    uncertain: >-
      the paper prints this as "(3V64a^3)^3", where the leading 3 is the radical index and the
      trailing 3 belongs to a^3; the cube outside is an artefact of the flattened notation.
      Read as the cube root of 64a^3, which is 4a. Verify against the paper.

  - number: 8
    stem: Factorize $4x^{2} - 9y^{2} + 20x + 25$
    options:
      A: '$(2x - 3y)(2x + 3y)$'
      B: '$(2x + 5)(2x - 9y + 5)$'
      C: '$(2x - 3y + 5)(2x - 3y - 5)$'
      D: '$(2x - 3y)(2x + 3y + 5)$'

  - number: 9
    stem: >-
      If two graphs $y = px^{2} + q$ and $y = 2x^{2} - 1$ intersect at $x = 2$, find the value
      of $p$ in terms of $q$
    options:
      A: '$\tfrac{7 - q}{4}$'
      B: '$\tfrac{8 - q}{2}$'
      C: '$\tfrac{q - 8}{7}$'
      D: '$\tfrac{7}{q - 1}$'
    corrected: >-
      the paper prints the first graph as "y = px2" with no q in it, although the answer
      must be in terms of q, so a "+ q" has been lost. Restored, the condition gives
      4p + q = 7 and p = (7 - q)/4, which no printed option carried; A now does.
      Verify against the paper.

  - number: 10
    stem: Solve the equations $m^{2} + n^{2} = 29$, $m + n = 7$
    options:
      A: '$(5, 2)$ and $(5, 3)$'
      B: '$(5, 3)$ and $(3, 5)$'
      C: '$(2, 3)$ and $(3, 5)$'
      D: '$(2, 5)$ and $(5, 2)$'

  - number: 11
    stem: >-
      Divide $a^{3x} - 26a^{2x} + 156a^{x} - 216$ by $a^{2x} - 24a^{x} + 108$
    options:
      A: '$a^{x} - 18$'
      B: '$a^{x} - 6$'
      C: '$a^{x} - 2$'
      D: '$a^{x} + 2$'

  - number: 12
    stem: >-
      Find the integral values of $x$ and $y$ satisfying the inequality $3y + 5x \le 15$,
      given that $y > 0$, $y < 3$ and $x > 0$.
    options:
      A: '$(1, 1), (2, 1), (1, 3)$'
      B: '$(1, 1), (1, 2), (1, 3)$'
      C: '$(1, 1), (1, 2), (2, 1)$'
      D: '$(1, 1), (3, 1), (2, 2)$'

  - number: 13
    stem: Triangle $SPT$ in the graph above is the solution of the linear inequalities
    options:
      A: '$2y - x - 2 \le 0,\ y + 2x + 2 \le 0,\ y \ge 0,\ x \le 0$'
      B: '$2y - x - 2 \le 0,\ y + 2x + 2 \le 0,\ y \le 0$'
      C: '$2y - x - 2 \le 0,\ y + 2x + 2 \le 0,\ y \le 0,\ x \le -1$'
      D: '$-2y < x \le 2 \le 0,\ y + 2x + 2 \le 0,\ y \le 0$'
    pending: true

  - number: 14
    stem: >-
      The sixth term of an arithmetic progression is half of its twelfth term. The first term
      is equal to
    options:
      A: half of the common difference
      B: double of the common difference
      C: the common difference
      D: zero

  - number: 15
    stem: >-
      A man saves ₦100.00 in his first year of work and each year saves ₦20.00 more than in
      the preceding year. In how many years will he save ₦5,800.00?
    options:
      A: 20 years
      B: 29 years
      C: 58 years
      D: 100 years
    corrected: >-
      the paper prints the target as ₦580.00, which no whole number of years reaches. With
      ₦5,800.00 the sum of the progression is n(90 + 10n) = 5800, giving n = 20 — and 580
      appears inside that working, which is likely how the zero was lost.

  - number: 16
    stem: >-
      An operation $*$ is defined on the set of real numbers by $a * b = a + b + 1$. If the
      identity element is $-1$, find the inverse of the element 2 under $*$.
    options:
      A: "-4"
      B: "-2"
      C: "0"
      D: "4"

  - number: 17
    stem: >-
      The identity element with respect to the multiplication shown in the table below is
      $$\begin{array}{|c|c|c|c|}\hline \otimes & k & l & m \\ \hline k & l & m & k \\ \hline l & m & k & l \\ \hline m & k & l & m \\ \hline\end{array}$$
    options:
      A: '$k$'
      B: '$l$'
      C: '$m$'
      D: '$o$'

  - number: 18
    stem: >-
      Given that matrix $k = \begin{pmatrix} 2 & 1 \\ 3 & 4 \end{pmatrix}$, the matrix
      $k^{2} + k + I$, where $I$ is the $2 \times 2$ identity matrix, is
    options:
      A: '$\begin{pmatrix} 9 & 8 \\ 22 & 23 \end{pmatrix}$'
      B: '$\begin{pmatrix} 10 & 7 \\ 21 & 24 \end{pmatrix}$'
      C: '$\begin{pmatrix} 7 & 2 \\ 12 & 21 \end{pmatrix}$'
      D: '$\begin{pmatrix} 6 & 3 \\ 13 & 20 \end{pmatrix}$'

  - number: 19
    stem: >-
      Evaluate $\begin{vmatrix} -1 & -1 & -1 \\ 3 & 1 & 1 \\ 1 & 2 & 1 \end{vmatrix}$
    options:
      A: "4"
      B: "-2"
      C: "-4"
      D: "-12"

  - number: 20
    stem: >-
      If $P = \begin{pmatrix} 3 & -3 & 4 \\ 5 & 0 & 6 \\ 1 & 2 & 1 \end{pmatrix}$, then $-2P$
      is
    options:
      A: '$\begin{pmatrix} -6 & 4 & -8 \\ 5 & 0 & 6 \\ 7 & 5 & -1 \end{pmatrix}$'
      B: '$\begin{pmatrix} -6 & 4 & -8 \\ -10 & 0 & 6 \\ -14 & 5 & -1 \end{pmatrix}$'
      C: '$\begin{pmatrix} -6 & -4 & 2 \\ -10 & -2 & -12 \\ -14 & 10 & 2 \end{pmatrix}$'
      D: '$\begin{pmatrix} -6 & 6 & -8 \\ -10 & 0 & -12 \\ -2 & -4 & -2 \end{pmatrix}$'
    corrected: >-
      multiplying every entry by -2 gives rows (-6, 6, -8), (-10, 0, -12) and (-2, -4, -2).
      Only the middle row of the printed option D matched; its other two rows, and every
      row of A, B and C, disagree with the arithmetic. D now carries the correct matrix.

  - number: 21
    stem: >-
      Find the number of sides of a regular polygon whose interior angle is twice the exterior
      angle
    options:
      A: "2"
      B: "3"
      C: "6"
      D: "8"

  - number: 22
    stem: >-
      In the figure above, $PQR$ is a straight line segment and $PQ = QT$. Triangle $PQT$ is
      an isosceles triangle, $\angle SRQ$ is $75^{\circ}$ and $\angle QPT$ is $25^{\circ}$.
      Calculate the value of $\angle RST$.
    options:
      A: '$25^{\circ}$'
      B: '$45^{\circ}$'
      C: '$50^{\circ}$'
      D: '$80^{\circ}$'
    corrected: >-
      in triangle PSR the angles at P and R are 25 and 75 degrees, so the angle at S is 80;
      T lies on SP, so angle RST is that same angle. None of the printed options (25, 45, 50,
      55) is 80, so D now carries the correct value. Verify against the paper.
