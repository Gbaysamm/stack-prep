        </g>
        <path d="M26.0 212.0 L355.0 47.5" fill="none" stroke="#1a1a1f" stroke-width="1.9"/>
        <path d="M106.5 23.0 L253.5 317.0" fill="none" stroke="#1a1a1f" stroke-width="1.9"/>
        <g fill="#1a1a1f"><circle cx="110.0" cy="170.0" r="3.2"/><circle cx="180.0" cy="170.0" r="3.2"/><circle cx="166.0" cy="142.0" r="3.2"/></g>
        <text x="96.0" y="190.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">S</text><text x="182.0" y="190.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">T</text><text x="160.0" y="132.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">P</text>
        <g font-family="system-ui, sans-serif" font-size="11" fill="#1a1a1f">
          <text x="102.0" y="162.0">−2</text><text x="184.0" y="162.0">−1</text>
          <text x="258.0" y="104.0">1</text><text x="258.0" y="314.0">−2</text>
        </g>
        <text x="275.0" y="81.5" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#b91c1c" font-style="italic">2y − x − 2 = 0</text>
        <text x="123.5" y="41.0" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#b91c1c" font-style="italic">y + 2x + 2 = 0</text>
        <text x="358.0" y="186.0" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#1a1a1f" font-style="italic">x</text><text x="236.0" y="22.0" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#1a1a1f" font-style="italic">y</text>
      </svg>

  - number: 14
    stem: >-
      The sixth term of an arithmetic progression is half of its twelfth term. The first term
      is equal to
    options:
      A: half of the common difference
      B: double of the common difference
      C: the common difference
      D: zero

  - number: 15
    stem: >-
      A man saves ₦100.00 in his first year of work and each year saves ₦20.00 more than in
      the preceding year. In how many years will he save ₦5,800.00?
    options:
      A: 20 years
      B: 29 years
      C: 58 years
      D: 100 years
    corrected: >-
      the paper prints the target as ₦580.00, which no whole number of years reaches. With
      ₦5,800.00 the sum of the progression is n(90 + 10n) = 5800, giving n = 20 — and 580
      appears inside that working, which is likely how the zero was lost.

