          <path d="M136.90 128.61 L146.09 136.32"/>
        </g>
        <g fill="#1a1a1f">
          <circle cx="20" cy="170" r="2.6"/><circle cx="110" cy="170" r="2.6"/>
          <circle cx="340" cy="170" r="2.6"/><circle cx="304.5" cy="37.3" r="2.6"/>
          <circle cx="167.9" cy="101.1" r="2.6"/>
        </g>
        <g font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1a1f">
          <text x="20" y="190" text-anchor="middle">P</text>
          <text x="110" y="190" text-anchor="middle">Q</text>
          <text x="340" y="190" text-anchor="middle">R</text>
          <text x="311" y="32" text-anchor="middle">S</text>
          <text x="160" y="95" text-anchor="middle">T</text>
        </g>
        <g font-family="system-ui, sans-serif" font-size="12" fill="#6d5ae0">
          <text x="58" y="162">25°</text>
          <text x="296" y="152" text-anchor="end">75°</text>
        </g>
      </svg>

