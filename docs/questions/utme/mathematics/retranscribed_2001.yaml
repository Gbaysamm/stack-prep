  - number: 35
    stem: >-
      If the gradient of the curve $y = 2kx^{2} + x + 1$ at $x = 1$ is 9, find $k$
    options:
      A: "1"
      B: "2"
      C: "3"
      D: "4"
    corrected: >-
      the paper prints the stem without the gradient value — "at x = 1 find k". The derivative
      is 4kx + 1, which at x = 1 is 4k + 1; only a gradient of 9 yields a listed option, giving
      k = 2. Verify against the paper.

