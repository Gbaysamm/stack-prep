        <text x="159.5" y="243.7" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">72°</text>
      </svg>

  - number: 15
    stem: The locus of a point $P$ which is equidistant from two given points $S$ and $T$ is
    options:
      A: a perpendicular to $ST$
      B: a line parallel to $ST$
      C: the angle bisector of $PS$ and $ST$
      D: the perpendicular bisector of $ST$

  - number: 16
    stem: A solid hemisphere has radius 7 cm. Find the total surface area.
    options:
      A: $462\ \text{cm}^{2}$
      B: $400\ \text{cm}^{2}$
      C: $308\ \text{cm}^{2}$
      D: $66\ \text{cm}^{2}$

  - number: 17
