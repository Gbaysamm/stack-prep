        <path d="M140.1 40.6 L95.3 251.0" fill="none" stroke="#1a1a1f" stroke-width="1.8"/>
        <path d="M120.9 130.6 L175.0 205.0" fill="none" stroke="#1a1a1f" stroke-width="1.8"/>
