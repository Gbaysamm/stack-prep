        <path d="M152.8 164.3 L143.1 171.3" fill="none" stroke="#1a1a1f" stroke-width="1.4"/>
        <path d="M132.2 222.8 L138.2 233.2" fill="none" stroke="#1a1a1f" stroke-width="1.4"/>
        <circle cx="140.1" cy="40.6" r="3.2" fill="#1a1a1f"/>
        <circle cx="120.9" cy="130.6" r="3.2" fill="#1a1a1f"/>
        <circle cx="95.3" cy="251.0" r="3.2" fill="#1a1a1f"/>
        <circle cx="175.0" cy="205.0" r="3.2" fill="#1a1a1f"/>
        <circle cx="189.0" cy="270.8" r="3.2" fill="#1a1a1f"/>
        <text x="148.1" y="34.6" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="start">P</text>
        <text x="110.9" y="130.6" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="end">Q</text>
        <text x="85.3" y="256.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="end">R</text>
