    figure_svg: |
      <svg viewBox="0 0 360 285" width="360" height="285" role="img"
           aria-label="Triangle P Q R with angle P Q R equal to 50 degrees; R P is extended beyond P and the angle outside the triangle at P is 128 degrees">
