# UTME 2002 Mathematics — re-transcribed by hand from MATHEMATICS-questions.pdf, pages 56-58.
#
# All 50 questions. The extractor kept 43; the seven it missed each carry a diagram, and its
# ink detector did not register them.
#
# Conventions as in retranscribed_2003.yaml. `needs_figure` marks a question whose diagram
# should be shown to a student even where the text alone is enough to answer it — the picture
# is how the question was set, and a reader should see what the examiner drew.
source:
  file: docs/questions/utme/mathematics/MATHEMATICS-questions.pdf
  exam_year: 2002
  paper_label: UTME 2002 Mathematics (objective)
  paper_code: UTME-2002-MATH
  pages: [56, 57, 58]
  transcribed_by: hand
  answer_source: unverified

questions:
  - number: 1
    stem: >-
      A trader bought goats for ₦4,000 each. He sold them for ₦180,000 at a loss of 25%. How
      many goats did he buy?
    options:
      A: "36"
      B: "45"
      C: "50"
      D: "60"

  - number: 2
    stem: Simplify $\left(\sqrt{0.7} + \sqrt{70}\right)^{2}$
    options:
      A: '$217.7$'
      B: '$168.7$'
      C: '$84.7$'
      D: '$70.7$'

  - number: 3
    stem: >-
      Evaluate $\dfrac{0.21 \times 0.072 \times 0.0054}{0.006 \times 1.68 \times 0.063}$,
      correct to four significant figures.
    options:
      A: '$0.1286$'
      B: '$0.1285$'
      C: '$0.01286$'
      D: '$0.01285$'

  - number: 4
    stem: >-
      In a school, 220 students offer Biology or Mathematics or both. 125 offer Biology and
      110 Mathematics. How many offer Biology but not Mathematics?
    options:
      A: "125"
      B: "110"
      C: "95"
      D: "80"

  - number: 5
    stem: Simplify $52.4 - 5.7 - 3.45 - 1.75$
    options:
      A: '$42.2$'
      B: '$42.1$'
      C: '$41.5$'
      D: '$41.4$'

  - number: 6
    stem: >-
      Without using tables, evaluate $(343)^{\frac{1}{3}} \times (0.14)^{-1} \times
      (25)^{-\frac{1}{2}}$
    options:
      A: "7"
      B: "8"
      C: "10"
      D: "12"
    corrected: >-
      the paper prints the last factor as (25)^(1/2); the text layer lost the minus on the
      index. With +1/2 the value is 250, which is no option; with -1/2 it is 10, option C.

  - number: 7
    stem: >-
      In the diagram above are two concentric circles of radii $r$ and $R$ respectively with
      centre $O$. If $r = \tfrac{2}{5}R$, express the area of the shaded portion in terms of
      $\pi$ and $R$.
    options:
      A: $\tfrac{9}{25}\pi R^{2}$
      B: $\tfrac{5}{9}\pi R^{2}$
      C: $\tfrac{21}{25}\pi R^{2}$
      D: $\tfrac{21}{23}\pi R^{2}$
    needs_figure: true
    figure_svg: |
      <svg viewBox="0 0 260 240" width="260" height="240" role="img"
           aria-label="Two concentric circles with centre O, inner radius r and outer radius R; the ring between them is shaded">
        <path d="M35 120 a95 95 0 1 0 190 0 a95 95 0 1 0 -190 0 Z M92 120 a38 38 0 1 0 76 0 a38 38 0 1 0 -76 0 Z" fill="#6d5ae0" fill-opacity="0.4" fill-rule="evenodd" stroke="none"/>
        <circle cx="130.0" cy="120.0" r="95.0" fill="none" stroke="#1a1a1f" stroke-width="1.8"/>
        <circle cx="130.0" cy="120.0" r="38.0" fill="none" stroke="#1a1a1f" stroke-width="1.8"/>
        <path d="M130.0 120.0 L207.8 174.5" fill="none" stroke="#1a1a1f" stroke-width="1.5"/>
        <path d="M130.0 120.0 L97.1 101.0" fill="none" stroke="#1a1a1f" stroke-width="1.5"/>
        <circle cx="130.0" cy="120.0" r="3.2" fill="#1a1a1f"/>
        <text x="132.0" y="138.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">O</text>
        <text x="190.0" y="151.2" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1a1f" font-style="italic" text-anchor="middle">R</text>
        <text x="115.5" y="103.5" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1a1f" font-style="italic" text-anchor="middle">r</text>
      </svg>

  - number: 8
    stem: >-
      Find the value of $k$ if the line $2y - kx + 4 = 0$ is perpendicular to the line
      $y + \tfrac{1}{4}x - 7 = 0$
    options:
      A: "-8"
      B: "-4"
      C: "4"
      D: "8"

  - number: 9
    stem: >-
      A bucket is 12 cm in diameter at the top, 8 cm in diameter at the bottom and 4 cm deep.
      Calculate its volume.
    options:
      A: $144\pi\ \text{cm}^{3}$
      B: $\tfrac{304\pi}{3}\ \text{cm}^{3}$
      C: $72\pi\ \text{cm}^{3}$
      D: $128\pi\ \text{cm}^{3}$

  - number: 10
    stem: >-
      In the diagram above, $XZ$ is the diameter of the circle $XYZW$, with centre $O$ and
      radius $\tfrac{15}{2}$ cm. If $XY = 12$ cm, find the area of the triangle $XYZ$.
    options:
      A: $75\ \text{cm}^{2}$
      B: $54\ \text{cm}^{2}$
      C: $45\ \text{cm}^{2}$
      D: $27\ \text{cm}^{2}$
    needs_figure: true
    figure_svg: |
      <svg viewBox="0 0 300 240" width="300" height="240" role="img"
           aria-label="Circle X Y Z W with centre O and diameter X Z; triangle X Y Z has a right angle at Y, X Y is 12 cm and the radius is 15 over 2 cm">
        <path d="M55.0 118.0 L176.6 209.2 L245.0 118.0 Z" fill="#6d5ae0" stroke="none" stroke-width="0" fill-opacity="0.25"/>
        <circle cx="150.0" cy="118.0" r="95.0" fill="none" stroke="#1a1a1f" stroke-width="1.8"/>
        <path d="M55.0 118.0 L176.6 209.2 L245.0 118.0 Z" fill="none" stroke="#1a1a1f" stroke-width="1.8"/>
        <path d="M167.8 202.6 L174.4 193.8 L183.2 200.4" fill="none" stroke="#1a1a1f" stroke-width="1.3"/>
        <circle cx="55.0" cy="118.0" r="3.2" fill="#1a1a1f"/>
        <circle cx="176.6" cy="209.2" r="3.2" fill="#1a1a1f"/>
        <circle cx="245.0" cy="118.0" r="3.2" fill="#1a1a1f"/>
        <circle cx="150.0" cy="118.0" r="3.2" fill="#1a1a1f"/>
        <circle cx="109.9" cy="31.9" r="3.2" fill="#1a1a1f"/>
        <text x="43.0" y="123.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">X</text>
        <text x="257.0" y="123.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">Z</text>
        <text x="180.6" y="227.2" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">Y</text>
        <text x="150.0" y="110.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">O</text>
        <text x="101.9" y="23.9" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">W</text>
        <text x="101.8" y="177.6" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1f" text-anchor="middle">12 cm</text>
        <text x="197.5" y="110.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1f" text-anchor="middle">15/2 cm</text>
      </svg>

  - number: 11
    stem: >-
      Find the coordinate of the midpoint of the $x$ and $y$ intercepts of the line
      $2y = 4x - 8$
    options:
      A: '$(-1, -2)$'
      B: '$(1, 2)$'
      C: '$(2, 0)$'
      D: '$(1, -2)$'

  - number: 12
    stem: >-
      A chord of a circle subtends an angle of $120^{\circ}$ at the centre of a circle of
      diameter $4\sqrt{3}$ cm. Calculate the area of the major sector.
    options:
      A: $32\pi\ \text{cm}^{2}$
      B: $16\pi\ \text{cm}^{2}$
      C: $8\pi\ \text{cm}^{2}$
      D: $4\pi\ \text{cm}^{2}$

  - number: 13
    stem: If $\tan\theta = \tfrac{4}{3}$, calculate $\sin^{2}\theta - \cos^{2}\theta$
    options:
      A: $\tfrac{7}{25}$
      B: $\tfrac{9}{25}$
      C: $\tfrac{16}{25}$
      D: $\tfrac{24}{25}$

  - number: 14
    stem: >-
      In the diagram above, $PST$ is a straight line and $PQ = QS = RS$. If
      $\angle RST = 72^{\circ}$, find $x$.
