      </svg>

  - number: 18
    stem: >-
      The sum of the interior angles of a polygon is 20 right angles. How many sides does the
      polygon have?
    options:
      A: "10"
      B: "12"
      C: "20"
      D: "40"

  - number: 19
    stem: >-
      Find the equation of the set of points which are equidistant from the parallel lines
      $x = 1$ and $x = 7$
    options:
      A: '$y = 4$'
      B: '$y = 3$'
      C: '$x = 3$'
      D: '$x = 4$'

  - number: 20
    stem: >-
      In the diagram above, a cylinder of radius 3 cm and height 23 cm is surmounted by a
      hemispherical bowl of the same radius. Calculate the volume of the solid.
    options:
      A: $216\pi\ \text{cm}^{3}$
      B: $198\pi\ \text{cm}^{3}$
      C: $180\pi\ \text{cm}^{3}$
      D: $162\pi\ \text{cm}^{3}$
    needs_figure: true
    figure_svg: |
      <svg viewBox="0 0 300 300" width="300" height="300" role="img"
           aria-label="A cylinder of radius 3 cm with a hemisphere of the same radius on top; the whole solid is 23 cm tall">
        <path d="M127 95 A48 48 0 0 1 223 95" fill="none" stroke="#1a1a1f" stroke-width="1.8"/>
        <ellipse cx="175" cy="95" rx="48" ry="12" fill="none" stroke="#1a1a1f" stroke-width="1.2" stroke-dasharray="4 4"/>
        <path d="M127.0 95.0 L127.0 262.0" fill="none" stroke="#1a1a1f" stroke-width="1.8"/>
        <path d="M223.0 95.0 L223.0 262.0" fill="none" stroke="#1a1a1f" stroke-width="1.8"/>
        <path d="M127 262 A48 12 0 0 0 223 262" fill="none" stroke="#1a1a1f" stroke-width="1.8"/>
        <path d="M127 262 A48 12 0 0 1 223 262" fill="none" stroke="#1a1a1f" stroke-width="1.2" stroke-dasharray="4 4"/>
        <path d="M175.0 262.0 L223.0 262.0" fill="none" stroke="#1a1a1f" stroke-width="1.4"/>
        <circle cx="175.0" cy="262.0" r="3.2" fill="#1a1a1f"/>
        <text x="199.0" y="292.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1f" text-anchor="middle">3 cm</text>
        <path d="M119.0 47.0 L87.0 47.0" fill="none" stroke="#1a1a1f" stroke-width="0.9" stroke-dasharray="3 3"/>
        <path d="M119.0 262.0 L87.0 262.0" fill="none" stroke="#1a1a1f" stroke-width="0.9" stroke-dasharray="3 3"/>
        <path d="M97.0 47.0 L97.0 262.0" fill="none" stroke="#1a1a1f" stroke-width="1.1"/>
        <path d="M100.2 54.0 L97.0 47.0 L93.8 54.0 Z" fill="#1a1a1f" stroke="#1a1a1f" stroke-width="1"/>
        <path d="M93.8 255.0 L97.0 262.0 L100.2 255.0 Z" fill="#1a1a1f" stroke="#1a1a1f" stroke-width="1"/>
        <text x="89.0" y="158.5" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1f" text-anchor="end">23 cm</text>
      </svg>
    uncertain: >-
      the 23 cm on the figure measures the cylinder including the hemisphere on top, so the
      cylindrical part is 20 cm. Read that way the volume is 198 pi. Verify against the paper.

  - number: 21
    stem: >-
      A hunter 1.6 m tall views a bird on top of a tree at an angle of $45^{\circ}$. If the
      distance between the hunter and the tree is 10.4 m, find the height of the tree.
    options:
      A: '8.8 m'
      B: '9.0 m'
      C: '10.4 m'
      D: '12.0 m'

  - number: 22
    stem: >-
      The mean of a set of six numbers is 60. If the mean of the first five is 50, find the
      sixth number in the set.
    options:
      A: "110"
      B: "105"
      C: "100"
      D: "95"

  - number: 23
    stem: >-
      The range of the data $k+2$, $k-3$, $k+4$, $k-2$, $k$, $k-5$, $k+3$, $k-1$ and $k+6$ is
    options:
      A: "6"
      B: "8"
      C: "10"
      D: "11"

  - number: 24
    stem: >-
      The distribution below shows the number of days a group of 260 students were absent from
      school in a particular term.
      $$\begin{array}{|c|c|c|c|c|c|c|}\hline \text{No. of days} & 1 & 2 & 3 & 4 & 5 & 6 \\ \hline \text{No. of students} & 20 & x & 50 & 40 & 2x & 60 \\ \hline\end{array}$$
      How many students were absent for at least four days in the term?
    options:
      A: "40"
      B: "120"
      C: "160"
      D: "210"

  - number: 25
    stem: >-
      The Venn diagram above shows the number of students offering Music and History in a
      class of 80 students. Music only is $30 - x$, both subjects is $x$, History only is
      $40 - x$, and 20 students offer neither. If a student is picked at random from the
      class, what is the probability that he offers Music only?
    options:
      A: '$0.13$'
      B: '$0.25$'
      C: '$0.38$'
      D: '$0.50$'
    needs_figure: true
    figure_svg: |
      <svg viewBox="0 0 330 220" width="330" height="220" role="img"
           aria-label="Venn diagram for a class of 80: Music only is 30 minus x, both is x, History only is 40 minus x, and 20 offer neither">
