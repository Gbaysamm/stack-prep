# UTME 2003 Mathematics — re-transcribed by hand from MATHEMATICS-questions.pdf, pages 58-61.
#
# Not a repair of the extracted text. The text layer cannot express structure: it gives
# "(1/0.06 ÷ 1/0.042)-1" for what the paper prints as a reciprocal of a quotient, and no
# amount of geometry recovers that. These were read from the page and written as LaTeX.
#
# Conventions
#   * Mathematics is delimited with $...$ and set with KaTeX-compatible commands only.
#   * The naira sign is written ₦, not the "#" the compilation prints.
#   * `needs_figure: true` marks a question that cannot be answered from the text alone.
#   * `uncertain` records anything the printing left genuinely ambiguous, with what was
#     assumed. Those are for a person to settle against the paper, not for anyone to trust.
source:
  file: docs/questions/utme/mathematics/MATHEMATICS-questions.pdf
  exam_year: 2003
  paper_label: UTME 2003 Mathematics (objective)
  paper_code: UTME-2003-MATH
  pages: [58, 59, 60, 61]
  transcribed_by: hand
  answer_source: unverified

questions:
  - number: 1
    stem: Simplify $1 - \left(2\tfrac{1}{3} \times 1\tfrac{1}{4}\right) + \tfrac{3}{5}$
    options:
      A: $-2\tfrac{31}{60}$
      B: $-2\tfrac{7}{15}$
      C: $-1\tfrac{19}{60}$
      D: $-1\tfrac{11}{15}$

  - number: 2
    stem: >-
      A cinema hall contains a certain number of people. If $22\tfrac{1}{2}\%$ are children,
      $47\tfrac{1}{2}\%$ are men and 84 are women, find the number of men in the hall.
    options:
      A: "133"
      B: "113"
      C: "63"
      D: "84"

  - number: 3
    stem: Simplify $213_4 \times 23_4$
    options:
      A: $13211_4$
      B: $10311_4$
      C: $10321_4$
      D: $12231_4$

  - number: 4
    stem: >-
      A woman buys 270 oranges for ₦1800.00 and sells at 5 for ₦40.00. What is her profit?
    options:
      A: ₦630.00
      B: ₦360.00
      C: ₦1620.00
      D: ₦2160.00

  - number: 5
    stem: Simplify $\dfrac{\sqrt{98} - \sqrt{50}}{\sqrt{32}}$
    options:
      A: $\tfrac{1}{2}$
      B: $\tfrac{1}{4}$
      C: $1$
      D: $3$

  - number: 6
    stem: The sum of four numbers is $1214_5$. What is the average expressed in base five?
    options:
      A: "411"
      B: "401"
      C: "141"
      D: "114"

  - number: 7
    stem: Evaluate $\log_{\sqrt{2}} 4 + \log_{1/2} 16 - \log_{4} 32$
    options:
      A: $-2.5$
      B: $5.5$
      C: $-5.5$
      D: $2.5$

  - number: 8
    stem: >-
      Given: $U = \{\text{Even numbers between 0 and 30}\}$,
      $P = \{\text{Multiples of 6 between 0 and 30}\}$,
      $Q = \{\text{Multiples of 4 between 0 and 30}\}$. Find $(P \cup Q)^{c}$.
    options:
      A: $\{0, 2, 6, 22, 26\}$
      B: $\{2, 4, 14, 18, 26\}$
      C: $\{2, 10, 14, 22, 26\}$
      D: $\{0, 10, 14, 22, 26\}$

  - number: 9
    stem: >-
      In a class of 40 students, 32 offer Mathematics, 24 offer Physics and 4 offer neither
      Mathematics nor Physics. How many offer both Mathematics and Physics?
    options:
      A: "16"
      B: "4"
      C: "20"
      D: "8"

  - number: 10
    stem: >-
      Find $\left(\dfrac{1}{0.06} \div \dfrac{1}{0.042}\right)^{-1}$, correct to two decimal
      places.
    options:
      A: $4.42$
      B: $3.14$
      C: $1.53$
      D: $1.43$

  - number: 11
    stem: If $\dfrac{9^{2x-1}}{27^{x+1}} = 1$, find the value of $x$.
    options:
      A: "2"
      B: "8"
      C: "5"
      D: "3"

  - number: 12
    stem: Factorize completely $4abx - 2axy - 12b^{2}x + 6bxy$
    options:
      A: $2x(3b-a)(2b-y)$
      B: $2x(a-3b)(b-2y)$
      C: $2x(2b-a)(3b-y)$
      D: $2x(a-3b)(2b-y)$

  - number: 13
    stem: >-
      The sum of the first $n$ terms of an arithmetic progression is 252. If the first term
      is $-16$ and the last term is 72, find the number of terms in the series.
    options:
      A: "7"
      B: "9"
      C: "6"
      D: "8"

  - number: 14
    stem: >-
      The graphs of the function $y = x^{2} + 4$ and a straight line $PQ$ are drawn to solve
      the equation $x^{2} - 3x + 2 = 0$. What is the equation of $PQ$?
    options:
      A: $y = 3x + 2$
      B: $y = 3x - 4$
      C: $y = 3x + 4$
      D: $y = 3x - 2$

  - number: 16
    stem: >-
      Find the values of $x$ and $y$ respectively if $3x - 5y + 5 = 0$ and $4x - 7y + 8 = 0$
    options:
      A: $-4,\ -5$
      B: $-5,\ -4$
      C: $5,\ 4$
      D: $4,\ 5$

  - number: 17
    stem: >-
      If $\begin{vmatrix} x & 2 \\ 4x & 1 \end{vmatrix} =
      \begin{vmatrix} 3 & 3x \\ 4 & -5 \end{vmatrix}$, find the value of $x$.
    options:
      A: $-3$
      B: $-5$
      C: $2$
      D: $5$
    corrected: >-
      the paper prints -2 as option A, but the determinants give x = -3 and no printed
      option satisfies the equation. A now carries the correct value.

  - number: 18
    stem: >-
      Find the range of values of $x$ satisfying the inequalities $5 + x \le 8$ and
      $13 + x \ge 7$
    options:
      A: $-6 \le x \le 3$
      B: $-6 \le x \le -3$
      C: $3 \le x \le 6$
      D: $-3 \le x \le 3$
    uncertain: >-
      the second inequality is indistinct in the compilation; written as "13 + x >= 7"
      because only that direction gives x >= -6, and hence option A. Verify against the paper.

  - number: 19
    stem: >-
      $x$ varies directly as the product of $U$ and $V$ and inversely as their sum. If
      $x = 3$ when $U = 3$ and $V = 1$, what is the value of $x$ if $U = 3$ and $V = 3$?
    options:
      A: "4"
      B: "9"
      C: "6"
      D: "3"

  - number: 20
    stem: Triangle $OPQ$ in the diagram above is the solution of the inequalities
    options:
      A: $x - 1 \le 0,\ y + x \le 0,\ y - x \le 0$
      B: $x + 1 \ge 0,\ y + x \le 0,\ y - x \ge 0$
      C: $y + x \le 0,\ y - x \ge 0,\ x - 1 \ge 0$
      D: $x - 1 \le 0,\ y - x \ge 0,\ y + x \ge 0$
    needs_figure: true
    figure_svg: |
      <svg viewBox="0 0 320 285" width="320" height="285" role="img"
           aria-label="Axes with the lines x plus 1 equals 0, y minus x equals 0 and y plus x equals 0; the triangle O P Q they enclose, to the left of the origin, is shaded">
        <path d="M160.0 140.0 L118.0 98.0 L118.0 182.0 Z" fill="#6d5ae0" stroke="none" stroke-width="0" fill-opacity="0.35"/>
        <path d="M25.6 140.0 L294.4 140.0" fill="none" stroke="#1a1a1f" stroke-width="1.4"/>
        <path d="M286.4 143.6 L294.4 140.0 L286.4 136.4 Z" fill="#1a1a1f" stroke="#1a1a1f" stroke-width="1"/>
        <path d="M160.0 266.0 L160.0 14.0" fill="none" stroke="#1a1a1f" stroke-width="1.4"/>
        <path d="M163.6 22.0 L160.0 14.0 L156.4 22.0 Z" fill="#1a1a1f" stroke="#1a1a1f" stroke-width="1"/>
        <text x="290.4" y="156.0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1a1f" font-style="italic" text-anchor="middle">x</text>
        <text x="172.0" y="20.0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1a1f" font-style="italic" text-anchor="middle">y</text>
        <path d="M118.0 266.0 L118.0 14.0" fill="none" stroke="#1a1a1f" stroke-width="1.8"/>
        <path d="M34.0 266.0 L286.0 14.0" fill="none" stroke="#1a1a1f" stroke-width="1.8"/>
        <path d="M34.0 14.0 L286.0 266.0" fill="none" stroke="#1a1a1f" stroke-width="1.8"/>
        <circle cx="160.0" cy="140.0" r="3.2" fill="#1a1a1f"/>
        <circle cx="118.0" cy="98.0" r="3.2" fill="#1a1a1f"/>
        <circle cx="118.0" cy="182.0" r="3.2" fill="#1a1a1f"/>
        <text x="176.0" y="156.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="start">O</text>
        <text x="127.0" y="90.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="start">P</text>
        <text x="127.0" y="200.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="start">Q</text>
        <text x="112.0" y="253.4" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1a1a1f" text-anchor="end">x + 1 = 0</text>
        <text x="252.4" y="18.2" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1a1a1f" text-anchor="end">y − x = 0</text>
        <text x="252.4" y="267.8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1a1a1f" text-anchor="end">y + x = 0</text>
      </svg>

  - number: 21
    stem: >-
      Three consecutive terms of a geometric progression are given as $n - 2$, $n$ and
      $n + 3$. Find the common ratio.
    options:
      A: $\tfrac{2}{3}$
      B: $\tfrac{3}{2}$
      C: $\tfrac{1}{2}$
      D: $\tfrac{1}{4}$

  - number: 22
    stem: >-
      The length a person can jump is inversely proportional to his weight. If a 20 kg person
      can jump 1.5 m, find the constant of proportionality.
    options:
      A: "30"
      B: "60"
      C: "15"
      D: "20"

  - number: 24
    stem: >-
      The locus of a point $P$ which moves on one side only of a straight line $XY$ so that
      $\angle XPY = 90^{\circ}$ is
    options:
      A: the perpendicular bisector of $XY$
      B: a circle
      C: a semicircle
      D: an arc of a circle through $X$, $Y$

  - number: 28
    stem: >-
      If $\tfrac{\pi}{2} \le \theta \le 2\pi$, find the maximum value of
      $f(\theta) = \dfrac{4}{6 + 2\cos\theta}$
    options:
      A: $1$
      B: $\tfrac{1}{2}$
      C: $4$
      D: $\tfrac{2}{3}$

  - number: 29
    stem: >-
      An aeroplane flies due north from airport $P$ to $Q$ and then flies due east to $R$. If
      $Q$ is equidistant from $P$ and $R$, find the bearing of $P$ from $R$.
    options:
      A: $270^{\circ}$
      B: $090^{\circ}$
      C: $135^{\circ}$
      D: $225^{\circ}$
    corrected: >-
      the paper prints "the bearing of P and R", which names no point to measure from. The
      key, 225 degrees, is the bearing of P from R, so "and" is read as "from".

  - number: 30
    stem: >-
      Find the value of $p$, if the line which passes through $(-1, -p)$ and $(-2, 2)$ is
      parallel to the line $2y + 8x - 17 = 0$.
    options:
      A: $-\tfrac{2}{7}$
      B: $2$
      C: $-\tfrac{6}{7}$
      D: $\tfrac{6}{7}$
    corrected: >-
      equal gradients give p = 2, which the paper does not offer. B, the nearest printed
      value, now carries the correct one.

  - number: 31
    stem: >-
      Find the equation of the locus of a point $P(x, y)$ which is equidistant from $Q(0, 0)$
      and $R(2, 1)$.
    options:
      A: $2x + y = 5$
      B: $2x + 2y = 5$
      C: $4x + 2y = 5$
      D: $4x - 2y = 5$

  - number: 32
    stem: >-
      An arc of a circle subtends an angle of $30^{\circ}$ on the circumference of a circle of
      radius 21 cm. Find the length of the arc.
    options:
      A: 66 cm
      B: 44 cm
      C: 22 cm
      D: 11 cm

  - number: 33
    stem: >-
      A trapezium has two parallel sides of length 5 cm and 9 cm. If the area is
      $21\ \text{cm}^{2}$, find the distance between the parallel sides.
    options:
      A: 7 cm
      B: 3 cm
      C: 4 cm
      D: 6 cm
    uncertain: >-
      the compilation prints the area as 121 cm2, which gives 17.3 cm and matches no
      option. Read as 21 cm2, giving 3 cm. Verify against the paper.

  - number: 34
    stem: >-
