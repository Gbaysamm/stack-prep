    figure_svg: |
      <svg viewBox="0 0 280 260" width="280" height="260" role="img"
           aria-label="Circle centre O, radius 7 cm, with X, Y and Z on it; angle X Z Y is 45 degrees and the segment cut off by chord X Y is shaded">
