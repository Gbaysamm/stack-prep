        <text x="161.4" y="241.5" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">Y</text>
        <text x="212.3" y="42.4" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="start">Z</text>
        <text x="142.0" y="115.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">O</text>
        <text x="174.3" y="84.4" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">45°</text>
        <text x="140.7" y="178.2" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1f" text-anchor="end">7 cm</text>
      </svg>

  - number: 35
    stem: >-
      A triangle has vertices $P(-1, 6)$, $Q(-3, -4)$ and $R(1, -4)$. Find the midpoints of
      $PQ$ and $QR$ respectively.
    options:
      A: $(-1, 0)$ and $(-1, -1)$
      B: $(-2, 1)$ and $(-1, -4)$
      C: $(0, -1)$ and $(-1, -4)$
      D: $(-2, 1)$ and $(0, 1)$

  - number: 36
    stem: Evaluate $\displaystyle\int_{2}^{3} (x^{2} - 2x)\,dx$
    options:
      A: $\tfrac{4}{3}$
      B: $\tfrac{1}{3}$
      C: $2$
      D: $4$

  - number: 37
    stem: If $y = 3\sin(-4x)$, $\dfrac{dy}{dx}$ is
    options:
      A: $-12\cos(-4x)$
      B: $12\sin(-4x)$
      C: $12x\cos(4x)$
      D: $-12x\cos(-4x)$

  - number: 38
    stem: Determine the minimum value of $y = 3x^{2} + 5x - 3$
    options:
      A: $-\tfrac{61}{12}$
      B: "0"
      C: "2"
      D: "4"
    corrected: >-
      the paper asks for the maximum, but the coefficient of x squared is positive so the
      curve opens upward and has only a minimum. The stem also breaks off at "at", where
      the neighbouring Q39 reads "at (1, 4)", so a point was lost in printing. Read as a
      minimum, the value is -61/12, and option A now carries it.

  - number: 39
    stem: Find the slope of the curve $y = 2x^{2} + 5x - 3$ at $(1, 4)$.
    options:
      A: "7"
      B: "9"
      C: "4"
      D: "6"

  - number: 40
    stem: >-
      The histogram above shows the ages of the victims of a pollution. How many people were
      involved in the pollution?
