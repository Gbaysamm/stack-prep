  - number: 41
    stem: >-
      Find the mean of the distribution below.
      $$\begin{array}{|c|c|c|c|c|c|}\hline \text{Value} & 0 & 1 & 2 & 3 & 4 \\ \hline \text{Frequency} & 1 & 2 & 2 & 1 & 9 \\ \hline \end{array}$$
    options:
      A: "4"
      B: "3"
      C: "1"
      D: "2"

  - number: 42
    stem: The mean of the numbers 3, 6, 4, $x$ and 7 is 5. Find the standard deviation.
    options:
      A: $2$
      B: $3$
      C: $\sqrt{3}$
      D: $\sqrt{2}$

  - number: 43
    stem: >-
      A bag contains 5 black balls and 3 red balls. Two balls are picked at random without
      replacement. What is the probability that a black and a red ball are picked?
    options:
      A: $\tfrac{5}{14}$
      B: $\tfrac{13}{28}$
      C: $\tfrac{3}{14}$
      D: $\tfrac{15}{28}$

  - number: 44
    stem: >-
      On a pie chart, there are four sectors of which three angles are $45^{\circ}$,
      $90^{\circ}$ and $135^{\circ}$. If the smallest sector represents ₦28.00, how much is
      the largest sector?
    options:
      A: ₦48.00
      B: ₦96.00
      C: ₦42.00
      D: ₦84.00

  - number: 45
    stem: The range of 4, 3, 11, 9, 6, 15, 19, 23, 27, 24, 21 and 16 is
    options:
      A: "23"
      B: "24"
      C: "21"
