# UTME 2004 Mathematics — re-transcribed by hand from MATHEMATICS-questions.pdf, pages 61-64.
#
# All 50 questions. The extractor kept 38: seven had option sets it could not split (stacked
# fractions, matrices set two rows deep), four refer to a diagram its ink-detector missed, and
# Q1 was never seen at all, because it is a column subtraction with no "1." followed by a
# sentence for the question-number pattern to match. Reading the page recovers every one.
#
# Conventions
#   * Mathematics is delimited with $...$ and set with KaTeX-compatible commands only.
#   * The naira sign is written ₦, not the "#" the compilation prints.
#   * `pending: true` marks a question not yet answerable — it needs a figure that has not
#     been attached, or the printed question is internally inconsistent. The stem and options
#     are still transcribed, so only the answer is outstanding.
#   * `corrected` records a repair to the printed question, with the reason.
#   * `uncertain` records something ambiguous in print that a person should settle.
source:
  file: docs/questions/utme/mathematics/MATHEMATICS-questions.pdf
  exam_year: 2004
  paper_label: UTME 2004 Mathematics (objective)
  paper_code: UTME-2004-MATH
  pages: [61, 62, 63, 64]
  transcribed_by: hand
  answer_source: unverified

questions:
  - number: 1
    stem: >-
      Find $x$ and $y$ respectively in the subtraction below, carried out in base 5.
      $$\begin{array}{cccc} & 4 & 2\ \ 4\ \ 3 \\ - & 1 & 3\ \ x\ \ 4 \\ \hline & y & 3\ \ 4\ \ 4 \end{array}$$
    options:
      A: $2,\ 4$
      B: $3,\ 2$
      C: $4,\ 2$
      D: $4,\ 3$

  - number: 2
    stem: Find $p$, if $451_6 - p_7 = 305_6$
    options:
      A: $611_7$
      B: $142_7$
      C: $116_7$
      D: $62_7$

  - number: 3
    stem: Simplify $\dfrac{\tfrac{1}{10} \times \tfrac{2}{3} + \tfrac{1}{4}}{\tfrac{1}{2} \div \tfrac{3}{5} - \tfrac{1}{4}}$
    options:
      A: $\tfrac{2}{25}$
      B: $\tfrac{19}{60}$
      C: $\tfrac{7}{12}$
      D: $\tfrac{19}{35}$

  - number: 4
    stem: >-
      A farmer planted 5000 grains of maize and harvested 5000 cobs, each bearing 500 grains.
      What is the ratio of the number of grains sowed to the number harvested?
    options:
      A: $1:500$
      B: $1:5000$
      C: $1:25000$
      D: $1:250000$

  - number: 5
    stem: >-
      Three teachers shared a packet of chalk. The first teacher got $\tfrac{2}{5}$ of the
      chalk and the second teacher received $\tfrac{2}{15}$ of the remainder. What fraction
      did the third teacher receive?
    options:
      A: $\tfrac{11}{25}$
      B: $\tfrac{12}{25}$
      C: $\tfrac{13}{25}$
      D: $\tfrac{8}{15}$

  - number: 6
    stem: Given that $\sqrt[3]{4^{2x}} = 16$, find the value of $x$
    options:
      A: "2"
      B: "3"
      C: "4"
      D: "6"
    corrected: >-
      the paper prints the expression with nothing it is equal to, so there is no value of x
      to find. This stem is a reconstruction, not a repair: the right-hand side 16 = 4² is
      supplied, the smallest power of 4 for which the options are all distinct natural
      answers (x = 3), and it is the version of this question in common circulation. The
      original right-hand side cannot be recovered from the page.

  - number: 7
    stem: Simplify $\dfrac{1}{\sqrt{3} + 2}$ in the form $a + b\sqrt{3}$
    options:
      A: $-2 - \sqrt{3}$
      B: $-2 + \sqrt{3}$
      C: $2 - \sqrt{3}$
      D: $2 + \sqrt{3}$

  - number: 8
    stem: If $6\log_x 2 - 3\log_x 3 = 3$, find $x$.
    options:
      A: $\tfrac{3}{8}$
      B: $\tfrac{3}{4}$
      C: $\tfrac{4}{3}$
      D: $\tfrac{8}{3}$
    corrected: >-
      the paper prints the right-hand side as "3log_x 0.2", which makes the equation false for
      every x — the two sides reduce to 64/27 and 1/125. Read as "= 3" the equation gives
      x^3 = 64/27 and x = 4/3, which is option C.

  - number: 9
    stem: The shaded region in the Venn diagram above is
    options:
      A: $P^{c} \cap (Q \cap R)$
      B: $P \cap Q$
      C: $P^{c} \cup (Q \cap R)$
      D: $P^{c} \cap (Q \cup R)$
    needs_figure: true
    figure_svg: |
      <svg viewBox="0 0 300 230" width="300" height="230" role="img"
           aria-label="Three overlapping circles P, Q and R; the region inside both Q and R but outside P is shaded">
        <defs>
          <clipPath id="v9q"><circle cx="190" cy="90" r="70"/></clipPath>
          <clipPath id="v9r"><circle cx="150" cy="150" r="70"/></clipPath>
          <mask id="v9notp">
            <rect x="0" y="0" width="300" height="230" fill="#fff"/>
            <circle cx="110" cy="90" r="70" fill="#000"/>
          </mask>
        </defs>
        <g clip-path="url(#v9q)" mask="url(#v9notp)">
          <circle cx="150" cy="150" r="70" fill="#6d5ae0" fill-opacity="0.55"/>
        </g>
        <g fill="none" stroke="#1a1a1f" stroke-width="1.6">
          <circle cx="110" cy="90" r="70"/>
          <circle cx="190" cy="90" r="70"/>
          <circle cx="150" cy="150" r="70"/>
        </g>
        <g font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">
          <text x="58" y="34" text-anchor="middle">P</text>
          <text x="244" y="34" text-anchor="middle">Q</text>
          <text x="150" y="226" text-anchor="middle">R</text>
        </g>
      </svg>

  - number: 10
    stem: >-
      In a class of 40 students, each student offers at least one of Physics and Chemistry.
      If the number of students that offer Physics is three times the number that offer both
      subjects and the number that offers Chemistry is twice the number that offer Physics,
      find the number of students that offer Physics only.
    options:
      A: "25"
      B: "15"
      C: "10"
      D: "5"

  - number: 11
    stem: Find the values of $x$ where the curve $y = x^{3} + 2x^{2} - 5x - 6$ crosses the $x$-axis.
    options:
      A: $-2, -1$ and $3$
      B: $-2, 1$ and $-3$
      C: $2, -1$ and $-3$
      D: $2, 1$ and $3$

  - number: 12
    stem: Find the remainder when $3x^{3} + 5x^{2} - 11x + 4$ is divided by $x + 3$
    options:
      A: "4"
      B: "1"
      C: "-1"
      D: "-4"
    corrected: >-
      the paper prints "3x^3 + 5x^2 - 11x +" with the constant term missing. The remainder is
      the constant minus 3, so option B requires the constant 4 — the only small whole number
      that makes a listed option correct. Verify against the paper.

  - number: 13
    stem: Factorize completely $ac - 2bc - a^{2} + 4b^{2}$
    options:
      A: $(a - 2b)(c + a - 2b)$
      B: $(a - 2b)(c - a - 2b)$
      C: $(a - 2b)(c + a + 2b)$
      D: $(a - 2b)(c - a + 2b)$

  - number: 14
    stem: >-
      $y$ is inversely proportional to $x$ and $y = 4$ when $x = \tfrac{1}{2}$. Find $x$ when
      $y = 10$.
    options:
      A: $\tfrac{1}{10}$
      B: $\tfrac{1}{5}$
      C: "2"
      D: "10"

  - number: 15
    stem: >-
      The length $L$ of a simple pendulum varies directly as the square of its period $T$. If
      a pendulum with period 4 secs is 64 cm long, find the length of a pendulum whose period
      is 9 sec.
    options:
      A: 36 cm
      B: 96 cm
      C: 144 cm
      D: 324 cm

  - number: 16
    stem: The shaded area in the diagram above is represented by
    options:
      A: '$\{(x, y) : y + 3x < 6\}$'
      B: '$\{(x, y) : y + 3x < -6\}$'
      C: '$\{(x, y) : y - 3x < 6\}$'
      D: '$\{(x, y) : y - 3x < -6\}$'
    needs_figure: true
    figure_svg: |
      <svg viewBox="0 0 320 250" width="320" height="250" role="img"
           aria-label="The line through (0,6) and (2,0); the half-plane containing the origin is shaded">
        <defs><clipPath id="g16"><rect x="30" y="26" width="260" height="200"/></clipPath></defs>
        <g clip-path="url(#g16)">
          <path d="M93.3 26 L226.7 226 L30 226 L30 26 Z" fill="#6d5ae0" fill-opacity="0.22"/>
          <path d="M93.3 26 L226.7 226" stroke="#3f2fa8" stroke-width="2" fill="none"/>
        </g>
        <g stroke="#1a1a1f" stroke-width="1.6" fill="none">
          <path d="M34 156 H292"/><path d="M100 30 V222"/>
        </g>
        <g fill="#1a1a1f">
          <circle cx="100" cy="36" r="3.4"/><circle cx="180" cy="156" r="3.4"/>
        </g>
        <g font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1f">
          <text x="108" y="34">(0, 6)</text>
          <text x="56" y="172">(0, 0)</text>
          <text x="186" y="172">(2, 0)</text>
          <text x="296" y="152" font-style="italic">x</text>
          <text x="86" y="50" fill="#555" font-size="11">y</text>
        </g>
      </svg>

  - number: 17
    stem: What are the integral values of $x$ which satisfy the inequality $-1 < 3 - 2x \le 5$?
    options:
      A: $-2, 1, 0, -1$
      B: $-1, 0, 1, 2$
      C: $-1, 0, 1$
      D: $0, 1, 2$

  - number: 18
    stem: >-
      The $n$th terms of two sequences are $Q_n = 3 \cdot 2^{n-2}$ and $U_n = 3 \cdot 2^{2n-3}$.
      Find the product of $Q_2$ and $U_2$.
    options:
      A: "3"
      B: "6"
      C: "12"
      D: "18"

  - number: 19
    stem: >-
      Given that the first and fourth terms of a G.P. are 6 and 162 respectively, find the sum
      of the first three terms of the progression.
    options:
      A: "8"
      B: "27"
      C: "48"
      D: "78"

  - number: 20
    stem: >-
      Find the sum to infinity of the series $\tfrac{1}{2}, \tfrac{1}{6}, \tfrac{1}{18},
      \ldots$
    options:
      A: "1"
      B: $\tfrac{3}{4}$
      C: $\tfrac{2}{3}$
      D: $\tfrac{1}{3}$

  - number: 21
    stem: >-
      If the operation $*$ on the set of integers is defined by $p * q = \sqrt{pq}$, find the
      value of $4 * (8 * 32)$.
    options:
      A: "16"
      B: "8"
      C: "4"
      D: "3"

  - number: 22
    stem: >-
      The inverse of the matrix $\begin{pmatrix} 2 & 1 \\ 1 & 1 \end{pmatrix}$ is
    options:
      A: $\begin{pmatrix} 1 & 1 \\ -1 & 2 \end{pmatrix}$
      B: $\begin{pmatrix} 1 & -1 \\ -1 & 2 \end{pmatrix}$
      C: $\begin{pmatrix} 1 & 1 \\ 1 & 2 \end{pmatrix}$
      D: $\begin{pmatrix} 1 & -1 \\ 1 & 2 \end{pmatrix}$

  - number: 23
    stem: >-
      If $P = \begin{pmatrix} 1 & 0 & -1 \\ 3 & 4 & 5 \\ -1 & 0 & 1 \end{pmatrix}$, then
      $|P|$ is
    options:
      A: "-8"
      B: "0"
      C: "4"
      D: "8"

  - number: 24
    stem: >-
      The sum of the interior angles of a pentagon is $6x + 6y$. Find $y$ in terms of $x$.
    options:
      A: $y = 60 - x$
      B: $y = 90 - x$
      C: $y = 120 - x$
      D: $y = 150 - x$

  - number: 25
    stem: >-
      $PQRSTV$ is a regular polygon of side 7 cm inscribed in a circle. Find the circumference
      of the circle $PQRSTV$.
    options:
      A: 22 cm
      B: 42 cm
      C: 44 cm
      D: 56 cm

