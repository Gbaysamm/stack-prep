        <circle cx="223.9" cy="31.1" r="3.2" fill="#1a1a1f"/>
        <text x="34.0" y="233.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">A</text>
