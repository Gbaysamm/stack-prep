  - number: 28
    stem: >-
      An arc of a circle of length 22 cm subtends an angle of $3x^{\circ}$ at the centre of the
      circle. Find the value of $x$ if the diameter of the circle is 14 cm.
    options:
      A: $30^{\circ}$
      B: $60^{\circ}$
      C: $120^{\circ}$
      D: $180^{\circ}$

  - number: 29
    stem: >-
      Determine the locus of a point inside a square $PQRS$ which is equidistant from $PQ$ and
      $QR$.
    options:
      A: The diagonal $PR$
      B: The diagonal $QS$
      C: Side $SR$
      D: The perpendicular bisector of $PQ$

  - number: 30
    stem: The locus of a point which is 5 cm from the line $LM$ is a
    options:
      A: pair of lines on opposite sides of $LM$ and parallel to it, each distance 5 cm from $LM$
      B: line parallel to $LM$ and 5 cm from $LM$
      C: pair of parallel lines on one side of $LM$ and parallel to $LM$
      D: line distance 10 cm from $LM$ and parallel to $LM$

  - number: 31
    stem: >-
      Find the value of $\alpha^{2} + \beta^{2}$ if $\alpha + \beta = 2$ and the distance
      between the points $(1, \alpha)$ and $(\beta, 1)$ is 3 units.
    options:
      A: "3"
      B: "5"
      C: "11"
      D: "14"
    corrected: >-
      the paper prints "if a + b =" with the value missing. Expanding the distance condition
      gives a² + b² = 7 + 2(a + b), so the sum must be 2 for the answer to be a listed option.
      Verify against the paper.

  - number: 32
    stem: Find the midpoint of the line joining $P(-3, 5)$ and $Q(5, -3)$.
    options:
      A: $(4, -4)$
      B: $(4, 4)$
      C: $(2, 2)$
      D: $(1, 1)$

  - number: 33
