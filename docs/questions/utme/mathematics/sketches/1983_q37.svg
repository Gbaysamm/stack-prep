  <path d="M270.0 70.0 L270.0 175.0" fill="none" stroke="#1a1a1f" stroke-width="1.8"/>
  <path d="M270.0 175.0 L55.0 175.0" fill="none" stroke="#1a1a1f" stroke-width="1.8"/>
