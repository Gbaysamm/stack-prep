<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 250" width="340" height="250" role="img"
     aria-label="A Venn diagram of the integers 1 to 10 with circles for primes (2, 3, 5, 7) and multiples of 3 (3, 6, 9), overlapping at 3; 1, 4, 8 and 10 lie outside">
  <rect x="15" y="30" width="310" height="190" fill="none" stroke="#1a1a1f" stroke-width="1.8"/>
  <text x="26.0" y="50.0" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">U</text>
  <circle cx="130" cy="125" r="70" fill="#ede9fe" fill-opacity="0.7" stroke="#1a1a1f" stroke-width="1.8"/>
  <circle cx="215" cy="125" r="70" fill="#fde2e2" fill-opacity="0.7" stroke="#1a1a1f" stroke-width="1.8"/>
  <text x="105.0" y="22.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1a1a1f">Prime</text>
  <text x="240.0" y="22.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1a1a1f">Multiple of 3</text>
  <text x="105.0" y="120.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#1a1a1f">2   5</text>
  <text x="105.0" y="145.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#1a1a1f">7</text>
  <text x="172.0" y="130.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#b91c1c">3</text>
  <text x="240.0" y="120.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#1a1a1f">6</text>
  <text x="240.0" y="145.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#1a1a1f">9</text>
  <text x="30.0" y="210.0" text-anchor="start" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#1a1a1f">1   4   8   10</text>
  <text x="170.0" y="240.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">U = {1, 2, …, 10}</text>
</svg>
