<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 250" width="340" height="250" role="img"
     aria-label="A tree diagram for drawing two balls without replacement from 6 red and 4 white: red then red has probabilities 6 over 10 and 5 over 9, and its probability is unknown">
