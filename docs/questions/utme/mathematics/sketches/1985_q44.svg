  <line x1="30.0" y1="130.0" x2="128.0" y2="72.0" stroke="#1a1a1f" stroke-width="1.8"/>
  <text x="140.0" y="77.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">R</text>
  <text x="81.0" y="95.0" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">6/10</text>
  <line x1="30.0" y1="130.0" x2="128.0" y2="188.0" stroke="#1a1a1f" stroke-width="1.8"/>
  <text x="140.0" y="193.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">W</text>
  <text x="81.0" y="175.0" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">4/10</text>
  <line x1="152.0" y1="72.0" x2="238.0" y2="42.0" stroke="#1a1a1f" stroke-width="1.8"/>
  <text x="196.0" y="53.0" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">5/9</text>
  <text x="260.0" y="47.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">RR</text>
  <line x1="152.0" y1="72.0" x2="238.0" y2="102.0" stroke="#1a1a1f" stroke-width="1.8"/>
  <text x="196.0" y="101.0" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">4/9</text>
  <text x="260.0" y="107.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">RW</text>
  <line x1="152.0" y1="188.0" x2="238.0" y2="158.0" stroke="#1a1a1f" stroke-width="1.8"/>
  <text x="196.0" y="169.0" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">6/9</text>
  <text x="260.0" y="163.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">WR</text>
  <line x1="152.0" y1="188.0" x2="238.0" y2="218.0" stroke="#1a1a1f" stroke-width="1.8"/>
  <text x="196.0" y="217.0" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">3/9</text>
  <text x="260.0" y="223.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">WW</text>
  <text x="140.0" y="18.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#6b6b75">1st ball</text>
  <text x="260.0" y="18.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#6b6b75">2nd ball</text>
  <text x="286.0" y="47.0" text-anchor="start" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#3f2fa8" font-style="italic">?</text>
