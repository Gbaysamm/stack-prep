<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 275" width="340" height="275" role="img"
     aria-label="The parallel of latitude 60 degrees south seen from above the South Pole, radius R cos 60 degrees; X is on longitude 147 degrees east and Y on 153 degrees west, either side of the 180 degree meridian, and the arc X Y is asked">
  <circle cx="170.0" cy="135.0" r="95.0" fill="none" stroke="#1a1a1f" stroke-width="1.7"/>
  <path d="M170.0 26.0 L170.0 244.0" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 4"/>
  <path d="M118.3 55.3 L170.0 135.0 L213.1 50.4" fill="none" stroke="#1a1a1f" stroke-width="1.6"/>
  <path d="M213.13 50.35 A95.0 95.0 0 0 0 118.26 55.33" fill="none" stroke="#3f2fa8" stroke-width="3.0"/>
  <path d="M180.90 113.62 A24 24 0 0 0 156.93 114.87" fill="none" stroke="#3f2fa8" stroke-width="1.5"/>
  <g fill="#1a1a1f"><circle cx="118.3" cy="55.3" r="3.2"/><circle cx="213.1" cy="50.4" r="3.2"/><circle cx="170.0" cy="135.0" r="3.2"/></g>
  <text x="100.3" y="51.3" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">X</text>
  <text x="219.1" y="46.4" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">Y</text>
  <text x="170.0" y="22.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1a1a1f">180°</text>
  <text x="170.0" y="256.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1a1a1f">0° (Greenwich)</text>
  <text x="92.3" y="69.3" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">147°E</text>
  <text x="237.1" y="64.4" text-anchor="start" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">153°W</text>
  <text x="186.0" y="72.4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#3f2fa8">?</text>
  <text x="178.0" y="175.0" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1a1a1f">r = R cos 60°</text>
  <path d="M170.0 135.0 L242.8 196.1" fill="none" stroke="#555" stroke-width="1.1"/>
  <text x="10.0" y="22.0" text-anchor="start" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1f">latitude 60°S</text>
</svg>
