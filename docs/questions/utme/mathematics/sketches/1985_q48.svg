<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 270" width="320" height="270" role="img"
     aria-label="A pie chart of a class of 120 students with the A-grade sector of 18 students at angle Z at the centre">
  <path d="M150.0 125.0 L150.0 30.0 A95 95 0 0 0 73.1 69.2 Z" fill="#fde2e2" stroke="#1a1a1f" stroke-width="1.6"/>
  <text x="101.4" y="29.7" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1f">A grade: 18</text>
  <path d="M150.0 125.0 L73.1 69.2 A95 95 0 1 0 150.0 30.0 Z" fill="#f3f4f6" stroke="#1a1a1f" stroke-width="1.6"/>
  <text x="198.6" y="232.3" text-anchor="start" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1f">Others: 102</text>
  <path d="M150.0 99.0 A26 26 0 0 0 129.0 109.7" fill="none" stroke="#3f2fa8" stroke-width="1.6"/>
  <text x="130.9" y="87.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#3f2fa8" font-style="italic">Z</text>
  <text x="160.0" y="260.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">120 students = 360°</text>
</svg>
