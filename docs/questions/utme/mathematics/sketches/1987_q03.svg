<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" width="340" height="200" role="img"
     aria-label="A rectangular lawn A B C D with length 50 metres, which is 55 yards, an area of 1815 square yards, and an unknown width">
  <path d="M50.0 150.0 L290.0 150.0 L290.0 50.0 L50.0 50.0 Z" fill="#eef7ee" stroke="#1a1a1f" stroke-width="1.8"/>
  <text x="38.0" y="162.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">A</text>
  <text x="302.0" y="162.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">B</text>
  <text x="302.0" y="46.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">C</text>
  <text x="38.0" y="46.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">D</text>
  <text x="170.0" y="176.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">50 m = 55 yd</text>
  <text x="302.0" y="104.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#3f2fa8" text-anchor="start">?</text>
  <text x="170.0" y="105.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Area 1815 yd²</text>
</svg>
