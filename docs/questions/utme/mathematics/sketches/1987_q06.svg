<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200" role="img"
     aria-label="A square of side s beside the rectangle made from it, with length 1.2 s and width 0.8 s; the ratio of the rectangle's area to the square's is asked">
  <path d="M30.0 50.0 L130.0 50.0 L130.0 150.0 L30.0 150.0 Z" fill="#eef2ff" stroke="#1a1a1f" stroke-width="1.8"/>
  <text x="80.0" y="170.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">s</text>
  <text x="18.0" y="104.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">s</text>
  <text x="80.0" y="105.0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1a1f" text-anchor="middle">s²</text>
  <text x="80.0" y="30.0" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1f" text-anchor="middle">square</text>
  <path d="M165.0 60.0 L305.0 60.0 L305.0 140.0 L165.0 140.0 Z" fill="#fde2e2" stroke="#1a1a1f" stroke-width="1.8"/>
  <text x="235.0" y="160.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">1.2s</text>
  <text x="312.0" y="104.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="start">0.8s</text>
  <text x="235.0" y="105.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#3f2fa8" text-anchor="middle">?</text>
  <text x="235.0" y="40.0" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1f" text-anchor="middle">rectangle</text>
</svg>
