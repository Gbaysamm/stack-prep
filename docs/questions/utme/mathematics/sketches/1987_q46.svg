<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" width="360" height="250" role="img"
     aria-label="A pie chart of one 24-hour day split into daylight, 13 and a half hours from 5.30 a.m. to 7.00 p.m., shaded, and darkness, 10 and a half hours; both sector angles are asked">
  <path d="M130.0 125.0 L93.6 212.8 A95.0 95.0 0 1 0 130.0 30.0 Z" fill="#fde2e2" stroke="#1a1a1f" stroke-width="1.6"/>
  <text x="171.9" y="137.3" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#3f2fa8" text-anchor="middle">Daylight</text>
  <path d="M130.0 125.0 L130.0 30.0 A95.0 95.0 0 0 0 93.6 212.8 Z" fill="white" stroke="#1a1a1f" stroke-width="1.6"/>
  <text x="88.1" y="120.7" font-family="system-ui, sans-serif" font-size="11" fill="#1a1a1f" text-anchor="middle">Darkness</text>
  <text x="171.9" y="153.3" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">13½ h</text>
  <text x="88.1" y="136.7" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">10½ h</text>
  <text x="245.0" y="60.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="start">Day = 24 h</text>
  <text x="245.0" y="82.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="start">= 360°</text>
  <text x="245.0" y="120.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#3f2fa8" text-anchor="start">Daylight ?</text>
  <text x="245.0" y="142.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#3f2fa8" text-anchor="start">Darkness ?</text>
</svg>
