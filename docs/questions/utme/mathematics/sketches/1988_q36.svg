  <text x="180.0" y="19.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">E</text>
  <text x="180.0" y="64.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#3f2fa8" text-anchor="middle">?</text>
  <circle cx="70.6" cy="109.5" r="3.2" fill="#1a1a1f"/>
  <text x="55.4" y="109.5" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">A</text>
  <text x="106.8" y="125.2" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">(90 − x)°</text>
  <circle cx="112.4" cy="238.0" r="3.2" fill="#1a1a1f"/>
  <text x="103.0" y="256.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">B</text>
  <text x="134.7" y="211.3" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">(90 + x)°</text>
  <circle cx="247.6" cy="238.0" r="3.2" fill="#1a1a1f"/>
  <text x="257.0" y="256.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">C</text>
  <text x="225.3" y="211.3" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">(110 − 2x)°</text>
