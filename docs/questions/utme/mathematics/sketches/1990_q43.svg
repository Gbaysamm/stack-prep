  <path d="M31 100.0 V180 M139 100.0 V180" fill="none" stroke="#1a1a1f" stroke-width="1.8"/>
  <path d="M31 180 A54 16.2 0 0 0 139 180" fill="none" stroke="#1a1a1f" stroke-width="1.8"/>
  <path d="M31 180 A54 16.2 0 0 1 139 180" fill="none" stroke="#1a1a1f" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M85 180 L139 180" fill="none" stroke="#b91c1c" stroke-width="1.4"/>
  <text x="85.0" y="214.2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">radius 9</text>
  <text x="147.0" y="144.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">height 2</text>
  <text x="85.0" y="232.2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#3f2fa8">first</text>
  <ellipse cx="270" cy="60.0" rx="48" ry="14.4" fill="none" stroke="#1a1a1f" stroke-width="1.8"/>
  <path d="M222 60.0 V180 M318 60.0 V180" fill="none" stroke="#1a1a1f" stroke-width="1.8"/>
