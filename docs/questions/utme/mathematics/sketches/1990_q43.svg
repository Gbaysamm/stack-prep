  <path d="M222 180 A48 14.4 0 0 1 318 180" fill="none" stroke="#1a1a1f" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M270 180 L318 180" fill="none" stroke="#b91c1c" stroke-width="1.4"/>
  <text x="270.0" y="212.4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">radius 8</text>
  <text x="326.0" y="124.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">height 3</text>
  <text x="270.0" y="230.4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#3f2fa8">second</text>
  <text x="185.0" y="24.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#3f2fa8">volume ratio = ?</text>
</svg>
