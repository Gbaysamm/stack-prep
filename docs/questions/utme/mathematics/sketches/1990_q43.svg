<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 250" width="380" height="250" role="img"
     aria-label="Two circular cylinders side by side: the first with radius 9 and height 2 parts, the second with radius 8 and height 3 parts; the ratio of their volumes is asked">
