<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" width="340" height="240" role="img"
     aria-label="A straight route from Calabar to Enugu, p km at u km per hour, then on to Benin, q km at w km per hour; the average speed for the whole journey is asked">
  <path d="M40 150 L300 150" fill="none" stroke="#1a1a1f" stroke-width="1.8"/>
  <path d="M126 150 l-8 -4 M126 150 l-8 4 M246 150 l-8 -4 M246 150 l-8 4" fill="none" stroke="#1a1a1f" stroke-width="1.4"/>
  <g fill="#1a1a1f"><circle cx="40.0" cy="150.0" r="3.2"/><circle cx="180.0" cy="150.0" r="3.2"/><circle cx="300.0" cy="150.0" r="3.2"/></g>
  <text x="40.0" y="172.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1f">Calabar</text>
  <text x="180.0" y="172.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1f">Enugu</text>
  <text x="300.0" y="172.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1f">Benin</text>
  <text x="110.0" y="140.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">p km</text>
  <text x="110.0" y="120.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">u km/h</text>
  <text x="240.0" y="140.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">q km</text>
  <text x="240.0" y="120.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">w km/h</text>
  <path d="M40 195 H300" fill="none" stroke="#3f2fa8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="170.0" y="218.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#3f2fa8">average speed, Calabar to Benin = ?</text>
</svg>
