<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 205" width="320" height="205" role="img"
     aria-label="Right-angled triangle A B C with the right angle at B and angle theta at A; the opposite side B C is m, the hypotenuse A C is n, and the adjacent side A B is the unknown square root of n squared minus m squared">
  <path d="M50 170 L270 170 L270 50 Z" fill="#6d5ae0" fill-opacity="0.12" stroke="#1a1a1f" stroke-width="1.9" stroke-linejoin="round"/>
  <path d="M258.0 170.0 L258.0 158.0 L270.0 158.0" fill="none" stroke="#1a1a1f" stroke-width="1.3"/>
  <path d="M84.0 170.0 A34 34 0 0 0 79.8 153.7" fill="none" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="92.0" y="163.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="start" font-style="italic">θ</text>
  <circle cx="50.0" cy="170.0" r="3.2" fill="#1a1a1f"/>
  <circle cx="270.0" cy="170.0" r="3.2" fill="#1a1a1f"/>
  <circle cx="270.0" cy="50.0" r="3.2" fill="#1a1a1f"/>
  <text x="40.0" y="175.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="end">A</text>
  <text x="278.0" y="186.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="start">B</text>
  <text x="278.0" y="48.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="start">C</text>
  <text x="280.0" y="114.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="start" font-style="italic">m</text>
  <text x="150.0" y="100.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="end" font-style="italic">n</text>
  <text x="160.0" y="192.0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#3f2fa8" text-anchor="middle">√(n² − m²)</text>
