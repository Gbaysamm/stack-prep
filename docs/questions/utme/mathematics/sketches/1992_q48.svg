<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" width="320" height="210" role="img"
     aria-label="Venn diagram of events P and Q overlapping: the overlap holds probability 1/12, P alone 8/12 and Q alone 1/12; P has 3/4, Q has 1/6, and P or Q is asked for">
  <path d="M12.0 14.0 L308.0 14.0 L308.0 198.0 L12.0 198.0 Z" fill="none" stroke="#1a1a1f" stroke-width="1.5"/>
  <circle cx="125.0" cy="106.0" r="72.0" fill="#ece9fb" stroke="#1a1a1f" stroke-width="1.8"/>
  <circle cx="205.0" cy="106.0" r="56.0" fill="#ece9fb" stroke="#1a1a1f" stroke-width="1.8"/>
  <circle cx="125.0" cy="106.0" r="72.0" fill="none" stroke="#1a1a1f" stroke-width="1.8"/>
  <text x="70.0" y="52.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">P</text>
  <text x="252.0" y="56.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">Q</text>
  <text x="95.0" y="111.0" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#1a1a1f" text-anchor="middle">8/12</text>
  <text x="170.0" y="111.0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">1/12</text>
  <text x="232.0" y="111.0" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#1a1a1f" text-anchor="middle">1/12</text>
  <text x="78.0" y="190.0" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="middle">P(P) = 3/4</text>
  <text x="232.0" y="190.0" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#1a1a1f" text-anchor="middle">P(Q) = 1/6</text>
  <text x="300.0" y="34.0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#3f2fa8" text-anchor="end">P(P ∪ Q) = ?</text>
</svg>
