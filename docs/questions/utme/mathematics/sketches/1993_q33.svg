<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 230" width="300" height="230" role="img"
     aria-label="Isosceles triangle with sides x plus 3, 2x minus 3 and 2x plus 3; which two sides are equal is not marked; x is asked for">
  <path d="M150.0 26.0 L40.0 196.0 L260.0 196.0 Z" fill="none" stroke="#1a1a1f" stroke-width="1.8"/>
  <text x="84.0" y="104.0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1a1f" text-anchor="end">x + 3</text>
  <text x="216.0" y="104.0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1a1f" text-anchor="start">2x − 3</text>
  <text x="150.0" y="218.0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1a1f" text-anchor="middle">2x + 3</text>
  <text x="150.0" y="150.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#3f2fa8" text-anchor="middle">x = ?</text>
