  <text x="142.0" y="182.0" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#3f2fa8" font-style="italic">x</text>
  <text x="238.0" y="44.0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b91c1c" font-style="italic">2r</text>
