<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 255" width="360" height="255" role="img"
     aria-label="Venn diagram of set C, the cricket eleven with 11 boys, and set R, the rugby fourteen with 14 boys, overlapping in 4 boys; the number in C union R is asked">
  <rect x="20" y="20" width="320" height="215" fill="none" stroke="#1a1a1f" stroke-width="1.5"/>
  <circle cx="130" cy="125" r="80" fill="#6d5ae0" fill-opacity="0.10" stroke="#1a1a1f" stroke-width="1.7"/>
  <circle cx="215" cy="125" r="80" fill="#6d5ae0" fill-opacity="0.10" stroke="#1a1a1f" stroke-width="1.7"/>
  <text x="70" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">C</text>
  <text x="275" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">R</text>
  <text x="90" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1f">Cricket</text>
  <text x="90" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1a1f">11</text>
  <text x="258" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1f">Rugby</text>
  <text x="258" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1a1f">14</text>
  <text x="172.5" y="131" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1a1a1f">4</text>
  <text x="172.5" y="147" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1a1a1f">both</text>
  <text x="180" y="226" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">C ∪ R = ?</text>
</svg>
