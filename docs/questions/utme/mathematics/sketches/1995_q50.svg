<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 250" width="370" height="250" role="img"
     aria-label="Tree diagram for two throws of a die with 4 white and 2 black faces: each throw is white with probability two thirds and black with one third; the white then white path is highlighted and its probability is asked">
