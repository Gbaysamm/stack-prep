  <text x="250.0" y="45.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">W</text>
  <text x="270.0" y="45.0" text-anchor="start" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">both white: ?</text>
  <line x1="152.0" y1="70.0" x2="238.0" y2="100.0" stroke="#1a1a1f" stroke-width="1.5"/>
  <text x="195.0" y="102.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1f">⅓</text>
  <text x="250.0" y="105.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">B</text>
  <line x1="34.0" y1="130.0" x2="128.0" y2="190.0" stroke="#1a1a1f" stroke-width="1.5"/>
