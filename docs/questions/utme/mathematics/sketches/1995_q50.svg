  <text x="140.0" y="75.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">W</text>
  <line x1="152.0" y1="70.0" x2="238.0" y2="40.0" stroke="#b91c1c" stroke-width="2.2"/>
