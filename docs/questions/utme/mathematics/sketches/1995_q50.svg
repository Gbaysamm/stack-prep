  <text x="195.0" y="167.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1f">⅔</text>
  <text x="250.0" y="165.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">W</text>
  <line x1="152.0" y1="190.0" x2="238.0" y2="220.0" stroke="#1a1a1f" stroke-width="1.5"/>
