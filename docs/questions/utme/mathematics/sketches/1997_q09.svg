<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 285" width="360" height="285" role="img"
     aria-label="Venn diagram of X, Y and Z inside U: X only holds S and E, X and Y share P and N, X and Z share D, Y and Z share O and U, Y only holds R, Z only holds L">
  <rect x="20" y="15" width="320" height="255" fill="none" stroke="#1a1a1f" stroke-width="1.5"/>
  <text x="34.0" y="38.0" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">U</text>
  <circle cx="145" cy="115" r="72" fill="#6d5ae0" fill-opacity="0.10" stroke="#1a1a1f" stroke-width="1.7"/>
  <circle cx="215" cy="115" r="72" fill="#6d5ae0" fill-opacity="0.10" stroke="#1a1a1f" stroke-width="1.7"/>
  <circle cx="180" cy="175" r="72" fill="#6d5ae0" fill-opacity="0.10" stroke="#1a1a1f" stroke-width="1.7"/>
  <text x="78.0" y="58.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1a1a1f">X</text>
  <text x="282.0" y="58.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1a1a1f">Y</text>
  <text x="262.0" y="250.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1a1a1f">Z</text>
  <text x="115.0" y="100.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1f">S, E</text>
  <text x="245.0" y="100.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1f">R</text>
  <text x="180.0" y="218.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1f">L</text>
  <text x="180.0" y="82.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1f">P, N</text>
  <text x="140.0" y="165.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1f">D</text>
  <text x="220.0" y="165.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1f">O, U</text>
</svg>
