<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 265" width="380" height="265" role="img"
     aria-label="Venn diagram in a universal set of 100 students: circle H for the 80 Hausa speakers and circle I for the 20 Igbo speakers overlap in 9; the number outside both circles is asked">
  <rect x="20" y="20" width="340" height="225" fill="none" stroke="#1a1a1f" stroke-width="1.5"/>
  <text x="30" y="238" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1f">U = 100</text>
  <circle cx="145" cy="130" r="95" fill="#6d5ae0" fill-opacity="0.10" stroke="#1a1a1f" stroke-width="1.7"/>
  <circle cx="262" cy="130" r="55" fill="#6d5ae0" fill-opacity="0.10" stroke="#1a1a1f" stroke-width="1.7"/>
  <text x="75" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">H</text>
  <text x="300" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f">I</text>
  <text x="115" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1f">Hausa</text>
  <text x="115" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1a1f">80</text>
  <text x="283" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1f">Igbo</text>
  <text x="283" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1a1f">20</text>
  <text x="223" y="136" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1a1a1f">9</text>
  <text x="310" y="226" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1a1a1f">neither</text>
  <text x="345" y="226" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">?</text>
</svg>
