<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260" role="img"
     aria-label="A 45 degree sector of a circle of radius r is rolled into a cone; its arc, in red, becomes the base circle of the cone, and the slant height is r; the base radius R is asked">
