<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" width="360" height="250" role="img"
     aria-label="A cylindrical jug 10 cm across and 18 cm deep bought for 50 naira, and a cylindrical tin 6 cm across and 10 cm deep sold for 15 naira; the number of tins the jug fills is asked">
  <path d="M50 45 V207 A45 9 0 0 0 140 207 V45" fill="#6d5ae0" fill-opacity="0.12" stroke="#1a1a1f" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M50 207 A45 9 0 0 1 140 207" fill="none" stroke="#1a1a1f" stroke-width="1.2" stroke-dasharray="4 3"/>
  <ellipse cx="95" cy="45" rx="45" ry="9" fill="#6d5ae0" fill-opacity="0.18" stroke="#1a1a1f" stroke-width="1.8"/>
  <path d="M50 45 L140 45" fill="none" stroke="#3f2fa8" stroke-width="1.5"/>
  <text x="95" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1f">10 cm</text>
  <text x="152" y="130" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1f">18 cm</text>
  <path d="M146 45 V207" stroke="#1a1a1f" stroke-width="1.1"/>
  <text x="95" y="241" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1f">jug: ₦50</text>
  <path d="M238 117 V207 A27 9 0 0 0 292 207 V117" fill="#6d5ae0" fill-opacity="0.12" stroke="#1a1a1f" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M238 207 A27 9 0 0 1 292 207" fill="none" stroke="#1a1a1f" stroke-width="1.2" stroke-dasharray="4 3"/>
  <ellipse cx="265" cy="117" rx="27" ry="9" fill="#6d5ae0" fill-opacity="0.18" stroke="#1a1a1f" stroke-width="1.8"/>
  <path d="M238 117 L292 117" fill="none" stroke="#3f2fa8" stroke-width="1.5"/>
  <text x="265" y="103" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1f">6 cm</text>
  <text x="306" y="166" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1f">10 cm</text>
  <path d="M300 117 V207" stroke="#1a1a1f" stroke-width="1.1"/>
  <text x="265" y="241" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1f">tin: ₦15 each</text>
  <text x="265" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">how many tins?</text>
</svg>
