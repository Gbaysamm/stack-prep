<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 270" width="340" height="270" role="img"
     aria-label="Venn diagram of U = {1,...,6} with circles P, Q and R: 4 in all three, 3 in P and R, 2 in Q and R, 5 only in P, 6 only in Q, 1 only in R">
  <rect x="10" y="10" width="320" height="250" fill="none" stroke="#1a1a1f" stroke-width="1.4"/>
  <text x="26" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1a1f" text-anchor="middle">U</text>
  <circle cx="135" cy="105" r="68" fill="#6d5ae0" fill-opacity="0.07" stroke="#1a1a1f" stroke-width="1.6"/>
  <circle cx="205" cy="105" r="68" fill="#6d5ae0" fill-opacity="0.07" stroke="#1a1a1f" stroke-width="1.6"/>
  <circle cx="170" cy="165" r="68" fill="#6d5ae0" fill-opacity="0.07" stroke="#1a1a1f" stroke-width="1.6"/>
  <text x="62" y="52" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">P</text>
  <text x="280" y="52" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">Q</text>
  <text x="170" y="252" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">R</text>
  <text x="100" y="90" font-family="system-ui, sans-serif" font-size="13" fill="#3f2fa8" text-anchor="middle">5</text>
  <text x="240" y="90" font-family="system-ui, sans-serif" font-size="13" fill="#3f2fa8" text-anchor="middle">6</text>
  <text x="170" y="205" font-family="system-ui, sans-serif" font-size="13" fill="#3f2fa8" text-anchor="middle">1</text>
  <text x="128" y="153" font-family="system-ui, sans-serif" font-size="13" fill="#3f2fa8" text-anchor="middle">3</text>
  <text x="212" y="153" font-family="system-ui, sans-serif" font-size="13" fill="#3f2fa8" text-anchor="middle">2</text>
  <text x="170" y="128" font-family="system-ui, sans-serif" font-size="13" fill="#3f2fa8" text-anchor="middle">4</text>
</svg>
