<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 290" width="340" height="290" role="img"
     aria-label="Venn diagram of three overlapping circles Y for yam (10), P for plantain (14) and M for maize (12) inside U; 2 sell yam and plantain only, 3 sell all three, and the total number of women is asked">
  <rect x="10" y="10" width="320" height="270" fill="none" stroke="#1a1a1f" stroke-width="1.4"/>
  <text x="24" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1a1f" text-anchor="start">U</text>
  <circle cx="122" cy="110" r="72" fill="#6d5ae0" fill-opacity="0.07" stroke="#1a1a1f" stroke-width="1.6"/>
  <circle cx="218" cy="110" r="72" fill="#6d5ae0" fill-opacity="0.07" stroke="#1a1a1f" stroke-width="1.6"/>
  <circle cx="170" cy="185" r="72" fill="#6d5ae0" fill-opacity="0.07" stroke="#1a1a1f" stroke-width="1.6"/>
  <text x="56" y="50" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">Y</text>
  <text x="286" y="50" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">P</text>
  <text x="264" y="272" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">M</text>
  <text x="72" y="66" font-family="system-ui, sans-serif" font-size="11" fill="#3f2fa8" text-anchor="start">yam 10</text>
  <text x="268" y="66" font-family="system-ui, sans-serif" font-size="11" fill="#3f2fa8" text-anchor="end">plantain 14</text>
  <text x="250" y="272" font-family="system-ui, sans-serif" font-size="11" fill="#3f2fa8" text-anchor="end">maize 12</text>
  <text x="170" y="94" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">2</text>
  <text x="170" y="80" font-family="system-ui, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle">only</text>
  <text x="170" y="140" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">3</text>
  <text x="322" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="end">total = ?</text>
</svg>
