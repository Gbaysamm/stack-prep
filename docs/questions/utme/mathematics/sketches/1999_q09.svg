<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 290" width="340" height="290" role="img"
     aria-label="Three overlapping circles for the market women: yam with 10 women, plantain with 14 and maize with 12; the seven regions are filled in as the lesson goes, and the total number of women is asked for">
  <rect x="10" y="10" width="320" height="270" fill="none" stroke="#1a1a1f" stroke-width="1.4"/>
  <circle cx="122" cy="110" r="72" fill="#6d5ae0" fill-opacity="0.07" stroke="#1a1a1f" stroke-width="1.6"/>
  <circle cx="218" cy="110" r="72" fill="#6d5ae0" fill-opacity="0.07" stroke="#1a1a1f" stroke-width="1.6"/>
  <circle cx="170" cy="185" r="72" fill="#6d5ae0" fill-opacity="0.07" stroke="#1a1a1f" stroke-width="1.6"/>
  <text x="56" y="36" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1f" text-anchor="middle">yam 10</text>
  <text x="284" y="36" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1f" text-anchor="middle">plantain 14</text>
  <text x="272" y="262" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1f" text-anchor="middle">maize 12</text>
  <text x="56" y="268" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#3f2fa8" text-anchor="middle">total = ?</text>
</svg>
