  <path d="M183.2 130.2 L181.9 129.3 L180.5 128.6 L179.1 127.9 L177.6 127.3 L176.2 126.7 L174.6 126.2 L173.1 125.9 L171.6 125.6 L170.0 125.3 L168.4 125.2 L166.9 125.1 L165.3 125.2 L163.7 125.3 L162.1 125.5 L160.6 125.7 L159.1 126.1 L157.5 126.5 L156.0 127.0 L154.6 127.6 L153.2 128.3" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
