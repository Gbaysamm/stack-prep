<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 220" width="330" height="220" role="img"
     aria-label="Venn diagram of 94 members: circle M (modern, 60) and circle T (traditional, 50) overlap in 3n, n like neither, and the two only-one-type regions are asked">
  <rect x="10" y="10" width="310" height="200" fill="none" stroke="#1a1a1f" stroke-width="1.4"/>
  <text x="24" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1a1f" text-anchor="start">U</text>
  <text x="310" y="30" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1f" text-anchor="end">94</text>
  <circle cx="130" cy="112" r="72" fill="#6d5ae0" fill-opacity="0.07" stroke="#1a1a1f" stroke-width="1.6"/>
  <circle cx="205" cy="112" r="72" fill="#6d5ae0" fill-opacity="0.07" stroke="#1a1a1f" stroke-width="1.6"/>
  <text x="60" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">M</text>
  <text x="275" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">T</text>
  <text x="72" y="30" font-family="system-ui, sans-serif" font-size="11" fill="#3f2fa8" text-anchor="start">modern 60</text>
  <text x="263" y="30" font-family="system-ui, sans-serif" font-size="11" fill="#3f2fa8" text-anchor="end">traditional 50</text>
  <text x="167" y="117" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">3n</text>
  <text x="34" y="196" font-family="system-ui, sans-serif" font-size="14" font-weight="700" font-style="italic" fill="#b91c1c" text-anchor="start">n</text>
  <text x="100" y="117" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">?</text>
  <text x="236" y="117" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">?</text>
</svg>
