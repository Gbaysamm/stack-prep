<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200" role="img"
     aria-label="A hemisphere with centre O and radius r = 6 m on its flat face, whose volume grows at 8 pi cubic metres per second; the rate dr/dt is asked">
  <path d="M50 160 A100 100 0 0 1 250 160 A100 26 0 0 1 50 160 Z" fill="#6d5ae0" fill-opacity="0.1" stroke="none"/>
  <path d="M50 160 A100 100 0 0 1 250 160" fill="none" stroke="#1a1a1f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M50 160 A100 26 0 0 0 250 160" fill="none" stroke="#1a1a1f" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M50 160 A100 26 0 0 1 250 160" fill="none" stroke="#1a1a1f" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 3"/>
  <circle cx="150" cy="160" r="3.2" fill="#1a1a1f"/>
  <text x="144" y="178" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1a1f" text-anchor="end">O</text>
  <path d="M150 160 L250 160" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="200.0" y="152" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">r = 6 m</text>
  <text x="150" y="100" font-family="system-ui, sans-serif" font-size="12" fill="#3f2fa8" text-anchor="middle">dV/dt = 8π m³/s</text>
  <text x="150" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">dr/dt = ?</text>
</svg>
