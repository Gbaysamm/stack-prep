  <text x="24" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1a1f" text-anchor="middle">S</text>
  <circle cx="125" cy="100" r="66" fill="#6d5ae0" fill-opacity="0.07" stroke="#1a1a1f" stroke-width="1.6"/>
  <circle cx="195" cy="100" r="66" fill="#6d5ae0" fill-opacity="0.07" stroke="#1a1a1f" stroke-width="1.6"/>
