<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" width="340" height="230" role="img"
     aria-label="Venn diagram of U = {1,...,20}: circle E1 holds the multiples of 3, circle E2 the multiples of 4, 12 in both, and the ten other numbers outside both">
  <rect x="10" y="10" width="320" height="210" fill="none" stroke="#1a1a1f" stroke-width="1.4"/>
  <text x="26" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1a1f" text-anchor="middle">U</text>
  <text x="314" y="32" font-family="system-ui, sans-serif" font-size="11" fill="#8a8a96" text-anchor="end">20 numbers</text>
  <circle cx="125" cy="112" r="72" fill="#6d5ae0" fill-opacity="0.07" stroke="#1a1a1f" stroke-width="1.6"/>
  <circle cx="215" cy="112" r="72" fill="#6d5ae0" fill-opacity="0.07" stroke="#1a1a1f" stroke-width="1.6"/>
  <text x="58" y="52" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">E₁</text>
  <text x="284" y="52" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">E₂</text>
  <text x="98" y="106" font-family="system-ui, sans-serif" font-size="12" fill="#3f2fa8" text-anchor="middle">3, 6, 9</text>
  <text x="98" y="124" font-family="system-ui, sans-serif" font-size="12" fill="#3f2fa8" text-anchor="middle">15, 18</text>
  <text x="170" y="116" font-family="system-ui, sans-serif" font-size="12" fill="#3f2fa8" text-anchor="middle">12</text>
  <text x="242" y="106" font-family="system-ui, sans-serif" font-size="12" fill="#3f2fa8" text-anchor="middle">4, 8</text>
  <text x="242" y="124" font-family="system-ui, sans-serif" font-size="12" fill="#3f2fa8" text-anchor="middle">16, 20</text>
  <text x="170" y="208" font-family="system-ui, sans-serif" font-size="11" fill="#8a8a96" text-anchor="middle">1, 2, 5, 7, 10, 11, 13, 14, 17, 19</text>
</svg>
