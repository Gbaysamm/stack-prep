<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 200" width="330" height="200" role="img"
     aria-label="A rectangle with sides x and y, fixed perimeter p and area xy; the sides giving the greatest area are asked">
  <rect x="70" y="50" width="190" height="120" fill="#6d5ae0" fill-opacity="0.12" stroke="#1a1a1f" stroke-width="1.8"/>
  <text x="165" y="190" font-family="system-ui, sans-serif" font-size="14" font-weight="700" font-style="italic" fill="#1a1a1f" text-anchor="middle">x</text>
  <text x="270" y="115" font-family="system-ui, sans-serif" font-size="14" font-weight="700" font-style="italic" fill="#1a1a1f" text-anchor="start">y</text>
  <text x="165" y="106" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">area A = xy</text>
  <text x="165" y="126" font-family="system-ui, sans-serif" font-size="12" fill="#3f2fa8" text-anchor="middle">perimeter 2x + 2y = p</text>
</svg>
