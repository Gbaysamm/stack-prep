  <circle cx="130.0" cy="118.0" r="72.0" fill="none" stroke="#1a1a1f" stroke-width="1.7"/>
  <circle cx="200.0" cy="118.0" r="72.0" fill="none" stroke="#1a1a1f" stroke-width="1.7"/>
  <text x="62.0" y="44.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">B</text>
  <text x="84.0" y="44.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1f" text-anchor="middle">125</text>
  <text x="262.0" y="44.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">M</text>
