<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 220" width="330" height="220" role="img"
     aria-label="Venn diagram of 220 students: circle B for Biology, 125 students, overlapping circle M for Mathematics, 110 students; the Biology-only region is asked for">
