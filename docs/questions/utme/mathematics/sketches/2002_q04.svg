  <text x="308.0" y="32.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1f" text-anchor="end">220</text>
  <text x="95.0" y="123.0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#3f2fa8" text-anchor="middle">?</text>
