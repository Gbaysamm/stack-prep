<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" width="340" height="230" role="img"
     aria-label="The class of 40 as a box holding two overlapping circles, Maths with 32 students and Physics with 24; 4 students take neither and stand outside both circles; the overlap, the students who take both, is asked for">
  <rect x="12" y="12" width="316" height="206" fill="none" stroke="#1a1a1f" stroke-width="1.6"/>
  <path d="M170 42.7 A80 80 0 0 1 170 181.3 A80 80 0 0 1 170 42.7 Z" fill="#6d5ae0" fill-opacity="0.15"/>
  <g fill="none" stroke="#1a1a1f" stroke-width="1.7"><circle cx="130" cy="112" r="80"/><circle cx="210" cy="112" r="80"/></g>
  <text x="54" y="34" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1f" text-anchor="middle">Maths 32</text>
  <text x="286" y="34" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1f" text-anchor="middle">Physics 24</text>
  <text x="90" y="116" font-family="system-ui, sans-serif" font-size="11" fill="#555" text-anchor="middle">Maths only</text>
  <text x="170" y="104" font-family="system-ui, sans-serif" font-size="11" fill="#555" text-anchor="middle">both</text>
  <text x="170" y="126" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#3f2fa8" text-anchor="middle">?</text>
  <text x="250" y="116" font-family="system-ui, sans-serif" font-size="11" fill="#555" text-anchor="middle">Physics only</text>
  <text x="318" y="208" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1f" text-anchor="end">neither 4</text>
  <text x="22" y="208" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1f" text-anchor="start">class of 40</text>
</svg>
