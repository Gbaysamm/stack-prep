  <text x="211.0" y="41.5" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1f" text-anchor="middle">4/7</text>
  <text x="273.0" y="34.0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1a1f" text-anchor="start">BB</text>
