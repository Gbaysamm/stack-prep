<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 220" width="330" height="220" role="img"
     aria-label="Venn diagram for a class of 40 with nobody outside: circle P for Physics, 3b students, overlaps circle C for Chemistry, 6b students, in b students; Physics only is unknown">
  <rect x="10" y="10" width="310" height="200" fill="none" stroke="#1a1a1f" stroke-width="1.6"/>
  <circle cx="132.0" cy="112.0" r="72.0" fill="none" stroke="#1a1a1f" stroke-width="1.7"/>
  <circle cx="202.0" cy="112.0" r="72.0" fill="none" stroke="#1a1a1f" stroke-width="1.7"/>
  <text x="64.0" y="38.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">P</text>
  <text x="88.0" y="38.0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1a1f" font-style="italic" text-anchor="middle">3b</text>
  <text x="266.0" y="38.0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a1a1f" text-anchor="middle">C</text>
  <text x="242.0" y="38.0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1a1f" font-style="italic" text-anchor="middle">6b</text>
  <text x="310.0" y="32.0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a1a1f" text-anchor="end">40</text>
  <text x="96.0" y="117.0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#3f2fa8" text-anchor="middle">?</text>
  <text x="167.0" y="117.0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1a1f" font-style="italic" text-anchor="middle">b</text>
</svg>
