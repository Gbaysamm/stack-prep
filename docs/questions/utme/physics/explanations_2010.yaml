format_version: 1
exam_year: 2010
subject: PHY
explanations:
  2:
    answer: D
    steps:
      - 'Data: speed of the slower car = 100 km h⁻¹, speed of the faster car = 130 km h⁻¹, both in the same direction. Velocity of the faster car relative to the slower car = ?'
      - 'Rule: the velocity of A relative to B is the velocity of A minus the velocity of B, $v_{AB} = v_A - v_B$. For bodies moving the same way, you subtract.'
      - 'Both speeds are already in the same unit, so no conversion is needed.'
      - '$v_{AB} = 130 - 100 = 30\ \text{km h}^{-1}$, in the direction of motion.'
      - 'Check: sitting in a danfo doing 100 km h⁻¹, a car doing 130 km h⁻¹ seems to creep past you slowly, not rush past. 30 km h⁻¹ makes sense.'
      - 'The trap is B, 230 km h⁻¹. You add the speeds only when the cars move towards each other.'
    hint: 'Same direction: do you add the speeds or subtract them?'
    why:
      A: 'That is the speed of the faster car measured by someone standing on the road.'
      B: 'Adding the speeds is for cars moving in opposite directions.'
      C: 'This does not come from either adding or subtracting the speeds.'

  3:
    answer: D
    steps:
      - 'Rule: on a velocity-time graph, the slope gives the acceleration. A rising line means acceleration, a level line means constant velocity (zero acceleration), and a falling line means deceleration.'
      - 'E to F: the line rises, so the car accelerates.'
      - 'F to G: the line is level, so the velocity stays the same and the acceleration is zero.'
      - 'G to H: the line falls to zero velocity at H, so the car decelerates to rest.'
      - 'So the true statement is that the car has no acceleration between F and G.'
      - 'The trap is B. Being at a high speed is not the same as speeding up. A car cruising steadily on the Lagos to Ibadan expressway is fast but not accelerating.'
    hint: 'What is the slope of the line from F to G?'
    why:
      A: 'From F to G the velocity is constant; the car only decelerates from G to H.'
      B: 'The line from F to G is level, so the velocity is not changing.'
      C: 'The line from E to F slopes upwards, so the speed is increasing there.'

  4:
    answer: A
    steps:
      - 'Fact: without air resistance, every body falls with the same acceleration, the acceleration due to gravity g ≈ 9.8 m s⁻², whatever its mass.'
      - 'Reason: the heavier stone feels a bigger pull, but it also has more mass to accelerate. Since a = F/m = mg/m = g, the mass cancels.'
      - 'Both start from rest at the same height with the same acceleration, so they take the same time to fall.'
      - 'In ordinary air the feather drifts down slowly only because air resistance is large compared with its small weight. In a vacuum tube, a coin and a feather land together.'
      - 'The trap is B. It is what we see every day, but only because of the air.'
    hint: 'If air resistance is ignored, does the acceleration of a falling body depend on its mass?'
    why:
      B: 'The stone lands first only when air resistance slows the feather.'
      C: 'The feather has no larger acceleration than the stone.'
      D: 'With no air there is no wind or air resistance to blow the feather away.'

  5:
    answer: D
    steps:
      - 'Data: u = 25 m s⁻¹, v = 45 m s⁻¹, t = 10 s, a = ?'
      - 'Rule: acceleration is the rate of change of velocity, $a = \dfrac{v - u}{t}$.'
      - 'All the quantities are already in SI units.'
      - '$a = \dfrac{45 - 25}{10} = \dfrac{20}{10} = 2\ \text{m s}^{-2}$.'
      - 'Check: the car gains 2 m s⁻¹ every second, and in 10 s that adds 20 m s⁻¹ to the 25 m s⁻¹ it started with. That gives 45 m s⁻¹.'
      - 'The trap is C, 20 m s⁻². That is the change in velocity; you still have to divide by the time.'
    hint: 'Find the change in velocity first, then share it over the 10 seconds.'
    why:
      A: 'This is too big. The velocity rises by only 20 m s⁻¹ in 10 s, which is 2 m s⁻¹ each second; 5 m s⁻² would add 50 m s⁻¹ in that time.'
      B: 'This is just the initial velocity, with the wrong unit.'
      C: 'This is the change in velocity, 20 m s⁻¹, not yet divided by the time.'

  6:
    answer: C
    steps:
      - 'Fact: mass is the quantity of matter in a body, so it stays the same everywhere. Weight is the pull of gravity on the body, W = mg.'
      - 'The value of g changes slightly from place to place on the earth. It is a little bigger at the poles than at the equator, and smaller on top of a high mountain.'
      - 'Since W = mg, the weight changes as g changes, while the mass m stays fixed.'
      - 'A bag of rice has the same mass in Lagos and on the Jos Plateau, but a spring balance would read a tiny bit less on the high plateau.'
      - 'The trap is A. The mass never changes with location; only the weight does.'
    hint: 'Which of the two depends on the value of g?'
    why:
      A: 'Mass is the amount of matter and does not change with location.'
      B: 'It is the other way round; weight varies and mass stays the same.'
      D: 'Weight depends on g, which varies over the earth''s surface.'

  7:
    answer: C
    steps:
      - 'Rule: a body is in stable equilibrium if, when it is slightly displaced, it returns to its first position. Its centre of gravity rises when it is displaced.'
      - 'A ball at the bottom of a trough (iii, vi and ix) rolls back to the bottom if you push it a little. That is stable equilibrium.'
      - 'A ball on top of a crest (i, iv and vii) rolls away if you push it a little. That is unstable equilibrium.'
      - 'A ball on a slope (ii, v and viii) is not in equilibrium at all. It will roll down.'
      - 'So the stable positions are iii, vi and ix, like a marble resting at the bottom of a bowl.'
      - 'The trap is B. Balls i and vii are balanced, but on a crest the smallest push sends them rolling.'
    hint: 'Where would a ball come back to after a small push?'
    why:
      A: 'Balls ii, v and viii are on slopes, so they are not in equilibrium at all.'
      B: 'Balls i and vii are on crests (unstable), and ii is on a slope.'
      D: 'Ball iv is on a crest and viii is on a slope; only iii is stable.'

  8:
    answer: B
    steps:
      - 'Data: weight W = mg = 0.1 N, length of string l = 50 cm, final angle with the vertical θ = 60°, work done = ?'
      - 'Rule: the force increases slowly from zero, so the bob gains no kinetic energy. All the work done goes into potential energy, work done = mgh, where h is the height the bob rises.'
      - 'Convert to SI: l = 50 cm = 0.50 m.'
      - 'Geometry: when the string makes θ with the vertical, the bob is l cos θ below the support, so it has risen $h = l - l\cos\theta = l(1 - \cos\theta)$.'
      - '$h = 0.50(1 - \cos 60^\circ) = 0.50(1 - 0.5) = 0.25\ \text{m}$.'
      - 'Work done $= mgh = 0.1 \times 0.25 = 0.025\ \text{J}$.'
      - 'The trap is C, 0.050 J. That multiplies the weight by the whole length of the string; the bob rises only a quarter of a metre, not half.'
    hint: 'How high has the bob risen when the string is at 60° to the vertical?'
    why:
      A: 'Ten times too big; it treats the weight as 1 N.'
      C: 'Uses the whole string length, 0.5 m, as the height risen.'
      D: 'Uses 50 cm as 5 m, or the weight as 1 N with the full length.'

  9:
    answer: A
    steps:
      - 'Fact: friction is the force that opposes one surface sliding over another. A rougher surface gives more friction.'
      - 'A conveyor belt carries goods by friction between the belt and the load. If the belt were smooth, a bag on a sloping belt would slide back down.'
      - 'So the belt is made rough to increase friction and stop the load from slipping.'
      - 'The same idea is used in the ridged soles of canvas shoes and the treads of car tyres.'
      - 'The trap is C. The amount of load a belt can carry depends on its strength and motor, not on how rough it is.'
    hint: 'Which force does a rough surface increase?'
    why:
      B: 'Roughness does not change the strength of the belt material.'
      C: 'The load a belt can carry depends on its strength and motor, not its roughness.'
      D: 'Roughness is there to grip the load, not to protect the belt.'

  10:
    answer: C
    steps:
      - 'Data: VR = 6, effort E = 400 N, load L = 800 N, efficiency = ?'
      - 'Rule: mechanical advantage is load divided by effort, MA = L/E. Efficiency is MA divided by VR, as a percentage, efficiency $= \dfrac{MA}{VR} \times 100\%$.'
      - 'The forces are already in newtons. The 1 m height is not needed, because it cancels in the ratio.'
      - '$MA = \dfrac{800}{400} = 2$.'
      - 'Efficiency $= \dfrac{2}{6} \times 100\% = 33.3\%$.'
      - 'Check: real machines lose energy to friction, so the efficiency must be less than 100%. 33.3% fits.'
      - 'The trap is A, 50%. That is effort divided by load, the wrong way round.'
    hint: 'Find the mechanical advantage first, then compare it with the velocity ratio.'
    why:
      A: 'This is effort ÷ load, the upside-down ratio, as a percentage.'
      B: 'This does not come from MA ÷ VR.'
      D: 'This does not come from MA ÷ VR.'

  11:
    answer: D
    steps:
      - 'Data: original length = 30 cm, new length = 30.5 cm, force F = 300 N, strain energy = ?'
      - 'Rule: the energy stored in a stretched wire is the work done in stretching it, $E = \dfrac{1}{2}Fe$, where e is the extension.'
      - 'Extension e = 30.5 − 30 = 0.5 cm. Convert to SI: e = 0.5 cm = 0.005 m.'
      - '$E = \dfrac{1}{2} \times 300 \times 0.005 = 0.75\ \text{J}$.'
      - 'The ½ is there because the force grows from zero to 300 N, so the average force is only half of 300 N.'
      - 'The trap is C, 75.00 J. That leaves the extension in centimetres. Always change cm to m before you substitute.'
    hint: 'Change the extension into metres before you use energy = ½ × force × extension.'
    why:
      A: 'This changes 0.5 cm to 0.05 m, dividing by 10 instead of by 100.'
      B: 'This uses the extension as 5 m, a wrong unit conversion.'
      C: 'This keeps the extension in centimetres instead of metres.'

  12:
    answer: D
    steps:
      - 'Data: pressure from the pump piston P = 100 Pa, area of the second piston A = 3 m², force F = ?'
      - 'Rule: Pascal''s principle says pressure applied to an enclosed liquid is passed on equally to every part of it. So the second piston feels the same pressure, and force = pressure × area, F = PA.'
      - 'The units are already SI (1 Pa = 1 N m⁻²).'
      - '$F = 100 \times 3 = 300\ \text{N}$.'
      - 'Check: the larger piston gets the larger force. That is how a hydraulic jack at a vulcaniser''s shop lifts a whole car.'
      - 'The trap is B, 100 N. That treats the pressure as if it were the force.'
    hint: 'The pressure is the same on both pistons. What does pressure times area give?'
    why:
      A: 'Each square metre of the piston gets 100 N, and there are 3 m², so the force cannot be only 200 N.'
      B: 'This takes the pressure as the force and ignores the area.'
      C: 'Each square metre of the piston gets 100 N, and there are 3 m², so the force cannot be only 150 N.'

  13:
    answer: D
    steps:
      - 'Fact: the relative density of a powder or of small grains, such as sand, is found with a density bottle and a beam balance.'
      - 'Reason: you cannot hang a powder on a thread or drop it into a eureka can. The density bottle holds an exact, fixed volume, so you weigh the empty bottle, the bottle with some powder, the bottle with powder topped up with water, and the bottle full of water.'
      - 'From these masses you find the mass of the powder and the mass of an equal volume of water. Relative density = mass of powder ÷ mass of an equal volume of water.'
      - 'The trap is A. A eureka can works for one solid lump that sinks, not for a powder.'
    hint: 'Which piece of apparatus holds a fixed, exact volume and can take a powder?'
    why:
      A: 'A eureka can is used for a single solid that sinks, not for a powder.'
      B: 'A burette delivers measured volumes of liquid; it cannot hold a powder for weighing.'
      C: 'A pipette delivers a fixed volume of liquid only.'

  14:
    answer: B
    steps:
      - 'Fact: a hydrometer measures the relative density of a liquid.'
      - 'Reason: it is a weighted glass float with a narrow graduated stem. By the law of flotation it sinks until it displaces its own weight of liquid, so it sinks deeper in a less dense liquid and the reading is taken at the surface.'
      - 'Everyday use: a battery charger checks the acid in a car battery with a hydrometer, and brewers use one to check their liquor.'
      - 'The trap is C. Humidity is about water vapour in the air, which needs a hygrometer, not a hydrometer.'
    hint: 'A hydrometer floats. In what kind of substance can it float?'
    why:
      A: 'A hydrometer floats in a liquid; it cannot be used on a solid.'
      C: 'Relative humidity applies to air and is measured with a hygrometer.'
      D: 'Vapour pressure is measured with a manometer or barometer arrangement, not a hydrometer.'

  15:
    answer: A
    steps:
      - 'Fact: alcohol freezes at about −115 °C, while mercury freezes at about −39 °C.'
      - 'Reason: a thermometer liquid must stay liquid over the range you measure. Alcohol stays liquid far below the freezing point of mercury, so it can measure very low temperatures, as in polar regions or in a freezer.'
      - 'Alcohol also expands more than mercury for each degree rise, which is a second advantage.'
      - 'Its low boiling point (78 °C) is actually a disadvantage, because it cannot measure high temperatures such as boiling water.'
      - 'The trap is D. Low density does not help a thermometer to measure temperature at all.'
    hint: 'Think of measuring a very cold temperature. Which liquid stays liquid?'
    why:
      B: 'A low boiling point is a drawback; it stops alcohol measuring high temperatures.'
      C: 'A high specific heat capacity is a drawback; the liquid takes longer to reach the temperature being measured.'
      D: 'Density has nothing to do with how well a liquid measures temperature.'

  16:
    answer: C
    steps:
      - 'Data: $\alpha_P : \alpha_Q = 2 : 3$, $l_P : l_Q = 3 : 4$, the same temperature rise Δθ for both. Ratio of increases in length = ?'
      - 'Rule: increase in length = linear expansivity × original length × temperature rise, $\Delta l = \alpha l \Delta\theta$.'
      - 'Since Δθ is the same for both, it cancels in the ratio: $\dfrac{\Delta l_P}{\Delta l_Q} = \dfrac{\alpha_P l_P}{\alpha_Q l_Q}$.'
      - '$\dfrac{\Delta l_P}{\Delta l_Q} = \dfrac{2 \times 3}{3 \times 4} = \dfrac{6}{12} = \dfrac{1}{2}$, so the ratio is 1 : 2.'
      - 'The trap is A, 5 : 7. That adds the ratios (2 + 3 and 3 + 4) instead of multiplying them.'
    hint: 'The increase in length is a product of α and l. Multiply the ratios.'
    why:
      A: 'This adds the terms of the two ratios instead of multiplying them.'
      B: 'This is the right ratio turned upside down, Q to P.'
      D: 'This adds the terms of the ratios and also turns them upside down.'

  17:
    answer: A
    steps:
      - 'Data: final density = 0.4 g cm⁻³, final volume = 20 cm³, initial density = 0.8 g cm⁻³, initial volume = ?'
      - 'Rule: density = mass ÷ volume, so mass = density × volume. No oil is spilt, so the mass stays the same.'
      - 'Mass of oil = 0.4 × 20 = 8 g.'
      - 'Initial volume = mass ÷ initial density = 8 ÷ 0.8 = 10 cm³.'
      - 'Check: the same mass at twice the density takes up half the volume. Half of 20 cm³ is 10 cm³, and heating made the oil expand.'
      - 'The trap is C, 8. That is the mass of the oil in grams, not its volume.'
    hint: 'The mass does not change. Find it first from the final density and volume.'
    why:
      B: 'Twice the density means half the volume, 10 cm³. A quarter of the volume would need the density to rise four times, to 1.6 g cm⁻³.'
      C: 'This is the mass of the oil, 8 g, not its volume.'
      D: 'This does not follow from mass = density × volume.'

  18:
    answer: C
    steps:
      - 'Fact: all hot bodies radiate heat as infrared radiation, an electromagnetic wave just beyond the red end of the visible spectrum.'
      - 'Reason: infrared needs no medium, so it crosses empty space. That is how heat from the sun reaches us, and how you feel the warmth of a charcoal stove from a distance.'
      - 'Only very hot bodies, like the filament of a bulb, also give out visible light. Every warm body, even your skin, gives out infrared.'
      - 'The trap is A. Light is given out only by very hot bodies; infrared is given out by all of them.'
    hint: 'Which part of the electromagnetic spectrum do we feel as warmth?'
    why:
      A: 'Only very hot bodies give out visible light; the heat itself is infrared.'
      B: 'Solar energy is energy from the sun only, not from every hot object.'
      D: 'X-rays come from fast electrons hitting a metal target, not from ordinary hot objects.'

  19:
    answer: B
    steps:
      - 'Fact: water expands when it freezes, so ice takes up more volume than the same mass of water. Ice has a density of about 0.92 g cm⁻³, water about 1.00 g cm⁻³.'
      - 'When the ice melts, its mass stays the same but it becomes denser water, so it takes up less volume (about 92% of the volume of the ice).'
      - 'So the water level ends up below the brim: the level drops.'
      - 'This is the anomalous expansion of water. It is also why a bottle of water left in the freezer cracks.'
      - 'The trap is A. Overflowing would need the water to take up more room than the ice, which is the other way round.'
    hint: 'Which takes up more space, a mass of ice or the same mass of water?'
    why:
      A: 'Melting reduces the volume, so nothing overflows.'
      C: 'The volume changes on melting because ice is less dense than water.'
      D: 'Water takes up less room than the ice it came from, so the level cannot rise.'

  20:
    answer: A
    steps:
      - 'Fact: dew is the small drops of water that form on cool surfaces such as grass in the early morning.'
      - 'Reason: at night the ground and grass lose heat by radiation and cool down. Air touching them is cooled below its dew point, so its water vapour condenses on the grass.'
      - 'Mist and fog are tiny droplets floating in the air, not drops on surfaces. Hail is lumps of ice falling from storm clouds.'
      - 'The trap is B. Mist is condensation in the air, but it hangs in the air; it does not sit on the grass.'
    hint: 'Which one forms on a surface rather than hanging in the air?'
    why:
      B: 'Mist is tiny droplets suspended in the air near the ground.'
      C: 'Fog is thick mist, droplets hanging in the air, not on the grass.'
      D: 'Hail is ice that falls from thunderclouds.'

  21:
    answer: D
    steps:
      - 'Fact: a vapour is saturated when it is in dynamic equilibrium with its own liquid.'
      - 'Reason: in a closed space, molecules keep escaping from the liquid and others keep returning. When the rate of leaving equals the rate of returning, the number of vapour molecules stops changing. The space then holds the most vapour it can at that temperature.'
      - '"Dynamic" means the movement has not stopped; only the two rates have become equal.'
      - 'The trap is A. It says dynamic equilibrium, but then says more return than leave. At equilibrium the two rates are equal.'
    hint: 'At equilibrium, how do the rate of leaving and the rate of returning compare?'
    why:
      A: 'At equilibrium the numbers leaving and returning are equal, not unequal.'
      B: 'Vapour pressure equal to atmospheric pressure is the condition for boiling, not saturation.'
      C: 'Saturation is described at a fixed temperature.'

  22:
    answer: C
    steps:
      - 'Data: n = 1 mol, V = 10⁻² m³, θ = 27 °C, R = 8.3 J mol⁻¹ K⁻¹, P = ?'
      - 'Rule: the ideal gas equation, $PV = nRT$, so $P = \dfrac{nRT}{V}$, with T in kelvin.'
      - 'Convert to SI: T = 27 + 273 = 300 K.'
      - '$P = \dfrac{1 \times 8.3 \times 300}{10^{-2}} = \dfrac{2490}{0.01} = 249\,000\ \text{N m}^{-2}$.'
      - '$P = 2.49 \times 10^{5}\ \text{N m}^{-2}$, about 2.5 times atmospheric pressure, which is sensible for one mole squeezed into 10 litres.'
      - 'The trap is D, $2.49 \times 10^{4}$. That slips a power of ten when dividing by 10⁻².'
    hint: 'Change 27 °C into kelvin before you use PV = nRT.'
    why:
      A: 'This uses the temperature in Celsius, 27, instead of 300 K: $\dfrac{8.3 \times 27}{10^{-2}} = 2.24 \times 10^{4}$.'
      B: 'This uses the temperature in Celsius, 27, instead of 300 K, and also slips a power of ten.'
      D: 'This loses a power of ten when dividing by 10⁻² m³.'

  23:
    answer: A
    steps:
      - 'Fact: the rate at which a body radiates heat depends on its temperature, its surface area and the nature of its surface.'
      - 'Temperature: a hotter body radiates much faster. Surface area: a larger surface gives out more. Surface: a dull black surface is a good radiator, a shiny white one a poor radiator.'
      - 'Density, how tightly the mass is packed inside, does not appear in this list. Radiation happens from the surface.'
      - 'This is why the cooling fins on a generator are large and painted black.'
      - 'The trap is D. The nature of the surface matters a lot; that is why kettles are made shiny.'
    hint: 'Radiation leaves from the surface. Which option says nothing about the surface or the temperature?'
    why:
      B: 'Temperature has the biggest effect on the rate of radiation.'
      C: 'A larger surface area radiates more heat.'
      D: 'Dull black surfaces radiate better than shiny ones.'

  24:
    answer: B
    steps:
      - 'Data: v = 420 m s⁻¹, λ = 42 m, period T = ?'
      - 'Rule: the wave equation, $v = f\lambda$, and the period is $T = \dfrac{1}{f}$. Together, $T = \dfrac{\lambda}{v}$.'
      - 'All quantities are in SI units.'
      - '$f = \dfrac{420}{42} = 10\ \text{Hz}$, so $T = \dfrac{1}{10} = 0.1\ \text{s}$.'
      - 'Check: in one period the wave moves one wavelength, 42 m. At 420 m s⁻¹ that takes 0.1 s.'
      - 'The trap is to stop at the frequency, 10 Hz, and pick the nearest number. The question asks for the period.'
    hint: 'Find the frequency first. The period is one over the frequency.'
    why:
      A: 'This is ten times too long; it does not come from λ ÷ v.'
      C: 'This does not come from λ ÷ v.'
      D: 'This does not come from λ ÷ v.'

  25:
    answer: C
    steps:
      - 'Fact: sound is a mechanical wave. It needs a material medium (solid, liquid or gas) to travel through.'
      - 'Reason: sound travels by particles of the medium vibrating and passing the vibration on to their neighbours. As air is pumped out, fewer and fewer particles are left to carry the vibration, so the sound gets fainter.'
      - 'You can still see the bell hammer moving, because light needs no medium.'
      - 'This is why astronauts on the moon talk by radio: there is no air to carry their voices.'
      - 'The trap is A. The sound passed through the bottle well at the start; what changed is the amount of air inside.'
    hint: 'What is being taken away when the air is pumped out?'
    why:
      A: 'The bell was heard clearly through the bottle at first, so the glass is not the problem.'
      B: 'The experiment shows the opposite; sound fades as the vacuum is made.'
      D: 'Taking the air away removes the medium; it does not make the sound wavelength longer.'

  26:
    answer: B
    steps:
      - 'Fact: reverberation is the persistence of a sound after its source has stopped, caused by many reflections that reach the ear one after another.'
      - 'Reason: a lightning flash makes its thunder in a very short time, but the sound bounces off clouds, hills and buildings at many distances. The echoes arrive so close together that we hear one long rumble.'
      - 'This is the same thing that makes a voice boom on in a large empty hall.'
      - 'The trap is A. Refraction bends sound; it does not make it last longer.'
    hint: 'What happens when many reflections reach your ear one after the other?'
    why:
      A: 'Refraction changes the direction of sound; it does not prolong it.'
      C: 'Superposition is waves adding at a point; it does not explain the long rumble.'
      D: 'Diffraction is sound bending round obstacles, not the sound lasting longer.'

  27:
    answer: D
    steps:
      - 'Data: $v_1$ = 340 m s⁻¹ at θ₁ = 16 °C, θ₂ = 127 °C, pressure doubled, $v_2$ = ?'
      - 'Rule: the speed of sound in a gas is proportional to the square root of the absolute temperature, $v \propto \sqrt{T}$. A change of pressure alone has no effect, because density changes in the same proportion.'
      - 'Convert to kelvin: T₁ = 16 + 273 = 289 K and T₂ = 127 + 273 = 400 K.'
      - '$v_2 = v_1\sqrt{\dfrac{T_2}{T_1}} = 340 \times \sqrt{\dfrac{400}{289}} = 340 \times \dfrac{20}{17}$.'
      - '$v_2 = 20 \times 20 = 400\ \text{m s}^{-1}$.'
      - 'Check: warmer air carries sound a little faster, so a value a bit above 340 m s⁻¹ makes sense.'
      - 'The trap is to let the doubled pressure change the answer. Pressure cancels out; only the temperature matters.'
    hint: 'Does pressure affect the speed of sound in a gas? Use kelvin for the temperatures.'
    why:
      A: 'This is ten times too large. The speed is multiplied by $\sqrt{400/289} = 20/17$, only a little above 1.'
      B: 'This is 400², the value of $v^2$. The square root was not taken at the end.'
      C: 'Pressure has no effect, and the warming multiplies the speed only by 20/17. 8000 m s⁻¹ is over twenty times the starting speed.'

  28:
    answer: D
    steps:
      - 'Fact: the camera and the eye work alike. A lens forms a real, inverted image on a light-sensitive surface at the back.'
      - 'In the camera that surface is the film; in the eye it is the retina.'
      - 'The other matching pairs are: lens and lens, diaphragm and iris, aperture and pupil, focusing by moving the lens and focusing by the ciliary muscles.'
      - 'The trap is B. The pupil matches the aperture, the hole that lets light in.'
    hint: 'Where does the image form in the eye?'
    why:
      A: 'The iris matches the camera''s diaphragm, which controls the size of the opening.'
      B: 'The pupil matches the aperture, the opening that admits light.'
      C: 'The cornea is the clear front of the eye that starts bending the light.'

  29:
    answer: D
    steps:
      - 'Data: object height h₀ = 4 cm, object distance u = 15 cm, focal length f = 5 cm (concave mirror), image height = ?'
      - 'Rule: the mirror formula, $\dfrac{1}{f} = \dfrac{1}{u} + \dfrac{1}{v}$, and magnification $m = \dfrac{v}{u} = \dfrac{\text{image height}}{\text{object height}}$.'
      - 'Units: all lengths are in centimetres, and that is fine here because only ratios are used.'
      - '$\dfrac{1}{v} = \dfrac{1}{5} - \dfrac{1}{15} = \dfrac{3 - 1}{15} = \dfrac{2}{15}$, so v = 7.5 cm.'
      - '$m = \dfrac{7.5}{15} = 0.5$, so image height = 0.5 × 4 = 2 cm.'
      - 'Check: the object is beyond C (2f = 10 cm), so the image must be real, inverted and diminished. 2 cm is smaller than 4 cm.'
      - 'The trap is C, 4 cm. The image is the same size only when the object is at C, 10 cm away.'
    hint: 'Find v from the mirror formula, then use magnification = v/u.'
    why:
      A: 'This does not come from the magnification v/u.'
      B: 'This is the focal length, not the image height.'
