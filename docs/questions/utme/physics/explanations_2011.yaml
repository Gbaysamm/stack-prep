format_version: 1
exam_year: 2011
subject: PHY
explanations:
  2:
    answer: D
    steps:
      - 'Data: m = 1.5 kg, h = 20 m, g = 10 m s⁻², KE at the ground = ?'
      - 'Law: energy is conserved. As the hammer falls freely, all the potential energy it loses becomes kinetic energy, so $KE = mgh$.'
      - 'All the data are already in SI units.'
      - '$KE = 1.5 \times 10 \times 20 = 300$ J.'
      - 'The answer is 300 J. Joules are the unit of energy, and a hammer from a roof having a few hundred joules is sensible.'
      - 'The trap is A, 450 J. It multiplies by an extra 1.5. Use the mass once only.'
    hint: 'The potential energy at the top turns into kinetic energy at the bottom. Work out mgh.'
    why:
      A: 'Multiplies mgh by 1.5 a second time.'
      B: 'Uses a height of 40 m, twice the real height.'
      C: 'Takes half of mgh, as if half the energy were lost.'

  3:
    answer: A
    steps:
      - 'Data: u = 100 m s⁻¹ upwards for both balls, a = −10 m s⁻² (gravity pulls down), t = 1 s, s = ? Masses 5 g and 50 kg.'
      - 'Law: without air resistance every body has the same acceleration of free fall, g, whatever its mass. So both balls move in exactly the same way.'
      - 'Equation of motion: $s = ut + \tfrac{1}{2}at^{2}$.'
      - '$s = 100 \times 1 + \tfrac{1}{2} \times (-10) \times 1^{2} = 100 - 5 = 95$ m.'
      - 'Both balls are 95 m above the point of throw, side by side. A distance in metres, less than 100 m because gravity has slowed them, makes sense.'
      - 'The trap is thinking the heavy ball moves differently. Mass does not appear in the equations of motion for free fall, as Galileo showed.'
    hint: 'Does the mass appear anywhere in s = ut + ½at²?'
    why:
      B: 'The balls move together, so they are not apart at all.'
      C: 'The heavier ball does not go further or faster; g is the same for both.'
      D: 'The lighter ball does not go further either; mass does not change free fall.'

  4:
    answer: D
    steps:
      - 'Fact: what you feel as your weight is the push of the floor on you, the normal reaction R.'
      - 'Newton''s second law for the man: $mg - R = ma$, so $R = m(g - a)$.'
      - 'In a lift falling freely, a = g, so R = m(g − g) = 0. The floor pushes on him with no force.'
      - 'Gravity still pulls on him with the full force mg; it is that pull which makes him and the lift fall together.'
      - 'So he feels weightless because there is no reaction from the floor. Think of the lifting feeling in your stomach when a lift in a Lagos high-rise starts to go down quickly.'
      - 'The trap is A. Gravity has not switched off; without it nothing would fall.'
    hint: 'What force from the floor do you actually feel as your weight?'
    why:
      A: 'Gravity still acts on him; it is the reason the lift falls.'
      B: 'Air tightness has nothing to do with the forces on him.'
      C: 'There is air in the lift, and a vacuum would not remove his weight anyway.'

  5:
    answer: C
    steps:
      - 'Data: F₁ = 6.0 N upwards, F₂ = 8.0 N to the right, at 90° to each other. Resultant R = ?'
      - 'Rule: two vectors at right angles form the two shorter sides of a right-angled triangle, and the resultant is the hypotenuse. By Pythagoras, $R = \sqrt{F_1^{2} + F_2^{2}}$.'
      - '$R = \sqrt{6.0^{2} + 8.0^{2}} = \sqrt{36 + 64} = \sqrt{100}$.'
      - 'R = 10.0 N. It is bigger than either force but smaller than their sum, 14 N, as it must be.'
      - 'The trap is B, 14.0 N. Adding the sizes only works when the forces point the same way.'
    hint: 'The two forces are perpendicular. Which theorem gives the third side of a right-angled triangle?'
    why:
      A: 'Does not come from Pythagoras; √(36 + 64) is exactly 10.'
      B: 'Adds 6 and 8 as if both forces pointed the same way.'
      D: 'Does not come from any correct combination of the two forces.'

  6:
    answer: D
    steps:
      - 'Data: m = 2 kg, v = 10 m s⁻¹, r = 4 m, F = ?'
      - 'Law: a body moving in a circle needs a force towards the centre, the centripetal force, $F = \dfrac{mv^{2}}{r}$.'
      - 'All the data are in SI units.'
      - '$F = \dfrac{2 \times 10^{2}}{4} = \dfrac{200}{4} = 50$ N.'
      - 'The answer is 50 N. The trap is forgetting to square the speed, which gives 2 × 10 ÷ 4 = 5 N, or squaring the radius, which gives 12.5 N.'
    hint: 'Square the speed before you divide by the radius.'
    why:
      A: 'Is mv²/r times 0.8; it comes from no correct step.'
      B: 'Divides by 8 instead of 4, doubling the radius.'
      C: 'Divides mv² by 2 instead of by the radius of 4 m.'

  7:
    answer: D
    steps:
      - 'Data: u = 0 (it falls from rest), a = g = 10 m s⁻², t = 3 s, s = ?'
      - 'Equation of motion: $s = ut + \tfrac{1}{2}at^{2}$, and with u = 0 this is $s = \tfrac{1}{2}gt^{2}$.'
      - '$s = \tfrac{1}{2} \times 10 \times 3^{2} = 5 \times 9 = 45$ m.'
      - 'The answer is 45 m, a sensible drop for 3 seconds.'
      - 'The trap is B, 90 m. It forgets the half in ½gt².'
    hint: 'It starts from rest. Use s = ½gt².'
    why:
      A: 'Does not come from s = ½gt²; 5 × 9 is 45.'
      B: 'Leaves out the half in ½gt².'
      C: 'Multiplies g by t instead of using t², the speed after 3 s, not the distance.'

  8:
    answer: B
    steps:
      - 'Rule: a body is in stable equilibrium if a slight push raises its centre of gravity, unstable if a push lowers it, and neutral if a push leaves its centre of gravity at the same height.'
      - 'X stands on its point. A small push lowers its centre of gravity and it topples over, so X is unstable.'
      - 'Y stands on its broad base. A small tilt raises its centre of gravity and it falls back, so Y is stable.'
      - 'Z lies on its curved side. When it rolls, its centre of gravity stays at the same height, so it rests wherever it stops. Z is neutral.'
      - 'So only Z is in neutral equilibrium. Think of a bottle lying on its side on a table: it rolls and stays put.'
    hint: 'Which cone keeps its centre of gravity at the same height when you nudge it?'
    why:
      A: 'Y is stable and X is unstable; neither is neutral.'
      C: 'X, on its point, is unstable.'
      D: 'Y, on its base, is stable.'

  9:
    answer: D
    steps:
      - 'Fact: in a narrow tube, a liquid that wets glass rises, and a liquid that does not wet glass is pushed down below the outside level.'
      - 'Reason: water''s adhesion to glass is stronger than its cohesion, so it creeps up the walls and climbs the tube. Mercury''s cohesion is stronger than its adhesion to glass, so it pulls away from the walls and is depressed.'
      - 'So the liquid falls below the outside level if it does not wet the glass.'
      - 'This capillary rise is how kerosene climbs the wick of a lantern.'
    hint: 'Think of mercury in a thin glass tube. Does it go up or down?'
    why:
      A: 'A non-wetting liquid such as mercury falls, it does not rise.'
      B: 'Capillary action does change the level in a narrow tube.'
      C: 'A wetting liquid such as water rises, it does not fall.'

  10:
    answer: B
    steps:
      - 'Law: the pressure at a depth h in a liquid of density ρ is $p = h\rho g$.'
      - 'So the pressure depends on the depth (II) and the density (I).'
      - 'The surface area does not appear in the formula. A wide tank and a narrow pipe of the same liquid have the same pressure at the same depth.'
      - 'This is why a borehole overhead tank is put high up: the height of water, not the width of the tank, gives the pressure at the taps.'
      - 'The trap is putting in III. A bigger area holds more liquid and a bigger force, but the force per unit area is the same.'
    hint: 'Write down p = hρg. Which of the three quantities appear in it?'
    why:
      A: 'Leaves out depth and wrongly includes surface area.'
      C: 'Leaves out density and wrongly includes surface area.'
      D: 'Surface area does not affect pressure in a liquid.'

  11:
    answer: A
    steps:
      - 'A good thermometer should be sensitive (a big reading change for a small temperature change), easy to read, and accurate over a wide range.'
      - 'It should have a low thermal capacity, not a high one. A thermometer with a high thermal capacity takes a lot of heat from what it measures, changing that temperature, and responds slowly.'
      - 'So the qualities are II, III and IV.'
      - 'This is why a clinical thermometer has a thin glass bulb with little mercury: it reaches body temperature quickly without cooling the patient.'
    hint: 'Should a thermometer take a lot of heat or very little from the thing it measures?'
    why:
      B: 'High thermal capacity is a fault, and II alone misses III and IV.'
      C: 'Includes high thermal capacity, which is a fault.'
      D: 'Includes high thermal capacity and leaves out sensitivity.'

  12:
    answer: C
    steps:
      - 'Data: load L = 20 N, height h = 10 m, efficiency = 40% = 0.40, work done by the effort = ?'
      - 'Rule: efficiency = (work output ÷ work input) × 100%, so work input = work output ÷ efficiency.'
      - 'Work output (useful work on the load) = L × h = 20 × 10 = 200 J.'
      - 'Work input = 200 ÷ 0.40 = 500 J.'
      - 'The answer is 500 J. It must be more than 200 J, because no machine gives out more work than is put in.'
      - 'The trap is B, 80 J, which multiplies by 0.40 instead of dividing.'
    hint: 'Find the useful work first. Is the effort''s work more or less than that?'
    why:
      A: 'Multiplies the useful work by 0.60, the wasted share, instead of dividing it by 0.40.'
      B: 'Multiplies the useful work by 0.40 instead of dividing.'
      D: 'Adds a wasted 100 J to 200 J; 40% efficiency means 300 J is wasted, not 100 J.'

  13:
    answer: C
    steps:
      - 'Fact: friction between moving surfaces is reduced by a lubricant, such as oil or grease, that keeps a thin layer between them.'
      - 'Grease is thick and sticky, so it stays in place between bearings and gears instead of running off or drying out.'
      - 'Petrol and kerosene evaporate quickly and dissolve grease away, and water causes rust.'
      - 'Mechanics pack grease into the wheel bearings of a keke or an okada for this reason.'
    hint: 'Which one does a mechanic put in wheel bearings?'
    why:
      A: 'Petrol evaporates quickly and is a solvent, not a lubricant.'
      B: 'Kerosene evaporates and washes grease away.'
      D: 'Water is a poor lubricant and makes steel parts rust.'

  14:
    answer: D
    steps:
      - 'Data: stress = $7.7 \times 10^{7}\ \text{N m}^{-2}$, Young modulus E = $1.1 \times 10^{11}\ \text{N m}^{-2}$, strain = ?'
      - 'Law: Young modulus = stress ÷ strain, so strain = stress ÷ E.'
      - 'Strain $= \dfrac{7.7 \times 10^{7}}{1.1 \times 10^{11}} = 7.0 \times 10^{7 - 11}$.'
      - 'Strain $= 7.0 \times 10^{-4}$. Strain has no unit, being extension ÷ length, and a tiny strain is right for a stiff metal like copper.'
      - 'The trap is C, $7.0 \times 10^{-3}$, from a slip in subtracting the powers.'
    hint: 'Divide 7.7 by 1.1, then subtract the powers of ten.'
    why:
      A: 'Does not come from 7.7 ÷ 1.1, which is 7.0.'
      B: 'Does not come from stress ÷ Young modulus.'
      C: 'Gets the power of ten wrong; 7 − 11 is −4.'

  15:
    answer: A
    steps:
      - 'Data: reading in air = 30 kg, reading in water = 22 kg, g = 10 m s⁻², upthrust = ?'
      - 'Archimedes'' principle: the upthrust on an immersed body equals its apparent loss in weight.'
      - 'Weight in air = 30 × 10 = 300 N. Apparent weight in water = 22 × 10 = 220 N.'
      - 'Upthrust = 300 − 220 = 80 N.'
      - 'The answer is 80 N. The trap is D, 220 N, which is the apparent weight in water, not the upthrust.'
    hint: 'How much weight does the object seem to lose in water? Turn it into newtons.'
    why:
      B: 'Does not come from the difference of the two readings.'
      C: 'Adds the two weights instead of subtracting them.'
      D: 'Is the apparent weight in water, not the loss in weight.'

  16:
    answer: C
    steps:
      - 'Data: P = 30 W, t = 5 min, Δθ = 100 °C, heat capacity C = ?'
      - 'Law: heat supplied = power × time, $Q = Pt$, and heat capacity is the heat needed per degree, $C = \dfrac{Q}{\Delta\theta}$.'
      - 'SI conversion: t = 5 × 60 = 300 s. A rise of 100 °C is a rise of 100 K.'
      - '$Q = 30 \times 300 = 9000$ J, so $C = \dfrac{9000}{100} = 90\ \text{J K}^{-1}$.'
      - 'The answer is 90 J K⁻¹. The trap is B, 900 J K⁻¹, which slips a factor of ten.'
    hint: 'Change 5 minutes to seconds before you find the heat.'
    why:
      A: 'Does not come from Pt ÷ Δθ.'
      B: 'Slips a factor of ten in 9000 ÷ 100.'
      D: 'Is just the temperature rise, 100, not the heat capacity.'

  17:
    answer: C
    steps:
      - 'Fact: a black body is one that absorbs all the radiation falling on it, and it is also the best possible emitter.'
      - 'Reason: dull black surfaces absorb and emit radiation well, while white and shiny surfaces reflect it.'
      - 'This is why the black metal of a car roof in the sun gets very hot, while white houses stay cooler.'
    hint: 'Which colour of surface absorbs the most radiation?'
    why:
      A: 'A red surface reflects red light, so it does not absorb everything.'
      B: 'Conducting heat is not the same as absorbing and emitting radiation.'
      D: 'A white body reflects most radiation; it is a poor absorber and emitter.'

  18:
    answer: A
    steps:
      - 'Fact: regelation is the melting of ice under pressure and its refreezing when the pressure is removed.'
      - 'Reason: ice is less dense than water, so pressure favours the liquid and lowers the melting point.'
      - 'Hang a loaded wire over a block of ice: the ice under the wire melts, the wire sinks, and the water refreezes above it. The wire passes through and the block stays whole.'
      - 'Remember: re-gelation means freezing again.'
    hint: 'Which process involves ice melting under a wire and freezing again?'
    why:
      B: 'Sublimation is a solid turning straight to a vapour.'
      C: 'Condensation is a vapour turning to a liquid.'
      D: 'Coagulation is the clumping of particles, not melting.'

  19:
    answer: A
    steps:
      - 'Fact: Charles'' law says the volume of a fixed mass of gas is directly proportional to its absolute temperature at constant pressure, $V \propto T$.'
      - 'So if the volume rises steadily as the temperature rises at constant pressure, the gas obeys Charles'' law.'
      - 'Boyle''s law holds the temperature constant, and the pressure law holds the volume constant.'
      - 'A balloon left in a hot car swells for this reason.'
    hint: 'Which gas law keeps the pressure fixed?'
    why:
      B: 'Graham''s law is about the rate of diffusion of gases.'
      C: 'Boyle''s law links pressure and volume at constant temperature.'
      D: 'The pressure law links pressure and temperature at constant volume.'

  20:
    answer: C
    steps:
      - 'Fact: steam at 100 °C carries its latent heat of vaporisation, about $2.26 \times 10^{6}\ \text{J kg}^{-1}$, on top of the heat in boiling water at the same temperature.'
      - 'When steam touches the skin it first condenses, giving up all that latent heat, and then the hot water cools, giving up more.'
      - 'So each kilogram of steam delivers far more heat to the skin than a kilogram of boiling water.'
      - 'That is why the steam from a pot of boiling rice can scald your hand worse than a splash of the water.'
    hint: 'What extra heat does steam give out when it turns back into water?'
    why:
      A: 'Relative humidity does not decide the severity of a steam burn.'
      B: 'True or not, it does not explain why steam burns more.'
      D: 'Steam and boiling water are at the same temperature, 100 °C.'

  21:
    answer: B
    steps:
      - 'Fact: sound is a mechanical wave. It travels by making the particles of a medium vibrate, so it cannot cross a vacuum.'
      - 'X-rays, light and radio waves are electromagnetic waves, which travel through a vacuum at $3.0 \times 10^{8}\ \text{m s}^{-1}$.'
      - 'This is why light from the sun reaches us across empty space, but there is no sound in space.'
    hint: 'Which of these is not an electromagnetic wave?'
    why:
      A: 'X-rays are electromagnetic and cross a vacuum.'
      C: 'Light is electromagnetic; sunlight crosses empty space.'
      D: 'Radio waves are electromagnetic and need no medium.'

  22:
    answer: C
    steps:
      - 'Fact: every warm body gives off heat as infrared radiation.'
      - 'In the day the ground gains more heat from the sun than it radiates away. At night that gain stops, but the ground keeps radiating heat to the atmosphere and to the sky.'
      - 'Losing heat with nothing coming in, the ground cools.'
      - 'Clear nights are coldest, as harmattan nights in the north show, because clouds are not there to send radiation back.'
    hint: 'How does the ground lose its heat after sunset?'
    why:
      A: 'The atmosphere is not reflecting the sun''s energy at night; there is none arriving.'
      B: 'There is no sunlight at night for the atmosphere to absorb.'
      D: 'This only stops the gain of heat; the cooling comes from the ground radiating heat away.'

  23:
    answer: B
    steps:
      - 'Data: V = 40 cm³, Δθ = 90 − 30 = 60 °C (= 60 K), α = $2.0 \times 10^{-5}\ \text{K}^{-1}$, ΔV = ?'
      - 'Law: the cubic expansivity is three times the linear expansivity, $\gamma = 3\alpha$, and the increase in volume is $\Delta V = \gamma V \Delta\theta$.'
      - '$\gamma = 3 \times 2.0 \times 10^{-5} = 6.0 \times 10^{-5}\ \text{K}^{-1}$.'
      - '$\Delta V = 6.0 \times 10^{-5} \times 40 \times 60 = 0.144$ cm³, about 0.14 cm³.'
      - 'The answer is about 0.14 cm³. Leaving the volume in cm³ is fine, since the answer is asked in cm³.'
      - 'The trap is forgetting the 3. The linear expansivity alone gives only 0.048 cm³.'
    hint: 'A volume expands with three times the linear expansivity.'
    why:
      A: 'Does not come from 3 × 2.0 × 10⁻⁵ × 40 × 60.'
      C: 'Uses a temperature change of 50 °C instead of 60 °C.'
      D: 'Is far too large. It would mean the metal swelled by 3% for a 60 °C rise; $\gamma V \Delta\theta$ gives only 0.144 cm³.'

  24:
    answer: A
    steps:
      - 'Fact: the kinetic theory says matter is made of tiny particles in constant random motion.'
      - 'Change of state is particles gaining or losing enough energy to break free of or rejoin their neighbours. Diffusion is particles spreading by random motion. Osmosis is water molecules moving through a membrane.'
      - 'Radiation is the transfer of energy by electromagnetic waves. It needs no particles at all and crosses a vacuum, so the kinetic theory does not explain it.'
      - 'So the processes are I, II and IV. Smelling akara frying from the next street is diffusion at work.'
    hint: 'Which of the four can happen in a perfect vacuum, with no particles?'
    why:
      B: 'Includes radiation, which needs no particles.'
      C: 'Includes radiation and leaves out osmosis.'
      D: 'Includes radiation and leaves out diffusion.'

  25:
    answer: C
    steps:
      - 'Fact: accommodation is the eye''s ability to change the focal length of its lens, by the ciliary muscles, to focus near and far objects.'
      - 'With age the lens hardens and the ciliary muscles weaken, so the eye loses this power. The defect is called presbyopia.'
      - 'It is why many grandparents hold a newspaper at arm''s length or wear reading glasses.'
      - 'Long sight and short sight come from the eyeball being too short or too long, not from losing accommodation.'
    hint: 'Which defect comes with old age?'
    why:
      A: 'Long sight comes from a short eyeball or a weak lens, not loss of accommodation.'
      B: 'Short sight comes from a long eyeball or too strong a lens.'
      D: 'Astigmatism comes from an unevenly curved cornea.'

  26:
    answer: B
    steps:
      - 'Data: f₁ = 255 Hz, T₁ = 225 N, T₂ = 324 N, f₂ = ?'
      - 'Law: for a stretched string of fixed length and mass per unit length, the frequency is proportional to the square root of the tension, $f \propto \sqrt{T}$. So $\dfrac{f_2}{f_1} = \sqrt{\dfrac{T_2}{T_1}}$.'
      - '$f_2 = 255 \times \sqrt{\dfrac{324}{225}} = 255 \times \dfrac{18}{15}$.'
      - '$f_2 = 255 \times 1.2 = 306$ Hz.'
      - 'The answer is 306 Hz, higher because the string is tighter, as when a guitarist tightens a string.'
      - 'The trap is forgetting the square root: 255 × 324 ÷ 225 is 367 Hz.'
    hint: 'Frequency goes with the square root of the tension.'
    why:
      A: 'Does not come from 255 × √(324/225).'
      C: 'Is about double 255 Hz, as if the tension had gone up four times.'
      D: 'Does not come from the square-root rule.'

  27:
    answer: C
    steps:
      - 'Data: the object (the page) is at u = 25 cm. The lens must form a virtual image at his near point, v = −50 cm (real is positive). Power P = ?'
      - 'Law: the lens formula $\dfrac{1}{f} = \dfrac{1}{u} + \dfrac{1}{v}$, and power $P = \dfrac{1}{f}$ with f in metres.'
      - '$\dfrac{1}{f} = \dfrac{1}{25} + \dfrac{1}{-50} = \dfrac{2 - 1}{50} = \dfrac{1}{50}$, so f = +50 cm.'
      - 'SI conversion: f = 50 cm = 0.50 m.'
      - '$P = \dfrac{1}{0.50} = 2.0$ D. It is positive, a converging lens, as long sight needs.'
      - 'The trap is B, 6.0 D. It uses +50 cm for the image, but the image must be virtual, on the same side as the object, so v is negative.'
    hint: 'The image must be virtual and 50 cm away. Use v = −50 cm, then change f to metres.'
    why:
      A: 'Uses only 1/u = 1/0.25 m and forgets the image.'
      B: 'Takes the image as real, adding 1/25 and 1/50.'
      D: 'Does not come from the lens formula with these distances.'

  28:
    answer: A
    steps:
      - 'Fact: in order of increasing frequency the electromagnetic spectrum runs radio waves, microwaves, infrared, visible light, ultraviolet, X-rays and gamma rays.'
      - 'All travel at the same speed c, so $c = f\lambda$ means the shortest wavelength has the highest frequency.'
      - 'Of the four given, X-rays have the shortest wavelength and the highest frequency.'
      - 'Memory aid: "Ray My Ice Very Unusual X-Ray Game" for radio, microwave, infrared, visible, ultraviolet, X-ray, gamma.'
    hint: 'Which of these is closest to gamma rays in the spectrum?'
    why:
      B: 'Ultraviolet comes just below X-rays in frequency.'
      C: 'Radio waves have the lowest frequency of all.'
      D: 'Infrared has a lower frequency than visible light.'

  29:
    answer: A
    steps:
      - 'Fact: an object''s colour is the colour of light it reflects; it absorbs the others.'
      - 'A red rose reflects only red light and absorbs every other colour, including blue.'
      - 'In blue light there is no red for it to reflect. It absorbs the blue and sends nothing back to the eye.'
      - 'So the rose looks black. A red cloth under a blue disco light at a party looks black for the same reason.'
    hint: 'What colour does a red rose reflect, and is that colour in blue light?'
    why:
      B: 'There is no red light falling on it to be reflected.'
      C: 'The red rose absorbs blue light rather than reflecting it.'
      D: 'Magenta needs both red and blue light to be reflected.'

  30:
    answer: B
    steps:
      - 'Fact: light travels in straight lines, so an opaque body in the path of light casts a shadow.'
      - 'In an eclipse of the sun (a solar eclipse), the moon comes between the sun and the earth. The moon blocks the sun''s light and its shadow falls on part of the earth.'
      - 'People in the moon''s umbra see a total eclipse, and those in the penumbra see a partial one.'
      - 'When the earth is between the sun and the moon, the earth''s shadow falls on the moon. That is an eclipse of the moon (a lunar eclipse).'
    hint: 'Which body must block the sun''s light from reaching us?'
    why:
      A: 'The earth''s shadow on the moon is an eclipse of the moon.'
      C: 'The earth between the sun and the moon gives an eclipse of the moon.'
      D: 'That describes a partial eclipse of the moon.'

  31:
    answer: A
    steps:
      - 'Data: distance d = 4.95 km, speed of sound v = 333 m s⁻¹, time t = ?'
      - 'Rule: for steady speed, time = distance ÷ speed, $t = \dfrac{d}{v}$.'
      - 'SI conversion: d = 4.95 km = 4.95 × 1000 = 4950 m.'
      - '$t = \dfrac{4950}{333} = 14.9$ s, which is about 15 s.'
      - 'The answer is about 15 s. The trap is forgetting to change km to metres, which gives a far too small time.'
    hint: 'Change 4.95 km into metres, then divide by the speed.'
    why:
      B: 'Sound takes time to travel; it is not heard at once.'
      C: 'Uses a speed of about 500 m s⁻¹, far too fast for sound in air.'
      D: 'Uses a speed of about 410 m s⁻¹, too fast for sound in air.'

  32:
    answer: B
    steps:
      - 'Data: f = +15 cm (convex), magnification m = 3, image upright. u = ?'
      - 'Rule: an upright image in a convex lens is virtual, on the same side as the object, so with real is positive, $v = -3u$.'
      - 'Lens formula: $\dfrac{1}{f} = \dfrac{1}{u} + \dfrac{1}{v}$, so $\dfrac{1}{15} = \dfrac{1}{u} - \dfrac{1}{3u} = \dfrac{2}{3u}$.'
      - '$3u = 30$, so u = 10 cm.'
      - 'The answer is 10 cm. It is less than f = 15 cm, as it must be for a convex lens to act as a magnifying glass.'
      - 'The trap is treating the image as real, v = +3u, which gives u = 20 cm.'
    hint: 'Upright means virtual. Put v = −3u into the lens formula.'
    why:
      A: 'Does not come from the lens formula with v = −3u.'
      C: 'Is more than f, which would give a real, inverted image.'
      D: 'Is more than f, which would give a real, inverted image.'

  33:
    answer: D
    steps:
      - 'Data: capacitance in air $C_0$ = 20 μF, with dielectric C = 60 μF, dielectric constant k = ?'
      - 'Rule: the dielectric constant (relative permittivity) is the factor by which the dielectric increases the capacitance, $k = \dfrac{C}{C_0}$.'
      - 'Both are in μF, so the units cancel and no conversion is needed.'
      - '$k = \dfrac{60}{20} = 3.0$. It has no unit, and it is more than 1 because a dielectric always increases capacitance.'
      - 'The trap is B, 0.3, which divides the wrong way round.'
    hint: 'By what factor did the capacitance increase?'
    why:
      A: 'Does not come from 60 ÷ 20.'
      B: 'Divides 20 by 60, the wrong way round; k is never less than 1.'
      C: 'Doubles the right ratio.'

  34:
    answer: C
