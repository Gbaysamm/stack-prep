format_version: 1
exam_year: 2012
subject: PHY
explanations:
  2:
    answer: C
    steps:
      - 'Parallax error is the false reading you get when your eye is not in line with the mark you are reading.'
      - 'If you look at the rule from the left or the right, the end of the object seems to line up with the wrong mark.'
      - 'So the eye must be directly above the mark, looking vertically downwards on the markings.'
      - 'Think of reading a tailor''s tape: lean over it and look straight down at the mark.'
      - 'The trap is D. Looking upwards on markings lying on a table puts the eye below the rule, where you cannot read it at all.'
    hint: 'Where must your eye be so that it is exactly in line with the mark?'
    why:
      A: 'Looking slantwise from the left is exactly what causes parallax error.'
      B: 'Looking slantwise from the right also causes parallax error.'
      D: 'The eye must look down on the marks from directly above, not up at them.'

  3:
    answer: D
    steps:
      - 'Data: tension T = 1500 N, angle with the floor θ = 45°, speed uniform, friction F = ?'
      - 'Uniform speed means no acceleration, so by Newton''s first law the horizontal forces balance: friction = horizontal component of the pull.'
      - 'Horizontal component = $T\cos\theta$.'
      - '$F = 1500 \times \cos 45^\circ = 1500 \times 0.7071 = 1061\ \text{N}$.'
      - 'Check: friction must be smaller than the full pull, since only part of the rope''s force acts along the floor. 1061 N is less than 1500 N.'
      - 'The trap is thinking friction equals the whole 1500 N. Only the horizontal part of the pull drags the load forward.'
    hint: 'At uniform speed, which part of the rope''s pull does the friction balance?'
    why:
      A: 'This is more than the whole pull of the rope, which cannot be.'
      B: 'This does not come from 1500 cos 45°; it is not the horizontal component.'
      C: 'This is not 1500 × 0.707; check the cosine of 45°.'

  4:
    answer: C
    steps:
      - 'Data: OU = 6 N along OQ, 8 N along OS, angle between them 90°, OT = ?'
      - 'Parallelogram law: the resultant of two forces is the diagonal of the parallelogram they form. At right angles that is a rectangle, so use Pythagoras: $R = \sqrt{F_1^{2} + F_2^{2}}$.'
      - '$R = \sqrt{6^{2} + 8^{2}} = \sqrt{36 + 64} = \sqrt{100} = 10\ \text{N}$, along OR.'
      - 'For O to be in equilibrium, OT must be equal in size and opposite in direction to the resultant. That force is the equilibrant.'
      - 'So OT = 10 N, pointing straight down, opposite to OR.'
      - 'The trap is B, 14 N. Forces are vectors, so you cannot just add 6 N and 8 N when they act at an angle.'
    hint: 'Two forces at right angles: which famous right-angled triangle do 6 and 8 belong to?'
    why:
      A: '18 N is not built from 6 N and 8 N by any vector rule.'
      B: 'This adds 6 N and 8 N as if they acted in the same direction.'
      D: 'This subtracts them as if they acted in opposite directions.'

  5:
    answer: D
    steps:
      - 'A velocity-time graph shows how velocity changes with time. From it we can read velocity, find acceleration from the slope and find distance from the area under it.'
      - 'Initial velocity: read at t = 0, it is 60 m s⁻¹.'
      - 'Deceleration: slope of the last part = (60 − 0) ÷ (25 − 20) = 12 m s⁻².'
      - 'Total distance: area = 60 × 20 + ½ × 5 × 60 = 1200 + 150 = 1350 m.'
      - 'Mass does not appear anywhere on the graph. Two bodies of different mass can have exactly the same velocity-time graph, so mass cannot be found from it.'
      - 'The trap is C. Distance is not shown directly, but it is the area under the graph, so it can be worked out.'
    hint: 'Which of these has nothing to do with velocity or time?'
    why:
      A: 'Deceleration is the slope of the falling part, 12 m s⁻².'
      B: 'Initial velocity is read straight off the graph at t = 0, 60 m s⁻¹.'
      C: 'Total distance is the area under the graph, 1350 m.'

  6:
    answer: B
    steps:
      - 'Data: u = 30 m s⁻¹, v = 0 (comes to rest), a = −0.1 m s⁻² (retardation), s = ?'
      - 'Use the equation of motion that links v, u, a and s without time: $v^{2} = u^{2} + 2as$.'
      - '$0 = 30^{2} + 2(-0.1)s$, so $0.2s = 900$.'
      - '$s = 900 \div 0.2 = 4500\ \text{m}$.'
      - 'Check: a gentle retardation of 0.1 m s⁻² should give a long stopping distance, and 4.5 km is long. The unit is metres.'
      - 'The trap is forgetting the 2 in 2as, which gives 9000 m. Check another way: the train takes 30 ÷ 0.1 = 300 s to stop, at an average speed of 15 m s⁻¹, and 15 × 300 = 4500 m.'
    hint: 'You have u, v and a but no time. Which equation of motion has no t in it?'
    why:
      A: 'This does not follow from u² = 2as with these numbers.'
      C: 'This does not follow from u² = 2as; check 900 ÷ 0.2.'
      D: 'This is too short: the train takes 300 s to stop at an average of 15 m s⁻¹, so it covers 4500 m, not 3000 m.'

  7:
    answer: A
    steps:
      - 'Data: u = 0 (from rest), a = 30 m s⁻², t = 20 s, s = ?'
      - 'Use the equation of motion $s = ut + \tfrac{1}{2}at^{2}$.'
      - '$s = 0 \times 20 + \tfrac{1}{2} \times 30 \times 20^{2} = 15 \times 400 = 6000\ \text{m}$.'
      - 'Convert to kilometres: 6000 m ÷ 1000 = 6 km.'
      - 'The trap is B, 12 km. That forgets the half in ½at².'
    hint: 'Starting from rest, s = ½at². Do not forget the half.'
    why:
      B: 'This leaves out the ½ in s = ½at².'
      C: 'This is three times the right value; it is not from s = ½at².'
      D: 'This multiplies by 2 instead of by ½: 2 × 30 × 400 = 24 000 m.'

  8:
    answer: A
    steps:
      - 'Newton''s law of universal gravitation: the force between two masses is directly proportional to the product of the masses and inversely proportional to the square of the distance between them.'
      - 'As a formula: $F = \dfrac{Gm_1m_2}{r^{2}}$, where G is a universal constant.'
      - 'Because r² is in the denominator, a smaller r gives a larger F, and a larger r gives a smaller F.'
      - 'So as the rocket moves away from the earth, the pull of the earth on it gets weaker; F increases only as r reduces.'
      - 'The trap is B. G is a constant, the same everywhere; it does not vary.'
    hint: 'Is r on the top or the bottom of the formula?'
    why:
      B: 'G is the universal gravitational constant; it does not vary.'
      C: 'F changes as the distance r changes, so it is not constant.'
      D: 'F gets smaller, not larger, as r increases, because of the r² underneath.'

  9:
    answer: A
    steps:
      - 'A pendulum pulled aside and released moves in simple harmonic motion.'
      - 'Simple harmonic motion is motion in which the acceleration is directly proportional to the displacement from the equilibrium point and always directed towards that point: $a = -\omega^{2}x$.'
      - 'The further you pull the bob aside, the larger the restoring pull back to the middle, so it swings to and fro about the rest position.'
      - 'Think of a child on a swing at the playground: pulled further back, it rushes back faster.'
      - 'The trap is D. At the equilibrium point the velocity is greatest, not least.'
    hint: 'What links acceleration and displacement in simple harmonic motion?'
    why:
      B: 'The restoring acceleration is always directed towards the equilibrium point, not away.'
      C: 'In SHM acceleration is proportional to displacement itself, not its square.'
      D: 'The velocity is maximum, not minimum, at the equilibrium point.'

  10:
    answer: C
    steps:
      - 'Data: r = 0.5 m, v = 1 m s⁻¹, ω = ?'
      - 'Linear speed equals angular velocity times radius: $v = \omega r$, so $\omega = \dfrac{v}{r}$.'
      - '$\omega = \dfrac{1}{0.5} = 2\ \text{rad s}^{-1}$.'
      - 'Check: dividing by a radius less than 1 m gives a number bigger than v, and the unit is radians per second.'
      - 'The trap is B, 4 rad s⁻¹. That divides by r² or by the wrong quantity.'
    hint: 'Linear speed and angular velocity are joined by v = ωr.'
    why:
      A: 'This is not v ÷ r; it comes from mixing up the formula.'
      B: 'This divides by 0.25, the square of the radius.'
      D: 'This forgets to divide by the radius at all.'

  11:
    answer: B
    steps:
      - 'Data from the graph: the force rises from 0 at x = 0 to 80 N at x = 30 m, then falls back to 0 at x = 60 m. Work done from 0 to 60 m = ?'
      - 'Rule: the work done by a varying force is the area under the force-distance graph.'
      - 'From 0 to 60 m the area is a triangle with base 60 m and height 80 N.'
      - 'Area $= \tfrac{1}{2} \times 60 \times 80 = 2400\ \text{J}$, since one newton times one metre is one joule.'
      - 'Check: 2400 J is less than 80 N × 60 m = 4800 J, as it must be, because the force was only 80 N for an instant.'
      - 'The trap is treating the area as a rectangle, or forgetting the half in the area of a triangle.'
    hint: 'Work done is the area under a force-distance graph. What shape is the area from 0 to 60 m?'
    why:
      A: 'This is the area from 0 to 30 m only, half of the triangle.'
      C: 'This does not match the area of the triangle; check base and height.'
      D: 'This does not match the area of the triangle; check base and height.'

  12:
    answer: B
    steps:
      - 'When the block is just about to slide, friction is at its limit: $F = \mu R$.'
      - 'Resolve the weight W along and across the plane: down the slope $W\sin\alpha$, into the plane $W\cos\alpha$.'
      - 'Normal reaction $R = W\cos\alpha$. Limiting friction balances the pull down the slope, $F = W\sin\alpha$.'
      - '$\mu = \dfrac{F}{R} = \dfrac{W\sin\alpha}{W\cos\alpha} = \tan\alpha$.'
      - 'So the coefficient of friction is tan α. The angle α is called the angle of friction.'
      - 'The trap is A, sin α. That forgets to divide by the normal reaction.'
    hint: 'Friction balances W sin α and the reaction is W cos α. Divide one by the other.'
    why:
      A: 'sin α is only the fraction of the weight down the slope; it is not divided by the reaction.'
      C: 'cot α is R ÷ F, which is upside down.'
      D: 'cos α is only the fraction of the weight pressing into the plane.'

  13:
    answer: D
    steps:
      - 'Data: m = 20 kg, θ = 30°, constant velocity, μ = ?'
      - 'Constant velocity means no acceleration, so friction exactly balances the component of the weight down the slope: $F = mg\sin\theta$. The normal reaction is $R = mg\cos\theta$.'
      - 'Coefficient of kinetic friction: $\mu = \dfrac{F}{R} = \dfrac{mg\sin\theta}{mg\cos\theta} = \tan\theta$.'
      - '$\mu = \tan 30^\circ = 0.577$, which is 0.6 to one decimal place.'
      - 'The mass cancels, so the 20 kg and g are not needed. Any mass slides steadily at the same angle.'
      - 'The trap is C, 0.5. That uses sin 30° instead of tan 30°.'
    hint: 'At constant velocity the forces along the slope balance. What is F ÷ R?'
    why:
      A: 'This does not follow from tan 30°.'
      B: 'This does not follow from tan 30°.'
      C: 'This uses sin 30°, forgetting to divide by the normal reaction.'

  14:
    answer: C
    steps:
      - 'Data: m = 25 kg, g = 10 m s⁻², h = 30 m, work against friction = 1500 J, efficiency = ?'
      - 'Efficiency = (useful work output ÷ total work input) × 100%.'
      - 'Load W = mg = 25 × 10 = 250 N. Useful work = Wh = 250 × 30 = 7500 J.'
      - 'Total work input = useful work + wasted work = 7500 + 1500 = 9000 J.'
      - 'Efficiency $= \dfrac{7500}{9000} \times 100\% = 83.3\%$.'
      - 'The trap is dividing 1500 by 7500 and taking 80%, or using the mass 25 instead of the weight 250 N.'
    hint: 'Total work put in is the useful work plus the work wasted on friction.'
    why:
      A: 'This does not come from 7500 ÷ 9000.'
      B: 'This does not come from 7500 ÷ 9000.'
      D: 'This is too high; 1500 J out of 9000 J is lost, about 17%.'

  15:
    answer: B
    steps:
      - 'Data: m = 1 kg, g = 10 m s⁻², extension e = 1.2 cm, k = ?'
      - 'Hooke''s law: the extension is proportional to the stretching force, F = ke, so $k = \dfrac{F}{e}$.'
      - 'Force F = mg = 1 × 10 = 10 N. Convert e to SI: 1.2 cm = 0.012 m.'
      - '$k = \dfrac{10}{0.012} = 833\ \text{N m}^{-1}$.'
      - 'The trap is using the mass, 1 kg, as the force, or forgetting to change cm to m.'
    hint: 'Turn the mass into a weight and the centimetres into metres first.'
    why:
      A: 'This does not come from 10 ÷ 0.012.'
      C: 'This does not come from 10 ÷ 0.012.'
      D: 'This would need an extension of 1.5 cm.'

  16:
    answer: B
    steps:
      - 'Data: V = 1 m³, m = 2 kg, ρ (liquid) = 1 kg m⁻³, g = 10 m s⁻², apparent weight = ?'
      - 'Archimedes'' principle: a body wholly immersed in a fluid has an upthrust equal to the weight of fluid it displaces: $U = V\rho g$.'
      - 'Real weight = mg = 2 × 10 = 20 N.'
      - 'Upthrust = 1 × 1 × 10 = 10 N.'
      - 'Apparent weight = real weight − upthrust = 20 − 10 = 10 N.'
      - 'The trap is A, 20 N. That is the real weight, before the upthrust is taken away.'
    hint: 'Apparent weight is the real weight minus the upthrust.'
    why:
      A: 'This is the real weight; the upthrust has not been subtracted.'
      C: 'This is the mass in kilograms, not a weight.'
      D: 'This leaves out g: 2 kg − 1 kg = 1 is a difference of masses, not a weight in newtons.'

  17:
    answer: A
    steps:
      - 'Pressure in a liquid at rest is $p = h\rho g$, where h is the depth and ρ is the density.'
      - 'g is the same everywhere in the tank, so what changes the pressure is the depth and the density of the liquid.'
      - 'The shape of the container, the amount of liquid and its surface area do not appear in the formula.'
      - 'That is why a borehole tank on a tall stand gives a stronger flow: more depth of water above the tap means more pressure.'
      - 'The trap is B. Mass and volume describe the whole liquid, not the pressure at a point.'
    hint: 'Write the formula for pressure in a liquid. Which letters are in it?'
    why:
      B: 'Pressure at a point does not depend on the total mass or volume of liquid.'
      C: 'Quantity of liquid and surface area are not in p = hρg.'
      D: 'Surface area and viscosity do not set the pressure in a liquid at rest.'

  18:
    answer: C
    steps:
      - 'Data: V = 300 m³, ρ (air) = 1.3 kg m⁻³, g = 10 m s⁻², upthrust = ?'
      - 'Archimedes'' principle: upthrust equals the weight of the fluid displaced. The balloon displaces air, so use the density of air: $U = V\rho g$.'
      - '$U = 300 \times 1.3 \times 10 = 3900\ \text{N}$.'
      - 'The hydrogen inside does not change the upthrust; it only makes the balloon light, so the upthrust can lift it.'
      - 'The trap is A, 3000 N, which drops the 1.3 and uses a density of 1 kg m⁻³.'
    hint: 'Upthrust is the weight of the air pushed aside.'
    why:
      A: 'This uses a density of 1 kg m⁻³ instead of 1.3 kg m⁻³.'
      B: 'This does not come from 300 × 1.3 × 10.'
      D: 'This does not come from 300 × 1.3 × 10.'

  19:
    answer: D
    steps:
      - 'A clinical thermometer is the small thermometer a nurse puts under your tongue or arm to check for fever.'
      - 'It is a mercury-in-glass thermometer with a narrow range, about 35 °C to 43 °C, and a constriction in the bore.'
      - 'The constriction stops the mercury running back when the thermometer is taken out, so the reading can be read at leisure.'
      - 'Memory aid: the shiny silver thread you see in it is mercury.'
      - 'The trap is C. Alcohol thermometers are used for very low temperatures, not for body temperature.'
    hint: 'What is the silver liquid inside the thermometer at the clinic?'
    why:
      A: 'Gas thermometers are large laboratory standards, not clinical thermometers.'
      B: 'Resistance thermometers use a platinum wire and are used for high temperatures.'
      C: 'Alcohol thermometers are used for low temperatures, not clinical readings.'

  20:
    answer: A
    steps:
      - 'Data: $\alpha_P : \alpha_Q = 2 : 3$, $L_P : L_Q = 3 : 4$, same Δθ, $\Delta L_P : \Delta L_Q = ?$'
      - 'Increase in length = linear expansivity × original length × temperature rise: $\Delta L = \alpha L \Delta\theta$.'
      - 'With the same Δθ, $\dfrac{\Delta L_P}{\Delta L_Q} = \dfrac{\alpha_P L_P}{\alpha_Q L_Q} = \dfrac{2 \times 3}{3 \times 4}$.'
      - '$= \dfrac{6}{12} = \dfrac{1}{2}$, so the ratio is 1 : 2.'
      - 'The trap is C, 8 : 9. That divides the ratios instead of multiplying them.'
    hint: 'ΔL is proportional to α times L. Multiply the two ratios.'
    why:
      B: 'This is the ratio upside down, Q to P.'
      C: 'This divides the two ratios instead of multiplying them.'
      D: 'This divides the ratios and then turns the answer upside down.'

  21:
    answer: C
    steps:
      - 'Data: V₁ = 2000 cm³, T₁ = 27 °C, P₁ = 700 mmHg. At s.t.p.: T₂ = 273 K, P₂ = 760 mmHg, V₂ = ?'
      - 'General gas equation: $\dfrac{P_1V_1}{T_1} = \dfrac{P_2V_2}{T_2}$.'
      - 'Convert the temperature to kelvin: T₁ = 27 + 273 = 300 K.'
      - '$V_2 = \dfrac{P_1V_1T_2}{T_1P_2} = \dfrac{700 \times 2000 \times 273}{300 \times 760}$.'
      - '$V_2 = \dfrac{382\,200\,000}{228\,000} = 1676.3\ \text{cm}^{3}$.'
      - 'Check: both cooling and raising the pressure shrink a gas, so V₂ must be less than 2000 cm³. The trap is leaving the temperature in °C.'
    hint: 'Change 27 °C to kelvin first, and remember s.t.p. is 273 K and 760 mmHg.'
    why:
      A: 'This is too big: cooling alone gives 1820 cm³ and the pressure rise alone gives 1842 cm³, so both together must give less than either.'
      B: 'This does not come from 700 × 2000 × 273 ÷ (300 × 760).'
      D: 'This shrinks the gas too much: 2000 × 273/300 × 700/760 is only down to 1676.3 cm³.'

  22:
    answer: C
    steps:
      - 'Data: Q = 500 J, m = 100 g, c = 4200 J kg⁻¹ K⁻¹, Δθ = ?'
      - 'Heat supplied = mass × specific heat capacity × temperature rise: $Q = mc\Delta\theta$, so $\Delta\theta = \dfrac{Q}{mc}$.'
      - 'Convert the mass to SI: 100 g = 0.1 kg.'
      - '$\Delta\theta = \dfrac{500}{0.1 \times 4200} = \dfrac{500}{420} = 1.19 \approx 1.2\ ^\circ\text{C}$.'
      - 'Check: 500 J is a small amount of heat, so a small rise makes sense. The trap is D, 0.1 °C, from leaving out the mass: 500 ÷ 4200 = 0.12, as if there were 1 kg of water.'
    hint: 'Turn 100 g into kilograms before you divide.'
    why:
      A: 'This is about ten times too big: 500 ÷ 420 is only about 1.2.'
      B: 'This does not come from 500 ÷ 420.'
      D: 'This leaves out the mass: 500 ÷ 4200 = 0.12, which is the rise for 1 kg of water, not 0.1 kg.'

  23:
    answer: A
    steps:
      - 'Evaporation is the escape of the fastest molecules from the surface of a liquid.'
      - 'Anything that gives the molecules more speed or kinetic energy, such as a rise in temperature, makes more of them escape.'
      - 'A higher atmospheric pressure means more air molecules pressing on the surface, which pushes escaping molecules back and slows evaporation.'
      - 'That is why clothes dry fastest on a hot, windy, dry day, not because of the pressure of the air.'
      - 'The trap is C or D. They sound different, but more speed and more kinetic energy both increase evaporation.'
    hint: 'Which change makes it harder for molecules to leave the surface?'
    why:
      B: 'A rise in temperature gives more molecules enough energy to escape, so it does increase evaporation.'
      C: 'Faster molecules escape more easily, so this increases evaporation.'
      D: 'More kinetic energy means more escaping molecules, so this increases evaporation.'

  24:
    answer: B
    steps:
      - 'Data: m = 1 kg, ice at −30 °C, c (ice) = 2.1 × 10³ J kg⁻¹ K⁻¹, L = 3.5 × 10⁵ J kg⁻¹, total heat = ?'
      - 'Two stages. First warm the ice to its melting point with $Q_1 = mc\Delta\theta$, then melt it at 0 °C with $Q_2 = mL$.'
      - '$Q_1 = 1 \times 2100 \times 30 = 63\,000\ \text{J} = 0.63 \times 10^{5}\ \text{J}$.'
      - '$Q_2 = 1 \times 3.5 \times 10^{5} = 3.5 \times 10^{5}\ \text{J}$.'
      - 'Total $= 0.63 \times 10^{5} + 3.5 \times 10^{5} = 4.13 \times 10^{5}\ \text{J}$.'
      - 'The trap is forgetting the first stage. Ice at −30 °C cannot melt until it has been warmed to 0 °C.'
    hint: 'The ice must first be warmed to 0 °C before it can start to melt.'
    why:
      A: 'The digits are right but the power of ten is one too small.'
      C: 'This is not the sum of 63 000 J and 350 000 J.'
      D: 'This is far too small; melting alone needs 350 000 J.'

  25:
    answer: D
    steps:
      - 'Brownian motion is the rapid, never-ending, zigzag motion of tiny particles, such as smoke or pollen grains, in a fluid.'
      - 'It happens because invisible molecules of the fluid keep hitting the particles unevenly from all sides.'
      - 'So it shows that molecules exist (II) and that they are in constant random motion (IV). Statement I describes it correctly.'
      - 'Statement III is false. Brownian motion happens in liquids as well as gases, as with pollen grains in water seen under a microscope.'
      - 'So the correct combination is I, II and IV only.'
    hint: 'Was Brownian motion first seen in a gas or in water?'
    why:
      A: 'Statement III is false: Brownian motion also happens in liquids.'
      B: 'Statement III is false, and statement I is true and left out.'
      C: 'Statement III is false, and statement II is true and left out.'

  26:
    answer: C
    steps:
      - 'The equation of a progressive wave can be written $y = A\sin\dfrac{2\pi}{\lambda}(vt - x)$, where A is the amplitude, λ the wavelength and v the speed.'
      - 'Compare with $y = 15\sin\dfrac{2\pi}{5}(60t - x)$.'
      - 'Matching $\dfrac{2\pi}{\lambda}$ with $\dfrac{2\pi}{5}$ gives λ = 5 m.'
      - 'The other numbers are the amplitude, A = 15 m, and the speed, v = 60 m s⁻¹.'
      - 'The trap is A or B: 60 is the speed and 15 is the amplitude, not the wavelength.'
    hint: 'Line up the equation with y = A sin (2π/λ)(vt − x). What sits under the 2π?'
    why:
      A: '60 is the speed of the wave in m s⁻¹.'
      B: '15 is the amplitude of the wave.'
      D: '2 is part of the 2π, not the wavelength.'

  27:
    answer: A
    steps:
      - 'One whole wavelength λ along the wave corresponds to one full cycle of phase, 2π radians.'
      - 'So the phase changes by $\dfrac{2\pi}{\lambda}$ for every metre along the wave.'
      - 'Over a distance x the phase difference is $\phi = \dfrac{2\pi}{\lambda} \times x = \dfrac{2\pi x}{\lambda}$.'
      - 'Check: when x = λ, the phase difference is 2π, so F and O are back in step, as they should be.'
      - 'The trap is B. πx/λ would give only π for a whole wavelength, which is half a cycle.'
    hint: 'How many radians of phase are there in one wavelength?'
    why:
      B: 'This gives a phase difference of π over a whole wavelength, which is only half a cycle.'
      C: 'This is the right expression turned upside down.'
      D: 'This is upside down and also uses π instead of 2π.'

  28:
    answer: C
    steps:
      - 'The speed of sound depends on the medium and its conditions, such as temperature, and on any wind carrying the medium along.'
      - 'A wind blowing the same way as the sound carries it along, so the sound reaches you faster. Wind against it slows it down.'
      - 'Pitch and loudness do not change the speed: all frequencies and loudnesses of sound travel together, which is why music from a far stage still sounds in tune.'
      - 'For a gas, $v \propto \sqrt{\dfrac{P}{\rho}}$. At constant temperature, P and ρ change together, so P/ρ and the speed stay the same.'
      - 'The trap is D. Pressure alone does not change the speed of sound; temperature does.'
    hint: 'Which of these actually moves the air that carries the sound?'
    why:
      A: 'Pitch is frequency; all frequencies of sound travel at the same speed in air.'
      B: 'Loudness depends on amplitude, which does not change the speed.'
      D: 'At constant temperature, pressure and density change together, so the speed stays the same.'

  29:
    answer: D
    steps:
      - 'The intensity of a wave is the energy it carries per second through each square metre.'
      - 'The energy of a vibration depends on its amplitude: intensity is proportional to the square of the amplitude.'
      - 'For sound, a greater intensity is heard as a louder sound.'
      - 'Think of beating a talking drum harder: the skin vibrates with a bigger amplitude and the sound is louder, but the note is the same.'
      - 'The trap is A. Frequency sets the pitch, not the intensity.'
    hint: 'Hitting a drum harder makes it louder. What about the vibration has grown?'
    why:
      A: 'Frequency determines the pitch of a note.'
      B: 'Overtones determine the quality, or timbre, of a note.'
      C: 'Wavelength goes with frequency and pitch, not intensity.'

  30:
    answer: C
    steps:
      - 'A shaving mirror must give an image that is upright and larger than the face.'
      - 'For a concave mirror, an object between the principal focus F and the pole P gives a virtual, upright, magnified image behind the mirror.'
      - 'An object between C and F gives an enlarged image too, but it is real and inverted, so you would see your face upside down and in front of the mirror.'
      - 'That is why the barber''s or bathroom shaving mirror is held close to the face, inside the focal length.'
      - 'The trap is A. The image there is enlarged but upside down, so it is no use for shaving.'
    hint: 'Which object position gives a concave mirror image that is both upright and magnified?'
    why:
      A: 'Between C and F the image is enlarged but real and inverted.'
      B: 'At F the reflected rays are parallel, so the image is at infinity.'
      D: 'At C the image is real, inverted and the same size.'

  31:
    answer: D
    steps:
