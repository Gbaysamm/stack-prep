format_version: 1
exam_year: 2013
subject: PHY
explanations:
  2:
    answer: A
    steps:
      - 'Mass is the quantity of matter in a body. It is measured in kilograms with a beam balance.'
      - 'Taking the brick to the moon does not add or remove any matter, so its mass stays the same.'
      - 'What changes is its weight, $W = mg$, because $g$ on the moon is about one-sixth of $g$ on the earth.'
      - 'The trap is B. The brick feels lighter on the moon, but that is its weight falling, not its mass.'
    hint: 'Does the brick lose any of its matter on the trip?'
    why:
      B: 'It is the weight that reduces on the moon, not the mass.'
      C: 'Nothing is added to the brick, so its mass cannot increase.'
      D: 'Matter does not vanish; even weight only becomes zero far from every body.'

  3:
    answer: C
    steps:
      - 'Data: resultant $R = 50$ N, the two forces are at 90° to each other, and one force $F$ makes 30° with $R$. $F = ?$'
      - 'Rule: two perpendicular forces are the components of their resultant. The component at angle $\theta$ to $R$ is $F = R\cos\theta$.'
      - 'Substitute: $F = 50 \cos 30° = 50 \times 0.866$.'
      - '$F = 43.3$ N. The other force is $50 \sin 30° = 25.0$ N, and $\sqrt{43.3^{2} + 25^{2}} = 50$ N, which checks.'
      - 'The trap is D, 25.0 N. That is the other force, the one at 60° to the resultant, found with sine instead of cosine.'
    hint: 'The force next to the 30° angle is the adjacent side of a right-angled triangle.'
    why:
      A: 'Divides by sin 30° instead of multiplying by cos 30°; a component cannot be bigger than the resultant.'
      B: 'Divides 50 by cos 30°; a component is always smaller than the resultant.'
      D: 'This is the other force, at 60° to the resultant.'

  4:
    answer: A
    steps:
      - 'A scalar has size only. A vector has size and direction.'
      - 'Volume and area have no direction: 2 m³ of water is just 2 m³. Both are scalars.'
      - 'Momentum, displacement and impulse all have a direction, so each pair B, C and D contains a vector.'
      - 'The trap is C. Length is a scalar, but displacement is length in a stated direction, so it is a vector.'
    hint: 'Check each pair. Does either quantity need a direction?'
    why:
      B: 'Momentum ($mv$) is a vector, and moment of a force has a sense of turning.'
      C: 'Displacement is a vector.'
      D: 'Impulse ($Ft$) is a vector, in the direction of the force.'

  5:
    answer: C
    steps:
      - 'Data: $l_1 = 0.4$ m, $T_1 = 2$ s, $l_2 = 0.8$ m, $T_2 = ?$, same place so the same $g$.'
      - 'Rule: the period of a simple pendulum is $T = 2\pi\sqrt{\dfrac{l}{g}}$, so $T \propto \sqrt{l}$ and $\dfrac{T_2}{T_1} = \sqrt{\dfrac{l_2}{l_1}}$.'
      - 'Substitute: $\dfrac{T_2}{2} = \sqrt{\dfrac{0.8}{0.4}} = \sqrt{2}$.'
      - '$T_2 = 2\sqrt{2}$ s, about 2.83 s. Longer pendulum, longer period, but not double.'
      - 'The trap is B, 4 s. Doubling the length does not double the period; it multiplies it by $\sqrt{2}$.'
    hint: 'The period goes with the square root of the length.'
    why:
      A: 'Multiplies the period by 4, as if it went with the square of the length.'
      B: 'Doubles the period, as if it went straight with the length.'
      D: 'Divides instead of multiplies; a longer pendulum swings more slowly.'

  6:
    answer: B
    steps:
      - 'Data: $u = 20\ \text{m s}^{-1}$, $v = 0$ (it halts), $a = -2\ \text{m s}^{-2}$ (a deceleration), $t = ?$'
      - 'Rule: the first equation of motion, $v = u + at$.'
      - 'Substitute: $0 = 20 + (-2)t$, so $2t = 20$.'
      - '$t = 10$ s. Losing 2 m s⁻¹ every second, 20 m s⁻¹ is gone in 10 seconds.'
      - 'The trap is D, 40 s: multiplying the speed by the deceleration instead of dividing.'
    hint: 'How many seconds does it take to lose 20 m s⁻¹ at 2 m s⁻¹ each second?'
    why:
      A: 'Divides 20 by $2a = 4$, borrowing the 2 from $v^{2} = u^{2} + 2as$; the time is $u \div a$.'
      C: 'Uses the speed itself as the time.'
      D: 'Multiplies the speed by the deceleration instead of dividing.'

  7:
    answer: D
    steps:
      - 'Data: $m = 70$ kg, the lift accelerates downwards at $a = 1.5\ \text{m s}^{-2}$, $g = 10\ \text{m s}^{-2}$. Loss in weight $= ?$'
      - 'Rule: Newton''s second law. Going down with acceleration $a$, the floor pushes up with $R = m(g - a)$, so the man feels lighter by $mg - R = ma$.'
      - 'True weight $mg = 70 \times 10 = 700$ N. Apparent weight $R = 70 \times (10 - 1.5) = 595$ N.'
      - 'Apparent loss in weight $= 700 - 595 = 105$ N, which is $ma = 70 \times 1.5$.'
      - 'The trap is B, 595 N. That is the apparent weight itself, what the scale reads, not the loss.'
    hint: 'The man feels lighter by exactly the force that gives him the acceleration.'
    why:
      A: '686 N is his true weight with g = 9.8 m s⁻², not a loss.'
      B: '595 N is the apparent weight, not the loss in weight.'
      C: '581 N is the apparent weight worked with g = 9.8 m s⁻², still not the loss.'

  8:
    answer: C
    steps:
      - 'Data: density of cork $= 0.25 \times 10^{3}\ \text{kg m}^{-3}$, density of liquid $= 1.25 \times 10^{3}\ \text{kg m}^{-3}$.'
      - 'Rule: the law of flotation. A floating body displaces its own weight of liquid, so fraction immersed $= \dfrac{\text{density of body}}{\text{density of liquid}}$.'
      - 'Substitute: fraction $= \dfrac{0.25 \times 10^{3}}{1.25 \times 10^{3}} = \dfrac{0.25}{1.25}$.'
      - 'Fraction immersed $= 0.2$, one-fifth. The cork is much lighter than the liquid, so most of it rides above, as it should.'
      - 'The trap is A, 0.8. That is the fraction above the surface, not the part under it.'
    hint: 'Divide the density of the floating body by the density of the liquid.'
    why:
      A: '0.8 is the fraction above the liquid, not the part immersed.'
      B: 'Would need the cork to be half as dense as the liquid.'
      D: 'Halves the right ratio by mistake.'

  9:
    answer: C
    steps:
      - 'Data: $v = 5\ \text{m s}^{-1}$, same mass $m$, $g = 10\ \text{m s}^{-2}$, $h = ?$'
      - 'Rule: set the potential energy equal to the kinetic energy, $mgh = \tfrac{1}{2}mv^{2}$. The mass cancels, so $h = \dfrac{v^{2}}{2g}$.'
      - 'Substitute: $h = \dfrac{5^{2}}{2 \times 10} = \dfrac{25}{20}$.'
      - '$h = 1.25$ m, which is 1.3 m to one decimal place.'
      - 'The trap is A, 25.0 m: forgetting to divide $v^{2}$ by $2g$.'
    hint: 'Write mgh = ½mv² and let the mass cancel.'
    why:
      A: 'Stops at v² = 25 and forgets to divide by 2g.'
      B: 'Would need a speed of 20 m s⁻¹, not 5 m s⁻¹.'
      D: 'Rounds 1.25 m down too far; to one decimal place it is 1.3 m.'

  10:
    answer: C
    steps:
      - 'Data: $m = 5000$ kg, $h = 60$ m, $t = 15$ min, $g = 10\ \text{m s}^{-2}$, $P = ?$'
      - 'Rule: power is the rate of doing work, $P = \dfrac{W}{t} = \dfrac{mgh}{t}$.'
      - 'Convert to SI: $t = 15 \times 60 = 900$ s.'
      - 'Work: $W = 5000 \times 10 \times 60 = 3.0 \times 10^{6}$ J. Power: $P = \dfrac{3.0 \times 10^{6}}{900} = 3333\ \text{J s}^{-1}$.'
      - '$P = 3.3 \times 10^{3}\ \text{J s}^{-1}$, about 3.3 kW, the size of a real borehole pump.'
      - 'The trap is D, $3.3 \times 10^{2}\ \text{J s}^{-1}$: leaving out $g$ and using the mass instead of the weight, $\dfrac{5000 \times 60}{900} = 333$ W.'
    hint: 'Turn the 15 minutes into seconds before you divide.'
    why:
      A: 'Far too big; at this power the $3.0 \times 10^{6}$ J of work would take only 12 s, but the pump takes 900 s.'
      B: 'Too big; at this power the $3.0 \times 10^{6}$ J of work would take only 120 s, but the pump takes 900 s.'
      D: 'Leaves out $g$, using the mass 5000 kg instead of the weight; $5000 \times 60 \div 900 = 333$ W.'

  11:
    answer: D
    steps:
      - 'The coefficient of friction is $\mu = \dfrac{F}{R}$, the friction force divided by the normal reaction.'
      - 'A perfectly smooth surface is one that gives no friction at all, so $F = 0$.'
      - 'Then $\mu = \dfrac{0}{R} = 0$.'
      - 'The trap is A, infinity. A very rough, gripping surface has a large $\mu$; a smooth one has none.'
    hint: 'How much friction does a perfectly smooth surface give?'
    why:
      A: 'Infinite friction would mean nothing could slide at all, the opposite of smooth.'
      B: 'μ = 1 is a rough surface where friction equals the normal reaction.'
      C: 'μ = 0.5 still means real friction; smooth means none.'

  12:
    answer: C
    steps:
      - 'Data: efficiency $= 90\% = 0.9$, load $= 180$ N, effort arm $= 2 \times$ load arm. Effort $= ?$'
      - 'Rule: for a lever the velocity ratio is $VR = \dfrac{\text{effort arm}}{\text{load arm}}$, and efficiency $= \dfrac{MA}{VR}$ with $MA = \dfrac{\text{load}}{\text{effort}}$.'
      - '$VR = 2$, so $MA = 0.9 \times 2 = 1.8$.'
      - 'Effort $= \dfrac{\text{load}}{MA} = \dfrac{180}{1.8} = 100$ N.'
      - 'Check: a perfect machine would need 90 N; friction wastes some work, so a little more effort, 100 N, is right.'
      - 'The trap is B, 90 N. That is the effort for a machine of 100% efficiency.'
    hint: 'Find the velocity ratio from the arms, then MA = efficiency × VR.'
    why:
      A: 'Less than the 90 N even a perfect machine would need; a real machine needs more effort, never less.'
      B: 'The effort for a perfect machine; ignores the 90% efficiency.'
      D: 'Does not follow from MA = 1.8; 180 ÷ 120 = 1.5.'

  13:
    answer: A
    steps:
      - 'Data: $F = 20$ N, extension $e = 50$ mm, $W = ?$'
      - 'Rule: the work done in stretching a spring within its elastic limit is the area under the force-extension line, $W = \tfrac{1}{2}Fe$.'
      - 'Convert to SI: $e = 50\ \text{mm} = 0.05$ m.'
      - 'Substitute: $W = \tfrac{1}{2} \times 20 \times 0.05 = 0.5$ J.'
      - 'The trap is forgetting the half, which gives 1.0 J, or leaving mm unconverted, which gives a huge answer.'
    hint: 'The force grows from zero to 20 N, so use the average force.'
    why:
      B: 'Too big; ½ × 20 × 0.05 is 0.5 J, and even leaving out the half gives only 1.0 J.'
      C: 'Not ½Fe; the extension is 0.05 m, not 0.2 m.'
      D: 'Five times the right value; even leaving out the half gives only 1.0 J.'

  14:
    answer: C
    steps:
      - 'Data: $p = 1.01 \times 10^{5}\ \text{N m}^{-2}$, $\rho = 1.03 \times 10^{3}\ \text{kg m}^{-3}$, $g = 10\ \text{m s}^{-2}$, $h = ?$'
      - 'Rule: pressure in a liquid rises with depth as $p = h\rho g$, so $h = \dfrac{p}{\rho g}$.'
      - 'Substitute: $h = \dfrac{1.01 \times 10^{5}}{1.03 \times 10^{3} \times 10} = \dfrac{1.01 \times 10^{5}}{1.03 \times 10^{4}}$.'
      - '$h = 9.8$ m, about 10.0 m. Every 10 m a diver goes down in the sea adds about one more atmosphere.'
      - 'The trap is D, 100 m: dividing by $\rho$ alone and forgetting $g$ in the bottom line.'
    hint: 'Rearrange p = hρg for h.'
    why:
      A: 'Two powers of ten too small; check the powers in the division.'
      B: 'A power of ten too small.'
      D: 'Leaves g out of the denominator, so the answer is ten times too big.'

  15:
    answer: C
    steps:
      - 'Data: $V_p = 4.2\ \text{m}^{3}$, $\rho_p = 7.2 \times 10^{2}\ \text{kg m}^{-3}$, $\rho_a = 8.4 \times 10^{2}\ \text{kg m}^{-3}$, $V_a = ?$'
      - 'Rule: mass $=$ density $\times$ volume. Same mass means $\rho_a V_a = \rho_p V_p$.'
      - 'Mass of petrol $= 720 \times 4.2 = 3024$ kg.'
      - '$V_a = \dfrac{3024}{840} = 3.6\ \text{m}^{3}$.'
      - 'Check: alcohol here is denser than petrol, so less of it is needed for the same mass; 3.6 m³ is less than 4.2 m³.'
      - 'The trap is D, 4.9 m³: multiplying by $\dfrac{840}{720}$ instead of $\dfrac{720}{840}$.'
    hint: 'Find the mass of the petrol first, then the volume of alcohol with that mass.'
    why:
      A: 'Does not come from the densities; far too small a volume.'
      B: 'Does not follow from equal masses.'
      D: 'Uses the density ratio upside down, so the denser liquid gets the bigger volume.'

  16:
    answer: D
    steps:
      - 'Data: ice point to steam point (0 °C to 100 °C) $= 400$ mm, $\theta = 20$ °C, length above the ice point $= ?$'
      - 'Rule: on a linear thermometer the length above the ice point is in proportion to the temperature, $\dfrac{l_\theta}{l_{100}} = \dfrac{\theta}{100}$.'
      - 'Substitute: $l_\theta = \dfrac{20}{100} \times 400$.'
      - '$l_\theta = 80$ mm above the ice point. Each degree is 4 mm.'
      - 'The trap is A, 20 mm: taking each degree as 1 mm.'
    hint: 'How many millimetres does one degree take up when 100 degrees take 400 mm?'
    why:
      A: 'Treats each degree as 1 mm.'
      B: 'Does not follow from 4 mm per degree.'
      C: 'Uses 3 mm per degree instead of 4.'

  17:
    answer: D
    steps:
      - 'Data: $l_0 = 100.0$ m at 30 °C, $\alpha = 2 \times 10^{-5}\ \text{K}^{-1}$, new temperature $-10$ °C, $l = ?$'
      - 'Rule: linear expansion, $l = l_0(1 + \alpha\Delta\theta)$.'
      - 'Temperature change: $\Delta\theta = -10 - 30 = -40$ K, a fall.'
      - 'Change in length: $l_0\alpha\Delta\theta = 100 \times 2 \times 10^{-5} \times (-40) = -0.08$ m.'
      - '$l = 100.0 - 0.08 = 99.92$ m. The wire cools, so it gets shorter, as it should.'
      - 'The trap is A, 100.08 m: forgetting that cooling makes the wire contract.'
    hint: 'Is the wire being heated or cooled, and by how many kelvin?'
    why:
      A: 'Right size of change, but adds it; a cooling wire contracts.'
      B: 'Takes the change as only 20 K and adds it.'
      C: 'Takes the change as only 20 K; from 30 °C to −10 °C is 40 K.'

  18:
    answer: D
    steps:
      - 'Data: $p = 10^{5}\ \text{N m}^{-2}$ (constant), $V_1 = 0.6\ \text{m}^{3}$, $V_2 = 1.2\ \text{m}^{3}$, $W = ?$'
      - 'Rule: work done by a gas expanding at constant pressure is $W = p\Delta V$.'
      - '$\Delta V = 1.2 - 0.6 = 0.6\ \text{m}^{3}$.'
      - 'Substitute: $W = 10^{5} \times 0.6 = 6.0 \times 10^{4}$ J. The unit checks: N m⁻² × m³ = N m = J.'
      - 'The trap is C, $6.0 \times 10^{5}$ J: losing track of the power of ten when multiplying by 0.6.'
    hint: 'Multiply the pressure by the change in volume.'
    why:
      A: 'Neither the size nor the power of ten fits p × ΔV.'
      B: 'Two powers of ten too big.'
      C: 'One power of ten too big; 10⁵ × 0.6 is 6 × 10⁴.'

  19:
    answer: B
    steps:
      - 'Data: $m_X = m_Y$, $Q_X = Q_Y$, $\Delta\theta_X = 2\Delta\theta_Y$. $c_X : c_Y = ?$'
      - 'Rule: heat supplied $Q = mc\Delta\theta$, so $c = \dfrac{Q}{m\Delta\theta}$.'
      - 'With $Q$ and $m$ the same, $c \propto \dfrac{1}{\Delta\theta}$: $\dfrac{c_X}{c_Y} = \dfrac{\Delta\theta_Y}{\Delta\theta_X} = \dfrac{1}{2}$.'
      - '$c_X : c_Y = 1 : 2$. X warms up twice as much because it needs only half as much heat per degree.'
      - 'The trap is A, 2 : 1: thinking the liquid that gets hotter has the bigger specific heat capacity. It is the other way round.'
    hint: 'A liquid with a small specific heat capacity heats up quickly.'
    why:
      A: 'Inverts the ratio; the liquid that heats up more has the smaller c.'
      C: 'Turns the ratio upside down and squares it; c goes with 1/Δθ, so the ratio is 1 : 2.'
      D: 'Squares the ratio; the temperature rise appears only once in Q = mcΔθ.'

  20:
    answer: A
    steps:
      - 'Fact: dissolved substances (impurities) raise the boiling point of water.'
      - 'Reason: the dissolved salt lowers the saturated vapour pressure of the water, so the water must get hotter, above 100 °C, before its vapour pressure equals the atmospheric pressure.'
      - 'Food in boiling salt water therefore sits in hotter water and cooks quicker.'
      - 'The trap is B. Atmospheric pressure does change boiling point, but it is the same over both pots here.'
    hint: 'What does the salt do to the temperature at which the water boils?'
    why:
      B: 'Both pots are under the same atmospheric pressure.'
      C: 'Nutrients in the food do not change the temperature of the boiling water.'
      D: 'The cooking is faster because the water is hotter, not because it conducts better.'

  21:
    answer: B
    steps:
      - 'Fact: steam at 100 °C carries extra energy, its latent heat of vaporisation, about 2.26 × 10⁶ J for every kilogram.'
      - 'When steam lands on the skin it first condenses to water at 100 °C and gives out all that latent heat, then the hot water cools and gives out more.'
      - 'Boiling water at 100 °C gives only the second part, so steam burns far worse, as anyone who has lifted the lid off a pot of boiling rice knows.'
      - 'The trap is C. Steam from boiling water is at the same 100 °C as the water; the difference is the latent heat, not the temperature.'
    hint: 'Both are at 100 °C. What extra energy does the steam give out when it turns back to water?'
    why:
      A: 'The high specific heat capacity of water applies to the boiling water too, so it does not explain the difference.'
      C: 'Steam from boiling water is at 100 °C, the same as the water.'
      D: 'The burn comes from condensation on the skin, not from convection.'

  22:
    answer: A
    steps:
      - 'Fact: a liquid boils when its saturated vapour pressure equals the pressure above it.'
      - 'Thirty metres below sea level there is more air above, so the atmospheric pressure is higher than at sea level.'
      - 'The water must be heated more to raise its vapour pressure to this higher pressure, so it boils above 100 °C.'
      - 'This is the pressure cooker idea; up on a high mountain like the Obudu plateau the opposite happens and water boils below 100 °C.'
      - 'The trap is B, which is true for high places, not low ones.'
    hint: 'Is the air pressure higher or lower below sea level?'
    why:
      B: 'That happens at high altitude, where the pressure is lower.'
      C: '100 °C is the boiling point only at standard atmospheric pressure.'
      D: 'At a fixed place the pressure is steady, so the boiling point is steady.'

  23:
    answer: B
    steps:
      - 'Fact: the rise or fall of a liquid in a narrow (capillary) tube is called capillarity, and it is caused by surface tension.'
      - 'Water wets glass (adhesion is stronger than cohesion), so surface tension pulls it up the tube. Mercury does not wet glass, so it is pulled down.'
      - 'The same pull draws kerosene up the wick of a lantern.'
      - 'The trap is A. Viscosity resists flow; it does not lift a liquid.'
    hint: 'What makes kerosene climb a lantern wick?'
    why:
      A: 'Viscosity only resists flow; it does not make the liquid rise or fall.'
      C: 'Friction opposes motion and cannot pull the liquid up.'
      D: 'Osmotic pressure needs a semi-permeable membrane.'

  24:
    answer: B
    steps:
      - 'Fact: conduction is the transfer of heat from molecule to molecule by vibration, without the medium itself moving along.'
      - 'The hotter molecules vibrate harder and pass energy to their neighbours, so heat travels along a spoon left in a pot of hot soup.'
      - 'In convection the heated fluid itself moves; radiation needs no medium at all.'
      - 'The trap is A, convection, which moves heat by currents of the medium, not by vibration in place.'
    hint: 'In which method do the particles stay in place and only vibrate?'
    why:
      A: 'Convection carries heat by the movement of the fluid itself.'
      C: 'Radiation travels as electromagnetic waves and needs no medium.'
      D: 'Diffusion is the spreading of particles, not a method of heat transfer.'

  25:
    answer: C
    steps:
      - 'Fact: a mechanical wave needs a material medium to travel through.'
      - 'A wave on a stretched string, such as a guitar or sonometer wire, is passed on by the string itself, so it is a mechanical wave.'
      - 'Electromagnetic waves, including microwaves, need no medium.'
      - 'The trap is D. Seismic waves are mechanical too, but the name is kept for waves through the earth.'
    hint: 'Does a wave on a string need the string to travel?'
    why:
      A: 'Electromagnetic waves need no medium; a string wave cannot exist without the string.'
      B: 'Microwaves are electromagnetic waves.'
      D: 'Seismic waves are the waves through the earth from earthquakes.'

  26:
    answer: C
    steps:
      - 'Fact: in a transverse wave the particles vibrate at right angles to the direction the wave travels; in a longitudinal wave they vibrate along it.'
      - 'Frequency, amplitude and period can be the same for both kinds of wave; they depend on the source.'
      - 'So the essential difference is the direction in which the particles vibrate.'
      - 'The trap is D. The period is set by the source and can be the same for both waves.'
    hint: 'Think of a rope shaken sideways and a spring pushed and pulled along its length.'
    why:
      A: 'Both kinds of wave can have the same frequency.'
      B: 'Both kinds of wave can have the same amplitude.'
      D: 'Both kinds of wave can have the same period.'

  27:
    answer: C
    steps:
      - 'Data: $v_1 = 340\ \text{m s}^{-1}$ at $\theta_1 = 0$ °C, $\theta_2 = 100$ °C, $v_2 = ?$'
      - 'Rule: the speed of sound in a gas is proportional to the square root of the absolute temperature, $\dfrac{v_2}{v_1} = \sqrt{\dfrac{T_2}{T_1}}$.'
      - 'Convert to kelvin: $T_1 = 0 + 273 = 273$ K and $T_2 = 100 + 273 = 373$ K.'
      - 'Substitute: $v_2 = 340\sqrt{\dfrac{373}{273}} = 340 \times 1.169 = 397\ \text{m s}^{-1}$.'
      - 'Check: hotter air carries sound faster, but only a little faster, since the speed goes with a square root.'
      - 'The trap is B, 440 m s⁻¹, which needs a much bigger rise in temperature; and A is bigger still.'
    hint: 'Change both temperatures to kelvin first.'
    why:
      A: 'Too big; the speed rises only by the factor √(373/273) = 1.169.'
      B: 'Too big; it does not follow from √(373/273).'
      D: 'Sound speeds up in hotter air, it does not slow down.'

  28:
    answer: A
    steps:
      - 'Data: fundamental $f_0 = 450$ Hz on a stretched string, fifth overtone $= ?$'
      - 'Rule: a string fixed at both ends gives every harmonic, $f_n = nf_0$. The first overtone is the 2nd harmonic, so the fifth overtone is the 6th harmonic.'
      - 'Substitute: $f = 6 \times 450 = 2700$ Hz.'
      - 'The trap is $5 \times 450 = 2250$ Hz: counting the fifth overtone as the fifth harmonic.'
    hint: 'The fundamental is the first harmonic, and the first overtone is the second harmonic.'
    why:
      B: 'Adds instead of multiplying.'
      C: 'Divides instead of multiplying; overtones are higher than the fundamental.'
      D: 'Divides 450 by 6; overtones are multiples, not fractions.'

  29:
    answer: A
    steps:
      - 'Data: object height $h_o = 1.5$ m, object distance $u = 3$ m, image distance $v = 0.1$ m, image height $h_i = ?$'
      - 'Rule: by similar triangles through the pinhole, magnification $m = \dfrac{h_i}{h_o} = \dfrac{v}{u}$.'
      - 'Substitute: $h_i = 1.5 \times \dfrac{0.1}{3}$.'
      - '$h_i = 0.05$ m, that is 5 cm. A small, inverted image, as a pinhole camera gives.'
      - 'The trap is B, 0.15 m: multiplying 1.5 by 0.1 and forgetting to divide by 3.'
    hint: 'Image height ÷ object height = image distance ÷ object distance.'
    why:
      B: 'Multiplies by 0.1 but forgets to divide by 3 m.'
      C: 'Six times too big; the screen is 30 times closer than the man, so the image is 1.5 ÷ 30 = 0.05 m.'
      D: 'Not linked to the magnification at all.'

  30:
    answer: A
    steps:
      - 'Fact: every line from the centre of curvature C to a concave mirror is a radius, and a radius meets the mirror along the normal.'
      - 'So a ray through C strikes the mirror along the normal: its angle of incidence is 0°.'
      - 'By the law of reflection the angle of reflection is also 0°, so the ray goes straight back along its own path.'
      - 'The trap is D, 180°. The ray does turn round, but angles of reflection are measured from the normal, and here that angle is 0°.'
    hint: 'What is the angle between a radius and the normal?'
    why:
      B: 'A ray at 45° to the normal does not pass through C.'
      C: '90° would mean the ray grazes along the mirror.'
      D: '180° is the turn of the ray''s direction, not the angle of reflection measured from the normal.'

  31:
    answer: D
    steps:
      - 'Data: glass $n_g = 1.52$, water $n_w = 1.33$. The refracted ray runs along the boundary, so the angle of refraction is 90°. $i = ?$'
      - 'Rule: when the angle of refraction is 90°, the angle of incidence is the critical angle $c$. Snell''s law $n_g \sin c = n_w \sin 90°$ gives $\sin c = \dfrac{n_w}{n_g}$.'
