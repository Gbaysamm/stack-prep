format_version: 1
exam_year: 2014
subject: PHY
explanations:
  2:
    answer: C
    steps:
      - 'Fact: the least possible error of a scale reading is half of its smallest division.'
      - 'Reason: when you read a metre rule you can judge to the nearest mark, so your reading can be out by at most half a mark either way.'
      - 'The smallest division on a metre rule is 1 mm, so the least possible error is 1 mm ÷ 2 = 0.5 mm.'
      - 'Example: measuring a classroom desk with a metre rule, you might read 75.3 cm, and you can trust it only to about ±0.05 cm.'
      - 'The trap is B, 1.0 mm. That is the smallest division itself, not the error in reading it.'
    hint: 'What is the smallest division on a metre rule, and how much of it can you misjudge?'
    why:
      A: '0.1 mm is the kind of precision of a vernier caliper, not a metre rule.'
      B: '1.0 mm is the smallest division; the error is half of it.'
      D: '0.2 mm does not come from the metre rule''s 1 mm division.'

  3:
    answer: C
    steps:
      - 'Fact: a vector quantity needs both a size (magnitude) and a direction to be fully stated. A scalar needs only a size.'
      - 'Displacement is the distance moved in a stated direction, for example "500 m due north of the motor park". So it is a vector.'
      - 'Distance only says how far, for example 500 m, with no direction, so it is a scalar.'
      - 'Temperature and mass have size only. Nobody says a bag of rice is 50 kg eastwards.'
      - 'The trap is B. Distance and displacement sound alike, but only displacement carries a direction.'
    hint: 'Which of these would change if you walked the same length the other way?'
    why:
      A: 'Temperature has magnitude only, so it is a scalar.'
      B: 'Distance has magnitude only; it is displacement that has direction.'
      D: 'Mass has magnitude only, so it is a scalar.'

  4:
    answer: A
    steps:
      - 'Rule: a vector has magnitude and direction; a scalar has magnitude only.'
      - 'Torque (moment of a force) turns a body one way or the other, clockwise or anticlockwise, about a stated axis. It has direction, so it is a vector.'
      - 'Momentum is mass × velocity, $p = mv$. Velocity is a vector, so momentum is a vector, pointing the way the body moves.'
      - 'Electrical potential (volts) and kinetic energy, $\tfrac{1}{2}mv^{2}$, have size only, so they are scalars.'
      - 'So the vectors are II and IV. The trap is to think kinetic energy is a vector because it involves velocity; squaring the speed removes the direction.'
    hint: 'Which two of these depend on which way something turns or moves?'
    why:
      B: 'Electrical potential (I) is a scalar.'
      C: 'Electrical potential and kinetic energy are both scalars.'
      D: 'Kinetic energy (III) is a scalar, because it depends on speed squared.'

  5:
    answer: D
    steps:
      - 'Fact: translational motion is motion of a whole body from one place to another; rotational motion is spinning about an axis.'
      - 'Each wheel of a moving car spins round its axle, so it has rotational motion.'
      - 'At the same time the wheel travels along the road with the car, so it also has translational motion.'
      - 'Watch a danfo pulling away from the bus stop: the tyres spin and also move down the road. That is both motions at once.'
      - 'The trap is C. Oscillatory motion is a to-and-fro swing like a pendulum, which a wheel does not do.'
    hint: 'Does the wheel only spin, or does it also go somewhere?'
    why:
      A: 'A wheel does not vibrate to and fro as its main motion; it spins.'
      B: 'Random motion is the zigzag of gas molecules, not a rolling wheel.'
      C: 'The wheel does not oscillate; it spins and moves forward.'

  6:
    answer: B
    steps:
      - 'Rule: on a velocity-time graph, acceleration is the gradient (slope). In symbols, $a = \dfrac{\Delta v}{\Delta t}$.'
      - 'Zero acceleration means the velocity does not change, so the graph is a horizontal (level) line.'
      - 'MN slopes up (the body speeds up), SP slopes up more steeply, and PQ slopes down (the body slows to rest).'
      - 'NS is level: the velocity is constant there, so the gradient, and the acceleration, are zero.'
      - 'The trap is to choose the peak region near P because the speed is greatest there. A large speed is not the same as a large or zero acceleration; what matters is the slope.'
    hint: 'Acceleration is the slope of a velocity-time graph. Where is the line flat?'
    why:
      A: 'MN slopes upwards, so the body is accelerating.'
      C: 'SP slopes upwards steeply, so the acceleration is large and positive.'
      D: 'PQ slopes downwards, so the body is decelerating.'

  7:
    answer: A
    steps:
      - 'Data: $u = 0$ (from rest), $a = 3\ \text{m s}^{-2}$, $s = 24\ \text{m}$, $v = ?$'
      - 'Time is not given, so use the equation of motion that links $v$, $u$, $a$ and $s$: $v^{2} = u^{2} + 2as$.'
      - 'All the units are already SI (m s⁻² and m).'
      - 'Substitute: $v^{2} = 0^{2} + 2 \times 3 \times 24 = 144$, so $v = \sqrt{144} = 12\ \text{m s}^{-1}$.'
      - 'Check: a car gaining 3 m s⁻¹ each second covers 24 m in 4 s, and 3 × 4 = 12 m s⁻¹. It agrees.'
      - 'The trap is B, 144 m s⁻¹. That is $v^{2}$; you must take the square root.'
    hint: 'No time is given. Which equation of motion uses u, a and s only?'
    why:
      B: '144 is v², not v; take the square root.'
      C: '72 is a × s, which is not an equation of motion.'
      D: '36 is a × s ÷ 2, which is not an equation of motion.'

  8:
    answer: D
    steps:
      - 'Data: $R = 6.4 \times 10^{6}\ \text{m}$, $g = 10\ \text{m s}^{-2}$, escape velocity $v_{e} = ?$'
      - 'Escape velocity is the least speed at launch that lets a body leave the earth''s gravitational field for good: $v_{e} = \sqrt{2gR}$.'
      - 'Substitute: $v_{e} = \sqrt{2 \times 10 \times 6.4 \times 10^{6}} = \sqrt{1.28 \times 10^{8}}$.'
      - 'Work it out: $\sqrt{1.28 \times 10^{8}} = 1.13 \times 10^{4}\ \text{m s}^{-1}$.'
      - 'Convert to km s⁻¹: divide by 1000, giving 11.3 km s⁻¹. That matches the well-known value of about 11 km s⁻¹.'
      - 'The trap is to forget the 2 and use $\sqrt{gR}$, which gives 8 km s⁻¹, the speed for a low orbit, not for escape.'
    hint: 'Escape velocity is √(2gR). Watch the powers of ten.'
    why:
      A: '25.3 km s⁻¹ is more than twice the value given by √(2gR).'
      B: '4.2 km s⁻¹ is far below even orbital speed.'
      C: '4.0 km s⁻¹ is far below even orbital speed.'

  9:
    answer: C
    steps:
      - 'Data: weight on earth $W_{E} = 80\ \text{N}$, $g_{P} = \tfrac{1}{3}g_{E}$, $W_{P} = ?$'
      - 'Rule: weight is mass × acceleration due to gravity, $W = mg$. The mass of a body is the same everywhere, so weight is proportional to $g$.'
      - 'So $W_{P} = W_{E} \times \dfrac{g_{P}}{g_{E}} = 80 \times \dfrac{1}{3}$.'
      - 'Work it out: $80 \div 3 = 26.7\ \text{N}$, which is about 27 N.'
      - 'Check: a smaller pull of gravity should give a smaller weight, and 27 N is one-third of 80 N.'
      - 'The trap is A or D. Both are far more than a third of 80 N, and 48 N is more than half of it. Mass stays the same; only the weight falls, in step with $g$.'
    hint: 'Mass does not change from planet to planet. What happens to W = mg if g is divided by 3?'
    why:
      A: '48 N does not come from dividing 80 N by 3.'
      B: '12 N is far less than a third of 80 N.'
      D: '36 N is not 80 N ÷ 3.'

  10:
    answer: B
    steps:
      - 'Fact: a body acted on by parallel forces is in equilibrium when (1) the vector sum of the forces is zero, and (2) the sum of the clockwise moments equals the sum of the anticlockwise moments about any point.'
      - 'Reason: if the forces did not add to zero there would be a resultant force, and by Newton''s second law the body would accelerate.'
      - 'Example: a metre rule balanced on a knife edge with weights hung on it. The upward push of the knife edge equals the total downward weight.'
      - 'So the vector sum of the forces must be zero.'
      - 'The trap is to think "positive" because the upward forces are positive. Upward and downward forces must cancel, giving zero.'
    hint: 'If there were a resultant force, what would the body do?'
    why:
      A: '"Average" is not a condition of equilibrium; the forces must cancel.'
      C: 'A negative resultant is still a resultant force, so the body would accelerate.'
      D: 'A positive resultant would make the body accelerate.'

  11:
    answer: D
    steps:
      - 'Fact: when three coplanar, non-parallel forces keep a body in equilibrium, their lines of action all pass through one point (they are concurrent).'
      - 'Reason: two of the forces meet at a point. If the third did not pass through that point, it would have a moment about it, and the body would turn.'
      - 'The three forces can also be drawn head to tail to form a closed triangle (the triangle of forces), in both magnitude and direction.'
      - 'Example: a picture hanging from a nail by two strings. The two tensions and the weight all meet at one point.'
      - 'The trap is B or C. A force must be represented in both magnitude and direction, not one alone.'
    hint: 'If the third force missed the meeting point of the other two, what would it cause?'
    why:
      A: 'The forces are non-parallel, so their lines of action cannot be parallel.'
      B: 'Forces must be represented in both magnitude and direction.'
      C: 'Forces must be represented in both magnitude and direction.'

  12:
    answer: C
    steps:
      - 'Data: $m = 20\ \text{kg}$, $h = 10\ \text{m}$, $g = 10\ \text{m s}^{-2}$, kinetic energy just before impact $= ?$'
      - 'Law of conservation of energy: as the object falls (ignoring air resistance), the potential energy it loses becomes kinetic energy. So KE at the ground $= mgh$.'
      - 'All units are SI.'
      - 'Substitute: $\text{KE} = 20 \times 10 \times 10 = 2000\ \text{J}$.'
      - 'Check: the unit kg × m s⁻² × m is the joule, and a 20 kg bag falling 10 m carrying 2 kJ is reasonable.'
      - 'The trap is A, 200 J. That is $mg$, the weight in newtons, which is a force, not an energy.'
    hint: 'All the potential energy at the top turns into kinetic energy at the bottom.'
    why:
      A: '200 is mg, the weight in newtons, not the energy.'
      B: 'Finds v² = 2gh = 200 and then forgets the half in ½mv²: 20 × 200 = 4000 J.'
      D: '500 J is only a quarter of the 2000 J of potential energy lost, and all of it becomes kinetic energy.'

  13:
    answer: C
    steps:
      - 'Fact: the energy locked in the nucleus is released as heat in a nuclear reactor, and that heat is used to generate electrical energy.'
      - 'How: the heat boils water into steam, the steam turns a turbine, and the turbine drives a generator. It works like a thermal power station, with the reactor in place of a gas or coal furnace.'
      - 'Countries such as France get most of their electricity this way.'
      - 'Kinetic and mechanical energy appear along the way (in the spinning turbine), but the useful product sent out on the wires is electrical energy.'
      - 'The trap is A or B. The turbine''s motion is only a middle step; the station exists to generate electricity.'
    hint: 'What does a nuclear power station send out on its cables?'
    why:
      A: 'Kinetic energy of the turbine is only a middle step.'
      B: 'Mechanical energy of the turbine is only a middle step.'
      D: 'The heat is not stored as potential energy; it is used to make electricity.'

  14:
    answer: C
    steps:
      - 'Data: efficiency $= 75\%$, load $L = 1000\ \text{N}$, $\text{VR} = 4$, effort $E = ?$'
      - 'Rule: efficiency is mechanical advantage divided by velocity ratio, $\text{efficiency} = \dfrac{\text{MA}}{\text{VR}} \times 100\%$, and $\text{MA} = \dfrac{L}{E}$.'
      - 'Find the MA: $\text{MA} = 0.75 \times 4 = 3$.'
      - 'Find the effort: $E = \dfrac{L}{\text{MA}} = \dfrac{1000}{3} = 333.33\ \text{N}$.'
      - 'Check: with no friction the effort would be 1000 ÷ 4 = 250 N; friction means a larger effort is needed, and 333.33 N is larger.'
      - 'The trap is D, 334.33 N, or A, 343.33 N. They look almost the same; do the division carefully.'
    hint: 'Use efficiency × VR to get the MA first, then MA = load ÷ effort.'
    why:
      A: '343.33 N is a slip in the division 1000 ÷ 3.'
      B: '233.33 N is less than the ideal effort of 250 N, which is impossible for a real machine.'
      D: '334.33 N is a slip in the division 1000 ÷ 3.'

  15:
    answer: B
    steps:
      - 'Data: load $L = 800\ \text{N}$, effort $E = 250\ \text{N}$, wheel radius $R = 800\ \text{mm}$, axle radius $r = 200\ \text{mm}$, efficiency $= ?$'
      - 'For a wheel and axle the velocity ratio is the ratio of the radii, $\text{VR} = \dfrac{R}{r}$. The mechanical advantage is $\text{MA} = \dfrac{L}{E}$, and efficiency $= \dfrac{\text{MA}}{\text{VR}} \times 100\%$.'
      - 'No conversion is needed for the radii, because both are in mm and only their ratio counts: $\text{VR} = \dfrac{800}{200} = 4$.'
      - '$\text{MA} = \dfrac{800}{250} = 3.2$.'
      - 'Efficiency $= \dfrac{3.2}{4} \times 100\% = 80\%$.'
      - 'The trap is to divide the load by the wheel radius, mixing the two ratios. Keep force ÷ force for MA and distance ÷ distance for VR.'
    hint: 'Find MA from the forces and VR from the radii, then divide.'
    why:
      A: '90% would need an MA of 3.6.'
      C: '85% would need an MA of 3.4.'
      D: '87% would need an MA of about 3.5.'

  16:
    answer: D
    steps:
      - 'Data: $F = 500\ \text{N}$, $A = 0.2\ \text{m}^{2}$, tensile stress $= ?$'
      - 'Tensile stress is the force per unit cross-sectional area: $\text{stress} = \dfrac{F}{A}$.'
      - 'The units are already SI (N and m²).'
      - 'Substitute: $\text{stress} = \dfrac{500}{0.2} = 2500\ \text{N m}^{-2} = 2.5 \times 10^{3}\ \text{N m}^{-2}$.'
      - 'Check: dividing by a number less than 1 makes the answer bigger than 500, and the unit N m⁻² is a pressure-type unit, as stress should be.'
      - 'The trap is B, 1.0 × 10² N m⁻². That multiplies force by area instead of dividing.'
    hint: 'Stress is force divided by area. What is 500 ÷ 0.2?'
    why:
      A: '2.5 × 10⁴ N m⁻² is ten times too large; check the power of ten.'
      B: '1.0 × 10² is 500 × 0.2, a multiplication instead of a division.'
      C: 'Check it: 1.0 × 10³ N m⁻² over 0.2 m² is only 200 N, not 500 N.'

  17:
    answer: A
    steps:
      - 'Fact: the elastic limit is the greatest load a wire can take and still return to its original length when the load is removed.'
      - 'From O to Q the graph is a straight line: extension is proportional to load (Hooke''s law) and the wire is elastic. Q marks the end of this region, the elastic limit.'
      - 'Beyond Q the wire is permanently stretched. At R, the yield point, it suddenly stretches a lot for little extra load.'
      - 'S is the greatest load the wire can bear (the breaking stress), and T is where it snaps.'
      - 'The trap is B, R. The yield point comes after the elastic limit, once the wire has already started to flow plastically.'
    hint: 'The wire behaves elastically while the graph is a straight line. Where does the straight part end?'
    why:
      B: 'R is the yield point, already past the elastic limit.'
      C: 'S is the maximum load (breaking stress), not the elastic limit.'
      D: 'T is the breaking point.'

  18:
    answer: C
    steps:
      - 'Fact: dew is the small droplets of water that form on grass and other cool surfaces in the early morning.'
      - 'Reason: at night the grass loses heat by radiation and cools. When it falls below the dew point, water vapour in the air next to it condenses on it as droplets.'
      - 'Walk across a football field before school in harmattan or rainy season mornings and your shoes get wet. That is dew.'
      - 'Mist and fog are tiny droplets floating in the air itself, not sitting on the grass.'
      - 'The trap is D, fog. Fog also comes from condensation, but it hangs in the air and cuts visibility.'
    hint: 'Which one forms on a surface rather than floating in the air?'
    why:
      A: 'Hail is lumps of ice falling from storm clouds.'
      B: 'Mist is droplets suspended in the air near the ground.'
      D: 'Fog is thick droplets suspended in the air, not on the grass.'

  19:
    answer: A
    steps:
      - 'Data: $\theta = 20\ ^{\circ}\text{C}$, $T = ?$ in kelvin.'
      - 'Rule: the Kelvin (absolute) scale has the same size of degree as the Celsius scale but starts at absolute zero, which is −273 °C. So $T = \theta + 273$.'
      - 'Substitute: $T = 20 + 273 = 293\ \text{K}$.'
      - 'Check: room temperature in Lagos is close to 300 K, so 293 K is sensible. Note that kelvin has no degree sign.'
      - 'The trap is B, 68. That is 20 °C on the Fahrenheit scale, from $\tfrac{9}{5} \times 20 + 32 = 68$, not the Kelvin scale.'
    hint: 'Add 273 to change from degrees Celsius to kelvin.'
    why:
      B: '68 is the Fahrenheit value of 20 °C.'
      C: '36 is 20 × 9/5, part of the Fahrenheit conversion only.'
      D: '20 is just the Celsius number; the Kelvin scale starts 273 lower.'

  20:
    answer: A
    steps:
      - 'Data: $V_{1} = 2 \times 10^{4}\ \text{cm}^{3}$, $\alpha = 9 \times 10^{-6}\ \text{K}^{-1}$, $\Delta\theta = 50 - 20 = 30\ \text{K}$, $V_{2} = ?$'
      - 'Rule: the cubic expansivity of a solid is three times its linear expansivity, $\gamma = 3\alpha$, and the increase in volume is $\Delta V = V_{1}\gamma\Delta\theta$.'
      - '$\gamma = 3 \times 9 \times 10^{-6} = 2.7 \times 10^{-5}\ \text{K}^{-1}$. A rise of 30 °C is a rise of 30 K. We keep cm³, since the answer is in cm³.'
      - 'Substitute: $\Delta V = 2 \times 10^{4} \times 2.7 \times 10^{-5} \times 30 = 16.2\ \text{cm}^{3}$.'
      - 'New volume: $V_{2} = 20\,000 + 16.2 = 20\,016.2\ \text{cm}^{3}$.'
      - 'The trap is B, 20 005.4 cm³, which uses $\alpha$ instead of $3\alpha$. A volume change needs the cubic expansivity.'
    hint: 'The bottle grows in all three dimensions. What is the cubic expansivity in terms of α?'
    why:
      B: 'Uses the linear expansivity α instead of 3α: the increase would be only 5.4 cm³.'
      C: 'An increase of 8.1 cm³ is only half the true 16.2 cm³; it would need γ = 1.5α, but for a solid γ = 3α.'
      D: 'An increase of 13.5 cm³ is short of the true 16.2 cm³; it would need γ = 2.5α, but for a solid γ = 3α.'

  21:
    answer: D
    steps:
      - 'Rule: Charles''s law says that at constant pressure the volume of a fixed mass of gas is directly proportional to its absolute temperature: $\dfrac{V}{T} = \text{constant}$.'
      - 'Write $\dfrac{V}{T}$ in the form $P^{a}V^{b}T^{c}$: $\dfrac{V}{T} = P^{0}V^{1}T^{-1}$.'
      - 'Pressure is constant, so it does not appear: $a = 0$. Volume is to the power one: $b = 1$. Temperature is in the denominator: $c = -1$.'
      - 'So $a = 0$, $b = 1$ and $c = -1$.'
      - 'The trap is C, with $c = 1$. That gives $VT = \text{constant}$, which would mean the gas shrinks when heated.'
    hint: 'Write Charles''s law as V ÷ T = constant. What power does T carry when it is on the bottom?'
    why:
      A: 'a = 1, b = 1, c = 0 gives PV = constant, which is Boyle''s law.'
      B: 'a = 1, b = 0, c = −1 gives P/T = constant, which is the pressure law.'
      C: 'c = 1 gives VT = constant, which is not a gas law.'

  22:
    answer: A
    steps:
      - 'Fact: the heat capacity of a body is the quantity of heat needed to raise the temperature of the whole body by 1 K. Its unit is J K⁻¹.'
      - 'Specific heat capacity is the heat needed to raise 1 kg of a substance by 1 K, in J kg⁻¹ K⁻¹. It is per kilogram, not for the whole body.'
      - 'So for a given body, heat capacity = mass × specific heat capacity, $C = mc$.'
      - 'Example: a big iron pot on the fire has a bigger heat capacity than a small iron cup, though both have the same specific heat capacity.'
      - 'The trap is C. The question says "a body", not "1 kg of a substance", so it is heat capacity.'
    hint: 'Is the question about one kilogram, or about the whole body?'
    why:
      B: 'Internal energy is the total energy of the molecules, not heat per kelvin.'
      C: 'Specific heat capacity is per kilogram, not for the whole body.'
      D: 'Latent heat of fusion changes the state with no change in temperature.'

  23:
    answer: B
    steps:
      - 'Fact: a pure substance melts and solidifies (freezes) at the same temperature. Ice melts at 0 °C and water freezes at 0 °C.'
      - 'Reason: at that temperature the solid and liquid can exist together; adding heat melts the solid, removing heat freezes the liquid, and the temperature stays fixed while the latent heat is taken in or given out.'
      - 'So the melting point is the same as the solidification temperature.'
      - 'Example: shea butter or candle wax melts and sets again at the same temperature.'
      - 'The trap is C. "Liquidification" is not the term used; the matching change for melting is solidification.'
    hint: 'Melting turns a solid into a liquid. What is the reverse change, and at what temperature does it happen?'
    why:
      A: 'Vapour pressure is a pressure, not a temperature.'
      C: 'Turning a gas into a liquid is condensation, at the boiling point, not the melting point.'
      D: 'The melting point is a temperature, not a pressure.'

  24:
    answer: D
    steps:
      - 'Fact: the dew point is the temperature at which the water vapour present in the air is just enough to saturate it.'
      - 'Reason: cold air can hold less water vapour. As air cools, it reaches a temperature where the vapour it holds saturates it; any further cooling makes vapour condense as dew or mist.'
      - 'Example: in the cold harmattan early morning the air near the ground cools to its dew point, and the grass is wet.'
      - 'Boiling point and ice point are fixed points of water, not about the vapour in air.'
      - 'The trap is C. "Saturation point" sounds right, but the name of this temperature is the dew point.'
    hint: 'At this temperature the vapour begins to come out as droplets on the grass.'
    why:
      A: 'The boiling point is where the saturated vapour pressure equals the atmospheric pressure.'
      B: 'The ice point is the melting point of pure ice, 0 °C.'
      C: 'This is not the standard name for the temperature; it is the dew point.'

  25:
    answer: C
    steps:
      - 'Fact: convection is the transfer of heat by the movement of the heated fluid itself.'
      - 'Reason: the liquid at the bottom is heated, expands and becomes less dense. It rises, and cooler, denser liquid sinks to take its place. This sets up convection currents.'
      - 'So convection is caused by the variation of density within the liquid.'
      - 'Example: heat water in a pot on a gas cooker and drop in a few grains of pepper or a crystal of potassium permanganate. You see the water rise in the middle and sink at the sides.'
      - 'The trap is D. Expansion happens, but it matters only because it changes the density; the density difference is what drives the flow.'
    hint: 'Why does warm liquid rise and cool liquid sink?'
    why:
      A: 'Latent heat of vaporization is for boiling, not for convection currents.'
      B: 'Vibration of molecules about fixed positions passes heat by conduction.'
      D: 'Expansion only matters because it lowers the density; density variation is the cause.'

  26:
    answer: C
    steps:
      - 'Data: wavelength (distance between successive crests) $\lambda = 15\ \text{cm}$, $v = 300\ \text{m s}^{-1}$, $f = ?$'
      - 'The wave equation: speed equals frequency times wavelength, $v = f\lambda$, so $f = \dfrac{v}{\lambda}$.'
      - 'Convert to SI: $\lambda = 15\ \text{cm} = 0.15\ \text{m}$.'
      - 'Substitute: $f = \dfrac{300}{0.15} = 2000\ \text{Hz} = 2.0 \times 10^{3}\ \text{Hz}$.'
      - 'The trap is A, 2.0 × 10² Hz. It changes 15 cm to 1.5 m instead of 0.15 m. Always change cm to m carefully before dividing.'
    hint: 'Change 15 cm to metres first, then use f = v ÷ λ.'
    why:
      A: 'Changes 15 cm to 1.5 m instead of 0.15 m, so it is ten times too small.'
      B: '4.5 × 10³ comes from multiplying 300 × 15, not dividing.'
      D: 'Multiplies 300 by 1.5 instead of dividing by 0.15.'

  27:
    answer: C
    steps:
      - 'Data: echo time $t = 0.8\ \text{s}$, speed of sound $v = 330\ \text{m s}^{-1}$, distance to hill $d = ?$'
      - 'Rule: in an echo the sound travels to the hill and back, a total distance of $2d$. So $2d = vt$, or $d = \dfrac{vt}{2}$.'
      - 'Units are SI.'
      - 'Substitute: $d = \dfrac{330 \times 0.8}{2} = \dfrac{264}{2} = 132\ \text{m}$.'
      - 'The trap is D, 264 m. That is the whole there-and-back path; the boy is only half that distance from the hill.'
    hint: 'The clap goes to the hill and comes back. How much of the total path is the distance to the hill?'
    why:
      A: '528 m doubles the path instead of halving it.'
      B: '66 m halves the distance twice.'
      D: '264 m is the total there-and-back distance.'

  28:
    answer: C
    steps:
      - 'Data: $\lambda = 40\ \text{cm}$, tube closed at the bottom by water, $L = ?$'
      - 'Rule: in a closed pipe there is a node (N) at the closed end and an antinode (A) at the open end. The distance from a node to the next antinode is a quarter of a wavelength, $\dfrac{\lambda}{4}$.'
      - 'Read the diagram from the open top down: antinode, node, antinode, node at the water. That is three quarter-wavelengths, so $L = \dfrac{3\lambda}{4}$. This is the second resonance.'
      - 'Substitute: $L = \dfrac{3 \times 40}{4} = 30\ \text{cm}$.'
      - 'The trap is A, 10 cm, which is only $\dfrac{\lambda}{4}$, the first resonance. Count the loops on the diagram.'
    hint: 'Count how many quarter-wavelengths fit between the open top and the water.'
    why:
      A: '10 cm is λ/4, the first resonance, not the pattern drawn.'
      B: '20 cm is λ/2; a closed tube resonates at odd quarter-wavelengths only.'
      D: '40 cm is a whole wavelength, which a closed tube cannot hold with an antinode at the top.'

  29:
    answer: A
    steps:
