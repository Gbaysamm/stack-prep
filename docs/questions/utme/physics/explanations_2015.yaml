format_version: 1
exam_year: 2015
subject: PHY
explanations:
  1:
    answer: A
    steps:
      - 'Data: original length $l = 10$ cm, extension $e = 6$ mm, load = 100 N, strain = ?'
      - 'Strain is extension divided by original length: $\text{strain} = \dfrac{e}{l}$. It is a ratio of two lengths, so it has no unit.'
      - 'Put both lengths in metres: $e = 6\ \text{mm} = 0.006\ \text{m}$ and $l = 10\ \text{cm} = 0.10\ \text{m}$.'
      - 'Strain $= \dfrac{0.006}{0.10} = 0.06 = 6 \times 10^{-2}$.'
      - 'Check: the rubber stretched 6 mm out of 100 mm, which is 6 parts in 100. That agrees.'
      - 'The trap is D. It turns 10 cm into 1000 mm instead of 100 mm, so the strain comes out ten times too small. The 100 N load is not needed for strain; you would need it for stress.'
    hint: 'Write the extension and the original length in the same unit before you divide.'
    why:
      B: 'Divides 6 by 1, as if strain were just the extension; strain is a ratio of lengths.'
      C: 'Divides 6 mm by 0.1 m, mixing millimetres with metres; strain cannot be bigger than 1 for a small stretch like this.'
      D: 'Turns 10 cm into 1000 mm instead of 100 mm (6 ÷ 1000), so it comes out ten times too small.'

  2:
    answer: C
    steps:
      - 'Look at what goes in and what comes out. Parallel rays from a very distant object enter the objective lens.'
      - 'The objective brings them to a focus at its focal point, a distance $f_o$ behind it. That point is also the focal point of the eyepiece, $f_e$ in front of it.'
      - 'So the lenses are $f_o + f_e$ apart, and the rays leave the eyepiece parallel again. This is normal adjustment, with the final image at infinity.'
      - 'Two converging lenses, with a long-focus objective and a short-focus eyepiece, separated by $f_o + f_e$: this is the astronomical telescope.'
      - 'The trap is A. A compound microscope also has two convex lenses, but it looks at a near object, so the rays entering the objective spread out from a point. They are not parallel.'
    hint: 'Are the rays entering the objective coming from a near object or a very far one?'
    why:
      A: 'A microscope views a near object, so its incoming rays diverge from a point; here they arrive parallel.'
      B: 'Prism binoculars use prisms to turn the light; there are no prisms here.'
      D: 'A periscope uses two plane mirrors or prisms at 45°, not two lenses.'

  3:
    answer: B
    steps:
      - 'Data: two 20 Ω resistors in parallel, that pair in series with 15 Ω, total resistance $R = ?$'
      - 'For resistors in parallel, $\dfrac{1}{R_p} = \dfrac{1}{R_1} + \dfrac{1}{R_2}$. For two equal resistors this gives half of one of them.'
      - '$\dfrac{1}{R_p} = \dfrac{1}{20} + \dfrac{1}{20} = \dfrac{2}{20}$, so $R_p = 10\ \Omega$.'
      - 'Resistors in series simply add: $R = 15 + R_p = 15 + 10 = 25\ \Omega$.'
      - 'Check: the parallel pair (10 Ω) is less than either 20 Ω resistor, as it must be, and the total is more than the 15 Ω on its own, because a series resistor can only add.'
      - 'The trap is D, 35 Ω. It adds 15 Ω to only one 20 Ω branch and forgets that the current shares two paths.'
    hint: 'Replace the parallel pair by one resistor first. What is half of 20 Ω?'
    why:
      A: 'The total cannot be smaller than the 15 Ω resistor in series with the rest; adding a resistor in series only increases resistance.'
      C: 'That is the 15 Ω resistor alone; it leaves out the 10 Ω of the parallel pair.'
      D: 'Adds 15 Ω to a single 20 Ω branch; two equal resistors in parallel give 10 Ω, not 20 Ω.'

  4:
    answer: D
    steps:
      - 'Data: $m = 6$ kg, $g = 10\ \text{m s}^{-2}$, limiting friction $F = 30$ N up the plane, $\theta = ?$'
      - 'The body is at rest, so the forces along the plane balance. Friction up the plane equals the component of the weight down the plane: $F = mg\sin\theta$.'
      - 'Weight $W = mg = 6 \times 10 = 60$ N.'
      - '$30 = 60\sin\theta$, so $\sin\theta = \dfrac{30}{60} = 0.5$ and $\theta = 30°$.'
      - 'Check: the friction is half the weight, and $\sin 30° = 0.5$. The normal reaction is $R = mg\cos\theta = 60 \times 0.866 = 52$ N, which is less than the weight, as it should be.'
      - 'The trap is B, 60°. It uses $\cos\theta = 0.5$, which resolves the weight across the plane instead of along it.'
    hint: 'Which part of the weight pulls the body down the slope: $mg\sin\theta$ or $mg\cos\theta$?'
    why:
      A: 'Gives sin θ = 0.26, which does not match 30 N out of 60 N.'
      B: 'Uses cos θ = 0.5; that is the component pressing into the plane, not the one along it.'
      C: 'Takes sin θ as 0.71; 30 N ÷ 60 N is 0.5, not 0.71.'

  5:
    answer: A
    steps:
      - 'Data: $c = 3.0 \times 10^{8}\ \text{m s}^{-1}$ in air, $n = 1.65$, speed in glass $v = ?$'
      - 'Refractive index is the speed of light in air divided by its speed in the medium: $n = \dfrac{c}{v}$, so $v = \dfrac{c}{n}$.'
      - 'The data are already in SI units.'
      - '$v = \dfrac{3.0 \times 10^{8}}{1.65} = 1.82 \times 10^{8}\ \text{m s}^{-1}$.'
      - 'Check: light slows down in glass, so the answer must be less than $3.0 \times 10^{8}\ \text{m s}^{-1}$. It is.'
      - 'The trap is C. It multiplies by 1.65 instead of dividing, which would make light faster in glass.'
    hint: 'Light travels more slowly in glass than in air. Divide or multiply?'
    why:
      B: 'That is the speed in air; glass slows the light down.'
      C: 'Multiplies c by n, giving a speed faster than light in air.'
      D: 'Just copies the refractive index into the mantissa; it is not c ÷ n.'

  6:
    answer: B
    steps:
      - 'Fact: longitudinal waves cannot be polarised.'
      - 'Reason: polarisation means making the vibrations happen in one plane only. In a transverse wave the particles vibrate across the direction of travel, in many possible planes, so a filter can pick out one.'
      - 'In a longitudinal wave, such as sound, the particles vibrate only along the direction of travel. There is only one direction, so there is nothing to select.'
      - 'Both kinds of wave can be reflected (an echo), refracted (sound bends at night) and diffracted (you hear a radio round a corner).'
      - 'Memory aid: polarisation is the test that tells a transverse wave from a longitudinal one.'
    hint: 'Polarisation picks one plane of vibration. How many directions does a sound wave vibrate in?'
    why:
      A: 'Sound is refracted when it passes between layers of air at different temperatures.'
      C: 'Sound diffracts round corners and doorways, which is why you hear people you cannot see.'
      D: 'Sound reflects off walls and cliffs; that is an echo.'

  7:
    answer: D
    steps:
      - 'Fact: a microphone changes sound energy into electrical energy.'
      - 'Reason: sound waves make a thin diaphragm vibrate. In a moving-coil microphone the diaphragm moves a coil in a magnetic field and induces a varying current; in a carbon microphone it squeezes carbon granules and changes their resistance.'
      - 'A loudspeaker does the opposite job: a varying current in a coil in a magnetic field drives a cone, which makes sound.'
      - 'Example: at a church or a party, the MC speaks into the microphone (sound to electrical), the amplifier boosts the signal, and the speakers turn it back into sound (electrical to sound).'
      - 'The trap is C. A loudspeaker and a microphone are built alike, but they convert energy in opposite directions.'
    hint: 'Which device takes your voice in, and which device gives sound out?'
    why:
      A: 'A car horn turns electrical energy into sound, the reverse of what is asked.'
      B: 'The earpiece of a telephone turns electrical signals into sound for your ear.'
      C: 'A loudspeaker changes electrical energy into sound energy, the reverse direction.'

  8:
    answer: D
    steps:
      - 'Fact: a good calorimeter has a low specific heat capacity and a high thermal conductivity. That is why calorimeters are made of copper.'
      - 'Low specific heat capacity: the calorimeter itself should take up as little of the heat as possible, so nearly all the heat goes into the liquid being studied.'
      - 'High conductivity: the calorimeter must quickly reach the same temperature as its contents, so one thermometer reading gives the temperature of both.'
      - 'Heat loss to the room is stopped in a different way, by lagging the outside and fitting a lid, not by making the calorimeter itself a poor conductor.'
      - 'The trap is A. Low conductivity sounds like it keeps the heat in, but it would leave the walls at a different temperature from the liquid.'
    hint: 'The calorimeter should share the liquid''s temperature quickly and soak up little heat itself.'
    why:
      A: 'A poor conductor would lag behind the temperature of the liquid inside it.'
      B: 'A high heat capacity would make the calorimeter absorb much of the heat, and a poor conductor lags in temperature.'
      C: 'A high specific heat capacity would make the calorimeter take up too much of the heat.'

  9:
    answer: A
    steps:
      - 'Rule: a magnetic field deflects only charged particles. The force on a charge $q$ moving at speed $v$ is $F = Bqv$, and the radius of its curved path is $r = \dfrac{mv}{Bq}$.'
      - 'So the deflection depends on the charge-to-mass ratio $\dfrac{q}{m}$. The bigger $\dfrac{q}{m}$, the tighter the curve.'
      - 'A β-particle is an electron: tiny mass, $\dfrac{q}{m} \approx 1.8 \times 10^{11}\ \text{C kg}^{-1}$. An α-particle is a helium nucleus, about 7300 times heavier with only twice the charge, so $\dfrac{q}{m} \approx 4.8 \times 10^{7}\ \text{C kg}^{-1}$.'
      - 'γ-rays and X-rays are electromagnetic waves with no charge, so they are not deflected at all.'
      - 'So β-particles are deflected most strongly. The trap is B: α-particles carry the larger charge, but their much larger mass makes them curve far less.'
    hint: 'Compare charge divided by mass for each, and remember that waves carry no charge.'
    why:
      B: 'α-particles are charged but very heavy, so they curve only slightly.'
      C: 'γ-rays are uncharged electromagnetic waves and pass straight through a magnetic field.'
      D: 'X-rays are uncharged electromagnetic waves and are not deflected.'

  10:
    answer: B
    steps:
      - 'Fact: the curved water surface at the glass, called the meniscus, is due to surface tension.'
      - 'Reason: the adhesion between water and glass molecules is stronger than the cohesion between water molecules. The water is pulled up the glass at the edge, and surface tension holds the surface in a smooth curve that is concave upwards.'
      - 'Mercury does the opposite. Its cohesion is stronger than its adhesion to glass, so its meniscus curves down at the edge.'
      - 'Example: look at water in a clear drinking glass or a measuring cylinder in the laboratory. The edge rises up the glass, which is why you read the bottom of the meniscus.'
      - 'The trap is C. Viscosity is resistance to flow; it acts only when the liquid moves, but the meniscus forms in still water.'
    hint: 'Which property makes water climb a narrow glass tube?'
    why:
      A: 'Friction acts between moving surfaces; the water here is at rest.'
      C: 'Viscosity resists flow; it does not shape a still surface.'
      D: 'Evaporation lowers the level slowly but does not curve the surface at the glass.'

  11:
    answer: C
    steps:
      - 'Fact: a dynamo (a generator) converts mechanical energy into electrical energy.'
      - 'Reason: a coil is turned in a magnetic field. The changing magnetic flux through it induces an e.m.f., by Faraday''s law of electromagnetic induction.'
      - 'Example: in a petrol generator the engine turns the shaft (mechanical energy) and the alternator gives electricity. A bicycle dynamo lights the lamp when you pedal.'
      - 'The trap is B. Electrical energy into kinetic energy is what an electric motor does, the reverse of a dynamo.'
    hint: 'You turn a dynamo by hand or with an engine. What do you get out?'
    why:
      A: 'Potential to kinetic energy is a falling body, not a dynamo.'
      B: 'That is an electric motor, the reverse of a dynamo.'
      D: 'Kinetic to potential energy is a body thrown upwards, not a dynamo.'

  12:
    answer: D
    steps:
      - 'Rule: the direction of an electric field is the direction of the force on a positive charge. A negative charge feels a force opposite to the field.'
      - 'In the figure the field lines point upwards, from the lower plate to the upper plate.'
      - 'The particle enters moving horizontally and curves downwards, onto the lower plate. So the force on it is downwards, opposite to the field.'
      - 'A force opposite to the field means the charge is negative. Of the four choices, only the electron is negative.'
      - 'The trap is B. A proton is charged, but it is positive and would curve upwards, along the field.'
    hint: 'Which way do the field arrows point, and which way does the particle bend?'
    why:
      A: 'A gamma ray has no charge, so it would go straight through.'
      B: 'A proton is positive and would be pushed upwards along the field.'
      C: 'A neutron has no charge, so the field would not bend its path.'

  13:
    answer: A
    steps:
      - 'Rule: in a pipe, there is an antinode (widest part of the envelope) at an open end and a node (the curves meet) at a closed end. Node to next node is half a wavelength, and node to next antinode is a quarter wavelength.'
      - 'Tube A is open at both ends: antinode, node, antinode, node, antinode. That is four quarter wavelengths: $\dfrac{\lambda}{4} \times 4 = \lambda$.'
      - 'Tube B is open at both ends with one node in the middle: antinode, node, antinode, which is $\dfrac{\lambda}{2}$.'
      - 'Tube C is closed at the bottom with a node there and an antinode at the top, which is $\dfrac{\lambda}{4}$.'
      - 'Tube D is closed: node, antinode, node, antinode, node, antinode from the bottom, which is five quarters, $\dfrac{5\lambda}{4}$.'
      - 'So only tube A holds exactly one wavelength. The trap is D. It has the most loops, but it is closed, so it holds an odd number of quarter wavelengths.'
    hint: 'Count the quarter wavelengths: each step from a node to the next antinode is $\dfrac{\lambda}{4}$.'
    why:
      B: 'In B there is one node between two antinodes, which is half a wavelength.'
      C: 'In C there is only a node at the closed end and an antinode at the top, a quarter wavelength.'
      D: 'In D the closed tube holds five quarter wavelengths, more than one wavelength.'

  14:
    answer: B
    steps:
      - 'Fact: at the balance point, no current flows through the cell being tested, so a potentiometer measures its true e.m.f.'
      - 'Reason: a cell has internal resistance $r$. When it gives a current $I$, the terminal p.d. is $V = E - Ir$, less than the e.m.f. by the "lost volts" $Ir$.'
      - 'A voltmeter always draws some current, so it reads $V$, a little less than $E$. At balance on a potentiometer the galvanometer reads zero, so $I = 0$ and $V = E$ exactly.'
      - 'The trap is A. A small internal resistance makes the error small, but it is the zero current at balance that removes it.'
    hint: 'What does the galvanometer read when the potentiometer is balanced?'
    why:
      A: 'Internal resistance matters only when current flows; the point is that no current flows.'
      C: 'A linear scale makes reading easy, but it is not why the e.m.f. is measured exactly.'
      D: 'At balance the potentiometer behaves like a meter of infinite resistance, not a small one.'

  15:
    answer: C
    steps:
      - 'Rule: a vector has both size and direction; a scalar has size only.'
      - 'Electric field strength is the force on a unit positive charge, $E = \dfrac{F}{q}$. Force has a direction, so the field has a direction too. It is a vector.'
      - 'Charge, potential difference and capacitance each have size only. They add like ordinary numbers.'
      - 'Example: the field between the plates of a capacitor points from the positive plate to the negative plate.'
      - 'The trap is B. A p.d. has a positive and a negative end, but it is energy per unit charge, which is a scalar.'
    hint: 'Which of these is defined from a force?'
    why:
      A: 'Charge can be positive or negative, but that is a sign, not a direction in space.'
      B: 'Potential difference is energy per unit charge, a scalar.'
      D: 'Capacitance is charge per volt, a scalar.'

  16:
    answer: D
    steps:
      - 'Fact: a photocell works by the photoelectric effect, the emission of electrons from a metal surface when light or other radiation falls on it.'
      - 'Reason: each photon gives its energy $hf$ to one electron. If $hf$ is more than the work function of the metal, the electron escapes and a current flows in the circuit.'
      - 'Example: the automatic doors at a big supermarket and the street lights that switch on at dusk use light sensors that work on this principle.'
      - 'The trap is C. It swaps the roles: light knocks out electrons, not protons.'
    hint: 'What particle leaves the metal when light shines on it?'
    why:
      A: 'A voltaic cell makes electricity by a chemical reaction, not by light.'
      B: 'A photographic plate records light chemically; it does not give a current.'
      C: 'Protons are held in the nucleus; light releases electrons.'

  17:
    answer: A
    steps:
      - 'Fact: an atom that has lost or gained charge, by losing or gaining electrons, is an ion.'
      - 'Reason: a neutral atom has as many electrons as protons. Lose an electron and it becomes a positive ion; gain one and it becomes a negative ion.'
      - 'Example: in common salt, sodium has lost an electron to become $\text{Na}^{+}$ and chlorine has gained one to become $\text{Cl}^{-}$.'
      - 'The trap is B. The electron is what moves, but the charged atom left behind is an ion.'
    hint: 'What is a charged atom called?'
    why:
      B: 'The electron is the particle gained or lost, not what the atom becomes.'
      C: 'A neutron is an uncharged particle in the nucleus.'
      D: 'A proton is a particle in the nucleus; the atom does not turn into one.'

  18:
    answer: B
    steps:
      - 'Fact: the depth of the sea is measured by echo sounding, which uses the reflection of sound.'
      - 'A ship sends a pulse of sound down. It reflects off the sea bed and the echo returns after a time $t$.'
      - 'The sound travels down and back, so depth $d = \dfrac{vt}{2}$. For example, with $v = 1500\ \text{m s}^{-1}$ in water and $t = 0.4$ s, $d = \dfrac{1500 \times 0.4}{2} = 300$ m.'
      - 'The trap is C. Refraction bends sound passing between layers; it does not send it back to the ship.'
    hint: 'The ship hears its own sound come back. What property brings it back?'
    why:
      A: 'Diffraction spreads waves round obstacles; it does not return the pulse.'
      C: 'Refraction bends the wave; the measurement needs the wave to come back.'
      D: 'Interference combines two waves; echo sounding uses a single reflected pulse.'

  19:
    answer: C
    steps:
      - 'Fact: in nuclear fusion, light nuclei join to form one heavier nucleus, and energy is released.'
      - 'Reason: the mass of the product is a little less than the mass of the nuclei that joined. The lost mass $\Delta m$ appears as energy, $E = \Delta m c^{2}$.'
      - 'Example: in the sun, hydrogen nuclei fuse to form helium, and the energy reaches us as sunlight.'
      - 'So the products are the heavy nucleus (I) and energy (IV).'
      - 'The trap is D. Neutrons are the hallmark of fission, where a heavy nucleus splits; the defining product of fusion is the single heavier nucleus.'
    hint: 'Fusion means joining. What does joining two small nuclei make?'
    why:
      A: 'Leaves out energy, the whole point of fusion.'
      B: 'Neutrons and protons are not the defining products; fusion builds a heavier nucleus and releases energy.'
      D: 'Neutrons are typical of fission; this leaves out the heavier nucleus formed.'

  20:
    answer: C
    steps:
      - 'Fact: a dull black surface is a good radiator (and absorber) of heat; a shiny polished surface is a poor radiator.'
      - 'The two kettles are the same in every way except their outer surface. Conduction and convection to the air are the same for both.'
      - 'The surface affects only radiation. The sooty kettle radiates heat faster, so it cools down more quickly.'
      - 'Example: the shiny inside of a vacuum flask keeps tea hot, and a black cooking pot loses heat faster once it is off the stove.'
      - 'The trap is D. Soot changes how well the surface radiates; it does not set up convection currents.'
    hint: 'The only difference is the colour and shine of the surface. Which way of losing heat does that control?'
    why:
      A: 'The surfaces differ, so their rates of radiation differ.'
      B: 'A polished surface is a poor radiator, so that kettle cools more slowly.'
      D: 'Soot speeds cooling by radiation, not convection; convection is the same for both.'

  21:
    answer: A
    steps:
      - 'Fact: a total eclipse of the sun happens when the moon is between the sun and the earth, in a straight line.'
      - 'Reason: light travels in straight lines. The moon blocks the sun''s light, and places on earth in the moon''s umbra (full shadow) see the sun completely covered.'
      - 'Example: Nigeria saw a total eclipse of the sun on 29 March 2006; the day went dark like evening in places such as Kano and Lagos.'
      - 'The trap is C. When the earth is between the sun and the moon, the earth''s shadow falls on the moon; that is an eclipse of the moon.'
    hint: 'To hide the sun from us, which body must be in the way?'
    why:
      B: 'The sun cannot be between the moon and the earth; the moon orbits the earth.'
      C: 'That arrangement gives an eclipse of the moon (lunar eclipse).'
      D: 'The ozone layer has nothing to do with eclipses.'

  22:
    answer: B
    steps:
      - 'Fact: the spectrum of white light runs red, orange, yellow, green, blue, indigo, violet (ROYGBIV).'
      - 'Red bends least and violet bends most in a prism, so they sit at the two ends of the spectrum.'
      - 'The pair with the widest separation is therefore red and violet.'
      - 'The trap is C. Red and indigo are far apart, but indigo is one step short of the violet end.'
    hint: 'Write out ROYGBIV. Which two colours are at the ends?'
    why:
      A: 'Green and yellow are next to each other in the spectrum.'
      C: 'Indigo is next to violet, so this pair is not quite the widest.'
      D: 'Yellow is in the middle of the spectrum, not at the end.'

  23:
    answer: D
    steps:
      - 'Rule: in simple harmonic motion, $a = -\omega^{2}x$. The acceleration is always opposite to the displacement.'
      - 'Newton''s second law: $F = ma$. Mass is positive, so the force always points the same way as the acceleration. Force and acceleration are in phase.'
      - 'Force and displacement are opposite, so they are half a cycle (180°) out of phase.'
      - 'Velocity is greatest at the centre where the acceleration is zero, and zero at the ends where the acceleration is greatest. They are a quarter cycle (90°) out of phase. Displacement and velocity are also 90° apart.'
      - 'The trap is B. Force and displacement are tied together, but the minus sign in $F = -kx$ puts them in antiphase, not in phase.'
    hint: 'Which pair is linked by $F = ma$ with no minus sign?'
    why:
      A: 'Displacement and velocity are a quarter cycle apart: velocity is zero where displacement is greatest.'
      B: 'The restoring force is opposite to the displacement, so they are 180° out of phase.'
      C: 'Velocity is greatest where acceleration is zero, so they are 90° apart.'

  24:
    answer: B
    steps:
      - 'Data: weight $W = 0.5$ N, pivot at the 30 cm mark, balancing force = 2 N, distance from the pivot $d = ?$'
      - 'A uniform rule has its weight acting at its centre, the 50 cm mark. That is $50 - 30 = 20$ cm to the right of the pivot.'
      - 'Principle of moments: for balance, clockwise moments equal anticlockwise moments about the pivot.'
      - 'The 2 N force must be on the other side, between the 0 and 30 cm marks: $2 \times d = 0.5 \times 20$, so $d = \dfrac{10}{2} = 5$ cm.'
      - 'So the force is 5 cm from the pivot, at the 25 cm mark. Check: the force is 4 times the weight, so it needs a quarter of the distance, 20 ÷ 4 = 5 cm.'
      - 'The trap is D, 25 cm. That is the scale reading where the force sits, but the question asks for the distance from the pivot.'
    hint: 'Where does the weight of a uniform rule act, and how far is that from the 30 cm mark?'
    why:
      A: '95 cm from the pivot is off the end of the rule; from the 30 cm mark the rule reaches only 30 cm one way and 70 cm the other.'
      C: 'That is the distance of the weight from the pivot, not of the 2 N force.'
      D: 'That is the scale mark (25 cm); its distance from the pivot is 5 cm.'

  25:
    answer: A
    steps:
      - 'Data: weight in air = 10.0 N, in water = 6.0 N, in liquid X = 7.0 N, relative density of X = ?'
      - 'Archimedes'' principle: the upthrust equals the weight of liquid displaced. The loss of weight is the upthrust.'
      - 'Relative density of a liquid $= \dfrac{\text{upthrust in the liquid}}{\text{upthrust in water}}$, because the solid displaces the same volume of each.'
      - 'Upthrust in X $= 10.0 - 7.0 = 3.0$ N. Upthrust in water $= 10.0 - 6.0 = 4.0$ N.'
      - 'Relative density $= \dfrac{3.0}{4.0} = \dfrac{3}{4}$. Check: the liquid pushes up less than water, so it is less dense than water and the answer is below 1.'
      - 'The trap is B, 4/3. It puts the upthrust in water on top of the fraction.'
    hint: 'Find the loss of weight in each liquid, then divide liquid by water.'
    why:
      B: 'Divides the upthrust in water by the upthrust in the liquid, upside down.'
      C: 'Divides the weight in air by the weight in water, 10.0 ÷ 6.0. Relative density uses the upthrusts, the losses in weight: 3.0 ÷ 4.0.'
      D: 'Divides the weight in X by the weight in air; those are not the upthrusts.'

  26:
    answer: B
    steps:
      - 'This is Six''s maximum and minimum thermometer.'
      - 'P, the large bulb, is full of alcohol. Alcohol expands a lot with temperature, so it is the part that senses the temperature.'
      - 'Q, the U-bend, holds a thread of mercury. When the alcohol in P expands or contracts, it pushes the mercury round the bend. The mercury moves the two steel indices that mark the highest and lowest temperatures.'
      - 'R, the other limb, holds alcohol above the mercury, with some alcohol vapour and air in the small bulb at the top to allow for expansion.'
      - 'So the contents are alcohol, mercury and alcohol. Example: gardeners and weather stations use this thermometer to record the hottest and coldest temperatures of the day.'
      - 'The trap is D. The top bulb on the right has some air and vapour, but the large bulb P must be alcohol, because it does the sensing.'
    hint: 'Which liquid pushes the mercury, and where is it?'
    why:
      A: 'P cannot be air and the U-bend is mercury, not alcohol.'
      C: 'The order is reversed: the mercury sits only in the U-bend.'
      D: 'The large bulb P holds alcohol, the expanding liquid, not air.'

  27:
    answer: B
    steps:
      - 'Fact: the sun produces its energy by nuclear fusion.'
      - 'Reason: in the very hot core, hydrogen nuclei move fast enough to overcome their repulsion and join into helium nuclei. A little mass is lost and released as energy, $E = mc^{2}$.'
      - 'Example: the sunlight that dries cassava and powers solar panels in Nigeria all comes from fusion in the sun''s core.'
      - 'The trap is A. Fission splits heavy nuclei such as uranium; it powers nuclear reactors on earth, not the sun.'
    hint: 'The sun is mostly hydrogen, the lightest element. Does it split or join nuclei?'
    why:
      A: 'Fission splits heavy nuclei; the sun joins light ones.'
      C: 'Electron collisions do not release nuclear energy.'
      D: 'Radioactive decay releases far too little energy to power the sun.'

  28:
    answer: D
    steps:
      - 'Fact: in a nuclear reactor, fission is started and kept going by neutrons.'
      - 'Reason: a slow neutron is absorbed by a uranium-235 nucleus, which splits into two smaller nuclei, gives out energy and releases two or three more neutrons.'
      - 'Those neutrons split more nuclei, giving a chain reaction. Control rods absorb some neutrons to keep the rate steady.'
      - 'A neutron works best because it has no charge, so the positive nucleus does not repel it.'
      - 'The trap is C. A proton is repelled by the positive nucleus, so it cannot get in easily.'
    hint: 'Which particle can enter a nucleus without being pushed away by its charge?'
    why:
      A: 'Electrons do not cause fission; they are repelled by other electrons and not taken in by the nucleus.'
      B: 'Photons do not keep a chain reaction going in a reactor.'
      C: 'Protons are repelled by the positive nucleus.'

