format_version: 1
exam_year: 2016
subject: PHY
explanations:
  1:
    answer: A
    steps:
      - 'Data: a metre rule is marked in millimetres, so its smallest division is 1 mm. Least possible error = ?'
      - 'Rule: when you read a scale, you can be out by at most half of its smallest division, because you judge which mark the edge is nearer to. So the reading error = ½ × smallest division.'
      - 'Least possible error = ½ × 1 mm = 0.5 mm.'
      - 'Check: 0.5 mm is 0.05 cm, which is why lengths read on a metre rule are written to the nearest 0.1 cm, such as 25.3 cm.'
      - 'The trap is B, 1.0 mm. That is the smallest division itself (the precision of the rule), not the error in reading it.'
    hint: 'What is the smallest division on a metre rule, and how much of it can you misjudge?'
    why:
      B: '1.0 mm is the smallest division, not half of it.'
      C: '0.2 mm is finer than anyone can judge by eye on a millimetre scale.'
      D: '0.1 mm is the sort of reading you get from a vernier calliper, not a metre rule.'

  2:
    answer: C
    steps:
      - 'Data from the diagram: primary (input) turns Nₚ = 2, secondary (output) turns Nₛ = 4.'
      - 'Rule: in a transformer the voltages are in the same ratio as the turns. In symbols, $\dfrac{V_s}{V_p} = \dfrac{N_s}{N_p}$.'
      - 'Here $\dfrac{V_s}{V_p} = \dfrac{4}{2} = 2$, so $V_s = 2V_p$.'
      - 'The secondary has more turns than the primary, so this is a step-up transformer and the secondary e.m.f. is increased.'
      - 'The trap is B. The secondary is the output side; count its turns before you decide whether the voltage goes up or down.'
    hint: 'Which coil has more turns, the input or the output?'
    why:
      A: 'The voltage stays the same only when both coils have equal turns.'
      B: 'A reduced voltage needs fewer turns on the secondary, but here it has more.'
      D: 'With an a.c. input the changing flux always induces an e.m.f. in the secondary.'

  3:
    answer: A
    steps:
      - 'Data: m = 5000 kg, h = 60 m, t = 15 min, g = 10 m s⁻², P = ?'
      - 'Rule: power is the rate of doing work. The work done in lifting is the gain in potential energy, so $P = \dfrac{mgh}{t}$.'
      - 'Convert the time to seconds: t = 15 × 60 = 900 s.'
      - 'Work done = mgh = 5000 × 10 × 60 = 3 000 000 J. Then $P = \dfrac{3\,000\,000}{900} = 3333$ W.'
      - 'So P ≈ $3.3 \times 10^{3}$ J s⁻¹ (3.3 kW), a sensible size for a borehole pump filling an overhead tank.'
      - 'The trap is D, $3.3 \times 10^{2}$ J s⁻¹. It leaves out $g$ and takes mass × height as the work; the work done is $mgh$. Change the minutes to seconds too, before you divide.'
    hint: 'Find the work done against gravity first, then divide by the time in seconds.'
    why:
      B: 'About 7.5 times too big; 2.5 × 10⁴ J s⁻¹ would do the 3 000 000 J of work in 120 s, only 2 minutes, not 15.'
      C: 'Far too big; 2.5 × 10⁵ J s⁻¹ would do the 3 000 000 J of work in just 12 s, not 15 minutes.'
      D: 'Leaves out g: 5000 × 60 ÷ 900 ≈ 333 W. The work done is the weight, mg, times the height.'

  4:
    answer: C
    steps:
      - 'Data: Q = 500 J, m = 100 g, c = 4200 J kg⁻¹ K⁻¹, ΔT = ?'
      - 'Rule: heat supplied = mass × specific heat capacity × temperature change, $Q = mc\Delta T$, so $\Delta T = \dfrac{Q}{mc}$.'
      - 'Convert the mass to kilograms: m = 100 g = 0.1 kg.'
      - '$\Delta T = \dfrac{500}{0.1 \times 4200} = \dfrac{500}{420} = 1.19$, so ΔT ≈ 1.2 °C (a change of 1.2 K is the same size as 1.2 °C).'
      - 'Check: 500 J is a small amount of heat for 100 g of water, so a rise of about one degree makes sense.'
      - 'The trap is A, 12.1 °C. It is about ten times too big, the size you get by using 0.01 kg for 100 g (500 ÷ 42 ≈ 12); 100 g is a tenth of a kilogram, 0.1 kg.'
    hint: 'Change 100 g to kilograms, then use Q = mcΔT.'
    why:
      A: 'About ten times too big; that is the size you get by taking 100 g as 0.01 kg (500 ÷ 42 ≈ 12).'
      B: 'A rise of 2.1 °C in 100 g of water would need 0.1 × 4200 × 2.1 ≈ 880 J, but only 500 J is supplied.'
      D: 'Leaves out the mass: 500 ÷ 4200 ≈ 0.1. The heat goes into 0.1 kg of water, so divide by 0.1 × 4200 = 420.'

  5:
    answer: A
    steps:
      - 'Rule: an electric or magnetic field can only push on something that carries charge.'
      - 'Alpha particles (positive, helium nuclei), beta particles (fast electrons) and cathode rays (streams of electrons) are all charged, so both fields deflect them.'
      - 'Gamma rays are electromagnetic waves, like X-rays and light. They carry no charge, so neither field can bend them.'
      - 'So gamma rays go straight through both fields.'
      - 'The trap is C. Cathode rays travel in a straight line in an empty tube, but they are electrons, and a magnet brought near the tube bends them at once.'
    hint: 'Which of these carries no electric charge?'
    why:
      B: 'Alpha particles carry a charge of +2e, so both fields deflect them.'
      C: 'Cathode rays are electrons, so both fields deflect them.'
      D: 'Beta particles are electrons, so both fields deflect them.'

  6:
    answer: B
    steps:
      - 'Fact: a gas conducts electricity at low pressure and high p.d.'
      - 'Reason: at normal pressure the gas molecules are crowded, so ions and electrons collide before they gain enough speed. Lowering the pressure lets them travel further between collisions.'
      - 'A high p.d. then accelerates them hard enough to knock electrons out of other molecules (ionisation), and the gas glows and conducts.'
      - 'Example: the fluorescent tube in a classroom and the neon sign at a shop front are low-pressure gas tubes run at a high voltage.'
      - 'The trap is D. At high pressure even a high p.d. usually gives no steady discharge, only a spark.'
    hint: 'Think of a fluorescent tube: what is inside it, and how is it switched on?'
    why:
      A: 'High pressure and low p.d. are the conditions in which a gas is a good insulator.'
      C: 'At low p.d. the ions are not accelerated enough to ionise other molecules.'
      D: 'At high pressure the particles collide too often to keep a discharge going.'

  7:
    answer: C
    steps:
      - 'Fact: dispersion is the splitting of white light into its colours by a prism.'
      - 'Reason: each colour travels at a different speed in glass, so each has a different refractive index. Violet slows the most and bends the most; red slows the least and bends the least.'
      - 'So the colours, which travel together in air, are refracted by different amounts and spread out into a spectrum.'
      - 'Example: the rainbow after rain, and the colours seen through the edge of a glass louvre on a sunny day.'
      - 'The trap is D. The colours are already in the white light; the glass does not hide or make them.'
    hint: 'Does each colour bend by the same amount in glass? Why not?'
    why:
      A: 'A perfect prism with no defects still disperses light.'
      B: 'Density is not the cause; it is the different speeds of the colours.'
      D: 'The colours come from the white light, not from inside the glass.'

  8:
    answer: D
    steps:
      - 'Data: I = 4.0 A, R₁ = 3 Ω, R₂ = 6 Ω in parallel, internal resistance r = 0, E = ?'
      - 'Rule for resistors in parallel: $\dfrac{1}{R} = \dfrac{1}{R_1} + \dfrac{1}{R_2}$, or for two of them $R = \dfrac{R_1 R_2}{R_1 + R_2}$.'
      - '$R = \dfrac{3 \times 6}{3 + 6} = \dfrac{18}{9} = 2\ \Omega$.'
      - 'Ohm''s law for the whole circuit with no internal resistance: $E = IR = 4.0 \times 2 = 8$ V.'
      - 'Check: the combined resistance is smaller than either resistor, as it must be in parallel.'
      - 'The trap is B, 36 V. That adds the resistors as if they were in series (9 Ω).'
    hint: 'Combine the 3 Ω and 6 Ω in parallel first.'
    why:
      A: 'Uses only the 3 Ω resistor: 4 × 3 = 12 V.'
      B: 'Adds the resistors in series: 4 × 9 = 36 V.'
      C: 'Gives the combined resistance, 2 Ω, as if it were the voltage.'

  9:
    answer: A
    steps:
      - 'Data: m = 80 kg, limiting friction F = 500 N (the body is just about to move), g = 10 m s⁻², μ = ?'
      - 'Rule: when a body is just about to slide, friction reaches its limiting value, $F = \mu R$, where R is the normal reaction.'
      - 'On level ground the normal reaction equals the weight: R = mg = 80 × 10 = 800 N.'
      - '$\mu = \dfrac{F}{R} = \dfrac{500}{800} = 0.625$, which is 0.6 to one decimal place.'
      - 'Check: μ has no unit, because it is a force divided by a force, and a value below 1 is usual for rough ground.'
      - 'The trap is dividing by the mass, 500 ÷ 80. Friction depends on the normal force in newtons, not the mass in kilograms.'
    hint: 'Find the normal reaction in newtons before you divide.'
    why:
      B: 'Too small; 0.4 would need a pull of only 320 N.'
      C: 'A coefficient of 1.0 would need a 800 N pull.'
      D: 'Too big; 0.8 would need a pull of 640 N.'

  10:
    answer: A
    steps:
      - 'Data: plank pivoted at its centre O, P at distance a on the left and Q at distance b on the right, balanced. Then 2P is added at P.'
      - 'Principle of moments: for balance, the sum of clockwise moments about the pivot equals the sum of anticlockwise moments. At the start, P × a = Q × b.'
      - 'After adding 2P, the load on the left is 3P, so its moment is 3P × a, which is three times Q × b. The plank tips down on the P side.'
      - 'To balance again, the left moment must come back down to Q × b. Moving the 3P load nearer to O, to a distance of a/3, does this: 3P × a/3 = P × a = Q × b.'
      - 'The trap is B. Moving Q nearer to O makes the right-hand moment even smaller, so the plank tips further.'
    hint: 'After the extra weight, which side has the bigger moment? How can you reduce it?'
    why:
      B: 'This reduces the right-hand moment and makes the tilt worse.'
      C: 'Doubling Q gives 2Q × b = 2P × a, still less than 3P × a.'
      D: 'This increases the left-hand moment and makes the tilt worse.'

  11:
    answer: B
    steps:
      - 'Data: thickness d = 0.9 cm, refractive index n = 1.50, c = $3.0 \times 10^{8}$ m s⁻¹, t = ?'
      - 'Rule: refractive index = speed of light in vacuum ÷ speed in the medium, $n = \dfrac{c}{v}$, so $v = \dfrac{c}{n}$. Then time = distance ÷ speed.'
      - 'Convert the thickness to metres: d = 0.9 cm = 0.009 m = $9 \times 10^{-3}$ m.'
      - '$v = \dfrac{3.0 \times 10^{8}}{1.50} = 2.0 \times 10^{8}$ m s⁻¹, so $t = \dfrac{9 \times 10^{-3}}{2.0 \times 10^{8}} = 4.5 \times 10^{-11}$ s.'
      - 'Check: light is slower in glass, so the time is longer than the $3.0 \times 10^{-11}$ s it would take in air.'
      - 'The trap is C. It divides the thickness by c and forgets that light slows down in glass.'
    hint: 'How fast does light travel inside glass of refractive index 1.5?'
    why:
      A: 'Ignores the refractive index and takes 0.9 cm as 0.09 m: 0.09 ÷ (3.0 × 10⁸) = 3.0 × 10⁻¹⁰ s.'
      C: 'Uses the speed of light in air, not in glass.'
      D: 'Ten times too big, from a slip in changing 0.9 cm to metres.'

  12:
    answer: D
    steps:
      - 'Fact: the transformer in a mains radio steps the voltage down.'
      - 'Reason: the mains supply in Nigeria is about 230 V a.c., but the radio''s circuits work on a few volts. A transformer with fewer turns on its secondary brings the voltage down.'
      - 'A rectifier then changes that low a.c. voltage to d.c.; the transformer itself does not do that.'
      - 'Example: the small heavy block inside a radio or phone-charger adaptor is a step-down transformer.'
      - 'The trap is B. Changing a.c. to d.c. is rectification, done by diodes, not by a transformer.'
    hint: 'Is the mains voltage bigger or smaller than what a radio circuit needs?'
    why:
      A: 'A transformer cannot give out more power than it takes in.'
      B: 'A transformer works only with a.c.; diodes change a.c. to d.c.'
      C: 'The radio needs a lower voltage than the mains, not a higher one.'

  13:
    answer: D
    steps:
      - 'Data: E = 3.3 eV, h = $6.6 \times 10^{-34}$ J s, 1 eV = $1.6 \times 10^{-19}$ J, f = ?'
      - 'Rule (Planck): the energy of a photon is Planck''s constant times its frequency, $E = hf$, so $f = \dfrac{E}{h}$.'
      - 'Convert the energy to joules: $E = 3.3 \times 1.6 \times 10^{-19} = 5.28 \times 10^{-19}$ J.'
      - '$f = \dfrac{5.28 \times 10^{-19}}{6.6 \times 10^{-34}} = 8.0 \times 10^{14}$ Hz.'
      - 'Check: $8 \times 10^{14}$ Hz is in the violet and near-ultraviolet, which fits the bright lines of a mercury lamp.'
      - 'The trap is forgetting to change electronvolts to joules before dividing by h.'
    hint: 'Change 3.3 eV to joules, then use E = hf.'
    why:
      A: 'Check it backwards: hf = 6.6 × 10⁻³⁴ × 3.2 × 10¹⁴ ≈ 2.1 × 10⁻¹⁹ J, only about 1.3 eV, not 3.3 eV.'
      B: 'Check it backwards: hf = 6.6 × 10⁻³⁴ × 3.1 × 10¹⁴ ≈ 2.0 × 10⁻¹⁹ J, only about 1.3 eV, not 3.3 eV.'
      C: 'Check it backwards: hf = 6.6 × 10⁻³⁴ × 1.3 × 10¹⁴ ≈ 8.6 × 10⁻²⁰ J, only about 0.5 eV, not 3.3 eV.'

  14:
    answer: B
    steps:
      - 'Rule: in a nuclear reaction the mass numbers (top) balance and the atomic numbers (bottom) balance.'
      - 'Mass numbers: 235 + 1 = 144 + 90 + 2A, so 236 = 234 + 2A and A = 1.'
      - 'Atomic numbers: 92 + 0 = 56 + 36 + 2Z, so 92 = 92 + 2Z and Z = 0.'
      - 'A particle with mass number 1 and atomic number 0 is a neutron, ${}^{1}_{0}\text{n}$. This is the fission of uranium-235, and the two new neutrons keep the chain reaction going.'
      - 'The trap is D. A proton has mass number 1 but atomic number 1, and the atomic numbers already balance without any charge.'
    hint: 'Balance the top numbers, then the bottom numbers, for the two X particles.'
    why:
      A: 'An electron has atomic number −1 and mass number 0.'
      C: 'A neutrino has mass number 0, so the top numbers would not balance.'
      D: 'A proton has atomic number 1, so the bottom numbers would not balance.'

  15:
    answer: A
    steps:
      - 'Fact: a material is shielded from a magnetic field by putting it inside a soft iron ring (a magnetic screen).'
      - 'Reason: soft iron is highly permeable, so the lines of force crowd into the iron and travel round the ring instead of crossing the space inside it.'
      - 'Example: delicate watches and meters are protected inside soft iron cases, and a soft iron ring keeps the field away from a compass placed inside it.'
      - 'Copper and zinc are not magnetic, so field lines pass straight through them. Steel is magnetic, but it is hard to magnetise and keeps its magnetism, so it makes a poor screen.'
      - 'The trap is D. Steel is magnetic, but soft iron, not steel, is the material used for screening.'
    hint: 'Which material lets magnetic field lines through it most easily?'
    why:
      B: 'Copper is non-magnetic, so field lines pass straight through it.'
      C: 'Zinc is non-magnetic, so field lines pass straight through it.'
      D: 'Steel holds its magnetism and is a poor magnetic screen compared with soft iron.'

  16:
    answer: B
    steps:
      - 'Data from the diagram: the incident ray makes 30° with the surface, so the angle of incidence (from the normal) is i = 60°. The refracted ray makes 60° with the surface, so the angle of refraction is r = 90° − 60° = 30°.'
      - 'Snell''s law: the refractive index is the sine of the angle of incidence divided by the sine of the angle of refraction, $n = \dfrac{\sin i}{\sin r}$.'
      - '$n = \dfrac{\sin 60^\circ}{\sin 30^\circ} = \dfrac{\sqrt{3}/2}{1/2} = \sqrt{3}$, which is about 1.73.'
      - 'Check: the ray bends towards the normal on entering M, so M is optically denser than air and n is bigger than 1.'
      - 'The trap is C, $\dfrac{1}{\sqrt{3}}$. It uses the angles to the surface (30° and 60°) instead of the angles to the normal.'
    hint: 'Measure both angles from the normal, not from the surface.'
    why:
      A: 'This is 1 ÷ sin 60°, which is not Snell''s law for these angles.'
      C: 'Uses the angles to the surface, which turns the ratio upside down.'
      D: 'Takes sin 60° as √3 instead of √3/2: √3 ÷ ½ = 2√3. With sin 60° = √3/2 the answer is √3.'

  17:
    answer: C
    steps:
      - 'Fact: two objects are in thermal equilibrium when they are at the same temperature.'
      - 'Reason: heat flows only from a hotter body to a colder one. When the temperatures are equal there is no net flow of heat, whatever the sizes or materials of the objects.'
      - 'Example: a thermometer in your mouth reads your temperature only after it has come to the same temperature as your body.'
      - 'This is why temperature, not quantity of heat, decides which way heat flows.'
      - 'The trap is B. A big pot of warm water holds more heat than a small hot nail, yet heat flows from the nail to the water.'
    hint: 'What must be the same for heat to stop flowing between two bodies?'
    why:
      A: 'Objects with very different heat capacities can still be at the same temperature.'
      B: 'Heat flow depends on temperature difference, not on how much heat each holds.'
      D: 'If heat flows continuously, the objects are not yet in equilibrium.'

  18:
    answer: D
    steps:
      - 'Fact: a stationary (standing) wave is formed when two identical waves travel in opposite directions and superpose.'
      - 'Reason: at some points the two waves always cancel (nodes); at others they always add to the largest displacement (antinodes).'
      - 'The distance between two successive nodes is half a wavelength, and the energy stays trapped between the nodes instead of travelling along.'
      - 'Example: a guitar string, or the air column in a flute, where the wave reflected from the end meets the incoming wave.'
      - 'The trap is B. Node to node is half a wavelength, λ/2, not a full wavelength.'
    hint: 'How is a standing wave made from travelling waves?'
    why:
      A: 'An antinode is a point of maximum displacement; a node is the point of zero displacement.'
      B: 'Two successive nodes are half a wavelength apart.'
      C: 'A stationary wave does not carry energy along the medium; that is a progressive wave.'

  19:
    answer: B
    steps:
      - 'Data: pressure at the ground P₀ = 760 mmHg, pressure 0 at a height of 80 km, falling uniformly. P at h = 20 km = ?'
      - 'Rule: if the pressure falls uniformly, the fall is proportional to the height climbed: fall = $\dfrac{h}{80\ \text{km}} \times 760$ mmHg.'
      - 'Fall at 20 km = $\dfrac{20}{80} \times 760 = \dfrac{1}{4} \times 760 = 190$ mmHg.'
      - 'Pressure left = 760 − 190 = 570 mmHg.'
      - 'Check: 20 km is a quarter of the way up, so three quarters of the pressure remains: $\dfrac{3}{4} \times 760 = 570$ mmHg.'
      - 'The trap is C, 190 mmHg. That is the fall in pressure, not the pressure that is left.'
    hint: 'What fraction of the way to the top of the atmosphere is 20 km?'
    why:
      A: '480 mmHg would mean a fall of 280 mmHg, more than a third of 760 mmHg, at only a quarter of the height. The fall is a quarter, 190 mmHg.'
      C: 'This is the drop in pressure; subtract it from 760 mmHg.'
      D: 'This would be the pressure halfway up, at 40 km.'

  20:
    answer: C
    steps:
      - 'Data: metal m = 0.5 kg from 100 °C to 25 °C; calorimeter C₁ = 80 J K⁻¹ and water C₂ = 420 J K⁻¹ from 15 °C to 25 °C; c = ?'
      - 'Rule (method of mixtures): in a well-lagged calorimeter, heat lost by the hot body = heat gained by the cold bodies. Heat = mcΔθ for the metal, and heat capacity × Δθ for the calorimeter and water.'
      - 'Heat gained = (80 + 420) × (25 − 15) = 500 × 10 = 5000 J.'
      - 'Heat lost by the metal = 0.5 × c × (100 − 25) = 37.5c.'
      - 'So 37.5c = 5000 and $c = \dfrac{5000}{37.5} = 133$ J kg⁻¹ K⁻¹. A temperature change in °C is the same size as in K, so no conversion is needed.'
      - 'The trap is forgetting the calorimeter. Using only the water gives 420 × 10 ÷ 37.5 = 112 J kg⁻¹ K⁻¹, which is too small.'
    hint: 'Add the heat taken in by the calorimeter and the water, then set it equal to the heat given out by the metal.'
    why:
      A: 'Too small; with c = 92 the metal would give out only 0.5 × 92 × 75 = 3450 J, but the water and calorimeter take in 5000 J.'
      B: 'Too big; with c = 286 the metal would give out 0.5 × 286 × 75 ≈ 10 700 J, more than twice the 5000 J taken in.'
      D: 'Far too big; with c = 887 the metal would give out about 33 000 J, over six times the 5000 J taken in.'

  21:
    answer: A
    steps:
      - 'Data: V_L = 8 V r.m.s., V_R = 6 V r.m.s., in series. Supply voltage V = ?'
      - 'Rule: in an a.c. circuit the voltage across an inductor leads the current by 90°, while the voltage across a resistor is in phase with it. So the two voltages add like the sides of a right-angled triangle: $V = \sqrt{V_R^{2} + V_L^{2}}$.'
      - '$V = \sqrt{6^{2} + 8^{2}} = \sqrt{36 + 64} = \sqrt{100} = 10$ V.'
      - 'Check: the supply voltage is bigger than either part but smaller than their plain sum, as it must be for voltages 90° out of step.'
      - 'The trap is C, 14 V. Adding 8 and 6 works for d.c. resistors in series, not for an inductor and resistor on a.c.'
    hint: 'The inductor voltage is 90° out of phase with the resistor voltage. Think Pythagoras.'
    why:
      B: 'Subtracts the voltages: 8 − 6 = 2 V.'
      C: 'Adds the voltages as if they were in phase.'
      D: 'Multiplies the voltages, which has no meaning here.'

  22:
    answer: C
    steps:
      - 'Fact: in a closed pipe, a node always forms at the closed end and an antinode always forms at the open end.'
      - 'Reason: the air at the closed end cannot move, so its displacement is zero (a node). The air at the open end is free to move, so it vibrates the most (an antinode).'
      - 'The simplest note has just one node and one antinode, so the pipe is a quarter of a wavelength long.'
      - 'Example: blowing across the top of an empty bottle; the bottom is the closed end and the mouth is the open end.'
      - 'The trap is A. The closed end is where the air is held still, so it is a node.'
    hint: 'Where is the air free to move, and where is it held still?'
    why:
      A: 'The closed end is always a node, since the air there cannot move.'
      B: 'The middle is not always an antinode; it depends on the harmonic.'
      D: 'Nodes and antinodes alternate; the whole pipe cannot be an antinode.'

  23:
    answer: B
    steps:
      - 'Fact: when ice melts at 0 °C it absorbs latent heat of fusion, its mass stays the same, and its volume decreases.'
      - 'Reason: the heat breaks the open, hexagonal structure of ice without raising the temperature. Liquid water packs more tightly, so the same mass takes up less space.'
      - 'Mass cannot change, since no water is added or taken away; only the state changes.'
      - 'Example: ice floats in a cup of water because ice is less dense, and a bottle of water left in the freezer cracks as it freezes and expands.'
      - 'The trap is A. Most solids expand on melting, but ice contracts.'
    hint: 'Does ice float or sink in water? What does that tell you about its volume?'
    why:
      A: 'Mass does not change on melting, and ice contracts as it melts.'
      C: 'Melting absorbs latent heat; it does not give it out, and the mass stays the same.'
      D: 'Melting absorbs latent heat; giving out latent heat is freezing.'

  24:
    answer: A
    steps:
      - 'Rule (triangle law): to add two vectors, place them head to tail. The resultant runs from the tail of the first to the head of the second.'
      - 'From the diagram, Q starts at the bottom corner and ends at the right-hand corner; R starts at the right-hand corner and ends at the top corner.'
      - 'So Q followed by R takes you from the bottom corner to the top corner.'
      - 'P also runs from the bottom corner to the top corner, so P is the resultant: P = Q + R.'
      - 'The trap is D. P + Q + R = 0 is true only when all three arrows run round the triangle in the same sense. Here P and Q both start at the bottom corner.'
    hint: 'Follow Q then R. Where do you start and where do you end?'
    why:
      B: 'Q − R would need R reversed, pointing from the top corner to the right-hand corner.'
      C: 'R − Q would need Q reversed, so the path would not start where P starts.'
      D: 'The arrows do not run head to tail all the way round the triangle.'

  25:
    answer: B
    steps:
      - 'Fact: two parallel conductors carrying currents in the same direction attract each other; currents in opposite directions repel.'
      - 'Reason: each wire sits in the magnetic field of the other. Using Fleming''s left-hand rule on one wire in the other''s field, the force on each points towards the other wire.'
      - 'Memory aid: like currents attract, unlike currents repel. It is the opposite of charges and poles.'
      - 'This force is used to define the ampere.'
      - 'The trap is A. With charges, like charges repel, but with currents, like currents attract.'
    hint: 'Is the rule for currents the same as the rule for charges?'
    why:
      A: 'Repulsion happens when the currents flow in opposite directions.'
      C: 'The forces on the two wires are towards each other, not in the same direction.'
      D: 'Each current makes a magnetic field that pushes on the other wire.'

  26:
    answer: B
    steps:
      - 'Fact: an object looks the colour of the light it reflects. The other colours are absorbed.'
      - 'White sunlight contains all the colours. A green leaf absorbs red, orange, yellow, blue, indigo and violet, and reflects green into our eyes.'
      - 'So statement II (absorbs all colours except green) and statement III (reflects only green) are both correct.'
      - 'Statement I is the wrong way round: if the leaf absorbed only green, it would reflect the rest and look a purplish colour.'
      - 'The trap is D. II is true, but III is the other half of the same explanation and must be included.'
    hint: 'The colour we see is the colour that reaches our eyes. Is it absorbed or reflected?'
    why:
      A: 'A leaf that absorbed green would not look green.'
      C: 'Statement I is wrong, so any option including it is wrong.'
      D: 'Leaves out III, which is also correct.'

  27:
    answer: B
    steps:
      - 'Fact: the e.m.f. of a primary cell depends on the materials of its plates, the electrolyte and (slightly) the temperature. It does not depend on the size of the cell.'
