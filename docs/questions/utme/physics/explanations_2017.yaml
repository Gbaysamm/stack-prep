format_version: 1
exam_year: 2017
subject: PHY
explanations:
  1:
    answer: A
    steps:
      - 'Data: f = 2.0 cm (concave mirror, real-is-positive), u = 8.0 cm, v = ?'
      - 'Mirror formula: one over the focal length equals one over the object distance plus one over the image distance, $\dfrac{1}{f} = \dfrac{1}{u} + \dfrac{1}{v}$.'
      - 'Every length is in cm, so we can work in cm and keep the answer in cm.'
      - '$\dfrac{1}{v} = \dfrac{1}{2.0} - \dfrac{1}{8.0} = \dfrac{4 - 1}{8} = \dfrac{3}{8}$, so $v = \dfrac{8}{3} = 2.67$ cm.'
      - 'v ≈ 2.7 cm, positive, so the image is real and in front of the mirror. It sits between F (2 cm) and C (4 cm), which is right for an object beyond C.'
      - 'The trap is D, 2.0 cm. That is the focal length itself, where the image would only be for an object very far away.'
    hint: 'Use 1/f = 1/u + 1/v and make 1/v the subject.'
    why:
      B: 'No step of the mirror formula gives 2.3 cm; 1/2 − 1/8 is 3/8, so v = 8/3 = 2.67 cm.'
      C: '8/3 is 2.67, which rounds to 2.7 cm, not 2.5 cm.'
      D: 'That is the focal length; the image is only at F for an object at infinity.'

  2:
    answer: B
    steps:
      - 'Electrical energy = power × time, E = Pt.'
      - 'The joule is far too small for a household meter. One kilowatt used for one hour is 1000 W × 3600 s = 3.6 × 10⁶ J.'
      - 'So the electricity company (PHCN, now the distribution companies) bills energy in kilowatt-hours, kWh, the "units" on your prepaid meter.'
      - 'The trap is D, W. The watt is a unit of power, the rate of using energy, not the energy itself.'
    hint: 'Which unit is printed on the meter reading at home?'
    why:
      A: 'Wh is an energy unit but too small; meters count in thousands of these, kWh.'
      C: 'The joule is the SI unit, but a home would use millions of joules a day.'
      D: 'The watt measures power, not energy.'

  3:
    answer: D
    steps:
      - 'Data: resultant R = 50 N, the two forces at 90° to each other, one force F at 30° to R, F = ?'
      - 'Two perpendicular forces are the components of their resultant. A component of R along a direction at angle θ to it is R cos θ.'
      - '$F = R\cos 30^\circ = 50 \times 0.866$'
      - 'F = 43.3 N. Check: the other force is 50 sin 30° = 25 N, and √(43.3² + 25²) = 50 N, as it should.'
      - 'The trap is C, 25.0 N. That is R sin 30°, the force at 60° to the resultant.'
    hint: 'Resolve the 50 N resultant along the force that is 30° from it.'
    why:
      A: 'Divides by sin 30° instead of multiplying by cos 30°; a component cannot exceed the resultant.'
      B: 'Divides by cos 30°; a component is always smaller than the resultant.'
      C: 'That is 50 sin 30°, the other force, which is at 60° to the resultant.'

  4:
    answer: C
    steps:
      - 'Data: N₀ = 1000 atoms, N = 125 atoms, half-life T = 20 s, t = ?'
      - 'Rule: in each half-life, half of the undecayed atoms decay, so $N = N_0\left(\tfrac{1}{2}\right)^{n}$ where n is the number of half-lives.'
      - 'Halve step by step: 1000 → 500 → 250 → 125. That is three halvings, so n = 3. Check: $\left(\tfrac{1}{2}\right)^{3} = \tfrac{1}{8}$ and 1000 ÷ 8 = 125.'
      - 't = nT = 3 × 20 s = 60 s.'
      - 'The trap is D, 80 s. That counts four half-lives, which would leave only 62.5 atoms.'
    hint: 'How many times must you halve 1000 to reach 125?'
    why:
      A: 'One half-life leaves 500 atoms, not 125.'
      B: 'Two half-lives leave 250 atoms.'
      D: 'Four half-lives would leave 62.5 atoms, fewer than 125.'

  5:
    answer: A
    steps:
      - 'Electric potential at a point is the work done in bringing a unit positive charge from infinity to that point.'
      - 'For a point charge q in a vacuum, the potential at distance r is $V = \dfrac{q}{4\pi\varepsilon_0 r}$, where ε₀ is the permittivity of free space.'
      - 'Potential falls as 1/r, and it is proportional to q, one charge only, because it is energy per unit test charge.'
      - 'The trap is C, with r². That is the electric field strength $E = \dfrac{q}{4\pi\varepsilon_0 r^{2}}$, not the potential.'
    hint: 'Potential goes as 1 over r; field strength goes as 1 over r squared.'
    why:
      B: 'Squares q and r; that is the form of a force between two equal charges, not a potential.'
      C: 'That is the electric field strength, which falls as 1/r².'
      D: 'The potential depends on q, not q²; it is per unit test charge.'

  6:
    answer: D
    steps:
      - 'Fact: the output characteristic of a transistor plots collector current I against collector-emitter voltage V, for a fixed base current.'
      - 'At very small V the collector current rises steeply. Once V passes a few tenths of a volt, the current levels off, because it is now fixed by the base current (I_C ≈ β I_B), not by V.'
      - 'So the curve rises sharply from near the origin and then flattens out. That is graph D.'
      - 'This flat region is why a transistor amplifies: a small change in base current, not in V, controls the collector current, like a tap controlling water from a borehole tank.'
      - 'The trap is B. That steep upward curve is the shape for a diode, or for the base-emitter input characteristic, not the output.'
    hint: 'Once the transistor is switched on, does a bigger collector voltage still push much more current?'
    why:
      A: 'In A the current falls as the voltage rises, which no transistor output curve does.'
      B: 'B is the shape of a diode or the input characteristic, rising ever more steeply.'
      C: 'C is an ohmic conductor obeying Ohm''s law, with I proportional to V.'

  7:
    answer: C
    steps:
      - 'Fact: a gas at ordinary atmospheric pressure is a very poor conductor of electricity.'
      - 'Reason: when most of the gas is pumped out, the pressure is low and the few ions and electrons can travel far between collisions. They gain enough energy from the field to ionize more atoms, so a current flows.'
      - 'This is how the fluorescent tube in a classroom or the neon sign at a shop lights up: a gas at low pressure conducting with a high voltage.'
      - 'The trap is D, low voltage. Discharge tubes need a high voltage, often thousands of volts; low pressure is what pumping out gives.'
    hint: 'What does pumping out the gas do to the pressure inside the tube?'
    why:
      A: 'Pumping out gas changes the pressure, not the steadiness of the voltage.'
      B: 'At high pressure the gas hardly conducts at all.'
      D: 'Discharge tubes need a high voltage across them.'

  8:
    answer: D
    steps:
      - 'Fact: a natural source of light produces its own light without any human-made device. A luminous body gives out its own light; a non-luminous body only reflects light.'
      - 'The Sun and the stars are luminous: nuclear fusion makes them glow.'
      - 'The Moon is non-luminous. Moonlight over a village at night is sunlight reflected from the Moon''s surface.'
      - 'A street light is luminous but man-made, so it is an artificial source.'
      - 'So only II and IV are natural sources. The trap is A, which counts the Moon because it looks bright.'
    hint: 'Does the Moon make its own light, or does it reflect someone else''s?'
    why:
      A: 'The Moon only reflects sunlight; it is not a source.'
      B: 'The Moon reflects light and a street light is artificial.'
      C: 'A street light is an artificial source, and the Sun is missing.'

  9:
    answer: A
    steps:
      - 'Fact: light from the object bends away from the normal as it passes from water into air, because light travels faster in air.'
      - 'Your eye traces the bent rays straight back, so they seem to come from a point higher up. The real depth looks smaller: real depth ÷ apparent depth = n = 4/3 for water.'
      - 'That is refraction. It is why a borehole well or a swimming pool always looks shallower than it is.'
      - 'The trap is B, reflection. Reflection sends light back into the same medium; here the light crosses from water into air.'
    hint: 'What happens to light as it crosses the water surface into air?'
    why:
      B: 'Reflection keeps light in the same medium; here it passes from water to air.'
      C: 'An inverter is an electrical device that changes d.c. to a.c.'
      D: 'A magnifier is a lens; the effect needs no lens, only the water surface.'

  10:
    answer: D
    steps:
      - 'Data: F = 2 N, angle between F and the floor θ = 60°, distance moved s = 3 m, W = ?'
      - 'Work done is the force in the direction of motion times the distance moved: $W = Fs\cos\theta$.'
      - 'All units are already SI (N and m), so the answer comes out in joules.'
      - '$W = 2 \times 3 \times \cos 60^\circ = 6 \times 0.5$'
      - 'W = 3 J. Check: only part of the pull moves the bag forward, so W must be less than 6 J.'
      - 'The trap is A, 6 J. It multiplies F by s and forgets that only the horizontal part, F cos 60°, does the work.'
    hint: 'Only the part of the pull along the floor does work. What is 2 cos 60°?'
    why:
      A: 'Uses the whole 2 N; only F cos 60° = 1 N acts along the floor.'
      B: 'No correct use of the angle gives 4 J.'
      C: 'No use of the angle gives 5 J; even the wrong sin 60° gives about 5.2 J, and the part along the floor, 1 N, gives 3 J.'

  11:
    answer: B
    steps:
      - 'Data: m₁ = 5.0 kg, m₂ = 10.0 kg, r = 0.3 m, G = 6.67 × 10⁻¹¹ N m² kg⁻², F = ?'
      - 'Newton''s law of universal gravitation: the force between two masses is proportional to the product of the masses and inversely proportional to the square of their distance apart, $F = \dfrac{Gm_1m_2}{r^{2}}$.'
      - 'All values are in SI units already.'
      - '$F = \dfrac{6.67 \times 10^{-11} \times 5.0 \times 10.0}{0.3^{2}} = \dfrac{3.335 \times 10^{-9}}{0.09}$'
      - '$F = 3.71 \times 10^{-8}$ N. A tiny force, as expected for everyday masses; only planet-sized masses give large gravitational pulls.'
      - 'The trap is forgetting to square r: dividing by 0.3 instead of 0.09 gives a value three times too small.'
    hint: 'Square the distance first: 0.3² = 0.09.'
    why:
      A: 'Does not come from the formula; 6.67 × 10⁻¹¹ × 50 ÷ 0.09 is 3.71 × 10⁻⁸ N.'
      C: 'Rounds 3.71 to one figure, giving 4 × 10⁻⁸; to three figures the value is 3.71 × 10⁻⁸ N.'
      D: 'Does not come from the formula; 6.67 × 10⁻¹¹ × 50 ÷ 0.09 is 3.71 × 10⁻⁸ N.'

  12:
    answer: D
    steps:
      - 'Fact: glass is a poor conductor of heat.'
      - 'When hot water goes into the thick tumbler, the inner surface heats up and expands at once, but the heat takes time to reach the outer surface, which stays cool and does not expand.'
      - 'The inner layer pushes against the cold outer layer. This uneven expansion sets up a large strain and the glass cracks.'
      - 'A thin tumbler heats through almost at once, so it expands evenly and survives. That is why laboratory beakers are made thin.'
      - 'The trap is B. If glass were a good conductor, both surfaces would heat together and the tumbler would not crack.'
    hint: 'Does the outside of a thick glass get hot as quickly as the inside?'
    why:
      A: 'Even expansion causes no strain; the cracking comes from uneven expansion.'
      B: 'Glass is a poor conductor; that is why the expansion is uneven.'
      C: 'Glass is not a crystal, and that has nothing to do with the cracking.'

  13:
    answer: B
    steps:
      - 'Read the graph from the origin. The straight line is where Hooke''s law holds; it ends at the proportional limit, the first marked point.'
      - 'Just after it comes the elastic limit, the second marked point. Beyond it the rod no longer returns to its original length.'
      - 'The small dip after that is the yield point, where the metal suddenly stretches more with little extra stress.'
      - 'The curve then rises to the maximum (ultimate) stress, the rod thins at one place, and it snaps at the very end of the curve. That end point, X, is the breaking point.'
      - 'The trap is A. The yield point is the dip near the middle of the graph, not the end.'
    hint: 'What happens to the rod at the last point of the graph?'
    why:
      A: 'The yield point is the dip just after the elastic limit, not the end of the curve.'
      C: 'The elastic limit is near the end of the straight part, far before X.'
      D: 'The proportional limit is where the straight line ends, the first marked point.'

  14:
    answer: C
    steps:
      - 'Fact: polarization is a property of transverse waves only.'
      - 'Reason: in a transverse wave the vibrations are at right angles to the direction of travel, so they can be in many planes and a filter can let through just one plane. In a longitudinal wave the vibrations are along the direction of travel, so there is no plane to filter.'
      - 'Light can be polarized (polaroid sunglasses use this), but sound cannot.'
      - 'The trap is A. Diffraction, reflection and refraction happen to both kinds of wave, so they cannot tell them apart.'
    hint: 'Which property needs the vibrations to be across the direction of travel?'
    why:
      A: 'Both kinds of wave diffract; sound bends round a classroom door.'
      B: 'Both kinds reflect; an echo is reflected sound.'
      D: 'Both kinds refract.'

  15:
    answer: B
    steps:
      - 'Fact: the colours of the spectrum come in the order red, orange, yellow, green, blue, indigo, violet (ROYGBIV).'
      - 'Red is deviated least by a prism and violet the most, so colours far apart in the order are far apart in the spectrum.'
      - 'Green and yellow, indigo and violet, and orange and red are next-door neighbours. Blue and red are four places apart.'
      - 'So blue and red show the widest separation. The trap is C: indigo and violet are at one end of the spectrum, but next to each other.'
    hint: 'Write out ROYGBIV and count the gaps between each pair.'
    why:
      A: 'Green and yellow are next to each other.'
      C: 'Indigo and violet are next to each other.'
      D: 'Orange and red are next to each other.'

  16:
    answer: A
    steps:
      - 'In a series circuit the same current I flows through L and R, so I is drawn as the reference phasor along the horizontal.'
      - 'Across a resistor, the voltage is in phase with the current: V_R lies along I.'
      - 'Across a pure inductor, the voltage leads the current by 90°: V_L is drawn at right angles to I, pointing up (phasors turn anticlockwise, so "ahead" is up).'
      - 'That is diagram A: V_R along I and V_L straight up. The supply voltage is their phasor sum, $V = \sqrt{V_R^{2} + V_L^{2}}$.'
      - 'The trap is B, with V_L pointing down. A voltage that lags the current by 90° belongs to a capacitor, not an inductor.'
    hint: 'Which voltage is in phase with I, and does the inductor voltage lead or lag?'
    why:
      B: 'V_L down means it lags I by 90°, which is a capacitor''s behaviour.'
      C: 'Swaps them; the resistor voltage, not the inductor voltage, is in phase with I.'
      D: 'Swaps them and also puts the perpendicular phasor lagging.'

  17:
    answer: A
    steps:
      - 'Fact: a transistor has two main uses, as a switch and as an amplifier.'
      - 'As an amplifier, a small base current controls a much larger collector current, so a weak signal from a microphone can drive a loudspeaker.'
      - 'As a switch, the transistor is either fully off or fully on. Millions of them switching inside a phone or a computer handle the 0s and 1s.'
      - 'The trap is D. Storing charge is the job of a capacitor, not a transistor.'
    hint: 'Think of the two jobs a transistor does in a radio and in a computer.'
    why:
      B: 'Rectifying a.c. to d.c. is the main job of a diode.'
      C: 'Storing charge is the job of a capacitor.'
      D: 'Storing charge is the job of a capacitor.'

  18:
    answer: C
    steps:
      - 'Fact: increasing the pressure on ice lowers its melting point.'
      - 'Under the thin loaded wire the pressure is very high, so the ice just below the wire melts even below 0 °C, and the wire sinks into the water.'
      - 'Above the wire the pressure returns to normal, so that water freezes again. The wire passes through, and the block stays whole.'
      - 'This melting under pressure and refreezing when the pressure is removed is called regelation. It also explains how snow packs into a snowball when you squeeze it.'
      - 'The trap is A, fusion. Fusion is only melting; regelation is melting and refreezing.'
    hint: 'The ice melts under the wire and then turns solid again behind it. What is that called?'
    why:
      A: 'Fusion is melting only; here the water freezes again.'
      B: 'Sublimation is solid turning straight to vapour.'
      D: 'Condensation is vapour turning to liquid.'

  19:
    answer: B
    steps:
      - 'Fact: a pair of vernier callipers has inside jaws as well as outside jaws, and reads to 0.01 cm (0.1 mm).'
      - 'The inside jaws go into the mouth of the test tube and open until they touch the inner walls, so the inner diameter is read directly.'
      - 'A micrometer screw gauge is more precise, but its jaws only grip from outside, so it measures outer diameters and thicknesses such as a wire or a sheet of paper.'
      - 'The trap is A. Higher precision is no use if the instrument cannot reach the inside.'
    hint: 'Which instrument has jaws that open outwards inside a hole?'
    why:
      A: 'The micrometer grips from outside only; it cannot measure an inner diameter.'
      C: 'A metre rule reads only to 0.1 cm and cannot reach inside.'
      D: 'Dividers only transfer a length to a rule; they are not accurate for this.'

  20:
    answer: A
    steps:
      - 'Data: R₀ = 3.0 Ω at 0 °C, R₁₀₀ = 8.0 Ω at 100 °C, R_θ = 6.0 Ω, θ = ?'
      - 'Rule: the resistance of platinum rises evenly with temperature, so $\theta = \dfrac{R_\theta - R_0}{R_{100} - R_0} \times 100\ ^\circ\text{C}$.'
      - 'All resistances are in ohms, so they cancel and θ comes out in °C.'
      - '$\theta = \dfrac{6.0 - 3.0}{8.0 - 3.0} \times 100 = \dfrac{3.0}{5.0} \times 100$'
      - 'θ = 60 °C. Check: 6.0 Ω lies between 3.0 and 8.0 Ω, so θ must lie between 0 and 100 °C.'
      - 'The trap is dividing by 8.0 Ω. The scale runs over the fundamental interval, 8.0 − 3.0 = 5.0 Ω, not over 8.0 Ω.'
    hint: 'How far is 6.0 Ω along the 3.0 Ω to 8.0 Ω range?'
    why:
      B: 'Does not come from (6.0 − 3.0) ÷ (8.0 − 3.0); the fraction is 3/5, not 4/5.'
      C: 'Divides the rise of 3.0 Ω by 6.0 Ω instead of by the interval 8.0 − 3.0 = 5.0 Ω.'
      D: 'Uses the rise of 3.0 Ω as if it were the fraction 3/10.'

  21:
    answer: B
    steps:
      - 'Fact: the angle of deviation is the angle between the direction of the incident ray and the direction of the emergent ray.'
      - 'In the diagram the incident ray is continued forward as a dashed line, and the emergent ray is traced back as a dashed line until the two meet.'
      - 'The angle between them where they meet is θ3. That is the total turn the prism gives the light.'
      - 'For a prism, $D = i + e - A$, where i and e are the angles of incidence and emergence and A is the refracting angle at X.'
      - 'The trap is A, θ2. That is only the bending at the first face, between the continued incident ray and the ray inside the glass.'
    hint: 'Look for the angle between where the light was going and where it ends up going.'
    why:
      A: 'θ2 is only the deviation at the first face, not the whole prism.'
      C: 'θ1 is the angle between the incident ray and the ray in the glass measured on the base side.'
      D: 'θ4 is between the ray in the glass and the emergent ray at the second face.'

  22:
    answer: C
    steps:
      - 'Pressure is force per unit area, $p = \dfrac{F}{A}$.'
      - 'Force = mass × acceleration, so its dimension is $[F] = \text{M} \times \text{LT}^{-2} = \text{MLT}^{-2}$.'
      - 'Area is length × length, $[A] = \text{L}^{2}$.'
      - '$[p] = \dfrac{\text{MLT}^{-2}}{\text{L}^{2}} = \text{ML}^{-1}\text{T}^{-2}$, matching the unit N m⁻², the pascal.'
      - 'The trap is B. MLT⁻² is force; it forgets to divide by the area.'
    hint: 'Start from pressure = force ÷ area, and write force as mass × acceleration.'
    why:
      A: 'ML²T⁻³ is the dimension of power.'
      B: 'MLT⁻² is the dimension of force; pressure divides it by area.'
      D: 'ML⁻³ is the dimension of density.'

  23:
    answer: B
    steps:
      - 'Data: C = 8 μF, V = 100 V, energy W = ?'
      - 'Energy stored in a capacitor is half the capacitance times the square of the p.d., $W = \tfrac{1}{2}CV^{2}$.'
      - 'Convert to SI: C = 8 μF = 8 × 10⁻⁶ F.'
      - '$W = \tfrac{1}{2} \times 8 \times 10^{-6} \times 100^{2} = 4 \times 10^{-6} \times 10^{4}$'
      - '$W = 4.0 \times 10^{-2}$ J. A small capacitor stores only a few hundredths of a joule, which makes sense.'
      - 'The trap is leaving C in microfarads: ½ × 8 × 100² = 4 × 10⁴, a huge number with the wrong power of ten.'
    hint: 'Change 8 μF to farads before you use W = ½CV².'
    why:
      A: 'Far too large for 8 μF at 100 V; ½ × 8 × 10⁻⁶ × 100² is only 4.0 × 10⁻² J.'
      C: 'Far too large for 8 μF at 100 V; a small capacitor stores only a few hundredths of a joule.'
      D: 'Far too large for 8 μF at 100 V; ½ × 8 × 10⁻⁶ × 100² is only 4.0 × 10⁻² J.'

  24:
    answer: A
    steps:
      - 'Fact: cathode rays are streams of fast-moving electrons given off by the cathode of a discharge tube at low pressure.'
      - 'Statement I is true: electrons are tiny particles with negative charge.'
      - 'Statement II is false: because they are charged, cathode rays are deflected by both magnetic and electric fields. This is how the old TV picture tube steered its beam.'
      - 'Statement III is false: neutrons have no charge, so they would not be deflected at all. Cathode rays are electrons, not neutrons.'
      - 'So only I is correct. The trap is C: being deflected in a magnetic field is true, but "not in an electric field" makes II false.'
    hint: 'Cathode rays are electrons. Would an electric field push on an electron?'
    why:
      B: 'Neutrons are uncharged; cathode rays are electrons.'
      C: 'Cathode rays are also deflected by an electric field, so II is false.'
      D: 'Both II and III are false.'

  25:
    answer: B
    steps:
      - 'Data: r = 36 cm, so f = r/2 = 18 cm. Real image, magnification m = 3, u = ?'
      - 'Magnification: m = v/u, so for a real image three times the size, v = 3u (both in front of the mirror).'
      - 'Mirror formula: $\dfrac{1}{f} = \dfrac{1}{u} + \dfrac{1}{v}$, so $\dfrac{1}{18} = \dfrac{1}{u} + \dfrac{1}{3u} = \dfrac{4}{3u}$.'
      - '3u = 4 × 18 = 72, so u = 24 cm.'
      - 'Check: v = 72 cm and 72/24 = 3. The object at 24 cm lies between F (18 cm) and C (36 cm), where a concave mirror gives a real, enlarged image.'
      - 'The trap is A, 12 cm. That is inside F, where the image is magnified three times but virtual, like a shaving mirror.'
    hint: 'For a real image, put v = 3u into the mirror formula.'
    why:
      A: 'At 12 cm (inside F) the image is three times the size but virtual and erect.'
      C: 'At 48 cm the image is real but smaller than three times (m = 0.6).'
      D: 'At 108 cm the image is real but diminished.'

  26:
    answer: C
    steps:
      - 'Rules: capacitors in parallel add, C = C₁ + C₂. Capacitors in series combine as $\dfrac{1}{C} = \dfrac{1}{C_1} + \dfrac{1}{C_2}$.'
      - 'The two 2 μF capacitors are in parallel: 2 + 2 = 4 μF.'
      - 'That 4 μF is in series with the 4 μF capacitor: $\dfrac{1}{C} = \dfrac{1}{4} + \dfrac{1}{4} = \dfrac{1}{2}$, so C = 2 μF.'
      - 'Check: a series combination is always smaller than its smallest member, and 2 μF is less than 4 μF.'
      - 'The trap is A, 8.0 μF. It adds all the capacitors as if they were resistors in series.'
    hint: 'Combine the parallel pair first, then put the result in series with 4 μF.'
    why:
      A: 'Adds all three; series capacitors do not add.'
      B: 'Nothing here combines to 6 μF; the pair gives 4 μF, and 4 μF in series with 4 μF gives 2 μF.'
      D: 'Stops after the parallel pair and forgets the series 4 μF.'

  27:
    answer: B
    steps:
      - 'Data: f₁ = 250 Hz, T₁ = 10 N, f₂ = 350 Hz, length fixed, T₂ = ?'
      - 'Law of tension for a stretched string: at fixed length and mass per unit length, the frequency is proportional to the square root of the tension, $f \propto \sqrt{T}$, so $\dfrac{f_2}{f_1} = \sqrt{\dfrac{T_2}{T_1}}$.'
      - 'Square both sides: $T_2 = T_1\left(\dfrac{f_2}{f_1}\right)^{2} = 10 \times \left(\dfrac{350}{250}\right)^{2}$'
      - 'T₂ = 10 × 1.4² = 10 × 1.96 = 19.6 N.'
      - 'Check: a higher note needs a tighter string, so T₂ must be more than 10 N.'
      - 'The trap is C, 14.0 N. It treats frequency as directly proportional to tension and forgets the square root.'
    hint: 'f is proportional to √T. Square the frequency ratio.'
    why:
      A: 'Uses (250/350)², which lowers the tension for a higher note.'
      C: 'Takes f proportional to T instead of √T.'
      D: 'Uses 250/350 the wrong way round and forgets to square.'

  28:
    answer: D
    steps:
      - 'Data: distance from a compression to the next rarefaction = 17 cm, v = 340 m s⁻¹, f = ?'
      - 'A compression and the next rarefaction are half a wavelength apart, so λ = 2 × 17 cm = 34 cm.'
      - 'Convert to SI: λ = 34 cm = 0.34 m.'
      - 'Wave equation: velocity = frequency × wavelength, $v = f\lambda$, so $f = \dfrac{v}{\lambda} = \dfrac{340}{0.34}$.'
      - 'f = 1000 Hz, a normal audible note.'
      - 'The trap is C, 5780 Hz. It multiplies 340 by 17 instead of dividing by the wavelength in metres.'
    hint: 'Compression to rarefaction is half a wavelength. Change it to metres.'
    why:
      A: 'Divides 340 by 34 without changing cm to m.'
      B: 'Divides 340 by 17 without doubling or changing to metres.'
      C: 'Multiplies v by the distance instead of dividing.'

  29:
    answer: C
    steps:
      - 'Fact: a note is an octave above another when its frequency is exactly twice that of the first note.'
