format_version: 1
exam_year: 2018
subject: PHY
explanations:
  1:
    answer: A
    steps:
      - 'Data: 1 km east, then 1 km north. Displacement = ? (size and direction).'
      - 'Displacement is a vector: the straight line from start to finish. The two walks are at right angles, so use Pythagoras: $s = \sqrt{x^{2} + y^{2}}$.'
      - '$s = \sqrt{1^{2} + 1^{2}} = \sqrt{2}$ km ≈ 1.41 km.'
      - 'Direction from north: $\tan\theta = \dfrac{\text{east}}{\text{north}} = \dfrac{1}{1} = 1$, so $\theta = 45°$. The bearing is N 45° E.'
      - 'Check: equal east and north parts must give a line exactly half-way between them, so 45° makes sense.'
      - 'The trap is D. It has the right size but a wrong angle; 60° would need the east part to be bigger than the north part.'
    hint: 'Draw the two walks head to tail. What shape do they make with the straight line home?'
    why:
      B: 'The size cannot be 1 km: the hypotenuse is longer than either side.'
      C: 'Wrong size and wrong angle; equal sides give 45°.'
      D: 'Right size, but equal east and north parts give 45°, not 60°.'

  2:
    answer: B
    steps:
      - 'Data: $V_1$ = 400 cm³, $\rho_1$ = 0.9 g cm⁻³, $\rho_2$ = 0.6 g cm⁻³, $V_2$ = ?'
      - 'Density is mass per unit volume, $\rho = \dfrac{m}{V}$. No oil is lost, so the mass stays the same.'
      - 'Mass: $m = \rho_1 V_1 = 0.9 \times 400 = 360$ g.'
      - 'New volume: $V_2 = \dfrac{m}{\rho_2} = \dfrac{360}{0.6} = 600$ cm³.'
      - 'Check: the oil became less dense, so the same mass must take up more room. 600 cm³ is bigger than 400 cm³, as it should be.'
      - 'The trap is A, 360 cm³. That is the mass in grams, not a volume.'
    hint: 'The mass does not change. Find it first.'
    why:
      A: '360 is the mass in grams, not the new volume.'
      C: 'Multiplies 400 by 0.6; a less dense oil must take up more volume, not less.'
      D: '800 cm³ would mean the density had halved, to 0.45 g cm⁻³. It fell only to 0.6 g cm⁻³, so the volume grows by 0.9 ÷ 0.6 = 1.5 times, to 600 cm³.'

  3:
    answer: D
    steps:
      - 'A neutral body has equal numbers of protons and electrons. Charging moves electrons, because protons are locked in the nucleus.'
      - 'A body that has lost electrons has a deficit of electrons and is positive. So A is true.'
      - 'A body that has gained electrons has an excess of electrons and is negative. So B is true.'
      - 'In a metal wire the charge carriers are free electrons, so current in a wire is a flow of electrons. So C is true.'
      - 'All three statements are true, so the answer is "All of the above". Think of rubbing a plastic comb on dry hair: electrons move from the hair to the comb, and the comb becomes negative.'
    hint: 'Check each statement on its own. Are any of them false?'
    why:
      A: 'True, but B and C are also true.'
      B: 'True, but A and C are also true.'
      C: 'True, but A and B are also true.'

  4:
    answer: C
    steps:
      - 'Natural radioactivity is the spontaneous break-up of unstable nuclei such as uranium and radium.'
      - 'Three kinds of radiation come out: α-particles (helium nuclei), β-particles (fast electrons) and γ-rays (high-energy electromagnetic waves).'
      - 'X-rays are not given out by the nucleus. They are made when fast electrons hit a metal target in an X-ray tube.'
      - 'So natural radioactivity gives α, β and γ radiation.'
      - 'The trap is A. It lists two of the three and leaves out γ-rays, which usually come out with them.'
    hint: 'Name all three radiations from an unstable nucleus.'
    why:
      A: 'Leaves out γ-rays.'
      B: 'X-rays come from an X-ray tube, not from the nucleus.'
      D: 'X-rays are not part of natural radioactivity, and α and β are missing.'

  5:
    answer: D
    steps:
      - 'The image in a plane mirror is erect (upright), virtual, laterally inverted, the same size as the object, and as far behind the mirror as the object is in front.'
      - 'So A, B and C all describe it correctly.'
      - 'The image is the same size, never magnified. The magnification of a plane mirror is 1.'
      - 'Example: in the mirror at a barber''s shop your face looks its real size, but your right hand appears as the left hand of the image.'
      - 'The question asks for what does NOT describe the image, so the answer is "Magnified".'
    hint: 'Is the image in a plane mirror bigger, smaller or the same size?'
    why:
      A: 'The plane-mirror image is erect, so this does describe it.'
      B: 'The image is laterally inverted, so this does describe it.'
      C: 'The image is as far behind the mirror as the object is in front, so this does describe it.'

  6:
    answer: A
    steps:
      - 'Data: 3 Ω and 4 Ω in the outer wires; two 2 Ω resistors joined across between them. $R$ = ?'
      - 'The two 2 Ω resistors share the same two junctions, so they are in parallel: $\dfrac{1}{R_p} = \dfrac{1}{R_1} + \dfrac{1}{R_2}$.'
      - '$\dfrac{1}{R_p} = \dfrac{1}{2} + \dfrac{1}{2} = 1$, so $R_p = 1\ \Omega$.'
      - 'The current from one terminal goes through 3 Ω, then the parallel pair, then 4 Ω. These are in series: $R = 3 + 1 + 4 = 8\ \Omega$.'
      - 'Check: two equal resistors in parallel give half of one, and the series sum must be more than the 4 Ω alone.'
      - 'The trap is B, 11 Ω. It adds all the resistors as if they were in series, and 3 + 2 + 2 + 4 is 11.'
    hint: 'Combine the two 2 Ω resistors first. Are they side by side or one after the other?'
    why:
      B: 'Adds every resistor in series; the two 2 Ω resistors are in parallel.'
      C: 'Too small; the 3 Ω and 4 Ω resistors are in series with everything else, so the total must be more than 4 Ω. It is 3 + 1 + 4.'
      D: '3.6 Ω is less than the 4 Ω resistor alone, which is in series with the rest, so it cannot be the total. Only the two 2 Ω resistors are in parallel.'

  7:
    answer: B
    steps:
      - 'Energy is never created or destroyed. It only changes from one form to another (the law of conservation of energy).'
      - 'The steam engine burns fuel to make hot steam: heat energy. The steam pushes the piston and turns the shaft: kinetic energy.'
      - 'The shaft turns the generator, which changes kinetic energy into electrical energy.'
      - 'The lamp filament gets hot and glows: electrical energy becomes heat and light.'
      - 'So the chain is heat → kinetic → electricity → heat and light. A diesel generator in your street does the same job, with burning fuel in place of steam.'
    hint: 'Follow the energy machine by machine: engine, then generator, then lamp.'
    why:
      A: 'An engine does not make light or sound before it moves; the order is wrong.'
      C: 'Starts with kinetic energy and ends with electricity, but the lamp is last and gives light.'
      D: 'Starts with electricity, but the steam engine is the first machine and it runs on heat.'

  8:
    answer: D
    steps:
      - 'Cathode rays are produced in a discharge tube at very low pressure when a high voltage is applied across it.'
      - 'They leave the cathode (the negative electrode), travel in straight lines, carry negative charge and are bent by electric and magnetic fields.'
      - 'J. J. Thomson measured their charge-to-mass ratio and showed they are streams of electrons.'
      - 'The old television tube was a cathode-ray tube: a beam of electrons painted the picture on the screen.'
      - 'The trap is A. Electromagnetic waves carry no charge, so they could not be bent by an electric field as cathode rays are.'
    hint: 'Cathode rays are bent by an electric field towards the positive plate. What does that say about their charge?'
    why:
      A: 'Electromagnetic waves are not deflected by electric or magnetic fields; cathode rays are.'
      B: 'Protons are positive; cathode rays are negative.'
      C: 'Neutrons have no charge, but cathode rays are deflected by fields.'

  9:
    answer: C
    steps:
      - 'White light is a mixture of colours, from red to violet.'
      - 'In glass, each colour travels at a different speed, so each colour has a slightly different refractive index: $n = \dfrac{c}{v}$.'
      - 'Violet is slowed most and bent most; red is slowed least and bent least. So the colours separate into a spectrum. This is dispersion.'
      - 'A rainbow in the sky after rain in Lagos is the same effect, with raindrops in place of the prism.'
      - 'The trap is B. The prism adds no colour; the colours were already in the white light.'
    hint: 'Why would one colour bend more than another in glass?'
    why:
      A: 'True, but it does not explain why the colours separate.'
      B: 'The glass has no colours of its own; they were in the white light.'
      D: 'The beam is refracted twice, not totally internally reflected.'

  10:
    answer: D
    steps:
      - 'Data: load $L$ = 120.0 N, efficiency = 40% = 0.40, six pulleys (three in each block), effort $W$ = ?'
      - 'In a block and tackle, the velocity ratio equals the number of rope strands holding the lower block, which is the total number of pulleys: VR = 6.'
      - 'Efficiency = $\dfrac{\text{MA}}{\text{VR}}$, so $\text{MA} = 0.40 \times 6 = 2.4$.'
      - '$\text{MA} = \dfrac{\text{load}}{\text{effort}}$, so $W = \dfrac{120.0}{2.4} = 50.0$ N.'
      - 'Check: a perfect machine would need only 120 ÷ 6 = 20 N. Friction and the weight of the lower block mean more effort is needed, and 50 N is more than 20 N.'
      - 'The trap is B, 48 N. That is 120 × 0.4, which multiplies the load by the efficiency and forgets the velocity ratio.'
    hint: 'Count the strands holding the lower block to get VR. Then use efficiency = MA ÷ VR.'
    why:
      A: '28 N would mean an efficiency of 120 ÷ (6 × 28) ≈ 71%, not 40%. With VR = 6 and MA = 2.4 the effort is 50 N.'
      B: 'Multiplies the load by the efficiency and ignores the velocity ratio.'
      C: 'Multiplies where it should divide; the effort must be less than the load in this machine.'

  11:
    answer: A
    steps:
      - 'Two light nuclei, each with mass number 2, join to make one heavier nucleus of mass number 3, with a neutron and energy released.'
      - 'Check the numbers: mass number 2 + 2 = 3 + 1, and proton number 1 + 1 = 2 + 0. The equation balances.'
      - 'Joining light nuclei to make a heavier one is nuclear fusion. It is how the sun makes its energy.'
      - 'Fission is the opposite: a heavy nucleus such as uranium-235 splits into two lighter ones.'
      - 'The trap is B. Fission and fusion both release energy, but fission splits heavy nuclei; here small nuclei are joining.'
    hint: 'Are the nuclei joining or splitting?'
    why:
      B: 'Fission splits a heavy nucleus; here two light nuclei join.'
      C: 'A chain reaction is a fission process kept going by the neutrons released.'
      D: 'Radioactive decay starts from one unstable nucleus, not two colliding ones.'

  12:
    answer: C
    steps:
      - 'Heat capacity is the heat needed to raise the temperature of a whole body by 1 K. Its unit is J K⁻¹.'
      - 'Specific heat capacity is the heat needed to raise 1 kg of a substance by 1 K. Its unit is J kg⁻¹ K⁻¹.'
      - 'Here the body is a definite 10 kg of copper, raised by 1 K, so the heat needed is its heat capacity: $C = mc = 10 \times 390 \approx 3900\ \text{J K}^{-1}$.'
      - 'Memory aid: "specific" means "per kilogram". Without the per kilogram, it is the heat capacity of that body.'
      - 'The trap is A. Specific heat capacity is for 1 kg only, not for 10 kg.'
    hint: 'Is the mass here 1 kg, or the whole lump of copper?'
    why:
      A: 'Specific heat capacity is for 1 kg, but this is 10 kg.'
      B: 'Latent heat changes the state without changing the temperature.'
      D: 'Internal energy is the total energy of the molecules, not the heat for a 1 K rise.'

  13:
    answer: B
    steps:
      - 'Data: $z$ = 0.0012 g C⁻¹, $m$ = 36.0 g, $t$ = 5.0 min, $I$ = ?'
      - 'Faraday''s first law: the mass deposited is proportional to the charge passed, $m = zIt$.'
      - 'Convert time to seconds: $t = 5.0 \times 60 = 300$ s.'
      - '$I = \dfrac{m}{zt} = \dfrac{36.0}{0.0012 \times 300} = \dfrac{36.0}{0.36} = 100$ A.'
      - 'Check: 100 A for 300 s is 30 000 C, and 30 000 × 0.0012 = 36 g. It works.'
      - 'The trap is A, 6000 A. That forgets to change 5 minutes into 300 seconds.'
    hint: 'Use m = zIt, with time in seconds.'
    why:
      A: 'Uses 5 for the time instead of 300 seconds.'
      C: 'Works out 0.0012 × 300 as 3.6 instead of 0.36, a slip of one decimal place: 36.0 ÷ 3.6 = 10.'
      D: 'Far too small; 1 A for 300 s passes only 300 C, which deposits just 0.36 g of silver, not 36 g.'

  14:
    answer: D
    steps:
      - 'Light travels in straight lines. This is called rectilinear propagation.'
      - 'An opaque object blocks the straight rays, so a dark region with sharp edges forms behind it: a shadow.'
      - 'An eclipse is a giant shadow. In a solar eclipse the moon blocks the sun''s rays from part of the earth; in a lunar eclipse the earth''s shadow falls on the moon.'
      - 'Example: your shadow on the ground at noon in the dry season has sharp edges because light cannot bend round you.'
      - 'The trap is C. Diffraction is light bending round edges, which would blur shadows, not make them.'
    hint: 'Why can light not reach the region behind an object?'
    why:
      A: 'Refraction is bending at a boundary between media; it does not make shadows.'
      B: 'Reflection is bouncing off a surface; shadows come from blocked rays.'
      C: 'Diffraction is spreading round edges, which works against sharp shadows.'

  15:
    answer: A
    steps:
      - 'Ohm''s law: the current in a conductor is directly proportional to the potential difference across it, provided the temperature and other physical conditions stay constant. $V = IR$ with $R$ constant.'
      - 'Metals such as copper wire give a straight-line graph of $V$ against $I$ through the origin at constant temperature. They are ohmic.'
      - 'A diode lets current flow mainly one way, so its graph is not a straight line. It is non-ohmic.'
      - 'Electrolytes do not all obey the law (there is a back e.m.f. at the electrodes), and glass is an insulator.'
      - 'So all metals, kept at constant temperature, obey Ohm''s law. A NEPA cable carrying a steady current is an example.'
    hint: 'Which of these gives a straight-line graph of V against I through the origin?'
    why:
      B: 'A diode is non-ohmic: it conducts well one way and hardly at all the other way.'
      C: 'Not all electrolytes obey Ohm''s law.'
      D: 'Glass is an insulator and does not conduct at ordinary temperatures.'

  16:
    answer: D
    steps:
      - 'Isotopes are atoms of the same element with the same number of protons but different numbers of neutrons, for example $^{35}_{17}\text{Cl}$ and $^{37}_{17}\text{Cl}$.'
      - 'Statement III is the definition: same number of protons. True.'
      - 'Statement I: same protons means the same number of electrons in the neutral atom, and chemistry depends on the electrons. So isotopes have the same chemical properties. True.'
      - 'Statement II: since their chemistry is the same, isotopes cannot be separated chemically. They are separated by physical properties that depend on mass, such as diffusion, centrifuges or the mass spectrometer. True.'
      - 'All three statements are true.'
      - 'The trap is C. It is easy to doubt statement I, but the reason given (same number of electrons) is exactly right.'
    hint: 'Isotopes differ only in neutrons. What does that change, and what stays the same?'
    why:
      A: 'Leaves out III, which is the definition of isotopes.'
      B: 'Leaves out II; isotopes are separated by physical means because their chemistry is the same.'
      C: 'Leaves out I; equal numbers of electrons do give the same chemical properties.'

  17:
    answer: C
    steps:
      - 'Data: $m_1$ on the table, $m_2$ hanging, $m_1$ just about to slide. $\mu$ = ?'
      - 'When the block is on the verge of sliding, friction has reached its limiting value: $F = \mu R$, and $R = m_1 g$ on a level table.'
      - 'The hanging mass is still at rest, so the string tension is $T = m_2 g$, and this tension pulls $m_1$.'
      - 'Balance the forces on $m_1$: $\mu m_1 g = m_2 g$.'
      - 'Cancel $g$: $\mu = \dfrac{m_2}{m_1}$.'
      - 'Check: $\mu$ is a ratio of two forces, so it has no unit. $\dfrac{m_2 g}{m_1}$ would have the unit m s⁻², so D cannot be a coefficient of friction.'
    hint: 'Which force pulls the block, and which force holds it back? Set them equal.'
    why:
      A: 'Upside down; it is the hanging mass over the block on the table.'
      B: 'Upside down, and the g should cancel.'
      D: 'The g should cancel; a coefficient of friction has no unit.'

  18:
    answer: A
    steps:
      - 'On a hot afternoon the road heats the air just above it. Hot air is less dense and has a lower refractive index, so the refractive index rises steadily with height. Statement I is true.'
      - 'Light from the sky heading down passes from denser to less dense layers and bends further and further away from the normal.'
      - 'Close to the road the angle passes the critical angle, and the light is totally internally reflected upwards into your eyes. Statement III is true.'
      - 'You see the sky as a shiny patch on the road, which looks like water. That is the mirage you see ahead of a danfo on the Lagos-Ibadan expressway.'
      - 'The road surface itself does not become a mirror; the bending happens in the air. Statement II is false. So the answer is I and III only.'
    hint: 'Does the bending happen in the road surface or in the air above it?'
    why:
      B: 'Statement II is false; the road does not become a mirror, the air layers do the work.'
      C: 'Statement II is false, and I and III are both needed.'
      D: 'Statement II is false.'

  19:
    answer: B
    steps:
      - 'Data: atmospheric pressure $H$ = 760 mmHg. Mercury stands 10 cm high in the open limb and 3 cm high in the limb joined to G.'
      - 'In a manometer the side with the higher pressure pushes its mercury down. Pressure of the gas = atmospheric pressure + difference in levels: $P = H + h$.'
      - 'Difference in levels: $h = 10 - 3 = 7$ cm = 70 mm of mercury.'
      - '$P = 760 + 70 = 830$ mmHg.'
      - 'Check: the mercury is pushed down on the gas side and up on the open side, so the gas is above atmospheric pressure. 830 mmHg is more than 760 mmHg, as it should be.'
      - 'The trap is C, 690 mmHg. It subtracts the difference, which would be right only if the open side were lower.'
    hint: 'Which side has its mercury pushed down? That side has the higher pressure.'
    why:
      A: 'Subtracts 100 mm; the difference in levels is 7 cm, and the gas is above atmospheric pressure.'
      C: 'Subtracts the 70 mm instead of adding it; the gas pushes harder than the air.'
      D: 'Adds 100 mm; the difference in levels is 10 − 3 = 7 cm.'

  20:
    answer: D
    steps:
      - 'Internal resistance is the resistance of the materials inside a cell. A low internal resistance lets the cell give a large current.'
      - 'The lead-acid accumulator has large lead plates close together in sulphuric acid, a very good conductor. Its internal resistance is tiny, about 0.01 Ω.'
      - 'That is why a car battery can give the hundred or more amperes a starter motor needs.'
      - 'The Leclanché cell, the dry torch battery and the Daniell cell all have much higher internal resistances, around 0.5 Ω to several ohms.'
      - 'So the accumulator has the lowest internal resistance.'
    hint: 'Which cell can turn a car''s starter motor?'
    why:
      A: 'The Leclanché cell has a fairly high internal resistance and polarises quickly.'
      B: 'The Daniell cell has a higher internal resistance than an accumulator.'
      C: 'A dry torch battery has a high internal resistance, so it gives only small currents.'

  21:
    answer: C
    steps:
      - 'Pitch is how high or low a note sounds. It depends on frequency: the higher the frequency, the higher the pitch.'
      - 'Loudness depends on amplitude (and intensity), not on pitch.'
      - 'So to raise the pitch, increase the frequency. Tightening a guitar string raises its frequency and its pitch.'
      - 'The trap is B. A bigger amplitude makes the note louder, but the pitch is unchanged.'
    hint: 'Pitch goes with which property of the wave?'
    why:
      A: 'Loudness and pitch are separate; making a note quieter does not change its pitch.'
      B: 'A bigger amplitude makes the sound louder, not higher.'
      D: 'Intensity sets loudness, not pitch.'

  22:
    answer: A
    steps:
      - 'In fission, a heavy nucleus such as uranium-235 absorbs a neutron and splits into two lighter nuclei.'
      - 'Each split releases energy and two or three new neutrons.'
      - 'Those neutrons can split more uranium nuclei, which release more neutrons. This self-sustaining process is a chain reaction, used in nuclear power stations.'
      - 'The products are radioactive, and the total mass of the products is slightly less than that of the reactants. The lost mass becomes energy by $E = mc^{2}$.'
      - 'The trap is D. If no mass were lost, no energy would be released.'
    hint: 'What comes out of each fission that can start the next one?'
    why:
      B: 'Fission products are strongly radioactive; that is why nuclear waste is dangerous.'
      C: 'Neutrons are released, two or three per fission.'
      D: 'Some mass is lost and becomes energy, so the masses are not equal.'

  23:
    answer: B
    steps:
      - 'Data: $\alpha = 2 \times 10^{-5}\ {}^{\circ}\text{C}^{-1}$, $V_0$ = 15.00 cm³, $\Delta\theta$ = 100 − 0 = 100 °C, $V$ = ?'
      - 'For a solid, the cubic expansivity is three times the linear expansivity: $\gamma = 3\alpha = 6 \times 10^{-5}\ {}^{\circ}\text{C}^{-1}$.'
      - 'Increase in volume: $\Delta V = V_0 \gamma \Delta\theta = 15.00 \times 6 \times 10^{-5} \times 100 = 0.09$ cm³.'
      - 'New volume: $V = 15.00 + 0.09 = 15.09$ cm³.'
      - 'Check: solids expand very little, so a change of under one per cent makes sense.'
      - 'The trap is D, 15.03 cm³. It uses the linear expansivity for a volume and forgets the factor of 3.'
    hint: 'The question gives the linear expansivity, but asks about volume. What is the link?'
    why:
      A: 'Far too big; a solid expands by less than one per cent here.'
      C: 'Adds a whole 1 cm³, much more than the real expansion.'
      D: 'Uses α instead of γ = 3α for a volume.'

  24:
    answer: C
    steps:
      - 'Data: bullet $m_1$ = 0.05 kg, $u$ = 200 m s⁻¹; block $m_2$ = 0.95 kg at rest. The bullet stays in the block. Final KE = ?'
      - 'The principle of conservation of linear momentum: total momentum before a collision equals total momentum after, $m_1 u = (m_1 + m_2)v$.'
      - '$0.05 \times 200 = (0.05 + 0.95)v$, so $10 = 1.00 \times v$ and $v = 10$ m s⁻¹.'
      - 'Kinetic energy after: $\text{KE} = \tfrac{1}{2}(m_1 + m_2)v^{2} = \tfrac{1}{2} \times 1.00 \times 10^{2} = 50$ J.'
      - 'Check: the bullet had $\tfrac{1}{2} \times 0.05 \times 200^{2} = 1000$ J. Most of it became heat and sound in the inelastic collision, so 50 J is sensible.'
      - 'The trap is B, 100 J. That is $1.00 \times 10^{2}$ with the half left out of $\tfrac{1}{2}mv^{2}$. And do not expect the bullet''s 1000 J to survive: kinetic energy is not conserved when the bullet sticks; only momentum is.'
    hint: 'Use momentum, not energy, to find the speed just after impact.'
    why:
      A: '150 J would need the 1.00 kg to move at about 17 m s⁻¹; momentum gives only 10 m s⁻¹, which makes 50 J.'
      B: 'Forgets the half in KE = ½mv²: 1.00 × 10² = 100 J.'
      D: 'Four times the right value; 200 J would need a speed of 20 m s⁻¹, but momentum gives 10 m s⁻¹.'

  25:
    answer: D
    steps:
      - 'Data: series R-L-C at resonance, $V_R$ = 20 V, $V_L$ = 40 V, $V_C$ = ?'
      - 'At resonance the inductive reactance equals the capacitive reactance: $X_L = X_C$.'
      - 'The same current flows through every part of a series circuit, so $V_L = IX_L$ and $V_C = IX_C$ are equal.'
      - '$V_C = V_L = 40$ V.'
      - 'Check: $V_L$ and $V_C$ are opposite in phase and cancel, so the supply voltage equals $V_R$ = 20 V. That is the sign of resonance.'
      - 'The trap is B, 70 V. A.c. voltages in R-L-C circuits are not simply added.'
    hint: 'At resonance, how do the two reactances compare?'
    why:
      A: 'Does not follow; at resonance V_C equals V_L.'
      B: 'Adds voltages as if they were in phase; they are not.'
      C: 'Does not follow; at resonance V_C equals V_L exactly.'

  26:
    answer: A
    steps:
      - 'Data: fraction left = $\tfrac{1}{64}$ after $t$ = 120 years. Half-life $T_{1/2}$ = ?'
      - 'After each half-life the amount left halves: fraction left = $\left(\tfrac{1}{2}\right)^{n}$, where $n$ is the number of half-lives.'
      - '$\left(\tfrac{1}{2}\right)^{n} = \tfrac{1}{64}$ and $64 = 2^{6}$, so $n = 6$.'
      - '$T_{1/2} = \dfrac{t}{n} = \dfrac{120}{6} = 20$ years.'
      - 'Check: 1 → ½ → ¼ → ⅛ → 1/16 → 1/32 → 1/64 is six halvings, and 6 × 20 = 120 years.'
      - 'The trap is B, 10 years. That would give twelve halvings and leave far less than 1/64.'
    hint: 'How many times must you halve 1 to reach 1/64?'
    why:
      B: 'Twelve half-lives in 120 years would leave 1/4096, not 1/64.'
      C: 'Divides 120 by 64 roughly; the fraction gives the number of halvings, not the half-life directly.'
      D: 'Five half-lives in 120 years would leave 1/32, not 1/64.'

  27:
    answer: B
    steps:
      - 'The period of a simple pendulum depends only on its length: $T = 2\pi\sqrt{\dfrac{l}{g}}$.'
      - 'When P swings, it shakes the rod and pushes every pendulum at P''s frequency.'
      - 'Resonance happens when the pushing frequency equals a pendulum''s own natural frequency. That needs the same length as P.'
      - 'In the diagram, T has the same length as P. So T swings with a large amplitude; the others only jiggle.'
      - 'It is like pushing a child on a swing at the park: push at the swing''s own rhythm and it goes higher and higher.'
    hint: 'The natural frequency of a pendulum depends on its length. Which one matches P?'
    why:
      A: 'U is the longest pendulum, so its natural frequency is much lower than P''s.'
      C: 'R is much shorter than P, so only T resonates.'
      D: 'Q is longer and R is shorter than P; neither has P''s length.'

  28:
    answer: C
    steps:
      - 'Newton''s law of cooling: the rate of loss of heat by a body is directly proportional to the excess of its temperature over that of its surroundings, $\dfrac{dQ}{dt} \propto (\theta - \theta_0)$.'
      - 'It holds for small temperature differences, when the body cools mainly by convection.'
      - 'So the rate depends on the difference between the body''s temperature and the surroundings, not on either temperature alone.'
