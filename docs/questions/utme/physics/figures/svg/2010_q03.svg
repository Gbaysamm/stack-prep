<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 230" width="330" height="230" role="img"
     aria-label="Velocity-time graph. The line starts at E on the velocity axis above the origin O, rises in a straight line to F, stays level from F to G, then falls in a straight line to H on the time axis.">
  <g fill="none" stroke="#1a1a1f" stroke-width="1.6"><path d="M50 22 V190 H305"/></g>
  <path d="M50.0 14.0 L53.5 21.0 L46.5 21.0 Z" fill="#1a1a1f"/>
  <path d="M313.0 190.0 L306.0 193.5 L306.0 186.5 Z" fill="#1a1a1f"/>
  <polyline points="50,145 125,80 205,80 275,190" fill="none" stroke="#3f2fa8" stroke-width="2.6"/>
  <g fill="#1a1a1f"><circle cx="50" cy="145" r="3.2"/><circle cx="125" cy="80" r="3.2"/><circle cx="205" cy="80" r="3.2"/><circle cx="275" cy="190" r="3.2"/></g>
  <g fill="none" stroke="#1a1a1f" stroke-width="1" stroke-dasharray="4 4"><path d="M125 80 V190"/><path d="M205 80 V190"/></g>
  <text x="36" y="150" font-family="system-ui, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#1a1a1f">E</text>
  <text x="120" y="70" font-family="system-ui, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#1a1a1f">F</text>
  <text x="200" y="70" font-family="system-ui, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#1a1a1f">G</text>
  <text x="270" y="208" font-family="system-ui, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#1a1a1f">H</text>
  <text x="36" y="205" font-family="system-ui, sans-serif" font-size="14" text-anchor="start" fill="#1a1a1f">O</text>
  <text x="58" y="18" font-family="system-ui, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1f">v / m s⁻¹</text>
  <text x="300" y="208" font-family="system-ui, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1f">t / s</text>
</svg>
