<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img"
     aria-label="Velocity-time graph. The velocity is 60 metres per second from 0 to 20 seconds, then falls in a straight line to zero at 25 seconds">
  <g fill="none" stroke="#1a1a1f" stroke-width="1.5"><path d="M60 190 H350"/><path d="M60 190 V24"/></g>
  <polygon points="350.0,190.0 341.0,194.5 341.0,185.5" fill="#1a1a1f"/>
  <polygon points="60.0,24.0 64.5,33.0 55.5,33.0" fill="#1a1a1f"/>
  <path d="M260.0 70.0 V190" fill="none" stroke="#1a1a1f" stroke-width="1" stroke-dasharray="4 3"/>
  <polyline points="60.0,70.0 260.0,70.0 310.0,190.0" fill="none" stroke="#3f2fa8" stroke-width="2.4"/>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1f">
    <text x="38" y="74.0">60</text><text x="48" y="206">0</text>
    <text x="253.0" y="206">20</text><text x="303.0" y="206">25</text>
    <text x="285" y="224">time (s)</text><text x="10" y="15">velocity (m s⁻¹)</text>
  </g>
</svg>
