<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" role="img"
     aria-label="A horizontal boundary with glass of refractive index 1.52 above and water of refractive index 1.33 below. An incident ray comes down through the glass to a point on the boundary, making angle i with the dashed normal there, and the refracted ray runs along the boundary to the right, at 90 degrees to the normal">
  <rect x="20" y="20" width="360" height="100" fill="#ece9f8"/>
  <rect x="20" y="120" width="360" height="60" fill="#e3f0f8"/>
  <path d="M20 120 H380" fill="none" stroke="#1a1a1f" stroke-width="1.8"/>
  <path d="M200 30 V175" fill="none" stroke="#1a1a1f" stroke-width="1.2" stroke-dasharray="5 4"/>
  <path d="M200 120 L77.6 52.2" fill="none" stroke="#1a1a1f" stroke-width="2"/>
  <path d="M144.9 89.5 L133.1 88.1 L137.5 80.3 z" fill="#1a1a1f"/>
  <path d="M200 118.5 H360" fill="none" stroke="#3f2fa8" stroke-width="2.4"/>
  <path d="M300 118.5 l-12 -5 v10 z" fill="#3f2fa8"/>
  <path d="M200 80 A40 40 0 0 0 165.0 100.6" fill="none" stroke="#1a1a1f" stroke-width="1.2"/>
  <path d="M200 108 H212 V120" fill="none" stroke="#1a1a1f" stroke-width="1.2"/>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#1a1a1f">
    <text x="30" y="40">Incident ray</text>
    <text x="250" y="60">Glass (n = 1.52)</text>
    <text x="250" y="108">Refracted ray</text>
    <text x="250" y="160">Water (n = 1.33)</text>
    <text x="205" y="42">normal</text>
  </g>
  <text x="176" y="80" font-family="system-ui, sans-serif" font-size="15" font-style="italic" fill="#1a1a1f">i</text>
</svg>
