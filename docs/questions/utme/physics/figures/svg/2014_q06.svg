<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 235" width="380" height="235" role="img" aria-label="Velocity-time graph. From M at the origin the line rises to N, stays level from N to S, rises more steeply from S to the peak P, then falls back to zero velocity at Q on the time axis">
<g fill="none" stroke="#1a1a1f" stroke-width="1.6">
<path d="M50 200 H350"/>
<path d="M50 200 V15"/>
</g>
<polygon points="352,200 343,196 343,204" fill="#1a1a1f"/>
<polygon points="50,13 46,22 54,22" fill="#1a1a1f"/>
<g font-family="system-ui, sans-serif" font-size="13" fill="#1a1a1f">
<text x="356" y="220" text-anchor="end">t (s)</text>
<text x="58" y="19">v (m s⁻¹)</text>
</g>
<polyline points="50,200 115,120 180,120 235,50 310,200" fill="none" stroke="#3f2fa8" stroke-width="2.4"/>
<g fill="#1a1a1f">
<circle cx="115" cy="120" r="3"/>
<circle cx="180" cy="120" r="3"/>
<circle cx="235" cy="50" r="3"/>
<circle cx="310" cy="200" r="3"/>
</g>
<g font-family="system-ui, sans-serif" font-size="14" fill="#1a1a1f">
<text x="34" y="218">M</text>
<text x="108" y="110">N</text>
<text x="176" y="110">S</text>
<text x="230" y="40">P</text>
<text x="304" y="218">Q</text>
</g>
</svg>
