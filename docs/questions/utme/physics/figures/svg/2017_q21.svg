<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 300" width="470" height="300" role="img"
     aria-label="A ray of light passes through a triangular glass prism X Y Z. It enters face X Y, bends towards the base inside the glass, and leaves face X Z bending further towards the base. The incident ray is continued as a dashed line beyond face X Y, and the emergent ray is traced back as a dashed line until it meets it. Theta 1 is the angle at the entry point between the incident ray and the ray in the glass, below the path. Theta 2 is at the entry point, between the dashed continuation and the ray in the glass. Theta 3 is where the two dashed lines meet, between the continued incident direction and the emergent direction. Theta 4 is at the exit point between the ray in the glass and the emergent ray, below the path.">
