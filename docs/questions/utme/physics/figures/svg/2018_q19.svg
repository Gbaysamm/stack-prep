<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="320" height="300" role="img"
     aria-label="A U-tube of mercury. The left limb is open to the air and the right limb joins a gas chamber G. Measured from the bottom of the U, the mercury stands 10 cm high in the open limb and 3 cm high in the limb joined to G">
  <path d="M60 90 V240 A50 50 0 0 0 160 240 V230 H140 V240 A30 30 0 0 1 80 240 V90 Z" fill="#c9c9d3"/>
  <path d="M60 20 V240 A50 50 0 0 0 160 240 V170 H200" stroke="#1a1a1f" stroke-width="2" fill="none"/>
  <path d="M80 20 V240 A30 30 0 0 0 140 240 V150 H200" stroke="#1a1a1f" stroke-width="2" fill="none"/>
  <path d="M200 150 V115 H262 A45 45 0 0 1 262 205 H200 V170" stroke="#1a1a1f" stroke-width="2" fill="none"/>
  <text x="250" y="167" font-family="system-ui, sans-serif" font-size="18" fill="#1a1a1f" text-anchor="middle" font-style="italic">G</text>
  <text x="70" y="14" font-family="system-ui, sans-serif" font-size="11" fill="#1a1a1f" text-anchor="middle">open to the air</text>
  <path d="M30 90 H60 M150 230 H200 M30 290 H200" stroke="#1a1a1f" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M40 94 V286 M185 234 V286" stroke="#1a1a1f" stroke-width="1.2"/>
  <path d="M36 100 L40 90 L44 100 Z M36 280 L40 290 L44 280 Z M181 240 L185 230 L189 240 Z M181 280 L185 290 L189 280 Z" fill="#1a1a1f"/>
  <text x="36" y="195" font-family="system-ui, sans-serif" font-size="13" fill="#1a1a1f" text-anchor="end">10 cm</text>
  <text x="192" y="265" font-family="system-ui, sans-serif" font-size="13" fill="#1a1a1f" text-anchor="start">3 cm</text>
  <text x="110" y="222" font-family="system-ui, sans-serif" font-size="11" fill="#1a1a1f" text-anchor="middle">mercury</text>
</svg>
