        write: 'Discharge tube, gas pumped out, conducts at ?'
      - section: 'The fact'
        say: 'A gas at ordinary pressure is a very poor conductor. In a discharge tube it conducts when its pressure is made very low and a high voltage is applied.'
        write: 'Conduction in gases → low pressure and high voltage'
      - section: 'The reason'
        say: 'At low pressure the molecules are far apart. The few ions and electrons can speed up over a long distance before they hit a molecule.'
        write: 'Molecules far apart → long run to speed up'
      - say: 'They then hit hard enough to ionise the molecule, and the current keeps going.'
        write: 'Hard collisions → ionisation → current'
      - say: 'Pumping gas out of a sealed tube lowers its pressure. That is the low pressure we need.'
        write: 'Pump out gas → pressure falls'
      - section: 'An example'
        say: 'That is how the fluorescent tube in your classroom lights up.'
        write: 'Fluorescent tube, neon sign'
      - section: 'Answer'
        say: 'So electricity is conducted at low pressure, which is option C.'
        write: '$\therefore$ low pressure'
        answer: true
    traps:
      A: 'You went for a steady voltage. The voltage must be high, and steadiness is not the condition.'
      B: 'You chose high pressure. Pumping gas out lowers the pressure. It does not raise it.'
      D: 'You picked low voltage. A discharge tube needs a high voltage, several thousand volts.'
  46:
    moments:
      - section: 'The data'
        say: 'Uranium two three five, atomic number ninety-two, gives out two alpha particles, three beta particles and a gamma ray. What are the mass number and atomic number of what is left?'
        write: 'Parent $^{235}_{92}\text{U}$ emits $2\alpha$, $3\beta$, $1\gamma$;  $A = ?$, $Z = ?$'
      - section: 'The law'
        say: 'An alpha particle is a helium nucleus, mass four and charge two. Each alpha takes four off the mass number and two off the atomic number.'
        write: '$\alpha = {}^{4}_{2}\text{He}$, so $A - 4$, $Z - 2$'
      - say: 'A beta particle is an electron, mass zero and charge minus one. Each beta leaves the mass number alone and adds one to the atomic number.'
        write: '$\beta = {}^{0}_{-1}\text{e}$, so $A$ unchanged, $Z + 1$'
      - say: 'A gamma ray is pure energy. It changes neither number.'
        write: '$\gamma$, no change'
      - section: 'Mass number'
        say: 'Two hundred and thirty-five minus two times four, which is two hundred and thirty-five minus eight, gives two hundred and twenty-seven.'
        write: '$A = 235 - 2 \times 4 = 227$'
      - section: 'Atomic number'
        say: 'The atomic number is ninety-two minus two times two, plus three times one.'
        write: '$Z = 92 - 2 \times 2 + 3 \times 1$'
      - say: 'That is ninety-two minus four plus three, which is ninety-one.'
        write: '$= 92 - 4 + 3 = 91$'
      - section: 'Check'
        say: 'Check. The daughter has mass number two hundred and twenty-seven and atomic number ninety-one. Mass number first, then atomic number, just as the question asks.'
        write: 'Daughter $^{227}_{91}\text{X}$ ✓'
      - section: 'Answer'
        say: 'So the mass number is two hundred and twenty-seven and the atomic number is ninety-one, which is option C.'
        write: '$\therefore$ 227 and 91'
        answer: true
    traps:
      A: 'You went for two hundred and twenty-seven and eighty-eight. You counted the alpha particles but forgot that each beta particle raises the atomic number by one.'
      B: 'You chose ninety-two and two hundred and thirty-eight. That is close to the parent, with no decay applied at all.'
      D: 'You picked two hundred and fifteen and eighty-eight. Only the two alpha particles lower the mass number, by eight to two hundred and twenty-seven. A beta particle has almost no mass.'
  47:
    moments:
      - section: 'The data'
        say: 'An electron falls from the zero energy level to the ground state, at minus five point four four times ten to the power minus nineteen joules. What frequency of radiation comes out?'
        write: '$E_1 = -5.44 \times 10^{-19}\ \text{J}$, $E_\infty = 0$, $h = 6.6 \times 10^{-34}\ \text{J s}$, $f = ?$'
      - section: 'The law'
        say: 'When an electron drops to a lower level, it gives out a photon whose energy equals the difference between the levels. h f equals E high minus E low.'
        write: '$hf = E_{\text{high}} - E_{\text{low}}$'
      - section: 'The energy'
        say: 'The energy given out is zero minus minus five point four four times ten to the power minus nineteen.'
        write: '$E = 0 - (-5.44 \times 10^{-19})$'
      - say: 'Two minus signs make a plus, so the photon carries five point four four times ten to the power minus nineteen joules.'
        write: '$= 5.44 \times 10^{-19}\ \text{J}$'
      - section: 'Units'
        say: 'Joules and joule seconds are already SI, so no conversion is needed.'
        write: 'Already in SI units'
      - section: 'Substitute'
        say: 'Now f equals E over h, five point four four times ten to the minus nineteen, over six point six times ten to the minus thirty-four.'
        write: '$f = \dfrac{E}{h} = \dfrac{5.44 \times 10^{-19}}{6.6 \times 10^{-34}}$'
      - say: 'Divide the numbers first. Five point four four over six point six is about zero point eight two four.'
        write: '$\dfrac{5.44}{6.6} \approx 0.824$'
      - say: 'Now the powers. Minus nineteen minus minus thirty-four is fifteen.'
        write: '$10^{-19 - (-34)} = 10^{15}$'
      - say: 'So f is zero point eight two four times ten to the power fifteen, which is eight point two times ten to the power fourteen hertz.'
        write: '$f = 0.824 \times 10^{15} = 8.2 \times 10^{14}\ \text{Hz}$'
      - section: 'Check'
        say: 'Check. That frequency sits just past violet light, in the near ultraviolet, a sensible value for a jump inside an atom.'
        write: 'Just above violet light ✓'
      - section: 'Answer'
        say: 'So the frequency of the emitted radiation is eight point two times ten to the power fourteen hertz, which is option B.'
        write: '$\therefore f = 8.2 \times 10^{14}\ \text{Hz}$'
        answer: true
    traps:
      A: 'You went for two times ten to the power sixteen. That does not come from E over h, and the power of ten is wrong.'
      C: 'You chose five times ten to the power fifteen. That does not come from five point four four over six point six, which is less than one.'
      D: 'You picked five times ten to the power sixteen. That does not come from E over h either. Subtract the powers carefully, and minus nineteen minus minus thirty-four is fifteen.'
  48:
    moments:
      - section: 'The question'
        say: 'The public address system at a rally makes one voice loud enough for a whole field. Which small device does that work, and what else are transistors used for?'
        write: 'Transistors are used for the ?'
      - section: 'The fact'
        say: 'The main use of a transistor is amplification, which means making a small signal bigger.'
        write: 'Transistor → amplifier'
      - section: 'The reason'
        say: 'A small change in the base current produces a much larger change in the collector current.'
        write: 'Small $\Delta I_B$ → large $\Delta I_C$'
      - section: 'An example'
        say: 'That is how the weak signal from a microphone is made strong enough to drive the loudspeakers.'
        write: 'Microphone → transistor amplifier → loudspeaker'
      - say: 'A transistor can also work as a fast switch, as in computers.'
        write: 'Also a fast switch'
      - section: 'Remember'
        say: 'Do not mix it up with a diode. Changing a c to d c is rectification, and that is the job of a diode.'
        write: 'a.c. → d.c. (rectification) → diode'
      - section: 'Answer'
        say: 'So transistors are used for the amplification of signals, which is option C.'
        write: '$\therefore$ amplification of signals'
        answer: true
    traps:
      A: 'You went for A. Changing a c to d c is rectification, and that is done by diodes.'
      B: 'You chose B. Changing d c to a c is done by an inverter, not by a transistor alone.'
      D: 'You picked D. Rectification is the job of a diode, not a transistor.'
  49:
    moments:
      - section: 'The question'
        say: 'Here are four graphs of current against voltage. Only one is the output characteristic of a transistor. Let us look at each shape.'
        write: 'Output characteristic, $I_C$ against $V_{CE}$, which graph?'
      - section: 'The fact'
        say: 'The output characteristic is a graph of collector current against collector-emitter voltage, for a fixed base current.'
        write: '$I_C$ against $V_{CE}$, with $I_B$ fixed'
      - section: 'The shape'
        say: 'As the voltage rises from zero, the collector current first rises very steeply.'
        write: 'Small $V_{CE}$ → $I_C$ rises steeply'
      - say: 'After a fraction of a volt it levels off and stays almost constant, because the base current now sets the collector current.'
        write: 'Larger $V_{CE}$ → $I_C$ levels off, set by $I_B$'
      - say: 'So we want a steep rise from the origin, then a bend into an almost flat line. That is the drawing in D.'
        write: 'D, steep rise from the origin, then almost flat'
      - section: 'The others'
        say: 'Graph B is a straight line rising from the origin, like a metal wire obeying Ohm''s law. Graph C curves upwards more and more steeply, like a diode.'
        write: 'B straight line → ohmic;  C ever steeper curve → diode'
      - say: 'Graph A is a straight line that falls as the voltage rises, which no transistor does.'
        write: 'A falling line → not a transistor'
      - section: 'Answer'
        say: 'So the output characteristic of a transistor is graph D, which is option D.'
        write: '$\therefore$ graph D'
        answer: true
    traps:
      A: 'You went for graph A, the line that falls as the voltage rises. A transistor''s collector current does not drop as the voltage goes up.'
      B: 'You chose graph B, the straight line from the origin. That is an ohmic conductor, like a metal wire, which obeys Ohm''s law.'
      C: 'You picked graph C, the curve that rises more and more steeply. That is the forward characteristic of a diode, not a transistor''s output.'
  50:
    moments:
      - section: 'The question'
        say: 'Every phone and computer runs on chips made mostly from one element. Which of these is a pure semiconductor?'
        write: 'Which is a pure semiconductor?'
      - section: 'The fact'
        say: 'A pure, or intrinsic, semiconductor is a single element whose conductivity lies between that of a conductor and an insulator. Silicon and germanium are the common ones.'
        write: 'Intrinsic semiconductor → silicon, germanium'
      - section: 'The reason'
        say: 'Each silicon atom has four valence electrons. At room temperature a few bonds break, freeing electrons and leaving holes.'
        write: 'Si has 4 valence electrons;  bonds break → electrons and holes'
      - say: 'So silicon conducts a little, and better when it is warmer.'
        write: 'Conducts a little, more when warm'
      - section: 'The others'
        say: 'Phosphorus is added to silicon as an impurity to make n-type material. A transistor is a device, not a material.'
        write: 'P → dopant for n-type;  transistor → device'
      - section: 'Remember'
        say: 'So remember it this way. Silicon is the base of every computer chip.'
        write: 'The silicon chip'
      - section: 'Answer'
        say: 'So the pure semiconductor is silicon, which is option A.'
        write: '$\therefore$ silicon'
        answer: true
    traps:
      B: 'You went for phosphorus. Phosphorus is a dopant added to silicon to make n-type material, not a semiconductor on its own.'
      C: 'You chose a transistor. A transistor is a device made from semiconductors, not a pure material.'
      D: 'You picked carbon. Carbon is a conductor as graphite and an insulator as diamond.'
