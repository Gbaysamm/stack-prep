# UTME 2010 Physics, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the Nigerian classroom way: the data with symbols and
# units, the law in words then written, any change to SI units as its own moment, the
# substitution one step per moment, the answer with its unit and a check, and the answer moment
# that names the option. traps gives one kind line for each wrong option.
#
#   say:    heard, not read. No symbols the voice would mangle; formulas read the way a teacher
#           reads them, numbers and units in words.
#   write:  the one line written while it is said, with LaTeX between dollar signs.
#   answer: true on the moment that gives the answer.
#
# Keyed on question number, like explanations_2010.yaml. Answers match that file.
format_version: 1
exam_year: 2010
lessons:
  2:
    moments:
      - section: 'The data'
        say: 'Two cars move the same way, one at one hundred and the other at one hundred and thirty kilometres per hour. How fast does the faster car seem to a man sitting in the slower one?'
        write: 'Slower car $v_B = 100\ \text{km h}^{-1}$, faster car $v_A = 130\ \text{km h}^{-1}$, same direction, $v_{AB} = ?$'
      - section: 'The law'
        say: 'The rule is relative velocity. The velocity of A relative to B is the velocity of A minus the velocity of B.'
        write: 'Relative velocity: $v_{AB} = v_A - v_B$'
      - say: 'We subtract because the cars move in the same direction. We would add only if they came towards each other.'
        write: 'Same direction → subtract;  opposite directions → add'
      - section: 'Units'
        say: 'Both speeds are already in kilometres per hour, so there is nothing to convert.'
        write: 'Both in km h⁻¹, no conversion'
      - section: 'Substitute'
        say: 'So v A B equals one hundred and thirty minus one hundred.'
        write: '$v_{AB} = 130 - 100$'
      - say: 'That is thirty kilometres per hour, in the direction of motion.'
        write: '$= 30\ \text{km h}^{-1}$'
      - section: 'Check'
        say: 'Check. When you sit in a danfo at one hundred, a car at one hundred and thirty creeps past you slowly. Thirty kilometres per hour fits.'
        write: 'Creeps past slowly ⇒ small relative speed ✓'
      - section: 'Answer'
        say: 'So the faster car seems to move at thirty kilometres per hour, which is option D.'
        write: '$\therefore v_{AB} = 30\ \text{km h}^{-1}$'
        answer: true
    traps:
      A: 'You went for one hundred and thirty kilometres per hour. That is the speed seen by someone standing on the road. From inside the slower car, you take away its own speed.'
      B: 'You chose two hundred and thirty. Adding the speeds is for cars moving towards each other. These two go the same way, so we subtract.'
      C: 'You picked two hundred. That comes from neither adding nor subtracting the speeds. The difference, thirty, is what the man in the slower car sees.'
  3:
    moments:
      - section: 'The question'
        say: 'This velocity-time graph has three parts, a rise, a level stretch and a fall. Which statement about the car is true?'
        write: 'v-t graph E → F → G → H, which statement is true?'
      - section: 'The law'
        say: 'On a velocity-time graph, the slope of the line is the acceleration.'
        write: 'Slope of a v-t graph $=$ acceleration, $a = \dfrac{\Delta v}{\Delta t}$'
      - say: 'A rising line means speeding up, a level line means constant velocity, and a falling line means slowing down.'
        write: 'Rising → accelerating;  level → $a = 0$;  falling → decelerating'
      - section: 'Read the graph'
        say: 'From E to F the line rises, so the car is speeding up. Its speed is not constant there.'
        write: 'E to F rises → accelerates'
      - say: 'From F to G the line is level. The velocity does not change, so the slope, which is the acceleration, is zero.'
        write: 'F to G level → $a = 0$'
      - say: 'From G to H the line falls to the time axis, so the car slows down and stops at H.'
        write: 'G to H falls → decelerates to rest'
      - section: 'Check'
        say: 'Check. A car cruising steadily on the Lagos to Ibadan expressway is fast but not speeding up. That is the level part, F to G.'
        write: 'High speed ≠ speeding up ✓'
      - section: 'Answer'
        say: 'So the car has no acceleration between F and G, which is option D.'
        write: '$\therefore$ no acceleration between F and G'
        answer: true
    traps:
      A: 'You went for A. From F to G the car keeps a steady speed. It only slows down from G to H.'
      B: 'You chose B. The line from F to G is level, so the velocity is not changing. Being fast is not the same as speeding up.'
      C: 'You picked C. The line from E to F slopes upwards, so the speed is increasing there, not constant.'
  4:
    moments:
      - section: 'The question'
        say: 'A stone and a feather drop from the same height, with no air resistance. Most of us expect the stone to win. Let us see.'
        write: 'Stone and feather, same height, no air resistance, which lands first?'
      - section: 'The fact'
        say: 'Without air, every body falls with the same acceleration, g, about nine point eight metres per second squared, whatever its mass.'
        write: '$a = g \approx 9.8\ \text{m s}^{-2}$ for every body'
      - section: 'The reason'
        say: 'The stone feels a bigger pull, but it also has more mass to move. Acceleration is force over mass, m g over m, and the mass cancels.'
        write: '$a = \dfrac{F}{m} = \dfrac{mg}{m} = g$'
      - say: 'Both start from rest, at the same height, with the same acceleration. So they take the same time to fall.'
        write: 'Same $u = 0$, same $h$, same $a$ ⇒ same time'
      - section: 'An example'
        say: 'In a tube with the air pumped out, a coin and a feather land together. In ordinary air the feather drifts only because the air pushes on it so much compared with its tiny weight.'
        write: 'In a vacuum, coin and feather land together'
      - section: 'Answer'
        say: 'So the stone and the feather reach the ground at the same time, which is option A.'
        write: '$\therefore$ both land at the same time'
        answer: true
    traps:
      B: 'You went for B. That is what we see every day, but only because air slows the feather. With no air, the stone has no head start.'
      C: 'You chose C. The feather has no larger acceleration than the stone. Both fall with the same g.'
      D: 'You picked D. With no air there is no wind and no air resistance to blow the feather away.'
  5:
    moments:
      - section: 'The data'
        say: 'A car speeds up from twenty-five to forty-five metres per second in ten seconds. How fast is it gaining speed?'
        write: '$u = 25\ \text{m s}^{-1}$, $v = 45\ \text{m s}^{-1}$, $t = 10\ \text{s}$, $a = ?$'
      - section: 'The law'
        say: 'Acceleration is the rate of change of velocity. a equals v minus u, all over t.'
        write: '$a = \dfrac{v - u}{t}$'
      - section: 'Units'
        say: 'All the quantities are already in SI units, metres per second and seconds.'
        write: 'Already in SI units'
      - section: 'Substitute'
        say: 'Put in the numbers. a equals forty-five minus twenty-five, over ten.'
        write: '$a = \dfrac{45 - 25}{10}$'
      - say: 'Forty-five minus twenty-five is twenty.'
        write: '$= \dfrac{20}{10}$'
      - say: 'Twenty over ten is two metres per second squared.'
        write: '$= 2\ \text{m s}^{-2}$'
      - section: 'Check'
        say: 'Check. Two every second for ten seconds adds twenty, and twenty-five plus twenty is forty-five. It agrees.'
        write: '$25 + 2 \times 10 = 45$ ✓'
      - section: 'Answer'
        say: 'So the acceleration is two metres per second squared, which is option D.'
        write: '$\therefore a = 2\ \text{m s}^{-2}$'
        answer: true
    traps:
      A: 'You went for five. That is too big. The velocity rises by only twenty in ten seconds, which is two metres per second every second. Five every second would add fifty in that time.'
      B: 'You chose twenty-five. That is only the starting velocity, and its unit is metres per second, not metres per second squared.'
      C: 'You picked twenty. That is the change in velocity. You still have to divide it by the ten seconds.'
  6:
    moments:
      - section: 'The question'
        say: 'Weigh the same object in Lagos, then on top of the Jos Plateau. What changes, the mass, the weight, or both?'
        write: 'Same object, different places on the earth, mass? weight?'
      - section: 'The fact'
        say: 'Mass is the quantity of matter in a body. Nothing is added or taken away, so the mass stays the same everywhere.'
        write: 'Mass $m$ = quantity of matter, constant'
      - say: 'Weight is the pull of gravity on the body. Weight equals m g.'
        write: 'Weight $W = mg$'
      - section: 'The reason'
        say: 'The value of g changes slightly over the earth. It is a little bigger at the poles than at the equator, and smaller up a high mountain.'
        write: '$g$ varies a little from place to place'
      - say: 'So as g changes, W changes, while m stays fixed.'
        write: '$m$ fixed, $g$ varies ⇒ $W$ varies'
      - section: 'An example'
        say: 'A bag of rice has the same mass in Lagos and in Jos. But a spring balance on the high plateau reads a tiny bit less.'
        write: 'Bag of rice, same mass, slightly less weight in Jos'
      - section: 'Answer'
        say: 'So the mass is constant while the weight varies, which is option C.'
        write: '$\therefore$ mass constant, weight varies'
        answer: true
    traps:
      A: 'You went for A. Mass is the amount of matter in the object, and that does not change when you move it.'
      B: 'You chose B, which is the other way round. The weight varies with g, while the mass stays the same.'
      D: 'You picked D. Weight depends on g, and g changes a little over the earth''s surface, so the weight cannot stay constant.'
  7:
    moments:
      - section: 'The question'
        say: 'Nine balls sit on a wavy surface, some on crests, some on slopes and some in the troughs. Which ones are truly stable?'
        write: 'Balls i to ix on a wavy surface, stable positions $= ?$'
      - section: 'The rule'
        say: 'A body is in stable equilibrium if, when it is pushed a little, it comes back to where it was.'
        write: 'Stable equilibrium: displaced slightly → returns'
      - say: 'When it is displaced, its centre of gravity rises, so gravity pulls it back down.'
        write: 'Displaced → centre of gravity rises → pulled back'
      - section: 'Read the picture'
        say: 'Look at balls three, six and nine, at the bottom of each trough. Push one a little and it rolls back to the bottom. They are stable.'
        write: 'iii, vi, ix in troughs → stable'
      - say: 'Balls one, four and seven sit on top of the crests. The smallest push sends them rolling away. That is unstable equilibrium.'
        write: 'i, iv, vii on crests → unstable'
      - say: 'Balls two, five and eight are on slopes. They are not in equilibrium at all, so they will roll down.'
        write: 'ii, v, viii on slopes → not in equilibrium'
      - section: 'An example'
        say: 'Think of a marble at the bottom of a bowl. However you shake it, it settles back in the middle.'
        write: 'Marble in a bowl → stable'
      - section: 'Answer'
        say: 'So the stable positions are three, six and nine, which is option C.'
        write: '$\therefore$ stable: iii, vi and ix'
        answer: true
    traps:
      A: 'You went for A. Balls two, five and eight are on slopes, so they are not even in equilibrium. They will roll down.'
      B: 'You chose B. Balls one and seven are balanced on crests, which is unstable, and ball two is on a slope.'
      D: 'You picked D. Ball four is on a crest and ball eight is on a slope. Only ball three in that list is stable.'
  8:
    moments:
      - section: 'The data'
        say: 'A bob of weight zero point one newton hangs on a string fifty centimetres long. It is pulled slowly aside until the string makes sixty degrees with the vertical. How much work is done?'
        write: '$W = mg = 0.1\ \text{N}$, $l = 50\ \text{cm}$, $\theta = 60^\circ$, work $= ?$'
      - section: 'The law'
        say: 'The force grows slowly from zero, so the bob gains no kinetic energy. All the work goes into potential energy, so work equals m g h.'
        write: 'Work done $=$ gain in P.E. $= mgh$'
      - section: 'Convert to SI'
        say: 'Change the length to metres. Fifty centimetres is zero point five metres.'
        write: '$l = 50\ \text{cm} = 0.50\ \text{m}$'
      - section: 'The height'
        say: 'At sixty degrees the bob is l cos theta below the support. So it has risen l minus l cos theta, which is l times one minus cos theta.'
        write: '$h = l - l\cos\theta = l(1 - \cos\theta)$'
      - say: 'Put in the numbers. h equals zero point five times one minus cos sixty.'
        write: '$h = 0.50(1 - \cos 60^\circ)$'
      - say: 'Cos sixty degrees is one half, so the bracket is zero point five. h is zero point two five metres.'
        write: '$= 0.50 \times 0.5 = 0.25\ \text{m}$'
      - section: 'Substitute'
        say: 'Now the work done equals m g h, which is zero point one times zero point two five.'
        write: 'Work $= mgh = 0.1 \times 0.25$'
      - say: 'That is zero point zero two five joules.'
        write: '$= 0.025\ \text{J}$'
      - section: 'Check'
        say: 'Check. The bob rises only a quarter of a metre, less than the full string, so the work must be less than zero point one times zero point five. It is.'
        write: '$0.025 < 0.1 \times 0.5 = 0.05$ ✓'
      - section: 'Answer'
        say: 'So the work done is zero point zero two five joules, which is option B.'
        write: '$\therefore$ work done $= 0.025\ \text{J}$'
        answer: true
    traps:
      A: 'You went for zero point two five joules, ten times too big. That treats the weight as one newton. The weight is zero point one newton.'
      C: 'You chose zero point zero five joules. That uses the whole string, half a metre, as the height. The bob only rises a quarter of a metre.'
      D: 'You picked zero point five joules. That uses fifty centimetres as five metres, or the weight as one newton with the full length.'
  9:
    moments:
      - section: 'The question'
        say: 'Why are conveyor belts, like the ones at the airport and in factories, made rough on top?'
        write: 'Conveyor belt surface made rough, why?'
      - section: 'The fact'
        say: 'Friction is the force that opposes one surface sliding over another. A rougher surface gives more friction.'
        write: 'Friction opposes sliding;  rougher → more friction'
      - section: 'The reason'
        say: 'A belt carries goods by friction between the belt and the load. On a smooth sloping belt, a bag would slide back down.'
        write: 'Belt grips the load by friction'
      - say: 'So the rough surface increases the friction and holds the load in place.'
        write: 'Rough belt → load does not slip'
      - section: 'An example'
        say: 'The same idea is in the ridged soles of canvas shoes and the treads of car tyres.'
        write: 'Canvas soles, tyre treads → grip'
      - section: 'Answer'
        say: 'So conveyor belts are made rough to prevent the load from slipping, which is option A.'
        write: '$\therefore$ to prevent the load from slipping'
        answer: true
    traps:
      B: 'You went for B. Roughness is only on the surface. It does not change the strength of the belt material.'
      C: 'You chose C. How much load a belt can carry depends on its strength and its motor, not on how rough it is.'
      D: 'You picked D. The rough surface is there to grip the load, not to protect the belt.'
  10:
    moments:
      - section: 'The data'
        say: 'A machine with velocity ratio six lifts an eight hundred newton load with a four hundred newton effort. How efficient is it?'
        write: '$VR = 6$, effort $E = 400\ \text{N}$, load $L = 800\ \text{N}$, efficiency $= ?$'
      - section: 'The law'
        say: 'Mechanical advantage is load divided by effort.'
        write: '$MA = \dfrac{L}{E}$'
      - say: 'Efficiency is mechanical advantage divided by velocity ratio, times one hundred percent.'
        write: 'Efficiency $= \dfrac{MA}{VR} \times 100\%$'
      - section: 'Units'
        say: 'The forces are already in newtons. The one metre height is not needed, because it cancels in the ratio.'
        write: 'Forces in N;  the 1 m is not needed'
      - section: 'Substitute'
        say: 'M A equals eight hundred over four hundred, which is two.'
        write: '$MA = \dfrac{800}{400} = 2$'
      - say: 'Efficiency equals two over six, times one hundred percent.'
        write: 'Efficiency $= \dfrac{2}{6} \times 100\%$'
      - say: 'Two over six is one third, and a third of one hundred is thirty-three point three percent.'
        write: '$= 33.3\%$'
      - section: 'Check'
        say: 'Check. Real machines lose energy to friction, so the efficiency must be less than one hundred percent. Thirty-three point three percent fits.'
        write: '$33.3\% < 100\%$ ✓'
      - section: 'Answer'
        say: 'So the efficiency of the machine is thirty-three point three percent, which is option C.'
        write: '$\therefore$ efficiency $= 33.3\%$'
        answer: true
    traps:
      A: 'You went for fifty percent. That is effort divided by load, the ratio turned upside down. Mechanical advantage is load over effort.'
      B: 'You chose twenty-two point two percent. That does not come from M A over V R. Two over six gives thirty-three point three percent.'
      D: 'You picked fifty-five point six percent. That does not come from M A over V R either. Find M A first, then divide by six.'
  11:
    moments:
      - section: 'The data'
        say: 'A wire thirty centimetres long is stretched to thirty point five centimetres by a force of three hundred newtons. How much energy is stored in it?'
        write: '$l_0 = 30\ \text{cm}$, $l = 30.5\ \text{cm}$, $F = 300\ \text{N}$, energy $= ?$'
      - section: 'The law'
        say: 'The energy stored in a stretched wire is the work done in stretching it. E equals half F e, where e is the extension.'
        write: '$E = \dfrac{1}{2}Fe$'
      - say: 'The half is there because the force grows from zero up to three hundred newtons, so the average force is half of it.'
        write: 'Average force $= \dfrac{0 + 300}{2}$'
      - section: 'The extension'
        say: 'The extension is thirty point five minus thirty, which is zero point five centimetres.'
        write: '$e = 30.5 - 30 = 0.5\ \text{cm}$'
      - section: 'Convert to SI'
        say: 'Change it to metres. Zero point five centimetres is zero point zero zero five metres.'
        write: '$e = 0.5\ \text{cm} = 0.005\ \text{m}$'
      - section: 'Substitute'
        say: 'E equals one half times three hundred times zero point zero zero five.'
        write: '$E = \dfrac{1}{2} \times 300 \times 0.005$'
      - say: 'Half of three hundred is one hundred and fifty, and one hundred and fifty times zero point zero zero five is zero point seven five joules.'
        write: '$= 150 \times 0.005 = 0.75\ \text{J}$'
      - section: 'Check'
        say: 'Check. A small stretch of half a centimetre should store only a little energy, less than one joule. It does.'
        write: 'Tiny stretch → under 1 J ✓'
      - section: 'Answer'
        say: 'So the strain energy of the wire is zero point seven five joules, which is option D.'
        write: '$\therefore E = 0.75\ \text{J}$'
        answer: true
    traps:
      A: 'You went for seven point five joules, ten times too big. That changes half a centimetre to zero point zero five metres, dividing by ten instead of by one hundred.'
      B: 'You chose seven hundred and fifty joules. That uses the extension as five metres. Half a centimetre is only zero point zero zero five metres.'
      C: 'You picked seventy-five joules. That keeps the extension in centimetres. Always change centimetres to metres before you substitute.'
  12:
    moments:
      - section: 'The data'
        say: 'In a hydraulic press, the pump piston puts a pressure of one hundred pascals on the liquid. What force acts on the second piston, of area three square metres?'
        write: '$P = 100\ \text{Pa}$, $A = 3\ \text{m}^{2}$, $F = ?$'
      - section: 'The law'
        say: 'Pascal''s principle says pressure applied to an enclosed liquid is passed on equally to every part of it. So the second piston feels the same one hundred pascals.'
        write: 'Pascal''s principle: same pressure on both pistons'
      - say: 'And force equals pressure times area.'
        write: '$F = PA$'
      - section: 'Units'
        say: 'The units are already SI, since one pascal is one newton per square metre.'
        write: '$1\ \text{Pa} = 1\ \text{N m}^{-2}$'
      - section: 'Substitute'
        say: 'F equals one hundred times three.'
        write: '$F = 100 \times 3$'
      - say: 'That is three hundred newtons.'
        write: '$= 300\ \text{N}$'
      - section: 'Check'
        say: 'Check. The bigger piston gets the bigger force. That is how the jack at a vulcaniser''s shop lifts a whole car.'
        write: 'Larger area → larger force ✓'
      - section: 'Answer'
        say: 'So the force on the second piston is three hundred newtons, which is option D.'
        write: '$\therefore F = 300\ \text{N}$'
        answer: true
    traps:
      A: 'You went for two hundred newtons. Each square metre of the piston gets one hundred newtons, and there are three square metres, so the force is three hundred.'
      B: 'You chose one hundred newtons. That treats the pressure as if it were the force. Pressure must be multiplied by the area.'
      C: 'You picked one hundred and fifty newtons. Each square metre of the piston gets one hundred newtons, and there are three square metres, so the force is three hundred.'
  13:
    moments:
      - section: 'The question'
        say: 'To find the relative density of a powder, like sand, we need a beam balance and one more piece of apparatus. Which one?'
        write: 'Relative density of a powder, beam balance and ?'
      - section: 'The fact'
        say: 'The relative density of a powder is found with a density bottle and a beam balance.'
        write: 'Powder → density bottle + beam balance'
      - section: 'The reason'
        say: 'A powder cannot hang on a thread or go into a eureka can as one lump. The density bottle holds an exact, fixed volume.'
        write: 'Density bottle holds a fixed, exact volume'
      - say: 'We weigh the empty bottle, the bottle with some powder, then with the powder topped up with water, and finally the bottle full of water.'
        write: '$m_1$ empty, $m_2$ + powder, $m_3$ + powder + water, $m_4$ full of water'
      - section: 'The rule'
        say: 'From these masses we get the mass of the powder and the mass of an equal volume of water. Relative density is the first divided by the second.'
        write: 'R.D. $= \dfrac{\text{mass of powder}}{\text{mass of equal volume of water}}$'
      - section: 'Remember'
        say: 'So remember it this way. A lump goes in the eureka can, and a powder goes in the density bottle.'
        write: 'Lump → eureka can;  powder → density bottle'
      - section: 'Answer'
        say: 'So the apparatus is a density bottle, which is option D.'
        write: '$\therefore$ a density bottle'
        answer: true
    traps:
      A: 'You went for A. A eureka can works for one solid lump that sinks, not for a powder.'
      B: 'You chose B. A burette delivers measured volumes of liquid. It cannot hold a powder for weighing.'
      C: 'You picked C. A pipette delivers one fixed volume of liquid only. It is not used to weigh a powder.'
  14:
    moments:
      - section: 'The question'
        say: 'A hydrometer is a glass float with a long thin stem. What does it measure?'
        write: 'A hydrometer measures the ?'
      - section: 'The fact'
        say: 'A hydrometer measures the relative density of a liquid.'
        write: 'Hydrometer → relative density of a liquid'
      - section: 'The reason'
        say: 'By the law of flotation, a floating body displaces its own weight of the fluid it floats in.'
        write: 'Law of flotation: weight of float $=$ weight of liquid displaced'
      - say: 'So the hydrometer sinks deeper in a less dense liquid and rides higher in a denser one. We read the value on the stem at the liquid surface.'
        write: 'Less dense liquid → sinks deeper;  read the stem at the surface'
      - section: 'An example'
        say: 'A battery charger checks the acid in a car battery with a hydrometer.'
        write: 'Battery charger tests battery acid'
      - section: 'Remember'
        say: 'Do not mix it up with a hygrometer. A hydrometer is for liquids, and a hygrometer is for humidity in the air.'
        write: 'Hydrometer → liquids;  hygrometer → humidity'
      - section: 'Answer'
        say: 'So a hydrometer measures the relative density of a liquid, which is option B.'
        write: '$\therefore$ relative density of a liquid'
        answer: true
    traps:
      A: 'You went for A. A hydrometer must float, so it works in a liquid. It cannot be used on a solid.'
      C: 'You chose C. Relative humidity is about water vapour in the air, and it is measured with a hygrometer.'
      D: 'You picked D. Vapour pressure is measured with a manometer or barometer arrangement, not with a hydrometer.'
  15:
    moments:
      - section: 'The question'
        say: 'Alcohol and mercury are both used in thermometers. What special advantage does alcohol have?'
        write: 'Alcohol or mercury in a thermometer, advantage of alcohol?'
      - section: 'The fact'
        say: 'Alcohol freezes at about minus one hundred and fifteen degrees Celsius. Mercury freezes at about minus thirty-nine degrees Celsius.'
        write: 'Freezing point, alcohol ≈ −115 °C, mercury ≈ −39 °C'
      - section: 'The reason'
        say: 'A thermometer liquid must stay liquid over the range it measures. Alcohol stays liquid far below where mercury turns solid.'
        write: 'Liquid must not freeze in the range measured'
      - section: 'An example'
        say: 'So alcohol thermometers are used for very cold places, like the polar regions or inside a deep freezer.'
        write: 'Alcohol → very low temperatures, e.g. a freezer'
      - say: 'Its low boiling point, about seventy-eight degrees Celsius, is a drawback. It cannot measure boiling water.'
        write: 'Boiling point of alcohol ≈ 78 °C → drawback'
      - section: 'Remember'
        say: 'So remember it this way. Alcohol is for the cold, and mercury is for the hot.'
        write: 'Alcohol → cold;  mercury → hot'
      - section: 'Answer'
        say: 'So the special advantage of alcohol is its low freezing point, which is option A.'
        write: '$\therefore$ low freezing point'
        answer: true
    traps:
      B: 'You went for B. A low boiling point is a drawback, because it stops alcohol measuring high temperatures.'
      C: 'You chose C. A high specific heat capacity is a drawback too. The liquid takes longer to reach the temperature being measured.'
      D: 'You picked D. Density has nothing to do with how well a liquid measures temperature.'
  16:
    moments:
      - section: 'The data'
        say: 'Two metal rods P and Q are heated through the same temperature rise. Their expansivities are in the ratio two to three, and their lengths three to four. What is the ratio of their increases in length?'
        write: '$\alpha_P : \alpha_Q = 2 : 3$,  $l_P : l_Q = 3 : 4$,  same $\Delta\theta$,  $\Delta l_P : \Delta l_Q = ?$'
      - section: 'The law'
