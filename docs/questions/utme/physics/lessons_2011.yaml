        say: 'Silicon and germanium each have four valence electrons.'
        write: 'Si, Ge: 4 valence electrons'
      - say: 'In the crystal, each atom shares one electron with each of four neighbours, making four shared pairs.'
        write: 'each atom shares with 4 neighbours'
      - section: 'The rule'
        say: 'A bond made by a shared pair of electrons is a covalent bond.'
        write: 'shared pair = covalent bond'
      - say: 'No electrons are transferred, so no ions form. The bonding is not ionic or electrovalent.'
        write: 'no transfer → not ionic'
      - section: 'An example'
        say: 'These covalent bonds hold their electrons fairly tightly. That is why pure silicon is a poor conductor at room temperature.'
        write: 'pure Si: poor conductor when cool'
      - section: 'Answer'
