    moments:
      - section: 'The question'
        say: 'The threshold frequency of tungsten is given. How much energy does it take to free one electron? A careful multiplication with powers of ten.'
        write: 'Threshold frequency of tungsten, work function $= ?$'
      - section: 'The data'
        say: 'The threshold frequency f nought is one point three times ten to the power fifteen hertz. Planck''s constant h is six point six times ten to the power minus thirty-four joule seconds.'
        write: '$f_0 = 1.3 \times 10^{15}$ Hz, $h = 6.6 \times 10^{-34}$ J s, $W = ?$'
      - section: 'The law'
        say: 'The work function is the least energy needed to free an electron from the metal. It equals the energy of a photon at the threshold frequency, so W equals h f nought.'
        write: '$W = hf_0$'
      - section: 'The units'
        say: 'Hertz and joule seconds are SI units, so the answer comes out in joules.'
        write: 'J s × Hz = J'
      - section: 'Substitute'
        say: 'W equals six point six times ten to the power minus thirty-four, times one point three times ten to the power fifteen.'
        write: '$W = 6.6 \times 10^{-34} \times 1.3 \times 10^{15}$'
      - say: 'Multiply the numbers first. Six point six times one point three is eight point five eight.'
        write: '$6.6 \times 1.3 = 8.58$'
      - say: 'Now the powers. When we multiply, we add them. Minus thirty-four plus fifteen is minus nineteen.'
        write: '$10^{-34} \times 10^{15} = 10^{-34+15} = 10^{-19}$'
      - say: 'So W is eight point five eight times ten to the power minus nineteen joules.'
        write: '$W = 8.58 \times 10^{-19}$ J'
      - section: 'Check'
        say: 'Check. In electronvolts that is about five point four, which is the right size for the work function of a metal.'
        write: '$\approx 5.4$ eV ✓'
      - section: 'Answer'
        say: 'So the work function of tungsten is eight point five eight times ten to the power minus nineteen joules, which is option B.'
        write: '$\therefore W = 8.58 \times 10^{-19}$ J'
        answer: true
    traps:
      A: 'You went for eight point eight five times ten to the power minus eighteen joules. The digits are swapped and the power of ten slipped.'
      C: 'You chose ten to the power minus fifteen. The number is right, but minus thirty-four plus fifteen is minus nineteen.'
      D: 'You picked ten to the power minus seventeen. The number is right, but the power should be minus nineteen.'
  44:
    moments:
      - section: 'The question'
        say: 'NEPA mains is called two hundred and thirty volts, but the voltage really swings higher than that. How do the two numbers compare?'
        write: 'Ratio of r.m.s. value to peak value $= ?$'
      - section: 'The fact'
        say: 'The r m s value of an alternating current is the steady direct current that gives the same heating effect.'
        write: 'r.m.s. = the d.c. with the same heating effect'
      - section: 'The formula'
        say: 'For a sine wave, I r m s equals I nought over root two, where I nought is the peak value.'
        write: '$I_{\text{rms}} = \dfrac{I_0}{\sqrt{2}}$'
      - say: 'Divide both sides by I nought. The ratio of r m s to peak is one over root two.'
        write: '$\dfrac{I_{\text{rms}}}{I_0} = \dfrac{1}{\sqrt{2}}$'
      - say: 'One over root two is about zero point seven zero seven.'
        write: '$\dfrac{1}{\sqrt{2}} \approx 0.707$'
      - section: 'Check'
        say: 'Check. The r m s value is always less than the peak, so the ratio must be less than one. It is.'
        write: '$0.707 < 1$ ✓'
      - section: 'An example'
        say: 'The two hundred and thirty volts of NEPA mains is an r m s value. The peak is about three hundred and twenty-five volts.'
        write: '230 V r.m.s. → peak ≈ 325 V'
      - section: 'Answer'
        say: 'So the ratio of the r m s value to the peak value is one over root two, which is option A.'
        write: '$\therefore \dfrac{I_{\text{rms}}}{I_0} = \dfrac{1}{\sqrt{2}}$'
        answer: true
    traps:
      B: 'You went for root two. That is peak over r m s, the ratio the wrong way round.'
      C: 'You chose two. That is the ratio of the peak to peak value to the peak value.'
      D: 'You picked one half. A half is too small. One over root two is about zero point seven.'
  45:
    moments:
      - section: 'The question'
        say: 'Two inductors in parallel carry ten amperes in all. How much energy sits in their magnetic field? First we combine them.'
        write: '4 H and 8 H in parallel, 10 A, energy $= ?$'
      - section: 'The data'
        say: 'L one is four henries, L two is eight henries, and the total current I is ten amperes.'
        write: '$L_1 = 4$ H, $L_2 = 8$ H, $I = 10$ A, $E = ?$'
      - section: 'The laws'
        say: 'Inductors with no magnetic link between them combine like resistors. In parallel, L equals L one L two over L one plus L two.'
        write: '$L = \dfrac{L_1L_2}{L_1 + L_2}$'
      - say: 'The energy stored in an inductor is half L I squared.'
        write: '$E = \tfrac{1}{2}LI^{2}$'
      - section: 'The units'
        say: 'Henries and amperes are SI units, so the energy comes out in joules.'
        write: 'all in SI units ✓'
      - section: 'Substitute'
        say: 'L equals four times eight over four plus eight, which is thirty-two over twelve.'
        write: '$L = \dfrac{4 \times 8}{4 + 8} = \dfrac{32}{12}$'
      - say: 'Thirty-two over twelve simplifies to eight over three henries.'
        write: '$L = \dfrac{8}{3}$ H'
      - say: 'Now E equals half times eight over three, times ten squared.'
        write: '$E = \tfrac{1}{2} \times \dfrac{8}{3} \times 10^{2}$'
      - say: 'Half of eight over three is four over three. Times one hundred, that is four hundred over three.'
        write: '$= \dfrac{4}{3} \times 100 = \dfrac{400}{3}$'
      - say: 'Four hundred over three is about one hundred and thirty-three joules.'
        write: '$E \approx 133$ J'
      - section: 'Check'
        say: 'Check. In parallel the combined inductance is less than the smaller one, four henries. Eight over three is less than four, so that fits.'
        write: '$\tfrac{8}{3} < 4$ ✓'
      - section: 'Answer'
        say: 'So the energy stored is one hundred and thirty-three joules, which is option D.'
        write: '$\therefore E \approx 133$ J'
        answer: true
    traps:
      A: 'You went for two hundred and fifty joules. That does not come from half L I squared with the combined inductance.'
      B: 'You chose five hundred joules. That uses L equals ten henries, which is neither the series nor the parallel value.'
      C: 'You picked fifty joules. That is too small. Fifty joules would need a combined inductance of only one henry, but four henries and eight henries in parallel give eight over three henries.'
  46:
    moments:
      - section: 'The question'
        say: 'Air is normally a good insulator. Yet a fluorescent tube glows with current flowing through gas. What makes a gas conduct?'
        write: 'When does a gas conduct?'
      - section: 'The fact'
        say: 'A gas normally has very few free charges, so it is a poor conductor.'
        write: 'gas: few free charges'
      - section: 'The reason'
        say: 'At low pressure the molecules are far apart. Ions and electrons can travel far between collisions and gain a lot of energy.'
        write: 'low pressure → long path between collisions'
      - say: 'A high potential difference speeds them up so much that they knock electrons out of more molecules. The gas is ionised and conducts.'
        write: 'high p.d. → ionisation → conduction'
      - section: 'An example'
        say: 'This is how the fluorescent tube in your classroom and a neon sign glow. Both are discharge tubes.'
        write: 'fluorescent tube, neon sign = discharge tubes'
      - section: 'Remember'
        say: 'Remember. Thin gas and a big push, which means low pressure and high p d.'
        write: 'low pressure + high p.d.'
      - section: 'Answer'
        say: 'So gases conduct at low pressure and high p d, which is option C.'
        write: '$\therefore$ low pressure and high p.d.'
        answer: true
    traps:
      A: 'You went for high pressure and high p d. At high pressure the charges collide too often to gain enough energy.'
      B: 'You chose low pressure and low p d. A low p d is too weak to cause ionisation.'
      D: 'You picked high pressure and low p d. Both conditions are the wrong way round.'
  47:
    moments:
      - section: 'The question'
        say: 'At high frequency, most meters struggle. One meter does not care about frequency at all. Which one?'
        write: 'Meter for high frequency a.c.?'
      - section: 'The fact'
        say: 'A hot wire ammeter works by the heating effect of the current. The current warms a fine wire, the wire expands, and the pointer moves.'
        write: 'hot wire: heating → wire expands → pointer moves'
      - section: 'The reason'
        say: 'The heating goes as I squared R. It does not depend on the direction or the frequency of the current.'
        write: 'heating $\propto I^{2}R$, any direction, any frequency'
      - say: 'So a hot wire ammeter reads a c of any frequency, including high frequency.'
        write: 'reads a.c. of any frequency'
      - section: 'The others'
        say: 'A moving coil meter reads only d c. A moving iron meter has a coil with too much reactance at high frequency.'
        write: 'moving coil: d.c. only;  moving iron: low frequency a.c.'
      - section: 'An example'
        say: 'A pressing iron at home heats up the same way on a c, whatever the frequency.'
        write: 'pressing iron: heating works on a.c.'
      - section: 'Answer'
        say: 'So the instrument for high frequency a c is the hot wire ammeter, which is option A.'
        write: '$\therefore$ hot wire ammeter'
        answer: true
    traps:
      B: 'You went for a d c ammeter. A d c ammeter cannot read alternating current.'
      C: 'You chose a moving coil ammeter. It reads only d c, because with a c its pointer would just shake about zero.'
      D: 'You picked a moving iron ammeter. It reads low frequency a c, but not high frequency.'
  48:
