  49:
    moments:
      - section: 'The question'
        say: 'A bulb filament has a much higher resistance when it glows than when it is cold. Which kind of material behaves like that?'
        write: 'Resistance rises with temperature in?'
      - section: 'The fact'
        say: 'The resistance of a metal rises with temperature. We say its temperature coefficient of resistance is positive.'
        write: 'metal: $R$ rises with temperature'
      - section: 'The reason'
        say: 'When a metal is heated, its ions vibrate more strongly. They get in the way of the free electrons, so the current meets more opposition.'
        write: 'hot → ions vibrate more → electrons blocked'
      - section: 'The others'
        say: 'Electrolytes behave the opposite way. Their ions move faster when warm, so they conduct better.'
        write: 'electrolyte, water: $R$ falls when warm'
      - say: 'Wood is an insulator, and heating does not raise its resistance.'
        write: 'wood: insulator'
      - section: 'An example'
        say: 'So a bulb filament, made of the metal tungsten, has far more resistance when it glows white hot.'
        write: 'tungsten filament: hot → high $R$'
      - section: 'Answer'
        say: 'So metals have an increase in resistance with temperature, which is option C.'
        write: '$\therefore$ metals'
        answer: true
    traps:
      A: 'You went for electrolyte. An electrolyte conducts better when warm, so its resistance falls.'
      B: 'You chose water. The resistance of water falls as it warms, because its ions move faster.'
      D: 'You picked wood. Wood is an insulator, and its resistance does not rise with temperature.'
  50:
    moments:
      - section: 'The question'
        say: 'A tiny pinch of impurity can make germanium conduct thousands of times better. What is that process called?'
        write: 'Adding impurities to germanium is called?'
      - section: 'The fact'
        say: 'Doping is the deliberate addition of a tiny amount of impurity to a pure semiconductor, such as germanium or silicon.'
        write: 'doping = adding impurity on purpose'
      - section: 'The two kinds'
        say: 'An impurity with five valence electrons, such as arsenic, gives extra free electrons. That makes an n type semiconductor.'
        write: 'arsenic, 5 electrons → extra electrons → n-type'
      - say: 'An impurity with three valence electrons, such as boron, leaves holes. That makes a p type semiconductor.'
        write: 'boron, 3 electrons → holes → p-type'
      - section: 'An example'
        say: 'Doping changes the conductivity enormously. It is how the diodes and transistors in your phone are made.'
        write: 'diodes, transistors: doped semiconductors'
      - section: 'Remember'
        say: 'Remember. To dope a semiconductor is to add impurity on purpose.'
        write: 'dope = add impurity'
      - section: 'Answer'
        say: 'So the process is called doping, which is option A.'
        write: '$\therefore$ doping'
        answer: true
    traps:
      B: 'You went for saturation. Saturation is not the name for adding impurities to a semiconductor.'
      C: 'You chose bonding. Bonding is how atoms join together, not the adding of impurities.'
      D: 'You picked amplification. Amplification is what a transistor does, not how its material is made.'
