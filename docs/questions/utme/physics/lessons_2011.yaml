# UTME 2011 Physics, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the Nigerian classroom way for Physics: the data with
# symbols and units, the law named in words then written, any conversion to SI units as its own
# moment, the substitution one step per moment, the answer with its unit and a check, and the
# answer moment that names the option. traps gives one kind line for each wrong option.
#
#   say:    heard, not read. No symbols the voice would mangle; formulas read the way a teacher
#           reads them, numbers and units in words.
#   write:  the one line written while it is said, with LaTeX between dollar signs.
#   answer: true on the moment that gives the answer.
#
# Keyed on question number, like explanations_2011.yaml. Answers match that file.
format_version: 1
exam_year: 2011
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'A hammer falls twenty metres from a roof. How much kinetic energy does it carry just before it hits the ground? The secret is where that energy comes from.'
        write: 'Hammer dropped from a roof, KE at the ground $= ?$'
      - section: 'The data'
        say: 'The mass m is one point five kilograms, the height h is twenty metres, and g is ten metres per second squared.'
        write: '$m = 1.5\ \text{kg}$, $h = 20\ \text{m}$, $g = 10\ \text{m s}^{-2}$, $KE = ?$'
      - section: 'The law'
        say: 'The law is the conservation of energy. Energy is not lost, it only changes form, so the potential energy the hammer loses becomes kinetic energy.'
        write: 'Conservation of energy: PE lost = KE gained'
      - say: 'At the top the potential energy is m g h. So the kinetic energy at the ground is also m g h.'
        write: '$KE = mgh$'
      - section: 'The units'
        say: 'Kilograms, metres and metres per second squared are already SI units, so there is nothing to convert.'
        write: 'all in SI units ✓'
      - section: 'Substitute'
        say: 'Put in the numbers. K E equals one point five times ten times twenty.'
        write: '$KE = 1.5 \times 10 \times 20$'
      - say: 'One point five times ten is fifteen, and fifteen times twenty is three hundred joules.'
        write: '$= 15 \times 20 = 300\ \text{J}$'
      - section: 'Check'
        say: 'Check. Energy is measured in joules, and a few hundred joules for a hammer falling from a roof is sensible.'
        write: 'unit J ✓, size sensible ✓'
      - section: 'Answer'
        say: 'So the kinetic energy just before it lands is three hundred joules, which is option D.'
        write: '$\therefore KE = 300\ \text{J}$'
        answer: true
    traps:
      A: 'You went for four hundred and fifty joules. That multiplies by one point five a second time. Use the mass only once in m g h.'
      B: 'You chose six hundred joules. That uses a height of forty metres, twice the real height. The roof is twenty metres high.'
      C: 'You picked one hundred and fifty joules. That is half of m g h, as if half the energy were lost. In free fall all the lost potential energy becomes kinetic energy.'
  3:
    moments:
      - section: 'The question'
        say: 'One ball is five grams and the other is fifty kilograms, ten thousand times heavier. Thrown up together at the same speed, does the heavy one fall behind? Let us see.'
        write: 'X = 5 g, Y = 50 kg, both thrown up at 100 m s⁻¹'
      - section: 'The data'
        say: 'For each ball, the initial velocity u is one hundred metres per second upwards and the time t is one second. The acceleration a is minus ten metres per second squared, because gravity pulls down.'
        write: '$u = 100\ \text{m s}^{-1}$, $t = 1\ \text{s}$, $a = -10\ \text{m s}^{-2}$, $s = ?$'
      - section: 'The law'
        say: 'With no air resistance, every body moves with the same acceleration g, whatever its mass. So both balls move in exactly the same way.'
        write: 'free fall: same $g$ for every mass'
      - say: 'The equation of motion for distance is s equals u t plus half a t squared. Notice that there is no mass in it.'
        write: '$s = ut + \tfrac{1}{2}at^{2}$'
      - section: 'The units'
        say: 'The speed, the time and the acceleration are already in SI units. The masses are not needed at all.'
        write: 'SI already; mass not needed'
      - section: 'Substitute'
        say: 'Put in the numbers. s equals one hundred times one, plus half of minus ten times one squared.'
        write: '$s = 100 \times 1 + \tfrac{1}{2} \times (-10) \times 1^{2}$'
      - say: 'One hundred times one is one hundred. Half of minus ten is minus five. So s is one hundred minus five, which is ninety-five metres.'
        write: '$s = 100 - 5 = 95\ \text{m}$'
      - section: 'Check'
        say: 'Check. Gravity slows the balls, so after one second they are a little below one hundred metres. Both are at ninety-five metres, side by side.'
        write: 'X at 95 m, Y at 95 m, level ✓'
      - section: 'Answer'
        say: 'So X and Y will both be ninety-five metres from the point of throw, which is option A.'
        write: '$\therefore$ both 95 m up, side by side'
        answer: true
    traps:
      B: 'You went for five hundred metres apart. The balls move together, because mass does not change free fall, so they are not apart at all.'
      C: 'You chose Y ahead of X. It feels as if the heavy ball should go further, but g is the same for both, so neither gets ahead.'
      D: 'You picked X ahead of Y. The light ball does not go further either. Without air resistance, mass does not change how a body rises or falls.'
  4:
    moments:
      - section: 'The question'
        say: 'In a lift that falls freely, a man feels as if he weighs nothing. Has gravity switched off? No. So what has gone?'
        write: 'Man in a freely falling lift feels weightless. Why?'
      - section: 'The fact'
        say: 'What you feel as your weight is the push of the floor on your feet. We call it the normal reaction, R.'
        write: 'felt weight = reaction of the floor, $R$'
      - section: 'The law'
        say: 'Newton''s second law says the resultant force equals mass times acceleration. The weight m g acts down and R acts up, so m g minus R equals m a.'
        write: '$mg - R = ma$'
      - say: 'Make R the subject. R equals m times, bracket, g minus a.'
        write: '$R = m(g - a)$'
      - section: 'Free fall'
        say: 'In free fall the lift and the man accelerate at g, so a equals g.'
        write: '$a = g$'
      - say: 'Then R equals m times g minus g, which is zero. The floor does not push on him at all.'
        write: '$R = m(g - g) = 0$'
      - say: 'Gravity still pulls him with the full force m g. That pull is exactly why he and the lift fall together.'
        write: 'gravity still acts, $W = mg$'
      - section: 'An example'
        say: 'Think of the light feeling in your stomach when a lift in a Lagos high-rise starts to go down quickly. The floor is pushing on you less.'
        write: 'lift starts down fast → floor pushes less → you feel lighter'
      - section: 'Answer'
        say: 'So he feels no weight because there is no reaction from the floor of the lift, which is option D.'
        write: '$\therefore R = 0$, no reaction from the floor'
        answer: true
    traps:
      A: 'You went for no gravitational pull. Gravity has not switched off. Without it the lift would not fall at all.'
      B: 'You chose an air tight lift. Whether air can get in has nothing to do with the forces on the man.'
      C: 'You picked a vacuum. There is air in the lift, and even a vacuum would not take away the pull of gravity.'
  5:
    moments:
      - section: 'The question'
        say: 'Six newtons and eight newtons act at right angles. Many students just add them to get fourteen. But forces at an angle do not simply add.'
        write: 'Two forces at 90°, resultant $= ?$'
      - section: 'The data'
        say: 'F one is six newtons pointing up, F two is eight newtons pointing to the right, and the angle between them is ninety degrees.'
        write: '$F_1 = 6.0\ \text{N}$ up, $F_2 = 8.0\ \text{N}$ right, angle 90°, $R = ?$'
      - section: 'The law'
        say: 'Two vectors at right angles form the two shorter sides of a right-angled triangle. The resultant is the hypotenuse, so we use Pythagoras.'
        write: 'resultant = hypotenuse of the right-angled triangle'
      - say: 'R equals the square root of F one squared plus F two squared.'
        write: '$R = \sqrt{F_1^{2} + F_2^{2}}$'
      - section: 'The units'
        say: 'Both forces are in newtons, the SI unit, so there is nothing to convert.'
        write: 'both in N ✓'
      - section: 'Substitute'
        say: 'Put in the numbers. R equals the square root of six squared plus eight squared.'
        write: '$R = \sqrt{6.0^{2} + 8.0^{2}}$'
      - say: 'Six squared is thirty-six and eight squared is sixty-four. Together they make one hundred.'
        write: '$= \sqrt{36 + 64} = \sqrt{100}$'
      - say: 'The square root of one hundred is ten. So R is ten newtons.'
        write: '$R = 10.0\ \text{N}$'
      - section: 'Check'
        say: 'Check. The resultant must be bigger than eight, but smaller than six plus eight, which is fourteen. Ten fits.'
        write: '$8 < 10 < 14$ ✓'
      - section: 'Answer'
        say: 'So the resultant is ten point zero newtons, which is option C.'
        write: '$\therefore R = 10.0\ \text{N}$'
        answer: true
    traps:
      A: 'You went for thirteen newtons. Pythagoras gives exactly ten, because thirty-six plus sixty-four is one hundred.'
      B: 'You chose fourteen newtons. Adding six and eight only works when both forces point the same way. These are at right angles.'
      D: 'You picked twelve newtons. No correct way of combining six and eight at right angles gives twelve. The square root of one hundred is ten.'
  6:
    moments:
      - section: 'The question'
        say: 'A two kilogram object whirls round a circle. What force keeps pulling it towards the centre? One small slip, forgetting to square, changes everything.'
        write: 'Object moving in a circle, centripetal force $= ?$'
      - section: 'The data'
        say: 'The mass m is two kilograms, the speed v is ten metres per second, and the radius r is four metres.'
        write: '$m = 2\ \text{kg}$, $v = 10\ \text{m s}^{-1}$, $r = 4\ \text{m}$, $F = ?$'
      - section: 'The law'
        say: 'A body moving in a circle needs a force towards the centre, called the centripetal force. It equals m v squared over r.'
        write: '$F = \dfrac{mv^{2}}{r}$'
      - section: 'The units'
        say: 'Kilograms, metres per second and metres are all SI units, so there is nothing to convert.'
        write: 'all in SI units ✓'
      - section: 'Substitute'
        say: 'Put in the numbers. F equals two times ten squared, over four.'
        write: '$F = \dfrac{2 \times 10^{2}}{4}$'
      - say: 'Ten squared is one hundred, and two times one hundred is two hundred.'
        write: '$= \dfrac{2 \times 100}{4} = \dfrac{200}{4}$'
      - say: 'Two hundred divided by four is fifty. So F is fifty newtons.'
        write: '$F = 50\ \text{N}$'
      - section: 'Check'
        say: 'Check the unit. Kilograms times metres squared per second squared, over metres, gives kilogram metres per second squared, which is the newton.'
        write: '$\dfrac{\text{kg}\,(\text{m s}^{-1})^{2}}{\text{m}} = \text{kg m s}^{-2} = \text{N}$ ✓'
      - section: 'Answer'
        say: 'So the centripetal force is fifty newtons, which is option D.'
        write: '$\therefore F = 50\ \text{N}$'
        answer: true
    traps:
      A: 'You went for forty newtons. That comes from no correct step. Two times one hundred over four is fifty.'
      B: 'You chose twenty-five newtons. That divides by eight instead of four, as if the radius were doubled.'
      C: 'You picked one hundred newtons. That divides m v squared by two instead of by the radius, which is four metres.'
  7:
    moments:
      - section: 'The question'
        say: 'An object falls for three seconds. How far does it drop? Ninety metres looks tempting, but there is a half hiding in the formula.'
        write: 'Falls freely for 3 s, distance $= ?$'
      - section: 'The data'
        say: 'It falls from rest, so u is zero. The acceleration a is g, ten metres per second squared, and the time t is three seconds.'
        write: '$u = 0$, $a = g = 10\ \text{m s}^{-2}$, $t = 3\ \text{s}$, $s = ?$'
      - section: 'The law'
        say: 'The equation of motion for distance is s equals u t plus half a t squared.'
        write: '$s = ut + \tfrac{1}{2}at^{2}$'
      - say: 'With u equal to zero the first term goes, and a is g. So s equals half g t squared.'
        write: '$s = \tfrac{1}{2}gt^{2}$'
      - section: 'The units'
        say: 'Seconds and metres per second squared are SI units already.'
        write: 'all in SI units ✓'
      - section: 'Substitute'
        say: 'Put in the numbers. s equals half times ten times three squared.'
        write: '$s = \tfrac{1}{2} \times 10 \times 3^{2}$'
      - say: 'Half of ten is five, and three squared is nine. Five times nine is forty-five metres.'
        write: '$= 5 \times 9 = 45\ \text{m}$'
      - section: 'Check'
        say: 'Check. After three seconds it moves at thirty metres per second. Its average speed is fifteen, and fifteen times three is forty-five metres. It agrees.'
        write: 'average speed $= \dfrac{0 + 30}{2} = 15$, $15 \times 3 = 45$ ✓'
      - section: 'Answer'
        say: 'So the object falls forty-five metres, which is option D.'
        write: '$\therefore s = 45\ \text{m}$'
        answer: true
    traps:
      A: 'You went for sixty metres. That does not come from half g t squared. Five times nine is forty-five.'
      B: 'You chose ninety metres. That forgets the half in half g t squared.'
      C: 'You picked thirty metres. That is g times t, which is the speed after three seconds, not the distance.'
  8:
    moments:
      - section: 'The question'
        say: 'Three cones on a table. X stands on its point, Y stands on its base, and Z lies on its side. Which one does not care where you push it?'
        write: 'X on its point, Y on its base, Z on its side'
      - section: 'The rule'
        say: 'Stable equilibrium means a small push raises the centre of gravity, so the body falls back.'
        write: 'stable: a push raises the C.G., it falls back'
      - say: 'Unstable equilibrium means a small push lowers the centre of gravity, so the body topples over.'
        write: 'unstable: a push lowers the C.G., it topples'
      - say: 'Neutral equilibrium means a push leaves the centre of gravity at the same height, so the body rests wherever it stops.'
        write: 'neutral: the C.G. stays at the same height'
      - section: 'The cones'
        say: 'X stands on its sharp point. A tiny push lowers its centre of gravity and it falls over. So X is unstable.'
        write: 'X → unstable'
      - say: 'Y stands on its broad flat base. Tilt it a little and its centre of gravity rises, so it falls back. Y is stable.'
        write: 'Y → stable'
      - say: 'Z lies on its curved side. When it rolls, its centre of gravity stays at the same height. Z is neutral.'
        write: 'Z → neutral'
      - section: 'An example'
        say: 'Think of an empty bottle lying on its side on a table. Roll it and it stays wherever it stops.'
        write: 'bottle on its side: rolls and stays put'
      - section: 'Answer'
        say: 'So only Z is in neutral equilibrium, which is option B.'
        write: '$\therefore$ Z only'
        answer: true
    traps:
      A: 'You went for Y and X. Y on its base is stable and X on its point is unstable. Neither is neutral.'
      C: 'You chose X only. A cone on its point falls at the slightest push, so it is unstable, not neutral.'
      D: 'You picked Y and Z. Z is neutral, but Y on its base is stable, because a tilt raises its centre of gravity.'
  9:
    moments:
      - section: 'The question'
        say: 'Dip a thin glass tube into water and the water climbs up. Dip it into mercury and something different happens. What?'
        write: 'Narrow tube in a liquid: rise or fall?'
      - section: 'The fact'
        say: 'In a narrow tube, a liquid that wets glass rises above the outside level. A liquid that does not wet glass is pushed down below it.'
        write: 'wets glass → rises;  does not wet → falls'
      - section: 'The reason'
        say: 'Water sticks to glass more strongly than it sticks to itself. That pull to the glass is adhesion, so water creeps up the walls.'
        write: 'water: adhesion > cohesion → rises'
      - say: 'Mercury holds itself together more strongly than it sticks to glass. That is cohesion, so mercury pulls away from the walls and is pushed down.'
        write: 'mercury: cohesion > adhesion → depressed'
      - section: 'An example'
        say: 'This rising in narrow tubes is called capillarity. It is how kerosene climbs the wick of a lantern.'
        write: 'capillarity: kerosene up a lantern wick'
      - section: 'Remember'
        say: 'Remember it this way. Water wets and climbs, mercury does not wet and sinks.'
        write: 'wets → climbs;  does not wet → sinks'
      - section: 'Answer'
        say: 'So the liquid falls below the outside level if it does not wet the glass, which is option D.'
        write: '$\therefore$ non-wetting liquid falls below the level'
        answer: true
    traps:
      A: 'You went for A. A liquid that does not wet glass, like mercury, falls in the tube. It does not rise.'
      B: 'You chose B. In a narrow tube the level does change. That is capillary action.'
      C: 'You picked C. A liquid that wets glass, like water, rises in the tube. It does not fall.'
  10:
    moments:
      - section: 'The question'
        say: 'A wide tank and a thin pipe hold the same water to the same depth. Which has more pressure at the bottom? The answer surprises many students.'
        write: 'Pressure in a liquid depends on which of I, II, III?'
      - section: 'The law'
        say: 'Pressure in a liquid is depth times density times g. We write p equals h rho g.'
        write: 'pressure in a liquid: $p = h\rho g$'
      - say: 'Here h is the depth below the surface, and rho is the density of the liquid.'
        write: '$h$ = depth, $\rho$ = density'
      - section: 'Test each factor'
        say: 'Look at the formula. Depth is in it, so II matters. Density is in it, so I matters.'
        write: 'I ✓,  II ✓'
      - say: 'Surface area is not in the formula at all. So III does not matter.'
        write: 'III ✗'
      - section: 'The reason'
        say: 'A bigger area holds more liquid and so a bigger force, but the force on each square metre stays the same.'
        write: 'bigger area → bigger force, same force per m²'
      - section: 'An example'
        say: 'This is why a borehole tank is raised high on a stand. The height of the water gives the pressure at the taps, not the width of the tank.'
        write: 'high tank → more pressure at the taps'
      - section: 'Answer'
        say: 'So the pressure depends on density and depth, I and II only, which is option B.'
        write: '$\therefore$ I and II only'
        answer: true
    traps:
      A: 'You went for I and III. That leaves out depth, and adds surface area, which is not in p equals h rho g.'
      C: 'You chose II and III. That leaves out density and adds surface area. Sea water gives more pressure than fresh water at the same depth.'
      D: 'You picked all three. Surface area does not appear in p equals h rho g, so it does not change the pressure.'
  11:
    moments:
      - section: 'The question'
        say: 'Four qualities, and one of them is a trap. Should a good thermometer take in a lot of heat, or very little?'
        write: 'Qualities of a good thermometer?'
      - section: 'The good qualities'
        say: 'A good thermometer should be sensitive. That means a small change in temperature gives a big change in the reading.'
        write: 'II high sensitivity ✓'
      - say: 'It should also be easy to read, and accurate over a wide range of temperatures.'
        write: 'III easy readability ✓,  IV wide range ✓'
      - section: 'Thermal capacity'
        say: 'Now thermal capacity. That is the heat a body needs to warm up by one kelvin.'
        write: 'thermal capacity = heat per kelvin rise'
      - say: 'A thermometer with a high thermal capacity takes a lot of heat from what it measures. That changes the very temperature it is reading, and it responds slowly.'
        write: 'I high thermal capacity ✗, we want it low'
      - section: 'An example'
        say: 'This is why a clinical thermometer has a thin glass bulb with only a little mercury. It reaches body temperature quickly without cooling the patient.'
        write: 'clinical thermometer: thin bulb, little mercury'
      - section: 'Answer'
        say: 'So the qualities of a good thermometer are II, III and IV, which is option A.'
        write: '$\therefore$ II, III and IV'
        answer: true
    traps:
      B: 'You went for I and II. High thermal capacity is a fault, and this also leaves out easy reading and a wide range.'
      C: 'You chose all four. High thermal capacity is a fault, because the thermometer would steal heat from what it measures.'
      D: 'You picked I, III and IV. That keeps the fault, high thermal capacity, and drops sensitivity, which a good thermometer needs.'
  12:
    moments:
      - section: 'The question'
        say: 'A machine lifts a load, but it is only forty percent efficient. Does the effort do more work or less than the load receives? That decides the answer.'
        write: 'Machine, efficiency 40%, work done by the effort $= ?$'
      - section: 'The data'
        say: 'The load L is twenty newtons, the height h is ten metres, and the efficiency is forty percent.'
        write: '$L = 20\ \text{N}$, $h = 10\ \text{m}$, efficiency $= 40\%$'
      - section: 'The law'
        say: 'Efficiency is the work output divided by the work input, times one hundred percent.'
        write: 'efficiency $= \dfrac{\text{work output}}{\text{work input}} \times 100\%$'
      - say: 'So the work input equals the work output divided by the efficiency.'
        write: 'work input $= \dfrac{\text{work output}}{\text{efficiency}}$'
      - section: 'Convert'
        say: 'Change the efficiency from a percentage to a decimal. Forty percent is forty over one hundred, which is zero point four.'
        write: '$40\% = \dfrac{40}{100} = 0.40$'
      - section: 'Substitute'
        say: 'The useful work output is load times height. Twenty times ten is two hundred joules.'
        write: 'work output $= 20 \times 10 = 200\ \text{J}$'
      - say: 'The work input equals two hundred divided by zero point four.'
        write: 'work input $= \dfrac{200}{0.40}$'
      - say: 'Two hundred over zero point four is the same as two thousand over four, which is five hundred joules.'
        write: '$= \dfrac{2000}{4} = 500\ \text{J}$'
      - section: 'Check'
        say: 'Check. The effort must do more than two hundred joules of work, because no machine gives out more than is put in. And forty percent of five hundred is two hundred.'
        write: '$0.40 \times 500 = 200$ ✓'
      - section: 'Answer'
        say: 'So the work done by the effort is five hundred joules, which is option C.'
        write: '$\therefore$ work input $= 500\ \text{J}$'
        answer: true
    traps:
      A: 'You went for one hundred and twenty joules. That takes sixty percent of two hundred joules, the share that is wasted. Divide two hundred by zero point four instead.'
      B: 'You chose eighty joules. That multiplies two hundred by zero point four instead of dividing. The effort always does more work than the load receives.'
      D: 'You picked three hundred joules. That adds only one hundred joules of waste. At forty percent efficiency three hundred joules are wasted, so the input is five hundred.'
  13:
    moments:
      - section: 'The question'
        say: 'Four substances, but only one stays put between moving metal parts and keeps them sliding smoothly. Which one?'
        write: 'Best for reducing friction?'
      - section: 'The fact'
        say: 'Friction between moving surfaces is reduced by a lubricant. A lubricant keeps a thin layer between the surfaces so they do not rub directly.'
        write: 'lubricant = thin layer between moving surfaces'
      - section: 'The reason'
        say: 'Grease is thick and sticky. It stays in place between bearings and gears, instead of running off or drying out.'
        write: 'grease: thick, sticky, stays in place'
      - say: 'Petrol and kerosene evaporate quickly, and they even dissolve grease away. Water makes steel parts rust.'
        write: 'petrol, kerosene: evaporate;  water: rust'
      - section: 'An example'
        say: 'This is why mechanics pack grease into the wheel bearings of a keke or an okada.'
        write: 'grease in the wheel bearings of a keke'
      - section: 'Remember'
        say: 'Remember it this way. Grease for gears.'
        write: 'grease for gears'
      - section: 'Answer'
        say: 'So grease is the one that reduces friction well, which is option C.'
        write: '$\therefore$ grease'
        answer: true
    traps:
      A: 'You went for petrol. Petrol evaporates quickly and washes grease away, so it does not stay to lubricate.'
      B: 'You chose kerosene. Kerosene also evaporates, and it is used to clean grease off, not to lubricate.'
      D: 'You picked water. Water is a poor lubricant and makes steel parts rust.'
  14:
    moments:
      - section: 'The question'
        say: 'A copper wire is stretched hard. What is its strain? The whole question is one careful division with powers of ten.'
        write: 'Copper wire under tensile stress, strain $= ?$'
      - section: 'The data'
        say: 'The tensile stress is seven point seven times ten to the power seven newtons per metre squared. The Young modulus E is one point one times ten to the power eleven newtons per metre squared.'
        write: 'stress $= 7.7 \times 10^{7}\ \text{N m}^{-2}$, $E = 1.1 \times 10^{11}\ \text{N m}^{-2}$'
      - section: 'The law'
        say: 'The Young modulus is stress divided by strain.'
        write: '$E = \dfrac{\text{stress}}{\text{strain}}$'
      - say: 'So the strain equals the stress divided by E.'
        write: 'strain $= \dfrac{\text{stress}}{E}$'
      - section: 'The units'
        say: 'Both are in newtons per metre squared, so the units cancel and nothing needs converting.'
        write: '$\text{N m}^{-2} \div \text{N m}^{-2}$, units cancel'
      - section: 'Substitute'
        say: 'Put in the numbers. Strain equals seven point seven times ten to the power seven, over one point one times ten to the power eleven.'
        write: 'strain $= \dfrac{7.7 \times 10^{7}}{1.1 \times 10^{11}}$'
      - say: 'Divide the numbers first. Seven point seven divided by one point one is seven.'
        write: '$\dfrac{7.7}{1.1} = 7.0$'
      - say: 'Now the powers. When we divide, we subtract them. Seven minus eleven is minus four.'
        write: '$\dfrac{10^{7}}{10^{11}} = 10^{7-11} = 10^{-4}$'
      - say: 'So the strain is seven point zero times ten to the power minus four.'
        write: 'strain $= 7.0 \times 10^{-4}$'
      - section: 'Check'
        say: 'Check. Strain is extension over length, so it has no unit. A tiny strain is right for a stiff metal like copper.'
        write: 'no unit, very small ✓'
      - section: 'Answer'
        say: 'So the tensile strain is seven point zero times ten to the power minus four, which is option D.'
        write: '$\therefore$ strain $= 7.0 \times 10^{-4}$'
        answer: true
    traps:
      A: 'You went for two point two times ten to the power minus four. Seven point seven divided by one point one is seven, not two point two.'
