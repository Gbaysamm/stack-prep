        write: 'Graph D ✓'
      - section: 'An example'
        say: 'This is why a capacitor blocks steady d c, where the frequency is zero, but lets high frequency a c pass easily.'
        write: 'f = 0 (d.c.) → $X_C$ huge;  high f → $X_C$ small'
      - section: 'Answer'
        say: 'So the correct shape is the falling curve in graph D, which is option D.'
