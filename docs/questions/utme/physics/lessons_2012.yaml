  31:
    moments:
      - section: 'The data'
        say: 'A pinhole camera shows a building as a tiny upside down picture. From that picture we can find how tall the building really is.'
        write: 'u = 300 m, v = 5 cm, image height hᵢ = 2.5 cm, building height hₒ = ?'
      - section: 'The rule'
        say: 'Light travels in straight lines, so the rays through the pinhole make two similar triangles.'
        write: 'Straight-line rays → similar triangles'
      - say: 'So image height over object height equals image distance over object distance.'
        write: '$\dfrac{h_i}{h_o} = \dfrac{v}{u}$'
      - section: 'Convert'
        say: 'Put every length in metres. Five centimetres is zero point zero five metres, and two point five centimetres is zero point zero two five metres.'
        write: 'v = 5 cm = 0.05 m,  hᵢ = 2.5 cm = 0.025 m'
      - section: 'Rearrange'
        say: 'Make the object height the subject. H o equals h i times u over v.'
        write: '$h_o = h_i \times \dfrac{u}{v}$'
      - section: 'Substitute'
        say: 'Put in the numbers. That gives zero point zero two five times three hundred over zero point zero five.'
        write: '$h_o = 0.025 \times \dfrac{300}{0.05}$'
      - say: 'Three hundred over zero point zero five is six thousand.'
        write: '$h_o = 0.025 \times 6000$'
      - say: 'Zero point zero two five times six thousand is one hundred and fifty metres.'
        write: '$h_o = 150\ \text{m}$'
      - section: 'Check'
        say: 'Check. The building is six thousand times further from the pinhole than the screen, so it is six thousand times taller than the image.'
        write: '$2.5\ \text{cm} \times 6000 = 15\,000\ \text{cm} = 150\ \text{m}$ ✓'
      - section: 'Answer'
        say: 'So the height of the building is one hundred and fifty metres, which is option D.'
        write: '$\therefore h_o = 150\ \text{m}$'
        answer: true
    traps:
      A: 'You went for twenty-five metres. That is too small. The building is six thousand times as far away as the screen, so it is six thousand times the image height, one hundred and fifty metres.'
      B: 'You chose fifty metres. That is one third of the right height. Three hundred over zero point zero five is six thousand.'
      C: 'You picked one hundred metres. That does not come from zero point zero two five times six thousand, which is one hundred and fifty.'
