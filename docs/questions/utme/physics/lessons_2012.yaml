# UTME 2012 Physics, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the Nigerian classroom way: the data with symbols and
# units, the law in words then written, any conversion to SI units as its own moment, the
# substitution one step per moment, the answer with its unit and a check, and the answer moment
# that names the option. traps gives one kind line for each wrong option.
#
#   say:    heard, not read. No symbols the voice would mangle; formulas read the way a Nigerian
#           teacher reads them, units and numbers in words.
#   write:  the one line written while it is said, with LaTeX between single dollar signs.
#   answer: true on the moment that gives the answer.
#
# Keyed on question number, like explanations_2012.yaml. Answers match that file.
format_version: 1
exam_year: 2012
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'Two students read the same metre rule and get different lengths. Usually one of them is looking from the side. So where should the eye be?'
        write: 'Reading a metre rule: where should the eye be?'
      - section: 'The rule'
        say: 'Parallax error is the false reading you get when your eye is not in line with the mark you are reading.'
        write: 'Parallax error = false reading when the eye is not in line with the mark'
      - section: 'The reason'
        say: 'Look from the left or the right, and the end of the object seems to sit against the wrong mark.'
        write: 'Eye to the side → object lines up with the wrong mark'
      - say: 'So the eye must be directly above the mark, looking vertically downwards on it.'
        write: 'Eye directly above, looking vertically down ✓'
      - section: 'An example'
        say: 'Think of a tailor in the market reading his tape. He leans over it and looks straight down at the mark.'
        write: 'Tailor''s tape: lean over, look straight down'
      - section: 'Remember'
        say: 'So remember it this way. Keep your eye above the mark and look straight down, and there is no parallax.'
        write: 'Eye above the mark → no parallax'
      - section: 'Answer'
        say: 'So to remove parallax error, the eye looks vertically downwards on the markings, which is option C.'
        write: '$\therefore$ vertically downwards on the markings'
        answer: true
    traps:
      A: 'You went for A. Looking slantwise from the left is exactly what causes parallax error, because the mark seems to shift.'
      B: 'You chose B. Looking slantwise from the right also causes parallax error, just in the other direction.'
      D: 'You picked D. The rule lies on the table, so looking upwards would put your eye below it. The eye must look down from directly above.'
  3:
    moments:
      - section: 'The data'
        say: 'A load is dragged along the floor at a steady speed by a rope at forty-five degrees. Is the friction the whole fifteen hundred newtons? Many students think so.'
        write: 'T = 1500 N at θ = 45° to the floor, uniform speed, F = ?'
      - section: 'The law'
        say: 'Newton''s first law tells us that at uniform speed there is no acceleration, so the forces along the floor balance.'
        write: 'Uniform speed ⇒ forces balance: friction = horizontal pull'
      - say: 'The rope pulls forward and upward at the same time. Only the horizontal part of the pull drags the load forward, and that part is T cos theta, where theta is the angle between the rope and the floor.'
        write: 'Horizontal component $= T\cos\theta$'
      - section: 'Substitute'
        say: 'So the friction equals fifteen hundred times cos forty-five degrees.'
        write: '$F = 1500 \times \cos 45^\circ$'
      - say: 'Cos forty-five degrees is zero point seven zero seven one.'
        write: '$F = 1500 \times 0.7071$'
      - say: 'Fifteen hundred times zero point seven zero seven one is one thousand and sixty-one newtons.'
        write: '$F = 1061\ \text{N}$'
      - section: 'Check'
        say: 'Check. Friction must be smaller than the full pull, because only part of the rope''s force acts along the floor. One thousand and sixty-one is less than fifteen hundred.'
        write: '$1061\ \text{N} < 1500\ \text{N}$ ✓'
      - section: 'Answer'
        say: 'So the frictional force on the load is one thousand and sixty-one newtons, which is option D.'
        write: '$\therefore F = 1061\ \text{N}$'
        answer: true
    traps:
      A: 'You went for one thousand five hundred and twenty-four newtons. That is more than the whole pull of the rope, and the friction only balances part of that pull.'
      B: 'You chose one thousand three hundred and fifty newtons. That is fifteen hundred times zero point nine, but cos forty-five degrees is zero point seven zero seven one.'
      C: 'You picked one thousand two hundred and sixty newtons. That is not fifteen hundred times cos forty-five degrees. Check the cosine, which is about zero point seven zero seven.'
  4:
    moments:
      - section: 'The data'
        say: 'Six newtons and eight newtons act on O at right angles. If you just add them you get fourteen, and that is the trap. Let us find the real resultant.'
        write: 'OU = 6 N along OQ, 8 N along OS, angle 90°, OT = ?'
      - say: 'In the diagram, the two forces make the sides of a rectangle. The diagonal of that rectangle points along O R, straight up.'
        write: '6 N and 8 N → rectangle, diagonal along OR'
      - section: 'The law'
        say: 'The parallelogram law says the resultant of two forces is the diagonal of the parallelogram they form.'
        write: 'Parallelogram law: resultant = diagonal'
      - say: 'At right angles the parallelogram is a rectangle, so we use Pythagoras. R equals the square root of F one squared plus F two squared.'
        write: '$R = \sqrt{F_1^{2} + F_2^{2}}$'
      - section: 'Substitute'
        say: 'Put in six and eight. R equals the square root of six squared plus eight squared.'
        write: '$R = \sqrt{6^{2} + 8^{2}}$'
      - say: 'Six squared is thirty-six and eight squared is sixty-four, which add up to one hundred.'
        write: '$R = \sqrt{36 + 64} = \sqrt{100}$'
      - say: 'The square root of one hundred is ten. So the resultant is ten newtons along O R.'
        write: '$R = 10\ \text{N}$ along OR'
      - section: 'The equilibrant'
        say: 'To keep O in equilibrium, O T must be equal in size to the resultant and opposite in direction. That force is called the equilibrant.'
        write: 'Equilibrant OT: same size as R, opposite direction'
      - say: 'So O T is ten newtons, pointing straight down.'
        write: 'OT = 10 N, straight down'
      - section: 'Check'
        say: 'Check. The resultant of these two forces must lie between eight minus six and eight plus six. Ten lies between two and fourteen.'
        write: '$8 - 6 < 10 < 8 + 6$ ✓'
      - section: 'Answer'
        say: 'So the magnitude of O T is ten newtons, which is option C.'
        write: '$\therefore OT = 10\ \text{N}$'
        answer: true
    traps:
      A: 'You went for eighteen newtons. No vector rule turns six and eight newtons into eighteen. The most they can ever give is fourteen.'
      B: 'You chose fourteen newtons. That adds six and eight as if they pulled the same way. At right angles we use Pythagoras, and that gives ten.'
      D: 'You picked two newtons. That subtracts them as if they pulled in opposite directions. These two forces are at right angles.'
  5:
    moments:
      - section: 'The question'
        say: 'A velocity time graph tells us a lot about a moving body. But there is one thing it can never tell us. Which one?'
        write: 'Velocity-time graph: what CANNOT be found?'
      - section: 'The data'
        say: 'On the graph, the velocity stays at sixty metres per second for twenty seconds, then falls in a straight line to zero at twenty-five seconds.'
        write: 'v = 60 m s⁻¹ from 0 to 20 s, then falls to 0 at 25 s'
      - section: 'The rule'
        say: 'A velocity time graph gives us three things. First, the velocity at any moment is read straight off the graph.'
        write: 'Read off the graph → velocity'
      - say: 'Second, the slope of the graph gives the acceleration, because acceleration is the change in velocity divided by the time taken.'
        write: 'Slope → acceleration'
      - say: 'Third, the area under the graph gives the distance travelled, because distance is velocity times time.'
        write: 'Area under the graph → distance'
      - section: 'Test each one'
        say: 'Now test each option. The initial velocity is read at time zero. It is sixty metres per second.'
        write: 'Initial velocity = 60 m s⁻¹ ✓'
      - say: 'The deceleration is the slope of the falling part. The velocity falls by sixty metres per second in the five seconds from twenty to twenty-five, and sixty divided by five is twelve metres per second squared.'
        write: 'Deceleration $= \dfrac{60 - 0}{25 - 20} = 12\ \text{m s}^{-2}$ ✓'
      - say: 'The total distance is the area under the graph, which has two parts. The flat part is a rectangle, sixty times twenty, which is twelve hundred metres.'
        write: 'Rectangle $= 60 \times 20 = 1200\ \text{m}$'
      - say: 'The falling part is a triangle, a half times five times sixty, which is one hundred and fifty metres.'
        write: 'Triangle $= \tfrac{1}{2} \times 5 \times 60 = 150\ \text{m}$'
      - say: 'Twelve hundred plus one hundred and fifty makes one thousand three hundred and fifty metres. So the distance can be found too.'
        write: 'Distance $= 1200 + 150 = 1350\ \text{m}$ ✓'
      - say: 'Mass appears nowhere on the graph. A bicycle and a heavy lorry could have exactly the same velocity time graph.'
        write: 'Mass: not on the graph ✗'
      - section: 'Answer'
        say: 'So the mass of the body cannot be determined from the graph, which is option D.'
        write: '$\therefore$ mass cannot be found'
        answer: true
    traps:
      A: 'You went for deceleration, but that is the slope of the falling part, twelve metres per second squared. It can be found.'
      B: 'You chose initial velocity. That is read straight off the graph at time zero, sixty metres per second.'
      C: 'You picked total distance. It is not written on the graph, but it is the area under it, one thousand three hundred and fifty metres.'
  6:
    moments:
      - section: 'The data'
        say: 'A train moving at thirty metres per second brakes very gently. How far does it go before it stops? No time is given, so choose the equation carefully.'
        write: 'u = 30 m s⁻¹, v = 0, a = −0.1 m s⁻², s = ?'
      - say: 'It comes to rest, so v is zero. A retardation means the acceleration is negative, minus zero point one metres per second squared.'
        write: 'Rest ⇒ v = 0;  retardation ⇒ a = −0.1 m s⁻²'
      - section: 'The law'
        say: 'We need the equation of motion with no time in it. V squared equals u squared plus two a s.'
        write: '$v^{2} = u^{2} + 2as$'
      - section: 'Substitute'
        say: 'Put in the numbers. Zero equals thirty squared plus two times minus zero point one times s.'
        write: '$0 = 30^{2} + 2(-0.1)s$'
      - say: 'Thirty squared is nine hundred, and two times minus zero point one is minus zero point two. So zero equals nine hundred minus zero point two s.'
        write: '$0 = 900 - 0.2s$'
      - say: 'Add zero point two s to both sides. Zero point two s equals nine hundred.'
        write: '$0.2s = 900$'
      - say: 'Divide both sides by zero point two. Nine hundred divided by zero point two is four thousand five hundred metres.'
        write: '$s = \dfrac{900}{0.2} = 4500\ \text{m}$'
      - section: 'Check'
        say: 'Check. A very gentle retardation should give a long stopping distance, and four point five kilometres is long. The unit is metres.'
        write: '4500 m = 4.5 km, long for gentle braking ✓'
      - section: 'Answer'
        say: 'So the train covers four thousand five hundred metres before it stops, which is option B.'
        write: '$\therefore s = 4500\ \text{m}$'
        answer: true
    traps:
      A: 'You went for five thousand five hundred metres. That does not come from nine hundred divided by zero point two. Work it again and you get four thousand five hundred.'
      C: 'You chose four thousand two hundred metres. That is close, but nine hundred divided by zero point two is exactly four thousand five hundred.'
      D: 'You picked three thousand metres. That is too short. The train takes three hundred seconds to stop, at an average speed of fifteen metres per second, and fifteen times three hundred is four thousand five hundred metres.'
  7:
    moments:
      - section: 'The data'
        say: 'A car starts from rest and speeds up for twenty seconds. Many students forget one small half here, and it doubles the answer.'
        write: 'u = 0, a = 30 m s⁻², t = 20 s, s = ?'
      - section: 'The law'
        say: 'With u, a and t given, we use the equation of motion s equals u t plus a half a t squared.'
        write: '$s = ut + \tfrac{1}{2}at^{2}$'
      - section: 'Substitute'
        say: 'Put in u, a and t. It starts from rest, so u is zero and the u t part is zero. A is thirty and t is twenty.'
        write: '$s = 0 \times 20 + \tfrac{1}{2} \times 30 \times 20^{2}$'
      - say: 'Twenty squared is four hundred, and a half of thirty is fifteen.'
        write: '$s = 15 \times 400$'
      - say: 'Fifteen times four hundred is six thousand metres.'
        write: '$s = 6000\ \text{m}$'
      - section: 'Convert'
        say: 'The options are in kilometres. One kilometre is one thousand metres, so divide by one thousand.'
        write: '$6000\ \text{m} \div 1000 = 6\ \text{km}$'
      - section: 'Check'
        say: 'Check. The final speed is thirty times twenty, six hundred metres per second, so the average speed is three hundred. Three hundred times twenty seconds is six thousand metres.'
        write: 'Average speed = 300 m s⁻¹, 300 × 20 = 6000 m ✓'
      - section: 'Answer'
        say: 'So the car covers six kilometres, which is option A.'
        write: '$\therefore s = 6\ \text{km}$'
        answer: true
    traps:
      B: 'You went for twelve kilometres. That leaves out the half in a half a t squared, so it doubles the distance.'
      C: 'You chose eighteen kilometres. That is three times the right distance, and it does not come from a half times thirty times four hundred.'
      D: 'You picked twenty-four kilometres. That multiplies by two instead of by a half, so it is four times too big. A half times thirty times four hundred is six thousand metres.'
  8:
    moments:
      - section: 'The question'
        say: 'A rocket leaves the earth for a distant planet. Does the earth''s pull on it grow or shrink as it travels?'
        write: 'Rocket moving away: how does F change?'
      - section: 'The law'
        say: 'Newton''s law of universal gravitation says the force between two masses is directly proportional to the product of the masses, and inversely proportional to the square of the distance between them.'
        write: 'Newton''s law: $F \propto m_1m_2$ and $F \propto \dfrac{1}{r^{2}}$'
      - say: 'As a formula, F equals G m one m two over r squared, where G is the universal gravitational constant.'
        write: '$F = \dfrac{Gm_1m_2}{r^{2}}$'
      - say: 'G is a constant. It has the same value everywhere in the universe, so it never varies.'
        write: '$G = 6.67 \times 10^{-11}\ \text{N m}^{2}\ \text{kg}^{-2}$, constant'
      - section: 'Where r sits'
        say: 'Now look where r sits. R squared is underneath, so a smaller r gives a bigger force.'
        write: 'r ↓ ⇒ r² ↓ ⇒ F ↑'
      - say: 'And a bigger r gives a smaller force. Double the distance, and the force falls to a quarter.'
        write: 'r × 2 ⇒ F ÷ 4'
      - section: 'The rocket'
        say: 'So as the rocket moves away, the earth''s pull on it grows weaker. As it nears the planet, the planet''s pull grows stronger.'
        write: 'Far from the earth → weak pull;  near the planet → strong pull'
      - section: 'Answer'
        say: 'So the force F increases as r reduces, which is option A.'
        write: '$\therefore$ F increases as r reduces'
        answer: true
    traps:
      B: 'You went for B, but G is the universal gravitational constant. It does not vary, so it cannot make the force change.'
      C: 'You chose C. The force changes with the distance r, so it does not stay constant as the rocket travels.'
      D: 'You picked D, which is the wrong way round. With r squared underneath, the force gets smaller as r increases.'
  9:
    moments:
      - section: 'The question'
        say: 'Pull a pendulum bob to one side and let go. It swings back and forth about one point. What makes it do that?'
        write: 'Pendulum pulled aside and released: why does it oscillate?'
      - say: 'A bob that swings to and fro like this is moving in simple harmonic motion, S H M for short.'
        write: 'Swinging to and fro = simple harmonic motion (S.H.M.)'
      - section: 'The law'
        say: 'In simple harmonic motion, the acceleration is directly proportional to the displacement from the equilibrium point, and always directed towards that point.'
        write: 'S.H.M.: $a \propto x$, directed towards the equilibrium point'
      - say: 'As a formula, a equals minus omega squared x. Omega is a constant for the swinging bob, so a goes up in step with x. The minus sign means the pull is always back to the middle.'
        write: '$a = -\omega^{2}x$'
      - section: 'The reason'
        say: 'So the further you pull the bob aside, the bigger the pull back. It rushes back, overshoots, and comes back again.'
        write: 'Bigger x → bigger restoring pull → swings back'
      - section: 'An example'
        say: 'Think of a child on a swing at the playground. Pull it further back, and it rushes faster through the lowest point.'
        write: 'Swing: fastest at the middle, stops at the ends'
      - section: 'Answer'
        say: 'So it oscillates because the acceleration is directly proportional to the displacement, which is option A.'
        write: '$\therefore a \propto x$'
        answer: true
    traps:
      B: 'You went for B, but the restoring acceleration always points towards the equilibrium point, never away from it.'
      C: 'You chose C. In simple harmonic motion the acceleration goes with the displacement itself, not with its square.'
      D: 'You picked D, which is reversed. At the equilibrium point the velocity is greatest, not least.'
  10:
    moments:
      - section: 'The data'
        say: 'An object goes round a circle of radius zero point five metres at one metre per second. How fast is it turning?'
        write: 'r = 0.5 m, v = 1 m s⁻¹, ω = ?'
      - section: 'The law'
        say: 'Linear speed equals angular velocity times radius. V equals omega r.'
        write: '$v = \omega r$'
      - say: 'We want omega, so divide both sides by r. Omega equals v over r.'
        write: '$\omega = \dfrac{v}{r}$'
      - section: 'Substitute'
        say: 'Put in one metre per second and zero point five metres.'
        write: '$\omega = \dfrac{1}{0.5}$'
      - say: 'One divided by zero point five is two. The unit is radians per second.'
        write: '$\omega = 2\ \text{rad s}^{-1}$'
      - section: 'Check'
        say: 'Check. Two radians per second times zero point five metres gives back one metre per second.'
        write: '$\omega r = 2 \times 0.5 = 1\ \text{m s}^{-1}$ ✓'
      - section: 'Answer'
        say: 'So the angular velocity is two radians per second, which is option C.'
        write: '$\therefore \omega = 2\ \text{rad s}^{-1}$'
        answer: true
    traps:
      A: 'You went for eight radians per second. That does not come from v over r. One over zero point five is two.'
      B: 'You chose four radians per second. That divides by zero point two five, the radius squared. The formula divides by r itself.'
      D: 'You picked one radian per second. That forgets to divide by the radius at all.'
  11:
    moments:
      - section: 'The question'
        say: 'The force on this particle changes as it moves, so we cannot just multiply force by distance. The graph holds the answer.'
        write: 'Work done from x = 0 to x = 60 m = ?'
      - section: 'The data'
        say: 'On the graph, the force rises from zero at the start to eighty newtons at thirty metres, then falls back to zero at sixty metres.'
        write: '0 N at 0 m → 80 N at 30 m → 0 N at 60 m'
      - section: 'The rule'
        say: 'The work done by a varying force is the area under the force distance graph.'
        write: 'Work done = area under the F–x graph'
      - say: 'From zero to sixty metres the area is a triangle, with a base of sixty metres and a height of eighty newtons.'
        write: 'Triangle: base 60 m, height 80 N'
      - say: 'The area of a triangle is a half times base times height.'
        write: 'Area $= \tfrac{1}{2} \times \text{base} \times \text{height}$'
      - section: 'Substitute'
        say: 'So the work done is a half times sixty times eighty.'
        write: '$W = \tfrac{1}{2} \times 60 \times 80$'
      - say: 'A half of sixty is thirty, and thirty times eighty is two thousand four hundred. A newton times a metre is a joule.'
        write: '$W = 30 \times 80 = 2400\ \text{J}$'
      - section: 'Check'
        say: 'Check. If the force were eighty newtons all the way, the work would be four thousand eight hundred joules. The force reached eighty newtons only for an instant, so half of that makes sense.'
        write: '$\tfrac{1}{2} \times 4800 = 2400$ ✓'
      - section: 'Answer'
        say: 'So the work done from zero to sixty metres is two thousand four hundred joules, which is option B.'
        write: '$\therefore W = 2400\ \text{J}$'
        answer: true
    traps:
      A: 'You went for one thousand two hundred joules. That is the area from zero to thirty metres only, which is half of the triangle.'
      C: 'You chose six thousand joules. That is more than a full rectangle of eighty newtons by sixty metres. A half times sixty times eighty is two thousand four hundred.'
      D: 'You picked seven thousand joules. That is far more than even a full rectangle of eighty by sixty, which is four thousand eight hundred.'
  12:
    moments:
      - section: 'The question'
        say: 'A block sits on a slope and is just about to slide. That one moment gives us the coefficient of friction from the angle alone.'
        write: 'Block about to slide, plane at angle $\alpha$, $\mu = ?$'
      - section: 'The picture'
        say: 'In the diagram, the block rests on a plane tilted at an angle alpha to the horizontal. Its weight W acts straight down.'
        write: 'Weight W straight down;  plane at $\alpha$ to the horizontal'
      - section: 'The law'
        say: 'When a body is just about to slide, friction is at its limit. Limiting friction F equals mu R, where R is the normal reaction.'
        write: '$F = \mu R$'
      - section: 'Resolve the weight'
        say: 'Resolve the weight into two parts, one along the plane and one into it. Along the plane, down the slope, the part is W sin alpha.'
        write: 'Along the plane $W\sin\alpha$'
      - say: 'Into the plane, the part is W cos alpha.'
        write: 'Into the plane $W\cos\alpha$'
      - say: 'The block is not moving yet, so the forces balance. The normal reaction balances the part into the plane, so R equals W cos alpha.'
        write: '$R = W\cos\alpha$'
      - say: 'Friction balances the part down the slope, so F equals W sin alpha.'
        write: '$F = W\sin\alpha$'
      - section: 'Divide'
        say: 'Now rearrange F equals mu R. Mu equals F over R, which is W sin alpha over W cos alpha.'
        write: '$\mu = \dfrac{F}{R} = \dfrac{W\sin\alpha}{W\cos\alpha}$'
      - say: 'W cancels, and sin over cos is tan. So mu equals tan alpha.'
        write: '$\mu = \tan\alpha$'
      - section: 'An example'
        say: 'This angle alpha is called the angle of friction. Tilt a plank slowly with a book on it, and the angle where the book starts to slip gives mu.'
        write: '$\alpha$ = angle of friction'
      - section: 'Answer'
        say: 'So the coefficient of friction is tan alpha, which is option B.'
        write: '$\therefore \mu = \tan\alpha$'
        answer: true
    traps:
      A: 'You went for sin alpha. That is only the fraction of the weight down the slope. It still has to be divided by the normal reaction.'
      C: 'You chose cot alpha. That is R over F, which is the ratio turned upside down.'
      D: 'You picked cos alpha. That is only the fraction of the weight pressing into the plane.'
  13:
    moments:
      - section: 'The data'
        say: 'A twenty kilogram box slides down a slope at a steady speed. Do we even need the twenty kilograms? Let us see.'
        write: 'm = 20 kg, θ = 30°, constant velocity, μ = ?'
      - section: 'The forces'
        say: 'Constant velocity means no acceleration, so the forces along the slope balance. Friction equals the pull down the slope, m g sin theta.'
        write: 'Constant velocity ⇒ $F = mg\sin\theta$'
      - say: 'The normal reaction balances the weight into the plane. R equals m g cos theta.'
        write: '$R = mg\cos\theta$'
      - section: 'The law'
        say: 'The coefficient of kinetic friction is the friction divided by the normal reaction. Mu equals F over R.'
        write: '$\mu = \dfrac{F}{R} = \dfrac{mg\sin\theta}{mg\cos\theta}$'
      - say: 'M g cancels from top and bottom, leaving tan theta.'
        write: '$\mu = \tan\theta$'
      - section: 'Substitute'
        say: 'Put in thirty degrees. Tan thirty degrees is zero point five seven seven.'
        write: '$\mu = \tan 30^\circ = 0.577$'
      - say: 'To one decimal place, that is zero point six.'
        write: '$\mu \approx 0.6$'
      - section: 'Check'
        say: 'Check. The mass cancelled, so any box slides steadily at the same angle. The twenty kilograms and g were not needed.'
        write: 'Mass cancels ⇒ 20 kg not needed ✓'
      - section: 'Answer'
        say: 'So the coefficient of kinetic friction is zero point six, which is option D.'
        write: '$\therefore \mu \approx 0.6$'
        answer: true
    traps:
      A: 'You went for zero point two. That does not come from tan thirty degrees, which is zero point five seven seven.'
      B: 'You chose zero point three. Tan thirty degrees is zero point five seven seven, which rounds to zero point six.'
      C: 'You picked zero point five. That is sin thirty degrees. It forgets to divide by the normal reaction, which turns sin into tan.'
  14:
    moments:
      - section: 'The data'
        say: 'A block and tackle lifts a load, but some of the work is lost to friction. What fraction of the work is useful?'
        write: 'm = 25 kg, h = 30 m, work against friction = 1500 J, g = 10 m s⁻², efficiency = ?'
      - section: 'The law'
        say: 'Efficiency is the useful work output divided by the total work input, times one hundred percent.'
        write: 'Efficiency $= \dfrac{\text{work output}}{\text{work input}} \times 100\%$'
      - section: 'Mass to weight'
        say: 'First change the mass into a weight. W equals m g, twenty-five times ten, which is two hundred and fifty newtons.'
        write: '$W = mg = 25 \times 10 = 250\ \text{N}$'
      - section: 'The working'
        say: 'The useful work lifts the load. It is the load times the height, two hundred and fifty times thirty, which is seven thousand five hundred joules.'
        write: 'Output $= 250 \times 30 = 7500\ \text{J}$'
      - say: 'The total work put in is the useful work plus the work wasted on friction. Seven thousand five hundred plus fifteen hundred is nine thousand joules.'
        write: 'Input $= 7500 + 1500 = 9000\ \text{J}$'
      - section: 'Substitute'
        say: 'So the efficiency is seven thousand five hundred over nine thousand, times one hundred percent.'
        write: 'Efficiency $= \dfrac{7500}{9000} \times 100\%$'
      - say: 'That is eighty-three point three percent.'
        write: '$= 83.3\%$'
      - section: 'Check'
        say: 'Check. Fifteen hundred out of nine thousand joules is lost, which is about seventeen percent. One hundred minus seventeen is eighty-three.'
        write: '$\dfrac{1500}{9000} \approx 17\%$ lost, $100 - 17 = 83$ ✓'
