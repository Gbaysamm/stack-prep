  42:
    moments:
      - section: 'The question'
        say: 'A charge is pushed along by an electric force, and it moves the way the force pushes. What happens to its energy?'
        write: 'Charge moves along the electric force, energy?'
      - section: 'The rule'
        say: 'When a charge moves in the direction of the force on it, the force does positive work on it.'
        write: 'Moves with the force → force does positive work'
      - section: 'Potential energy'
        say: 'That work comes out of the electrical potential energy, so the potential energy falls.'
        write: 'Potential energy ↓'
      - section: 'Kinetic energy'
        say: 'The energy goes into motion, so the charge speeds up and its kinetic energy rises.'
        write: 'Kinetic energy ↑'
      - section: 'An example'
        say: 'It is just like a mango falling from a tree. Moving the way gravity pulls, it loses potential energy and gains kinetic energy.'
        write: 'Falling mango: P.E. ↓, K.E. ↑'
      - section: 'Check'
        say: 'Check. Energy is conserved. What the potential energy loses, the kinetic energy gains. It cannot gain both from nothing.'
        write: 'Loss in P.E. = gain in K.E. ✓'
      - section: 'Answer'
        say: 'So the charge loses potential energy and gains kinetic energy, which is option C.'
        write: '$\therefore$ loses P.E., gains K.E.'
        answer: true
    traps:
      A: 'You went for gains both. Gaining both kinds of energy at once would create energy from nothing.'
      B: 'You chose gains potential energy and kinetic energy. That says the same as A. Potential energy rises only when the charge is pushed against the force.'
      D: 'You picked loses both. Losing both would destroy energy. The work done by the force increases the kinetic energy.'
  43:
    moments:
      - section: 'The question'
        say: 'A galvanometer is a very sensitive meter. How do we turn it into a voltmeter?'
        write: 'Galvanometer → voltmeter, how?'
      - section: 'The fact'
        say: 'A voltmeter must draw very little current from the circuit, so it must have a very high resistance.'
        write: 'Voltmeter: very high resistance'
      - section: 'The galvanometer'
        say: 'A galvanometer has a small resistance, and gives full scale deflection with a tiny current.'
        write: 'Galvanometer: small resistance, tiny full-scale current'
      - section: 'The fix'
        say: 'We connect a high resistance, called a multiplier, in series with it. That raises the total resistance, so a large p d is needed for full deflection.'
        write: 'High resistance (multiplier) in series'
      - section: 'Compare'
        say: 'To make an ammeter instead, we connect a low resistance, called a shunt, in parallel.'
        write: 'Ammeter: low resistance (shunt) in parallel'
      - section: 'Remember'
        say: 'A voltmeter needs a high resistance in series. An ammeter needs a low one in parallel.'
        write: 'V: high, series;  A: low, parallel'
      - section: 'Answer'
        say: 'So to make a voltmeter, a high resistance is connected to it in series, which is option A.'
        write: '$\therefore$ high resistance in series'
        answer: true
    traps:
      B: 'You chose high resistance in parallel. A high resistance in parallel hardly changes the galvanometer at all.'
      C: 'You picked low resistance in series. A low series resistance leaves the total resistance low, so it cannot make a voltmeter.'
      D: 'You went for low resistance in parallel. That is a shunt, and it turns the galvanometer into an ammeter.'
  44:
    moments:
      - section: 'The question'
        say: 'Move a magnet near a coil and an e m f appears. Two laws talk about this. Which one really explains it?'
        write: 'Which law best explains induced e.m.f.s?'
      - section: 'The law'
        say: 'Faraday''s law says an e m f is induced whenever the magnetic flux linking a conductor changes.'
        write: 'Faraday: changing flux linkage induces an e.m.f.'
      - say: 'Its size is proportional to the rate of change of flux linkage. E equals minus N delta phi over delta t.'
        write: '$E = -N\dfrac{\Delta\Phi}{\Delta t}$'
      - section: 'The reason'
        say: 'So Faraday''s law tells us when an e m f appears and how big it is. That is what explains induced e m fs.'
        write: 'Faraday: when and how big'
      - section: 'Lenz'
        say: 'Lenz''s law adds only the direction. The induced current opposes the change that causes it, which is the minus sign.'
        write: 'Lenz: direction only (the minus sign)'
