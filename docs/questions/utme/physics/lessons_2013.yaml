      C: 'You chose telescope in abnormal use. The object is close to the first lens, which is a microscope arrangement, not a telescope.'
      D: 'You picked microscope in abnormal use. The final image is the usual magnified virtual one at the near point, and that is normal use.'
  34:
    moments:
      - section: 'The question'
        say: 'One lens magnifies four times, then a second lens magnifies that image seven times. How big is the total magnification?'
        write: 'Compound microscope, $M = ?$'
      - section: 'The data'
        say: 'The magnification of the objective, m o, is four. The magnification of the eyepiece, m e, is seven.'
        write: '$m_o = 4$, $m_e = 7$, $M = ?$'
      - section: 'The law'
