        write: '$M = 4 \times 7$'
      - say: 'That is twenty-eight.'
        write: '$M = 28$'
      - section: 'Check'
        say: 'Check. Enlarge a photo four times, then enlarge the copy seven times. It ends up twenty-eight times bigger, not eleven.'
        write: '$4 \times 7 = 28$, not $4 + 7$ ✓'
      - section: 'Answer'
        say: 'So the magnification of the microscope is twenty-eight, which is option D.'
        write: '$\therefore M = 28$'
        answer: true
    traps:
      A: 'You went for two. That divides the magnifications, which makes no sense for two lenses working one after the other.'
      B: 'You chose three. That subtracts the magnifications, but each lens enlarges the image further.'
      C: 'You picked eleven. That adds the magnifications. One lens magnifies the image of the other, so they multiply.'
  35:
    moments:
      - section: 'The question'
        say: 'White light enters a prism and comes out as a rainbow. Which colour bends least, and which bends most?'
        write: 'Order of increasing deviation?'
      - section: 'The fact'
        say: 'In a prism, red is deviated least and violet most. The order of the spectrum is red, orange, yellow, green, blue, indigo, violet.'
        write: 'R O Y G B I V: red least, violet most'
      - section: 'The reason'
        say: 'Glass has a larger refractive index for shorter wavelengths. Blue and violet have shorter wavelengths than red, so they bend more.'
        write: 'Shorter wavelength → larger $n$ → more deviation'
      - section: 'Apply it'
        say: 'So the deviation increases from red, to green, to blue.'
        write: 'Red → green → blue (increasing)'
      - section: 'An example'
        say: 'Look at a rainbow after the rain. Red is on the outside edge and violet on the inside.'
        write: 'Rainbow: red outside, violet inside'
      - section: 'Remember'
        say: 'Remember ROYGBIV. Moving from R towards V, the deviation keeps growing.'
        write: 'ROYGBIV: deviation grows from R to V'
      - section: 'Answer'
        say: 'So the deviation increases in the order red, green, blue, which is option A.'
        write: '$\therefore$ red → green → blue'
        answer: true
    traps:
      B: 'You chose green, violet, blue. Violet is deviated more than blue, so blue cannot come after it.'
      C: 'You picked blue, red, green. Red is deviated least, so it cannot sit between blue and green.'
      D: 'You went for blue, green, red. Those are the right colours in reverse, the order of decreasing deviation.'
  36:
    moments:
      - section: 'The question'
        say: 'A tiny charge sits in an electric field. What force does it feel? The powers of ten decide the answer, so go slowly.'
        write: 'Charge in an electric field, $F = ?$'
      - section: 'The data'
        say: 'The charge q is one point five times ten to the power minus nineteen coulombs. The field intensity E is ten to the power five volts per metre.'
        write: '$q = 1.5 \times 10^{-19}$ C, $E = 10^{5}\ \text{V m}^{-1}$, $F = ?$'
      - section: 'The law'
        say: 'Electric field intensity is the force per unit charge. E equals F over q.'
        write: '$E = \dfrac{F}{q}$'
      - say: 'Make F the subject. F equals q E.'
        write: '$F = qE$'
      - section: 'Substitute'
        say: 'F equals one point five times ten to the power minus nineteen, times ten to the power five.'
        write: '$F = 1.5 \times 10^{-19} \times 10^{5}$'
      - say: 'When we multiply powers of ten, we add the indices. Minus nineteen plus five is minus fourteen.'
        write: '$10^{-19} \times 10^{5} = 10^{-19 + 5} = 10^{-14}$'
      - say: 'So F equals one point five times ten to the power minus fourteen newtons.'
        write: '$F = 1.5 \times 10^{-14}$ N'
      - section: 'Check'
        say: 'Check the unit. Coulombs times volts per metre is joules per metre, which is newtons. Good.'
        write: '$\text{C} \times \text{V m}^{-1} = \text{J m}^{-1} = \text{N}$ ✓'
      - section: 'Answer'
        say: 'So the force on the charge is one point five times ten to the power minus fourteen newtons, which is option D.'
        write: '$\therefore F = 1.5 \times 10^{-14}$ N'
        answer: true
    traps:
      A: 'You went for ten to the power minus eleven. That is three places out. Minus nineteen plus five is minus fourteen.'
      B: 'You chose ten to the power minus twelve. That is two places out in the power of ten.'
      C: 'You picked ten to the power minus thirteen. That is one place out. Count again. Minus nineteen plus five is minus fourteen.'
  37:
    moments:
      - section: 'The question'
        say: 'An induction coil switches its current on and off very fast. Why does it need a capacitor?'
        write: 'Why is there a capacitor in an induction coil?'
      - section: 'The fact'
        say: 'An induction coil uses a make and break contact to switch the primary current on and off quickly.'
        write: 'Make-and-break switches the primary current'
      - section: 'The problem'
        say: 'Each time the current is broken, a spark jumps across the contacts. Sparks burn the contacts and slow down the fall of the current.'
        write: 'Each break → spark across the contacts'
      - section: 'The fix'
        say: 'A capacitor connected across the contacts soaks up that surge and stops the sparking.'
        write: 'Capacitor across the contacts → no spark'
      - section: 'The result'
        say: 'Now the current collapses fast, so a large e m f is induced in the secondary coil.'
        write: 'Fast collapse → large induced e.m.f. in the secondary'
      - section: 'Remember'
        say: 'A capacitor across the make and break means no sparks and a bigger output.'
        write: 'Capacitor ⇒ prevents sparks'
      - section: 'Answer'
        say: 'So capacitors are used in the induction coil to prevent electric sparks, which is option C.'
        write: '$\therefore$ to prevent electric sparks'
        answer: true
    traps:
      A: 'You went for control circuits. The make and break does the switching, not the capacitor.'
      B: 'You chose dissipate energy. The capacitor stores the surge only briefly. Its job is to stop sparks, not to waste energy.'
      D: 'You picked prevent distortion of electric fields. That is not what the capacitor in the coil is for. It is there to stop sparking.'
  38:
    moments:
      - section: 'The question'
        say: 'A one and a half volt cell pushes only zero point three amps through a one ohm resistor. Something inside the cell is holding the current back. How big is it?'
        write: 'Internal resistance $r = ?$'
      - section: 'The data'
        say: 'The e m f E is one point five volts, the external resistance R is one ohm, and the current I is zero point three amps.'
        write: '$E = 1.5$ V, $R = 1\ \Omega$, $I = 0.3$ A, $r = ?$'
      - section: 'The law'
        say: 'The e m f drives the current through the external and the internal resistance together. E equals I times R plus r.'
        write: '$E = I(R + r)$'
      - section: 'Substitute'
        say: 'Put in the numbers. One point five equals zero point three times one plus r.'
        write: '$1.5 = 0.3(1 + r)$'
      - say: 'Divide both sides by zero point three. One point five over zero point three is five.'
        write: '$1 + r = \dfrac{1.5}{0.3} = 5$'
      - say: 'Take away one from both sides. r equals four ohms.'
        write: '$r = 5 - 1 = 4\ \Omega$'
      - section: 'Check'
        say: 'Check. The lost volts are zero point three times four, which is one point two volts. That leaves zero point three volts across the one ohm resistor, and zero point three times one is zero point three. It checks.'
        write: '$0.3 \times 4 = 1.2$ V, $0.3 \times 1 = 0.3$ V, total $1.5$ V ✓'
      - section: 'Answer'
        say: 'So the internal resistance of the cell is four ohms, which is option A.'
        write: '$\therefore r = 4\ \Omega$'
        answer: true
    traps:
      B: 'You chose three ohms. That does not satisfy E equals I times R plus r. Check one point five over zero point three, which is five.'
      C: 'You picked one point five ohms. That uses the e m f as if it were a resistance.'
      D: 'You went for one ohm. That is only the external resistor. The internal resistance is what is left of the five ohm total.'
  39:
    moments:
      - section: 'The question'
        say: 'Many things conduct electricity, but only some of them obey Ohm''s law. Which one here does?'
        write: 'Which obeys Ohm''s law?'
      - section: 'The law'
        say: 'Ohm''s law says that at constant temperature, the current through a conductor is proportional to the potential difference across it.'
        write: '$V = IR$, with $R$ constant (constant temperature)'
      - section: 'The graph'
        say: 'An ohmic conductor gives a straight line graph of current against voltage, through the origin.'
        write: 'Ohmic: straight $I$-$V$ line through the origin'
      - section: 'Test each'
        say: 'Metals at a steady temperature give exactly that straight line. So metals are ohmic.'
        write: 'Metals → straight line ✓'
      - say: 'Electrolytes have a back e m f, so their line misses the origin. A diode conducts one way only. Glass is an insulator.'
        write: 'Electrolyte ✗, diode ✗, glass ✗'
      - section: 'An example'
        say: 'The copper wires in your house wiring are a good example of an ohmic conductor.'
        write: 'Copper house wiring'
      - section: 'Answer'
        say: 'So the one that obeys Ohm''s law is metals, which is option B.'
        write: '$\therefore$ metals'
        answer: true
    traps:
      A: 'You went for electrolytes. They do conduct, but their back e m f means the current is not in proportion to the voltage from zero.'
      C: 'You chose diode. A diode conducts in one direction only, and its graph is curved.'
      D: 'You picked glass. Glass is an insulator and carries almost no current at all.'
