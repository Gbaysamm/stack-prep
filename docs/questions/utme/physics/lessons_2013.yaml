# UTME 2013 Physics, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the Nigerian classroom way for Physics: the data with
# symbols and units, the law in words then written, any conversion to SI units in its own moment,
# the substitution one step per moment, the answer with its unit and a check, and the answer
# moment that names the option. traps gives one kind line for each wrong option.
#
#   say:    heard, not read. No symbols the voice would mangle; formulae read aloud, units in words.
#   write:  the one line written while it is said, with LaTeX between dollar signs.
#   answer: true on the moment that gives the answer.
#
# Keyed on question number, like explanations_2013.yaml. Answers match that file.
format_version: 1
exam_year: 2013
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'A brick travels from the earth all the way to the moon. It feels lighter up there, but has its mass really changed? Let us see.'
        write: 'Brick: earth → moon. Mass $= ?$'
      - section: 'The definition'
        say: 'Mass is the quantity of matter in a body. We measure it in kilograms, with a beam balance.'
        write: 'Mass = quantity of matter (kg), measured with a beam balance'
      - section: 'The reason'
        say: 'On the trip, no piece of the brick is added and no piece is taken away. So the quantity of matter stays the same.'
        write: 'No matter added, no matter removed → same mass'
      - section: 'Mass or weight'
        say: 'What changes is the weight. Weight equals m g, and g on the moon is about one sixth of g on the earth.'
        write: '$W = mg$,  $g_{\text{moon}} \approx \tfrac{1}{6}\,g_{\text{earth}}$'
      - section: 'An example'
        say: 'A fifty kilogram bag of rice is still fifty kilograms of rice on the moon. It is only easier to lift.'
        write: '50 kg on earth = 50 kg on the moon, but weight is about one sixth'
      - section: 'Remember'
        say: 'So remember it this way. Mass goes with you everywhere, but weight depends on where you are.'
        write: 'Mass: same everywhere;  weight: depends on $g$'
      - section: 'Answer'
        say: 'The mass of the brick remains constant, which is option A.'
        write: '$\therefore$ the mass remains constant'
        answer: true
    traps:
      B: 'You went for reduces. The brick does feel lighter on the moon, but that is its weight falling, not its mass.'
      C: 'You chose increases. Nothing is added to the brick on its journey, so its mass cannot grow.'
      D: 'You picked becomes zero. Matter does not vanish on a trip, so the brick still has all its mass.'
  3:
    moments:
      - section: 'The question'
        say: 'Two forces at right angles add up to fifty newtons. One of them makes thirty degrees with the resultant. How big is that one? Watch out, because the other force is also among the options.'
        write: '$R = 50$ N, forces at $90^\circ$, $\theta = 30^\circ$ to $R$, $F = ?$'
      - section: 'The picture'
        say: 'Two perpendicular forces and their resultant make a right-angled triangle. The resultant is the hypotenuse.'
        write: 'Right-angled triangle, hypotenuse $= R = 50$ N'
      - section: 'The law'
        say: 'The force next to the thirty degree angle is the adjacent side. So the component at angle theta to R is R cos theta.'
        write: '$F = R\cos\theta$'
      - section: 'Substitute'
        say: 'Put in fifty newtons and thirty degrees. F equals fifty cos thirty.'
        write: '$F = 50\cos 30^\circ$'
      - say: 'Cos thirty is zero point eight six six. So F equals fifty times zero point eight six six.'
        write: '$F = 50 \times 0.866$'
      - say: 'That is forty-three point three newtons.'
        write: '$F = 43.3$ N'
      - section: 'Check'
        say: 'The other force is fifty sin thirty, which is twenty-five newtons. Forty-three point three squared plus twenty-five squared gives fifty squared. It checks.'
        write: '$\sqrt{43.3^{2} + 25^{2}} = 50$ N ✓'
      - section: 'Answer'
        say: 'So the force at thirty degrees to the resultant is forty-three point three newtons, which is option C.'
        write: '$\therefore F = 43.3$ N'
        answer: true
    traps:
      A: 'You went for one hundred newtons. That divides by sin thirty. A component can never be bigger than the resultant itself.'
      B: 'You chose fifty-seven point seven newtons. That divides fifty by cos thirty, but a component is always smaller than the resultant.'
      D: 'You picked twenty-five newtons. That is the other force, the one at sixty degrees to the resultant, found with sine instead of cosine.'
  4:
    moments:
      - section: 'The question'
        say: 'There are four pairs of quantities, and only one pair is scalar all through. One sneaky pair mixes a scalar with a vector.'
        write: 'Which pair is scalar only?'
      - section: 'The definitions'
        say: 'A scalar has size only. A vector has size and direction.'
        write: 'Scalar = size only;  vector = size + direction'
      - section: 'Test each pair'
        say: 'Volume and area have no direction. Two metres cubed of water in a tank is just two metres cubed. Both are scalars.'
        write: 'Volume, area → scalars ✓'
      - say: 'Momentum is m v, and it points the way the body moves. So the pair moment and momentum has a vector in it.'
        write: 'Momentum $= mv$ → vector ✗'
      - say: 'Displacement is a distance in a stated direction, so it is a vector.'
        write: 'Displacement → vector ✗'
      - say: 'Impulse is F t, and it points the way the force acts. So it is a vector too.'
        write: 'Impulse $= Ft$ → vector ✗'
      - section: 'Remember'
        say: 'Ask yourself, does it need a direction? If not, it is a scalar.'
        write: 'Needs a direction? → vector'
      - section: 'Answer'
        say: 'The pair that is scalar only is volume and area, which is option A.'
        write: '$\therefore$ volume and area'
        answer: true
    traps:
      B: 'You chose moment and momentum. Momentum is m v, which has a direction, so this pair has a vector in it.'
      C: 'You picked length and displacement. Length is a scalar, but displacement is a length in a stated direction, so it is a vector.'
      D: 'You went for impulse and time. Time is a scalar, but impulse points the way the force acts, so it is a vector.'
  5:
    moments:
      - section: 'The question'
        say: 'Double the length of a pendulum. Does the period double? Most students say yes, and that is the trap.'
        write: '$l_1 = 0.4$ m, $T_1 = 2$ s, $l_2 = 0.8$ m, $T_2 = ?$ (same $g$)'
      - section: 'The law'
        say: 'The period of a simple pendulum is T equals two pi root l over g.'
        write: '$T = 2\pi\sqrt{\dfrac{l}{g}}$'
      - say: 'At the same place g does not change, so T is proportional to the square root of l.'
        write: '$T \propto \sqrt{l}$  so  $\dfrac{T_2}{T_1} = \sqrt{\dfrac{l_2}{l_1}}$'
      - section: 'Substitute'
        say: 'Put in the numbers. T two over two equals the square root of zero point eight over zero point four.'
        write: '$\dfrac{T_2}{2} = \sqrt{\dfrac{0.8}{0.4}}$'
      - say: 'Zero point eight over zero point four is two. So T two over two equals root two.'
        write: '$\dfrac{T_2}{2} = \sqrt{2}$'
      - say: 'Multiply both sides by two. T two equals two root two seconds.'
        write: '$T_2 = 2\sqrt{2}$ s'
      - section: 'Check'
        say: 'Two root two is about two point eight three seconds. A longer pendulum swings more slowly, but not twice as slowly. That makes sense.'
        write: '$2\sqrt{2} \approx 2.83$ s, more than 2 s, less than 4 s ✓'
      - section: 'Answer'
        say: 'So the new period is two root two seconds, which is option C.'
        write: '$\therefore T_2 = 2\sqrt{2}$ s'
        answer: true
    traps:
      A: 'You went for eight seconds. That multiplies the period by four, as if it went with the square of the length. It goes with the square root.'
      B: 'You chose four seconds. Doubling the length does not double the period. It multiplies it by root two.'
      D: 'You picked root two seconds. That divides instead of multiplies, but a longer pendulum swings more slowly, so the period must grow.'
  6:
    moments:
      - section: 'The question'
        say: 'A train is moving at twenty metres per second and the brakes go on. How long until it stops?'
        write: 'Train braking to a halt, $t = ?$'
      - section: 'The data'
        say: 'The initial velocity u is twenty metres per second. It halts, so the final velocity v is zero. A deceleration of two means a equals minus two metres per second squared.'
        write: '$u = 20\ \text{m s}^{-1}$, $v = 0$, $a = -2\ \text{m s}^{-2}$, $t = ?$'
      - section: 'The law'
        say: 'The first equation of motion links these four. v equals u plus a t.'
        write: '$v = u + at$'
      - section: 'Substitute'
        say: 'Put in the numbers. Zero equals twenty plus minus two times t.'
        write: '$0 = 20 + (-2)t$'
      - say: 'Move the two t across. Two t equals twenty.'
        write: '$2t = 20$'
      - say: 'Divide both sides by two. t equals ten seconds.'
        write: '$t = 10$ s'
      - section: 'Check'
        say: 'Check. The train loses two metres per second every second. Twenty metres per second is all gone after ten seconds.'
        write: '$20 \div 2 = 10$ s ✓'
      - section: 'Answer'
        say: 'So the time to bring the train to a halt is ten seconds, which is option B.'
        write: '$\therefore t = 10$ s'
        answer: true
    traps:
      A: 'You went for five seconds. That divides twenty by two a, which is four, borrowing the two from v squared equals u squared plus two a s. The time is the speed divided by the deceleration.'
      C: 'You chose twenty seconds. That uses the speed itself as the time. Divide the speed by the deceleration.'
      D: 'You picked forty seconds. That multiplies twenty by two. Losing speed at two each second, twenty is gone in ten seconds.'
  7:
    moments:
      - section: 'The question'
        say: 'Have you felt lighter as a lift starts going down? Here a seventy kilogram man feels exactly that. How much weight does he seem to lose?'
        write: 'Lift going down, man feels lighter, loss in weight $= ?$'
      - section: 'The data'
        say: 'The mass m is seventy kilograms, the downward acceleration a is one point five metres per second squared, and g is ten metres per second squared.'
        write: '$m = 70$ kg, $a = 1.5\ \text{m s}^{-2}$ (down), $g = 10\ \text{m s}^{-2}$'
      - section: 'The law'
        say: 'By Newton''s second law, going down with acceleration a, the floor pushes up with R equals m times g minus a.'
        write: '$mg - R = ma$  so  $R = m(g - a)$'
      - section: 'True weight'
        say: 'His true weight is m g, seventy times ten, which is seven hundred newtons.'
        write: '$mg = 70 \times 10 = 700$ N'
      - section: 'Apparent weight'
        say: 'His apparent weight is seventy times ten minus one point five. That is seventy times eight point five, which is five hundred and ninety-five newtons.'
        write: '$R = 70 \times (10 - 1.5) = 70 \times 8.5 = 595$ N'
      - section: 'The loss'
        say: 'The apparent loss in weight is seven hundred minus five hundred and ninety-five, which is one hundred and five newtons.'
        write: 'Loss $= 700 - 595 = 105$ N'
      - section: 'Check'
        say: 'Check. The loss should be m a, seventy times one point five, which is one hundred and five newtons. It agrees.'
        write: '$ma = 70 \times 1.5 = 105$ N ✓'
      - section: 'Answer'
        say: 'So the apparent loss in weight is one hundred and five newtons, which is option D.'
        write: '$\therefore$ apparent loss in weight $= 105$ N'
        answer: true
    traps:
      A: 'You went for six hundred and eighty-six newtons. That is his true weight using g as nine point eight. It is not a loss at all.'
      B: 'You chose five hundred and ninety-five newtons. That is his apparent weight, what the scale reads. The question asks how much he seems to lose.'
      C: 'You picked five hundred and eighty-one newtons. That is the apparent weight worked out with g as nine point eight, still not the loss.'
  8:
    moments:
      - section: 'The question'
        say: 'Drop a cork in a liquid and it floats. How much of it sinks under the surface, and how much rides above?'
        write: 'Floating cork, fraction immersed $= ?$'
      - section: 'The data'
        say: 'The density of the cork is zero point two five times ten to the power three kilograms per metre cubed. The liquid is one point two five times ten to the power three kilograms per metre cubed.'
        write: '$\rho_{\text{cork}} = 0.25 \times 10^{3}$, $\rho_{\text{liquid}} = 1.25 \times 10^{3}\ \text{kg m}^{-3}$'
      - section: 'The law'
        say: 'The law of flotation says a floating body displaces its own weight of the liquid it floats in.'
        write: 'Law of flotation: weight of body = weight of liquid displaced'
      - say: 'From that law, the fraction immersed equals the density of the body over the density of the liquid.'
        write: 'Fraction immersed $= \dfrac{\rho_{\text{body}}}{\rho_{\text{liquid}}}$'
      - section: 'Substitute'
        say: 'Put in the densities. The ten to the power three cancels top and bottom.'
        write: '$= \dfrac{0.25 \times 10^{3}}{1.25 \times 10^{3}} = \dfrac{0.25}{1.25}$'
      - say: 'Zero point two five over one point two five is one fifth, which is zero point two.'
        write: '$= 0.2$'
      - section: 'Check'
        say: 'Check. Cork is much lighter than the liquid, so only a small part should be under. One fifth is under and four fifths are above. That fits.'
        write: '0.2 under, 0.8 above ✓'
      - section: 'Answer'
        say: 'So the fraction of the cork immersed is zero point two, which is option C.'
        write: '$\therefore$ fraction immersed $= 0.2$'
        answer: true
    traps:
      A: 'You went for zero point eight. That is the part of the cork above the surface. The question asks for the part under it.'
      B: 'You chose zero point five. Half under would need the cork to be half as dense as the liquid, but it is only one fifth as dense.'
      D: 'You picked zero point one. That halves the right ratio. Zero point two five over one point two five is zero point two.'
  9:
    moments:
      - section: 'The question'
        say: 'A body moves at five metres per second. How high must the same body sit to store the same energy? Let us match the two energies.'
        write: 'P.E. at height $h$ = K.E. at $5\ \text{m s}^{-1}$'
      - section: 'The data'
        say: 'The speed v is five metres per second, the mass m is the same for both, and g is ten metres per second squared.'
        write: '$v = 5\ \text{m s}^{-1}$, same $m$, $g = 10\ \text{m s}^{-2}$, $h = ?$'
      - section: 'The law'
        say: 'Potential energy is m g h. Kinetic energy is half m v squared. We set them equal.'
        write: '$mgh = \tfrac{1}{2}mv^{2}$'
      - say: 'The mass appears on both sides, so it cancels. Then h equals v squared over two g.'
        write: '$h = \dfrac{v^{2}}{2g}$'
      - section: 'Substitute'
        say: 'Put in the numbers. h equals five squared over two times ten.'
        write: '$h = \dfrac{5^{2}}{2 \times 10}$'
      - say: 'Five squared is twenty-five, and two times ten is twenty. So h equals twenty-five over twenty.'
        write: '$h = \dfrac{25}{20}$'
      - say: 'That is one point two five metres, which is one point three metres to one decimal place.'
        write: '$h = 1.25$ m $\approx 1.3$ m'
      - section: 'Check'
        say: 'Check. A stone dropped from about one metre hits the ground at about five metres per second. So a little over one metre is right.'
        write: '$\sqrt{2 \times 10 \times 1.25} = 5\ \text{m s}^{-1}$ ✓'
      - section: 'Answer'
        say: 'So the height is about one point three metres, which is option C.'
        write: '$\therefore h \approx 1.3$ m'
        answer: true
    traps:
      A: 'You went for twenty-five metres. That stops at v squared and forgets to divide by two g.'
      B: 'You chose twenty metres. That would need a speed of twenty metres per second, not five.'
      D: 'You picked one metre. One point two five rounds to one point three to one decimal place, not down to one.'
  10:
    moments:
      - section: 'The question'
        say: 'A borehole pump lifts five thousand kilograms of water up sixty metres in fifteen minutes. How powerful is it? The minutes are the trap.'
        write: 'Pump lifts water, power $P = ?$'
      - section: 'The data'
        say: 'The mass m is five thousand kilograms, the height h is sixty metres, the time t is fifteen minutes, and g is ten metres per second squared.'
        write: '$m = 5000$ kg, $h = 60$ m, $t = 15$ min, $g = 10\ \text{m s}^{-2}$'
      - section: 'The law'
        say: 'Power is the rate of doing work. P equals work over time, and the work against gravity is m g h.'
        write: '$P = \dfrac{W}{t} = \dfrac{mgh}{t}$'
      - section: 'Convert to SI'
        say: 'Time must be in seconds. Fifteen minutes times sixty is nine hundred seconds.'
        write: '$t = 15 \times 60 = 900$ s'
      - section: 'Substitute'
        say: 'First the work. Five thousand times ten times sixty is three times ten to the power six joules.'
        write: '$W = 5000 \times 10 \times 60 = 3.0 \times 10^{6}$ J'
      - say: 'Now divide by nine hundred seconds. That gives about three thousand three hundred and thirty-three joules per second.'
        write: '$P = \dfrac{3.0 \times 10^{6}}{900} = 3333\ \text{J s}^{-1}$'
      - say: 'In standard form, that is three point three times ten to the power three joules per second.'
        write: '$P = 3.3 \times 10^{3}\ \text{J s}^{-1}$'
      - section: 'Check'
        say: 'Check. That is about three point three kilowatts, the size of a real borehole pump. A joule per second is a watt, so the unit is right.'
        write: '$3.3 \times 10^{3}$ W $\approx 3.3$ kW ✓'
      - section: 'Answer'
        say: 'So the power of the pump is three point three times ten to the power three joules per second, which is option C.'
        write: '$\therefore P = 3.3 \times 10^{3}\ \text{J s}^{-1}$'
        answer: true
    traps:
      A: 'You went for two point five times ten to the power five. That is far too big. At that power the work would be done in only twelve seconds, but the pump takes nine hundred.'
      B: 'You chose two point five times ten to the power four. That is too big. At that power the work would be done in only one hundred and twenty seconds, but the pump takes nine hundred.'
      D: 'You picked three point three times ten to the power two. That leaves out g and uses the mass instead of the weight. Five thousand times sixty over nine hundred is only three hundred and thirty-three.'
  11:
    moments:
      - section: 'The question'
        say: 'Imagine a surface so smooth that nothing grips it at all. What is its coefficient of friction?'
        write: 'Perfectly smooth surfaces, $\mu = ?$'
      - section: 'The definition'
        say: 'The coefficient of friction mu is the friction force F divided by the normal reaction R.'
        write: '$\mu = \dfrac{F}{R}$'
      - section: 'The reason'
        say: 'A perfectly smooth surface is one that gives no friction at all. So the friction force F is zero.'
        write: 'Perfectly smooth → $F = 0$'
      - section: 'Substitute'
        say: 'Then mu equals zero over R, which is zero.'
        write: '$\mu = \dfrac{0}{R} = 0$'
      - section: 'An example'
        say: 'A wet, soapy bathroom floor comes close. Your feet slide because there is almost no friction to hold them.'
        write: 'Soapy floor: $\mu$ very small'
      - section: 'Remember'
        say: 'Rough means a big mu. Perfectly smooth means mu is zero.'
        write: 'Rough → large $\mu$;  perfectly smooth → $\mu = 0$'
      - section: 'Answer'
        say: 'So the coefficient of friction between perfectly smooth surfaces is zero, which is option D.'
        write: '$\therefore \mu = 0$'
        answer: true
    traps:
      A: 'You went for infinity. Infinite friction would mean nothing could slide at all, which is the opposite of smooth.'
      B: 'You chose one. A mu of one is a rough surface, where friction equals the normal reaction.'
      C: 'You picked half. A mu of zero point five still means real friction. Perfectly smooth means none at all.'
  12:
    moments:
      - section: 'The question'
        say: 'A lever lifts one hundred and eighty newtons, and it is only ninety percent efficient. How much effort do we need?'
        write: 'Efficiency $= 90\%$, load $= 180$ N, effort arm $= 2 \times$ load arm, effort $= ?$'
      - section: 'The laws'
        say: 'For a lever, the velocity ratio is the effort arm over the load arm.'
        write: '$VR = \dfrac{\text{effort arm}}{\text{load arm}}$'
      - say: 'Efficiency is the mechanical advantage over the velocity ratio, and the mechanical advantage is load over effort.'
        write: 'Efficiency $= \dfrac{MA}{VR}$,  $MA = \dfrac{\text{load}}{\text{effort}}$'
      - section: 'Convert'
        say: 'Write ninety percent as a decimal. It is zero point nine.'
        write: '$90\% = 0.9$'
      - section: 'Substitute'
        say: 'The effort arm is twice the load arm, so the velocity ratio is two.'
        write: '$VR = 2$'
      - say: 'Then the mechanical advantage is zero point nine times two, which is one point eight.'
        write: '$MA = 0.9 \times 2 = 1.8$'
      - say: 'Effort equals load over mechanical advantage. One hundred and eighty over one point eight is one hundred newtons.'
        write: 'Effort $= \dfrac{180}{1.8} = 100$ N'
      - section: 'Check'
        say: 'Check. A perfect machine would need ninety newtons. Friction wastes some work, so we need a little more. One hundred newtons fits.'
        write: 'Ideal: $180 \div 2 = 90$ N;  real: a bit more, 100 N ✓'
      - section: 'Answer'
        say: 'So the effort is one hundred newtons, which is option C.'
        write: '$\therefore$ effort $= 100$ N'
        answer: true
    traps:
      A: 'You went for eighty newtons. That is less than the ninety newtons even a perfect machine needs, and a real machine always needs more.'
      B: 'You chose ninety newtons. That is the effort for a perfect machine. A ninety percent machine needs a little more.'
      D: 'You picked one hundred and twenty newtons. That would make the mechanical advantage one point five, but it is one point eight.'
  13:
    moments:
      - section: 'The question'
        say: 'A force of twenty newtons stretches a spring by fifty millimetres. How much work is done? Two traps wait here, a half and a unit.'
        write: 'Spring stretched, $W = ?$'
      - section: 'The data'
        say: 'The force F is twenty newtons, and the extension e is fifty millimetres.'
        write: '$F = 20$ N, $e = 50$ mm, $W = ?$'
      - section: 'The law'
        say: 'Within the elastic limit, the work done in stretching a spring is the area under the force extension line. That is half F e.'
        write: '$W = \tfrac{1}{2}Fe$'
      - section: 'Why the half'
        say: 'The force grows from zero up to twenty newtons, so on average it is only ten newtons.'
        write: 'Average force $= \tfrac{0 + 20}{2} = 10$ N'
      - section: 'Convert to SI'
        say: 'Change millimetres to metres. Fifty millimetres is zero point zero five metres.'
        write: '$e = 50\ \text{mm} = 0.05$ m'
      - section: 'Substitute'
        say: 'W equals half times twenty times zero point zero five.'
        write: '$W = \tfrac{1}{2} \times 20 \times 0.05$'
      - say: 'Half of twenty is ten, and ten times zero point zero five is zero point five joules.'
        write: '$W = 10 \times 0.05 = 0.5$ J'
      - section: 'Check'
        say: 'Check. A newton times a metre is a joule, so the unit is right. A small spring takes a small amount of work.'
        write: 'N × m = J ✓'
      - section: 'Answer'
        say: 'So the work done is zero point five joules, which is option A.'
        write: '$\therefore W = 0.5$ J'
        answer: true
    traps:
      B: 'You went for one point five joules. That is too big. Half times twenty times zero point zero five is zero point five, and even leaving out the half gives only one joule.'
      C: 'You chose two joules. That would need an extension of zero point two metres, but fifty millimetres is only zero point zero five metres.'
      D: 'You picked two point five joules. That is five times too big. Even leaving out the half gives only one joule.'
  14:
    moments:
      - section: 'The question'
        say: 'A diver goes down into the sea. How deep must she go before the water adds one whole atmosphere of pressure?'
        write: 'Depth for a pressure change of one atmosphere, $h = ?$'
      - section: 'The data'
        say: 'The pressure p is one point zero one times ten to the power five newtons per metre squared. The density rho is one point zero three times ten to the power three kilograms per metre cubed, and g is ten.'
        write: '$p = 1.01 \times 10^{5}\ \text{N m}^{-2}$, $\rho = 1.03 \times 10^{3}\ \text{kg m}^{-3}$, $g = 10\ \text{m s}^{-2}$'
      - section: 'The law'
        say: 'Pressure in a liquid rises with depth. p equals h rho g.'
        write: '$p = h\rho g$'
      - say: 'Make h the subject. h equals p over rho g.'
        write: '$h = \dfrac{p}{\rho g}$'
      - section: 'Substitute'
        say: 'Put in the numbers. The bottom line is one point zero three times ten to the power three, times ten, which is one point zero three times ten to the power four.'
        write: '$h = \dfrac{1.01 \times 10^{5}}{1.03 \times 10^{3} \times 10} = \dfrac{1.01 \times 10^{5}}{1.03 \times 10^{4}}$'
      - say: 'One point zero one over one point zero three is about zero point nine eight. Ten to the five over ten to the four is ten.'
        write: '$h \approx 0.98 \times 10$'
      - say: 'So h is about nine point eight metres, which is about ten metres.'
        write: '$h \approx 9.8$ m $\approx 10.0$ m'
      - section: 'Check'
        say: 'Check. Divers know that every ten metres down in the sea adds about one more atmosphere. It agrees.'
        write: 'About 1 atm per 10 m of sea water ✓'
      - section: 'Answer'
        say: 'So the depth is about ten metres, which is option C.'
        write: '$\therefore h \approx 10.0$ m'
        answer: true
    traps:
      A: 'You went for zero point one metres. That is two powers of ten too small. Check the powers in the division.'
      B: 'You chose one metre. That is one power of ten too small. Ten to the five over ten to the four is ten.'
      D: 'You picked one hundred metres. That leaves g out of the bottom line, so the answer comes out ten times too big.'
  15:
    moments:
      - section: 'The question'
        say: 'We want some alcohol with the same mass as four point two metres cubed of petrol. Will we need more alcohol or less?'
        write: 'Same mass of alcohol and petrol, $V_a = ?$'
      - section: 'The data'
        say: 'The petrol volume is four point two metres cubed and its density is seven point two times ten to the power two kilograms per metre cubed. The alcohol density is eight point four times ten to the power two.'
        write: '$V_p = 4.2\ \text{m}^{3}$, $\rho_p = 7.2 \times 10^{2}$, $\rho_a = 8.4 \times 10^{2}\ \text{kg m}^{-3}$'
      - section: 'The law'
        say: 'Mass equals density times volume. Same mass means rho a V a equals rho p V p.'
        write: '$m = \rho V$  so  $\rho_a V_a = \rho_p V_p$'
      - section: 'Substitute'
        say: 'First the mass of petrol. Seven hundred and twenty times four point two is three thousand and twenty-four kilograms.'
        write: '$m = 720 \times 4.2 = 3024$ kg'
      - say: 'The alcohol must have the same mass. So its volume is three thousand and twenty-four over eight hundred and forty.'
        write: '$V_a = \dfrac{3024}{840}$'
      - say: 'That is three point six metres cubed.'
        write: '$V_a = 3.6\ \text{m}^{3}$'
      - section: 'Check'
        say: 'Check. This alcohol is denser than the petrol, so less of it gives the same mass. Three point six is less than four point two. Good.'
        write: '$\rho_a > \rho_p$ ⇒ $V_a < V_p$, $3.6 < 4.2$ ✓'
      - section: 'Answer'
        say: 'So the volume of alcohol is three point six metres cubed, which is option C.'
        write: '$\therefore V_a = 3.6\ \text{m}^{3}$'
        answer: true
    traps:
      A: 'You went for zero point eight metres cubed. That is far too small a volume and does not come from the densities.'
      B: 'You chose one point four metres cubed. That does not follow from equal masses. Find the mass of petrol first, then divide by eight hundred and forty.'
      D: 'You picked four point nine metres cubed. That uses the density ratio upside down and gives the denser liquid the bigger volume.'
  16:
    moments:
      - section: 'The question'
        say: 'A thermometer has no numbers on it yet. Its ice and steam points are four hundred millimetres apart. Where does twenty degrees Celsius go?'
        write: 'Ungraduated thermometer, length for 20 °C $= ?$'
      - section: 'The data'
        say: 'From the ice point at zero degrees to the steam point at one hundred degrees is four hundred millimetres. The temperature theta is twenty degrees Celsius.'
        write: '$l_{100} = 400$ mm (0 °C to 100 °C), $\theta = 20$ °C, $l_\theta = ?$'
      - section: 'The law'
        say: 'On a linear thermometer, the length above the ice point is in proportion to the temperature.'
        write: '$\dfrac{l_\theta}{l_{100}} = \dfrac{\theta}{100}$'
      - section: 'One degree'
        say: 'One hundred degrees take four hundred millimetres, so each degree takes four millimetres.'
        write: '$400 \div 100 = 4$ mm per degree'
      - section: 'Substitute'
        say: 'Put in twenty degrees. l theta equals twenty over one hundred, times four hundred.'
        write: '$l_\theta = \dfrac{20}{100} \times 400$'
      - say: 'Twenty over one hundred is one fifth, and one fifth of four hundred is eighty millimetres.'
        write: '$l_\theta = 80$ mm'
      - section: 'Check'
        say: 'Check. Twenty degrees at four millimetres each is eighty millimetres. It agrees.'
        write: '$20 \times 4 = 80$ mm ✓'
      - section: 'Answer'
        say: 'So twenty degrees Celsius is eighty millimetres above the ice point, which is option D.'
        write: '$\therefore l_\theta = 80$ mm'
        answer: true
    traps:
      A: 'You went for twenty millimetres. That takes each degree as one millimetre, but here each degree is four millimetres.'
      B: 'You chose thirty millimetres. That does not follow from four millimetres per degree.'
      C: 'You picked sixty millimetres. That uses three millimetres per degree instead of four.'
  17:
    moments:
      - section: 'The question'
        say: 'A long wire cools from thirty degrees down to minus ten degrees. Does it get longer or shorter, and by how much?'
        write: 'Wire cooled, new length $l = ?$'
      - section: 'The data'
        say: 'The original length is one hundred metres at thirty degrees Celsius. The linear expansivity alpha is two times ten to the power minus five per kelvin. The new temperature is minus ten degrees Celsius.'
        write: '$l_0 = 100.0$ m at 30 °C, $\alpha = 2 \times 10^{-5}\ \text{K}^{-1}$, new temperature $-10$ °C'
      - section: 'The law'
        say: 'Linear expansion says l equals l nought times one plus alpha delta theta.'
        write: '$l = l_0(1 + \alpha\Delta\theta)$'
      - section: 'The temperature change'
        say: 'The change is minus ten minus thirty, which is minus forty. A change of one degree Celsius is a change of one kelvin, so that is a fall of forty kelvin.'
        write: '$\Delta\theta = -10 - 30 = -40$ K'
      - section: 'Substitute'
        say: 'The change in length is l nought alpha delta theta. One hundred times two times ten to the power minus five, times minus forty.'
        write: '$\Delta l = 100 \times 2 \times 10^{-5} \times (-40)$'
      - say: 'That is minus zero point zero eight metres. The wire shrinks by eight centimetres.'
        write: '$\Delta l = -0.08$ m'
      - say: 'So the new length is one hundred minus zero point zero eight, which is ninety-nine point nine two metres.'
        write: '$l = 100.0 - 0.08 = 99.92$ m'
      - section: 'Check'
        say: 'Check. The wire cools, so it must get shorter. Ninety-nine point nine two is less than one hundred. Good.'
        write: 'Cooled ⇒ shorter, $99.92 < 100$ ✓'
      - section: 'Answer'
        say: 'So the length of the wire at minus ten degrees is ninety-nine point nine two metres, which is option D.'
        write: '$\therefore l = 99.92$ m'
        answer: true
    traps:
      A: 'You went for one hundred point zero eight metres. The size of the change is right, but you added it. A wire that cools contracts.'
      B: 'You chose one hundred point zero four metres. That takes the change as only twenty kelvin and adds it.'
      C: 'You picked ninety-nine point nine six metres. That takes the change as only twenty kelvin. From thirty down to minus ten is forty kelvin.'
  18:
    moments:
      - section: 'The question'
        say: 'A gas pushes outwards and doubles its volume, keeping the same pressure. How much work does it do?'
        write: 'Gas expands at constant pressure, $W = ?$'
      - section: 'The data'
        say: 'The pressure p is ten to the power five newtons per metre squared. The volume goes from zero point six to one point two metres cubed.'
        write: '$p = 10^{5}\ \text{N m}^{-2}$, $V_1 = 0.6\ \text{m}^{3}$, $V_2 = 1.2\ \text{m}^{3}$'
      - section: 'The law'
        say: 'Work done by a gas expanding at constant pressure is the pressure times the change in volume. W equals p delta V.'
        write: '$W = p\Delta V$'
      - section: 'The change in volume'
        say: 'Delta V is one point two minus zero point six, which is zero point six metres cubed.'
        write: '$\Delta V = 1.2 - 0.6 = 0.6\ \text{m}^{3}$'
      - section: 'Substitute'
        say: 'W equals ten to the power five times zero point six.'
        write: '$W = 10^{5} \times 0.6$'
      - say: 'Zero point six times ten to the five is six times ten to the four. So W is six times ten to the power four joules.'
        write: '$W = 6.0 \times 10^{4}$ J'
      - section: 'Check'
        say: 'Check the unit. Newtons per metre squared times metres cubed gives newton metres, which are joules. Good.'
        write: '$\text{N m}^{-2} \times \text{m}^{3} = \text{N m} = \text{J}$ ✓'
      - section: 'Answer'
        say: 'So the work done is six times ten to the power four joules, which is option D.'
        write: '$\therefore W = 6.0 \times 10^{4}$ J'
        answer: true
    traps:
      A: 'You went for seven times ten to the power six. Neither the number nor the power of ten fits p times delta V.'
      B: 'You chose six times ten to the power six. The digit is right, but it is two powers of ten too big.'
      C: 'You picked six times ten to the power five. That loses track of the power when multiplying by zero point six. Ten to the five times zero point six is six times ten to the four.'
  19:
    moments:
      - section: 'The question'
        say: 'Two liquids of the same mass get the same heat. X gets twice as hot as Y. Which one has the bigger specific heat capacity? Many students get this upside down.'
        write: '$m_X = m_Y$, $Q_X = Q_Y$, $\Delta\theta_X = 2\Delta\theta_Y$, $c_X : c_Y = ?$'
      - section: 'The law'
        say: 'The heat supplied is Q equals m c delta theta.'
        write: '$Q = mc\Delta\theta$'
      - say: 'Make c the subject. c equals Q over m delta theta.'
        write: '$c = \dfrac{Q}{m\Delta\theta}$'
      - section: 'The proportion'
        say: 'Q and m are the same for both, so c is proportional to one over delta theta.'
        write: '$c \propto \dfrac{1}{\Delta\theta}$'
      - section: 'Substitute'
        say: 'So c X over c Y equals delta theta Y over delta theta X. The rise in X is twice the rise in Y, so this is one over two.'
        write: '$\dfrac{c_X}{c_Y} = \dfrac{\Delta\theta_Y}{\Delta\theta_X} = \dfrac{\Delta\theta_Y}{2\Delta\theta_Y} = \dfrac{1}{2}$'
      - say: 'So the ratio of c X to c Y is one to two.'
        write: '$c_X : c_Y = 1 : 2$'
      - section: 'Check'
        say: 'Check. X warms up more because it needs less heat for each degree. A small specific heat capacity heats up fast, like the iron of a pot compared with the water inside.'
        write: 'Hotter liquid ⇒ smaller $c$ ✓'
      - section: 'Answer'
        say: 'So the ratio of the specific heat capacity of X to that of Y is one to two, which is option B.'
        write: '$\therefore c_X : c_Y = 1 : 2$'
        answer: true
    traps:
      A: 'You went for two to one. That turns the ratio upside down. The liquid that gets hotter has the smaller specific heat capacity.'
      C: 'You chose four to one. That squares the ratio and turns it upside down. The temperature rise appears only once in Q equals m c delta theta.'
      D: 'You picked one to four. That squares the ratio. c goes with one over delta theta, not one over delta theta squared.'
  20:
    moments:
      - section: 'The question'
        say: 'Mama adds salt to the pot, and the yam cooks a little quicker. Why should salt make any difference?'
        write: 'Why does food cook quicker in salt water?'
      - section: 'The fact'
        say: 'Dissolved substances, which we call impurities, raise the boiling point of water.'
        write: 'Impurities raise the boiling point'
      - section: 'The reason'
        say: 'A liquid boils when its saturated vapour pressure equals the pressure of the air above it.'
        write: 'Boils when s.v.p. = atmospheric pressure'
      - say: 'Dissolved salt lowers the vapour pressure of the water. So the water must get hotter, above one hundred degrees Celsius, before it boils.'
        write: 'Salt lowers s.v.p. → boils above 100 °C'
      - section: 'The effect'
        say: 'The food then sits in hotter water, so it cooks quicker.'
        write: 'Hotter water → faster cooking'
      - section: 'Remember'
        say: 'Remember it this way. Impurities raise the boiling point, and lower pressure lowers it.'
        write: 'Impurities ↑ boiling point;  lower pressure ↓ boiling point'
      - section: 'Answer'
        say: 'So food cooks quicker because of the effect of dissolved substances on the boiling point, which is option A.'
        write: '$\therefore$ dissolved substances raise the boiling point'
        answer: true
    traps:
      B: 'You chose atmospheric pressure. Pressure does change the boiling point, but both pots sit under the same air, so it cannot explain the difference.'
      C: 'You picked food nutrients. The nutrients in the food do not change how hot the boiling water gets.'
      D: 'You went for thermal conductivity. The food cooks faster because the water is hotter, not because it conducts better.'
  21:
    moments:
      - section: 'The question'
        say: 'Lift the lid off a pot of boiling rice and the steam can burn your hand worse than the water would. Both are at one hundred degrees. So why?'
        write: 'Steam at 100 °C vs boiling water at 100 °C'
      - section: 'The fact'
        say: 'Steam carries extra hidden energy, its latent heat of vaporisation. That is about two point two six million joules for every kilogram.'
        write: 'Latent heat of vaporisation $\approx 2.26 \times 10^{6}\ \text{J kg}^{-1}$'
      - section: 'The reason'
        say: 'When steam lands on the skin, it first condenses into water at one hundred degrees, and gives out all of that latent heat.'
        write: 'Steam → water at 100 °C, gives out latent heat'
      - say: 'Then that hot water cools down on the skin, and gives out still more heat.'
        write: 'Then water at 100 °C cools, gives out more heat'
      - section: 'Compare'
        say: 'Boiling water gives only the second part. So the same mass of steam delivers far more heat to the skin.'
        write: 'Steam: latent heat + cooling;  water: cooling only'
      - section: 'Remember'
        say: 'The temperature is the same, but steam brings its latent heat along. That is what makes the burn worse.'
        write: 'Same temperature, extra latent heat'
      - section: 'Answer'
        say: 'So steam does more damage because it has latent heat of vaporisation, which is option B.'
        write: '$\therefore$ steam has latent heat of vaporisation'
        answer: true
    traps:
      A: 'You went for the high specific heat capacity of water. That applies to the boiling water too, so it cannot explain why the steam is worse.'
      C: 'You chose a higher temperature. Steam from boiling water is at one hundred degrees, the same as the water. The difference is the latent heat.'
      D: 'You picked convection. The burn comes from the steam condensing on the skin and giving out its latent heat, not from convection.'
  22:
    moments:
      - section: 'The question'
        say: 'We boil water thirty metres below sea level, at the bottom of a deep mine. Will it boil at one hundred degrees?'
        write: 'Boiling point 30 m below sea level $= ?$'
      - section: 'The fact'
        say: 'A liquid boils when its saturated vapour pressure equals the pressure above it.'
        write: 'Boils when s.v.p. = pressure above'
      - section: 'The pressure'
        say: 'Below sea level there is more air piled above you, so the atmospheric pressure is higher than at sea level.'
        write: 'Below sea level → higher pressure'
      - section: 'The reason'
        say: 'The water must be heated more to raise its vapour pressure to this higher pressure. So it boils above one hundred degrees.'
        write: 'Higher pressure → boiling point above 100 °C'
      - section: 'An example'
        say: 'This is how a pressure cooker works. Up on the Obudu plateau the opposite happens, and water boils below one hundred degrees.'
        write: 'Pressure cooker ↑;  high mountain ↓'
      - section: 'Remember'
        say: 'Higher pressure means a higher boiling point, and lower pressure means a lower one.'
        write: 'Pressure ↑ ⇒ boiling point ↑'
      - section: 'Answer'
        say: 'So the boiling point will be more than one hundred degrees Celsius, which is option A.'
        write: '$\therefore$ boiling point $> 100$ °C'
        answer: true
    traps:
      B: 'You chose less than one hundred degrees. That happens up high, where the pressure is lower. Below sea level the pressure is higher.'
      C: 'You picked still one hundred degrees. Water boils at one hundred degrees only at standard atmospheric pressure, and here the pressure is higher.'
      D: 'You went for fluctuating. At a fixed place the pressure is steady, so the boiling point is steady too.'
  23:
    moments:
      - section: 'The question'
        say: 'Dip a very narrow glass tube in water and the water climbs up inside it. What pulls it up?'
        write: 'Liquid rises or falls in a narrow tube, why?'
      - section: 'The fact'
        say: 'The rise or fall of a liquid in a narrow tube is called capillarity, and it is caused by surface tension.'
        write: 'Capillarity is caused by surface tension'
      - section: 'The reason'
        say: 'Water wets glass, because adhesion to the glass is stronger than cohesion in the water. So surface tension pulls the water up the tube.'
        write: 'Water: adhesion > cohesion → rises'
      - say: 'Mercury does not wet glass, so surface tension pulls it down instead.'
        write: 'Mercury: cohesion > adhesion → falls'
      - section: 'An example'
        say: 'The same pull draws kerosene up the wick of a lantern, all the way to the flame.'
        write: 'Kerosene climbs a lantern wick'
      - section: 'Remember'
        say: 'When a liquid rises or falls in a narrow tube, think of surface tension.'
        write: 'Capillarity ⇒ surface tension'
      - section: 'Answer'
        say: 'So the rise or fall is because of the surface tension of the liquid, which is option B.'
        write: '$\therefore$ surface tension of the liquid'
        answer: true
    traps:
      A: 'You went for viscosity. Viscosity only resists flow. It does not make a liquid rise or fall.'
      C: 'You chose friction with the walls. Friction opposes motion, so it cannot pull the liquid up the tube.'
      D: 'You picked osmotic pressure. Osmosis needs a semi permeable membrane, and there is none in a glass tube.'
  24:
    moments:
      - section: 'The question'
        say: 'Leave a metal spoon in hot soup, and soon the handle is hot too. How did the heat travel along it?'
        write: 'Heat passed on by vibrating molecules, which method?'
      - section: 'The fact'
        say: 'Conduction is the transfer of heat from molecule to molecule by vibration, without the medium itself moving along.'
        write: 'Conduction = heat passed by vibration, medium stays in place'
      - section: 'The reason'
        say: 'The hotter molecules vibrate harder and pass their energy on to their neighbours, one after another.'
        write: 'Hot molecules vibrate → pass energy to neighbours'
      - section: 'Compare'
        say: 'In convection the heated fluid itself moves. Radiation needs no medium at all.'
        write: 'Convection: fluid moves;  radiation: no medium'
      - section: 'An example'
        say: 'That is why the spoon handle gets hot, while the spoon itself does not move anywhere.'
        write: 'Spoon in hot soup'
      - section: 'Remember'
        say: 'When particles stay in place and vibrate, that is conduction.'
        write: 'Vibrate in place ⇒ conduction'
      - section: 'Answer'
        say: 'So heat transfer by the vibration of the molecules is conduction, which is option B.'
        write: '$\therefore$ conduction'
        answer: true
    traps:
      A: 'You went for convection. Convection carries heat by the movement of the fluid itself, not by vibration in place.'
      C: 'You chose radiation. Radiation travels as electromagnetic waves and needs no medium at all.'
      D: 'You picked diffusion. Diffusion is the spreading of particles, not a method of heat transfer.'
  25:
    moments:
      - section: 'The question'
        say: 'Pluck a guitar string and a wave runs along it. What kind of wave is that?'
        write: 'Wave on a stretched string, which kind?'
      - section: 'The fact'
        say: 'A mechanical wave needs a material medium to travel through.'
        write: 'Mechanical wave: needs a material medium'
      - section: 'The reason'
        say: 'A wave on a stretched string is passed on by the string itself. Without the string there is no wave. So it is a mechanical wave.'
        write: 'String wave needs the string → mechanical'
      - section: 'Compare'
        say: 'Electromagnetic waves, including microwaves, need no medium. They can cross empty space.'
        write: 'Electromagnetic, microwaves: no medium needed'
      - section: 'An example'
        say: 'A guitar string, a sonometer wire, and a rope shaken in the compound all carry mechanical waves.'
        write: 'Guitar, sonometer, shaken rope'
      - section: 'Remember'
        say: 'If a wave needs something to travel through, it is mechanical.'
        write: 'Needs a medium ⇒ mechanical'
      - section: 'Answer'
        say: 'So a wave travelling through stretched strings is a mechanical wave, which is option C.'
        write: '$\therefore$ mechanical wave'
        answer: true
    traps:
      A: 'You went for electromagnetic wave. Electromagnetic waves need no medium, but a string wave cannot exist without the string.'
      B: 'You chose micro wave. Microwaves are electromagnetic waves, so they need no string at all.'
      D: 'You picked seismic wave. Seismic waves are mechanical too, but that name is kept for waves through the earth from earthquakes.'
  26:
    moments:
      - section: 'The question'
        say: 'A transverse wave and a longitudinal wave can share the same frequency and the same amplitude. So what truly tells them apart?'
        write: 'Transverse vs longitudinal, the essential difference?'
      - section: 'Transverse'
        say: 'In a transverse wave the particles vibrate at right angles to the direction the wave travels. Think of a rope shaken up and down.'
        write: 'Transverse: vibration ⟂ direction of travel'
      - section: 'Longitudinal'
        say: 'In a longitudinal wave the particles vibrate along the direction of travel. Think of a spring pushed and pulled along its length.'
        write: 'Longitudinal: vibration ∥ direction of travel'
      - section: 'The reason'
        say: 'Frequency, amplitude and period are set by the source, and can be the same for both kinds of wave.'
        write: 'Frequency, amplitude, period: set by the source'
      - section: 'Remember'
        say: 'Transverse goes across, longitudinal goes along. The difference is the direction of vibration.'
        write: 'Across vs along'
      - section: 'Check'
        say: 'Check. Sound is longitudinal and light is transverse, yet each can have any frequency. So frequency cannot be the difference.'
        write: 'Sound: longitudinal;  light: transverse ✓'
      - section: 'Answer'
        say: 'So they differ in the direction of vibration of the particles of the medium, which is option C.'
        write: '$\therefore$ direction of vibration of the particles'
        answer: true
    traps:
      A: 'You went for frequency. Both kinds of wave can have the same frequency, because the source sets it.'
      B: 'You chose amplitude. Both kinds of wave can have the same amplitude.'
      D: 'You picked period. The period is set by the source and can be the same for both waves.'
  27:
    moments:
      - section: 'The question'
        say: 'Sound runs at three hundred and forty metres per second at zero degrees. Heat the air to one hundred degrees. How fast now? The temperature scale is the trap.'
        write: 'Speed of sound at 100 °C $= ?$'
      - section: 'The data'
        say: 'v one is three hundred and forty metres per second at zero degrees Celsius. The new temperature is one hundred degrees Celsius.'
        write: '$v_1 = 340\ \text{m s}^{-1}$ at 0 °C, $\theta_2 = 100$ °C, $v_2 = ?$'
      - section: 'The law'
        say: 'The speed of sound in a gas is proportional to the square root of the absolute temperature. v two over v one equals the square root of T two over T one.'
        write: '$\dfrac{v_2}{v_1} = \sqrt{\dfrac{T_2}{T_1}}$'
      - section: 'Convert to kelvin'
        say: 'Add two hundred and seventy-three. Zero degrees Celsius is two hundred and seventy-three kelvin.'
        write: '$T_1 = 0 + 273 = 273$ K'
      - say: 'And one hundred degrees Celsius is three hundred and seventy-three kelvin.'
        write: '$T_2 = 100 + 273 = 373$ K'
      - section: 'Substitute'
        say: 'v two equals three hundred and forty times the square root of three seventy-three over two seventy-three.'
        write: '$v_2 = 340\sqrt{\dfrac{373}{273}}$'
      - say: 'The square root works out to one point one six nine.'
        write: '$v_2 = 340 \times 1.169$'
      - say: 'Three hundred and forty times one point one six nine is about three hundred and ninety-seven metres per second.'
        write: '$v_2 = 397\ \text{m s}^{-1}$'
      - section: 'Check'
        say: 'Check. Hotter air carries sound faster, but only a little faster, because the speed goes with a square root. Three ninety-seven is a modest rise. Good.'
        write: '$397 > 340$, a modest rise ✓'
      - section: 'Answer'
        say: 'So the speed of sound at one hundred degrees Celsius is three hundred and ninety-seven metres per second, which is option C.'
        write: '$\therefore v_2 = 397\ \text{m s}^{-1}$'
        answer: true
    traps:
      A: 'You went for four hundred and ninety-seven. That is too big. The speed rises only by a factor of one point one six nine.'
      B: 'You chose four hundred and forty. That is still too big, and would need a much larger rise in temperature.'
      D: 'You picked two hundred and forty. Sound speeds up in hotter air, so the answer must be above three hundred and forty.'
  28:
    moments:
      - section: 'The question'
        say: 'A sonometer string gives four hundred and fifty hertz as its fundamental. What is its fifth overtone? Counting overtones is the trap.'
        write: '$f_0 = 450$ Hz, fifth overtone $= ?$'
      - section: 'The law'
        say: 'A string fixed at both ends gives every harmonic. The n th harmonic is n times the fundamental.'
        write: '$f_n = nf_0$'
      - section: 'Counting overtones'
        say: 'The fundamental is the first harmonic. The first overtone is the second harmonic.'
        write: 'Fundamental = 1st harmonic;  1st overtone = 2nd harmonic'
      - say: 'So each overtone is one step ahead. The fifth overtone is the sixth harmonic.'
        write: '5th overtone = 6th harmonic'
      - section: 'Substitute'
        say: 'f equals six times four hundred and fifty.'
        write: '$f = 6 \times 450$'
      - say: 'That is two thousand seven hundred hertz.'
        write: '$f = 2700$ Hz'
      - section: 'Check'
        say: 'Check. Overtones are higher than the fundamental, and this one is six times higher. It makes sense.'
        write: '$2700 = 6 \times 450$ ✓'
      - section: 'Answer'
        say: 'So the fifth overtone is two thousand seven hundred hertz, which is option A.'
        write: '$\therefore f = 2700$ Hz'
        answer: true
    traps:
      B: 'You chose four hundred and fifty-six hertz. That adds six to the fundamental instead of multiplying by six.'
      C: 'You picked forty-four hertz. Overtones are higher than the fundamental, never lower.'
      D: 'You went for seventy-five hertz. That divides four hundred and fifty by six. Overtones are multiples, not fractions.'
  29:
    moments:
      - section: 'The question'
        say: 'A man stands in front of a pinhole camera, and a tiny upside down picture of him appears on the screen. How tall is it?'
        write: 'Pinhole camera, image height $h_i = ?$'
      - section: 'The data'
        say: 'The man is one point five metres tall and three metres from the hole. The screen is zero point one metres behind the hole.'
        write: '$h_o = 1.5$ m, $u = 3$ m, $v = 0.1$ m, $h_i = ?$'
      - section: 'The law'
        say: 'Rays through the pinhole make two similar triangles. So the magnification, image height over object height, equals image distance over object distance.'
        write: '$m = \dfrac{h_i}{h_o} = \dfrac{v}{u}$'
      - section: 'Substitute'
        say: 'Make h i the subject. h i equals one point five times zero point one over three.'
        write: '$h_i = 1.5 \times \dfrac{0.1}{3}$'
      - say: 'One point five times zero point one is zero point one five.'
        write: '$h_i = \dfrac{0.15}{3}$'
      - say: 'Zero point one five over three is zero point zero five metres.'
        write: '$h_i = 0.05$ m'
