  30:
    moments:
      - section: 'The question'
        say: 'A ray of light passes through the centre of curvature of a concave mirror. At what angle does it reflect?'
        write: 'Ray through C of a concave mirror, angle of reflection $= ?$'
      - section: 'The fact'
        say: 'Every line from the centre of curvature to the mirror is a radius, and a radius meets the mirror along the normal.'
        write: 'Line from C to the mirror = radius = normal'
      - section: 'Angle of incidence'
        say: 'So a ray through C strikes the mirror along the normal. Its angle of incidence is zero degrees.'
        write: '$i = 0^\circ$'
      - section: 'The law'
        say: 'The law of reflection says the angle of reflection equals the angle of incidence.'
        write: '$r = i$'
      - say: 'So the angle of reflection is also zero degrees, and the ray goes straight back along its own path.'
        write: '$r = 0^\circ$, ray returns along itself'
      - section: 'Remember'
        say: 'Angles of reflection are always measured from the normal, not from the mirror.'
        write: 'Measure from the normal'
      - section: 'Answer'
        say: 'So the angle of reflection is zero degrees, which is option A.'
        write: '$\therefore r = 0^\circ$'
        answer: true
    traps:
      B: 'You chose forty-five degrees. A ray at forty-five degrees to the normal does not pass through the centre of curvature.'
      C: 'You picked ninety degrees. That would mean the ray grazes along the mirror surface.'
      D: 'You went for one hundred and eighty degrees. The ray does turn right round, but the angle of reflection is measured from the normal, and here it is zero.'
  31:
    moments:
      - section: 'The question'
        say: 'In the diagram, a ray in glass meets water and the refracted ray just grazes along the boundary. What is the angle of incidence? Many students use the wrong pair of media here.'
        write: 'Glass ($n = 1.52$) above, water ($n = 1.33$) below, $i = ?$'
      - section: 'The diagram'
        say: 'Look at the figure. The incident ray comes down through the glass at angle i to the dashed normal. The refracted ray runs along the boundary, at ninety degrees to the normal.'
        write: 'Refracted ray along the boundary → angle of refraction $= 90^\circ$'
      - section: 'The data'
        say: 'The refractive index of glass is one point five two, and of water one point three three.'
        write: '$n_g = 1.52$, $n_w = 1.33$, $r = 90^\circ$'
      - section: 'The law'
        say: 'When the angle of refraction is ninety degrees, the angle of incidence is the critical angle c.'
        write: '$i = c$ when $r = 90^\circ$'
      - say: 'Snell''s law says n g sin c equals n w sin ninety. Sin ninety is one, so sin c equals n w over n g.'
        write: '$n_g \sin c = n_w \sin 90^\circ$  so  $\sin c = \dfrac{n_w}{n_g}$'
      - section: 'Substitute'
        say: 'Sin c equals one point three three over one point five two, which is zero point eight seven five.'
        write: '$\sin c = \dfrac{1.33}{1.52} = 0.875$'
      - say: 'Take the inverse sine. c is about sixty-one degrees.'
        write: '$c = \sin^{-1} 0.875 = 61^\circ$'
      - section: 'Check'
        say: 'Check. Water bends light less than air does, so the critical angle from glass into water must be bigger than the forty-one degrees from glass into air. Sixty-one is bigger.'
        write: 'Glass to air: $41^\circ$;  glass to water: $61^\circ$ ✓'
      - section: 'Answer'
        say: 'So the incident angle is sixty-one degrees, which is option D.'
        write: '$\therefore i = 61^\circ$'
        answer: true
    traps:
      A: 'You went for forty-one degrees. That is the inverse sine of one over one point five two, the critical angle from glass into air. This glass sits on water.'
      B: 'You chose forty-nine degrees. That is the critical angle from water into air, not from glass into water.'
      C: 'You picked fifty-five degrees. That does not come from sin c equals one point three three over one point five two.'
  32:
    moments:
      - section: 'The question'
        say: 'Total internal reflection makes optical fibres work. But in one of these four journeys it can never happen. Which one?'
        write: 'Where can total internal reflection not occur?'
      - section: 'The condition'
        say: 'Total internal reflection needs light going from a denser medium into a less dense one, at an angle bigger than the critical angle.'
        write: 'Denser → less dense, and $i > c$'
      - section: 'The media'
        say: 'Glass, with n about one point five, is denser than water, with n about one point three three. Water is denser than air.'
        write: 'Glass ($\approx 1.5$) > water ($1.33$) > air ($1$)'
      - section: 'Test each'
        say: 'Water to air, glass to air and glass into water all go from denser to less dense. So all three can give total internal reflection.'
        write: 'Water→air ✓, glass→air ✓, glass→water ✓'
      - say: 'But water into glass goes into a denser medium. The light bends towards the normal, so there is no critical angle.'
        write: 'Water→glass: bends towards the normal ✗'
      - section: 'Remember'
        say: 'Total internal reflection only happens when light is trying to leave the denser medium.'
        write: 'Must leave the denser medium'
      - section: 'Answer'
        say: 'So total internal reflection will not occur from water into glass, which is option B.'
        write: '$\therefore$ water into glass'
        answer: true
    traps:
      A: 'You chose water to air. Water is denser than air, so total internal reflection can happen there.'
      C: 'You picked glass to air. That is the classic case, used in prisms and optical fibres.'
      D: 'You went for glass into water. Glass is denser than water, so it can happen, with a critical angle of about sixty-one degrees.'
  33:
    moments:
      - section: 'The question'
