        write: 'Microscope, final image at the near point → normal use'
      - section: 'Compare'
        say: 'A telescope in normal use sends its final rays out parallel, with the image at infinity. That is not what we see here.'
        write: 'Telescope, normal use: parallel rays out, image at infinity'
      - section: 'Answer'
        say: 'So the diagram represents a microscope in normal use, which is option B.'
        write: '$\therefore$ microscope in normal use'
        answer: true
    traps:
