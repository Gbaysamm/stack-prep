  20:
    moments:
      - section: 'The data'
        say: 'A glass bottle holds two times ten to the power four centimetres cubed. It is heated from twenty to fifty degrees Celsius. How big is it now? Most students forget one thing, and that is the trap.'
        write: '$V_{1} = 2 \times 10^{4}\ \text{cm}^{3}$,  $\alpha = 9 \times 10^{-6}\ \text{K}^{-1}$,  $20\ ^{\circ}\text{C} \to 50\ ^{\circ}\text{C}$,  $V_{2} = ?$'
      - section: 'The law'
        say: 'We are given the linear expansivity, alpha. But a volume grows in three directions, so the cubic expansivity, gamma, is three times alpha.'
        write: '$\gamma = 3\alpha$'
      - say: 'The increase in volume is the first volume times gamma times the rise in temperature.'
        write: '$\Delta V = V_{1}\gamma\Delta\theta$'
      - section: 'Units'
        say: 'A rise of thirty degrees Celsius is the same as a rise of thirty kelvin. And we keep centimetres cubed, because the options are in centimetres cubed.'
        write: '$\Delta\theta = 50 - 20 = 30\ ^{\circ}\text{C} = 30\ \text{K}$;  keep cm³'
      - section: 'Substitute'
        say: 'Gamma equals three times nine times ten to the power minus six, which is two point seven times ten to the power minus five per kelvin.'
        write: '$\gamma = 3 \times 9 \times 10^{-6} = 2.7 \times 10^{-5}\ \text{K}^{-1}$'
      - say: 'Delta V equals two times ten to the power four, times two point seven times ten to the power minus five, times thirty.'
        write: '$\Delta V = 2 \times 10^{4} \times 2.7 \times 10^{-5} \times 30$'
      - say: 'The first two give zero point five four, and zero point five four times thirty is sixteen point two centimetres cubed.'
        write: '$\Delta V = 0.54 \times 30 = 16.2\ \text{cm}^{3}$'
      - section: 'The new volume'
        say: 'Add the increase to the first volume. Twenty thousand plus sixteen point two is twenty thousand and sixteen point two centimetres cubed.'
        write: '$V_{2} = 20\,000 + 16.2 = 20\,016.2\ \text{cm}^{3}$'
      - section: 'Check'
        say: 'Check. Glass expands very little, so a growth of only sixteen centimetres cubed in twenty thousand makes sense.'
        write: 'small increase for glass ✓'
      - section: 'Answer'
        say: 'So the volume of the bottle at fifty degrees Celsius is twenty thousand and sixteen point two centimetres cubed, which is option A.'
        write: '$\therefore V_{2} = 20\,016.2\ \text{cm}^{3}$'
        answer: true
    traps:
      B: 'You went for twenty thousand and five point four. That uses alpha instead of three alpha. A volume change needs the cubic expansivity, three times alpha.'
      C: 'You chose twenty thousand and eight point one. That increase is only half the true one, and it would need one and a half times alpha. For a solid, the cubic expansivity is three times alpha.'
      D: 'You picked twenty thousand and thirteen point five. That increase is too small, and it would need two and a half times alpha. The cubic expansivity is three times alpha.'
  21:
    moments:
      - section: 'The question'
        say: 'P to the power a, V to the power b, T to the power c, equals a constant. Which powers turn this into Charles''s law?'
        write: '$P^{a}V^{b}T^{c} = \text{constant}$ → Charles''s law?'
      - section: 'The law'
        say: 'Charles''s law says that at constant pressure, the volume of a fixed mass of gas is directly proportional to its absolute temperature.'
        write: '$V \propto T$ at constant $P$'
      - say: 'So V over T equals a constant.'
        write: '$\dfrac{V}{T} = \text{constant}$'
      - section: 'Match the powers'
        say: 'Pressure does not appear, so its power is zero. A equals zero.'
        write: '$P^{0} = 1$ ⇒ $a = 0$'
      - say: 'Volume is on top to the power one. B equals one.'
        write: '$V^{1}$ ⇒ $b = 1$'
      - say: 'Temperature is at the bottom, and one over T is T to the power minus one. C equals minus one.'
        write: '$\dfrac{1}{T} = T^{-1}$ ⇒ $c = -1$'
      - section: 'Check'
        say: 'Check. P to the power zero, V to the power one, T to the power minus one gives V over T. It agrees.'
        write: '$P^{0}V^{1}T^{-1} = \dfrac{V}{T}$ ✓'
      - section: 'Answer'
        say: 'So a equals zero, b equals one and c equals minus one, which is option D.'
        write: '$\therefore a = 0$, $b = 1$, $c = -1$'
        answer: true
    traps:
      A: 'You went for a equals one, b equals one, c equals zero. That gives P V equals a constant, which is Boyle''s law, not Charles''s law.'
      B: 'You chose a equals one, b equals zero, c equals minus one. That gives P over T equals a constant, which is the pressure law.'
      C: 'You picked c equals one. That gives V times T equals a constant, which would mean the gas shrinks when heated. Temperature must be at the bottom.'
