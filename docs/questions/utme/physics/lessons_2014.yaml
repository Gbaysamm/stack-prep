# UTME 2014 Physics, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the Nigerian classroom way for Physics: the data with
# symbols and units, the law in words then written, any change to SI units as its own moment,
# the substitution one step per moment, the answer with its unit and a check, and the answer
# moment that names the option. traps gives one kind line for each wrong option.
#
#   say:    heard, not read. No symbols the voice would mangle; formulas read the way a Nigerian
#           teacher reads them, numbers and units in words.
#   write:  the one line written while it is said, LaTeX between single dollar signs.
#   answer: true on the moment that gives the answer.
#
# Keyed on question number, like explanations_2014.yaml. Answers match that file.
format_version: 1
exam_year: 2014
lessons:
  2:
    moments:
      - section: 'The question'
        say: 'You measure your desk with a metre rule. How far out could your reading be? Many students give the smallest mark itself, and that is the trap.'
        write: 'Least possible error of a metre rule $= ?$'
      - section: 'The scale'
        say: 'Look closely at a metre rule. The smallest gap between two marks is one millimetre.'
        write: 'smallest division of a metre rule $= 1\ \text{mm}$'
      - section: 'The rule'
        say: 'The least possible error of a scale is half of its smallest division.'
        write: 'least error $= \tfrac{1}{2} \times$ smallest division'
      - section: 'The reason'
        say: 'When you read the rule, you pick the nearest mark. So your reading can be out by at most half a mark, either way.'
        write: 'reading to the nearest mark ⇒ out by at most half a mark'
      - section: 'The working'
        say: 'Half of one millimetre is zero point five millimetres.'
        write: 'least error $= \dfrac{1\ \text{mm}}{2} = 0.5\ \text{mm}$'
      - section: 'Check'
        say: 'Check. If you read seventy-five point three centimetres for your desk, you can trust it only to about zero point zero five centimetres. That is zero point five millimetres. It agrees.'
        write: '75.3 cm $\pm$ 0.05 cm, that is $\pm\, 0.5\ \text{mm}$ ✓'
      - section: 'Answer'
        say: 'So the least possible error with a metre rule is zero point five millimetres, which is option C.'
        write: '$\therefore$ least error $= 0.5\ \text{mm}$'
        answer: true
    traps:
      A: 'You went for zero point one millimetres. That is the kind of fine reading a vernier caliper gives, not a metre rule.'
      B: 'You chose one millimetre. That is the smallest mark itself. The error in reading it is only half of that.'
      D: 'You picked zero point two millimetres. That does not come from the metre rule. Half of its one millimetre mark is zero point five.'
  3:
    moments:
      - section: 'The question'
        say: 'Some quantities need only a size. Others need a size and a direction. Which one here needs both?'
        write: 'magnitude and direction needed, which quantity?'
      - section: 'The rule'
        say: 'A vector quantity has magnitude, which is size, and direction. A scalar quantity has magnitude only.'
        write: 'vector = magnitude + direction;  scalar = magnitude only'
      - section: 'Test each one'
        say: 'Displacement is distance moved in a stated direction, like five hundred metres due north of the motor park. So it is a vector.'
        write: 'displacement, e.g. 500 m due north → vector'
      - say: 'Distance only says how far, like five hundred metres, with no direction. So it is a scalar.'
        write: 'distance, e.g. 500 m → scalar'
      - say: 'Temperature and mass have size only. Nobody says a bag of rice is fifty kilograms eastwards.'
        write: 'temperature, mass → scalars'
      - section: 'Remember'
        say: 'Remember it this way. Displacement has a direction, distance does not.'
        write: 'displacement = distance + direction'
      - section: 'Answer'
        say: 'So the quantity that needs magnitude and direction is displacement, which is option C.'
        write: '$\therefore$ displacement'
        answer: true
    traps:
      A: 'You went for temperature. Thirty degrees has a size but no direction, so temperature is a scalar.'
      B: 'You chose distance. It sounds like displacement, but distance has size only. It is displacement that carries a direction.'
      D: 'You picked mass. A bag of rice weighs fifty kilograms in no particular direction, so mass is a scalar.'
  4:
    moments:
      - section: 'The question'
        say: 'Four quantities, and we must pick out the vectors. Kinetic energy is the one that fools many students.'
        write: 'I. potential  II. torque  III. kinetic energy  IV. momentum, which are vectors?'
      - section: 'The rule'
        say: 'A vector has magnitude and direction. A scalar has magnitude only.'
        write: 'vector = magnitude + direction;  scalar = magnitude only'
      - section: 'Test each one'
        say: 'Torque, the moment of a force, turns a body clockwise or anticlockwise about an axis. It has a direction, so it is a vector.'
        write: 'II. torque, clockwise or anticlockwise → vector'
      - say: 'Momentum is mass times velocity, p equals m v. Velocity is a vector, so momentum is a vector too.'
        write: 'IV. momentum $p = mv$ → vector'
      - say: 'Electrical potential, measured in volts, has size only. So it is a scalar.'
        write: 'I. electrical potential (volts) → scalar'
      - say: 'Kinetic energy is half m v squared. Squaring the speed removes the direction, so kinetic energy is a scalar.'
        write: 'III. kinetic energy $\tfrac{1}{2}mv^{2}$ → scalar'
      - section: 'Check'
        say: 'Check. Torque and momentum both point somewhere. Potential and kinetic energy are just amounts.'
        write: 'vectors: II, IV;  scalars: I, III ✓'
      - section: 'Answer'
        say: 'So the vectors are two and four, torque and momentum, which is option A.'
        write: '$\therefore$ II and IV'
        answer: true
    traps:
      B: 'You went for one and two. Torque is a vector, but electrical potential is a scalar, with size only.'
      C: 'You chose one and three. Both of those are scalars. Potential and kinetic energy have size but no direction.'
      D: 'You picked two and three. Torque is right, but kinetic energy is a scalar, because squaring the speed removes the direction.'
  5:
    moments:
      - section: 'The question'
        say: 'Watch a danfo pull away from the bus stop. What are its wheels doing? There are two motions at once.'
        write: 'motion of the wheels of a moving car $= ?$'
      - section: 'The definitions'
        say: 'Translational motion is a whole body moving from one place to another.'
        write: 'translational = moving from place to place'
      - say: 'Rotational motion is a body spinning about an axis.'
        write: 'rotational = spinning about an axis'
      - section: 'The wheel'
        say: 'Each wheel spins round its axle. So it has rotational motion.'
        write: 'wheel spins round its axle → rotational'
      - say: 'At the same time the wheel travels down the road with the car. So it also has translational motion.'
        write: 'wheel moves along the road → translational'
      - section: 'Check'
        say: 'Check. A wheel does not swing to and fro like a pendulum, and it does not zigzag like a gas molecule. It spins and moves forward.'
        write: 'not oscillatory, not random ✓'
      - section: 'Answer'
        say: 'So the wheels have translational and rotational motion, which is option D.'
        write: '$\therefore$ translational and rotational'
        answer: true
    traps:
      A: 'You went for vibratory and translational. The wheel does move along, but its main motion is a spin, not a vibration.'
      B: 'You chose random and translational. Random motion is the zigzag of gas molecules, not a rolling wheel.'
      C: 'You picked rotational and oscillatory. The spin is right, but oscillation is a to and fro swing like a pendulum, and a wheel does not do that.'
  6:
    moments:
      - section: 'The question'
        say: 'Here is a velocity time graph, from M through N, S, P and down to Q. Where is the acceleration zero? Many students look at the peak, and that is the trap.'
        write: 'velocity-time graph M → N → S → P → Q;  where is $a = 0$?'
      - section: 'The rule'
        say: 'On a velocity time graph, acceleration is the gradient, the slope. Acceleration equals change in velocity over change in time.'
        write: '$a = \dfrac{\Delta v}{\Delta t}$ = gradient'
      - say: 'So zero acceleration means the velocity does not change. The line is level.'
        write: '$a = 0$ ⇒ $\Delta v = 0$ ⇒ horizontal line'
      - section: 'Read the graph'
        say: 'From M to N the line slopes up. The body is speeding up.'
        write: 'MN slopes up → $a > 0$'
      - say: 'From N to S the line is level. The velocity stays the same.'
        write: 'NS level → $a = 0$'
      - say: 'From S to P the line rises more steeply, and from P to Q it falls back to rest.'
        write: 'SP steep up → $a > 0$;  PQ down → $a < 0$'
      - section: 'Check'
        say: 'Check. The speed is greatest at P, but a big speed is not zero acceleration. Only the level part has zero slope.'
        write: 'slope, not height, gives acceleration ✓'
      - section: 'Answer'
        say: 'So the region of zero acceleration is N S, which is option B.'
        write: '$\therefore$ NS'
        answer: true
    traps:
      A: 'You went for M N. That part slopes upwards, so the body is speeding up there.'
      C: 'You chose S P. That part rises steeply, so the acceleration there is large, not zero.'
      D: 'You picked P Q. That part slopes down, so the body is slowing down, which is a deceleration.'
  7:
    moments:
      - section: 'The data'
        say: 'A car starts from rest and speeds up at three metres per second squared. After twenty-four metres, how fast is it going?'
        write: '$u = 0$,  $a = 3\ \text{m s}^{-2}$,  $s = 24\ \text{m}$,  $v = ?$'
      - section: 'The law'
        say: 'No time is given. So we use the equation of motion that links v, u, a and s. V squared equals u squared plus two a s.'
        write: '$v^{2} = u^{2} + 2as$'
      - section: 'Units'
        say: 'Metres per second squared and metres are already SI units, so nothing needs changing.'
        write: 'units already SI ✓'
      - section: 'Substitute'
        say: 'Put in the numbers. V squared equals zero squared plus two times three times twenty-four.'
        write: '$v^{2} = 0^{2} + 2 \times 3 \times 24$'
      - say: 'Two times three is six, and six times twenty-four is one hundred and forty-four.'
        write: '$v^{2} = 144$'
      - say: 'Now take the square root. The square root of one hundred and forty-four is twelve.'
        write: '$v = \sqrt{144} = 12\ \text{m s}^{-1}$'
      - section: 'Check'
        say: 'Check. Gaining three metres per second each second, the car covers twenty-four metres in four seconds. Three times four is twelve. It agrees.'
        write: '$s = \tfrac{1}{2}(3)(4^{2}) = 24$ m,  $v = 3 \times 4 = 12$ ✓'
      - section: 'Answer'
        say: 'So the velocity is twelve metres per second, which is option A.'
        write: '$\therefore v = 12\ \text{m s}^{-1}$'
        answer: true
    traps:
      B: 'You went for one hundred and forty-four. That is v squared. One more step, take the square root, and you get twelve.'
      C: 'You chose seventy-two. That is a times s, which is not an equation of motion. Use v squared equals u squared plus two a s.'
      D: 'You picked thirty-six. That is a times s divided by two, which is not an equation of motion. Use v squared equals u squared plus two a s.'
  8:
    moments:
      - section: 'The data'
        say: 'How fast must a satellite be launched to leave the earth for good? We are given the radius of the earth and g.'
        write: '$R = 6.4 \times 10^{6}\ \text{m}$,  $g = 10\ \text{m s}^{-2}$,  $v_{e} = ?$'
      - section: 'The law'
        say: 'Escape velocity is the least launch speed that lets a body escape the earth''s gravitational field. V e equals the square root of two g R.'
        write: '$v_{e} = \sqrt{2gR}$'
      - section: 'Substitute'
        say: 'Put in the numbers. The square root of two times ten times six point four times ten to the power six.'
        write: '$v_{e} = \sqrt{2 \times 10 \times 6.4 \times 10^{6}}$'
      - say: 'Two times ten is twenty, and twenty times six point four is one hundred and twenty-eight. That gives one point two eight times ten to the power eight under the root.'
        write: '$v_{e} = \sqrt{1.28 \times 10^{8}}$'
      - say: 'The square root is one point one three times ten to the power four metres per second.'
        write: '$v_{e} = 1.13 \times 10^{4}\ \text{m s}^{-1}$'
      - section: 'Convert'
        say: 'The options are in kilometres per second. Divide by one thousand, and we get eleven point three kilometres per second.'
        write: '$1.13 \times 10^{4}\ \text{m s}^{-1} \div 1000 = 11.3\ \text{km s}^{-1}$'
      - section: 'Check'
        say: 'Check. The escape speed of the earth is well known to be about eleven kilometres per second. It agrees.'
        write: 'about 11 km s⁻¹ ✓'
      - section: 'Answer'
        say: 'So the escape velocity is eleven point three kilometres per second, which is option D.'
        write: '$\therefore v_{e} = 11.3\ \text{km s}^{-1}$'
        answer: true
    traps:
      A: 'You went for twenty-five point three kilometres per second. That is more than twice the value from the square root of two g R.'
      B: 'You chose four point two kilometres per second. That is far below even the speed needed to orbit, about eight. Escape needs more.'
      C: 'You picked four point zero kilometres per second. That is far below even orbital speed. Work out the square root of two g R.'
  9:
    moments:
      - section: 'The data'
        say: 'An object weighs eighty newtons on earth. On a planet the pull of gravity is only one third as strong. What does it weigh there?'
        write: '$W_{E} = 80\ \text{N}$,  $g_{P} = \tfrac{1}{3}g_{E}$,  $W_{P} = ?$'
      - section: 'The law'
        say: 'Weight equals mass times the acceleration due to gravity. W equals m g.'
        write: '$W = mg$'
      - say: 'The mass of a body is the same everywhere. So the weight changes in step with g.'
        write: 'm fixed ⇒ $W \propto g$'
      - section: 'Substitute'
        say: 'So the weight on the planet is eighty newtons times one third.'
        write: '$W_{P} = 80 \times \tfrac{1}{3}$'
      - say: 'Eighty divided by three is twenty-six point seven newtons, which is about twenty-seven newtons.'
        write: '$W_{P} = 26.7\ \text{N} \approx 27\ \text{N}$'
      - section: 'Check'
        say: 'Check. A weaker pull should give a smaller weight, and twenty-seven is about a third of eighty. Good.'
        write: '$27 \times 3 \approx 80$ ✓'
      - section: 'Answer'
        say: 'So the weight on the planet is approximately twenty-seven newtons, which is option C.'
        write: '$\therefore W_{P} \approx 27\ \text{N}$'
        answer: true
    traps:
      A: 'You went for forty-eight newtons. That is more than half of eighty, but the pull is only one third. Divide eighty by three.'
      B: 'You chose twelve newtons. That is far less than a third of eighty. Eighty divided by three is about twenty-seven.'
      D: 'You picked thirty-six newtons. That is not eighty divided by three. Only the weight changes, in step with g, and a third of eighty is about twenty-seven.'
  10:
    moments:
      - section: 'The question'
        say: 'Hang weights on a metre rule balanced on a knife edge. It stays still. What must the forces add up to?'
        write: 'parallel forces in equilibrium, vector sum $= ?$'
      - section: 'The conditions'
        say: 'A body acted on by parallel forces is in equilibrium when two things hold. First, the vector sum of the forces is zero.'
        write: '(1) $\sum F = 0$'
      - say: 'Second, the clockwise moments equal the anticlockwise moments about any point.'
        write: '(2) clockwise moments = anticlockwise moments'
      - section: 'The reason'
        say: 'If the forces did not add to zero, there would be a resultant force. By Newton''s second law, the body would then accelerate.'
        write: '$\sum F \neq 0$ ⇒ $F = ma$ ⇒ body accelerates'
      - section: 'An example'
        say: 'On the balanced metre rule, the upward push of the knife edge equals the total downward weight. Up and down cancel.'
        write: 'upward push = total weight ⇒ sum $= 0$'
      - section: 'Check'
        say: 'Check. A positive or a negative total is still a resultant force, so the rule would move. Only zero keeps it still.'
        write: 'positive or negative ⇒ moves;  zero ⇒ still ✓'
      - section: 'Answer'
        say: 'So the vector sum of the forces must be zero, which is option B.'
        write: '$\therefore \sum F = 0$'
        answer: true
    traps:
      A: 'You went for average. An average is not a condition of equilibrium. The forces must cancel out to zero.'
      C: 'You chose negative. A negative total is still a resultant force, so the body would accelerate.'
      D: 'You picked positive. Upward forces are positive, but they must cancel the downward ones. A positive total would make the body accelerate.'
  11:
    moments:
      - section: 'The question'
        say: 'A picture hangs from a nail by two strings. Three forces act on it, and it stays still. What is special about those three forces?'
        write: 'three coplanar, non-parallel forces in equilibrium'
      - section: 'The rule'
        say: 'When three coplanar non-parallel forces keep a body in equilibrium, their lines of action all pass through one point.'
        write: 'lines of action meet at one point (concurrent)'
      - section: 'The reason'
        say: 'Two of the forces meet at a point. If the third force missed that point, it would have a moment about it, and the body would turn.'
        write: 'third force off the point ⇒ moment ⇒ body turns'
      - section: 'The triangle of forces'
        say: 'The three forces can also be drawn head to tail to close a triangle, in both magnitude and direction.'
        write: 'triangle of forces, magnitude and direction'
      - section: 'An example'
        say: 'For the picture, the two string tensions and the weight all meet at one point under the nail.'
        write: '$T_{1}$, $T_{2}$ and $W$ meet at one point'
      - section: 'Check'
        say: 'Check. The forces are non-parallel, so their lines cannot be parallel. They must cross, and they cross at one point.'
        write: 'non-parallel ⇒ lines cross ✓'
      - section: 'Answer'
        say: 'So their lines of action meet at a point, which is option D.'
        write: '$\therefore$ lines of action meet at a point'
        answer: true
    traps:
      A: 'You went for parallel lines of action. The question says the forces are non-parallel, so their lines cannot be parallel.'
      B: 'You chose magnitude only. A force must be shown with both its size and its direction, not size alone.'
      C: 'You picked direction only. A force must be shown with both its direction and its size, not direction alone.'
  12:
    moments:
      - section: 'The data'
        say: 'A twenty kilogram object falls from ten metres. How much kinetic energy does it have just before it hits the ground?'
        write: '$m = 20\ \text{kg}$,  $h = 10\ \text{m}$,  $g = 10\ \text{m s}^{-2}$,  KE $= ?$'
      - section: 'The law'
        say: 'The law of conservation of energy says energy is not lost. As the object falls, the potential energy it loses becomes kinetic energy.'
        write: 'PE lost = KE gained'
      - say: 'So the kinetic energy at the ground equals m g h.'
        write: '$\text{KE} = mgh$'
      - section: 'Units'
        say: 'Kilograms, metres per second squared and metres are already SI units.'
        write: 'units already SI ✓'
      - section: 'Substitute'
        say: 'Put in the numbers. Twenty times ten times ten.'
        write: '$\text{KE} = 20 \times 10 \times 10$'
      - say: 'Twenty times ten is two hundred, and two hundred times ten is two thousand joules.'
        write: '$\text{KE} = 2000\ \text{J}$'
      - section: 'Check'
        say: 'Check. Kilogram times metre per second squared times metre is the joule, an energy. And two thousand joules for a heavy bag dropped from a storey building is sensible.'
        write: 'kg × m s⁻² × m = J ✓'
      - section: 'Answer'
        say: 'So the kinetic energy just before it hits the ground is two thousand joules, which is option C.'
        write: '$\therefore \text{KE} = 2000\ \text{J}$'
        answer: true
    traps:
      A: 'You went for two hundred joules. That is m g, the weight in newtons, which is a force. Multiply by the height too.'
      B: 'You chose four thousand joules. That finds v squared, two hundred, and then forgets the half in half m v squared. Twenty times two hundred, halved, is two thousand.'
      D: 'You picked five hundred joules. That is only a quarter of the two thousand joules of potential energy the object loses, and all of it becomes kinetic energy.'
  13:
    moments:
      - section: 'The question'
        say: 'Energy locked inside the nucleus comes out as heat in a nuclear reactor. What is that heat finally used to make?'
        write: 'nuclear energy → heat → ?'
      - section: 'The fact'
        say: 'In a nuclear power station, the heat from the nucleus is used to generate electrical energy.'
        write: 'nuclear heat → electrical energy'
      - section: 'How it works'
        say: 'The heat boils water into steam. The steam turns a turbine.'
        write: 'heat → steam → turbine turns'
      - say: 'The turbine drives a generator, and the generator sends electricity out on the wires.'
        write: 'turbine → generator → electricity'
      - section: 'An example'
        say: 'It works like a gas power station such as Egbin, but with a reactor in place of the furnace. France gets most of its electricity this way.'
        write: 'like a thermal power station, reactor instead of furnace'
      - section: 'Check'
        say: 'Check. The spinning turbine has kinetic and mechanical energy, but that is only a middle step. The station exists to make electricity.'
        write: 'kinetic, mechanical = middle steps;  product = electrical ✓'
      - section: 'Answer'
        say: 'So the heat is used to generate electrical energy, which is option C.'
        write: '$\therefore$ electrical energy'
        answer: true
    traps:
      A: 'You went for kinetic energy. The turbine does spin, but that is only a middle step on the way to electricity.'
      B: 'You chose mechanical energy. The turbine''s motion is only a middle step. What the station sends out is electrical energy.'
      D: 'You picked potential energy. The heat is not stored up. It is used straight away to make electricity.'
  14:
    moments:
      - section: 'The data'
        say: 'A machine lifts a one thousand newton load. Its efficiency is seventy-five percent and its velocity ratio is four. What effort is needed?'
        write: 'efficiency $= 75\%$,  $L = 1000\ \text{N}$,  $\text{VR} = 4$,  $E = ?$'
      - section: 'The law'
        say: 'Efficiency is mechanical advantage over velocity ratio, times one hundred percent.'
        write: '$\text{efficiency} = \dfrac{\text{MA}}{\text{VR}} \times 100\%$'
      - say: 'And mechanical advantage is load over effort.'
        write: '$\text{MA} = \dfrac{L}{E}$'
      - section: 'Find the MA'
        say: 'Seventy-five percent is zero point seven five. So M A equals zero point seven five times four, which is three.'
        write: '$\text{MA} = 0.75 \times 4 = 3$'
      - section: 'Find the effort'
        say: 'Effort equals load over M A. That is one thousand over three.'
        write: '$E = \dfrac{L}{\text{MA}} = \dfrac{1000}{3}$'
      - say: 'One thousand divided by three is three hundred and thirty-three point three three newtons.'
        write: '$E = 333.33\ \text{N}$'
      - section: 'Check'
        say: 'Check. With no friction the effort would be one thousand over four, which is two hundred and fifty newtons. A real machine needs more, and three hundred and thirty-three is more.'
        write: 'ideal effort $= 1000 \div 4 = 250\ \text{N} < 333.33\ \text{N}$ ✓'
      - section: 'Answer'
        say: 'So the effort is three hundred and thirty-three point three three newtons, which is option C.'
        write: '$\therefore E = 333.33\ \text{N}$'
        answer: true
    traps:
      A: 'You went for three hundred and forty-three point three three newtons. It looks close, but one thousand divided by three is three hundred and thirty-three point three three.'
      B: 'You chose two hundred and thirty-three point three three newtons. That is less than the ideal effort of two hundred and fifty, which no real machine can manage.'
      D: 'You picked three hundred and thirty-four point three three newtons. It is very close, but do the division carefully. One thousand over three is three hundred and thirty-three point three three.'
  15:
    moments:
      - section: 'The data'
        say: 'A wheel and axle lifts eight hundred newtons with an effort of two hundred and fifty newtons. The wheel radius is eight hundred millimetres and the axle radius is two hundred millimetres. How efficient is it?'
        write: '$L = 800\ \text{N}$,  $E = 250\ \text{N}$,  $R = 800\ \text{mm}$,  $r = 200\ \text{mm}$'
      - section: 'The law'
        say: 'For a wheel and axle, the velocity ratio is the wheel radius over the axle radius.'
        write: '$\text{VR} = \dfrac{R}{r}$'
      - say: 'Mechanical advantage is load over effort, and efficiency is M A over V R, times one hundred percent.'
        write: '$\text{MA} = \dfrac{L}{E}$,  $\text{efficiency} = \dfrac{\text{MA}}{\text{VR}} \times 100\%$'
      - section: 'Units'
        say: 'Both radii are in millimetres, and only their ratio counts. So we need not change them to metres.'
        write: 'ratio of radii, same unit, no conversion needed'
      - section: 'Substitute'
        say: 'V R equals eight hundred over two hundred, which is four.'
        write: '$\text{VR} = \dfrac{800}{200} = 4$'
      - say: 'M A equals eight hundred over two hundred and fifty, which is three point two.'
        write: '$\text{MA} = \dfrac{800}{250} = 3.2$'
      - say: 'Efficiency equals three point two over four, times one hundred, which is eighty percent.'
        write: '$\text{efficiency} = \dfrac{3.2}{4} \times 100\% = 80\%$'
      - section: 'Check'
        say: 'Check. Efficiency must be less than one hundred percent because of friction, and eighty percent is. Good.'
        write: '$80\% < 100\%$ ✓'
      - section: 'Answer'
        say: 'So the efficiency of the machine is eighty percent, which is option B.'
        write: '$\therefore$ efficiency $= 80\%$'
        answer: true
    traps:
      A: 'You went for ninety percent. That would need a mechanical advantage of three point six, but eight hundred over two hundred and fifty is three point two.'
      C: 'You chose eighty-five percent. That would need a mechanical advantage of three point four. Check the division of load by effort.'
      D: 'You picked eighty-seven percent. That would need a mechanical advantage of about three point five, but the load over the effort is three point two.'
  16:
    moments:
      - section: 'The data'
        say: 'A force of five hundred newtons pulls on a steel wire of cross-sectional area zero point two metres squared. What is the tensile stress?'
        write: '$F = 500\ \text{N}$,  $A = 0.2\ \text{m}^{2}$,  stress $= ?$'
      - section: 'The law'
        say: 'Tensile stress is force per unit cross-sectional area. Stress equals F over A.'
        write: '$\text{stress} = \dfrac{F}{A}$'
      - section: 'Units'
        say: 'Newtons and metres squared are already SI units.'
        write: 'units already SI ✓'
      - section: 'Substitute'
