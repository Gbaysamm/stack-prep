        write: '$2 + 2 + 2 = 6\ \mu\text{F}$'
      - section: 'The series chain'
        say: 'From one terminal to the other, charge passes the two microfarad, then the six microfarad group, then the three microfarad, one after another. So they are in series.'
        write: '$\dfrac{1}{C} = \dfrac{1}{2} + \dfrac{1}{6} + \dfrac{1}{3}$'
      - say: 'Over six, that is three sixths plus one sixth plus two sixths, which is six sixths, or one.'
