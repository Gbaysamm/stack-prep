      - section: 'The fact'
        say: 'The output characteristic of a transistor is a graph of collector current against collector emitter voltage, for a fixed base current.'
        write: '$I_{C}$ against $V_{CE}$, fixed $I_{B}$'
      - section: 'Its shape'
        say: 'As the voltage rises from zero, the current rises steeply at first.'
        write: 'small $V$ → $I$ rises steeply'
      - say: 'Then the current levels off and stays almost constant, because the base current sets it, not the voltage.'
        write: 'larger $V$ → $I$ almost constant'
      - section: 'Test each graph'
        say: 'Graph D shows exactly this, a steep rise from the origin bending over into an almost flat line.'
        write: 'D: steep rise, then levels off ✓'
      - say: 'Graph A, a straight line through the origin, is an ohmic conductor obeying Ohm''s law. Graph C, zero then rising, is like a diode.'
        write: 'A: ohmic conductor;  C: diode'
      - section: 'Check'
        say: 'Check. A straight line means the current keeps rising with voltage, but a transistor''s output current stops rising. So it must be the curve that flattens.'
        write: 'output current saturates ✓'
      - section: 'Answer'
        say: 'So the output characteristic of a transistor is graph D, which is option D.'
        write: '$\therefore$ graph D'
        answer: true
    traps:
      A: 'You went for graph A, the straight line through the origin. That is an ohmic conductor with constant resistance. A transistor''s output current levels off.'
      B: 'You chose graph B, the curve that dips and rises again. That is not the shape of a transistor''s output.'
      C: 'You picked graph C, zero up to a threshold and then rising. That is like a forward biased diode, not a transistor''s output.'
