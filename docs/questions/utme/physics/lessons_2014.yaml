      - section: 'The fact'
        say: 'A cell delivers the most power to an external resistor when the external resistance equals the internal resistance.'
        write: '$R = r$'
      - section: 'The reason'
        say: 'The power in R is E squared R over R plus r all squared.'
        write: '$P = \dfrac{E^{2}R}{(R + r)^{2}}$'
      - say: 'If R is very small, the current is big but there is little voltage across R. If R is very big, the current is tiny. The best balance is R equals r.'
        write: 'R small ⇒ small p.d.;  R large ⇒ small current'
      - say: 'At that point the maximum power is E squared over four r, and half of the energy is used up inside the cell.'
        write: '$P_{\max} = \dfrac{E^{2}}{4r}$'
      - section: 'An example'
        say: 'Sound engineers match a loudspeaker to its amplifier using this same idea.'
        write: 'matching a loudspeaker to an amplifier'
      - section: 'Check'
