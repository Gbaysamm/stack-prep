        write: '$R = 1$: $P = 1$ W;  $R = 2$: $P = \tfrac{8}{9}$ W ✓'
      - section: 'Answer'
        say: 'So maximum power is transferred when the external resistance is the same as the internal resistance, which is option B.'
        write: '$\therefore R = r$'
        answer: true
    traps:
