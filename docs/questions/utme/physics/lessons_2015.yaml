        say: 'The chain conducts static charge from the tanker down to the earth.'
        write: 'Chain conducts charge to earth'
      - section: 'The reason'
        say: 'As the tanker moves, friction with the air and the petrol sloshing inside build up static charge on the metal body.'
        write: 'Friction → static charge builds up'
      - say: 'If enough charge builds up, a spark could jump to the ground or to a person and set the petrol vapour on fire.'
        write: 'Too much charge → spark → fire'
      - say: 'The chain touches the road, so the charge leaks away safely, little by little.'
        write: 'Chain → charge leaks to earth safely'
      - section: 'An example'
        say: 'At petrol depots, tankers are earthed with a cable before loading, for the same reason.'
        write: 'Depots earth tankers before loading'
      - section: 'Answer'
        say: 'So the chain is there to conduct excess charges to the earth, which is option A.'
        write: '$\therefore$ conducts excess charges to earth'
        answer: true
    traps:
      B: 'You went for balance. A light chain has no effect on the balance of a heavy tanker.'
      C: 'You chose a speed warning. The chain does nothing to warn the driver about speed.'
      D: 'You picked friction. The chain does rub on the road, but its job is to conduct charge to the earth, not to add friction.'
