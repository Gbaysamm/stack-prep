      - section: 'Volume of ice'
        say: 'The volume of ice is four hundred and fifty over nine hundred, which is zero point five zero metres cubed.'
        write: '$V_{\text{ice}} = \dfrac{450}{900} = 0.50\ \text{m}^{3}$'
      - section: 'Volume of water'
        say: 'The volume of water is four hundred and fifty over one thousand, which is zero point four five metres cubed.'
        write: '$V_{\text{water}} = \dfrac{450}{1000} = 0.45\ \text{m}^{3}$'
      - section: 'The change'
        say: 'The change in volume is zero point five zero minus zero point four five, which is zero point zero five metres cubed.'
