  40:
    moments:
      - section: 'The question'
        say: 'A camera and your eye work in much the same way. In the camera, the film catches the picture. Which part of the eye does that job?'
        write: 'Camera film ↔ which part of the eye?'
      - section: 'The fact'
        say: 'The film of a camera matches the retina of the eye. Both are where the real, inverted image is formed and recorded.'
        write: 'Film ↔ retina'
      - section: 'The other matches'
        say: 'The camera lens matches the eye lens. The diaphragm matches the iris, which controls the size of the opening.'
        write: 'Lens ↔ lens;  diaphragm ↔ iris'
      - say: 'The aperture matches the pupil, which is the opening itself. The dark inside of the camera matches the black choroid.'
        write: 'Aperture ↔ pupil;  black inside ↔ choroid'
      - section: 'An example'
        say: 'In a phone camera today, a light sensor does the job of the film, just as the retina does in your eye.'
        write: 'Phone sensor ↔ film ↔ retina'
      - section: 'Remember'
        say: 'Remember it this way. The image lands on the film in a camera and on the retina in an eye.'
        write: 'Image lands on film, image lands on retina'
      - section: 'Answer'
        say: 'So the film of the camera functions as the retina, which is option C.'
        write: '$\therefore$ retina'
        answer: true
    traps:
      A: 'You went for the iris. The iris controls the size of the opening, like the camera diaphragm.'
      B: 'You chose the pupil. The pupil is the opening that lets light in, like the camera aperture, not the film.'
      D: 'You picked the cornea. The cornea is the clear front window that starts the focusing, not the screen where the image forms.'
