# UTME 2015 Physics, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the Nigerian classroom way for Physics: the data with
# symbols and units, the law in words then written, any conversion to SI units as its own moment,
# the substitution one step per moment, the answer with its unit and a check, and the answer
# moment that names the option. traps gives one kind line for each wrong option.
#
#   say:    heard, not read. Formulas written as formulas (the voice reads them letter by letter), units in words.
#   write:  the one line written while it is said, with LaTeX between dollar signs.
#   answer: true on the moment that gives the answer.
#
# Keyed on question number, like explanations_2015.yaml. Answers match that file.
format_version: 1
exam_year: 2015
lessons:
  1:
    moments:
      - section: 'The data'
        say: 'A piece of rubber ten centimetres long stretches six millimetres under a load of one hundred newtons. What is the strain? Watch the units, because that is where most students fall.'
        write: '$l = 10$ cm,  $e = 6$ mm,  load $= 100$ N,  strain $= ?$'
      - section: 'The rule'
        say: 'Strain is the extension divided by the original length. It is a length over a length, so it has no unit.'
        write: '$\text{strain} = \dfrac{e}{l}$  (no unit)'
      - section: 'Convert to metres'
        say: 'Put both lengths in the same unit, metres. Six millimetres is zero point zero zero six metres.'
        write: '$e = 6\ \text{mm} = 0.006\ \text{m}$'
      - say: 'And ten centimetres is zero point one zero metres.'
        write: '$l = 10\ \text{cm} = 0.10\ \text{m}$'
      - section: 'Substitute'
        say: 'Now strain equals zero point zero zero six over zero point one zero.'
        write: '$\text{strain} = \dfrac{0.006}{0.10}$'
      - say: 'That is zero point zero six, which is six times ten to the power minus two.'
        write: '$= 0.06 = 6 \times 10^{-2}$'
      - section: 'Check'
        say: 'Check. Six millimetres out of one hundred millimetres is six parts in a hundred. The one hundred newtons is not needed here, because it is for stress.'
        write: '6 mm out of 100 mm $= \dfrac{6}{100}$ ✓  (100 N is for stress)'
      - section: 'Answer'
        say: 'So the strain is six times ten to the power minus two, which is option A.'
        write: '$\therefore$ strain $= 6 \times 10^{-2}$'
        answer: true
    traps:
      B: 'You went for six. That is just the extension in millimetres. Strain divides the extension by the original length.'
      C: 'You chose sixty. That divides six millimetres by zero point one metres, which mixes two units. Put both lengths in metres first.'
      D: 'You picked six times ten to the power minus three. That turns ten centimetres into one thousand millimetres, but it is only one hundred. So the strain comes out ten times too small.'
  2:
    moments:
      - section: 'The question'
        say: 'We have two convex lenses, with parallel rays going in and parallel rays coming out. Which instrument is this? The rays that go in will tell us.'
        write: 'Two convex lenses, which instrument?'
      - section: 'The picture'
        say: 'Look at the diagram. Parallel rays from a very distant object enter the first lens, which is the objective.'
        write: 'Parallel rays in → objective lens'
      - say: 'The objective brings the rays to a focus at its focal point, f o behind it. That same point is the focal point of the eyepiece.'
        write: 'Rays meet at $F_o$, which is also $F_e$'
      - section: 'The rule'
        say: 'So the lenses are f o plus f e apart, and the rays leave the eyepiece parallel again. This is normal adjustment, with the final image at infinity.'
        write: 'Separation $= f_o + f_e$,  final image at infinity'
      - say: 'A long focus objective and a short focus eyepiece, set f o plus f e apart, make the astronomical telescope.'
        write: 'Long $f_o$, short $f_e$, apart by $f_o + f_e$ ⇒ astronomical telescope'
      - section: 'Compare'
        say: 'A compound microscope also has two convex lenses, but it looks at a near object, so its rays spread out from a point. They are not parallel.'
        write: 'Microscope: near object, rays diverge'
      - section: 'An example'
        say: 'Think of looking at the moon from a rooftop at night. It is so far away that its rays arrive parallel, just like in this diagram.'
        write: 'Distant moon → parallel rays'
      - section: 'Answer'
        say: 'So this is the lens arrangement in an astronomical telescope, which is option C.'
        write: '$\therefore$ astronomical telescope'
        answer: true
    traps:
      A: 'You went for the compound microscope. It also uses two convex lenses, but it views a near object, so the rays entering it spread out. Here they arrive parallel.'
      B: 'You chose the binocular. Prism binoculars turn the light with prisms, and there are no prisms in this diagram.'
      D: 'You picked the periscope. A periscope uses two plane mirrors or prisms at forty-five degrees, not two lenses.'
  3:
    moments:
      - section: 'The data'
        say: 'Two twenty ohm resistors are in parallel, and that pair is in series with a fifteen ohm resistor. We want the total resistance.'
        write: '$20\ \Omega \parallel 20\ \Omega$, then in series with $15\ \Omega$,  $R = ?$'
      - section: 'The plan'
        say: 'Always do the parallel part first. Turn the pair into one resistor, then add the series one.'
        write: 'Parallel pair first, then series'
      - section: 'The rule for parallel'
        say: 'For resistors in parallel, one over R p equals one over R one plus one over R two.'
        write: '$\dfrac{1}{R_p} = \dfrac{1}{R_1} + \dfrac{1}{R_2}$'
      - section: 'Substitute'
        say: 'One over R p equals one over twenty plus one over twenty, which is two over twenty.'
        write: '$\dfrac{1}{R_p} = \dfrac{1}{20} + \dfrac{1}{20} = \dfrac{2}{20}$'
      - say: 'Turn it upside down. R p is twenty over two, which is ten ohms.'
        write: '$R_p = \dfrac{20}{2} = 10\ \Omega$'
      - section: 'The rule for series'
        say: 'Resistors in series simply add. So R equals fifteen plus ten.'
        write: '$R = 15 + R_p = 15 + 10$'
      - say: 'That gives twenty-five ohms.'
        write: '$R = 25\ \Omega$'
      - section: 'Check'
        say: 'Check. The pair gives less than either twenty ohm resistor, because the current has two paths. And the total is more than fifteen ohms, because a series resistor only adds.'
        write: '$10\ \Omega < 20\ \Omega$ ✓,  $25\ \Omega > 15\ \Omega$ ✓'
      - section: 'An example'
        say: 'Think of two bulbs wired side by side in a parlour. Each new path lets more current through, so the pair resists less than one bulb alone.'
        write: 'More paths, less resistance'
      - section: 'Answer'
        say: 'So the total resistance is twenty-five ohms, which is option B.'
        write: '$\therefore R = 25\ \Omega$'
        answer: true
    traps:
      A: 'You went for five ohms. The total can never be smaller than the fifteen ohm resistor in series, because a series resistor only adds.'
      C: 'You chose fifteen ohms. That is the series resistor alone. You still have to add the ten ohms from the parallel pair.'
      D: 'You picked thirty-five ohms. That adds fifteen to just one twenty ohm branch. Two equal resistors in parallel give half, which is ten ohms.'
  4:
    moments:
      - section: 'The data'
        say: 'A six kilogram block rests on a slope, held there by thirty newtons of friction. How steep is the slope?'
        write: '$m = 6$ kg,  $F = 30$ N,  $g = 10\ \text{m s}^{-2}$,  $\theta = ?$'
      - section: 'The picture'
        say: 'In the diagram, R pushes out at right angles to the plane, friction F acts up the plane, and the weight W acts straight down.'
        write: '$R \perp$ plane,  $F$ up the plane,  $W$ vertically down'
      - section: 'The rule'
        say: 'The block is at rest, so the forces along the plane balance. Friction up the plane equals the part of the weight down the plane, which is m g sine theta.'
        write: '$F = mg\sin\theta$'
      - section: 'The weight'
        say: 'First the weight. W equals m g, and six times ten is sixty newtons.'
        write: '$W = mg = 6 \times 10 = 60$ N'
      - section: 'Substitute'
        say: 'Put in the numbers. Thirty equals sixty sine theta.'
        write: '$30 = 60\sin\theta$'
      - say: 'Divide both sides by sixty. Sine theta equals thirty over sixty, which is zero point five.'
        write: '$\sin\theta = \dfrac{30}{60} = 0.5$'
      - say: 'The angle whose sine is zero point five is thirty degrees.'
        write: '$\theta = 30^\circ$'
      - section: 'Check'
        say: 'Check. The normal reaction is sixty times cos thirty degrees, about fifty-two newtons. That is less than the weight, as it should be.'
        write: '$R = 60\cos 30^\circ \approx 52$ N $< 60$ N ✓'
      - section: 'Answer'
        say: 'So the angle of inclination is thirty degrees, which is option D.'
        write: '$\therefore \theta = 30^\circ$'
        answer: true
    traps:
      A: 'You went for fifteen degrees. Sine fifteen degrees is about zero point two six, but thirty newtons out of sixty newtons is zero point five.'
      B: 'You chose sixty degrees. That uses cos theta equals zero point five, which is the part of the weight pressing into the plane. Friction balances the part along the plane, which uses sine.'
      C: 'You picked forty-five degrees. Sine forty-five degrees is about zero point seven one, but thirty over sixty is only zero point five.'
  5:
    moments:
      - section: 'The data'
        say: 'Light slows down when it goes into glass. How fast does it travel in glass of refractive index one point six five?'
        write: '$c = 3.0 \times 10^{8}\ \text{m s}^{-1}$,  $n = 1.65$,  $v = ?$'
      - section: 'The rule'
        say: 'Refractive index is the speed of light in air divided by its speed in the medium. So n equals c over v.'
        write: '$n = \dfrac{c}{v}$'
      - say: 'We want v, so make it the subject. v equals c over n.'
        write: '$v = \dfrac{c}{n}$'
      - section: 'Units'
        say: 'The speed is already in metres per second, and the refractive index has no unit. There is nothing to convert.'
        write: 'Already in SI units ✓'
      - section: 'Substitute'
        say: 'Put in the numbers. v equals three times ten to the power eight, over one point six five.'
        write: '$v = \dfrac{3.0 \times 10^{8}}{1.65}$'
      - say: 'Three divided by one point six five is one point eight two. So v is one point eight two times ten to the power eight metres per second.'
        write: '$v = 1.82 \times 10^{8}\ \text{m s}^{-1}$'
      - section: 'Check'
        say: 'Check. Glass slows light down, so the answer must be less than three times ten to the power eight metres per second. It is.'
        write: '$1.82 \times 10^{8} < 3.0 \times 10^{8}$ ✓'
      - section: 'Answer'
        say: 'So the speed of light in the glass is one point eight two times ten to the power eight metres per second, which is option A.'
        write: '$\therefore v = 1.82 \times 10^{8}\ \text{m s}^{-1}$'
        answer: true
    traps:
      B: 'You went for three times ten to the power eight. That is the speed in air. Glass slows the light down.'
      C: 'You chose four point nine five times ten to the power eight. That multiplies c by n, which would make light faster in glass than in air. We divide.'
      D: 'You picked one point six five times ten to the power eight. That only copies the refractive index in front of the power of ten. The speed is c divided by n.'
  6:
    moments:
      - section: 'The question'
        say: 'Sound is a longitudinal wave. It echoes, it bends and it spreads round corners. So which wave behaviour can sound never show?'
        write: 'Longitudinal waves do not show …?'
      - section: 'The fact'
        say: 'Longitudinal waves cannot be polarised.'
        write: 'Longitudinal waves cannot be polarised'
      - section: 'The reason'
        say: 'Polarisation means making the vibrations happen in one plane only. In a transverse wave the particles vibrate across the direction of travel, in many planes, so a filter can pick out one.'
        write: 'Transverse: vibrations ⊥ travel, many planes → can select one'
      - say: 'In a longitudinal wave the particles vibrate only along the direction of travel. There is only one direction, so there is nothing to select.'
        write: 'Longitudinal: vibrations ∥ travel, one direction only'
      - section: 'An example'
        say: 'Sound shows the other three. An echo from a wall is reflection, you hear a radio round a corner by diffraction, and sound bends between warm and cool air by refraction.'
        write: 'Echo = reflection;  round a corner = diffraction;  bending in air = refraction'
      - section: 'Remember'
        say: 'Remember it this way. Polarisation is the test that tells a transverse wave from a longitudinal one.'
        write: 'Polarisation ⇒ transverse only'
      - section: 'Answer'
        say: 'So longitudinal waves do not show polarization, which is option B.'
        write: '$\therefore$ polarization'
        answer: true
    traps:
      A: 'You went for refraction. Sound is refracted when it passes between layers of air at different temperatures, so longitudinal waves do show it.'
      C: 'You chose diffraction. Sound diffracts round corners and doorways, which is why you hear people you cannot see.'
      D: 'You picked reflection. Sound reflects off walls and hills, and that is exactly what an echo is.'
  7:
    moments:
      - section: 'The question'
        say: 'At a party, the MC speaks and the whole hall hears him. Which device turns his voice, which is sound energy, into electrical energy?'
        write: 'Sound energy → electrical energy, which device?'
      - section: 'The fact'
        say: 'A microphone changes sound energy into electrical energy.'
        write: 'Microphone: sound → electrical'
      - section: 'The reason'
        say: 'Sound waves make a thin diaphragm vibrate. In a moving coil microphone the diaphragm moves a coil in a magnetic field, and this induces a varying current.'
        write: 'Sound → diaphragm vibrates → coil moves in field → induced current'
      - section: 'The opposite job'
        say: 'A loudspeaker does the reverse. A varying current in a coil in a magnetic field drives a cone, and the cone makes sound.'
        write: 'Loudspeaker: electrical → sound'
      - section: 'An example'
        say: 'At a church or a party, the microphone turns sound into electricity, the amplifier boosts it, and the speakers turn it back into sound.'
        write: 'Microphone → amplifier → speakers'
      - section: 'Remember'
        say: 'Remember it this way. The microphone listens and the speaker talks.'
        write: 'Microphone listens, speaker talks'
      - section: 'Answer'
        say: 'So the device that converts sound energy into electrical energy is a microphone, which is option D.'
        write: '$\therefore$ a microphone'
        answer: true
    traps:
      A: 'You went for the car horn. A horn turns electrical energy into sound, which is the reverse of what is asked.'
      B: 'You chose the telephone earpiece. The earpiece turns electrical signals into sound for your ear, the reverse direction.'
      C: 'You picked the loudspeaker. It is built much like a microphone, but it changes electrical energy into sound energy, the opposite way.'
  8:
    moments:
      - section: 'The question'
        say: 'A calorimeter is the metal cup we use to measure heat. Should it soak up heat or not, and should it pass heat on quickly or slowly?'
        write: 'Good calorimeter: specific heat capacity? conductivity?'
      - section: 'The fact'
        say: 'A good calorimeter has a low specific heat capacity and a high thermal conductivity. That is why calorimeters are made of copper.'
        write: 'Low $c$, high conductivity ⇒ copper'
      - section: 'The reason'
        say: 'Low specific heat capacity means the cup itself takes up as little of the heat as possible, so nearly all the heat goes into the liquid we are studying.'
        write: 'Low $c$ → cup absorbs little heat'
      - say: 'High conductivity means the cup quickly reaches the same temperature as the liquid inside, so one thermometer reading gives the temperature of both.'
        write: 'High conductivity → cup and liquid at the same temperature'
      - section: 'Heat loss'
        say: 'Heat lost to the room is stopped in a different way, by lagging the outside and fitting a lid. It is not stopped by making the cup a poor conductor.'
        write: 'Heat loss → lagging and a lid'
      - section: 'An example'
        say: 'A copper pot boils water fast because copper takes little heat for itself and passes the heat on quickly. A calorimeter is chosen for the same reasons.'
        write: 'Copper pot heats fast'
      - section: 'Answer'
        say: 'So a good calorimeter has low specific heat capacity and high heat conductivity, which is option D.'
        write: '$\therefore$ low specific heat capacity, high conductivity'
        answer: true
    traps:
      A: 'You went for low conductivity. It sounds as if it keeps the heat in, but the walls would then lag behind the temperature of the liquid inside.'
      B: 'You chose high specific heat capacity and low conductivity. The cup would soak up much of the heat, and its walls would lag behind the liquid in temperature.'
      C: 'You picked high specific heat capacity. Then the cup itself would take up too much of the heat meant for the liquid.'
  9:
    moments:
      - section: 'The question'
        say: 'Four kinds of radiation go through a magnet. Which one does the magnetic field bend the most? Many students pick the alpha particle because it has the bigger charge.'
        write: 'Most strongly deflected by a magnetic field?'
      - section: 'The rule'
        say: 'A magnetic field pushes only on moving charges. The force is F equals B q v, and the radius of the curved path is r equals m v over B q.'
        write: '$F = Bqv$,  $r = \dfrac{mv}{Bq}$'
      - say: 'So the bend depends on the charge to mass ratio, q over m. The bigger q over m, the smaller the radius and the tighter the curve.'
        write: 'Bigger $\dfrac{q}{m}$ ⇒ tighter curve'
      - section: 'Beta particles'
        say: 'A beta particle is an electron, with a tiny mass. Its q over m is about one point eight times ten to the power eleven coulombs per kilogram.'
        write: '$\beta$: $\dfrac{q}{m} \approx 1.8 \times 10^{11}\ \text{C kg}^{-1}$'
      - section: 'Alpha particles'
        say: 'An alpha particle is a helium nucleus, about seven thousand three hundred times heavier with only twice the charge. Its q over m is only about four point eight times ten to the power seven.'
        write: '$\alpha$: $\dfrac{q}{m} \approx 4.8 \times 10^{7}\ \text{C kg}^{-1}$'
      - section: 'The rays'
        say: 'Gamma rays and X rays are electromagnetic waves with no charge, so a magnetic field does not bend them at all.'
        write: '$\gamma$, X-rays: no charge → not deflected'
      - section: 'Check'
        say: 'Check. The beta particle has the biggest q over m by far, about four thousand times the alpha value. So it curves the most.'
        write: '$1.8 \times 10^{11} \gg 4.8 \times 10^{7}$ ✓'
      - section: 'Answer'
        say: 'So beta particles are the most strongly deflected, which is option A.'
        write: '$\therefore \beta$-particles'
        answer: true
    traps:
      B: 'You went for alpha particles. They carry the bigger charge, but they are so heavy that they curve only slightly.'
      C: 'You chose gamma rays. They are uncharged electromagnetic waves and pass straight through a magnetic field.'
      D: 'You picked X rays. They are uncharged electromagnetic waves too, so they are not deflected.'
  10:
    moments:
      - section: 'The question'
        say: 'Look closely at water in a glass. Right at the edge, the surface is not flat. It climbs up the glass. What causes that curve?'
        write: 'Water surface curves at the glass. Why?'
      - section: 'The fact'
        say: 'The curved surface at the glass is called the meniscus, and it is due to surface tension.'
        write: 'Meniscus ⇐ surface tension'
      - section: 'The reason'
        say: 'Water molecules are pulled to the glass more strongly than to each other. That is adhesion beating cohesion, so the water is pulled up the glass at the edge.'
        write: 'Adhesion (water to glass) $>$ cohesion (water to water)'
      - say: 'Surface tension then holds the surface in a smooth curve that is concave upwards.'
        write: 'Water surface curves up at the edge'
      - section: 'Compare'
        say: 'Mercury does the opposite. Its cohesion is stronger than its pull to glass, so its meniscus curves down at the edge.'
        write: 'Mercury: cohesion $>$ adhesion → curves down'
      - section: 'An example'
        say: 'In the laboratory you read a measuring cylinder at the bottom of the meniscus, because the water edge has climbed up the glass.'
        write: 'Read the bottom of the meniscus'
      - section: 'Answer'
        say: 'So the curved surface at the glass is due to surface tension, which is option B.'
        write: '$\therefore$ surface tension'
        answer: true
    traps:
      A: 'You went for friction. Friction acts between moving surfaces, and the water here is at rest.'
      C: 'You chose viscosity. Viscosity resists flow, so it acts only when the liquid moves. The meniscus forms in still water.'
      D: 'You picked evaporation. It lowers the water level slowly, but it does not curve the surface at the glass.'
  11:
    moments:
      - section: 'The question'
        say: 'When NEPA takes light, the generator comes on. The engine turns a shaft, and out comes electricity. That is a dynamo at work. What energy change does it make?'
        write: 'A dynamo converts … into …?'
      - section: 'The fact'
        say: 'A dynamo, which is a generator, converts mechanical energy into electrical energy.'
        write: 'Dynamo: mechanical → electrical'
      - section: 'The reason'
        say: 'A coil is turned in a magnetic field. The magnetic flux through the coil keeps changing, and that induces an e m f.'
        write: 'Coil turns in a field → changing flux → induced e.m.f.'
      - section: 'The law'
        say: 'This is Faraday''s law of electromagnetic induction. A changing magnetic flux through a coil induces an e m f in it.'
        write: 'Faraday''s law: $E \propto \dfrac{\Delta \Phi}{\Delta t}$'
      - section: 'An example'
        say: 'A bicycle dynamo does the same. As you pedal, the wheel turns the dynamo and the lamp lights.'
        write: 'Bicycle dynamo: pedal → lamp lights'
      - section: 'Remember'
        say: 'Remember it this way. A dynamo turns motion into electricity, and a motor turns electricity into motion.'
        write: 'Dynamo: motion → electricity;  motor: electricity → motion'
      - section: 'Answer'
        say: 'So a dynamo converts mechanical energy into electrical energy, which is option C.'
        write: '$\therefore$ mechanical → electrical'
        answer: true
    traps:
      A: 'You went for potential into kinetic energy. That is a falling body, like a mango dropping from a tree, not a dynamo.'
      B: 'You chose electrical into kinetic energy. That is what an electric motor does, the reverse of a dynamo.'
      D: 'You picked kinetic into potential energy. That is a ball thrown upwards, not a dynamo.'
  12:
    moments:
      - section: 'The question'
        say: 'A particle shoots in sideways between two charged plates and bends downwards. What kind of particle is it? The direction of the bend tells us its charge.'
        write: 'Particle curves in an electric field. Which particle?'
      - section: 'The rule'
        say: 'The direction of an electric field is the direction of the force on a positive charge. A negative charge feels a force opposite to the field.'
        write: '$+$ charge: force along $E$;  $-$ charge: force against $E$'
      - section: 'The picture'
        say: 'In the figure, the field lines point upwards, from the lower plate to the upper plate.'
        write: 'Field $E$ points up'
      - say: 'The particle enters moving across the field and curves downwards onto the lower plate. So the force on it is downwards.'
        write: 'Path curves down → force down'
      - section: 'The reasoning'
        say: 'The force is down and the field is up, so the force is opposite to the field. The charge must be negative.'
        write: 'Force opposite to $E$ ⇒ negative charge'
      - section: 'Check the options'
        say: 'A gamma ray and a neutron have no charge, so they would go straight. A proton is positive and would curve up. Only the electron is negative.'
        write: '$\gamma$, n: no charge;  p: $+$;  e: $-$ ✓'
      - section: 'Answer'
        say: 'So the particle is an electron, which is option D.'
        write: '$\therefore$ an electron'
        answer: true
    traps:
      A: 'You went for a gamma ray. It has no charge, so the field would not bend it. It would go straight through.'
      B: 'You chose a proton. A proton is charged, but it is positive, so it would be pushed upwards along the field.'
      C: 'You picked a neutron. A neutron has no charge, so the field cannot bend its path.'
  13:
    moments:
      - section: 'The question'
        say: 'We have four tubes, each with a standing wave drawn inside. Only one holds exactly one wavelength. Counting loops is not enough, so we will count quarter wavelengths.'
        write: 'Which air column $= \lambda$?'
      - section: 'The rule'
        say: 'At an open end there is an antinode, where the envelope is widest. At a closed end there is a node, where the two curves meet.'
        write: 'Open end → antinode (A);  closed end → node (N)'
      - say: 'From a node to the next antinode is a quarter of a wavelength. From a node to the next node is half a wavelength.'
        write: 'N to A $= \dfrac{\lambda}{4}$,  N to N $= \dfrac{\lambda}{2}$'
      - section: 'Tube A'
        say: 'Tube A is open at both ends, with two nodes inside. Going down it reads antinode, node, antinode, node, antinode. That is four quarter wavelengths, one whole wavelength.'
        write: 'A: A N A N A → $4 \times \dfrac{\lambda}{4} = \lambda$'
      - section: 'Tube B'
        say: 'Tube B is open at both ends with one node in the middle. Antinode, node, antinode is two quarters, which is half a wavelength.'
        write: 'B: A N A → $\dfrac{\lambda}{2}$'
      - section: 'Tube C'
        say: 'Tube C is closed at the bottom. A node at the bottom and an antinode at the top, with nothing in between, is only a quarter wavelength.'
        write: 'C: N A → $\dfrac{\lambda}{4}$'
      - section: 'Tube D'
        say: 'Tube D is closed at the bottom, with three nodes and three antinodes. From the bottom that is five quarter wavelengths.'
        write: 'D: N A N A N A → $\dfrac{5\lambda}{4}$'
      - section: 'Check'
        say: 'Check. A closed tube always holds an odd number of quarters, one, three or five, so it can never hold exactly one wavelength. Only an open tube can.'
        write: 'Closed: $\dfrac{\lambda}{4}, \dfrac{3\lambda}{4}, \dfrac{5\lambda}{4}, \ldots$ never $\lambda$ ✓'
      - section: 'Answer'
        say: 'So tube A, open at both ends with two nodes inside, holds exactly one wavelength. That is option A.'
        write: '$\therefore$ Tube A'
        answer: true
    traps:
      B: 'You went for tube B. It has one node between two antinodes, which is only half a wavelength.'
      C: 'You chose tube C. It has just a node at the closed end and an antinode at the top, which is a quarter wavelength.'
      D: 'You picked tube D. It has the most loops, but it is closed, so it holds five quarter wavelengths, more than one wavelength.'
  14:
    moments:
      - section: 'The question'
        say: 'A voltmeter and a potentiometer can both measure a cell. Why do we trust the potentiometer to give the true e m f?'
        write: 'Why measure e.m.f. with a potentiometer?'
      - section: 'The rule'
        say: 'A cell has internal resistance r. When it gives a current I, the terminal p d is V equals E minus I r, which is a little less than the e m f.'
        write: '$V = E - Ir$'
      - say: 'The amount I r is called the lost volts. It is lost only when current flows.'
        write: 'Lost volts $= Ir$'
      - section: 'The voltmeter'
        say: 'A voltmeter always draws some current from the cell. So it reads V, which is a little less than E.'
        write: 'Voltmeter: $I > 0$ ⇒ reads $V < E$'
      - section: 'The potentiometer'
        say: 'At the balance point on a potentiometer, the galvanometer reads zero. No current flows through the cell, so I is zero and V equals E exactly.'
        write: 'Balance: $I = 0$ ⇒ $V = E - 0 = E$'
      - section: 'Remember'
        say: 'Remember it this way. No current means no lost volts, so we get the true e m f.'
        write: 'No current → no lost volts → true e.m.f.'
      - section: 'Answer'
        say: 'So we use a potentiometer because it takes no current from the cell, which is option B.'
        write: '$\therefore$ the potentiometer takes no current from the cell'
        answer: true
    traps:
      A: 'You went for A. Internal resistance matters only when current flows. The real reason is that no current flows at balance.'
      C: 'You chose the linear scale. That makes the reading easy, but it is not why the e m f is measured exactly.'
      D: 'You picked D. At balance the potentiometer acts like a meter of infinite resistance, not a small one.'
  15:
    moments:
      - section: 'The question'
        say: 'We have four electrical quantities, and only one of them points somewhere. Which one is a vector?'
        write: 'Which is a vector?'
      - section: 'The rule'
        say: 'A vector has both size and direction. A scalar has size only.'
        write: 'Vector: size and direction;  scalar: size only'
      - section: 'Electric field'
        say: 'Electric field strength is the force on a unit positive charge, E equals F over q. Force has a direction, so the field has a direction too.'
        write: '$E = \dfrac{F}{q}$,  force has direction ⇒ vector'
      - section: 'The others'
        say: 'Charge, potential difference and capacitance each have size only. They add like ordinary numbers.'
        write: 'Charge, p.d., capacitance: scalars'
      - say: 'Potential difference has a positive end and a negative end, but it is energy per unit charge, and energy is a scalar.'
        write: 'p.d. $= \dfrac{W}{Q}$, energy per charge → scalar'
      - section: 'An example'
        say: 'Between the plates of a capacitor, the field points from the positive plate to the negative plate. It has a direction you can draw with an arrow.'
        write: 'Field: $+$ plate → $-$ plate'
      - section: 'Answer'
        say: 'So the vector is the electric field, which is option C.'
        write: '$\therefore$ electric field'
        answer: true
    traps:
      A: 'You went for electric charge. Charge can be positive or negative, but that is a sign, not a direction in space.'
      B: 'You chose potential difference. It is energy per unit charge, which is a scalar.'
      D: 'You picked capacitance. It is charge per volt, which is a scalar.'
  16:
    moments:
      - section: 'The question'
        say: 'The street light that switches itself on at dusk uses a light sensor. What principle makes a photocell work?'
        write: 'Principle of the photocell?'
      - section: 'The fact'
        say: 'A photocell works by the photoelectric effect. That is the emission of electrons from a metal surface when radiation falls on it.'
        write: 'Photoelectric effect: radiation in → electrons out'
      - section: 'The reason'
        say: 'Each photon gives its energy, h f, to one electron.'
        write: 'Photon energy $= hf$'
      - say: 'If h f is more than the work function of the metal, the electron escapes and a current flows in the circuit.'
        write: '$hf > W_0$ ⇒ electron escapes → current'
      - section: 'An example'
        say: 'The automatic doors at a big supermarket and the street lights that come on at dusk use light sensors that work on this principle.'
        write: 'Automatic doors, dusk street lights'
      - section: 'Remember'
        say: 'Remember it this way. Light goes in and electrons come out.'
        write: 'Light in, electrons out'
      - section: 'Answer'
        say: 'So the photocell works on the emission of electrons by incident radiation, which is option D.'
        write: '$\therefore$ emission of electrons by incident radiation'
        answer: true
    traps:
      A: 'You went for the voltaic cell. A voltaic cell makes electricity by a chemical reaction, not by light.'
      B: 'You chose the photographic plate. It records light chemically, and it does not give a current.'
      C: 'You picked C, which swaps the roles. Protons are held in the nucleus, and it is electrons that light knocks out.'
  17:
    moments:
      - section: 'The question'
        say: 'An atom loses an electron, or gains one. It is still the same element, but now it carries a charge. What do we call it?'
        write: 'Atom gains or loses charge → ?'
      - section: 'The fact'
        say: 'An atom that has lost or gained charge, by losing or gaining electrons, is called an ion.'
        write: 'Charged atom = ion'
      - section: 'The reason'
        say: 'A neutral atom has as many electrons as protons, so the charges cancel.'
        write: 'Neutral atom: electrons = protons'
      - say: 'Lose an electron and there is one proton too many, so it becomes a positive ion. Gain one and it becomes a negative ion.'
        write: 'Lose $e^-$ → positive ion;  gain $e^-$ → negative ion'
      - section: 'An example'
        say: 'In common salt, sodium has lost an electron to become Na⁺, and chlorine has gained one to become Cl⁻.'
        write: '$\ce{Na+}$ and $\ce{Cl-}$ in common salt'
      - section: 'Remember'
        say: 'Remember it this way. The electron is what moves, and the charged atom left behind is the ion.'
        write: 'Electron moves, ion is left'
      - section: 'Answer'
        say: 'So an atom that loses or gains a charge becomes an ion, which is option A.'
        write: '$\therefore$ an ion'
        answer: true
    traps:
      B: 'You went for an electron. The electron is the particle gained or lost, not what the atom becomes.'
      C: 'You chose a neutron. A neutron is an uncharged particle in the nucleus.'
      D: 'You picked a proton. A proton is a particle in the nucleus, and the atom does not turn into one.'
  18:
    moments:
      - section: 'The question'
        say: 'A ship at sea needs to know how deep the water is, and no rope is long enough. Which wave behaviour does it use?'
        write: 'Depth of the sea: which property of waves?'
      - section: 'The fact'
        say: 'The depth of the sea is measured by echo sounding, which uses the reflection of sound.'
        write: 'Echo sounding ⇐ reflection'
      - section: 'How it works'
        say: 'The ship sends a pulse of sound down. It reflects off the sea bed, and the echo comes back after a time t.'
        write: 'Pulse down → reflects off sea bed → echo after time $t$'
      - section: 'The formula'
        say: 'The sound travels down and back, so it covers twice the depth. Depth equals v t over two.'
        write: '$d = \dfrac{vt}{2}$'
      - section: 'An example'
        say: 'Sound travels at about one thousand five hundred metres per second in water. If the echo returns after zero point four seconds, the depth is one thousand five hundred times zero point four over two, which is three hundred metres.'
        write: '$d = \dfrac{1500 \times 0.4}{2} = 300$ m'
      - section: 'Remember'
        say: 'Remember it this way. To measure depth, the sound must come back, and coming back is reflection.'
        write: 'Comes back ⇒ reflection'
      - section: 'Answer'
        say: 'So the measurement of the depth of the sea uses reflection, which is option B.'
        write: '$\therefore$ reflection'
        answer: true
    traps:
      A: 'You went for diffraction. Diffraction spreads waves round obstacles, but it does not send the pulse back to the ship.'
      C: 'You chose refraction. Refraction bends the wave as it passes between layers, but the measurement needs the wave to come back.'
      D: 'You picked interference. That combines two waves, while echo sounding uses one reflected pulse.'
  19:
    moments:
      - section: 'The question'
        say: 'Fusion is the energy of the sun. When light nuclei fuse, what comes out? There are four possible products, and we must choose the right pair.'
        write: 'Products of fusion: I heavy nucleus, II neutrons, III protons, IV energy'
      - section: 'The fact'
        say: 'In nuclear fusion, light nuclei join to form one heavier nucleus, and energy is released.'
        write: 'Light nuclei → one heavier nucleus + energy'
      - section: 'The reason'
        say: 'The mass of the new nucleus is a little less than the mass of the nuclei that joined. The lost mass, delta m, appears as energy.'
        write: 'Mass lost $= \Delta m$'
      - say: 'Einstein''s equation tells us how much. E equals delta m c squared.'
        write: '$E = \Delta m\, c^{2}$'
      - section: 'An example'
        say: 'In the sun, hydrogen nuclei fuse to form helium, and the energy reaches us as sunlight.'
        write: 'Sun: hydrogen → helium + energy'
      - section: 'Pick the pair'
        say: 'So the products are the heavy nucleus, which is one, and energy, which is four.'
        write: 'I and IV'
      - section: 'Answer'
        say: 'So fusion produces one heavy nucleus and energy, which is option C.'
        write: '$\therefore$ I and IV'
        answer: true
    traps:
      A: 'You went for one and two. That leaves out energy, which is the whole point of fusion.'
      B: 'You chose two and three. Neutrons and protons are not the defining products. Fusion builds a heavier nucleus and releases energy.'
      D: 'You picked two and four. Neutrons are the mark of fission, and this pair leaves out the heavier nucleus that fusion forms.'
  20:
    moments:
      - section: 'The question'
        say: 'We have two kettles of boiling water, the same in every way except that one is shiny and one is black with soot. Which one cools faster, and why?'
        write: 'Polished kettle vs sooty kettle, which cools faster?'
      - section: 'The fact'
        say: 'A dull black surface is a good radiator of heat, and a good absorber. A shiny polished surface is a poor radiator.'
        write: 'Dull black: good radiator;  shiny: poor radiator'
      - section: 'The reason'
        say: 'The kettles are the same except for their outer surface. So conduction and convection to the air are the same for both.'
        write: 'Same kettle ⇒ same conduction and convection'
      - say: 'The surface affects only radiation. The sooty kettle radiates heat faster, so it cools more quickly.'
        write: 'Soot → more radiation → cools faster'
      - section: 'An example'
        say: 'The shiny inside of a vacuum flask keeps tea hot, while a black pot off the stove loses its heat faster.'
        write: 'Shiny flask keeps heat;  black pot loses heat'
      - section: 'Remember'
        say: 'Remember it this way. Black gives out heat well and takes in heat well. Shiny does both badly.'
        write: 'Good absorber = good emitter'
      - section: 'Answer'
        say: 'So the kettle covered with soot cools more quickly because it is a good radiator of heat, which is option C.'
        write: '$\therefore$ sooty kettle cools faster, good radiator'
        answer: true
    traps:
      A: 'You went for the same rate. The surfaces are different, so their rates of radiation are different.'
      B: 'You chose the polished kettle. A polished surface is a poor radiator, so that kettle cools more slowly.'
      D: 'You picked convection. Soot speeds cooling by radiation. Convection is the same for both kettles.'
  21:
    moments:
      - section: 'The question'
        say: 'The sun, moon and earth are all in one straight line. Which one must be in the middle for the sun to vanish in the daytime?'
        write: 'Total eclipse of the sun: who is in the middle?'
      - section: 'The fact'
        say: 'A total eclipse of the sun happens when the moon is between the sun and the earth, all in a straight line.'
        write: 'Sun → moon → earth'
      - section: 'The reason'
        say: 'Light travels in straight lines, so the moon blocks the light of the sun and casts a shadow on the earth.'
        write: 'Light travels in straight lines → moon casts a shadow'
      - say: 'Places on earth inside the moon''s umbra, its full shadow, see the sun completely covered.'
        write: 'In the umbra → sun fully covered'
      - section: 'An example'
        say: 'Nigeria saw a total eclipse of the sun on the twenty-ninth of March, two thousand and six. In places the day went dark like evening.'
        write: '29 March 2006, total eclipse seen in Nigeria'
      - section: 'Compare'
        say: 'When the earth is between the sun and the moon instead, the earth''s shadow falls on the moon. That is an eclipse of the moon.'
        write: 'Sun → earth → moon = eclipse of the moon'
      - section: 'Answer'
        say: 'So a total eclipse of the sun occurs when the moon is between the sun and the earth, which is option A.'
        write: '$\therefore$ moon between sun and earth'
        answer: true
    traps:
      B: 'You went for the sun in the middle. That cannot happen, because the moon goes round the earth, and the sun is far beyond both.'
      C: 'You chose the earth in the middle. That gives an eclipse of the moon, not of the sun.'
      D: 'You picked the ozone layer. The ozone layer has nothing to do with eclipses.'
  22:
    moments:
      - section: 'The question'
        say: 'Shine white light through a prism and a rainbow of colours spreads out. Which two colours end up furthest apart?'
        write: 'Widest separation in the spectrum?'
      - section: 'The fact'
        say: 'The spectrum of white light runs red, orange, yellow, green, blue, indigo, violet. We remember it as Roy G Biv.'
        write: 'R O Y G B I V'
      - section: 'The reason'
        say: 'In a prism, red light bends the least and violet light bends the most.'
        write: 'Red: least deviation;  violet: most deviation'
      - say: 'So red and violet sit at the two opposite ends of the spectrum.'
        write: 'Red ←————→ violet'
      - section: 'The other pairs'
        say: 'Green and yellow are next to each other. Yellow sits near the middle. Indigo is one step short of the violet end.'
        write: 'G, Y neighbours;  Y in the middle;  I next to V'
      - section: 'An example'
        say: 'Look at a rainbow after the rain. Red is on the outside edge and violet on the inside edge, with all the others between them.'
        write: 'Rainbow: red outside, violet inside'
      - section: 'Answer'
        say: 'So the widest separation is between red and violet, which is option B.'
        write: '$\therefore$ red and violet'
        answer: true
    traps:
      A: 'You went for green and yellow. They are right next to each other in the spectrum.'
      C: 'You chose red and indigo. They are far apart, but indigo is one step short of violet, so it is not quite the widest.'
      D: 'You picked yellow and violet. Yellow is in the middle of the spectrum, not at the end.'
  23:
    moments:
      - section: 'The question'
        say: 'A pendulum swings to and fro. Its displacement, velocity, acceleration and force all keep changing. Which two always rise and fall together?'
        write: 'In S.H.M., which pair is in phase?'
      - section: 'The rule'
        say: 'Simple harmonic motion is defined by a equals minus omega squared x. The acceleration is always opposite to the displacement.'
        write: '$a = -\omega^{2}x$'
      - section: 'Force and acceleration'
        say: 'Newton''s second law says F equals m a. Mass is always positive, so the force always points the same way as the acceleration.'
        write: '$F = ma$,  $m > 0$ ⇒ $F$ and $a$ in phase'
      - section: 'Force and displacement'
        say: 'The restoring force is F equals minus k x. The minus sign means the force is opposite to the displacement, half a cycle out of phase.'
        write: '$F = -kx$ ⇒ $180^\circ$ out of phase'
      - section: 'Velocity'
        say: 'The velocity is greatest at the centre, where the displacement and acceleration are zero. It is zero at the ends, where they are greatest.'
        write: 'Velocity max at centre, zero at the ends'
      - say: 'So velocity is a quarter cycle, ninety degrees, out of step with both displacement and acceleration.'
        write: '$v$ is $90^\circ$ from $x$ and from $a$'
      - section: 'Check'
        say: 'Check with the pendulum at the end of its swing. It is pulled back towards the centre, and it speeds up towards the centre. Force and acceleration point the same way.'
        write: 'At the end: $F$ and $a$ both towards the centre ✓'
      - section: 'Answer'
        say: 'So the force on the body and its acceleration are in phase, which is option D.'
        write: '$\therefore$ force and acceleration'
        answer: true
    traps:
      A: 'You went for displacement and velocity. They are a quarter cycle apart, because the velocity is zero where the displacement is greatest.'
      B: 'You chose displacement and force. They are tied together, but the minus sign in F equals minus k x makes them opposite, half a cycle apart.'
      C: 'You picked velocity and acceleration. The velocity is greatest where the acceleration is zero, so they are ninety degrees apart.'
  24:
    moments:
      - section: 'The data'
        say: 'A metre rule weighing zero point five newtons is pivoted at the thirty centimetre mark. Where must a two newton force go to balance it? Read the question well, because it asks for the distance from the pivot.'
        write: '$W = 0.5$ N,  pivot at 30 cm,  force $= 2$ N,  $d = ?$ from the pivot'
      - section: 'The weight'
        say: 'A uniform rule has its weight acting at its centre, the fifty centimetre mark. That is fifty minus thirty, or twenty centimetres to the right of the pivot.'
        write: 'Weight at 50 cm, $50 - 30 = 20$ cm from the pivot'
      - section: 'The law'
        say: 'The principle of moments says that for balance, the clockwise moments equal the anticlockwise moments about the pivot.'
        write: 'Clockwise moments = anticlockwise moments'
      - say: 'The weight turns the rule one way, so the two newton force must sit on the other side of the pivot, between the zero and thirty centimetre marks.'
        write: '$2 \times d = 0.5 \times 20$'
      - section: 'Units'
        say: 'Both distances are in centimetres, and the same unit is on both sides. So we can leave them in centimetres.'
        write: 'Both in cm, no conversion needed'
      - section: 'Substitute'
        say: 'Zero point five times twenty is ten. So two d equals ten.'
        write: '$2d = 10$'
      - say: 'Divide both sides by two. d equals five centimetres.'
        write: '$d = \dfrac{10}{2} = 5$ cm'
      - section: 'Check'
        say: 'Check. The force is four times the weight, so it needs only a quarter of the distance. Twenty divided by four is five. It agrees, and the force sits at the twenty-five centimetre mark.'
        write: '$\dfrac{20}{4} = 5$ cm ✓,  at the 25 cm mark'
      - section: 'Answer'
        say: 'So the force is placed five centimetres from the pivot, which is option B.'
        write: '$\therefore d = 5$ cm'
        answer: true
    traps:
      A: 'You went for ninety-five centimetres. That is off the end of the rule. From the thirty centimetre mark, the rule reaches only thirty centimetres one way and seventy the other.'
      C: 'You chose twenty centimetres. That is the distance of the weight from the pivot, not of the two newton force.'
      D: 'You picked twenty-five centimetres. That is the scale mark where the force sits. Its distance from the pivot is five centimetres.'
  25:
    moments:
      - section: 'The data'
        say: 'A solid weighs ten newtons in air, six newtons in water and seven newtons in liquid X. How dense is X compared with water?'
        write: 'Air 10.0 N,  water 6.0 N,  liquid X 7.0 N,  R.D. of X $= ?$'
      - section: 'The law'
        say: 'Archimedes'' principle says the upthrust equals the weight of the liquid displaced. The loss of weight is the upthrust.'
        write: 'Upthrust = loss of weight'
      - say: 'The solid displaces the same volume of each liquid. So the relative density of the liquid is the upthrust in the liquid over the upthrust in water.'
        write: 'R.D. $= \dfrac{\text{upthrust in X}}{\text{upthrust in water}}$'
      - section: 'The upthrusts'
        say: 'Upthrust in X is ten minus seven, which is three newtons.'
        write: 'Upthrust in X $= 10.0 - 7.0 = 3.0$ N'
      - say: 'Upthrust in water is ten minus six, which is four newtons.'
        write: 'Upthrust in water $= 10.0 - 6.0 = 4.0$ N'
      - section: 'Substitute'
        say: 'So the relative density is three over four. The newtons cancel, so it has no unit.'
        write: 'R.D. $= \dfrac{3.0}{4.0} = \dfrac{3}{4}$'
      - section: 'Check'
        say: 'Check. Liquid X pushes up less than water does, so it is less dense than water. The answer must be below one, and three quarters is.'
        write: '$3.0$ N $< 4.0$ N ⇒ R.D. $< 1$ ✓'
      - section: 'Answer'
        say: 'So the relative density of the liquid is three quarters, which is option A.'
        write: '$\therefore$ R.D. $= \dfrac{3}{4}$'
        answer: true
    traps:
      B: 'You went for four thirds. That turns the fraction upside down, with the upthrust in water on top. The liquid goes on top.'
      C: 'You chose five thirds. That is ten over six, the weight in air over the weight in water. Use the upthrusts, the losses in weight, which give three over four.'
      D: 'You picked seven tenths. That divides the weight in X by the weight in air, and those are not the upthrusts.'
  26:
    moments:
      - section: 'The question'
        say: 'This U shaped thermometer records the hottest and coldest temperatures of the day. What fills each of its three parts, P, Q and R?'
        write: 'Six''s thermometer: contents of P, Q, R?'
      - section: 'The picture'
        say: 'In the diagram, P is the large closed bulb on the left limb, Q is the U bend at the bottom, and R is the right limb rising to a small bulb.'
        write: 'P = large bulb,  Q = U-bend,  R = right limb'
      - section: 'Part P'
        say: 'P is full of alcohol. Alcohol expands a lot when it warms, so it is the part that senses the temperature.'
        write: 'P: alcohol, the sensing liquid'
      - section: 'Part Q'
        say: 'Q holds a thread of mercury. When the alcohol in P expands or contracts, it pushes the mercury round the bend.'
        write: 'Q: mercury, pushed round the bend'
      - say: 'The mercury moves two small steel indices, which stay behind to mark the highest and lowest temperatures.'
        write: 'Mercury moves the steel indices → max and min'
      - section: 'Part R'
        say: 'R holds alcohol above the mercury, with a little vapour and air in the small bulb at the top to allow for expansion.'
        write: 'R: alcohol (vapour space at the top)'
      - section: 'An example'
        say: 'Weather stations and farmers use this thermometer to record how hot the afternoon got and how cold the night was.'
        write: 'Weather stations: hottest and coldest of the day'
      - section: 'Answer'
        say: 'So P, Q and R hold alcohol, mercury and alcohol, which is option B.'
        write: '$\therefore$ alcohol, mercury, alcohol'
        answer: true
    traps:
      A: 'You went for air, alcohol and mercury. P cannot be air, and the U bend holds mercury, not alcohol.'
      C: 'You chose mercury, alcohol and mercury. That is the wrong way round, because the mercury sits only in the U bend.'
      D: 'You picked air, mercury and alcohol. There is a little air at the top of R, but the large bulb P holds alcohol, the liquid that does the sensing.'
  27:
    moments:
      - section: 'The question'
        say: 'The sun has been shining for billions of years. What process makes all that energy?'
        write: 'Energy production in the sun?'
      - section: 'The fact'
        say: 'The sun produces its energy by nuclear fusion.'
        write: 'Sun ⇐ nuclear fusion'
      - section: 'The reason'
        say: 'In the very hot core, hydrogen nuclei move fast enough to overcome their repulsion. They join together into helium nuclei.'
        write: 'Hydrogen nuclei → helium nucleus'
      - say: 'A little mass is lost in each joining, and it is released as energy. E equals m c squared.'
        write: '$E = mc^{2}$'
      - section: 'Compare'
        say: 'Fission is the opposite. It splits heavy nuclei such as uranium, and it powers nuclear reactors on earth.'
        write: 'Fission: heavy nucleus splits (reactors);  fusion: light nuclei join (sun)'
      - section: 'An example'
        say: 'The sunshine that dries cassava and charges solar panels in Nigeria all comes from fusion in the core of the sun.'
        write: 'Sunlight on solar panels ⇐ fusion'
      - section: 'Answer'
        say: 'So the energy of the sun comes from nuclear fusion, which is option B.'
        write: '$\therefore$ nuclear fusion'
        answer: true
    traps:
      A: 'You went for nuclear fission. Fission splits heavy nuclei, but the sun joins light ones together.'
      C: 'You chose electron collision. Electron collisions do not release nuclear energy.'
      D: 'You picked radioactive decay. It releases far too little energy to power the sun.'
  28:
    moments:
      - section: 'The question'
        say: 'Inside a nuclear reactor, uranium nuclei split again and again. Which particle starts each split and keeps the chain going?'
        write: 'Particle that causes fission in a reactor?'
      - section: 'The fact'
        say: 'In a nuclear reactor, fission is started and kept going by neutrons.'
        write: 'Fission ⇐ neutrons'
      - section: 'The reason'
        say: 'A slow neutron is absorbed by a uranium two three five nucleus. The nucleus splits into two smaller nuclei and gives out energy.'
        write: '$^{1}_{0}\text{n} + {}^{235}_{92}\text{U} \rightarrow$ two smaller nuclei + energy'
      - say: 'Each split also releases two or three more neutrons, and those split more nuclei. That is a chain reaction.'
        write: '2 or 3 new neutrons → chain reaction'
      - section: 'Why a neutron'
        say: 'A neutron works best because it has no charge, so the positive nucleus does not push it away.'
        write: 'Neutron: no charge → not repelled'
      - section: 'Control'
        say: 'Control rods absorb some of the neutrons, to keep the rate of fission steady and safe.'
        write: 'Control rods absorb neutrons'
      - section: 'Answer'
        say: 'So the particle responsible for fission in a reactor is the neutron, which is option D.'
        write: '$\therefore$ the neutron'
        answer: true
    traps:
      A: 'You went for the electron. Electrons do not cause fission, because the nucleus does not take them in to split.'
      B: 'You chose the photon. Photons do not keep a chain reaction going in a reactor.'
      C: 'You picked the proton. A proton is positive, so the positive nucleus repels it and it cannot get in easily.'
  29:
    moments:
      - section: 'The data'
        say: 'We know where a particle is to within five times ten to the power minus ten metres. How uncertain is its momentum? The powers of ten are where most students slip.'
        write: '$\Delta x = 5 \times 10^{-10}$ m,  $h = 6.6 \times 10^{-34}$ J s,  $\Delta p = ?$'
      - section: 'The law'
        say: 'The uncertainty principle says the uncertainty in position times the uncertainty in momentum is about Planck''s constant. Delta x delta p is about h.'
        write: '$\Delta x\,\Delta p \approx h$'
      - say: 'We want delta p, so divide both sides by delta x. Delta p equals h over delta x.'
        write: '$\Delta p = \dfrac{h}{\Delta x}$'
      - section: 'Units'
        say: 'Both values are already in SI units, joule seconds and metres. There is nothing to convert.'
        write: 'Already in SI units ✓'
      - section: 'Substitute'
        say: 'Put in the numbers. Delta p equals six point six times ten to the power minus thirty-four, over five times ten to the power minus ten.'
        write: '$\Delta p = \dfrac{6.6 \times 10^{-34}}{5 \times 10^{-10}}$'
      - say: 'Divide the numbers first. Six point six over five is one point three two.'
        write: '$\dfrac{6.6}{5} = 1.32$'
      - say: 'Now the powers. When we divide, we subtract them. Minus thirty-four minus minus ten is minus twenty-four.'
        write: '$10^{-34 - (-10)} = 10^{-24}$'
      - say: 'So delta p is one point three two times ten to the power minus twenty-four newton seconds.'
