  36:
    moments:
      - section: 'The data'
        say: 'We have six cells of two volts each in one row. But look closely at the diagram, because one of them is turned the other way.'
        write: '6 cells,  $E = 2$ V each,  effective e.m.f. $= ?$'
      - section: 'The rule'
        say: 'For cells in series, the e m f s add when the cells face the same way. A cell turned round opposes the others, so its e m f is subtracted.'
        write: 'Same way: add;  reversed: subtract'
      - section: 'The picture'
        say: 'In the diagram, cells one, two, three, five and six have the long plate on the left. Cell four has its short plate on the left, so it is reversed.'
        write: '5 cells forward,  cell 4 reversed'
      - section: 'Substitute'
        say: 'The five forward cells give five times two, which is ten volts.'
        write: '$5 \times 2 = 10$ V'
      - say: 'The reversed cell takes away one times two, which is two volts. Ten minus two is eight volts.'
        write: '$E = 10 - 2 = 8$ V'
      - section: 'Check'
        say: 'Check. The reversed cell does not just drop out. It cancels one of the others. So the total is the same as four cells, and four times two is eight volts.'
        write: '$4 \times 2 = 8$ V ✓'
      - section: 'Answer'
        say: 'So the effective e m f of the cells is eight volts, which is option A.'
        write: '$\therefore E = 8$ V'
        answer: true
    traps:
      B: 'You went for zero volts. That needs three cells facing each way so they cancel, but only one cell is reversed.'
      C: 'You chose six volts. That is only three cells'' worth. One reversed cell cancels just one forward cell, which leaves four cells, or eight volts.'
      D: 'You picked twelve volts. That adds all six cells and misses the one that is turned round.'
  37:
    moments:
      - section: 'The data'
        say: 'A borehole pump lifts five thousand kilograms of water sixty metres up in fifteen minutes. What is its power? Watch the minutes and the weight, because they are the traps.'
        write: '$m = 5000$ kg,  $h = 60$ m,  $t = 15$ min,  $g = 10\ \text{m s}^{-2}$,  $P = ?$'
      - section: 'The rule'
        say: 'Power is the rate of doing work. P equals work over time, and the work done in lifting is m g h. So P equals m g h over t.'
        write: '$P = \dfrac{W}{t} = \dfrac{mgh}{t}$'
      - section: 'Convert to seconds'
        say: 'Power in watts needs time in seconds. Fifteen minutes is fifteen times sixty, which is nine hundred seconds.'
        write: '$t = 15 \times 60 = 900$ s'
      - section: 'The work'
        say: 'The work done is m g h, which is five thousand times ten times sixty. That is three times ten to the power six joules.'
        write: '$W = 5000 \times 10 \times 60 = 3.0 \times 10^{6}$ J'
      - section: 'Substitute'
        say: 'Now divide by the time. P equals three times ten to the power six, over nine hundred.'
        write: '$P = \dfrac{3.0 \times 10^{6}}{900}$'
      - say: 'That is about three thousand three hundred, which is three point three times ten to the power three joules per second.'
        write: '$P = 3.3 \times 10^{3}\ \text{J s}^{-1}$'
      - section: 'Check'
        say: 'Check. That is three point three kilowatts, a sensible size for a water pump. The unit, joules per second, is the watt.'
        write: '$3.3$ kW, sensible for a pump ✓'
      - section: 'Answer'
        say: 'So the power of the pump is three point three times ten to the power three joules per second, which is option B.'
        write: '$\therefore P = 3.3 \times 10^{3}\ \text{J s}^{-1}$'
        answer: true
    traps:
      A: 'You went for two point five times ten to the power five. That is far too big. At that power the pump would do all three million joules of work in just twelve seconds, not fifteen minutes.'
      C: 'You chose two point five times ten to the power four. That is about seven and a half times too big. At that power the pump would finish in two minutes, not fifteen.'
      D: 'You picked three point three times ten to the power two. That leaves out g. Five thousand times sixty over nine hundred is about three hundred and thirty-three. The work done is the weight, m g, times the height.'
  38:
    moments:
      - section: 'The data'
        say: 'Two crests of a wave are fifteen centimetres apart, and the wave travels at three hundred metres per second. How many waves pass each second?'
        write: 'Crest to crest $= 15$ cm,  $v = 300\ \text{m s}^{-1}$,  $f = ?$'
      - section: 'The wavelength'
        say: 'The distance between two successive crests is one wavelength, lambda.'
        write: '$\lambda = 15$ cm'
      - section: 'The rule'
        say: 'The wave equation says v equals f lambda. We want f, so f equals v over lambda.'
        write: '$v = f\lambda$  ⇒  $f = \dfrac{v}{\lambda}$'
      - section: 'Convert to metres'
        say: 'The speed is in metres per second, so the wavelength must be in metres. Fifteen centimetres is zero point one five metres.'
        write: '$\lambda = 15\ \text{cm} = 0.15\ \text{m}$'
      - section: 'Substitute'
        say: 'Put in the numbers. f equals three hundred over zero point one five.'
        write: '$f = \dfrac{300}{0.15}$'
      - say: 'That is two thousand hertz, which is two point zero times ten to the power three hertz.'
        write: '$f = 2000\ \text{Hz} = 2.0 \times 10^{3}\ \text{Hz}$'
      - section: 'Check'
        say: 'Check the unit. Metres per second divided by metres gives per second, which is hertz.'
        write: '$\dfrac{\text{m s}^{-1}}{\text{m}} = \text{s}^{-1} = \text{Hz}$ ✓'
      - section: 'Answer'
        say: 'So the frequency is two point zero times ten to the power three hertz, which is option C.'
        write: '$\therefore f = 2.0 \times 10^{3}\ \text{Hz}$'
        answer: true
    traps:
      A: 'You went for four point five times ten to the power five. That multiplies v by lambda, with both in centimetres, that is thirty thousand times fifteen. Frequency is v divided by lambda.'
      B: 'You chose four point five times ten to the power two. That multiplies three hundred by one point five. Frequency needs a division, by zero point one five metres.'
      D: 'You picked two point zero times ten to the power two. That changes fifteen centimetres to one point five metres instead of zero point one five, so it is ten times too small.'
