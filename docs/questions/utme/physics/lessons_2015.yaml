  31:
    moments:
      - section: 'The question'
        say: 'Usually dirt in a wire makes it conduct worse. But add impurities to pure silicon, and something different happens. What happens to its conductivity?'
        write: 'Impurities in a semiconductor → conductivity?'
      - section: 'The fact'
        say: 'Adding impurities to a pure semiconductor is called doping, and it increases the electrical conductivity.'
        write: 'Doping ⇒ conductivity increases'
      - section: 'The reason'
        say: 'A pure semiconductor such as silicon has very few free charge carriers at room temperature.'
        write: 'Pure silicon: few free carriers'
      - say: 'A pentavalent impurity such as phosphorus gives extra free electrons, which is n type. A trivalent impurity such as boron gives extra holes, which is p type.'
        write: 'Phosphorus → extra electrons (n-type);  boron → extra holes (p-type)'
      - say: 'More carriers means more current for the same p d, and that means higher conductivity.'
        write: 'More carriers → more current → higher conductivity'
      - section: 'An example'
        say: 'The diodes and transistors in every phone charger and radio are made from doped silicon.'
        write: 'Phone chargers, radios: doped silicon'
      - section: 'Answer'
        say: 'So adding impurities increases the conductivity of a semiconductor, which is option A.'
        write: '$\therefore$ increases'
        answer: true
    traps:
      B: 'You went for increases then decreases. Within the range used in devices, more doping means more carriers, so the conductivity does not fall back.'
      C: 'You chose decreases. That is true of impurities in a metal, but in a semiconductor the impurities supply the carriers.'
      D: 'You picked remains constant. The number of charge carriers changes, so the conductivity changes too.'
  32:
    moments:
      - section: 'The question'
        say: 'Heat a metal filament until it glows, and electrons start to fly off its surface. What is this process called?'
        write: 'Electrons leaving a hot metal = ?'
      - section: 'The fact'
        say: 'The release of electrons from the surface of a hot metal is called thermionic emission.'
        write: 'Thermionic emission'
      - section: 'The reason'
        say: 'Heating gives the free electrons in the metal more kinetic energy.'
        write: 'Heat → electrons gain kinetic energy'
      - say: 'When an electron has more energy than the work function, it can escape from the surface.'
        write: 'Energy $>$ work function ⇒ electron escapes'
      - section: 'An example'
        say: 'The hot cathode in an old television tube, or in an X ray tube, gives out electrons this way.'
        write: 'Cathode of a TV tube, X-ray tube'
      - section: 'Remember'
        say: 'Remember it this way. Thermionic has thermo in it, which means heat. Photoemission has photo in it, which means light.'
        write: 'Thermo = heat;  photo = light'
      - section: 'Answer'
        say: 'So electrons leaving a hot metal is thermionic emission, which is option B.'
        write: '$\therefore$ thermionic emission'
        answer: true
    traps:
      A: 'You went for photoemission. That also releases electrons, but it is caused by light falling on the metal, not by heat.'
      C: 'You chose photon emission. That is the giving out of light, not of electrons.'
      D: 'You picked electron emission. It is too general, and the emission caused by heat has its own name.'
  33:
    moments:
      - section: 'The question'
        say: 'A prism alone gives a spectrum where the colours smudge into each other. What do we add to get a pure spectrum, with each colour sharp and separate?'
        write: 'Pure spectrum: prism plus what?'
      - section: 'The fact'
        say: 'A pure spectrum is made with a narrow slit, two converging lenses, which are convex lenses, and a prism.'
        write: 'Slit + convex lens + prism + convex lens'
      - section: 'The first lens'
        say: 'The slit sits at the focus of the first convex lens, so the light leaves that lens as a parallel beam into the prism.'
        write: 'Lens 1: slit at focus → parallel beam'
      - section: 'The prism'
        say: 'The prism separates the colours. Each colour leaves as its own parallel beam, at a slightly different angle.'
        write: 'Prism: each colour a parallel beam at its own angle'
      - section: 'The second lens'
        say: 'The second convex lens focuses each colour to its own sharp image of the slit on the screen. So the colours do not overlap.'
        write: 'Lens 2: each colour focused separately → no overlap'
      - section: 'Remember'
        say: 'Remember it this way. Convex lenses bring light together, so they make the colours sharp. A concave lens would only spread them out.'
        write: 'Convex focuses, concave spreads'
      - section: 'Answer'
        say: 'So a pure spectrum is made with a triangular prism and two convex lenses, which is option D.'
        write: '$\therefore$ prism with two convex lenses'
        answer: true
    traps:
      A: 'You went for a prism only. A prism alone gives overlapping colours, which is an impure spectrum.'
      B: 'You chose two concave lenses. Concave lenses spread light out, so they cannot bring each colour to a sharp focus.'
      C: 'You picked a glass prism with a pin. A pin is used to trace rays, not to make a pure spectrum.'
  34:
    moments:
      - section: 'The question'
        say: 'Look behind a petrol tanker on the expressway and you may see a short chain dragging on the road. Why is it there?'
        write: 'Why a chain on a petrol tanker?'
