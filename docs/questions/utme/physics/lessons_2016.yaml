        write: 'Nuclear process, out of reach of outside conditions'
      - section: 'Be careful'
        say: 'The alpha and beta radiations can be bent by fields after they leave the atom. But the decay itself is not affected.'
        write: 'Radiations are deflected,  decay is not'
      - section: 'The other statements'
        say: 'Now the other statements. Statement A says radioactivity is a nuclear phenomenon. That is true, because it comes from the nucleus.'
        write: 'A ✓'
      - say: 'Statement B says it is shown mainly by elements of mass number above two hundred and six. That is true, because the heavy elements beyond lead are the main natural emitters.'
        write: 'B ✓'
      - say: 'Statement D says radioactive substances give out alpha, beta and gamma rays. That is true too.'
        write: 'D ✓'
      - say: 'Statement C says the radioactivity of an element is affected by fields around it. We have seen that it is not, so C is false.'
        write: 'C ✗'
      - section: 'Answer'
        say: 'So the statement that is not a characteristic is that radioactivity is affected by outside fields, which is option C.'
        write: '$\therefore$ C, decay is not affected by outside fields'
        answer: true
    traps:
      A: 'You went for A. That one is true. Radioactivity comes from the nucleus, so it is a nuclear phenomenon.'
      B: 'You chose B. That one is true. Most natural radioactive elements are heavier than lead, with mass numbers above two hundred and six.'
      D: 'You picked D. That one is true. Alpha, beta and gamma are the three natural radiations. The radiations are bent by fields, but the decay is not.'
  35:
    moments:
      - section: 'The question'
        say: 'A danfo brakes suddenly and everyone lurches forward. What is this inertia that pushes the passengers?'
        write: 'Correct explanation of INERTIA $= ?$'
      - section: 'The fact'
        say: 'Inertia is the reluctance of a body to change its state of rest, or of uniform motion in a straight line.'
        write: 'Inertia $=$ reluctance to change state of rest or motion'
      - section: 'Two halves'
        say: 'So a body at rest is reluctant to start moving.'
        write: 'At rest ⇒ reluctant to start'
      - say: 'And a moving body is reluctant to stop. Both halves belong to inertia.'
        write: 'Moving ⇒ reluctant to stop'
      - section: 'The law'
        say: 'This is the idea behind Newton''s first law, which says a body stays at rest or keeps moving in a straight line unless a force acts on it. The more mass a body has, the more inertia it has.'
        write: 'Newton''s first law,  more mass ⇒ more inertia'
      - section: 'An example'
        say: 'For example, when the danfo brakes, the passengers lurch forward because their bodies are reluctant to stop.'
        write: 'Brakes ⇒ lurch forward'
      - say: 'And when it pulls off, they are pressed back because their bodies are reluctant to start.'
        write: 'Pulls off ⇒ pressed back'
      - section: 'Answer'
        say: 'So inertia is its reluctance to start moving when at rest and its reluctance to stop once moving, which is option A.'
        write: '$\therefore$ reluctance to start and reluctance to stop'
        answer: true
    traps:
      B: 'You went for reluctance to stop moving. That is only half the definition. Inertia also resists starting to move.'
      C: 'You chose readiness to start moving. Inertia is reluctance, not readiness, to start moving.'
      D: 'You picked readiness to stop. A body with inertia resists stopping. That is why the passengers lurch forward.'
  36:
    moments:
      - section: 'The question'
        say: 'A small charge feels a four newton push in an electric field. How strong is the field? Do we multiply or divide? That is the question.'
        write: 'Electric field intensity $E = ?$'
      - section: 'The data'
        say: 'The charge q is zero point two coulombs, and the force F is four point zero newtons.'
        write: '$q = 0.2\ \text{C}$,  $F = 4.0\ \text{N}$'
      - section: 'The rule'
        say: 'Electric field intensity is the force per unit charge. E equals F over q.'
        write: '$E = \dfrac{F}{q}$'
      - section: 'Substitute'
        say: 'So E equals four point zero over zero point two.'
        write: '$E = \dfrac{4.0}{0.2}$'
      - say: 'Four over zero point two is twenty. So E is twenty point zero newtons per coulomb.'
        write: '$E = 20.0\ \text{N C}^{-1}$'
      - section: 'Check'
        say: 'Check. Zero point two coulombs feels four newtons, so a whole coulomb, five times as much, would feel twenty newtons. The unit is newtons per coulomb.'
        write: '$5 \times 4.0 = 20\ \text{N}$ on 1 C ✓'
      - section: 'Answer'
        say: 'So the intensity of the field is twenty point zero newtons per coulomb, which is option B.'
        write: '$\therefore E = 20.0\ \text{N C}^{-1}$'
        answer: true
    traps:
      A: 'You went for zero point zero five. That divides the charge by the force, which is upside down. It is force over charge.'
      C: 'You chose zero point eight. That multiplies the force by the charge instead of dividing.'
      D: 'You picked four point two. That adds the force and the charge, which has no meaning.'
  37:
    moments:
      - section: 'The question'
        say: 'Stretch a spring too far and it never goes back. What do we call that point?'
        write: 'Point beyond which a spring does not return $= ?$'
      - section: 'The fact'
        say: 'The elastic limit is the point beyond which a stretched spring or wire no longer returns to its original length when the load is removed.'
        write: 'Elastic limit'
      - section: 'The reason'
        say: 'Up to the elastic limit the stretching is elastic, so the material springs back.'
        write: 'Below the limit ⇒ springs back'
      - say: 'Beyond it the material is permanently stretched.'
        write: 'Beyond the limit ⇒ permanent stretch'
      - section: 'Hooke''s law'
        say: 'Hooke''s law says the extension is proportional to the load. We write F equals k e, where F is the load, e is the extension and k is the spring constant. This law holds up to about the elastic limit.'
        write: '$F = ke$ up to about the elastic limit'
      - section: 'An example'
        say: 'For example, the spring in a bathroom scale overloaded with a heavy bag can stay slightly stretched and read wrongly afterwards.'
        write: 'Overloaded bathroom scale'
      - section: 'Answer'
        say: 'So that point is called the elastic limit, which is option C.'
        write: '$\therefore$ elastic limit'
        answer: true
    traps:
      A: 'You went for the breaking point. That is where the spring snaps, well beyond the elastic limit.'
      B: 'You chose the spring constant. That is the force per unit extension, a number for the spring, not a point.'
      D: 'You picked the elasticity point. There is no standard quantity with that name. The point is the elastic limit.'
  38:
    moments:
      - section: 'The question'
        say: 'A concave mirror can throw a picture onto a screen. Which four statements describe that real image? One of them belongs to a different kind of image.'
        write: 'Real image by a concave mirror, which of I, II, III, IV $?$'
      - section: 'The fact'
        say: 'A real image is formed where rays of light actually meet, so it can be caught on a screen.'
        write: 'Real image $=$ rays actually meet'
      - section: 'The statements'
        say: 'Statement one says it can be seen on a screen. That is true.'
        write: 'I ✓'
      - say: 'Statement two says it is inverted and in front of the mirror. For a concave mirror the reflected rays cross in front of it, and the image is inverted. True.'
        write: 'II ✓'
      - say: 'Statement four says it is formed by rays actually converging. That is the very definition of a real image.'
        write: 'IV ✓'
      - say: 'Statement three says it only seems to exist. That describes a virtual image, like the one you see in the mirror at a barber''s shop.'
        write: 'III ✗ (virtual image)'
      - section: 'Answer'
