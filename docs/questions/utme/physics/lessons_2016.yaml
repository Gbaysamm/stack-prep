  29:
    moments:
      - section: 'The question'
        say: 'A particle at rest splits in two, and one piece flies off. How fast does the other piece go? First ask, what is its mass?'
        write: 'Particle of mass $M$ at rest splits, speed of second piece $= ?$'
      - section: 'The data'
        say: 'The whole particle has mass M and is at rest. One piece has mass m and velocity v. The other piece has what is left, M minus m, and velocity V.'
        write: 'First piece $m$, $v$;  second piece $M - m$, $V = ?$'
      - section: 'The rule'
        say: 'The principle of conservation of linear momentum says that if no outside force acts, the total momentum before equals the total momentum after.'
        write: 'Momentum before $=$ momentum after'
      - section: 'Before'
        say: 'Before, the particle is at rest, so its momentum is M times zero, which is zero.'
        write: 'Before $= M \times 0 = 0$'
      - section: 'After'
        say: 'Momentum is mass times velocity. After, the first piece has momentum m v, and the second has M minus m in brackets times V. Their sum must equal zero.'
        write: '$mv + (M - m)V = 0$'
      - section: 'Solve'
        say: 'Take m v to the other side, where it becomes minus m v. So M minus m, times V, equals minus m v.'
        write: '$(M - m)V = -mv$'
      - say: 'Now divide both sides by M minus m. V equals minus m v over M minus m.'
        write: '$V = -\dfrac{mv}{M - m}$'
      - say: 'The minus sign only shows that the second piece moves the opposite way. Its speed is m v over M minus m.'
        write: '$|V| = \dfrac{mv}{M - m}$'
      - section: 'Check'
        say: 'Check. The lighter piece moves faster, just as a gun recoils slowly while the bullet flies fast.'
        write: 'Heavier piece ⇒ slower ✓'
      - section: 'Answer'
        say: 'So the speed of the second particle is m v over M minus m, which is option B.'
        write: '$\therefore |V| = \dfrac{mv}{M - m}$'
        answer: true
    traps:
      A: 'You went for m v over M. That gives the second piece the whole mass M. It only has what is left over, M minus m.'
      C: 'You chose m v over M plus m. The second piece has mass M minus m. Splitting cannot make it heavier than the whole.'
      D: 'You picked capital M v over M minus m. That puts the whole mass into the momentum of the first piece, which has mass small m.'
  30:
    moments:
      - section: 'The question'
        say: 'We want to plate thirty-six grams of silver in just five minutes. How big a current do we need? The minutes are the trap.'
        write: 'Silver deposited by electrolysis, current $I = ?$'
      - section: 'The data'
        say: 'The electrochemical equivalent z is zero point zero zero one two grams per coulomb. It is the mass of silver deposited by each coulomb of charge.'
        write: '$z = 0.0012\ \text{g C}^{-1}$'
      - say: 'The mass m to deposit is thirty-six point zero grams, and the time t is five point zero minutes.'
        write: '$m = 36.0\ \text{g}$, $t = 5.0\ \text{min}$'
      - section: 'The rule'
        say: 'Faraday''s first law of electrolysis says the mass deposited is proportional to the charge passed. The charge is current times time, I t, so m equals z I t.'
        write: '$m = zIt$'
      - say: 'We want I, so divide both sides by z t. I equals m over z t.'
        write: '$I = \dfrac{m}{zt}$'
      - section: 'Convert to seconds'
        say: 'The coulomb is an amp second, so time must be in seconds. Five point zero minutes times sixty is three hundred seconds.'
        write: '$t = 5.0 \times 60 = 300\ \text{s}$'
      - section: 'Substitute'
        say: 'Zero point zero zero one two times three hundred is zero point three six. So I equals thirty-six over zero point three six.'
        write: '$I = \dfrac{36.0}{0.0012 \times 300} = \dfrac{36.0}{0.36}$'
      - say: 'Thirty-six over zero point three six is one hundred amps.'
        write: '$I = 100\ \text{A}$'
      - section: 'Check'
        say: 'Check another way. The charge is thirty-six over zero point zero zero one two, which is thirty thousand coulombs. Thirty thousand coulombs over three hundred seconds is one hundred amps.'
        write: '$Q = \dfrac{36.0}{0.0012} = 30\,000\ \text{C}$,  $\dfrac{30\,000}{300} = 100\ \text{A}$ ✓'
      - section: 'Answer'
        say: 'So the current must be one hundred amps, which is option C.'
        write: '$\therefore I = 100\ \text{A}$'
        answer: true
    traps:
      A: 'You went for six thousand amps. That leaves the time as five instead of three hundred seconds. Change minutes to seconds first.'
      B: 'You chose ten amps. That works out zero point zero zero one two times three hundred as three point six, but it is zero point three six. One decimal place has slipped.'
      D: 'You picked one amp. That is far too small. One amp for three hundred seconds passes only three hundred coulombs, which deposits just zero point three six grams of silver, not thirty-six.'
  31:
    moments:
      - section: 'The question'
        say: 'The coil in a car makes thousands of volts to fire the spark plug from a twelve volt battery. Which law explains it?'
        write: 'Induction coil, principle $= ?$'
      - section: 'The fact'
        say: 'An induction coil works by electromagnetic induction, described by Faraday''s law.'
        write: 'Induction coil ⇒ electromagnetic induction (Faraday''s law)'
      - section: 'How it works'
        say: 'An induction coil has two coils wound on one iron core, a primary with few turns and a secondary with very many turns.'
        write: 'Primary (few turns), secondary (very many turns), iron core'
      - say: 'A make and break switch turns the current in the primary coil on and off very quickly.'
        write: 'Make-and-break ⇒ primary current switched on and off'
      - say: 'Each time the current switches on or off, the magnetic flux, the amount of magnetic field through the coils, changes. This changing flux also passes through the secondary coil.'
        write: 'Changing flux links the secondary (many turns)'
      - section: 'The law'
        say: 'Faraday''s law says a changing flux induces an e m f, a voltage, in the coil. The e m f is proportional to the rate of change of flux, so the faster the flux changes, the bigger the e m f.'
        write: '$E \propto \dfrac{\Delta \Phi}{\Delta t}$'
      - say: 'Because the secondary has so many turns and the flux collapses so fast, the induced e m f is very high.'
        write: 'Many turns, fast change ⇒ very high e.m.f.'
      - section: 'An example'
        say: 'For example, the ignition coil in a car engine works this way. It turns the twelve volts of the battery into the thousands of volts that make a spark jump across the spark plug.'
        write: 'Car ignition coil, spark plug'
      - section: 'Answer'
        say: 'So an induction coil is based on Faraday''s law, which is option C.'
        write: '$\therefore$ Faraday''s law'
        answer: true
    traps:
      A: 'You went for Ohm''s law. Ohm''s law links current and p d in a resistor. It does not explain how a coil makes a high e m f.'
      B: 'You chose Ampere''s law. That gives the magnetic field around a current, not an induced e m f.'
      D: 'You picked Coulomb''s law. That is about the force between two charges, which has nothing to do with induction.'
  32:
    moments:
      - section: 'The question'
        say: 'A radioactive sample goes through three half-lives. Read carefully. Do they want the atoms left, or the atoms that have broken up?'
        write: 'After three half-lives, atoms disintegrated $= ?$'
      - section: 'The rule'
        say: 'In each half-life, half of the undecayed atoms disintegrate.'
        write: 'Each half-life ⇒ remaining atoms halve'
      - section: 'Halve three times'
        say: 'N becomes N over two, then N over four, then N over eight.'
        write: '$N \rightarrow \dfrac{N}{2} \rightarrow \dfrac{N}{4} \rightarrow \dfrac{N}{8}$'
      - say: 'That is N times a half, cubed. So N over eight is left undecayed.'
        write: 'Remaining $= N \times \left(\dfrac{1}{2}\right)^{3} = \dfrac{N}{8}$'
      - section: 'The disintegrated atoms'
        say: 'Disintegrated equals the original minus what remains. N minus N over eight is seven N over eight.'
        write: 'Disintegrated $= N - \dfrac{N}{8} = \dfrac{7N}{8}$'
      - section: 'Check'
        say: 'Check. The atoms decayed plus the atoms left must add up to N. Seven N over eight plus N over eight is N.'
        write: '$\dfrac{7N}{8} + \dfrac{N}{8} = N$ ✓'
      - section: 'Answer'
        say: 'So the number of atoms that have disintegrated is seven N over eight, which is option A.'
        write: '$\therefore \dfrac{7N}{8}$'
        answer: true
    traps:
      B: 'You went for three N over eight. That takes away one eighth for each half-life, but each half-life halves what is left.'
      C: 'You chose five N over eight. The atoms decayed go N over two, then three N over four, then seven N over eight. Five N over eight never comes up.'
      D: 'You picked N over eight. That is the number left undecayed. The question asks for the atoms that have disintegrated.'
  33:
    moments:
      - section: 'The question'
        say: 'Why does a barometer use mercury and not water? Imagine how tall a water barometer would have to be.'
        write: 'Mercury in a barometer, why $?$'
      - section: 'The fact'
        say: 'Mercury is used mainly because it is very dense, about thirteen point six times denser than water.'
        write: 'Mercury $\approx 13.6 \times$ denser than water'
      - section: 'The rule'
        say: 'The air holds up a column of liquid, and the pressure of a column is p equals h rho g, where h is its height and rho is the density of the liquid. So for the same pressure, a denser liquid needs a shorter column.'
        write: '$p = h\rho g$ ⇒ bigger $\rho$, smaller $h$'
      - section: 'The numbers'
        say: 'For normal air pressure, mercury needs a column of only about seventy-six centimetres.'
        write: 'Mercury column $\approx 76\ \text{cm}$'
      - say: 'Water would need a column about ten metres tall, as high as a three storey building. That is far too long for a laboratory.'
        write: 'Water column $\approx 10\ \text{m}$'
      - section: 'Other reasons'
        say: 'Mercury also does not wet glass, and it hardly evaporates, so the space above the column stays almost empty.'
        write: 'Does not wet glass, low vapour pressure'
      - section: 'Answer'
        say: 'So mercury suits a barometer because it is several times denser than water, which is option B.'
        write: '$\therefore$ several times denser than water'
        answer: true
    traps:
      A: 'You went for expanding uniformly. That is why mercury suits a thermometer, not a barometer.'
      C: 'You chose wets glass. Mercury does not wet glass, and that is in fact one of its advantages.'
      D: 'You picked a good conductor of heat. Conducting heat has nothing to do with measuring air pressure.'
  34:
    moments:
      - section: 'The question'
        say: 'Can you speed up radioactive decay with a magnet? Find the one statement that is not true of natural radioactivity.'
        write: 'NOT a characteristic of natural radioactivity $= ?$'
      - section: 'The fact'
        say: 'Natural radioactivity is spontaneous, which means it happens by itself. Nothing outside the nucleus changes the rate at which an element decays.'
        write: 'Decay is spontaneous'
      - say: 'That means temperature, pressure, and electric and magnetic fields around it have no effect on its radioactivity.'
        write: 'No effect from temperature, pressure or fields'
      - section: 'The reason'
