  28:
    moments:
      - section: 'The question'
        say: 'Touch a humming tuning fork to a wooden box and the sound suddenly gets louder. What is this called?'
        write: 'Tuning fork on a wooden box, louder sound $= ?$'
      - section: 'The fact'
        say: 'This is resonance, in the form of a sounding box. The box is made to vibrate by the fork.'
        write: 'Resonance (forced vibration of a sounding box)'
      - section: 'The reason'
        say: 'The fork forces the box and the air inside it to vibrate at the same frequency as the fork.'
        write: 'Box vibrates at the fork''s frequency'
      - say: 'The large area of the box sets much more air vibrating than the thin prongs can, so the sound is louder.'
        write: 'Large area ⇒ more air moved ⇒ louder'
      - say: 'The energy of the fork is used up faster, so the sound is louder but dies away sooner.'
        write: 'Louder, but dies away sooner'
      - section: 'An example'
        say: 'The hollow body of a guitar or a talking drum works the same way, making the strings or the skin sound much louder.'
        write: 'Guitar body, talking drum'
      - section: 'Answer'
        say: 'So this is resonance, which is option D.'
        write: '$\therefore$ resonance'
        answer: true
    traps:
      A: 'You went for beats. Beats need two sources of slightly different frequency, heard as a sound that rises and falls.'
      B: 'You chose echoing. An echo is a reflected sound heard after a delay, not a sound made louder by a box.'
