# UTME 2016 Physics, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the Nigerian classroom way: the data with symbols and
# units, the law in words then written, any conversion to SI units as its own moment, the
# substitution one step per moment, the answer with its unit and a check, and the answer moment
# that names the option. traps gives one kind line for each wrong option.
#
#   say:    heard, not read. No symbols the voice would mangle; formulas read the way a teacher
#           reads them, units and numbers in words.
#   write:  the one line written while it is said, with LaTeX between dollar signs.
#   answer: true on the moment that gives the answer.
#
# Keyed on question number, like explanations_2016.yaml. Answers match that file.
format_version: 1
exam_year: 2016
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'A metre rule is in every school bag. But how big an error can you make when you read it? Many students give the smallest mark itself, and that is the trap.'
        write: 'Metre rule, least possible error $= ?$'
      - section: 'The data'
        say: 'A metre rule is marked in millimetres, so its smallest division is one millimetre.'
        write: 'Smallest division $= 1\ \text{mm}$'
      - section: 'The rule'
        say: 'When you read a scale, you judge which mark the edge is nearer to. So you can be out by at most half of the smallest division.'
        write: 'Reading error $= \tfrac{1}{2} \times$ smallest division'
      - section: 'The working'
        say: 'Half of one millimetre is zero point five millimetres.'
        write: 'Error $= \tfrac{1}{2} \times 1\ \text{mm} = 0.5\ \text{mm}$'
      - section: 'Check'
        say: 'Check. Zero point five millimetres is zero point zero five centimetres. That is why we write metre rule readings to the nearest zero point one centimetre, like twenty-five point three centimetres.'
        write: '$0.5\ \text{mm} = 0.05\ \text{cm}$, so readings like 25.3 cm ✓'
      - section: 'Answer'
        say: 'So the least possible error with a metre rule is zero point five millimetres, which is option A.'
        write: '$\therefore$ least possible error $= 0.5\ \text{mm}$'
        answer: true
    traps:
      B: 'You went for one millimetre. That is the smallest division itself, the precision of the rule. The error in reading it is half of that, zero point five millimetres.'
      C: 'You chose zero point two millimetres. Nobody can judge a fifth of a millimetre by eye on a millimetre scale. Half a division is the honest limit.'
      D: 'You picked zero point one millimetres. That is the kind of reading a vernier calliper gives, not a metre rule.'
  2:
    moments:
      - section: 'The question'
        say: 'Here is a transformer with a coil on each side of the iron core. Does the output voltage go up or down? Count the turns before you decide.'
        write: 'Transformer, output e.m.f. compared with input $= ?$'
      - section: 'The data'
        say: 'From the diagram, the input coil, the primary, has two turns. We write this as N p equals two, where N p means the number of turns on the primary.'
        write: '$N_p = 2$'
      - say: 'The output coil, the secondary, has four turns. So N s, the number of turns on the secondary, equals four.'
        write: '$N_s = 4$'
      - section: 'The rule'
        say: 'In a transformer the voltages are in the same ratio as the turns. We write V p for the voltage across the primary and V s for the voltage across the secondary. So V s over V p equals N s over N p.'
        write: '$\dfrac{V_s}{V_p} = \dfrac{N_s}{N_p}$'
      - section: 'Substitute'
        say: 'Put in the turns. V s over V p equals four over two, which is two.'
        write: '$\dfrac{V_s}{V_p} = \dfrac{4}{2} = 2$'
      - say: 'Now multiply both sides by V p. So V s equals two times V p, and the output is twice the input.'
        write: '$V_s = 2V_p$'
      - section: 'Check'
        say: 'Check. More turns on the secondary means a step-up transformer, like the ones at a power station that raise the voltage for the long lines.'
        write: '$N_s > N_p$ ⇒ step-up ✓'
      - section: 'Answer'
        say: 'So the e m f in the secondary is increased, which is option C.'
        write: '$\therefore$ secondary e.m.f. is increased'
        answer: true
    traps:
      A: 'You went for the same. The voltage stays the same only when both coils have equal turns, and here the secondary has twice as many.'
      B: 'You chose reduced. A reduced voltage needs fewer turns on the secondary, but the output coil here has four turns against two.'
      D: 'You picked zero. With an a c input the flux in the core keeps changing, so an e m f is always induced in the secondary.'
  3:
    moments:
      - section: 'The question'
        say: 'A borehole pump lifts five thousand kilograms of water up sixty metres in fifteen minutes. How powerful is it? Watch the minutes and the weight, because they are the traps.'
        write: 'Pump lifting water, power $P = ?$'
      - section: 'The data'
        say: 'We are given the mass m, five thousand kilograms, and the height h, sixty metres.'
        write: '$m = 5000\ \text{kg}$, $h = 60\ \text{m}$'
      - say: 'The time t is fifteen minutes, and we take g, the acceleration due to gravity, as ten metres per second squared.'
        write: '$t = 15\ \text{min}$, $g = 10\ \text{m s}^{-2}$'
      - section: 'The rule'
        say: 'Power is the rate of doing work. So power equals the work done divided by the time taken.'
        write: '$P = \dfrac{\text{work}}{\text{time}}$'
      - say: 'Work done in lifting is the weight, m g, times the height, h. That is m g h, the gain in potential energy.'
        write: 'Work $= mgh$'
      - say: 'So P equals m g h over t.'
        write: '$P = \dfrac{mgh}{t}$'
      - section: 'Convert to seconds'
        say: 'A watt is a joule per second, so power needs the time in seconds. There are sixty seconds in a minute, so fifteen minutes times sixty is nine hundred seconds.'
        write: '$t = 15 \times 60 = 900\ \text{s}$'
      - section: 'Substitute'
        say: 'The work done is five thousand times ten times sixty, which is three million joules.'
        write: '$mgh = 5000 \times 10 \times 60 = 3\,000\,000\ \text{J}$'
      - say: 'Now divide by nine hundred seconds. Three million over nine hundred is about three thousand three hundred and thirty-three watts.'
        write: '$P = \dfrac{3\,000\,000}{900} = 3333\ \text{W}$'
      - say: 'In standard form, three thousand three hundred is three point three times ten to the power three. So the power is about three point three times ten to the power three joules per second.'
        write: '$P \approx 3.3 \times 10^{3}\ \text{J s}^{-1}$'
      - section: 'Check'
        say: 'Check. Three point three kilowatts is a sensible size for a pump filling an overhead tank, and a joule per second is a watt.'
        write: '$3.3\ \text{kW}$, $\text{J s}^{-1} = \text{W}$ ✓'
      - section: 'Answer'
        say: 'So the power of the pump is three point three times ten to the power three joules per second, which is option A.'
        write: '$\therefore P = 3.3 \times 10^{3}\ \text{J s}^{-1}$'
        answer: true
    traps:
      B: 'You went for two point five times ten to the power four. That is about seven and a half times too big. At that power the pump would do the three million joules of work in two minutes, not fifteen.'
      C: 'You chose two point five times ten to the power five. That is far too big. At that power the pump would do all three million joules of work in just twelve seconds, not fifteen minutes.'
      D: 'You picked three point three times ten to the power two. That leaves out g. Five thousand times sixty over nine hundred is about three hundred and thirty-three. The work done is the weight, m g, times the height.'
  4:
    moments:
      - section: 'The question'
        say: 'Five hundred joules of heat go into a hundred grams of water. How much does it warm up? One small slip with the grams gives a big wrong answer.'
        write: 'Water heated, temperature change $\Delta T = ?$'
      - section: 'The data'
        say: 'We are given the heat Q, five hundred joules, and the mass of water m, one hundred grams.'
        write: '$Q = 500\ \text{J}$, $m = 100\ \text{g}$'
      - say: 'The specific heat capacity of water, c, is four thousand two hundred joules per kilogram per kelvin. That is the heat needed to warm one kilogram of water by one kelvin.'
        write: '$c = 4200\ \text{J kg}^{-1}\,\text{K}^{-1}$'
      - section: 'The rule'
        say: 'Heat supplied equals mass times specific heat capacity times temperature change. Q equals m c delta T, where delta T means the change in temperature.'
        write: '$Q = mc\Delta T$'
      - say: 'We want delta T, so divide both sides by m c. Delta T equals Q over m c.'
        write: '$\Delta T = \dfrac{Q}{mc}$'
      - section: 'Convert to kilograms'
        say: 'The c is per kilogram, so the mass must be in kilograms. One hundred grams is zero point one kilograms.'
        write: '$m = 100\ \text{g} = 0.1\ \text{kg}$'
      - section: 'Substitute'
        say: 'Zero point one times four thousand two hundred is four hundred and twenty. So delta T is five hundred over four hundred and twenty.'
        write: '$\Delta T = \dfrac{500}{0.1 \times 4200} = \dfrac{500}{420}$'
      - say: 'Five hundred over four hundred and twenty is one point one nine, which is about one point two degrees.'
        write: '$\Delta T = 1.19 \approx 1.2\ ^\circ\text{C}$'
      - section: 'Check'
        say: 'Check. Five hundred joules is a small amount of heat for a hundred grams of water, so a rise of about one degree makes sense. A change of one kelvin is the same size as one degree Celsius.'
        write: '1.2 K change $=$ 1.2 °C change ✓'
      - section: 'Answer'
        say: 'So the temperature rises by one point two degrees Celsius, which is option C.'
        write: '$\therefore \Delta T \approx 1.2\ ^\circ\text{C}$'
        answer: true
    traps:
      A: 'You went for twelve point one degrees. That is about ten times too big, the size you get by taking one hundred grams as zero point zero one kilograms. One hundred grams is a tenth of a kilogram, zero point one.'
      B: 'You chose two point one degrees. To warm one hundred grams of water by two point one degrees needs about eight hundred and eighty joules, but only five hundred are supplied.'
      D: 'You picked zero point one degrees. That leaves out the mass, five hundred over four thousand two hundred. The heat goes into zero point one kilograms of water, so divide by four hundred and twenty.'
  5:
    moments:
      - section: 'The question'
        say: 'Four kinds of radiation pass between charged plates and magnets. Which one goes straight through both, without bending?'
        write: 'Not deflected by electric or magnetic fields $= ?$'
      - section: 'The rule'
        say: 'An electric field or a magnetic field can only push on something that carries charge. So we check each radiation for charge.'
        write: 'Fields deflect only charged things'
      - section: 'The charged ones'
        say: 'Alpha particles are helium nuclei, two protons and two neutrons, so they carry a positive charge of plus two.'
        write: 'Alpha $= +2e$'
      - say: 'Beta particles are fast electrons, so they carry a negative charge of minus one.'
        write: 'Beta $= -e$'
      - say: 'Cathode rays are streams of electrons too. Bring a magnet near the tube and the beam bends at once.'
        write: 'Cathode rays $=$ electrons, charged'
      - section: 'The uncharged one'
        say: 'Gamma rays are electromagnetic waves, like X rays and light. They carry no charge, so neither field can bend them.'
        write: 'Gamma rays $=$ electromagnetic waves, charge $0$'
      - section: 'Remember'
        say: 'So remember it this way. No charge, no bend.'
        write: 'No charge ⇒ no deflection'
      - section: 'Answer'
        say: 'So gamma rays cannot be deflected by electric and magnetic fields, which is option A.'
        write: '$\therefore$ gamma rays'
        answer: true
    traps:
      B: 'You went for alpha particles. They carry a charge of plus two, so both fields deflect them.'
      C: 'You chose cathode rays. They travel straight in an empty tube, but they are electrons, and both fields bend them.'
      D: 'You picked beta particles. They are fast electrons with a negative charge, so both fields deflect them.'
  6:
    moments:
      - section: 'The question'
        say: 'Air is normally a good insulator. So how does the gas inside a fluorescent tube carry a current? Two conditions decide it.'
        write: 'Gas conducts electricity when $= ?$'
      - section: 'The fact'
        say: 'A gas conducts electricity at low pressure and high p d. The p d is the potential difference, the voltage across the gas.'
        write: 'Low pressure $+$ high p.d.'
      - section: 'The reason'
        say: 'A gas always holds a few ions and free electrons. At normal pressure the gas molecules are crowded, so these ions and electrons hit other molecules before they gain enough speed.'
        write: 'High pressure ⇒ collisions too often'
      - say: 'Lowering the pressure lets them travel further between collisions.'
        write: 'Low pressure ⇒ longer free path'
      - say: 'A high p d then speeds them up enough to knock electrons out of other molecules. That is ionisation, and the gas glows and conducts.'
        write: 'High p.d. ⇒ ionisation ⇒ gas conducts'
      - section: 'An example'
        say: 'The fluorescent tube in a classroom and the neon sign at a shop front are low pressure gas tubes run at a high voltage.'
        write: 'Fluorescent tube, neon sign'
      - section: 'Answer'
        say: 'So gases conduct at low pressure and high p d, which is option B.'
        write: '$\therefore$ low pressure and high p.d.'
        answer: true
    traps:
      A: 'You went for high pressure and low p d. Those are exactly the conditions in which a gas is a good insulator, like the air around a socket.'
      C: 'You chose low pressure and low p d. Low pressure helps, but at a low p d the ions are not pushed hard enough to ionise other molecules.'
      D: 'You picked high pressure and high p d. At high pressure the particles collide too often, so you get a spark at most, not a steady discharge.'
  7:
    moments:
      - section: 'The question'
        say: 'White light goes into a prism and a rainbow comes out. Where do the colours come from, and why do they spread?'
        write: 'Dispersion of white light by a prism, cause $= ?$'
      - section: 'The fact'
        say: 'Dispersion is the splitting of white light into its colours. The colours are already in white light.'
        write: 'White light $=$ red, orange, yellow, green, blue, indigo, violet'
      - section: 'The reason'
        say: 'The refractive index, n, tells us how much light slows down in a material, and so how much it bends. Each colour travels at a different speed in glass, so each colour has a different refractive index.'
        write: 'Different speed ⇒ different $n$ for each colour'
      - say: 'Violet slows the most and bends the most. Red slows the least and bends the least.'
        write: 'Violet bends most, red bends least'
      - say: 'So the colours, which travel together in air, are refracted by different amounts and spread out into a spectrum.'
        write: 'Different bending ⇒ spectrum'
      - section: 'An example'
        say: 'You see the same thing in a rainbow after rain, and in the colours at the edge of a glass louvre on a sunny day.'
        write: 'Rainbow, edge of a glass louvre'
      - section: 'Answer'
        say: 'So dispersion happens because of the different speeds of the colours in the glass, which is option C.'
        write: '$\therefore$ different speeds of the colours in the glass'
        answer: true
    traps:
      A: 'You went for defects in the glass. A perfect prism with no defects still splits white light, so defects are not the cause.'
      B: 'You chose the high density of the glass. Density is not the cause. It is that each colour has its own speed in the glass.'
      D: 'You picked hidden colours in the glass. The colours come from the white light itself. The glass only separates them.'
  8:
    moments:
      - section: 'The question'
        say: 'A cell pushes four amps into a three ohm and a six ohm resistor in parallel. What is its e m f? Combine the resistors the right way first.'
        write: 'Cell with 3 Ω and 6 Ω in parallel, $E = ?$'
      - section: 'The data'
        say: 'The current I from the cell is four point zero amps.'
        write: '$I = 4.0\ \text{A}$'
      - say: 'The two resistors are R one, three ohms, and R two, six ohms, joined in parallel.'
        write: '$R_1 = 3\ \Omega$, $R_2 = 6\ \Omega$ in parallel'
      - say: 'The internal resistance of the cell, r, is zero, so no voltage is lost inside the cell.'
        write: '$r = 0$'
      - section: 'The rule'
        say: 'For two resistors in parallel, the combined resistance is the product over the sum. R equals R one R two over R one plus R two.'
        write: '$R = \dfrac{R_1 R_2}{R_1 + R_2}$'
      - section: 'Substitute'
        say: 'Three times six is eighteen, and three plus six is nine. So R equals eighteen over nine.'
        write: '$R = \dfrac{3 \times 6}{3 + 6} = \dfrac{18}{9}$'
      - say: 'Eighteen over nine is two ohms.'
        write: '$R = 2\ \Omega$'
      - section: 'Ohm''s law'
        say: 'Now the cell drives four amps through this two ohm combination. With no internal resistance, the whole e m f, the total voltage the cell supplies, is across it. So Ohm''s law gives E equals I R.'
        write: '$E = IR$'
      - say: 'Four point zero times two is eight volts.'
        write: '$E = 4.0 \times 2 = 8\ \text{V}$'
      - section: 'Check'
        say: 'Check. Two ohms is smaller than either resistor, as it must be in parallel, and amps times ohms gives volts.'
        write: '$2\ \Omega < 3\ \Omega$ ✓,  A × Ω = V ✓'
      - section: 'Answer'
        say: 'So the e m f of the cell is eight volts, which is option D.'
        write: '$\therefore E = 8\ \text{V}$'
        answer: true
    traps:
      A: 'You went for twelve volts. That uses only the three ohm resistor, four times three. The six ohm resistor shares the current too.'
      B: 'You chose thirty-six volts. That adds the resistors as if they were in series, nine ohms. In parallel they combine to two ohms.'
      C: 'You picked two volts. Two is the combined resistance in ohms, not the voltage. Multiply it by the four amps.'
  9:
    moments:
      - section: 'The question'
        say: 'An eighty kilogram load sits on rough ground, and a five hundred newton pull is just enough to start it moving. How rough is the ground? Watch out, because mass is not force.'
        write: 'Coefficient of static friction $\mu = ?$'
      - section: 'The data'
        say: 'The mass m is eighty kilograms, and we take g as ten metres per second squared.'
        write: '$m = 80\ \text{kg}$, $g = 10\ \text{m s}^{-2}$'
      - say: 'The pull of five hundred newtons only just starts the load moving. So the friction has reached its largest value, the limiting friction F, five hundred newtons.'
        write: '$F = 500\ \text{N}$'
      - section: 'The rule'
        say: 'When a body is just about to slide, friction reaches its limiting value. F equals mu R, where mu is the coefficient of static friction and R is the normal reaction, the push of the ground on the load. Dividing both sides by R, mu equals F over R.'
        write: '$F = \mu R$,  so  $\mu = \dfrac{F}{R}$'
      - section: 'The normal reaction'
        say: 'On level ground the normal reaction equals the weight. R equals m g, which is eighty times ten, eight hundred newtons.'
        write: '$R = mg = 80 \times 10 = 800\ \text{N}$'
      - section: 'Substitute'
        say: 'So mu equals five hundred over eight hundred.'
        write: '$\mu = \dfrac{500}{800}$'
      - say: 'That is zero point six two five, which is zero point six to one decimal place.'
        write: '$\mu = 0.625 \approx 0.6$'
      - section: 'Check'
        say: 'Check. Mu has no unit, because it is a force divided by a force, and a value below one is usual for rough ground.'
        write: '$\dfrac{\text{N}}{\text{N}}$ ⇒ no unit, $\mu < 1$ ✓'
      - section: 'Answer'
        say: 'So the coefficient of static friction is zero point six, which is option A.'
        write: '$\therefore \mu \approx 0.6$'
        answer: true
    traps:
      B: 'You went for zero point four. That is too small. A coefficient of zero point four would need a pull of only three hundred and twenty newtons.'
      C: 'You chose one point zero. That would need a pull of eight hundred newtons, the whole weight, but the pull is only five hundred.'
      D: 'You picked zero point eight. That is too big. It would need a pull of six hundred and forty newtons.'
  10:
    moments:
      - section: 'The question'
        say: 'A plank balances on its middle, with P on the left and Q on the right. Now we add two P to P. What brings it back to balance? Think about which side got heavier.'
        write: 'Plank RS pivoted at O, add $2P$ to $P$, balance again by $?$'
      - section: 'The data'
        say: 'Let P hang a distance a to the left of O, and Q hang a distance b to the right.'
        write: '$P$ at distance $a$ (left),  $Q$ at distance $b$ (right)'
      - section: 'The rule'
        say: 'The moment of a weight about the pivot is the weight times its distance from the pivot. It measures how strongly that weight turns the plank.'
        write: 'Moment $=$ weight $\times$ distance from pivot'
      - say: 'The principle of moments says that for balance, the clockwise moments about the pivot equal the anticlockwise moments.'
        write: 'Clockwise moments $=$ anticlockwise moments'
      - say: 'At the start the plank balances. P turns it anticlockwise and Q turns it clockwise, so P times a equals Q times b.'
        write: '$P \times a = Q \times b$'
      - section: 'After the change'
        say: 'Adding two P makes the load on the left three P. Its moment is three P times a. Since P times a equals Q times b, that is three times Q times b.'
        write: '$3P \times a = 3(Q \times b)$'
      - say: 'So the left moment is now three times the right moment, and the plank tips down on the P side.'
        write: 'Left moment too big ⇒ tips to the left'
      - section: 'The fix'
        say: 'To balance again, the left moment must come back down to Q times b. The load is now three times bigger, so its distance must be three times smaller. Move the three P load nearer to O, to a distance of a over three.'
        write: '$3P \times \dfrac{a}{3} = P \times a = Q \times b$'
      - section: 'Check'
        say: 'Check it with a see-saw. When a heavier child joins one side, that side shifts closer to the middle to balance.'
        write: 'Heavier side moves nearer the pivot ✓'
      - section: 'Answer'
        say: 'So the plank balances again by moving P nearer to O, which is option A.'
        write: '$\therefore$ move $P$ nearer to $O$'
        answer: true
    traps:
      B: 'You went for moving Q nearer to O. That makes the right hand moment even smaller, so the plank tips further on the P side.'
      C: 'You chose adding a weight Q to Q. That gives two Q times b, which is two P times a, still less than three P times a.'
      D: 'You picked moving P further from O. That makes the left hand moment even bigger, so the tilt gets worse.'
  11:
    moments:
      - section: 'The question'
        say: 'A flash of light crosses a glass plate less than a centimetre thick. How long does it take? Light slows down in glass, and that is the trap.'
        write: 'Light through a glass plate, time $t = ?$'
      - section: 'The data'
        say: 'The thickness of the plate, d, is zero point nine centimetres, and its refractive index n is one point five zero.'
        write: '$d = 0.9\ \text{cm}$, $n = 1.50$'
      - say: 'The speed of light in a vacuum, c, is three times ten to the power eight metres per second.'
        write: '$c = 3.0 \times 10^{8}\ \text{m s}^{-1}$'
      - section: 'The rule'
        say: 'Refractive index is the speed of light in vacuum over the speed in the medium. So n equals c over v, and v equals c over n.'
        write: '$n = \dfrac{c}{v}$,  so  $v = \dfrac{c}{n}$'
      - say: 'Then time equals distance over speed.'
        write: '$t = \dfrac{d}{v}$'
      - section: 'Convert to metres'
        say: 'The speed is in metres per second, so the thickness must be in metres. There are one hundred centimetres in a metre, so zero point nine centimetres is zero point zero zero nine metres, which is nine times ten to the power minus three metres.'
        write: '$d = 0.9\ \text{cm} = 0.009\ \text{m} = 9 \times 10^{-3}\ \text{m}$'
      - section: 'Substitute'
        say: 'The speed in glass is three times ten to the power eight over one point five, which is two times ten to the power eight metres per second.'
        write: '$v = \dfrac{3.0 \times 10^{8}}{1.50} = 2.0 \times 10^{8}\ \text{m s}^{-1}$'
      - say: 'So the time is nine times ten to the power minus three, over two times ten to the power eight.'
        write: '$t = \dfrac{9 \times 10^{-3}}{2.0 \times 10^{8}}$'
      - say: 'Nine over two is four point five, and ten to the minus three over ten to the eight is ten to the minus eleven, because we subtract the powers, minus three take away eight. So t is four point five times ten to the power minus eleven seconds.'
        write: '$t = 4.5 \times 10^{-11}\ \text{s}$'
      - section: 'Check'
        say: 'Check. In air it would take nine times ten to the power minus three over three times ten to the power eight, which is three times ten to the power minus eleven seconds. Light is slower in glass, so the time must be longer, and it is.'
        write: '$4.5 \times 10^{-11} > 3.0 \times 10^{-11}$ ✓'
      - section: 'Answer'
        say: 'So the pulse takes four point five times ten to the power minus eleven seconds, which is option B.'
        write: '$\therefore t = 4.5 \times 10^{-11}\ \text{s}$'
        answer: true
    traps:
      A: 'You went for three times ten to the power minus ten. That ignores the refractive index and also takes zero point nine centimetres as zero point zero nine metres. It is zero point zero zero nine metres, and light slows down in glass.'
      C: 'You chose three times ten to the power minus eleven. That divides the thickness by c, the speed in air. Light slows down to two times ten to the power eight in glass.'
      D: 'You picked four point five times ten to the power minus ten. The working is right but ten times too big, from a slip in changing zero point nine centimetres to metres.'
  12:
    moments:
      - section: 'The question'
        say: 'Open an old mains radio and you will find a small heavy transformer inside. What is it there to do?'
        write: 'Transformer in an a.c. radio set, purpose $= ?$'
      - section: 'The fact'
        say: 'The transformer in a mains radio steps the voltage down.'
        write: 'Radio transformer $=$ step-down'
      - section: 'The reason'
        say: 'The mains supply in Nigeria is about two hundred and thirty volts a c, but the circuits of a radio work on a few volts.'
        write: 'Mains $\approx 230\ \text{V}$ a.c.,  radio needs a few volts'
      - say: 'A transformer with fewer turns on its secondary brings the voltage down.'
        write: '$N_s < N_p$ ⇒ $V_s < V_p$'
      - say: 'Then a rectifier made of diodes changes that low a c to d c. The transformer itself does not do that.'
        write: 'Transformer steps down,  diodes rectify'
      - section: 'An example'
        say: 'The heavy block inside a phone charger adaptor or a radio is a step-down transformer.'
        write: 'Charger adaptor, radio set'
      - section: 'Answer'
        say: 'So the main purpose of the transformer is to step down the voltage, which is option D.'
        write: '$\therefore$ step down the voltage'
        answer: true
    traps:
      A: 'You went for increase power. A transformer can never give out more power than it takes in. It only changes the voltage.'
      B: 'You chose convert a c to d c. That is rectification, done by diodes. A transformer works only with a c.'
      C: 'You picked step up the voltage. The radio needs a lower voltage than the mains, not a higher one.'
  13:
    moments:
      - section: 'The question'
        say: 'A mercury atom gives out a photon of three point three electronvolts. What is its frequency? Electronvolts are not joules, so change them first.'
        write: 'Photon of 3.3 eV, frequency $f = ?$'
      - section: 'The data'
        say: 'The energy of the photon, E, is three point three electronvolts.'
        write: '$E = 3.3\ \text{eV}$'
      - say: 'Planck''s constant h is six point six times ten to the power minus thirty-four joule seconds.'
        write: '$h = 6.6 \times 10^{-34}\ \text{J s}$'
      - say: 'An electronvolt is a tiny unit of energy. One electronvolt is one point six times ten to the power minus nineteen joules.'
        write: '$1\ \text{eV} = 1.6 \times 10^{-19}\ \text{J}$'
      - section: 'The rule'
        say: 'Planck says the energy of a photon is Planck''s constant times its frequency. E equals h f, so f equals E over h.'
        write: '$E = hf$,  so  $f = \dfrac{E}{h}$'
      - section: 'Convert to joules'
        say: 'Planck''s constant is in joule seconds, so E must be in joules. To change electronvolts to joules, multiply by one point six times ten to the power minus nineteen. Three point three times one point six is five point two eight. So E is five point two eight times ten to the power minus nineteen joules.'
        write: '$E = 3.3 \times 1.6 \times 10^{-19} = 5.28 \times 10^{-19}\ \text{J}$'
      - section: 'Substitute'
        say: 'So f equals five point two eight times ten to the power minus nineteen, over six point six times ten to the power minus thirty-four.'
        write: '$f = \dfrac{5.28 \times 10^{-19}}{6.6 \times 10^{-34}}$'
      - say: 'Five point two eight over six point six is zero point eight. Ten to the minus nineteen over ten to the minus thirty-four is ten to the fifteen, because minus nineteen take away minus thirty-four is plus fifteen.'
        write: '$f = 0.8 \times 10^{15}$'
      - say: 'In standard form the first number must be between one and ten. So we move the point one place, and zero point eight times ten to the fifteen becomes eight point zero times ten to the power fourteen hertz.'
        write: '$f = 8.0 \times 10^{14}\ \text{Hz}$'
      - section: 'Check'
        say: 'Check. Eight times ten to the power fourteen hertz is violet light near the ultraviolet, which fits the bright lines of a mercury lamp.'
        write: 'Violet, near ultraviolet ✓'
      - section: 'Answer'
        say: 'So the frequency of the photon is eight point zero times ten to the power fourteen hertz, which is option D.'
        write: '$\therefore f = 8.0 \times 10^{14}\ \text{Hz}$'
        answer: true
    traps:
      A: 'You went for three point two times ten to the power fourteen. Check it backwards. A photon of that frequency carries only about one point three electronvolts, not three point three.'
      B: 'You chose three point one times ten to the power fourteen. Check it backwards. A photon of that frequency carries only about one point three electronvolts, not three point three.'
      C: 'You picked one point three times ten to the power fourteen. Check it backwards. A photon of that frequency carries only about half an electronvolt, not three point three.'
  14:
    moments:
      - section: 'The question'
        say: 'Uranium two three five takes in a neutron and splits into barium and krypton, with two X particles. What is X? We balance the numbers to find out.'
        write: '${}^{235}_{92}\text{U} + {}^{1}_{0}\text{n} \rightarrow {}^{144}_{56}\text{Ba} + {}^{90}_{36}\text{Kr} + 2\,{}^{A}_{Z}\text{X}$'
      - section: 'The symbols'
        say: 'The top number on each symbol is the mass number, the count of protons and neutrons. The bottom number is the atomic number, the count of protons, which is the charge.'
        write: 'Top $=$ mass number,  bottom $=$ atomic number'
      - say: 'We do not know X yet, so we call its mass number A and its atomic number Z.'
        write: 'X $= {}^{A}_{Z}\text{X}$'
      - section: 'The rule'
        say: 'In a nuclear reaction the mass numbers on top balance, and the atomic numbers at the bottom balance.'
        write: 'Top numbers balance,  bottom numbers balance'
      - section: 'Mass numbers'
        say: 'There are two X particles, so together they bring two A. Two hundred and thirty-five plus one equals one hundred and forty-four plus ninety plus two A.'
        write: '$235 + 1 = 144 + 90 + 2A$'
      - say: 'So two hundred and thirty-six equals two hundred and thirty-four plus two A. Taking two hundred and thirty-four from both sides, two A is two, and A is one.'
        write: '$236 = 234 + 2A$  ⇒  $A = 1$'
      - section: 'Atomic numbers'
        say: 'Now the bottom numbers. The neutron has atomic number zero, so ninety-two plus zero equals fifty-six plus thirty-six plus two Z.'
        write: '$92 + 0 = 56 + 36 + 2Z$'
      - say: 'So ninety-two equals ninety-two plus two Z, and Z is zero.'
        write: '$92 = 92 + 2Z$  ⇒  $Z = 0$'
      - section: 'Name it'
        say: 'A particle with mass number one and atomic number zero is a neutron. These two new neutrons keep the chain reaction going.'
        write: '${}^{1}_{0}\text{X} = {}^{1}_{0}\text{n}$, a neutron'
      - section: 'Answer'
        say: 'So X is a neutron, which is option B.'
        write: '$\therefore$ X is a neutron'
        answer: true
    traps:
      A: 'You went for an electron. An electron has mass number zero and atomic number minus one, so the top numbers would not balance.'
      C: 'You chose a neutrino. A neutrino has mass number zero, so the top numbers would come up two short.'
      D: 'You picked a proton. A proton has mass number one but atomic number one, and the bottom numbers already balance without any charge.'
  15:
    moments:
      - section: 'The question'
        say: 'How do you hide a delicate watch from a strong magnet nearby? The answer is a ring of one special metal.'
        write: 'Shield a material from a magnetic field with $?$'
      - section: 'The fact'
        say: 'A material is shielded from a magnetic field by keeping it inside a soft iron ring. We call it a magnetic screen.'
        write: 'Magnetic screen $=$ soft iron ring'
      - section: 'The reason'
        say: 'Soft iron lets magnetic field lines through it very easily. We say it is highly permeable, and permeability means how easily a material lets field lines pass through it.'
        write: 'Soft iron, high permeability'
      - say: 'So the field lines crowd into the iron and travel round the ring, instead of crossing the space inside it.'
        write: 'Field lines go round the ring, space inside stays field-free'
      - section: 'The others'
        say: 'Now the other choices. Copper and zinc are not magnetic, so field lines pass straight through them as if they were not there.'
        write: 'Copper, zinc ⇒ non-magnetic, no screening'
      - say: 'Steel is magnetic, but it is hard to magnetise and keeps its magnetism. It does not draw in the field lines as easily as soft iron, so it is a poor screen.'
        write: 'Steel ⇒ poor screen'
      - section: 'An example'
        say: 'Delicate watches and meters are protected inside soft iron cases, and a compass inside a soft iron ring stops feeling a magnet outside.'
        write: 'Soft iron cases for watches and meters'
      - section: 'Answer'
        say: 'So the material should be kept in a soft iron ring, which is option A.'
        write: '$\therefore$ soft iron ring'
        answer: true
    traps:
      B: 'You went for a loop of copper wire. Copper is not magnetic, so field lines pass straight through it.'
      C: 'You chose a zinc ring. Zinc is not magnetic, whatever its shape, so the field passes right through.'
      D: 'You picked a steel ring. Steel is magnetic, but it holds its magnetism and is a poor screen. Soft iron is the material we use.'
  16:
    moments:
      - section: 'The question'
        say: 'A ray goes from air into medium M. The angles on the diagram are measured from the surface. Snell''s law wants them from the normal, and that is the trap.'
        write: 'Refractive index of M, $n = ?$'
      - section: 'The data'
        say: 'The normal is the line drawn at right angles to the surface, so it makes ninety degrees with the surface.'
        write: 'Normal $\perp$ surface, $90^\circ$'
      - say: 'The incident ray makes thirty degrees with the surface. So its angle with the normal, the angle of incidence, is ninety minus thirty, which is sixty degrees.'
        write: '$i = 90^\circ - 30^\circ = 60^\circ$'
      - say: 'Inside M the ray makes sixty degrees with the surface. So the angle of refraction is ninety minus sixty, which is thirty degrees.'
        write: '$r = 90^\circ - 60^\circ = 30^\circ$'
      - section: 'The rule'
        say: 'Snell''s law says the refractive index is sine i over sine r.'
        write: '$n = \dfrac{\sin i}{\sin r}$'
      - section: 'Substitute'
        say: 'So n equals sine sixty over sine thirty.'
        write: '$n = \dfrac{\sin 60^\circ}{\sin 30^\circ}$'
      - say: 'Sine sixty is root three over two, and sine thirty is one half.'
        write: '$n = \dfrac{\sqrt{3}/2}{1/2}$'
      - say: 'Dividing by one half is the same as multiplying by two, so the halves cancel. So n equals root three, which is about one point seven three.'
        write: '$n = \sqrt{3} \approx 1.73$'
      - section: 'Check'
        say: 'Check. The ray bends towards the normal as it enters M, from sixty degrees to thirty. So M is denser than air, and n must be bigger than one. Root three is.'
        write: 'Bends towards normal ⇒ $n > 1$ ✓'
      - section: 'Answer'
        say: 'So the refractive index of M is root three, which is option B.'
        write: '$\therefore n = \sqrt{3}$'
        answer: true
    traps:
      A: 'You went for two over root three. That is one over sine sixty, which is not Snell''s law for these angles. Use sine i over sine r.'
      C: 'You chose one over root three. That uses the angles to the surface, which turns the ratio upside down. Measure both angles from the normal.'
      D: 'You picked two root three. That takes sine sixty as root three, but sine sixty is root three over two. Root three over two, divided by one half, is root three.'
  17:
    moments:
      - section: 'The question'
        say: 'A hot nail drops into a big pot of warm water. Heat flows, then stops. What must be equal when it stops?'
        write: 'Thermal equilibrium exists when $?$'
      - section: 'The fact'
        say: 'Two objects are in thermal equilibrium when they are at the same temperature.'
        write: 'Thermal equilibrium ⇔ equal temperatures'
      - section: 'The reason'
        say: 'Heat flows only from a hotter body to a colder one.'
        write: 'Heat flows hot → cold'
      - say: 'So when the temperatures are equal, neither body is hotter, and there is no net flow of heat.'
        write: 'Equal $T$ ⇒ no net flow'
      - say: 'This is true whatever the sizes or the materials of the two objects.'
        write: 'Size and material do not matter'
      - section: 'An example'
        say: 'A thermometer in your mouth gives your temperature only after it has come to the same temperature as your body.'
        write: 'Thermometer reads only when $T_{\text{thermometer}} = T_{\text{body}}$'
      - section: 'Remember'
        say: 'So temperature, not the quantity of heat, decides which way heat flows.'
        write: 'Temperature decides the direction of heat flow'
      - section: 'Answer'
        say: 'So thermal equilibrium exists when the temperatures of both objects are equal, which is option C.'
        write: '$\therefore$ equal temperatures'
        answer: true
    traps:
      A: 'You went for equal heat capacities. Objects with very different heat capacities can still be at the same temperature, and then no heat flows.'
      B: 'You chose equal quantities of heat. A big pot of warm water holds more heat than a small hot nail, yet heat still flows from the nail to the water.'
      D: 'You picked one object losing heat continuously. If heat keeps flowing, the objects are not yet in equilibrium.'
  18:
    moments:
      - section: 'The question'
        say: 'Pluck a guitar string and the wave seems to stand still. How is a stationary wave made, and what is true of it?'
        write: 'Characteristic of stationary waves $= ?$'
      - section: 'The fact'
        say: 'A stationary wave is formed when two identical waves travel in opposite directions and superpose. Superpose means they add together wherever they meet.'
        write: 'Two identical waves, opposite directions ⇒ stationary wave'
      - section: 'The reason'
        say: 'At some points the two waves always cancel. These are nodes, with zero displacement.'
        write: 'Node $=$ zero displacement'
      - say: 'At other points they always add up to the biggest displacement. These are antinodes.'
        write: 'Antinode $=$ maximum displacement'
      - section: 'Two more facts'
        say: 'The distance between two nodes next to each other is half a wavelength, lambda over two. Lambda is the symbol for wavelength.'
        write: 'Node to node $= \dfrac{\lambda}{2}$'
      - say: 'And the energy stays trapped between the nodes. It does not travel along the medium.'
        write: 'Energy is not carried along'
      - section: 'An example'
        say: 'For example, on a guitar string, the wave reflected from the end meets the incoming wave, and the two make the stationary wave. The air in a flute does the same.'
        write: 'Guitar string, air in a flute'
      - section: 'Answer'
        say: 'So stationary waves are formed by two identical waves travelling in opposite directions, which is option D.'
        write: '$\therefore$ formed by two identical waves travelling in opposite directions'
        answer: true
    traps:
      A: 'You went for the antinode as a point of minimum displacement. It is the other way round. The antinode has maximum displacement, and the node has zero.'
      B: 'You chose node to node as one wavelength. Two nodes next to each other are only half a wavelength apart.'
      C: 'You picked carrying energy along the medium. That is a progressive wave. A stationary wave keeps its energy between the nodes.'
  19:
    moments:
      - section: 'The question'
        say: 'Climb twenty kilometres up into the sky. How much air pressure is left? Many students give the drop instead of what is left.'
        write: 'Pressure at a height of 20 km $= ?$'
      - section: 'The data'
        say: 'The pressure at the ground is seven hundred and sixty millimetres of mercury.'
        write: '$P_0 = 760\ \text{mmHg}$ at 0 km'
      - say: 'The atmosphere ends at about eighty kilometres, so the pressure falls uniformly to zero there.'
        write: '$P = 0$ at 80 km'
      - say: 'We want the pressure at a height h of twenty kilometres.'
        write: '$h = 20\ \text{km}$'
      - section: 'The rule'
        say: 'Uniformly means every kilometre takes away the same amount of pressure. So the fall is proportional to the height climbed. Climb a fraction of the eighty kilometres, and you lose the same fraction of the seven hundred and sixty.'
        write: 'Fall $= \dfrac{h}{80\ \text{km}} \times 760\ \text{mmHg}$'
      - section: 'Substitute'
        say: 'Twenty over eighty is one quarter. So the fall is a quarter of seven hundred and sixty.'
        write: 'Fall $= \dfrac{20}{80} \times 760 = \dfrac{1}{4} \times 760$'
      - say: 'A quarter of seven hundred and sixty is one hundred and ninety millimetres of mercury.'
        write: 'Fall $= 190\ \text{mmHg}$'
      - section: 'What is left'
        say: 'The pressure left is seven hundred and sixty minus one hundred and ninety, which is five hundred and seventy millimetres of mercury.'
        write: '$P = 760 - 190 = 570\ \text{mmHg}$'
      - section: 'Check'
        say: 'Check. Twenty kilometres is a quarter of the way up, so three quarters of the pressure remains. Three quarters of seven hundred and sixty is five hundred and seventy.'
        write: '$\dfrac{3}{4} \times 760 = 570\ \text{mmHg}$ ✓'
      - section: 'Answer'
        say: 'So the pressure at twenty kilometres is five hundred and seventy millimetres of mercury, which is option B.'
        write: '$\therefore P = 570\ \text{mmHg}$'
        answer: true
    traps:
      A: 'You went for four hundred and eighty. That would be a fall of two hundred and eighty, more than a third of the pressure, at only a quarter of the height. A quarter of seven hundred and sixty is one hundred and ninety.'
      C: 'You chose one hundred and ninety. That is the drop in pressure. Take it away from seven hundred and sixty to get what is left.'
      D: 'You picked three hundred and eighty. That is half the pressure, which you would find halfway up, at forty kilometres.'
  20:
    moments:
      - section: 'The question'
        say: 'A hot metal drops into a calorimeter of water and warms both the water and the can. The can is easy to forget, and that is the trap.'
        write: 'Method of mixtures, specific heat capacity of the metal $c = ?$'
      - section: 'The data'
        say: 'The metal has mass zero point five kilograms and cools from one hundred to twenty-five degrees Celsius.'
        write: 'Metal $m = 0.5\ \text{kg}$, $100\ ^\circ\text{C} \rightarrow 25\ ^\circ\text{C}$'
      - say: 'The calorimeter has heat capacity C one, eighty joules per kelvin. Heat capacity is the heat needed to warm the whole object by one kelvin.'
        write: '$C_1 = 80\ \text{J K}^{-1}$'
      - say: 'The water has heat capacity C two, four hundred and twenty joules per kelvin.'
        write: '$C_2 = 420\ \text{J K}^{-1}$'
      - say: 'The calorimeter and the water both warm from fifteen to twenty-five degrees Celsius.'
        write: 'Calorimeter and water $15\ ^\circ\text{C} \rightarrow 25\ ^\circ\text{C}$'
      - section: 'The rule'
        say: 'A well lagged calorimeter loses no heat to the room. So the heat lost by the hot body equals the heat gained by the cold bodies.'
        write: 'Heat lost $=$ heat gained'
      - say: 'For the metal, heat is m c delta theta, where delta theta is its fall in temperature. For the calorimeter and the water, heat is heat capacity times delta theta, their rise in temperature.'
        write: '$m c\,\Delta\theta_{\text{metal}} = (C_1 + C_2)\,\Delta\theta_{\text{cold}}$'
      - section: 'Temperature changes'
        say: 'A change in degrees Celsius is the same size as a change in kelvin, so no conversion is needed. The metal falls from one hundred to twenty-five, which is seventy-five kelvin.'
        write: '$\Delta\theta_{\text{metal}} = 100 - 25 = 75\ \text{K}$'
      - say: 'The cold bodies rise from fifteen to twenty-five, which is ten kelvin.'
        write: '$\Delta\theta_{\text{cold}} = 25 - 15 = 10\ \text{K}$'
      - section: 'Heat gained'
        say: 'Heat gained is eighty plus four hundred and twenty, times ten. That is five hundred times ten, five thousand joules.'
        write: '$(80 + 420) \times 10 = 500 \times 10 = 5000\ \text{J}$'
      - section: 'Heat lost'
        say: 'Heat lost by the metal is zero point five times c times seventy-five, which is thirty-seven point five c.'
        write: '$0.5 \times c \times 75 = 37.5c$'
      - section: 'Solve'
        say: 'So thirty-seven point five c equals five thousand. Divide both sides by thirty-seven point five.'
        write: '$37.5c = 5000$'
      - say: 'Five thousand over thirty-seven point five is about one hundred and thirty-three joules per kilogram per kelvin.'
        write: '$c = \dfrac{5000}{37.5} \approx 133\ \text{J kg}^{-1}\,\text{K}^{-1}$'
      - section: 'Check'
        say: 'Check. Without the calorimeter, the heat gained would be only four hundred and twenty times ten, four thousand two hundred joules, and c would come out at only one hundred and twelve. That is too small, because the can took in heat too, so the metal gave out more.'
        write: 'Water only $\Rightarrow 112$, too small ✓'
      - section: 'Answer'
        say: 'So the specific heat capacity of the metal is one hundred and thirty-three joules per kilogram per kelvin, which is option C.'
        write: '$\therefore c \approx 133\ \text{J kg}^{-1}\,\text{K}^{-1}$'
        answer: true
    traps:
      A: 'You went for ninety-two. That is too small. The metal would then give out only about three thousand four hundred and fifty joules, but the water and the calorimeter take in five thousand.'
      B: 'You chose two hundred and eighty-six. That is too big. The metal would then give out about ten thousand seven hundred joules, more than twice the five thousand that the water and calorimeter take in.'
      D: 'You picked eight hundred and eighty-seven. That is far too big. The metal would then give out about thirty-three thousand joules, over six times the five thousand taken in.'
  21:
    moments:
      - section: 'The question'
        say: 'There are eight volts across the inductor and six volts across the resistor. Is the supply fourteen volts? On a c, it is not, and here is why.'
        write: 'Series a.c. circuit, supply voltage $V = ?$'
      - section: 'The data'
        say: 'The voltage across the inductor, V L, is eight volts r m s. R m s stands for root mean square, the effective value of an a c voltage.'
        write: '$V_L = 8\ \text{V}$ (r.m.s.)'
      - say: 'The voltage across the resistor, V R, is six volts r m s.'
        write: '$V_R = 6\ \text{V}$ (r.m.s.)'
      - section: 'The rule'
        say: 'In a series circuit the same current flows through both parts. The voltage across a resistor is in step with that current, so we say it is in phase.'
        write: '$V_R$ in phase with $I$'
      - say: 'But the voltage across an inductor reaches its peak a quarter of a cycle earlier. We say V L leads the current by ninety degrees.'
        write: '$V_L$ leads $I$ by $90^\circ$'
      - say: 'So the two voltages are ninety degrees apart, and they add like the two shorter sides of a right angled triangle. The supply voltage is the longest side, so by Pythagoras, V equals the square root of V R squared plus V L squared.'
        write: '$V = \sqrt{V_R^{2} + V_L^{2}}$'
      - section: 'Substitute'
        say: 'So V equals the square root of six squared plus eight squared.'
        write: '$V = \sqrt{6^{2} + 8^{2}}$'
      - say: 'Six squared is thirty-six and eight squared is sixty-four. Together they make one hundred.'
        write: '$V = \sqrt{36 + 64} = \sqrt{100}$'
      - say: 'The square root of one hundred is ten volts.'
        write: '$V = 10\ \text{V}$'
      - section: 'Check'
        say: 'Check. Ten volts is bigger than either part, but smaller than their plain sum of fourteen, as it must be for voltages ninety degrees out of step.'
        write: '$8 < 10 < 14$ ✓'
      - section: 'Answer'
        say: 'So the effective voltage of the supply is ten volts, which is option A.'
        write: '$\therefore V = 10\ \text{V}$'
        answer: true
    traps:
      B: 'You went for two volts. That subtracts eight minus six. The two voltages are ninety degrees apart, so they add by Pythagoras.'
      C: 'You chose fourteen volts. Adding eight and six works for resistors in series on d c, but an inductor voltage is ninety degrees out of step.'
      D: 'You picked forty-eight volts. That multiplies the two voltages, which has no meaning here. Use the square root of six squared plus eight squared.'
  22:
    moments:
      - section: 'The question'
        say: 'Blow across the top of an empty bottle and it hums. Where in that closed pipe does the air move the most?'
        write: 'Closed organ pipe, antinode always at $?$'
      - section: 'The fact'
        say: 'In a closed pipe, a node always forms at the closed end, and an antinode always forms at the open end.'
        write: 'Closed end $=$ node,  open end $=$ antinode'
      - section: 'The reason'
        say: 'The air at the closed end cannot move, so its displacement is zero. That is a node.'
        write: 'Closed end, air held still ⇒ node'
      - say: 'The air at the open end is free to move, so it vibrates the most. That is an antinode.'
        write: 'Open end, air free ⇒ antinode'
      - section: 'The simplest note'
        say: 'The simplest note has just one node and one antinode. A node and the next antinode are a quarter of a wavelength apart, so the pipe is a quarter of a wavelength long.'
        write: '$L = \dfrac{\lambda}{4}$'
      - section: 'An example'
        say: 'In the bottle, the bottom is the closed end and the mouth is the open end, where the air moves in and out the most.'
        write: 'Bottle, bottom $=$ node, mouth $=$ antinode'
      - section: 'Answer'
        say: 'So an antinode is always produced at the open end, which is option C.'
        write: '$\therefore$ the open end'
        answer: true
    traps:
      A: 'You went for the closed end. That is where the air is held still, so it is always a node, not an antinode.'
      B: 'You chose the middle. The middle is not always an antinode. That depends on which harmonic is sounding.'
      D: 'You picked all the parts of the pipe. Nodes and antinodes take turns along the pipe, so the whole pipe cannot be an antinode.'
  23:
    moments:
      - section: 'The question'
        say: 'Ice cubes melt in a cup of water. Is heat taken in or given out? Does the mass change? And does the volume grow or shrink? Ice is unusual here.'
        write: 'Ice changed to water at 0 °C, heat, mass and volume $= ?$'
      - section: 'The heat'
        say: 'To melt, ice must absorb latent heat of fusion. The heat breaks the structure of the ice without raising its temperature.'
        write: 'Melting absorbs latent heat, temperature stays 0 °C'
      - section: 'The mass'
        say: 'The mass cannot change, because no water is added or taken away. Only the state changes.'
        write: 'Mass stays constant'
      - section: 'The volume'
        say: 'Ice has an open, hexagonal structure. Liquid water packs more tightly, so the same mass takes up less space.'
        write: 'Ice → water, volume decreases'
      - section: 'An example'
        say: 'For example, ice takes up more space than the same mass of water, so it is less dense. That is why ice floats in a cup of water, and why a full bottle of water left in the freezer cracks as it freezes and expands.'
        write: 'Ice floats;  bottle in freezer cracks'
      - section: 'Remember'
        say: 'So remember it this way. Most solids expand when they melt, but ice shrinks.'
        write: 'Ice contracts on melting'
      - section: 'Answer'
        say: 'So latent heat is absorbed, the mass remains constant and the volume decreases, which is option B.'
        write: '$\therefore$ heat absorbed, mass constant, volume decreases'
        answer: true
    traps:
      A: 'You went for A. Latent heat is absorbed, yes, but the mass does not change on melting, and ice contracts as it melts.'
      C: 'You chose C. Melting takes in latent heat, it does not give it out, and the mass stays the same.'
      D: 'You picked D. The mass and volume are right, but giving out latent heat is freezing. Melting absorbs it.'
  24:
    moments:
      - section: 'The question'
        say: 'Three vectors make a triangle. Do they add up to zero? Only if the arrows chase each other all the way round. Let us follow them.'
        write: 'Vector triangle P, Q, R, relationship $= ?$'
      - section: 'The rule'
        say: 'The triangle law says to add two vectors, place them head to tail. The resultant runs from the tail of the first to the head of the second.'
        write: 'Head to tail, resultant from first tail to last head'
      - section: 'Read the diagram'
        say: 'Q starts at the bottom corner and ends at the right hand corner.'
        write: '$\mathbf{Q}$, bottom corner → right corner'
      - say: 'R starts at the right hand corner and ends at the top corner.'
        write: '$\mathbf{R}$, right corner → top corner'
      - section: 'Follow Q then R'
        say: 'So Q followed by R takes you from the bottom corner to the top corner. Q and R run head to tail.'
        write: '$\mathbf{Q} + \mathbf{R}$, bottom corner → top corner'
      - section: 'Compare with P'
        say: 'P also runs from the bottom corner to the top corner. So P is the resultant of Q and R.'
        write: '$\mathbf{P}$, bottom corner → top corner'
      - say: 'So P equals Q plus R.'
        write: '$\mathbf{P} = \mathbf{Q} + \mathbf{R}$'
      - section: 'Check'
        say: 'Check. P and Q both start at the bottom corner, so the three arrows do not run round the triangle in one direction. They cannot add up to zero.'
        write: '$\mathbf{P}$ and $\mathbf{Q}$ share a tail ⇒ not a closed loop ✓'
      - section: 'Answer'
        say: 'So the relationship is P equals Q plus R, which is option A.'
        write: '$\therefore \mathbf{P} = \mathbf{Q} + \mathbf{R}$'
        answer: true
    traps:
      B: 'You went for P equals Q minus R. That would need R reversed, pointing from the top corner down to the right hand corner.'
      C: 'You chose P equals R minus Q. That would need Q reversed, so the path would not start where P starts.'
      D: 'You picked P plus Q plus R equals zero. That is true only when all three arrows run round the triangle the same way. Here P and Q both start at the bottom corner.'
  25:
    moments:
      - section: 'The question'
        say: 'Two parallel wires carry currents the same way. Do they push apart or pull together? Here the rule for charges will mislead you.'
        write: 'Parallel currents, same direction, the conductors will $?$'
      - section: 'The fact'
        say: 'Two parallel conductors carrying currents in the same direction attract each other. Currents in opposite directions repel.'
        write: 'Same direction ⇒ attract,  opposite ⇒ repel'
      - section: 'The reason'
        say: 'Each wire sits in the magnetic field made by the other wire.'
        write: 'Each wire is in the other''s magnetic field'
      - say: 'Use Fleming''s left hand rule on one wire in the field of the other. The force on each wire points towards the other wire.'
        write: 'Fleming''s left-hand rule ⇒ force towards the other wire'
      - section: 'Remember'
        say: 'So remember it this way. Like currents attract and unlike currents repel. It is the opposite of charges and poles.'
        write: 'Like currents attract,  unlike currents repel'
      - section: 'Where it is used'
        say: 'This force between two wires is what scientists use to define the ampere.'
        write: 'The ampere is defined by this force'
      - section: 'Answer'
        say: 'So the conductors will attract each other, which is option B.'
        write: '$\therefore$ attract each other'
        answer: true
    traps:
      A: 'You went for repel. That is the rule for like charges. With currents, the wires repel only when the currents flow in opposite directions.'
      C: 'You chose both moving in the same direction. The forces on the two wires point towards each other, not the same way.'
      D: 'You picked no effect. Each current makes a magnetic field that pushes on the other wire, so there is always a force.'
  26:
    moments:
      - section: 'The question'
        say: 'Why is a leaf green in sunlight? Is green the colour it takes in or the colour it sends back to your eyes?'
        write: 'Why a green leaf looks green, which of I, II, III $?$'
      - section: 'The fact'
        say: 'An object looks the colour of the light it reflects. The other colours are absorbed.'
        write: 'Colour seen $=$ colour reflected'
      - section: 'Apply it'
        say: 'White sunlight contains all the colours. A green leaf absorbs red, orange, yellow, blue, indigo and violet, and reflects green into our eyes.'
        write: 'Absorbs all but green,  reflects green'
      - section: 'The statements'
        say: 'Statement two says it absorbs all colours except green. That is true.'
        write: 'II ✓'
      - say: 'Statement three says it reflects only the green. That is also true. It is the other half of the same explanation.'
        write: 'III ✓'
      - say: 'Statement one is the wrong way round. A leaf that absorbed only green would reflect the rest and look purplish.'
        write: 'I ✗'
      - section: 'Answer'
        say: 'So statements two and three only are correct, which is option B.'
        write: '$\therefore$ II and III only'
        answer: true
    traps:
      A: 'You went for one only. A leaf that absorbed the green would not look green. We see the colour that is reflected.'
      C: 'You chose one and two. Statement one is wrong, so any option that includes it is wrong.'
      D: 'You picked two only. Two is true, but three is the other half of the same explanation and must be included.'
  27:
    moments:
