  16:
    moments:
      - section: 'The question'
        say: 'An inductor and a resistor in series share one current. Which voltage keeps step with that current, and which one runs ahead of it?'
        write: '$L$ and $R$ in series, current $I$: which phasor diagram?'
      - section: 'The drawings'
        say: 'In all four diagrams the current I points to the right. In A, V R lies along I and V L points straight up. B is the same but with V L pointing down. C and D swap them, with V L along I and V R up or down.'
        write: 'A: $V_R$ along $I$, $V_L$ up;  B: $V_L$ down;  C and D: $V_L$ along $I$'
      - section: 'The rules'
        say: 'In a series circuit the same current flows through both parts. So we draw I as the reference, along the horizontal.'
        write: '$I$ = reference phasor, horizontal'
      - say: 'Across a resistor, the voltage is in phase with the current. So V R lies along I.'
        write: '$V_R$ in phase with $I$'
      - say: 'Across a pure inductor, the voltage leads the current by ninety degrees.'
        write: '$V_L$ leads $I$ by $90^\circ$'
      - say: 'Phasors turn anticlockwise, so leading by ninety degrees means pointing straight up.'
        write: 'Leading = a quarter turn anticlockwise = up'
      - section: 'Match the diagram'
        say: 'V R lies along I and V L points straight up. That is diagram A. The supply voltage is their sum, the square root of V R squared plus V L squared.'
        write: '$V = \sqrt{V_R^{2} + V_L^{2}}$'
      - section: 'Remember'
        say: 'Remember the word civil. In a capacitor, C, the current I comes before V. In an inductor, L, the voltage V comes before I.'
        write: 'CIVIL: in C, I leads V;  in L, V leads I'
      - section: 'Answer'
        say: 'So the correct phasor diagram is diagram A, which is option A.'
        write: '$\therefore$ Diagram A'
        answer: true
    traps:
      B: 'You went for diagram B, with V L pointing down. A voltage that lags the current by ninety degrees belongs to a capacitor, not an inductor.'
      C: 'You chose diagram C. It swaps them. The resistor voltage, not the inductor voltage, is in phase with the current.'
      D: 'You picked diagram D. It swaps the two voltages, and it also puts the perpendicular voltage lagging behind the current.'
