      - section: 'The working'
        say: 'Put in the numbers. W equals half, times eight times ten to the power minus six, times one hundred squared.'
        write: '$W = \tfrac{1}{2} \times 8 \times 10^{-6} \times 100^{2}$'
      - say: 'Half of eight is four. One hundred squared is ten to the power four.'
        write: '$W = 4 \times 10^{-6} \times 10^{4}$'
      - say: 'Add the powers. Minus six plus four is minus two, so W is four times ten to the power minus two joules.'
        write: '$W = 4.0 \times 10^{-2}$ J'
      - section: 'Check'
        say: 'Check. A small capacitor stores only a few hundredths of a joule, and the unit is the joule. It makes sense.'
        write: 'A few hundredths of a joule ✓'
      - section: 'Answer'
        say: 'So the energy stored is four times ten to the power minus two joules, which is option B.'
        write: '$\therefore W = 4.0 \times 10^{-2}$ J'
        answer: true
    traps:
      A: 'You went for one times ten to the power four joules. That is far too large. Half times eight times ten to the power minus six times one hundred squared is only four times ten to the power minus two joules.'
      C: 'You chose twelve point five joules. That is far too large for eight microfarads at one hundred volts. A small capacitor stores only a few hundredths of a joule.'
      D: 'You picked eighty joules. That is far too large for such a small capacitor. The working gives only four hundredths of a joule.'
