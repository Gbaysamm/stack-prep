  20:
    moments:
      - section: 'The data'
        say: 'The resistance is three ohms at the ice point, eight ohms at the steam point and six ohms now. How hot is it? Think of how far along the scale six ohms is.'
        write: '$R_0 = 3.0\ \Omega$, $R_{100} = 8.0\ \Omega$, $R_\theta = 6.0\ \Omega$, $\theta = ?$'
      - section: 'The law'
        say: 'The resistance of platinum rises evenly with temperature. So the temperature is the rise in resistance, over the rise from ice point to steam point, times one hundred degrees.'
        write: 'Rise in $R$ ÷ fundamental interval × 100 °C'
      - say: 'Theta equals R theta minus R nought, over R one hundred minus R nought, times one hundred.'
        write: '$\theta = \dfrac{R_\theta - R_0}{R_{100} - R_0} \times 100\ ^\circ\text{C}$'
      - section: 'The units'
        say: 'All the resistances are in ohms, so they cancel, and theta comes out in degrees Celsius.'
        write: 'Ohms cancel, so $\theta$ in °C'
      - section: 'The working'
        say: 'Put in the numbers. Six minus three is three on top. Eight minus three is five at the bottom.'
        write: '$\theta = \dfrac{6.0 - 3.0}{8.0 - 3.0} \times 100 = \dfrac{3.0}{5.0} \times 100$'
      - say: 'Three fifths of one hundred is sixty degrees Celsius.'
        write: '$\theta = 60\ ^\circ\text{C}$'
      - section: 'Check'
        say: 'Check. Six ohms lies between three and eight ohms, so the temperature must lie between zero and one hundred degrees. Sixty fits.'
        write: '$0 < 60 < 100$ ✓'
      - section: 'Answer'
        say: 'So the temperature of the medium is sixty degrees Celsius, which is option A.'
        write: '$\therefore \theta = 60\ ^\circ\text{C}$'
        answer: true
    traps:
      B: 'You went for eighty degrees. The fraction is three fifths, not four fifths. The rise is six minus three, which is three ohms.'
      C: 'You chose fifty degrees. That divides the rise of three ohms by six ohms. Divide by the interval, eight minus three, which is five ohms.'
      D: 'You picked thirty degrees. That treats the rise of three ohms as if it were three tenths. The scale runs over five ohms, not ten.'
  21:
    moments:
      - section: 'The question'
        say: 'There are four angles on one prism, and only one of them is the full turn the light makes. Where was the light going, and where does it end up going?'
        write: 'Which angle is the angle of deviation?'
      - section: 'The drawing'
        say: 'The ray enters face X Y and leaves face X Z, bending towards the base each time. The incident ray is carried on as a dashed line, and the emergent ray is traced back until the two meet.'
        write: 'Incident ray continued, emergent ray traced back, both dashed'
      - section: 'The definition'
        say: 'The angle of deviation is the angle between the direction of the incident ray and the direction of the emergent ray.'
        write: 'Deviation = angle between incident and emergent directions'
      - section: 'Test each angle'
        say: 'Theta one and theta two are at the entry point, so they belong to the first face only.'
        write: '$\theta_1$, $\theta_2$: at the first face'
      - say: 'Theta four is at the exit point, between the ray in the glass and the emergent ray. That is the second face only.'
        write: '$\theta_4$: at the second face'
      - say: 'Theta three is where the two dashed lines meet, between the continued incident direction and the emergent direction. That is the total turn.'
        write: '$\theta_3$: incident direction to emergent direction ✓'
      - section: 'The formula'
        say: 'For a prism, D equals i plus e minus A, where i and e are the angles of incidence and emergence, and A is the refracting angle at X.'
        write: '$D = i + e - A$'
      - section: 'Answer'
        say: 'So the angle of deviation is theta three, which is option B.'
        write: '$\therefore D = \theta_3$'
        answer: true
    traps:
      A: 'You went for theta two. That is only the bending at the first face, between the continued incident ray and the ray inside the glass.'
      C: 'You chose theta one. That is at the entry point, between the incident ray and the ray in the glass, on the base side.'
      D: 'You picked theta four. That is at the second face only, between the ray in the glass and the emergent ray.'
  22:
    moments:
      - section: 'The question'
        say: 'Pressure, force, power and density each have their own dimensions. Build pressure from scratch, and you cannot go wrong.'
        write: 'Dimension of pressure = ?'
      - section: 'The rule'
        say: 'Pressure is force per unit area. p equals F over A.'
        write: '$p = \dfrac{F}{A}$'
      - section: 'Build it up'
        say: 'Force is mass times acceleration. Acceleration is length over time squared, so force is M L T to the power minus two.'
        write: '$[F] = \text{M} \times \text{LT}^{-2} = \text{MLT}^{-2}$'
      - say: 'Area is length times length, so its dimension is L squared.'
        write: '$[A] = \text{L}^{2}$'
      - say: 'Now divide. M L T to the power minus two, over L squared. One L on top cancels one at the bottom, leaving L to the power minus one.'
        write: '$[p] = \dfrac{\text{MLT}^{-2}}{\text{L}^{2}} = \text{ML}^{-1}\text{T}^{-2}$'
      - section: 'Check'
        say: 'Check with units. Newtons per metre squared is kilograms per metre per second squared. That matches M L to the power minus one T to the power minus two.'
        write: '$\text{N m}^{-2} = \text{kg m}^{-1}\text{s}^{-2}$ ✓'
      - section: 'Answer'
        say: 'So the dimension of pressure is M L to the power minus one T to the power minus two, which is option C.'
        write: '$\therefore [p] = \text{ML}^{-1}\text{T}^{-2}$'
        answer: true
    traps:
      A: 'You went for M L squared T to the power minus three. That is the dimension of power, energy per second.'
      B: 'You chose M L T to the power minus two. That is force. Pressure divides it by an area.'
      D: 'You picked M L to the power minus three. That is density, mass per unit volume.'
  23:
    moments:
      - section: 'The data'
        say: 'We have a small eight microfarad capacitor at one hundred volts. Does it hold eighty joules, or a tiny fraction of a joule? The microfarad decides.'
        write: '$C = 8\ \mu\text{F}$, $V = 100$ V, $W = ?$'
      - section: 'The law'
        say: 'The energy stored in a capacitor is half the capacitance times the square of the potential difference. W equals half C V squared.'
        write: '$W = \tfrac{1}{2}CV^{2}$'
      - section: 'Convert to SI'
        say: 'Micro means ten to the power minus six. So eight microfarads is eight times ten to the power minus six farads.'
