# UTME 2017 Physics, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the Nigerian classroom way for Physics: the data with
# symbols and units, the law in words then written, any change to SI units in its own moment,
# the substitution one step per moment, the answer with its unit and a check, and the answer
# moment that names the option. traps gives one kind line for each wrong option.
#
#   say:    heard, not read. No symbols the voice would mangle; formulae read as a teacher reads
#           them, units and numbers in words.
#   write:  the one line written while it is said, with LaTeX between dollar signs.
#   answer: true on the moment that gives the answer.
#
# Keyed on question number, like explanations_2017.yaml. Answers match that file.
format_version: 1
exam_year: 2017
lessons:
  1:
    moments:
      - section: 'The data'
        say: 'An object is eight centimetres from a concave mirror whose focal length is only two centimetres. Where does the image form? Many students pick two centimetres, and that is a trap.'
        write: 'Concave mirror: $f = 2.0$ cm, $u = 8.0$ cm, $v = ?$'
      - section: 'The law'
        say: 'The mirror formula says one over f equals one over u plus one over v, with real distances taken as positive.'
        write: '$\dfrac{1}{f} = \dfrac{1}{u} + \dfrac{1}{v}$'
      - section: 'The units'
        say: 'Every length here is in centimetres. So we can work in centimetres, and the answer comes out in centimetres.'
        write: 'All lengths in cm, so $v$ comes out in cm'
      - section: 'The working'
        say: 'We want v by itself, so we take one over u to the other side. One over v equals one over f minus one over u.'
        write: '$\dfrac{1}{v} = \dfrac{1}{f} - \dfrac{1}{u}$'
      - say: 'Put in the numbers. One over v equals one over two minus one over eight.'
        write: '$\dfrac{1}{v} = \dfrac{1}{2.0} - \dfrac{1}{8.0}$'
      - say: 'The common denominator is eight. One half is four eighths, so we have four eighths minus one eighth, which is three eighths.'
        write: '$\dfrac{1}{v} = \dfrac{4 - 1}{8} = \dfrac{3}{8}$'
      - say: 'Now turn both sides upside down. v equals eight over three, which is two point six seven centimetres.'
        write: '$v = \dfrac{8}{3} = 2.67$ cm'
      - section: 'Check'
        say: 'Check. v is positive, so the image is real. It lies between F at two centimetres and C at four centimetres, which is right for an object placed beyond C.'
        write: 'F = 2 cm < $v$ = 2.67 cm < C = 4 cm ✓'
      - section: 'Answer'
        say: 'So the image is about two point seven centimetres from the mirror, which is option A.'
        write: '$\therefore v \approx 2.7$ cm'
        answer: true
    traps:
      B: 'You went for two point three centimetres. No step of the mirror formula gives that. One half minus one eighth is three eighths, so v is eight over three, which is two point seven.'
      C: 'You chose two point five centimetres. Eight over three is two point six seven, and that rounds to two point seven, not two point five.'
      D: 'You picked two centimetres, the focal length itself. The image only forms at F when the object is very far away, and eight centimetres is not far enough.'
  2:
    moments:
      - section: 'The question'
        say: 'Look at the prepaid meter in your house. When you buy units, what are you really buying?'
        write: 'PHCN bills electrical energy in which unit?'
      - section: 'The law'
        say: 'Electrical energy is power times time. E equals P t.'
        write: '$E = Pt$'
      - say: 'In S I units, power is in watts and time is in seconds, so energy is in joules. But one joule is a tiny amount of energy.'
        write: '$1\ \text{J} = 1\ \text{W} \times 1\ \text{s}$'
      - section: 'The bigger unit'
        say: 'So the electricity company uses a bigger unit. One kilowatt used for one hour is called one kilowatt hour.'
        write: '$1\ \text{kWh} = 1\ \text{kW} \times 1\ \text{h}$'
      - section: 'Convert to joules'
        say: 'In joules, that is one thousand watts times three thousand six hundred seconds, which is three point six times ten to the power six joules.'
        write: '$1\ \text{kWh} = 1000 \times 3600 = 3.6 \times 10^{6}\ \text{J}$'
      - section: 'An example'
        say: 'Each unit on your meter is one kilowatt hour. A one kilowatt pressing iron used for one hour uses one unit.'
        write: '1 unit on the meter = 1 kWh'
      - section: 'Remember'
        say: 'So remember it this way. The watt is power, the rate. The kilowatt hour is energy, the thing you pay for.'
        write: 'W = power;  kWh = energy (what is billed)'
      - section: 'Answer'
        say: 'So PHCN measures electrical energy in kilowatt hours, which is option B.'
        write: '$\therefore$ kWh'
        answer: true
    traps:
      A: 'You went for the watt hour. It is a unit of energy, but it is too small. A home uses thousands of watt hours, so the meter counts in kilowatt hours.'
      C: 'You chose the joule. It is the S I unit of energy, but a home uses millions of joules a day, so the bill would be full of huge numbers.'
      D: 'You picked the watt. The watt measures power, how fast energy is used, not the energy itself.'
  3:
    moments:
      - section: 'The data'
        say: 'Two forces at right angles give a resultant of fifty newtons, and one of them is thirty degrees from the resultant. How big is it? Ask yourself, can a part ever be bigger than the whole?'
        write: '$R = 50$ N, forces at $90^\circ$, $F$ at $30^\circ$ to $R$, $F = ?$'
      - section: 'The rule'
        say: 'Two forces at right angles are the components of their resultant. The component of R along a direction at angle theta to it is R cos theta.'
        write: '$F = R\cos\theta$'
      - section: 'The units'
        say: 'The resultant is already in newtons, the S I unit of force, so there is nothing to convert.'
        write: '$R$ in N, so $F$ in N'
      - section: 'The working'
        say: 'Put in R equals fifty newtons and theta equals thirty degrees.'
        write: '$F = 50\cos 30^\circ$'
      - say: 'Cos thirty degrees is zero point eight six six.'
        write: '$\cos 30^\circ = 0.866$'
      - say: 'Fifty times zero point eight six six is forty-three point three newtons.'
        write: '$F = 50 \times 0.866 = 43.3$ N'
      - section: 'Check'
        say: 'Check. The other force is fifty sin thirty, which is twenty-five newtons. Forty-three point three squared plus twenty-five squared is about two thousand five hundred, and its square root is fifty. It agrees.'
        write: '$\sqrt{43.3^{2} + 25^{2}} \approx \sqrt{2500} = 50$ N ✓'
      - section: 'Answer'
        say: 'So the force at thirty degrees to the resultant is forty-three point three newtons, which is option D.'
        write: '$\therefore F = 43.3$ N'
        answer: true
    traps:
      A: 'You went for one hundred newtons. That divides fifty by sin thirty. A component can never be bigger than the resultant it makes up.'
      B: 'You chose fifty-seven point seven newtons. That divides by cos thirty instead of multiplying. A component is always smaller than the resultant.'
      C: 'You picked twenty-five newtons. That is fifty sin thirty, the other force, which is at sixty degrees to the resultant.'
  4:
    moments:
      - section: 'The data'
        say: 'We have one thousand atoms and a half-life of twenty seconds. How long until only one hundred and twenty-five are left? Count carefully, because one extra halving is the trap.'
        write: '$N_0 = 1000$, $N = 125$, $T_{1/2} = 20$ s, $t = ?$'
      - section: 'The law'
        say: 'Half-life is the time for half of the undecayed atoms to decay. After n half-lives, N equals N nought times one half to the power n.'
        write: '$N = N_0\left(\tfrac{1}{2}\right)^{n}$'
      - section: 'The units'
        say: 'The half-life is in seconds, so the time will come out in seconds. There is nothing to convert.'
        write: '$T_{1/2}$ in s, so $t$ in s'
      - section: 'Count the half-lives'
        say: 'Halve step by step. One thousand becomes five hundred after one half-life.'
        write: '1000 → 500  (1 half-life)'
      - say: 'Five hundred becomes two hundred and fifty after two, and two hundred and fifty becomes one hundred and twenty-five after three.'
        write: '500 → 250 → 125  (3 half-lives), so $n = 3$'
      - section: 'The time'
        say: 'So the time is three half-lives, three times twenty seconds, which is sixty seconds.'
        write: '$t = nT_{1/2} = 3 \times 20 = 60$ s'
      - section: 'Check'
        say: 'Check. One half to the power three is one eighth, and one thousand divided by eight is one hundred and twenty-five. It agrees.'
        write: '$1000 \times \tfrac{1}{8} = 125$ ✓'
      - section: 'Answer'
        say: 'So it takes sixty seconds for one hundred and twenty-five atoms to remain, which is option C.'
        write: '$\therefore t = 60$ s'
        answer: true
    traps:
      A: 'You went for twenty seconds. That is only one half-life, which leaves five hundred atoms, not one hundred and twenty-five.'
      B: 'You chose forty seconds. Two half-lives leave two hundred and fifty atoms. We need one more halving.'
      D: 'You picked eighty seconds. That is four half-lives, which would leave only sixty-two and a half atoms, fewer than one hundred and twenty-five.'
  5:
    moments:
      - section: 'The question'
        say: 'Potential and field strength look almost the same on paper. One small power of r separates them. Which one is the potential?'
        write: 'Potential $V$ at distance $r$ from a charge $q$ = ?'
      - section: 'The definition'
        say: 'Electric potential at a point is the work done in bringing a unit positive charge from infinity to that point.'
        write: '$V$ = work done per unit positive charge, from infinity'
      - section: 'The formula'
        say: 'For a point charge q in a vacuum, the potential is q over four pi epsilon nought r.'
        write: '$V = \dfrac{q}{4\pi\varepsilon_0 r}$'
      - say: 'Epsilon nought is the permittivity of free space, a constant.'
        write: '$\varepsilon_0$ = permittivity of free space'
      - section: 'The reason'
        say: 'Potential is energy per unit test charge, so only the one charge q appears, not q squared. And it falls as one over r.'
        write: '$V \propto q$,  $V \propto \dfrac{1}{r}$'
      - section: 'Compare'
        say: 'Compare the field strength. E equals q over four pi epsilon nought r squared. Field goes with one over r squared, potential with one over r.'
        write: '$E = \dfrac{q}{4\pi\varepsilon_0 r^{2}}$  (field, not potential)'
      - section: 'Remember'
        say: 'So remember it this way. Potential has r, field has r squared.'
        write: 'Potential: $r$;  field: $r^{2}$'
      - section: 'Answer'
        say: 'So the potential is q over four pi epsilon nought r, which is option A.'
        write: '$\therefore V = \dfrac{q}{4\pi\varepsilon_0 r}$'
        answer: true
    traps:
      B: 'You went for q squared over four pi epsilon nought r squared. That is the shape of the force between two equal charges, not the potential of one charge.'
      C: 'You chose q over four pi epsilon nought r squared. That is the electric field strength, which falls as one over r squared. The potential falls as one over r.'
      D: 'You picked q squared over four pi epsilon nought r. The potential depends on q, not q squared, because it is energy per unit test charge.'
  6:
    moments:
      - section: 'The question'
        say: 'There are four graphs of current against voltage, and only one belongs to a transistor output. The trick is to ask what happens once the transistor is switched on.'
        write: 'Output characteristic: collector current $I$ against voltage $V$'
      - section: 'The drawings'
        say: 'Graph A is a straight line falling. Graph B is a curve, flat at first, then shooting up. Graph C is a straight line rising from the origin. Graph D rises steeply, then levels off.'
        write: 'A falls;  B flat then steep;  C straight rise;  D steep rise then flat'
      - section: 'The fact'
        say: 'The output characteristic plots the collector current against the collector emitter voltage, with the base current kept fixed.'
        write: '$I_C$ against $V_{CE}$, at fixed $I_B$'
      - section: 'The reason'
        say: 'At a very small voltage, the collector current rises steeply.'
        write: 'Small $V_{CE}$: $I_C$ rises steeply'
      - say: 'Once the voltage passes a few tenths of a volt, the current levels off. It is now fixed by the base current, not by the voltage.'
        write: 'Then $I_C \approx \beta I_B$, nearly constant'
      - section: 'An example'
        say: 'Think of the tap on a borehole tank. The tap, like the base current, sets the flow. Pressing harder on the water does not change it much.'
        write: 'Base current = the tap that sets the flow'
      - section: 'Match the graph'
        say: 'So the curve rises sharply from near the origin and then flattens out. That is graph D.'
        write: 'Graph D: steep rise, then flat ✓'
      - section: 'Answer'
        say: 'So the output characteristic of a transistor is graph D, which is option D.'
        write: '$\therefore$ Graph D'
        answer: true
    traps:
      A: 'You went for graph A, where the current falls as the voltage rises. No transistor output curve does that.'
      B: 'You chose graph B, the curve that is flat and then shoots up. That is the shape for a diode, or for the base emitter input characteristic, not the output.'
      C: 'You picked graph C, a straight line through the origin. That is an ohmic conductor, where the current is proportional to the voltage.'
  7:
    moments:
      - section: 'The question'
        say: 'Air in a room hardly conducts electricity at all. So why does a fluorescent tube light up? The secret is what we do to the gas inside.'
        write: 'Discharge tube: gas pumped out, so it conducts at ?'
      - section: 'The fact'
        say: 'A gas at ordinary atmospheric pressure is a very poor conductor of electricity.'
        write: 'Gas at atmospheric pressure: poor conductor'
      - section: 'The reason'
        say: 'When most of the gas is pumped out, the pressure is low. The few ions and electrons can then travel far between collisions.'
        write: 'Low pressure → long path between collisions'
      - say: 'Over that long path they gain enough energy from the field to knock electrons off more atoms. So more ions form, and a current flows.'
        write: 'Fast ions ionize more atoms → current flows'
      - say: 'This needs a high voltage across the tube, often thousands of volts. Pumping out the gas changes the pressure, not the voltage.'
        write: 'Needs high voltage;  pumping lowers the pressure'
      - section: 'An example'
        say: 'This is how the fluorescent tube in your classroom and the neon sign at a shop light up.'
        write: 'Fluorescent tube, neon sign: gas at low pressure'
      - section: 'Answer'
        say: 'So electricity is conducted at low pressure, which is option C.'
        write: '$\therefore$ low pressure'
        answer: true
    traps:
      A: 'You went for steady voltage. Pumping out the gas changes the pressure, not how steady the voltage is.'
      B: 'You chose high pressure. At high pressure the gas hardly conducts at all, which is why we pump it out.'
      D: 'You picked low voltage. A discharge tube needs a high voltage across it. Low pressure is what the pumping gives.'
  8:
    moments:
      - section: 'The question'
        say: 'The Moon shines brightly over the village at night. But does it make its own light? That question decides this one.'
        write: 'I Moon, II Sun, III street light, IV stars: which are natural sources?'
      - section: 'The definition'
        say: 'A natural source of light makes its own light, without any device made by people.'
        write: 'Natural source = makes its own light, not man-made'
      - say: 'A luminous body gives out its own light. A non-luminous body only reflects the light that falls on it.'
        write: 'Luminous: own light;  non-luminous: reflects light'
      - section: 'Test each one'
        say: 'The Sun and the stars are luminous. Nuclear fusion inside them makes them glow.'
        write: 'II Sun, IV stars: luminous and natural ✓'
      - say: 'The Moon is non-luminous. Moonlight is sunlight reflected from its surface.'
        write: 'I Moon: reflects sunlight ✗'
      - say: 'A street light is luminous, but people made it. So it is an artificial source.'
        write: 'III street light: artificial ✗'
      - section: 'Answer'
        say: 'So only the Sun and the stars, two and four, are natural sources, which is option D.'
        write: '$\therefore$ II and IV only'
        answer: true
    traps:
      A: 'You went for one, two and four. That counts the Moon because it looks bright, but the Moon only reflects sunlight.'
      B: 'You chose one, two and three. The Moon only reflects light, and a street light is made by people.'
      C: 'You picked three and four. A street light is artificial, and the Sun, the biggest natural source of all, is left out.'
  9:
    moments:
      - section: 'The question'
        say: 'Look into a clear well and the bottom seems closer than it really is. Why does the water fool your eyes?'
        write: 'Object at the bottom of a well looks raised. Why?'
      - section: 'The fact'
        say: 'Light from the object bends away from the normal as it passes from water into air, because light travels faster in air.'
        write: 'Water → air: the ray bends away from the normal'
      - say: 'Your eye traces the bent rays straight back. So they seem to come from a point higher up.'
        write: 'Eye traces the rays back → image raised'
      - section: 'The rule'
        say: 'The real depth divided by the apparent depth is the refractive index, which is four thirds for water.'
        write: '$n = \dfrac{\text{real depth}}{\text{apparent depth}} = \dfrac{4}{3}$'
      - section: 'The name'
        say: 'This bending of light as it crosses from one medium into another is called refraction.'
        write: 'Bending at a boundary = refraction'
      - section: 'An example'
        say: 'It is why a swimming pool or a borehole well always looks shallower than it really is.'
        write: 'Pools look shallower than they are'
      - section: 'Answer'
        say: 'So the object appears closer to the surface because of refraction, which is option A.'
        write: '$\therefore$ refraction'
        answer: true
    traps:
      B: 'You went for reflection. Reflection sends light back into the same medium, but here the light crosses from water into air.'
      C: 'You chose an inverter. An inverter is an electrical device that changes d c to a c. It has nothing to do with light.'
      D: 'You picked a magnifier. A magnifier is a lens, and no lens is needed here, only the water surface.'
  10:
    moments:
      - section: 'The data'
        say: 'A boy pulls a bag of rice with two newtons for three metres. Is the work six joules? Look at the angle first.'
        write: '$F = 2$ N at $60^\circ$ to the floor, $s = 3$ m, $W = ?$'
      - section: 'The law'
        say: 'Work done is the force in the direction of motion times the distance moved. W equals F s cos theta.'
        write: '$W = Fs\cos\theta$'
      - section: 'The units'
        say: 'The force is in newtons and the distance in metres, both S I units, so the work comes out in joules.'
        write: 'N and m are SI, so $W$ in J'
      - section: 'The working'
        say: 'Only the part of the pull along the floor moves the bag. That part is F cos sixty, two times zero point five, which is one newton.'
        write: '$F\cos 60^\circ = 2 \times 0.5 = 1$ N'
      - say: 'Now put in the numbers. W equals two times three times cos sixty.'
        write: '$W = 2 \times 3 \times \cos 60^\circ$'
      - say: 'Two times three is six, and six times zero point five is three joules.'
        write: '$W = 6 \times 0.5 = 3$ J'
      - section: 'Check'
        say: 'Check. Only part of the pull moves the bag forward, so the work must be less than six joules. Three joules fits.'
        write: '$3\ \text{J} < 6\ \text{J}$ ✓'
      - section: 'Answer'
        say: 'So the work done is three joules, which is option D.'
        write: '$\therefore W = 3$ J'
        answer: true
    traps:
      A: 'You went for six joules. That uses the whole two newtons. Only the part along the floor, two cos sixty which is one newton, does the work.'
      B: 'You chose four joules. No correct use of the angle gives four joules. Two times three times cos sixty is three.'
      C: 'You picked five joules. No use of the angle gives five joules. Even the wrong sin sixty gives about five point two. The part along the floor is one newton, so the work is three joules.'
  11:
    moments:
      - section: 'The data'
        say: 'Two heavy spheres sit less than half a metre apart. Do they pull on each other? Yes, but how strongly? Get ready for a very small number.'
        write: '$m_1 = 5.0$ kg, $m_2 = 10.0$ kg, $r = 0.3$ m, $F = ?$'
      - section: 'The law'
        say: 'Newton''s law of universal gravitation says the force between two masses is proportional to the product of the masses, and inversely proportional to the square of their distance apart.'
        write: '$F \propto \dfrac{m_1m_2}{r^{2}}$'
      - say: 'So F equals G m one m two over r squared, where G is six point six seven times ten to the power minus eleven newton metres squared per kilogram squared.'
        write: '$F = \dfrac{Gm_1m_2}{r^{2}}$,  $G = 6.67 \times 10^{-11}\ \text{N m}^{2}\ \text{kg}^{-2}$'
      - section: 'The units'
        say: 'The masses are in kilograms and the distance is in metres. They are all S I units already, so the force comes out in newtons.'
        write: 'kg and m are SI, so $F$ in N'
      - section: 'The working'
        say: 'First square the distance. Zero point three squared is zero point zero nine.'
        write: '$r^{2} = 0.3^{2} = 0.09\ \text{m}^{2}$'
      - say: 'Now the top. Five times ten is fifty, and fifty times six point six seven times ten to the power minus eleven is three point three three five times ten to the power minus nine.'
        write: '$Gm_1m_2 = 6.67 \times 10^{-11} \times 50 = 3.335 \times 10^{-9}$'
      - say: 'Divide by zero point zero nine. That gives three point seven one times ten to the power minus eight newtons.'
        write: '$F = \dfrac{3.335 \times 10^{-9}}{0.09} = 3.71 \times 10^{-8}$ N'
      - section: 'Check'
        say: 'Check. It is a tiny force, as we expect for everyday masses. Only planet-sized masses give large gravitational pulls.'
        write: 'Tiny force for everyday masses ✓'
      - section: 'Answer'
        say: 'So the force of attraction is three point seven one times ten to the power minus eight newtons, which is option B.'
        write: '$\therefore F = 3.71 \times 10^{-8}$ N'
        answer: true
    traps:
      A: 'You went for three point five seven times ten to the power minus eight. That does not come from the formula. Fifty times G divided by zero point zero nine is three point seven one.'
      C: 'You chose four point zero zero times ten to the power minus eight. That rounds three point seven one to one figure. To three figures, it is three point seven one.'
      D: 'You picked three point five zero times ten to the power minus eight. That does not come from the formula. Fifty times G over zero point zero nine gives three point seven one.'
  12:
    moments:
      - section: 'The question'
        say: 'Pour very hot water into a thin glass and a thick glass. You might expect the thick one to be stronger. Yet it is the thick one that cracks. Why?'
        write: 'Hot water in a thin and a thick tumbler: why does the thick one crack?'
      - section: 'The fact'
        say: 'Glass is a poor conductor of heat.'
        write: 'Glass: poor conductor of heat'
      - section: 'The reason'
        say: 'When hot water goes into the thick tumbler, the inner surface heats up and expands at once.'
        write: 'Inner surface: hot, expands at once'
      - say: 'But the heat takes time to reach the outer surface. So the outside stays cool and does not expand.'
        write: 'Outer surface: still cool, does not expand'
      - say: 'The inner layer pushes against the cold outer layer. This uneven expansion strains the glass until it cracks.'
        write: 'Uneven expansion → strain → crack'
      - section: 'The thin glass'
        say: 'A thin tumbler heats through almost at once, so it expands evenly and survives. That is why laboratory beakers are made thin.'
        write: 'Thin glass: heats through, expands evenly ✓'
      - section: 'Answer'
        say: 'So the thick tumbler cracks because of the uneven expansion of glass, which is option D.'
        write: '$\therefore$ uneven expansion of glass'
        answer: true
    traps:
      A: 'You went for even expansion. Even expansion causes no strain at all. The cracking comes from uneven expansion.'
      B: 'You chose glass is a good conductor. Glass is a poor conductor, and that is exactly why the expansion is uneven.'
      C: 'You picked glass is a crystal. Glass is not a crystal, and that has nothing to do with the cracking.'
  13:
    moments:
      - section: 'The question'
        say: 'A metal rod is stretched until something happens at the very end of the graph. What is X? Let us read the graph from the start, like a story.'
        write: 'Stress-strain graph for a metal rod: what is X?'
      - section: 'Read the graph'
        say: 'From the origin the graph is a straight line. Here Hooke''s law holds, and stress is proportional to strain.'
        write: 'Straight part: Hooke''s law, stress ∝ strain'
      - say: 'The straight line ends at the proportional limit, the first marked point.'
        write: 'First marked point: proportional limit'
      - say: 'Just after it comes the elastic limit, the second marked point. Beyond it, the rod no longer returns to its original length.'
        write: 'Second marked point: elastic limit'
      - say: 'The small dip after that is the yield point, where the metal suddenly stretches more with little extra stress.'
        write: 'The dip: yield point'
      - say: 'The curve then rises to the maximum stress. The rod thins at one place, and it snaps at the very end of the curve.'
        write: 'The peak: maximum stress, then the rod snaps'
      - section: 'The point X'
        say: 'That end point, X, is where the rod breaks. It is the breaking point.'
        write: 'X = end of the curve = breaking point'
      - section: 'Answer'
        say: 'So X represents the breaking point, which is option B.'
        write: '$\therefore$ X is the breaking point'
        answer: true
    traps:
      A: 'You went for yield point. The yield point is the small dip near the middle of the graph, just after the elastic limit, not the end.'
      C: 'You chose elastic limit. That is the second marked point, near the end of the straight part, far before X.'
      D: 'You picked proportional limit. That is where the straight line ends, the first marked point.'
  14:
    moments:
      - section: 'The question'
        say: 'Light and sound both reflect, refract and bend round corners. So how can we tell a transverse wave from a longitudinal one?'
        write: 'Which property tells transverse from longitudinal waves?'
      - section: 'The fact'
        say: 'Only transverse waves can be polarized.'
        write: 'Polarization: transverse waves only'
      - section: 'The reason'
        say: 'In a transverse wave the vibrations are at right angles to the direction of travel, so they can be in many planes.'
        write: 'Transverse: vibrations at right angles to travel, many planes'
      - say: 'A polarizing filter lets through the vibrations in just one plane.'
        write: 'A filter passes one plane only'
      - say: 'In a longitudinal wave the vibrations are along the direction of travel. There is no plane to filter.'
        write: 'Longitudinal: vibrations along travel, nothing to filter'
      - section: 'An example'
