# UTME 2018 Physics, lessons for the board.
#
# Each lesson is a run of MOMENTS taught the Nigerian classroom way: the data with symbols and
# units, the law in words then written, any conversion to SI units as its own moment, the
# substitution one step per moment, the answer with its unit and a check, and the answer moment
# that names the option. traps gives one kind line for each wrong option.
#
#   say:    heard, not read. No symbols the voice would mangle; formulae read aloud, units in words.
#   write:  the one line written while it is said, with LaTeX between dollar signs.
#   answer: true on the moment that gives the answer.
#
# Keyed on question number, like explanations_2018.yaml. Answers match that file.
format_version: 1
exam_year: 2018
lessons:
  1:
    moments:
      - section: 'The question'
        say: 'A man walks one kilometre east, then one kilometre north. How far is he from where he started, and in what direction? Many students just add the two walks, and that is the trap.'
        write: 'Walk 1 km E, then 1 km N. Displacement $= ?$'
      - section: 'The data'
        say: 'The east part x is one kilometre, and the north part y is one kilometre. We want the displacement s, its size and its direction.'
        write: '$x = 1$ km (east), $y = 1$ km (north), $s = ?$'
      - section: 'The law'
        say: 'Displacement is a vector, the straight line from start to finish. It has a size and a direction, so we must find both.'
        write: 'Displacement = straight line from start to finish'
      - say: 'The east walk and the north walk meet at a right angle. So the straight line from start to finish is the hypotenuse of a right-angled triangle, and we find it with Pythagoras.'
        write: 'The walks meet at 90° ⇒ the line home is the hypotenuse'
      - say: 'Pythagoras says s squared equals x squared plus y squared. So s equals the square root of x squared plus y squared.'
        write: '$s = \sqrt{x^{2} + y^{2}}$'
      - section: 'Substitute'
        say: 'Put in one and one. One squared plus one squared is two, so s is root two kilometres.'
        write: '$s = \sqrt{1^{2} + 1^{2}} = \sqrt{2}$ km'
      - say: 'The square root of two is about one point four one. So the man is about one point four one kilometres from his start.'
        write: '$s \approx 1.41$ km'
      - section: 'The direction'
        say: 'For the direction, measure the angle theta from north. The east part is the side opposite theta, and the north part is the side next to it. Tan theta is opposite over adjacent, so tan theta equals the east part over the north part, which is one over one.'
        write: '$\tan\theta = \dfrac{\text{east}}{\text{north}} = \dfrac{1}{1} = 1$'
      - say: 'The angle whose tangent is one is forty-five degrees. So the bearing is north forty-five degrees east.'
        write: '$\theta = 45^{\circ}$, so N 45° E'
      - section: 'Check'
        say: 'Check. The east and north parts are equal, so the line home must sit exactly half way between north and east. Half of ninety degrees is forty-five. Good.'
        write: 'Equal parts ⇒ half-way between N and E, 45° ✓'
      - section: 'Answer'
        say: 'So the displacement is root two kilometres, north forty-five degrees east, which is option A.'
        write: '$\therefore s = \sqrt{2}$ km, N 45° E'
        answer: true
    traps:
      B: 'You went for one kilometre. But the straight line home is the hypotenuse of the triangle, and the hypotenuse is always longer than either side.'
      C: 'You chose one kilometre at fifteen degrees. Both the size and the angle are off. Equal east and north parts give root two kilometres at forty-five degrees.'
      D: 'You picked D, and the size is right. But sixty degrees would need more east than north. Equal parts give forty-five degrees.'
  2:
    moments:
      - section: 'The question'
        say: 'Palm oil gets lighter for its size after frying. If none of it spills, does its volume grow or shrink? Let us work it out.'
        write: 'Palm oil before and after frying, new volume $= ?$'
      - section: 'The data'
        say: 'Before frying, the volume V one is four hundred centimetres cubed and the density rho one is zero point nine grams per centimetre cubed. After frying, the density rho two is zero point six grams per centimetre cubed.'
        write: '$V_1 = 400\ \text{cm}^{3}$, $\rho_1 = 0.9\ \text{g cm}^{-3}$, $\rho_2 = 0.6\ \text{g cm}^{-3}$, $V_2 = ?$'
      - section: 'The law'
        say: 'Density is mass per unit volume. Rho equals m over V.'
        write: 'Density $\rho = \dfrac{m}{V}$'
      - say: 'No oil is lost, so the mass stays the same before and after frying. That is the big idea here.'
        write: 'No oil lost ⇒ $m$ stays the same'
      - section: 'The units'
        say: 'All the units are grams and centimetres cubed. They match, so we can work in them directly with no conversion.'
        write: 'g and cm³ throughout, no conversion needed'
      - section: 'Substitute'
        say: 'First the mass. M equals rho one times V one, which is zero point nine times four hundred.'
        write: '$m = \rho_1 V_1 = 0.9 \times 400$'
      - say: 'Zero point nine times four hundred is three hundred and sixty grams.'
        write: '$m = 360$ g'
      - say: 'Now the new volume. Rho equals m over V, so V equals m over rho. With the new density, V two equals m over rho two, which is three hundred and sixty over zero point six.'
        write: '$V_2 = \dfrac{m}{\rho_2} = \dfrac{360}{0.6}$'
      - say: 'Three hundred and sixty divided by zero point six is six hundred centimetres cubed.'
        write: '$V_2 = 600\ \text{cm}^{3}$'
      - section: 'Check'
        say: 'Check. The oil became less dense, so the same mass must take up more room. Six hundred is more than four hundred. Good.'
        write: 'Less dense ⇒ bigger volume, $600 > 400$ ✓'
      - section: 'Answer'
        say: 'So the new volume of the oil is six hundred centimetres cubed, which is option B.'
        write: '$\therefore V_2 = 600\ \text{cm}^{3}$'
        answer: true
    traps:
      A: 'You went for three hundred and sixty. That is the mass of the oil in grams, not its new volume. Divide it by the new density to get the volume.'
      C: 'You chose two hundred and forty. That multiplies four hundred by zero point six and makes the oil shrink. A less dense oil with the same mass takes up more room.'
      D: 'You picked eight hundred. That would mean the density had halved, to zero point four five. It only fell to zero point six, so the volume grows one and a half times, to six hundred centimetres cubed.'
  3:
    moments:
      - section: 'The question'
        say: 'There are three statements about charge, and a fourth option that says all of them. Is each one true on its own? Let us test them one by one.'
        write: 'Which is true of electric charge?'
      - section: 'The fact'
        say: 'A neutral body has equal numbers of protons and electrons. Each proton carries a positive charge and each electron an equal negative charge, so the charges cancel.'
        write: 'Neutral = protons equal electrons'
      - say: 'Now, charging a body moves electrons only, because protons are locked inside the nucleus. So a body becomes charged by losing or gaining electrons.'
        write: 'Charging moves electrons only'
      - section: 'Test each one'
        say: 'A body that has lost electrons has a deficit of electrons. Its protons now outnumber its electrons, so it is positive. A is true.'
        write: 'Lost electrons ⇒ deficit ⇒ positive  (A ✓)'
      - say: 'A body that has gained electrons has an excess of electrons, so it is negative. B is true.'
        write: 'Gained electrons ⇒ excess ⇒ negative  (B ✓)'
      - say: 'In a metal wire the charge carriers are free electrons. So a current in a metal wire is a flow of electrons. C is true.'
        write: 'Metal wire: free electrons carry the current  (C ✓)'
      - section: 'An example'
        say: 'Rub a plastic comb on dry hair. Electrons move from your hair to the comb, so the comb becomes negative and can pick up small bits of paper.'
        write: 'Comb on dry hair: comb gains electrons ⇒ negative'
      - section: 'Answer'
        say: 'All three statements are true, so the answer is all of the above, which is option D.'
        write: '$\therefore$ A, B and C are all true'
        answer: true
    traps:
      A: 'You went for A. It is true, but B and C are true as well, so A alone is not the whole answer.'
      B: 'You chose B. It is true, but A and C are true as well, so B alone is not the whole answer.'
      C: 'You picked C. It is true, but A and B are true as well, so C alone is not the whole answer.'
  4:
    moments:
      - section: 'The question'
        say: 'An unstable nucleus breaks up all by itself. What comes out? One option leaves something out, and two bring in a stranger.'
        write: 'Natural radioactivity emits $?$'
      - section: 'The fact'
        say: 'Natural radioactivity is the spontaneous break up of unstable nuclei, such as uranium and radium.'
        write: 'Unstable nuclei (U, Ra) break up on their own'
      - say: 'Three radiations come out. First, alpha particles, which are helium nuclei.'
        write: 'α-particles = helium nuclei, $^{4}_{2}\text{He}$'
      - say: 'Second, beta particles, which are fast electrons.'
        write: 'β-particles = fast electrons'
      - say: 'Third, gamma rays, which are high energy electromagnetic waves.'
        write: 'γ-rays = high-energy electromagnetic waves'
      - section: 'The stranger'
        say: 'X-rays do not come from the nucleus. They are made in an X-ray tube, when fast electrons hit a metal target, as in the X-ray room at a hospital.'
        write: 'X-rays: fast electrons hit a metal target, not from the nucleus'
      - section: 'Remember'
        say: 'Remember the three Greek letters in order. They are alpha, beta and gamma.'
        write: 'Natural radioactivity: α, β, γ'
      - section: 'Answer'
        say: 'So natural radioactivity gives alpha particles, beta rays and gamma rays, which is option C.'
        write: '$\therefore$ α-particles, β-rays and γ-rays'
        answer: true
    traps:
      A: 'You went for A. Alpha and beta are right, but gamma rays are missing, and they usually come out with them.'
      B: 'You chose B. X-rays come from an X-ray tube, not from an unstable nucleus. And beta and gamma are missing.'
      D: 'You picked D. X-rays are not part of natural radioactivity, and alpha and beta are left out.'
  5:
    moments:
      - section: 'The question'
        say: 'Look at yourself in a plane mirror. Three of these options describe what you see. Which one does NOT?'
        write: 'Plane mirror image, which is NOT true?'
      - section: 'The facts'
        say: 'The image in a plane mirror is erect, which means upright.'
        write: 'Erect (upright)  (A describes it)'
      - say: 'It is laterally inverted, so left and right are swapped.'
        write: 'Laterally inverted  (B describes it)'
      - say: 'It is as far behind the mirror as the object is in front.'
        write: 'Image distance = object distance  (C describes it)'
      - say: 'And it is the same size as the object. The magnification of a plane mirror is one.'
        write: 'Same size, magnification $= 1$'
      - section: 'An example'
        say: 'At the barber''s shop, your face in the mirror is its real size, but your right hand looks like the left hand of the image.'
        write: 'Barber''s mirror: real size, left and right swapped'
      - section: 'The odd one out'
        say: 'The question asks what does NOT describe the image. The image is the same size as the object, not bigger, so magnified is the odd one out.'
        write: 'NOT true: magnified'
      - section: 'Answer'
        say: 'So the description that does not fit a plane mirror image is magnified, which is option D.'
        write: '$\therefore$ Magnified'
        answer: true
    traps:
      A: 'You went for erect. The image in a plane mirror is upright, so erect does describe it. The question asks for the one that does not.'
      B: 'You chose laterally inverted. Left and right are swapped in a plane mirror, so this does describe the image.'
      C: 'You picked C. The image is as far behind the mirror as the object is in front, so this does describe it.'
  6:
    moments:
      - section: 'The question'
        say: 'There are four resistors, but they are not all in a row. Two of them sit side by side, and that changes everything.'
        write: 'Resultant resistance of the circuit $= ?$'
      - section: 'The data'
        say: 'From the top terminal there is a three ohm resistor, then a pair of two ohm resistors side by side, then a four ohm resistor back to the bottom terminal.'
        write: '3 Ω, then 2 Ω ∥ 2 Ω, then 4 Ω,  $R = ?$'
      - section: 'The parallel pair'
        say: 'The two two ohm resistors share the same two junctions, so they are in parallel. For parallel, one over R p equals one over R one plus one over R two.'
        write: '$\dfrac{1}{R_p} = \dfrac{1}{R_1} + \dfrac{1}{R_2}$'
      - say: 'Put in two and two. One half plus one half is one.'
        write: '$\dfrac{1}{R_p} = \dfrac{1}{2} + \dfrac{1}{2} = 1$'
      - say: 'One over R p is one, so R p equals one ohm. Notice that two equal resistors in parallel give half of one of them.'
        write: '$R_p = 1\ \Omega$'
      - section: 'The series sum'
        say: 'Now the current goes through three ohms, then the one ohm pair, then four ohms, one after the other. Resistors in series simply add.'
        write: 'Series: $R = R_1 + R_2 + R_3$'
      - say: 'Three plus one plus four is eight ohms.'
        write: '$R = 3 + 1 + 4 = 8\ \Omega$'
      - section: 'Check'
        say: 'Check. The total must be more than any single resistor in the series chain, and eight ohms is more than four. Good.'
        write: '$8\ \Omega > 4\ \Omega$ ✓'
      - section: 'Answer'
        say: 'So the resultant resistance is eight ohms, which is option A.'
        write: '$\therefore R = 8\ \Omega$'
        answer: true
    traps:
      B: 'You went for eleven ohms. That adds all four resistors in a row, three plus two plus two plus four. But the two two ohm resistors are side by side, so together they give one ohm.'
      C: 'You chose four ohms. That is too small. The three ohm and four ohm resistors are in series with the rest, so the total must be more than four ohms. It is three plus one plus four.'
      D: 'You picked three point six ohms. That is less than the four ohm resistor alone, and that resistor is in series with the rest, so the total must be more. Only the two two ohm resistors are in parallel.'
  7:
    moments:
      - section: 'The question'
        say: 'A steam engine turns a generator, and the generator lights a lamp. Let us follow the energy from machine to machine.'
        write: 'Steam engine → generator → lamp: energy changes?'
      - section: 'The law'
        say: 'The law of conservation of energy says energy is never created or destroyed. It only changes from one form to another.'
        write: 'Conservation of energy: energy changes form, never lost'
      - section: 'Machine by machine'
        say: 'The steam engine burns fuel to make hot steam. That is heat energy.'
        write: 'Fuel burns, hot steam → heat'
      - say: 'The steam pushes the piston and turns the shaft. That is kinetic energy.'
        write: 'Piston and shaft move → kinetic'
      - say: 'The shaft turns the generator, which changes kinetic energy into electrical energy.'
        write: 'Generator → electricity'
      - say: 'The lamp filament gets hot and glows, so electricity becomes heat and light.'
        write: 'Lamp → heat and light'
      - section: 'An example'
        say: 'A diesel generator in your street does the same job, with burning diesel in place of steam.'
        write: 'Street generator: same chain'
      - section: 'Answer'
        say: 'So the chain is heat, then kinetic, then electricity, then heat and light, which is option B.'
        write: '$\therefore$ Heat → Kinetic → Electricity → Heat and Light'
        answer: true
    traps:
      A: 'You went for A. An engine does not make light or sound before it moves, and there is no electricity in that chain. The order is heat, kinetic, electricity, then heat and light.'
      C: 'You chose C. The chain starts with heat from the steam, not kinetic energy, and the lamp comes last, giving light.'
      D: 'You picked D. That starts with electricity, but the first machine is the steam engine, and it runs on heat.'
  8:
    moments:
      - section: 'The question'
        say: 'Cathode rays sound like light, but they bend towards a positive plate. What does that tell us about them?'
        write: 'Cathode rays are $?$'
      - section: 'The facts'
        say: 'Cathode rays are made in a discharge tube at very low pressure, with a high voltage across it.'
        write: 'Discharge tube, low pressure, high voltage'
      - say: 'They leave the cathode, the negative electrode, and travel in straight lines.'
        write: 'Leave the cathode (−), straight lines'
      - section: 'The reason'
        say: 'They are bent by electric and magnetic fields, towards the positive plate. So they carry negative charge.'
        write: 'Bent towards + plate ⇒ negative charge'
      - say: 'J J Thomson measured their charge to mass ratio and showed they are streams of electrons.'
        write: 'J. J. Thomson: $e/m$ ⇒ electrons'
      - section: 'An example'
        say: 'The old fat television set was a cathode ray tube. A beam of electrons painted the picture on the screen.'
        write: 'Old TV tube = cathode-ray tube'
      - section: 'Answer'
        say: 'So cathode rays are streams of electrons, which is option D.'
        write: '$\therefore$ streams of electrons'
        answer: true
    traps:
      A: 'You went for A. Electromagnetic waves carry no charge, so a field cannot bend them. Cathode rays are bent, so they are charged particles.'
      B: 'You chose protons. Protons are positive, but cathode rays are bent the way negative charges are.'
      C: 'You picked neutrons. Neutrons have no charge, so fields could not bend them, yet cathode rays are bent.'
  9:
    moments:
      - section: 'The question'
        say: 'Shine white light through a glass prism and a rainbow comes out. Where do the colours come from, and why do they spread?'
        write: 'Why does a prism split white light?'
      - section: 'The fact'
        say: 'White light is a mixture of colours, from red to violet.'
        write: 'White light = red, orange, yellow, green, blue, indigo, violet'
      - section: 'The law'
        say: 'The refractive index n tells us how much a material slows light down, and so how much it bends it. N equals c over v, the speed of light in air over its speed in the glass.'
        write: '$n = \dfrac{c}{v}$'
      - section: 'The reason'
        say: 'In glass, each colour travels at a different speed, so each colour has a slightly different refractive index.'
        write: 'Different speeds in glass ⇒ different $n$'
      - say: 'Violet is slowed most, so it is bent most. Red is slowed least, so it is bent least.'
        write: 'Violet bent most, red least'
      - say: 'Because each colour bends by a different amount, the colours separate. This spreading of white light into its colours is called dispersion.'
        write: 'Colours separate ⇒ dispersion'
      - section: 'An example'
        say: 'A rainbow after rain in Lagos is the same effect, with raindrops in place of the prism.'
        write: 'Rainbow: raindrops act as prisms'
      - section: 'Answer'
        say: 'So the colours separate because they travel at different speeds in glass, which is option C.'
        write: '$\therefore$ different colours, different speeds in glass'
        answer: true
    traps:
      A: 'You went for A. White light is indeed an electromagnetic wave, but that does not explain why the colours spread apart.'
      B: 'You chose B. The glass has no colours of its own. The colours were already in the white light.'
      D: 'You picked D. The light is refracted twice in the prism, on the way in and on the way out. It is not totally internally reflected.'
  10:
    moments:
      - section: 'The question'
        say: 'A block and tackle with six pulleys lifts one hundred and twenty newtons, but it is only forty percent efficient. How hard must we pull?'
        write: 'Load 120.0 N, efficiency 40%, effort $W = ?$'
      - section: 'The data'
        say: 'The load L is one hundred and twenty newtons. The efficiency is forty percent. There are three pulleys in each block, six in all.'
        write: '$L = 120.0$ N, efficiency $= 40\%$, 6 pulleys, $W = ?$'
      - section: 'Convert'
        say: 'Change the percentage to a decimal. Forty percent is zero point four.'
        write: '$40\% = 0.40$'
      - section: 'The velocity ratio'
        say: 'In a block and tackle, the velocity ratio is the number of rope strands holding the lower block. That equals the number of pulleys, so V R equals six.'
        write: 'VR = number of pulleys $= 6$'
      - section: 'The law'
        say: 'The mechanical advantage, M A, is the load divided by the effort. Efficiency equals the mechanical advantage over the velocity ratio. So M A equals the efficiency times V R.'
        write: 'Efficiency $= \dfrac{\text{MA}}{\text{VR}}$, so $\text{MA} = \text{efficiency} \times \text{VR}$'
      - say: 'Zero point four times six is two point four.'
        write: '$\text{MA} = 0.40 \times 6 = 2.4$'
      - say: 'Now we find the effort. Mechanical advantage is load over effort, so turning it round, the effort is the load divided by M A.'
        write: '$\text{MA} = \dfrac{\text{load}}{\text{effort}}$, so $W = \dfrac{L}{\text{MA}}$'
      - section: 'Substitute'
        say: 'One hundred and twenty divided by two point four is fifty newtons.'
        write: '$W = \dfrac{120.0}{2.4} = 50.0$ N'
      - section: 'Check'
        say: 'Check. A perfect machine would need only one hundred and twenty over six, which is twenty newtons. Friction and the lower block make us pull harder, and fifty is more than twenty. Good.'
        write: 'Ideal effort $= 120 \div 6 = 20$ N;  $50 > 20$ ✓'
      - section: 'Answer'
        say: 'So the effort W is fifty newtons, which is option D.'
        write: '$\therefore W = 50.0$ N'
        answer: true
    traps:
      A: 'You went for twenty-eight newtons. That is only a little more than the ideal twenty newtons, so it would mean an efficiency of about seventy-one percent, not forty. With V R six and M A two point four, the effort is fifty.'
      B: 'You chose forty-eight newtons. That is one hundred and twenty times zero point four, the load times the efficiency, and it forgets the velocity ratio.'
      C: 'You picked two hundred and eighty-eight newtons. That multiplies where it should divide. This machine helps us, so the effort must be less than the load.'
  11:
    moments:
      - section: 'The question'
        say: 'Two small nuclei go in, and one bigger nucleus and a neutron come out, with energy. Are the nuclei joining or splitting?'
        write: '$^{2}_{1}X + {}^{2}_{1}Y \rightarrow {}^{3}_{2}Z + {}^{1}_{0}n + \text{energy}$'
      - section: 'The data'
        say: 'In each symbol, the top number is the mass number, which counts the protons and neutrons together. The bottom number is the proton number.'
        write: 'Top number = mass number;  bottom number = proton number'
      - say: 'So each starting nucleus has a mass number of two and a proton number of one.'
        write: 'X, Y: mass number 2, proton number 1'
      - section: 'Balance'
        say: 'Check the top numbers first. Two plus two is four, and three plus one is four.'
        write: 'Mass numbers: $2 + 2 = 3 + 1$'
      - say: 'Now the bottom numbers. One plus one is two, and two plus zero is two. The equation balances.'
        write: 'Proton numbers: $1 + 1 = 2 + 0$ ✓'
      - section: 'The fact'
        say: 'Two light nuclei, each of mass number two, have made one heavier nucleus of mass number three. Light nuclei joining to make a heavier one is nuclear fusion. It is how the sun makes its energy.'
        write: 'Light nuclei join ⇒ fusion (the sun)'
      - say: 'Fission is the opposite. A heavy nucleus, such as uranium two three five, splits into two lighter ones.'
        write: 'Fission: heavy nucleus splits, e.g. $^{235}\text{U}$'
      - section: 'Remember'
        say: 'Remember it this way. Fusion fuses, which means joins. Fission splits.'
        write: 'Fusion = join;  fission = split'
      - section: 'Answer'
        say: 'So this is a fusion reaction, which is option A.'
        write: '$\therefore$ fusion reaction'
        answer: true
    traps:
      B: 'You went for fission. Fission splits a heavy nucleus, but here two light nuclei are joining.'
      C: 'You chose chain reaction. That is fission kept going by the neutrons it releases, not two small nuclei joining.'
      D: 'You picked radioactive decay. Decay starts from one unstable nucleus breaking up on its own, not two nuclei coming together.'
  12:
    moments:
      - section: 'The question'
        say: 'Ten kilograms of copper is warmed by one kelvin. Is that specific heat capacity, or just heat capacity? One small word decides.'
        write: '10 kg of copper, raised by 1 K. Heat needed = its $?$'
      - section: 'The definitions'
        say: 'Heat capacity is the heat needed to raise the temperature of a whole body by one kelvin. Its unit is joules per kelvin.'
        write: 'Heat capacity $C$ = heat for the whole body, 1 K;  unit J K⁻¹'
      - say: 'Specific heat capacity is the heat needed to raise one kilogram of a substance by one kelvin. Its unit is joules per kilogram per kelvin.'
        write: 'Specific heat capacity $c$ = heat for 1 kg, 1 K;  unit J kg⁻¹ K⁻¹'
      - section: 'The link'
        say: 'The two are linked. Heat capacity C equals m times c.'
        write: '$C = mc$'
      - say: 'Here the body is a whole ten kilogram lump. For example, the specific heat capacity of copper, from tables, is about three hundred and ninety joules per kilogram per kelvin. So C is ten times three hundred and ninety, about three thousand nine hundred joules per kelvin.'
        write: '$C = 10 \times 390 \approx 3900\ \text{J K}^{-1}$'
      - section: 'Remember'
        say: 'Remember, specific means per kilogram. Without the per kilogram, it is the heat capacity of that body.'
        write: 'Specific = per kilogram'
      - section: 'Answer'
        say: 'So the heat for ten kilograms of copper by one kelvin is its heat capacity, which is option C.'
        write: '$\therefore$ heat capacity'
        answer: true
    traps:
      A: 'You went for specific heat capacity. That is for one kilogram only, but this lump is ten kilograms.'
      B: 'You chose latent heat. Latent heat changes the state, as in melting, without changing the temperature. Here the temperature rises.'
      D: 'You picked internal energy. That is the total energy of all the molecules, not the heat needed for a one kelvin rise.'
  13:
    moments:
      - section: 'The question'
        say: 'We want to coat a surface with thirty-six grams of silver in just five minutes. How big a current do we need? Watch the minutes.'
        write: 'Silver plating, $I = ?$'
      - section: 'The data'
        say: 'The electrochemical equivalent z is zero point zero zero one two grams per coulomb. The mass m is thirty-six grams, and the time t is five minutes.'
        write: '$z = 0.0012\ \text{g C}^{-1}$, $m = 36.0$ g, $t = 5.0$ min, $I = ?$'
      - section: 'The law'
        say: 'Faraday''s first law says the mass deposited is proportional to the charge passed. The charge is the current I times the time t in seconds, so m equals z I t.'
        write: 'Faraday''s first law: $m = zIt$'
      - section: 'Convert to seconds'
        say: 'Change the time to seconds. Five minutes times sixty is three hundred seconds.'
        write: '$t = 5.0 \times 60 = 300$ s'
      - section: 'Substitute'
        say: 'Make I the subject. I equals m over z t.'
        write: '$I = \dfrac{m}{zt}$'
      - say: 'Put in the numbers. That gives thirty-six over zero point zero zero one two times three hundred.'
        write: '$I = \dfrac{36.0}{0.0012 \times 300}$'
      - say: 'Zero point zero zero one two times three hundred is zero point three six.'
        write: '$I = \dfrac{36.0}{0.36}$'
      - say: 'Thirty-six divided by zero point three six is one hundred amperes.'
        write: '$I = 100$ A'
      - section: 'Check'
        say: 'Check. One hundred amperes for three hundred seconds is thirty thousand coulombs, and thirty thousand times zero point zero zero one two is thirty-six grams. It works.'
        write: '$100 \times 300 = 30\,000$ C;  $30\,000 \times 0.0012 = 36$ g ✓'
      - section: 'Answer'
        say: 'So the current must be one hundred amperes, which is option B.'
        write: '$\therefore I = 100$ A'
        answer: true
    traps:
      A: 'You went for six thousand amperes. That uses five for the time and forgets to change five minutes into three hundred seconds.'
      C: 'You chose ten amperes. That works out zero point zero zero one two times three hundred as three point six, but it is zero point three six. One decimal place has slipped.'
      D: 'You picked one ampere. That is far too small. One ampere for three hundred seconds passes only three hundred coulombs, which deposits just zero point three six grams of silver, not thirty-six.'
  14:
    moments:
      - section: 'The question'
        say: 'Why does your shadow have sharp edges at noon? The very same reason explains an eclipse of the sun.'
        write: 'Shadows and eclipses come from $?$'
      - section: 'The fact'
        say: 'Light travels in straight lines. This is called rectilinear propagation.'
        write: 'Rectilinear propagation = light travels in straight lines'
      - section: 'The reason'
        say: 'An opaque object blocks the straight rays. The light cannot bend round it, so a dark region with sharp edges forms behind it. That is a shadow.'
        write: 'Blocked rays ⇒ shadow behind the object'
      - say: 'An eclipse is a giant shadow. In a solar eclipse, the moon blocks the sun''s rays from part of the earth.'
        write: 'Solar eclipse: moon between sun and earth'
      - say: 'In a lunar eclipse, the earth''s shadow falls on the moon.'
        write: 'Lunar eclipse: earth''s shadow on the moon'
      - section: 'An example'
        say: 'Stand in the sun at noon in the dry season. Your shadow on the ground has sharp edges, because light cannot bend round you.'
        write: 'Your shadow at noon: sharp edges'
      - section: 'Answer'
        say: 'So shadows and eclipses result from the rectilinear propagation of light, which is option D.'
        write: '$\therefore$ rectilinear propagation of light'
        answer: true
    traps:
      A: 'You went for refraction. Refraction is light bending as it crosses into a new material. It does not make shadows.'
      B: 'You chose reflection. Reflection is light bouncing off a surface. Shadows come from rays being blocked.'
      C: 'You picked diffraction. Diffraction is light spreading round edges, which would blur a shadow, not make a sharp one.'
  15:
    moments:
      - section: 'The question'
        say: 'Ohm''s law gives a straight line graph. Which of these materials keeps to that straight line?'
        write: 'Which obeys Ohm''s law at constant temperature?'
      - section: 'The law'
        say: 'Ohm''s law says the current in a conductor is directly proportional to the potential difference across it, as long as the temperature stays constant.'
        write: 'Ohm''s law: $I \propto V$ at constant temperature'
      - say: 'Written as a formula, V equals I R, with R staying constant.'
        write: '$V = IR$, $R$ constant'
      - section: 'Test each one'
        say: 'Metals such as copper wire give a straight line graph of V against I through the origin, when kept at constant temperature. They are ohmic.'
        write: 'Metals: straight line through the origin ⇒ ohmic'
      - say: 'A diode lets current flow mainly one way, so its graph is a curve. It is non ohmic.'
        write: 'Diode: curved graph ⇒ non-ohmic'
      - say: 'Electrolytes are liquids that conduct, such as salt solution. Some of them obey the law, but not every one does.'
        write: 'Electrolytes: not all obey it'
      - say: 'Glass is an insulator at ordinary temperatures. It hardly conducts at all, so it gives no such straight line.'
        write: 'Glass: insulator'
      - section: 'An example'
        say: 'The copper cable from a NEPA pole to your house carries a current in step with the voltage, as long as it stays cool.'
        write: 'Copper cable: ohmic'
      - section: 'Answer'
        say: 'So all metals at constant temperature obey Ohm''s law, which is option A.'
        write: '$\therefore$ all metals'
        answer: true
    traps:
      B: 'You went for diode only. A diode is non ohmic. It conducts well one way and hardly at all the other way.'
      C: 'You chose all electrolytes. Some electrolytes do not obey Ohm''s law, so all of them is too much.'
      D: 'You picked glass. Glass is an insulator and hardly conducts at all at ordinary temperatures.'
  16:
    moments:
      - section: 'The question'
        say: 'There are three statements about isotopes. Many students doubt the first one, but read its reason carefully.'
        write: 'Isotopes, which of I, II, III are true?'
      - section: 'The definition'
        say: 'Isotopes are atoms of the same element with the same number of protons but different numbers of neutrons. Chlorine thirty-five and chlorine thirty-seven are an example.'
        write: '$^{35}_{17}\text{Cl}$ and $^{37}_{17}\text{Cl}$: same protons, different neutrons'
      - section: 'Test each one'
        say: 'Statement three says isotopes have the same number of protons. That is the definition itself, so it is true.'
        write: 'III. same number of protons ✓'
      - say: 'Statement one says isotopes have the same chemical properties because they have the same number of electrons. First, the same number of protons means the same number of electrons in the neutral atom.'
        write: 'Same protons ⇒ same electrons'
      - say: 'Chemistry depends on the electrons, so isotopes have the same chemical properties. Statement one is true.'
        write: 'I. same electrons ⇒ same chemistry ✓'
      - say: 'Statement two says isotopes are separated by physical properties. Because their chemistry is the same, isotopes cannot be separated chemically. They are separated by physical properties that depend on mass, such as diffusion or a mass spectrometer. It is true.'
        write: 'II. separated by physical means (diffusion, mass spectrometer) ✓'
      - section: 'Answer'
        say: 'All three statements are true, so the answer is one, two and three, which is option D.'
        write: '$\therefore$ I, II and III'
        answer: true
    traps:
      A: 'You went for one and two only. That leaves out statement three, which is the very definition of isotopes.'
      B: 'You chose one and three only. That leaves out statement two. Isotopes are separated by physical means because their chemistry is the same.'
      C: 'You picked two and three only. That leaves out statement one, but its reason is exactly right. The same number of electrons gives the same chemistry.'
  17:
    moments:
      - section: 'The question'
        say: 'A block on a table is pulled by a hanging mass, and it is just about to slide. Which force pulls it, and which force holds it back?'
        write: 'Block $m_1$ on the verge of sliding, $\mu = ?$'
      - section: 'The data'
        say: 'Mass m one is on the table, and mass m two hangs from the string over the pulley. Block m one is on the verge of sliding.'
        write: '$m_1$ on the table, $m_2$ hanging, $\mu = ?$'
      - section: 'The law'
        say: 'When a block is on the verge of sliding, friction has reached its limiting value. Limiting friction F equals mu times R, where R is the normal reaction.'
        write: 'Limiting friction $F = \mu R$'
      - say: 'On a level table the normal reaction equals the weight of the block. So R equals m one g, and F equals mu m one g.'
        write: '$R = m_1 g$, so $F = \mu m_1 g$'
      - section: 'The pull'
        say: 'The hanging mass is still at rest, so the tension in the string equals its weight. T equals m two g, and this tension pulls m one.'
        write: '$T = m_2 g$'
      - section: 'Balance'
        say: 'The block is not yet moving, so the pull balances the friction. Mu m one g equals m two g.'
        write: '$\mu m_1 g = m_2 g$'
      - say: 'The g appears on both sides, so it cancels. Mu equals m two over m one.'
        write: '$\mu = \dfrac{m_2}{m_1}$'
      - section: 'Check'
        say: 'Check. Mu is a ratio of two forces, so it has no unit. M two over m one is a mass over a mass, a pure number. Good.'
        write: '$\mu$ has no unit, and neither has $\dfrac{m_2}{m_1}$ ✓'
      - section: 'Answer'
        say: 'So the coefficient of static friction is m two over m one, which is option C.'
        write: '$\therefore \mu = \dfrac{m_2}{m_1}$'
        answer: true
    traps:
      A: 'You went for m one over m two. That is upside down. It is the hanging mass over the mass on the table.'
      B: 'You chose m one g over m two. That is upside down, and the g should cancel because it appears on both sides.'
      D: 'You picked m two g over m one. The g should cancel. Left in, it gives a unit of metres per second squared, but a coefficient of friction has no unit.'
  18:
    moments:
      - section: 'The question'
        say: 'On a hot afternoon the road ahead seems to shine like water, but it is dry. Which statements explain this mirage?'
        write: 'Mirage, which of I, II, III explain it?'
      - section: 'The air layers'
        say: 'On a hot afternoon the road heats the air just above it. Hot air is less dense and has a lower refractive index.'
        write: 'Hot air near the road ⇒ lower refractive index'
      - say: 'Higher up, the air is cooler and denser. So the air lies in layers, and its refractive index rises steadily with height. Statement one is true.'
        write: 'I. layers with varying refractive index ✓'
      - section: 'The bending'
        say: 'Light from the sky heading down passes from denser to less dense layers. It bends further and further away from the normal.'
        write: 'Denser → less dense ⇒ bends away from the normal'
      - say: 'Close to the road, the angle passes the critical angle, and the light is totally internally reflected upwards into your eyes. Statement three is true.'
        write: 'III. reflected upwards near the road ✓'
      - say: 'The road itself does not become a mirror. The bending happens in the air. Statement two is false.'
        write: 'II. road a good reflector ✗'
      - section: 'An example'
        say: 'You see the sky as a shiny patch on the road, like water. That is the mirage ahead of a danfo on the Lagos Ibadan expressway.'
        write: 'Shiny patch of sky on the road = mirage'
      - section: 'Answer'
        say: 'So the mirage is explained by statements one and three only, which is option A.'
        write: '$\therefore$ I and III only'
        answer: true
    traps:
      B: 'You went for two and three. Statement two is false. The road does not become a mirror. The layers of air do the work.'
      C: 'You chose two only. Statement two is false, and one and three are the ones that explain the mirage.'
      D: 'You picked all three. Statement two is false, because the bending and reflecting happen in the air, not at the road surface.'
  19:
    moments:
      - section: 'The question'
        say: 'Mercury in a U-tube is pushed down on one side by a gas. Is the gas pressure above or below the air outside?'
        write: 'Pressure of the gas in G $= ?$'
      - section: 'The data'
        say: 'Atmospheric pressure H is seven hundred and sixty millimetres of mercury. The mercury stands ten centimetres high in the open limb, and three centimetres high in the limb joined to G.'
        write: '$H = 760$ mmHg;  open limb 10 cm, gas limb 3 cm'
      - section: 'The law'
        say: 'In a manometer, the side with the higher pressure pushes its mercury down. Here the gas side is lower, so the gas pushes harder than the air.'
        write: 'Higher pressure pushes mercury down ⇒ gas > air'
      - say: 'So the gas pressure equals atmospheric pressure plus the difference in levels. P equals H plus h.'
        write: '$P = H + h$'
      - section: 'The difference'
        say: 'The difference in levels h is ten minus three, which is seven centimetres.'
        write: '$h = 10 - 3 = 7$ cm'
      - section: 'Convert'
        say: 'The pressures are in millimetres of mercury, so change seven centimetres into millimetres. Seven centimetres is seventy millimetres.'
        write: '$h = 7$ cm $= 70$ mm of mercury'
      - section: 'Substitute'
        say: 'Seven hundred and sixty plus seventy is eight hundred and thirty millimetres of mercury.'
        write: '$P = 760 + 70 = 830$ mmHg'
      - section: 'Check'
        say: 'Check. The gas pushed its mercury down, so it must be above atmospheric pressure. Eight hundred and thirty is more than seven hundred and sixty. Good.'
        write: '$830 > 760$ ✓'
      - section: 'Answer'
        say: 'So the pressure of the gas in G is eight hundred and thirty millimetres of mercury, which is option B.'
        write: '$\therefore P = 830$ mmHg'
        answer: true
    traps:
      A: 'You went for six hundred and sixty. That subtracts one hundred millimetres. The difference in levels is seven centimetres, and the gas is above atmospheric pressure.'
      C: 'You chose six hundred and ninety. That subtracts the seventy millimetres instead of adding it. The gas pushes harder than the air, so we add.'
      D: 'You picked eight hundred and sixty. That adds one hundred millimetres, but the difference in levels is ten minus three, which is seven centimetres.'
  20:
    moments:
      - section: 'The question'
        say: 'Which of these cells can turn the starter motor of a car? That one has the lowest internal resistance.'
        write: 'Lowest internal resistance when new?'
      - section: 'The fact'
        say: 'Internal resistance is the resistance of the materials inside a cell. The lower it is, the bigger the current the cell can give.'
        write: 'Low internal resistance ⇒ large current'
      - section: 'The reason'
        say: 'The lead acid accumulator has large lead plates close together in sulphuric acid, which is a very good conductor.'
        write: 'Accumulator: big lead plates, close together, in $\text{H}_2\text{SO}_4$'
      - say: 'So its internal resistance is tiny, about zero point zero one ohms.'
        write: '$r \approx 0.01\ \Omega$'
      - section: 'An example'
        say: 'That is why a car battery can give the hundred or more amperes that a starter motor needs.'
        write: 'Car battery: 100 A or more for the starter'
      - section: 'The others'
        say: 'The Leclanché cell, the torch battery and the Daniell cell have much higher internal resistances, from about half an ohm to several ohms.'
        write: 'Leclanché, torch battery, Daniell: about 0.5 Ω to several ohms'
      - section: 'Answer'
        say: 'So the accumulator has the lowest internal resistance, which is option D.'
        write: '$\therefore$ accumulator'
        answer: true
    traps:
      A: 'You went for the Leclanché cell. Its internal resistance is fairly high, and it polarises quickly.'
      B: 'You chose the Daniell cell. Its internal resistance is much higher than that of an accumulator.'
      C: 'You picked the torch battery. A dry torch battery has a high internal resistance, so it gives only small currents.'
  21:
    moments:
      - section: 'The question'
        say: 'A singer goes from a low note to a high note. What changed in the sound wave? That is what pitch depends on.'
        write: 'Pitch increases when $?$'
      - section: 'The fact'
        say: 'Pitch is how high or low a note sounds. It depends on frequency. The higher the frequency, the higher the pitch.'
        write: 'Pitch depends on frequency $f$'
      - say: 'Loudness is different. It depends on the amplitude and the intensity of the wave, not on the pitch.'
        write: 'Loudness depends on amplitude and intensity'
      - section: 'An example'
        say: 'Tighten a guitar string and it vibrates faster. Its frequency rises, and so does its pitch.'
        write: 'Tighter string ⇒ higher $f$ ⇒ higher pitch'
      - section: 'Remember'
        say: 'Remember it this way. Pitch goes with frequency, and loudness goes with amplitude.'
        write: 'Pitch ↔ frequency;  loudness ↔ amplitude'
      - section: 'Answer'
        say: 'So the pitch is increased by increasing the frequency, which is option C.'
        write: '$\therefore$ increase the frequency'
        answer: true
    traps:
      A: 'You went for decreasing the loudness. Loudness and pitch are separate. A quieter note keeps the same pitch.'
      B: 'You chose increasing the amplitude. A bigger amplitude makes the note louder, not higher.'
      D: 'You picked decreasing the intensity. Intensity sets the loudness, not the pitch.'
  22:
    moments:
      - section: 'The question'
        say: 'Inside a nuclear power station, one split nucleus sets off another, and another. What makes that possible?'
        write: 'A feature of nuclear fission $?$'
      - section: 'The fact'
        say: 'In fission, a heavy nucleus such as uranium two three five absorbs a neutron and splits into two lighter nuclei.'
        write: '$^{235}\text{U} + n \rightarrow$ two lighter nuclei'
      - say: 'Each split releases energy and two or three new neutrons.'
        write: '+ energy + 2 or 3 neutrons'
      - section: 'The reason'
        say: 'Those neutrons can split more uranium nuclei, which release more neutrons. This self sustaining process is a chain reaction.'
        write: 'Neutrons split more nuclei ⇒ chain reaction'
      - say: 'The lighter nuclei that are made, the products, are radioactive.'
        write: 'Products radioactive'
      - say: 'And the total mass of the products is slightly less than the mass of the reactants. Some mass is lost.'
        write: 'Products'' mass < reactants'' mass, some mass lost'
      - section: 'The law'
        say: 'The lost mass becomes energy, by E equals m c squared.'
        write: '$E = mc^{2}$'
      - section: 'An example'
        say: 'A nuclear power station controls this chain reaction to make steady heat for its generators.'
        write: 'Nuclear power station: controlled chain reaction'
      - section: 'Answer'
        say: 'So a feature of fission is that it leads to a chain reaction, which is option A.'
        write: '$\therefore$ it leads to a chain reaction'
        answer: true
    traps:
      B: 'You went for B. Fission products are strongly radioactive, which is why nuclear waste is dangerous.'
      C: 'You chose C. Neutrons are released, two or three in each fission, and they keep the chain going.'
      D: 'You picked D. If no mass were lost, no energy would be released. Some mass is lost, and it becomes energy.'
  23:
    moments:
      - section: 'The question'
        say: 'The question gives the linear expansivity of brass, but asks about its volume. Many students forget the link, and that is the trap.'
        write: 'Brass, volume at 100 °C $= ?$'
      - section: 'The data'
        say: 'The linear expansivity alpha is two times ten to the power minus five per degree Celsius. The volume at zero degrees, V nought, is fifteen point zero zero centimetres cubed.'
        write: '$\alpha = 2 \times 10^{-5}\ {}^{\circ}\text{C}^{-1}$, $V_0 = 15.00\ \text{cm}^{3}$, $V = ?$'
      - say: 'The temperature rise, delta theta, is one hundred minus zero, which is one hundred degrees Celsius.'
        write: '$\Delta\theta = 100 - 0 = 100\ {}^{\circ}\text{C}$'
      - section: 'The link'
        say: 'For a solid, the cubic expansivity gamma is three times the linear expansivity.'
        write: '$\gamma = 3\alpha$'
      - say: 'Three times two times ten to the power minus five is six times ten to the power minus five per degree Celsius.'
        write: '$\gamma = 3 \times 2 \times 10^{-5} = 6 \times 10^{-5}\ {}^{\circ}\text{C}^{-1}$'
      - section: 'The law'
        say: 'The increase in volume, delta V, equals V nought times gamma times delta theta.'
        write: '$\Delta V = V_0 \gamma \Delta\theta$'
      - section: 'Substitute'
        say: 'Put in the numbers. That gives fifteen times six times ten to the power minus five, times one hundred.'
        write: '$\Delta V = 15.00 \times 6 \times 10^{-5} \times 100$'
      - say: 'Six times ten to the power minus five, times one hundred, is zero point zero zero six. Multiplied by fifteen, that gives zero point zero nine centimetres cubed.'
        write: '$\Delta V = 15.00 \times 0.006 = 0.09\ \text{cm}^{3}$'
      - say: 'Add it to the first volume. Fifteen point zero zero plus zero point zero nine is fifteen point zero nine centimetres cubed.'
        write: '$V = 15.00 + 0.09 = 15.09\ \text{cm}^{3}$'
      - section: 'Check'
        say: 'Check. Solids expand very little, so a change of less than one percent makes sense. Here it is zero point six percent.'
        write: '$0.09 \div 15 = 0.6\%$, small ✓'
      - section: 'Answer'
        say: 'So the volume at one hundred degrees Celsius is fifteen point zero nine centimetres cubed, which is option B.'
        write: '$\therefore V = 15.09\ \text{cm}^{3}$'
        answer: true
    traps:
      A: 'You went for sixteen point zero three. That is far too big. Brass grows by less than one percent here.'
      C: 'You chose sixteen point zero zero. That adds a whole centimetre cubed, much more than the real expansion of zero point zero nine.'
      D: 'You picked fifteen point zero three. That uses the linear expansivity for a volume and forgets to multiply it by three.'
  24:
    moments:
      - section: 'The question'
        say: 'A bullet buries itself in a block of lead, and the two move off together. Most of the bullet''s energy seems to vanish. How much kinetic energy is left?'
        write: 'Bullet into block, final KE $= ?$'
      - section: 'The data'
        say: 'The bullet has mass m one, zero point zero five kilograms, and velocity u, two hundred metres per second. The block has mass m two, zero point nine five kilograms, and starts at rest.'
        write: '$m_1 = 0.05$ kg, $u = 200\ \text{m s}^{-1}$;  $m_2 = 0.95$ kg at rest'
      - section: 'The law'
        say: 'The principle of conservation of linear momentum says the total momentum before a collision equals the total momentum after.'
        write: 'Conservation of momentum: total before = total after'
      - say: 'The bullet stays in the block, so they move off together with one velocity v. M one u equals m one plus m two, times v.'
        write: '$m_1 u = (m_1 + m_2)v$'
      - section: 'Substitute'
        say: 'Zero point zero five times two hundred is ten. And zero point zero five plus zero point nine five is one kilogram.'
        write: '$0.05 \times 200 = (0.05 + 0.95)v$, so $10 = 1.00\,v$'
      - say: 'So v equals ten metres per second.'
        write: '$v = 10\ \text{m s}^{-1}$'
      - section: 'The kinetic energy'
        say: 'Kinetic energy is one half m v squared, using the total mass that moves.'
        write: '$\text{KE} = \tfrac{1}{2}(m_1 + m_2)v^{2}$'
      - say: 'That is one half times one times ten squared. Ten squared is one hundred, and half of one hundred is fifty joules.'
        write: '$\text{KE} = \tfrac{1}{2} \times 1.00 \times 10^{2} = 50$ J'
      - section: 'Check'
        say: 'Check. The bullet alone had one half times zero point zero five times two hundred squared, which is one thousand joules. Most of it became heat and sound when it stuck, so fifty joules left makes sense.'
        write: 'KE before $= \tfrac{1}{2} \times 0.05 \times 200^{2} = 1000$ J;  most lost as heat ✓'
      - section: 'Answer'
        say: 'So the final kinetic energy after impact is fifty joules, which is option C.'
        write: '$\therefore \text{KE} = 50$ J'
        answer: true
    traps:
      A: 'You went for one hundred and fifty joules. That would need the bullet and block to move at about seventeen metres per second. Momentum gives only ten, which makes fifty joules.'
      B: 'You chose one hundred joules. That is one times ten squared with the half left out. Kinetic energy is half m v squared, so take half of it, which is fifty joules.'
      D: 'You picked two hundred joules. That is four times too big, and it would need a speed of twenty metres per second. Momentum gives only ten, because kinetic energy is not kept when the bullet sticks.'
  25:
    moments:
      - section: 'The question'
        say: 'In a series circuit at resonance, the coil and the capacitor play a clever trick on each other. What is the voltage across the capacitor?'
        write: 'Series R-L-C at resonance, $V_C = ?$'
      - section: 'The data'
        say: 'The voltage across the resistor, V R, is twenty volts. The voltage across the inductor, V L, is forty volts.'
        write: '$V_R = 20$ V, $V_L = 40$ V, $V_C = ?$'
      - section: 'The law'
        say: 'Reactance is the opposition that a coil or a capacitor gives to alternating current, measured in ohms. At resonance the inductive reactance of the coil equals the capacitive reactance of the capacitor. X L equals X C.'
        write: 'Resonance: $X_L = X_C$'
      - say: 'The same current I flows through every part of a series circuit. So V L equals I X L, and V C equals I X C.'
        write: '$V_L = IX_L$, $V_C = IX_C$'
      - say: 'Same current and same reactance, so the two voltages are equal.'
        write: '$X_L = X_C \Rightarrow V_C = V_L$'
      - section: 'Substitute'
        say: 'V C equals V L, which is forty volts.'
        write: '$V_C = 40$ V'
      - section: 'Check'
        say: 'Check. V L and V C are opposite in phase, so they cancel. Then the supply voltage is just V R, twenty volts. That is the sign of resonance.'
        write: '$V_L$ and $V_C$ cancel ⇒ supply $= V_R = 20$ V ✓'
      - section: 'Answer'
        say: 'So the voltage across the capacitor is forty volts, which is option D.'
        write: '$\therefore V_C = 40$ V'
        answer: true
    traps:
      A: 'You went for thirty volts. At resonance V C equals V L exactly, and V L is forty volts.'
      B: 'You chose seventy volts. That adds voltages as if they were in step. In an alternating current circuit they are out of phase, so they are not simply added.'
      C: 'You picked fifty volts. That does not follow. At resonance the capacitor voltage equals the inductor voltage, which is forty volts.'
  26:
    moments:
      - section: 'The question'
        say: 'After one hundred and twenty years, only one sixty-fourth of the atoms are left. How many times has the material halved?'
        write: 'Fraction left $\tfrac{1}{64}$ after 120 years, $T_{1/2} = ?$'
      - section: 'The data'
        say: 'The fraction left is one over sixty-four, and the time t is one hundred and twenty years.'
        write: 'Fraction left $= \tfrac{1}{64}$, $t = 120$ years'
      - section: 'The law'
        say: 'After each half-life the amount left halves. The fraction left equals one half to the power n, where n is the number of half-lives.'
        write: 'Fraction left $= \left(\tfrac{1}{2}\right)^{n}$'
      - section: 'Substitute'
        say: 'Set one half to the power n equal to one over sixty-four.'
        write: '$\left(\tfrac{1}{2}\right)^{n} = \tfrac{1}{64}$'
      - say: 'Sixty-four is two to the power six, so n equals six half-lives.'
        write: '$64 = 2^{6}$, so $n = 6$'
      - section: 'The half-life'
        say: 'The half-life is the total time divided by the number of half-lives.'
        write: '$T_{1/2} = \dfrac{t}{n}$'
      - say: 'One hundred and twenty divided by six is twenty years.'
        write: '$T_{1/2} = \dfrac{120}{6} = 20$ years'
      - section: 'Check'
        say: 'Check by halving. One, a half, a quarter, an eighth, a sixteenth, a thirty-second, a sixty-fourth. That is six halvings, and six times twenty is one hundred and twenty.'
        write: '$1 \to \tfrac{1}{2} \to \tfrac{1}{4} \to \tfrac{1}{8} \to \tfrac{1}{16} \to \tfrac{1}{32} \to \tfrac{1}{64}$ ✓'
      - section: 'Answer'
        say: 'So the half-life is twenty years, which is option A.'
        write: '$\therefore T_{1/2} = 20$ years'
        answer: true
    traps:
      B: 'You went for ten years. That would give twelve half-lives in one hundred and twenty years, and leave only one over four thousand and ninety-six.'
      C: 'You chose two years. That divides one hundred and twenty by about sixty-four. The fraction tells us the number of halvings, not the half-life itself.'
      D: 'You picked twenty-four years. That gives five half-lives, which leaves one over thirty-two, not one over sixty-four.'
  27:
    moments:
      - section: 'The question'
        say: 'Six pendulums hang from one rod. Swing P, and only one of the others joins in strongly. Which one, and why?'
        write: 'Which pendulum resonates with P?'
      - section: 'The picture'
        say: 'Look at the drawing. P and T are short and of equal length. R is shorter still, Q and S are longer, and U is the longest.'
        write: 'P = T (short);  R shorter;  Q, S longer;  U longest'
      - section: 'The law'
        say: 'The period of a simple pendulum depends only on its length. The period equals two pi root l over g.'
        write: 'Period $= 2\pi\sqrt{\dfrac{l}{g}}$'
      - say: 'When P swings, it shakes the rod and pushes every other pendulum at P''s own frequency.'
        write: 'P drives all the others at its frequency'
      - section: 'Resonance'
        say: 'Resonance happens when the pushing frequency equals a pendulum''s own natural frequency. That needs the same length as P.'
        write: 'Resonance: driving $f$ = natural $f$ ⇒ same length'
      - say: 'Only T has the same length as P. So T swings with a large amplitude, and the others only jiggle.'
        write: 'T has P''s length ⇒ T resonates'
      - section: 'An example'
        say: 'It is like pushing a child on a swing at the park. Push in time with the swing''s own rhythm, and it goes higher and higher.'
        write: 'Swing at the park: push in rhythm'
      - section: 'Answer'
        say: 'So the pendulum that resonates with P is T, which is option B.'
        write: '$\therefore$ T'
        answer: true
    traps:
      A: 'You went for U. U is the longest pendulum, so its natural frequency is much lower than P''s.'
      C: 'You chose R and T. T is right, but R is shorter than P, so its natural frequency is different.'
      D: 'You picked Q and R. Q is longer than P and R is shorter, so neither has P''s length.'
  28:
    moments:
      - section: 'The question'
        say: 'A hot cup of tea cools fast at first, then slower and slower. What sets the rate?'
        write: 'Rate of loss of heat $\propto ?$'
      - section: 'The law'
        say: 'Newton''s law of cooling says the rate of loss of heat by a body is directly proportional to the excess of its temperature over that of its surroundings.'
        write: 'Newton''s law of cooling'
      - say: 'Written down, the rate of loss of heat is proportional to theta minus theta nought.'
        write: '$\dfrac{dQ}{dt} \propto (\theta - \theta_0)$'
      - say: 'Theta is the temperature of the body, and theta nought is the temperature of the surroundings.'
        write: '$\theta$ = body, $\theta_0$ = surroundings'
      - section: 'When it holds'
        say: 'It holds for small temperature differences, when the body cools mainly by convection.'
        write: 'Small differences, mainly convection'
      - section: 'An example'
        say: 'Tea at eighty degrees in a room at thirty cools quickly. As it gets close to thirty, the difference shrinks and the cooling slows down.'
        write: 'Big difference ⇒ fast cooling;  small difference ⇒ slow'
      - section: 'Answer'
        say: 'So the rate of loss of heat is proportional to the difference in temperature between the body and its surroundings, which is option C.'
        write: '$\therefore$ the temperature difference, body and surroundings'
        answer: true
    traps:
      A: 'You went for the temperature of the surroundings. That alone does not set the rate. It is the difference that counts.'
      B: 'You chose the temperature of the body. A body at eighty degrees in a room at seventy-nine barely cools, so its own temperature alone is not what counts.'
      D: 'You picked the ratio. The law uses the difference in temperature, not a ratio.'
  29:
    moments:
      - section: 'The question'
        say: 'We have a positive rod, a metal sphere and a finger. Follow the electrons step by step, and keep charge and potential apart.'
        write: 'Charging by induction, Y has $?$'
      - section: 'Rod near'
        say: 'The positive rod X comes near Y. It attracts electrons to the near side of Y, and leaves positive charge on the far side.'
        write: 'X (+) near Y: near side −, far side +'
      - section: 'Finger on'
        say: 'The finger joins Y to the earth, which is at zero potential. Electrons flow up from the earth and cancel the positive charge on the far side.'
        write: 'Finger: electrons from earth cancel the far-side +'
      - say: 'The negative charge on the near side stays, held there by X. So Y now has a net negative charge.'
        write: 'Y: net negative charge'
      - say: 'Because Y is joined to the earth, its potential is zero.'
        write: 'Y earthed ⇒ potential $= 0$'
      - section: 'Finger off'
        say: 'Removing the finger breaks the earth link, but nothing else changes. With X still in place, Y keeps its negative charge, and its potential stays at zero.'
        write: 'Finger removed, X still near: charge −, potential 0'
      - section: 'Keep them apart'
        say: 'The potential becomes negative only later, when X is taken away. While X is near, Y stays at zero potential.'
        write: 'X removed later ⇒ only then a negative potential'
      - section: 'Answer'
        say: 'So Y has a negative charge and a zero potential, which is option D.'
        write: '$\therefore$ negative charge, zero potential'
        answer: true
    traps:
      A: 'You went for no charge. But Y gained electrons from the earth, so it is charged.'
      B: 'You chose a positive charge. Electrons flowed onto Y from the earth, so its charge is negative.'
      C: 'You picked a positive potential. The earth fixed the potential of Y at zero, and removing the finger does not change it.'
  30:
    moments:
      - section: 'The question'
        say: 'Why does your pressing iron have a third wire, the earth wire? Imagine a loose live wire touching its metal case.'
        write: 'Why are appliances earthed?'
      - section: 'The fact'
        say: 'The metal case of an appliance, such as a pressing iron or a fridge, is joined by the earth wire to the earth.'
        write: 'Metal case → earth wire → earth'
      - section: 'The reason'
        say: 'If a live wire inside comes loose and touches the case, a large current flows straight to earth through the low resistance earth wire.'
        write: 'Fault: live touches case ⇒ large current to earth'
      - say: 'That large current blows the fuse, and the supply is cut off.'
        write: 'Fuse blows ⇒ supply cut'
      - say: 'The case stays at the potential of the earth, so a person touching it gets no shock.'
        write: 'Case at earth potential ⇒ no shock'
      - section: 'What it is not'
        say: 'Earthing has nothing to do with choosing alternating or direct current. It keeps the case at the same potential as the earth, neither higher nor lower.'
        write: 'Not about a.c. or d.c.;  case at zero p.d. with the earth'
      - section: 'Answer'
        say: 'So appliances are earthed to keep a person who touches them safe from electric shock, which is option A.'
        write: '$\therefore$ safe from electric shock'
        answer: true
    traps:
      B: 'You went for B. Earthing does not decide whether alternating or direct current can be used.'
      C: 'You chose C. Earthing keeps the case at the same potential as the earth, not higher.'
      D: 'You picked D. Earthing keeps the case at the same potential as the earth, not lower.'
  31:
    moments:
      - section: 'The question'
        say: 'Wet clothes on a line dry in the sun without ever boiling. What is that process called?'
        write: 'Liquid → vapour on its own $= ?$'
      - section: 'The fact'
        say: 'Evaporation is the change of a liquid into vapour that takes place on its own, at any temperature, from the surface of the liquid.'
        write: 'Evaporation: any temperature, from the surface'
      - section: 'The reason'
        say: 'The fastest molecules near the surface escape. So it happens without heating, and it cools the liquid left behind.'
        write: 'Fastest molecules escape ⇒ the liquid cools'
      - say: 'Boiling is different. It takes place all through the liquid, only at the boiling point, and needs a steady supply of heat.'
        write: 'Boiling: throughout, at the boiling point, needs heat'
      - section: 'An example'
        say: 'Wet clothes on a line dry at about thirty degrees Celsius, far below one hundred degrees. That is evaporation.'
        write: 'Clothes dry at 30 °C ⇒ evaporation'
      - section: 'Remember'
        say: 'Remember it this way. Evaporation happens by itself at the surface, but boiling needs the fire.'
        write: 'Evaporation = by itself;  boiling = needs heat'
      - section: 'Answer'
        say: 'So a liquid turning spontaneously into vapour is called evaporation, which is option B.'
        write: '$\therefore$ evaporation'
        answer: true
    traps:
      A: 'You went for regelation. That is ice melting under pressure and freezing again when the pressure is removed.'
      C: 'You chose boiling. Boiling also makes vapour, but only at the boiling point with heat supplied, not on its own.'
      D: 'You picked sublimation. That is a solid turning straight into vapour, with no liquid stage.'
  32:
    moments:
      - section: 'The question'
        say: 'Four transistor symbols that look almost the same. Only two things differ. They are which lead carries the arrow and which way it points.'
        write: 'Which symbol is an n-p-n transistor?'
      - section: 'The picture'
        say: 'In each drawing the base b is on top, the emitter lead e is on the left, and the collector lead c is on the right.'
        write: 'b on top, e on the left, c on the right'
      - section: 'The rule'
        say: 'In a transistor symbol, the arrow is always drawn on the emitter lead.'
        write: 'Arrow always on the emitter'
      - say: 'The arrow shows the direction of conventional current through the emitter.'
        write: 'Arrow = direction of conventional current'
      - say: 'In an n-p-n transistor, conventional current flows out of the emitter, so the arrow points out, away from the base. In a p-n-p transistor it points in.'
        write: 'n-p-n: arrow out;  p-n-p: arrow in'
      - section: 'The four drawings'
        say: 'Now look at the drawings one by one. In A the arrow is on the emitter, but it points in, so A is p-n-p.'
        write: 'A: on e, pointing in ⇒ p-n-p'
      - say: 'In B and D the arrow sits on the collector lead, so neither is drawn correctly.'
        write: 'B and D: arrow on c ✗'
      - say: 'In C the arrow is on the emitter and points out, away from the base. That is n-p-n.'
        write: 'C: on e, pointing out ⇒ n-p-n'
      - section: 'Remember'
        say: 'Remember n-p-n as not pointing in.'
        write: 'n-p-n = Not Pointing iN'
      - section: 'Answer'
        say: 'So the n-p-n symbol is the one with the emitter arrow pointing out, which is option C.'
        write: '$\therefore$ C, arrow on e pointing out'
        answer: true
    traps:
      A: 'You went for A. Its arrow is on the emitter, but it points in towards the base. That is a p-n-p transistor.'
      B: 'You chose B. Its arrow is on the collector lead, but the arrow always belongs on the emitter.'
      D: 'You picked D. Its arrow points out, which is right for n-p-n, but it sits on the collector lead. The arrow always belongs on the emitter.'
  33:
    moments:
      - section: 'The question'
        say: 'Ice, water and steam are the very same water molecules. So why does one hold its shape, one flow, and one fill the room?'
        write: 'Why do solids, liquids and gases differ?'
      - section: 'The fact'
        say: 'All matter is made of tiny particles called molecules. They are always moving, and they attract one another.'
        write: 'Molecules: always moving, attract each other'
      - section: 'The three states'
        say: 'In a solid the molecules are packed closely and held by strong forces, so it has a fixed shape and a fixed volume.'
        write: 'Solid: close, strong forces ⇒ fixed shape and volume'
      - say: 'In a liquid they are still close, but the forces are weaker, so it flows but keeps its volume.'
        write: 'Liquid: close, weaker forces ⇒ flows, fixed volume'
      - say: 'In a gas they are far apart with very weak forces, so it spreads out to fill any container.'
        write: 'Gas: far apart, very weak forces ⇒ fills the container'
      - section: 'An example'
        say: 'Ice in a cooler, water in a cup and steam from a pot of rice are the same molecules. Only the spacing and the forces change.'
        write: 'Ice, water, steam: same molecules'
      - section: 'Answer'
        say: 'So the differences come from the spacing and the forces acting between the molecules, which is option C.'
        write: '$\therefore$ spacing and forces between the molecules'
        answer: true
    traps:
      A: 'You went for relative masses. Ice, water and steam have molecules of the same mass, yet they behave differently.'
      B: 'You chose melting points. A melting point describes a substance, but it does not explain why its three states differ.'
      D: 'You picked different molecules. The same substance has the same molecules in all three states.'
  34:
    moments:
      - section: 'The question'
        say: 'Look at the side mirror of a car. It shows a whole stretch of road in a small glass. What kind of image makes that possible?'
        write: 'Convex driving mirror, the image is $?$'
      - section: 'The fact'
        say: 'A convex mirror always forms an image that is erect, virtual and diminished, wherever the object is.'
        write: 'Convex mirror: erect, virtual, diminished, always'
      - section: 'The reason'
        say: 'Because the image is smaller, the mirror gives a wide field of view. The driver sees much of the road behind.'
        write: 'Diminished ⇒ wide field of view'
      - say: 'Because it is erect, the cars behind are seen the right way up.'
        write: 'Erect ⇒ cars seen the right way up'
      - say: 'The image forms behind the mirror and cannot be caught on a screen, so it is virtual.'
        write: 'Behind the mirror ⇒ virtual'
      - section: 'An example'
        say: 'That is why car side mirrors, and the mirrors at sharp bends on some roads, are convex.'
        write: 'Side mirrors, mirrors at sharp bends'
      - section: 'Answer'
        say: 'So convex mirrors give images that are erect, virtual and diminished, which is option A.'
        write: '$\therefore$ erect, virtual and diminished'
        answer: true
    traps:
      B: 'You went for B. The image in a convex mirror is virtual, not real. It cannot be caught on a screen.'
      C: 'You chose C. The image is diminished, not magnified, and that is what gives the wide view.'
      D: 'You picked D. The image is erect, not inverted. The cars behind are seen the right way up.'
  35:
    moments:
      - section: 'The question'
        say: 'A talking drum and a keyboard play the very same note, yet you can tell them apart with your eyes closed. How?'
        write: 'Same note, different instruments, they differ in $?$'
      - section: 'The fact'
        say: 'When an instrument plays a note, it gives the fundamental frequency together with weaker overtones.'
        write: 'Note = fundamental + overtones'
      - say: 'Different instruments give different numbers and strengths of overtones. This gives each one its own quality, also called timbre.'
        write: 'Different overtones ⇒ different quality (timbre)'
      - section: 'The reason'
        say: 'The same note means the same fundamental frequency, so the same pitch. Pitch cannot be what tells them apart.'
        write: 'Same note ⇒ same pitch'
      - say: 'And two instruments can play equally loud and still sound different. So it is not loudness or intensity either.'
        write: 'Same loudness, still different'
      - section: 'An example'
        say: 'That is how you know the talking drum from the keyboard. Its quality is its own voice.'
        write: 'Talking drum or keyboard: quality'
      - section: 'Answer'
        say: 'So instruments playing the same note differ in quality, which is option A.'
        write: '$\therefore$ quality'
        answer: true
    traps:
      B: 'You went for pitch. But the same note means the same pitch, so pitch is the one thing they share.'
      C: 'You chose intensity. Two instruments can play at the same intensity and still sound different.'
      D: 'You picked loudness. Two instruments can play equally loud and still sound different.'
  36:
    moments:
      - section: 'The question'
        say: 'Two south poles start at the middle of a steel bar and are pulled apart to the ends. What poles do they leave behind at T and V?'
        write: 'Divided touch, poles at T and V $= ?$'
      - section: 'The picture'
        say: 'Look at the drawing. Both magnets have their south poles down. They start together at U and are drawn apart, one to T and one to V.'
        write: 'S poles start at U, one stroke to T, one to V'
      - section: 'The rule'
        say: 'This is the divided touch, or double stroke, method of making a magnet.'
        write: 'Divided-touch method'
      - say: 'The rule is that the end of the bar where a stroke finishes gets the opposite pole to the stroking pole.'
        write: 'Finishing end = opposite pole to the stroking pole'
      - section: 'Each end'
        say: 'One south pole finishes every stroke at T, so T becomes a north pole.'
        write: 'S finishes at T ⇒ T is N'
      - say: 'The other south pole finishes at V, so V also becomes a north pole.'
        write: 'S finishes at V ⇒ V is N'
      - section: 'Check'
        say: 'Check. Opposite poles attract, so a south pole leaves a north pole behind it at the end it is dragged to. Both ends are north.'
        write: 'Opposite poles attract ⇒ both ends N ✓'
      - section: 'Answer'
        say: 'So T and V will both be north poles, which is option C.'
        write: '$\therefore$ T north, V north'
        answer: true
    traps:
      A: 'You went for north and south. Both strokes use south poles, so both ends become the same pole, north.'
      B: 'You chose south and south. The finishing end gets the opposite pole to the stroking pole, so it is north, not south.'
      D: 'You picked south and north. Both strokes use south poles, so both ends become north.'
  37:
    moments:
      - section: 'The question'
        say: 'Switch off the fan in your parlour and the bulbs stay on. Why are house appliances wired this way?'
        write: 'Why are home appliances in parallel?'
      - section: 'The fact'
        say: 'In a parallel connection, every appliance is joined directly across the live and neutral wires.'
        write: 'Each appliance across live and neutral'
      - section: 'The reason'
        say: 'So each one gets the full mains voltage, about two hundred and thirty volts, and works at its rated power.'
        write: 'Each gets the full mains voltage, about 230 V'
      - say: 'Each appliance also has its own switch. Switch off the fan and the bulbs stay on. If one bulb blows, the others keep shining.'
        write: 'Own switch;  one off, the rest stay on'
      - section: 'Series instead?'
        say: 'In series the voltage would be shared, every lamp would be dim, and one broken lamp would put off the whole house.'
        write: 'Series: voltage shared, dim lamps, one fault ⇒ all off'
      - say: 'A parallel circuit actually draws more total current, because each branch adds its own current.'
        write: 'Parallel: total current = sum of the branch currents'
      - section: 'Answer'
        say: 'So appliances are in parallel because each gets the full mains voltage and can be switched on or off on its own, which is option D.'
        write: '$\therefore$ full mains voltage, own switch'
        answer: true
    traps:
      A: 'You went for less current. A parallel circuit draws more total current, not less, because each branch adds its own.'
      B: 'You chose less voltage. Each appliance gets the full mains voltage, not less.'
      C: 'You picked C. Wires still heat up when current flows, whether the circuit is in parallel or not.'
  38:
    moments:
      - section: 'The question'
        say: 'An object goes round a circle at one metre per second. How fast is it turning? For that we need its angular velocity.'
        write: 'Circular motion, $\omega = ?$'
      - section: 'The data'
        say: 'The radius r is zero point five metres, and the speed v is one metre per second.'
        write: '$r = 0.5$ m, $v = 1\ \text{m s}^{-1}$, $\omega = ?$'
      - section: 'The law'
        say: 'Angular velocity, omega, is the angle the object turns through each second, measured in radians per second. It is linked to the linear speed by v equals omega r.'
        write: '$v = \omega r$'
      - say: 'Make omega the subject. Omega equals v over r.'
        write: '$\omega = \dfrac{v}{r}$'
      - section: 'Substitute'
        say: 'One divided by zero point five is two. So omega is two radians per second.'
        write: '$\omega = \dfrac{1}{0.5} = 2\ \text{rad s}^{-1}$'
      - section: 'Check'
        say: 'Check. Dividing by a radius smaller than one metre gives a number bigger than the speed, and the unit is radians per second. Good.'
        write: '$r < 1$ m ⇒ $\omega$ bigger than $v$ in number ✓'
      - section: 'Answer'
        say: 'So the angular velocity is two radians per second, which is option D.'
        write: '$\therefore \omega = 2\ \text{rad s}^{-1}$'
        answer: true
    traps:
      A: 'You went for eight. That is four times too big. Omega is v over r, one over zero point five, which is two.'
      B: 'You chose four. That divides by r squared, zero point two five, instead of by r.'
      C: 'You picked one. That copies the speed and forgets to divide by the radius.'
  39:
    moments:
      - section: 'The question'
        say: 'A lever with a long effort arm helps us lift one hundred and eighty newtons, but it is only ninety percent efficient. What effort is needed?'
        write: 'Load 180 N, efficiency 90%, effort $= ?$'
      - section: 'The data'
        say: 'The efficiency is ninety percent. The load L is one hundred and eighty newtons. The effort arm is twice as long as the load arm.'
        write: 'Efficiency $= 90\%$, $L = 180$ N, effort arm $= 2 \times$ load arm, $E = ?$'
      - section: 'Convert'
        say: 'Ninety percent as a decimal is zero point nine.'
        write: '$90\% = 0.90$'
      - section: 'The velocity ratio'
        say: 'For a lever, the velocity ratio is the effort arm over the load arm. Twice as long gives V R equals two.'
        write: 'VR $= \dfrac{\text{effort arm}}{\text{load arm}} = 2$'
      - section: 'The law'
        say: 'The mechanical advantage, M A, is the load divided by the effort. Efficiency equals M A over V R, so M A equals the efficiency times V R.'
        write: '$\text{MA} = \text{efficiency} \times \text{VR}$'
      - say: 'Zero point nine times two is one point eight.'
        write: '$\text{MA} = 0.90 \times 2 = 1.8$'
      - say: 'Now we find the effort. M A is load over effort, so turning it round, the effort is the load divided by M A.'
        write: '$E = \dfrac{L}{\text{MA}}$'
      - section: 'Substitute'
        say: 'One hundred and eighty divided by one point eight is one hundred newtons.'
        write: '$E = \dfrac{180}{1.8} = 100$ N'
      - section: 'Check'
        say: 'Check. A perfect lever would need one hundred and eighty over two, which is ninety newtons. A real lever wastes a little, so it needs a little more, and one hundred is a little more. Good.'
        write: 'Ideal $= 180 \div 2 = 90$ N;  $100 > 90$ ✓'
      - section: 'Answer'
        say: 'So the effort needed is one hundred newtons, which is option A.'
        write: '$\therefore E = 100$ N'
        answer: true
    traps:
      B: 'You went for ninety newtons. That is the effort for a perfect machine, as if the efficiency were one hundred percent.'
      C: 'You chose eighty newtons. That is less than even a perfect lever would need, which no real machine can manage.'
      D: 'You picked one hundred and twenty newtons. That would mean an efficiency of seventy-five percent, not ninety. One hundred and eighty over one point eight is one hundred.'
  40:
    moments:
      - section: 'The question'
        say: 'There are five capacitors, three side by side and two in a row with them. Capacitors follow the rules the other way round from resistors.'
        write: 'Effective capacitance $C = ?$'
      - section: 'The data'
        say: 'Three two microfarad capacitors are in parallel. That group is in series with a two microfarad capacitor and a three microfarad capacitor.'
        write: '(2 μF ∥ 2 μF ∥ 2 μF), in series with 2 μF and 3 μF'
      - section: 'The parallel group'
        say: 'Capacitors in parallel simply add.'
        write: 'Parallel: $C_p = C_1 + C_2 + C_3$'
      - say: 'Two plus two plus two is six microfarads.'
        write: '$C_p = 2 + 2 + 2 = 6\ \mu\text{F}$'
      - section: 'The series chain'
        say: 'For capacitors in series, one over C equals one over C one plus one over C two plus one over C three.'
        write: 'Series: $\dfrac{1}{C} = \dfrac{1}{C_1} + \dfrac{1}{C_2} + \dfrac{1}{C_3}$'
      - say: 'The three blocks in series are two, six and three microfarads.'
        write: '$\dfrac{1}{C} = \dfrac{1}{2} + \dfrac{1}{6} + \dfrac{1}{3}$'
      - say: 'Over a common denominator of six, that is three sixths plus one sixth plus two sixths, which is six sixths, or one.'
        write: '$\dfrac{1}{C} = \dfrac{3 + 1 + 2}{6} = 1$'
      - say: 'So C equals one microfarad.'
        write: '$C = 1\ \mu\text{F}$'
      - section: 'Check'
        say: 'Check. In series the total is always smaller than the smallest capacitor. One microfarad is less than two. Good.'
        write: '$1\ \mu\text{F} < 2\ \mu\text{F}$ ✓'
      - section: 'Answer'
        say: 'So the effective capacitance is one microfarad, which is option D.'
        write: '$\therefore C = 1\ \mu\text{F}$'
        answer: true
    traps:
      A: 'You went for four microfarads. That is bigger than the smallest capacitor in the series chain, which cannot happen.'
      B: 'You chose three microfarads. That is bigger than the smallest series capacitor, two microfarads, which cannot happen.'
      C: 'You picked two microfarads. That is the smallest single capacitor, but the series total must be smaller still.'
