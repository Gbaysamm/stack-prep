# UTME 2010 Physics, written up by hand from source/past-questions.pdf, pages 2-11.
# Q1 (paper type) is left out; the other 49 questions are kept and nothing was dropped. Answers
# were worked out afresh: seven printed keys did not hold up (Q14 hydrometer, Q15 alcohol
# thermometer, Q25 electric bell, Q43 resonance phase, Q45 discharge tube, Q46 uranium decay,
# Q49 transistor characteristic) and Q47 printed "no option". Repairs: Q42's inductances were
# in mH, which gives 0.25 J and matches no option, so they became H; Q47's options had no right
# value, so B became 8.2 x 10^14 Hz, and "hydrogen atom" became "an atom" (5.44 x 10^-19 J is
# hydrogen's n = 2 level, not its ground state); Q45 printed "high pressure" twice, so C became
# "low pressure"; Q14 and Q46 each had two defensible answers, so one option was replaced;
# Q49's stem now names the output characteristic; Q3's option C had lost its last letter; Q17
# and Q22 had wrong units in the stem or options; Q30's 67 cm lost its decimal point; Q39's
# "coil" became "cables"; lost powers, degree signs and units restored throughout. Figures for
# Q3, Q7, Q36, Q38 and Q40 are redrawn as SVG, and Q49's four option graphs as option_figures.
