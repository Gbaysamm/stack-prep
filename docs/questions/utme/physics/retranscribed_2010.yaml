  - number: 4
    stem: 'A stone and a feather are dropped from the same height above the earth''s surface. Ignoring air resistance, which of the following is correct?'
    options:
      A: 'The stone and the feather will both reach the ground at the same time.'
      B: 'The stone will reach the ground first.'
      C: 'The feather will reach the ground first.'
      D: 'The feather will be blown away by the wind while the stone will drop steadily.'
    answer: A
    printed_key: A
    subtopic: PHY.4.a
    level: 1
    level_reason: recall that all bodies fall with the same acceleration g
    corrected: 'stem: "A stone and a feather dropped" written as "are dropped", "earth surface" as "earth''s surface"'

