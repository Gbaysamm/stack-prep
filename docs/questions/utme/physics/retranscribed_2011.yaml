        </g>
      </svg>

  - number: 6
    stem: 'An object of mass 2 kg moves with a velocity of 10 m s⁻¹ round a circle of radius 4 m. Calculate the centripetal force on the object.'
    options:
      A: '40 N'
      B: '25 N'
      C: '100 N'
      D: '50 N'
    answer: D
    printed_key: A
    key_note: 'F = mv²/r = 2 × 100 ÷ 4 = 50 N.'
    subtopic: PHY.3.h
    level: 2
    level_reason: one substitution into F = mv²/r

  - number: 7
    stem: 'If it takes an object 3 s to fall freely to the ground from a certain height, what is the distance covered by the object? [g = 10 m s⁻²]'
    options:
      A: '60 m'
      B: '90 m'
      C: '30 m'
      D: '45 m'
    answer: D
    printed_key: A
    key_note: 's = ½gt² = ½ × 10 × 9 = 45 m.'
    subtopic: PHY.3.f
    level: 2
    level_reason: one substitution into s = ut + ½at²

  - number: 8
    stem: 'The diagrams show three positions, X, Y and Z, of a cone resting on a flat table. The position which can be described as neutral equilibrium is represented by'
    options:
      A: 'Y and X'
      B: 'Z only'
      C: 'X only'
      D: 'Y and Z'
    answer: B
    printed_key: C
    key_note: 'X (on its apex) is unstable, Y (on its base) is stable, Z (on its side) is neutral.'
    corrected: 'Stem "positions of a cone ... represented as" reworded to name X, Y and Z and say "represented by".'
    subtopic: PHY.5.b
