  - number: 9
    stem: 'If a tube of small radius open at both ends is placed in a liquid, the liquid will'
    options:
      A: 'rise above the liquid level if the liquid does not wet the glass'
      B: 'remain at the same level irrespective of whether the liquid wets the glass or not'
      C: 'fall below the liquid level if the liquid wets the glass'
      D: 'fall below the liquid level if the liquid does not wet the glass'
    answer: D
    printed_key: A
    key_note: 'A non-wetting liquid such as mercury is depressed in a capillary tube; a wetting liquid rises.'
    corrected: '"opened at both ends" written as "open at both ends".'
    subtopic: PHY.18.a
    level: 2
    level_reason: apply adhesion and cohesion to capillarity

  - number: 10
    stem: |-
      I. Density of the liquid
      II. Depth below the surface of the liquid
      III. Surface area of the liquid

      On which of the factors above does the pressure in a liquid depend?
    options:
      A: 'I and III only'
      B: 'I and II only'
      C: 'II and III only'
      D: 'I, II and III'
    answer: B
    printed_key: A
    key_note: 'p = hρg depends on depth and density, not on the surface area.'
    corrected: 'Stem "In which of the statement above will pressure be dependent?" reworded.'
    subtopic: PHY.10.b
    level: 2
    level_reason: read the factors off p = hρg

  - number: 11
    stem: |-
      I. High thermal capacity
      II. High sensitivity
      III. Easy readability
      IV. Accuracy over a wide range of temperatures

      From the statements above, the qualities of a good thermometer are
    options:
      A: 'II, III and IV'
      B: 'I and II'
      C: 'I, II, III and IV'
      D: 'I, III and IV'
    answer: A
    printed_key: C
    key_note: 'A good thermometer needs a low thermal capacity so it takes little heat from what it measures; I is not a quality.'
    subtopic: PHY.12.a
    level: 2
    level_reason: judge each property of a thermometer

  - number: 12
    stem: 'A machine is used to lift a load of 20 N through a height of 10 m. If the efficiency of the machine is 40%, how much work is done by the effort?'
    options:
      A: '120 J'
      B: '80 J'
      C: '500 J'
      D: '300 J'
    answer: C
    printed_key: D
    key_note: 'Work output = 20 × 10 = 200 J; work input = 200 ÷ 0.40 = 500 J.'
    corrected: 'Stem "how much work is done?" made "how much work is done by the effort?", since the useful work (200 J) is not an option.'
    subtopic: PHY.8.a
    level: 3
    level_reason: work output, then divide by the efficiency

  - number: 13
    stem: 'Which of the following could be effectively used to reduce friction?'
    options:
      A: 'Petrol'
      B: 'Kerosene'
      C: 'Grease'
      D: 'Water'
    answer: C
    printed_key: D
    key_note: 'Grease is a lubricant that stays in place between moving parts.'
    subtopic: PHY.6.a
    level: 1
    level_reason: recall a lubricant

  - number: 14
    stem: 'A copper wire was subjected to a tensile stress of $7.7 \times 10^{7}\ \text{N m}^{-2}$. Calculate the tensile strain of the wire. [Young modulus $= 1.1 \times 10^{11}\ \text{N m}^{-2}$]'
    options:
      A: '$2.2 \times 10^{-4}$'
      B: '$2.0 \times 10^{-5}$'
      C: '$7.0 \times 10^{-3}$'
      D: '$7.0 \times 10^{-4}$'
    answer: D
    printed_key: A
    key_note: 'Strain = stress ÷ E = 7.7 × 10⁷ ÷ 1.1 × 10¹¹ = 7.0 × 10⁻⁴.'
    subtopic: PHY.9.a
    level: 2
    level_reason: one division with powers of ten

  - number: 15
    stem: 'A spring balance reads 30 kg when an object hangs from it in air and 22 kg when the object is completely immersed in water. What is the upthrust exerted by the water on the object? [g = 10 m s⁻²]'
    options:
      A: '80 N'
      B: '50 N'
      C: '520 N'
      D: '220 N'
    answer: A
    printed_key: A
    corrected: 'Stem "An object weighs 22kg in water an 30kg in air" reworded as spring-balance readings (a weight is not in kilograms), "an" made "and", and "the liquid" made "the water".'
    subtopic: PHY.11.a
    level: 3
    level_reason: loss in weight, then convert to newtons

  - number: 16
    stem: 'A block of aluminium is heated electrically by a 30 W heater. If the temperature rises by 100 °C in 5 minutes, the heat capacity of the aluminium is'
    options:
      A: '$200\ \text{J K}^{-1}$'
      B: '$900\ \text{J K}^{-1}$'
      C: '$90\ \text{J K}^{-1}$'
      D: '$100\ \text{J K}^{-1}$'
    answer: C
    printed_key: C
    subtopic: PHY.13.a
    level: 3
    level_reason: convert minutes to seconds, then C = Pt/Δθ

  - number: 17
    stem: 'A perfect emitter or absorber of radiant energy is a'
    options:
      A: 'red body'
      B: 'conductor'
      C: 'black body'
