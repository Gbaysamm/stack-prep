    subtopic: PHY.19.a
    level: 2
    level_reason: explain cooling by radiation

  - number: 23
    stem: 'A metal of volume 40 cm³ is heated from 30 °C to 90 °C. The increase in volume is [linear expansivity of the metal $= 2.0 \times 10^{-5}\ \text{K}^{-1}$]'
    options:
