  - number: 18
    stem: 'The phenomenon that shows that an increase in pressure lowers the melting point can be observed in'
    options:
      A: 'regelation'
      B: 'sublimation'
      C: 'condensation'
      D: 'coagulation'
    answer: A
    printed_key: B
    key_note: 'Regelation: ice melts under the pressure of a loaded wire and refreezes above it.'
    corrected: '"that increase in pressure" written as "that an increase in pressure".'
    subtopic: PHY.14.a
    level: 1
    level_reason: recall regelation

  - number: 19
    stem: 'If the volume of a gas increases steadily as the temperature increases at constant pressure, the gas obeys'
    options:
      A: 'Charles'' law'
      B: 'Graham''s law'
      C: 'Boyle''s law'
      D: 'pressure law'
    answer: A
    printed_key: B
    key_note: 'Volume rising with temperature at constant pressure is Charles'' law.'
    corrected: 'Stem said the volume increases "as the temperature decreases", which no gas does at constant pressure; it now says "as the temperature increases".'
    subtopic: PHY.16.a
    level: 1
    level_reason: recall which gas law holds the pressure fixed

  - number: 20
    stem: 'A burn from steam is more severe than one from boiling water because'
    options:
      A: 'steam burn is dependent on relative humidity'
      B: 'steam burn is independent of relative humidity'
      C: 'steam possesses greater heat energy per unit mass'
      D: 'water boils at a higher temperature'
    answer: C
    printed_key: D
    key_note: 'Steam gives up its latent heat of vaporisation as it condenses on the skin, on top of the heat from cooling.'
    corrected: 'Stem "Steam burn is more severe than that of boiling water" smoothed; "possess" made "possesses".'
    subtopic: PHY.14.a
    level: 2
    level_reason: apply latent heat to an everyday case

  - number: 21
    stem: 'Which of the following types of waves needs a medium for propagation?'
    options:
      A: 'X-rays'
      B: 'Sound waves'
      C: 'Light waves'
      D: 'Radio waves'
    answer: B
    printed_key: C
    key_note: 'Sound is a mechanical wave; the others are electromagnetic and cross a vacuum.'
    subtopic: PHY.20.b
    level: 1
    level_reason: recall mechanical against electromagnetic waves

  - number: 22
    stem: 'The ground is always cold at night because the'
    options:
      A: 'atmosphere reflects the sun''s energy at night'
      B: 'atmosphere absorbs the sun''s energy at night'
      C: 'earth radiates heat to the atmosphere at night'
      D: 'sun no longer shines at night'
