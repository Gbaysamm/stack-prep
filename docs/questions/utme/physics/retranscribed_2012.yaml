# UTME 2012 Physics, written up by hand from source/past-questions.pdf, pages 22-32.
# Q1 (paper type) is left out; the other 49 questions are kept and nothing is dropped. Answers were
# worked out afresh. Four printed keys did not hold up: Q45 (finding a swallowed pin is diagnosis),
# Q48 (a diode conducts when forward biased), Q49 (reverse bias widens the depletion layer) and
# Q50 (semiconductors are damaged by heat). Repairs: Q4 had lost the 6 N force and its answer
# (10 N); Q5's "initial acceleration" can be read off the graph, so D became the mass; Q8 "a" for
# r; Q11 asked to 80 m, which fits no option, so it now asks to 60 m; Q13 needed "at constant
# velocity"; Q14's load is 25 kg, not 25 N; Q16 needed g; Q24 printed A and B the same; Q26 had lost
# the pi; Q30 needed "upright"; Q34 needed the refractive index; Q39's figure has one cell reversed,
# so option C became 8 V (key B to C); Q42's options C and A were the same rising line; Q46's
# "wave particles" became cathode rays. Every figure is redrawn as SVG.
