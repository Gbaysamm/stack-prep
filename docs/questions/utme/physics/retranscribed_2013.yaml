# UTME 2013 Physics, written up by hand from source/past-questions.pdf, pages 33-42.
# Q1 (paper type) is left out; the other 49 questions are kept. Answers were worked out afresh:
# twelve printed keys did not hold up (Q19 specific heat ratio, Q21 steam, Q27 speed of sound,
# Q31 critical angle, Q33 microscope, Q35 deviation order, Q36 force on a charge, Q42 energy of
# a moving charge, Q44 Faraday's law, Q47 intensity, Q48 photoelectric effect, Q50 covalent bond).
# Repairs: Q7 option D "1105 N" became 105 N; Q14's constants (sea water 1.03 x 10^3 kg m^-3,
# one atmosphere 1.01 x 10^5 N m^-2) had lost digits; Q18 said constant temperature where
# PΔV needs constant pressure; Q15 lacked the two densities; Q21 option B
# said latent heat of fusion; Q46 option C became -2.67 eV; Q36 no longer calls a
# 1.5 x 10^-19 C charge an electron; units, powers and small typing slips repaired throughout.
# Q31 and Q33 are redrawn as SVG. Nothing was dropped.
