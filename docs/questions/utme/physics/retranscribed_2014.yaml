  - number: 20
    stem: 'A glass bottle of initial volume 2 × 10⁴ cm³ is heated from 20 °C to 50 °C. If the linear expansivity of glass is 9 × 10⁻⁶ K⁻¹, the volume of the bottle at 50 °C is'
    options:
      A: '20 016.2 cm³'
      B: '20 005.4 cm³'
      C: '20 008.1 cm³'
      D: '20 013.5 cm³'
    answer: A
    printed_key: null
    key_note: 'γ = 3α = 2.7 × 10⁻⁵ K⁻¹; ΔV = 2 × 10⁴ × 2.7 × 10⁻⁵ × 30 = 16.2 cm³; V = 20 016.2 cm³.'
    subtopic: PHY.15.a
    level: 4
    level_reason: cubic expansivity from linear, then the expansion
    corrected: 'stem: "linear expansively" written as "linear expansivity"; "9x10-6K-1" as 9 × 10⁻⁶ K⁻¹'

  - number: 21
    stem: 'The equation $P^{a}V^{b}T^{c} = \text{constant}$ reduces to Charles''s law if'
    options:
      A: 'a = 1, b = 1 and c = 0'
      B: 'a = 1, b = 0 and c = −1'
