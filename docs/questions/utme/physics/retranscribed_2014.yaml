questions:
  - number: 2
    stem: 'What is the least possible error encountered when taking a measurement with a metre rule?'
    options:
      A: '0.1 mm'
      B: '1.0 mm'
      C: '0.5 mm'
      D: '0.2 mm'
    answer: C
    printed_key: null
    key_note: 'The smallest division of a metre rule is 1 mm; the least error is half of it, 0.5 mm.'
    subtopic: PHY.1.f
    level: 1
    level_reason: recall that the least error is half the smallest division
    corrected: 'stem: "measurement with a meter rule" written as "a measurement with a metre rule"; options: units spaced'

  - number: 3
    stem: 'A quantity which requires magnitude and direction to be specified is'
    options:
      A: 'temperature'
      B: 'distance'
      C: 'displacement'
      D: 'mass'
    answer: C
    printed_key: null
    key_note: 'Displacement is distance in a stated direction, a vector; the rest are scalars.'
    subtopic: PHY.2.a
    level: 1
    level_reason: recall which quantity is a vector

  - number: 4
    stem: 'Which of the following quantities are vectors? I. Electrical potential  II. Torque  III. Kinetic energy  IV. Momentum'
    options:
      A: 'II and IV'
      B: 'I and II'
      C: 'I and III'
      D: 'II and III'
    answer: A
    printed_key: null
    key_note: 'Torque and momentum have direction; electrical potential and kinetic energy do not.'
    subtopic: PHY.2.a
    level: 2
    level_reason: sort four quantities into scalars and vectors
    corrected: 'stem: the list and the question joined into one stem'

  - number: 5
    stem: 'Which type of motion do the wheels of a moving car undergo?'
    options:
      A: 'Vibratory and translational motion'
      B: 'Random and translational motion'
      C: 'Rotational and oscillatory motion'
      D: 'Translational and rotational motion'
    answer: D
    printed_key: null
    key_note: 'Each wheel spins about its axle and moves forward with the car.'
    subtopic: PHY.3.b
    level: 1
    level_reason: recognise two types of motion in one example

