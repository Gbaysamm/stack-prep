# UTME 2014 Physics, written up by hand from source/past-questions.pdf, pages 43-52.
# Q1 (paper type F) is left out; the other 49 questions are kept and none is dropped. No answer key
# is printed for this paper, so every printed_key is null and every answer was worked out afresh.
# Repairs: Q9 (an 80 kg "weight" became an 80 N weight, so an option fits), Q19 (asked for 20 K in
# Celsius but every option was a conversion of 20 °C; it now asks for 20 °C in kelvin), Q27 (speed
# of sound 330 m s⁻¹ given and option C 136 m became 132 m), Q30 (options in cm, not m), Q37
# (option C's power of ten slipped: 1.2 × 10⁻⁶ became 1.2 × 10⁻⁵ Ω m), Q43 (stem and options
# rewritten so one answer is right), Q48 (the daughter of an alpha decay from Pb-82 is Hg-80, not
# Pb), Q50 (options A and C were the same graph; each graph redrawn distinct). Data added where the
# question needs it: g in Q8 and Q12. Units and lost powers restored throughout. All figures (Q6,
# Q17, Q28, Q35, Q42-43, Q50) are redrawn as SVG.
