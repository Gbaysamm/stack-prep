  - number: 7
    stem: 'A car accelerates uniformly from rest at 3 m s⁻². Its velocity after travelling a distance of 24 m is'
    options:
      A: '12 m s⁻¹'
      B: '144 m s⁻¹'
      C: '72 m s⁻¹'
      D: '36 m s⁻¹'
    answer: A
    printed_key: null
    key_note: 'v² = u² + 2as = 0 + 2 × 3 × 24 = 144, so v = 12 m s⁻¹.'
    subtopic: PHY.3.f
    level: 3
    level_reason: one equation of motion, then a square root
    corrected: 'stem: "3ms-2. its" written as "3 m s⁻². Its", "traveling" as "travelling"; options: "ms-1" as m s⁻¹'

  - number: 8
    stem: 'Calculate the escape velocity of a satellite launched from the earth''s surface if the radius of the earth is 6.4 × 10⁶ m. [g = 10 m s⁻²]'
    options:
      A: '25.3 km s⁻¹'
      B: '4.2 km s⁻¹'
      C: '4.0 km s⁻¹'
      D: '11.3 km s⁻¹'
    answer: D
    printed_key: null
    key_note: 'v = √(2gR) = √(2 × 10 × 6.4 × 10⁶) = √(1.28 × 10⁸) = 1.13 × 10⁴ m s⁻¹ = 11.3 km s⁻¹.'
    subtopic: PHY.4.a
    level: 3
    level_reason: one formula with powers of ten and a unit change
    corrected: 'stem: g = 10 m s⁻² added, since the answer needs it; "6.4 x 106m" written as 6.4 × 10⁶ m; options: "kms-1" as km s⁻¹'

  - number: 9
    stem: 'An object of weight 80 N on earth is taken to a planet where the acceleration due to gravity is one-third of its value on earth. The weight of the object on the planet is approximately'
    options:
      A: '48 N'
      B: '12 N'
      C: '27 N'
      D: '36 N'
    answer: C
    printed_key: null
    key_note: 'Mass is unchanged, so weight scales with g: 80 ÷ 3 = 26.7 N, about 27 N.'
    subtopic: PHY.4.a
    level: 2
    level_reason: weight is proportional to g, one division
    corrected: 'stem: "weight 80kg" changed to "weight 80 N" (a weight is a force, and with 80 kg no option fits); "approximately" added because 80 ÷ 3 = 26.7'

  - number: 10
    stem: 'One of the conditions necessary for an object to be in equilibrium when acted upon by a number of parallel forces is that the vector sum of the forces is'
    options:
      A: 'average'
      B: 'zero'
      C: 'negative'
      D: 'positive'
    answer: B
    printed_key: null
    key_note: 'For equilibrium the resultant force must be zero (and so must the resultant moment).'
    subtopic: PHY.5.b
    level: 1
    level_reason: recall the first condition of equilibrium

  - number: 11
    stem: 'What happens when three coplanar non-parallel forces are in equilibrium?'
    options:
      A: 'Their lines of action are parallel.'
      B: 'They are represented in magnitude only.'
      C: 'They are represented in direction only.'
      D: 'Their lines of action meet at a point.'
    answer: D
    printed_key: null
    key_note: 'Three non-parallel forces in equilibrium must be concurrent, or they would have a resultant moment.'
    subtopic: PHY.5.a
    level: 1
    level_reason: recall the condition for three forces in equilibrium

  - number: 12
    stem: 'An object of mass 20 kg is released from a height of 10 m above the ground level. The kinetic energy of the object just before it hits the ground is [g = 10 m s⁻²]'
    options:
      A: '200 J'
      B: '4000 J'
      C: '2000 J'
      D: '500 J'
    answer: C
    printed_key: null
    key_note: 'All the potential energy becomes kinetic energy: mgh = 20 × 10 × 10 = 2000 J.'
    subtopic: PHY.7.a
    level: 3
    level_reason: conservation of energy with one calculation
    corrected: 'stem: g = 10 m s⁻² added, since the answer needs it'

  - number: 13
    stem: 'The energy in the nucleus of atoms produces heat which can be used to generate'
    options:
      A: 'kinetic energy'
      B: 'mechanical energy'
      C: 'electrical energy'
      D: 'potential energy'
    answer: C
    printed_key: null
    key_note: 'In a nuclear power station the heat raises steam that drives turbines and generators, giving electricity.'
    subtopic: PHY.7.b
    level: 1
    level_reason: recall the use of nuclear energy
    corrected: 'stem: "produce" written as "produces"'

  - number: 14
    stem: 'A machine whose efficiency is 75% is used to lift a load of 1000 N. Calculate the effort put into the machine if it has a velocity ratio of 4.'
    options:
      A: '343.33 N'
      B: '233.33 N'
      C: '333.33 N'
      D: '334.33 N'
    answer: C
    printed_key: null
    key_note: 'MA = efficiency × VR = 0.75 × 4 = 3, so effort = 1000 ÷ 3 = 333.33 N.'
    subtopic: PHY.8.a
    level: 3
    level_reason: efficiency to mechanical advantage, then effort
    corrected: 'stem: "put in to" written as "put into"'

  - number: 15
    stem: 'A wheel and axle is used to raise a load whose weight is 800 N when an effort of 250 N is applied. If the radii of the wheel and axle are 800 mm and 200 mm respectively, the efficiency of the machine is'
    options:
      A: '90%'
      B: '80%'
      C: '85%'
      D: '87%'
    answer: B
    printed_key: null
    key_note: 'MA = 800 ÷ 250 = 3.2, VR = 800 ÷ 200 = 4, efficiency = 3.2 ÷ 4 × 100 = 80%.'
    subtopic: PHY.8.a
    level: 4
    level_reason: mechanical advantage and velocity ratio combined

  - number: 16
    stem: 'A force of 500 N is applied to a steel wire of cross-sectional area 0.2 m². The tensile stress is'
    options:
      A: '2.5 × 10⁴ N m⁻²'
      B: '1.0 × 10² N m⁻²'
      C: '1.0 × 10³ N m⁻²'
      D: '2.5 × 10³ N m⁻²'
    answer: D
    printed_key: null
    key_note: 'Stress = F ÷ A = 500 ÷ 0.2 = 2500 = 2.5 × 10³ N m⁻².'
    subtopic: PHY.9.a
    level: 2
    level_reason: one division with the stress formula
    corrected: 'options: "2.5x104Nm-2" and the others written with × and superscript powers'

