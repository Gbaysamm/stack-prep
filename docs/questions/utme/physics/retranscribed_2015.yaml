  - number: 5
    stem: 'The speed of light in air is $3.0 \times 10^{8}\ \text{m s}^{-1}$. Its speed in glass having a refractive index of 1.65 is'
    options:
      A: '$1.82 \times 10^{8}\ \text{m s}^{-1}$'
      B: '$3.00 \times 10^{8}\ \text{m s}^{-1}$'
      C: '$4.95 \times 10^{8}\ \text{m s}^{-1}$'
      D: '$1.65 \times 10^{8}\ \text{m s}^{-1}$'
    answer: A
    printed_key: A
    subtopic: PHY.25.a
    level: 2
    level_reason: one division using n = c/v
    corrected: 'stem printed the speed of light as 3.0 × 10³ m s⁻¹; restored to 3.0 × 10⁸ m s⁻¹, which the options use.'

  - number: 6
    stem: 'Longitudinal waves do not exhibit'
    options:
      A: 'refraction'
      B: 'polarization'
      C: 'diffraction'
      D: 'reflection'
    answer: B
    printed_key: B
    subtopic: PHY.20.c
    level: 1
    level_reason: recall that only transverse waves can be polarised

  - number: 7
    stem: 'A device that converts sound energy into electrical energy is'
    options:
      A: 'the horn of a motor car'
      B: 'the telephone earpiece'
      C: 'a loudspeaker'
      D: 'a microphone'
    answer: D
    printed_key: C
    key_note: 'A microphone turns sound into electrical signals; a loudspeaker does the reverse (electrical to sound).'
    subtopic: PHY.34.a
    level: 1
    level_reason: recall the energy change in a microphone

