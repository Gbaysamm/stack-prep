# UTME 2015 Physics, written up by hand from source/past-questions.pdf, pages 53-61.
# The paper has 40 questions and no paper-type question. Q3 is rebuilt in words: its circuit is
# missing (the page shows an unrelated magnetic-field picture). Repaired: Q1 (option A lost its power,
# 6 x 10^-2), Q5 (10^3 to 10^8), Q8 (options B and C were the same), Q9 (alpha and X-ray symbols),
# Q11 ("conducts" to "converts"), Q13 (stem wording), Q24 ("0.5.V" to 0.5 N), Q28 (fusion to
# fission), Q31 (stem had lost its quantity, A and C were both "decreases"), Q36 (option A 4 V to
# 8 V to fit the cells as drawn), Q37 (50 min to 15 min so an option fits), Q38 (options relettered
# A to D) and small typing fixes. Keys changed: Q7 (D), Q20 (C), Q23 (D), Q24 (B), Q27 (B), Q38 (C).
# Figures redrawn as SVG: Q2, Q4, Q12, Q13, Q26, Q36.
