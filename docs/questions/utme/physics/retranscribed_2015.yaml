  - number: 1
    stem: 'A piece of rubber 10 cm long stretches 6 mm when a load of 100 N is hung from it. What is the strain?'
    options:
      A: '$6 \times 10^{-2}$'
      B: '6'
      C: '60'
      D: '$6.0 \times 10^{-3}$'
    answer: A
    printed_key: A
    subtopic: PHY.9.a
    level: 2
    level_reason: convert to the same unit, then one division
    corrected: 'option A printed as "6 X 10-3", the same value as D; restored to 6 × 10⁻², which 6 mm ÷ 10 cm gives. Units spaced (10 cm, 6 mm, 100 N).'

