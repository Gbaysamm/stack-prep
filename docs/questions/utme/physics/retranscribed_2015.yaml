  - number: 3
    stem: 'Two 20 Ω resistors are connected in parallel, and the pair is connected in series with a 15 Ω resistor. What is the total resistance?'
    options:
      A: '5 Ω'
      B: '25 Ω'
      C: '15 Ω'
      D: '35 Ω'
    answer: B
    printed_key: B
    subtopic: PHY.31.a
    level: 3
    level_reason: combine the parallel pair, then add the series resistor
    corrected: 'rebuilt in words: the circuit was missing (the page shows an unrelated magnetic-field picture). New stem gives a 15 ohm resistor in series with two 20 ohm resistors in parallel, so the printed options and key B (25 ohms) fit; "ohms" written as Ω.'

