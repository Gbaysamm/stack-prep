  - number: 1
    stem: 'What is the least possible error encountered when taking a measurement with a metre rule?'
    options:
      A: '0.5 mm'
      B: '1.0 mm'
      C: '0.2 mm'
      D: '0.1 mm'
    answer: A
    printed_key: B
    key_note: 'the reading error of a scale is half its smallest division; a metre rule reads to 1 mm, so the error is 0.5 mm'
    subtopic: PHY.1.f
    level: 2
    level_reason: apply the half-a-division rule to the metre rule
    corrected: 'stem: "taking measurement with a meter rule" written as "taking a measurement with a metre rule"'

