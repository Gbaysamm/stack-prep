      B: '$4.5 \times 10^{-11}$ s'
      C: '$3.0 \times 10^{-11}$ s'
      D: '$4.5 \times 10^{-10}$ s'
    answer: B
    printed_key: C
    key_note: 'v = c/n = 2.0 × 10⁸ m s⁻¹, t = 0.009 / 2.0 × 10⁸ = 4.5 × 10⁻¹¹ s; 3.0 × 10⁻¹¹ s ignores the refractive index'
    subtopic: PHY.25.a
    level: 4
    level_reason: speed of light in glass from n, a cm-to-m conversion, then time

