# UTME 2016 Physics, written up by hand from source/past-questions.pdf, pages 62-70.
# This paper prints no paper-type question; all 40 questions are kept. Answers were worked out
# afresh: ten printed keys did not hold up (Q1 reading error, Q10 moments, Q11 glass plate, Q19
# pressure with height, Q24 vector triangle, Q25 parallel currents, Q27 e.m.f. of a cell, Q31
# induction coil, Q32 three half-lives, Q38 real image). Repairs: Q13's options had lost their
# powers of ten (10^14, not 10^-53); Q20's stem had lost its data and Q36's its force; Q19 needed
# the ground-level pressure; Q29's masses had lost their case; Q30 printed 100 A twice; Q2, Q5,
# Q18, Q33 and Q34 each had a second defensible option, so one option was replaced; Q3, Q4 and
# Q13 were given the constants they need; small typing fixes elsewhere. The six diagrams (Q2, Q8,
# Q10, Q16, Q21, Q24) are redrawn as SVG.
