questions:
  - number: 1
    stem: 'The focal length of a concave mirror is 2.0 cm. If an object is placed 8.0 cm from it, the image is at'
    options:
      A: '2.7 cm'
      B: '2.3 cm'
      C: '2.5 cm'
      D: '2.0 cm'
    answer: A
    printed_key: A
    subtopic: PHY.24.a
    level: 3
    level_reason: one mirror-formula calculation
    corrected: 'options: printed in metres ("2.7m"); the object and focal length are in cm, so the units are cm'

  - number: 2
    stem: 'PHCN measures electrical energy in'
    options:
      A: 'Wh'
      B: 'kWh'
      C: 'J'
      D: 'W'
    answer: B
    printed_key: B
    subtopic: PHY.32.a
    level: 1
    level_reason: recall the commercial unit of electrical energy
    corrected: 'stem: "measures is" became "measures"; option B "Kwh" written as kWh'

  - number: 3
    stem: 'The resultant of two forces is 50 N. The forces are perpendicular to each other and one of them makes an angle of 30° with the resultant. Find the magnitude of that force.'
    options:
      A: '100.0 N'
      B: '57.7 N'
      C: '25.0 N'
      D: '43.3 N'
    answer: D
    printed_key: D
    subtopic: PHY.2.a
    level: 3
    level_reason: resolve the resultant along one of two perpendicular components
    corrected: 'stem: "If the forces are ... Find its magnitude" reworded so "its" clearly means the force at 30°'

  - number: 4
    stem: 'A piece of radioactive material contains 1000 atoms. If its half-life is 20 seconds, the time taken for 125 atoms to remain is'
    options:
      A: '20 seconds'
      B: '40 seconds'
      C: '60 seconds'
      D: '80 seconds'
    answer: C
    printed_key: D
    key_note: '1000 to 500 to 250 to 125 is three half-lives, 3 × 20 s = 60 s; 80 s would leave 62.5 atoms'
    subtopic: PHY.38.a
    level: 3
    level_reason: count half-lives, then multiply

