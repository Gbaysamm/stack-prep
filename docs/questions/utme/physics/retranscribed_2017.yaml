# UTME 2017 Physics, written up by hand from source/past-questions.pdf, pages 71-79.
# The paper has no paper-type question, so all 40 questions are kept and nothing is dropped.
# Answers were worked out afresh and ten printed keys did not hold up: Q4 (three half-lives is
# 60 s), Q6 (the output characteristic levels off), Q10 (F d cos 60° = 3 J), Q13 (X ends the
# curve, so it is the breaking point), Q17 (a transistor is a switch and an amplifier), Q24 (only
# statement I is true), Q25 (a real image three times the size needs u = 24 cm), Q36 (300:30
# steps 100 V down to 10 V), Q37 (activity does not depend on temperature) and Q38
# (2.25 × 10⁸ m s⁻¹). Repairs: Q1's options in m became cm;
# Q11's powers of ten became 10⁻⁸ and G was added; Q38's option C unit became m s⁻¹; Q22's option
# C became ML⁻¹T⁻²; Q20's "W" became Ω; Q6's stem now names the output characteristic; Q23's
# options C and D lost their powers and are written as plain numbers; small typing fixes in Q2,
# Q3, Q7, Q9, Q10, Q12, Q18, Q23, Q24, Q32, Q34 and Q35. Figures are redrawn as SVG: Q13, Q16,
# Q21 and Q26 as figure_svg, and the picture options of Q6, Q16 and Q30 as option_figures.
format_version: 1
