# UTME 2018 Physics, written up by hand from source/past-questions.pdf, pages 80-88.
# This paper prints no paper-type question, so all 40 questions are kept and none is dropped.
# Answers were worked out afresh. Four printed keys did not hold up: Q10 (six pulleys give a
# velocity ratio of 6, so W = 50 N), Q16 (all three statements about isotopes are true), Q17
# (the coefficient is m2/m1, a pure number) and Q35 (instruments on the same note differ in
# quality, not pitch). Q32's key did not match the npn symbol; it was redrawn with the arrow on
# the emitter pointing out (C). Repairs: Q3 option C, Q29 option D and Q37 option D were rewritten
# so that the intended answer is true; Q19's heights became 10 cm and 3 cm of mercury; Q17's
# "hanging mass m" became m2; Q36's stem now says the strokes run from U outwards; lost units,
# powers and Greek letters restored throughout. Seven diagrams are redrawn as figure_svg and
# Q32's four transistor symbols as option_figures.
