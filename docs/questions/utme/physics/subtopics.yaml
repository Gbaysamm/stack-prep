# UTME Physics — the topics and subtopics every question is tagged with.
#
# Read from source/syllabus.pdf. A topic is one of the syllabus's 40 numbered topics; a
# subtopic is one of its lettered contents, (a), (b), ... in the syllabus's own lettering.
# A topic the syllabus does not letter has one subtopic, `a`.
# Codes: PHY.<topic> and PHY.<topic>.<letter>. database/load_retranscribed_physics.py builds
# the curriculum from this file, and every retranscribed_YYYY.yaml uses exactly these codes.
format_version: 1
topics:
  PHY.1:
    name: Measurements and Units
    subtopics:
      PHY.1.a: Fundamental units and length, area, volume and mass
      PHY.1.b: Measuring instruments
      PHY.1.c: Fundamental physical quantities
      PHY.1.d: Derived physical quantities and their units
      PHY.1.e: Dimensions
      PHY.1.f: Limitations of experimental measurements
  PHY.2:
    name: Scalars and Vectors
    subtopics:
      PHY.2.a: Scalars, vectors, resultants and resolution of vectors
  PHY.3:
    name: Motion
    subtopics:
      PHY.3.a: Newton's laws of motion
      PHY.3.b: Types of motion
      PHY.3.c: Relative motion
      PHY.3.d: Causes of motion
      PHY.3.e: Types of force
      PHY.3.f: Linear motion and the equations of motion
      PHY.3.g: Projectiles
      PHY.3.h: Motion in a circle
      PHY.3.i: Simple harmonic motion
  PHY.4:
    name: Gravitational Field
    subtopics:
      PHY.4.a: Newton's law of universal gravitation, g and escape velocity
  PHY.5:
    name: Equilibrium of Forces
    subtopics:
      PHY.5.a: Equilibrium of particles
      PHY.5.b: Equilibrium of rigid bodies, moments and centre of gravity
  PHY.6:
    name: Friction
    subtopics:
      PHY.6.a: Static and dynamic friction, viscosity and Stokes' law
  PHY.7:
    name: Work, Energy and Power
    subtopics:
      PHY.7.a: Work, energy, power and conservation of energy
      PHY.7.b: Energy and society
      PHY.7.c: Dams and energy production
  PHY.8:
    name: Simple Machines
    subtopics:
      PHY.8.a: Mechanical advantage, velocity ratio and efficiency
  PHY.9:
    name: Elasticity
    subtopics:
      PHY.9.a: Hooke's law, Young's modulus and work done in stretching
  PHY.10:
    name: Pressure
    subtopics:
      PHY.10.a: Atmospheric pressure and barometers
      PHY.10.b: Pressure in liquids
  PHY.11:
    name: Liquids at Rest
    subtopics:
      PHY.11.a: Density, relative density, upthrust, Archimedes and flotation
  PHY.12:
    name: Temperature and Its Measurement
    subtopics:
      PHY.12.a: Temperature, thermometers and temperature scales
  PHY.13:
    name: Quantity of Heat
    subtopics:
      PHY.13.a: Heat capacity and specific heat capacity
  PHY.14:
    name: Change of State
    subtopics:
      PHY.14.a: Latent heat, melting, boiling and evaporation
  PHY.15:
    name: Thermal Expansion
    subtopics:
      PHY.15.a: Expansion of solids
      PHY.15.b: Expansion of liquids
  PHY.16:
    name: Gas Laws
    subtopics:
      PHY.16.a: Boyle's, Charles's and the pressure law, the general gas equation
  PHY.17:
    name: Vapours
    subtopics:
      PHY.17.a: Saturated vapour pressure, boiling and humidity
  PHY.18:
    name: Structure of Matter and Kinetic Theory
    subtopics:
      PHY.18.a: Molecular nature of matter
      PHY.18.b: Kinetic theory
  PHY.19:
    name: Heat Transfer
    subtopics:
      PHY.19.a: Conduction, convection and radiation
  PHY.20:
    name: Waves
    subtopics:
      PHY.20.a: Production and propagation of waves
      PHY.20.b: Classification of waves
      PHY.20.c: Characteristics and properties of waves
  PHY.21:
    name: Propagation of Sound Waves
    subtopics:
      PHY.21.a: Sound in a medium, speed of sound and echoes
  PHY.22:
    name: Characteristics of Sound Waves
    subtopics:
      PHY.22.a: Pitch, loudness, quality, resonance and vibrations in pipes and strings
  PHY.23:
    name: Light Energy
    subtopics:
      PHY.23.a: Sources of light
      PHY.23.b: Propagation of light, shadows and eclipses
  PHY.24:
    name: Reflection of Light at Plane and Curved Surfaces
    subtopics:
      PHY.24.a: Plane and curved mirrors
  PHY.25:
    name: Refraction of Light Through Plane and Curved Surfaces
    subtopics:
      PHY.25.a: Refraction, refractive index and total internal reflection
      PHY.25.b: Glass prism and lenses
  PHY.26:
    name: Optical Instruments
    subtopics:
      PHY.26.a: Microscopes, telescopes, cameras, projectors and the eye
  PHY.27:
    name: Dispersion of Light and the Electromagnetic Spectrum
    subtopics:
      PHY.27.a: Dispersion of light and colours
      PHY.27.b: Electromagnetic spectrum
  PHY.28:
    name: Electrostatics
    subtopics:
      PHY.28.a: Charges, Coulomb's law, electric field and potential
  PHY.29:
    name: Capacitors
    subtopics:
      PHY.29.a: Capacitance, capacitors in series and parallel, energy stored
  PHY.30:
    name: Electric Cells
    subtopics:
      PHY.30.a: Primary and secondary cells, defects and arrangements
  PHY.31:
    name: Current Electricity
    subtopics:
      PHY.31.a: E.m.f., p.d., Ohm's law, resistance, resistivity and bridges
  PHY.32:
    name: Electrical Energy and Power
    subtopics:
      PHY.32.a: Electrical energy, power, heating effect and fuses
  PHY.33:
    name: Magnets and Magnetic Fields
    subtopics:
      PHY.33.a: Magnets, magnetic fields and the earth's field
  PHY.34:
    name: Force on a Current-Carrying Conductor in a Magnetic Field
    subtopics:
      PHY.34.a: Force on a conductor and a moving charge, motors and meters
  PHY.35:
    name: Electromagnetic Induction
    subtopics:
      PHY.35.a: Faraday's and Lenz's laws, generators and transformers
      PHY.35.b: Inductance
      PHY.35.c: Eddy currents
  PHY.36:
    name: Simple A.C. Circuits
    subtopics:
      PHY.36.a: Peak and r.m.s. values, reactance, impedance and resonance
  PHY.37:
    name: Conduction of Electricity Through Liquids and Gases
    subtopics:
      PHY.37.a: Conduction through liquids, electrolysis
      PHY.37.b: Conduction through gases
  PHY.38:
    name: Elementary Modern Physics
    subtopics:
      PHY.38.a: Models of the atom, radioactivity, photoelectric effect and nuclear energy
  PHY.39:
    name: Introductory Electronics
    subtopics:
      PHY.39.a: Semiconductors, diodes and transistors
  PHY.40:
    name: Introduction to Fibre Optics and Lasers
    subtopics:
      PHY.40.a: Fibre optics
      PHY.40.b: Lasers
